    ]
  - [
      'Freyfell',
      'Largest southern port; Arena; Blacksmith; General Store equipment availability +1 and price -10%; Inn 25 c per party per night; Kennel; Freyfell bloodhound availability 5; Sick Ward.',
    ]
  - [
      'Coalfell',
      'Small village relying on hunting and farming; Blacksmith weapons and armour availability +1, price -10%; General Store equipment availability -2, price +20%; Inn 35 c per party per night; Temple of Ohlnir.',
    ]
  - [
      'Irondale',
      'Farms and main regional wood supplier; Blacksmith; General Store; Inn 15 c per party per night; Temples of Rhidnir, Iphy and Metheia.',
