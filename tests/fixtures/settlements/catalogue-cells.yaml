# Source-derived expectations; PDF 145, 153 and 161. Whitespace is normalised.
# These are extraction regressions, not independent review.
table.settlement.fortune_teller:
  - [
      '1',
      'The Fortune Teller describes an upcoming battle in such detail that during the next quest, the hero recognises the situation and manages to avoid being harmed. The hero may treat one successful attack by an enemy during the next quest as a miss.',
    ]
  - [
      '2',
      'The Fortune Teller talks about great fortune being made through gambling. The hero gets -2 at a gambling dice roll during this stay in the city.',
    ]
  - ['3-5', 'The old lady talks about lots of things, but nothing that is of any importance.']
  - [
      '6',
      'You are cursed! The lady staggers back in shock after reading the hero’s hand. The hero will suffer a curse during the next quest (roll on Curses Table to see what curse).',
    ]
table.guild.wizard_staves:
  - [
      'Arcane Staff',
      'This staff will lend some of its power to the wizard. It will give a +5 modifier to the Arcane Arts Skill. When leaving a dungeon, roll 1d10. On a result of 9-10, the magic has dissipated and must be recharged. Until recharged, it is considered a normal staff.',
      '4',
      '400 c',
    ]
  - ['Fire Staff', 'This staff contains the Magic Flare spell.', '3', '400 c']
  - [
      'Major Mana Staff',
      'This staff may be used to store Mana between quests. Storing Mana does not take any time and can be done in a settlement while resting at the inn. This stores 30 points of Mana.',
      '2',
      '800 c',
    ]
  - [
      'Mana Staff',
      'This staff may be used to store Mana between quests. Storing Mana does not take any time and can be done in a settlement while resting at the inn. This stores 20 points of Mana.',
      '3',
      '500 c',
    ]
