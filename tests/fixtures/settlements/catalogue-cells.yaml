  - [
      'Durburim',
      'Dwarven city; Blacksmith weapon availability +1 and price +20%; weapons bought here are Dwarven-made and gain +2 Durability cumulative; armour availability ±0 and price +10%; General Store equipment availability -1, price +20%; Inn 65 c per party per night; all Temples.',
    ]
  - [
      'Birnheim',
      'Blacksmith weapon availability -1 and price +20%; armour availability +1 and price +20%; armour bought here is Dwarven-made and gains +2 Durability cumulative; General Store equipment availability -2 and price +20%; Inn 65 c per party per night; all Temples.',
