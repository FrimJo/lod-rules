      '4',
      '300 c',
    ]
  - ['Staff of Slow', 'This staff contains the magic spell: Slow.', '3', '400 c']
  - ['Staff of the Bolt', 'This staff contains the spell: Magic Bolt.', '3', '500 c']
  - [
      'Staff of the Heart',
      'This staff strengthens the body of the wizard, giving +3 HP while the staff is carried. Between each quest, roll 1d10. On a result of 10, the magic has dissipated and must be recharged. Until recharged, it is considered a normal staff.',
