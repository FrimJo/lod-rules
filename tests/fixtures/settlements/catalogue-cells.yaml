    ]
  - [
      'Rochdale',
      'Rochdale is a small farming village and unofficial alchemy centre. General Store; Herbalist; Inn 20 c per party per night; Sick Ward; The Magic Brewery.',
    ]
  - [
      'Windfair',
      'Windfair lies by the Silver Mines and Durburim. Since the mines closed, residents rely on fishing and trade with Dwarfs. Blacksmith; General Store fishing gear 50 c (availability 6), equipment availability -1 and price +10%; Inn 35 c per party per night; Scryer; Temples of Ohlnir and Charus.',
