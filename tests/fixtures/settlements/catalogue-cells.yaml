  - [
      'Silver City',
      'Silver City is the capital of the South, third-largest city in the kingdom, bustling with activities, travellers and opportunities. It offers Arena, Asylum, Banks, Blacksmith, Fortune Teller, General Store, Guilds, Horse Racing Track, Inn (25 c per party per night), Inner Sanctum and all Temples. The fictional history on PDF 138 is setting text.',
