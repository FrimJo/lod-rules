# Labelled rules questions for `npm run ask:evaluate`.
#
# Each label is drafted from the canonical corpus records it names, not from what any
# analyzer retrieves. `required_evidence` lists the records a correct answer must be able
# to cite. `expected.entity` is the one named entity record the question is about, or null.
# Pick floors and wording on `development`, check on `validation`, and read `held_out` only
# to report a finished configuration.
schema_version: 1
label_review: unreviewed
cases:
  # --- development ---------------------------------------------------------------------
  - id: askq.poison_bleeding_rest
    split: development
    question: My hero is poisoned and bleeding out during a rest. What happens?
    expected: { intent: situation_ruling, complexity: multi_rule, entity: null }
    required_evidence:
      - procedure.bleeding_out
      - procedure.rest_bleeding_check
      - procedure.rest_poison_checks
    notes: >-
      Laya called this single_fact and chose the alchemy item Poison; on its own that would
      have dropped both rest checks.

  - id: askq.molgor_hit_points
    split: development
    question: How many hit points does Molgor have?
    expected:
      {
        intent: value_lookup,
        complexity: single_fact,
        entity: quest_actor.chamber_of_reverence.molgor,
      }
    required_evidence: [table.quest.slaying_fiend.molgor]

