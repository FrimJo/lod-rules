- id: test.backgrounds.creation_example.specialisation
  name: Character Creation Example — 15 bonus points on DEX and RES
  section_id: section.backgrounds.character_creation_example
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 49
      printed_page: 47
      section: Backgrounds
      heading: Character Creation Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'I feel like making a Warrior Priest out of this dwarf, so, when adding my 15 bonus
    points, I should consider what stats are important for that roll. ... His DEX is definitely on
    the low side. Seeing that, I want him to double as a fighter, adding +10 here feels like a good
    move. I then add +5 to RES to improve his Battle Prayers skill. We then have the following:'
  issues:
    - issue.backgrounds.creation_example_values
  kind: source_example
  procedure_id: procedure.character_creation_specialisation
  inputs:
    creation_open: true
    specialisation_applied: false
    str: 47
    con: 33
    dex: 32
    wis: 32
    res: 39
    str_points: 0
    con_points: 0
    dex_points: 10
    wis_points: 0
    res_points: 5
  expected:
    state:
      specialisation_applied: true
      dex: 42
      res: 44
    events:
      - type: require
        satisfied: true
    trace:
      - procedure.character_creation_specialisation
    unresolved: []
    steps:
      - check_allocation
      - allocate
