- id: test.backgrounds.creation_example.morning_star_wear
  name: Character Creation Example — starting wear roll of 3 on the Morning Star
  section_id: section.backgrounds.character_creation_example
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 50
      printed_page: 48
      section: Backgrounds
      heading: Character Creation Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Since this is his starting equipment, I must roll 1d4 to determine what shape it is
    in. This results in a 3. That means its Durability is already down 3 points and it can take a
    further 3 Points of Damage before it breaks. I mark this with 3 ‘X’ under condition.
  kind: source_example
  procedure_id: procedure.character_creation_equipment_wear
  inputs:
    before_game: true
    damageable: true
    wear_applied: false
    maximum_durability: 6
    wear_roll: 3
    damage: 0
    durability_remaining: 6
  expected:
    state:
      wear_applied: true
      damage: 3
      durability_remaining: 3
    events: []
    trace:
      - procedure.character_creation_equipment_wear
    unresolved: []
    steps:
      - apply_wear
