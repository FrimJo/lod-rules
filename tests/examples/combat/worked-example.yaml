    events: []
    trace:
      - procedure.humanoid_close_combat_behaviour
      - combat.enemy_behaviour.humanoid_close_combat.attack
    unresolved: []
    steps:
      - option_2
      - power_attack
- id: test.combat.gnoll_power_attack_dodged
  name: printed Combat Example, the Gnoll Power Attack hits with 37 against CS 40 +20 and Variya dodges
  section_id: section.combat.combat_example
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 124
      printed_page: 122
      heading: Combat Example
      locator:
        paragraph: Round 1, second paragraph
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 123
      printed_page: 121
      heading: Enemy Attack
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: With its CS of 40, and the Power Bonus of +20, it easily lands a hit with a result of
    37. As Variya did not take a Parry Stance, she cannot parry, but she may dodge. She rolls 27,
    which is below her Dodge Skill Level and she avoids the axe.
  kind: source_example
  procedure_id: procedure.enemy_attack
  unresolved_references:
    - Variya’s Dodge Skill Level is not printed; the successful dodge the example states is supplied
      as defence_succeeded.
  inputs:
    attack_type: power
    cs: 40
    attack_roll: 37
    parry_stance: false
    defence: dodge
    defence_succeeded: true
  expected:
    state:
      target: hero
      attack_threshold: 60
      outcome: dodged_attack
    events:
      - type: invoke
        dependency: procedure.hero_defence
    trace:
      - procedure.enemy_attack
      - combat.enemy.attack_threshold.power
    unresolved: []
    steps:
      - check_behaviour_card
      - power_test
      - target_defends
      - not_in_parry_stance
      - dodged
