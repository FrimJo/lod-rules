- id: test.combat.variya_charge
  name:
    'printed Combat Example, Variya charges: CS 45 +10 charge -10 Gnoll defence +5 Great Weapon =
    50, two AP'
  section_id: section.combat.combat_example
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 124
      printed_page: 122
      heading: Combat Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        paragraph: Round 1
  status: extracted
  confidence: high
  source_text: Round 1. Variya the Barbarian is facing two ferocious Gnolls. It is her turn to act
    and, since she has 2 squares between her and the Gnolls, she does what every self-respecting
    Berserker would do, and charges them. She decides to target the one on the left with the
    two-handed axe. She spends 2 Action Points to move up to the Gnoll and strike with her own Great
    Axe. With a CS of 45, she ends up with having to roll below 50. (+10 for charging, -10 for the
    Gnoll’s defence, +5 CS since the Gnoll has a Great Weapon.
  kind: source_example
  procedure_id: procedure.combat_preparation
  inputs:
    mode: melee
    action: charge
    adjacent: true
    doorway_opposite: false
    reach_valid: false
    in_los: true
    outdoors: false
    enemy_adjacent: false
    ranged_exception: false
    loaded: true
    ammunition_available: true
    straight_model_block: false
    large_or_flying: false
    target_large: false
    from_behind: false
    target_prone: false
    height_advantage: false
    target_shield: false
    target_parry: false
    enemy_power_restriction_resolved: true
    enemy_to_hit_suppressed: false
    shield_suppressed: false
    aim_valid: false
    charge_path_valid: true
    target_aiming: false
    distance: 3
    skill: 45
    enemy_to_hit: 10
    melee_weapon_modifier: 5
    half_height_obstacles: 0
    other_modifier: 0
  expected:
    state:
      threshold: 50
      action_points_spent: 2
      attack_eligible: true
      action_modifier: 10
      aim_modifier: 0
      height_modifier: 0
      obstacle_modifier: 0
      parry_modifier: 0
      position_modifier: 0
      shield_modifier: 0
      to_hit_modifier: -10
    events: []
    unresolved: []
    trace:
      - procedure.combat_preparation
    steps:
      - requirements
      - eligible
      - charge
      - evasion
      - threshold_melee
