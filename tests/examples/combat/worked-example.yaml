  status: extracted
  confidence: high
  source_text:
    Now it is time for the Gnolls to act. The one Variya struck rolls a 6 on its Behaviour
    Roll which means it will make a Power Attack. (It has no Special Talents so that roll is
    skipped).
  kind: source_example
