- id: test.combat.shove_caption_wizard_diagonal
  name: 'Shoving caption: object behind the Gnoll moves it diagonally back'
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Shove
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Shoving. In the lower example, the Wizard shoves the Gnoll. Since there is an object
    behind the Gnoll, it is instead moved diagonally back to a free square. Had there been two
    possible diagonal squares, the Wizard would decide which one the Gnoll would end up in.
  kind: source_example
  rule_ids:
    - combat.action.shove.displacement
  inputs:
    shove_succeeded: true
    straight_back_free: false
    model_behind_can_move_straight_back: false
    diagonal_back_free: true
    displacement_case: diagonal
  expected:
    state:
      second_model_moved: false
      target_falls_over: false
      target_destination: diagonal_back
      shover_may_enter_vacated: true
    events: []
    trace:
      - combat.action.shove.displacement
    unresolved: []
    steps: []
- id: test.combat.shove_caption_fighter_pushes_back_gnoll
  name: 'Shoving caption: the Gnoll at the back moves straight back'
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Shove
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The fighter in the top example also tries to push a Gnoll. The table is once again in
    the way. In this case any movement diagonally is also blocked (by the table and another Gnoll).
    However, the Gnoll at the back would move one square straight back so as to avoid his stumbling
    companion and, therefore, create space for the pushed Gnoll. If the Gnoll at the back could not
    be moved, or if was some other obstacle instead of a Gnoll, the shoved Gnoll would fall over.
  kind: source_example
  rule_ids:
    - combat.action.shove.displacement
  inputs:
    shove_succeeded: true
    straight_back_free: false
    model_behind_can_move_straight_back: true
    diagonal_back_free: false
    displacement_case: push_model_behind
  expected:
    state:
      second_model_moved: true
      target_falls_over: false
      target_destination: straight_back
      shover_may_enter_vacated: true
    events: []
    trace:
      - combat.action.shove.displacement
    unresolved: []
    steps: []
