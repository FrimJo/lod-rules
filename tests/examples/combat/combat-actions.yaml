- id: test.combat.shooting_example_a_cannot_fire
  name: 'Shooting example: A cannot fire through D on a straight line'
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Obstacles and LOS When Shooting
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Example: Characters A, B and C are all armed with ranged weapons and try to fire at E.
    Character A cannot fire because there is a character (D) standing in the straight line between A
    and E. It would be the same if this line was diagonal. Characters B and C can both fire. B
    suffers a -10 modifier to RS as the shot passes a square with a model. C gets a -20 modifier as
    the shot touches both the square of D and F. If any of shooter’s roll >=90, the shot will
    instead hit a model that affected the LOS. In the case of B, it would hit D, but shooter C would
    have to randomize between F and D.'
  kind: source_example
  rule_ids:
    - combat.principles.shooting_straight_line
  inputs:
    model_on_straight_line: true
  expected:
    state: {}
    events:
      - type: require
        satisfied: false
    trace:
      - combat.principles.shooting_straight_line
    unresolved: []
    steps: []
