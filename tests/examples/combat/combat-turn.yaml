- id: test.combat.turn_hero_token
  name: 'Combat Turn: hero token with an unacted hero'
  section_id: section.combat.combat_turn
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 114
      printed_page: 112
      heading: Combat Turn
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Derived branch of procedure.combat_turn: hero token, a Hero/Mercenary has not acted.'
  kind: derived_case
  procedure_id: procedure.combat_turn
  inputs:
    token_kind: hero
    hero_or_mercenary_unacted: true
    enemy_unacted: true
    last_token_in_bag: false
    all_heroes_dead: false
    all_enemies_dead: false
  expected:
    state:
      activated_side: hero
      remove_status_tokens: true
      wandering_monsters_moved: false
      initiative_bag_refilled: false
      scenario_die_rolled: false
      sequence_ended: false
      unacted_heroes_may_act: false
      pull_next_token: true
    events:
      - type: invoke
        dependency: procedure.activation
    trace:
      - procedure.combat_turn
    unresolved: []
    steps:
      - reset
      - hero_token
      - loop
