- id: test.combat.shield_parry_example.berthram
  name: printed Parry with a Shield example, Berthram parries 8 damage with a DEF 6 shield
  section_id: section.combat.detailed_acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 120
      printed_page: 118
      section: Detailed acting with enemies
      heading: Parry with a Shield
      locator:
        paragraph: Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    "Example: Berthram manages to parry an incoming strike causing 8 Points of Damage. His
    shield's DEF is 6, reducing Damage to 2. Since the shield fails to negate all damage, it will
    incur 1 Point of Damage. The remaining 2 Points of Damage are transferred to Berthram’s arm.
    However, as he is using a padded jacket, the armour absorbs the rest of the damage. Had the
    damage been higher than the DEF value of the armour, it would take 1 Point of Damage, and break
    if it reached 6 points."
  kind: source_example
  rule_ids:
    - combat.defence.shield_parry.spillover
    - combat.defence.shield_parry.absorbed
  unresolved_references:
    - The padded jacket absorbing the 2 points needs its DEF from the armour table; the example does
      not print it, so the arm step is not asserted.
  inputs:
    shield_parry_succeeded: true
    incoming_damage: 8
    shield_def: 6
  expected:
    state:
      remaining_damage: 2
      shield_damage: 1
      spill_location: arm
    events: []
    trace:
      - combat.defence.shield_parry.spillover
    unresolved: []
    steps: []
