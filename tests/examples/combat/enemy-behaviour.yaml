- id: test.combat.humanoid_behaviour.make_room
  name: printed explanation for option 1, an adjacent enemy makes room before attacking
  section_id: section.combat.detailed_acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 119
      printed_page: 117
      section: Detailed acting with enemies
      heading: Humanoid with Close-Combat Weapon
      locator:
        paragraph: option 1, italic explanation
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Here, the enemy is adjacent to a hero. It will spend its first action trying to make
    room for more enemies, either by moving or shoving. It will, however, only try to shove once.
    The next action must be an attack (see number 2 below), whether the shove succeeded or not.
  kind: source_example
  procedure_id: procedure.humanoid_close_combat_behaviour
  inputs:
    adjacent: true
    can_make_room: true
    room_attempted_this_turn: false
  expected:
    state:
      action: make_room_or_shove
      next_action: attack
    events: []
    trace:
      - procedure.humanoid_close_combat_behaviour
      - combat.enemy_behaviour.humanoid_close_combat.make_room
    unresolved: []
    steps:
      - option_1
