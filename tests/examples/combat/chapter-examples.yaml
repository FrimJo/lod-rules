- id: test.combat.quick_slot_example.roll_1
  name: 'Quick Slot example: a roll of 1 damages the item in slot 1'
  section_id: section.combat.quick_slots_and_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      heading: Quick Slots and Damage
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Roll 1d10 to determine if any of the Quick Slots have been struck. For example, a roll of 1 will
    damage the item in slot 1, a roll of 2 will damage the item in slot 2. A roll higher than the
    number of slots available will have no effect. Any item in that slot will lose 1 Point of
    Durability.
  kind: source_example
  unresolved_references:
    - The example prints no slot count or durability. The hero is taken to have 3 Quick Slots with an
      ordinary (not magic) item in the struck slot at durability 6.
  rule_ids:
    - character.durability.quick_slot_hit
  inputs:
    torso_hit: true
    roll: 1
    slot_count: 3
    slot_has_item: true
    durability_applicable: true
    magic_other_item: false
    durability: 6
  expected:
    state:
      durability: 5
    events: []
    trace:
      - character.durability.quick_slot_hit
    unresolved: []
    steps: []
