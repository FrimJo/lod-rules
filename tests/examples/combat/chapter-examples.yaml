- id: test.combat.charge_example.square_b
  name: 'Charge example: A may charge into a square marked B'
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Charge Attack
      locator:
        region: charge diagram with squares A, B and C
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Example: A character in Square A could charge into all squares marked B, or any square further
    down following the same line if its movement would allow. It cannot charge into any square
    marked C as it would not be in a straight or diagonal line.'
  kind: source_example
  unresolved_references:
    - The example prints no distances. The charge is taken as passing at least 1 empty square, within
      the charger’s M, past no obstacle, and ending in front of an enemy.
  rule_ids:
    - combat.action.charge.requirements
  inputs:
    empty_squares_between: 1
    straight_or_strict_diagonal: true
    passes_obstacle_over_half: false
    path_length: 2
    movement: 4
    ends_in_front_of_enemy: true
  expected:
    state:
      charge_allowed: true
    events:
      - type: require
        satisfied: true
    trace:
      - combat.action.charge.requirements
    unresolved: []
    steps: []
