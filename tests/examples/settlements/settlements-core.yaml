- id: test.settlement.taking_on_quests.irondale_example
  name: 'printed Taking on Quests example: Irondale rolls 1d6, result 1, read in turquoise'
  section_id: section.settlements.taking_on_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Taking on Quests
      locator:
        paragraph: Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Example: The party is in Irondale and has decided to take on the quest: ‘Rescuing the
    Prisoners’. This campaign requires that the Quest Site should be randomised from the map.
    Looking at the previous table we can tell that we should roll 1d6 and cross-reference with the
    map. The result is 1, and since Irondale is turquoise, we read those numbers on the map, noting
    with pleasure that the Quest Site is a mere two-day trek from the village.'
  kind: source_example
  rule_ids:
    - character.settlement.quest_site_selector
  inputs:
    settlement: Irondale
    quest_site_roll: 1
  expected:
    state:
      quest_site_die: 1d6
      quest_site_colour: Turqois
      quest_site_number: 1
    events: []
    trace:
      - character.settlement.quest_site_selector
    unresolved: []
    steps: []
