- id: test.settlement.activities.wizard_learns_spell_example
  name: 'printed Activities in a Settlement example: the Wizard learns a spell D1–D3, the party leaves D4'
  section_id: section.settlements.activities_in_a_settlement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Activities in a Settlement
      locator:
        paragraph: Example
        table: Uncaptioned table (Day/Night, Thief, Warrior, Priest, Wizard)
        column: Wizard
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Example: This party has just arrived at the settlement (Silver City in this case)
    after a challenging quest. They are weary and in need of rest and replenishment. The table below
    will show you how the heroes decide to spend their time. ... D1 ... Collects Quest reward.
    Visits Wizards’ Guild to learn a new spell. ... D2 ... Goes to Wizards’ Guild to continue
    learning the spell. ... D3 ... Goes to Wizards’ Guild to continue learning the spell. ... N3
    ... Inn. ... D4 Leaves on a Quest'
  kind: source_example
  rule_ids:
    - character.settlement.long_activity_stay
  inputs:
    activity: learn_a_spell
    start_day: 1
  expected:
    state:
      activity_point_cost: 3
      occupied_until_day: 3
      party_stays_at_inn_until_night: 3
      earliest_departure_day: 4
    events: []
    trace:
      - character.settlement.long_activity_stay
    unresolved: []
    steps: []
