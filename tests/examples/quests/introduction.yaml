- id: test.quest_book.threat_increase
  name: Quest Threat 12 — increase
  section_id: section.quest_book_i.introduction.reading_the_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Ex: Quest 1 dictates a Wandering Monster appears when the Threat Level reaches 12. The
    Wandering Monster is placed, and later the Threat Level is increased more and then reduced back
    to 12 again. This time no monster is placed since the Threat Level was decreased to 12. If the
    Threat Level decreases below 12 and then increases again back up to 12, a Wandering Monster will
    appear.'
  kind: source_example
  rule_ids:
    - core.quest_book.threat_threshold_monster
    - core.quest_book.threat_threshold_monster_otherwise
  inputs:
    previous_threat: 11
    current_threat: 12
    quest_threshold: 12
  expected:
    state:
      wandering_monster_triggered: true
      threat_reduction_on_placement: 0
    events: []
    trace:
      - core.quest_book.threat_threshold_monster
    unresolved: []
    steps: []
