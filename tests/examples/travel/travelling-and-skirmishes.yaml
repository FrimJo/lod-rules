        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Derived case for "A Desert Hex costs 2 Movement Points, unless all heroes have camels. Then it
    is 1,5 points per hex." read separately from "A walking party, or a party with a wagon or mule
    has 3 Movement Points. A party where all members are riding horses or camels has 6 Movement
    Points.": every hero has a camel but another party member walks; inputs are test values.'
  kind: derived_case
  procedure_id: procedure.travel_daily_movement
  inputs:
    day: 0
    movement_day: -1
    event_day: 0
    route_legal: true
    movement_points: 0
    hex_index: 0
    terrain: 'desert'
    transport_mode: 'walking'
    all_heroes_have_camels: true
  expected:
    state:
      movement_day: 0
      movement_points: 1.5
      hex_index: 1
      entered_hex: true
      terrain_cost: 1.5
    events:
      - type: invoke
        dependency: Determine party transport eligibility
      - type: require
        satisfied: true
      - type: require
        satisfied: true
      - type: require
        satisfied: true
      - type: invoke
        dependency: World Map route and terrain lookup
      - type: require
        satisfied: true
    trace:
      - procedure.travel_daily_movement
    unresolved: []
    steps:
      - determine_allowance
      - walking_allowance
      - desert_cost
      - camel_desert_cost
      - check_entry
      - enter_hex
- id: test.travel.hunger_morale.heroes_mercenary_and_dog
  name: 'Hunger: 3 heroes, 1 mercenary and a dog lower Party Morale by 4'
  section_id: section.travelling_and_skirmishes.rations_and_resting
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 125
      pdf_page: 127
      heading: Rations and Resting
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 25
      printed_page: null
      heading: '2.21'
      locator:
        row: 166
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Derived case for the hunger penalty as changed by changelog 2.21 entry 166 ("Party Morale is also
    lowered by 1 per character (Mercenaries included, not dogs)"); inputs are test values.
  kind: derived_case
  procedure_id: procedure.travel_food_and_rest
  inputs:
    phase: 'food'
    food_choice: 'rations'
    terrain: 'road'
    has_trees: false
    forage_day: -1
    party_fed: false
    day: 0
    food_day: -1
    rations_available: 0
    hunger_morale_active: false
    hunger_morale_loss: 0
    party_morale: 8
    party_member_count: 5
    dog_count: 1
  expected:
    state:
      food_day: 0
      food_required: 1
      hunger_morale_active: true
      hunger_morale_loss: 4
      party_morale: 4
    events:
      - type: require
        satisfied: true
    trace:
      - procedure.travel_food_and_rest
    unresolved: []
    steps:
      - determine_food_requirement
      - no_rations
      - hunger_morale
