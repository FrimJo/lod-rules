- id: test.travel.map_caption.green_first_hex
  name: 'Map caption: the green route on foot, first hex off-road (1,5p)'
  section_id: section.travelling_and_skirmishes.moving_on_the_map
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 124
      pdf_page: 126
      heading: Moving on the Map
      locator:
        region: Hex map figure and its caption, right column
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Blue arrows would cost 5 points of movement and would require a horse. The green arrows
    would cost 2,5 points and could be done on foot.'
  kind: source_example
  procedure_id: procedure.travel_daily_movement
  inputs:
    day: 0
    movement_day: -1
    event_day: 0
    route_legal: true
    movement_points: 0
    hex_index: 0
    terrain: 'off_road'
    transport_mode: 'walking'
  expected:
    state:
      movement_day: 0
      movement_points: 1.5
      hex_index: 1
      entered_hex: true
      terrain_cost: 1.5
    events:
      - type: invoke
        dependency: Determine party transport eligibility
      - type: require
        satisfied: true
      - type: require
        satisfied: true
      - type: require
        satisfied: true
      - type: invoke
        dependency: World Map route and terrain lookup
      - type: require
        satisfied: true
    trace:
      - procedure.travel_daily_movement
    unresolved: []
    steps:
      - determine_allowance
      - walking_allowance
      - offroad_cost
      - check_entry
      - enter_hex
