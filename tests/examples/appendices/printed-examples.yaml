- id: test.perk.frenzy_example.eight_attacks
  name: 'printed Frenzy comment: at most 8 attacks over the two Frenzied turns'
  section_id: section.appendix_i_perks.combat_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: Combat Perks
      locator:
        table: Combat Perks
        row: Frenzy
        column: Comment
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    For each standard attack that damages the enemy, the hero may make one more standard attack for
    free. ... Barbarians only. Lasts for two turns. That means a maximum of 8 attacks can be done
    over the two Frenzied turns.
  kind: source_example
  rule_ids:
    - character.perk.frenzy.bonus_attack
    - character.perk.frenzy.limits
  inputs:
    standard_attack_damaged_enemy: true
    armour_penetration: 0
    hero_action_points: 2
    standard_attack_action_point_cost: 1
  expected:
    state:
      free_standard_attacks: 1
      same_target_required: false
      armour_penetration: 1
      duration_turns: 2
      maximum_attacks: 8
      only_move_or_attack: true
    events: []
    trace:
      - character.perk.frenzy.bonus_attack
      - character.perk.frenzy.limits
    unresolved: []
    steps: []
- id: test.equipment.stackable_example.cloak_over_mail_and_padded
