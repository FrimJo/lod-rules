- id: test.treasure.stone_of_valheir_example.draw_without_focus
  name: 'printed Stone of Valheir consequence: a stored Focus bonus is drawn without focusing or added miscast risk'
  section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 204
      printed_page: 202
      heading: Stone of Valheir
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A wizard may store up to 3 Focus bonuses in the stone which can then be drawn upon at any time.
    That means the wizard may cast a spell and get the 10-30 Focus bonus without actually needing to
    focus. This bonus does not increase the risk of miscast.
  kind: source_example
  rule_ids:
    - character.treasure.legendary.stone_of_valheir.draw
  inputs:
    identified: true
    user_is_wizard: true
    stored_focus_bonuses: 3
  expected:
    state:
      stored_focus_bonuses_after: 2
      needs_to_focus: false
      increases_miscast_risk: false
    events:
      - type: require
        satisfied: true
    trace:
      - character.treasure.legendary.stone_of_valheir.draw
    unresolved: []
    steps: []
