      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Stackable: This armour can be combined with ONE armour of a different tier that also have the
    stackable special rule. However, this impedes your Dexterity (-10 DEX). ... Cloaks can be worn
    even if the hero is already using stacked armour (for example a mail shirt on top of a padded
    jacket).'
  kind: source_example
  rule_ids:
    - character.equipment.armour.stackable
  inputs:
    both_pieces_stackable: true
    inner_tier: 1
    outer_tier: 3
    non_cloak_layers: 2
  expected:
    state:
      stacking_dex_modifier: -10
      cloak_additionally_allowed: true
    events:
      - type: require
        satisfied: true
