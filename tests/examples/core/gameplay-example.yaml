- id: test.gameplay_example.threat_roll_in_battle
  name: Turn 3 Threat Roll of 10 triggers the in-battle table and the Threat Level drops by 3
  section_id: section.game_basics.gameplay_example
  source:
    - *p23
  status: extracted
  confidence: medium
  source_text: The Scenario die ends up a 10, indicating that a Threat Roll is required. The players
    roll 1d20, resulting in 10, which is lower than the current Threat Level ... Since they are in
    battle, they roll 1d10 on the 'Threat table in combat', resulting in a 5. The spider gains the
    Frenzy Rule! That also means that the Threat Level is decreased by 3 according to the table.
