    d6_roll: 6
    d10_roll: 3
    locked: false
    is_chest: true
    trap_prevents_opening: false
    adjacent: true
    initial_entrance: false
  expected:
    state:
      threat_level: 10
      action_points_spent: 1
      door_table_result: Open
    events:
      - type: require
        satisfied: true
      - type: invoke
        dependency: procedure.trap_resolution
      - type: invoke
        dependency: table.dungeon.door_chest_difficulty
      - type: invoke
        dependency: table.treasure.furniture
    trace:
      - procedure.open_door_or_chest
    unresolved: []
    steps:
      - spend
      - increase_threat
      - roll_open
      - trapped
      - check_locked
      - reveal
      - chest_reveal
