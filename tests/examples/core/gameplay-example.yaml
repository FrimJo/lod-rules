  status: extracted
  confidence: high
  source_text: Azira spends one action moving up to the chest and the second to try to open it.
    She rolls 1d6 to see if it is trapped and 1d10 to see if it is locked. To speed things up she
    rolls both dice at the same time. The d10 ends up a 3, telling her that the chest is unlocked,
    but the d6 shows a 6, meaning that it is trapped.
  kind: source_example
  procedure_id: procedure.open_door_or_chest
  issues:
