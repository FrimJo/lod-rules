- id: test.phase6.threat_roll.example
  name: threat roll below the level, party not in battle
  section_id: section.into_the_dungeons.the_threat_level
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 88
      pdf_page: 89
      heading: The Threat Level
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 89
      pdf_page: 90
      heading: The Threat Level
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: |-
    At the start of the turn, the player rolls the Scenario die, 1d10. It ends up a 9, and
    thus, a roll against the Threat Level must be done. The player then rolls 1d20, resulting
    in a 7, which happens to be below the Threat Level of 9. Since the party is not in battle,
    the player rolls on the corresponding table and gets a 16. That means the risk of
    encounters will go up for the rest of the quest. At the same time, the Threat Level is now
    reduced by 6 points down to 3.
  kind: source_example
  procedure_id: procedure.threat_roll
  inputs:
    threat_level: 9
    threat_roll: 7
    in_battle: false
    threat_decrease: -6
  expected:
    state:
      threat_level: 3
      original_threat_level: 9
    events:
      - type: invoke
        dependency: Threat table — party is not in battle (page 89)
    trace:
      - procedure.threat_roll
    unresolved: []
    steps:
      - roll
      - triggered
      - not_in_battle
      - decrease
