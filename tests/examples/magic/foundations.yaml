- id: test.core.magic.focus_example.ozmor
  name: printed Focus example, Ozmor focuses for 2 actions (Arcane Arts 73, miscast threshold 85)
  section_id: section.magic.focus
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 64
      pdf_page: 66
      heading: Focus
      locator:
        paragraph: Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Example: The Level 4 Wizard, Ozmor, has decided to cast the ‘Summon Demon Spell’
    which has a Casting Value of 25. Ozmor’s Arcane Arts skill level is 53 which would give him a
    chance of success of 28. To even the odds, he chooses to focus for 2 actions. His new chance of
    success is now 48. At the same time, however, any roll above 85 will now result in a Miscast. He
    rolls 49 on his casting roll. Luckily, he has the Summoner Talent, giving him a +5 which allows
    him to summon the demon. He also uses 25 Mana since the spell succeeded. Now, all he needs to do
    is control the demon!'
  kind: source_example
  rule_ids:
    - core.magic.focus
    - core.magic.miscast.threshold.normal
  see_also:
    - section.appendix_iv_spells.level_4
  issues:
    - issue.magic.focus_example
  inputs:
    focus_actions: 2
    arcane_arts: 53
    cast_next_possible_action: true
    wounded: false
    power_levels: 0
  expected:
    state:
      focused_arcane_arts: 73
      miscast_reduction: 10
      miscast_threshold: 85
    events:
      - type: require
        satisfied: true
    trace:
      - core.magic.focus
      - core.magic.miscast.threshold.normal
    unresolved: []
    steps: []
- id: test.core.magic.scroll_example.magic_bolt_scroll
  name: printed Magic Scrolls example, Magic Bolt from a scroll (CV 10-10 = 0, roll 50 or lower)
  section_id: section.magic.magic_scrolls
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 65
      pdf_page: 67
      heading: Magic Scrolls
      locator:
        paragraph: Example
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Example: A Magic Bolt Spell requires the caster to be Level 3, and the CV of the
    spell is 10. A wizard with an Arcane Arts skill of 50 would then need to roll 40 to succeed.
    However, if this was a scroll, the Casting Value of the spell would instead be 10-10 = 0. Thus,
    the caster would only need to roll 50 or lower to succeed. Furthermore, this could be done even
    if the caster was Level 1, and by a non-wizard but in that case using WIS instead of Arcane
    Arts.'
  kind: source_example
  rule_ids:
    - core.magic.scroll
    - core.magic.scroll.skill.wizard
  see_also:
    - section.appendix_iv_spells.level_3
  inputs:
    casting_value: 10
    focus_actions: 0
    quick_slot: false
    wizard: true
    arcane_arts: 50
  expected:
    state:
      scroll_cv: 0
      mana_spent: 0
      upkeep_spent: 0
      level_restricted: false
      casting_threshold: 50
    events:
      - type: require
        satisfied: true
    trace:
      - core.magic.scroll
      - core.magic.scroll.skill.wizard
    unresolved: []
    steps: []
