# Identity of the source documents this corpus is compiled from.
# `file` paths are relative to this directory.
documents:
  - id: rulebook.second_printing.eng
    title: League of Dungeoneers Rulebook
    edition: second_printing
    language: eng
    file: Rulebook-2nd-printing-ENGa.pdf
    canonical: true
    pages: 286
    source_class: rulebook

  # Designer rulings published by von Braus Publishing (Michael Lundstedt). They resolve
  # review issues but never replace the rulebook's printed wording.
  # Fetched 2026-10-03 from vonbraus.se/wp-content/uploads/2025/06/Changleog-LoD-2.2x.pdf
  # (sha256 b09f2fe1127bac0b5d1471d29ef79431a0f6b34a1b360c47a7bb50d511e79579).
  # Cite entries as locator.row = changelog "Number".
  - id: vonbraus.changelog_2_2x
    title: Changelog LoD 2.2x
    file: vonbraus-changelog-2.2x.pdf
    canonical: false
    pages: 28
    source_class: official_errata

  # Snapshot of vonbraus.se/games/league-of-dungeoneers/faq-lod-gamefound-edition-and-the-false-prophet-tfp/
  # fetched 2026-10-03 (sha256 b72cdf5480b3192bb8a170e891bb57dd79b0e9f5e4f8769bd7e68adbfcc03a68).
  # Cite entries as heading = the FAQ question.
  - id: vonbraus.faq_gamefound
    title: 'FAQ: LoD Gamefound edition and The False Prophet (TFP)'
    file: vonbraus-faq-2026-10-03.html
    canonical: false
    source_class: official_faq

  # Quick Reference Sheet 2.5 for the reworked 2.5 rulebook (a later edition than this corpus),
  # fetched 2026-10-08 from vonbraus.se/wp-content/uploads/2026/08/QRS-v2.5.pdf
  # (sha256 22c22b87968c149e654e23db0c1ca1cbea820e9229b63f8f2ab4cfbfd036ff3a).
  # Evidence of later-edition values only; it never settles an issue for the second printing.
  # Cite pages as pdf_page, the panel title as heading and the table row as locator.row.
  - id: vonbraus.qrs_2_5
    title: Quick Reference Sheet 2.5
    file: vonbraus-qrs-2.5.pdf
    canonical: false
    pages: 2
    source_class: official_reference

# Books referenced by the rulebook but not present in this repository.
