  - id: quest_book_ii
    title: Quest Book II
    status: not_present

  # Referenced by the Settlements chapter for companion animals (printed pages 133-134).
  - id: companions_compendium
    title: Companions' Compendium
    status: not_present
  - id: false_prophet
    title: False Prophet expansion
    status: not_present
