- id: table.dungeon.threat_in_battle
  name: Threat table, party in battle
  section_id: section.into_the_dungeons.table_2
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 89
      pdf_page: 91
      section: The Threat Level
      heading: 'If the party is in battle:'
      locator:
        table: Uncaptioned 1d10 / Result / Threat decrease table
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'If the party is in battle:'
  type: random_table
  completeness: complete
  columns:
    - id: roll
      label: 1d10
      cell_types:
        - range
    - id: result
      label: Result
      cell_types:
        - text
    - id: decrease
      label: Threat decrease
      cell_types:
        - number
  rows:
    - id: disturbance_in_the_void
      source_row:
        1 A disturbance in the Void. There is a sudden shift in the Void, and this sudden shift
        leaves any Spell Caster in shock. Spell Casters may do nothing during the coming turn, not
        even dodge or parry. -2
      cells:
        roll:
          type: range
          printed: '1'
          min: 1
          max: 1
        result:
          type: text
          printed:
            A disturbance in the Void. There is a sudden shift in the Void, and this sudden shift
            leaves any Spell Caster in shock. Spell Casters may do nothing during the coming turn,
            not even dodge or parry.
        decrease:
          type: number
          printed: '-2'
          value: -2
          meaning: modifier
    - id: greenish_tint
      source_row:
        2 Greenish tint. It suddenly dawns on the heroes that the greenish tint on the blade or claw
        of the enemies is some kind of poison. The enemy gains the Poisonous Special Rule. -2
      cells:
        roll:
          type: range
          printed: '2'
          min: 2
          max: 2
        result:
          type: text
          printed:
            Greenish tint. It suddenly dawns on the heroes that the greenish tint on the blade or
            claw of the enemies is some kind of poison. The enemy gains the Poisonous Special Rule.
        decrease:
          type: number
          printed: '-2'
          value: -2
          meaning: modifier
    - id: forged_under_pressure
      source_row:
        3 Forged under pressure. While under pressure, some will break, and some will harden. One
        enemy gain +15 CS until dead. -3
      cells:
        roll:
          type: range
          printed: '3'
          min: 3
          max: 3
        result:
          type: text
          printed:
            Forged under pressure. While under pressure, some will break, and some will harden. One
            enemy gain +15 CS until dead.
        decrease:
          type: number
          printed: '-3'
          value: -3
          meaning: modifier
    - id: healing
      source_row:
        4-5 Healing. One wounded enemy on the table (the one with the highest XP level, or random)
        will heal 1d10 Hit Points. This may occur through use of a healing potion, by some divine
        intervention from the gods, or through sheer will. -3
      cells:
        roll:
          type: range
          printed: 4-5
          min: 4
          max: 5
        result:
          type: text
          printed:
            Healing. One wounded enemy on the table (the one with the highest XP level, or random)
            will heal 1d10 Hit Points. This may occur through use of a healing potion, by some
            divine intervention from the gods, or through sheer will.
        decrease:
          type: number
          printed: '-3'
          value: -3
          meaning: modifier
    - id: frenzy
      source_row:
        6 Frenzy. One enemy starts roaring with rage and attacks with renewed strength. The enemy
        gains the Frenzy Special Rule until dead. -3
      cells:
        roll:
          type: range
          printed: '6'
          min: 6
          max: 6
        result:
          type: text
          printed:
            Frenzy. One enemy starts roaring with rage and attacks with renewed strength. The enemy
            gains the Frenzy Special Rule until dead.
        decrease:
          type: number
          printed: '-3'
          value: -3
          meaning: modifier
    - id: disarmed
      source_row:
        7 Disarmed! Whether by a disarming move from one of the enemies or due to clumsiness, one
        random hero drops his weapon. The hero must manage a DEX Test to retrieve his weapon,
        spending 1 Action doing so. If they fail, they will have no weapon and cannot fight. They
        may continue to try to pick it up, spending one AP per try. -3
      cells:
        roll:
          type: range
          printed: '7'
          min: 7
          max: 7
        result:
          type: text
          printed:
            Disarmed! Whether by a disarming move from one of the enemies or due to clumsiness, one
            random hero drops his weapon. The hero must manage a DEX Test to retrieve his weapon,
            spending 1 Action doing so. If they fail, they will have no weapon and cannot fight.
            They may continue to try to pick it up, spending one AP per try.
        decrease:
          type: number
          printed: '-3'
          value: -3
          meaning: modifier
    - id: fearsome
      source_row:
        8 Fearsome! One enemy seems to grow in its presence, becoming more fearsome by the minute.
        The enemy gains the Fear Special Rule. There is no level cap for this fear, but Talents for
        ignoring fear still work. -4
      cells:
        roll:
          type: range
          printed: '8'
          min: 8
          max: 8
        result:
          type: text
          printed:
            Fearsome! One enemy seems to grow in its presence, becoming more fearsome by the minute.
            The enemy gains the Fear Special Rule. There is no level cap for this fear, but Talents
            for ignoring fear still work.
        decrease:
          type: number
          printed: '-4'
          value: -4
          meaning: modifier
    - id: reinforcements
      source_row:
        9 Reinforcements. Roll on the Encounter Table and place the new encounter just outside a
        random door, open or not, ready to enter a tile where there are heroes. They will act last
        in the current turn. If the door was previously unopened, it will henceforth be considered
        unlocked and not trapped. -4
      cells:
        roll:
          type: range
          printed: '9'
          min: 9
          max: 9
        result:
          type: text
          printed:
            Reinforcements. Roll on the Encounter Table and place the new encounter just outside a
            random door, open or not, ready to enter a tile where there are heroes. They will act
            last in the current turn. If the door was previously unopened, it will henceforth be
            considered unlocked and not trapped.
        decrease:
          type: number
          printed: '-4'
          value: -4
          meaning: modifier
    - id: onwards
      source_row:
        10 Onwards! One enemy breaks out in a fierce roar, boosting his fellows and making them
        fight with renewed energy. All enemies gain +10 CS until end of battle. -6
      cells:
        roll:
          type: range
          printed: '10'
          min: 10
          max: 10
        result:
          type: text
          printed:
            Onwards! One enemy breaks out in a fierce roar, boosting his fellows and making them
            fight with renewed energy. All enemies gain +10 CS until end of battle.
        decrease:
          type: number
          printed: '-6'
          value: -6
          meaning: modifier
  footnotes: []
  roll_domain:
    min: 1
    max: 10
  unresolved_references:
    - Poisonous Special Rule
    - Frenzy Special Rule
    - Fear Special Rule
    - Encounter Table
  see_also:
