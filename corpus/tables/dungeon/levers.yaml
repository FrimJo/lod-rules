  rows:
    - id: rumble
      source_row:
        1-11 A rumble can be heard far off in the dungeon. Then everything goes quiet again.
        Nothing happens.
      cells:
        roll:
          type: range
          printed: 1-11
          min: 1
          max: 11
        event:
          type: text
          printed:
            A rumble can be heard far off in the dungeon. Then everything goes quiet again. Nothing
            happens.
    - id: door_locked
      source_row:
        12 With a metallic sound, one of the doors in the room is closed and locked. If there is
        a door that the heroes have not yet opened, that door is now automatically locked (as if
        rolling a 10). The party must still roll for a trap as usual. If there are no unopened
        doors, randomise one door in the room that closes and becomes locked as above. There are no
        traps on such a door.
      cells:
        roll:
          type: range
          printed: '12'
          min: 12
          max: 12
        event:
          type: text
          printed:
            With a metallic sound, one of the doors in the room is closed and locked. If there is a
            door that the heroes have not yet opened, that door is now automatically locked (as if
            rolling a 10). The party must still roll for a trap as usual. If there are no unopened
            doors, randomise one door in the room that closes and becomes locked as above. There are
            no traps on such a door.
    - id: grinding_cogs
      source_row: 13 The sound of grinding cogs can be heard, but apart from that, everything seems
        normal. Raise the Threat Level by 2.
      cells:
        roll:
          type: range
          printed: '13'
          min: 13
          max: 13
        event:
          type: text
          printed:
            The sound of grinding cogs can be heard, but apart from that, everything seems normal.
            Raise the Threat Level by 2.
    - id: screeching_noises
      source_row: 14 Screeching noises echo through the hallways and a slight tremor can be felt.
        Something is shifting. Add 2 random Exploration Cards on top of every Exploration Card pile
        without looking at them.
      cells:
        roll:
          type: range
          printed: '14'
          min: 14
          max: 14
        event:
          type: text
          printed:
            Screeching noises echo through the hallways and a slight tremor can be felt. Something is
            shifting. Add 2 random Exploration Cards on top of every Exploration Card pile without
            looking at them.
    - id: eerie_scream
      source_row:
        15 The lever seems to trigger an eerie scream echoing through the dungeon, sending a
        chill down the spines of the heroes. Lower Party Morale by 4 and Sanity for each character
        by 1.
      cells:
        roll:
          type: range
          printed: '15'
          min: 15
          max: 15
        event:
          type: text
          printed:
            The lever seems to trigger an eerie scream echoing through the dungeon, sending a chill
            down the spines of the heroes. Lower Party Morale by 4 and Sanity for each character by
            1.
    - id: portcullis
      source_row:
        16 With a loud bang, a portcullis falls down in front of all doors. All doors on the
        tile are now covered with a portcullis. This must be lifted in order to reach the door. See
        page 101.
      cells:
        roll:
          type: range
          printed: '16'
          min: 16
          max: 16
        event:
          type: text
          printed:
            With a loud bang, a portcullis falls down in front of all doors. All doors on the tile are
            now covered with a portcullis. This must be lifted in order to reach the door. See page
            101.
    - id: wandering_monster_released
      source_row: 17 A foul draft goes through the dungeon after activating the lever. The lever has
        opened a secret passage and released a Wandering Monster into the dungeon. The monster is
        placed on a random tile, leaving at least one empty tile between it and the heroes. If there
        are no such tiles, the monster is placed behind one random unopened door. It will not move,
        but the move roll should be done as usual and on a roll of 1 it is removed from the table.
        Whenever the door is opened, the monster is placed on the table (together with any other
        Enemies encountered in the normal way). To determine what the wandering monster is, roll on
        the dungeon's normal Encounter Table, but add +20 to the roll. Add one of the enemies from
        that entry, taking the one with the highest XP.
      cells:
        roll:
          type: range
          printed: '17'
          min: 17
          max: 17
        event:
          type: text
          printed:
            A foul draft goes through the dungeon after activating the lever. The lever has opened a
            secret passage and released a Wandering Monster into the dungeon. The monster is placed
            on a random tile, leaving at least one empty tile between it and the heroes. If there
            are no such tiles, the monster is placed behind one random unopened door. It will not
            move, but the move roll should be done as usual and on a roll of 1 it is removed from
            the table. Whenever the door is opened, the monster is placed on the table (together
            with any other Enemies encountered in the normal way). To determine what the wandering
            monster is, roll on the dungeon's normal Encounter Table, but add +20 to the roll. Add
            one of the enemies from that entry, taking the one with the highest XP.
    - id: defence_system
      source_row:
        18 Not a sound is heard. The heroes look at each other, listening carefully, but nothing
        seems to have happened. Alas, the party has triggered the defence system of the dungeon and
        every door is now trapped on a 1d6 of 5-6 instead of the normal 6.
      cells:
        roll:
          type: range
          printed: '18'
          min: 18
          max: 18
        event:
          type: text
          printed:
            Not a sound is heard. The heroes look at each other, listening carefully, but nothing seems
            to have happened. Alas, the party has triggered the defence system of the dungeon and
            every door is now trapped on a 1d6 of 5-6 instead of the normal 6.
    - id: floor_gives_way
      source_row:
        19 Suddenly, the floor gives way under one of the heroes. Randomise which hero, except
        for the one pulling the lever. They must make a DEX Test or fall into a pit trap. If the
        test is successful, place a pit token on that square and move the hero to an adjacent
        square. If it fails, the hero takes 1d10 Points of Damage without armour but with NA. To get
        up, the hero must use a rope or succeed with a DEX Test. Both alternatives take 1 AP. Lower
        PM by 1, and if the hero falls into the pit, lower his Sanity by 2.
      cells:
        roll:
          type: range
          printed: '19'
          min: 19
          max: 19
        event:
          type: text
          printed:
            Suddenly, the floor gives way under one of the heroes. Randomise which hero, except for the
            one pulling the lever. They must make a DEX Test or fall into a pit trap. If the test is
            successful, place a pit token on that square and move the hero to an adjacent square. If
            it fails, the hero takes 1d10 Points of Damage without armour but with NA. To get up,
            the hero must use a rope or succeed with a DEX Test. Both alternatives take 1 AP. Lower
            PM by 1, and if the hero falls into the pit, lower his Sanity by 2.
    - id: iron_cage
      source_row: 20 A rattling noise makes the hero look up, only to realise that an iron cage is
        descending from the roof. The cage encloses the hero that pulled the lever. At the same
        time, enemies appear at all doorways in the room. Roll once on the Encounter Table for each
        door in the room and place the enemies piled up just outside the doors. Any unopened door is
        now treated as unlocked and not trapped. End the turn and setup the initiative tokens. The
        hero trapped in the cage can do nothing until after the fight. Once the fight is over, the
        cage retracts. PM is reduced by 1, and the Sanity of the caged hero by 2.
      cells:
        roll:
          type: range
          printed: '20'
          min: 20
          max: 20
        event:
          type: text
          printed:
            A rattling noise makes the hero look up, only to realise that an iron cage is descending
            from the roof. The cage encloses the hero that pulled the lever. At the same time,
            enemies appear at all doorways in the room. Roll once on the Encounter Table for each
            door in the room and place the enemies piled up just outside the doors. Any unopened
            door is now treated as unlocked and not trapped. End the turn and setup the initiative
            tokens. The hero trapped in the cage can do nothing until after the fight. Once the
            fight is over, the cage retracts. PM is reduced by 1, and the Sanity of the caged hero
            by 2.
  footnotes: []
- id: table.dungeon.black_levers
  name: Black Levers
  section_id: section.into_the_dungeons.table_5
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 103
      pdf_page: 105
      heading: Black Levers
      extraction:
        method: image
        confidence: high
        visually_verified: true
      locator:
        table: Black Levers (1d8 / Event)
  status: extracted
  confidence: high
  source_text: Black Levers 1d8 Event
  see_also:
    - section.into_the_dungeons.levers
  type: random_table
  completeness: complete
  roll_domain:
    min: 1
    max: 8
  columns:
    - id: roll
      label: 1d8
      cell_types:
        - range
    - id: event
      label: Event
      cell_types:
        - text
  rows:
    - id: entrance_closed
      source_row:
        1 A squeaking sound followed by a loud bang comes from the passages already traversed by
        the party. The party has closed the entrance to the dungeon, effectively hindering any
        Wandering Monsters from entering. Whenever you trigger a Wandering Monster that should be
        placed on the start tile, you may ignore this. If it is triggered through a threat roll,
        decrease the threat as usual, but don’t place a monster. If the spawn point of wandering
        monsters have been changed, this event will have no effect.
      cells:
        roll:
          type: range
          printed: '1'
          min: 1
          max: 1
        event:
          type: text
          printed: >-
            A squeaking sound followed by a loud bang comes from the passages already traversed by
            the party.

            The party has closed the entrance to the dungeon, effectively hindering any Wandering
            Monsters from entering. Whenever you trigger a Wandering Monster that should be placed
            on the start tile, you may ignore this. If it is triggered through a threat roll,
            decrease the threat as usual, but don’t place a monster. If the spawn point of wandering
            monsters have been changed, this event will have no effect.
    - id: hidden_passageway
      source_row:
        2 With a grinding noise, one section of the walls slowly retracts to reveal a hidden
        passageway. Place the Treasure Chamber adjacent to the current tile. The 3 chests may be
        searched. If this tile has already been placed somewhere else, you may move it (temporarily)
        to this new location. Once the heroes leave the chamber, the door closes, and the tile can
        either be removed from the table, or returned to its previous position.
      cells:
        roll:
          type: range
          printed: '2'
          min: 2
          max: 2
        event:
          type: text
          printed:
            With a grinding noise, one section of the walls slowly retracts to reveal a hidden
            passageway. Place the Treasure Chamber adjacent to the current tile. The 3 chests may be
            searched. If this tile has already been placed somewhere else, you may move it
            (temporarily) to this new location. Once the heroes leave the chamber, the door closes,
            and the tile can either be removed from the table, or returned to its previous position.
    - id: small_compartment
      source_row:
        3 A small compartment opens next to the levers, revealing precious items. The hero may
        take 1 Wonderful Treasure without spending any additional APs.
      cells:
        roll:
          type: range
          printed: '3'
          min: 3
          max: 3
        event:
          type: text
          printed: |-
            A small compartment opens next to the levers, revealing precious items.
            The hero may take 1 Wonderful Treasure without spending any additional APs.
    - id: metallic_sound
      source_row:
        4 A metallic sound can be heard from far away in the dungeon. Clearly, this lever did
        operate something. The first locked door the heroes encounter outside the current tile will
        be treated as unlocked.
      cells:
        roll:
          type: range
          printed: '4'
          min: 4
          max: 4
        event:
          type: text
          printed: >-
            A metallic sound can be heard from far away in the dungeon. Clearly, this lever did
            operate something.

            The first locked door the heroes encounter outside the current tile will be treated as
            unlocked.
    - id: good_sign_trap
      source_row:
        5 There is no immediate feedback from activating the lever, but you have strong feeling
        that this is a good sign. The first trap triggered outside this tile may be ignored.
      cells:
        roll:
          type: range
          printed: '5'
          min: 5
          max: 5
        event:
          type: text
          printed: >-
            There is no immediate feedback from activating the lever, but you have strong feeling
            that this is a good sign.

            The first trap triggered outside this tile may be ignored.
    - id: door_opens
      source_row:
        6 With a screeching sound, one of the doors in the tile opens. If there are any unopened
        doors in the room, one of them will open slightly. The heroes must still spend 1 AP to open
        it fully to reveal what lies behind it, but there is no need to raise the Threat Level or to
        roll for traps or to check whether the door is locked or not.
      cells:
        roll:
          type: range
          printed: '6'
          min: 6
          max: 6
        event:
          type: text
          printed: >-
            With a screeching sound, one of the doors in the tile opens.

            If there are any unopened doors in the room, one of them will open slightly. The heroes
            must still spend 1 AP to open it fully to reveal what lies behind it, but there is no
            need to raise the Threat Level or to roll for traps or to check whether the door is
            locked or not.
    - id: dusty_bottles
      source_row:
        7 A hidden compartment opens, revealing a couple of dusty bottles. There are 1d3 potions
        in the compartment that may be picked up in the same action as activating the lever.
      cells:
        roll:
          type: range
          printed: '7'
          min: 7
          max: 7
        event:
          type: text
          printed: >-
            A hidden compartment opens, revealing a couple of dusty bottles.

            There are 1d3 potions in the compartment that may be picked up in the same action as
            activating the lever.
    - id: point_of_luck
      source_row:
        8 There is no immediate feedback from activating the lever, but you have strong feeling
        that this is a good sign. The party receives a blessing in the form of a Point of Luck that
        is held by the party collectively throughout the dungeon. It may be used by any of the
        heroes, but if not used before the party leaves the dungeon, it is lost.
      cells:
        roll:
          type: range
          printed: '8'
          min: 8
          max: 8
        event:
          type: text
          printed: >-
            There is no immediate feedback from activating the lever, but you have strong feeling
