- id: table.estate.furnishings
  name: Furnishing the Manor
  section_id: section.buying_an_estate.furnishing_the_manor
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: Furnishing the Manor
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Only one furnishing/build may be bought between each quest; cannot be used until after
    leaving the next dungeon.
  type: reference_table
  completeness: complete
  columns:
    - id: furnishing
      label: Furnishing
      cell_types:
        - text
    - id: cost
      label: Cost
      cell_types:
        - text
    - id: effect
      label: Effect
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: Training Grounds
      cells:
        furnishing:
          type: text
          printed: Training Grounds
        cost:
          type: text
          printed: 500 c
        effect:
          type: text
          printed:
            Any hero who spends time at the training grounds may choose to increase either CS or Dodge
            by +1d2. May be done once between each visit to a dungeon.
      entity_refs:
        - equipment.estate.training_grounds
    - id: row_2
      source_row: Wizard Study
      cells:
        furnishing:
          type: text
          printed: Wizard’s Study
        cost:
          type: text
          printed: 500 c
        effect:
          type: text
          printed:
            A wizard may store any number of Familiars here for free. Furthermore, any Enchantment or
            Magic Scribble cast here is done with a +20 modifier.
      entity_refs:
        - equipment.estate.wizards_study
    - id: row_3
      source_row: Alchemist Lab
      cells:
        furnishing:
          type: text
          printed: Alchemist Lab
        cost:
          type: text
          printed: 500 c
        effect:
          type: text
          printed:
            An alchemist making a recipe in this lab may choose what kind of potion the recipe will
            yield. Only one recipe may be made between each visit to a dungeon.
      entity_refs:
        - equipment.estate.alchemist_lab
    - id: row_4
      source_row: Shrine
      cells:
        furnishing:
          type: text
          printed: Shrine
        cost:
          type: text
          printed: 350 c
        effect:
          type: text
          printed:
            Only one shrine can be built, dedicated to a god of the hero’s choice. Any hero may pray at
            the shrine in between quests and get the standard boon, but for free and with a success
            on 1-4 on 1d6.
      entity_refs:
        - equipment.estate.shrine
    - id: row_5
      source_row: Smithy
      cells:
        furnishing:
          type: text
          printed: Smithy
        cost:
          type: text
          printed: 350 c
        effect:
          type: text
          printed: All heroes may automatically repair 1d3 Durability Points on all weapons and armour.
      entity_refs:
        - equipment.estate.smithy
    - id: row_6
      source_row: Archery Range
      cells:
        furnishing:
          type: text
          printed: Archery Range
        cost:
          type: text
          printed: 500 c
        effect:
          type: text
          printed:
            You can only train either at archery range OR at the training grounds with each hero.
            Heroes staying at the manor may increase their RS by +1d2 between each visit to a
            dungeon.
      entity_refs:
        - equipment.estate.archery_range
    - id: row_7
      source_row: Crops Hen Pigsty
      cells:
        furnishing:
          type: text
          printed: Crops, Hen House, and Pigsty
        cost:
          type: text
          printed: 200 c
        effect:
          type: text
          printed:
            As long as one of the heroes spends at least a full day tending to these, the party will
            receive a number of rations for free. These are calculated as 1d8+the number of spent
            days.
      entity_refs:
        - equipment.estate.crops_hen_house_pigsty
    - id: row_8
      source_row: Garden
      cells:
        furnishing:
          type: text
          printed: Garden
        cost:
          type: text
          printed: 200 c
        effect:
          type: text
          printed: An Alchemist may gather 1d6+2 random ingredients from the garden once between each quest.
      entity_refs:
        - equipment.estate.garden
    - id: row_9
      source_row: Kennel
      cells:
        furnishing:
          type: text
          printed: Kennel
        cost:
          type: text
          printed: 75 c
        effect:
          type: text
          printed:
            With a kennel, you can leave any dogs you own between quests, if you decide not to bring
            them. This requires the Companion’s Expansion.
      entity_refs:
        - equipment.estate.kennel
  footnotes:
    - Only one thing may be bought in between every quest, and it cannot be used until after leaving
      the next dungeon.
- id: table.estate.ghost_events
  name: Ghostly Events
  section_id: section.buying_an_estate.ghostly_events_table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: The Ghosts of Past Generations
      extraction:
        method: text
        confidence: high
        visually_verified: false
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 162
      printed_page: 160
      heading: Ghostly Events Table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Between every quest, roll 1d10 the night before planned departure. On 7–10 roll on the
    Ghostly Events Table. There is no time to change plans afterward: head straight to the World
    Map.'
  type: reference_table
  completeness: complete
  columns:
    - id: roll
      label: 1d10
      cell_types:
        - text
    - id: event
      label: Event
      cell_types:
        - text
    - id: effect
      label: Effect
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: '1'
      cells:
        roll:
          type: text
          printed: '1'
        event:
          type: text
          printed: The Family Heirlooms
        effect:
          type: text
          printed:
            The heroes may roll twice on the Wonderful Treasure Chart. However, the lack of sleep will
            deprive each hero of 1 Point of Energy.
    - id: row_2
      source_row: '2'
      cells:
        roll:
          type: text
          printed: '2'
        event:
          type: text
          printed: Guardian Spirits
        effect:
          type: text
          printed: +1 Luck for all heroes during the coming quest.
    - id: row_3
      source_row: '3'
      cells:
        roll:
          type: text
          printed: '3'
        event:
          type: text
          printed: The Hidden Treasure
        effect:
          type: text
          printed:
            Add a Side Quest Card to the first half of the pile when setting up the Dungeon Cards. When
            you draw the Side Quest Card, you remove it and immediately draw the next card. On this
            card, you add 1 extra door leading to the R10 tile. This door is considered a normal
            door in all aspects as the ghost’s explanation makes it easy to find. It can still be
            locked and trapped but there are no encounters inside.
    - id: row_4
      source_row: '4'
      cells:
        roll:
          type: text
          printed: '4'
        event:
          type: text
          printed: Spiritual Guides
        effect:
          type: text
          printed: All Heroes get +5 CS/+5 RS during the quest.
    - id: row_5
      source_row: '5'
      cells:
        roll:
          type: text
          printed: '5'
        event:
          type: text
          printed: Protector
        effect:
          type: text
          printed:
            Any wizard in the party will only miscast on 97-00 during the coming quest. If there are no
            wizards in the party, ignore this and head out on your quest without any ghostly events.
    - id: row_6
      source_row: '6'
      cells:
        roll:
          type: text
          printed: '6'
        event:
          type: text
          printed: The Grieving Mother
        effect:
          type: text
          printed:
            'See the Grieving Mother Side Quest. If you already have succeeded in this quest, ignore
            this and treat it as if you rolled #2. If you have tried and failed, you may try again.'
    - id: row_7
      source_row: '7'
      cells:
        roll:
          type: text
          printed: '7'
        event:
          type: text
          printed: Angered Ghost
        effect:
          type: text
          printed: Any rations from the crops, hen house, and pigsty are lost.
    - id: row_8
      source_row: '8'
      cells:
        roll:
          type: text
          printed: '8'
        event:
          type: text
          printed: Restless Night
        effect:
          type: text
          printed:
            The heroes have a tough time getting a good night’s sleep. All heroes start the next quest
            with -2 Energy (minimum 0). This can be regained as usual after the quest has started
            through the usual means.
    - id: row_9
      source_row: '9'
      cells:
        roll:
          type: text
          printed: '9'
        event:
          type: text
          printed: Lost Item
        effect:
          type: text
          printed:
            First randomise which hero is affected. Then randomise between all weapons, all pieces of
            armour and all rations (All rations are considered a single item for this purpose). This
            item is left back at the estate and cannot be used until you have left the next dungeon.
    - id: row_10
      source_row: '10'
      cells:
        roll:
          type: text
          printed: '10'
        event:
          type: text
          printed: The Curse
        effect:
          type: text
          printed:
            Every hero suffers an individual curse from the Curse Table in the Rulebook that cannot be
            lifted until they are back in the city again.
  footnotes:
    - Roll 1d10 for the last evening or night before departure. There is no time to change plans
      afterwards; head straight to the World Map.
