- id: table.combat.hit_location
  name: 1d6 / Hit location
  section_id: section.combat.different_kinds_of_damage.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Dealing Damage
      heading: Hit Area (Only When Hitting Heroes)
      locator:
        table: Uncaptioned hit location table (1d6 / Hit location)
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    However, when the enemy strikes a hero, we must check where this strike lands. This is
    done according to the table below. Rolling 1d6 together with the two Hit Dice helps speed things
    up.
  type: random_table
  completeness: complete
  columns:
    - id: roll
      label: 1d6
      cell_types:
        - range
    - id: location
      label: Hit location
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: '1'
      cells:
        roll:
          type: range
          printed: '1'
          min: 1
          max: 1
        location:
          type: text
          printed: Head
    - id: row_2
      source_row: '2'
      cells:
        roll:
          type: range
          printed: '2'
          min: 2
          max: 2
        location:
          type: text
          printed: Arms
    - id: row_3
      source_row: 3-5
      cells:
        roll:
          type: range
          printed: 3-5
          min: 3
          max: 5
        location:
          type: text
          printed: Torso (check gear)
    - id: row_4
      source_row: '6'
      cells:
        roll:
          type: range
          printed: '6'
          min: 6
          max: 6
        location:
          type: text
          printed: Legs
  footnotes: []
  roll_domain:
    min: 1
    max: 6
