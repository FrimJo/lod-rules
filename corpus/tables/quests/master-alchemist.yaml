- id: table.quest.master_alchemist.filling
  name: The Master Alchemist filling the vial
  section_id: section.quest_book_i.the_lava_river.quest_2_the_master_alchemist.table_3
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 246
      printed_page: 244
      heading: Special Rules
      locator:
        table: Uncaptioned DEX Test table (Roll | Result) under The Objective Room, Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Make a DEX Test and consult the table below: Roll | Result / Less or equal to DEX | ... / Less or equal to DEX+20 | ... / Above DEX+20 | ...'
  type: reference_table
  completeness: complete
  columns:
    - id: roll
      label: Roll
      cell_types:
        - text
    - id: result
      label: Result
      cell_types:
        - text
    - id: fire_damage
      label: Printed Fire Damage within Result cell
      cell_types:
        - dice
        - blank
  rows:
    - id: filled
      source_row: Less or equal to DEX | After a minute of struggle, the vial is finally filled with its cork back in place.
      cells:
        roll:
          type: text
          printed: Less or equal to DEX
        result:
          type: text
          printed: After a minute of struggle, the vial is finally filled with its cork back in place.
        fire_damage: &a1
          type: blank
          printed: ''
    - id: burned
      source_row: Less or equal to DEX+20 | In the struggle to dip the vial into the river, the hero reaches too far and burns his hand for 1d4 points of Fire Damage.
      cells:
        roll:
          type: text
          printed: Less or equal to DEX+20
        result:
          type: text
          printed: In the struggle to dip the vial into the river, the hero reaches too far and burns his hand for 1d4 points of Fire Damage.
        fire_damage:
          type: dice
          printed: 1d4
          dice:
            count: 1
            sides: 4
          meaning: value
    - id: dropped
      source_row: Above DEX+20 | The searing heat is too much to handle and the hero drops the vial which sinks into the lava with a hissing sound.
      cells:
        roll:
          type: text
          printed: Above DEX+20
        result:
          type: text
          printed: The searing heat is too much to handle and the hero drops the vial which sinks into the lava with a hissing sound.
        fire_damage: *a1
  footnotes: []
  issues:
    - issue.quest.alchemist_vial_results
