- id: table.quest.pleasure_house.aftermath
  name: The Pleasure House secrecy aftermath
  section_id: section.quest_book_i.the_bandits_hideout.quest_2_the_pleasure_house.table_2
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 252
      printed_page: 250
      heading: The Pleasure House secrecy aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Four printed1d6outcome rows, conditional on keeping the secrecy promise.
