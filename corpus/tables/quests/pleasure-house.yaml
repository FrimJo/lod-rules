      label: 1d6
      cell_types:
        - number
        - range
    - id: result
      label: Result
      cell_types:
        - text
  rows:
    - id: blessing
      source_row:
        1 | The girl holds fast to her word and the party gains 400 c. Furthermore, Metheia
        smiles upon your action and you gain +1 Max HP wounds until the end of the next quest.
      cells:
        roll:
          type: number
          printed: '1'
          value: 1
          meaning: value
        result:
          type: text
          printed:
            The girl holds fast to her word and the party gains 400 c. Furthermore, Metheia smiles upon
            your action and you gain +1 Max HP wounds until the end of the next quest.
    - id: payment
      source_row: 2-3 | The girl holds fast to her word and the party gains 400 c.
      cells:
        roll:
          type: range
          printed: 2-3
          min: 2
          max: 3
        result:
          type: text
          printed: The girl holds fast to her word and the party gains 400 c.
    - id: priest_refusal
      source_row:
        4-5 | The priest manages to find out that you have withheld information and refuses to
        pay. Gaining the sympathy of the other priests, they collectively decide not to pay any
        rewards to the heroes.
      cells:
        roll:
          type: range
          printed: 4-5
          min: 4
          max: 5
        result:
          type: text
          printed:
            The priest manages to find out that you have withheld information and refuses to pay.
            Gaining the sympathy of the other priests, they collectively decide not to pay any
            rewards to the heroes.
    - id: curse
      source_row:
        6 | The priest manages to find out that you have withheld information and refuses to
        pay. Gaining the sympathy of the other priests, they collectively decide not to pay any
        rewards at all to the heroes. Furthermore, Metheia is not pleased with the hero’s actions
        and reduces your max Hit Points by 1, until the end of the next quest.
      cells:
        roll:
          type: number
          printed: '6'
          value: 6
          meaning: value
        result:
          type: text
          printed:
            The priest manages to find out that you have withheld information and refuses to pay.
            Gaining the sympathy of the other priests, they collectively decide not to pay any
            rewards at all to the heroes. Furthermore, Metheia is not pleased with the hero’s
            actions and reduces your max Hit Points by 1, until the end of the next quest.
