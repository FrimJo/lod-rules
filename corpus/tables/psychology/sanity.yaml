- id: table.psychology.mental_conditions
  name: Mental conditions
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: Mental conditions
  status: extracted
  confidence: high
  source_text: 1d10 / Condition / Effect
  type: random_table
  completeness: complete
  columns:
    - id: roll
      label: 1d10
      cell_types:
        - range
    - id: condition
      label: Condition
      cell_types:
        - text
    - id: effect
      label: Effect
      cell_types:
        - text
  rows:
    - id: hate
      source_row: '1'
      cells:
        roll:
          type: range
          printed: '1'
          min: 1
          max: 1
        condition:
          type: text
          printed: Hate
        effect:
          type: text
          printed:
            The hero gains the Hate Talent against the type of enemy last fought. This creature
            must appear in the Monster List of the Bestiary.
      rule_refs:
        - character.condition.hate
    - id: acute_stress
      source_row: 2-3
      cells:
        roll:
          type: range
          printed: 2-3
          min: 2
          max: 3
        condition:
          type: text
          printed: Acute Stress
        effect:
          type: text
          printed:
            RES reduced by 10 for the rest of the quest. The hero will scream uncontrollably during
            all battles, alerting every single soul in the dungeon. Threat Level is increased by
            an additional +1 for each battle from now until the end of the quest. This only
            lasts for the current quest.
      rule_refs:
        - character.condition.acute_stress
    - id: lingering_trauma
      source_row: '4'
      cells:
        roll:
          type: range
          printed: '4'
          min: 4
          max: 4
        condition:
          type: text
          printed: Lingering Trauma
        effect:
          type: text
          printed: The effect of this condition will not be evident until your next dungeon and only
            during a specific situation that in some way resembles or reminds the character of
            the situation that triggered the syndrome. See separate table below. Once the trauma
            kicks in, all Resolve Tests are at -10 and CS is at -10. Once triggered, it will
            last until you leave the dungeon.
      rule_refs:
        - character.condition.lingering_trauma
    - id: fear_of_the_dark
      source_row: '5'
      cells:
        roll:
          type: range
          printed: '5'
          min: 5
          max: 5
        condition:
          type: text
          printed: Fear of the Dark
        effect:
          type: text
          printed: The hero has developed an irrational fear of the dark and all Resolve Tests are at -10.
      rule_refs:
        - character.condition.fear_of_the_dark
    - id: arachnophobia
      source_row: '6'
      cells:
        roll:
          type: range
          printed: '6'
          min: 6
          max: 6
        condition:
          type: text
          printed: Arachnophobia
        effect:
          type: text
          printed: The hero finds all kinds of spiders terrifying. Treat all encounters as causing Terror.
      rule_refs:
        - character.condition.arachnophobia
    - id: jumpy
      source_row: '7'
      cells:
        roll:
          type: range
          printed: '7'
          min: 7
          max: 7
        condition:
          type: text
          printed: Jumpy
        effect:
          type: text
          printed:
            Every unsuspecting noise makes the hero jump and scream, startling the companions and
            alerting all dungeon dwellers to their presence. A Scenario roll of 10 means
            something has spooked the hero and the scream causes the Threat Level to increase by
            2.
      rule_refs:
        - character.condition.jumpy
    - id: irrational_fear
      source_row: '8'
      cells:
        roll:
          type: range
          printed: '8'
          min: 8
          max: 8
        condition:
          type: text
          printed: Irrational Fear
        effect:
          type: text
          printed:
            The hero becomes irrationally afraid of a specific type of monster. Randomize between
            Orcs and Goblins, Beasts, Undead, Reptiles, or Dark Elves. All monsters from that
            faction will now cause fear to the hero.
      rule_refs:
        - character.condition.irrational_fear
    - id: claustrophobia
      source_row: '9'
      cells:
        roll:
          type: range
          printed: '9'
          min: 9
          max: 9
        condition:
          type: text
          printed: Claustrophobia
        effect:
          type: text
          printed:
            The hero is troubled by tight spaces and becomes less effective. All skills and stats
            are at -10 in corridors.
      rule_refs:
        - character.condition.claustrophobia
    - id: depression
      source_row: '0'
      cells:
        roll:
          type: range
          printed: '0'
          min: 10
          max: 10
        condition:
          type: text
          printed: Depression
        effect:
          type: text
          printed: The hero is slowly worn down by the reoccurring horrors and falls into a state of
            depression. As a result, the energy pool of the character is reduced by 2.
      rule_refs:
        - character.condition.depression
  footnotes: []
  roll_domain:
    min: 1
    max: 10
