- id: table.magic.miscast
  name: 1d10 / Effect
  section_id: section.magic.casting_spells.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 65
      printed_page: 63
      section: Casting Spells
      heading: Miscast
      locator:
        table: Uncaptioned miscast table (1d10 / Effect)
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The wizard has seen or experienced something unworldly, and the caster must roll on the
    table below.
  type: random_table
  completeness: complete
  columns:
    - id: roll
      label: 1d10
      cell_types:
        - range
    - id: effect
      label: Effect
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: '1'
      cells:
        roll:
          type: range
          printed: '1'
          min: 1
          max: 1
        effect:
          type: text
          printed:
            Through luck or skill, the wizard manages to shape the spell and change the outcome at the
            very last second. Any DMG or Healing effect of the spell is maximized. Any other spell
            is cast without the need to spend any Mana.
    - id: row_2
      source_row: '2'
      cells:
        roll:
          type: range
          printed: '2'
          min: 2
          max: 2
        effect:
          type: text
          printed: The wizard consumes Mana as if the spell succeeded.
    - id: row_3
      source_row: '3'
      cells:
        roll:
          type: range
          printed: '3'
          min: 3
          max: 3
        effect:
          type: text
          printed:
            The Wizard loses control of the spell and it takes a tremendous effort to stop if from
            turning into a complete disaster. The Wizard loses 3 times the Mana cost for the spell.
    - id: row_4
      source_row: '4'
      cells:
        roll:
          type: range
          printed: '4'
          min: 4
          max: 4
        effect:
          type: text
          printed: The wizard’s mind is wracked by images of the void. The Wizard loses 1d3 point of Sanity.
    - id: row_5
      source_row: '5'
      cells:
        roll:
          type: range
          printed: '5'
          min: 5
          max: 5
        effect:
          type: text
          printed:
            The Wizard becomes unconscious and falls to the floor. The wizard must make a CON test at
            the start of his activation to see if he wakes up.
    - id: row_6
      source_row: '6'
      cells:
        roll:
          type: range
          printed: '6'
          min: 6
          max: 6
        effect:
          type: text
          printed:
            Confused, the Wizard realises he has forgotten the spell halfway through the casting. Mana
            is consumed just as a failed spell, and the Wizard is not allowed to use the spell again
            until he has rested in a tavern.
    - id: row_7
      source_row: '7'
      cells:
        roll:
          type: range
          printed: '7'
          min: 7
          max: 7
        effect:
          type: text
          printed:
            A searing pain shoots through the mind of the Wizard. He loses 1d6 HP with no armour or
            Natural Armour.
    - id: row_8
      source_row: '8'
      cells:
        roll:
          type: range
          printed: '8'
          min: 8
          max: 8
        effect:
          type: text
          printed:
            Visions of the Void is portrayed in the minds of all friendly characters within 3 squares.
            Not used to seeing this, all characters lose 1d8 points of Sanity and the Wizard loses
            1d3 points of Sanity.
    - id: row_9
      source_row: '9'
      cells:
        roll:
          type: range
          printed: '9'
          min: 9
          max: 9
        effect:
          type: text
          printed:
            The wizard manages to open a portal to the Void and Demons pour through. Roll on the Demon
            table to see what materialises.
    - id: row_10
      source_row: '10'
      cells:
        roll:
          type: range
          printed: '10'
          min: 10
          max: 10
        effect:
          type: text
          printed:
            A magic blast in unleashed from the Wizard, causing 1D10 DMG to any character within 3
            squares, ignoring armour and Natural armour.
  footnotes: []
  roll_domain:
    min: 1
    max: 10
