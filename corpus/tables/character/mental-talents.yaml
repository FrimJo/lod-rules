      label: Description
      cell_types:
        - text
  rows:
    - id: braveheart
      source_row: Braveheart
      cells:
        talent:
          type: text
          printed: Braveheart
        description:
          type: text
          printed: Your hero is braver than most. +10 bonus on Fear and Terror Tests.
      rule_refs:
        - character.talent.braveheart.fear_terror
    - id: confident
      source_row: Confident
      cells:
        talent:
          type: text
          printed: Confident
        description:
          type: text
          printed: No enemy or task is too difficult. Your hero gains a +5 bonus to the Resolve stat.
      rule_refs:
        - character.talent.confident.resolve
    - id: fearless
      source_row: Fearless
      cells:
        talent:
          type: text
          printed: Fearless
        description:
          type: text
          printed:
            Your hero is completely immune to the effects of fear and treats terror as fear. This
            talent requires that the hero already has the Braveheart Mental Talent.
      rule_refs:
        - character.talent.fearless.prerequisite
        - character.talent.fearless.effects
    - id: hate
      source_row: Hate
      cells:
        talent:
          type: text
          printed: Hate
        description:
          type: text
          printed:
            Through personal experience, or through the history of their kin, your hero has grown to
            hate certain enemies. This hate fuels their fighting, gaining a +5 bonus to CS when
            attacking those enemies. However, their hatred impairs their ability to parry and dodge
            (-5 parry/dodge) when struck by those enemies. The hero may choose one enemy to hate. If
            your hero hates goblins for instance, they hate every enemy with the word ‘Goblin’ in
            it. This Talent may be taken several times making the hero hate different enemies.
      rule_refs:
        - character.talent.hate.selection
        - character.talent.hate.attack
        - character.talent.hate.defence
    - id: strong_minded
      source_row: Strong-Minded
      cells:
        talent:
          type: text
          printed: Strong-Minded
        description:
          type: text
          printed:
            Your hero is less affected by the horrors of the dungeons than their comrades. The hero
            gains +1 Sanity Point.
      rule_refs:
        - character.talent.strong_minded.sanity
    - id: wise
      source_row: Wise
      cells:
        talent:
          type: text
          printed: Wise
        description:
          type: text
          printed: Your hero has plenty of life experience and may re-roll a failed WIS-test.
      rule_refs:
        - character.talent.wise.reroll
  footnotes: []
