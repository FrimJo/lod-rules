- id: table.talent.common
  name: Common Talents
  section_id: section.appendix_ii_talents.common_talents.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: common Talents
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Talent | Description
  type: reference_table
  completeness: complete
  columns:
    - id: talent
      label: Talent
      cell_types:
        - text
    - id: description
      label: Description
      cell_types:
        - text
  rows:
    - id: bard
      source_row: Bard
      cells:
        talent:
          type: text
          printed: Bard
        description:
          type: text
          printed: The hero gets a +10 WIS modifier when using instruments.
      rule_refs:
        - character.talent.bard.instruments
    - id: cartographer
      source_row: Cartographer
      cells:
        talent:
          type: text
          printed: Cartographer
        description:
          type: text
          printed:
            The hero is skilled at drawing maps. If the hero passes a WIS test before entering a
            dungeon, the exploration deck is set up using 2 cards less than noted in the quest.
            Remove one corridor and one room. No matter how many heroes uses this talent, no more
            than 2 cards can be removed.
      rule_refs:
        - character.talent.cartographer.exploration_deck
    - id: charming
      source_row: Charming
      cells:
        talent:
          type: text
          printed: Charming
        description:
          type: text
          printed:
            This hero seems to get along with everyone and always draws a smile from those to whom he
            talks. Well aware of this, the party lets this hero negotiate all rewards and gains +5%
            Reward Bonus on all quests.
      rule_refs:
        - character.talent.charming.reward_bonus
    - id: disciplined
      source_row: Disciplined
      cells:
        talent:
          type: text
          printed: Disciplined
        description:
          type: text
          printed:
            Thanks to a military background, this hero has an increased degree of calmness under
            pressure. This also spreads to the rest of the party. The hero gains +10 RES and the
            other members of the party gain +5 RES as long as the hero is not knocked out. The
            effect on the party is not cumulative if other heroes have the same talent. Furthermore,
            a hero with this talent will not benefit from the effect of this talent from another
            hero.
      rule_refs:
        - character.talent.disciplined.own_resolve
        - character.talent.disciplined.party_resolve
    - id: hunter
      source_row: Hunter
      cells:
        talent:
          type: text
          printed: Hunter
        description:
          type: text
          printed:
            The hero has a knack for finding wild game and knows how best to hunt them. The hero gains
            +10 to Foraging.
      rule_refs:
        - character.talent.hunter.foraging
    - id: lucky
      source_row: Lucky
      cells:
        talent:
          type: text
          printed: Lucky
        description:
          type: text
          printed: Some are just luckier than others. Everything seems to go your way. You gain +1 Luck Point.
      rule_refs:
        - character.talent.lucky.luck
    - id: master_cook
      source_row: Master Cook
      cells:
        talent:
          type: text
          printed: Master Cook
        description:
          type: text
          printed:
            During a rest, the party members will regain +2 extra HP if they have rations, due to your
            hero’s expert cooking skills. This is not cumulative if more than one hero has this
            Talent.
      rule_refs:
        - character.talent.master_cook.rest_healing
    - id: natural_leader
      source_row: Natural Leader
      cells:
        talent:
          type: text
          printed: Natural Leader
        description:
          type: text
          printed:
            The hero’s natural ability to lead will add +2 to the Party Moral permanently. This is not
            cumulative if more than one hero has this talent.
      rule_refs:
        - character.talent.natural_leader.party_morale
    - id: ringbearer
      source_row: Ringbearer
      cells:
        talent:
          type: text
          printed: Ringbearer
        description:
          type: text
          printed:
            Somehow, this hero has managed to tame the effect of magic imbued items. Instead of being
            limited to one ring, your hero can now use two rings simultaneously.
      rule_refs:
        - character.talent.ringbearer.ring_limit
    - id: survivalist
      source_row: Survivalist
      cells:
        talent:
          type: text
          printed: Survivalist
        description:
          type: text
          printed:
            This talent lets your hero forage one ration from any monster in the Beast category (in a
            dungeon or after a skirmish), as long as the Forage roll is successful.
      rule_refs:
        - character.talent.survivalist.beast_ration
    - id: swift_leader
      source_row: Swift Leader
      cells:
        talent:
          type: text
          printed: Swift Leader
        description:
          type: text
          printed:
            The party may always add one initiative token to the bag. This is only used to increase
            chance of activation and all heroes may still only act once per turn. This is not a
            cumulative effect so only 1 token will be added even if more than one hero has this
            talent.
      rule_refs:
        - character.talent.swift_leader.initiative
    - id: veteran
      source_row: Veteran
      cells:
        talent:
          type: text
          printed: Veteran
        description:
          type: text
          printed:
            Your hero’s your gear is in perfect order, making changes in equipment very easy. You can
            use equipment from a Quick Slot without spending an Action Point (once per turn).
      rule_refs:
        - character.talent.veteran.quick_slot
    - id: pathfinder
      source_row: Pathfinder
      cells:
        talent:
          type: text
          printed: Pathfinder
        description:
          type: text
          printed:
            The hero has a knack for finding good shelter during travels. All heroes get +1 HP when
            resting.
      rule_refs:
        - character.talent.pathfinder.rest_healing
    - id: pious
      source_row: Pious
      cells:
        talent:
          type: text
          printed: Pious
        description:
          type: text
          printed:
            Your hero has a strong connection to the Gods. The hero may use relics, even though he or
            she is not a Warrior Priest. This talent cannot be chosen by a Warrior Priest.
      rule_refs:
        - character.talent.pious.eligibility
        - character.talent.pious.relic_use
  footnotes: []
