  rows:
    - id: dispel_master
      source_row: Dispel Master
      cells:
        perk:
          type: text
          printed: Dispel Master
        effect:
          type: text
          printed: The wizard is very skilled in the art of countering enemy magic.
        comment:
          type: text
          printed: The wizard gets +20 Arcane Arts when rolling to dispel when this Perk is used.
      rule_refs:
        - character.perk.dispel_master.activation
        - character.perk.dispel_master.dispel
    - id: energy_to_mana
      source_row: Energy to Mana
      cells:
        perk:
          type: text
          printed: Energy to Mana
        effect:
          type: text
          printed:
            The wizard has the ability to turn energy into Mana. For each Energy Point spent, the
            wizard gains 20 Mana.
        comment:
          type: text
          printed: The wizard may spend any number of Energy Points.
      rule_refs:
        - character.perk.energy_to_mana.activation
    - id: inner_power
      source_row: Inner Power
      cells:
        perk:
          type: text
          printed: Inner Power
        effect:
          type: text
          printed: The wizard increases the power of their magic missiles, causing an extra 1d6 Damage.
        comment:
          type: text
          printed: Must be declared before the spell is cast.
      rule_refs:
        - character.perk.inner_power.activation
        - character.perk.inner_power.missile_damage
    - id: in_tune_with_the_magic
      source_row: In Tune with the Magic
      cells:
        perk:
          type: text
          printed: In Tune with the Magic
        effect:
          type: text
          printed:
            Caster may use Focus before trying to identify a Magic Item. However, when attuning to the
            magic in that way, their mind is open enough to risk their sanity.
        comment:
          type: text
          printed:
            Works just as if casting a spell but introduces miscast to the roll as well. 1 Action of
            Focus causes a miscast on 95-00. Increase the risk by 5 for each additional action.
      rule_refs:
        - character.perk.in_tune_with_the_magic.activation
        - character.perk.in_tune_with_the_magic.identification_focus
    - id: quick_focus
      source_row: Quick Focus
      cells:
        perk:
          type: text
          printed: Quick Focus
        effect:
          type: text
          printed:
            The wizard has the ability of extreme Focus, increasing the chance to succeed on a spell.
            Add +10 Arcane Arts Skill without spending an action on focus. Risk for a miscast is
            still increased by 5.
        comment:
          type: text
          printed: Used at the same time as casting a spell. Only lasts for that spell.
      rule_refs:
        - character.perk.quick_focus.activation
        - character.perk.quick_focus.spell
  footnotes: []
