        - text
  rows:
    - id: expert_mixer
      source_row: Expert Mixer
      cells:
        talent:
          type: text
          printed: Expert Mixer
        description:
          type: text
          printed:
            The Alchemist is a master of mixing offensive potions. All throwable potions that cause
            damage gets a +1DMG on every target.
      rule_refs:
        - character.talent.expert_mixer.eligibility
        - character.talent.expert_mixer.damage
    - id: gatherer
      source_row: Gatherer
      cells:
        talent:
          type: text
          printed: Gatherer
        description:
          type: text
          printed:
            Finding good ingredients in the wild comes naturally to the hero. +10 Alchemy when
            searching for ingredients in the wild.
      rule_refs:
        - character.talent.gatherer.eligibility
        - character.talent.gatherer.ingredients
    - id: harvester
      source_row: Harvester
      cells:
        talent:
          type: text
          printed: Harvester
        description:
          type: text
          printed:
            With precise incisions, the hero can harvest good quality components from fallen enemies.
            +10 Alchemy when harvesting parts.
      rule_refs:
        - character.talent.harvester.eligibility
        - character.talent.harvester.parts
    - id: keen_eye
      source_row: Keen Eye
      cells:
        talent:
          type: text
          printed: Keen Eye
        description:
          type: text
          printed:
            The Alchemist has a keen eye when it comes to finding ingredients. The hero may reroll the
            result when rolling to see what has been gathered. The second result stands.
      rule_refs:
        - character.talent.keen_eye.eligibility
        - character.talent.keen_eye.gathered_result_reroll
    - id: master_healer
      source_row: Master Healer
      cells:
        talent:
          type: text
          printed: Master Healer
        description:
          type: text
          printed:
            This hero has perfected the art of making Healing Potions. All potions brewed heal +2 Hit
            Points more than normal.
      rule_refs:
        - character.talent.master_healer.eligibility
        - character.talent.master_healer.healing_potion
    - id: perfect_toss
      source_row: Perfect Toss
      cells:
        talent:
          type: text
          printed: Perfect Toss
        description:
          type: text
          printed:
            The hero has a knack for lobbing bottles in a perfect arc over friends and foes alike. +10
            RS when lobbing a potion over the heads of others.
      rule_refs:
        - character.talent.perfect_toss.eligibility
        - character.talent.perfect_toss.lobbed_potion
    - id: poisoner
      source_row: Poisoner
      cells:
        talent:
          type: text
          printed: Poisoner
        description:
          type: text
          printed:
            The hero is very adept at making all sorts of poisons. Poisons created by this hero always
            inflict 2 additional Hit Point per turn.
      rule_refs:
        - character.talent.poisoner.eligibility
        - character.talent.poisoner.poison_damage
    - id: powerful_potions
      source_row: Powerful Potions
      cells:
        talent:
          type: text
          printed: Powerful Potions
        description:
          type: text
          printed:
            The strength of this hero’s potions is remarkable. All basic stat (Not M) enhancing potions
            grant an additional +5 bonus.
      rule_refs:
        - character.talent.powerful_potions.eligibility
        - character.talent.powerful_potions.stat_potion
  footnotes: []
