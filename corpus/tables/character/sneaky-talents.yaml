- id: table.talent.sneaky
  name: Sneaky Talents
  section_id: section.appendix_ii_talents.sneaky_talents.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 177
      printed_page: 175
      heading: sneaky Talents
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Talent | Description
  type: reference_table
  completeness: complete
  columns:
    - id: talent
      label: Talent
      cell_types:
        - text
    - id: description
      label: Description
      cell_types:
        - text
  rows:
    - id: assassin
      source_row: Assassin
      cells:
        talent:
          type: text
          printed: Assassin
        description:
          type: text
          printed:
            With uncanny precision, the hero automatically hits any target from behind with a class 1
            or 2 weapon.
      rule_refs:
        - character.talent.assassin.automatic_hit
    - id: backstabber
      source_row: Backstabber
      cells:
        talent:
          type: text
          printed: Backstabber
        description:
          type: text
          printed:
            Accustomed to optimising the odds, your hero ignores enemy armour and NA when attacking
            from behind.
      rule_refs:
        - character.talent.backstabber.ignore_armour
    - id: cutpurse
      source_row: Cutpurse
      cells:
        talent:
          type: text
          printed: Cutpurse
        description:
          type: text
          printed:
            Once per visit in a settlement, your hero may try to steal the purse from some unsuspecting
            victim. This must be done as the first thing when entering a settlement. Roll 1d6. On a
            result of 1-2 the hero gains 1d100 coins. On a result of 6, the attempt is detected, and
            the hero is immediately chased out of the settlement. The hero may do nothing until the
            rest of the party decides to leave the settlement. Rations must be used as normal, and
            if rations are lacking, the hero becomes hungry. Foraging is allowed while waiting.
      rule_refs:
        - character.talent.cutpurse.attempt
        - character.talent.cutpurse.success
        - character.talent.cutpurse.detected
        - character.talent.cutpurse.hunger
    - id: evaluate
      source_row: Evaluate
      cells:
        talent:
          type: text
          printed: Evaluate
        description:
          type: text
          printed:
            Your hero has a good sense for the value of things. A successful Barter Roll will give your
            hero +15% instead of the usual +10%.
      rule_refs:
        - character.talent.evaluate.barter
    - id: lockpicker
      source_row: Lockpicker
      cells:
        talent:
          type: text
          printed: Lockpicker
        description:
          type: text
          printed: No lock seems to hinder this hero. The hero may re-roll a failed lockpick attempt.
      rule_refs:
        - character.talent.lockpicker.reroll
    - id: mechanical_genius
      source_row: Mechanical Genius
      cells:
        talent:
          type: text
          printed: Mechanical Genius
        description:
          type: text
          printed:
            Your hero is a master at understanding mechanical contraptions and gains +10 when disarming
            traps.
      rule_refs:
        - character.talent.mechanical_genius.disarm
    - id: nimble
      source_row: Nimble
      cells:
        talent:
          type: text
          printed: Nimble
        description:
          type: text
          printed: The hero may dodge twice per battle instead of only once.
      rule_refs:
        - character.talent.nimble.dodge_limit
    - id: quick_fingers
      source_row: Quick Fingers
      cells:
        talent:
          type: text
          printed: Quick Fingers
        description:
          type: text
          printed:
            Accustomed to working under pressure, your hero has mastered the skill of reading a lock
            and picking it. Picking a lock now takes 1 AP instead of 2.
      rule_refs:
        - character.talent.quick_fingers.lockpick_cost
    - id: sharp_eyed
      source_row: Sharp-eyed
      cells:
        talent:
          type: text
          printed: Sharp-eyed
        description:
          type: text
          printed:
            Your hero has an extreme sense for details and can easily notice anything out of the
            ordinary. Your hero gains a +10 bonus on Perception Tests.
      rule_refs:
        - character.talent.sharp_eyed.perception
    - id: sense_for_gold
      source_row: Sense for Gold
      cells:
        talent:
          type: text
          printed: Sense for Gold
        description:
          type: text
          printed:
            It seems this hero can almost smell their way to treasures. When rolling on the Furniture
            Table for treasures, the hero may subtract -1 on the roll.
      rule_refs:
        - character.talent.sense_for_gold.printed_adjustment
    - id: shadow_walker
      source_row: Shadow walker
      cells:
        talent:
          type: text
          printed: Shadow walker
        description:
          type: text
          printed:
            Your hero seems to always blend into the shadows. Moving almost unseen, the hero ignores
            movement restrictions due to enemy ZOC.
      rule_refs:
        - character.talent.shadow_walker.movement
    - id: streetwise
      source_row: Streetwise
      cells:
        talent:
          type: text
          printed: Streetwise
        description:
          type: text
          printed:
            Your hero knows who to ask to acquire the gear they search for. Every roll this hero makes
            for availability may be modified by -1. This Talent can only be taken by a Rogue.
      rule_refs:
        - character.talent.streetwise.eligibility
        - character.talent.streetwise.availability
    - id: trapfinder
      source_row: Trapfinder
      cells:
        talent:
          type: text
          printed: Trapfinder
        description:
          type: text
          printed:
            Your hero is an expert at dealing with traps. Your hero gains a +10 PER bonus when
            detecting traps. This is cumulative with Sharp-eyed.
      rule_refs:
        - character.talent.trapfinder.detection
  footnotes: []
