      source_row: Sustainer
      cells:
        talent:
          type: text
          printed: Sustainer
        description:
          type: text
          printed: Upkeep for the wizard’s spells is reduced by 1.
      rule_refs:
        - character.talent.sustainer.eligibility
        - character.talent.sustainer.upkeep
