    - id: blood_magic
      source_row: Blood Magic
      cells:
        talent:
          type: text
          printed: Blood Magic
        description:
          type: text
          printed:
            The wizard can spend his own life blood to create Mana. For every 2 HP spent, the wizard
            gains 5 Mana. This transformation can be done for free during the wizard’s turn.
      rule_refs:
        - character.talent.blood_magic.eligibility
        - character.talent.blood_magic.conversion
    - id: conjurer
      source_row: Conjurer
      cells:
        talent:
          type: text
          printed: Conjurer
        description:
          type: text
          printed:
            The wizard is an expert conjurer and gains +5 Arcane Arts whenever casting a Conjuration
            Spell. Furthermore, the Mana cost for such a spell is reduced by 5.
      rule_refs:
        - character.talent.conjurer.eligibility
        - character.talent.conjurer.school_spell
    - id: divinator
      source_row: Divinator
      cells:
        talent:
          type: text
          printed: Divinator
        description:
          type: text
          printed:
            The wizard gets +5 Arcane Arts whenever casting a Divination Spell. Furthermore, the Mana
            cost for such a spell is reduced by 5.
      rule_refs:
        - character.talent.divinator.eligibility
        - character.talent.divinator.school_spell
    - id: fast_reflexes
      source_row: Fast Reflexes
      cells:
        talent:
          type: text
          printed: Fast Reflexes
        description:
          type: text
          printed:
            With lightning-fast reflexes, your hero can reach out and touch your enemies when casting
            spells. Your hero gains a +15 Combat Skill Bonus when casting Touch Spells.
      rule_refs:
        - character.talent.fast_reflexes.eligibility
        - character.talent.fast_reflexes.touch_spell
    - id: focused
      source_row: Focused
      cells:
        talent:
          type: text
          printed: Focused
        description:
          type: text
          printed:
            Well attuned to the void, your hero is adept at tapping into it to gain maximum power. Your
            hero gets +15 Arcane Arts when focusing.
      rule_refs:
        - character.talent.focused.eligibility
        - character.talent.focused.focus
    - id: persistent
      source_row: Persistent
      cells:
        talent:
          type: text
          printed: Persistent
        description:
          type: text
          printed: Your hero gains a permanent +15 Mana.
      rule_refs:
        - character.talent.persistent.eligibility
        - character.talent.persistent.mana
    - id: restorer
      source_row: Restorer
      cells:
        talent:
          type: text
          printed: Restorer
        description:
          type: text
          printed:
            Restoration spells are the favourite spells of your hero, and this results in all Healing
            Spells healing +2 Hit Points in addition to the spell’s normal result. You cannot have
            this talent at the same time as you have the Necromancer Talent.
      rule_refs:
        - character.talent.restorer.eligibility
        - character.talent.restorer.healing
        - character.talent.restorer.excludes_necromancer
    - id: mystic
      source_row: Mystic
      cells:
        talent:
          type: text
          printed: Mystic
        description:
          type: text
          printed:
            The wizard is truly skilled with Mysticism Spells and gets +5 Arcane Arts whenever casting
            a Mysticism Spell. Furthermore, the Mana cost for such a spell is reduced by 5.
      rule_refs:
        - character.talent.mystic.eligibility
        - character.talent.mystic.school_spell
    - id: necromancer
      source_row: Necromancer
      cells:
        talent:
          type: text
          printed: Necromancer
        description:
          type: text
          printed:
            The hero gets +5 Arcane Arts whenever casting a Necromantic Spell. Furthermore, the Mana
            cost for such a spell is reduced by 5. You cannot have this Talent at the same time as
            you have the Restorer Talent.
      rule_refs:
        - character.talent.necromancer.eligibility
        - character.talent.necromancer.school_spell
        - character.talent.necromancer.excludes_restorer
    - id: powerful_missiles
      source_row: Powerful Missiles
      cells:
        talent:
          type: text
          printed: Powerful Missiles
        description:
          type: text
          printed:
            Your hero has perfected the use of Magic Missiles, knowing where to aim for maximum effect.
            Magic Missile Spells do +1 Damage.
      rule_refs:
        - character.talent.powerful_missiles.eligibility
        - character.talent.powerful_missiles.damage
    - id: summoner
      source_row: Summoner
      cells:
        talent:
          type: text
          printed: Summoner
        description:
          type: text
          printed:
            Reaching into other realms and bringing other beings to their aid has become easier with
            years of practice. Creatures summoned by the Wizard will stay 2 turns longer than
            normally allowed by the Wizard’s CL.
      rule_refs:
        - character.talent.summoner.eligibility
        - character.talent.summoner.duration
