  rows:
    - id: catlike
      source_row: Catlike
      cells:
        talent:
          type: text
          printed: Catlike
        description:
          type: text
          printed: Your hero moves with grace and has almost supernatural balance. Your hero gains +5 DEX.
      rule_refs:
        - character.talent.catlike.stat_bonus
    - id: fast
      source_row: Fast
      cells:
        talent:
          type: text
          printed: Fast
        description:
          type: text
          printed: Your hero moves unusually fast and gains a permanent +1 bonus to their Movement stat.
      rule_refs:
        - character.talent.fast.movement
    - id: mule
      source_row: Mule
      cells:
        talent:
          type: text
          printed: Mule
        description:
          type: text
          printed:
            Your hero is used to carry heavy equipment during long travels. Your hero can carry 20 ENC
            more than the STR value would allow.
      rule_refs:
        - character.talent.mule.carrying_capacity
    - id: night_vision
      source_row: Night Vision
      cells:
        talent:
          type: text
          printed: Night Vision
        description:
          type: text
          printed:
            Your hero’s species has the natural ability to see in the dark and is not affected by
            darkness. A hero with Night Vision gets +10 on Perception. This talent can only be given
            to a newly-created character that has this talent listed in the Species Description.
      rule_refs:
        - character.talent.night_vision.darkness
        - character.talent.night_vision.perception
        - character.talent.night_vision.eligibility
    - id: observant
      source_row: Observant
      cells:
        talent:
          type: text
          printed: Observant
        description:
          type: text
          printed:
            Rangers only. Used to camping in dangerous places, a Ranger with this talent will convey a
            -10 modifier to the risk of an ambush during a rest in a dungeon. Furthermore, all
            members of the party will always start all battles standing up even if the quest or
            rules states otherwise. Any extra enemy initiative tokens due to a surprise or ambush is
            also negated by this talent.
      rule_refs:
        - character.talent.observant.eligibility
        - character.talent.observant.rest_ambush
        - character.talent.observant.standing_start
        - character.talent.observant.ambush_tokens
    - id: perfect_hearing
      source_row: Perfect Hearing
      cells:
        talent:
          type: text
          printed: Perfect Hearing
        description:
          type: text
          printed:
            Your hero’s hearing is exceptionally good, and and you may add 1 hero initiative token to
            the first round of battle after opening a door and encountering enemies. This cannot be
            used if the door was broken down. This talent can only be given to a newly created
            character that has this Talent listed in the Species Description.
      rule_refs:
        - character.talent.perfect_hearing.initiative
        - character.talent.perfect_hearing.eligibility
    - id: resilient
      source_row: Resilient
      cells:
        talent:
          type: text
          printed: Resilient
        description:
          type: text
          printed: Your hero’s brawny physique grants a +5 bonus to the Constitution stat.
      rule_refs:
        - character.talent.resilient.stat_bonus
    - id: resistance_to_disease
      source_row: Resistance to Disease
      cells:
        talent:
          type: text
          printed: Resistance to Disease
        description:
          type: text
          printed:
            Your hero seems to have a natural ability to resist diseases. Your hero gets a +25 bonus on
            Constitution Tests to resist disease.
      rule_refs:
        - character.talent.resistance_to_disease.constitution_test
    - id: resistance_to_poison
      source_row: Resistance to Poison
      cells:
        talent:
          type: text
          printed: Resistance to Poison
        description:
          type: text
          printed:
            Your hero seems to have a natural ability to resist poison. Your hero gets a +25 bonus on
            Constitution Tests to resist poison.
      rule_refs:
        - character.talent.resistance_to_poison.constitution_test
    - id: strong
      source_row: Strong
      cells:
        talent:
          type: text
          printed: Strong
        description:
          type: text
          printed: Your hero’s exercises have paid off and your hero gains a +5 bonus to the Strength stat.
      rule_refs:
        - character.talent.strong.stat_bonus
    - id: strong_build
      source_row: Strong Build
      cells:
        talent:
          type: text
          printed: Strong Build
        description:
          type: text
          printed: Your hero gains a +2 bonus to the Hit Points stat.
      rule_refs:
        - character.talent.strong_build.stat_bonus
    - id: tank
      source_row: Tank
      cells:
        talent:
          type: text
          printed: Tank
        description:
          type: text
          printed:
            Wearing heavy armour has little effect on your hero’s ability to move. The hero ignores the
            Clunky Special Rule.
      rule_refs:
        - character.talent.tank.clunky
  footnotes: []
  issues:
    - issue.0011
- id: table.talent.combat_pilot
  name: Combat Talents
  section_id: section.appendix_ii_talents.combat_talents.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 171
      pdf_page: 173
      heading: Combat Talents
      locator:
        table: Combat Talents
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Talent | Description
  type: reference_table
  completeness: complete
  columns:
    - id: talent
      label: Talent
      cell_types:
        - text
    - id: description
      label: Description
      cell_types:
        - text
  rows:
    - id: axeman
      source_row: Axeman
      cells:
        talent:
          type: text
          printed: Axeman
        description:
          type: text
          printed:
            Preferring the balance of a good axe, this hero has become a master of using this weapon.
            Bloodlust is now triggered on a result of 1-10 when using all kinds of axes.
      rule_refs:
        - character.talent.axeman.bloodlust
    - id: bruiser
      source_row: Bruiser
      cells:
        talent:
          type: text
          printed: Bruiser
        description:
          type: text
          printed:
            The hero excels at fighting with blunt weapons and Bloodlust is now triggered on a result
            of 1-10 when using all kinds of hammers, flails, staffs, and morning stars.
      rule_refs:
        - character.talent.bruiser.bloodlust
    - id: death_lament
      source_row: Death Lament
      cells:
        talent:
          type: text
          printed: Death Lament
        description:
          type: text
          printed:
            'When others fall, this hero still stands, refusing to give in. Each time your hero is
            reduced to 0 Hit Points, roll 1d6: on a result of 1-3, the hero regains 1 Hit Point.'
      rule_refs:
        - character.talent.death_lament.recover
    - id: disarm
      source_row: Disarm
      cells:
        talent:
          type: text
          printed: Disarm
        description:
          type: text
          printed:
            This is a special attack, using the target's DEX as a negative modifier to the attack. If
            the attack succeeds it inflicts no damage, but causes the enemy to drop their weapon.
            The enemy must spend their next action trying to pick it up. In order to do so, the
            enemy has to succeed with a DEX Test. The enemy will continue until successful. If the
            hero’s attack fails, nothing happens. This can only be used on enemies that are carrying
            weapons.
      rule_refs:
        - character.talent.disarm.eligibility
        - character.talent.disarm.attack_modifier
        - character.talent.disarm.successful_disarm
    - id: dual_wield
      source_row: Dual Wield
      cells:
        talent:
          type: text
          printed: Dual Wield
        description:
          type: text
          printed:
            This talent requires a DEX of 60. Any hero with this talent may use a weapon with the Dual
            Wield Special Rule in their offhand. The attacks are still done as usual with the main
            weapon, but any hit will add +X DMG to the target. The X is defined in the Weapon Table.
            Parrying with two weapons is also easier, and any parry while using two weapons has a +5
            modifier.
      rule_refs:
        - character.talent.dual_wield.eligibility
        - character.talent.dual_wield.offhand_weapon
        - character.talent.dual_wield.damage
        - character.talent.dual_wield.parry
    - id: fast_reload
      source_row: Fast Reload
      cells:
        talent:
          type: text
          printed: Fast Reload
        description:
          type: text
          printed:
            Years of practice makes your hero faster than most and they can reload in the blink of an
            eye. Bows and sling can be reloaded in the same action as shooting once per turn.
            Crossbows can be reloaded in 1 action and fired in the next. An Arbalest can be reloaded
            in 2 actions, and fired in the next turn.
      rule_refs:
        - character.talent.fast_reload.bow_sling
        - character.talent.fast_reload.crossbow
        - character.talent.fast_reload.arbalest
    - id: lethal_shot
      source_row: Lethal shot
      cells:
        talent:
          type: text
          printed: Lethal shot
        description:
          type: text
          printed: Your hero always seems to hit the perfect spot. +2DMG with all ranged weapons.
      rule_refs:
        - character.talent.lethal_shot.damage
    - id: marksman
      source_row: Marksman
      cells:
        talent:
          type: text
          printed: Marksman
        description:
          type: text
          printed:
            Fighting with ranged weapons comes naturally to your hero. Bloodlust is now triggered on a
            result of 1-10 when using all kinds of ranged weapons.
      rule_refs:
        - character.talent.marksman.bloodlust
    - id: mighty_blow
      source_row: Mighty Blow
      cells:
        talent:
          type: text
          printed: Mighty Blow
        description:
          type: text
          printed:
            Your hero is an expert at finding the weak spots of the enemy. Your hero gets a +1 bonus on
            Damage Rolls with melee weapons.
      rule_refs:
        - character.talent.mighty_blow.damage
    - id: parry_master
      source_row: Parry Master
      cells:
        talent:
          type: text
          printed: Parry Master
        description:
          type: text
          printed:
            Your hero is adept at protection with a weapon. If the hero is in the Parry Stance, they
            may parry twice with a weapon during one turn.
      rule_refs:
        - character.talent.parry_master.parry_limit
    - id: perfect_shot
      source_row: Perfect Shot
      cells:
        talent:
          type: text
          printed: Perfect Shot
        description:
          type: text
          printed:
            Identifying the weak spots in enemy armour can sometimes make the difference when firing an
            arrow or bolt from afar. If the Damage Roll is odd, your hero ignores armour (But not
            NA).
      rule_refs:
        - character.talent.perfect_shot.armour
    - id: riposte_master
      source_row: Riposte Master
      cells:
        talent:
          type: text
          printed: Riposte Master
        description:
          type: text
          printed:
            When successfully parrying a strike with a weapon, the hero may automatically cause 2
            Points of Damage to that Enemy, ignoring Armour and NA. May only be done with weapons of
            class 3 or lower.
      rule_refs:
        - character.talent.riposte_master.riposte
    - id: sniper
      source_row: Sniper
      cells:
        talent:
          type: text
          printed: Sniper
        description:
          type: text
          printed:
            With practised ease, your hero cannot seem to miss when taking careful aim. The aim action
            gives your hero a +15 modifier instead of +10.
      rule_refs:
        - character.talent.sniper.aim
    - id: swordsman
      source_row: Swordsman
      cells:
        talent:
          type: text
          printed: Swordsman
        description:
          type: text
          printed:
            This hero is very skilled with a blade and Bloodlust is now triggered on a result of 1-10
            when using all types of swords.
      rule_refs:
        - character.talent.swordsman.bloodlust
    - id: tight_grip
      source_row: Tight Grip
      cells:
        talent:
          type: text
          printed: Tight Grip
        description:
          type: text
          printed:
            With unusually strong hands, the hero may add +10 STR when calculating what weapon class
            they can use.
      rule_refs:
        - character.talent.tight_grip.weapon_strength
    - id: tunnel_fighter
      source_row: Tunnel Fighter
      cells:
        talent:
          type: text
          printed: Tunnel Fighter
        description:
          type: text
          printed: Your hero is accustomed to fighting in tight spaces. +10 CS when fighting in a corridor.
      rule_refs:
        - character.talent.tunnel_fighter.corridor
  footnotes: []
  issues:
    - issue.0011
