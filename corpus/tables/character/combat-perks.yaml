  rows:
    - id: battle_fury
      source_row: Battle Fury
      cells:
        perk:
          type: text
          printed: Battle Fury
        effect:
          type: text
          printed:
            Using their inner energy, your hero may perform 2 Power Attacks in one turn as if they only
            cost 1 AP.
        comment:
          type: blank
          printed: ''
      rule_refs:
        - character.perk.battle_fury.activation
        - character.perk.battle_fury.power_attacks
    - id: deadly_strike
      source_row: Deadly Strike
      cells:
        perk:
          type: text
          printed: Deadly Strike
        effect:
          type: text
          printed: Adds +25 CS to your next attack.
        comment:
          type: blank
          printed: ''
      rule_refs:
        - character.perk.deadly_strike.activation
        - character.perk.deadly_strike.next_attack
    - id: frenzy
      source_row: Frenzy
      cells:
        perk:
          type: text
          printed: Frenzy
        effect:
          type: text
          printed:
            Working into a frenzy, your hero flails wildly at their enemies. For each standard attack
            that damages the enemy, the hero may make one more standard attack for free. This attack
            does not have to be at the same target. While frenzied, all attacks have AP (1) which is
            cumulative with any other AP bonus. The hero may only move or attack and may do nothing
            else, including parrying, dodging or using potions.
        comment:
          type: text
          printed:
            Barbarians only. Lasts for two turns. That means a maximum of 8 attacks can be done over
            the two Frenzied turns.
      rule_refs:
        - character.perk.frenzy.activation
        - character.perk.frenzy.eligibility
        - character.perk.frenzy.limits
        - character.perk.frenzy.bonus_attack
    - id: hunters_eye
      source_row: Hunter’s Eye
      cells:
        perk:
          type: text
          printed: Hunter’s Eye
        effect:
          type: text
          printed:
            Your hero may shoot two arrows when performing a Ranged Attack with a bow. Both arrows must
            target the same enemy. Roll for each attack separately.
        comment:
          type: text
          printed: Can only be activated when using a bow or a sling.
      rule_refs:
        - character.perk.hunters_eye.activation
        - character.perk.hunters_eye.bow_attack
        - character.perk.hunters_eye.eligibility
    - id: perfect_aim
      source_row: Perfect Aim
      cells:
        perk:
          type: text
          printed: Perfect Aim
        effect:
          type: text
          printed: Your hero’s aim is spot on. Add +25 to RS on your next Ranged Attack.
        comment:
          type: blank
          printed: ''
      rule_refs:
        - character.perk.perfect_aim.activation
        - character.perk.perfect_aim.next_ranged_attack
    - id: powerful_blow
      source_row: Powerful Blow
      cells:
        perk:
          type: text
          printed: Powerful Blow
        effect:
          type: text
          printed: Your hero attacks with all their strength, causing 1d6 extra damage.
        comment:
          type: text
          printed: Must be decided before the attack is made.
      rule_refs:
        - character.perk.powerful_blow.activation
        - character.perk.powerful_blow.damage
    - id: shield_bash
      source_row: Shield Bash
      cells:
        perk:
          type: text
          printed: Shield Bash
        effect:
          type: text
          printed:
            Push one enemy of the same size or smaller one square using CS. Target must make a
            Dexterity Test or fall over, spending its next action to stand again. Hero may occupy
            target’s square afterwards.
        comment:
          type: text
          printed: Flyers are immune. Requires a Heater or Tower shield.
      rule_refs:
        - character.perk.shield_bash.activation
        - character.perk.shield_bash.eligibility
        - character.perk.shield_bash.fall
    - id: shield_wall
      source_row: Shield Wall
      cells:
        perk:
          type: text
          printed: Shield Wall
        effect:
          type: text
          printed:
            Years of training lets your hero handle that shield like a pro. You may parry twice during
            one turn while in Parry Stance.
        comment:
          type: text
          printed: May be used when attacked.
      rule_refs:
        - character.perk.shield_wall.activation
        - character.perk.shield_wall.parry
    - id: stunning_strike
      source_row: Stunning Strike
      cells:
        perk:
          type: text
          printed: Stunning Strike
        effect:
          type: text
          printed:
            Your hero may choose to stun the enemy instead of inflicting wounds. Your hero performs a
            Standard Attack with a -10 CS penalty and if the attack is successful, the enemy may
            perform NO actions during its next turn.
        comment:
          type: text
          printed: Only melee weapons. Does not work on X-Large creatures and Large creatures only lose 1 AP.
      rule_refs:
        - character.perk.stunning_strike.activation
        - character.perk.stunning_strike.attack
        - character.perk.stunning_strike.large
        - character.perk.stunning_strike.other_size
  footnotes: []
