      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 170
      printed_page: 168
      heading: sneaky Perks
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Perk | Effect | Comment
  type: reference_table
  completeness: complete
  columns:
    - id: perk
      label: Perk
      cell_types:
        - text
    - id: effect
      label: Effect
      cell_types:
        - text
    - id: comment
      label: Comment
      cell_types:
        - text
        - blank
  rows:
    - id: clever_fingers
      source_row: Clever Fingers
      cells:
        perk:
          type: text
          printed: Clever Fingers
        effect:
          type: text
          printed:
            Relying on experience, the hero’s fingers dance across the mechanism. Add +25 bonus to a
            single pick lock or disarming trap attempt.
        comment:
          type: text
          printed: Use before rolling.
      rule_refs:
        - character.perk.clever_fingers.activation
        - character.perk.clever_fingers.bonus
    - id: hide_in_the_shadows
      source_row: Hide in the Shadows
      cells:
        perk:
          type: text
          printed: Hide in the Shadows
        effect:
          type: text
          printed:
            Your hero finds that perfect spot to avoid drawing attention. No enemy targets them if they
            are more than 2 squares away when the enemy starts their turn. If your model is adjacent
            to an enemy, that enemy always attacks another adjacent model if there is one. If not,
            the Perk does not work.
        comment:
          type: blank
          printed: ''
      rule_refs:
        - character.perk.hide_in_the_shadows.activation
        - character.perk.hide_in_the_shadows.distant
        - character.perk.hide_in_the_shadows.adjacent
    - id: living_on_nothing
      source_row: Living on Nothing
      cells:
        perk:
          type: text
          printed: Living on Nothing
        effect:
          type: text
          printed:
            Accustomed to hardship, your hero can sustain themselves on almost nothing. Spending an
            Energy Point to activate this Perk is considered the same as consuming a ration.
        comment:
          type: text
          printed: The Energy Point cannot be regained in the same rest in which it was spent.
      rule_refs:
        - character.perk.living_on_nothing.activation
        - character.perk.living_on_nothing.ration
    - id: loot_goblin
      source_row: Loot Goblin
      cells:
        perk:
          type: text
          printed: Loot Goblin
        effect:
          type: text
          printed:
            Whenever told to roll for an amount of gold, your hero may decide to re-roll the result
            once.
        comment:
          type: text
          printed: The decision to use this Perk is done after the first dice roll. Second result will stand.
      rule_refs:
        - character.perk.loot_goblin.activation
        - character.perk.loot_goblin.reroll
    - id: lucky_git
      source_row: Lucky Git
      cells:
        perk:
          type: text
          printed: Lucky Git
        effect:
          type: text
          printed: As always, lady fortune is smiling at your hero. Reduce the Threat Level by 2.
        comment:
          type: blank
          printed: ''
      rule_refs:
        - character.perk.lucky_git.activation
        - character.perk.lucky_git.threat
    - id: quick_dodge
      source_row: Quick Dodge
      cells:
        perk:
          type: text
          printed: Quick Dodge
        effect:
          type: text
          printed:
            Quick reflexes may make all the difference. Hero may dodge, even if the normal dodge is
            expended.
        comment:
          type: text
          printed: May be used when attacked.
      rule_refs:
        - character.perk.quick_dodge.activation
        - character.perk.quick_dodge.extra_dodge
    - id: strike_to_injure
      source_row: Strike to Injure
      cells:
        perk:
          type: text
          printed: Strike to Injure
        effect:
          type: text
          printed:
            Your hero targets the enemy with extreme precision, striking the most vulnerable area.
            Ignore the enemy’s armour for all your attacks this turn.
        comment:
          type: text
          printed: Must be declared before attacking.
      rule_refs:
        - character.perk.strike_to_injure.activation
        - character.perk.strike_to_injure.armour
  footnotes: []
