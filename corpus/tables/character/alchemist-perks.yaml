- id: table.perk.alchemist
  name: alchemist Perks
  section_id: section.appendix_i_perks.alchemist_perks.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: alchemist Perks
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Perk | Effect | Comment
  type: reference_table
  completeness: complete
  columns:
    - id: perk
      label: Perk
      cell_types:
        - text
    - id: effect
      label: Effect
      cell_types:
        - text
    - id: comment
      label: Comment
      cell_types:
        - text
        - blank
  rows:
    - id: careful_touch
      source_row: Careful Touch
      cells:
        perk:
          type: text
          printed: Careful Touch
        effect:
          type: text
          printed:
            By taking a little extra time, that specific specimen can be perfect. Chance of getting an
            Exquisite Ingredient or Part is increased to 20.
        comment:
          type: text
          printed: Declare before harvesting or gathering.
      rule_refs:
        - character.perk.careful_touch.activation
        - character.perk.careful_touch.quality
    - id: connoisseur
      source_row: Connoisseur
      cells:
        perk:
          type: text
          printed: Connoisseur
        effect:
          type: text
          printed:
            The alchemist has a knack for identifying potions brewed by others. Grants a +10 bonus to
            the Alchemy roll on your next attempt to identify a potion (only one per Energy Point).
        comment:
          type: text
          printed: Energy Point is spent at the same time as you try to identify the potion.
      rule_refs:
        - character.perk.connoisseur.activation
        - character.perk.connoisseur.identify
    - id: perfect_healer
      source_row: Perfect Healer
      cells:
        perk:
          type: text
          printed: Perfect Healer
        effect:
          type: text
          printed:
            Your hero's perfect mixing increases the potency of their potions. Their Healing Potion
            heals +3 HP.
        comment:
          type: text
          printed: Used at the same time as the potion is mixed.
      rule_refs:
        - character.perk.perfect_healer.activation
        - character.perk.perfect_healer.healing_potion
    - id: pitcher
      source_row: Pitcher
      cells:
        perk:
          type: text
          printed: Pitcher
        effect:
          type: text
          printed:
            With that extra second to aim, your alchemist can throw a bottle with a perfect arc. Grants
            a +10 RS bonus to your next attempt to throw a potion.
        comment:
          type: text
          printed: Only lasts for one potion and must be declared before throwing.
      rule_refs:
        - character.perk.pitcher.activation
        - character.perk.pitcher.throw
    - id: precise_mixing
      source_row: Precise Mixing
      cells:
        perk:
          type: text
          printed: Precise Mixing
        effect:
          type: text
          printed:
            Good mixing skills make all the difference. The alchemist may choose to reroll the result
            when rolling to see what potions have been created.
        comment:
          type: text
          printed: Energy may be spent after the first dice roll. The second result stands.
      rule_refs:
        - character.perk.precise_mixing.activation
        - character.perk.precise_mixing.reroll
    - id: surgeon
      source_row: Surgeon
      cells:
        perk:
          type: text
          printed: Surgeon
        effect:
          type: text
          printed: Taking a deep breath to calm the nerves, the alchemist can remove most parts with
            precision. The alchemist may choose what part to harvest.
        comment:
          type: text
          printed: Only works on one enemy per Energy Point spent.
      rule_refs:
        - character.perk.surgeon.activation
        - character.perk.surgeon.harvest
  footnotes: []
