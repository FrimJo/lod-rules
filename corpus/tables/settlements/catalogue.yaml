- id: table.settlement.events
  name: Settlement Events
  section_id: section.settlements.settlement_events.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 135
      printed_page: 133
      heading: Settlement Events
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Settlement events use outer results 1 through 12. Only the nested trinket selector
    overlaps at result 5.
  type: reference_table
  completeness: complete
  columns:
    - id: roll
      label: 1d12
      cell_types:
        - text
    - id: event
      label: Event and outcome
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: '1'
      cells:
        roll:
          type: text
          printed: '1'
        event:
          type: text
          printed:
            'Stray dog. The party is followed through the streets by a stray dog. After receiving a
            small treat from one of the heroes. It seems that you now are the proud owners of a dog.
            Randomise what kind of dog, using the Companions’ Compendium. If you do not own this
            compendium, or if you already have a dog, treat this result as: ‘Nothing special
            happens’.'
    - id: row_2
      source_row: '2'
      cells:
        roll:
          type: text
          printed: '2'
        event:
          type: text
          printed:
            Scrolls Salesman. The heroes are approached by a man who sells magic scrolls. Randomise
            three spells that are available. Each scroll cost 100 c.
    - id: row_3
      source_row: '3'
      cells:
        roll:
          type: text
          printed: '3'
        event:
          type: text
          printed:
            Potion Salesman. A man clad in purple robes informs the party that he sells premium
            potions. Use the Potions Table with an availability of 4 for every potion regardless of
            class, and -20 c as a price modifier.
    - id: row_4
      source_row: '4'
      cells:
        roll:
          type: text
          printed: '4'
        event:
          type: text
          printed:
            Trinket Salesman. This old man claims to be selling magic trinkets. Most of the things he
            carries around seem quite plain and ordinary, but some of them do have a special feel to
            them. He charges 100 c for each trinket, but you are only allowed to buy 1 per hero. For
            each trinket bought, roll 1d12. On a result of 1-5, it is magic. A result of 5-11 means
            the trinket is useless and cannot even be sold. A result of 12 means you have bought a
            cursed item. For any magic trinkets, roll on the Magic Items Table. For cursed trinkets,
            roll on the Curses Table. The unaware hero must wear the trinket until he or she exits
            the next dungeon before it can be thrown away. In all cases, decide whether the trinket
            is a ring or necklace.
    - id: row_5
      source_row: '5'
      cells:
        roll:
          type: text
          printed: '5'
        event:
          type: text
          printed:
            Sale! There seems to be a settlement-wide sale going on. All stores sell their items at a
            20% discount.
    - id: row_6
      source_row: '6'
      cells:
        roll:
          type: text
          printed: '6'
        event:
          type: text
          printed:
            Fresh Stocks. All stores have just been restocked and there is plenty to choose from. All
            availabilities are modified by +2. If this results in 6, the item is automatically in
            stock.
    - id: row_7
      source_row: '7'
      cells:
        roll:
          type: text
          printed: '7'
        event:
          type: text
          printed:
            Settlement Feast. There is a celebration in the settlement and there are people everywhere.
            If you stay the night, the good mood of the citizens boosts Party Morale temporarily by
            +2 (which can go above PM max). It stays at +2 until lowered by natural means and can
            then only be raised back to the standard level. However, the huge amount of people means
            that most beds at the inns are taken. On a result of 9-12 on 1d12, there are no beds,
            and the party must continue their travel without doing any business (you may claim any
            quest reward before leaving).
    - id: row_8
      source_row: '8'
      cells:
        roll:
          type: text
          printed: '8'
        event:
          type: text
          printed:
            Side Quest. The party is approached by a citizen, urgently requesting their help. Roll on
            the Side Quest Table and decide if you wish to add this to your current quest.
    - id: row_9
      source_row: '9'
      cells:
        roll:
          type: text
          printed: '9'
        event:
          type: text
          printed:
            Shortage of Goods. The settlement has not had any trade caravans passing by for weeks, and
            the stores are nearly empty. All availabilities are modified by -2. If this results in
            0, the item is automatically out of stock. As a result, prices have also gone up,
            resulting in a +10% price modifier on all items.
    - id: row_10
      source_row: '10'
      cells:
        roll:
          type: text
          printed: '10'
        event:
          type: text
          printed:
            Thief. The party realizes that a pickpocket has managed to get close. 1d100 c have been
            stolen.
    - id: row_11
      source_row: '11'
      cells:
        roll:
          type: text
          printed: '11'
        event:
          type: text
          printed:
            Assassination attempt. It seems someone is holding a grudge against the heroes. Randomize
            one hero that is attacked by 1d4 bandits. Randomize each bandits’ weapon by using the
            enemy equipment cards. Bandits with ranged weapons will also have daggers. Use the city
            tile and place the heroes along one board edge and the bandits along the opposite edge.
            The battle ends when all bandits are dead or all heroes have dropped to 0 HP. The heroes
            do not die, but instead be nursed back to 1 HP by the locals. The bandits may be
            searched.
    - id: row_12
      source_row: '12'
      cells:
        roll:
          type: text
          printed: '12'
        event:
          type: text
          printed:
            'Curse! While walking down the street, a gnarly old woman suddenly points her finger at the
            party and screams: “Heretics! I curse thee!”. Roll on the Curses Table once and apply
            the curse to all heroes until they exit the next dungeon.'
  footnotes: []
  issues:
    - issue.settlement.trinket_overlap
