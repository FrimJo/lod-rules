  source_text: 'When it lands, it explodes causing acidic damage to the square it hits, and also half that damage to all the surrounding squares at a rate of: Weak: 1d6 DMG; Standard 1d10 DMG; Supreme: 1d12 DMG. ... When it lands, it explodes causing Fire Damage to the square it hits, and half that damage to all the surrounding squares at a rate of: Weak 1d6 DMG; Standard 1d10 DMG; Supreme 1d12 DMG. ... It comes in the Weak, Standard, and Supreme dilutions, granting +10, +15 and +20 Constitution, respectively. ... It comes in Weak, Standard, and Supreme mixtures, granting +10, +15, and +20 Resolve, respectively. ... A Weak potion has a 75% chance of success, a Standard and Supreme has a 100% chance. Further, a Supreme will also heal 1d3 HP. ... A Weak potion has a 75% chance of success, a Standard and Supreme has a 100% chance. The Supreme potion will also heal 1d3 HP. ... It comes in Weak, Standard, and Supreme versions, granting +5, +10, and +15 DEX respectively. ... It comes in Weak, Standard, and Supreme forms, granting +1, +2, and +3 amounts of energy, respectively. ... It comes in Weak, Standard, and Supreme formulas, which heal 1d4, 1d6, and 1d10 Hit Points, respectively. ... It comes in Weak, Standard, and Supreme versions, which restore 1d20, 2d20, and 3d20 Mana, respectively. ... It comes in Weak, Standard, and Supreme types, granting +10, +15, and +20 Strength, respectively. ... It comes in Weak, Standard, and Supreme forms, granting +10, +15, and +20 Wisdom respectively.'
