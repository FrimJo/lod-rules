          printed: Objective Chest
        findings:
          type: text
          printed:
            '1-3: 1 Fine treasure, 2 Wonderful Treasures. 4-7: 2 Fine treasure, 1 Wonderful Treasure.
            8-10: 3 Fine Treasures.'
      rule_refs:
        - character.treasure.furniture.objective_chest
    - id: pottery
      source_row: Pottery
      cells:
        furniture:
          type: text
          printed: Pottery
        findings:
          type: text
          printed: '1-2: 1 Mundane Treasure 3-4: 1d20 coins. 5: 1 Ration. 6-10: Nothing.'
      rule_refs:
