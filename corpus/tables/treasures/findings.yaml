      label: Furniture
      cell_types:
        - text
    - id: findings
      label: Findings
      cell_types:
        - text
  rows:
    - id: alchemist_table
      source_row: Alchemist Table
      cells:
        furniture:
          type: text
          printed: Alchemist Table
        findings:
          type: text
          printed: '1-3: 1d3 Potions. 4-7: 1d10 Ingredients. 8-10: Nothing of any value.'
      rule_refs:
        - character.treasure.furniture.alchemist_table
    - id: altar
      source_row: Altar
      cells:
        furniture:
          type: text
          printed: Altar
        findings:
          type: text
          printed: '1-3: 1d3 Potions. 4-7: 1d6x10 c 8-10: Nothing of any value.'
      rule_refs:
        - character.treasure.furniture.altar
    - id: archery_target
      source_row: Archery Target
      cells:
        furniture:
          type: text
          printed: Archery Target
        findings:
          type: text
          printed: '1-4: 1d10 arrows or bolts (you choose). 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.archery_target
    - id: armour_rack
      source_row: Armour Rack
      cells:
        furniture:
          type: text
          printed: Armour Rack
        findings:
          type: text
          printed: '1-4: 1d3 random armour parts, with 1d4 lost Durability Points. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.armour_rack
    - id: backpack
      source_row: Backpack
      cells:
        furniture:
          type: text
          printed: Backpack
        findings:
          type: text
          printed: '1-5: 1 Mundane Treasure. 6-7: 1d100 c. 8-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.backpack
    - id: barrels
      source_row: Barrels
      cells:
        furniture:
          type: text
          printed: Barrels
        findings:
          type: text
          printed: '1-2: 1 Mundane Treasure. 3-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.barrels
    - id: bed
      source_row: Bed
      cells:
        furniture:
          type: text
          printed: Bed
        findings:
          type: text
          printed: '1-2: 1 Mundane Treasure. 3-4: 1d100 c. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.bed
    - id: bedroll_with_pack
      source_row: Bedroll with pack
      cells:
        furniture:
          type: text
          printed: Bedroll with pack
        findings:
          type: text
          printed: '1-3: 1 Mundane Treasure. 4-5: 1d100 c. 6-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.bedroll_with_pack
    - id: bookshelf
      source_row: Bookshelf
      cells:
        furniture:
          type: text
          printed: Bookshelf
        findings:
          type: text
          printed:
            '1-2: 1 Fine Treasure. 3-5: A Scroll. Randomize what spell it contains using the Spell
            Tables. 6-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.bookshelf
    - id: bookstand
      source_row: Bookstand
      cells:
        furniture:
          type: text
          printed: Bookstand
        findings:
          type: text
          printed: '1-5: A Grimoire with 1 random spell. 6-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.bookstand
    - id: boxes
      source_row: Boxes
      cells:
        furniture:
          type: text
          printed: Boxes
        findings:
          type: text
          printed: '1-4: 1 Mundane Treasure. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.boxes
    - id: campfire
      source_row: Campfire
      cells:
        furniture:
          type: text
          printed: Campfire
        findings:
          type: text
          printed: '1-4: 1d3 Rations. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.campfire
      entity_refs:
        - equipment.consumable.ration
    - id: chest
      source_row: Chest
      cells:
        furniture:
          type: text
          printed: Chest
        findings:
          type: text
          printed: '1: 1 Wonderful Treasure. 2-4: 2 Fine Treasures. 5-8: 1 Fine Treasure. 9-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.chest
    - id: coffin
      source_row: Coffin
      cells:
        furniture:
          type: text
          printed: Coffin
        findings:
          type: text
          printed:
            '1-2: 1 Fine treasure. 3-8: Nothing. 9-10: You awaken 1 zombie. Randomly place it next to
            the coffin.'
      rule_refs:
        - character.treasure.furniture.coffin
    - id: crate
      source_row: Crate
      cells:
        furniture:
          type: text
          printed: Crate
        findings:
          type: text
          printed: '1: Gemstones worth 1d100 c. 2-3: 1 Mundane Treasure. 4: 1 Pickaxe. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.crate
      entity_refs:
        - equipment.tool.pickaxe
    - id: dead_adventurer
      source_row: Dead Adventurer
      cells:
        furniture:
          type: text
          printed: Dead Adventurer
        findings:
          type: text
          printed:
            '1-3: Fine Treasure. 4-7: Mundane Treasure. 8-9: Nothing. 10: It’s a Zombie, armed with a
            longsword and armour 1.'
      rule_refs:
        - character.treasure.furniture.dead_adventurer
    - id: dining_table
      source_row: Dining Table
      cells:
        furniture:
          type: text
          printed: Dining Table
        findings:
          type: text
          printed: '1-4: 1 ration. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.dining_table
      entity_refs:
        - equipment.consumable.ration
    - id: drawer
      source_row: Drawer
      cells:
        furniture:
          type: text
          printed: Drawer
        findings:
          type: text
          printed: '1-2: 1 Fine Treasure. 3-8: A small bag of coins, 2d20 c. 9-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.drawer
    - id: fountain
      source_row: Fountain
      cells:
        furniture:
          type: text
          printed: Fountain
        findings:
          type: text
          printed:
            '1-2: Someone has seen fit to leave 1 Fine Treasure by the fountain. 3-8: There are 1d20
            worth of coins sprinkled across the bottom of the fountain. 9-10: Nothing. If you choose
            to drink from the fountain: 1-2: You feel invigorated. Heal 1d4+1 Hit Points and 1
            Energy Point. 3-8: Nothing happens. 9-10: Make an Alchemical roll. If you fail, you have
            become diseased. If you pass an alchemical roll before drinking, treat this as nothing
            happens. Only one roll is necessary for the entire party.'
      rule_refs:
        - character.treasure.furniture.fountain
    - id: grate_over_a_hole
      source_row: Grate (over a hole)
      cells:
        furniture:
          type: text
          printed: Grate (over a hole)
        findings:
          type: text
          printed: '1-4: 1d6 lockpicks. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.grate_over_a_hole
    - id: hearth
