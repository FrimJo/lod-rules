- id: table.treasure.rooms_corridors
  name: Treasure found in Rooms and Corridors
  section_id: section.appendix_v_treasures.treasure_found_in_rooms_and_corridors.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 193
      printed_page: 191
      heading: Treasure found in Rooms and Corridors
      locator:
        table: Uncaptioned room and corridor table (1d100, Finding)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Roll on this table to see if the party has discovered anything of interest when
    searching a tile. When searching corridors, you get a +10 modifier on this table. ... 1d100
    Finding
  type: random_table
  completeness: complete
  roll_domain:
    min: 1
    max: 100
  columns:
    - id: roll
      label: 1d100
      cell_types:
        - range
    - id: result
      label: Finding
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: 01-15
      cells:
        roll:
          type: range
          printed: 01-15
          min: 1
          max: 15
        result:
          type: text
          printed:
            Secret door leading to a small Treasure Chamber. Place room R10 adjacent to the current
            tile and add a door as usual. Re-roll if tile is in use. Once the heroes leave the
            treasure chamber, the door closes up and the tile can be removed.
      rule_refs:
        - character.treasure.room_secret_door
        - character.treasure.room_secret_door.branch_1
    - id: row_2
      source_row: 16-25
      cells:
        roll:
          type: range
          printed: 16-25
          min: 16
          max: 25
        result:
          type: text
          printed: A Fine Treasure.
    - id: row_3
      source_row: 26-40
      cells:
        roll:
          type: range
          printed: 26-40
          min: 26
          max: 40
        result:
          type: text
          printed: A mundane treasure.
    - id: row_4
      source_row: 41-45
      cells:
        roll:
          type: range
          printed: 41-45
          min: 41
          max: 45
        result:
          type: text
          printed: A set of levers are intricately hidden in the wall. They may be operated.
    - id: row_5
      source_row: 46-50
      cells:
        roll:
          type: range
          printed: 46-50
          min: 46
          max: 50
        result:
          type: text
          printed: 4d20 c.
      rule_refs:
        - character.treasure.room_roll.row_5
    - id: row_6
      source_row: 51-90
      cells:
        roll:
          type: range
          printed: 51-90
          min: 51
          max: 90
        result:
          type: text
          printed: Nothing.
    - id: row_7
      source_row: 91-00
      cells:
        roll:
          type: range
          printed: 91-00
          min: 91
          max: 100
        result:
          type: text
          printed: You’ve sprung a trap! Draw a trap card.
      rule_refs:
        - character.treasure.room_roll.branch_3
  footnotes: []
  issues:
    - issue.treasure.corridor_overflow
