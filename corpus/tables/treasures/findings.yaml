    - id: rubble
      source_row: Rubble
      cells:
        furniture:
          type: text
          printed: Rubble
        findings:
          type: text
          printed: '1-2: 2d20 c. 3-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.rubble
    - id: sacks
      source_row: Sacks
      cells:
        furniture:
          type: text
          printed: Sacks
        findings:
          type: text
          printed: '1-3: 1 ration. 4-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.sacks
      entity_refs:
        - equipment.consumable.ration
    - id: sarcophagus
      source_row: Sarcophagus
      cells:
        furniture:
          type: text
          printed: Sarcophagus
        findings:
          type: text
          printed:
            '1-2: 1 wonderful treasure. 3-5: 2 fine treasures. 6-8: Nothing. 9-10: You awakened 1
            Mummy! Randomly place it next to the sarcophagus.'
      rule_refs:
        - character.treasure.furniture.sarcophagus
    - id: statue
      source_row: Statue
      cells:
        furniture:
          type: text
          printed: Statue
        findings:
          type: text
          printed:
            '1: Roll 1d6: 1-2 you have found a Wonderful Treasure, 3-6 a Fine Treasure. 2-3: There are
            1d20 worth of coins left as offerings. 4-9: Nothing. 10: You awakened a Gargoyle! Place
            the Gargoyle on the statue.'
      rule_refs:
        - character.treasure.furniture.statue
    - id: study_table
      source_row: Study Table
      cells:
        furniture:
          type: text
          printed: Study Table
        findings:
          type: text
          printed: '1-4: 1 Mundane Treasure. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.study_table
    - id: throne
      source_row: Throne
      cells:
        furniture:
          type: text
          printed: Throne
        findings:
          type: text
          printed: '1-2: 1 Fine Treasure. 3-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.throne
    - id: torture_tools
      source_row: Torture Tools
      cells:
        furniture:
          type: text
          printed: Torture Tools
        findings:
          type: text
          printed: '1-2: 1d3 human blood for Alchemical use. 3-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.torture_tools
      entity_refs:
        - part.human_blood
    - id: treasure_pile
      source_row: Treasure Pile
      cells:
        furniture:
          type: text
          printed: Treasure Pile
        findings:
          type: text
          printed:
            '1-2: 1d4*100 c, 1 Wonderful Treasure. 3-5: 1d3*100 c, 2 Fine Treasures. 6-10: 1d2*100 c, 1
            Fine Treasure.'
      rule_refs:
        - character.treasure.furniture.treasure_pile
    - id: water_basin
      source_row: Water Basin
      cells:
        furniture:
          type: text
          printed: Water Basin
        findings:
          type: text
          printed:
            'If you choose to drink from the fountain: 1-2: You feel invigorated. Heal 1d6+1 Hit Points
            and all Energy Points. 3-8: Nothing happens. 9-10: Make an Alchemical roll. If you fail,
            you have become diseased. Only one roll is necessary for the entire party. If you pass,
            nothing happens.'
      rule_refs:
        - character.treasure.furniture.water_basin
    - id: weapons_rack
      source_row: Weapons Rack
      cells:
        furniture:
          type: text
          printed: Weapons Rack
        findings:
          type: text
          printed: '1-4: Random weapon with 1d4 lost Durability Points. 5-10: Nothing.'
      rule_refs:
        - character.treasure.furniture.weapons_rack
    - id: well
      source_row: Well
      cells:
        furniture:
          type: text
          printed: Well
        findings:
          type: text
          printed:
            '1: At the bottom of the well is a small chest tied to a rope. You may roll on the Chest
            Table. 2: A Mundane Treasure is lying by the well. 3-9: Nothing. 10: You awake an angry
            Water Spirit residing in the well. Place a Water Elemental next to the well.'
      rule_refs:
        - character.treasure.furniture.well
  footnotes: []
- id: table.treasure.rooms_corridors
  name: Treasure found in Rooms and Corridors
  section_id: section.appendix_v_treasures.treasure_found_in_rooms_and_corridors.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 193
      printed_page: 191
      heading: Treasure found in Rooms and Corridors
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Treasure found in Rooms and Corridors; printed outcomes and instructions retained.
  type: random_table
  completeness: complete
  roll_domain:
    min: 1
    max: 100
  columns:
    - id: roll
      label: 1d100
      cell_types:
        - range
    - id: result
      label: Finding
      cell_types:
        - text
  rows:
    - id: row_1
      source_row: 01-15
      cells:
        roll:
          type: range
          printed: 01-15
          min: 1
          max: 15
        result:
          type: text
          printed:
            Secret door leading to a small Treasure Chamber. Place room R10 adjacent to the current
            tile and add a door as usual. Re-roll if tile is in use. Once the heroes leave the
            treasure chamber, the door closes up and the tile can be removed.
    - id: row_2
      source_row: 16-25
      cells:
        roll:
          type: range
          printed: 16-25
          min: 16
          max: 25
        result:
          type: text
          printed: A Fine Treasure.
    - id: row_3
      source_row: 26-40
      cells:
        roll:
          type: range
          printed: 26-40
          min: 26
          max: 40
        result:
          type: text
          printed: A mundane treasure.
    - id: row_4
      source_row: 41-45
      cells:
        roll:
          type: range
          printed: 41-45
          min: 41
          max: 45
        result:
          type: text
          printed: A set of levers are intricately hidden in the wall. They may be operated.
    - id: row_5
      source_row: 46-50
      cells:
        roll:
          type: range
          printed: 46-50
          min: 46
          max: 50
        result:
          type: text
          printed: 4d20 c.
    - id: row_6
      source_row: 51-90
      cells:
        roll:
          type: range
          printed: 51-90
          min: 51
          max: 90
        result:
          type: text
          printed: Nothing.
    - id: row_7
      source_row: 91-00
      cells:
        roll:
          type: range
          printed: 91-00
          min: 91
          max: 100
        result:
          type: text
          printed: You’ve sprung a trap! Draw a trap card.
  footnotes:
    - Roll 1d100. When searching a corridor, add +10 to the roll. Outcomes above 100 are not defined.
  issues:
    - issue.treasure.corridor_overflow
