  footnotes:
    - 'AP (X): Armour piercing. Ignores X points of armour.'
    - 'BFO (Built for offence): These are not optimal to parry with and suffer a -5 to CS while
      parrying. This is cumulative with the Slow Special Rule.'
    - 'Defensive: This weapon is easy to use defensively and receives +10 when parrying. However, it
      cannot withstand as much punishment as a good sword, and therefore can only take 4 Points of
      Damage before it breaks.'
    - 'Dual wield +X: These weapons can be used in the offhand if your hero has the Dual Wielding
      Skill. The X indicates the extra DMG caused during a successful attack.'
    - 'Ensnare: If this weapon hits, the target is trapped in the net and must spend 1 action to get
      free with a successful DEX Test. Until freed, this is the only action it can do. A net can be
      used once per battle and is retrieved automatically after the battle.'
    - 'Fast: Weapon may be used to parry once per turn even though the hero did not choose the Parry
      Stance, but the weapon is damaged on 90-00.'
    - 'Reach: May attack at a range of 2 squares, even if there is a friendly character in the
      square in between.'
    - 'Secondary Weapon: This weapon may be used in your hero’s offhand while carrying a hand weapon
      in the primary hand. Firing this weapon may be done in the same action as moving (-10) or at a
      target adjacent to the firer. It cannot be reloaded while wielded as a secondary weapon.'
    - 'Slow: Weapon is heavy and difficult to parry with. -5 chance to parry.'
    - 'Stun: This weapon has a chance to put the enemy off balance. If you roll an even number when
      rolling to damage, the enemy loses one action next turn. This does not stack.'
    - 'Unwieldy: Wielding these weapons is tiring and the +X damage only applies to the first hit in
      every battle.'
    - The printed table leaves an unlabelled blank band between the Sling and Arrow/Bolt (5) rows;
      the book gives it no caption.
  unresolved_references:
    - Unlimited Ammo (Sling Special) has no definition printed with this table.
    - Requires STR 55 (Arbalest Special) is not defined in the special-rule list printed with this
      table.
  issues:
    - issue.phase5.weapons_undefined_specials
