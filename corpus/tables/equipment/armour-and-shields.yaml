  footnotes:
    - 'Stackable: This armour can be combined with ONE armour of a different tier that also have the
      stackable special rule. However, this impedes your Dexterity (-10 DEX). This effect on DEX is
      not cumulative if you stack armour in different hit zones. Cloaks can be worn even if the hero
      is already using stacked armour (for example a mail shirt on top of a padded jacket).
      Durability is only subtracted from the outer layer of armour and the highest tier is always
      the outer layer.'
    - 'Clunky: This armour offers good protection, but moving effectively is difficult, giving your
      hero a -10 DEX. This is not cumulative with other pieces of armour that are also clunky.'
    - 'The tier rows (Tier 1: to Tier 4:) are printed as band headings inside the table and carry no
      values of their own.'
    - The printed table leaves an unlabelled blank band before Padded Dog Armour and before Leather
      Dog Armour; the book gives neither a caption.
