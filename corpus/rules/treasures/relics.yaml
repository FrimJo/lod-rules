- id: character.treasure.relic.charus
  name: Relic of Charus
  section_id: section.appendix_v_treasures.table_of_relics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 196
      printed_page: 194
      heading: Relic of Charus
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Grants +1 Energy Point.
  scope: global
  type: modifier
  fields:
    is_warrior_priest:
      type: boolean
      role: input
      description: is warrior priest
    relic_slot_valid:
      type: boolean
      role: input
      description: relic slot valid
    energy_modifier:
      type: number
      role: output
      description: energy modifier
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: is_warrior_priest
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: relic_slot_valid
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: energy_modifier
      value:
        type: literal
        value: 1
