- id: character.treasure.relic.restrictions
  name: 'Table of Relics: Warrior Priests only, two at a time, counts as magic items'
  section_id: section.appendix_v_treasures.table_of_relics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 196
      printed_page: 194
      heading: Table of Relics
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: These are religious artifacts that can only be used by Warrior Priests. Only two of
    these can be used at a time unless the Warrior Priest have the Reliquary talent. These counts as
    magic items and therefore counts towards the maximum number of magic items that can be worn.
  scope: global
  type: constraint
  fields:
    is_warrior_priest:
      type: boolean
      role: input
      description: the bearer is a Warrior Priest
    relics_in_use:
      type: number
      role: input
      description: relics the Warrior Priest uses at the same time, including this one
      integer: true
      minimum: 1
    has_reliquary_talent:
      type: boolean
      role: input
      description: the Warrior Priest has the Reliquary talent
    counts_as_magic_item:
      type: boolean
      role: output
      description: the relic counts as a magic item towards the maximum number of magic items that can be worn
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: is_warrior_priest
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: lte
            left:
              type: field
              name: relics_in_use
            right:
              type: literal
              value: 2
          - type: compare
            operator: eq
            left:
              type: field
              name: has_reliquary_talent
            right:
              type: literal
              value: true
    - type: set
      target: counts_as_magic_item
      value:
        type: literal
        value: true
  dependencies:
    - key: relics
      label: Table of Relics
      object_id: table.treasure.relics
    - key: reliquary
      label: 'Reliquary talent: relic limit'
      object_id: character.talent.reliquary.relic_limit
    - key: magic_item_limit
      label: Carrying Magic Items
      object_id: character.magic_item.jewellery_limits
    - key: prayer_relics
      label: Relics
      object_id: character.prayer.relics
  term_refs:
    - term.relic
    - term.magic_item
  issues:
    - issue.treasure.relic_limit_reliquary
