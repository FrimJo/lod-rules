- id: character.treasure.furniture_search
  name: Searching Furniture
  section_id: section.treasure.searching_furniture
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 108
      printed_page: 106
      heading: Searching Furniture
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The Room Description informs you if this is searchable. Simply stand next to the furniture and
    roll on the Furniture Treasure Table in Appendix III to see what can be found. Searching one
    piece of furniture costs 1 AP as described in the ‘Into the Dungeon’ chapter.
  scope: global
  type: modifier
  fields:
    adjacent:
      type: boolean
      role: input
      description: adjacent
    searchable:
      type: boolean
      role: input
      description: searchable
    action_points_spent:
      type: number
      role: output
      description: action points spent
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: adjacent
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: searchable
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: action_points_spent
      value:
        type: literal
        value: 1
    - type: invoke
      dependency: furniture
  dependencies:
    - key: furniture
      label: Furniture Treasure Table (printed Appendix III; actual Appendix V)
      object_id: table.treasure.furniture
  issues:
    - issue.phase6.furniture_treasure_table_location
  see_also:
    - section.into_the_dungeons
- id: character.treasure.curse_reroll
  name: Curse reroll
  section_id: section.appendix_v_treasures.table_9
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 202
      printed_page: 200
      heading: Curses
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Roll to see what Curse the piece of equipment may carry. If the result is regarding the same
    magical benefit it has, then reroll.
  scope: global
  type: random_resolution
  fields:
    same_benefit:
      type: boolean
      role: input
      description: the Curses result regards the same magical benefit the item has
    reroll:
      type: boolean
      role: output
      description: reroll on the Curses table
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: same_benefit
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: reroll
      value:
        type: literal
        value: true
    - type: invoke
      dependency: curses
  dependencies:
    - key: curses
      label: Curses
      object_id: table.treasure.curses
  uses_tables:
    - table.treasure.curses
- id: character.treasure.drink.fountain.heal
  name: 'Fountain: drinking 1-2'
  section_id: section.appendix_v_treasures.treasure_found_in_furniture
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 194
      printed_page: 192
