        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 193
      printed_page: 191
      heading: Treasure found in Furniture
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Fountain ... If you choose to drink from the fountain: 1-2: You feel invigorated. Heal
    1d4+1 Hit Points and 1 Energy Point.'
  scope: global
  type: modifier
  fields:
    choose_to_drink:
      type: boolean
      role: input
      description: choose to drink
    alchemical_success:
      type: boolean
      role: input
      description: alchemical success
    roll:
      type: number
      role: input
      description: drinking roll (1d10)
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    healing_roll:
      type: number
      role: input
      description: Hit Point healing die (1d4), before the +1
      integer: true
      minimum: 1
      maximum: 4
      dice:
        count: 1
        sides: 4
    hit_points_restored:
      type: number
      role: output
      description: hit points restored
    energy_restored:
      type: string
      role: output
      description: energy restored
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: choose_to_drink
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 2
      - type: compare
        operator: gte
        left:
          type: field
          name: healing_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: healing_roll
        right:
          type: literal
          value: 4
  effects:
    - type: set
      target: hit_points_restored
      value:
        type: sum
        values:
          - type: field
            name: healing_roll
          - type: literal
            value: 1
    - type: set
      target: energy_restored
      value:
        type: literal
        value: '1'
