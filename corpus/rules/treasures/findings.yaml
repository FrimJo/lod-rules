        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: search_roll
        right:
          type: literal
          value: 3
  effects:
    - type: set
      target: potions
      value:
        type: field
        name: potion_roll
  dependencies:
