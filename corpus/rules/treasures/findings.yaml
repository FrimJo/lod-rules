- id: character.treasure.furniture.alchemist_table
  name: Alchemist Table
  section_id: section.appendix_v_treasures.treasure_found_in_furniture
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 194
      printed_page: 192
      heading: Treasure found in Furniture
      locator:
        table: Uncaptioned furniture table (Furniture, Findings)
        row: Alchemist Table
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 193
      printed_page: 191
      heading: Treasure found in Furniture
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Check the tables on the following pages for the specific furniture you are searching,
    and then roll 1d10 to see if there is anything of any value. ... Alchemist Table 1-3: 1d3
    Potions. 4-7: 1d10 Ingredients. 8-10: Nothing of any value.'
  scope: global
  type: modifier
  fields:
    search_allowed:
      type: boolean
      role: input
      description: search allowed
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: search_allowed
    right:
      type: literal
      value: true
  effects:
    - type: invoke
      dependency: findings
  dependencies:
    - key: findings
      label: Alchemist Table
      object_id: table.treasure.furniture.alchemist_table
    - key: potions
      label: Potions
      object_id: table.alchemy.strengths
    - key: ingredients
      label: Ingredients
      object_id: table.alchemy.ingredients
- id: character.treasure.furniture.alchemist_table.row_1
  name: 'Alchemist Table: 1-3'
  section_id: section.appendix_v_treasures.treasure_found_in_furniture
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 194
      printed_page: 192
      heading: Treasure found in Furniture
      locator:
        table: Uncaptioned furniture table (Furniture, Findings)
        row: Alchemist Table
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 193
      printed_page: 191
      heading: Treasure found in Furniture
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Check the tables on the following pages for the specific furniture you are searching,
    and then roll 1d10 to see if there is anything of any value. ... Alchemist Table 1-3: 1d3
    Potions.'
  scope: global
  type: random_resolution
  fields:
    search_roll:
      type: number
      role: input
      description: furniture search roll (1d10)
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    potion_roll:
      type: number
      role: input
      description: number of Potions (1d3)
