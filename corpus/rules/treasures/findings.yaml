- id: character.treasure.enemy_loot.branch_1
  name: Enemy loot indicators — branch 1
  section_id: section.treasure
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 108
      printed_page: 106
      heading: Looting the Corpses of Your Enemies
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    On the Monster Card you can see what table to roll on (T1-T5) to determine any loot. Roll on
    the appropriate table and if instructed to, draw a card. The tables can be found on the Quick
    Reference Sheet. In some cases, the Monster Card will instead show: ‘Part’. This indicates that
    the monster does not have any other loot, but can be harvested for parts. In some cases, it
    may show: ‘-‘. This means that you get absolutely nothing.
  scope: global
  type: modifier
  fields:
    indicator:
      type: string
      role: input
      description: indicator
    harvest_allowed:
      type: boolean
      role: output
      description: harvest allowed
    no_loot:
      type: boolean
      role: output
      description: no loot
  effects:
    - type: invoke
      dependency: t1
  dependencies:
    - key: t1
      label: T1
      object_id: table.treasure.t1
    - key: t2
      label: T2
      object_id: table.treasure.t2
    - key: t3
      label: T3
      object_id: table.treasure.t3
    - key: t4
      label: T4
      object_id: table.treasure.t4
    - key: t5
      label: T5
      object_id: table.treasure.t5
    - key: parts
      label: Harvesting
      object_id: table.alchemy.harvesting
  unresolved_references:
    - The tables can be found on the Quick Reference Sheet.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: indicator
    right:
      type: literal
      value: T1
