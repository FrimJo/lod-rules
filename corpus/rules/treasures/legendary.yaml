      - type: compare
        operator: eq
        left:
          type: field
          name: user_is_wizard
        right:
          type: literal
          value: true
  effects:
    - type: require
      condition:
        type: compare
        operator: lt
        left:
          type: field
          name: stored_focus_bonuses
        right:
          type: literal
          value: 3
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
