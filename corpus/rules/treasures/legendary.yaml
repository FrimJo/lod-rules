      type: number
      role: output
      description: head hit sanity loss
    failed_res_next_ap_lost:
      type: number
      role: output
      description: failed res next ap lost
    shove_modifier:
      type: number
      role: output
      description: shove modifier
    defence:
      type: number
      role: output
      description: defence
    encumbrance:
      type: number
      role: output
      description: encumbrance
    head_hit_res_test:
      type: boolean
      role: output
      description: head hit res test
    base_equipment:
      type: string
      role: output
      description: base equipment
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: identified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: selected
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: head_hit_sanity_loss
      value:
        type: literal
        value: 0
    - type: set
      target: head_hit_res_test
      value:
        type: literal
        value: true
    - type: set
      target: failed_res_next_ap_lost
      value:
        type: literal
        value: 1
    - type: set
      target: shove_modifier
      value:
        type: literal
        value: 15
    - type: set
      target: base_equipment
      value:
        type: literal
        value: metal helmet (printed)
