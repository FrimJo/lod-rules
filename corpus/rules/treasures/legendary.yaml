- id: character.treasure.legendary.general
  name: Legendary item restrictions
  section_id: section.appendix_v_treasures.legendary_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 203
      printed_page: 201
      heading: Legendary item restrictions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Unique unless otherwise noted; cannot be sold, run out of magic or be damaged. Must be
    identified before use.
  scope: global
  type: modifier
  fields:
    identified:
      type: boolean
      role: input
      description: identified
    can_use:
      type: boolean
      role: output
      description: can use
    can_sell:
      type: boolean
      role: output
      description: can sell
    can_run_out_of_magic:
      type: boolean
      role: output
      description: can run out of magic
    can_be_damaged:
      type: boolean
      role: output
      description: can be damaged
    unique_by_default:
      type: boolean
      role: output
      description: unique by default
  effects:
    - type: set
      target: can_use
      value:
        type: field
        name: identified
    - type: set
      target: can_sell
      value:
        type: literal
        value: false
    - type: set
      target: can_run_out_of_magic
      value:
        type: literal
        value: false
    - type: set
      target: can_be_damaged
      value:
        type: literal
        value: false
    - type: set
      target: unique_by_default
      value:
        type: literal
        value: true
