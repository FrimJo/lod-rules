- id: character.treasure.legendary.general
  name: Legendary item restrictions
  section_id: section.appendix_v_treasures.legendary_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 203
      printed_page: 201
      heading: Legendary Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Legendary items are unique, and unless otherwise noted may only be found once. These
    items can never be sold, as their price is immeasurable. Unlike ordinary magic items, these
    items can never run out of magic or be damaged, but they need to be identified before use.
  issues:
    - issue.treasure.vial_destruction
  scope: global
  type: modifier
  fields:
    identified:
      type: boolean
      role: input
      description: identified
    can_use:
      type: boolean
      role: output
      description: can use
    can_sell:
      type: boolean
      role: output
      description: can sell
    can_run_out_of_magic:
      type: boolean
      role: output
      description: can run out of magic
    can_be_damaged:
      type: boolean
      role: output
      description: can be damaged
    unique_by_default:
      type: boolean
      role: output
      description: unique by default
  effects:
    - type: set
      target: can_use
      value:
        type: field
        name: identified
    - type: set
      target: can_sell
      value:
        type: literal
        value: false
    - type: set
      target: can_run_out_of_magic
      value:
        type: literal
        value: false
    - type: set
      target: can_be_damaged
      value:
        type: literal
        value: false
    - type: set
      target: unique_by_default
      value:
        type: literal
        value: true
  dependencies:
    - key: identify
      label: Identifying (Magic Items)
      section_id: section.magic_items.identifying
      object_id: character.magic_item.identify
- id: character.treasure.legendary.found_once
  name: Legendary items may only be found once
  section_id: section.appendix_v_treasures.legendary_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 203
      printed_page: 201
      heading: Legendary Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 202
      printed_page: 200
      heading: Legendary Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Legendary items are unique, and unless otherwise noted may only be found once. ...
    Remember that each object may only be found once, unless noted otherwise.
  scope: global
  type: constraint
  fields:
    already_found:
      type: boolean
      role: input
      description: this legendary item has already been found
    repeat_find_noted:
      type: boolean
      role: input
      description: the item’s own description notes that it may be found more than once
    may_be_found:
      type: boolean
      role: output
      description: the item may be found now
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: already_found
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: repeat_find_noted
            right:
              type: literal
              value: true
    - type: set
      target: may_be_found
      value:
        type: literal
        value: true
