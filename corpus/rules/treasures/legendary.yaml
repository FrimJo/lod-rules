  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 204
      printed_page: 202
      heading: Stone of Valheir
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A wizard may store up to 3 Focus bonuses in the stone which can then be drawn upon at
    any time. ... Storing can be done at any time and each Focus bonus takes a full turn to store
    and requires a successful Arcane Arts roll. Alternatively, it can be filled in between quests
    without any need for rolls.
  scope: global
  type: modifier
  fields:
    identified:
      type: boolean
      role: input
      description: the legendary item has been identified
    user_is_wizard:
      type: boolean
      role: input
      description: the user is a wizard (the page says "A wizard may store")
    stored_focus_bonuses:
      type: number
      role: input
      description: Focus bonuses currently stored in the stone
      integer: true
      minimum: 0
      maximum: 3
    between_quests:
      type: boolean
      role: input
      description: the stone is filled in between quests
    arcane_arts_roll_succeeded:
      type: boolean
      role: input
      description: the storing Arcane Arts roll succeeded
    stored_focus_bonuses_after:
      type: number
