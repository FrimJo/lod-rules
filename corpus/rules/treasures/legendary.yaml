      printed_page: 207
      heading: The Helmet of Golgorosh the Ram
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The helmet is quite effective and any hit against the head no longer causes the -1 loss
    of Sanity even if the helmet fails to absorb all damage. However, the voices are so calming that
    they have been known to pacify the user. If hit in the head, the user must pass a RES Test or
    spend the next Action point passively enjoying the mesmerising voices of the fairies (stunned).
    Furthermore, in true ram fashion, shoving while wearing the helmet has a +15. This is considered
    a metal helmet in all other aspects. The helmet has DEF 6, Enc 5.
  issues:
    - issue.treasure.legendary_base_names
  scope: global
  type: modifier
