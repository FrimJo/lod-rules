- id: character.treasure.legendary.stone_of_valheir
  name: Stone of Valheir
  section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 204
      printed_page: 202
      heading: Stone of Valheir
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A wizard may store up to 3 Focus bonuses, drawing on them at any time for a 10-30 Focus
    bonus without focusing or increasing miscast risk. May combine with normal Focus following its
    normal rules. Storing each bonus takes a full turn and successful Arcane Arts roll; can instead
    fill between quests without rolls. Every draw of a Focus bonus requires RES Test or loses 1
    Sanity.
  scope: global
  type: modifier
  fields:
    identified:
      type: boolean
      role: input
      description: identified
    selected:
      type: boolean
      role: input
      description: selected
    maximum_focus_bonuses:
      type: number
      role: output
      description: maximum focus bonuses
    bonus_per_focus:
      type: number
      role: output
      description: bonus per focus
    maximum_stored_focus_modifier:
      type: number
      role: output
      description: maximum stored focus modifier
    failed_draw_sanity_loss:
      type: number
      role: output
      description: failed draw sanity loss
    increases_miscast_risk:
      type: boolean
      role: output
      description: increases miscast risk
    combines_with_normal_focus:
      type: boolean
      role: output
      description: combines with normal focus
    storage_full_turn_per_bonus:
      type: boolean
      role: output
      description: storage full turn per bonus
    storage_arcane_arts_test:
      type: boolean
      role: output
      description: storage arcane arts test
    between_quests_refill_without_roll:
      type: boolean
      role: output
      description: between quests refill without roll
    draw_res_test:
      type: boolean
      role: output
      description: draw res test
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: identified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: selected
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: maximum_focus_bonuses
      value:
        type: literal
        value: 3
    - type: set
      target: bonus_per_focus
      value:
        type: literal
        value: 10
    - type: set
      target: maximum_stored_focus_modifier
      value:
        type: literal
        value: 30
    - type: set
      target: increases_miscast_risk
      value:
        type: literal
        value: false
    - type: set
      target: combines_with_normal_focus
      value:
        type: literal
        value: true
    - type: set
      target: storage_full_turn_per_bonus
      value:
        type: literal
        value: true
    - type: set
      target: storage_arcane_arts_test
      value:
        type: literal
        value: true
    - type: set
      target: between_quests_refill_without_roll
      value:
        type: literal
        value: true
    - type: set
      target: draw_res_test
      value:
        type: literal
        value: true
    - type: set
      target: failed_draw_sanity_loss
      value:
        type: literal
        value: 1
