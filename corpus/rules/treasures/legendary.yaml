      type: number
      role: output
      description: bloodlust chance modifier
    bloodlust_shot_damage_modifier:
      type: number
      role: output
      description: bloodlust shot damage modifier
    stacks_with_talents_perks:
      type: boolean
      role: output
      description: stacks with talents perks
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: identified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: selected
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: base_equipment
      value:
        type: literal
        value: equipment.weapon.shortbow
    - type: set
      target: bloodlust_chance_modifier
      value:
        type: literal
        value: 5
    - type: set
      target: stacks_with_talents_perks
      value:
        type: literal
        value: true
    - type: set
      target: bloodlust_shot_damage_modifier
      value:
        type: literal
        value: 5
  dependencies:
    - key: base_equipment
      label: Base equipment
      object_id: equipment.weapon.shortbow
