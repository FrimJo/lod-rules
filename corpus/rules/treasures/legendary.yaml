- id: character.treasure.legendary.horn_of_alfheim
  name: Horn of Alfheim
  section_id: section.appendix_v_treasures.legendary_items.horn_of_alfheim
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 203
      printed_page: 201
      heading: Horn of Alfheim
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 27
      printed_page: null
      heading: '2.21'
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        row: 189
  status: extracted
  confidence: high
  source_text: Sounding the horn requires it to be in a ready slot and takes a full turn. It will
    temporarily increase Damage for all heroes by +3 until the end of the battle (Both magical and
    physical). It also consumes 2 Points of Energy because the power required to sound this horn is
    considerable.
  issues:
    - issue.treasure.horn_ready_slot
  scope: global
  type: modifier
  applies_to: all_heroes
  fields:
    identified:
      type: boolean
      role: input
      description: the legendary item has been identified
    selected:
      type: boolean
      role: input
      description: the hero carries, wears or wields this item
    in_quick_slot:
      type: boolean
      role: input
      description: the horn is in a Quick Slot (printed "ready slot"; changelog 2.21 entry 189 reads Quick Slot)
    quick_slot_required:
      type: boolean
      role: output
      description: quick slot required
    full_turn:
      type: boolean
      role: output
      description: full turn
    energy_cost:
      type: number
      role: output
      description: energy cost
    all_heroes_damage_modifier:
      type: number
      role: output
      description: all heroes damage modifier
    duration:
      type: string
      role: output
      description: duration
    damage_scope:
      type: string
      role: output
      description: damage scope
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: identified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: selected
        right:
          type: literal
          value: true
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: in_quick_slot
        right:
          type: literal
          value: true
    - type: set
      target: quick_slot_required
      value:
        type: literal
        value: true
    - type: set
      target: full_turn
      value:
        type: literal
        value: true
    - type: set
      target: energy_cost
      value:
        type: literal
        value: 2
    - type: set
      target: all_heroes_damage_modifier
      value:
        type: literal
        value: 3
    - type: set
      target: duration
      value:
        type: literal
        value: until end of battle
    - type: set
      target: damage_scope
      value:
        type: literal
        value: magical and physical
  dependencies:
    - key: quick_slots
      label: Quick Slots
      section_id: section.equipment.carrying_equipment
      object_id: character.equipment.quick_slots
- id: character.treasure.legendary.bow_of_divine_twilight
