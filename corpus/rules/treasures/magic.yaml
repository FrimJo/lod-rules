  uses_tables:
    - table.alchemy.standard
  issues:
    - issue.alchemy.standard_selector
- id: character.treasure.potions.standard.roll_again
  name: 'Standard Potions: Roll again'
  section_id: section.appendix_v_treasures.tables_of_potions.standard
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 197
      printed_page: 195
      heading: Standard Potions
      locator:
