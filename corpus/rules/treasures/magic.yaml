- id: character.treasure.potions.identify
  name: 'Tables of Potions: identification of found and mixed potions'
  section_id: section.appendix_v_treasures.tables_of_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 197
      printed_page: 195
      heading: Tables of Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: These tables are used to randomise what kind of potion you have found or created.
    Remember that potions must be identified if found before drinking. That is not necessary if the
    potion is a result of your own mixing.
  scope: global
  type: constraint
  fields:
    potion_origin:
      type: string
      role: input
      description: 'how the potion was obtained: found or own_mixing'
    identified:
      type: boolean
      role: input
      description: the potion has been identified
    identification_required:
      type: boolean
      role: output
      description: the potion must be identified before drinking
    may_drink:
      type: boolean
      role: output
      description: the potion may be drunk
  effects:
    - type: choice
      selection: potion_origin
      options:
        - id: found
          effects:
            - type: set
              target: identification_required
              value:
                type: literal
                value: true
            - type: require
              condition:
                type: compare
                operator: eq
                left:
                  type: field
                  name: identified
                right:
                  type: literal
                  value: true
            - type: set
              target: may_drink
              value:
                type: literal
                value: true
        - id: own_mixing
          effects:
            - type: set
              target: identification_required
              value:
                type: literal
                value: false
            - type: set
              target: may_drink
              value:
                type: literal
                value: true
  uses_tables:
    - table.alchemy.weak_supreme
    - table.alchemy.standard
  see_also:
    - section.alchemy.identifying_potions
    - section.alchemy.mixing_potions
  dependencies:
    - key: identify_potion
      label: Identifying Potions
      object_id: character.alchemy.identify
    - key: identify_before_use
      label: Identifying Items and Potions
      object_id: core.identify.before_use
    - key: mixed_without_recipe
      label: Mixing Potions (random result)
      object_id: character.alchemy.mix.success.random
- id: character.treasure.potions.standard.columns_1_2
  name: 'Standard Potions: 1d3 result 1 or 2'
  section_id: section.appendix_v_treasures.tables_of_potions.standard
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 197
      printed_page: 195
      heading: Standard Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In order to randomise Standard Potions, you must roll 1d3 first to determine what
    column to roll next. If you roll 1 you will use 1d10 to randomise from the top 10 potions, and
    if you roll 2, you will randomise from the lower potions (bold numbers) on the d10 column.
  scope: global
  type: random_resolution
  fields: &a1
    column_roll: &a2
      type: number
      role: input
      description: Standard Potions 1d3 roll that determines the column to roll next
      integer: true
      minimum: 1
      maximum: 3
      dice:
        count: 1
        sides: 3
    potion_roll: &a3
      type: number
      role: input
      description: Standard Potions 1d10 roll in the selected column
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    standard_potions_row:
      type: number
      role: output
      description: row of the Standard Potions table, counted from the top (1-30)
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: column_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: eq
        left:
          type: field
          name: column_roll
        right:
          type: literal
          value: 2
  effects:
    - type: set
      target: standard_potions_row
      value:
        type: sum
        values:
          - type: field
            name: potion_roll
          - type: arithmetic
            operator: multiply
            values:
              - type: arithmetic
                operator: subtract
                values:
                  - type: field
                    name: column_roll
                  - type: literal
                    value: 1
              - type: literal
                value: 10
  uses_tables:
    - table.alchemy.standard
  issues:
    - issue.alchemy.standard_selector
- id: character.treasure.potions.standard.column_3
  name: 'Standard Potions: column headed 3'
