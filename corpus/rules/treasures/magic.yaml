- id: character.treasure.potions.weak_supreme
  name: 'Weak or Supreme potions: roll and cost reading'
  section_id: section.appendix_v_treasures.tables_of_potions.table_weak_or_supreme_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 197
      printed_page: 195
      heading: Weak or Supreme potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The cost should be read as Weak/Supreme. 1d12 Cost Potion
  scope: global
  type: random_resolution
  fields:
    potion_roll:
      type: number
      role: input
      description: Weak or Supreme potions 1d12 roll
      integer: true
      minimum: 1
      maximum: 12
      dice:
        count: 1
        sides: 12
    quality:
      type: string
      role: input
      description: 'quality of the potion: weak or supreme'
    weak_supreme_row:
      type: number
      role: output
      description: row of the Weak or Supreme potions table
    cost_part:
      type: string
      role: output
      description: which value of the printed Cost cell applies
  effects:
    - type: set
      target: weak_supreme_row
      value:
        type: field
        name: potion_roll
    - type: choice
      selection: quality
      options:
        - id: weak
          effects:
            - type: set
              target: cost_part
              value:
                type: literal
                value: value before the slash
        - id: supreme
          effects:
            - type: set
              target: cost_part
              value:
                type: literal
                value: value after the slash
  uses_tables:
    - table.alchemy.weak_supreme
  issues:
    - issue.treasure.potion_table_divergences
- id: character.treasure.ingredients_and_parts.randomise
  name: 'Ingredients and Parts: randomise a found part or ingredient'
  section_id: section.appendix_v_treasures.ingredients_and_parts
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 198
      printed_page: 196
      heading: Ingredients and Parts
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    When you have found a random part or ingredient, you can use these tables to randomize
    what you have found.
  scope: global
  type: random_resolution
  fields:
    found_kind:
      type: string
      role: input
      description: 'what was found: ingredient or part'
    ingredient_roll:
      type: number
      role: input
      description: Table of Ingredients 1d20 roll
      integer: true
      minimum: 1
      maximum: 20
      dice:
        count: 1
        sides: 20
    group_roll:
      type: number
      role: input
      description: Table of Parts 1d3 roll
      integer: true
      minimum: 1
      maximum: 3
      dice:
        count: 1
        sides: 3
    part_roll:
      type: number
      role: input
      description: Table of Parts 1d10 roll
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    ingredients_row:
      type: number
      role: output
      description: row of the Table of Ingredients
    parts_row:
      type: number
      role: output
      description: row of the Table of Parts, counted from the top (1-30)
  effects:
    - type: choice
      selection: found_kind
      options:
        - id: ingredient
          effects:
            - type: set
              target: ingredients_row
              value:
                type: field
                name: ingredient_roll
        - id: part
          effects:
            - type: set
              target: parts_row
              value:
                type: sum
                values:
                  - type: field
                    name: part_roll
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: arithmetic
                        operator: subtract
                        values:
                          - type: field
                            name: group_roll
                          - type: literal
                            value: 1
                      - type: literal
                        value: 10
  uses_tables:
    - table.alchemy.ingredients
    - table.alchemy.parts
  issues:
    - issue.alchemy.parts_footnote
    - issue.treasure.parts_catalogue_divergence
