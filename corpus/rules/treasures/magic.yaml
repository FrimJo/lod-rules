  type: random_resolution
  fields:
    magic_item_found:
      type: boolean
      role: input
      description: a Magic Item has been found
    item_kind:
      type: string
      role: input
      description: 'kind of Magic Item: weapon, armour_or_shield or item'
    power_roll:
      type: number
      role: input
      description: Magic Weapons, Magic Armours and Shields or Magic Item 1d10 roll
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    magic_power_table:
      type: string
      role: output
      description: table rolled on
    magic_power_row:
      type: number
      role: output
      description: row of that table
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: magic_item_found
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: magic_power_row
      value:
        type: field
        name: power_roll
    - type: choice
      selection: item_kind
      options:
        - id: weapon
          effects:
            - type: set
              target: magic_power_table
              value:
                type: literal
                value: table.treasure.magic_weapons
        - id: armour_or_shield
          effects:
            - type: set
              target: magic_power_table
              value:
                type: literal
                value: table.treasure.magic_armours_shields
        - id: item
          effects:
            - type: set
              target: magic_power_table
              value:
                type: literal
                value: table.treasure.magic_items
  uses_tables:
    - table.treasure.magic_weapons
    - table.treasure.magic_armours_shields
    - table.treasure.magic_items
  term_refs:
    - term.magic_item
- id: character.treasure.magic_powers.identify
  name: 'Tables of Magic Powers for Items: identify before use'
  section_id: section.appendix_v_treasures.tables_of_magic_powers_for_items
  source: *a6
  status: extracted
  confidence: high
  source_text:
    Please note that you have to identify its magical abilities using the Arcane Arts skill
    or pay for the service in town before you can use it.
  scope: global
  type: constraint
  fields:
    identified_by:
      type: string
      role: input
      description: 'how the magical abilities were identified: arcane_arts, town_service or none'
    can_use:
      type: boolean
      role: output
      description: the hero can use the Magic Item
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: identified_by
            right:
              type: literal
              value: arcane_arts
          - type: compare
            operator: eq
            left:
              type: field
              name: identified_by
            right:
              type: literal
              value: town_service
    - type: set
      target: can_use
      value:
        type: literal
        value: true
  see_also:
    - section.magic_items.identifying
    - section.settlements.identifying_items_and_potions
  dependencies:
    - key: arcane_arts
      label: Identifying (Magic Items)
      object_id: character.magic_item.identify
    - key: town_service
      label: Identifying Items and Potions (settlement service)
      object_id: character.settlement.identification
    - key: before_use
      label: Identifying Items and Potions
      object_id: core.identify.before_use
  term_refs:
    - term.magic_item
- id: character.treasure.magic_powers.roll_timing
  name: 'Tables of Magic Powers for Items: when to roll (diehard option)'
  section_id: section.appendix_v_treasures.tables_of_magic_powers_for_items
  source: *a6
  status: extracted
  confidence: high
  source_text:
    For simplicity, it may be easier to roll on this table once you have found it and then
    remember not to use it until identified. However, the diehard player would just note down ‘Magic
    Weapon’, and then roll on the table once it has been identified. This may affect decisions if
    you are carrying too much equipment and have to sacrifice something.
  scope: global
  type: choice
  fields:
    roll_timing:
      type: string
      role: input
      description: 'play style chosen: on_find (for simplicity) or diehard'
    identified:
      type: boolean
      role: input
      description: the Magic Item has been identified
    roll_power_now:
      type: boolean
      role: output
      description: roll on the table now
    noted_as:
      type: string
      role: output
      description: what is noted down for the item before its power is rolled
    can_use:
      type: boolean
      role: output
      description: the item may be used
  effects:
    - type: choice
      selection: roll_timing
      options:
        - id: on_find
          effects:
            - type: set
              target: roll_power_now
              value:
                type: literal
                value: true
            - type: set
              target: can_use
              value:
                type: field
                name: identified
        - id: diehard
          effects:
            - type: set
              target: noted_as
              value:
                type: literal
                value: Magic Weapon
            - type: set
              target: roll_power_now
              value:
                type: field
                name: identified
            - type: set
              target: can_use
              value:
                type: field
                name: identified
  uses_tables:
    - table.treasure.magic_weapons
    - table.treasure.magic_armours_shields
    - table.treasure.magic_items
