- id: character.treasure.legendary_selector
  name: 'Legendary Items: two-stage selector and found-once restriction'
  section_id: section.appendix_v_treasures.table_10
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 202
      printed_page: 200
      heading: Legendary Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Should you be so lucky as to find a Legendary Item, roll on the table below. Remember
    that each object may only be found once, unless noted otherwise. ... 1-2 1d10 3-4 1d10 5-6 1d10
    Legendary Item
  scope: global
  type: random_resolution
  fields:
    column_roll:
      type: number
      role: input
      description: result that selects the column headed 1-2, 3-4 or 5-6 (the page names no die for it)
      integer: true
      minimum: 1
      maximum: 6
    item_roll:
      type: number
      role: input
      description: Legendary Items 1d10 roll in the selected column
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    already_found:
      type: boolean
      role: input
      description: the object rolled has already been found
    noted_otherwise:
      type: boolean
      role: input
      description: the object is noted as one that may be found more than once
    legendary_row:
      type: number
      role: output
      description: row of the Legendary Items table, counted from the top (1-30)
  effects:
    - type: set
      target: legendary_row
      value:
        type: sum
        values:
          - type: field
            name: item_roll
          - type: arithmetic
            operator: multiply
            values:
              - type: arithmetic
                operator: subtract
                values:
                  - type: arithmetic
                    operator: ceil
                    values:
                      - type: arithmetic
                        operator: divide
                        values:
                          - type: field
                            name: column_roll
                          - type: literal
                            value: 2
                  - type: literal
                    value: 1
              - type: literal
                value: 10
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: already_found
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: noted_otherwise
            right:
              type: literal
              value: true
  uses_tables:
    - table.treasure.legendary
  term_refs:
    - term.legendary_item
  issues:
    - issue.gameplay_example.legendary_roll
    - issue.treasure.legendary_names
