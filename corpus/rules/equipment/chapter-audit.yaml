- id: character.equipment.weapon_class.one_hand
  name: weapon class one hand
  section_id: section.equipment.weapon_class
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 51
      printed_page: 49
      section: Different Kind of Equipment
      heading: Class
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 29
      printed_page: 27
      section: Creating your Character
      heading: Strength and Weapon Class
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Weapons come in classes ranging from 1-6. Generally, the higher the class, the
    heavier the weapon. Heavy weapons require a high strength to use effectively. Some weapons can
    be used with either two hands or one hand, depending on your strength, whereas some weapons
    always require two hands. Ranged Weapons in Class 6 may not be heavy per se, but they require
    two hands to operate anyway.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 1
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 20
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 2
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 30
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 3
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 40
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 4
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 50
  fields:
    hands_used:
      type: number
      role: input
      description: hands used
    weapon_class:
      type: number
      role: input
      description: weapon class
      integer: true
      minimum: 1
      maximum: 6
    strength:
      type: number
      role: input
      description: strength
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hands_used
    right:
      type: literal
      value: 1
  uses_tables:
    - table.equipment.weapon_class_strength
  dependencies:
    - key: huge_shield
      label: Huge shield is class 5 but does not require 2 hands
      section_id: section.appendix_iii_equipment.armour_and_shields
      object_id: character.equipment.shield.huge.hands
