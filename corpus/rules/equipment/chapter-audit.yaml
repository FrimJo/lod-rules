- id: character.equipment.sell_initial_value
  name: sell initial value
  section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 186
      printed_page: 184
      heading: sell and repair table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Initial value is the purchase value or value on the treasure card; all sales use the
    Sell and Repair Table unless otherwise noted.
  scope: global
  type: modifier
  effects:
    - type: set
      target: price
      value:
        type: field
        name: purchase_or_treasure_value
    - type: set
      target: sell_via_table
      value:
        type: literal
        value: true
  fields:
    otherwise_noted:
      type: boolean
      role: input
      description: otherwise noted
    price:
      type: number
      role: output
      description: price
    purchase_or_treasure_value:
      type: number
      role: input
      description: purchase or treasure value
    sell_via_table:
      type: boolean
      role: output
      description: sell via table
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: otherwise_noted
    right:
      type: literal
      value: false
  uses_tables:
    - table.equipment.sell_and_repair
