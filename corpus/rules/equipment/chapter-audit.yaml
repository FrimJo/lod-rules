- id: character.equipment.quiver
  name: quiver
  section_id: section.equipment.quiver
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 52
      printed_page: 50
      heading: quiver
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Optional rule: All heroes automatically have a quiver holding 10 arrows or bolts.
    Surplus is in the backpack. Used arrows or bolts can never be retrieved.'
  scope: global
  type: modifier
  effects:
    - type: set
      target: has_quiver
      value:
        type: literal
        value: true
    - type: set
      target: quiver_capacity
      value:
        type: literal
        value: 10
    - type: set
      target: quiver_projectiles
      value:
        type: arithmetic
        operator: min
        values:
          - type: field
            name: projectiles
          - type: literal
            value: 10
    - type: set
      target: backpack_projectiles
      value:
        type: arithmetic
        operator: max
        values:
          - type: literal
            value: 0
          - type: arithmetic
            operator: subtract
            values:
              - type: field
                name: projectiles
              - type: literal
                value: 10
    - type: set
      target: used_projectiles_retrievable
      value:
        type: literal
        value: false
  fields:
    optional_quiver_enabled:
      type: boolean
      role: input
      description: optional quiver enabled
    has_quiver:
      type: boolean
      role: output
      description: has quiver
    quiver_capacity:
      type: number
      role: output
      description: quiver capacity
    quiver_projectiles:
      type: number
      role: output
      description: quiver projectiles
    projectiles:
      type: number
      role: input
      description: projectiles
    backpack_projectiles:
      type: number
      role: output
      description: backpack projectiles
    used_projectiles_retrievable:
      type: boolean
      role: output
      description: used projectiles retrievable
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: optional_quiver_enabled
    right:
      type: literal
      value: true
