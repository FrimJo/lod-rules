- id: character.equipment.weapon_class.one_hand
  name: weapon class one hand
  section_id: section.equipment.weapon_class
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 51
      printed_page: 49
      heading: weapon class
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Weapon class determines the minimum Strength for one or two hands. Class 5 and 6
    weapons cannot be used in one hand.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 1
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 20
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 2
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 30
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 3
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 40
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapon_class
                right:
                  type: literal
                  value: 4
              - type: compare
                operator: gte
                left:
                  type: field
                  name: strength
                right:
                  type: literal
                  value: 50
  fields:
    hands_used:
      type: number
      role: input
      description: hands used
    weapon_class:
      type: number
      role: input
      description: weapon class
      integer: true
      minimum: 1
      maximum: 6
    strength:
      type: number
      role: input
      description: strength
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hands_used
    right:
      type: literal
      value: 1
  uses_tables:
    - table.equipment.weapon_class_strength
- id: character.equipment.weapon_class.two_hands
  name: weapon class two hands
  section_id: section.equipment.weapon_class
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 51
      printed_page: 49
      heading: weapon class
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Weapon class determines the minimum Strength for one or two hands. Class 5 and 6
    weapons cannot be used in one hand.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: weapon_class
        right:
          type: literal
          value: 6
    - type: lookup
      table_id: table.equipment.weapon_class_strength
      key_column: weapon_class
      key:
        type: field
        name: weapon_class
      value_column: two_hands
      target: required_strength
      on_missing_issue: issue.phase4.lookup_domain
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: strength
        right:
          type: field
          name: required_strength
  fields:
    hands_used:
      type: number
      role: input
      description: hands used
    weapon_class:
      type: number
      role: input
      description: weapon class
      integer: true
      minimum: 1
      maximum: 6
    required_strength:
      type: number
      role: output
      description: Minimum Strength from the printed class table.
    strength:
      type: number
      role: input
      description: strength
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hands_used
    right:
      type: literal
      value: 2
  uses_tables:
    - table.equipment.weapon_class_strength
