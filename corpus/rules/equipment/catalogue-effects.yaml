  status: extracted
  confidence: high
  source_text:
    A lit lantern gives all heroes, including Night Vision, +5 Fear/Terror and the carrier
    +10 Perception. It occupies one hand and excludes shields, bows, crossbows and class 5 weapons.
    Trolls must pass RES to attack; failure uses the action to Bellow; once successful no further
    test. Bat swarms inflict half damage (RDU). Each Threat Roll below Threat consumes half its oil;
    the second extinguishes it. Refilling from a Quick Slot takes 1 action.
  scope: global
  type: modifier
  effects:
    - type: set
      target: party_fear_terror_modifier
      value:
        type: literal
        value: 5
    - type: set
      target: carrier_perception_modifier
      value:
        type: literal
        value: 10
    - type: set
      target: night_vision_heroes_benefit
      value:
        type: literal
        value: true
  fields:
    lit:
      type: boolean
      role: input
      description: lit
    party_fear_terror_modifier:
      type: number
      role: state
      description: party fear terror modifier
    carrier_perception_modifier:
      type: number
      role: state
      description: carrier perception modifier
    night_vision_heroes_benefit:
      type: boolean
      role: state
      description: night vision heroes benefit
  when:
