      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 49
      pdf_page: 51
      section: Weapons
      heading: Damage (DMG)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This is the amount of Damage your weapon inflicts upon your enemy. It can be further
    modified by Talents, Perks, or your Damage Bonus (DB).
