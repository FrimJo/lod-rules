- id: character.equipment.defence.definition
  name: Defence (DEF) of armour
  section_id: section.equipment.different_kind_of_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 50
      pdf_page: 52
      section: Armours and Shields
      heading: Defence (DEF)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This is how much DMG the armour can absorb. The DEF is subtracted from the DMG, and
    any remnants then removes Hit Points from the hero.
  type: definition
  scope: global
  fields: {}
  effects: []
  dependencies:
    - key: damage
      label: Damage taken = Wpn DMG + DB – NA - Armour
      section_id: section.combat.dealing_damage
      object_id: combat.damage.basic
    - key: hit_points
      label: Hit Point loss
      object_id: character.hit_points.loss
  term_refs:
    - term.armour_protection
