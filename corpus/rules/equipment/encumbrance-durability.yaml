- id: character.durability.repair_price
  name: durability repair price
  section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 184
      pdf_page: 186
      heading: Sell and Repair Table
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: To pay for the repair of an item, look up the price under the ‘Repair’ column. This
    is the cost to repair one point of durability.
  type: calculation
  scope: global
  fields:
    price:
      type: number
      role: input
      description: price
    per_point_cost:
      type: number
      role: state
      description: per point cost
    points_to_repair:
      type: number
      role: input
      description: points to repair
      minimum: 0
      integer: true
    cost:
      type: number
      role: state
      description: cost
  effects:
    - type: lookup
      table_id: table.equipment.sell_and_repair
      key_column: price
      key:
        type: field
        name: price
      value_column: lost_5_or_repair
      target: per_point_cost
      on_missing_issue: issue.phase4.lookup_domain
    - type: set
      target: cost
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: per_point_cost
          - type: field
            name: points_to_repair
  uses_tables:
    - table.equipment.sell_and_repair
  optional_system: durability
- id: character.equipment.sell_eligibility
  name: equipment sell eligibility
  section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
  source:
    - document: rulebook.second_printing.eng
