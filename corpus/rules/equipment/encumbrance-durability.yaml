- id: character.equipment.stacked_armour
  name: equipment stacked armour
  section_id: section.equipment.stacking_armour
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 50
      pdf_page: 52
      heading: Stacking armour
      extraction:
        method: text
        confidence: high
        visually_verified: false
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 51
      pdf_page: 53
      heading: Stacking armour
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Some armour has the ‘Stackable’ special rule. Two pieces of different tiers may be
    used on top of each other, with the higher tier worn as the outer layer. The DEF value is
    then added together. The outer armour is the only one that loses Durability.
  type: calculation
  scope: global
  fields:
    stackable:
      type: boolean
      role: input
      description: stackable
    outer_tier:
      type: number
      role: input
      description: outer tier
    inner_tier:
      type: number
      role: input
      description: inner tier
    outer_def:
      type: number
      role: input
      description: outer def
    inner_def:
      type: number
      role: input
      description: inner def
    defence:
      type: number
      role: state
      description: defence
    damaged_layer:
      type: string
      role: state
      description: damaged layer
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: stackable
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: outer_tier
            right:
              type: field
              name: inner_tier
    - type: set
      target: defence
      value:
        type: sum
        values:
          - type: field
            name: outer_def
          - type: field
            name: inner_def
    - type: set
      target: damaged_layer
      value:
        type: literal
        value: outer
