        operator: eq
        left:
          type: field
          name: torso_hit
        right:
          type: literal
          value: true
      - type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: field
          name: slot_count
      - type: compare
        operator: eq
        left:
          type: field
          name: slot_has_item
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: durability_applicable
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
