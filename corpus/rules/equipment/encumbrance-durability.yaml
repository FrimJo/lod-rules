- id: character.equipment.combine_price_rows
  name: equipment combine price rows
  section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 184
      pdf_page: 186
      heading: Sell and Repair Table
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If, when selling or repairing, your item is worth more than 500 c, simply add
    several rows together until you get the correct value.
  type: calculation
  scope: global
  fields:
    item_price:
      type: number
      role: input
      description: item price
    accumulated_price:
      type: number
      role: state
      description: accumulated price
    row_price:
      type: number
      role: input
      description: row price
    accumulated_cost:
      type: number
      role: state
      description: accumulated cost
    row_cost:
      type: number
      role: input
      description: row cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gt
        left:
          type: field
          name: item_price
        right:
          type: literal
          value: 500
    - type: add
      target: accumulated_price
      value:
        type: field
        name: row_price
      duration: immediate
    - type: add
      target: accumulated_cost
      value:
        type: field
        name: row_cost
      duration: immediate
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: accumulated_price
        right:
          type: field
          name: item_price
  uses_tables:
    - table.equipment.sell_and_repair
- id: character.durability.repair_location
  name: durability repair location
  section_id: section.settlements.repair_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 145
      pdf_page: 147
      heading: Repair Equipment
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: This can be done while shopping or selling at the General Store for gear, and at
    the Blacksmith for weapons and armour.
  type: constraint
  scope: settlement
  fields:
    weapons_or_armour:
      type: boolean
      role: input
      description: weapons or armour
    location:
      type: string
      role: input
      description: location
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapons_or_armour
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: location
                right:
                  type: literal
                  value: Blacksmith
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: weapons_or_armour
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: location
                right:
                  type: literal
                  value: General Store
  optional_system: durability
