- id: character.encumbrance.penalty
  name: encumbrance penalty
  section_id: section.equipment.encumbrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 51
      pdf_page: 53
      heading: Encumbrance
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If the total encumbrance exceeds the STR of your character, all skills and stats are at -10.
  type: calculation
  scope: global
  fields:
    encumbrance:
      type: number
      role: input
      description: encumbrance
    strength:
      type: number
      role: input
      description: strength
    skill_stat_modifier:
      type: number
      role: state
      description: skill stat modifier
  effects:
    - type: set
      target: skill_stat_modifier
      value:
        type: literal
        value: -10
  when:
    type: compare
    operator: gt
    left:
      type: field
      name: encumbrance
    right:
      type: field
      name: strength
  optional_system: encumbrance
- id: character.encumbrance.limit
  name: encumbrance limit
  section_id: section.equipment.encumbrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 51
      pdf_page: 53
      heading: Encumbrance
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Your character can never carry more than STR+15 points of encumbrance.
  type: constraint
  scope: global
  fields:
    encumbrance:
      type: number
      role: input
      description: encumbrance
    strength:
      type: number
      role: input
      description: strength
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: encumbrance
        right:
          type: sum
          values:
            - type: field
              name: strength
            - type: literal
              value: 15
  optional_system: encumbrance
