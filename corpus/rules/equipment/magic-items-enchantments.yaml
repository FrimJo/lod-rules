      heading: Making a Magic Scroll
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    It cannot be done while travelling. ... This activity only requires the knowledge of the Magic
    Scribbles spell, the spell you want to write down and some fine parchments. Cast the Magic
    Scribbles spell as usual, using focus if you wish, and if you succeed the spell of your choice
    has been copied down on the scroll. If you fail, the parchment has been destroyed and you must
    use a new one.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_magic_scribbles
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_written_spell
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: has_fine_parchment
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: travelling
            right:
              type: literal
              value: false
    - type: set
      target: focus_allowed
      value:
        type: literal
        value: true
    - type: set
      target: spell_copied_to_scroll
      value:
        type: literal
        value: true
  fields:
    magic_scribbles_succeeded:
      type: boolean
      role: input
      description: magic scribbles succeeded
    knows_magic_scribbles:
      type: boolean
      role: input
      description: knows magic scribbles
    knows_written_spell:
      type: boolean
      role: input
      description: knows written spell
    has_fine_parchment:
      type: boolean
      role: input
      description: has fine parchment
    focus_allowed:
      type: boolean
      role: output
      description: focus allowed
    spell_copied_to_scroll:
      type: boolean
      role: output
      description: spell copied to scroll
    travelling:
