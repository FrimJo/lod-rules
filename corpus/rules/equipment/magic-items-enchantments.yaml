- id: character.magic_item.time.object
  name: time object
  section_id: section.enchantments.enchantments_take_time
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 71
      printed_page: 69
      heading: Enchantments Take Time
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The act of creating items like this is very time-consuming and tiring. Only one object or two
    attempts (successful or not) to create scrolls may be done between quests. Each Magic Scroll
    takes 1 day to make.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lt
            left:
              type: field
              name: objects_between_quests
            right:
              type: literal
              value: 1
          - type: compare
            operator: eq
            left:
              type: field
              name: scroll_attempts_between_quests
            right:
              type: literal
              value: 0
    - type: add
      target: objects_between_quests
      value:
        type: literal
        value: 1
      duration: permanent
  fields:
    objects_between_quests:
      type: number
      role: state
      description: objects between quests
    scroll_attempts_between_quests:
      type: number
      role: input
      description: scroll attempts between quests
