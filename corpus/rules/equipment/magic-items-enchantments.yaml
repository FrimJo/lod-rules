- id: character.magic_item.jewellery_limits
  name: jewellery limits
  section_id: section.magic_items.carrying_magic_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: carrying magic items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A hero may wear at most 1 magic ring and 1 magic necklace at once, including Legendary
    Items. Several magic weapons, armour pieces and other non-jewellery items may be carried.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lte
            left:
              type: field
              name: magic_rings_including_legendary
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
            left:
              type: field
              name: magic_necklaces_including_legendary
            right:
              type: literal
              value: 1
    - type: set
      target: multiple_non_jewellery_magic_items_allowed
      value:
        type: literal
        value: true
  fields:
    magic_rings_including_legendary:
      type: number
      role: input
      description: magic rings including legendary
    magic_necklaces_including_legendary:
      type: number
      role: input
      description: magic necklaces including legendary
    multiple_non_jewellery_magic_items_allowed:
      type: boolean
      role: output
      description: multiple non jewellery magic items allowed
- id: character.magic_item.recharge
  name: recharge
  section_id: section.magic_items.dissipating_magic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: dissipating magic
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Weapons and armour not broken can be recharged at the Wizard’s Guild and regain all
    magical properties. The broken-item repair wording is separately unresolved.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: at_wizards_guild
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: durability
            right:
              type: literal
              value: 1
    - type: set
      target: magical_properties_restored
      value:
        type: literal
        value: true
  fields:
    broken:
      type: boolean
      role: input
      description: broken
    at_wizards_guild:
      type: boolean
      role: input
      description: at wizards guild
    durability:
      type: number
      role: input
      description: durability
    magical_properties_restored:
      type: boolean
      role: output
      description: magical properties restored
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: broken
    right:
      type: literal
      value: false
  dependencies:
    - key: broken_item
      label: Broken magic repair contradiction
      object_id: character.durability.magic_repair_uncertain
- id: character.magic_item.enchant.success
  name: enchant success
  section_id: section.enchantments.requirements_for_magic_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 71
      printed_page: 69
      heading: requirements for magic items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A wizard must know Enchant Item, have a Powerstone and a suitable item at full
    durability. The stone dictates the magic. Success grants its traits; failure destroys the object
    but the stone can be reused. Only one enchantment per object. Enchanting cannot be done while
    travelling.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: is_wizard
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_enchant_item
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: has_powerstone
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: item_at_full_durability
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: item_suitable_for_powerstone
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: existing_enchantments
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: travelling
            right:
              type: literal
              value: false
    - type: set
      target: enchantments
      value:
        type: literal
        value: 1
    - type: set
      target: powerstone_traits_gained
      value:
        type: literal
        value: true
  fields:
    enchant_spell_succeeded:
      type: boolean
      role: input
      description: enchant spell succeeded
    is_wizard:
      type: boolean
      role: input
      description: is wizard
    knows_enchant_item:
      type: boolean
      role: input
      description: knows enchant item
    has_powerstone:
      type: boolean
      role: input
      description: has powerstone
    item_at_full_durability:
      type: boolean
      role: input
      description: item at full durability
    item_suitable_for_powerstone:
      type: boolean
      role: input
      description: item suitable for powerstone
    existing_enchantments:
      type: number
      role: input
      description: existing enchantments
    travelling:
      type: boolean
      role: input
      description: travelling
    enchantments:
      type: number
      role: output
      description: enchantments
    powerstone_traits_gained:
      type: boolean
      role: output
      description: powerstone traits gained
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enchant_spell_succeeded
    right:
      type: literal
      value: true
  unresolved_references:
    - Powerstone traits are table-backed supplied results. Success does not state here whether the
      stone is consumed; do not infer it.
  dependencies:
    - key: enchant_spell
      label: Enchant Item
      object_id: spell.enchant_item
    - key: powerstone_traits
      label: Powerstone traits and permitted objects
      object_id: table.treasure.powerstones
