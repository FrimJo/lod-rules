- id: character.magic_item.scroll.success
  name: scroll success
  section_id: section.enchantments.making_a_magic_scroll
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 71
      printed_page: 69
      heading: making a magic scroll
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Knowing Magic Scribbles and the spell to write, plus fine parchment, is required. Cast
    Magic Scribbles normally, with optional focus. Success copies the chosen spell; failure destroys
    the parchment and requires new parchment.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_magic_scribbles
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_written_spell
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: has_fine_parchment
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: travelling
            right:
              type: literal
              value: false
    - type: set
      target: focus_allowed
      value:
        type: literal
        value: true
    - type: set
      target: spell_copied_to_scroll
      value:
        type: literal
        value: true
  fields:
    magic_scribbles_succeeded:
      type: boolean
      role: input
      description: magic scribbles succeeded
    knows_magic_scribbles:
      type: boolean
      role: input
      description: knows magic scribbles
    knows_written_spell:
      type: boolean
      role: input
      description: knows written spell
    has_fine_parchment:
      type: boolean
      role: input
      description: has fine parchment
    focus_allowed:
      type: boolean
      role: output
      description: focus allowed
    spell_copied_to_scroll:
      type: boolean
      role: output
      description: spell copied to scroll
    travelling:
      type: boolean
      role: input
      description: Enchantments cannot be made while travelling.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: magic_scribbles_succeeded
    right:
      type: literal
      value: true
  unresolved_references: []
  dependencies:
    - key: scribbles_spell
      label: Magic Scribbles
      object_id: spell.magic_scribbles
