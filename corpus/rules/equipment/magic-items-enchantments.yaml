- id: character.magic_item.identify
  name: identify
  section_id: section.magic_items.identifying
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: identifying
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Before use a Magic Item must be identified with a successful Arcane Arts roll. Failure
    leaves it unusable. One attempt per party and object; settlements offer another chance.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: compare
        operator: lt
        left:
          type: field
          name: party_attempts_for_object
        right:
          type: literal
          value: 1
    - type: add
      target: party_attempts_for_object
      value:
        type: literal
        value: 1
      duration: permanent
    - type: set
      target: identified
      value:
        type: field
        name: arcane_arts_succeeded
  fields:
    party_attempts_for_object:
      type: number
      role: state
      description: party attempts for object
    identified:
      type: boolean
      role: output
      description: identified
    arcane_arts_succeeded:
      type: boolean
      role: input
      description: arcane arts succeeded
  unresolved_references:
    - Settlement identification service remains a later procedure; the party/object retry limit does
      not define its service rules.
