- id: character.magic_item.identify
  name: identify
  section_id: section.magic_items.identifying
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: Identifying
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Before your hero can use a Magic Item, it must be identified. This is done with a successful
    Arcane Arts roll. If that fails, the item cannot be used. Only one attempt can be made per party
    and object. However, there is a chance to identify the object in most settlements. See the
    ‘Settlements’ chapter for details.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: compare
        operator: lt
        left:
          type: field
          name: party_attempts_for_object
        right:
          type: literal
          value: 1
    - type: add
      target: party_attempts_for_object
      value:
        type: literal
        value: 1
      duration: permanent
    - type: set
      target: identified
      value:
        type: field
        name: arcane_arts_succeeded
  fields:
    party_attempts_for_object:
      type: number
      role: state
      description: party attempts for object
    identified:
      type: boolean
      role: output
      description: identified
    arcane_arts_succeeded:
      type: boolean
      role: input
      description: arcane arts succeeded
  see_also:
    - section.settlements.identifying_items_and_potions
    - section.into_the_dungeons.identifying_items_and_potions
  issues:
    - issue.character_basics.identify_attempts
  dependencies:
    - key: settlement_identification
      label: Identifying Items and Potions (settlement service)
      object_id: character.settlement.identification
