- id: character.magic_item.jewellery_limits
  name: jewellery limits
  section_id: section.magic_items.carrying_magic_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: Carrying Magic Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The power imbued in Magic Items makes it impossible to carry very many, or the strain on the
    body of the bearer is too much. Interestingly, the smaller the object, the bigger this effect
    becomes. A hero cannot wear more than 1 magic ring and 1 magic necklace at the same time. This
    includes Legendary Items defined as rings or necklaces. The same hero could carry several magic
    weapons or pieces of armour, though. This includes all items not easily identified as jewellery.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lte
            left:
              type: field
              name: magic_rings_including_legendary
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
            left:
              type: field
              name: magic_necklaces_including_legendary
            right:
              type: literal
              value: 1
    - type: set
      target: multiple_non_jewellery_magic_items_allowed
      value:
        type: literal
        value: true
  fields:
    magic_rings_including_legendary:
      type: number
      role: input
      description: magic rings including legendary
    magic_necklaces_including_legendary:
      type: number
      role: input
      description: magic necklaces including legendary
    multiple_non_jewellery_magic_items_allowed:
      type: boolean
      role: output
      description: multiple non jewellery magic items allowed
- id: character.magic_item.recharge
  name: recharge
  section_id: section.magic_items.dissipating_magic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 70
      printed_page: 68
      heading: Dissipating Magic
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Weapons and armour can be recharged again (if not broken) at the Wizard’s Guild and will then
    regain all of its magical properties. If the item is broken, it must first be repaired to at
    least 1 Point of Durability.
  scope: global
  type: modifier
  unresolved_references:
    - 'The page says "Weapons and armour can be recharged"; it does not say whether a magic shield
      or any other magic object can be recharged at the Wizard’s Guild.'
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_or_armour
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: at_wizards_guild
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: durability
            right:
              type: literal
              value: 1
    - type: set
      target: magical_properties_restored
      value:
        type: literal
        value: true
  fields:
    weapon_or_armour:
      type: boolean
      role: input
      description: the item is a weapon or armour (the only item kinds the page names)
    broken:
      type: boolean
      role: input
      description: broken
    at_wizards_guild:
      type: boolean
      role: input
      description: at wizards guild
    durability:
      type: number
      role: input
      description: durability
    magical_properties_restored:
      type: boolean
      role: output
      description: magical properties restored
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: broken
    right:
      type: literal
      value: false
  issues:
    - issue.phase4.magic_breakage
  dependencies:
    - key: broken_item
      label: Broken magic repair contradiction
      object_id: character.durability.magic_repair_uncertain
    - key: guild_service
      label: Charging Magic Items (Wizards’ Guild)
      object_id: character.settlement.guild.wizards.charging
- id: character.magic_item.enchant.success
  name: enchant success
  section_id: section.enchantments.requirements_for_magic_items
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 71
      printed_page: 69
      heading: Enchantments
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 71
      printed_page: 69
      heading: Requirements for Magic Items
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    It cannot be done while travelling. ... A wizard must know the Enchant Item Spell and have
    access to a Powerstone. These are rare stones with magical properties that can be found in the
    cairns and tombs of old. The wizard also needs an item into which to imbue the magic. The item
    must have full durability. The stone will dictate what kind of magic the item will receive, and
    the item must be suitable for the magic as well. For example, there is no point in adding damage
    enhancing magic to a necklace. If the enchantment succeeds, the item gains the magical traits
    from the Powerstone. If the enchantment fails, the object is destroyed, but the stone may be
    used again. There can only be one enchantment on an object.
  scope: global
  type: modifier
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: is_wizard
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: knows_enchant_item
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: has_powerstone
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: item_at_full_durability
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: item_suitable_for_powerstone
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: existing_enchantments
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: travelling
            right:
              type: literal
              value: false
    - type: set
      target: enchantments
      value:
        type: literal
        value: 1
    - type: set
      target: powerstone_traits_gained
      value:
        type: literal
        value: true
  fields:
    enchant_spell_succeeded:
      type: boolean
      role: input
      description: enchant spell succeeded
    is_wizard:
      type: boolean
      role: input
      description: is wizard
    knows_enchant_item:
      type: boolean
      role: input
      description: knows enchant item
    has_powerstone:
      type: boolean
      role: input
      description: has powerstone
    item_at_full_durability:
      type: boolean
      role: input
      description: item at full durability
    item_suitable_for_powerstone:
      type: boolean
      role: input
      description: item suitable for powerstone
    existing_enchantments:
      type: number
      role: input
      description: existing enchantments
    travelling:
      type: boolean
      role: input
      description: travelling
    enchantments:
      type: number
      role: output
      description: enchantments
    powerstone_traits_gained:
      type: boolean
      role: output
      description: powerstone traits gained
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enchant_spell_succeeded
    right:
      type: literal
      value: true
  unresolved_references:
    - Powerstone traits are table-backed supplied results. Success does not state here whether the
      stone is consumed; do not infer it.
  dependencies:
    - key: enchant_spell
      label: Enchant Item
      object_id: spell.enchant_item
    - key: powerstone_traits
      label: Powerstone traits and permitted objects
      object_id: table.treasure.powerstones
