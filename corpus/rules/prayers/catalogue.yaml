- id: character.prayer.duration
  name: duration
  section_id: section.prayers.duration
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 82
      printed_page: 80
      heading: Duration
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A prayer will last until the end of the current battle, unless otherwise noted. If a prayer is
    used between battles, it lasts for 4 turns. Only one prayer can be active at once.
  type: modifier
  scope: global
  fields:
    active_prayers:
      type: number
      role: input
      description: active prayers
    maximum_active_prayers:
      type: number
      role: output
      description: maximum active prayers
    between_battles_turns:
      type: number
      role: output
      description: between battles turns
    default_duration:
      type: string
      role: output
      description: default duration
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: active_prayers
        right:
          type: literal
          value: 1
    - type: set
      target: maximum_active_prayers
      value:
        type: literal
        value: 1
    - type: set
      target: between_battles_turns
      value:
        type: literal
        value: 4
    - type: set
      target: default_duration
      value:
        type: literal
        value: current battle
- id: character.prayer.interruption
  name: interruption
  section_id: section.prayers.interruption
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 82
      printed_page: 80
      heading: Interruption
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A priest that is either stunned, falls over, reaches 0 HP, or fails a Terror Test, stops
    chanting and the prayer is cancelled.
  type: modifier
  scope: global
  fields:
    stunned:
      type: boolean
      role: input
      description: stunned
    fallen_over:
      type: boolean
      role: input
      description: fallen over
    hp:
      type: number
      role: input
      description: hp
    terror_failed:
      type: boolean
      role: input
      description: terror failed
    prayer_active:
      type: boolean
      role: output
      description: prayer active
  effects:
    - type: set
      target: prayer_active
      value:
        type: literal
        value: false
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: stunned
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: fallen_over
        right:
          type: literal
          value: true
      - type: compare
        operator: lte
        left:
          type: field
          name: hp
        right:
          type: literal
          value: 0
      - type: compare
        operator: eq
        left:
          type: field
          name: terror_failed
        right:
          type: literal
          value: true
