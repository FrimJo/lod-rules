    The Warrior Priest must roll equal to or below their Battle Prayer Skill to succeed. If
    successful, the prayer will take effect. ... In certain cases, there can be an opposed Resolve
    Test from the enemies to avoid the effect.
  type: modifier
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
    battle_prayer:
      type: number
      role: input
      description: battle prayer
    prayer_succeeded:
      type: boolean
      role: output
      description: prayer succeeded
  effects:
    - type: set
      target: prayer_succeeded
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: battle_prayer
