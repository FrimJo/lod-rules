      section: Level 1 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The party gets +10 RES on any Fear or Terror Test during the battle. If they have already
    failed these tests, they may retake them with this bonus.
  type: modifier
  scope: global
  fields:
    prayer_active:
      type: boolean
      role: input
      description: prayer active
    res_modifier:
      type: number
      role: output
      description: res modifier
    tests:
      type: string
      role: output
      description: tests
    retake_failed_tests:
      type: boolean
      role: output
      description: retake failed tests
  effects:
    - type: set
      target: res_modifier
      value:
        type: literal
        value: 10
    - type: set
      target: tests
      value:
        type: literal
        value: Fear or Terror
    - type: set
      target: retake_failed_tests
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: prayer_active
    right:
      type: literal
      value: true
  entity_id: prayer.the_power_of_iphy
- id: character.prayer.charus_walk_with_us
  name: charus walk with us
  section_id: section.prayers.charus_walk_with_us
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 82
      printed_page: 80
      heading: Charus, Walk with Us
      section: Level 1 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    This prayer goes to Charus and as long as he listens, all heroes regain an Energy Point on any
    skill roll of 01-10, instead of the normal 01-05. Note that this only affects energy, not the
    other options you have if you roll 01-05.
  type: modifier
  scope: global
  fields:
    prayer_active:
      type: boolean
      role: input
      description: prayer active
    skill_roll:
      type: number
      role: input
      description: skill roll
    energy_regained:
      type: number
      role: output
      description: energy regained
    other_perfect_options_unchanged:
      type: boolean
      role: output
      description: other perfect options unchanged
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: skill_roll
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: skill_roll
        right:
          type: literal
          value: 10
    - type: set
      target: energy_regained
      value:
        type: literal
        value: 1
    - type: set
      target: other_perfect_options_unchanged
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: prayer_active
    right:
      type: literal
      value: true
  entity_id: prayer.charus_walk_with_us
