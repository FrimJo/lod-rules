- id: character.prayer.gods_champion.after_battle.constitution
  name: constitution
  section_id: section.prayers.gods_champion
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 83
      printed_page: 81
      heading: God’s Champion
      section: Level 4 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    If there are not enough points, the Constitution of the priest is halved (RDD) until the next
    short rest or until the heroes leave the dungeon.
  type: modifier
  scope: global
  fields:
    battle_ended:
      type: boolean
      role: input
      description: battle ended
    energy:
      type: number
      role: input
      description: energy
    constitution:
      type: number
      role: input
      description: constitution
    constitution_after:
      type: number
      role: output
      description: constitution after
    penalty_duration:
      type: string
      role: output
      description: penalty duration
  effects:
    - type: set
      target: constitution_after
      value:
        type: arithmetic
        operator: floor
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: constitution
              - type: literal
                value: 2
    - type: set
      target: penalty_duration
      value:
        type: literal
        value: until next short rest or dungeon exit
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: battle_ended
        right:
          type: literal
          value: true
      - type: compare
        operator: lt
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
