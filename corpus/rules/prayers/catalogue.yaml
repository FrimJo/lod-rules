- id: character.prayer.learning_restriction
  name: learning new prayers
  section_id: section.prayers.learning_new_prayers
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 82
      printed_page: 80
      heading: Learning New Prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A priest may learn all prayers that are the same level or lower level than the priest,
    provided they can pay for it. This is done in the Inner Sanctum in Silver City.
  type: constraint
  scope: settlement
  fields:
    hero_level:
      type: number
      role: input
      description: The priest's current level.
      integer: true
      minimum: 1
    prayer_level:
      type: number
      role: input
      description: The level of the prayer to be learned.
      integer: true
      minimum: 1
    settlement:
      type: string
      role: input
      description: Settlement where the learning takes place.
    learnable:
      type: boolean
      role: output
      description: Whether the prayer may be learned here by this priest.
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: prayer_level
        right:
          type: field
          name: hero_level
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: settlement
        right:
          type: literal
          value: silver_city
    - type: set
      target: learnable
      value:
        type: literal
        value: true
  dependencies:
    - key: inner_sanctum_learning
      label: Learning a New Prayer in the Inner Sanctum (price, one prayer per dungeon visit, 1 day)
      object_id: character.settlement.guild.inner_sanctum.learning
    - key: learn_prayer
      label: Learn a new prayer
      object_id: procedure.learn_prayer
  see_also:
    - section.the_inner_sanctum.learning_a_new_prayer
