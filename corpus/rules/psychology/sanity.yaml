- id: character.condition.irrational_fear
  name: condition irrational fear
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: The hero becomes irrationally afraid of a specific type of monster. Randomize
    between Orcs and Goblins, Beasts, Undead, Reptiles, or Dark Elves. All monsters from that
    faction will now cause fear to the hero.
  type: calculation
  scope: global
  fields:
    selected_faction:
      type: string
      role: input
      description: selected faction
    matches_faction:
      type: boolean
      role: input
      description: matches faction
    causes_fear:
      type: boolean
      role: state
      description: causes fear
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_faction
            right:
              type: literal
              value: Orcs and Goblins
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_faction
            right:
              type: literal
              value: Beasts
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_faction
            right:
              type: literal
              value: Undead
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_faction
            right:
              type: literal
              value: Reptiles
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_faction
            right:
              type: literal
              value: Dark Elves
    - type: set
      target: causes_fear
      value:
        type: literal
        value: true
  optional_system: sanity
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: matches_faction
    right:
      type: literal
      value: true
  unresolved_references:
    - 'Randomize between the five printed factions: selection method is not specified.'
