- id: character.sanity.draw_condition
  name: sanity draw condition
  section_id: section.psychology.sanity.conditions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 53
      pdf_page: 55
      heading: Conditions
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Once you reach 0 Sanity, you contract a mental health condition. Roll on the table
    on page 55.
  type: calculation
  scope: global
  fields:
    sanity:
      type: number
      role: input
      description: sanity
    die:
      type: number
      role: input
      description: die
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    condition_name:
      type: string
      role: state
      description: condition name
  effects:
    - type: lookup
      table_id: table.psychology.mental_conditions
      key_column: roll
      key:
        type: field
        name: die
      value_column: condition
      target: condition_name
      on_missing_issue: issue.phase4.sanity_boundaries
  optional_system: sanity
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: sanity
    right:
      type: literal
      value: 0
  uses_tables:
    - table.psychology.mental_conditions
