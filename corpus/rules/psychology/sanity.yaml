      value: true
- id: character.sanity.acquire_condition
  name: sanity acquire condition
  section_id: section.psychology.sanity.conditions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 53
      pdf_page: 55
      heading: Conditions
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Once a hero has a condition, the Sanity Level will go back up to 8 minus the number
    of current conditions. That is, if you have two active conditions, your maximum Sanity is
    now 6.
  type: calculation
  scope: global
  fields:
    already_diagnosed:
      type: boolean
      role: input
      description: already diagnosed
    current_conditions:
      type: number
      role: state
      description: current conditions
      integer: true
      minimum: 0
      maximum: 9
    sanity:
      type: number
      role: state
      description: sanity
    maximum_sanity:
      type: number
      role: state
      description: maximum sanity
  effects:
    - type: add
      target: current_conditions
      value:
        type: literal
        value: 1
      duration: immediate
    - type: set
      target: sanity
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: literal
            value: 8
          - type: field
            name: current_conditions
    - type: set
      target: maximum_sanity
      value:
        type: field
        name: sanity
  optional_system: sanity
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: already_diagnosed
        right:
          type: literal
          value: false
      - type: compare
        operator: lt
        left:
          type: field
          name: current_conditions
        right:
          type: literal
          value: 7
- id: character.sanity.boundary_uncertain
  name: sanity boundary uncertain
  section_id: section.psychology.sanity.conditions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 53
      pdf_page: 55
      heading: Conditions
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Once you have 0 points, you will develop a mental health problem. Once a hero has a
    condition, the Sanity Level will go back up to 8 minus the number of current conditions.
  type: calculation
  scope: global
  fields:
    sanity:
      type: number
      role: input
      description: sanity
    current_conditions:
      type: number
      role: input
      description: current conditions
      integer: true
      minimum: 0
      maximum: 9
    no_distinct_condition_left:
      type: boolean
      role: input
      description: no distinct condition left
  effects:
    - type: unresolved
      issue_id: issue.phase4.sanity_boundaries
  optional_system: sanity
  when:
    type: any
    conditions:
      - type: compare
        operator: lt
        left:
          type: field
          name: sanity
        right:
          type: literal
          value: 0
      - type: compare
        operator: gte
        left:
          type: field
          name: current_conditions
        right:
          type: literal
          value: 7
      - type: compare
        operator: eq
        left:
          type: field
          name: no_distinct_condition_left
        right:
          type: literal
          value: true
  issues:
    - issue.phase4.sanity_boundaries
