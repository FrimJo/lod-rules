- id: character.condition.acute_stress
  name: condition acute stress
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: RES reduced by 10 for the rest of the quest. The hero will scream uncontrollably
    during all battles, alerting every single soul in the dungeon. Threat Level is increased by
    an additional +1 for each battle from now until the end of the quest. This only lasts for
    the current quest.
  type: calculation
  scope: quest
  fields:
    resolve_modifier:
      type: number
      role: state
      description: resolve modifier
    extra_threat_per_battle:
      type: number
      role: state
      description: extra threat per battle
    screams_during_battles:
      type: boolean
      role: state
      description: screams during battles
  effects:
    - type: set
      target: resolve_modifier
      value:
        type: literal
        value: -10
    - type: set
      target: extra_threat_per_battle
      value:
        type: literal
        value: 1
    - type: set
      target: screams_during_battles
      value:
        type: literal
        value: true
  optional_system: sanity
  issues:
    - issue.0004
  duration: current_quest
  timing_refs:
    - term.end_of_the_quest
    - term.until_end_of_next_quest
- id: character.condition.lingering_trauma
  name: condition lingering trauma
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: The effect of this condition will not be evident until your next dungeon and only
    during a specific situation that in some way resembles or reminds the character of the
    situation that triggered the syndrome. See separate table below. Once the trauma kicks in,
    all Resolve Tests are at -10 and CS is at -10. Once triggered, it will last until you leave
    the dungeon.
  type: calculation
  scope: global
  fields:
    next_dungeon:
      type: boolean
      role: input
      description: next dungeon
    trigger_occurred:
      type: boolean
      role: input
      description: trigger occurred
    active_until_dungeon_exit:
      type: boolean
      role: state
      description: active until dungeon exit
    trauma_resolve_modifier:
      type: number
      role: state
      description: Contribution from Lingering Trauma only.
    trauma_combat_skill_modifier:
      type: number
      role: state
      description: Contribution from Lingering Trauma only.
  effects:
    - type: set
      target: trauma_resolve_modifier
      value:
        type: literal
        value: -10
    - type: set
      target: trauma_combat_skill_modifier
      value:
        type: literal
        value: -10
    - type: set
      target: active_until_dungeon_exit
      value:
        type: literal
        value: true
  optional_system: sanity
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: next_dungeon
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: trigger_occurred
        right:
          type: literal
          value: true
  uses_tables:
    - table.psychology.lingering_trauma
  duration: until_dungeon_exit
  timing_refs:
    - term.dungeon_departure
