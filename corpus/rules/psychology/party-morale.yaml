- id: character.morale.wavering
  name: morale wavering
  section_id: section.psychology.party_morale
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 56
      pdf_page: 58
      heading: Party Morale
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If the PM drops below half, the party will begin to waver. All heroes suffer a -20 RES.
  type: calculation
  scope: global
  fields:
    starting_morale:
      type: number
      role: input
      description: starting morale
    morale:
      type: number
      role: input
      description: morale
    morale_resolve_modifier:
      type: number
      role: state
      description: Resolve modifier contributed by wavering Party Morale, separately from other effects.
  effects:
    - type: set
      target: morale_resolve_modifier
      value:
        type: literal
        value: -20
  optional_system: party_morale
  when:
    type: compare
    operator: lt
    left:
      type: field
      name: morale
    right: &a1
      type: arithmetic
      operator: floor
      values:
        - type: arithmetic
          operator: divide
          values:
            - type: field
              name: starting_morale
            - type: literal
              value: 2
  applies_to: all_heroes
- id: character.morale.recovered
  name: morale recovered
