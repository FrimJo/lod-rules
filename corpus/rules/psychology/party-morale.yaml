      pdf_page: 58
      heading: Party Morale
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: As soon as the morale is raised above this threshold, the effect on RES is removed.
  type: calculation
  scope: global
  fields:
    starting_morale:
      type: number
      role: input
      description: starting morale
    morale:
      type: number
      role: input
      description: morale
    morale_resolve_modifier:
      type: number
      role: state
      description: morale resolve modifier
  effects:
    - type: set
      target: morale_resolve_modifier
      value:
        type: literal
        value: 0
  optional_system: party_morale
  when:
    type: compare
    operator: gt
    left:
      type: field
      name: morale
    right: *a1
  applies_to: all_heroes
