- id: character.morale.flee
  name: morale flee
  section_id: section.psychology.party_morale
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 56
      pdf_page: 58
      heading: Party Morale
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If the PM ever reaches 0, the party will leave the dungeon as soon as they are not
    locked in combat, and quickly head for civilization. There is no need to actually move your
    heroes out of the dungeon. Instead, go straight to ‘Travel Events’ for the travel home.
  type: calculation
  scope: global
  fields:
    morale:
      type: number
      role: input
      description: morale
    locked_in_combat:
      type: boolean
      role: input
      description: locked in combat
    leave_dungeon:
      type: boolean
      role: state
      description: leave dungeon
    move_models_out:
      type: boolean
      role: state
      description: move models out
  effects:
    - type: set
      target: leave_dungeon
      value:
        type: literal
        value: true
    - type: set
      target: move_models_out
      value:
        type: literal
        value: false
    - type: invoke
      dependency: travel_home
  optional_system: party_morale
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: morale
        right:
          type: literal
          value: 0
      - type: compare
        operator: eq
        left:
          type: field
          name: locked_in_combat
        right:
          type: literal
          value: false
  dependencies:
    - key: travel_home
      label: Travel Events for the travel home
      section_id: section.travelling_and_skirmishes
