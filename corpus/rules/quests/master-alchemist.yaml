  scope: quest
  quest_id: quest.lava_river.master_alchemist
  fields:
    all_objective_creatures_defeated:
      type: boolean
      role: input
      description: All Objective Room creatures are defeated.
    alternative_exit_found:
      type: boolean
      role: output
      description: Alternative exit.
    may_leave_immediately:
      type: boolean
      role: output
      description: Immediate departure.
  effects:
    - type: set
      target: alternative_exit_found
      value:
        type: literal
        value: true
    - type: set
      target: may_leave_immediately
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: all_objective_creatures_defeated
    right:
      type: literal
      value: true
