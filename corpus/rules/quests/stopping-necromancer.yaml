      role: output
      description: reward per hero
      integer: true
  effects:
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 300
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ragnalf_dead
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: heroes_back_in_town
        right:
          type: literal
          value: true
