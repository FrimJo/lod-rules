- id: core.quest.stopping_necromancer.setup
  name: Stopping the Necromancer — setup
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Find and kill Ragnalf the Mad in a ruined fort near the settlement. Quest Location: No
    travel necessary. Special rules: - Number of tiles: 7 corridors, 7 rooms. Reward: 300 c per
    hero. Encounters: Undead.'
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    objective:
      type: string
      role: output
      description: objective
    location:
      type: string
      role: output
      description: location
    special_rules_printed:
      type: string
      role: output
      description: special rules printed
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    advertised_reward_per_hero:
      type: number
      role: output
      description: advertised reward per hero
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
  effects:
    - type: set
      target: objective
      value:
        type: literal
        value: find and kill Ragnalf the Mad
    - type: set
      target: location
      value:
        type: literal
        value: No travel necessary
    - type: set
      target: special_rules_printed
      value:
        type: literal
        value: '-'
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: advertised_reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
- id: core.quest.stopping_necromancer.objective_setup
  name: Stopping the Necromancer — Objective Room setup
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — Objective Room setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Place the Necromancer at the far end of the room. Place 6 Zombies armed with longswords
    close to him. Heroes enter along a short side.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    ragnalf_position:
      type: string
      role: output
      description: ragnalf position
    zombies:
      type: number
      role: output
      description: zombies
      integer: true
    zombie_weapon:
      type: string
      role: output
      description: zombie weapon
    zombie_position:
      type: string
      role: output
      description: zombie position
    hero_entry:
      type: string
      role: output
      description: hero entry
  effects:
    - type: set
      target: ragnalf_position
      value:
        type: literal
        value: far end of the room
    - type: set
      target: zombies
      value:
        type: literal
        value: 6
    - type: set
      target: zombie_weapon
      value:
        type: literal
        value: longswords
    - type: set
      target: zombie_position
      value:
        type: literal
        value: close to Ragnalf
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side
  dependencies:
    - key: longsword
      label: Longsword
      object_id: equipment.weapon.longsword
    - key: zombies
      label: Zombie statistics are not printed in this quest; supply their outcomes
- id: core.quest.stopping_necromancer.ragnalf
  name: Ragnalf the Mad — equipment, spells and treasure
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Ragnalf the Mad — equipment, spells and treasure
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Ragnalf knows Raise Dead, 3 Ranged Spells and 2 Close-combat spells. Armed with a
    poisonous dagger and Armour 0. XP 200, T4.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    raise_dead_known:
      type: boolean
      role: output
      description: raise dead known
    ranged_spells:
      type: number
      role: output
      description: ranged spells
      integer: true
    close_combat_spells:
      type: number
      role: output
      description: close combat spells
      integer: true
    weapon:
      type: string
      role: output
      description: weapon
    armour:
      type: number
      role: output
      description: armour
      integer: true
    xp:
      type: number
      role: output
      description: xp
      integer: true
    treasure_table:
      type: string
      role: output
      description: treasure table
  effects:
    - type: set
      target: raise_dead_known
      value:
        type: literal
        value: true
    - type: set
      target: ranged_spells
      value:
        type: literal
        value: 3
    - type: set
      target: close_combat_spells
      value:
        type: literal
        value: 2
    - type: set
      target: weapon
      value:
        type: literal
        value: poisonous dagger
    - type: set
      target: armour
      value:
        type: literal
        value: 0
    - type: set
      target: xp
      value:
        type: literal
        value: 200
    - type: set
      target: treasure_table
      value:
        type: literal
        value: T4
  entity_id: quest_actor.great_crypt.ragnalf
  dependencies:
    - key: raise_dead
      label: Raise Dead
      object_id: spell.raise_dead
    - key: dagger
      label: Dagger; poison outcome remains supplied
      object_id: equipment.weapon.dagger
    - key: poison
      label: Poison damage follow-up with supplied poison strength
      object_id: procedure.damage_follow_up
    - key: treasure
      label: T4 Treasure Table
      object_id: table.treasure.t4
  unresolved_references:
    - Three Ranged Spells and two Close-combat spells are not named and have no printed selection
      method. The poisonous dagger has no specified poison strength.
  issues:
    - issue.quest.ragnalf_unspecified_spells_poison
- id: core.quest.stopping_necromancer.corpse_floor
  name: Stopping the Necromancer — corpse-covered floor
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — corpse-covered floor
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Moving across corpses and fighting at the same time is very difficult. All CS and RS
    are reduced by 10% for the heroes.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    hero_in_objective_room:
      type: boolean
      role: input
      description: hero in objective room
    cs_modifier:
      type: number
      role: output
      description: cs modifier
      integer: true
    rs_modifier:
      type: number
      role: output
      description: rs modifier
      integer: true
  effects:
    - type: set
      target: cs_modifier
      value:
        type: literal
        value: -10
    - type: set
      target: rs_modifier
      value:
        type: literal
        value: -10
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hero_in_objective_room
    right:
      type: literal
      value: true
- id: core.quest.stopping_necromancer.fall
  name: Stopping the Necromancer — losing balance
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — losing balance
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Any To Hit roll of 90 or more means that hero loses balance and falls. The hero must
    spend the next action getting up; a DEX Test is required to succeed.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    hero_in_objective_room:
      type: boolean
      role: input
      description: hero in objective room
    to_hit_roll:
      type: number
      role: input
      description: to hit roll
      integer: true
      minimum: 1
      maximum: 100
    hero_fallen:
      type: boolean
      role: output
      description: hero fallen
    next_action_getting_up_required:
      type: boolean
      role: output
      description: next action getting up required
    dex_test_required:
      type: boolean
      role: output
      description: dex test required
  effects:
    - type: set
      target: hero_fallen
      value:
        type: literal
        value: true
    - type: set
      target: next_action_getting_up_required
      value:
        type: literal
        value: true
    - type: set
      target: dex_test_required
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_in_objective_room
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: to_hit_roll
        right:
          type: literal
          value: 90
- id: core.quest.stopping_necromancer.getting_up_success
  name: Stopping the Necromancer — successful getting up
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — successful getting up
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero must spend the next action getting up. The corpses try to pull them down
    again, and a DEX Test is required to succeed.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    hero_in_objective_room:
      type: boolean
      role: input
      description: hero in objective room
    hero_fallen:
      type: boolean
      role: state
      description: hero fallen
    next_action_spent_getting_up:
      type: boolean
      role: input
      description: next action spent getting up
    dex_test_succeeded:
      type: boolean
      role: input
      description: dex test succeeded
    getting_up_succeeded:
      type: boolean
      role: output
      description: getting up succeeded
  effects:
    - type: set
      target: hero_fallen
      value:
        type: literal
        value: false
    - type: set
      target: getting_up_succeeded
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_in_objective_room
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_fallen
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: next_action_spent_getting_up
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: dex_test_succeeded
        right:
          type: literal
          value: true
- id: core.quest.stopping_necromancer.zombie_protection
  name: Stopping the Necromancer — zombie protection
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer — zombie protection
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The zombies standing next to Ragnalf will not move toward the heroes, but instead form
    a circle to protect him.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.stopping_necromancer
  fields:
    ragnalf_dead:
      type: boolean
      role: input
      description: ragnalf dead
    zombies_advance_toward_heroes:
      type: boolean
      role: output
      description: zombies advance toward heroes
    zombie_formation:
      type: string
      role: output
      description: zombie formation
  effects:
    - type: set
      target: zombies_advance_toward_heroes
      value:
        type: literal
        value: false
    - type: set
      target: zombie_formation
      value:
        type: literal
        value: circle to protect Ragnalf
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ragnalf_dead
    right:
      type: literal
      value: false
- id: core.quest.stopping_necromancer.ragnalf_death
  name: Stopping the Necromancer — Ragnalf dies
