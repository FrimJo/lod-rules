      target: all_zombies_dead
      value:
        type: literal
        value: true
    - type: set
      target: corpse_floor_movement_stopped
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ragnalf_dead
    right:
      type: literal
      value: true
- id: core.quest.stopping_necromancer.reward
  name: Stopping the Necromancer — aftermath reward
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
