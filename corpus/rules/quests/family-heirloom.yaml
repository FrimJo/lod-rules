      role: output
      description: door side
  effects:
    - type: set
      target: tombs
      value:
        type: literal
        value: 6
    - type: set
      target: initial_enemies
      value:
        type: literal
        value: 0
    - type: set
      target: hero_position
      value:
        type: literal
        value: where they were when the door was opened
    - type: set
      target: door_side
      value:
        type: literal
        value: short side
- id: core.quest.family_heirloom.cards
  name: Retrieving the Family Heirloom — cards
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: Retrieving the Family Heirloom — cards
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Take 6 playing cards (3 black, 1 red and 2 dressed cards). Shuffle them and place them
    with their backs up.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.family_heirloom
  fields:
    playing_cards:
      type: number
      role: output
      description: playing cards
      integer: true
    black_cards:
      type: number
      role: output
      description: black cards
      integer: true
    red_cards:
      type: number
      role: output
      description: red cards
      integer: true
    dressed_cards:
      type: number
      role: output
      description: dressed cards
      integer: true
    shuffle_cards:
      type: boolean
      role: output
      description: shuffle cards
    cards_face_down:
      type: boolean
      role: output
      description: cards face down
  effects:
    - type: set
      target: playing_cards
      value:
        type: literal
        value: 6
    - type: set
      target: black_cards
      value:
        type: literal
        value: 3
    - type: set
      target: red_cards
      value:
        type: literal
        value: 1
    - type: set
      target: dressed_cards
      value:
        type: literal
        value: 2
    - type: set
      target: shuffle_cards
      value:
        type: literal
        value: true
    - type: set
      target: cards_face_down
      value:
        type: literal
        value: true
  issues:
    - issue.quest.heirloom_card_categories
- id: core.quest.family_heirloom.open_tomb
  name: Retrieving the Family Heirloom — opening a tomb
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: Retrieving the Family Heirloom — opening a tomb
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Opening a tomb takes a complete turn for 2 heroes working together (the lids are really
    heavy). Once the lid is off, draw one of the cards.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.family_heirloom
  fields:
    heroes_working_together:
      type: number
      role: input
      description: heroes working together
      integer: true
    complete_turn_spent:
      type: boolean
      role: input
      description: complete turn spent
    lid_removed:
      type: boolean
      role: output
      description: lid removed
    cards_to_draw:
      type: number
      role: output
      description: cards to draw
      integer: true
  effects:
    - type: set
      target: lid_removed
      value:
        type: literal
        value: true
    - type: set
      target: cards_to_draw
      value:
        type: literal
        value: 1
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: heroes_working_together
        right:
          type: literal
          value: 2
      - type: compare
        operator: eq
        left:
          type: field
          name: complete_turn_spent
        right:
          type: literal
          value: true
