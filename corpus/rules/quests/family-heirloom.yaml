- id: core.quest.family_heirloom.setup
  name: Retrieving the Family Heirloom — setup
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: Retrieving the Family Heirloom — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Quest Location: In the settlement. Number of Tiles: 8 corridors, 8 rooms using the
    tiles R1B-8B. Reward: 300 c per hero. Encounters: Undead.'
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.family_heirloom
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    room_tiles:
      type: string
      role: output
      description: room tiles
    advertised_reward_per_hero:
      type: number
      role: output
      description: advertised reward per hero
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: In the settlement
    - type: set
      target: corridors
      value:
        type: literal
        value: 8
    - type: set
      target: rooms
      value:
        type: literal
        value: 8
    - type: set
      target: room_tiles
      value:
        type: literal
        value: R1B-8B
    - type: set
      target: advertised_reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
  dependencies:
    - key: sword
      label: Knight’s family sword
      object_id: equipment.quest.family_heirloom_sword
- id: core.quest.family_heirloom.brotherhood_corpses
  name: Retrieving the Family Heirloom — Brotherhood corpse exception
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: Retrieving the Family Heirloom — Brotherhood corpse exception
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Ignore any special rules for dead members of the Brotherhood. Treat these corpses as
    dead adventurers and search them accordingly.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.family_heirloom
  fields:
    ignore_dead_brotherhood_special_rules:
      type: boolean
      role: output
      description: ignore dead brotherhood special rules
    brotherhood_corpses_treated_as:
      type: string
      role: output
      description: brotherhood corpses treated as
    search_as_dead_adventurers:
      type: boolean
      role: output
      description: search as dead adventurers
  effects:
    - type: set
      target: ignore_dead_brotherhood_special_rules
      value:
        type: literal
        value: true
    - type: set
      target: brotherhood_corpses_treated_as
      value:
        type: literal
        value: dead adventurers
    - type: set
      target: search_as_dead_adventurers
      value:
        type: literal
        value: true
  dependencies:
    - key: dead_adventurer_search
      label: Dead adventurer findings
      object_id: character.treasure.furniture.dead_adventurer
- id: core.quest.family_heirloom.scenario_trigger
  name: Retrieving the Family Heirloom — Scenario trigger
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: Retrieving the Family Heirloom — Scenario trigger
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Scenario die is triggered on 8-10.
  type: scenario_rule
  scope: quest
  quest_id: quest.great_crypt.family_heirloom
  fields:
    scenario_roll:
      type: number
      role: input
      description: scenario roll
      integer: true
      minimum: 1
      maximum: 10
    scenario_die_triggered:
      type: boolean
      role: output
      description: scenario die triggered
  effects:
    - type: set
      target: scenario_die_triggered
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: scenario_roll
        right:
          type: literal
          value: 8
      - type: compare
        operator: lte
        left:
          type: field
          name: scenario_roll
        right:
          type: literal
          value: 10
- id: core.quest.family_heirloom.objective_setup
