- id: core.quest.pyramid_xanthu.ancient_aftermath
  name: Pyramid of Xánthu — Ancient Land aftermath
  section_id: section.quest_book_i.quests_into_the_ancient_lands.the_pyramid_of_x_nthu
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 264
      printed_page: 262
      heading: Pyramid of Xánthu — Ancient Land aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Once the chamber goes quiet, heroes search the entire room. Behind movable stones is a
    beautiful chest that may be searched as an objective chest.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.pyramid_xanthu
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    chamber_goes_quiet:
      type: boolean
      role: input
      description: Source chamber-clear prerequisite; undead must be dispatched before thorough examination.
    objective_chests:
      type: number
      role: output
      description: objective chests
      integer: true
    objective_chest_search_allowed:
      type: boolean
      role: output
      description: objective chest search allowed
    chest_position:
      type: string
      role: output
      description: chest position
  effects:
    - type: set
      target: objective_chests
      value:
        type: literal
        value: 1
    - type: set
      target: objective_chest_search_allowed
      value:
        type: literal
        value: true
    - type: set
      target: chest_position
      value:
        type: literal
        value: behind movable stones
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ancient_tiles_available
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: chamber_goes_quiet
        right:
          type: literal
          value: true
  dependencies:
    - key: aftermath
      label: Aftermath findings have no traps/locks and may be looted off table
      object_id: core.quest_book.aftermath_looting
