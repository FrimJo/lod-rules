- id: core.quest.pyramid_xanthu.furniture_reroll
  name: Pyramid of Xánthu — Furniture Chart rerolls
  section_id: section.quest_book_i.quests_into_the_ancient_lands.the_pyramid_of_x_nthu
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 264
      printed_page: 262
      heading: Pyramid of Xánthu — Furniture Chart rerolls
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Due to abundance of treasure, you may re-roll 4 rolls on the Furniture Chart during the
    quest. A re-roll may never be re-rolled.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.pyramid_xanthu
  fields:
    furniture_chart_roll:
      type: boolean
      role: input
      description: furniture chart roll
    already_a_reroll:
      type: boolean
      role: input
      description: already a reroll
    furniture_rerolls_used_this_quest:
      type: number
      role: input
      description: furniture rerolls used this quest
      integer: true
      minimum: 0
    furniture_reroll_allowed:
      type: boolean
      role: output
      description: furniture reroll allowed
  effects:
    - type: set
      target: furniture_reroll_allowed
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: furniture_chart_roll
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: already_a_reroll
        right:
          type: literal
          value: false
      - type: compare
        operator: gte
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 0
      - type: compare
        operator: lt
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 4
  dependencies:
    - key: furniture
      label: Furniture treasure findings
      section_id: section.appendix_v_treasures.treasure_found_in_furniture
- id: core.quest.pyramid_xanthu.ancient_objective_setup
  name: Pyramid of Xánthu — Ancient Land setup
  section_id: section.quest_book_i.quests_into_the_ancient_lands.the_pyramid_of_x_nthu
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 264
      printed_page: 262
      heading: Pyramid of Xánthu — Ancient Land setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Use the Large Tomb tile. Heroes enter along one of the short edges. Make 2 Encounter
    Table rolls and place undead randomly in the room. Two sarcophagi stand in the chamber centre
    surrounded by painted glyphs.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.pyramid_xanthu
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    objective_tile:
      type: string
      role: output
      description: objective tile
    hero_entry:
      type: string
      role: output
      description: hero entry
    encounter_table_rolls:
      type: number
      role: output
      description: encounter table rolls
      integer: true
    enemy_placement:
      type: string
      role: output
      description: enemy placement
    sarcophagi:
      type: number
      role: output
      description: sarcophagi
      integer: true
    sarcophagus_position:
      type: string
      role: output
      description: sarcophagus position
    painted_glyphs_surround_sarcophagi:
      type: boolean
      role: output
      description: painted glyphs surround sarcophagi
  effects:
    - type: set
      target: objective_tile
      value:
        type: literal
        value: Large Tomb
    - type: set
      target: hero_entry
      value:
        type: literal
        value: one of the short edges
    - type: set
      target: encounter_table_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: enemy_placement
      value:
        type: literal
        value: randomly in the room
    - type: set
      target: sarcophagi
      value:
        type: literal
        value: 2
    - type: set
      target: sarcophagus_position
      value:
        type: literal
        value: centre of the chamber
    - type: set
      target: painted_glyphs_surround_sarcophagi
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ancient_tiles_available
    right:
      type: literal
      value: true
- id: core.quest.pyramid_xanthu.ancient_awakening
  name: Xánthu — Ancient Land awakening
  section_id: section.quest_book_i.quests_into_the_ancient_lands.the_pyramid_of_x_nthu
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 264
      printed_page: 262
      heading: Xánthu — Ancient Land awakening
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If the Scenario roll is triggered during your stay in the Objective Room, Xánthu rises
    and joins the fight. Place a Mummy Priest next to one sarcophagus, armed with a dagger, 2
    support, 2 Ranged and 2 Close Combat spells.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.pyramid_xanthu
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    in_objective_room:
      type: boolean
      role: input
      description: in objective room
    scenario_roll_triggered:
      type: boolean
      role: input
      description: scenario roll triggered
    xanthu_joins_fight:
      type: boolean
      role: output
      description: xanthu joins fight
    xanthu_type:
      type: string
      role: output
      description: xanthu type
    xanthu_position:
      type: string
      role: output
      description: xanthu position
    weapon:
      type: string
      role: output
      description: weapon
    support_spells:
      type: number
      role: output
      description: support spells
      integer: true
    ranged_spells:
      type: number
      role: output
      description: ranged spells
      integer: true
    close_combat_spells:
      type: number
      role: output
      description: close combat spells
      integer: true
  effects:
    - type: set
      target: xanthu_joins_fight
      value:
        type: literal
        value: true
    - type: set
      target: xanthu_type
      value:
        type: literal
        value: Mummy Priest
    - type: set
      target: xanthu_position
      value:
        type: literal
        value: next to one of the sarcophagi
    - type: set
      target: weapon
      value:
        type: literal
        value: dagger
    - type: set
      target: support_spells
      value:
        type: literal
        value: 2
    - type: set
      target: ranged_spells
      value:
        type: literal
        value: 2
    - type: set
      target: close_combat_spells
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ancient_tiles_available
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: in_objective_room
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: scenario_roll_triggered
        right:
          type: literal
          value: true
  entity_id: quest_actor.ancient_lands.xanthu
  dependencies:
    - key: statistics
      label: Mummy Priest/Prince statistics not printed in this quest; supplied outcome required
    - key: dagger
      label: Dagger
      object_id: equipment.weapon.dagger
  issues:
    - issue.quest.xanthu_awakening_boundaries
  unresolved_references:
    - Two Support, two Ranged and two Close Combat spells are unnamed; no selection method is stated.
