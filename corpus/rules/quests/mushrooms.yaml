      target: reward_coins
      value:
        type: literal
        value: 250
    - type: set
      target: alchemist_payment_received
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: specimen_brought_back_to_alchemist
    right:
      type: literal
      value: true
- id: core.quest.mushrooms.gift
  name: Mushrooms — next-day potion
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — next-day potion
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A day later a messenger boy catches up and hands you a package with a carefully wrapped
    potion and a note from the Alchemist saying it is his new healing potion.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    alchemist_payment_received:
      type: boolean
      role: input
      description: alchemist payment received
    days_since_alchemist_payment:
      type: number
      role: input
      description: days since alchemist payment
      integer: true
    new_healing_potion_delivered:
      type: boolean
      role: output
      description: new healing potion delivered
    potions_delivered:
      type: number
      role: output
      description: potions delivered
      integer: true
  effects:
    - type: set
      target: new_healing_potion_delivered
      value:
        type: literal
        value: true
    - type: set
      target: potions_delivered
      value:
        type: literal
        value: 1
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: alchemist_payment_received
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: days_since_alchemist_payment
        right:
          type: literal
          value: 1
  dependencies:
    - key: potion
      label: Alchemist’s new healing potion
      object_id: equipment.quest.mushrooms_healing_potion
