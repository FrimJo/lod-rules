- id: core.quest.mushrooms.setup
  name: Mushrooms — setup
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'An alchemist requests a specimen of a mushroom growing indoors in dark, damp areas.
    Location: same dungeon as the next quest. Reward: 250 c. Encounters: as defined by the main
    quest. Objective room: No specific room.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    location:
      type: string
      role: output
      description: location
    advertised_reward_coins:
      type: number
      role: output
      description: advertised reward coins
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
    mushroom_habitat:
      type: string
      role: output
      description: mushroom habitat
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: advertised_reward_coins
      value:
        type: literal
        value: 250
    - type: set
      target: encounters
      value:
        type: literal
        value: as defined by the main quest
    - type: set
      target: objective_room
      value:
        type: literal
        value: No specific room
    - type: set
      target: mushroom_habitat
      value:
        type: literal
        value: indoors in dark, damp areas
- id: core.quest.mushrooms.deck
  name: Mushrooms — separate Dungeoneers Deck
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — separate Dungeoneers Deck
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Once the Dungeon Deck is done, take the same number of cards from the Dungeoneers Deck
    in a separate deck. Choose one specific card for the Side Quest Objective, mix that deck and
    place it next to the ordinary deck.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    dungeon_deck_done:
      type: boolean
      role: input
      description: dungeon deck done
    dungeon_deck_cards:
      type: number
      role: input
      description: dungeon deck cards
      integer: true
      minimum: 1
    auxiliary_deck_cards:
      type: number
      role: output
      description: auxiliary deck cards
      integer: true
    chosen_objective_cards:
      type: number
      role: output
      description: chosen objective cards
      integer: true
    mix_auxiliary_deck:
      type: boolean
      role: output
      description: mix auxiliary deck
    auxiliary_deck_next_to_ordinary:
      type: boolean
      role: output
      description: auxiliary deck next to ordinary
  effects:
    - type: set
      target: auxiliary_deck_cards
      value:
        type: field
        name: dungeon_deck_cards
    - type: set
      target: chosen_objective_cards
      value:
        type: literal
        value: 1
    - type: set
      target: mix_auxiliary_deck
      value:
        type: literal
        value: true
    - type: set
      target: auxiliary_deck_next_to_ordinary
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: dungeon_deck_done
    right:
      type: literal
      value: true
- id: core.quest.mushrooms.search_draw
  name: Mushrooms — search draw
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — search draw
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once you search a room or corridor, draw one card from this new deck. It does not
    matter whether the roll succeeds, as the mushrooms are not really hidden; it takes time to look
    through each room.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    search_attempt_made:
      type: boolean
      role: input
      description: search attempt made
    searched_tile_kind:
      type: string
      role: input
      description: searched tile kind
    auxiliary_cards_to_draw:
      type: number
      role: output
      description: auxiliary cards to draw
      integer: true
    search_roll_success_required:
      type: boolean
      role: output
      description: search roll success required
    search_takes_time:
      type: boolean
      role: output
      description: search takes time
  effects:
    - type: set
      target: auxiliary_cards_to_draw
      value:
        type: literal
        value: 1
    - type: set
      target: search_roll_success_required
      value:
        type: literal
        value: false
    - type: set
      target: search_takes_time
      value:
        type: literal
        value: true
  when: &a1
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: search_attempt_made
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: searched_tile_kind
            right:
              type: literal
              value: room
          - type: compare
            operator: eq
            left:
              type: field
              name: searched_tile_kind
            right:
              type: literal
              value: corridor
- id: core.quest.mushrooms.found
  name: Mushrooms — Objective Card found
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — Objective Card found
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the drawn card is the Side Quest Objective Card, you have found the mushrooms,
    regardless of search-roll success.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    search_attempt_made:
      type: boolean
      role: input
      description: search attempt made
    searched_tile_kind:
      type: string
      role: input
      description: searched tile kind
    drawn_card_is_side_quest_objective:
      type: boolean
      role: input
      description: drawn card is side quest objective
    mushrooms_found:
      type: boolean
      role: output
      description: mushrooms found
  effects:
    - type: set
      target: mushrooms_found
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - *a1
      - type: compare
        operator: eq
        left:
          type: field
          name: drawn_card_is_side_quest_objective
        right:
          type: literal
          value: true
  dependencies:
    - key: specimen
      label: Requested mushroom specimen
      object_id: equipment.quest.mushroom_specimen
- id: core.quest.mushrooms.reward
  name: Mushrooms — alchemist payment
  section_id: section.quest_book_i.side_quests.side_quest_6_mushrooms
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 279
      printed_page: 277
      heading: Mushrooms — alchemist payment
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'If you bring a specimen back, the alchemist rewards you. Reward: 250 c. The satisfied
    Alchemist pays the promised money.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mushrooms
  fields:
    specimen_brought_back_to_alchemist:
      type: boolean
      role: input
      description: specimen brought back to alchemist
    reward_coins:
      type: number
      role: output
      description: reward coins
      integer: true
    alchemist_payment_received:
      type: boolean
      role: output
      description: alchemist payment received
  effects:
