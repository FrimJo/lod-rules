- id: core.quest.burning_village.setup
  name: The Burning Village — setup
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Quest Location: Rochdale. Set up outdoor tiles. Roll twice on the Orcs and Goblins
    Encounter Chart and randomise placement along one board edge. Place one Orc Chieftain with
    battleaxe, shield and Armour 2 in the same way. Encounters: Orcs and Goblins; Reward: Special.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    location:
      type: string
      role: output
      description: location
    outdoor_tiles:
      type: boolean
      role: output
      description: outdoor tiles
    initial_encounter_rolls:
      type: number
      role: output
      description: initial encounter rolls
      integer: true
    encounter_chart:
      type: string
      role: output
      description: encounter chart
    initial_enemy_placement:
      type: string
      role: output
      description: initial enemy placement
    orc_chieftains:
      type: number
      role: output
      description: orc chieftains
      integer: true
    chieftain_placement:
      type: string
      role: output
      description: chieftain placement
    encounters:
      type: string
      role: output
      description: encounters
    reward_kind:
      type: string
      role: output
      description: reward kind
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Rochdale
    - type: set
      target: outdoor_tiles
      value:
        type: literal
        value: true
    - type: set
      target: initial_encounter_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: encounter_chart
      value:
        type: literal
        value: Orcs and Goblins Encounter Chart
    - type: set
      target: initial_enemy_placement
      value:
        type: literal
        value: randomised along one board edge
    - type: set
      target: orc_chieftains
      value:
        type: literal
        value: 1
    - type: set
      target: chieftain_placement
      value:
        type: literal
        value: in the same way
    - type: set
      target: encounters
      value:
        type: literal
        value: Orcs and Goblins
    - type: set
      target: reward_kind
      value:
        type: literal
        value: Special
  unresolved_references:
    - 'Orcs and Goblins Encounter Chart: outcomes are not printed in this quest.'
- id: core.quest.burning_village.pre_battle_rest
  name: The Burning Village — pre-battle rest
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — pre-battle rest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Heroes are allowed one rest before the battle. No roll for Travel Events is necessary.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    pre_battle_rests_allowed:
      type: number
      role: output
      description: pre battle rests allowed
      integer: true
    roll_travel_events:
      type: boolean
      role: output
      description: roll travel events
  effects:
    - type: set
      target: pre_battle_rests_allowed
      value:
        type: literal
        value: 1
    - type: set
      target: roll_travel_events
      value:
        type: literal
        value: false
  dependencies:
    - key: rest
      label: Rest, subject to the single pre-battle permission
      object_id: procedure.rest
