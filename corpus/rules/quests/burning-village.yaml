- id: core.quest.burning_village.reinforcements
  name: The Burning Village — Goblinoid reinforcements
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — Goblinoid reinforcements
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'A Scenario die result of 9 or 10 triggers reinforcements: roll once more on the OaG
    Table and place them cantered along a random table edge.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    scenario_roll:
      type: number
      role: input
      description: Supplied Scenario die result.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    reinforcements:
      type: boolean
      role: output
      description: Whether Goblinoid reinforcements are triggered.
    additional_encounter_rolls:
      type: number
      role: output
      description: One more OaG Table roll.
      integer: true
      minimum: 0
    reinforcement_table:
      type: string
      role: output
      description: Printed abbreviated encounter table.
    reinforcement_placement:
      type: string
      role: output
      description: Original placement wording retained; geometry interpretation is unresolved.
  effects:
    - type: set
      target: reinforcements
      value:
        type: literal
        value: true
    - type: set
      target: additional_encounter_rolls
      value:
        type: literal
        value: 1
    - type: set
      target: reinforcement_table
      value:
        type: literal
        value: OaG Table
    - type: set
      target: reinforcement_placement
      value:
        type: literal
        value: cantered along a random table edge
  when:
    type: compare
    operator: gte
    left:
      type: field
      name: scenario_roll
    right:
      type: literal
      value: 9
  issues:
    - issue.quest.burning_village_cantered
  unresolved_references:
    - 'OaG Table: reinforcement encounter outcomes are not printed in this quest.'
- id: core.quest.burning_village.no_reinforcements
  name: The Burning Village — other Scenario results
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — other Scenario results
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Only Scenario results 9 or 10 trigger the stated Goblinoid reinforcements.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    scenario_roll:
      type: number
      role: input
      description: Supplied Scenario die result.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    reinforcements:
      type: boolean
      role: output
      description: No reinforcement trigger for results 1–8.
  effects:
    - type: set
      target: reinforcements
      value:
        type: literal
        value: false
  when:
    type: compare
    operator: lt
    left:
      type: field
      name: scenario_roll
    right:
      type: literal
      value: 9
- id: core.quest.burning_village.victory
