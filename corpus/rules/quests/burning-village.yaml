- id: core.quest.burning_village.victory_aftermath
  name: The Burning Village — victorious aftermath
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — victorious aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If the heroes won, the Village Elder offers the party three random potions and one Fine
    Treasure. A payment-for-bodies note found among the chieftain belongings is signed Imgrahil.
    Continue travel to the city.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    quest_won:
      type: boolean
      role: input
      description: Confirmed victory.
    random_potions:
      type: number
      role: output
      description: Three random potions for the party.
      integer: true
      minimum: 0
    fine_treasures:
      type: number
      role: output
      description: One Fine Treasure for the party.
      integer: true
      minimum: 0
    body_payment_note_signer:
      type: string
      role: output
      description: Printed signer name.
    next_destination:
      type: string
      role: output
      description: Continue travel to the city.
  effects:
    - type: set
      target: random_potions
      value:
        type: literal
        value: 3
    - type: set
      target: fine_treasures
      value:
        type: literal
        value: 1
    - type: set
      target: body_payment_note_signer
      value:
        type: literal
        value: Imgrahil
    - type: set
      target: next_destination
      value:
        type: literal
        value: the city
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: quest_won
    right:
      type: literal
      value: true
  unresolved_references:
    - 'Three random potions and one Fine Treasure: resolved item outcomes must be supplied; this
      quest prints no potion identities or treasure value.'
- id: core.quest.burning_village.fled_aftermath
  name: The Burning Village — fled aftermath
  section_id: section.quest_book_i.the_dead_rising.quest_4_the_burning_village
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 231
      printed_page: 229
      heading: The Burning Village — fled aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the heroes fled, return to the forest; Orcs follow a short distance then turn back
    and burn the rest of the village. Continue travel to Silver City.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.burning_village
  fields:
    heroes_fled:
      type: boolean
      role: input
      description: Confirmed fleeing outcome.
    next_destination:
      type: string
      role: output
      description: Continue to Silver City.
    village_burned:
      type: boolean
      role: output
      description: Printed failed-branch consequence.
  effects:
    - type: set
      target: next_destination
      value:
        type: literal
        value: Silver City
    - type: set
      target: village_burned
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: heroes_fled
    right:
      type: literal
      value: true
