- id: core.quest.side_quests.attachment
  name: Side Quests — attachment
  section_id: section.quest_book_i.side_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 273
      printed_page: 271
      heading: Side Quests — attachment
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Side Quests provide a little extra spice that can be added to basically any other quest.
  type: constraint
  scope: quest
  fields:
    can_add_to_basically_any_other_quest:
      type: boolean
      role: output
      description: can add to basically any other quest
  effects:
    - type: set
      target: can_add_to_basically_any_other_quest
      value:
        type: literal
        value: true
- id: core.quest.side_quests.acceptance
  name: Side Quests — city acceptance
  section_id: section.quest_book_i.side_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 273
      printed_page: 271
      heading: Side Quests — city acceptance
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Heroes may choose to accept a Side Quest at any time during their stay in the city, and
    it does not add to the Day Count. They arrange this during nights at the inn or meet someone
    during the day requiring their services.
  type: constraint
  scope: quest
  fields:
    heroes_staying_in_city:
      type: boolean
      role: input
      description: heroes staying in city
    side_quest_acceptance_allowed:
      type: boolean
      role: output
      description: side quest acceptance allowed
    side_quest_acceptance_day_count_cost:
      type: number
      role: output
      description: side quest acceptance day count cost
      integer: true
    arrangements:
      type: string
      role: output
      description: arrangements
  effects:
    - type: set
      target: side_quest_acceptance_allowed
      value:
        type: literal
        value: true
    - type: set
      target: side_quest_acceptance_day_count_cost
      value:
        type: literal
        value: 0
    - type: set
      target: arrangements
      value:
        type: literal
        value: during nights at the inn or meeting someone during the day
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: heroes_staying_in_city
    right:
      type: literal
      value: true
- id: core.quest.side_quests.selection
  name: Side Quests — selection methods
  section_id: section.quest_book_i.side_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 273
      printed_page: 271
      heading: Side Quests — selection methods
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Either roll on the table or work your way through them one by one.
  type: constraint
  scope: quest
  fields:
    selection_methods:
      type: string
      role: output
      description: selection methods
  effects:
    - type: set
      target: selection_methods
      value:
        type: literal
        value: roll on the 1d6 table or work through quests one by one
  uses_tables:
    - table.quest.side_quests.selector
