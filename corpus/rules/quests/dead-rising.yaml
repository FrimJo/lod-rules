- id: core.quest.dead_rising.setup
  name: The Dead Rising — quest setup
  section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 227
      printed_page: 225
      heading: The Dead Rising — quest setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Make contact with Ulfric and his Brothers. Quest Location: Silver City. Five corridors
    (not C16); five rooms randomised from R2B–R8B only. Encounters: Undead. Objective Room: The
    Great Crypt.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.the_dead_rising
  fields:
    objective:
      type: string
      role: output
      description: Printed quest task.
    location:
      type: string
      role: output
      description: Silver City only.
    corridors:
      type: number
      role: output
      description: Corridor count.
      integer: true
      minimum: 0
    excluded_corridor:
      type: string
      role: output
      description: C16 excluded.
    rooms:
      type: number
      role: output
      description: Room count.
      integer: true
      minimum: 0
    room_pool:
      type: string
      role: output
      description: Only R2B–R8B, randomised.
    encounters:
      type: string
      role: output
      description: Printed encounter category.
    objective_room:
      type: string
      role: output
      description: Printed Objective Room name.
  effects:
    - type: set
      target: objective
      value:
        type: literal
        value: make contact with Ulfric and his Brothers
    - type: set
      target: location
      value:
        type: literal
        value: Silver City
    - type: set
      target: corridors
      value:
        type: literal
        value: 5
    - type: set
      target: excluded_corridor
      value:
        type: literal
        value: C16
    - type: set
      target: rooms
      value:
        type: literal
        value: 5
    - type: set
      target: room_pool
      value:
        type: literal
        value: R2B–R8B only, randomised
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Great Crypt
- id: core.quest.dead_rising.threshold
  name: The Dead Rising — Threat 10
  section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 227
      printed_page: 225
      heading: The Dead Rising — Threat 10
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: When Threat reaches 10 a Wandering Monster appears regardless of the Scenario die
    result. The Quest Book I introduction defines this as an increase to the threshold.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.the_dead_rising
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before the supplied change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after the supplied change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Printed threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Special quest wandering monster.
    scenario_result_ignored:
      type: boolean
      role: output
      description: No dependence on Scenario die result.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No reduction for the special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 10
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 10
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
- id: core.quest.dead_rising.objective_setup
  name: The Dead Rising — Great Crypt setup
  section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 228
      printed_page: 226
      heading: The Dead Rising — Great Crypt setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 227
      printed_page: 225
      heading: The Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The Crypt has six sarcophagi. Place Ulfric in the middle and two ordinary skeletons on
    either side. They have longswords and shields; the Objective Room description calls their swords
    bronze.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.the_dead_rising
  fields:
    sarcophagi:
      type: number
      role: output
      description: Printed room feature count.
      integer: true
      minimum: 0
    ulfric_placement:
      type: string
      role: output
      description: In the middle.
    skeletons:
      type: number
      role: output
      description: Two ordinary skeletons.
      integer: true
      minimum: 0
    skeleton_placement:
      type: string
      role: output
      description: One on either side of Ulfric.
    skeleton_weapon:
      type: string
      role: output
      description: Longswords.
    skeleton_sword_material:
      type: string
      role: output
      description: Bronze swords in the Objective Room prose.
    skeleton_shields:
      type: boolean
      role: output
      description: Both carry shields.
  effects:
    - type: set
      target: sarcophagi
      value:
        type: literal
        value: 6
    - type: set
      target: ulfric_placement
      value:
        type: literal
        value: middle
    - type: set
      target: skeletons
      value:
        type: literal
        value: 2
    - type: set
      target: skeleton_placement
      value:
        type: literal
        value: on either side of Ulfric
    - type: set
      target: skeleton_weapon
      value:
        type: literal
        value: longsword
    - type: set
      target: skeleton_sword_material
      value:
        type: literal
        value: bronze
    - type: set
      target: skeleton_shields
      value:
        type: literal
        value: true
  unresolved_references:
    - Ordinary skeleton statistics are not printed in this quest.
- id: core.quest.dead_rising.ulfric
  name: Ulfric — equipment and special rules
  section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 228
      printed_page: 226
      heading: Ulfric — equipment and special rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Ulfric has joined the Undead. He is armed with a Warhammer and has Armour 2, meaning
    his To Hit is in practice -5. He has Frenzy and Cause Fear 3. XP: 140, T2 Treasure Table.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.the_dead_rising
  fields:
    undead:
      type: boolean
      role: output
      description: Explicit Undead classification.
    weapon:
      type: string
      role: output
      description: Warhammer.
    armour:
      type: number
      role: output
      description: Printed Armour 2.
      integer: true
      minimum: 0
    to_hit_printed:
      type: number
      role: output
      description: Printed base stat-block To Hit; not silently changed.
      integer: true
    to_hit_in_practice:
      type: number
      role: output
      description: Source effective To Hit with his listed equipment.
      integer: true
    frenzy:
      type: boolean
      role: output
      description: Printed special rule name.
    cause_fear:
      type: number
      role: output
      description: Cause Fear 3.
      integer: true
      minimum: 0
    xp:
      type: number
      role: output
      description: Printed XP value; resource award is lifecycle accounting.
      integer: true
      minimum: 0
    treasure_table:
      type: string
      role: output
      description: Printed T2 Treasure Table pointer.
  effects:
    - type: set
      target: undead
      value:
        type: literal
        value: true
    - type: set
      target: weapon
      value:
        type: literal
        value: Warhammer
    - type: set
      target: armour
      value:
        type: literal
        value: 2
    - type: set
      target: to_hit_printed
      value:
        type: literal
        value: -10
    - type: set
      target: to_hit_in_practice
      value:
        type: literal
        value: -5
    - type: set
      target: frenzy
      value:
        type: literal
        value: true
    - type: set
      target: cause_fear
      value:
        type: literal
        value: 3
    - type: set
      target: xp
      value:
        type: literal
        value: 140
    - type: set
      target: treasure_table
      value:
        type: literal
        value: T2
  entity_id: quest_actor.dead_rising.ulfric
  dependencies:
    - key: tier_two_treasure
      label: T2 Treasure Table
      object_id: table.treasure.t2
  unresolved_references:
    - Frenzy and Cause Fear 3 special rules are named here; their definitions are not printed in
      this quest.
