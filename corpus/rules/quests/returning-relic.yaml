- id: core.quest.returning_relic.scenario_trigger
  name: Returning the Relic — Scenario trigger
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 255
      printed_page: 253
      section: 'Quest 1: Returning the Relic'
      heading: 'Special Rules:'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Scenario die is triggered on a result of 8-10.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.returning_relic
  fields:
    scenario_roll:
      type: number
      role: input
      description: Scenario die result.
      integer: true
      minimum: 1
      maximum: 10
    scenario_die_triggered:
      type: boolean
      role: output
      description: The quest Scenario trigger.
  effects:
    - type: set
      target: scenario_die_triggered
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: scenario_roll
        right:
          type: literal
          value: 8
      - type: compare
        operator: lte
        left:
          type: field
          name: scenario_roll
        right:
          type: literal
          value: 10
