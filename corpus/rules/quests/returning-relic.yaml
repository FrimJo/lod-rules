- id: core.quest.returning_relic.refit_attempt
  name: Returning the Relic — refit prerequisite
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 255
      printed_page: 253
      section: 'Quest 1: Returning the Relic'
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once all enemies are dead, the heroes may try to refit the stone once per turn by
    standing in front of the statue and taking a DEX Test.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.returning_relic
  fields:
    all_enemies_dead:
      type: boolean
      role: input
      description: All enemies are dead.
    hero_in_front_of_statue:
      type: boolean
      role: input
      description: This hero stands in front of the statue.
    refit_attempts_this_turn:
      type: number
      role: input
      description: Refit attempts already made this turn.
      integer: true
      minimum: 0
    refit_attempt_allowed:
      type: boolean
      role: output
      description: refit attempt allowed
    dex_test_required:
      type: boolean
      role: output
      description: dex test required
  effects:
    - type: set
      target: refit_attempt_allowed
      value:
        type: literal
        value: true
    - type: set
      target: dex_test_required
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: all_enemies_dead
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_in_front_of_statue
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: refit_attempts_this_turn
        right:
          type: literal
          value: 0
- id: core.quest.returning_relic.refit_success
  name: Returning the Relic — successful refit
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source:
