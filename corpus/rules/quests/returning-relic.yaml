- id: core.quest.returning_relic.setup
  name: Returning the Relic — setup
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 255
      printed_page: 253
      heading: Returning the Relic — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Return a polished black stone to its statue in a forgotten temple. Random location,
    eight corridors, eight rooms, 300c per hero.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.returning_relic
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Random
    - type: set
      target: corridors
      value:
        type: literal
        value: 8
    - type: set
      target: rooms
      value:
        type: literal
        value: 8
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 300
  dependencies:
    - key: stone
      label: Polished black stone
      object_id: equipment.quest.polished_black_stone
- id: core.quest.returning_relic.luck_nullification
  name: Returning the Relic — nullified Luck
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 255
      printed_page: 253
      heading: Returning the Relic — nullified Luck
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: All heroes have their Luck Points nullified until the stone has been returned.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.returning_relic
  fields:
    stone_returned:
      type: boolean
      role: input
      description: The stone has been returned.
    all_heroes_luck_points_nullified:
      type: boolean
      role: output
      description: all heroes luck points nullified
  effects:
    - type: set
      target: all_heroes_luck_points_nullified
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: stone_returned
    right:
      type: literal
      value: false
- id: core.quest.returning_relic.curse_ends
  name: Returning the Relic — nullification ends
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
