      description: The DEX test succeeded.
    stone_returned:
      type: boolean
      role: output
      description: stone returned
  effects:
    - type: set
      target: stone_returned
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: valid_refit_attempt
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: dex_test_succeeded
        right:
          type: literal
          value: true
