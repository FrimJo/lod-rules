    spawn_another_mummy:
      type: boolean
      role: output
      description: spawn another mummy
  effects:
    - type: set
      target: ignore_mummy_search_result
      value:
        type: literal
        value: true
    - type: set
      target: spawn_another_mummy
      value:
        type: literal
        value: false
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ancient_tiles_available
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: searching_queen_sarcophagus
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: search_result_is_mummy
        right:
          type: literal
          value: true
  dependencies:
    - key: sarcophagus
      label: Standard sarcophagus findings apart from the ignored mummy result
