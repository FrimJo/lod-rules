- id: core.quest.khaba.standard_room_pool
  name: Crypt of Khaba — Standard room pool
  section_id: section.quest_book_i.quests_into_the_ancient_lands.crypt_of_khaba
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 271
      printed_page: 269
      heading: Crypt of Khaba — Standard room pool
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If not using Ancient Lands tiles, randomise rooms using R1B, R2B, R4B-R8B, R1, R4-R6,
    R9-R11, R14, R16, R17. All corridors can be part of the mix.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.khaba
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    random_room_pool:
      type: string
      role: output
      description: random room pool
    all_corridors_available:
      type: boolean
      role: output
      description: all corridors available
  effects:
    - type: set
      target: random_room_pool
      value:
        type: literal
        value: R1B, R2B, R4B-R8B, R1, R4-R6, R9-R11, R14, R16, R17
    - type: set
      target: all_corridors_available
      value:
        type: literal
        value: true
  when:
