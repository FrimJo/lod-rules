- id: core.quest.grieving_mother.wandering_spiders
  name: The Grieving Mother — later Wandering Monsters
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 165
      printed_page: 163
      heading: The Grieving Mother — later Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: From this point forward, any Wandering Monster originates from the opening where the
    light comes. Each Wandering Monster is 1d2 Giant spiders.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    later_wandering_monster:
      type: boolean
      role: input
      description:
        Supplied confirmation that a Wandering Monster occurs after the chosen interpretation
        of from this point forward. Activation timing remains
        issue.quest.grieving_mother_wandering_activation.
    spider_roll:
      type: number
      role: input
      description: Supplied 1d2 Giant spiders.
      integer: true
      minimum: 1
      maximum: 2
      dice:
        count: 1
        sides: 2
    giant_spiders:
      type: number
      role: output
      description: Later Wandering Monster count.
      integer: true
      minimum: 0
    wandering_monster_origin:
      type: string
      role: output
      description: Outside opening from which the light comes.
  effects:
    - type: set
      target: giant_spiders
      value:
        type: field
        name: spider_roll
    - type: set
      target: wandering_monster_origin
      value:
        type: literal
        value: opening from where the light comes
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: later_wandering_monster
    right:
      type: literal
      value: true
  issues:
    - issue.quest.grieving_mother_wandering_activation
