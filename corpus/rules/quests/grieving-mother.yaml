- id: core.quest.grieving_mother.reading
  name: The Grieving Mother — reading boundaries
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 164
      printed_page: 162
      heading: The Grieving Mother — reading boundaries
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 165
      printed_page: 163
      heading: Read the next paragraph only after the first turn of combat
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Do not read until the quest has been triggered. Do not read more than one section at a
    time. Read the next paragraph only after the first turn of combat.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    quest_triggered:
      type: boolean
      role: input
      description: Whether the side quest has been triggered.
    first_turn_finished:
      type: boolean
      role: input
      description: Whether the first turn of combat has finished.
    initial_text_readable:
      type: boolean
      role: output
      description: Quest opening permission.
    door_slam_text_readable:
      type: boolean
      role: output
      description: Door-slam paragraph permission.
    read_one_section_at_a_time:
      type: boolean
      role: output
      description: Printed section-at-a-time instruction.
  effects:
    - type: set
      target: initial_text_readable
      value:
        type: field
        name: quest_triggered
    - type: set
      target: door_slam_text_readable
      value:
        type: literal
        value: false
    - type: set
      target: read_one_section_at_a_time
      value:
        type: literal
        value: true
- id: core.quest.grieving_mother.reading_door_slam
