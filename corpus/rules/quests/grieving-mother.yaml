- id: core.quest.grieving_mother.objective_room
  name: The Grieving Mother — side Objective Room
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 165
      printed_page: 163
      heading: The Grieving Mother — side Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Place R17. The opening opposite the door leads outside, and heroes may leave the
    dungeon that way. Remains lie in one square in front of the door. Two giant spiders emerge from
    opposite corners. A broken shield and rusty longsword lie beside the skeletal remains.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    room_tile:
      type: string
      role: output
      description: Printed tile.
    outside_opening:
      type: string
      role: output
      description: Relative placement of exit.
    may_leave_via_opening:
      type: boolean
      role: output
      description: Exit permission.
    remains_location:
      type: string
      role: output
      description: One of the squares in front of the door; no invented coordinate.
    giant_spiders:
      type: number
      role: output
      description: Initial enemy count.
      integer: true
      minimum: 0
    spider_placement:
      type: string
      role: output
      description: Opposite corners.
    items_beside_remains:
      type: string
      role: output
      description: Described items; no invented sale values or condition statistics.
  effects:
    - type: set
      target: room_tile
      value:
        type: literal
        value: R17
    - type: set
      target: outside_opening
      value:
        type: literal
        value: opposite side of the room
    - type: set
      target: may_leave_via_opening
      value:
        type: literal
        value: true
    - type: set
      target: remains_location
      value:
        type: literal
        value: one of the squares in front of the door
    - type: set
      target: giant_spiders
      value:
        type: literal
        value: 2
    - type: set
      target: spider_placement
      value:
        type: literal
        value: opposite corners
    - type: set
      target: items_beside_remains
      value:
        type: literal
        value: broken shield and rusty longsword
  unresolved_references:
    - Giant spider statistics are not printed in this quest.
- id: core.quest.grieving_mother.door_slam
  name: The Grieving Mother — door slams shut
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 165
      printed_page: 163
      heading: The Grieving Mother — door slams shut
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: After the first turn of combat, the hidden door slams shut. Heroes inside the secret
    chamber are trapped. The door is locked as though 10 was rolled on the Door Table.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    first_turn_finished:
      type: boolean
      role: input
      description: First combat turn is finished.
    hidden_door_closed:
      type: boolean
      role: output
      description: Door slams closed.
    door_table_result:
      type: number
      role: output
      description: Treat the lock as a printed Door Table roll of 10.
      integer: true
      minimum: 0
    heroes_inside_trapped:
      type: boolean
      role: output
      description: Those inside are trapped with the spiders.
  effects:
    - type: set
      target: hidden_door_closed
      value:
        type: literal
        value: true
    - type: set
      target: door_table_result
      value:
        type: literal
        value: 10
    - type: set
      target: heroes_inside_trapped
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: first_turn_finished
    right:
      type: literal
      value: true
  uses_tables:
    - table.dungeon.door_chest_difficulty
- id: core.quest.grieving_mother.door_access
  name: The Grieving Mother — opening the slammed door
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 165
      printed_page: 163
      heading: The Grieving Mother — opening the slammed door
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The slammed door cannot be opened from inside until the spiders are dead. From outside
    it can be opened if heroes open the lock or beat down the door.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    opening_from_inside:
      type: boolean
      role: input
      description: Which side is attempting to open the door.
    spiders_dead:
      type: boolean
      role: input
      description: Whether the room spiders are dead.
    lock_opened:
      type: boolean
      role: input
      description: Supplied successful lock opening from outside.
    door_beaten_down:
      type: boolean
      role: input
      description: Supplied successful force outcome from outside.
    door_opening_allowed:
      type: boolean
      role: output
      description: Legal opening under the quest exception.
  effects:
    - type: set
      target: door_opening_allowed
      value:
        type: literal
        value: true
  when:
    type: any
    conditions:
      - type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: opening_from_inside
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: spiders_dead
            right:
              type: literal
              value: true
      - type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: opening_from_inside
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: lock_opened
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_beaten_down
                right:
                  type: literal
                  value: true
  dependencies:
    - key: lock_or_force
      label: Outside lock opening or beating down the door
      object_id: procedure.locked_door_and_close
