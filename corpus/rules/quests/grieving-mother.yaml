- id: core.quest.grieving_mother.setup
  name: The Grieving Mother — setup
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 164
      printed_page: 162
      heading: The Grieving Mother — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Return the son’s remains for burial in the family grave on the estate. Location: same
    dungeon as the next quest. Add one Side Quest Card to the pile. Encounters are defined by the
    main quest.'
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    objective:
      type: string
      role: output
      description: Printed side-quest task.
    location:
      type: string
      role: output
      description: Location relative to the main quest.
    side_quest_cards_to_add:
      type: number
      role: output
      description: One additional card; lifecycle inserts it exactly once.
      integer: true
      minimum: 0
    encounter_source:
      type: string
      role: output
      description: Main quest encounter source.
  effects:
    - type: set
      target: objective
      value:
        type: literal
        value: bring back the son to be buried in the family grave on the estate
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: side_quest_cards_to_add
      value:
        type: literal
        value: 1
    - type: set
      target: encounter_source
      value:
        type: literal
        value: main quest
- id: core.quest.grieving_mother.side_quest_card
  name: The Grieving Mother — card replacement
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 164
      printed_page: 162
      heading: The Grieving Mother — card replacement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    When the Side Quest Card is drawn, put it aside and pull the next card. This card leads
    to the side Objective Room. There is a hidden door in one wall; once in the room read The Hidden
    Door.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    side_quest_card_drawn:
      type: boolean
      role: input
      description: Whether the added Side Quest Card was drawn.
    set_side_quest_card_aside:
      type: boolean
      role: output
      description: Set the Side Quest Card aside.
    draw_next_card:
      type: boolean
      role: output
      description: Pull the next card; no invented card contents.
    next_card_leads_to_side_objective:
      type: boolean
      role: output
      description: Replacement card leads to side Objective Room.
    hidden_door_location:
      type: string
      role: output
      description: One of the walls, supplied geometry.
    next_reading:
      type: string
      role: output
      description: Printed reading instruction.
  effects:
    - type: set
      target: set_side_quest_card_aside
      value:
        type: literal
        value: true
    - type: set
      target: draw_next_card
      value:
        type: literal
        value: true
    - type: set
      target: next_card_leads_to_side_objective
      value:
        type: literal
        value: true
    - type: set
      target: hidden_door_location
      value:
        type: literal
        value: one of the walls
    - type: set
      target: next_reading
      value:
        type: literal
        value: Once in the room, read The Hidden Door
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: side_quest_card_drawn
    right:
      type: literal
      value: true
- id: core.quest.grieving_mother.main_quest_finished
  name: The Grieving Mother — unfinished search
  section_id: section.buying_an_estate.side_quest_the_grieving_mother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 164
      printed_page: 162
      heading: The Grieving Mother — unfinished search
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If the quest finishes before the card is drawn, the heroes may continue trying to find
    it or end the quest, in which case this side quest fails.
  type: scenario_rule
  scope: quest
  quest_id: quest.estate.grieving_mother
  fields:
    main_quest_finished:
      type: boolean
      role: input
      description: Main quest has finished.
    side_quest_card_drawn:
      type: boolean
      role: input
      description: Whether this side-quest card was drawn.
    may_continue_search:
      type: boolean
      role: output
      description: Permission to continue after the main quest ends.
    ending_now_fails_side_quest:
      type: boolean
      role: output
      description: Failure consequence if the party chooses to end now.
  effects:
    - type: set
      target: may_continue_search
      value:
        type: literal
        value: true
    - type: set
      target: ending_now_fails_side_quest
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: main_quest_finished
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: side_quest_card_drawn
        right:
          type: literal
          value: false
