      heading: Go Fetch — broken or not found
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Aftermath: Shield is Broken or was Not Found. He sighs, lowers his head and walks
    away. No shield – No money.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.go_fetch
  fields:
    returned_to_adventurer:
      type: boolean
      role: input
      description: returned to adventurer
    shield_was_not_found:
      type: boolean
      role: input
      description: shield was not found
    shield_broken:
      type: boolean
      role: input
      description: shield broken
    reward_coins:
      type: number
      role: output
      description: reward coins
      integer: true
  effects:
