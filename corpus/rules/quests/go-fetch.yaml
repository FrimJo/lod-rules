- id: core.quest.go_fetch.setup
  name: Go Fetch — setup
  section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 277
      printed_page: 275
      heading: Go Fetch — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'An adventurer asks heroes to recover his shield, left at a fountain during his
    retreat. Location: same dungeon as the next quest. Reward: 350 c. Encounters: as defined by the
    main quest. Objective room: The Sanctuary (R9).'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.go_fetch
  fields:
    location:
      type: string
      role: output
      description: location
    advertised_reward_coins:
      type: number
      role: output
      description: advertised reward coins
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: advertised_reward_coins
      value:
        type: literal
        value: 350
    - type: set
      target: encounters
      value:
        type: literal
        value: as defined by the main quest
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Sanctuary (R9)
