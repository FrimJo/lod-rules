- id: core.quest.go_fetch.encounter
  name: Go Fetch — automatic Encounter
  section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 277
      printed_page: 275
      heading: Go Fetch — automatic Encounter
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: There is an automatic Encounter in this room. Roll on the quest-specific Encounter
    Table. Once the fight is over, try to locate the shield.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.go_fetch
  fields:
    side_quest_objective_room_found:
      type: boolean
      role: input
      description: side quest objective room found
    automatic_encounter:
      type: boolean
      role: output
      description: automatic encounter
    encounter_table_rolls:
      type: number
      role: output
      description: encounter table rolls
      integer: true
    encounter_table_basis:
      type: string
      role: output
      description: encounter table basis
  effects:
    - type: set
      target: automatic_encounter
      value:
        type: literal
        value: true
    - type: set
      target: encounter_table_rolls
      value:
        type: literal
        value: 1
    - type: set
      target: encounter_table_basis
      value:
        type: literal
        value: quest-specific Encounter Table
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: side_quest_objective_room_found
    right:
      type: literal
      value: true
  dependencies:
    - key: encounter
      label: The quest-specific Encounter Table for the main quest; supplied encounter outcomes
- id: core.quest.go_fetch.untouched
  name: Go Fetch — untouched
  section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 277
      printed_page: 275
      heading: Go Fetch — untouched
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The shield is exactly where it was said to be and seems untouched.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.go_fetch
  fields:
    objective_fight_over:
      type: boolean
      role: input
      description: objective fight over
    shield_search_roll:
      type: number
      role: input
      description: shield search roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    shield_found:
      type: boolean
      role: output
      description: shield found
    shield_condition:
      type: string
      role: output
      description: shield condition
    shield_position:
      type: string
      role: output
      description: shield position
  effects:
    - type: set
      target: shield_found
      value:
        type: literal
        value: true
    - type: set
      target: shield_condition
      value:
        type: literal
        value: seems untouched
    - type: set
      target: shield_position
      value:
        type: literal
        value: where it was said to be
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: objective_fight_over
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: shield_search_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: shield_search_roll
        right:
          type: literal
          value: 3
  uses_tables:
    - table.quest.go_fetch.shield_condition
