- id: core.quest_book.reading_boundaries
  name: Reading the Quests
  section_id: section.quest_book_i.introduction.reading_the_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Reading the Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Do not read further than the first border line. Once you reach the Quest Room, you may
    read until the second line and, once the quest is complete, you can read the last part.
  type: constraint
  scope: quest
  fields:
    quest_room_reached:
      type: boolean
      role: input
      description: Whether the Quest Room has been reached.
    quest_complete:
      type: boolean
      role: input
      description: Whether the quest is complete.
    quest_room_text_readable:
      type: boolean
      role: output
      description: Permission to read up to the second border.
    aftermath_readable:
      type: boolean
      role: output
      description: Permission to read the last part.
  effects:
    - type: set
      target: quest_room_text_readable
      value:
        type: field
        name: quest_room_reached
    - type: set
      target: aftermath_readable
      value:
        type: field
        name: quest_complete
- id: core.quest_book.aftermath_looting
  name: Aftermath findings
  section_id: section.quest_book_i.introduction.reading_the_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Aftermath findings
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Aftermath findings such as treasure chests may be in excess of those drawn on the
    tiles. Everything found in the aftermath can be looted off table, with no traps or locks.
  type: exception
  scope: quest
  fields:
    found_in_aftermath:
      type: boolean
      role: input
      description: Identifies a finding explicitly described in the aftermath.
    off_table_looting:
      type: boolean
      role: output
      description: Finding can be looted off table.
    check_traps:
      type: boolean
      role: output
      description: Whether aftermath loot needs trap checks.
    check_locks:
      type: boolean
      role: output
      description: Whether aftermath loot needs lock checks.
  effects:
    - type: set
      target: off_table_looting
      value:
        type: literal
        value: true
    - type: set
      target: check_traps
      value:
        type: literal
        value: false
    - type: set
      target: check_locks
      value:
        type: literal
        value: false
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: found_in_aftermath
    right:
      type: literal
      value: true
- id: core.quest_book.individual_repeatability
  name: Individual quest repeatability
  section_id: section.quest_book_i.introduction.reading_the_quests
  source:
    - document: rulebook.second_printing.eng
