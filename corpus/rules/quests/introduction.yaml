- id: core.quest_book.threat_threshold_monster
  name: Triggering Wandering Monsters
  section_id: section.quest_book_i.introduction
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    When a quest says a Wandering Monster appears when Threat reaches XX, it happens every
    time Threat is increased to XX. Threat is not decreased when that monster is placed. Decreasing
    to XX does not place a monster; decreasing below and increasing back to XX does.
  type: trigger
  scope: quest
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat immediately before this supplied change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this supplied change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: input
      description: XX supplied by the current quest.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Whether this Threat change triggers the quest monster.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No Threat reduction for this special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: quest_threshold
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
- id: core.quest.first_blood.setup
  name: First Blood — setup
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 223
      printed_page: 221
      heading: First Blood — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Three bandits and one bandit leader attack. The leader has a longsword, shield and
    armour 1; two bandits have shortswords and armour 0; one has shortbow, dagger and armour 0. Use
    four open-ground wilderness tiles; heroes start in the centre adjacent to each other.
  type: scenario_rule
  scope: quest
  fields:
    bandit_leaders:
      type: number
      role: output
      description: Number of bandit leaders.
      integer: true
      minimum: 0
    melee_bandits:
      type: number
      role: output
      description: Number of shortsword bandits.
      integer: true
      minimum: 0
    ranged_bandits:
      type: number
      role: output
      description: Number of shortbow bandits.
      integer: true
      minimum: 0
    leader_weapon:
      type: string
      role: output
      description: Printed leader weapon.
    leader_shield:
      type: boolean
      role: output
      description: Leader carries a shield.
    leader_armour:
      type: number
      role: output
      description: Printed armour value.
      integer: true
      minimum: 0
    melee_weapon:
      type: string
      role: output
      description: Printed melee bandit weapon.
    ranged_weapon:
      type: string
      role: output
      description: Printed ranged weapon.
    ranged_backup:
      type: string
      role: output
      description: Printed backup weapon.
    bandit_armour:
      type: number
      role: output
      description: Armour of all three bandits.
      integer: true
      minimum: 0
    outdoor_tiles:
      type: number
      role: output
      description: Open-ground tile count.
      integer: true
      minimum: 0
    tile_kind:
      type: string
      role: output
      description: Printed tile kind.
    hero_placement:
      type: string
      role: output
      description: Printed hero placement constraint.
  effects:
    - type: set
      target: bandit_leaders
      value:
        type: literal
        value: 1
    - type: set
      target: melee_bandits
      value:
        type: literal
        value: 2
    - type: set
      target: ranged_bandits
      value:
        type: literal
        value: 1
    - type: set
      target: leader_weapon
      value:
        type: literal
        value: longsword
    - type: set
      target: leader_shield
      value:
        type: literal
        value: true
    - type: set
      target: leader_armour
      value:
        type: literal
        value: 1
    - type: set
      target: melee_weapon
      value:
        type: literal
        value: shortsword
    - type: set
      target: ranged_weapon
      value:
        type: literal
        value: shortbow
    - type: set
      target: ranged_backup
      value:
        type: literal
        value: dagger
    - type: set
      target: bandit_armour
      value:
        type: literal
        value: 0
    - type: set
      target: outdoor_tiles
      value:
        type: literal
        value: 4
    - type: set
      target: tile_kind
      value:
        type: literal
        value: wilderness outdoor open ground
    - type: set
      target: hero_placement
      value:
        type: literal
        value: centre, adjacent to each other
  quest_id: quest.first_blood
  unresolved_references:
    - Locate the corresponding monster cards and monster equipment cards and combine them. Their
      other statistics are not printed here.
- id: core.quest.first_blood.enemy_placement
  name: First Blood — bandit placement
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 223
      printed_page: 221
      heading: First Blood — bandit placement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Randomise which board edge each bandit approaches from, placing them 1d10 squares from the edge.
  type: scenario_rule
  scope: quest
  fields:
    approach_edge_randomised:
      type: boolean
      role: input
      description: External geometry supplies the randomised board edge per bandit.
    distance_roll:
      type: number
      role: input
      description: Supplied 1d10 distance per bandit.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    distance_from_edge:
      type: number
      role: output
      description: Squares from the supplied edge.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: distance_from_edge
      value:
        type: field
        name: distance_roll
  quest_id: quest.first_blood
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: approach_edge_randomised
    right:
      type: literal
      value: true
- id: core.quest.first_blood.surprise
  name: First Blood — surprise
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source:
    - document: rulebook.second_printing.eng
