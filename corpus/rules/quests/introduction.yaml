- id: core.quest.first_blood.darkness_and_scenario
  name: First Blood — darkness and Scenario die
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 223
      printed_page: 221
      heading: First Blood — darkness and Scenario die
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Due to the darkness, no one can see or shoot further than 10 squares. The Scenario die
    is not used.
  type: scenario_rule
  scope: quest
  fields:
    sight_limit:
      type: number
      role: output
      description: Maximum squares of sight for everyone.
      integer: true
      minimum: 0
    shooting_limit:
      type: number
      role: output
      description: Maximum squares for shooting for everyone.
      integer: true
      minimum: 0
    scenario_die_used:
      type: boolean
      role: output
      description: Whether the Scenario die is used.
  effects:
    - type: set
      target: sight_limit
      value:
        type: literal
        value: 10
    - type: set
      target: shooting_limit
      value:
        type: literal
        value: 10
    - type: set
      target: scenario_die_used
      value:
        type: literal
        value: false
  quest_id: quest.first_blood
- id: core.quest.first_blood.aftermath
  name: First Blood — aftermath
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 223
      printed_page: 221
      heading: First Blood — aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: With the bandits dead, gather gear and continue travel. Arrive at the settlement
    without further issues. Start the settlement chapter by rolling for a settlement event, then
    decide where the adventure takes the heroes.
  type: scenario_rule
  scope: quest
  fields:
    all_bandits_dead:
      type: boolean
      role: input
      description: Printed aftermath trigger.
    arrive_without_further_issues:
      type: boolean
      role: output
      description: No further travel issues on this arrival.
    settlement_event_required:
      type: boolean
      role: output
      description: Begin with a settlement event.
  effects:
    - type: set
      target: arrive_without_further_issues
      value:
        type: literal
        value: true
    - type: set
      target: settlement_event_required
      value:
        type: literal
        value: true
    - type: invoke
      dependency: settlement_arrival
  quest_id: quest.first_blood
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: all_bandits_dead
    right:
      type: literal
      value: true
  dependencies:
    - key: settlement_arrival
      label: Settlement arrival; start by rolling a settlement event
      object_id: procedure.settlement_arrival
