- id: core.quest_book.catalogue_structure
  name: Quest Book I — catalogue structure
  section_id: section.quest_book_i.introduction
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Quest Book I — catalogue structure
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This book has two campaigns and several individual quests grouped by which objective
    room is used. Quest Book II has more campaigns and individual quests and tables to randomize
    which individual quest to play.
  type: definition
  scope: quest
  fields:
    campaigns_in_this_book:
      type: number
      role: output
      description: campaigns in this book
      integer: true
    individual_quest_grouping:
      type: string
      role: output
      description: individual quest grouping
  effects:
    - type: set
      target: campaigns_in_this_book
      value:
        type: literal
        value: 2
    - type: set
      target: individual_quest_grouping
      value:
        type: literal
        value: which objective room is used
  dependencies:
    - key: dead_rising
      label: The Dead Rising campaign
      object_id: quest.dead_rising.campaign
    - key: spider_queen
      label: Lair of the Spider Queen campaign
      object_id: quest.spider_queen.campaign
    - key: quest_book_ii
      label: Quest Book II is not present; its contents are not invented
  see_also:
    - section.quest_book_i.the_dead_rising
    - section.quest_book_i.lair_of_the_spider_queen
