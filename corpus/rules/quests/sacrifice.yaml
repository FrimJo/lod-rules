- id: core.quest.sacrifice.setup
  name: Sacrifice — quest setup
  section_id: section.quest_book_i.the_dead_rising.quest_6a_sacrifice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 234
      printed_page: 232
      heading: Sacrifice — quest setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Intervene with the sacrifice. Quest Location: White 36. Seven corridors (not C16),
    seven rooms. Encounters: Undead. Objective room: The Lava River. Special Rules and Reward are
    printed as dashes.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.sacrifice
  fields:
    objective:
      type: string
      role: output
      description: objective
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    excluded_corridor:
      type: string
      role: output
      description: excluded corridor
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
    special_rules_printed:
      type: string
      role: output
      description: special rules printed
    reward_printed:
      type: string
      role: output
      description: reward printed
  effects:
    - type: set
      target: objective
      value:
        type: literal
        value: intervene with the sacrifice
    - type: set
      target: location
      value:
        type: literal
        value: White 36
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: excluded_corridor
      value:
        type: literal
        value: C16
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Lava River
    - type: set
      target: special_rules_printed
      value:
        type: literal
        value: '-'
    - type: set
      target: reward_printed
      value:
        type: literal
        value: '-'
- id: core.quest.sacrifice.objective_setup
  name: Sacrifice — Objective Room setup
  section_id: section.quest_book_i.the_dead_rising.quest_6a_sacrifice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 234
      printed_page: 232
      heading: Sacrifice — Objective Room setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Heroes enter along the short side opposite the altar. On their side place four Wights
    with cursed longswords and shields, as close to the river as possible. Place the Apostle on the
    dais. Heroes go first. Two unlocked, untrapped objective chests are next to the altar.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.sacrifice
  fields:
    hero_entry:
      type: string
      role: output
      description: hero entry
    wights:
      type: number
      role: output
      description: wights
      integer: true
    wight_placement:
      type: string
      role: output
      description: wight placement
    wight_weapon:
      type: string
      role: output
      description: wight weapon
    wight_shields:
      type: boolean
      role: output
      description: wight shields
    apostle_placement:
      type: string
      role: output
      description: apostle placement
    first_to_move:
      type: string
      role: output
      description: first to move
    objective_chests:
      type: number
      role: output
      description: objective chests
      integer: true
    chest_placement:
      type: string
      role: output
      description: chest placement
    chests_locked:
      type: boolean
      role: output
      description: chests locked
    chests_trapped:
      type: boolean
      role: output
      description: chests trapped
  effects:
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side opposite the altar
    - type: set
      target: wights
      value:
        type: literal
        value: 4
    - type: set
      target: wight_placement
      value:
        type: literal
        value: on the heroes’ side, as close to the river as possible
    - type: set
      target: wight_weapon
      value:
        type: literal
        value: cursed longsword
    - type: set
      target: wight_shields
      value:
        type: literal
        value: true
    - type: set
      target: apostle_placement
      value:
        type: literal
        value: dais
    - type: set
      target: first_to_move
      value:
        type: literal
        value: heroes
    - type: set
      target: objective_chests
      value:
        type: literal
        value: 2
    - type: set
      target: chest_placement
      value:
        type: literal
        value: next to the altar
    - type: set
      target: chests_locked
      value:
        type: literal
        value: false
    - type: set
      target: chests_trapped
      value:
        type: literal
        value: false
  unresolved_references:
    - Wight statistics and cursed longsword effects are not printed in this quest.
- id: core.quest.sacrifice.objective_civilians
  name: Sacrifice — civilians in the Objective Room
  section_id: section.quest_book_i.the_dead_rising.quest_6a_sacrifice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 234
      printed_page: 232
      heading: Sacrifice — civilians in the Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A group of civilians is huddled on the bank of the lava river, surrounded by skeletons
    clad in rusty old armour. No civilian count is printed.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.sacrifice
  fields:
    civilians_location:
      type: string
      role: output
      description: civilians location
    civilians_surrounded_by:
      type: string
      role: output
      description: civilians surrounded by
    civilian_count_unspecified:
      type: boolean
      role: output
      description: civilian count unspecified
  effects:
    - type: set
      target: civilians_location
      value:
        type: literal
        value: bank of the lava river
    - type: set
      target: civilians_surrounded_by
      value:
        type: literal
        value: skeletons clad in rusty old armour
    - type: set
      target: civilian_count_unspecified
      value:
        type: literal
        value: true
