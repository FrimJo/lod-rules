- id: core.quest.sacrifice.aftermath
  name: Sacrifice — liberate civilians and press on
  section_id: section.quest_book_i.the_dead_rising.quest_6a_sacrifice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 234
      printed_page: 232
      heading: Sacrifice — liberate civilians and press on
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: After heroes liberate the civilians from their bonds, head to the surface, send
    civilians on their way and head straight toward the Master. Travel to white 39.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.sacrifice
  fields:
    civilians_liberated:
      type: boolean
      role: input
      description: Civilians have been liberated from their bonds.
    civilians_sent_on_their_way:
      type: boolean
      role: output
      description: Printed aftermath.
    next_destination:
      type: string
      role: output
      description: White 39.
    head_straight_to_master:
      type: boolean
      role: output
      description: No intervening return to the city.
  effects:
    - type: set
      target: civilians_sent_on_their_way
      value:
        type: literal
        value: true
    - type: set
      target: next_destination
      value:
        type: literal
        value: White 39
    - type: set
      target: head_straight_to_master
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: civilians_liberated
    right:
      type: literal
      value: true
  dependencies:
    - key: next_quest
      label: 'Quest 6B: The Master at White 39'
      object_id: quest.dead_rising.master
