- id: core.quest.temple_despair.furniture_reroll
  name: Temple of Despair — Furniture Chart rerolls
  section_id: section.quest_book_i.quests_into_the_ancient_lands.temple_of_despair
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 268
      printed_page: 266
      heading: Temple of Despair — Furniture Chart rerolls
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    You may re-roll 4 rolls on the furniture chart during the quest. A re-roll may never be
    re-rolled.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.temple_despair
  fields:
    furniture_chart_roll:
      type: boolean
      role: input
      description: furniture chart roll
    already_a_reroll:
      type: boolean
      role: input
      description: already a reroll
    furniture_rerolls_used_this_quest:
      type: number
      role: input
      description: furniture rerolls used this quest
      integer: true
    furniture_reroll_allowed:
      type: boolean
      role: output
      description: furniture reroll allowed
  effects:
    - type: set
      target: furniture_reroll_allowed
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: furniture_chart_roll
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: already_a_reroll
        right:
          type: literal
          value: false
      - type: compare
        operator: gte
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 0
      - type: compare
        operator: lt
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 4
