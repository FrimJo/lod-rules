- id: core.quest.temple_despair.last_card
  name: Temple of Despair — last card exception
  section_id: section.quest_book_i.quests_into_the_ancient_lands.temple_of_despair
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 268
      printed_page: 266
      heading: Temple of Despair — last card exception
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If this is the last card in the pile, remove it and ignore the effect. Setup identifies
    the Secondary Objective card as the one removed for being last.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.temple_despair
  fields:
    side_quest_card_drawn:
      type: boolean
      role: input
      description: side quest card drawn
    side_quest_card_is_last:
      type: boolean
      role: input
      description: side quest card is last
    secondary_objective_removed_as_last:
      type: boolean
      role: output
      description: secondary objective removed as last
    secondary_objective_effect_ignored:
      type: boolean
      role: output
      description: secondary objective effect ignored
  effects:
    - type: set
      target: secondary_objective_removed_as_last
      value:
        type: literal
        value: true
    - type: set
      target: secondary_objective_effect_ignored
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: side_quest_card_drawn
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: side_quest_card_is_last
        right:
          type: literal
          value: true
- id: core.quest.temple_despair.secondary_objective
  name: Temple of Despair — Secondary Objective
  section_id: section.quest_book_i.quests_into_the_ancient_lands.temple_of_despair
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 268
      printed_page: 266
      heading: Temple of Despair — Secondary Objective
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Immediately draw the next exploration card. In this room the party encounters the old
    hierophant and his Wraiths. Ignore this effect if the card is last in the pile.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.temple_despair
  fields:
    side_quest_card_drawn:
      type: boolean
      role: input
      description: side quest card drawn
    side_quest_card_is_last:
      type: boolean
      role: input
      description: side quest card is last
    exploration_cards_to_draw:
      type: number
      role: output
      description: exploration cards to draw
      integer: true
    secondary_encounter_required:
      type: boolean
      role: output
      description: secondary encounter required
    secondary_enemy_placement:
      type: string
      role: output
      description: secondary enemy placement
  effects:
    - type: set
      target: exploration_cards_to_draw
      value:
        type: literal
        value: 1
    - type: set
      target: secondary_encounter_required
      value:
        type: literal
        value: true
    - type: set
      target: secondary_enemy_placement
      value:
        type: literal
        value: in this room
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: side_quest_card_drawn
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: side_quest_card_is_last
        right:
          type: literal
          value: false
