- id: core.quest.temple_despair.setup
  name: Temple of Despair — setup
  section_id: section.quest_book_i.quests_into_the_ancient_lands.temple_of_despair
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 268
      printed_page: 266
      heading: Temple of Despair — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'The High Priest asks heroes to examine the site and bring back any artefacts related
    to the Ancient Gods. Quest Location: Ancient Lands, random. Number of tiles: 6 corridors, 6
    rooms (not R33). Reward: Any loot found. Encounters: Ancient Lands.'
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.temple_despair
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    random_room_exclusion:
      type: string
      role: output
      description: random room exclusion
    reward:
      type: string
      role: output
      description: reward
    encounters:
      type: string
      role: output
      description: encounters
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Ancient Lands, random
    - type: set
      target: corridors
      value:
        type: literal
        value: 6
    - type: set
      target: rooms
      value:
        type: literal
        value: 6
    - type: set
      target: random_room_exclusion
      value:
        type: literal
        value: R33
    - type: set
      target: reward
      value:
        type: literal
        value: Any loot found
    - type: set
      target: encounters
      value:
        type: literal
        value: Ancient Lands
- id: core.quest.temple_despair.standard_room_pool
  name: Temple of Despair — standard room pool
  section_id: section.quest_book_i.quests_into_the_ancient_lands.temple_of_despair
