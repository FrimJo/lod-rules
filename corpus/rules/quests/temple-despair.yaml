    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 268
      printed_page: 266
      heading: Temple of Despair — standard room pool
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Without Ancient Lands tiles randomise rooms from R1B, R2B, R4B-8B, R1, R4, R5, R9-R11,
    R14, R16, R17.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.temple_despair
  fields:
