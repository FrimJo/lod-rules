- id: core.quest.apprentice.aftermath
  name: The Apprentice — findings and forced onward travel
  section_id: section.quest_book_i.the_dead_rising.quest_5_the_apprentice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 233
      printed_page: 231
      section: 'Quest 5: The Apprentice'
      heading: Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once all the Zombies are down and Imgrahil is dead, the heroes take a look around the
    chamber. Rummaging through the pockets of the Necromancer they discover a notebook that is
    filled with mostly incoherent scribblings, but some of the passages do make sense. ... From what
    they can tell, the Master’s army of the Undead is growing by the minute. He also mentions that
    it is time for the Apostle to make her sacrifice to Melkhior, probably to strengthen their power
    over the dead even more. Luckily, there is a map with marked locations that gives the heroes a
    better view of the situation. ... Either way, there is no time to head back to the Silver City.
    They must press on.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.apprentice
  fields:
    all_zombies_down:
      type: boolean
      role: input
      description: All Zombies down.
    imgrahil_dead:
      type: boolean
      role: input
      description: Imgrahil dead.
    notebook_found:
      type: boolean
      role: output
      description: Source finding.
    map_with_marked_locations_found:
      type: boolean
      role: output
      description: Found map, not a printed diagram.
    master_army_growing:
      type: boolean
      role: output
      description: Source narrative informs the choice.
    apostle_sacrifice_to:
      type: string
      role: output
      description: Melkhior.
    return_to_silver_city_allowed:
      type: boolean
      role: output
      description: No time to return.
    press_on:
      type: boolean
      role: output
      description: Continue directly.
  effects:
    - type: set
      target: notebook_found
      value:
        type: literal
        value: true
    - type: set
      target: map_with_marked_locations_found
      value:
        type: literal
        value: true
    - type: set
      target: master_army_growing
      value:
        type: literal
        value: true
    - type: set
      target: apostle_sacrifice_to
      value:
        type: literal
        value: Melkhior
    - type: set
      target: return_to_silver_city_allowed
      value:
        type: literal
        value: false
    - type: set
      target: press_on
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: all_zombies_down
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: imgrahil_dead
        right:
          type: literal
          value: true
