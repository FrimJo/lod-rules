- id: core.quest.apprentice.setup
  name: The Apprentice — setup
  section_id: section.quest_book_i.the_dead_rising.quest_5_the_apprentice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 232
      printed_page: 230
      heading: 'Quest 5: The Apprentice'
      locator:
        paragraph: Quest Location, Number of tiles, Encounters, Objective room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'He kindly asks the heroes to investigate these ruins more closely, and to find and
    kill whoever is collecting corpses from all over the area. ... Quest Location: White 22. ...
    Number of tiles: 6 corridors, 6 rooms. ... Encounters: Undead. Objective room: The Chamber of
    Reverence.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.apprentice
  fields:
    objective:
      type: string
      role: output
      description: objective
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: objective
      value:
        type: literal
        value: investigate ruins and find and kill whoever is collecting corpses
    - type: set
      target: location
      value:
        type: literal
        value: White 22
    - type: set
      target: corridors
      value:
        type: literal
        value: 6
    - type: set
      target: rooms
      value:
        type: literal
        value: 6
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Chamber of Reverence
- id: core.quest.apprentice.threshold
  name: Quest Threat 10
  section_id: section.quest_book_i.the_dead_rising.quest_5_the_apprentice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 232
      printed_page: 230
      section: 'Quest 5: The Apprentice'
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      section: Reading the Quests
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: When the Threat Level reaches 10, a Wandering Monster appears regardless of the
    Scenario die result. ... This happens every time the Threat Level is increased to XX and the
    Threat Level is not decreased when the Wandering Monster is placed.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.apprentice
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before this change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Place special quest monster.
    scenario_result_ignored:
      type: boolean
      role: output
      description: Ignore Scenario result for this trigger.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No reduction for special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 10
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 10
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
- id: core.quest.apprentice.caretaker_encounter
  name: The Apprentice — additional caretaker encounter
  section_id: section.quest_book_i.the_dead_rising.quest_5_the_apprentice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 232
      printed_page: 230
      section: 'Quest 5: The Apprentice'
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Any Encounter Table roll of 15-20 results in an encounter with the caretaker, plus the
    ordinary encounter.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.apprentice
  fields:
    encounter_roll:
      type: number
      role: input
      description: Supplied Encounter Table roll.
      integer: true
      minimum: 1
      maximum: 100
    caretaker_added:
      type: boolean
      role: output
      description: Caretaker joins this encounter.
    ordinary_encounter_retained:
      type: boolean
      role: output
      description: Ordinary encounter is not replaced.
  effects:
    - type: set
      target: caretaker_added
      value:
        type: literal
        value: true
    - type: set
      target: ordinary_encounter_retained
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: encounter_roll
        right:
          type: literal
          value: 15
      - type: compare
        operator: lte
        left:
          type: field
          name: encounter_roll
        right:
          type: literal
          value: 20
  entity_id: quest_actor.dead_rising.emil
  issues:
    - issue.quest.apprentice_caretaker_repeat
