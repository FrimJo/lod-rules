- id: core.quest.apprentice.aftermath
  name: The Apprentice — findings and forced onward travel
  section_id: section.quest_book_i.the_dead_rising.quest_5_the_apprentice
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 233
      printed_page: 231
      heading: The Apprentice — findings and forced onward travel
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once all Zombies are down and Imgrahil is dead, find his notebook with passages about
    the Master and the Apostle, her sacrifice to Melkhior, and a map with marked locations. There is
    no time to head back to Silver City; press on.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.apprentice
  fields:
    all_zombies_down:
      type: boolean
      role: input
      description: All Zombies down.
    imgrahil_dead:
      type: boolean
      role: input
      description: Imgrahil dead.
    notebook_found:
      type: boolean
      role: output
      description: Source finding.
    map_with_marked_locations_found:
      type: boolean
      role: output
      description: Found map, not a printed diagram.
    master_army_growing:
      type: boolean
      role: output
      description: Source narrative informs the choice.
    apostle_sacrifice_to:
      type: string
      role: output
      description: Melkhior.
    return_to_silver_city_allowed:
      type: boolean
      role: output
      description: No time to return.
    press_on:
      type: boolean
      role: output
      description: Continue directly.
  effects:
    - type: set
      target: notebook_found
      value:
        type: literal
        value: true
    - type: set
      target: map_with_marked_locations_found
      value:
        type: literal
        value: true
    - type: set
      target: master_army_growing
      value:
        type: literal
        value: true
    - type: set
      target: apostle_sacrifice_to
      value:
        type: literal
        value: Melkhior
    - type: set
      target: return_to_silver_city_allowed
      value:
        type: literal
        value: false
    - type: set
      target: press_on
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: all_zombies_down
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: imgrahil_dead
        right:
          type: literal
          value: true
