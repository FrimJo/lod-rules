    - type: set
      target: adjacent_zombie_armour
      value:
        type: literal
        value: 0
    - type: set
      target: wall_zombies_unarmed
      value:
        type: literal
        value: true
    - type: set
      target: wall_zombie_placement
      value:
        type: literal
        value:
          along the long walls, starting as far away as possible from the heroes, divided evenly
