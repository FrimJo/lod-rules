      target: imgrahil_placement
      value:
        type: literal
        value: centre of the chalk circle
    - type: set
      target: adjacent_zombies
      value:
        type: literal
        value: 1
    - type: set
      target: adjacent_zombie_placement
      value:
        type: literal
        value: next to Imgrahil
