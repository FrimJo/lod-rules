  confidence: high
  source_text: Once the guards and Isabelle are defeated, the heroes tend to any wounded members of the staff and visitors. While in the midst of this, the adventurers recognise one of the visitors as a daughter of the High Priest of Metheia. She urges the heroes not to tell her father and promises to pay them 400 c should they keep their promise.
