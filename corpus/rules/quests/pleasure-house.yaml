  confidence: high
  source_text: If heroes choose to keep their promise not to tell her father, roll1d6 on the aftermath table.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.pleasure_house
  fields:
    guards_and_isabelle_defeated:
      type: boolean
      role: input
      description: Guards and Isabelle defeated.
    keep_secrecy_promise:
      type: boolean
      role: input
      description: Heroes choose to keep the secrecy promise.
    aftermath_die:
      type: string
      role: output
      description: 1d6.
    aftermath_table_required:
      type: boolean
      role: output
      description: Roll the table.
  effects:
    - type: set
      target: aftermath_die
      value:
        type: literal
        value: 1d6
    - type: set
      target: aftermath_table_required
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: guards_and_isabelle_defeated
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: keep_secrecy_promise
        right:
          type: literal
          value: true
  uses_tables:
    - table.quest.pleasure_house.aftermath
