      type: boolean
      role: input
      description: Guards and Isabelle defeated.
    tend_wounded_staff_and_visitors:
      type: boolean
      role: output
      description: Tend wounded.
    visitor_identity:
      type: string
      role: output
      description: Daughter’s identity.
    secrecy_offer_party_coins:
      type: number
      role: output
      description: 400c offer to the party.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: tend_wounded_staff_and_visitors
      value:
        type: literal
        value: true
    - type: set
      target: visitor_identity
      value:
        type: literal
        value: daughter of the High Priest of Metheia
    - type: set
      target: secrecy_offer_party_coins
      value:
        type: literal
        value: 400
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: guards_and_isabelle_defeated
    right:
      type: literal
      value: true
- id: core.quest.pleasure_house.secrecy_choice
  name: The Pleasure House — accepting the secrecy request
