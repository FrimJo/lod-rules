      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Roll twice on Bandits and Brigands Encounter Chart. Spread evenly along walls, starting
    at far end with any Archers. Place Madame Isabelle at the far end by the bed. Staff and visitors
    are present in the room, unnumbered.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.pleasure_house
  fields:
    encounter_rolls:
      type: number
      role: output
      description: encounter rolls
      integer: true
    enemy_placement:
      type: string
      role: output
      description: enemy placement
    archer_placement_priority:
      type: string
      role: output
      description: archer placement priority
    isabelle_position:
      type: string
      role: output
      description: isabelle position
    staff_and_visitors_present:
      type: boolean
      role: output
      description: staff and visitors present
  effects:
    - type: set
      target: encounter_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: enemy_placement
      value:
        type: literal
        value: evenly spread along walls
    - type: set
      target: archer_placement_priority
      value:
        type: literal
        value: start at far end with any Archers
    - type: set
      target: isabelle_position
      value:
        type: literal
        value: far end by the bed
    - type: set
      target: staff_and_visitors_present
      value:
        type: literal
        value: true
  unresolved_references:
    - Standard Bandits and Brigands encounter entries are unavailable; no staff or visitor count is
      printed.
