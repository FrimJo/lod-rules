- id: core.quest.pleasure_house.setup
  name: The Pleasure House — setup
  section_id: section.quest_book_i.the_bandits_hideout.quest_2_the_pleasure_house
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 251
      printed_page: 249
      heading: The Pleasure House — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Silver City. Enter through a manhole into sewers and catacombs. Eight corridors,six
    rooms. Bandits and Brigands. Reward250c perhero. The first Special Rules heading is printed as a
    dash; the following heading specifies Scenario8–10.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.pleasure_house
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
    first_special_rules_printed:
      type: string
      role: output
      description: first special rules printed
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Silver City
    - type: set
      target: corridors
      value:
        type: literal
        value: 8
    - type: set
      target: rooms
      value:
        type: literal
        value: 6
    - type: set
      target: encounters
      value:
        type: literal
        value: Bandits and Brigands
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 250
    - type: set
      target: first_special_rules_printed
      value:
        type: literal
        value: '-'
