- id: core.quest.hierophant.ancient_objective_setup
  name: Tomb of the Hierophant — ancient setup
  section_id: section.quest_book_i.quests_into_the_ancient_lands.tomb_of_the_hierophant
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 267
      printed_page: 265
      heading: Tomb of the Hierophant — ancient setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Place R22. Place a Mummy Priest next to the sarcophagus. Roll twice on the Encounter
    Table and place enemies on the tile heroes vacated before moving to the tile currently occupied.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.hierophant
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    objective_tile:
      type: string
      role: output
      description: objective tile
    djet_type:
      type: string
      role: output
      description: djet type
    djet_position:
      type: string
      role: output
      description: djet position
    encounter_table_rolls:
      type: number
      role: output
      description: encounter table rolls
      integer: true
    enemy_placement:
      type: string
      role: output
      description: enemy placement
    sarcophagus_position:
      type: string
      role: output
      description: sarcophagus position
  effects:
    - type: set
      target: objective_tile
      value:
        type: literal
        value: R22
    - type: set
      target: djet_type
      value:
        type: literal
        value: Mummy Priest
    - type: set
      target: djet_position
      value:
        type: literal
        value: next to the sarcophagus
    - type: set
      target: encounter_table_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: enemy_placement
      value:
        type: literal
        value: on the tile the heroes vacated before moving to the tile they currently occupy
    - type: set
      target: sarcophagus_position
      value:
        type: literal
        value: centre of the room
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ancient_tiles_available
    right:
      type: literal
      value: true
  entity_id: quest_actor.ancient_lands.djet
  dependencies:
    - key: djet
      label: Mummy Priest statistics and abilities are not printed here; supply outcomes
