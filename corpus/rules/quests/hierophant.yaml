      target: fire_trap_triggered
      value:
        type: literal
        value: true
    - type: set
      target: each_hero_dodge_required
      value:
        type: literal
        value: true
    - type: set
      target: fire_damage_dice
      value:
        type: literal
        value: 1d12
  when:
    type: all
    conditions:
