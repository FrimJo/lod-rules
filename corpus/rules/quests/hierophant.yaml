- id: core.quest.hierophant.setup
  name: Tomb of the Hierophant — setup
  section_id: section.quest_book_i.quests_into_the_ancient_lands.tomb_of_the_hierophant
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 266
      printed_page: 264
      heading: Tomb of the Hierophant — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Requested by the Golden College of Magic to investigate artifacts of Djet. Quest
    Location: Ancient Lands, random. Number of tiles: 7 corridors, 7 rooms (not R22). Reward: 300 c
    per hero; extra may be paid for what you bring back. Encounters: Ancient Lands.'
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.hierophant
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    random_room_exclusion:
      type: string
      role: output
      description: random room exclusion
    advertised_reward_per_hero:
      type: number
      role: output
      description: advertised reward per hero
      integer: true
    extra_rewards_possible:
      type: boolean
      role: output
      description: extra rewards possible
    encounters:
      type: string
      role: output
      description: encounters
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Ancient Lands, random
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: random_room_exclusion
      value:
        type: literal
        value: R22
    - type: set
      target: advertised_reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
      target: extra_rewards_possible
      value:
        type: literal
        value: true
    - type: set
      target: encounters
      value:
        type: literal
        value: Ancient Lands
- id: core.quest.hierophant.standard_room_pool
  name: Tomb of the Hierophant — standard room pool
  section_id: section.quest_book_i.quests_into_the_ancient_lands.tomb_of_the_hierophant
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 266
      printed_page: 264
      heading: Tomb of the Hierophant — standard room pool
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Without Ancient Lands tiles randomise rooms from R2B, R4B-8B, R1, R4-R6, R9-R11, R14,
    R16, R17. All corridors can be part of the mix.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.hierophant
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    random_room_pool:
      type: string
      role: output
      description: random room pool
    all_corridors_available:
      type: boolean
      role: output
      description: all corridors available
  effects:
    - type: set
      target: random_room_pool
      value:
        type: literal
        value: R2B, R4B-8B, R1, R4-R6, R9-R11, R14, R16, R17
    - type: set
      target: all_corridors_available
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ancient_tiles_available
    right:
      type: literal
      value: false
- id: core.quest.hierophant.furniture_reroll
  name: Tomb of the Hierophant — Furniture Chart rerolls
  section_id: section.quest_book_i.quests_into_the_ancient_lands.tomb_of_the_hierophant
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 266
      printed_page: 264
      heading: Tomb of the Hierophant — Furniture Chart rerolls
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    You may re-roll 4 rolls on the furniture chart during the quest. A re-roll may never be
    re-rolled.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.hierophant
  fields:
    furniture_chart_roll:
      type: boolean
      role: input
      description: furniture chart roll
    already_a_reroll:
      type: boolean
      role: input
      description: already a reroll
    furniture_rerolls_used_this_quest:
      type: number
      role: input
      description: furniture rerolls used this quest
      integer: true
    furniture_reroll_allowed:
      type: boolean
      role: output
      description: furniture reroll allowed
  effects:
    - type: set
      target: furniture_reroll_allowed
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: furniture_chart_roll
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: already_a_reroll
        right:
          type: literal
          value: false
      - type: compare
        operator: gte
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 0
      - type: compare
        operator: lt
        left:
          type: field
          name: furniture_rerolls_used_this_quest
        right:
          type: literal
          value: 4
