- id: core.quest.spider_queen_tomb.summon_attempt
  name: Belua — behaviour 5–6 summoning attempt
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_3_the_tomb_of_the_spider_queen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 241
      printed_page: 239
      heading: Belua — behaviour 5–6 summoning attempt
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: On behaviour 5–6 Belua tries to summon a child. Make a CS test for her.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.tomb
  fields:
    behaviour_roll:
      type: number
      role: input
      description: Supplied behaviour result.
      integer: true
      minimum: 1
      maximum: 6
    summoning_attempt:
      type: boolean
      role: output
      description: Attempt a summon.
    cs_test_required:
      type: boolean
      role: output
      description: Requires her CS test.
    cs_test_value:
      type: number
      role: output
      description: Printed CS 55.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: summoning_attempt
      value:
        type: literal
        value: true
    - type: set
      target: cs_test_required
      value:
        type: literal
        value: true
    - type: set
      target: cs_test_value
      value:
        type: literal
        value: 55
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: behaviour_roll
        right:
          type: literal
          value: 5
      - type: compare
        operator: lte
        left:
          type: field
          name: behaviour_roll
        right:
          type: literal
          value: 6
- id: core.quest.spider_queen_tomb.summon_success
  name: Belua — successful summoning
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_3_the_tomb_of_the_spider_queen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 241
      printed_page: 239
      heading: Belua — successful summoning
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    On behaviour 5–6, if Belua succeeds at her CS test, place one Giant Spider randomly in
    the room. It may not act on the turn it arrives.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.tomb
  fields:
    behaviour_roll:
      type: number
      role: input
      description: Supplied behaviour result.
      integer: true
      minimum: 1
      maximum: 6
    belua_cs_test_succeeded:
      type: boolean
      role: input
      description: Supplied outcome of Belua’s CS test.
    summoned_giant_spiders:
      type: number
      role: output
      description: One child.
      integer: true
      minimum: 0
    summoned_spider_position:
      type: string
      role: output
      description: Randomly in the room.
    summoned_spider_may_act_on_arrival_turn:
      type: boolean
      role: output
      description: Cannot act this turn.
  effects:
    - type: set
      target: summoned_giant_spiders
      value:
        type: literal
        value: 1
    - type: set
      target: summoned_spider_position
      value:
        type: literal
        value: randomly in the room
    - type: set
      target: summoned_spider_may_act_on_arrival_turn
      value:
        type: literal
        value: false
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: behaviour_roll
        right:
          type: literal
          value: 5
      - type: compare
        operator: lte
        left:
          type: field
          name: behaviour_roll
        right:
          type: literal
          value: 6
      - type: compare
        operator: eq
        left:
          type: field
          name: belua_cs_test_succeeded
        right:
          type: literal
          value: true
  unresolved_references:
    - Random placement is supplied; standard Giant Spider statistics are not printed here.
