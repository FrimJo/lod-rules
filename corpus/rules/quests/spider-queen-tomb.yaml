- id: core.quest.spider_queen_tomb.encounter_odd
  name: The Tomb — odd encounter roll
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_3_the_tomb_of_the_spider_queen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 241
      printed_page: 239
      heading: The Tomb — odd encounter roll
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Whenever an encounter occurs, roll a die. An odd number results in 1d3 Giant Spiders.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.tomb
  fields:
    encounter_die_odd:
      type: boolean
      role: input
      description: Whether the supplied encounter die result is odd; no die size is printed.
    encounter_kind:
      type: string
      role: output
      description: Giant Spiders.
    encounter_count_dice:
      type: string
      role: output
      description: Printed 1d3 count expression.
  effects:
    - type: set
      target: encounter_kind
      value:
        type: literal
        value: Giant Spiders
    - type: set
      target: encounter_count_dice
      value:
        type: literal
        value: 1d3
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: encounter_die_odd
    right:
      type: literal
      value: true
  unresolved_references:
    - The parity die size is not specified in this quest. Giant Spider standard statistics require
      the unavailable Bestiary.
