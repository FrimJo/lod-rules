        right:
          type: literal
          value: 31
      - type: compare
        operator: lte
        left:
          type: field
          name: encounter_roll
        right:
          type: literal
          value: 45
      - type: compare
        operator: eq
        left:
          type: field
          name: johann_encountered
        right:
          type: literal
          value: true
