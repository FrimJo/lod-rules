- id: core.quest.spring_cleaning.setup
  name: Spring Cleaning — quest setup
  section_id: section.quest_book_i.the_dead_rising.quest_1_spring_cleaning
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 224
      printed_page: 222
      heading: 'Quest 1: Spring Cleaning'
      locator:
        paragraph: Quest Location; Number of Tiles; Encounters; Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'You have been tasked by the local Town Elder to clear out the basement of the
    Town Hall. ... The Town elder says that there is nothing of value down there, but that you are
    free to take anything you find. ... Quest Location: In any town. ... Number of Tiles: 4
    corridors (not C16), 4 rooms (Not R17). ... Encounters: Quest Specific. ... Objective Room:
    R5B.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.spring_cleaning
  fields:
    location:
      type: string
      role: output
      description: Printed quest location.
    corridors:
      type: number
      role: output
      description: Number of corridor tiles.
      integer: true
      minimum: 0
    excluded_corridor:
      type: string
      role: output
      description: Excluded corridor tile.
    rooms:
      type: number
      role: output
      description: Number of room tiles.
      integer: true
      minimum: 0
    excluded_room:
      type: string
      role: output
      description: Excluded room tile.
    objective_room:
      type: string
      role: output
      description: Objective Room tile.
    encounter_source:
      type: string
      role: output
      description: Quest-specific encounters.
    may_take_findings:
      type: boolean
      role: output
      description: Town Elder permits taking findings.
    objective:
      type: string
      role: output
      description: Printed task; no invented numerical completion condition.
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: any town
    - type: set
      target: corridors
      value:
        type: literal
        value: 4
    - type: set
      target: excluded_corridor
      value:
        type: literal
        value: C16
    - type: set
      target: rooms
      value:
        type: literal
        value: 4
    - type: set
      target: excluded_room
      value:
        type: literal
        value: R17
    - type: set
      target: objective_room
      value:
        type: literal
        value: R5B
    - type: set
      target: encounter_source
      value:
        type: literal
        value: quest-specific
    - type: set
      target: may_take_findings
      value:
        type: literal
        value: true
    - type: set
      target: objective
      value:
        type: literal
        value: clear out the basement of the Town Hall
- id: core.quest.spring_cleaning.threshold
  name: Spring Cleaning — Threat 12
  section_id: section.quest_book_i.the_dead_rising.quest_1_spring_cleaning
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 224
      printed_page: 222
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Special Rules: When the Threat Level reaches 12, a Wandering Monster appears
    regardless of the Scenario die result.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.spring_cleaning
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before the supplied change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after the supplied change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Printed quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Special wandering-monster placement.
    scenario_result_ignored:
      type: boolean
      role: output
      description: This trigger does not depend on Scenario die result.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No reduction for this special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 12
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 12
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
  unresolved_references:
    - Upward-only triggering and no Threat reduction on placement follow the Quest Book I Triggering
      Wandering Monsters rule (PDF 222), applied through core.quest_book.threat_threshold_monster.
- id: core.quest.spring_cleaning.rest_exception
  name: Spring Cleaning — ration-free rest
  section_id: section.quest_book_i.the_dead_rising.quest_1_spring_cleaning
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 224
      printed_page: 222
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: For this quest only, the party may gain the benefits of the ‘Rest’ rule (page 98)
    without consuming any food rations. But learn from your experience and remember to bring
    rations, because the gods will not be so friendly next time!
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.spring_cleaning
  fields:
    current_quest:
      type: string
      role: input
      description: Quest the party is currently playing; the exception is printed "For this quest only".
    rest_ration_cost:
      type: number
      role: output
      description:
        Overrides the usual food cost in this quest; other Rest requirements and interruption
        rules remain.
      integer: true
      minimum: 0
    rest_other_requirements_unchanged:
      type: boolean
      role: output
      description: Only the ration requirement is excepted.
  effects:
    - type: set
      target: rest_ration_cost
      value:
        type: literal
        value: 0
    - type: set
      target: rest_other_requirements_unchanged
      value:
        type: literal
        value: true
  dependencies:
    - key: rest
      label: Ordinary Rest requirements and benefits, subject to the quest ration exception
      object_id: procedure.rest
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: current_quest
    right:
      type: literal
      value: quest.dead_rising.spring_cleaning
- id: core.quest.spring_cleaning.johann_first_encounter
  name: Spring Cleaning — Johann first encounter
  section_id: section.quest_book_i.the_dead_rising.quest_1_spring_cleaning
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 225
      printed_page: 223
      heading: Quest-Specific Encounter Table
      locator:
        table: Quest-Specific Encounter Table
        row: 31-45
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 225
      printed_page: 223
      heading: Johann, the Gardener
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    31-45 Johann the gardener ... Johann can only appear once. ... Johann uses the standard
    Zombie stats, and is unarmed.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.spring_cleaning
  fields:
    encounter_roll:
      type: number
      role: input
      description: Supplied d100 encounter roll.
      integer: true
      minimum: 1
      maximum: 100
    johann_encountered:
      type: boolean
      role: input
      description: Whether Johann has already appeared this quest.
    encounter:
      type: string
      role: output
      description: Printed enemy identity.
    johann_unarmed:
      type: boolean
      role: output
      description: No weapon.
    johann_appears:
      type: boolean
      role: output
      description: Place Johann; lifecycle records the occurrence.
  effects:
    - type: set
      target: encounter
      value:
        type: literal
        value: Johann the gardener
    - type: set
      target: johann_unarmed
      value:
        type: literal
        value: true
    - type: set
      target: johann_appears
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: encounter_roll
        right:
          type: literal
          value: 31
      - type: compare
        operator: lte
        left:
          type: field
          name: encounter_roll
        right:
          type: literal
          value: 45
      - type: compare
        operator: eq
        left:
          type: field
          name: johann_encountered
        right:
          type: literal
          value: false
  unresolved_references:
    - Johann uses the standard Zombie stats. Those statistics are not printed in this quest.
  entity_id: quest_actor.dead_rising.johann
