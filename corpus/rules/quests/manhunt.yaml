    left:
      type: field
      name: door_opened
    right:
      type: literal
      value: true
- id: core.quest.manhunt.found
  name: Manhunt — bandit card
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: 'Special Rules:'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If you draw the card representing the bandit, you have found him. Roll for Encounters
    as usual, then place the bandit in the far end of the room.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    door_opened:
      type: boolean
      role: input
      description: door opened
    drawn_card_represents_bandit:
      type: boolean
      role: input
      description: drawn card represents bandit
    bandit_found:
      type: boolean
      role: output
      description: bandit found
    roll_encounters_as_usual:
      type: boolean
      role: output
      description: roll encounters as usual
    bandit_placement:
      type: string
      role: output
      description: bandit placement
    bandit_placed_after_encounter_roll:
      type: boolean
      role: output
      description: bandit placed after encounter roll
  effects:
    - type: set
      target: bandit_found
      value:
        type: literal
        value: true
    - type: set
      target: roll_encounters_as_usual
      value:
        type: literal
        value: true
    - type: set
      target: bandit_placement
      value:
        type: literal
        value: far end of the room
    - type: set
      target: bandit_placed_after_encounter_roll
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: door_opened
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: drawn_card_represents_bandit
        right:
          type: literal
          value: true
