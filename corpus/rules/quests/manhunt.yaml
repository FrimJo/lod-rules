- id: core.quest.manhunt.setup
  name: Manhunt — setup
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'A bandit killed a city guard and hides in the party’s next dungeon. Anyone who kills
    him and can prove it will be rewarded. Location: same dungeon as the next quest. Reward: 250 c.
    Encounters: as defined by the main quest. Objective room: No specific Objective Room.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    location:
      type: string
      role: output
      description: location
    advertised_reward_coins:
      type: number
      role: output
      description: advertised reward coins
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: advertised_reward_coins
      value:
        type: literal
        value: 250
    - type: set
      target: encounters
      value:
        type: literal
        value: as defined by the main quest
    - type: set
      target: objective_room
      value:
        type: literal
        value: No specific Objective Room
