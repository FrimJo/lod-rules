- id: core.quest.manhunt.deck
  name: Manhunt — separate Dungeoneers Deck pile
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — separate Dungeoneers Deck pile
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Once the dungeon deck is done, take the same number of cards from the Dungeoneers Deck
    in a separate pile. Choose one specific card to represent the bandit, mix that deck and place it
    next to the ordinary deck.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    dungeon_deck_done:
      type: boolean
      role: input
      description: dungeon deck done
    dungeon_deck_cards:
      type: number
      role: input
      description: dungeon deck cards
      integer: true
      minimum: 1
    auxiliary_deck_cards:
      type: number
      role: output
      description: auxiliary deck cards
      integer: true
    chosen_bandit_cards:
      type: number
      role: output
      description: chosen bandit cards
      integer: true
    mix_auxiliary_deck:
      type: boolean
      role: output
      description: mix auxiliary deck
    auxiliary_deck_next_to_ordinary:
      type: boolean
      role: output
      description: auxiliary deck next to ordinary
  effects:
    - type: set
      target: auxiliary_deck_cards
      value:
        type: field
        name: dungeon_deck_cards
    - type: set
      target: chosen_bandit_cards
      value:
        type: literal
        value: 1
    - type: set
      target: mix_auxiliary_deck
      value:
        type: literal
        value: true
    - type: set
      target: auxiliary_deck_next_to_ordinary
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: dungeon_deck_done
    right:
      type: literal
      value: true
- id: core.quest.manhunt.door_draw
  name: Manhunt — door draw
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — door draw
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once you open a door, draw one card from the new deck.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    door_opened:
      type: boolean
      role: input
      description: door opened
    auxiliary_cards_to_draw:
      type: number
      role: output
      description: auxiliary cards to draw
      integer: true
  effects:
    - type: set
      target: auxiliary_cards_to_draw
      value:
        type: literal
        value: 1
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: door_opened
    right:
      type: literal
      value: true
- id: core.quest.manhunt.found
  name: Manhunt — bandit card
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — bandit card
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the card representing the bandit is drawn, you have found him. Roll for Encounters
    as usual, then place the bandit in the far end of the room.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    door_opened:
      type: boolean
      role: input
      description: door opened
    drawn_card_represents_bandit:
      type: boolean
      role: input
      description: drawn card represents bandit
    bandit_found:
      type: boolean
      role: output
      description: bandit found
    roll_encounters_as_usual:
      type: boolean
      role: output
      description: roll encounters as usual
    bandit_placement:
      type: string
      role: output
      description: bandit placement
    bandit_placed_after_encounter_roll:
      type: boolean
      role: output
      description: bandit placed after encounter roll
  effects:
    - type: set
      target: bandit_found
      value:
        type: literal
        value: true
    - type: set
      target: roll_encounters_as_usual
      value:
        type: literal
        value: true
    - type: set
      target: bandit_placement
      value:
        type: literal
        value: far end of the room
    - type: set
      target: bandit_placed_after_encounter_roll
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: door_opened
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: drawn_card_represents_bandit
        right:
          type: literal
          value: true
- id: core.quest.manhunt.profile
  name: Manhunt — Bandit equipment
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — Bandit equipment
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Bandit is equipped with a battle-axe and a shield. He has Armour 3.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    bandit_weapon:
      type: string
      role: output
      description: bandit weapon
    bandit_has_shield:
      type: boolean
      role: output
      description: bandit has shield
    bandit_armour:
      type: number
      role: output
      description: bandit armour
