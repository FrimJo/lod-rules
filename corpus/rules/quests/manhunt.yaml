- id: core.quest.manhunt.reward
  name: Manhunt — city reward
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: Manhunt — city reward
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Anyone who kills the bandit and can prove it will be rewarded. Reward: 250 c. If
    heroes kill him, they receive the reward once back in the city.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    bandit_killed:
      type: boolean
      role: input
      description: bandit killed
    kill_proven:
      type: boolean
      role: input
      description: kill proven
    back_in_city:
      type: boolean
      role: input
      description: back in city
    reward_coins:
      type: number
      role: output
      description: reward coins
      integer: true
  effects:
    - type: set
      target: reward_coins
      value:
        type: literal
        value: 250
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: bandit_killed
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: kill_proven
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: back_in_city
        right:
          type: literal
          value: true
  issues:
    - issue.quest.manhunt_proof_boundary
