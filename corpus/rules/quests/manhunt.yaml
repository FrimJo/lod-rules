      pdf_page: 278
      printed_page: 276
      heading: 'Encounters:'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: 'Objective room:'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'It seems anyone who kills the bandit, and can prove it, will be handsomely rewarded.
    Unbeknownst to the heroes, the bandit has taken refuge in the very same dungeon to which they
    are heading. Quest Location: In the same dungeon as the next quest. ... Reward: 250 c.
    Encounters: As defined by the main quest. Objective room: No specific Objective Room.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    location:
      type: string
      role: output
      description: location
    advertised_reward_coins:
      type: number
      role: output
      description: advertised reward coins
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: advertised_reward_coins
      value:
        type: literal
        value: 250
    - type: set
      target: encounters
      value:
        type: literal
        value: as defined by the main quest
    - type: set
      target: objective_room
      value:
        type: literal
        value: No specific Objective Room
- id: core.quest.manhunt.identification
  name: Manhunt — identifying features
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: 'Side Quest 5: Manhunt'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Posters with sketches of the perpetrator have been posted everywhere. Apparently, the
    man is missing both an eye and an ear, so he should be easy to identify.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    bandit_missing_eye:
      type: boolean
      role: output
      description: bandit missing eye
    bandit_missing_ear:
      type: boolean
      role: output
      description: bandit missing ear
  effects:
    - type: set
      target: bandit_missing_eye
      value:
        type: literal
        value: true
    - type: set
      target: bandit_missing_ear
      value:
        type: literal
        value: true
- id: core.quest.manhunt.deck
  name: Manhunt — separate Dungeoneers Deck pile
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 278
      printed_page: 276
      heading: 'Special Rules:'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Special Rules: Once the dungeon deck is done, take the same number of cards from the
    Dungeoneers Deck in a separate pile. Choose one specific card that represents the bandit and
    then mix that deck and place it next to the ordinary deck.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.manhunt
  fields:
    dungeon_deck_done:
      type: boolean
      role: input
      description: dungeon deck done
    dungeon_deck_cards:
      type: number
      role: input
      description: dungeon deck cards
      integer: true
      minimum: 1
    auxiliary_deck_cards:
      type: number
      role: output
      description: auxiliary deck cards
      integer: true
    chosen_bandit_cards:
      type: number
      role: output
      description: chosen bandit cards
      integer: true
    mix_auxiliary_deck:
      type: boolean
      role: output
      description: mix auxiliary deck
    auxiliary_deck_next_to_ordinary:
      type: boolean
      role: output
      description: auxiliary deck next to ordinary
  effects:
    - type: set
      target: auxiliary_deck_cards
      value:
        type: field
        name: dungeon_deck_cards
    - type: set
      target: chosen_bandit_cards
      value:
        type: literal
        value: 1
    - type: set
      target: mix_auxiliary_deck
      value:
        type: literal
        value: true
    - type: set
      target: auxiliary_deck_next_to_ordinary
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: dungeon_deck_done
    right:
      type: literal
      value: true
- id: core.quest.manhunt.door_draw
  name: Manhunt — door draw
  section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
  source:
    - document: rulebook.second_printing.eng
