    - type: set
      target: bandit_has_shield
      value:
        type: literal
        value: true
    - type: set
      target: bandit_armour
      value:
        type: literal
        value: 3
  dependencies:
    - key: battleaxe
      label: Battle-axe
      object_id: equipment.weapon.battleaxe
    - key: shield
      label: Shield type not specified in this quest
