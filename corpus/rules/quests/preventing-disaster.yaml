          name: river_flooding
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_remains_in_chamber
        right:
          type: literal
          value: true
      - type: compare
        operator: gt
        left:
          type: field
          name: turns_since_flooding
        right:
          type: literal
          value: 3
