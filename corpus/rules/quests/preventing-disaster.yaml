      description: encounters
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
    scrolls_supplied:
      type: number
      role: output
      description: scrolls supplied
      integer: true
    successful_incantations_required:
      type: number
      role: output
      description: successful incantations required
      integer: true
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Silver City
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: room_tiles
      value:
        type: literal
        value: R1B-8B
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
