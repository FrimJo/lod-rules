      type: number
      role: output
      description: Once per action.
      integer: true
      minimum: 0
    standing_attempts_per_turn:
      type: number
      role: output
      description: Twice per turn.
      integer: true
      minimum: 0
    standing_requires_dex_test:
      type: boolean
      role: output
      description: DEX required.
    undead_attack_bonus_against_lying_hero:
      type: string
      role: output
      description: Printed Standard Bonus pointer, no invented value.
  effects:
    - type: set
      target: standing_attempts_per_action
      value:
        type: literal
        value: 1
    - type: set
      target: standing_attempts_per_turn
      value:
        type: literal
        value: 2
    - type: set
      target: standing_requires_dex_test
      value:
        type: literal
        value: true
    - type: set
      target: undead_attack_bonus_against_lying_hero
      value:
        type: literal
        value: Standard Bonus for attacking someone lying down
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hero_still_lying
    right:
      type: literal
      value: true
  dependencies:
    - key: lying_target_bonus
      label: Standard Bonus for attacking a lying target
      object_id: table.combat.melee_modifiers
- id: core.quest.preventing_disaster.scroll_attempt
  name: Preventing a Disaster — incantation attempt
  section_id: section.quest_book_i.the_lava_river.quest_3_preventing_a_disaster
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 247
      printed_page: 245
      heading: 'Quest 3: Preventing a Disaster'
      locator:
        paragraph: introduction
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 247
      printed_page: 245
      heading: Special Rules
      locator:
        paragraph: The Objective Room, Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The incantation is so powerful, that even if the Spellcaster fails, the scroll will crumble to dust. ... The hero with the scrolls must try to cast the incantation while standing adjacent to the altar. If it fails, the scroll crumbles. Luckily, the party has two scrolls.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.preventing_disaster
  fields:
    valid_incantation_attempt:
      type: boolean
      role: input
      description: Scroll carrier casts while standing adjacent to the altar with a scroll available.
    scroll_consumed_per_attempt:
      type: number
      role: output
      description: One scroll per valid attempt, no duplicated inventory mutation.
      integer: true
      minimum: 0
    failed_scroll_also_crumbles:
      type: boolean
      role: output
      description: Explicit failure destruction.
  effects:
    - type: set
      target: scroll_consumed_per_attempt
      value:
        type: literal
        value: 1
    - type: set
      target: failed_scroll_also_crumbles
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: valid_incantation_attempt
    right:
      type: literal
      value: true
  overrides:
    - core.magic.scroll.destroyed
  unresolved_references:
    - This unnamed incantation has no printed casting difficulty, spell level or named spell. Supply the casting outcome; do not assign a spell or threshold.
  issues:
    - issue.quest.disaster_incantation_casting
