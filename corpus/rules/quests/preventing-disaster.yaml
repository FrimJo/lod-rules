      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'The tremors are very noticeable in this room. If the Scenario die ends up 1-2 do the following: Each character must make a test for DEX. ... The Undead are so used to the tremors that they are unaffected.'
