          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: in_objective_room
        right:
          type: literal
          value: true
      - type: compare
        operator: lte
        left:
          type: field
          name: scenario_roll
        right:
          type: literal
          value: 2
- id: core.quest.preventing_disaster.toppled
