- id: core.quest.preventing_disaster.setup
  name: Preventing a Disaster — location, tiles, reward, encounters and scrolls
  section_id: section.quest_book_i.the_lava_river.quest_3_preventing_a_disaster
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 247
      printed_page: 245
      heading: 'Quest 3: Preventing a Disaster'
      locator:
        paragraph: introduction; Quest Location; Number of Tiles; Reward; Encounters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'The priests have hired the heroes and provided them with 2 scrolls that must be read at the altar. Well, actually only one needs to be read, but they have provided an extra, should the first one fail. ... Quest Location: In Silver City. ... Number of Tiles: 7 corridors, 7 rooms using the tiles R1B-8B. ... Reward: 300 c per hero. Encounters: Undead.'
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.preventing_disaster
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    room_tiles:
      type: string
      role: output
      description: room tiles
    encounters:
      type: string
      role: output
      description: encounters
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
    scrolls_supplied:
      type: number
      role: output
      description: scrolls supplied
      integer: true
    successful_incantations_required:
      type: number
      role: output
      description: successful incantations required
      integer: true
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Silver City
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: room_tiles
      value:
        type: literal
        value: R1B-8B
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
      target: scrolls_supplied
      value:
        type: literal
        value: 2
    - type: set
      target: successful_incantations_required
      value:
        type: literal
        value: 1
  dependencies:
    - key: scrolls
      label: Rhidnir temple incantation scrolls
      object_id: equipment.quest.rhidnir_incantation_scrolls
- id: core.quest.preventing_disaster.threshold
  name: Quest Threat 12
  section_id: section.quest_book_i.the_lava_river.quest_3_preventing_a_disaster
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 247
      printed_page: 245
      heading: Special Rules
      locator:
        paragraph: 'Quest 3: Preventing a Disaster, first run-in'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: 'Special Rules: When the Threat Level reaches 12, a Wandering Monster appears regardless of the Scenario die result.'
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.preventing_disaster
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before this change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: A Wandering Monster appears.
    scenario_result_ignored:
      type: boolean
      role: output
      description: Ignore Scenario result for this trigger.
    threat_reduction_on_placement:
      type: number
      role: output
      description: The Threat Level is not decreased when the Wandering Monster is placed.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 12
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 12
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
