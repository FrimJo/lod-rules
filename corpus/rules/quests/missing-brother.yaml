  scope: quest
  quest_id: quest.side.missing_brother
  fields:
    missing_brother_rescued:
      type: boolean
      role: input
      description: missing brother rescued
    back_in_city:
      type: boolean
      role: input
      description: back in city
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
    reward_payer:
      type: string
      role: output
      description: reward payer
  effects:
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 100
    - type: set
      target: reward_payer
      value:
        type: literal
        value: sister
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: missing_brother_rescued
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: back_in_city
        right:
          type: literal
          value: true
- id: core.quest.missing_brother.not_found
  name: The Missing Brother — did not find him
  section_id: section.quest_book_i.side_quests.side_quest_1_the_missing_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 274
      printed_page: 272
      heading: The Missing Brother — did not find him
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: As soon as heroes set foot in the tavern the sister looks at them nervously. A hero
    shakes his head and she rushes out through the door.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.missing_brother
  fields:
    brother_not_found:
      type: boolean
      role: input
      description: brother not found
    back_at_tavern:
      type: boolean
      role: input
      description: back at tavern
    sister_leaves_tavern:
      type: boolean
      role: output
      description: sister leaves tavern
  effects:
    - type: set
      target: sister_leaves_tavern
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_not_found
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: back_at_tavern
        right:
          type: literal
          value: true
