- id: core.quest.spider_queen_basement.secondary_aftermath
  name: The Basement — Kraghul’s Antidotes
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 240
      printed_page: 238
      heading: The Basement — Kraghul’s Antidotes
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: After Kraghul is dead, heroes go through his remains and find two potions marked
    Antidote in a satchel around his waist. The party may search Kraghul as usual as well. The
    potions may be used without rolling for identifications.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    kraghul_dead_and_remains_examined:
      type: boolean
      role: input
      description: Kraghul is dead and the heroes examine his remains.
    antidote_potions:
      type: number
      role: output
      description: Two potions; party finding, not per hero.
      integer: true
      minimum: 0
    potion_label:
      type: string
      role: output
      description: Printed label.
    potion_location:
      type: string
      role: output
      description: Printed location.
    identification_roll_required:
      type: boolean
      role: output
      description: Explicit exception to rolling identification.
    ordinary_search_allowed_as_well:
      type: boolean
      role: output
      description: Usual search is allowed in addition.
  effects:
    - type: set
      target: antidote_potions
      value:
        type: literal
        value: 2
    - type: set
      target: potion_label
      value:
        type: literal
        value: Antidote
    - type: set
      target: potion_location
      value:
        type: literal
        value: satchel around Kraghul’s waist
    - type: set
      target: identification_roll_required
      value:
        type: literal
        value: false
    - type: set
      target: ordinary_search_allowed_as_well
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: kraghul_dead_and_remains_examined
    right:
      type: literal
      value: true
  dependencies:
    - key: antidotes
      label: Kraghul’s labelled Antidotes
      object_id: equipment.quest.kraghul_antidotes
