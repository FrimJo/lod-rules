- id: core.quest.spider_queen_basement.secondary_aftermath
  name: The Basement — Kraghul’s Antidotes
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 240
      printed_page: 238
      heading: Aftermath
      locator:
        paragraph: 'Level 2: The Basement, Aftermath'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The mighty beast is finally dead, and the heroes go through his remains. Packed tight in a satchel around his waist are two potions, clearly marked Antidote. ... The party may search Kraghul as usual as well, and the potions may be used without rolling for identifications.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    kraghul_dead_and_remains_examined:
      type: boolean
      role: input
      description: Kraghul is dead and the heroes examine his remains.
    antidote_potions:
      type: number
      role: output
      description: Two potions; party finding, not per hero.
      integer: true
      minimum: 0
    potion_label:
      type: string
      role: output
      description: Printed label.
    potion_location:
      type: string
      role: output
      description: Printed location.
    identification_roll_required:
      type: boolean
      role: output
      description: Explicit exception to rolling identification.
    ordinary_search_allowed_as_well:
      type: boolean
      role: output
      description: Usual search is allowed in addition.
  effects:
    - type: set
      target: antidote_potions
      value:
        type: literal
        value: 2
    - type: set
      target: potion_label
      value:
        type: literal
        value: Antidote
    - type: set
      target: potion_location
      value:
        type: literal
        value: satchel around Kraghul’s waist
    - type: set
      target: identification_roll_required
      value:
        type: literal
        value: false
    - type: set
      target: ordinary_search_allowed_as_well
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: kraghul_dead_and_remains_examined
    right:
      type: literal
      value: true
  dependencies:
    - key: antidotes
      label: Kraghul’s labelled Antidotes
      object_id: equipment.quest.kraghul_antidotes
- id: core.quest.spider_queen_basement.objective
  name: The Basement — objective stair
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 240
      printed_page: 238
      heading: The Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Finally, the heroes locate the stairs. They carefully approach them, expecting traps or monsters, but they safely reach the top of the stairs. The darkness prevents any possibility to spy what lies ahead. Instead, they carefully start their descent further into the bowels of the temple.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    stairs_safely_reached:
      type: boolean
      role: output
      description: stairs safely reached
    spying_ahead_prevented_by_darkness:
      type: boolean
      role: output
      description: spying ahead prevented by darkness
    descend_further:
      type: boolean
      role: output
      description: descend further
  effects:
    - type: set
      target: stairs_safely_reached
      value:
        type: literal
        value: true
    - type: set
      target: spying_ahead_prevented_by_darkness
      value:
        type: literal
        value: true
    - type: set
      target: descend_further
      value:
        type: literal
        value: true
  dependencies:
    - key: next_level
      label: 'Level 3: The Tomb of the Spider Queen'
      object_id: quest.spider_queen.tomb
