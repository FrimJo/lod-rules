- id: core.quest.spider_queen_basement.setup
  name: 'Level 2: The Basement — tiles, encounters, objective and starting tile'
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 239
      printed_page: 237
      heading: 'Level 2: The Basement'
      locator:
        paragraph: Number of Tiles; Encounters; Objective Room; Starting Tile
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Number of Tiles: 7 rooms, 7 corridors. Not C16, or R17. (All cards from the previous level are mixed in when dealing the new deck). ... Encounters: Beasts. Objective Room: The stairs, C16. This takes the heroes down to the next level. ... Starting Tile: C18. Place a door at the far end and place the heroes as you see fit.'
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    excluded_corridor:
      type: string
      role: output
      description: excluded corridor
    excluded_room:
      type: string
      role: output
      description: excluded room
    previous_level_cards_mixed_into_new_deck:
      type: boolean
      role: output
      description: previous level cards mixed into new deck
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
    objective_leads_down:
      type: boolean
      role: output
      description: objective leads down
    starting_tile:
      type: string
      role: output
      description: starting tile
    starting_door:
      type: string
      role: output
      description: starting door
    starting_hero_positions:
      type: string
      role: output
      description: starting hero positions
  effects:
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: excluded_corridor
      value:
        type: literal
        value: C16
    - type: set
      target: excluded_room
      value:
        type: literal
        value: R17
    - type: set
      target: previous_level_cards_mixed_into_new_deck
      value:
        type: literal
        value: true
    - type: set
      target: encounters
      value:
        type: literal
        value: Beasts
    - type: set
      target: objective_room
      value:
        type: literal
        value: the stairs, C16
    - type: set
      target: objective_leads_down
      value:
        type: literal
        value: true
    - type: set
      target: starting_tile
      value:
        type: literal
        value: C18
    - type: set
      target: starting_door
      value:
        type: literal
        value: far end
    - type: set
      target: starting_hero_positions
      value:
        type: literal
        value: as you see fit
- id: core.quest.spider_queen_basement.secondary_card
  name: The Basement — Secondary Quest card placement
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 239
      printed_page: 237
      heading: Special Rules
      locator:
        paragraph: 'Level 2: The Basement, first bullet'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Secondary Quest card 1 should be mixed in with the stack before dividing it to add the normal objective card. That means the Secondary Quest card can be anywhere, including last.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    secondary_quest_card:
      type: number
      role: output
      description: secondary quest card
      integer: true
    mix_secondary_before_normal_objective_division:
      type: boolean
      role: output
      description: mix secondary before normal objective division
    secondary_card_may_be_last:
      type: boolean
      role: output
      description: secondary card may be last
  effects:
    - type: set
      target: secondary_quest_card
      value:
        type: literal
        value: 1
    - type: set
      target: mix_secondary_before_normal_objective_division
      value:
        type: literal
        value: true
    - type: set
      target: secondary_card_may_be_last
      value:
        type: literal
        value: true
- id: core.quest.spider_queen_basement.threshold
  name: The Basement — Wandering Monsters at Threat 10 and 16
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 239
      printed_page: 237
      heading: Special Rules
      locator:
        paragraph: 'Level 2: The Basement, second bullet'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: A Wandering Monster appears when the Threat Level reaches 10 and 16.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before the change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after the change.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: A Wandering Monster appears.
    threat_reduction_on_placement:
      type: number
      role: output
      description: The Threat Level is not decreased when the Wandering Monster is placed.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: current_threat
            right:
              type: literal
              value: 10
          - type: compare
            operator: eq
            left:
              type: field
              name: current_threat
            right:
              type: literal
              value: 16
  dependencies:
    - key: threshold_convention
      label: Quest Book I Threat convention
      object_id: core.quest_book.threat_threshold_monster
- id: core.quest.spider_queen_basement.secondary_setup
  name: The Basement — Secondary Objective setup
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 240
      printed_page: 238
      heading: The Secondary Objective
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If this card is drawn, the room about to be placed is occupied by Kraghul the Mighty. Roll as usual for any other Encounters and add those if applicable.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.basement
  fields:
    secondary_card_drawn:
      type: boolean
      role: input
      description: The Secondary Objective card has been drawn.
    kraghul_added_to_room:
      type: boolean
      role: output
      description: Kraghul occupies the room about to be placed.
    ordinary_encounter_roll_required:
      type: boolean
      role: output
      description: Roll normally for other encounters.
    ordinary_encounters_added_if_applicable:
      type: boolean
      role: output
      description: Add applicable encounters as well.
  effects:
    - type: set
      target: kraghul_added_to_room
      value:
        type: literal
        value: true
    - type: set
      target: ordinary_encounter_roll_required
      value:
        type: literal
        value: true
    - type: set
      target: ordinary_encounters_added_if_applicable
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: secondary_card_drawn
    right:
      type: literal
      value: true
  dependencies:
    - key: kraghul
      label: Kraghul the Mighty
      object_id: quest_actor.spider_queen.kraghul
