      role: input
      description: fight won
    initiative_tokens_to_add:
      type: number
      role: output
      description: initiative tokens to add
      integer: true
    tomb_guardians_to_add:
      type: number
      role: output
      description: tomb guardians to add
      integer: true
    guardian_placement:
      type: string
      role: output
      description: guardian placement
  effects:
    - type: set
      target: initiative_tokens_to_add
      value:
        type: literal
        value: 2
    - type: set
      target: tomb_guardians_to_add
      value:
        type: literal
        value: 2
    - type: set
      target: guardian_placement
      value:
        type: literal
        value: on top of the small statues flanking the hall
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ancient_tiles_available
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: initiative_bag_reload_number
        right:
          type: literal
          value: 5
      - type: compare
        operator: eq
        left:
          type: field
          name: fight_won
        right:
          type: literal
          value: false
