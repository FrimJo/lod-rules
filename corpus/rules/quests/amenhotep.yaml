- id: core.quest.amenhotep.statues_dormant
  name: Halls of Amenhotep — early victory
  section_id: section.quest_book_i.quests_into_the_ancient_lands.halls_of_amenhotep
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 270
      printed_page: 268
      heading: Halls of Amenhotep — early victory
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the party somehow manages to win the fight before the fifth initiative-bag reload,
    the statues remain dormant.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.amenhotep
  fields:
    fight_won:
      type: boolean
      role: input
      description: fight won
    initiative_bag_reload_number:
      type: number
      role: input
      description: initiative bag reload number
      integer: true
    statues_remain_dormant:
      type: boolean
      role: output
      description: statues remain dormant
    tomb_guardians_to_add:
      type: number
      role: output
      description: tomb guardians to add
      integer: true
  effects:
    - type: set
      target: statues_remain_dormant
      value:
        type: literal
        value: true
    - type: set
      target: tomb_guardians_to_add
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: fight_won
        right:
          type: literal
          value: true
      - type: compare
        operator: lt
        left:
          type: field
          name: initiative_bag_reload_number
        right:
          type: literal
          value: 5
- id: core.quest.amenhotep.standard_statue_square
  name: Halls of Amenhotep — vacated Standard statue squares
  section_id: section.quest_book_i.quests_into_the_ancient_lands.halls_of_amenhotep
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 270
      printed_page: 268
      heading: Halls of Amenhotep — vacated Standard statue squares
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once they move away from that square, treat the squares with statues as open.
  type: scenario_rule
  scope: quest
  quest_id: quest.ancient_lands.amenhotep
  fields:
    ancient_tiles_available:
      type: boolean
      role: input
      description: ancient tiles available
    guardian_has_moved_from_statue_square:
      type: boolean
      role: input
      description: guardian has moved from statue square
    vacated_statue_square_is_open:
      type: boolean
      role: output
      description: vacated statue square is open
  effects:
    - type: set
      target: vacated_statue_square_is_open
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ancient_tiles_available
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: guardian_has_moved_from_statue_square
        right:
          type: literal
          value: true
