- id: core.quest.slaying_fiend.molgor
  name: Molgor — equipment and named abilities
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_2_slaying_the_fiend
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 256
      printed_page: 254
      heading: Molgor — equipment and named abilities
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Molgor is a huge Minotaur, armed with a Greataxe and Armour 2. He has the Frenzy and
    Ferocious Charge Rule.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.slaying_fiend
  fields:
    species:
      type: string
      role: output
      description: species
    weapon:
      type: string
      role: output
      description: weapon
    armour:
      type: number
      role: output
      description: armour
      integer: true
    frenzy:
      type: boolean
      role: output
      description: frenzy
    ferocious_charge:
      type: boolean
      role: output
      description: ferocious charge
  effects:
    - type: set
      target: species
      value:
        type: literal
        value: Minotaur
    - type: set
      target: weapon
      value:
        type: literal
        value: Greataxe
    - type: set
      target: armour
      value:
        type: literal
        value: 2
    - type: set
      target: frenzy
      value:
        type: literal
        value: true
    - type: set
      target: ferocious_charge
      value:
        type: literal
        value: true
  entity_id: quest_actor.chamber_of_reverence.molgor
  dependencies:
    - key: greataxe
      label: Greataxe
      object_id: equipment.weapon.greataxe
    - key: frenzy
      label: Frenzy (existing hero perk; quest does not specify equivalence)
      object_id: perk.frenzy
    - key: ferocious_charge
      label: Ferocious Charge — named ability; definition unavailable
  unresolved_references:
    - Ferocious Charge Rule is named without a definition. Frenzy is also an existing hero perk, but
      the quest does not establish whether its hero activation costs and restrictions apply to
      Molgor.
- id: core.quest.slaying_fiend.prior_wounds_1
  name: Molgor — prior wounds result 1
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_2_slaying_the_fiend
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 256
      printed_page: 254
      heading: Molgor — prior wounds result 1
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: On 1d6 result 1, subtract 2d6 wounds from the initial 45 HP before the fight begins.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.slaying_fiend
  fields:
    wound_table_roll:
      type: number
      role: input
      description: wound table roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    prior_wounds:
      type: number
      role: input
      description: Supplied result of the selected wound dice, or fixed 1 on result 6.
      integer: true
      dice:
        count: 2
        sides: 6
      minimum: 2
      maximum: 12
    molgor_starting_hp:
      type: number
      role: output
      description: molgor starting hp
      integer: true
  effects:
    - type: set
      target: molgor_starting_hp
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: literal
            value: 45
          - type: field
            name: prior_wounds
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: wound_table_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: gte
        left:
          type: field
          name: prior_wounds
        right:
          type: literal
          value: 2
      - type: compare
        operator: lte
        left:
          type: field
          name: prior_wounds
        right:
          type: literal
          value: 12
