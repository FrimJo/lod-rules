- id: core.quest.slaying_fiend.placement
  name: Slaying the Fiend — placement
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_2_slaying_the_fiend
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 256
      printed_page: 254
      heading: Slaying the Fiend — placement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Place the heroes 1d3 squares from the door on the short side of the room. Place Molgor
    1d6 squares from the idol toward the heroes.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.slaying_fiend
  fields:
    hero_placement_roll:
      type: number
      role: input
      description: hero placement roll
      integer: true
      minimum: 1
      maximum: 3
      dice:
        count: 1
        sides: 3
    molgor_placement_roll:
      type: number
      role: input
      description: molgor placement roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    hero_distance_from_door:
      type: number
      role: output
      description: hero distance from door
      integer: true
    molgor_distance_from_idol:
      type: number
      role: output
      description: molgor distance from idol
      integer: true
    hero_entry:
      type: string
      role: output
      description: hero entry
    molgor_direction:
      type: string
      role: output
      description: molgor direction
    idol_position:
      type: string
      role: output
      description: idol position
  effects:
    - type: set
      target: hero_distance_from_door
      value:
        type: field
        name: hero_placement_roll
    - type: set
      target: molgor_distance_from_idol
      value:
        type: field
        name: molgor_placement_roll
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side
    - type: set
      target: molgor_direction
      value:
        type: literal
        value: toward the heroes
    - type: set
      target: idol_position
      value:
        type: literal
        value: far end of the room
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: hero_placement_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: hero_placement_roll
        right:
          type: literal
          value: 3
      - type: compare
        operator: gte
        left:
          type: field
          name: molgor_placement_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: molgor_placement_roll
        right:
          type: literal
          value: 6
- id: core.quest.slaying_fiend.aftermath
  name: Slaying the Fiend — aftermath
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_2_slaying_the_fiend
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 256
      printed_page: 254
      heading: Slaying the Fiend — aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Once the fiend is down, heroes find a pile of gold and two objective chests (Unlocked,
    no traps. Just roll on the Treasure Tables).
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.slaying_fiend
  fields:
    molgor_defeated:
      type: boolean
      role: input
      description: molgor defeated
    gold_pile_found:
      type: boolean
      role: output
      description: gold pile found
    objective_chests:
      type: number
      role: output
      description: objective chests
      integer: true
    chests_locked:
      type: boolean
      role: output
      description: chests locked
    chests_trapped:
      type: boolean
      role: output
      description: chests trapped
    treasure_tables_required:
      type: boolean
      role: output
      description: treasure tables required
  effects:
    - type: set
      target: gold_pile_found
      value:
        type: literal
        value: true
    - type: set
      target: objective_chests
      value:
        type: literal
        value: 2
    - type: set
      target: chests_locked
      value:
        type: literal
        value: false
    - type: set
      target: chests_trapped
      value:
        type: literal
        value: false
    - type: set
      target: treasure_tables_required
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: molgor_defeated
    right:
      type: literal
      value: true
  issues:
    - issue.quest.molgor_gold_quantity
