      locator:
        paragraph: The Objective Room, Setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: He is busy performing the ritual, and is so occupied with this, that he does not even notice the ongoing battle, even if attacked.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
