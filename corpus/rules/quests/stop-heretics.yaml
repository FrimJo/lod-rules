- id: core.quest.stop_heretics.setup
  name: Stop the Heretics — location, tiles, reward and objective
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: 'Quest 1: Stop the Heretics'
      locator:
        paragraph: introduction; Quest Location; Number of Tiles; Reward
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Enter the dungeon and slay the heretic conjurer before it is too late! ... Quest Location: Random. ... Number of Tiles: 6 corridors, 6 rooms. Reward: 250 c per hero.'
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
    objective:
      type: string
      role: output
      description: objective
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Random
    - type: set
      target: corridors
      value:
        type: literal
        value: 6
    - type: set
      target: rooms
      value:
        type: literal
        value: 6
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 250
    - type: set
      target: objective
      value:
        type: literal
        value: slay the heretic conjurer before the ritual summons Demons
  uses_tables:
    - table.quest.stop_heretics.threat
    - table.quest.stop_heretics.encounters
    - table.quest.stop_heretics.demons
- id: core.quest.stop_heretics.threshold
  name: Quest Threat 10
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: Special Rules
      locator:
        paragraph: 'Quest 1: Stop the Heretics, run-in'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: 'Special Rules: When the Threat Level reaches 10, a Wandering Monster appears regardless of the Scenario die result.'
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before this change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: A Wandering Monster appears.
    scenario_result_ignored:
      type: boolean
      role: output
      description: Ignore Scenario result for this trigger.
    threat_reduction_on_placement:
      type: number
      role: output
      description: The Threat Level is not decreased when the Wandering Monster is placed.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 10
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 10
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
- id: core.quest.stop_heretics.objective_setup
  name: Stop the Heretics — Objective Room setup
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: The Objective Room
      locator:
        paragraph: 'Quest 1: Stop the Heretics, The Objective Room'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: Setup
      locator:
        paragraph: The Objective Room, Setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The party enters the room on the short side opposite the altar. ... apparently protecting the caster who is busy performing his ritual at the altar on the dais at the far end of the room. ... Roll 2 times on the Encounter Table to determine how many guards stand on the heroes side of the river. Place these as close to the lava river as possible. On the other side of the river, by the altar, stands a Magic User from the encountered race. Randomise between those available on the entire encounter list.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    hero_entry:
      type: string
      role: output
      description: hero entry
    guard_encounter_rolls:
      type: number
      role: output
      description: guard encounter rolls
      integer: true
    guards_side:
      type: string
      role: output
      description: guards side
    guard_placement:
      type: string
      role: output
      description: guard placement
    caster_side:
      type: string
      role: output
      description: caster side
    caster_position:
      type: string
      role: output
      description: caster position
    caster_kind:
      type: string
      role: output
      description: caster kind
    caster_selection:
      type: string
      role: output
      description: caster selection
  effects:
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side opposite the altar
    - type: set
      target: guard_encounter_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: guards_side
      value:
        type: literal
        value: heroes’ side of river
    - type: set
      target: guard_placement
      value:
        type: literal
        value: as close to the lava river as possible
    - type: set
      target: caster_side
      value:
        type: literal
        value: other side of river
    - type: set
      target: caster_position
      value:
        type: literal
        value: by the altar on the dais at the far end
    - type: set
      target: caster_kind
      value:
        type: literal
        value: Magic User from encountered race
    - type: set
      target: caster_selection
      value:
        type: literal
        value: randomise among those available on the entire encounter list
  unresolved_references:
    - Standard encounter entries, Magic Users and enemy statistics are unavailable; supplied encounter outcomes are required.
- id: core.quest.stop_heretics.caster_occupied
  name: Stop the Heretics — caster occupied
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
