- id: core.quest.stop_heretics.deadline
  name: Stop the Heretics — ritual deadline
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: Special Rules
      locator:
        paragraph: The Objective Room, Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The heroes have 10 turns to kill the caster, or the Demons will be summoned. If the ritual succeeds, the Spellcaster will collapse from the exertion, and be out of the battle.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    turn_limit:
      type: number
      role: output
      description: turn limit
      integer: true
    deadline_goal:
      type: string
      role: output
      description: deadline goal
    successful_ritual_caster_out_of_battle:
      type: boolean
      role: output
      description: successful ritual caster out of battle
  effects:
    - type: set
      target: turn_limit
      value:
        type: literal
        value: 10
    - type: set
      target: deadline_goal
      value:
        type: literal
        value: kill the caster
    - type: set
      target: successful_ritual_caster_out_of_battle
      value:
        type: literal
        value: true
  unresolved_references:
    - The source does not specify the exact turn phase of the ten-turn deadline. Supply whether the ritual completed instead of inventing a start/end-of-turn convention.
  issues:
    - issue.quest.heretics_deadline_phase
- id: core.quest.stop_heretics.ritual_completed
  name: Stop the Heretics — ritual succeeds
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 244
      printed_page: 242
      heading: Special Rules
      locator:
        paragraph: The Objective Room, Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the ritual succeeds, the Spellcaster will collapse from the exertion, and be out of the battle. Roll on the table to see what emerges and place these on random squares along the river as they climb out of the lava.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    ritual_succeeded:
      type: boolean
      role: input
      description: Supplied source ritual outcome.
    caster_collapses:
      type: boolean
      role: output
      description: Exhaustion collapse.
    caster_out_of_battle:
      type: boolean
      role: output
      description: Caster is out of battle.
    demon_table_roll_required:
      type: boolean
      role: output
      description: Roll the Demon table.
    demon_placement:
      type: string
      role: output
      description: Random river squares.
  effects:
    - type: set
      target: caster_collapses
      value:
        type: literal
        value: true
    - type: set
      target: caster_out_of_battle
      value:
        type: literal
        value: true
    - type: set
      target: demon_table_roll_required
      value:
        type: literal
        value: true
    - type: set
      target: demon_placement
      value:
        type: literal
        value: random squares along the river
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ritual_succeeded
    right:
      type: literal
      value: true
  uses_tables:
    - table.quest.stop_heretics.demons
  issues:
    - issue.quest.heretics_deadline_phase
