- id: core.quest.stop_heretics.half_reward
  name: Stop the Heretics — half reward
  section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 245
      printed_page: 243
      heading: Stop the Heretics — half reward
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If heroes fail to kill the Spellcaster before the portal opens they receive only half
    the promised reward, as the portal remains open and more Demons can pour through.
  type: scenario_rule
  scope: quest
  quest_id: quest.lava_river.stop_heretics
  fields:
    all_objective_creatures_defeated:
      type: boolean
      role: input
      description: All Objective Room creatures defeated.
    caster_killed_before_portal:
      type: boolean
      role: input
      description: Caster killed before portal opened.
    reward_per_hero:
      type: number
      role: output
      description: Half250c,125c per hero.
      integer: true
      minimum: 0
    portal_open:
      type: boolean
      role: output
      description: Portal remains open.
    more_demons_can_pour_through:
      type: boolean
      role: output
      description: Narrative continuing risk, no unstated spawn timer.
  effects:
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 125
    - type: set
      target: portal_open
      value:
        type: literal
        value: true
    - type: set
      target: more_demons_can_pour_through
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: all_objective_creatures_defeated
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: caster_killed_before_portal
        right:
          type: literal
          value: false
