  source_text:
    In Silver City the High Wizard recognises Ancient Lands symbols on the dagger and takes
    it away for investigation. At dinner the Jarl presents each hero with a box containing 1000 c.
    High King Logan III requests enlistment into the League of Dungeoneers and Royal expeditions
    into the Ancient Lands.
