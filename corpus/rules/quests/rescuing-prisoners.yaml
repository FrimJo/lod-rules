- id: core.quest.rescuing_prisoners.reward_arithmetic
  name: Rescuing the Prisoners — supplied reward interpretation
  section_id: section.quest_book_i.the_bandits_hideout.quest_1_rescuing_the_prisoners
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 250
      printed_page: 248
      heading: Rescuing the Prisoners — supplied reward interpretation
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Reward base conflicts between250heading and300aftermath. Expose raw arithmetic using a
    supplied source base; do not silently choose a base,negative-value floor or a debt consequence.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.rescuing_prisoners
  fields:
    objective_battle_over:
      type: boolean
      role: input
      description: Battle over.
    survivor_escort_completed:
      type: boolean
      role: input
      description: Surviving prisoners escorted to city.
    selected_reward_base:
      type: number
      role: input
      description: Supplied choice of conflicting source amounts250or300.
      integer: true
      minimum: 0
    dead_prisoners:
      type: number
      role: input
      description: Dead prisoners.
      integer: true
      minimum: 0
      maximum: 10
    reward_arithmetic_before_uncertain_floor:
      type: number
      role: output
      integer: true
      description: Raw source arithmetic; negative result does not invent a debt or payout.
    reward_case:
      type: string
      role: input
      description: all_alive or dead_prisoners, guarded against the count.
  effects:
    - type: choice
      selection: reward_case
      options:
        - id: all_alive
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: dead_prisoners
            right:
              type: literal
              value: 0
          effects:
            - type: set
              target: reward_arithmetic_before_uncertain_floor
              value:
                type: sum
                values:
                  - type: field
                    name: selected_reward_base
                  - type: literal
                    value: 100
        - id: dead_prisoners
          when:
            type: compare
            operator: gt
            left:
              type: field
              name: dead_prisoners
            right:
              type: literal
              value: 0
          effects:
            - type: set
              target: reward_arithmetic_before_uncertain_floor
              value:
                type: arithmetic
                operator: subtract
                values:
                  - type: field
                    name: selected_reward_base
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: field
                        name: dead_prisoners
                      - type: literal
                        value: 50
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: objective_battle_over
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: survivor_escort_completed
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_reward_base
            right:
              type: literal
              value: 250
          - type: compare
            operator: eq
            left:
              type: field
              name: selected_reward_base
            right:
              type: literal
              value: 300
  issues:
    - issue.quest.prisoner_reward_conflict
