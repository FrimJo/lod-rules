- id: core.quest.rescuing_prisoners.threshold
  name: Quest Threat 14
  section_id: section.quest_book_i.the_bandits_hideout.quest_1_rescuing_the_prisoners
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 249
      printed_page: 247
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: When Threat reaches 14, a Wandering Monster appears regardless of the Scenario die
    result. The introduction defines this as an increase to the threshold.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.rescuing_prisoners
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before this change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Place special quest monster.
    scenario_result_ignored:
      type: boolean
      role: output
      description: Ignore Scenario result for this trigger.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No reduction for special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 14
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 14
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
- id: core.quest.rescuing_prisoners.encounter_briggo
  name: Rescuing the Prisoners — briggo encounter
  section_id: section.quest_book_i.the_bandits_hideout.quest_1_rescuing_the_prisoners
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 249
      printed_page: 247
      heading: Rescuing the Prisoners — briggo encounter
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Unmodified Encounter result17–18 replaces the table result with Briggo, one of
    Golfrid’s ogre bodyguards.
  type: scenario_rule
  scope: quest
  quest_id: quest.bandits_hideout.rescuing_prisoners
  fields:
    unmodified_encounter_roll:
      type: number
      role: input
      description: Unmodified Encounter roll, before modifiers.
      integer: true
      minimum: 1
      maximum: 100
    encounter_enemy:
      type: string
      role: output
      description: Named ogre.
    ignore_ordinary_encounter_result:
      type: boolean
      role: output
      description: Replace instead of add.
  effects:
    - type: set
      target: encounter_enemy
      value:
        type: literal
        value: Briggo
    - type: set
      target: ignore_ordinary_encounter_result
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: unmodified_encounter_roll
        right:
          type: literal
          value: 17
      - type: compare
        operator: lte
        left:
          type: field
          name: unmodified_encounter_roll
        right:
          type: literal
          value: 18
  dependencies:
    - key: ogre
      label: briggo
      object_id: quest_actor.bandits_hideout.briggo
  unresolved_references:
    - No repeat-encounter or post-death replacement instruction is printed for these named ogres; do
      not invent respawning or a once-only limit.
