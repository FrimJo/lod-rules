- id: core.quest.ancient_lands.outpost_membership
  name: Ancient Lands — Outpost requirement
  section_id: section.quest_book_i.quests_into_the_ancient_lands
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 263
      printed_page: 261
      heading: Ancient Lands — Outpost requirement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    To enter these lands via the Outpost, you must be a member of the League of Dungeoneers
    (Play the first campaign to become this).
  type: constraint
  scope: quest
  fields:
    via_outpost:
      type: boolean
      role: input
      description: via outpost
    league_membership_required:
      type: boolean
      role: output
      description: league membership required
  effects:
    - type: set
      target: league_membership_required
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: via_outpost
    right:
      type: literal
      value: true
  dependencies:
    - key: campaign
      label: 'First campaign: The Dead Rising'
      object_id: quest.dead_rising.campaign
    - key: outpost
      label: The Outpost
      object_id: settlement.outpost
