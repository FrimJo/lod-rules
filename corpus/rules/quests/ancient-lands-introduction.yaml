- id: core.quest.ancient_lands.travel_costs
  name: Ancient Lands — travel reminder
  section_id: section.quest_book_i.quests_into_the_ancient_lands
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 263
      printed_page: 261
      heading: Ancient Lands — travel reminder
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: As described in the main rules, each hex requires 2 Movement Points and each day
    requires 2 Rations to accommodate extra water supplies. A camel is preferred because it reduces
    travel time.
  type: constraint
  scope: quest
  fields:
    travelling_in_ancient_lands:
      type: boolean
      role: input
      description: travelling in ancient lands
    movement_points_per_hex:
      type: number
      role: output
      description: movement points per hex
      integer: true
    rations_per_day_printed:
      type: number
      role: output
      description: rations per day printed
      integer: true
    camel_reduces_travel_time:
      type: boolean
      role: output
      description: camel reduces travel time
  effects:
    - type: set
      target: movement_points_per_hex
      value:
        type: literal
        value: 2
    - type: set
      target: rations_per_day_printed
      value:
        type: literal
        value: 2
    - type: set
      target: camel_reduces_travel_time
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: travelling_in_ancient_lands
    right:
      type: literal
      value: true
  dependencies:
    - key: movement
      label: Main travel movement accounting
      object_id: procedure.travel_daily_movement
    - key: rations
      label: Main food and rest accounting; supplies recipient scope
      object_id: procedure.travel_food_and_rest
    - key: camel
      label: Camel travel advantages
      object_id: character.equipment.transport.camel.travel
- id: core.quest.ancient_lands.travel_event
  name: Ancient Lands — Travel Event
  section_id: section.quest_book_i.quests_into_the_ancient_lands
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 263
      printed_page: 261
      heading: Ancient Lands — Travel Event
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A Travel Event die roll of 10-12 results in an Event. Use the Desert Event Cards.
  type: constraint
  scope: quest
  fields:
    travelling_in_ancient_lands:
      type: boolean
      role: input
      description: travelling in ancient lands
    travel_event_roll:
      type: number
      role: input
      description: travel event roll
      integer: true
      minimum: 1
      maximum: 12
    travel_event_required:
      type: boolean
      role: output
      description: travel event required
    event_cards:
      type: string
      role: output
      description: event cards
  effects:
    - type: set
      target: travel_event_required
      value:
        type: literal
        value: true
    - type: set
      target: event_cards
      value:
        type: literal
        value: Desert Event Cards
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: travelling_in_ancient_lands
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: travel_event_roll
        right:
          type: literal
          value: 10
      - type: compare
        operator: lte
        left:
          type: field
          name: travel_event_roll
        right:
          type: literal
          value: 12
  dependencies:
    - key: event
      label: Travel Event accounting, with supplied Desert Event Card
      object_id: procedure.travel_event_check
