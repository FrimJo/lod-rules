- id: core.quest.closing_portal.setup
  name: Closing the Portal — setup
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'The wizard provides the team with a scroll which could be cast by one with very limited skills in the Arcane Arts. Quest Location: In Silver City. Number of Tiles: 8 corridors, 8 rooms. Reward: 300 c per hero.'
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    advertised_reward_per_hero:
      type: number
      role: output
      description: advertised reward per hero
      integer: true
    ritual_scroll_supplied:
      type: boolean
      role: output
      description: ritual scroll supplied
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: Silver City
    - type: set
      target: corridors
      value:
        type: literal
        value: 8
    - type: set
      target: rooms
      value:
        type: literal
        value: 8
    - type: set
      target: advertised_reward_per_hero
      value:
        type: literal
        value: 300
    - type: set
      target: ritual_scroll_supplied
      value:
        type: literal
        value: true
  dependencies:
    - key: scroll
      label: Supplied ritual scroll
      object_id: equipment.quest.portal_ritual_scroll
- id: core.quest.closing_portal.encounter_replacement
  name: Closing the Portal — encounter replacement
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — encounter replacement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: All encounter results of even 10s (10, 20, 30...) result in an encounter with random demons.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    encounter_result:
      type: number
      role: input
      description: encounter result
      integer: true
      minimum: 1
    demon_encounter:
      type: boolean
      role: output
      description: demon encounter
    demon_table_rolls:
      type: number
      role: output
      description: demon table rolls
      integer: true
  effects:
    - type: set
      target: demon_encounter
      value:
        type: literal
        value: true
    - type: set
      target: demon_table_rolls
      value:
        type: literal
        value: 1
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: encounter_result
        right:
          type: literal
          value: 10
      - type: compare
        operator: eq
        left:
          type: field
          name: encounter_result
        right:
          type: arithmetic
          operator: multiply
          values:
            - type: arithmetic
              operator: floor
              values:
                - type: arithmetic
                  operator: divide
                  values:
                    - type: field
                      name: encounter_result
                    - type: literal
                      value: 10
            - type: literal
              value: 10
  dependencies:
    - key: demons
      label: Special rules demon Encounter Table
      object_id: table.quest.closing_portal.demons
- id: core.quest.closing_portal.objective_setup
  name: Closing the Portal — Objective Room setup
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — Objective Room setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In the centre of the room over a large summoning circle is a shimmering bubble. Roll twice on the special rules Encounter Table and place demons randomly in the room. Heroes enter centred along the long side.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    initial_demon_table_rolls:
      type: number
      role: output
      description: initial demon table rolls
      integer: true
    initial_demon_placement:
      type: string
      role: output
      description: initial demon placement
    hero_entry:
      type: string
      role: output
      description: hero entry
    portal_position:
      type: string
      role: output
      description: portal position
  effects:
    - type: set
      target: initial_demon_table_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: initial_demon_placement
      value:
        type: literal
        value: randomly in the room
    - type: set
      target: hero_entry
      value:
        type: literal
        value: centred along the long side
    - type: set
      target: portal_position
      value:
        type: literal
        value: centre of the room over a large summoning circle
  dependencies:
    - key: demons
      label: Initial demon groups, using printed quantities
      object_id: table.quest.closing_portal.demons
- id: core.quest.closing_portal.demon_type_1
  name: Closing the Portal — demon type 1
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — demon type 1
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Demon table 1–4: 1d6 Lesser Plague Demons, no weapon, Armour 0.'
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    demon_type_roll:
      type: number
      role: input
      description: demon type roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    demon_type:
      type: string
      role: output
      description: demon type
    demon_weapon:
      type: string
      role: output
      description: demon weapon
    demon_armour:
      type: number
      role: output
      description: demon armour
      integer: true
  effects:
    - type: set
      target: demon_type
      value:
        type: literal
        value: Lesser Plague Demons
    - type: set
      target: demon_weapon
      value:
        type: literal
        value: no weapon
    - type: set
      target: demon_armour
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: demon_type_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: demon_type_roll
        right:
          type: literal
          value: 4
  dependencies:
    - key: statistics
      label: Demon statistics not printed in this quest; supplied external outcome required
  unresolved_references:
    - Lesser Plague Demons, Blood Demons and Plague Demons are named without statistics in this quest. Cursed Weapons are named without local effects.
