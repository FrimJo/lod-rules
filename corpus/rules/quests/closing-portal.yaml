- id: core.quest.closing_portal.ritual_start
  name: Closing the Portal — reading the scroll
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — reading the scroll
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Reading can be done from anywhere in the room. Roll 1d6+1 for duration. They must hold still while reading it.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    hero_in_objective_room:
      type: boolean
      role: input
      description: hero in objective room
    ritual_eligibility_supplied:
      type: boolean
      role: input
      description: Supplied unresolved eligibility judgment; very limited Arcane Arts skills have no printed threshold.
    reader_stationary:
      type: boolean
      role: input
      description: reader stationary
    duration_die:
      type: number
      role: input
      description: duration die
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    reading_allowed:
      type: boolean
      role: output
      description: reading allowed
    required_turns:
      type: number
      role: output
      description: required turns
      integer: true
    reading_position:
      type: string
      role: output
      description: reading position
    must_remain_stationary:
      type: boolean
      role: output
      description: must remain stationary
  effects:
    - type: set
      target: reading_allowed
      value:
        type: literal
        value: true
    - type: set
      target: required_turns
      value:
        type: sum
        values:
          - type: field
            name: duration_die
          - type: literal
            value: 1
    - type: set
      target: reading_position
      value:
        type: literal
        value: anywhere in the room
    - type: set
      target: must_remain_stationary
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: hero_in_objective_room
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: ritual_eligibility_supplied
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reader_stationary
        right:
          type: literal
          value: true
  issues:
    - issue.quest.portal_ritual_boundaries
- id: core.quest.closing_portal.ritual_interruption
  name: Closing the Portal — interruption and restart
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_3_closing_the_portal
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 257
      printed_page: 255
      heading: Closing the Portal — interruption and restart
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the character is interrupted in any way (wounded, dodges, or parries), they have to start over. They must hold still while reading.
  type: scenario_rule
  scope: quest
  quest_id: quest.chamber_of_reverence.closing_portal
  fields:
    reading_active:
      type: boolean
      role: input
      description: reading active
    interrupted_other_way:
      type: boolean
      role: input
      description: interrupted other way
    reader_wounded:
      type: boolean
      role: input
      description: reader wounded
    reader_dodged:
      type: boolean
      role: input
      description: reader dodged
    reader_parried:
      type: boolean
      role: input
      description: reader parried
    reader_stationary:
      type: boolean
      role: input
      description: reader stationary
    restart_required:
      type: boolean
      role: output
      description: restart required
    reading_progress_turns:
      type: number
      role: output
      description: reading progress turns
      integer: true
  effects:
    - type: set
      target: restart_required
      value:
        type: literal
        value: true
    - type: set
      target: reading_progress_turns
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: reading_active
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: interrupted_other_way
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: reader_wounded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: reader_dodged
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: reader_parried
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: reader_stationary
            right:
              type: literal
              value: false
  issues:
    - issue.quest.portal_ritual_boundaries
