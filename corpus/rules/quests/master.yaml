  status: extracted
  confidence: high
  source_text:
    On either side of him are two lumbering Zombie Ogres, staring mindlessly into the dark.
    ... The heroes enter along a short side. Place the two Ogres in the far end of the room, and the
    Master in between them. The heroes remain where they were when they opened the door. The heroes
    go first. There are 6 tombs in the room, all of which can be looted. This looting must be done
    on the table as usual.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
