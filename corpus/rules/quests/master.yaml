      integer: true
    ogre_placement:
      type: string
      role: output
      description: ogre placement
    master_placement:
      type: string
      role: output
      description: master placement
    first_to_move:
      type: string
      role: output
      description: first to move
    lootable_tombs:
      type: number
      role: output
      description: lootable tombs
      integer: true
    tomb_looting_on_table:
      type: boolean
      role: output
      description: tomb looting on table
  effects:
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side
    - type: set
      target: hero_placement
      value:
        type: literal
        value: remain where they were when opening the door
    - type: set
      target: zombie_ogres
      value:
        type: literal
        value: 2
    - type: set
      target: ogre_placement
      value:
        type: literal
        value: far end of the room
    - type: set
      target: master_placement
      value:
        type: literal
