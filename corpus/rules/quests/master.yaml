- id: core.quest.master.vanquisher_properties
  name: The Vanquisher — properties
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      section: 'Quest 6B: The Master'
      heading: The Vanquisher
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This sword has a pale blueish shine around a blade made of pure silver. There are runes
    inscribed along the blade from the hilt to the tip. This is without a doubt the handiwork of a
    dwarf. The blade is magical and inflicts +2 damage to all Undead creatures. It is in perfect
    condition. Apart from these special qualities and its condition of 8, it has the same stats as a
    standard longsword. It can be sold for 400 c.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    blade_material:
      type: string
      role: output
      description: blade material
    magical:
      type: boolean
      role: output
      description: magical
    initial_condition:
      type: number
      role: output
      description: initial condition
      integer: true
    condition_description:
      type: string
      role: output
      description: condition description
    standard_weapon:
      type: string
      role: output
      description: standard weapon
    sale_coins:
      type: number
      role: output
      description: sale coins
      integer: true
  effects:
    - type: set
      target: blade_material
      value:
        type: literal
        value: pure silver
    - type: set
      target: magical
      value:
        type: literal
        value: true
    - type: set
      target: initial_condition
      value:
        type: literal
        value: 8
    - type: set
      target: condition_description
      value:
        type: literal
        value: perfect condition
    - type: set
      target: standard_weapon
      value:
        type: literal
        value: longsword
    - type: set
      target: sale_coins
      value:
        type: literal
        value: 400
  entity_id: equipment.quest.vanquisher
  dependencies:
    - key: standard_longsword
      label: Standard longsword statistics
      object_id: equipment.weapon.longsword
