- id: core.quest.master.setup
  name: The Master — quest setup
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      heading: 'Quest 6B: The Master'
      locator:
        paragraph: Quest Location, Number of Tiles, Encounters, Objective Room
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'According to the map Imgrahil carried, this should be where they can locate the one he
    calls Master. ... Quest Location: White 39. Number of Tiles: 7 corridors, 7 rooms. Make sure R10
    is mixed in among the top 7 cards. ... Encounters: Undead. Objective Room: The Great Crypt.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    r10_in_top_seven_cards:
      type: boolean
      role: output
      description: R10 is mixed in among the top 7 cards.
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: White 39
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: r10_in_top_seven_cards
      value:
        type: literal
        value: true
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Great Crypt
