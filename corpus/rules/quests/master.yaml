    - type: set
      target: armour
      value:
        type: literal
        value: 1
    - type: set
      target: raise_dead_known
      value:
        type: literal
        value: true
    - type: set
      target: closecombat_spells
      value:
        type: literal
        value: 3
    - type: set
      target: ranged_spells
      value:
        type: literal
        value: 4
    - type: set
      target: xp
      value:
        type: literal
        value: 200
    - type: set
      target: treasure_table
      value:
        type: literal
        value: T4
  entity_id: quest_actor.dead_rising.master
  dependencies:
