- id: core.quest.master.setup
  name: The Master — quest setup
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      heading: The Master — quest setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Quest Location: White 39. Seven corridors and seven rooms. Make sure R10 is mixed in
    among the top seven cards. Encounters: Undead. Objective Room: The Great Crypt.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    r10_in_top_seven_cards:
      type: boolean
      role: output
      description: r10 in top seven cards
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: White 39
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: r10_in_top_seven_cards
      value:
        type: literal
        value: true
    - type: set
      target: encounters
      value:
        type: literal
        value: Undead
    - type: set
      target: objective_room
      value:
        type: literal
        value: The Great Crypt
- id: core.quest.master.scenario_event
  name: The Master — Scenario event
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      heading: The Master — Scenario event
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Scenario die triggers an event on 8 through 10.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    scenario_roll:
      type: number
      role: input
      description: Supplied Scenario die.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    event_triggered:
      type: boolean
      role: output
      description: Printed event trigger.
  effects:
    - type: set
      target: event_triggered
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: gte
    left:
      type: field
      name: scenario_roll
    right:
      type: literal
      value: 8
- id: core.quest.master.scenario_no_event
