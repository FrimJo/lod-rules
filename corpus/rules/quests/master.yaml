      role: output
      description: closecombat spells
      integer: true
    ranged_spells:
      type: number
      role: output
      description: ranged spells
      integer: true
    xp:
      type: number
      role: output
      description: xp
      integer: true
    treasure_table:
      type: string
      role: output
      description: treasure table
  effects:
    - type: set
      target: weapon
      value:
        type: literal
