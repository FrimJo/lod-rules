- id: core.quest.master.aftermath
  name: The Master — aftermath findings and return
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 236
      printed_page: 234
      heading: The Master — aftermath findings and return
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: As the Master falls, his body disappears. Find a Grimoire open to one spell and his
    dagger with strange engraved markings. Randomise which spell can be learned from the book. Take
    desired crypt findings and travel to Silver City.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    master_fallen:
      type: boolean
      role: input
      description: Printed aftermath trigger.
    master_body_disappears:
      type: boolean
      role: output
      description: Body disappears.
    grimoire_found:
      type: boolean
      role: output
      description: Found Grimoire.
    grimoire_spells:
      type: number
      role: output
      description: One revealed spell.
      integer: true
      minimum: 0
    spell_selection:
      type: string
      role: output
      description: Printed randomisation instruction; resolved outcome supplied.
    engraved_dagger_found:
      type: boolean
      role: output
      description: Found engraved dagger.
    next_destination:
      type: string
      role: output
      description: Return to Silver City.
  effects:
    - type: set
      target: master_body_disappears
      value:
        type: literal
        value: true
    - type: set
      target: grimoire_found
      value:
        type: literal
        value: true
    - type: set
      target: grimoire_spells
      value:
        type: literal
        value: 1
    - type: set
      target: spell_selection
      value:
        type: literal
        value: randomise which spell can be learned
    - type: set
      target: engraved_dagger_found
      value:
        type: literal
        value: true
    - type: set
      target: next_destination
      value:
        type: literal
        value: Silver City
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: master_fallen
    right:
      type: literal
      value: true
  dependencies:
    - key: learn_from_grimoire
      label: Learning a spell from a found Grimoire
      object_id: procedure.learn_spell
    - key: grimoire
      label: Master’s Grimoire
      object_id: equipment.quest.master_grimoire
    - key: dagger
      label: Master’s engraved dagger
      object_id: equipment.quest.master_engraved_dagger
    - key: campaign_aftermath
      label: Campaign aftermath in Silver City
      object_id: quest.dead_rising.campaign
  unresolved_references:
    - Randomise which spell you can learn from this book; this quest prints no selection table or
      distribution.
