- id: core.quest.master.aftermath
  name: The Master — aftermath findings and return
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 236
      printed_page: 234
      section: 'Quest 6B: The Master'
      heading: Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    As the Master falls, it is as if his body just disappears. Carefully poking through his
    robes with a sword verifies that he is truly gone, but a Grimoire is on the ground. It has
    fallen open to reveal one spell, and they also find his dagger, which is engraved with strange
    markings. (Randomise which spell you can learn from this book). Taking what they want from the
    crypt, the party heads back to the city. Travel to Silver City.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    master_fallen:
      type: boolean
      role: input
      description: Printed aftermath trigger.
    master_body_disappears:
      type: boolean
      role: output
      description: Body disappears.
    grimoire_found:
      type: boolean
      role: output
      description: Found Grimoire.
    grimoire_spells:
      type: number
      role: output
      description: One revealed spell.
      integer: true
      minimum: 0
    spell_selection:
      type: string
      role: output
      description: Printed randomisation instruction; resolved outcome supplied.
    engraved_dagger_found:
      type: boolean
      role: output
      description: Found engraved dagger.
    next_destination:
      type: string
      role: output
      description: Return to Silver City.
  effects:
    - type: set
      target: master_body_disappears
      value:
        type: literal
        value: true
    - type: set
      target: grimoire_found
      value:
        type: literal
        value: true
    - type: set
      target: grimoire_spells
      value:
        type: literal
