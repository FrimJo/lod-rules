- id: core.quest.master.harder_encounter
  name: The Master — sacrifice-path encounter selection
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      section: 'Quest 6B: The Master'
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If the heroes chose to stop the sacrifice, roll twice on the Encounter Table for every
    encounter, choosing the higher result.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    chose_to_stop_sacrifice:
      type: boolean
      role: input
      description: Choice of sacrifice path; does not require successful sacrifice prevention.
    first_roll:
      type: number
      role: input
      description: First supplied Encounter Table result for this encounter.
      integer: true
      minimum: 1
      maximum: 100
    second_roll:
      type: number
      role: input
      description: Second supplied Encounter Table result for this encounter.
      integer: true
      minimum: 1
      maximum: 100
    encounter_rolls_required:
      type: number
      role: output
      description: Two rolls per encounter.
      integer: true
      minimum: 0
    selected_encounter_roll:
      type: number
      role: output
      description: Higher of the two results.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: encounter_rolls_required
      value:
        type: literal
        value: 2
    - type: set
      target: selected_encounter_roll
      value:
        type: arithmetic
        operator: max
        values:
          - type: field
            name: first_roll
          - type: field
            name: second_roll
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: chose_to_stop_sacrifice
    right:
      type: literal
      value: true
  unresolved_references:
    - The Encounter Table die is not printed in this quest; both results are supplied.
