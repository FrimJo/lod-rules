- id: core.quest.master.objective_setup
  name: The Master — Objective Room setup
  section_id: section.quest_book_i.the_dead_rising.quest_6b_the_master
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 235
      printed_page: 233
      heading: The Master — Objective Room setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Heroes enter along a short side and remain where they were when opening the door. Place
    two Zombie Ogres at the far end and the Master between them. Heroes go first. All six tombs may
    be looted on the table as usual.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.master
  fields:
    hero_entry:
      type: string
      role: output
      description: hero entry
    hero_placement:
      type: string
      role: output
      description: hero placement
    zombie_ogres:
      type: number
      role: output
      description: zombie ogres
      integer: true
    ogre_placement:
      type: string
      role: output
      description: ogre placement
    master_placement:
      type: string
      role: output
      description: master placement
    first_to_move:
      type: string
      role: output
      description: first to move
    lootable_tombs:
      type: number
      role: output
      description: lootable tombs
      integer: true
    tomb_looting_on_table:
      type: boolean
      role: output
      description: tomb looting on table
  effects:
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side
    - type: set
      target: hero_placement
      value:
        type: literal
        value: remain where they were when opening the door
    - type: set
      target: zombie_ogres
      value:
        type: literal
        value: 2
    - type: set
      target: ogre_placement
      value:
        type: literal
        value: far end of the room
    - type: set
      target: master_placement
      value:
        type: literal
        value: between the two Ogres
    - type: set
      target: first_to_move
      value:
        type: literal
        value: heroes
    - type: set
      target: lootable_tombs
      value:
        type: literal
        value: 6
    - type: set
      target: tomb_looting_on_table
      value:
        type: literal
        value: true
  unresolved_references:
    - Zombie Ogre statistics are not printed in this quest.
