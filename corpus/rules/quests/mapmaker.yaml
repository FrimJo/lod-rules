      pdf_page: 276
      printed_page: 274
      heading: The Mapmaker — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'A market bulletin advertises a mapmaker seeking escort to the party’s next dungeon.
    Quest Location: same dungeon as the next quest. Reward: 500 c. Encounters: as defined by the
    main quest. Objective room: None.'
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mapmaker
  fields:
    location:
      type: string
      role: output
      description: location
    advertised_reward_coins:
      type: number
      role: output
      description: advertised reward coins
      integer: true
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
    - type: set
      target: location
      value:
        type: literal
        value: same dungeon as the next quest
    - type: set
      target: advertised_reward_coins
      value:
        type: literal
        value: 500
    - type: set
      target: encounters
      value:
        type: literal
        value: as defined by the main quest
    - type: set
      target: objective_room
      value:
        type: literal
        value: None
