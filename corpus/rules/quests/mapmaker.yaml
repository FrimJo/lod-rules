- id: core.quest.mapmaker.model_movement
  name: The Mapmaker — model and movement
  section_id: section.quest_book_i.side_quests.side_quest_3_the_mapmaker
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 276
      printed_page: 274
      heading: The Mapmaker — model and movement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Represent him with a model just like the heroes. Players may move him as they see fit.
    He always strives to be within 2 squares of a hero, as that makes him feel safe.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mapmaker
  fields:
    represented_by_model:
      type: boolean
      role: output
      description: represented by model
    players_control_movement:
      type: boolean
      role: output
      description: players control movement
    strives_to_be_within_squares_of_hero:
      type: number
      role: output
      description: strives to be within squares of hero
      integer: true
  effects:
    - type: set
      target: represented_by_model
      value:
        type: literal
        value: true
    - type: set
      target: players_control_movement
      value:
        type: literal
        value: true
    - type: set
      target: strives_to_be_within_squares_of_hero
      value:
        type: literal
        value: 2
- id: core.quest.mapmaker.restrictions
  name: The Mapmaker — combat restrictions
  section_id: section.quest_book_i.side_quests.side_quest_3_the_mapmaker
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 276
      printed_page: 274
      heading: The Mapmaker — combat restrictions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: He may not fight or interact with the enemy, although he may try to dodge as usual.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.mapmaker
  fields:
    may_fight:
      type: boolean
      role: output
      description: may fight
    may_interact_with_enemy:
      type: boolean
      role: output
      description: may interact with enemy
    may_try_dodge:
      type: boolean
      role: output
      description: may try dodge
  effects:
    - type: set
      target: may_fight
      value:
        type: literal
        value: false
    - type: set
      target: may_interact_with_enemy
      value:
        type: literal
        value: false
    - type: set
      target: may_try_dodge
      value:
        type: literal
        value: true
