- id: core.quest.slay_beast.win
  name: Slay the Beast — winning the bet
  section_id: section.quest_book_i.side_quests.side_quest_2_slay_the_beast
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 275
      printed_page: 273
      heading: Slay the Beast — winning the bet
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    After slaying the Beast heroes return to the tavern and put its decapitated head on the
    table. The challenger takes out a bag of coins. Accepted challenges win the bet or pay it upon
    return if they fail.
  type: scenario_rule
  scope: quest
  quest_id: quest.side.slay_beast
  fields:
    challenge_accepted:
      type: boolean
      role: input
      description: challenge accepted
    beast_slain:
      type: boolean
      role: input
      description: beast slain
    returned_to_tavern:
      type: boolean
      role: input
      description: returned to tavern
    beast_head_presented:
      type: boolean
      role: input
      description: beast head presented
    bet_coins:
      type: number
      role: input
      description: bet coins
      integer: true
    bet_winnings_coins:
      type: number
      role: output
      description: bet winnings coins
      integer: true
  effects:
    - type: set
      target: bet_winnings_coins
      value:
        type: field
        name: bet_coins
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: challenge_accepted
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: beast_slain
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: returned_to_tavern
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: beast_head_presented
        right:
          type: literal
          value: true
  issues: &a1
    - issue.quest.slay_beast_boundaries
