- id: core.quest_book.random_quests.selection_order
  name: Random Quests — selection order and repeatability
  section_id: section.quest_book_i.random_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 243
      printed_page: 241
      heading: Random Quests — selection order and repeatability
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    First roll the objective-room table, then consult that chapter and roll which quest to
    embark upon. These quests may be played over and over, as dungeon layouts shift and difficulty
    increases as heroes gain levels.
  type: modifier
  scope: quest
  fields:
    first_select_objective_room:
      type: boolean
      role: output
      description: first select objective room
    then_roll_quest_in_corresponding_chapter:
      type: boolean
      role: output
      description: then roll quest in corresponding chapter
    quests_repeatable:
      type: boolean
      role: output
      description: quests repeatable
    layouts_shift:
      type: boolean
      role: output
      description: layouts shift
    difficulty_increases_with_hero_levels:
      type: boolean
      role: output
      description: difficulty increases with hero levels
  effects:
    - type: set
      target: first_select_objective_room
      value:
        type: literal
        value: true
    - type: set
      target: then_roll_quest_in_corresponding_chapter
      value:
        type: literal
        value: true
    - type: set
      target: quests_repeatable
      value:
        type: literal
        value: true
    - type: set
      target: layouts_shift
      value:
        type: literal
        value: true
    - type: set
      target: difficulty_increases_with_hero_levels
      value:
        type: literal
        value: true
  uses_tables:
    - table.quest.random_quests.objective_room
- id: core.quest_book.random_quests.result_1
  name: Random Quests — The Lava River
  section_id: section.quest_book_i.random_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 243
      printed_page: 241
      heading: Random Quests — The Lava River
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: '1d6 result 1: The Lava River.'
  type: modifier
  scope: quest
  fields:
    objective_room_roll:
      type: number
      role: input
      description: Supplied1d6 objective-room result.
      integer: true
      minimum: 1
      maximum: 6
    selected_objective_room:
      type: string
      role: output
      description: Selected room.
    roll_quest_in_selected_chapter:
      type: boolean
      role: output
      description: Then roll which quest in that chapter.
  effects:
    - type: set
      target: selected_objective_room
      value:
        type: literal
        value: The Lava River
    - type: set
      target: roll_quest_in_selected_chapter
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: objective_room_roll
    right:
      type: literal
      value: 1
  see_also:
    - section.quest_book_i.the_lava_river
  uses_tables:
    - table.quest.random_quests.objective_room
