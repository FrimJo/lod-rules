- id: core.quest.highwaymen.aftermath_loot
  name: Highwaymen — aftermath findings
  section_id: section.quest_book_i.the_dead_rising.quest_3_highwaymen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 229
      printed_page: 227
      heading: Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Taking a look around the room the party notices two chests filled with loot from the
    bandits’ plunder. There is also a thick ledger, detailing the plunder taken at every raid.
    Curiously, the last raids have listed the wagons’ crew as plunder as well.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.highwaymen
  fields:
    aftermath_chests:
      type: number
      role: output
      description: aftermath chests
      integer: true
    aftermath_ledger:
      type: boolean
      role: output
      description: aftermath ledger
    ledger_lists_wagon_crews_as_plunder:
      type: boolean
      role: output
      description: ledger lists wagon crews as plunder
  effects:
    - type: set
      target: aftermath_chests
      value:
        type: literal
        value: 2
    - type: set
      target: aftermath_ledger
      value:
        type: literal
        value: true
    - type: set
      target: ledger_lists_wagon_crews_as_plunder
      value:
        type: literal
        value: true
  dependencies:
    - key: aftermath_looting
      label: Off-table aftermath findings
      object_id: core.quest_book.aftermath_looting
- id: core.quest.highwaymen.aftermath_travel
  name: Highwaymen — travel to Rochdale
  section_id: section.quest_book_i.the_dead_rising.quest_3_highwaymen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 230
      printed_page: 228
      heading: Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Taking what they can, the heroes start their journey back to the city. They manage to
    gather rations for two days from the bandits' stash and head north. They decide to trek through
    the forest to the north to reach Rochdale within two days. ... About mid-day on the second day,
    the party suddenly notices a smoke plume rising over the forest in front of them. ... The party
    travels to Rochdale without event using the rations found at the bandit’s hideout.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.highwaymen
  fields:
    rations_days_supplied:
      type: number
      role: output
      description: rations days supplied
      integer: true
    travel_direction:
      type: string
      role: output
      description: travel direction
    next_destination:
      type: string
      role: output
      description: next destination
    travel_without_event:
      type: boolean
      role: output
      description: travel without event
    use_bandit_stash_rations:
      type: boolean
      role: output
      description: use bandit stash rations
    smoke_sighted:
      type: string
      role: output
      description: smoke sighted
  effects:
    - type: set
      target: rations_days_supplied
      value:
        type: literal
        value: 2
    - type: set
      target: travel_direction
      value:
        type: literal
        value: north through the forest
    - type: set
      target: next_destination
      value:
        type: literal
        value: Rochdale
    - type: set
      target: travel_without_event
      value:
        type: literal
        value: true
    - type: set
      target: use_bandit_stash_rations
      value:
        type: literal
        value: true
    - type: set
      target: smoke_sighted
      value:
        type: literal
        value: mid-day on the second day
