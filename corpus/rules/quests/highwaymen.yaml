- id: core.quest.highwaymen.threshold
  name: Quest Threat 10
  section_id: section.quest_book_i.the_dead_rising.quest_3_highwaymen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 229
      printed_page: 227
      heading: Special Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Special Rules: When the Threat Level reaches 10, a Wandering Monster appears
    regardless of the Scenario die result.'
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.highwaymen
  fields:
    previous_threat:
      type: number
      role: input
      description: Threat before this change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: output
      description: Quest threshold.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: output
      description: Place special quest monster.
    scenario_result_ignored:
      type: boolean
      role: output
      description: Ignore Scenario result for this trigger.
    threat_reduction_on_placement:
      type: number
      role: output
      description: No reduction for special placement.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: quest_threshold
      value:
        type: literal
        value: 10
    - type: set
      target: wandering_monster_triggered
      value:
        type: literal
        value: true
    - type: set
      target: scenario_result_ignored
      value:
        type: literal
        value: true
    - type: set
      target: threat_reduction_on_placement
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: current_threat
        right:
          type: literal
          value: 10
      - type: compare
        operator: gt
        left:
          type: field
          name: current_threat
        right:
          type: field
          name: previous_threat
  dependencies:
    - key: threshold_convention
      label: Quest Book I directional Threat convention
      object_id: core.quest_book.threat_threshold_monster
  unresolved_references:
    - Upward-only triggering and no Threat reduction on placement follow the Quest Book I Triggering
      Wandering Monsters rule (PDF 222), applied through core.quest_book.threat_threshold_monster.
- id: core.quest.highwaymen.objective_setup
  name: Highwaymen — Dwarven hall setup
  section_id: section.quest_book_i.the_dead_rising.quest_3_highwaymen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 229
      printed_page: 227
      heading: Setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Place Graup, the Ogre, by the throne. Roll twice on the Bandits and Brigands Table and
    randomly place them around the Ogre, as close as possible. The heroes enter along the short side
    of the room. Bandits move first.
  type: scenario_rule
  scope: quest
  quest_id: quest.dead_rising.highwaymen
  fields:
    graup_placement:
      type: string
      role: output
      description: graup placement
    encounter_table_rolls:
      type: number
      role: output
      description: encounter table rolls
      integer: true
    encounter_table:
      type: string
      role: output
      description: encounter table
    bodyguard_placement:
      type: string
      role: output
      description: bodyguard placement
    hero_entry:
      type: string
      role: output
      description: hero entry
    first_to_move:
      type: string
      role: output
      description: first to move
  effects:
    - type: set
      target: graup_placement
      value:
        type: literal
        value: by the throne
    - type: set
      target: encounter_table_rolls
      value:
        type: literal
        value: 2
    - type: set
      target: encounter_table
      value:
        type: literal
        value: Bandits and Brigands Table
    - type: set
      target: bodyguard_placement
      value:
        type: literal
        value: randomly around the Ogre, as close as possible
    - type: set
      target: hero_entry
      value:
        type: literal
        value: short side of the room
    - type: set
      target: first_to_move
      value:
        type: literal
        value: Bandits
  unresolved_references:
    - 'Bandits and Brigands Table: encounter outcomes are not printed in this quest and must be
      supplied.'
