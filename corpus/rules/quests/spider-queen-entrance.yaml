      description: spider amulet found
    amulet_source:
      type: string
      role: output
      description: amulet source
    amulet_shape:
      type: string
      role: output
      description: amulet shape
    amulet_material:
      type: string
      role: output
      description: amulet material
    fallen_creatures_examined:
      type: boolean
      role: input
      description: The fallen creatures are being examined after the encounter.
  effects:
    - type: set
      target: spider_amulet_found
      value:
        type: literal
        value: true
    - type: set
      target: amulet_source
      value:
        type: literal
        value: Amburr
    - type: set
      target: amulet_shape
      value:
        type: literal
        value: spider
    - type: set
      target: amulet_material
      value:
        type: literal
        value: some kind of dark metal
  dependencies:
    - key: amulet
      label: Amburr’s spider amulet
      object_id: equipment.quest.spider_amulet
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: fallen_creatures_examined
    right:
      type: literal
      value: true
