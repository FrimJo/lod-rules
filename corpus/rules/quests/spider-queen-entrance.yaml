- id: core.quest.spider_queen_entrance.secondary_setup
  name: The Entrance — Secondary Objective setup
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_1_the_entrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 238
      printed_page: 236
      heading: The Entrance — Secondary Objective setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once the Secondary Objective is drawn, immediately place R17. It forgoes normal rules
    and is an empty hall; the Treasure Pile is not in play. Two doors lead out. Place the Ettin at
    the far side against the wall with two Orcs on either side.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.entrance
  fields:
    room:
      type: string
      role: output
      description: room
    place_immediately:
      type: boolean
      role: output
      description: place immediately
    normal_room_rules_replaced:
      type: boolean
      role: output
      description: normal room rules replaced
    empty_hall:
      type: boolean
      role: output
      description: empty hall
    treasure_pile_in_play:
      type: boolean
      role: output
      description: treasure pile in play
    exit_doors:
      type: number
      role: output
      description: exit doors
      integer: true
    ettin_placement:
      type: string
      role: output
      description: ettin placement
    orcs:
      type: number
      role: output
      description: orcs
      integer: true
    orc_placement:
      type: string
      role: output
      description: orc placement
  effects:
    - type: set
      target: room
      value:
        type: literal
        value: R17
    - type: set
      target: place_immediately
      value:
        type: literal
        value: true
    - type: set
      target: normal_room_rules_replaced
      value:
        type: literal
        value: true
    - type: set
      target: empty_hall
      value:
        type: literal
        value: true
    - type: set
      target: treasure_pile_in_play
      value:
        type: literal
        value: false
    - type: set
      target: exit_doors
      value:
        type: literal
        value: 2
    - type: set
      target: ettin_placement
      value:
        type: literal
        value: far side against the wall
    - type: set
      target: orcs
      value:
        type: literal
        value: 2
    - type: set
      target: orc_placement
      value:
        type: literal
        value: one on either side of the Ettin
- id: core.quest.spider_queen_entrance.amburr
  name: Amburr, The Ettin — equipment and Disease
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_1_the_entrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 238
      printed_page: 236
      heading: Amburr, The Ettin — equipment and Disease
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Amburr is a standard Ettin armed with a filthy Warhammer. Any wound from the warhammer
    may give the target a disease. See the Disease Special Rule in the Bestiary.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.entrance
  fields:
    enemy_kind:
      type: string
      role: output
      description: enemy kind
    weapon:
      type: string
      role: output
      description: weapon
    wounding_hit_may_cause_disease:
      type: boolean
      role: output
      description: wounding hit may cause disease
  effects:
    - type: set
      target: enemy_kind
      value:
        type: literal
        value: standard Ettin
    - type: set
      target: weapon
      value:
        type: literal
        value: filthy Warhammer
    - type: set
      target: wounding_hit_may_cause_disease
      value:
        type: literal
        value: true
  entity_id: quest_actor.spider_queen.amburr
  unresolved_references:
    - Standard Ettin statistics and the Disease Special Rule are in the unavailable Bestiary; no
      probability, disease type or standard statistics are invented.
