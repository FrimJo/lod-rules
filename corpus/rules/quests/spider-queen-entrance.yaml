      heading: The Entrance — Secondary Objective aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: While examining the fallen creatures the heroes notice a strange necklace on Amburr.
    Its spider-shaped dark-metal amulet is taken along.
