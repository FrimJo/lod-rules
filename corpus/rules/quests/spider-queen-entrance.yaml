      role: output
      description: excluded rooms
    secondary_quest_card:
      type: number
      role: output
      description: secondary quest card
      integer: true
    secondary_card_position:
      type: string
      role: output
      description: secondary card position
    encounters:
      type: string
      role: output
      description: encounters
    objective_room:
      type: string
      role: output
      description: objective room
  effects:
