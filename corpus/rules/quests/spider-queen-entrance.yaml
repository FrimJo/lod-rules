- id: core.quest.spider_queen_entrance.aftermath
  name: The Entrance — amulet opens the stair
  section_id: section.quest_book_i.lair_of_the_spider_queen.level_1_the_entrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 239
      printed_page: 237
      heading: The Entrance — amulet opens the stair
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once everything is quiet, a hero finds an imprint at the base of the statue matching
    the spider amulet. Pressing the amulet into the imprint slides the statue away, revealing a
    dusty stair descending into darkness.
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.entrance
  fields:
    chamber_quiet:
      type: boolean
      role: input
      description: The chamber is quiet.
    amulet_pressed_into_imprint:
      type: boolean
      role: input
      description: The spider amulet is pressed into the matching imprint.
    statue_slides_away:
      type: boolean
      role: output
      description: The statue slides away.
    descending_stair_revealed:
      type: boolean
      role: output
      description: Descending stairs are revealed.
  effects:
    - type: set
      target: statue_slides_away
      value:
        type: literal
        value: true
    - type: set
      target: descending_stair_revealed
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: chamber_quiet
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: amulet_pressed_into_imprint
        right:
          type: literal
          value: true
  dependencies:
    - key: amulet
      label: Spider amulet from Amburr
      object_id: equipment.quest.spider_amulet
    - key: next_level
      label: 'Level 2: The Basement'
      object_id: quest.spider_queen.basement
