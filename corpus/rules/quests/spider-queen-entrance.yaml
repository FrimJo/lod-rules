      target: rooms
      value:
        type: literal
        value: 7
    - type: set
      target: corridors
      value:
        type: literal
        value: 7
    - type: set
      target: excluded_corridor
      value:
        type: literal
        value: C16
    - type: set
      target: excluded_rooms
      value:
        type: literal
        value: R17, R1
    - type: set
      target: secondary_quest_card
      value:
        type: literal
        value: 1
    - type: set
      target: secondary_card_position
      value:
        type: literal
        value: mixed in with the first half of the pile
    - type: set
      target: encounters
      value:
        type: literal
        value: Orcs and Goblins
    - type: set
      target: objective_room
      value:
        type: literal
