- id: core.quest.spider_queen_campaign.opening
  name: Lair of the Spider Queen — campaign opening
  section_id: section.quest_book_i.lair_of_the_spider_queen
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 237
      printed_page: 235
      heading: Lair of the Spider Queen — campaign opening
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Campaign start: Whiteport. Travel to White 40 to accept the quest and continue the
    campaign. An elderly wizard seeks the sceptre buried with Queen Araneae. Reward: 1200 c per
    hero.'
  type: scenario_rule
  scope: quest
  quest_id: quest.spider_queen.campaign
  fields:
    campaign_start:
      type: string
      role: output
      description: campaign start
    quest_location:
      type: string
      role: output
      description: quest location
    accept_quest_at_location:
      type: boolean
      role: output
      description: accept quest at location
    objective:
      type: string
      role: output
      description: objective
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
  effects:
    - type: set
      target: campaign_start
      value:
        type: literal
        value: Whiteport
    - type: set
      target: quest_location
      value:
        type: literal
        value: White 40
    - type: set
      target: accept_quest_at_location
      value:
        type: literal
        value: true
    - type: set
      target: objective
      value:
        type: literal
        value: locate the sceptre buried with Queen Araneae
    - type: set
      target: reward_per_hero
      value:
        type: literal
        value: 1200
  dependencies:
    - key: wizard
      label: The elderly wizard seeking the sceptre
      object_id: quest_actor.spider_queen.wizard
- id: core.quest.spider_queen_entrance.setup
