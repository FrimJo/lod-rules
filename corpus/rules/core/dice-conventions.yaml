- id: core.dice.percentile
  name: dice percentile
  section_id: section.introduction.dice_rolling_and_skill_checks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 16
      pdf_page: 18
      heading: Dice Rolling and Skill Checks
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Whenever you roll to see if a character has succeeded with a skill (including
    hitting its target in combat) or a stat check, roll a percentile dice, also known as 1d100.
  type: constraint
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 100
      dice:
        count: 1
        sides: 100
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 1
  term_refs:
    - term.percentile_dice
    - term.skill_test
  see_also:
