- id: core.dungeon_event.eligible_room
  name: Dungeon events (optional rule) — eligible rooms
  section_id: section.into_the_dungeons.dungeon_events_optional_rule
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 105
      pdf_page: 107
      heading: Dungeon events (optional rule)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Dungeon events can only be triggered in rooms where there are no encounters, and never
    in an Objective Room.
  type: constraint
  scope: dungeon
  fields:
    dungeon_events_rule_in_use:
      type: boolean
      role: input
      description: The group has chosen to play with the optional Dungeon events rule.
    tile_kind:
      type: string
      role: input
      description: room or corridor.
    encounter_in_room:
      type: boolean
      role: input
      description: There is an encounter in the room.
    objective_room:
      type: boolean
      role: input
      description: The room is an Objective Room.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: dungeon_events_rule_in_use
    right:
      type: literal
      value: true
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: tile_kind
        right:
          type: literal
          value: room
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: encounter_in_room
        right:
          type: literal
          value: false
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: objective_room
        right:
          type: literal
          value: false
- id: core.dungeon_event.trigger_roll
  name: Dungeon events (optional rule) — trigger roll
  section_id: section.into_the_dungeons.dungeon_events_optional_rule
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 105
      pdf_page: 107
      heading: Dungeon events (optional rule)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The first activation a hero does, starting in a new room (not a corridor), roll 1d10.
    On a result of 9-10, you have triggered a dungeon event.
  type: random_resolution
  scope: dungeon
  fields:
    dungeon_events_rule_in_use:
      type: boolean
      role: input
      description: The group has chosen to play with the optional Dungeon events rule.
    first_activation_in_new_room:
      type: boolean
      role: input
      description: This is the first activation a hero does, starting in a new room (not a corridor).
    event_roll:
      type: number
      role: input
      description: Supplied 1d10 result.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    dungeon_event_triggered:
      type: boolean
      role: output
      description: A dungeon event has been triggered.
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: dungeon_events_rule_in_use
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: first_activation_in_new_room
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: event_roll
        right:
          type: literal
          value: 9
  effects:
    - type: set
      target: dungeon_event_triggered
      value:
        type: literal
        value: true
- id: core.dungeon_event.resolve
  name: Dungeon events (optional rule) — resolving the event
  section_id: section.into_the_dungeons.dungeon_events_optional_rule
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 105
      pdf_page: 107
      heading: Dungeon events (optional rule)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Roll on the table and resolve the event. Roll 1d6 to determine the column for the d12.
  unresolved_references:
    - the table (a d12 table with columns chosen by 1d6) that Dungeon events refers to
  issues:
    - issue.dungeon_events.table_not_printed
  type: lookup
  scope: dungeon
  fields:
    dungeon_events_rule_in_use:
      type: boolean
      role: input
      description: The group has chosen to play with the optional Dungeon events rule.
    dungeon_event_triggered:
      type: boolean
      role: input
      description: A dungeon event has been triggered.
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: dungeon_events_rule_in_use
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: dungeon_event_triggered
        right:
          type: literal
          value: true
  effects:
    - type: unresolved
      issue_id: issue.dungeon_events.table_not_printed
- id: core.dungeon_event.once_per_room
  name: Dungeon events (optional rule) — one per room
  section_id: section.into_the_dungeons.dungeon_events_optional_rule
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
