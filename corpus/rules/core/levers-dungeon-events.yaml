      heading: Dungeon events (optional rule)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Only one event can be triggered in each room.
  type: constraint
  scope: dungeon
  fields:
    dungeon_events_rule_in_use:
      type: boolean
      role: input
      description: The group has chosen to play with the optional Dungeon events rule.
    event_already_triggered_in_room:
      type: boolean
      role: input
      description: A dungeon event has already been triggered in this room.
  when:
    type: compare
