- id: core.lever.optional
  name: Levers — activation is optional
  section_id: section.into_the_dungeons.levers
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 101
      pdf_page: 103
      heading: Levers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Some rooms are equipped with levers. Activating these levers is, unless specified
    otherwise in the quest, purely optional. Activating the correct lever may end up benefiting the
    party, but then, activating the wrong one may cause some trouble.
  type: choice
  scope: dungeon
  fields:
    quest_specifies_otherwise:
      type: boolean
      role: input
      description: The quest specifies how its levers must be handled.
    lever_activation_optional:
      type: boolean
      role: output
      description: Activating the levers is purely optional.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: quest_specifies_otherwise
    right:
      type: literal
      value: false
  effects:
    - type: set
      target: lever_activation_optional
      value:
        type: literal
        value: true
- id: core.lever.deck
  name: Levers — Preparing the Lever Deck
  section_id: section.into_the_dungeons.levers
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 101
      pdf_page: 103
      heading: Preparing the Lever Deck
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If you decide to interact with the levers, you must first decide how many levers there
    are clustered together. Shuffle a deck with standard playing cards containing 1 black card and
    1d4+1 red cards. The black card represents the lever that triggers mostly positive events,
    whereas the red ones tend to cause more trouble. If there is a quest-specific Event connected to
    the levers, this will be triggered by the black card.
  issues:
    - issue.levers.count_and_deck
  type: random_resolution
  scope: dungeon
  fields:
    red_card_roll:
      type: number
      role: input
      description: Supplied 1d4 result for the red cards.
      integer: true
      minimum: 1
      maximum: 4
      dice:
        count: 1
        sides: 4
    black_cards:
      type: number
      role: output
      description: Black cards in the lever deck.
      integer: true
      minimum: 0
    red_cards:
      type: number
      role: output
      description: Red cards in the lever deck (1d4+1).
      integer: true
      minimum: 0
    quest_event_trigger:
      type: string
      role: output
      description: Card that triggers a quest-specific lever Event.
  effects:
    - type: set
      target: black_cards
      value:
        type: literal
        value: 1
    - type: set
      target: red_cards
      value:
        type: sum
        values:
          - type: field
            name: red_card_roll
          - type: literal
            value: 1
    - type: set
      target: quest_event_trigger
      value:
        type: literal
        value: black_card
- id: core.lever.activate
  name: Levers — Activating a Lever
  section_id: section.into_the_dungeons.levers
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 101
      pdf_page: 103
      heading: Activating a Lever
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Activating a lever costs 1 AP and cannot be done when there are known enemies on the
    table. Draw a card and then roll on the corresponding tables below. Once any event has been
    dealt with, you are free to pull another lever.
  issues:
    - issue.levers.count_and_deck
  type: procedure_rule
  scope: dungeon
  fields:
    known_enemies_on_table:
      type: boolean
      role: input
      description: There are known enemies on the table.
    previous_event_resolved:
      type: boolean
      role: input
      description: Any event from a previous lever has been dealt with.
    activation_ap_cost:
      type: number
      role: output
      description: AP to activate a lever.
      integer: true
      minimum: 0
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: known_enemies_on_table
        right:
          type: literal
          value: false
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: previous_event_resolved
        right:
          type: literal
          value: true
    - type: set
      target: activation_ap_cost
      value:
        type: literal
        value: 1
