- id: core.dungeon.tile_placement
  name: tile placement
  section_id: section.into_the_dungeons.general_dungeon_layout
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      heading: General Dungeon Layout
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      section: General Dungeon Layout
      heading: Placing Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      heading: General Dungeon Layout
      locator:
        region: Tile placement illustrations and caption
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    When you start the quest, only one tile will be placed on the table. As you move further into
    the dungeon, more and more tiles will be revealed. ... When you are requested to place a tile,
    you are free to do this as you see fit unless noted otherwise in the Quest Description. All you
    need to consider is that the squares line up and that you can place a door between the tiles
    without interfering with furniture.
  type: constraint
  scope: global
  fields:
    squares_aligned:
      type: boolean
      role: input
      description: squares aligned
    door_unobscured:
      type: boolean
      role: input
      description: door unobscured
    quest_placement_satisfied:
      type: boolean
      role: input
      description: quest placement satisfied
    placement_allowed:
      type: boolean
      role: output
      description: placement allowed
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: squares_aligned
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: door_unobscured
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_placement_satisfied
            right:
              type: literal
              value: true
    - type: set
      target: placement_allowed
      value:
        type: literal
        value: true
- id: core.dungeon.door_placement
  name: door placement
  section_id: section.into_the_dungeons.doors_and_placement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      section: General Dungeon Layout
      heading: Doors and Placement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Most tiles will have more doors than the one you came through, and this is noted on the
    Exploration Card. Doors should be placed on the black border of the tile and in such way that
    no furniture is obscuring the door. There are 3 different kinds of Door Tokens supplied in the
    game. Unless stated otherwise in the Quest Description you should always place a standard door
    (token with a door depicted). Once the door is opened, you replace this with an opening without
    a door. The cobweb covered openings are used only when dictated by the Quest Descriptions, but
    are otherwise placed the same way. A cleared cobweb opening is replaced by a standard opening.
  type: definition
  scope: global
  fields:
    quest_cobweb:
      type: boolean
      role: input
      description: quest cobweb
    default_token:
      type: string
      role: output
      description: default token
    opened_token:
      type: string
      role: output
      description: opened token
    cleared_cobweb_token:
      type: string
      role: output
      description: cleared cobweb token
    placement:
      type: string
      role: output
      description: placement
  effects:
    - type: set
      target: default_token
      value:
        type: literal
        value: standard door
    - type: set
      target: opened_token
      value:
        type: literal
        value: opening without door
    - type: set
      target: cleared_cobweb_token
      value:
        type: literal
        value: standard opening
    - type: set
      target: placement
      value:
        type: literal
        value: black border; furniture unobscured
- id: core.dungeon.card_contents
  name: card contents
  section_id: section.into_the_dungeons.reading_the_exploration_cards
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 87
      printed_page: 85
      heading: Reading the Exploration Cards
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 87
      printed_page: 85
      section: Reading the Exploration Cards
      heading: Details of Exploration Cards
      locator:
        region: Labelled Exploration Card diagram
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 87
      printed_page: 85
      section: Reading the Exploration Cards
      heading: Dungeoneers Playing Cards
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    There are two decks available to use when randomising the dungeon. Normally, you would use the
    detailed Exploration Cards, but you can use a standard deck of playing cards when playing with
    your own tiles. ... Tile ID. Name of tile. Number of doors, including the one you just entered
    through. Visual presentation of the tile. Description of the tile. Special Rules regarding this
    tile. ... When using standard playing cards, you simply cross-reference the value of the card
    with a table with rooms. ... To symbolize the objective room, you can use any of the dressed
    cards or the Joker. The same guide applies to the Side Quest Card.
  type: modifier
  scope: global
  fields:
    card_fields:
      type: string
      role: output
      description: card fields
    own_tiles_alternative:
      type: string
      role: output
      description: own tiles alternative
    objective_or_side_quest:
      type: string
      role: output
      description: objective or side quest
  effects:
    - type: set
      target: card_fields
      value:
        type: literal
        value: Tile ID; name; door count including entered door; tile picture; description; special rules
    - type: set
      target: own_tiles_alternative
      value:
        type: literal
        value: playing cards with supplied room lookup
    - type: set
      target: objective_or_side_quest
      value:
        type: literal
        value: dressed card or Joker
  unresolved_references:
    - A template for such a table is available at
      https://boardgamegeek.com/boardgame/336195/dungeoneers.
- id: core.dungeon.card_eligibility
  name: card eligibility
  section_id: section.into_the_dungeons.what_cards_to_include
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 87
      printed_page: 85
      section: Reading the Exploration Cards
      heading: What cards to include
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Generating the Dungeon
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: medium
  source_text: >-
    Normally, you would include all cards, except cards with a B in their ID. This is a thematic
    decision, but if you feel like adding them for more variety, it will not affect gameplay in any
    negative way. The quest description might also give specific instructions to remove certain
    cards.
  type: modifier
  scope: global
  fields:
    quest_removed:
      type: boolean
      role: input
      description: quest removed
    is_b_card:
      type: boolean
      role: input
      description: is b card
    quest_specifies_b:
      type: boolean
      role: input
      description: quest specifies b
    eligible:
      type: boolean
      role: output
      description: eligible
  effects:
    - type: set
      target: eligible
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: quest_removed
        right:
          type: literal
          value: false
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: is_b_card
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_specifies_b
            right:
              type: literal
              value: true
  issues:
    - issue.phase6.b_cards
