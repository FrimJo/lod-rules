- id: core.movement.pit.up_without_rope
  name: pit up without rope
  section_id: section.into_the_dungeons.obstacles.climbing_pits
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 91
      pdf_page: 93
      heading: Climbing Pits
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: 'Climbing Pits: This requires a DEX test and 2 AP. However, if your hero or any
    friend adjacent to the pit has a rope, this is done without the need of a DEX Test. Climbing
    with a rope takes 1 Action. Place the hero anywhere adjacent to the pit. Climbing down:
    there is no need of a DEX Test. It takes 1 AP.'
  type: calculation
  scope: global
  fields:
    rope_available:
      type: boolean
      role: input
      description: rope available
    climbing_down:
      type: boolean
      role: input
      description: climbing down
    action_cost:
      type: number
      role: state
      description: action cost
    dex_test_required:
      type: boolean
      role: state
      description: dex test required
  effects:
    - type: set
      target: action_cost
      value:
        type: literal
        value: 2
    - type: set
      target: dex_test_required
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: climbing_down
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: rope_available
        right:
          type: literal
          value: false
