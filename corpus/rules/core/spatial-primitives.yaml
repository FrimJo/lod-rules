- id: core.spatial.adjacent
  name: spatial adjacent
  section_id: section.game_basics.the_tiles.adjacent
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 18
      pdf_page: 20
      heading: Adjacent
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Basically, all 8 squares surrounding square A are adjacent to square A.
  type: definition
  scope: global
  fields:
    dx:
      type: number
      role: input
      description: dx
      integer: true
    dy:
      type: number
      role: input
      description: dy
      integer: true
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lte
            left:
              type: arithmetic
              operator: abs
              values:
                - type: field
                  name: dx
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
            left:
              type: arithmetic
              operator: abs
              values:
                - type: field
                  name: dy
            right:
              type: literal
              value: 1
          - type: any
            conditions:
              - type: compare
                operator: ne
                left:
                  type: field
                  name: dx
                right:
                  type: literal
                  value: 0
              - type: compare
                operator: ne
                left:
                  type: field
                  name: dy
                right:
                  type: literal
                  value: 0
  term_refs:
    - term.adjacent
- id: core.model.footprint
  name: model footprint
  section_id: section.game_basics.models
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 18
      pdf_page: 20
      heading: Models
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: A model with the Large Special Rule (such as a Troll) should be large enough to
    occupy 4 squares. All other models should fit within 1 square.
  type: calculation
  scope: global
  fields:
    large:
      type: boolean
      role: input
      description: large
    squares:
      type: number
      role: state
      description: squares
    size_choice:
      type: string
      role: input
      description: Select the printed Large or other model branch.
  effects:
    - type: choice
      selection: size_choice
      options:
        - id: large
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: large
            right:
              type: literal
              value: true
          effects:
            - type: set
              target: squares
              value:
                type: literal
                value: 4
        - id: other
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: large
            right:
              type: literal
              value: false
          effects:
            - type: set
              target: squares
              value:
                type: literal
                value: 1
- id: core.los.trace
  name: los trace
  section_id: section.game_basics.line_of_sight_los
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 19
      pdf_page: 21
      heading: Line of Sight (LOS)
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: LOS is traced from the centre of the viewer’s square to the centre of the target
    square. In the case of objects, it is the actual graphic that counts, not the square itself.
  type: definition
  scope: global
  fields:
    origin:
      type: string
      role: state
      description: origin
    destination:
      type: string
      role: state
      description: destination
    obstacle_geometry:
      type: string
      role: state
      description: obstacle geometry
  effects:
    - type: set
      target: origin
      value:
        type: literal
        value: square_centre
    - type: set
      target: destination
      value:
        type: literal
        value: square_centre
    - type: set
      target: obstacle_geometry
      value:
        type: literal
        value: actual_graphic
- id: core.los.blocked
  name: los blocked
  section_id: section.game_basics.line_of_sight_los
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 19
      pdf_page: 21
      heading: Line of Sight (LOS)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the line drawn between these two points crosses another model or some kind of
    obstacle, it means that the LOS is obstructed. Any LOS passing through the black outline of
    a tile is blocked.
  type: calculation
  scope: global
  fields:
    crosses_black_outline:
      type: boolean
      role: input
      description: crosses black outline
    crosses_model:
      type: boolean
      role: input
      description: crosses model
    crosses_object_art:
      type: boolean
      role: input
      description: crosses object art
    los_result:
      type: string
      role: state
      description: los result
  effects:
    - type: set
      target: los_result
      value:
        type: literal
        value: blocked
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: crosses_black_outline
    right:
      type: literal
      value: true
  term_refs:
    - term.line_of_sight
