- id: core.quest.start_settlement
  name: randomise the start settlement
  section_id: section.embarking_on_your_first_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 57
      pdf_page: 59
      section: Embarking on your First Quest
      heading: Embarking on your First Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: medium
  source_text: 'When you start the game, you should randomise what settlement the party is in. The
    eligible ones are:'
  type: random_resolution
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: Supplied result between 1 and 8; the die is not named.
      integer: true
      minimum: 1
      maximum: 8
    settlement:
      type: string
      role: output
      description: Printed entry; "Re-roll." means roll again.
  effects:
    - type: lookup
      table_id: table.settlement.start_settlement
      key_column: number
      key:
        type: field
        name: roll
      value_column: settlement
      target: settlement
      on_missing_issue: issue.embarking.start_settlement_die
  uses_tables:
    - table.settlement.start_settlement
  issues:
    - issue.embarking.start_settlement_die
- id: core.quest.first_quests
  name: recommended first quests
  section_id: section.embarking_on_your_first_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 57
      pdf_page: 59
      section: Embarking on your First Quest
      heading: Embarking on your First Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If this is the first time you play the game, I would recommend playing the ‘First
    Blood’ quest first. Then, as the second quest, I would go for ‘Spring Cleaning’, which is the
    first quest of the Rising Dead Campaign. It is available at any settlement. You will find both
    these quests in the Quest Book I at the end of this book.
  type: definition
  scope: global
  fields: {}
  effects: []
  dependencies:
    - key: first_blood
      label: First Blood
      section_id: section.quest_book_i.introduction.first_blood_introductory_quest
      object_id: quest.first_blood
    - key: spring_cleaning
      label: Spring Cleaning
      section_id: section.quest_book_i.the_dead_rising.quest_1_spring_cleaning
      object_id: quest.dead_rising.spring_cleaning
