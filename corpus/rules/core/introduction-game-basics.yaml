- id: core.optional.marked_rules
  name: optional rules are marked
  section_id: section.introduction.a_word_on_complexity
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 10
      pdf_page: 12
      heading: A Word on Complexity
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This game is quite detailed and will require some bookkeeping on your part. Some of
    the rules have been marked as optional if you would prefer to reduce the details somewhat.
  type: definition
  scope: global
  fields: {}
  effects: []
  see_also:
    - section.game_basics.complexity
- id: core.dice.combined_rolls
  name: dice that may be rolled together
  section_id: section.introduction.a_word_on_dice_rolling
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 10
      pdf_page: 12
      heading: A Word on Dice Rolling
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: You will be rolling dice. A lot of dice. However, you will soon learn which dice to
    roll, and which may be rolled together to speed up the game.
  type: definition
  scope: global
  fields: {}
  effects: []
  see_also:
    - section.into_the_dungeons.opening_a_door_or_chest
- id: core.components.treasure_card_return
  name: drawn Treasure Cards return to the pile
  section_id: section.introduction.game_components
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 11
      pdf_page: 13
      heading: Treasure Cards
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Treasure Cards come in three different variants. These are drawn whenever you
    find any treasures. Some cards will require you to make rolls once drawn to further define the
    details of what you have found. The way to put these cards into play is described in the
    ‘Treasure’ chapter. Once a card is drawn and read, it should be mixed back to the pile.
  type: procedure_rule
  scope: global
  fields:
    card_drawn_and_read:
      type: boolean
      role: input
      description: A Treasure Card has been drawn and read.
    returned_to_pile:
      type: boolean
      role: state
      description: The card is mixed back into its pile.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: card_drawn_and_read
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: returned_to_pile
      value:
        type: literal
        value: true
  see_also:
    - section.treasure
- id: core.overview.threat_level
  name: Threat Level overview
  section_id: section.game_basics.basic_concept
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: Basic Concept
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: As you spend time in these dark halls, the Threat Level slowly rises. The more noise
    you make, and the longer you stay, the higher the Threat Level will be. Every turn you are
    forced to roll the Scenario die and depending on the Scenario Rules, there is a risk that this
    dice will trigger a Threat Roll. If this roll is below the Threat Level, something bad will
    happen. Keeping the Threat Level low is your hero’s best way to emerge from the dungeon
    unharmed.
  type: definition
  scope: dungeon
  fields: {}
  effects: []
  dependencies:
    - key: scenario_die
      label: Roll the Scenario die
      section_id: section.into_the_dungeons.the_scenario_die
      object_id: procedure.scenario_die
    - key: threat_roll
      label: Make a Threat Roll
      section_id: section.into_the_dungeons.the_threat_level
      object_id: procedure.threat_roll
  issues:
    - issue.game_basics.threat_roll_equality
  timing_refs:
    - term.turn
  see_also:
    - section.game_basics.turn_sequence
- id: core.house_rule.uncovered_situation
  name: house rule for an uncovered situation
  section_id: section.game_basics.house_rules
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: House Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This is a complex game where a combination of events and chance items may create a
    situation that is not 100% covered by the rules. In such a case, you will simply have to agree
    upon a reasonable house rule to resolve that particular situation. If you are afraid to rule
    favourably for the heroes, you can always let a roll of the die decide.
  type: definition
  scope: global
  fields: {}
  effects: []
  term_refs:
    - term.house_rule
- id: core.tiles.alternative_terrain
  name: other tiles or 3D terrain
  section_id: section.game_basics.the_tiles
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: The Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The tiles provided in the game will help represent the dungeons you explore.
    However, the game works perfectly fine with other tiles or even 3D-terrain. Throughout these
    rules you will find examples of that. The only criteria that must be fulfilled is a way to
    define movement, and to establish the models’ relative placement to one another.
  type: definition
  scope: global
  fields: {}
  effects: []
  term_refs:
    - term.tiles
    - term.model
- id: core.tiles.square_movement
  name: models stand and move in squares
  section_id: section.game_basics.the_tiles
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: The Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In League of Dungeoneers, this is done with squares. A model will always stand in a
    square, and when it moves, it moves a set number of squares, either in a straight line,
    diagonally, or using a mix thereof.
  type: definition
  scope: global
  fields:
    position_unit:
      type: string
      role: state
      description: A model always stands in a square.
    movement_unit:
      type: string
      role: state
      description: Movement is a set number of squares, straight, diagonal or a mix.
  effects:
    - type: set
      target: position_unit
      value:
        type: literal
        value: square
    - type: set
      target: movement_unit
      value:
        type: literal
        value: square
  term_refs:
    - term.tiles
    - term.model
    - term.movement
  see_also:
    - section.into_the_dungeons.moving_and_facing
- id: core.tiles.interactable_objects
  name: interactable objects are noted on the Exploration Card
  section_id: section.game_basics.the_tiles.objects_on_the_tiles
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: Objects on the Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 18
      pdf_page: 20
      heading: Objects on the Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The tiles are also filled with various items, such as debris, furniture, and the
    remnants of previous adventurers. These are depicted on the tiles partly to make them more
    interesting and pleasing to look at, but they also serve an important function in the game. It
    is possible to interact with many of the things you see. Everything you can search or interact
    with is noted on the Exploration Card. More information on this is available in the ‘Into the
    Dungeon’ chapter.
  type: constraint
  scope: dungeon
  fields:
    noted_on_exploration_card:
      type: boolean
      role: input
      description: The object is noted on the tile's Exploration Card.
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: noted_on_exploration_card
        right:
          type: literal
          value: true
  term_refs:
    - term.tiles
  see_also:
    - section.into_the_dungeons.reading_the_exploration_cards
- id: core.difficulty.party_size
  name: game designed for four characters
  section_id: section.game_basics.difficulty
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 17
      pdf_page: 19
      heading: Difficulty
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The game is designed to be played with 4 characters. You may, of course, go for
    fewer or more heroes, but that will change the balance of the game accordingly, and you may
    decide to change some of the game parameters to counter this.
  type: definition
  scope: global
  fields:
    designed_party_size:
      type: number
      role: state
      description: Number of characters the game is designed for.
  effects:
    - type: set
      target: designed_party_size
      value:
        type: literal
        value: 4
  term_refs:
    - term.heroes
    - term.party
