- id: character.encumbrance.feedback_uncertain
  name: encumbrance feedback uncertain
  section_id: section.equipment.encumbrance
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 51
      pdf_page: 53
      heading: Encumbrance
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If the total encumbrance exceeds the STR of your character, all skills and stats
    are at -10. Your character can never carry more than STR+15 points of encumbrance.
  type: calculation
  scope: global
  fields:
    recalculating_from_encumbrance_penalty:
      type: boolean
      role: input
      description: recalculating from encumbrance penalty
  effects:
    - type: unresolved
      issue_id: issue.phase4.encumbrance_feedback
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: recalculating_from_encumbrance_penalty
    right:
      type: literal
      value: true
  issues:
    - issue.phase4.encumbrance_feedback
  optional_system: encumbrance
