- id: core.action_points.allocation
  name: action points allocation
  section_id: section.game_basics.action_points_ap
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 19
      pdf_page: 21
      heading: Action Points (AP)
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Everything done inside a dungeon or on a skirmish battle map is performed by
    spending Action Points. This is true for both heroes and enemies. All models have 2 AP.
  type: calculation
  scope: global
  fields:
    mode:
      type: string
      role: input
      description: mode
    action_points:
      type: number
      role: state
      description: action points
  effects:
    - type: set
      target: action_points
      value:
        type: literal
        value: 2
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: mode
        right:
          type: literal
          value: dungeon
      - type: compare
        operator: eq
        left:
          type: field
          name: mode
        right:
          type: literal
          value: skirmish
  term_refs:
    - term.action_points
  timing_refs:
    - term.turn
- id: core.action_points.spend
  name: action points spend
  section_id: section.into_the_dungeons.the_turn
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 88
      pdf_page: 89
      heading: The Turn
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Each hero has two Action Points (AP) to spend on actions. They may be used in any
    combination, such as two Standard Attacks, or one move and one attack.
  type: calculation
  scope: global
  fields:
    action_points:
      type: number
      role: state
      description: action points
    action_cost:
      type: number
      role: input
      description: action cost
  effects:
    - type: add
      target: action_points
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: action_cost
          - type: literal
            value: -1
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: action_cost
        right:
          type: literal
          value: 0
      - type: compare
        operator: lte
        left:
          type: field
          name: action_cost
        right:
          type: field
          name: action_points
  timing_refs:
    - term.hero_activation
- id: core.turn.action_order
  name: turn action order
  section_id: section.into_the_dungeons.the_turn
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 88
      pdf_page: 89
      heading: The Turn
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Each action must be completed before starting another. One hero must complete their
    actions before another can act.
  type: constraint
  scope: global
  fields:
    previous_action_complete:
      type: boolean
      role: input
      description: previous action complete
    previous_hero_complete:
      type: boolean
      role: input
      description: previous hero complete
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: previous_action_complete
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: previous_hero_complete
            right:
              type: literal
              value: true
  timing_refs:
    - term.turn
    - term.hero_activation
