          value: true
- id: core.turn.enemies_placed
  name: turn enemies placed
  section_id: section.into_the_dungeons.the_turn
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
