      pdf_page: 89
      heading: The Turn
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Enemies act in the same way as heroes using 2 AP. They will act in such an order as
    to avoid blocking each other as much as possible.
