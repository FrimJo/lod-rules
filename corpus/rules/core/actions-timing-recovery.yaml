      pdf_page: 89
      heading: The Turn
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: If enemies are placed on the table, all remaining actions for the heroes are lost
    and a new turn starts.
