- id: core.check.standard
  name: Standard check failure
  section_id: section.game_basics.skill_and_stat_checks.success_and_failure
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 18
      pdf_page: 20
      heading: Success and Failure
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Any result equal to or lower than the stat or Skill Level is considered a success.
    Anything above that is considered a failure.
  type: calculation
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: Normalized percentile result, 1–100; printed 00 denotes 100.
      minimum: 1
      maximum: 100
      integer: true
    effective_value:
      type: number
      role: input
      description: Value after any independently established modifiers.
    outcome:
      type: string
      role: output
      description: Success or failure; Perfect Result is a separate property.
  effects:
    - type: set
      target: outcome
      value:
        type: literal
        value: failure
  when:
    type: compare
    operator: gt
    left:
      type: field
      name: roll
    right:
      type: field
      name: effective_value
  issues:
    - issue.0005
  term_refs:
    - term.skill_test
    - term.percentile_dice
