- id: core.check.automatic_failure
  name: Automatic failure
  section_id: section.introduction.dice_rolling_and_skill_checks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 16
      pdf_page: 18
      heading: Dice Rolling and Skill Checks
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A roll of 91-00 is always a failure, no matter what your skill level or modifiers are.
  type: exception
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: Normalized percentile result, 1–100; printed 00 denotes 100.
      minimum: 1
      maximum: 100
      integer: true
    effective_value:
      type: number
      role: input
      description: Value after any independently established modifiers.
