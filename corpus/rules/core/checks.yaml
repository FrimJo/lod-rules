- id: core.check.failure_instruction
  name: Follow the instruction after or on failure
  section_id: section.game_basics.skill_and_stat_checks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 18
      pdf_page: 20
      heading: Skill and Stat Checks
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Throughout this book and any accessories, you will sometimes see these checks
    abbreviated as ‘RES or…’. That would mean that the hero should test Resolve (RES), and if that
    test fails, you follow the instructions after ‘or…’.
  type: procedure_rule
  scope: global
  fields:
    outcome:
      type: string
      role: input
      description: outcome
  effects:
    - type: invoke
      dependency: following_instruction
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: outcome
    right:
      type: literal
      value: failure
  dependencies:
    - key: following_instruction
      label: The instructions after “or…” in the calling rule
  term_refs:
    - term.skill_test
    - term.percentile_dice
