- id: core.searching.arranging_found_items
  name: Picking Things Up — arranging found items
  section_id: section.into_the_dungeons.picking_things_up
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 97
      pdf_page: 99
      heading: Picking Things Up
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Whenever you search corpses, rooms or furniture, you may find things you would like to
    keep. Arranging these things as you like (in Quick Slots, Backpacks, or Equipping it) is
    included in the AP spent to search.
  see_also:
    - section.into_the_dungeons.searching_furniture
    - section.into_the_dungeons.searching_through_a_room_or_corridor
    - section.into_the_dungeons.searching_corpses
  type: resource_change
  scope: dungeon
  fields:
    arranging_found_items:
      type: boolean
      role: input
      description:
        Things found while searching corpses, rooms or furniture are being arranged in Quick
        Slots, Backpacks or equipped.
    arrangement_extra_ap:
      type: number
      role: output
      description: AP spent on arranging beyond the AP spent to search.
      integer: true
      minimum: 0
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: arranging_found_items
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: arrangement_extra_ap
      value:
        type: literal
        value: 0
  term_refs:
    - term.quick_slot
    - term.furniture
