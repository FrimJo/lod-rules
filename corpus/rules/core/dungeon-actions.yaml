      type: boolean
      role: input
      description: The party is in a battle. Rearranging your Gear applies in between battles.
    characters_in_los:
      type: boolean
      role: input
      description: The trading characters are in LOS of each other.
    ap_cost_per_character:
      type: number
      role: output
      description: AP each trading character spends.
      integer: true
      minimum: 0
    adjacency_required:
      type: boolean
      role: output
      description: The trading characters must be adjacent.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: in_battle
    right:
      type: literal
      value: false
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: characters_in_los
        right:
          type: literal
          value: true
    - type: set
      target: ap_cost_per_character
      value:
        type: literal
        value: 1
    - type: set
      target: adjacency_required
      value:
        type: literal
        value: false
  term_refs:
    - term.line_of_sight
