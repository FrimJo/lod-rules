- id: core.searching.corpses
  name: Searching Corpses — when and which mode
  section_id: section.into_the_dungeons.searching_corpses
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 97
      pdf_page: 99
      heading: Searching Corpses
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once you have defeated an enemy and the battle is over, you can search the corpses of
    the enemies for loot. This may be done in two ways, and this should be agreed upon by the
    players beforehand.
  see_also:
    - section.treasure
  issues:
    - issue.0001
  type: constraint
  scope: dungeon
  fields:
    enemy_defeated:
      type: boolean
      role: input
      description: The enemy whose corpse is searched has been defeated.
    battle_over:
      type: boolean
      role: input
      description: The battle is over.
    corpse_search_mode:
      type: string
      role: input
      description: 'Mode agreed upon by the players beforehand: hardcore or streamlined.'
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: enemy_defeated
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: battle_over
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: corpse_search_mode
            right:
              type: literal
              value: hardcore
          - type: compare
            operator: eq
            left:
              type: field
              name: corpse_search_mode
            right:
              type: literal
              value: streamlined
  term_refs:
    - term.battle
- id: core.searching.corpses_hardcore
  name: Searching Corpses — Hardcore Mode
  section_id: section.into_the_dungeons.searching_corpses
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 97
      pdf_page: 99
      heading: Hardcore Mode
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: You can only search corpses that are adjacent to the hero. Searching one corpse and
    arranging that loot anyway you like (Backpack, Quick Slot, or Equipped) takes 1 AP. The benefit
    of this mode is that it is thematic and takes time, which means you risk triggering more
    threats.
  type: resource_change
  scope: dungeon
  fields:
    corpse_search_mode:
      type: string
      role: input
      description: Agreed corpse-search mode.
    corpse_adjacent:
      type: boolean
      role: input
      description: The corpse is adjacent to the searching hero.
    corpse_search_ap_cost:
      type: number
      role: output
      description: AP to search one corpse and arrange its loot.
      integer: true
      minimum: 0
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: corpse_search_mode
    right:
      type: literal
      value: hardcore
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: corpse_adjacent
        right:
          type: literal
          value: true
    - type: set
      target: corpse_search_ap_cost
      value:
        type: literal
        value: 1
  term_refs:
    - term.adjacent
    - term.quick_slot
- id: core.searching.corpses_streamlined
  name: Searching Corpses — Streamlined Mode
  section_id: section.into_the_dungeons.searching_corpses
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 97
      pdf_page: 99
      heading: Streamlined Mode
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Simply roll for loot from each defeated enemy after the battle and divide it between
    the heroes as you see fit without moving any heroes or spending any Action Points. Equipment may
    be placed in Quick Slots, Backpack, or be Equipped for free.
  type: resource_change
  scope: dungeon
  fields:
    corpse_search_mode:
      type: string
      role: input
      description: Agreed corpse-search mode.
    corpse_search_ap_cost:
      type: number
      role: output
      description: AP spent searching corpses.
      integer: true
      minimum: 0
    heroes_must_move:
      type: boolean
      role: output
      description: Heroes must move to search.
    loot_rolls_per_defeated_enemy:
      type: number
      role: output
      description: Loot rolls for each defeated enemy.
      integer: true
      minimum: 0
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: corpse_search_mode
    right:
      type: literal
      value: streamlined
  effects:
    - type: set
      target: corpse_search_ap_cost
      value:
        type: literal
        value: 0
    - type: set
      target: heroes_must_move
      value:
        type: literal
        value: false
    - type: set
      target: loot_rolls_per_defeated_enemy
      value:
        type: literal
        value: 1
  term_refs:
    - term.action_points
    - term.quick_slot
