        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In between battles, the professional will make sure to prepare for the next battle.
    That may include rearranging your gear. ... Trading gear between characters takes 1 AP for each
    character, and they need to be in LOS of each other. No need to be adjacent as we imagine they
    are tossing the gear to each other.
  see_also:
    - section.combat.different_combat_actions
  type: resource_change
  scope: dungeon
  fields:
