- id: core.gear.backpack_to_quick_slot_or_hands
  name: Rearranging your Gear — from the Backpack
  section_id: section.into_the_dungeons.rearranging_your_gear
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 97
      pdf_page: 99
      heading: Rearranging your Gear
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In between battles, the professional will make sure to prepare for the next battle.
    That may include rearranging your gear. Moving things from the Backpack to a Quick Slot or to
    your hands costs 2 AP.
  see_also:
    - section.equipment.backpack
    - section.combat.different_combat_actions
  type: resource_change
  scope: dungeon
  fields:
    in_battle:
      type: boolean
      role: input
      description: The party is in a battle. Rearranging your Gear applies in between battles.
    destination:
      type: string
      role: input
      description: 'Where the item moved from the Backpack goes: quick_slot or hands.'
    move_ap_cost:
      type: number
      role: output
      description: AP to move the item from the Backpack.
      integer: true
      minimum: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: in_battle
        right:
          type: literal
          value: false
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: destination
            right:
              type: literal
              value: quick_slot
          - type: compare
            operator: eq
            left:
              type: field
              name: destination
            right:
              type: literal
              value: hands
  effects:
    - type: set
      target: move_ap_cost
      value:
        type: literal
        value: 2
  term_refs:
    - term.quick_slot
    - term.battle
- id: core.gear.trading
