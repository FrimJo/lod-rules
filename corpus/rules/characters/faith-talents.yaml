- id: character.talent.devoted.eligibility
  name: 'Devoted: eligibility'
  section_id: section.appendix_ii_talents.faith_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 174
      printed_page: 172
      heading: 'Devoted: eligibility'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero gains an extra Energy Point that can only be used for praying.
  type: modifier
  scope: global
  entity_id: talent.devoted
  fields:
    profession:
      type: string
      role: input
      description: profession
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: warrior_priest
