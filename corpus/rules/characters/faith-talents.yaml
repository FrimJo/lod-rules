- id: character.talent.pure.demon_attack
  name: 'Pure: demon attack'
  section_id: section.appendix_ii_talents.faith_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 174
      printed_page: 172
      heading: 'Pure: demon attack'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The radiance of this priest hurts the eyes of all demons. Any demon trying to attack
    the priest does so at -10 CS.
  type: modifier
  scope: global
  entity_id: talent.pure
  fields:
    attacker_is_demon:
      type: boolean
      role: input
      description: attacker is demon
    attacking_priest:
      type: boolean
      role: input
      description: attacking priest
    enemy_combat_skill_modifier:
      type: number
      role: state
      description: enemy combat skill modifier
  effects:
    - type: add
      target: enemy_combat_skill_modifier
      value:
        type: literal
        value: -10
      duration: check
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: attacker_is_demon
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: attacking_priest
        right:
          type: literal
          value: true
