- id: character.talent.bruiser.bloodlust
  name: 'Bruiser: bloodlust'
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: 'Bruiser: bloodlust'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero excels at fighting with blunt weapons and Bloodlust is now triggered on a
    result of 1-10 when using all kinds of hammers, flails, staffs, and morning stars.
  type: modifier
  scope: global
  entity_id: talent.bruiser
  fields:
    weapon_kind:
      type: string
      role: input
      description: weapon kind
  effects:
    - type: replace_range
      dependency: bloodlust
      range:
        min: 1
        max: 10
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: weapon_kind
        right:
          type: literal
          value: hammer
      - type: compare
        operator: eq
        left:
          type: field
          name: weapon_kind
        right:
          type: literal
          value: flail
      - type: compare
        operator: eq
        left:
          type: field
          name: weapon_kind
        right:
          type: literal
          value: staff
      - type: compare
        operator: eq
        left:
          type: field
          name: weapon_kind
        right:
          type: literal
          value: morning_star
  dependencies:
    - key: bloodlust
      label: Bloodlust
      section_id: section.combat
