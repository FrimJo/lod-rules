- id: character.talent.death_lament.recover
  name: 'Death Lament: recover'
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: 'Death Lament: recover'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'When others fall, this hero still stands, refusing to give in. Each time your hero is
    reduced to 0 Hit Points, roll 1d6: on a result of 1-3, the hero regains 1 Hit Point.'
  type: modifier
  scope: global
  entity_id: talent.death_lament
  fields:
    reduced_to_zero_hp:
      type: boolean
      role: input
      description: reduced to zero hp
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    hit_points:
      type: number
      role: state
      description: hit points
  effects:
    - type: add
      target: hit_points
      value:
        type: literal
        value: 1
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: reduced_to_zero_hp
        right:
          type: literal
          value: true
      - type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 3
- id: character.talent.disarm.eligibility
  name: 'Disarm: eligibility'
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: 'Disarm: eligibility'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This is a special attack, using the target's DEX as a negative modifier to the attack.
    If the attack succeeds it inflicts no damage, but causes the enemy to drop their weapon. The
    enemy must spend their next action trying to pick it up. In order to do so, the enemy has to
    succeed with a DEX Test. The enemy will continue until successful. If the hero’s attack fails,
    nothing happens. This can only be used on enemies that are carrying weapons.
  type: modifier
  scope: global
  entity_id: talent.disarm
  fields:
    enemy_carrying_weapon:
      type: boolean
      role: input
      description: enemy carrying weapon
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: enemy_carrying_weapon
        right:
          type: literal
          value: true
