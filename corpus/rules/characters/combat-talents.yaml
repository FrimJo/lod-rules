- id: character.talent.fast_reload.bow_sling
  name: 'Fast Reload: bow sling'
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: 'Fast Reload: bow sling'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Years of practice makes your hero faster than most and they can reload in the blink of
    an eye. Bows and sling can be reloaded in the same action as shooting once per turn. Crossbows
    can be reloaded in 1 action and fired in the next. An Arbalest can be reloaded in 2 actions, and
    fired in the next turn.
  type: modifier
  scope: global
  entity_id: talent.fast_reload
  fields:
    weapon_kind:
      type: string
      role: input
      description: weapon kind
    used_this_turn:
      type: boolean
      role: input
      description: used this turn
    reload_with_shooting:
      type: boolean
      role: output
      description: reload with shooting
  effects:
    - type: set
      target: reload_with_shooting
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_kind
            right:
              type: literal
              value: bow
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_kind
            right:
              type: literal
              value: sling
      - type: compare
        operator: eq
        left:
          type: field
          name: used_this_turn
        right:
          type: literal
          value: false
