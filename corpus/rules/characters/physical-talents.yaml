- id: character.talent.resistance_to_disease.constitution_test
  name: 'Resistance to Disease: constitution test'
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 172
      printed_page: 170
      heading: 'Resistance to Disease: constitution test'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero seems to have a natural ability to resist diseases. Your hero gets a +25
    bonus on Constitution Tests to resist disease.
  type: modifier
  scope: global
  entity_id: talent.resistance_to_disease
  fields:
    test_stat:
      type: string
      role: input
      description: test stat
    test_purpose:
      type: string
      role: input
      description: test purpose
    check_modifier:
      type: number
      role: state
      description: check modifier
  effects:
    - type: add
      target: check_modifier
      value:
        type: literal
        value: 25
      duration: check
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: test_stat
        right:
          type: literal
          value: constitution
      - type: compare
        operator: eq
        left:
          type: field
          name: test_purpose
        right:
          type: literal
          value: resist_disease
- id: character.talent.observant.eligibility
  name: 'Observant: eligibility'
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 172
      printed_page: 170
      heading: 'Observant: eligibility'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Rangers only. Used to camping in dangerous places, a Ranger with this talent will
    convey a -10 modifier to the risk of an ambush during a rest in a dungeon. Furthermore, all
    members of the party will always start all battles standing up even if the quest or rules states
    otherwise. Any extra enemy initiative tokens due to a surprise or ambush is also negated by this
    talent.
  type: modifier
  scope: global
  entity_id: talent.observant
  fields:
    profession:
      type: string
      role: input
      description: profession
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: ranger
