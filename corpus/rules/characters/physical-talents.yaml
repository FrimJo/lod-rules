- id: character.talent.catlike.stat_bonus
  name: 'Catlike: stat bonus'
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 172
      printed_page: 170
      heading: 'Catlike: stat bonus'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero moves with grace and has almost supernatural balance. Your hero gains +5 DEX.
  type: modifier
  scope: global
  entity_id: talent.catlike
  fields:
    dexterity:
      type: number
      role: state
      description: dexterity
  effects:
    - type: add
      target: dexterity
      value:
        type: literal
        value: 5
      duration: permanent
