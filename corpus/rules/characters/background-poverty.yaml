- id: character.background.poverty.family_gift
  name: 'Poverty: family gift'
  section_id: section.backgrounds.9_poverty
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 45
      printed_page: 43
      heading: 'Poverty: family gift'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Accumulate 1000 c for your family. Pay them a visit and hand over the money. This can
    be done by spending one Point of Movement in that village, and it will grant you 2000 XP.
  type: scenario_rule
  scope: quest
  entity_id: background.poverty
  fields:
    at_family_village:
      type: boolean
      role: input
      description: at family village
    reward_already_received:
      type: boolean
      role: input
      description: reward already received
    coins:
      type: number
      role: state
      description: coins
    movement_points:
      type: number
      role: state
      description: movement points
    xp:
      type: number
      role: state
      description: xp
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: coins
        right:
          type: literal
          value: 1000
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: movement_points
        right:
          type: literal
          value: 1
    - type: add
      target: coins
      value:
        type: literal
        value: -1000
      duration: immediate
    - type: add
      target: movement_points
      value:
        type: literal
        value: -1
      duration: immediate
    - type: add
      target: xp
      value:
        type: literal
        value: 2000
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: at_family_village
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reward_already_received
        right:
          type: literal
          value: false
  quest_id: quest.background.poverty
