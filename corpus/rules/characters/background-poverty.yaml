- id: character.background.poverty.coin_reserve
  name: 'Poverty: coin reserve'
  section_id: section.backgrounds.9_poverty
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 45
      printed_page: 43
      heading: 'Poverty: coin reserve'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: You may never make a purchase, or lend out money, that would leave you with less than 10 c.
  type: modifier
  scope: global
  entity_id: background.poverty
  fields:
    coins_after_purchase_or_loan:
      type: number
      role: input
      description: coins after purchase or loan
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: coins_after_purchase_or_loan
        right:
          type: literal
          value: 10
- id: character.background.poverty.home_selection
  name: 'Poverty: home selection'
  section_id: section.backgrounds.9_poverty
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 45
      printed_page: 43
      heading: 'Poverty: home selection'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Randomise which village (not Silver City) in which you were born and raised. If you are
    a dwarf, randomise between the two Dwarven settlements.
  type: scenario_rule
  scope: quest
  entity_id: background.poverty
  fields:
    dwarf:
      type: boolean
      role: input
      description: dwarf
    selection_method:
      type: string
      role: output
      description: selection method
    home_pool:
      type: string
      role: output
      description: home pool
  effects:
    - type: set
      target: selection_method
      value:
        type: literal
        value: random
    - type: set
      target: home_pool
      value:
        type: literal
        value: villages_except_silver_city
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: dwarf
    right:
      type: literal
      value: false
  quest_id: quest.background.poverty
