- id: character.perk.connoisseur.identify
  name: 'Connoisseur: identify'
  section_id: section.appendix_i_perks.alchemist_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: Alchemist Perks
      locator:
        table: Alchemist Perks
        row: Connoisseur
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The alchemist has a knack for identifying potions brewed by others. Grants a +10 bonus
    to the Alchemy roll on your next attempt to identify a potion (only one per Energy Point). ...
    Energy Point is spent at the same time as you try to identify the potion.
  type: modifier
  scope: global
  entity_id: perk.connoisseur
  fields:
    profession:
      type: string
      role: input
      description: profession of the hero using the Perk
    identifying_potion:
      type: boolean
      role: input
      description: identifying potion
    alchemy_modifier:
      type: number
      role: state
      description: alchemy modifier
    potions_per_energy:
      type: number
      role: output
      description: potions per energy
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: alchemist
    - type: add
      target: alchemy_modifier
      value:
        type: literal
        value: 10
      duration: check
    - type: set
      target: potions_per_energy
      value:
        type: literal
        value: 1
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: identifying_potion
    right:
      type: literal
      value: true
