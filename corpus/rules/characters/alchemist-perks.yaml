- id: character.perk.careful_touch.activation
  name: 'Careful Touch: activation'
  section_id: section.appendix_i_perks.alchemist_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: 'Careful Touch: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    By taking a little extra time, that specific specimen can be perfect. Chance of getting
    an Exquisite Ingredient or Part is increased to 20. Declare before harvesting or gathering.
  type: modifier
  scope: global
  entity_id: perk.careful_touch
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
- id: character.perk.connoisseur.activation
