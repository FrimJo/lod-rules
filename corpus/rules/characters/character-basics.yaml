- id: character.sanity.zero_disorder
  name: Sanity at zero gives a disorder
  section_id: section.character_basics.the_character.sanity
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 25
      pdf_page: 27
      section: Character Basics
      heading: Sanity
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This is the mental status of your hero and as the game progresses, the Sanity of your
    hero will definitely decrease. If it reaches zero, your hero will contract a disorder. For more
    on Sanity, refer to page 53.
  type: trigger
  scope: global
  fields:
    sanity:
      type: number
      role: input
      description: Current Sanity after a loss.
      integer: true
      minimum: 0
    contracts_disorder:
      type: boolean
      role: output
      description: The hero contracts a disorder.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: sanity
    right:
      type: literal
      value: 0
  effects:
    - type: set
      target: contracts_disorder
      value:
        type: literal
        value: true
  dependencies:
    - key: condition
      label: At 0 Sanity, roll on the condition table
      section_id: section.psychology.sanity.conditions
      object_id: procedure.sanity_condition
  term_refs:
    - term.sanity
  see_also:
    - section.psychology.sanity
  optional_system: sanity
