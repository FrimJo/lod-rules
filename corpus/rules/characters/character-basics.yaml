      heading: Pick Locks (DEX)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This skill is used to open locked doors, chests, and also to disarm traps. Make a roll
    using the applicable modifiers. To open locks, you need a lock pick. The lock pick is consumed
    if you fail, and you may try as many times as you have picks. Each attempt takes 2 actions.
  type: constraint
  scope: dungeon
  fields:
    lock_picks:
      type: number
      role: input
      description: Lock picks carried before the attempt.
      integer: true
      minimum: 0
    actions_spent:
      type: number
      role: output
      description: Actions used by the attempt.
      integer: true
      minimum: 0
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: lock_picks
        right:
          type: literal
          value: 1
    - type: set
      target: actions_spent
      value:
        type: literal
        value: 2
  dependencies:
    - key: locked
      label: Opening a locked door or chest
      section_id: section.into_the_dungeons.opening_a_door_or_chest
      object_id: procedure.locked_door_and_close
  term_refs:
    - term.pick_locks
