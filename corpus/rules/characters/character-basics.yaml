      heading: Barter (WIS)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: medium
  source_text: This is your skill in making good deals when trading. When in town, one roll can be
    made by your hero to sell and buy items. A successful roll lets you buy equipment at a 10%
    discount and sell parts at a 10% higher price.
