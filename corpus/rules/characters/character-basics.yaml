- id: character.skill.pick_locks.open_lock
  name: picking a lock needs a lock pick and takes 2 actions
  section_id: section.character_basics.the_character.skills_list
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
