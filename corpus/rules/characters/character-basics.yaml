      type: boolean
      role: input
      description: Result of the hero’s one Barter roll in town.
    list_price:
      type: number
      role: input
      description: Printed price of the equipment.
      minimum: 0
    price_paid:
      type: number
      role: output
      description: Price after the discount; no rounding is printed.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: barter_succeeded
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: price_paid
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: list_price
          - type: literal
            value: 0.9
  dependencies:
    - key: buying
      label: Buying and Selling
      section_id: section.settlements.buying_and_selling
      object_id: character.settlement.buying
  term_refs:
    - term.barter
  issues:
    - issue.character_basics.barter_terms
