- id: character.party.composition
  name: party composition
  section_id: section.character_basics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 24
      pdf_page: 26
      section: Character Basics
      heading: Character Basics
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The party consists of your brave band of heroes. The game is designed around a party of
    4 members, but the player is free to choose a party with less members. Using mercenaries from
    the Companions’ Expansion is always an option if you decide to run a party with less
    bookkeeping. To form your party, you must first create each character.
  type: definition
  scope: global
  fields: {}
  effects: []
  dependencies:
    - key: party_size
      label: The game is designed for 4 characters
      section_id: section.game_basics.difficulty
      object_id: core.difficulty.party_size
    - key: mercenaries
      label: Mercenaries from the Companions’ Expansion
      external_document: companions_compendium
    - key: create_each_character
      label: Create each character
      section_id: section.creating_your_character
      object_id: procedure.character_creation
  term_refs:
    - term.party
    - term.heroes
