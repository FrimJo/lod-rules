- id: character.species.dwarf.bow_restriction
  name: Dwarf bow restriction
  section_id: section.creating_your_character.dwarf
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 30
      printed_page: 28
      heading: Dwarf bow restriction
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Due to their height, Dwarf characters cannot use Longbows or Elven bows.
  type: constraint
  scope: global
  fields:
    weapon:
      type: string
      role: input
      description: 'Supplied weapon name: longbow, elven_bow, or another weapon.'
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: ne
            left:
              type: field
              name: weapon
            right:
              type: literal
              value: longbow
          - type: compare
            operator: ne
            left:
              type: field
              name: weapon
            right:
              type: literal
              value: elven_bow
