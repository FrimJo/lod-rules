- id: character.species.halfling.cooking_gear
  name: Halfling Cooking gear offer
  section_id: section.creating_your_character.halfling
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 31
      printed_page: 29
      heading: Halfling Cooking gear offer
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A Halfling may purchase Cooking gear for 50 c before start of the game.
  type: choice
  scope: character_creation
  fields:
    purchase:
      type: string
      role: input
      description: buy or decline; offered only before the start of the game.
    coins:
      type: number
      role: state
      description: Coins available for the optional purchase.
    cooking_gear:
      type: boolean
      role: state
      description: Whether the Halfling possesses Cooking gear.
  effects:
    - type: choice
      selection: purchase
      options:
        - id: buy
          effects:
            - type: require
              condition:
                type: compare
                operator: gte
                left:
                  type: field
                  name: coins
                right:
                  type: literal
                  value: 50
            - type: add
              target: coins
              value:
                type: literal
                value: -50
              duration: immediate
            - type: set
              target: cooking_gear
              value:
                type: literal
                value: true
        - id: decline
          effects:
            - type: set
              target: cooking_gear
              value:
                type: field
                name: cooking_gear
