- id: character.talent.fast.movement
  name: Fast movement
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 170
      pdf_page: 172
      heading: Fast
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: Physical Talents
        row: Fast
  status: extracted
  confidence: high
  source_text: Your hero moves unusually fast and gains a permanent +1 bonus to their Movement stat.
  type: modifier
  scope: global
  fields:
    movement:
      type: number
      role: state
      description: movement
  effects:
    - type: add
      target: movement
      value:
        type: literal
        value: 1
      duration: permanent
  term_refs:
    - term.talent
    - term.movement
- id: character.talent.resistance_to_poison.constitution_test
  name: Resistance to Poison constitution test
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 170
      pdf_page: 172
      heading: Resistance to Poison
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: Physical Talents
        row: Resistance to Poison
  status: extracted
  confidence: high
  source_text:
    Your hero seems to have a natural ability to resist poison. Your hero gets a +25 bonus
    on Constitution Tests to resist poison.
  type: modifier
  scope: global
  fields:
    test_stat:
      type: string
      role: input
      description: test stat
    test_purpose:
      type: string
      role: input
      description: test purpose
    check_modifier:
      type: number
      role: state
      description: check modifier
  effects:
    - type: add
      target: check_modifier
      value:
        type: literal
        value: 25
      duration: check
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: test_stat
        right:
          type: literal
          value: constitution
      - type: compare
        operator: eq
        left:
          type: field
          name: test_purpose
        right:
          type: literal
          value: resist_poison
  term_refs:
    - term.talent
