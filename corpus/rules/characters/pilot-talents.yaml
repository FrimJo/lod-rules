- id: character.talent.axeman.bloodlust
  name: Axeman bloodlust
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 171
      pdf_page: 173
      heading: Axeman
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: Combat Talents
        row: Axeman
  status: extracted
  confidence: high
  source_text: Preferring the balance of a good axe, this hero has become a master of using this
    weapon. Bloodlust is now triggered on a result of 1-10 when using all kinds of axes.
  type: override
  scope: battle
  fields:
    weapon_family:
      type: string
      role: input
      description: weapon family
  effects:
    - type: replace_range
      dependency: bloodlust
      range:
        min: 1
        max: 10
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: weapon_family
    right:
      type: literal
      value: axe
  dependencies:
    - key: bloodlust
      label: Bloodlust
  term_refs:
    - term.talent
    - term.battle
