- id: character.talent.perfect_hearing.initiative
  name: Perfect Hearing initiative
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 170
      pdf_page: 172
      heading: Perfect Hearing
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: Physical Talents
        row: Perfect Hearing
  status: extracted
  confidence: high
  source_text:
    Your hero’s hearing is exceptionally good, and and you may add 1 hero initiative token
    to the first round of battle after opening a door and encountering enemies. This cannot be used
    if the door was broken down. This talent can only be given to a newly created character that has
    this Talent listed in the Species Description.
  type: modifier
  scope: battle
  fields:
    door_opened:
      type: boolean
      role: input
      description: door opened
    enemies_encountered:
      type: boolean
      role: input
      description: enemies encountered
    door_broken_down:
      type: boolean
      role: input
      description: door broken down
    first_round_of_battle:
      type: boolean
      role: input
      description: first round of battle
    use_talent:
      type: boolean
      role: input
      description: use talent
    hero_initiative_tokens:
      type: number
      role: state
      description: hero initiative tokens
  effects:
    - type: add
      target: hero_initiative_tokens
      value:
        type: literal
        value: 1
      duration: first_round_of_battle
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: door_opened
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: enemies_encountered
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: door_broken_down
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: first_round_of_battle
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: use_talent
        right:
          type: literal
          value: true
  see_also:
    - section.into_the_dungeons.initiative
  term_refs:
    - term.talent
    - term.battle
