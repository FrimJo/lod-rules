- id: character.perk.in_tune_with_the_magic.identification_focus
  name: 'In Tune with the Magic: identification focus'
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: 'In Tune with the Magic: identification focus'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Caster may use Focus before trying to identify a Magic Item. However, when attuning to
    the magic in that way, their mind is open enough to risk their sanity. Works just as if casting
    a spell but introduces miscast to the roll as well. 1 Action of Focus causes a miscast on 95-00.
    Increase the risk by 5 for each additional action.
  type: modifier
  scope: global
  entity_id: perk.in_tune_with_the_magic
  fields:
    identifying_magic_item:
      type: boolean
      role: input
      description: identifying magic item
    focus_actions:
      type: number
      role: input
      description: focus actions
      integer: true
      minimum: 1
    focus_allowed:
      type: boolean
      role: output
      description: focus allowed
    miscast_min_roll:
      type: number
      role: output
      description: miscast min roll
    miscast_max_roll:
      type: number
      role: output
      description: miscast max roll
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: identifying_magic_item
        right:
          type: literal
          value: true
    - type: set
      target: focus_allowed
      value:
        type: literal
        value: true
    - type: set
      target: miscast_min_roll
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: literal
            value: 95
          - type: arithmetic
            operator: multiply
            values:
              - type: literal
                value: 5
              - type: arithmetic
                operator: subtract
                values:
                  - type: field
                    name: focus_actions
                  - type: literal
                    value: 1
    - type: set
      target: miscast_max_roll
      value:
        type: literal
        value: 100
