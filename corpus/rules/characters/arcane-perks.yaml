- id: character.perk.in_tune_with_the_magic.activation
  name: 'In Tune with the Magic: activation'
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: 'In Tune with the Magic: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Caster may use Focus before trying to identify a Magic Item. However, when attuning to
    the magic in that way, their mind is open enough to risk their sanity. Works just as if casting
    a spell but introduces miscast to the roll as well. 1 Action of Focus causes a miscast on 95-00.
    Increase the risk by 5 for each additional action.
  type: modifier
  scope: global
  entity_id: perk.in_tune_with_the_magic
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
