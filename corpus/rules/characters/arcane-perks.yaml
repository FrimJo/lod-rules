- id: character.perk.dispel_master.activation
  name: 'Dispel Master: activation'
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: 'Dispel Master: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard is very skilled in the art of countering enemy magic. The wizard gets +20
    Arcane Arts when rolling to dispel when this Perk is used.
  type: modifier
  scope: global
  entity_id: perk.dispel_master
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
- id: character.perk.energy_to_mana.activation
  name: 'Energy to Mana: activation'
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: 'Energy to Mana: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard has the ability to turn energy into Mana. For each Energy Point spent, the
    wizard gains 20 Mana. The wizard may spend any number of Energy Points.
  type: modifier
  scope: global
  entity_id: perk.energy_to_mana
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy_spent:
      type: number
      role: input
      description: energy spent
      integer: true
      minimum: 1
    energy:
      type: number
      role: state
      description: energy
    mana:
      type: number
      role: state
      description: mana
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: field
          name: energy_spent
    - type: add
      target: energy
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: literal
            value: -1
          - type: field
            name: energy_spent
      duration: immediate
    - type: add
      target: mana
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: literal
            value: 20
          - type: field
            name: energy_spent
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
