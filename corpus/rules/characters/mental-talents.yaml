- id: character.talent.hate.selection
  name: 'Hate: selection'
  section_id: section.appendix_ii_talents.mental_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 178
      printed_page: 176
      heading: 'Hate: selection'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Through personal experience, or through the history of their kin, your hero has grown
    to hate certain enemies. This hate fuels their fighting, gaining a +5 bonus to CS when attacking
    those enemies. However, their hatred impairs their ability to parry and dodge (-5 parry/dodge)
    when struck by those enemies. The hero may choose one enemy to hate. If your hero hates goblins
    for instance, they hate every enemy with the word ‘Goblin’ in it. This Talent may be taken
    several times making the hero hate different enemies.
  type: modifier
  scope: global
  entity_id: talent.hate
  fields:
    chosen_enemy:
      type: string
      role: input
      description: chosen enemy
    repeatable_for_different_enemies:
      type: boolean
      role: output
      description: repeatable for different enemies
    match_enemy_name_word:
      type: boolean
      role: output
      description: match enemy name word
  effects:
    - type: set
      target: repeatable_for_different_enemies
      value:
        type: literal
        value: true
    - type: set
      target: match_enemy_name_word
      value:
        type: literal
        value: true
