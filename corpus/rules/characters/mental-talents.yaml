- id: character.talent.braveheart.fear_terror
  name: 'Braveheart: fear terror'
  section_id: section.appendix_ii_talents.mental_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 178
      printed_page: 176
      heading: 'Braveheart: fear terror'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero is braver than most. +10 bonus on Fear and Terror Tests.
  type: modifier
  scope: global
  entity_id: talent.braveheart
  fields:
    test_kind:
      type: string
      role: input
      description: test kind
    check_modifier:
      type: number
      role: state
      description: check modifier
  effects:
    - type: add
      target: check_modifier
      value:
        type: literal
        value: 10
      duration: check
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: test_kind
        right:
          type: literal
          value: fear
      - type: compare
        operator: eq
        left:
          type: field
          name: test_kind
        right:
          type: literal
          value: terror
