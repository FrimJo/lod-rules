- id: character.talent.fearless.prerequisite
  name: 'Fearless: prerequisite'
  section_id: section.appendix_ii_talents.mental_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 178
      printed_page: 176
      heading: 'Fearless: prerequisite'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero is completely immune to the effects of fear and treats terror as fear. This
    talent requires that the hero already has the Braveheart Mental Talent.
  type: modifier
  scope: global
  entity_id: talent.fearless
  fields:
    has_braveheart:
      type: boolean
      role: input
      description: has braveheart
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: has_braveheart
        right:
          type: literal
          value: true
