- id: character.talent.expert_mixer.eligibility
  name: 'Expert Mixer: eligibility'
  section_id: section.appendix_ii_talents.alchemist_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 174
      printed_page: 172
      heading: 'Expert Mixer: eligibility'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The Alchemist is a master of mixing offensive potions. All throwable potions that cause
    damage gets a +1DMG on every target.
  type: modifier
  scope: global
  entity_id: talent.expert_mixer
  fields:
    profession:
      type: string
      role: input
      description: profession
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: alchemist
