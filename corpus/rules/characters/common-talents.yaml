- id: character.talent.bard.instruments
  name: 'Bard: instruments'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Bard: instruments'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero gets a +10 WIS modifier when using instruments.
  type: modifier
  scope: global
  entity_id: talent.bard
  fields:
    using_instrument:
      type: boolean
      role: input
      description: using instrument
    wisdom_modifier:
      type: number
      role: state
      description: wisdom modifier
  effects:
    - type: add
      target: wisdom_modifier
      value:
        type: literal
        value: 10
      duration: check
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: using_instrument
    right:
      type: literal
      value: true
- id: character.talent.cartographer.exploration_deck
  name: 'Cartographer: exploration deck'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Cartographer: exploration deck'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero is skilled at drawing maps. If the hero passes a WIS test before entering a
    dungeon, the exploration deck is set up using 2 cards less than noted in the quest. Remove one
    corridor and one room. No matter how many heroes uses this talent, no more than 2 cards can be
    removed.
  type: modifier
  scope: global
  entity_id: talent.cartographer
  fields:
    wisdom_test_passed_before_dungeon:
      type: boolean
      role: input
      description: wisdom test passed before dungeon
    corridor_cards_removed:
      type: number
      role: output
      description: corridor cards removed
    room_cards_removed:
      type: number
      role: output
      description: room cards removed
    total_cartographer_removal_limit:
      type: number
      role: output
      description: total cartographer removal limit
  effects:
    - type: set
      target: corridor_cards_removed
      value:
        type: literal
        value: 1
    - type: set
      target: room_cards_removed
      value:
        type: literal
        value: 1
    - type: set
      target: total_cartographer_removal_limit
      value:
        type: literal
        value: 2
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: wisdom_test_passed_before_dungeon
    right:
      type: literal
      value: true
- id: character.talent.charming.reward_bonus
