- id: character.talent.pious.eligibility
  name: 'Pious: eligibility'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Pious: eligibility'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Your hero has a strong connection to the Gods. The hero may use relics, even though he
    or she is not a Warrior Priest. This talent cannot be chosen by a Warrior Priest.
  type: modifier
  scope: global
  entity_id: talent.pious
  fields:
    profession:
      type: string
      role: input
      description: profession
  effects:
    - type: require
      condition:
        type: compare
        operator: ne
        left:
          type: field
          name: profession
        right:
          type: literal
          value: warrior_priest
