- id: character.talent.master_cook.rest_healing
  name: 'Master Cook: rest healing'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Master Cook: rest healing'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: During a rest, the party members will regain +2 extra HP if they have rations, due to
    your hero’s expert cooking skills. This is not cumulative if more than one hero has this Talent.
  type: modifier
  scope: global
  entity_id: talent.master_cook
  fields:
    resting:
      type: boolean
      role: input
      description: resting
    has_rations:
      type: boolean
      role: input
      description: has rations
    master_cook_healing_bonus:
      type: number
      role: output
      description: master cook healing bonus
  effects:
    - type: set
      target: master_cook_healing_bonus
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: resting
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: has_rations
        right:
          type: literal
          value: true
