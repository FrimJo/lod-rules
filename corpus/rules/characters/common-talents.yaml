- id: character.talent.survivalist.beast_ration
  name: 'Survivalist: beast ration'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Survivalist: beast ration'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This talent lets your hero forage one ration from any monster in the Beast category (in
    a dungeon or after a skirmish), as long as the Forage roll is successful.
  type: modifier
  scope: global
  entity_id: talent.survivalist
  fields:
    monster_is_beast:
      type: boolean
      role: input
      description: monster is beast
    forage_succeeded:
      type: boolean
      role: input
      description: forage succeeded
    in_dungeon:
      type: boolean
      role: input
      description: in dungeon
    after_skirmish:
      type: boolean
      role: input
      description: after skirmish
    rations:
      type: number
      role: state
      description: rations
  effects:
    - type: add
      target: rations
      value:
        type: literal
        value: 1
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: monster_is_beast
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: forage_succeeded
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: in_dungeon
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: after_skirmish
            right:
              type: literal
              value: true
  dependencies:
    - key: beast
      label: Beast category membership
      external_document: bestiary
- id: character.talent.swift_leader.initiative
  name: 'Swift Leader: initiative'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Swift Leader: initiative'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The party may always add one initiative token to the bag. This is only used to increase
    chance of activation and all heroes may still only act once per turn. This is not a cumulative
    effect so only 1 token will be added even if more than one hero has this talent.
  type: modifier
  scope: global
  entity_id: talent.swift_leader
  fields:
    swift_leader_extra_tokens:
      type: number
      role: output
      description: swift leader extra tokens
    hero_activations_per_turn:
      type: number
      role: output
      description: hero activations per turn
  effects:
    - type: set
      target: swift_leader_extra_tokens
      value:
        type: literal
        value: 1
    - type: set
      target: hero_activations_per_turn
      value:
        type: literal
        value: 1
- id: character.talent.veteran.quick_slot
  name: 'Veteran: quick slot'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Veteran: quick slot'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero’s your gear is in perfect order, making changes in equipment very easy. You
    can use equipment from a Quick Slot without spending an Action Point (once per turn).
  type: modifier
  scope: global
  entity_id: talent.veteran
  fields:
    using_quick_slot_equipment:
      type: boolean
      role: input
      description: using quick slot equipment
    used_this_turn:
      type: boolean
      role: input
      description: used this turn
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: using_quick_slot_equipment
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: used_this_turn
        right:
          type: literal
          value: false
