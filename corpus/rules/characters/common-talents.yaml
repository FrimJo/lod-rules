  effects:
    - type: set
      target: quest_reward_bonus_percent
      value:
        type: literal
        value: 5
- id: character.talent.disciplined.own_resolve
  name: 'Disciplined: own resolve'
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: 'Disciplined: own resolve'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Thanks to a military background, this hero has an increased degree of calmness under
    pressure. This also spreads to the rest of the party. The hero gains +10 RES and the other
    members of the party gain +5 RES as long as the hero is not knocked out. The effect on the party
    is not cumulative if other heroes have the same talent. Furthermore, a hero with this talent
    will not benefit from the effect of this talent from another hero.
  type: modifier
  scope: global
  entity_id: talent.disciplined
  fields:
    resolve:
      type: number
      role: state
      description: resolve
  effects:
    - type: add
      target: resolve
      value:
        type: literal
        value: 10
      duration: permanent
