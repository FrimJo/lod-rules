- id: character.background.revenge_minotaur.recognition
  name: 'Revenge: recognition'
  section_id: section.backgrounds.16_revenge
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 47
      printed_page: 45
      section: Backgrounds
      heading: 16. Revenge
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Every time you fight a Minotaur, roll 1d6. On a result of 1, you recognize the scar.
  type: scenario_rule
  scope: quest
  entity_id: background.revenge_minotaur
  fields:
    fighting_minotaur:
      type: boolean
      role: input
      description: fighting minotaur
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    reward_already_received:
      type: boolean
      role: input
      description: The scarred Minotaur has already been defeated and its reward received; there is no scar left to recognise.
    recognize_scar:
      type: boolean
      role: output
      description: recognize scar
  effects:
    - type: set
      target: recognize_scar
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: fighting_minotaur
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: eq
        left:
          type: field
          name: reward_already_received
        right:
          type: literal
          value: false
  quest_id: quest.background.revenge_minotaur
  dependencies:
    - key: quest_enemy
      label: The scarred Minotaur
      object_id: quest_actor.background.scarred_minotaur
- id: character.background.revenge_minotaur.reward
  name: 'Revenge: reward'
  section_id: section.backgrounds.16_revenge
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 47
      printed_page: 45
      section: Backgrounds
      heading: 16. Revenge
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 23
      printed_page: null
      heading: '2.21'
      locator:
        row: 143
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If you defeat the beast, you gain an additional +.
  type: scenario_rule
  scope: quest
  entity_id: background.revenge_minotaur
  fields:
    recognize_scar:
      type: boolean
      role: input
      description: recognize scar
    beast_defeated:
      type: boolean
      role: input
      description: beast defeated
    reward_already_received:
      type: boolean
      role: input
      description: The reward for defeating the scarred Minotaur has already been received.
    xp:
      type: number
      role: state
      description: Hero XP. The printed amount is blank ("an additional +."); changelog 2.21
        entry 143 adds 1500XP.
  effects:
    - type: add
      target: xp
      value:
        type: literal
        value: 1500
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: recognize_scar
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: beast_defeated
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reward_already_received
        right:
          type: literal
          value: false
  quest_id: quest.background.revenge_minotaur
  issues:
    - issue.phase5.minotaur_reward_missing
  dependencies:
    - key: quest_enemy
      label: The scarred Minotaur
      object_id: quest_actor.background.scarred_minotaur
