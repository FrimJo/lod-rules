- id: character.perk.clever_fingers.activation
  name: 'Clever Fingers: activation'
  section_id: section.appendix_i_perks.sneaky_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 170
      printed_page: 168
      heading: 'Clever Fingers: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Relying on experience, the hero’s fingers dance across the mechanism. Add +25 bonus to
    a single pick lock or disarming trap attempt. Use before rolling.
  type: modifier
  scope: global
  entity_id: perk.clever_fingers
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
