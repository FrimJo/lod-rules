- id: character.perk.stunning_strike.attack
  name: 'Stunning Strike: attack'
  section_id: section.appendix_i_perks.combat_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: 'Stunning Strike: attack'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Your hero may choose to stun the enemy instead of inflicting wounds. Your hero performs
    a Standard Attack with a -10 CS penalty and if the attack is successful, the enemy may perform
    NO actions during its next turn. Only melee weapons. Does not work on X-Large creatures and
    Large creatures only lose 1 AP.
  type: modifier
  scope: global
  entity_id: perk.stunning_strike
  fields:
    melee_weapon:
      type: boolean
      role: input
      description: melee weapon
    target_size:
      type: string
      role: input
      description: target size
    combat_skill_modifier:
      type: number
      role: state
      description: combat skill modifier
    inflicts_wounds:
      type: boolean
      role: output
      description: inflicts wounds
    standard_attack:
      type: boolean
      role: output
      description: standard attack
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: melee_weapon
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: ne
        left:
          type: field
          name: target_size
        right:
          type: literal
          value: x_large
    - type: add
      target: combat_skill_modifier
      value:
        type: literal
        value: -10
      duration: check
    - type: set
      target: inflicts_wounds
      value:
        type: literal
        value: false
    - type: set
      target: standard_attack
      value:
        type: literal
        value: true
