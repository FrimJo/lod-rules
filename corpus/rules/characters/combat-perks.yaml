- id: character.perk.frenzy.activation
  name: 'Frenzy: activation'
  section_id: section.appendix_i_perks.combat_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: 'Frenzy: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Working into a frenzy, your hero flails wildly at their enemies. For each standard
    attack that damages the enemy, the hero may make one more standard attack for free. This attack
    does not have to be at the same target. While frenzied, all attacks have AP (1) which is
    cumulative with any other AP bonus. The hero may only move or attack and may do nothing else,
    including parrying, dodging or using potions. Barbarians only. Lasts for two turns. That means a
    maximum of 8 attacks can be done over the two Frenzied turns.
  type: modifier
  scope: global
  entity_id: perk.frenzy
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
