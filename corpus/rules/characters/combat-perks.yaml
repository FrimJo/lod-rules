- id: character.perk.battle_fury.activation
  name: 'Battle Fury: activation'
  section_id: section.appendix_i_perks.combat_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: 'Battle Fury: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Using their inner energy, your hero may perform 2 Power Attacks in one turn as if they
    only cost 1 AP.
  type: modifier
  scope: global
  entity_id: perk.battle_fury
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
