- id: character.creation.starting_coins
  name: start with 150 coins
  section_id: section.creating_your_character.starting_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Starting Equipment
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Apart from that, your hero starts with a pouch filled with 150 coins. You may choose to
    buy equipment using these coins before the game starts, or you may save them until after game
    has begun. You may also lend money to other characters or pool the money if you are so inclined.
    You will find all available equipment in the ‘Equipment’ Appendix on page 177, and rules
    regarding equipment on page 49.
  type: resource_change
  scope: character_creation
  fields:
    coins:
      type: number
      role: state
      description: Hero coins.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: coins
      value:
        type: literal
        value: 150
  dependencies:
    - key: creation
      label: Seeded when the species is chosen
      section_id: section.creating_your_character
      object_id: procedure.character_creation
  term_refs:
    - term.coins
  see_also:
    - section.appendix_iii_equipment
    - section.equipment
- id: character.creation.small_backpack
  name: start with a small backpack
  section_id: section.creating_your_character.starting_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Backpack
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: All heroes start the game with a small backpack, unless otherwise noted. This can be
    upgraded to a larger version that increases the character's carrying capacity.
  type: resource_change
  scope: character_creation
  fields:
    otherwise_noted:
      type: boolean
      role: input
      description: The profession or background notes a different backpack.
    backpack:
      type: string
      role: state
      description: Backpack carried.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: otherwise_noted
    right:
      type: literal
      value: false
  effects:
    - type: set
      target: backpack
      value:
        type: literal
        value: small
  issues:
    - issue.phase5.rogue_backpacks
- id: character.creation.buy_before_game
  name: buying equipment before the game
  section_id: section.creating_your_character.starting_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Buying Equipment before the Game
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The benefit of doing this is that you do not need to roll on availability. We assume
    that over time, you have managed to acquire the things you are looking for. The downside is that
    you will need to roll for damage on all things that could potentially be damaged.
  type: modifier
  scope: character_creation
  fields:
    bought_before_game:
      type: boolean
      role: input
      description: The equipment is bought before the game starts.
    availability_roll_required:
      type: boolean
      role: output
      description: An availability roll is required.
    damage_roll_required:
      type: boolean
      role: output
      description: Damage must be rolled for each damageable item.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: bought_before_game
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: availability_roll_required
      value:
        type: literal
        value: false
    - type: set
      target: damage_roll_required
      value:
        type: literal
        value: true
  dependencies:
    - key: wear
      label: Roll 1d4 wear per item
      section_id: section.creating_your_character.starting_equipment
      object_id: procedure.character_creation_equipment_wear
  optional_system: durability
- id: character.creation.buy_after_start
  name: buying equipment after the game starts
  section_id: section.creating_your_character.starting_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Buying Equipment After the Game Starts
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If you buy your gear after the game starts, you will use the stores as intended later
    in the game. If you buy your gear at a store, it will be in mint condition with no damage.
    However, you must roll for availability to make sure the gear you want is in stock (see page
    142).
  type: modifier
  scope: settlement
  fields:
    bought_before_game:
      type: boolean
      role: input
      description: The equipment is bought before the game starts.
    availability_roll_required:
      type: boolean
      role: output
      description: An availability roll is required.
    damage_roll_required:
      type: boolean
      role: output
      description: Damage must be rolled for each damageable item.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: bought_before_game
    right:
      type: literal
      value: false
  effects:
    - type: set
      target: availability_roll_required
      value:
        type: literal
        value: true
    - type: set
      target: damage_roll_required
      value:
        type: literal
        value: false
  dependencies:
    - key: buying
      label: Buying and Selling
      section_id: section.settlements.buying_and_selling
      object_id: character.settlement.buying
  see_also:
    - section.settlements.buying_and_selling
