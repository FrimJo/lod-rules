- id: character.creation.strength_weapon_class
  name: Strength and Weapon Class
  section_id: section.creating_your_character.choosing_your_species
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 27
      pdf_page: 29
      section: Creating your Character
      heading: Strength and Weapon Class
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    As mentioned before, strength will govern the weight of the weapons that your hero can
    use. Weapons come in classes ranging from 1-6. Generally, the higher the class, the heavier the
    weapon. Heavy weapons require high strength to use effectively. Some weapons can be used with
    either two hands or one hand, depending on your strength, whilst some weapons always require two
    hands. Ranged Weapons in class 6 may not be heavy per se; nevertheless, they require two hands
    to operate. This is explained in the Equipment Section as well.
  type: definition
  scope: character_creation
  fields: {}
  effects: []
  dependencies:
    - key: class_table
      label: Class / 2H STR req / 1H STR req
      section_id: section.creating_your_character.choosing_your_species.table
      object_id: table.equipment.weapon_class_strength
    - key: one_hand
      label: One-handed STR requirement
      section_id: section.equipment.weapon_class
      object_id: character.equipment.weapon_class.one_hand
    - key: two_hands
      label: Two-handed STR requirement
      section_id: section.equipment.weapon_class
      object_id: character.equipment.weapon_class.two_hands
  uses_tables:
    - table.equipment.weapon_class_strength
  term_refs:
    - term.strength
  see_also:
    - section.equipment.weapon_class
- id: character.creation.profession_talents
  name: choose a profession and its talents
  section_id: section.creating_your_character.profession_and_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Profession and Talents
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The next task is to choose one of the professions which are described from page 32 on.
    Once you have found a profession that suits you and your character, you should start to choose
    between the Talents noted in the Profession Description. Some of these Talents may adjust your
    basic stats. In such cases, write down the new value on the Character Sheet. Some Talents may
    also add to your Skill Values. In such cases, the Skill Level is increased, but the basic stat
    remains unchanged.
  type: definition
  scope: character_creation
  fields: {}
  effects: []
  dependencies:
    - key: creation
      label: Character creation sequence
      section_id: section.creating_your_character
      object_id: procedure.character_creation
    - key: skill
      label: Talent skill bonuses leave the basic stat unchanged
      section_id: section.creating_your_character.profession_and_talents
      object_id: procedure.character_creation_skill
  term_refs:
    - term.talent
    - term.stat
    - term.skill
  see_also: &a5
    - section.creating_your_character.alchemist
    - section.creating_your_character.barbarian
    - section.creating_your_character.ranger
    - section.creating_your_character.rogue
    - section.creating_your_character.thief
    - section.creating_your_character.warrior
    - section.creating_your_character.warrior_priest
    - section.creating_your_character.wizard
- id: character.skill.starting_value
  name: starting skill is basic stat plus profession modifier
  section_id: section.creating_your_character.profession_and_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Skills
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Each Skill is calculated as the skill’s basic stat plus a profession-specific modifier.
    These modifiers can be found in the Profession Descriptions which start on page 32. A Skill
    Level can never be negative.
  type: calculation
  scope: character_creation
  fields:
    base_stat:
      type: number
      role: input
      description: The skill’s basic stat.
      integer: true
      minimum: 0
    profession_modifier:
      type: number
      role: input
      description: Modifier from the profession skill table.
      integer: true
      minimum: -100
    skill_value:
      type: number
      role: output
      description: Skill Level, never negative.
      integer: true
      minimum: 0
  effects:
    - type: set
      target: skill_value
      value:
        type: arithmetic
        operator: max
        values:
          - type: literal
            value: 0
          - type: sum
            values:
              - type: field
                name: base_stat
              - type: field
                name: profession_modifier
  dependencies:
    - key: base_stat
      label: Base stat of each skill
      section_id: section.character_basics.the_character.skills_list
      object_id: character.skill.base_stat
    - key: procedure
      label: Calculate one starting skill
      section_id: section.creating_your_character.profession_and_talents
      object_id: procedure.character_creation_skill
  term_refs:
    - term.skill
  see_also: *a5
- id: character.skill.free_skill
  name: Free Skill adds +10 to one negative modifier
  section_id: section.creating_your_character.profession_and_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 30
      pdf_page: 32
      section: Creating your Character
      heading: Free Skill
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: You may choose one skill that has a negative modifier to improve. This Skill Value
    gains a modifier of +10.
  type: modifier
  scope: character_creation
  fields:
    use_free_skill:
      type: boolean
      role: input
      description: This skill is the one chosen for the Free Skill.
    profession_modifier:
      type: number
      role: input
      description: Printed profession modifier for the skill.
      integer: true
      minimum: -100
    modifier_after:
      type: number
      role: output
      description: Modifier including the Free Skill bonus.
      integer: true
      minimum: -100
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: use_free_skill
    right:
      type: literal
      value: true
  effects:
    - type: require
      condition:
        type: compare
        operator: lt
        left:
          type: field
          name: profession_modifier
        right:
          type: literal
          value: 0
    - type: set
      target: modifier_after
      value:
        type: sum
        values:
          - type: field
            name: profession_modifier
          - type: literal
            value: 10
  dependencies:
    - key: procedure
      label: Calculate one starting skill and optional Free Skill
      section_id: section.creating_your_character.profession_and_talents
      object_id: procedure.character_creation_skill
  term_refs:
    - term.skill
    - term.modifier
