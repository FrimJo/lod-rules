- id: character.advancement.improvement_points
  name: 15 Improvement Points on level up
  section_id: section.levelling_up.increasing_your_skills_and_basic_stats
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 59
      pdf_page: 61
      section: Levelling Up
      heading: Increasing your Skills and Basic Stats
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Whenever your hero levels up, you may choose which basic stats and skills to increase.
    Each profession is slightly different though as it is easier for a barbarian to master combat
    skills, and a thief will be more adept at learning to pick locks. You have 15 Improvement Points
    to spend on stat and skill increases. The table below tells you how many Improvement Points it
    costs to increase a stat or skill by +1.
  type: resource_change
  scope: settlement
  fields:
    levelled_up:
      type: boolean
      role: input
      description: The hero has just levelled up.
    improvement_points:
      type: number
      role: state
      description: Unspent Improvement Points.
      integer: true
      minimum: 0
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: levelled_up
    right:
      type: literal
      value: true
  effects:
    - type: add
      target: improvement_points
      value:
        type: literal
        value: 15
      duration: permanent
  dependencies:
    - key: improve
      label: Spend one Improvement Point purchase
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats
      object_id: procedure.character_improve
    - key: level_up
      label: Level advancement session
      section_id: section.levelling_up
      object_id: procedure.character_level_up
  uses_tables:
    - table.character.improvement_costs
- id: character.advancement.increase_limits
  name: per-level increase limits
  section_id: section.levelling_up.increasing_your_skills_and_basic_stats
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 59
      pdf_page: 61
      section: Levelling Up
      heading: Increasing your Skills and Basic Stats
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: No skill or stat may be increased more than +5 per level. Hit points may only be
    increased by +2 per level.
  type: constraint
  scope: settlement
  fields:
    kind:
      type: string
      role: input
      description: stat, skill or hit_points.
    increase_this_level:
      type: number
      role: input
      description: Total increase of this stat, skill or Hit Points at this level, after the purchase.
      integer: true
      minimum: 0
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: kind
                right:
                  type: literal
                  value: hit_points
              - type: compare
                operator: lte
                left:
                  type: field
                  name: increase_this_level
                right:
                  type: literal
                  value: 2
          - type: all
            conditions:
              - type: compare
                operator: ne
                left:
                  type: field
                  name: kind
                right:
                  type: literal
                  value: hit_points
              - type: compare
                operator: lte
                left:
                  type: field
                  name: increase_this_level
                right:
                  type: literal
                  value: 5
  dependencies:
    - key: improve
      label: Spend one Improvement Point purchase
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats
      object_id: procedure.character_improve
  issues:
    - issue.character.level_hit_point_limit
