- id: character.perk.gods_favourite.activation
  name: 'God’s Favourite: activation'
  section_id: section.appendix_i_perks.faith_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 168
      printed_page: 166
      heading: 'God’s Favourite: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero is well attuned to the gods, and they always seem to listen to him. Once
    again, his prayer is heard, and all problems seem smaller. Decrease the Threat Level by 1d6.
  type: modifier
  scope: global
  entity_id: perk.gods_favourite
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
- id: character.perk.gods_favourite.threat
  name: 'God’s Favourite: threat'
