- id: character.perk.healer.bandage
  name: 'Healer: bandage'
  section_id: section.appendix_i_perks.faith_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 168
      printed_page: 166
      heading: 'Healer: bandage'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Putting that extra effort into tending a wound can make such a difference. When
    applying a bandage, this Perk adds +3 HP to the result. Used at the same time as the Healing
    Skill.
  type: modifier
  scope: global
  entity_id: perk.healer
  fields:
    applying_bandage:
      type: boolean
      role: input
      description: applying bandage
    using_healing_skill:
      type: boolean
      role: input
      description: using healing skill
    healing:
      type: number
      role: state
      description: healing
  effects:
    - type: add
      target: healing
      value:
        type: literal
        value: 3
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: applying_bandage
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: using_healing_skill
        right:
          type: literal
          value: true
