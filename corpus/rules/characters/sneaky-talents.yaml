- id: character.talent.cutpurse.attempt
  name: 'Cutpurse: attempt'
  section_id: section.appendix_ii_talents.sneaky_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 177
      printed_page: 175
      heading: 'Cutpurse: attempt'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Once per visit in a settlement, your hero may try to steal the purse from some
    unsuspecting victim. This must be done as the first thing when entering a settlement. Roll 1d6.
    On a result of 1-2 the hero gains 1d100 coins. On a result of 6, the attempt is detected, and
    the hero is immediately chased out of the settlement. The hero may do nothing until the rest of
    the party decides to leave the settlement. Rations must be used as normal, and if rations are
    lacking, the hero becomes hungry. Foraging is allowed while waiting.
  type: modifier
  scope: global
  entity_id: talent.cutpurse
  fields:
    first_thing_on_entry:
      type: boolean
      role: input
      description: first thing on entry
    attempts_this_visit:
      type: number
      role: input
      description: attempts this visit
    attempt_roll:
      type: number
      role: input
      description: attempt roll
      integer: true
      minimum: 1
      maximum: 6
    coin_roll:
      type: number
      role: input
      description: coin roll
      integer: true
      minimum: 1
      maximum: 100
    coins:
      type: number
      role: state
      description: coins
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: first_thing_on_entry
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: attempts_this_visit
        right:
          type: literal
          value: 0
