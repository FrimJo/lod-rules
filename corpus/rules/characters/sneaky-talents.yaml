- id: character.talent.assassin.automatic_hit
  name: 'Assassin: automatic hit'
  section_id: section.appendix_ii_talents.sneaky_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 177
      printed_page: 175
      heading: 'Assassin: automatic hit'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    With uncanny precision, the hero automatically hits any target from behind with a class
    1 or 2 weapon.
  type: modifier
  scope: global
  entity_id: talent.assassin
  fields:
    from_behind:
      type: boolean
      role: input
      description: from behind
    weapon_class:
      type: number
      role: input
      description: weapon class
    automatic_hit:
      type: boolean
      role: output
      description: automatic hit
  effects:
    - type: set
      target: automatic_hit
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: from_behind
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_class
            right:
              type: literal
              value: 1
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_class
            right:
              type: literal
              value: 2
