- id: character.luck.reroll
  name: luck reroll
  section_id: section.character_basics.the_character.luck_l
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 24
      pdf_page: 26
      heading: Luck (L)
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: A hero can use one Luck Point to reroll a dice roll that directly affects them. A
    reroll can never be rerolled. Regardless of outcome, the new roll must be accepted.
  type: calculation
  scope: global
  fields:
    directly_affects_hero:
      type: boolean
      role: input
      description: directly affects hero
    already_rerolled:
      type: boolean
      role: input
      description: already rerolled
    luck:
      type: number
      role: state
      description: luck
    new_roll:
      type: number
      role: input
      description: new roll
    accepted_roll:
      type: number
      role: state
      description: accepted roll
  effects:
    - type: add
      target: luck
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: accepted_roll
      value:
        type: field
        name: new_roll
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: directly_affects_hero
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: already_rerolled
        right:
          type: literal
          value: false
      - type: compare
        operator: gte
        left:
          type: field
          name: luck
        right:
          type: literal
          value: 1
