- id: character.skill.stat_independence
  name: skill stat independence
  section_id: section.character_basics.the_character.skills
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 25
      pdf_page: 27
      heading: Skills
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: However, once play commences, basic stats and skills are no longer connected.
    Increasing a basic stat will not increase the skill.
  type: calculation
  scope: global
  fields:
    skill:
      type: number
      role: input
      description: skill
    basic_stat_increase:
      type: number
      role: input
      description: basic stat increase
    skill_after:
      type: number
      role: state
      description: skill after
  effects:
    - type: set
      target: skill_after
      value:
        type: field
        name: skill
- id: character.skill.known
  name: skill known
  section_id: section.character_basics.the_character.skills
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 25
      pdf_page: 27
      heading: Skills
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: All heroes know all skills (except Arcane Arts and Battle Prayers).
  type: calculation
  scope: global
  fields:
    skill_name:
      type: string
      role: input
      description: skill name
    known:
      type: boolean
      role: state
      description: known
  effects:
    - type: set
      target: known
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: ne
        left:
          type: field
          name: skill_name
        right:
          type: literal
          value: Arcane Art
      - type: compare
        operator: ne
        left:
          type: field
          name: skill_name
        right:
          type: literal
          value: Battle Prayers
