- id: character.mana.initial
  name: mana initial
  section_id: section.creating_your_character.mana
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 27
      pdf_page: 29
      heading: Mana
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Mana is only used by wizards, and the starting mana is equal to the wizard’s WISx1,5.
  type: calculation
  scope: global
  fields:
    wis:
      type: number
      role: input
      description: wis
    mana:
      type: number
      role: state
      description: mana
    wizard:
      type: boolean
      role: input
      description: The character is a wizard.
  effects:
    - type: set
      target: mana
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: wis
          - type: literal
            value: 1.5
  issues:
    - issue.phase4.mana_rounding
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: wizard
    right:
      type: literal
      value: true
- id: character.energy.initial
  name: energy initial
  section_id: section.character_basics.the_character.energy_e
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 24
      pdf_page: 26
      heading: Energy (E)
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Each hero has a pool of 1 Energy at the start, unless otherwise stated.
  type: calculation
  scope: global
  fields:
    otherwise_stated:
      type: boolean
      role: input
      description: otherwise stated
    energy:
      type: number
      role: state
      description: energy
  effects:
    - type: set
      target: energy
      value:
        type: literal
        value: 1
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: otherwise_stated
    right:
      type: literal
      value: false
  term_refs:
    - term.energy
- id: character.energy.perk
  name: energy perk
  section_id: section.character_basics.the_character.perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 25
      pdf_page: 27
      heading: Perks
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Perks can be used at the cost of energy during a hero’s activation.
  type: calculation
  scope: global
  fields:
    during_own_activation:
      type: boolean
      role: input
      description: during own activation
    energy:
      type: number
      role: state
      description: energy
    perk_cost:
      type: number
      role: input
      description: perk cost
  effects:
    - type: add
      target: energy
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: perk_cost
          - type: literal
            value: -1
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: during_own_activation
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: field
          name: perk_cost
  term_refs:
    - term.energy
    - term.perk
