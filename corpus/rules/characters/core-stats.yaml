- id: character.stat.maximum_str
  name: stat maximum str
  section_id: section.levelling_up.stats_and_skills_maximum
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 58
      pdf_page: 60
      heading: Stats and Skills Maximum
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: There is a maximum value for each stat depending on their race.
  type: calculation
  scope: global
  fields:
    race:
      type: string
      role: input
      description: race
    value:
      type: number
      role: input
      description: value
    maximum:
      type: number
      role: state
      description: maximum
  effects:
    - type: lookup
      table_id: table.character.stat_maxima
      key_column: race
      key:
        type: field
        name: race
      value_column: str
      target: maximum
      on_missing_issue: issue.phase4.lookup_domain
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: value
        right:
          type: field
          name: maximum
  uses_tables:
    - table.character.stat_maxima
