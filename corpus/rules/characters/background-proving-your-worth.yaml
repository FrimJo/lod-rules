- id: character.background.proving_your_worth.claim_armour
  name: 'Proving Your Worth: claim armour'
  section_id: section.backgrounds.10_proving_your_worth
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 45
      printed_page: 43
      heading: 'Proving Your Worth: claim armour'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 46
      printed_page: 44
      heading: 'Proving Your Worth: claim armour'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Return to your father to claim the armour. Gaining the armour can be done by simply
    spending one Point of Movement in that location. This is the Armour of the Father as described
    in the ‘Legendary Items’ chapter.
  type: scenario_rule
  scope: quest
  entity_id: background.proving_your_worth
  fields:
    qualified:
      type: boolean
      role: input
      description: qualified
    at_family_village:
      type: boolean
      role: input
      description: at family village
    reward_already_received:
      type: boolean
      role: input
      description: reward already received
    movement_points:
      type: number
      role: state
      description: movement points
    armour_of_the_father:
      type: boolean
      role: output
      description: armour of the father
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: movement_points
        right:
          type: literal
          value: 1
    - type: add
      target: movement_points
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: armour_of_the_father
      value:
        type: literal
        value: true
    - type: invoke
      dependency: armour
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: qualified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: at_family_village
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reward_already_received
        right:
          type: literal
          value: false
  dependencies:
    - key: armour
      label: Armour of the Father
      section_id: section.appendix_v_treasures.legendary_items.armour_of_the_father
  quest_id: quest.background.proving_your_worth
