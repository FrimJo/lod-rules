- id: character.background.fables.reward
  name: 'Fables: reward'
  section_id: section.backgrounds.3_fables
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 42
      printed_page: 40
      heading: 'Fables: reward'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Personal Quest: Visit 3 Quest Sites in the Ancient Lands. Once you leave the third
    site, you gain 1500 XP.'
  type: scenario_rule
  scope: quest
  entity_id: background.fables
  fields:
    ancient_lands_quest_sites_visited:
      type: number
      role: input
      description: ancient lands quest sites visited
    leaving_third_site:
      type: boolean
      role: input
      description: leaving third site
    reward_already_received:
      type: boolean
      role: input
      description: reward already received
    xp:
      type: number
      role: state
      description: xp
  effects:
    - type: add
      target: xp
      value:
        type: literal
        value: 1500
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: ancient_lands_quest_sites_visited
        right:
          type: literal
          value: 3
      - type: compare
        operator: eq
        left:
          type: field
          name: leaving_third_site
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reward_already_received
        right:
          type: literal
          value: false
  quest_id: quest.background.fables
