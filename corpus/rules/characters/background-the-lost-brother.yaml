- id: character.background.the_lost_brother.quest_setup
  name: 'The Lost Brother: quest setup'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: At the start of each quest, roll 1d10. On a roll of 1, the dungeon you are heading to
    is the one in which you will find your brother. Place a secondary Quest Card in the pile not
    containing the Quest Room. The tile you enter next will contain your brother.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    at_quest_start:
      type: boolean
      role: input
      description: The roll is made at the start of a quest.
    quest_start_roll:
      type: number
      role: input
      description: quest start roll
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    brother_found:
      type: boolean
      role: input
      description: The brother has already been found, dead or alive; the quest is to find the one brother.
    secondary_card_location:
      type: string
      role: output
      description: secondary card location
    brother_on_next_tile:
      type: boolean
      role: output
      description: brother on next tile
  effects:
    - type: set
      target: secondary_card_location
      value:
        type: literal
        value: pile_without_quest_room
    - type: set
      target: brother_on_next_tile
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: at_quest_start
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: quest_start_roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_found
        right:
          type: literal
          value: false
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.discovery
  name: 'The Lost Brother: discovery'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    For this quest, you need to keep track of how many dungeons you have entered. ... Once
    you enter the room, roll 1d100, adding the number of dungeons you have entered.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    brother_on_next_tile:
      type: boolean
      role: input
      description: The quest-start roll placed the brother on the next tile entered.
    entered_brother_room:
      type: boolean
      role: input
      description: The hero has entered the room that contains the brother.
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 100
      dice:
        count: 1
        sides: 100
    dungeons_entered:
      type: number
      role: input
      description: Number of dungeons the hero has entered, tracked for this quest.
      integer: true
      minimum: 0
    result:
      type: number
      role: output
      description: result
  effects:
    - type: set
      target: result
      value:
        type: sum
        values:
          - type: field
            name: roll
          - type: field
            name: dungeons_entered
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_on_next_tile
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: entered_brother_room
        right:
          type: literal
          value: true
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.remains_found
  name: 'The Lost Brother: remains found'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the result is 60 or higher, you are too late and you find the remains of your dear
    brother on the floor, dead. It seems that he has been dead for some time. Devastated, you must
    decide if you will leave him where he is, or bring him out of the dungeon and bury him.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    result:
      type: number
      role: input
      description: Discovery total (1d100 plus dungeons entered).
    brother_dead:
      type: boolean
      role: output
      description: The brother is found dead.
    brother_alive:
      type: boolean
      role: output
      description: brother alive
    burial_choice:
      type: string
      role: input
      description: The hero's decision, leave him where he is or bring him out and bury him.
    burying_brother:
      type: boolean
      role: output
      description: The hero chose to carry the body for burial.
  effects:
    - type: set
      target: brother_dead
      value:
        type: literal
        value: true
    - type: set
      target: brother_alive
      value:
        type: literal
        value: false
    - type: choice
      selection: burial_choice
      options:
        - id: leave
          effects:
            - type: set
              target: burying_brother
              value:
                type: literal
                value: false
        - id: bury
          effects:
            - type: set
              target: burying_brother
              value:
                type: literal
                value: true
  when:
    type: compare
    operator: gte
    left:
      type: field
      name: result
    right:
      type: literal
      value: 60
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.surviving_brother
  name: 'The Lost Brother: surviving brother'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 23
      printed_page: null
      heading: '2.21'
      locator:
        row: 142
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If the result is lower than 60, your brother is alive, but badly wounded. Place him on
    the tile and you may move him just like the other heroes. Use the civilian Monster Card to
    represent him.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    result:
      type: number
      role: input
      description: result
    brother_alive:
      type: boolean
      role: state
      description: brother alive
    brother_wounded:
      type: boolean
      role: output
      description: brother wounded
    movement_like_heroes:
      type: boolean
      role: output
      description: movement like heroes
    representing_monster_card:
      type: string
      role: output
      description: Monster Card that represents the brother. The page prints the civilian Monster
        Card; changelog 2.21 entry 142 changes it to the Bandit Monster Card.
  effects:
    - type: set
      target: brother_alive
      value:
        type: literal
        value: true
    - type: set
      target: brother_wounded
      value:
        type: literal
        value: true
    - type: set
      target: movement_like_heroes
      value:
        type: literal
        value: true
    - type: set
      target: representing_monster_card
      value:
        type: literal
        value: Bandit Monster Card
    - type: invoke
      dependency: monster_card
  when:
    type: compare
    operator: lt
    left:
      type: field
      name: result
    right:
      type: literal
      value: 60
  dependencies:
    - key: monster_card
      label: Bandit Monster Card (printed as the civilian Monster Card; changelog 2.21 entry 142)
      external_document: bestiary
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
  quest_id: quest.background.the_lost_brother
  issues:
    - issue.backgrounds.lost_brother_monster_card
- id: character.background.the_lost_brother.death_consequences
  name: 'The Lost Brother: death consequences'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In both cases you lose 3 Points of Sanity, but gain 250 XP.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    brother_dead:
      type: boolean
      role: input
      description: brother dead
    death_consequences_received:
      type: boolean
      role: input
      description: death consequences received
    sanity:
      type: number
      role: state
      description: sanity
    xp:
      type: number
      role: state
      description: xp
  effects:
    - type: add
      target: sanity
      value:
        type: literal
        value: -3
      duration: immediate
    - type: add
      target: xp
      value:
        type: literal
        value: 250
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_dead
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: death_consequences_received
        right:
          type: literal
          value: false
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.carrying_restrictions
  name: 'The Lost Brother: carrying restrictions'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If you choose to bury him, you must carry him through the dungeon (of course letting go
    of him when danger approaches). The downside of this is that you cannot carry anything else you
    find (you may not search for treasures, or carry anything your comrades find).
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    burying_brother:
      type: boolean
      role: input
      description: burying brother
    danger_approaches:
      type: boolean
      role: input
      description: danger approaches
    must_carry_body:
      type: boolean
      role: output
      description: must carry body
    search_treasure_allowed:
      type: boolean
      role: output
      description: search treasure allowed
    carry_found_items_allowed:
      type: boolean
      role: output
      description: carry found items allowed
  effects:
    - type: set
      target: must_carry_body
      value:
        type: literal
        value: true
    - type: set
      target: search_treasure_allowed
      value:
        type: literal
        value: false
    - type: set
      target: carry_found_items_allowed
      value:
        type: literal
        value: false
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: burying_brother
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: danger_approaches
        right:
          type: literal
          value: false
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
