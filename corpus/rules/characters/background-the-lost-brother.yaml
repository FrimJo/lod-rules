    burial_reward_received:
      type: boolean
      role: input
      description: burial reward received
    resolve:
      type: number
      role: state
      description: resolve
  effects:
    - type: add
      target: resolve
      value:
        type: literal
        value: 10
      duration: permanent
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: buried_brother_outside
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: burial_reward_received
        right:
          type: literal
          value: false
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.rescue_reward
  name: 'The Lost Brother: rescue reward'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If your brother makes it out alive, he will accompany you to the next settlement where
    you will part ways. You gain 1500 XP once you reach the settlement.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    brother_alive:
      type: boolean
      role: input
      description: brother alive
    reached_next_settlement:
      type: boolean
      role: input
      description: reached next settlement
    rescue_reward_received:
      type: boolean
      role: input
      description: rescue reward received
    xp:
      type: number
      role: state
      description: xp
  effects:
    - type: add
      target: xp
      value:
        type: literal
        value: 1500
      duration: immediate
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_alive
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: reached_next_settlement
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: rescue_reward_received
        right:
          type: literal
          value: false
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
- id: character.background.the_lost_brother.death_after_rescue
  name: 'The Lost Brother: death after rescue'
  section_id: section.backgrounds.6_the_lost_brother
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 44
      printed_page: 42
      section: Backgrounds
      heading: 6. The Lost Brother
      locator:
        paragraph: Personal Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If he dies during the dungeon crawl, revert to ‘result higher than 60’. If he dies in a
    skirmish, you do not need to carry him further, but the end result is the same.
  type: scenario_rule
  scope: quest
  entity_id: background.the_lost_brother
  fields:
    died_in_dungeon:
      type: boolean
      role: input
      description: died in dungeon
    died_in_skirmish:
      type: boolean
      role: input
      description: died in skirmish
    apply_death_result:
      type: boolean
      role: output
      description: apply death result
    brother_alive:
      type: boolean
      role: state
      description: The rescued brother was alive before he died.
    brother_dead:
      type: boolean
      role: output
      description: Reverting to the dead-brother result.
  effects:
    - type: set
      target: apply_death_result
      value:
        type: literal
        value: true
    - type: set
      target: brother_alive
      value:
        type: literal
        value: false
    - type: set
      target: brother_dead
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: brother_alive
        right:
          type: literal
          value: true
      - type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: died_in_dungeon
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: died_in_skirmish
            right:
              type: literal
              value: true
  quest_id: quest.background.the_lost_brother
  dependencies:
    - key: lost_brother
      label: The hero’s lost brother
      object_id: quest_actor.background.lost_brother
