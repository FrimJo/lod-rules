- id: character.profession.ranger.equipment_limits
  name: Ranger equipment limits
  section_id: section.creating_your_character.ranger
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 36
      printed_page: 34
      heading: Limitations
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Rangers may never use armour heavier than Tier 3.
  type: constraint
  scope: global
  fields:
    armour_tier:
      type: number
      role: input
      description: Armour Tier
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: armour_tier
        right:
          type: literal
          value: 3
