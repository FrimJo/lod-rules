- id: character.perk.call_to_action.activation
  name: 'Call to Action: activation'
  section_id: section.appendix_i_perks.leader_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 168
      printed_page: 166
      heading: 'Call to Action: activation'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero lets out a battle shout that gives another hero a chance to spring into
    immediate action. You may use this Perk when activating the hero. Once the 2 AP has been spent,
    you may take a hero token from the bag and activate another hero within LOS of the hero using
    this Perk.
  type: modifier
  scope: global
  entity_id: perk.call_to_action
  fields:
    perks_used_this_action:
      type: number
      role: input
      description: perks used this action
    energy:
      type: number
      role: state
      description: energy
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: energy
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: perks_used_this_action
        right:
          type: literal
          value: 0
    - type: add
      target: energy
      value:
        type: literal
        value: -1
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
