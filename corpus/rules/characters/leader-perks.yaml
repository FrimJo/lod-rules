  status: extracted
  confidence: high
  source_text:
    Your hero’s Resolve keeps the party together. You may increase Party Morale by +2. This
    may not increase morale above starting morale.
  type: modifier
  scope: global
  entity_id: perk.keep_calm_and_carry_on
