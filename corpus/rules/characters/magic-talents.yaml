  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: 'Restorer: excludes necromancer'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Restoration spells are the favourite spells of your hero, and this results in all
    Healing Spells healing +2 Hit Points in addition to the spell’s normal result. You cannot have
    this talent at the same time as you have the Necromancer Talent.
  type: modifier
  scope: global
  entity_id: talent.restorer
  fields:
    has_necromancer:
      type: boolean
      role: input
      description: has necromancer
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: has_necromancer
        right:
          type: literal
          value: false
- id: character.talent.necromancer.excludes_restorer
  name: 'Necromancer: excludes restorer'
  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: 'Necromancer: excludes restorer'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero gets +5 Arcane Arts whenever casting a Necromantic Spell. Furthermore, the
    Mana cost for such a spell is reduced by 5. You cannot have this Talent at the same time as you
    have the Restorer Talent.
  type: modifier
  scope: global
  entity_id: talent.necromancer
  fields:
    has_restorer:
      type: boolean
      role: input
      description: has restorer
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: has_restorer
        right:
          type: literal
          value: false
- id: character.talent.powerful_missiles.damage
  name: 'Powerful Missiles: damage'
  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: 'Powerful Missiles: damage'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Your hero has perfected the use of Magic Missiles, knowing where to aim for maximum
    effect. Magic Missile Spells do +1 Damage.
  type: modifier
  scope: global
  entity_id: talent.powerful_missiles
  fields:
    magic_missile_spell:
      type: boolean
      role: input
      description: magic missile spell
    damage:
      type: number
      role: state
      description: damage
  effects:
    - type: add
      target: damage
      value:
        type: literal
        value: 1
      duration: check
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: magic_missile_spell
    right:
      type: literal
      value: true
- id: character.talent.summoner.duration
  name: 'Summoner: duration'
  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: 'Summoner: duration'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Reaching into other realms and bringing other beings to their aid has become easier
    with years of practice. Creatures summoned by the Wizard will stay 2 turns longer than normally
    allowed by the Wizard’s CL.
  type: modifier
  scope: global
  entity_id: talent.summoner
  fields:
    creature_summoned_by_wizard:
      type: boolean
      role: input
      description: creature summoned by wizard
    summoned_turns:
      type: number
      role: state
      description: summoned turns
  effects:
    - type: add
      target: summoned_turns
      value:
        type: literal
        value: 2
      duration: check
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: creature_summoned_by_wizard
    right:
      type: literal
      value: true
