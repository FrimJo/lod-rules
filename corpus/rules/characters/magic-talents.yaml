- id: character.talent.blood_magic.conversion
  name: 'Blood Magic: conversion'
  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: 'Blood Magic: conversion'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard can spend his own life blood to create Mana. For every 2 HP spent, the
    wizard gains 5 Mana. This transformation can be done for free during the wizard’s turn.
  type: modifier
  scope: global
  entity_id: talent.blood_magic
  fields:
    during_own_turn:
      type: boolean
      role: input
      description: during own turn
    hp_pairs_spent:
      type: number
      role: input
      description: hp pairs spent
      integer: true
      minimum: 0
    hit_points:
      type: number
      role: state
      description: hit points
    mana:
      type: number
      role: state
      description: mana
    action_point_cost:
      type: number
      role: output
      description: action point cost
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: hit_points
        right:
          type: arithmetic
          operator: multiply
          values:
            - type: literal
              value: 2
            - type: field
              name: hp_pairs_spent
    - type: add
      target: hit_points
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: literal
            value: -2
          - type: field
            name: hp_pairs_spent
      duration: immediate
    - type: add
      target: mana
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: literal
            value: 5
          - type: field
            name: hp_pairs_spent
      duration: immediate
    - type: set
      target: action_point_cost
      value:
        type: literal
        value: 0
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: during_own_turn
    right:
      type: literal
      value: true
