  status: extracted
  confidence: high
  source_text: Caster may trap a target in LOS in ice, forcing it to break free before being able to
    do anything else. The caster may roll Caster Level d10 to determine how strong the tomb is, and
    the target does its maximum damage (incl weapon) once per turn until the tomb breaks. It may act
    with both its actions on the turn the tomb breaks. For every turn, the target takes 1d4 points
    of Frost DMG.
  type: modifier
  scope: global
  fields:
    in_los:
      type: boolean
      role: input
      description: in los
    tomb_strength_roll:
      type: number
      role: input
      description:
        sum of the Caster Level d10 rolled for the tomb's strength; the die count depends on the
        caster, so the roll cannot be typed as fixed dice (see issue.spell.ice_tomb_strength)
      integer: true
      minimum: 1
    tomb_strength:
      type: number
      role: output
      description: tomb strength
    strength_dice:
      type: string
      role: output
      description: strength dice
    actions_on_break_turn:
      type: number
      role: output
      description: actions on break turn
    frost_damage_roll:
      type: number
      role: input
      description: 1d4 Frost DMG roll for the turn
      integer: true
      minimum: 1
      maximum: 4
      dice:
        count: 1
        sides: 4
    frost_damage_per_turn:
      type: number
      role: output
      description: Frost DMG the entombed target takes this turn
    target_does_maximum_damage_to_tomb_once_per_turn:
      type: boolean
      role: output
      description: the target does its maximum damage (incl weapon) once per turn until the tomb breaks
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: in_los
        right:
          type: literal
          value: true
    - type: set
      target: tomb_strength
      value:
        type: field
        name: tomb_strength_roll
    - type: set
      target: strength_dice
      value:
        type: literal
        value: Caster Level d10
    - type: set
      target: actions_on_break_turn
      value:
        type: literal
        value: 2
    - type: set
      target: frost_damage_per_turn
      value:
        type: field
        name: frost_damage_roll
    - type: set
