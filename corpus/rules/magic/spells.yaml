        column: Description and effect
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The caster can heal one hero (including the caster) within 4 squares and in LOS
    (intervening models do not matter). It heals 1d6 Hit Points.
  type: modifier
  scope: global
  fields:
    healing_roll:
      type: number
      role: input
      description: healing roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    distance:
      type: number
      role: input
      description: distance
    in_los:
      type: boolean
      role: input
      description: in los
    hp_regained:
      type: number
      role: output
      description: hp regained
    healing_dice:
      type: string
      role: output
      description: healing dice
    self_allowed:
      type: boolean
      role: output
      description: self allowed
    intervening_models_ignored:
      type: boolean
      role: output
      description: intervening models ignored
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lte
            left:
              type: field
              name: distance
            right:
              type: literal
              value: 4
          - type: compare
            operator: eq
            left:
              type: field
              name: in_los
            right:
              type: literal
              value: true
    - type: set
      target: hp_regained
      value:
        type: field
        name: healing_roll
    - type: set
      target: healing_dice
      value:
        type: literal
        value: 1d6
    - type: set
      target: self_allowed
      value:
        type: literal
        value: true
    - type: set
      target: intervening_models_ignored
      value:
        type: literal
        value: true
  entity_id: spell.light_healing
  dependencies:
