        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The spell can be cast on an enemy Magic Caster. If the spell is successfully cast, the
    target must make a RES test when casting a spell. A failure means that the target cannot cast
    magic that turn, but may otherwise act as normal. Making this test does not cost an AP. If
    successful, the target may cast the spell as planned and the spell ceases to have any effect.
  type: modifier
  scope: global
  fields:
    target_enemy_caster:
      type: boolean
      role: input
      description: target enemy caster
    test:
      type: string
      role: output
      description: test
    test_cost_ap:
      type: number
      role: output
      description: test cost ap
    failure:
      type: string
      role: output
      description: failure
    success:
      type: string
      role: output
      description: success
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: target_enemy_caster
        right:
          type: literal
          value: true
    - type: set
      target: test
      value:
        type: literal
        value: RES when casting
    - type: set
      target: test_cost_ap
      value:
        type: literal
        value: 0
    - type: set
      target: failure
      value:
        type: literal
        value: cannot cast that turn; may otherwise act
    - type: set
      target: success
      value:
        type: literal
        value: cast as planned; Silence ends
  entity_id: spell.silence
