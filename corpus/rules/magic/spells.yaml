- id: core.spell.light_healing
  name: light healing
  section_id: section.appendix_iv_spells.level_1
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 187
      printed_page: 185
      heading: light healing
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The caster can heal one hero (including the caster) within 4 squares and in LOS
    (intervening models do not matter). It heals 1d6 Hit Points.
  type: modifier
  scope: global
  fields:
    healing_roll:
      type: number
      role: input
      description: healing roll
    distance:
      type: number
      role: input
      description: distance
    in_los:
      type: boolean
      role: input
      description: in los
    hp_regained:
      type: number
      role: output
      description: hp regained
    healing_dice:
      type: string
      role: output
      description: healing dice
    self_allowed:
      type: boolean
      role: output
      description: self allowed
    intervening_models_ignored:
      type: boolean
      role: output
      description: intervening models ignored
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: lte
            left:
              type: field
              name: distance
            right:
              type: literal
              value: 4
          - type: compare
            operator: eq
            left:
              type: field
              name: in_los
            right:
              type: literal
              value: true
    - type: set
      target: hp_regained
      value:
        type: field
        name: healing_roll
    - type: set
      target: healing_dice
      value:
        type: literal
        value: 1d6
    - type: set
      target: self_allowed
      value:
        type: literal
        value: true
    - type: set
      target: intervening_models_ignored
      value:
        type: literal
        value: true
  entity_id: spell.light_healing
  dependencies:
    - key: recovery_bounds
      label: Existing recovery boundaries; explicit spell exceptions remain local
      object_id: character.recovery.hp_overflow
- id: core.spell.protective_shield
  name: protective shield
  section_id: section.appendix_iv_spells.level_1
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 187
      printed_page: 185
      heading: protective shield
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The caster summons a translucent sphere of blue light around themself or the target
    (which must be in LOS), protecting it from physical harm. The shield absorbs 1 Point of Damage
    per Caster level to a maximum of 3. You can cast the spell twice (but not more) on each target,
    adding together the effect of the spell. The spell lasts the entire battle but costs 1 point of
    Mana in upkeep per turn.
  type: modifier
  scope: global
  fields:
    caster_level:
      type: number
      role: input
      description: caster level
    casts_on_target:
      type: number
      role: input
      description: casts on target
    in_los_or_self:
      type: boolean
      role: input
      description: in los or self
    damage_absorbed:
      type: number
      role: output
      description: damage absorbed
    maximum_casts:
      type: number
      role: output
      description: maximum casts
    stacking:
      type: boolean
      role: output
      description: stacking
    duration:
      type: string
      role: output
      description: duration
  effects:
    - type: require
      condition:
        type: compare
        operator: lt
        left:
          type: field
          name: casts_on_target
        right:
          type: literal
          value: 2
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: in_los_or_self
        right:
          type: literal
          value: true
    - type: set
      target: damage_absorbed
      value:
        type: arithmetic
        operator: min
        values:
          - type: literal
            value: 3
          - type: field
            name: caster_level
    - type: set
      target: maximum_casts
      value:
        type: literal
        value: 2
    - type: set
      target: stacking
      value:
        type: literal
        value: true
    - type: set
      target: duration
      value:
        type: literal
        value: battle
  entity_id: spell.protective_shield
