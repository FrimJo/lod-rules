- id: core.spell.fire_wall
  name: Fire Wall
  section_id: section.appendix_iv_spells.level_5
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 191
      printed_page: 189
