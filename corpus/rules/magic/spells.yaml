        row: Summon Demon
        column: Description and Effect
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The caster lures a demon from its dimension over to this world. It will randomly be
    either a Blood Demon or a Plague Demon. The demon is placed in a random place on the same tile
    as the wizard and fights for the caster. Once summoned, immediately add a hero activation token
    to the bag and activate the demon just like a hero. However, at the start of the wizard's
    activation following the summoning, the caster must pass a Resolve Test. If the caster fails,
    the demon breaks free and escapes back to its own dimension. When it breaks free, it will make a
    Resolve Test of its own and if it succeeds, it takes part of the caster's mind with it. Deduct
    1d3 Sanity Points from the caster. Once in our plane, the demon relishes the fighting, so no
    upkeep is needed.
  type: modifier
  scope: global
  fields:
    creature:
      type: string
      role: output
      description: creature
    placement:
      type: string
      role: output
      description: placement
    hero_tokens_added:
      type: number
      role: output
      description: hero tokens added
    token_timing:
      type: string
      role: output
      description: token timing
    upkeep:
      type: number
      role: output
      description: upkeep
    activates_like_hero:
      type: boolean
      role: output
      description: the demon is activated just like a hero
  effects:
    - type: set
      target: creature
      value:
        type: literal
        value: random Blood Demon or Plague Demon
    - type: set
      target: placement
      value:
        type: literal
        value: random place on wizard tile
    - type: set
      target: hero_tokens_added
      value:
        type: literal
        value: 1
    - type: set
      target: token_timing
      value:
        type: literal
        value: immediate
    - type: set
      target: upkeep
      value:
        type: literal
        value: 0
    - type: set
      target: activates_like_hero
      value:
        type: literal
        value: true
  entity_id: spell.summon_demon
