      target: placement
      value:
        type: literal
        value: random place on wizard tile
    - type: set
      target: hero_tokens_added
      value:
        type: literal
        value: 1
    - type: set
      target: token_timing
      value:
        type: literal
        value: immediate
    - type: set
      target: activation
      value:
        type: literal
        value: like hero
