        row: Fake Death
        column: Description and effect
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Causes the caster to fall to the ground, appearing dead to all around. Enemies will not
    target the caster for the rest of the battle. The caster may do nothing until the end of the
    battle.
  type: modifier
  scope: global
  fields:
    targetable:
      type: boolean
      role: output
      description: targetable
    can_act:
      type: boolean
      role: output
      description: can act
    duration:
      type: string
      role: output
      description: duration
  effects:
    - type: set
      target: targetable
      value:
        type: literal
        value: false
    - type: set
      target: can_act
      value:
        type: literal
        value: false
    - type: set
      target: duration
      value:
        type: literal
        value: battle
  entity_id: spell.fake_death
