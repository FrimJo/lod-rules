        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Causes the caster to fall to the ground, appearing dead to all around. Enemies will not
    target the caster for the rest of the battle. The caster may do nothing until the end of the
    battle.
