        row: Fire Wall
        column: Description and Effect
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This spell creates a Fire Wall, up to 3 squares long. It may only be placed in a
    straight line and not in a square that contains an enemy. All except lower Undead and Fire
    Elementals will avoid or try to walk around. Spell lasts for 1d4+1 turns. Any Lower Undead
    walking through takes 1d6 Fire DMG. Fire Elementals are immune.
  type: modifier
  scope: global
  fields:
    length:
      type: number
      role: input
      description: length
    straight:
      type: boolean
      role: input
      description: straight
    contains_enemy:
      type: boolean
      role: input
      description: contains enemy
    duration_roll:
      type: number
      role: input
      description: duration roll
      integer: true
      minimum: 1
      maximum: 4
      dice:
        count: 1
        sides: 4
    duration_turns:
      type: number
      role: output
      description: duration turns
    duration_dice:
      type: string
      role: output
      description: duration dice
    lower_undead_damage:
      type: number
      role: output
      description: Fire DMG to a Lower Undead walking through
    fire_elementals_immune:
      type: boolean
      role: output
      description: fire elementals immune
    lower_undead_damage_roll:
      type: number
      role: input
      description: 1d6 Fire DMG roll for a Lower Undead walking through
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    avoided_except_by_lower_undead_and_fire_elementals:
      type: boolean
      role: output
      description: all except lower Undead and Fire Elementals will avoid or try to walk around
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: length
        right:
          type: literal
          value: 3
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: straight
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: contains_enemy
        right:
          type: literal
          value: false
    - type: set
      target: duration_turns
      value:
        type: sum
        values:
          - type: field
            name: duration_roll
          - type: literal
            value: 1
    - type: set
      target: duration_dice
      value:
        type: literal
        value: 1d4+1
    - type: set
      target: lower_undead_damage
      value:
        type: field
        name: lower_undead_damage_roll
    - type: set
      target: fire_elementals_immune
      value:
        type: literal
        value: true
    - type: set
      target: avoided_except_by_lower_undead_and_fire_elementals
      value:
        type: literal
        value: true
