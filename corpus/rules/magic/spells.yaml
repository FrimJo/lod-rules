        row: Seal Door
        column: Description and effect
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The Spell Caster can magically seal a door. Any monster outside trying to pass through
    will take 1d3 turns to do so. Doors that have been broken down cannot be sealed. This can be
    cast on any door, even if there are monsters present. It can only be cast once per door. It can
    also be used during a rest in a dungeon. See page 98 for rules on this.
  type: modifier
  scope: global
  fields:
    door_broken:
      type: boolean
      role: input
      description: door broken
    previously_cast:
      type: boolean
      role: input
      description: previously cast
    delay_roll:
      type: number
      role: input
      description: delay roll
      integer: true
      minimum: 1
      maximum: 3
      dice:
        count: 1
        sides: 3
    enemy_delay_turns:
      type: number
      role: output
      description: enemy delay turns
    delay_dice:
      type: string
      role: output
      description: delay dice
    during_rest_allowed:
      type: boolean
      role: output
      description: during rest allowed
    enemies_present_allowed:
      type: boolean
      role: output
      description: enemies present allowed
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: door_broken
        right:
          type: literal
          value: false
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: previously_cast
        right:
          type: literal
          value: false
    - type: set
      target: enemy_delay_turns
      value:
        type: field
        name: delay_roll
    - type: set
      target: delay_dice
      value:
        type: literal
        value: 1d3
    - type: set
      target: during_rest_allowed
      value:
        type: literal
        value: true
    - type: set
      target: enemies_present_allowed
      value:
        type: literal
        value: true
