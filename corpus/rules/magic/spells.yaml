  status: extracted
  confidence: high
  source_text: A crackling bolt leaps from the hand of the wizard, striking a victim within LOS,
    dealing 1d10 DMG, ignoring armour. The bolt then jumps to the nearest model (random if equal)
    and deals 1d8 DMG, ignoring armour. Finally, it makes its last jump, dealing 1d6 DMG, ignoring
    armour. It always jumps to the nearest model, and never strikes the same model twice. It never
    jumps more than 3 squares.
  type: modifier
  scope: global
  fields:
    ignore_armour:
      type: boolean
      role: output
      description: ignore armour
    maximum_jump_squares:
      type: number
      role: output
      description: maximum jump squares
    first_damage_roll:
      type: number
      role: input
      description: 1d10 DMG roll against the victim within LOS
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    second_damage_roll:
      type: number
      role: input
      description: 1d8 DMG roll against the nearest model after the first jump
      integer: true
      minimum: 1
      maximum: 8
      dice:
        count: 1
        sides: 8
    third_damage_roll:
      type: number
      role: input
      description: 1d6 DMG roll on the last jump
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    first_damage:
      type: number
      role: output
      description: DMG to the victim within LOS
    second_damage:
      type: number
      role: output
      description: DMG to the model struck by the first jump
    third_damage:
      type: number
      role: output
      description: DMG to the model struck by the last jump
    initial_target_in_los:
      type: boolean
      role: output
      description: the first victim is within LOS
    jumps_to_nearest_model:
      type: boolean
      role: output
      description: the bolt always jumps to the nearest model
    random_if_equal:
      type: boolean
      role: output
      description: a tie for nearest model is decided at random
    never_strikes_same_model_twice:
      type: boolean
      role: output
      description: the bolt never strikes the same model twice
  effects:
    - type: set
      target: first_damage
      value:
        type: field
        name: first_damage_roll
    - type: set
      target: second_damage
      value:
        type: field
        name: second_damage_roll
    - type: set
      target: third_damage
      value:
        type: field
        name: third_damage_roll
    - type: set
      target: ignore_armour
      value:
        type: literal
        value: true
    - type: set
      target: maximum_jump_squares
      value:
        type: literal
        value: 3
