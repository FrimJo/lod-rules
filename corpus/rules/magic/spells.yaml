  status: extracted
  confidence: high
  source_text: The caster lures a demon from its dimension over to this world. It will randomly be
    either a Blood Demon or a Plague Demon. The demon is placed in a random place on the same tile
    as the wizard and fights for the caster. Once summoned, immediately add a hero activation token
    to the bag and activate the demon just like a hero. However, at the start of the wizard's
    activation following the summoning, the caster must pass a Resolve Test. If the caster fails,
    the demon breaks free and escapes back to its own dimension. When it breaks free, it will make a
    Resolve Test of its own and if it succeeds, it takes part of the caster's mind with it. Deduct
    1d3 Sanity Points from the caster. Once in our plane, the demon relishes the fighting, so no
    upkeep is needed.
  type: modifier
  scope: global
  fields:
    creature:
      type: string
      role: output
      description: creature
    placement:
      type: string
      role: output
      description: placement
    hero_tokens_added:
      type: number
      role: output
      description: hero tokens added
    token_timing:
      type: string
      role: output
      description: token timing
    activation:
      type: string
      role: output
      description: activation
    control_test:
      type: string
      role: output
      description: control test
    failure:
      type: string
      role: output
      description: failure
    upkeep:
      type: number
      role: output
      description: upkeep
