  status: extracted
  confidence: high
  source_text:
    The caster draws a demon from its dimension to do their bidding. The demon is placed in
    a random square on the same tile as the wizard and fights for the caster for 1d3 + Caster Level
    turns. Once in our plane, the demon relishes fighting, so no upkeep is needed. However, making a
    pact with a Greater Demon comes at a price, no matter how skilled a wizard may be. Deduct 1d6
    Sanity Points from the caster.
  type: modifier
  scope: global
  fields:
    duration_roll:
      type: number
      role: input
      description: duration roll
      integer: true
      minimum: 1
      maximum: 3
      dice:
        count: 1
        sides: 3
    caster_level:
      type: number
      role: input
      description: caster level
    sanity_roll:
      type: number
      role: input
      description: sanity roll
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    creature:
      type: string
      role: output
      description: creature
    placement:
      type: string
      role: output
      description: placement
    duration_turns:
      type: number
      role: output
      description: duration turns
    duration_dice:
      type: string
      role: output
      description: duration dice
    sanity_lost:
      type: number
      role: output
      description: sanity lost
    sanity_dice:
      type: string
      role: output
      description: sanity dice
    upkeep:
      type: number
      role: output
      description: upkeep
  effects:
    - type: set
      target: creature
      value:
        type: literal
        value: Greater Demon
    - type: set
      target: placement
      value:
        type: literal
        value: random square on wizard tile
    - type: set
      target: duration_turns
