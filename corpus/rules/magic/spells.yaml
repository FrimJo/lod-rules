- id: core.spell.summon_demon
  name: Summon Demon
  section_id: section.appendix_iv_spells.level_4
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 190
      printed_page: 188
      heading: Level 4 Magic
      locator:
