- id: core.magic.touch
  name: touch
  section_id: section.magic.spell_characteristics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      heading: touch
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Touching an enemy requires CS+20 and may be parried or dodged normally. Ignore for
    allies. Arcane Arts is still required. A failed touch consumes half Mana (RDU).
  type: modifier
  scope: global
  fields:
    cs:
      type: number
      role: input
      description: cs
    enemy_target:
      type: boolean
      role: input
      description: enemy target
    touch_threshold:
      type: number
      role: output
      description: touch threshold
    parry_allowed:
      type: boolean
      role: output
      description: parry allowed
    dodge_allowed:
      type: boolean
      role: output
      description: dodge allowed
  effects:
    - type: set
      target: touch_threshold
      value:
        type: sum
        values:
          - type: field
            name: cs
          - type: literal
            value: 20
    - type: set
      target: parry_allowed
      value:
        type: literal
        value: true
    - type: set
      target: dodge_allowed
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enemy_target
    right:
      type: literal
      value: true
- id: core.magic.touch.failed
  name: failed
