      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: focus_actions
        right:
          type: literal
          value: 0
    - type: set
      target: scroll_cv
      value:
        type: arithmetic
        operator: max
        values:
          - type: literal
            value: 0
          - type: arithmetic
            operator: subtract
            values:
              - type: field
