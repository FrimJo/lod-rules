    something unworldly, and the caster must roll on the table below. The wizard's turn ends
    immediately, and the Mana is used as though the spell had failed.
  type: modifier
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
    miscast_threshold:
      type: number
      role: input
      description: miscast threshold
    mana_cost:
      type: number
      role: input
      description: mana cost
    turn_ended:
      type: boolean
      role: output
      description: turn ended
    mana_spent:
      type: number
      role: output
      description: mana spent
  effects:
    - type: set
      target: turn_ended
      value:
        type: literal
        value: true
    - type: set
      target: mana_spent
      value:
        type: arithmetic
        operator: ceil
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: mana_cost
              - type: literal
                value: 2
  when:
    type: compare
    operator: gte
    left:
      type: field
      name: roll
    right:
