      pdf_page: 66
      printed_page: 64
      heading: dispel
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Any magic caster may attempt once per turn, out of activation order, after success but
    before damage. Touch/Close Combat Spells cannot be dispelled. Heroes test Arcane Arts/2 RDD;
    enemy casters Ranged Skills/2 RDD.
  type: modifier
  scope: global
  fields:
    already_attempted:
      type: boolean
      role: input
      description: already attempted
    spell_succeeded:
      type: boolean
      role: input
      description: spell succeeded
    damage_calculated:
      type: boolean
      role: input
      description: damage calculated
    touch_or_close_combat:
      type: boolean
      role: input
      description: touch or close combat
    relevant_skill:
      type: number
      role: input
      description: relevant skill
    roll:
      type: number
      role: input
      description: roll
    dispel_threshold:
      type: number
      role: output
      description: dispel threshold
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: already_attempted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: spell_succeeded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_calculated
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: touch_or_close_combat
            right:
              type: literal
              value: false
    - type: set
      target: dispel_threshold
      value:
        type: arithmetic
        operator: floor
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: relevant_skill
              - type: literal
                value: 2
