  source_text: Any hero may cast a scroll of any level. Non-wizards use WIS. CV is reduced by 10,
    minimum 0. No focus or Mana. Success or miscast destroys the scroll. Upkeep spells last 1d6
    turns without upkeep. Quick Slot use costs 1 AP.
