- id: core.magic.power
  name: power
  section_id: section.magic.increased_power
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 66
      printed_page: 64
      heading: Increased Power
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard may add extra power to Restoration Spells and Destruction Spells. For each
    Power Level added, the spell costs 2 more Mana to cast. This increases Damage by +1, or the
    healing effect by +1. The miscast threshold decreases by -1 for each increase in power level,
    meaning that a miscast would occur on 94-100 for a power level increase of 1. A maximum of 5
    levels, or up to the wizard’s level may be added. This means a Level 4 Wizard could add 4
    levels, whereas a Level 6 Wizard could add 5 levels.
  type: modifier
  scope: global
  fields:
    school:
      type: string
      role: input
      description: school
    power_levels:
      type: number
      role: input
      description: power levels
    caster_level:
      type: number
      role: input
      description: caster level
    base_mana:
      type: number
      role: input
      description: base mana
    mana_cost:
      type: number
      role: output
      description: mana cost
    effect_bonus:
      type: number
      role: output
      description: effect bonus
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: school
            right:
              type: literal
              value: Restoration
          - type: compare
            operator: eq
            left:
              type: field
              name: school
            right:
              type: literal
              value: Destruction
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: power_levels
        right:
          type: literal
          value: 0
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: power_levels
        right:
          type: arithmetic
          operator: min
          values:
            - type: literal
              value: 5
            - type: field
              name: caster_level
    - type: set
      target: mana_cost
      value:
        type: sum
        values:
          - type: field
            name: base_mana
          - type: arithmetic
            operator: multiply
            values:
              - type: field
                name: power_levels
              - type: literal
                value: 2
    - type: set
      target: effect_bonus
      value:
        type: field
        name: power_levels
