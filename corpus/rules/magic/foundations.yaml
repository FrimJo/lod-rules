- id: core.magic.level
  name: level
  section_id: section.magic.difficulty_of_spells
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      heading: Difficulty of Spells
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 66
      printed_page: 64
      heading: Learning New Spells
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A wizard can never learn spells with a higher level than their own character level. ...
    Wizards can learn any spells equal to, or below their level, as long as they can afford it.
  type: modifier
  scope: global
  fields:
    spell_level:
      type: number
      role: input
      description: spell level
    caster_level:
      type: number
      role: input
      description: caster level
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: spell_level
        right:
          type: field
          name: caster_level
- id: core.magic.standard
  name: standard
  section_id: section.magic.different_types_of_spells
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      section: Different Types of Spells
      heading: Standard Spells
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Standard Spells require 2 actions to cast. These can be in the same turn or spread out
    over 2 turns, but the wizard may not perform any other actions in between the two spell actions.
    A spell is always a Standard Spell unless otherwise stated.
  type: modifier
  scope: global
  fields:
    intervening_actions:
      type: number
      role: input
      description: intervening actions
    casting_actions:
      type: number
      role: output
      description: casting actions
    maximum_turns:
      type: number
      role: output
      description: maximum turns
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: intervening_actions
        right:
          type: literal
          value: 0
    - type: set
      target: casting_actions
      value:
        type: literal
        value: 2
    - type: set
      target: maximum_turns
      value:
        type: literal
        value: 2
