- id: core.magic.casting.threshold
  name: threshold
  section_id: section.magic.casting_spells
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 65
      printed_page: 63
      heading: threshold
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Have enough Mana; roll equal to or below Arcane Art minus Casting Value. Success
    consumes listed Mana; failure consumes half (RDU).
  type: modifier
  scope: global
  fields:
    arcane_arts:
      type: number
      role: input
      description: arcane arts
    casting_value:
      type: number
      role: input
      description: casting value
    mana:
      type: number
      role: input
      description: mana
    mana_cost:
      type: number
      role: input
      description: mana cost
    casting_threshold:
      type: number
      role: output
      description: casting threshold
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: mana
        right:
          type: field
          name: mana_cost
    - type: set
      target: casting_threshold
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: field
            name: arcane_arts
          - type: field
            name: casting_value
