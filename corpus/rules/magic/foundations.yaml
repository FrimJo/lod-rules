- id: core.magic.standard
  name: standard
  section_id: section.magic.different_types_of_spells
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      heading: standard
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A spell is Standard unless otherwise stated. It requires 2 actions in the same turn or
    spread over 2 turns, with no other actions between.
  type: modifier
  scope: global
  fields:
    intervening_actions:
      type: number
      role: input
      description: intervening actions
    casting_actions:
      type: number
      role: output
      description: casting actions
    maximum_turns:
      type: number
      role: output
      description: maximum turns
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: intervening_actions
        right:
          type: literal
          value: 0
    - type: set
      target: casting_actions
      value:
        type: literal
        value: 2
    - type: set
      target: maximum_turns
      value:
        type: literal
        value: 2
