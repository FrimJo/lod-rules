- id: core.magic.miscast.threshold.normal
  name: normal
  section_id: section.magic.miscast
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 65
      printed_page: 63
      heading: normal
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A result of 95 or more miscasts; a wounded caster miscasts on 90 or higher. Power
    reduces threshold by 1 per level; focus by 5 per action.
  type: modifier
  scope: global
  fields:
    wounded:
      type: boolean
      role: input
      description: wounded
    power_levels:
      type: number
      role: input
      description: power levels
    focus_actions:
      type: number
      role: input
      description: focus actions
    miscast_threshold:
      type: number
      role: output
      description: miscast threshold
  effects:
    - type: set
      target: miscast_threshold
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: arithmetic
            operator: subtract
            values:
              - type: literal
                value: 95
              - type: field
                name: power_levels
          - type: arithmetic
            operator: multiply
            values:
              - type: field
                name: focus_actions
              - type: literal
                value: 5
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: wounded
    right:
      type: literal
      value: false
