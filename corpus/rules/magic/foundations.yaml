      type: number
      role: input
      description: roll
    dispel_threshold:
      type: number
      role: input
      description: dispel threshold
    spell_cancelled:
      type: boolean
      role: output
      description: spell cancelled
    original_mana_still_spent:
      type: boolean
      role: output
      description: original mana still spent
  effects:
    - type: set
      target: spell_cancelled
      value:
        type: literal
        value: true
    - type: set
      target: original_mana_still_spent
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: dispel_threshold
