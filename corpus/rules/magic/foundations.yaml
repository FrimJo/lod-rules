- id: core.magic.mana
  name: mana
  section_id: section.magic.mana
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      heading: Mana
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Using magic is mentally straining and there is a limit to how much magic a wizard may
    use before resting. The wizard’s capacity is called Mana, and it is equal to the wizard's
    WISx1,5 (RDU). Mana may be regained through resting, drinking Mana potions, and using various
    magic charms.
  type: modifier
  scope: global
  fields:
    wis:
      type: number
      role: input
      description: wis
    maximum_mana:
      type: number
      role: output
      description: maximum mana
  effects:
    - type: set
      target: maximum_mana
      value:
        type: arithmetic
        operator: ceil
        values:
          - type: arithmetic
            operator: multiply
            values:
              - type: field
                name: wis
              - type: literal
                value: 1.5
- id: core.magic.upkeep
  name: upkeep
  section_id: section.magic.upkeep
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      heading: Upkeep
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Some spells require upkeep in the form of Mana spent every turn, starting with the turn
    after the spell was cast. If your wizard does not have enough Mana to pay for the upkeep, the
    spell is cancelled as soon as the wizard is activated.
  type: modifier
  scope: global
  fields:
    turn_after_cast:
      type: boolean
      role: input
      description: turn after cast
    wizard_activated:
      type: boolean
      role: input
      description: wizard activated
    mana:
      type: number
      role: input
      description: mana
    upkeep:
      type: number
      role: input
      description: upkeep
    spell_cancelled:
      type: boolean
      role: output
      description: spell cancelled
    mana_after:
      type: number
      role: output
      description: mana after
  effects:
    - type: set
      target: spell_cancelled
      value:
        type: literal
        value: false
    - type: set
      target: mana_after
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: field
            name: mana
          - type: field
            name: upkeep
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: turn_after_cast
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: wizard_activated
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: mana
        right:
          type: field
          name: upkeep
