        type: compare
        operator: gte
        left:
          type: field
          name: mana
        right:
          type: field
          name: mana_cost
    - type: set
      target: casting_threshold
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: field
            name: arcane_arts
          - type: field
            name: casting_value
