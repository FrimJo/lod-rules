      role: input
      description: quick slot
    scroll_cv:
      type: number
      role: output
      description: scroll cv
    mana_spent:
      type: number
      role: output
      description: mana spent
    upkeep_spent:
      type: number
      role: output
      description: upkeep spent
    level_restricted:
      type: boolean
      role: output
      description: level restricted
  effects:
