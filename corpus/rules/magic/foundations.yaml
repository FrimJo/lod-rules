- id: core.magic.miscast
  name: miscast
  section_id: section.magic.miscast
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 65
      printed_page: 63
      heading: miscast
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Miscast ends the wizard’s turn immediately; Mana is spent as a failed spell and the
    Miscast table supplies any exception.
  type: modifier
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
    miscast_threshold:
      type: number
      role: input
      description: miscast threshold
    mana_cost:
      type: number
      role: input
      description: mana cost
    turn_ended:
      type: boolean
      role: output
      description: turn ended
    mana_spent:
      type: number
      role: output
      description: mana spent
  effects:
    - type: set
      target: turn_ended
      value:
        type: literal
        value: true
    - type: set
      target: mana_spent
      value:
        type: arithmetic
        operator: ceil
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: mana_cost
              - type: literal
                value: 2
  when:
    type: compare
    operator: gte
    left:
      type: field
      name: roll
    right:
      type: field
      name: miscast_threshold
  uses_tables:
    - table.magic.miscast
    - table.magic.demons
- id: core.magic.power
  name: power
  section_id: section.magic.increased_power
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 66
      printed_page: 64
      heading: power
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Only Restoration and Destruction may add power. Maximum min(5, wizard level). Each
    level adds 2 Mana and +1 damage or healing and lowers miscast threshold by 1.
  type: modifier
  scope: global
  fields:
    school:
      type: string
      role: input
      description: school
    power_levels:
      type: number
      role: input
      description: power levels
    caster_level:
      type: number
      role: input
      description: caster level
    base_mana:
      type: number
      role: input
      description: base mana
    mana_cost:
      type: number
      role: output
      description: mana cost
    effect_bonus:
      type: number
      role: output
      description: effect bonus
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: school
            right:
              type: literal
              value: Restoration
          - type: compare
            operator: eq
            left:
              type: field
              name: school
            right:
              type: literal
              value: Destruction
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: power_levels
        right:
          type: literal
          value: 0
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: power_levels
        right:
          type: arithmetic
          operator: min
          values:
            - type: literal
              value: 5
            - type: field
              name: caster_level
    - type: set
      target: mana_cost
      value:
        type: sum
        values:
          - type: field
            name: base_mana
          - type: arithmetic
            operator: multiply
            values:
              - type: field
                name: power_levels
              - type: literal
                value: 2
    - type: set
      target: effect_bonus
      value:
        type: field
        name: power_levels
