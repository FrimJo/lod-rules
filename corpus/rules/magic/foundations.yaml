- id: core.magic.dispel
  name: dispel
  section_id: section.magic.dispelling_magic
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 66
      printed_page: 64
      heading: Dispelling Magic
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 68
      printed_page: 66
      heading: Hero Spell Casting
      locator:
        region: Enemy spell caster present and able to dispel?**; Make Dispel roll using Enemy’s RS
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Any magic caster can try to dispel a magic spell when it is cast (foregoing the normal
    activation order) once per turn. Touch spells or Close Combat Spells cannot be dispelled. The
    decision to do this may be taken once you have seen that the spell was successful (but before
    any DMG is calculated). Dispelling is done by making a successful test on Arcane Arts/2 (RDD)
    for heroes, and on Ranged Skills/2 (RDD) for enemy casters.
  type: modifier
  scope: global
  fields:
    already_attempted:
      type: boolean
      role: input
      description: already attempted
    spell_succeeded:
      type: boolean
      role: input
      description: spell succeeded
    damage_calculated:
      type: boolean
      role: input
      description: damage calculated
    touch_or_close_combat:
      type: boolean
      role: input
      description: touch or close combat
    relevant_skill:
      type: number
      role: input
      description: relevant skill
    roll:
      type: number
      role: input
      description: roll
    dispel_threshold:
      type: number
      role: output
      description: dispel threshold
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: already_attempted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: spell_succeeded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_calculated
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: touch_or_close_combat
            right:
              type: literal
              value: false
    - type: set
      target: dispel_threshold
      value:
        type: arithmetic
        operator: floor
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: relevant_skill
              - type: literal
                value: 2
  issues:
    - issue.magic.flowchart_prose_conflicts
- id: core.magic.dispel.success
  name: success
  section_id: section.magic.dispelling_magic
  source:
    - document: rulebook.second_printing.eng
