      value:
        type: literal
        value: false
    - type: set
      target: obstacle_modifier
      value:
        type: literal
        value: 0
- id: core.magic.touch
  name: touch
  section_id: section.magic.spell_characteristics
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 64
      printed_page: 62
      section: Spell Characteristics
      heading: Touch Spells (T)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Certain spells require the caster to touch its enemy. To succeed in touching an enemy,
    the caster must roll CS+20 (ignore for allies). This may be parried and dodged as normal. These
    spells also require the standard Arcane Arts roll to succeed.
  type: modifier
  scope: global
  fields:
    cs:
      type: number
      role: input
      description: cs
    enemy_target:
      type: boolean
      role: input
      description: enemy target
    touch_threshold:
      type: number
      role: output
      description: touch threshold
    parry_allowed:
      type: boolean
      role: output
      description: parry allowed
    dodge_allowed:
      type: boolean
      role: output
      description: dodge allowed
  effects:
    - type: set
      target: touch_threshold
      value:
        type: sum
        values:
          - type: field
            name: cs
          - type: literal
            value: 20
    - type: set
      target: parry_allowed
      value:
        type: literal
        value: true
    - type: set
      target: dodge_allowed
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enemy_target
    right:
      type: literal
      value: true
