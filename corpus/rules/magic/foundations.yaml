      heading: Magic Missiles (MM)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Spells classed as Magic Missiles require LOS from the caster to the target. No “to hit”
    roll is required, and there are no modifiers for obstacles and such things.
  type: modifier
  scope: global
  fields:
    target_in_los:
      type: boolean
      role: input
      description: target in los
    to_hit_required:
