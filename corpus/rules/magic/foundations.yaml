      heading: failed
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If the caster fails to touch the target, only half the Mana (RDU) is consumed.
  type: modifier
  scope: global
  fields:
    touch_succeeded:
      type: boolean
      role: input
      description: touch succeeded
    mana_cost:
      type: number
      role: input
      description: mana cost
    mana_spent:
      type: number
      role: output
      description: mana spent
  effects:
    - type: set
      target: mana_spent
      value:
        type: arithmetic
        operator: ceil
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: mana_cost
              - type: literal
                value: 2
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: touch_succeeded
    right:
      type: literal
      value: false
