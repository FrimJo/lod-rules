- id: combat.poison.exposure
  name: Poison exposure
  section_id: section.combat.different_kinds_of_damage.poison
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 122
      printed_page: 120
      section: Different Kinds of Damage
      heading: Poison
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If a hero or enemy is hit by poison and takes damage, then the effect of poison may
    kick in. Make a CON test, applying any modifier for the poison. If this fails, the target is
    poisoned and,
  type: trigger
  scope: global
  fields:
    hit_by_poison:
      type: boolean
      role: input
      description: The hero or enemy is hit by poison.
    damage_taken:
      type: number
      role: input
      description: Damage taken from the hit.
    con:
      type: number
      role: input
      description: Constitution of the target.
    poison_modifier:
      type: number
      role: input
      description: Modifier for the poison.
    con_roll:
      type: number
      role: input
      description: The CON test roll.
      minimum: 1
      maximum: 100
      integer: true
    poisoned:
      type: boolean
      role: output
      description: The target is poisoned.
  effects:
    - type: set
      target: poisoned
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: hit_by_poison
        right:
          type: literal
          value: true
      - type: compare
        operator: gt
        left:
          type: field
          name: damage_taken
        right:
          type: literal
          value: 0
      - type: compare
        operator: gt
        left:
          type: field
          name: con_roll
        right:
          type: sum
          values:
            - type: field
              name: con
            - type: field
              name: poison_modifier
  issues:
    - issue.combat.enemy_poison_damage
  dependencies:
    - key: follow_up
      label: Poison exposure and checks
      object_id: procedure.damage_follow_up
  term_refs:
    - term.poison
