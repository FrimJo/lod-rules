- id: combat.damage.acidic.continues
  name: Acid continues next turn
  section_id: section.combat.different_kinds_of_damage.acidic_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Different Kinds of Damage
      heading: Acidic Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 10
      printed_page: null
      heading: '2.21'
      locator:
        row: 71
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: medium
  source_text: On a roll of 4-6, the acid will continue to damage the character next turn, but the
    damage is halved (rounded down) to a minimum of 1. The acid is then negated.
  type: random_resolution
  scope: global
  fields:
    damage_type:
      type: string
      role: input
      description: acidic, fire, frost, magic or normal.
    continuation_roll:
      type: number
      role: input
      description: The 1d6 rolled once damage has been resolved.
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    continues_next_turn:
      type: boolean
      role: output
      description: The damage continues next turn.
    negated_after_next_turn:
      type: boolean
      role: output
      description: The acid is then negated.
  effects:
    - type: set
      target: continues_next_turn
      value:
        type: literal
        value: true
    - type: set
      target: negated_after_next_turn
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_type
        right:
          type: literal
          value: acidic
      - type: compare
        operator: gte
        left:
          type: field
          name: continuation_roll
        right:
          type: literal
          value: 4
  issues:
    - issue.damage_follow_up.continuation_basis
  dependencies:
    - key: continuation
      label: Next-turn continuation
      object_id: procedure.elemental_continuation
