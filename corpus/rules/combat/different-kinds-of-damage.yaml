- id: combat.damage.frost
  name: Frost Damage may stun
  section_id: section.combat.different_kinds_of_damage.frost_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 122
      printed_page: 120
      section: Different Kinds of Damage
      heading: Frost Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Frost Damage has a 50% chance of causing stun, that is, the target loses one of its APs
    next turn.
  type: random_resolution
  scope: global
  fields:
    damage_type:
      type: string
      role: input
      description: acidic, fire, frost, magic or normal.
    frost_stun_result:
      type: boolean
      role: input
      description: The 50% chance of causing stun came up.
    stunned:
      type: boolean
      role: output
      description: The target is stunned.
    next_turn_ap_loss:
      type: number
      role: output
      description: APs lost next turn.
  effects:
    - type: set
      target: stunned
      value:
        type: literal
        value: true
    - type: set
      target: next_turn_ap_loss
      value:
        type: literal
        value: 1
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_type
        right:
          type: literal
          value: frost
      - type: compare
        operator: eq
        left:
          type: field
          name: frost_stun_result
        right:
          type: literal
          value: true
  issues:
    - issue.stun.ap_and_overlap
  term_refs:
    - term.frost_damage
    - term.stun
- id: combat.damage.magic
  name: Magic damage
  section_id: section.combat.different_kinds_of_damage.magic_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 122
      printed_page: 120
      section: Different Kinds of Damage
      heading: Magic Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Damage caused by spells, prayers, scrolls, magic weapons or items are considered magic
    damage. In most cases, this works as normal damage, but some creatures like demons suffers
    further complications by magic damage.
  type: definition
  scope: global
  fields:
    damage_source:
      type: string
      role: input
      description: spell, prayer, scroll, magic_weapon, magic_item or other.
    magic_damage:
      type: boolean
      role: output
      description: The damage is magic damage.
  effects:
    - type: set
      target: magic_damage
      value:
        type: literal
        value: true
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_source
        right:
          type: literal
          value: spell
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_source
        right:
          type: literal
          value: prayer
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_source
        right:
          type: literal
          value: scroll
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_source
        right:
          type: literal
          value: magic_weapon
      - type: compare
        operator: eq
        left:
          type: field
          name: damage_source
        right:
          type: literal
          value: magic_item
  issues:
    - issue.magic.creature_complications
  term_refs:
    - term.magic_damage
