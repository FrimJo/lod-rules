- id: combat.disease.exposure
  name: Disease exposure avoided
  section_id: section.combat.different_kinds_of_damage.disease
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Different Kinds of Damage
      heading: Disease
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Heroes may contract diseases either from enemies or various events. If wounded by a
    creature that causes disease, or if there is any other indication that a hero may contract a
    disease, make a CON roll, applying any modifier from the disease. If successful, there is no
    effect, and the hero manages to avoid the sickness.
  type: trigger
  scope: global
  fields:
    disease_exposure:
      type: boolean
      role: input
      description:
        Wounded by a creature that causes disease, or another indication that the hero may
        contract a disease.
    con:
      type: number
      role: input
      description: Constitution of the hero.
    disease_modifier:
      type: number
      role: input
      description: Modifier from the disease.
    con_roll:
      type: number
      role: input
      description: The CON roll.
      minimum: 1
      maximum: 100
      integer: true
    diseased:
      type: boolean
      role: output
      description: The hero contracted the disease.
  effects:
    - type: set
      target: diseased
      value:
        type: literal
        value: false
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: disease_exposure
        right:
          type: literal
          value: true
      - type: compare
        operator: lte
        left:
          type: field
          name: con_roll
        right:
          type: sum
          values:
            - type: field
              name: con
            - type: field
              name: disease_modifier
  term_refs:
    - term.disease
    - term.constitution
- id: combat.disease.effect
  name: Disease effect
  section_id: section.combat.different_kinds_of_damage.disease
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Different Kinds of Damage
      heading: Disease
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If it fails however, the hero loses half its CON and STR (RDD) after any ongoing battle
    is over until cured.
  type: calculation
  scope: global
  fields:
    disease_exposure:
      type: boolean
      role: input
      description: An exposure roll was required.
    con:
      type: number
      role: input
      description: Constitution of the hero.
    str:
      type: number
      role: input
      description: Strength of the hero.
    disease_modifier:
      type: number
      role: input
      description: Modifier from the disease.
    con_roll:
      type: number
      role: input
      description: The CON roll.
      minimum: 1
      maximum: 100
      integer: true
    diseased:
      type: boolean
      role: output
      description: The hero contracted the disease.
    con_loss:
      type: number
      role: output
      description: CON lost (half, rounded down).
    str_loss:
      type: number
      role: output
      description: STR lost (half, rounded down).
    applies_after_battle:
      type: boolean
      role: output
      description: The loss applies after any ongoing battle is over.
  effects:
    - type: set
      target: diseased
      value:
        type: literal
        value: true
    - type: set
      target: con_loss
      value:
        type: arithmetic
        operator: floor
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: con
              - type: literal
                value: 2
    - type: set
      target: str_loss
      value:
        type: arithmetic
        operator: floor
        values:
          - type: arithmetic
            operator: divide
            values:
              - type: field
                name: str
              - type: literal
                value: 2
    - type: set
      target: applies_after_battle
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: disease_exposure
        right:
          type: literal
          value: true
      - type: compare
        operator: gt
        left:
          type: field
          name: con_roll
        right:
          type: sum
          values:
            - type: field
              name: con
            - type: field
              name: disease_modifier
  issues:
    - issue.disease.concurrent_effects
  dependencies:
    - key: follow_up
      label: Disease exposure and recovery
      object_id: procedure.damage_follow_up
  term_refs:
    - term.rounded_down
