- id: combat.damage.roll
  name: Rolling damage
  section_id: section.combat.dealing_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      heading: Dealing Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Roll damage according to the weapon or monster damage noted in the Monster Table. Add a
    damage bonus if your hero or the monster is strong enough for that.
  type: procedure_rule
  scope: battle
  fields:
    weapon_or_monster_damage:
      type: number
      role: input
      description: Damage rolled for the weapon or the monster damage noted in the Monster Table.
    damage_bonus:
      type: number
      role: input
      description: Damage bonus, if strong enough for one.
    weapon_damage:
      type: number
      role: output
      description: Rolled damage before protection.
  effects:
    - type: set
      target: weapon_damage
      value:
        type: field
        name: weapon_or_monster_damage
  dependencies:
    - key: monster_table
      label: monster damage noted in the Monster Table
      external_document: bestiary
    - key: damage_bonus
      label: Damage bonus
      object_id: character.damage_bonus.lookup
  term_refs:
    - term.damage
    - term.damage_bonus
- id: combat.damage.bloodlust
  name: Bloodlust
  section_id: section.combat.dealing_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Dealing Damage
      heading: Bloodlust
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If your hero's hit roll is 01-05, you may roll Damage twice and choose the highest roll.
  type: choice
  scope: battle
  fields:
    attacker:
      type: string
      role: input
      description: hero or enemy.
    hit_roll:
      type: number
      role: input
      description: The hit roll, 00 read as 100.
      minimum: 1
      maximum: 100
      integer: true
    damage_rolls:
      type: number
      role: output
      description: Damage rolls made; the highest is chosen.
  effects:
    - type: set
      target: damage_rolls
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: attacker
        right:
          type: literal
          value: hero
      - type: compare
        operator: lte
        left:
          type: field
          name: hit_roll
        right:
          type: literal
          value: 5
  term_refs:
    - term.bloodlust
- id: combat.damage.bloodlust.enemies
  name: Enemies ignore bloodlust
  section_id: section.combat.dealing_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Dealing Damage
      heading: Bloodlust
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Luckily, enemies ignore bloodlust.
  type: exception
  scope: battle
  fields:
    attacker:
      type: string
      role: input
      description: hero or enemy.
    damage_rolls:
      type: number
      role: output
      description: Damage rolls made.
  effects:
    - type: set
      target: damage_rolls
      value:
        type: literal
        value: 1
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: attacker
    right:
      type: literal
      value: enemy
  term_refs:
    - term.bloodlust
- id: combat.damage.hit_area
  name: Hit Area
  section_id: section.combat.dealing_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      section: Dealing Damage
      heading: Hit Area (Only When Hitting Heroes)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    When striking enemies, we ignore where the blow lands. However, when the enemy strikes
    a hero, we must check where this strike lands. This is done according to the table below.
    Rolling 1d6 together with the two Hit Dice helps speed things up.
  type: lookup
  scope: battle
  fields:
    target:
      type: string
      role: input
      description: hero or enemy.
    hit_area_roll:
      type: number
      role: input
      description: The 1d6 hit area roll.
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    hit_location:
      type: string
      role: output
      description: Printed hit location.
  effects:
    - type: lookup
      table_id: table.combat.hit_location
      key_column: roll
      key:
        type: field
        name: hit_area_roll
      value_column: location
      target: hit_location
      on_missing_issue: issue.combat.enemy_attack_flowchart
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: target
    right:
      type: literal
      value: hero
  uses_tables:
    - table.combat.hit_location
