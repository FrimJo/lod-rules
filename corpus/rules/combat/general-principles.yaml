          name: dual_wielding
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: parrying_with_weapons
        right:
          type: literal
          value: true
  effects:
    - type: add
      target: parry_modifier
      value:
        type: literal
