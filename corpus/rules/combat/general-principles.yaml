- id: combat.principles.shooting_through_doorways
  name: Shooting Through Doorways
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Shooting Through Doorways
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    When shooting through doorways, consider the opening to be as wide as the 2 squares in
    front of it. Even though the door in reality would be much smaller, we expect that the movement
    in battle makes a shot possible.
  type: definition
  scope: global
  fields:
    shooting_through_doorway:
      type: boolean
      role: input
      description: the shot passes through a doorway
    opening_width_squares:
      type: number
      role: output
      description: width of the opening for LOS purposes, in squares
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: shooting_through_doorway
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: opening_width_squares
      value:
        type: literal
        value: 2
