- id: combat.principles.hit_roll
  name: hit roll against CS or RS
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: General Principles of Combat
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Rolling below or equal to the CS or RS means that the weapon or projectile has a chance
    to hit its intended target. However, there are certain things that may affect the chance of
    hitting your target. A hero also has the possibility to dodge or parry an enemy’s attack.
  see_also:
    - section.combat.parry_with_a_weapon
  type: random_resolution
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: d100 attack roll
      minimum: 1
      maximum: 100
      integer: true
    modified_skill:
      type: number
      role: input
      description: CS or RS after modifiers
    may_hit:
      type: boolean
      role: output
      description: the weapon or projectile has a chance to hit its intended target
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: field
          name: modified_skill
    - type: set
      target: may_hit
      value:
        type: literal
        value: true
  term_refs:
    - term.combat_skill
    - term.ranged_skill
    - term.dodge
- id: combat.fumble.dodge_or_shove
  name: hero fumble when dodging or shoving
  section_id: section.combat.fumble
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Fumble
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A hero fumbling when dodging or shoving will fall over and become prone.
  type: trigger
  scope: global
  fields:
    is_hero:
      type: boolean
      role: input
      description: the fumbling model is a hero
    roll:
      type: number
      role: input
      description: d100 roll
      minimum: 1
      maximum: 100
      integer: true
    dodging_or_shoving:
      type: boolean
      role: input
      description: the hero rolled while dodging or shoving
    hero_prone:
      type: boolean
      role: output
      description: the hero falls over and becomes prone
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: is_hero
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 100
      - type: compare
        operator: eq
        left:
          type: field
          name: dodging_or_shoving
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: hero_prone
      value:
        type: literal
        value: true
