      pdf_page: 113
      printed_page: 111
      heading: Shooting at Large-Sized Monsters and Flyers
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: When shooting at Large-Sized or X-Large Monsters, your heroes gain a RS +10 bonus.
  type: modifier
  scope: global
  fields:
    shooter_is_hero:
      type: boolean
      role: input
      description: the shooter is a hero
    shooting:
      type: boolean
      role: input
      description: the attack is a shot with a Ranged Weapon
    target_large_or_x_large:
      type: boolean
      role: input
      description: the target is a Large-Sized or X-Large Monster
    ranged_modifier:
      type: number
      role: state
      description: RS modifier for this shot
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: shooter_is_hero
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: shooting
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: target_large_or_x_large
        right:
          type: literal
          value: true
  effects:
    - type: add
      target: ranged_modifier
      value:
        type: literal
        value: 10
      duration: check
  term_refs:
    - term.ranged_skill
- id: combat.principles.shooting_large.targeting
  name: targeting large and flying Monsters
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Shooting at Large-Sized Monsters and Flyers
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Large, X-large and flying Monsters can always be targeted if they are in LOS, even if
    there are other models in the way. They do have the benefit of cover from half-height obstacles
    though, and models in between do count as such obstacles. Flyers do not block LOS.
  type: exception
  scope: global
  fields:
    target_large_x_large_or_flying:
      type: boolean
      role: input
      description: the target is a Large, X-large or flying Monster
    in_los:
      type: boolean
      role: input
      description: the target is in LOS
    may_target:
      type: boolean
      role: output
      description: the target may be shot even with other models in the way
    models_between_count_as_half_height:
      type: boolean
      role: output
      description: models in between count as half-height obstacles
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: target_large_x_large_or_flying
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: in_los
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: may_target
      value:
        type: literal
        value: true
    - type: set
      target: models_between_count_as_half_height
      value:
        type: literal
        value: true
  term_refs:
    - term.line_of_sight
- id: combat.principles.flyers_los
