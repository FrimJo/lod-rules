- id: combat.principles.fighting_in_doorways
  name: Fighting in Doorways
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Fighting in Doorways
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Often the heroes find themselves fighting in a doorway, striking at the enemy on the
    other side. Any character standing next to a doorway can attack or shove an enemy standing on
    any of the opposite two squares on the other side of the doorway.
  type: exception
  scope: global
  fields:
    next_to_doorway:
      type: boolean
      role: input
      description: the character stands next to a doorway
    enemy_on_opposite_two_squares:
      type: boolean
      role: input
      description: the enemy stands on one of the opposite two squares on the other side
    may_attack_or_shove:
      type: boolean
      role: output
      description: the character may attack or shove that enemy
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: next_to_doorway
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: enemy_on_opposite_two_squares
        right:
          type: literal
          value: true
  effects:
    - type: set
      target: may_attack_or_shove
      value:
        type: literal
        value: true
