      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Shooting at Large-Sized Monsters and Flyers
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Flyers do not block LOS.
  type: exception
  scope: global
  fields:
    model_is_flyer:
      type: boolean
      role: input
      description: the model in the line is a Flyer
    blocks_los:
      type: boolean
      role: output
      description: the model blocks LOS
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: model_is_flyer
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: blocks_los
      value:
        type: literal
        value: false
  term_refs:
    - term.line_of_sight
- id: combat.principles.shooting_in_melee
  name: Shooting in Melee
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Shooting in Melee
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Both heroes and enemies can shoot at targets that are in melee with other models.
    However, a Ranged Weapon cannot be used while adjacent to an enemy, unless specified otherwise
    by other rules.
  issues:
    - issue.combat.long_range_weapons
  type: constraint
  scope: global
  fields:
    shooter_adjacent_to_enemy:
      type: boolean
      role: input
      description: the shooter is adjacent to an enemy
    other_rule_permits:
      type: boolean
      role: input
      description: another rule specifies otherwise
    may_shoot:
      type: boolean
      role: output
      description: the Ranged Weapon may be used
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: shooter_adjacent_to_enemy
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: other_rule_permits
            right:
              type: literal
              value: true
    - type: set
      target: may_shoot
      value:
        type: literal
        value: true
- id: combat.principles.shooting_los
  name: shooting needs centre-to-centre LOS
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Obstacles and LOS When Shooting
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Shooting can only be done if you can trace a LOS from the centre of the shooter's
    square to the centre of the target's square.
  see_also:
    - section.game_basics.line_of_sight_los
  type: constraint
  scope: global
  fields:
    centre_to_centre_los:
      type: boolean
      role: input
      description: a LOS can be traced from the centre of the shooter’s square to the centre of the
        target’s square
    may_shoot:
      type: boolean
      role: output
      description: the shot may be made
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: centre_to_centre_los
        right:
          type: literal
          value: true
    - type: set
      target: may_shoot
      value:
        type: literal
        value: true
  term_refs:
    - term.line_of_sight
- id: combat.principles.shooting_obstacles
  name: half-height obstacles and models in the LOS
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Obstacles and LOS When Shooting
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If there are any half-height obstacles or models in the LOS when shooting, there is a
    -10 chance of hitting your target. This is cumulative. Note that it must be the actual object
    that interferes with the LOS line, not just the square with an object. If it’s a model, the line
    only needs to touch the square for this rule to come into effect. Details on objects are given
    in the dungeon objects table.
  see_also:
    - section.into_the_dungeons.obstacles.rule_of_fifty_percent
    - section.combat.hero_attacking.table
  unresolved_references:
    - the dungeon objects table
  type: modifier
  scope: global
  fields:
    interfering_objects_and_models:
      type: number
      role: input
      description:
        half-height objects whose actual object crosses the LOS line, plus models whose square
        the line touches
      minimum: 0
      integer: true
    ranged_modifier:
      type: number
      role: state
      description: RS modifier for this shot
  effects:
    - type: add
      target: ranged_modifier
      value:
        type: arithmetic
        operator: multiply
        values:
          - type: field
            name: interfering_objects_and_models
          - type: literal
            value: -10
      duration: check
  uses_tables:
    - table.combat.ranged_modifiers
- id: combat.principles.shooting_past_model
  name: unmodified 90+ hits the model shot past
  section_id: section.combat.general_principles_of_combat
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 113
      printed_page: 111
      heading: Obstacles and LOS When Shooting
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If shooting past another model, an unmodified result of >=90 hits the other model.
  issues:
    - issue.combat.shooting_past_fumble
  type: trigger
  scope: global
  fields:
    shooting_past_model:
      type: boolean
      role: input
      description: the shot passes another model
    unmodified_roll:
      type: number
      role: input
      description: unmodified d100 result
      minimum: 1
      maximum: 100
      integer: true
    hits_other_model:
      type: boolean
      role: output
      description: the shot hits the other model instead
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: shooting_past_model
        right:
          type: literal
          value: true
      - type: compare
        operator: gte
        left:
          type: field
          name: unmodified_roll
        right:
          type: literal
          value: 90
  effects:
    - type: set
      target: hits_other_model
      value:
        type: literal
        value: true
- id: combat.principles.shooting_straight_line
  name: no shooting through a model on a straight line
