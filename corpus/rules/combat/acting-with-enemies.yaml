- id: combat.enemy.behaviour_roll
  name: Behaviour Roll
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      heading: Acting with Enemies
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Enemies will act according to a Behaviour Roll. Depending on the type of enemy, their
    actions can vary. The behaviour type of the enemy is described in the Bestiary as well as in the
    Behaviour Tables. You can roll the Behaviour Roll at the same time as the Attack Dice to save
    time.
  type: procedure_rule
  scope: battle
  fields:
    enemy_acting:
      type: boolean
      role: input
      description: An enemy is about to act.
    behaviour_roll_required:
      type: boolean
      role: output
      description: The enemy acts according to a Behaviour Roll.
  effects:
    - type: set
      target: behaviour_roll_required
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enemy_acting
    right:
      type: literal
      value: true
  issues:
    - issue.combat.behaviour_card_naming
  dependencies:
    - key: bestiary
      label:
        The behaviour type of the enemy is described in the Bestiary as well as in the Behaviour
        Tables
      external_document: bestiary
  term_refs:
    - term.behaviour_roll
- id: combat.enemy.activation_order
  name: Activation of Enemies
  section_id: section.combat.activation_of_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Activation of Enemies
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Enemies are activated in a certain order so they do not block each other. Whenever you
    draw an enemy token, activate enemies in the order described below. Consult their Behaviour Card
    to see where they fit in the list. Randomise if there are two or more enemies that could
    possibly act at the same time. 1. Magic User or enemy armed with Ranged Weapon. 2. An enemy
    adjacent to a hero that could make room for more enemies. 3. Enemy adjacent to hero. 4. Enemy
    closest to a hero and that could charge. 5. Enemy that has enough space to move its full
    movement. 6. Random enemy.
  type: procedure_rule
  scope: battle
  fields:
    enemy_token_drawn:
      type: boolean
      role: input
      description: An enemy token was drawn.
    activation_order_applies:
      type: boolean
      role: output
      description: Enemies are activated in the printed order.
  effects:
    - type: set
      target: activation_order_applies
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: enemy_token_drawn
    right:
      type: literal
      value: true
  issues:
    - issue.combat.behaviour_card_naming
  dependencies:
    - key: priority
      label: Activation order 1–6 with randomised ties
      object_id: procedure.enemy_priority
- id: combat.enemy.basic.facing
  name: Enemy facing at end of turn
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Basic Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'There are some basic rules that apply to all enemies: ... An enemy will always end its
    turn with as few heroes behind it as possible. Turn the enemy to the most favourable position.'
  type: constraint
  scope: battle
  fields:
    ending_turn:
      type: boolean
      role: input
      description: The enemy is ending its turn.
    facing:
      type: string
      role: output
      description: Facing chosen at the end of the turn.
  effects:
    - type: set
      target: facing
      value:
        type: literal
        value: fewest_heroes_behind
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: ending_turn
    right:
      type: literal
      value: true
- id: combat.enemy.basic.facing_missile
  name: Enemy turns its back towards the missile weapon
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Basic Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    If it has to choose between turning its back to an adjacent hero or a hero further away
    with missile weapons, it will turn its back towards the missile weapon.
  type: constraint
  scope: battle
  fields:
    ending_turn:
      type: boolean
      role: input
      description: The enemy is ending its turn.
    choice_adjacent_or_missile:
      type: boolean
      role: input
      description: It must choose between an adjacent hero and a hero further away with missile weapons.
    back_towards:
      type: string
      role: output
      description: Which hero the enemy turns its back towards.
  effects:
    - type: set
      target: back_towards
      value:
        type: literal
        value: missile_weapon
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ending_turn
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: choice_adjacent_or_missile
        right:
          type: literal
          value: true
- id: combat.enemy.basic.pit_hero
  name: Enemies ignore heroes in a pit
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Basic Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    An enemy cannot attack heroes that have fallen into a pit. Therefore, they ignore that
    hero when choosing actions.
  type: constraint
  scope: battle
  fields:
    hero_in_pit:
      type: boolean
      role: input
      description: The hero has fallen into a pit.
    may_attack_hero:
      type: boolean
      role: output
      description: The enemy may attack that hero.
    ignore_hero:
      type: boolean
      role: output
      description: The enemy ignores that hero when choosing actions.
  effects:
    - type: set
      target: may_attack_hero
      value:
        type: literal
        value: false
    - type: set
      target: ignore_hero
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: hero_in_pit
    right:
      type: literal
      value: true
- id: combat.enemy.basic.pit_fall.normal
  name: Normal sized enemy falls into a pit
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Basic Rules
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Normal sized enemies that fall into pits disappear without XP or loot.
  type: trigger
  scope: battle
  fields:
    fell_into_pit:
      type: boolean
      role: input
      description: The enemy fell into a pit.
    enemy_size:
      type: string
      role: input
      description: normal, large or x_large.
    removed:
      type: boolean
      role: output
      description: The enemy disappears.
    xp_awarded:
      type: boolean
      role: output
      description: XP is awarded.
    loot_awarded:
      type: boolean
      role: output
      description: Loot is awarded.
  effects:
    - type: set
      target: removed
      value:
        type: literal
        value: true
    - type: set
      target: xp_awarded
      value:
        type: literal
        value: false
    - type: set
      target: loot_awarded
      value:
        type: literal
        value: false
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: fell_into_pit
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: enemy_size
        right:
          type: literal
          value: normal
