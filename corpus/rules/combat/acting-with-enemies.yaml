    resolution:
      type: string
      role: output
      description: How the model is moved.
  effects:
    - type: set
      target: resolution
      value:
        type: literal
        value: most_favourable_for_enemy
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: rules_unclear
    right:
      type: literal
      value: true
- id: combat.enemy.basic.unclear_tie
