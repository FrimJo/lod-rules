    creature_kind:
      type: string
      role: input
      description: lower_undead, no_hands, ethereal or other.
    large:
      type: boolean
      role: input
      description: The creature is Large.
    door_ap_roll_large:
      type: number
      role: input
      description: The 1d3 AP roll.
      integer: true
      minimum: 1
      maximum: 3
      dice:
