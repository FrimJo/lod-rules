- id: combat.defence.through_zoc
  name: Dodging and parrying need an attack through the ZOC
  section_id: section.combat.detailed_acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 120
      printed_page: 118
      section: Detailed acting with enemies
      heading: Parrying or Dodging
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Dodging and parrying can only be done if the attack comes through the hero’s ZOC. They
    can be done against arrows or strikes, unless a Talent or Perk states otherwise.
  type: constraint
  scope: battle
  fields:
    through_zoc:
      type: boolean
      role: input
      description: The attack comes through the hero’s ZOC.
    attack_type:
      type: string
      role: input
      description: strike or arrow
    talent_or_perk_forbids:
      type: boolean
      role: input
      description: a Talent or Perk states that this arrow or strike cannot be dodged or parried
    may_defend:
      type: boolean
      role: output
      description: the hero may dodge or parry this attack
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: through_zoc
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: attack_type
                right:
                  type: literal
                  value: strike
              - type: compare
                operator: eq
                left:
                  type: field
                  name: attack_type
                right:
                  type: literal
                  value: arrow
          - type: compare
            operator: eq
            left:
              type: field
              name: talent_or_perk_forbids
            right:
              type: literal
              value: false
    - type: set
      target: may_defend
      value:
        type: literal
        value: true
  term_refs:
    - term.zone_of_control
    - term.dodge
    - term.parry
