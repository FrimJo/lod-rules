      heading: Detailed acting with enemies
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The enemy will follow the numbered options from the top down, stopping and performing
    the first action that fits the situation. Once that action is performed, and the enemy still has
    Action Points, start over from the top again.
  type: procedure_rule
  scope: battle
  fields:
    action_performed:
      type: boolean
      role: input
      description: The enemy has performed an action.
    action_points_left:
      type: number
      role: input
      description: Action Points the enemy still has.
    restart_from_top:
      type: boolean
      role: output
      description: Start over from the top of the numbered options.
  effects:
    - type: set
      target: restart_from_top
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: action_performed
        right:
          type: literal
          value: true
      - type: compare
        operator: gt
        left:
          type: field
          name: action_points_left
        right:
          type: literal
          value: 0
  dependencies:
    - key: humanoid_example
      label: Humanoid with Close-Combat Weapon
      object_id: procedure.humanoid_close_combat_behaviour
