- id: combat.enemy_behaviour.top_down
  name: Enemies follow numbered options from the top down
  section_id: section.combat.detailed_acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
