          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: equal_possibilities
        right:
          type: literal
          value: true
- id: combat.enemy.door.open
  name: Enemies open closed doors
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Enemies and doors
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'A closed door will not stop enemies from trying to attack the heroes and they will
    continue to move towards them. Once they reach the closed door, they will have to open it. The
    first enemy to reach the door and still have 1 AP left is the one who is considered to open the
    door. This normally requires 1 AP. There are some exceptions though:'
  type: procedure_rule
  scope: battle
  fields:
    at_closed_door:
      type: boolean
      role: input
      description: The enemy has reached the closed door.
    first_with_ap:
      type: boolean
      role: input
      description: It is the first enemy to reach the door and still have 1 AP left.
    opens_door:
      type: boolean
      role: output
      description: This enemy is considered to open the door.
    door_ap_cost:
      type: number
      role: output
      description: AP required to get through the door.
  effects:
    - type: set
      target: opens_door
      value:
        type: literal
        value: true
    - type: set
      target: door_ap_cost
      value:
        type: literal
        value: 1
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: at_closed_door
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: first_with_ap
        right:
          type: literal
          value: true
- id: combat.enemy.door.lower_undead
  name: Lower Undead open doors with 2 AP
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Enemies and doors
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Lower Undead requires 2 AP to open a door.
  type: exception
  scope: battle
  fields:
    at_closed_door:
      type: boolean
      role: input
      description: The enemy has reached the closed door.
    first_with_ap:
      type: boolean
      role: input
      description: First enemy at the door with 1 AP left.
    creature_kind:
      type: string
      role: input
      description:
        lower_undead, no_hands (no hands or not intelligent enough to operate a door), ethereal
        or other.
    opens_door:
      type: boolean
      role: output
      description: This enemy opens the door.
    door_ap_cost:
      type: number
      role: output
      description: AP required.
  effects:
    - type: set
      target: opens_door
      value:
        type: literal
        value: true
    - type: set
      target: door_ap_cost
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: at_closed_door
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: first_with_ap
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: creature_kind
        right:
          type: literal
          value: lower_undead
  overrides:
    - combat.enemy.door.open
- id: combat.enemy.door.no_hands
  name: Creatures that cannot operate a door break through
  section_id: section.combat.acting_with_enemies
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 118
      printed_page: 116
      section: Acting with Enemies
      heading: Enemies and doors
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Creatures that don’t have hands or reasonably won’t have the intelligence to operate a
    door requires 1d6 AP to get through. Once through, the door is considered broken.
  type: exception
  scope: battle
  fields:
    at_closed_door:
      type: boolean
      role: input
      description: The enemy has reached the closed door.
    first_with_ap:
      type: boolean
      role: input
      description: First enemy at the door with 1 AP left.
    creature_kind:
      type: string
      role: input
      description: lower_undead, no_hands, ethereal or other.
    large:
      type: boolean
      role: input
      description: The creature is Large.
    door_ap_roll:
      type: number
      role: input
      description: The 1d6 AP roll.
      integer: true
      minimum: 1
      maximum: 6
      dice:
        count: 1
        sides: 6
    door_ap_cost:
      type: number
      role: output
      description: AP required.
    door_broken_once_through:
      type: boolean
      role: output
      description: Once through, the door is considered broken.
  effects:
    - type: set
      target: door_ap_cost
      value:
        type: field
        name: door_ap_roll
    - type: set
      target: door_broken_once_through
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: at_closed_door
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: first_with_ap
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: creature_kind
        right:
          type: literal
          value: no_hands
      - type: compare
        operator: eq
        left:
          type: field
          name: large
        right:
          type: literal
          value: false
  overrides:
    - combat.enemy.door.open
