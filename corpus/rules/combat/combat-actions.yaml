- id: combat.who_can_fight.adjacent
  name: adjacent models may strike
  section_id: section.combat.who_can_fight
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Who Can Fight?
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Models that are adjacent may strike at each other.
  type: constraint
  scope: global
  fields:
    adjacent:
      type: boolean
      role: input
      description: the attacker and target are adjacent
    may_strike:
      type: boolean
      role: output
      description: the attacker may strike the target
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: adjacent
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: may_strike
      value:
        type: literal
        value: true
  term_refs:
    - term.adjacent
- id: combat.who_can_fight.reach
  name: Reach strike across one square
  section_id: section.combat.who_can_fight
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Who Can Fight?
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Models equipped with a weapon with the Reach Special Rule, can strike at an enemy 1
    square away, even if there is a friendly (not enemy) model in between.
  see_also:
    - section.appendix_iii_equipment.weapons.table
  type: exception
  scope: global
  fields:
    weapon_has_reach:
      type: boolean
      role: input
      description: the striking weapon has the Reach Special Rule
    squares_between:
      type: number
      role: input
      description: squares between the striker and the enemy
      minimum: 0
      integer: true
    enemy_model_between:
      type: boolean
      role: input
      description: an enemy model stands in the square in between
    may_strike:
      type: boolean
      role: output
      description: the attacker may strike the target
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: weapon_has_reach
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: squares_between
        right:
          type: literal
          value: 1
      - type: compare
        operator: eq
        left:
          type: field
          name: enemy_model_between
        right:
          type: literal
          value: false
  effects:
    - type: set
      target: may_strike
      value:
        type: literal
        value: true
- id: combat.who_can_fight.missile_range
  name: Missile Weapon reach
  section_id: section.combat.who_can_fight
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Who Can Fight?
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Models equipped with Missile Weapons have a maximum reach of 10 squares in a dungeon,
    and unlimited range outdoors.
  type: constraint
  scope: global
  fields:
    weapon_is_missile_weapon:
      type: boolean
      role: input
      description: the model attacks with a Missile Weapon
    outdoors:
      type: boolean
      role: input
      description: the shot is made outdoors rather than in a dungeon
    distance:
      type: number
      role: input
      description: distance to the target in squares
      minimum: 0
      integer: true
    within_range:
      type: boolean
      role: output
      description: the target is within the Missile Weapon reach
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: weapon_is_missile_weapon
    right:
      type: literal
      value: true
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: outdoors
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: distance
            right:
              type: literal
              value: 10
    - type: set
      target: within_range
      value:
        type: literal
        value: true
- id: combat.who_can_fight.long_range_adjacent
  name: Long Range Weapons and adjacent enemies
  section_id: section.combat.who_can_fight
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Who Can Fight?
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Long Range Weapons may not normally be fired if an enemy is standing adjacent to the firer.
  issues:
    - issue.combat.long_range_weapons
  type: constraint
  scope: global
  fields:
    weapon_is_long_range_weapon:
      type: boolean
      role: input
      description: the firer uses a Long Range Weapon (supplied; the book does not define the category)
    enemy_adjacent:
      type: boolean
      role: input
      description: an enemy is standing adjacent to the firer
    exception_applies:
      type: boolean
      role: input
      description: another printed rule lets this weapon fire while an enemy is adjacent
    may_fire:
      type: boolean
      role: output
      description: the Long Range Weapon may be fired
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: weapon_is_long_range_weapon
    right:
      type: literal
      value: true
  effects:
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_adjacent
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: exception_applies
            right:
              type: literal
              value: true
    - type: set
      target: may_fire
      value:
        type: literal
        value: true
