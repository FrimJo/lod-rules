    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 111
      printed_page: 109
      heading: Move
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A model may move up to its full M. If a model decides to move in their second action as
    well, they only move half their movement (Rounded down) in the 2nd action. A model may move
    diagonally, even diagonally between friendly models but may not move through certain obstacles
    or other models.
  see_also:
    - section.into_the_dungeons.moving_and_facing
  type: calculation
  scope: global
  fields:
    movement:
      type: number
      role: input
      description: the model’s M
      minimum: 0
      integer: true
    move_action:
      type: string
      role: input
      description: first or second move action of the turn
    movement_allowance:
      type: number
      role: output
      description: squares the model may move in this action
  effects:
    - type: choice
      selection: move_action
      options:
        - id: first
          effects:
            - type: set
              target: movement_allowance
              value:
                type: field
                name: movement
        - id: second
          effects:
            - type: set
              target: movement_allowance
              value:
                type: arithmetic
                operator: floor
                values:
                  - type: arithmetic
                    operator: divide
                    values:
                      - type: field
                        name: movement
                      - type: literal
                        value: 2
  term_refs:
    - term.movement
    - term.rounded_down
