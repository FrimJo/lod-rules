      heading: Charge Attack
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A successful Charge Attack will stagger the target even if it does not lose HP (and
    manages to parry or dodge) and it is considered to be shoved in all respects and must be moved
    away from the charger following the direction of the charge when possible. You may then enter
    the square of the target if no other factors limit this.
