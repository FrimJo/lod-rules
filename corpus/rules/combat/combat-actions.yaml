  status: extracted
  confidence: high
  source_text: A model may try to shove another adjacent model that does not have the large Special
    Rule by rolling higher than the target’s DEX. A character with DB may add DBx10 to the roll.
  type: random_resolution
  scope: global
  fields:
    target_adjacent:
      type: boolean
      role: input
      description: the target is adjacent
    target_large:
      type: boolean
      role: input
      description: the target has the large Special Rule
    roll:
      type: number
      role: input
      description: d100 shove roll
      minimum: 1
      maximum: 100
      integer: true
    damage_bonus:
      type: number
      role: input
      description: the shoving character’s DB (0 if none)
      minimum: 0
      integer: true
    target_dexterity:
      type: number
      role: input
      description: the target’s DEX
      minimum: 0
      integer: true
    shove_total:
      type: number
      role: output
      description: roll plus DBx10
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: target_adjacent
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_large
            right:
              type: literal
              value: false
    - type: set
      target: shove_total
      value:
        type: sum
        values:
          - type: field
            name: roll
          - type: arithmetic
            operator: multiply
            values:
              - type: field
                name: damage_bonus
              - type: literal
                value: 10
  term_refs:
    - term.dexterity
    - term.damage_bonus
