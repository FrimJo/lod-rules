- id: combat.action.shove.displacement
  name: Shove displacement
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 111
      printed_page: 109
      heading: Shove
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Shove
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If successful, the shoving model may move the targeted model one space straight back,
    and if it is blocked, diagonally back. If there is another model behind the target, it will also
    be moved straight back. A shove can never affect more than two models and if the shoved model
    cannot move, it falls over instead. The shoving model may enter any space vacated by the
    targeted model.
  issues:
    - issue.combat.shove_displacement_order
  type: procedure_rule
  scope: global
  fields:
    shove_succeeded:
      type: boolean
      role: input
      description: the shove succeeded
    straight_back_free:
      type: boolean
      role: input
      description: the square straight behind the target is free
    model_behind_can_move_straight_back:
      type: boolean
      role: input
      description: a model behind the target can itself be moved one square straight back
    diagonal_back_free:
      type: boolean
      role: input
      description: a square diagonally behind the target is free
    displacement_case:
      type: string
      role: input
      description: straight_free, push_model_behind, diagonal or blocked
    target_destination:
      type: string
      role: output
      description: straight_back, diagonal_back or none
    second_model_moved:
      type: boolean
      role: output
      description: the model behind the target is moved straight back
    target_falls_over:
      type: boolean
      role: output
      description: the target falls over instead of moving
    shover_may_enter_vacated:
      type: boolean
      role: output
      description: the shoving model may enter the vacated space
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: shove_succeeded
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: second_model_moved
      value:
        type: literal
        value: false
    - type: set
      target: target_falls_over
      value:
        type: literal
        value: false
    - type: choice
      selection: displacement_case
      options:
        - id: straight_free
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: straight_back_free
            right:
              type: literal
              value: true
          effects:
            - type: set
              target: target_destination
              value:
                type: literal
                value: straight_back
            - type: set
              target: shover_may_enter_vacated
              value:
                type: literal
                value: true
        - id: push_model_behind
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: straight_back_free
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: model_behind_can_move_straight_back
                right:
                  type: literal
                  value: true
          effects:
            - type: set
              target: second_model_moved
              value:
                type: literal
                value: true
            - type: set
              target: target_destination
              value:
                type: literal
                value: straight_back
            - type: set
              target: shover_may_enter_vacated
              value:
                type: literal
                value: true
        - id: diagonal
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: straight_back_free
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: diagonal_back_free
                right:
                  type: literal
                  value: true
          effects:
            - type: set
              target: target_destination
              value:
                type: literal
                value: diagonal_back
            - type: set
              target: shover_may_enter_vacated
              value:
                type: literal
                value: true
        - id: blocked
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: straight_back_free
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: model_behind_can_move_straight_back
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: diagonal_back_free
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: target_destination
              value:
                type: literal
                value: none
            - type: set
              target: target_falls_over
              value:
                type: literal
                value: true
