- id: combat.action.apply_bandage.other
  name: apply bandage to an adjacent hero
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Apply Bandage
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If you have a bandage equipped in a Quick Slot you can apply that to an adjacent hero
    if you succeed with a Healing Roll. This cannot be done if either of the two heroes have enemies
    adjacent. The wounded hero loses 1 AP as well.
  see_also:
    - section.equipment.carrying_equipment
    - section.combat.bleeding_out
  type: constraint
  scope: global
  fields:
    bandage_in_quick_slot:
      type: boolean
      role: input
      description: the bandage is equipped in a Quick Slot
    target_adjacent:
      type: boolean
      role: input
      description: the wounded hero is adjacent
    enemies_adjacent_to_either:
      type: boolean
      role: input
      description: either hero has enemies adjacent
    healing_roll_succeeded:
      type: boolean
      role: input
      description: the Healing Roll succeeded
    bandage_applied:
      type: boolean
      role: output
      description: the bandage is applied
    wounded_hero_ap_lost:
      type: number
      role: output
      description: AP the wounded hero loses
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: bandage_in_quick_slot
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_adjacent
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: enemies_adjacent_to_either
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: healing_roll_succeeded
            right:
              type: literal
              value: true
    - type: set
      target: bandage_applied
      value:
        type: literal
        value: true
    - type: set
      target: wounded_hero_ap_lost
      value:
        type: literal
        value: 1
  term_refs:
    - term.quick_slot
    - term.heal
