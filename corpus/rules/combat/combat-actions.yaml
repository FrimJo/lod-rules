      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This can only be done by player-controlled models, and only models that are not
    adjacent to an enemy. Only equipment from a Quick Slot may be exchanged and it costs 1 AP for
    both models. They must be within 4 squares of each other, and if you draw a straight line
    between them, there may be no other models in the squares passed by that line. Potions and beef
    jerky may be consumed as part of that action.
  see_also:
    - section.equipment.carrying_equipment
  type: constraint
  scope: global
  fields:
    both_player_controlled:
      type: boolean
      role: input
      description: both models are player-controlled
    either_adjacent_to_enemy:
      type: boolean
      role: input
      description: either model is adjacent to an enemy
    item_from_quick_slot:
      type: boolean
      role: input
      description: the exchanged equipment comes from a Quick Slot
    distance:
      type: number
      role: input
      description: squares between the two models
      minimum: 0
      integer: true
    models_on_line:
      type: boolean
      role: input
      description: another model is in a square passed by the straight line between them
    exchange_allowed:
      type: boolean
      role: output
      description: the exchange may be made
    ap_cost_each:
      type: number
      role: output
      description: AP each of the two models spends
    may_consume_potion_or_jerky:
      type: boolean
      role: output
      description: potions and beef jerky may be consumed as part of the action
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: both_player_controlled
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: either_adjacent_to_enemy
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: item_from_quick_slot
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: distance
            right:
              type: literal
              value: 4
          - type: compare
            operator: eq
            left:
              type: field
              name: models_on_line
            right:
              type: literal
              value: false
    - type: set
      target: exchange_allowed
      value:
        type: literal
        value: true
    - type: set
      target: ap_cost_each
      value:
        type: literal
        value: 1
    - type: set
      target: may_consume_potion_or_jerky
      value:
        type: literal
        value: true
  term_refs:
    - term.quick_slot
