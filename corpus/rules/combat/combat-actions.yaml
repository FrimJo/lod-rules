  source_text: If a model has dropped its weapon it can try to pick it up. If there are no adjacent
    enemies, it succeeds automatically. If there are enemies adjacent, it succeeds by passing a DEX
    Test. If a model moves away from that square for some reason, the weapon is still in that square
    but can be picked up from any squares adjacent to the weapon.
  type: random_resolution
  scope: global
  fields:
    adjacent_to_weapon_square:
      type: boolean
      role: input
      description: the model is in or adjacent to the square holding the weapon
    enemies_adjacent:
      type: boolean
      role: input
      description: enemies are adjacent to the model
    dex_test_passed:
      type: boolean
      role: input
      description: the model passed a DEX Test
    picked_up:
      type: boolean
      role: output
      description: the weapon is picked up
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: adjacent_to_weapon_square
        right:
          type: literal
          value: true
    - type: require
      condition:
