- id: combat.action.charge.requirements
  name: Charge Attack requirements
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Charge Attack
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 10
      printed_page: null
      heading: '2.21'
      locator:
        row: 67
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    In order to charge an enemy, there must be at least 1 empty square between you and the
    enemy. A charge must also be done in a straight or strict diagonal line and may not pass a
    square covered more than 50% by an obstacle. The character is allowed change facing before
    charging. You must move (up to your max M) adjacent to the enemy (any of the 3 squares in front
    of the enemy) and perform a standard attack.
  issues:
    - issue.combat.charge_move_wording
  type: constraint
  scope: global
  fields:
    empty_squares_between:
      type: number
      role: input
      description: empty squares between the charger and the enemy
      minimum: 0
      integer: true
    straight_or_strict_diagonal:
      type: boolean
      role: input
      description: the charge path is a straight or strict diagonal line
    passes_obstacle_over_half:
      type: boolean
      role: input
      description: the path passes a square covered more than 50% by an obstacle
    path_length:
      type: number
      role: input
      description: squares moved by the charge
      minimum: 0
      integer: true
    movement:
      type: number
      role: input
      description: the charger’s M
      minimum: 0
      integer: true
    ends_in_front_of_enemy:
      type: boolean
      role: input
      description: the charge ends in one of the 3 squares in front of the enemy
    charge_allowed:
      type: boolean
      role: output
      description: the Charge Attack may be made
  effects:
    - type: require
      condition:
        type: all
        conditions:
          - type: compare
            operator: gte
            left:
              type: field
              name: empty_squares_between
            right:
              type: literal
              value: 1
          - type: compare
            operator: eq
            left:
              type: field
              name: straight_or_strict_diagonal
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: passes_obstacle_over_half
            right:
              type: literal
              value: false
          - type: compare
            operator: lte
            left:
              type: field
              name: path_length
            right:
              type: field
              name: movement
          - type: compare
            operator: eq
            left:
              type: field
              name: ends_in_front_of_enemy
            right:
              type: literal
              value: true
    - type: set
      target: charge_allowed
      value:
        type: literal
        value: true
  term_refs:
    - term.movement
