- id: combat.action.aim
  name: Aim bonus
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Aim
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Aim
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    By spending 1 AP to aim with a Ranged Weapon at a specific target, a model will gain a
    +10 modifier in the next action when shooting at that target. If the projectile is not fired in
    the next action, this bonus is lost. If the target moves out of sight, the bonus is lost. If
    another model moves through the LOS between the shooter and the target, even if it does not stop
    to block LOS, the bonus is lost. If an aiming model loses HP for some reason, the bonus is lost.
  see_also:
    - section.combat.hero_attacking.table
  type: modifier
  scope: global
  fields:
    ranged_weapon:
      type: boolean
      role: input
      description: the model aimed with a Ranged Weapon
    aimed_at_target:
      type: boolean
      role: input
      description: the model spent 1 AP aiming a Ranged Weapon at this target
    fired_next_action:
      type: boolean
      role: input
      description: the projectile is fired in the next action, at that target
    target_left_sight:
      type: boolean
      role: input
      description: the target moved out of sight
    model_crossed_los:
      type: boolean
      role: input
      description: another model moved through the LOS between shooter and target
    aimer_lost_hp:
      type: boolean
      role: input
      description: the aiming model lost HP
    ranged_modifier:
      type: number
      role: state
      description: RS modifier for this shot
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: ranged_weapon
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: aimed_at_target
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: fired_next_action
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: target_left_sight
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: model_crossed_los
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: aimer_lost_hp
        right:
          type: literal
          value: false
  effects:
    - type: add
      target: ranged_modifier
      value:
        type: literal
        value: 10
      duration: check
