- id: combat.weapon.special.stun
  name: Stun
  section_id: section.appendix_iii_equipment.weapons.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 177
      pdf_page: 179
      heading: Weapons
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: table.equipment.weapons
        region: printed special-rule definition
  status: extracted
  confidence: high
  source_text:
    This weapon has a chance to put the enemy off balance. If you roll an even number when
    rolling to damage, the enemy loses one action next turn. This does not stack.
  type: modifier
  scope: global
  fields:
    damage_roll:
      type: number
      role: input
      description: damage roll
    actions_lost_next_turn:
      type: number
      role: state
      description: actions lost next turn
  effects:
    - type: set
      target: actions_lost_next_turn
      value:
        type: literal
        value: 1
  uses_tables:
    - table.equipment.weapons
  when:
    type: compare
    operator: eq
    left:
      type: arithmetic
      operator: subtract
      values:
        - type: field
          name: damage_roll
        - type: arithmetic
          operator: multiply
          values:
            - type: literal
              value: 2
            - type: arithmetic
              operator: floor
              values:
                - type: arithmetic
                  operator: divide
                  values:
                    - type: field
                      name: damage_roll
                    - type: literal
                      value: 2
    right:
      type: literal
      value: 0
