        operator: eq
        left:
          type: field
          name: primary_is_hand_weapon
        right:
          type: literal
          value: true
    - type: set
      target: adjacent_target_allowed
      value:
        type: literal
        value: true
    - type: set
      target: reload_allowed
      value:
        type: literal
        value: false
