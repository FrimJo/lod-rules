- id: combat.weapon.special.ensnare
  name: Ensnare
  section_id: section.appendix_iii_equipment.weapons.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 177
      pdf_page: 179
      heading: Weapons
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        table: table.equipment.weapons
        region: printed special-rule definition
  status: extracted
  confidence: high
  source_text: If this weapon hits, the target is trapped in the net and must spend 1 action to get
    free with a successful DEX Test. Until freed, this is the only action it can do. A net can be
    used once per battle and is retrieved automatically after the battle.
  type: modifier
  scope: global
  fields:
    net_thrown:
      type: boolean
      role: input
      description: net thrown
    net_uses_this_battle:
      type: number
      role: output
      description: net uses this battle
    trapped_in_net:
      type: boolean
      role: output
      description: trapped in net
    attack_hit:
      type: boolean
      role: input
      description: attack hit
    only_escape_action:
      type: boolean
      role: output
      description: only escape action
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: net_uses_this_battle
        right:
          type: literal
          value: 0
    - type: set
      target: net_uses_this_battle
      value:
        type: literal
        value: 1
    - type: set
      target: trapped_in_net
      value:
        type: field
        name: attack_hit
    - type: set
      target: only_escape_action
      value:
        type: field
        name: attack_hit
  uses_tables:
    - table.equipment.weapons
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: net_thrown
    right:
      type: literal
      value: true
