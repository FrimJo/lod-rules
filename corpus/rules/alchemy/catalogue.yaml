  section_id: section.alchemy.preparations.potion_of_health
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 81
      printed_page: 79
      heading: Potion of Health
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: It comes in Weak, Standard, and Supreme formulas, which heal 1d4, 1d6, and 1d10 Hit Points, respectively.
  type: modifier
  scope: global
  fields:
    quality:
      type: string
      role: input
      description: quality
    effect_roll:
      type: number
      role: input
      description: effect roll
    effect_dice:
      type: string
      role: output
      description: effect dice
    amount:
      type: number
      role: output
      description: amount
  effects:
    - type: set
      target: effect_dice
      value:
        type: literal
        value: 1d4
    - type: set
      target: amount
      value:
        type: field
        name: effect_roll
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: quality
    right:
      type: literal
      value: weak
  entity_id: equipment.alchemy.potion_of_health
  uses_tables:
    - table.alchemy.strengths
