  section_id: section.alchemy.harvesting_parts
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 74
      printed_page: 72
      section: Harvesting parts
      heading: Quantity
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The quantity listed is not the actual number of parts collected. It is measurement for how
    many potions you would be able to create from these parts.
  type: definition
  scope: global
  fields:
    quantity_meaning:
      type: string
      role: output
      description: what the Quantity column of the harvesting table measures
  effects:
    - type: set
      target: quantity_meaning
      value:
        type: literal
        value: potions that can be created from the parts
  see_also:
    - section.alchemy.table_2
