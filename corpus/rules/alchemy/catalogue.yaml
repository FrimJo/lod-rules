      role: output
      description: consume
  effects:
    - type: set
      target: spell_modifier
      value:
        type: literal
        value: -20
    - type: set
      target: duration
      value:
        type: literal
        value: battle
    - type: set
      target: consume
      value:
        type: literal
        value: false
  entity_id: equipment.alchemy.bottle_of_the_void
