- id: character.alchemy.harvest
  name: harvest
  section_id: section.alchemy.harvesting_parts
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 74
      printed_page: 72
      heading: Harvesting parts
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    By passing an Alchemy test, a hero may collect parts from up to 3 dead enemies in LOS. The
    table below is used to determine the type and quantity of parts that can be harvested from a
    fallen enemy. If a specific enemy cannot be found on the list, that enemy will not provide
    anything useable for alchemy.
  type: modifier
  scope: global
  fields:
    alchemy_succeeded:
      type: boolean
      role: input
      description: alchemy succeeded
    dead_enemies:
      type: number
      role: input
      description: dead enemies
    all_in_los:
      type: boolean
      role: input
      description: all in los
    listed_enemy:
      type: boolean
      role: input
      description: listed enemy
    harvest_allowed:
      type: boolean
      role: output
      description: harvest allowed
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: dead_enemies
        right:
          type: literal
          value: 3
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: all_in_los
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: listed_enemy
        right:
          type: literal
          value: true
    - type: set
      target: harvest_allowed
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: alchemy_succeeded
    right:
      type: literal
      value: true
  see_also:
    - section.alchemy.table_2
- id: character.alchemy.harvest.exquisite
  name: exquisite
  section_id: section.alchemy.harvesting_parts
  source:
    - document: rulebook.second_printing.eng
