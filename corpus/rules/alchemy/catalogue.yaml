- id: character.alchemy.gathering
  name: gathering
  section_id: section.alchemy.gathering_ingredients
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 73
      printed_page: 71
      heading: gathering
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: During travel to/from quests, once per day use the highest Alchemical Skill. Success
    rolls twice on Ingredients Table. A gathering roll 01-10 makes all ingredients Exquisite. Travel
    procedure remains deferred.
  type: modifier
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
    alchemy:
      type: number
      role: input
      description: alchemy
    ingredient_table_rolls:
      type: number
      role: output
      description: ingredient table rolls
  effects:
    - type: set
      target: ingredient_table_rolls
      value:
        type: literal
        value: 2
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: alchemy
