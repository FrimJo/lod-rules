- id: character.alchemy.identify
  name: identify
  section_id: section.alchemy.identifying_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: Identifying Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Before using potions, they must be identified. Even though you know its content through the
    rolls on tables, your heroes do not. They are not too eager to risk their lives by drinking
    something they found in an old dungeon. A successful Alchemy roll is all that is needed. This
    can be done once per hero and potion. If this fails, it can be identified in a settlement.
  type: modifier
  scope: global
  fields:
    attempts_this_hero_potion:
      type: number
      role: input
      description: attempts this hero potion
    roll:
      type: number
      role: input
      description: roll
    alchemy:
      type: number
      role: input
      description: alchemy
    identified:
      type: boolean
      role: output
      description: identified
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: attempts_this_hero_potion
        right:
          type: literal
          value: 0
    - type: set
      target: identified
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: alchemy
  see_also:
    - section.settlements.identifying_items_and_potions
  term_refs:
    - term.alchemy
- id: character.alchemy.drink
  name: drink
  section_id: section.alchemy.drinking_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: Drinking Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Drinking a potion requires 1 action. Potions that increase your heroes’ stats last for 5
    turns, unless stated otherwise. The empty bottle may be kept and used when making new potions.
    Potions that temporarily increases a stat of your hero do not stack. That is, drinking 2
    potions of dexterity does not give you double the effect, but you could drink one potion of
    strength, and also one potion of dexterity, and acquire both bonuses.
  type: modifier
  scope: global
  fields:
    same_stat_potion_active:
      type: boolean
      role: input
      description: same stat potion active
    actions_spent:
      type: number
      role: output
      description: actions spent
    default_duration_turns:
      type: number
      role: output
      description: default duration turns
    keep_bottle:
      type: boolean
      role: output
      description: keep bottle
    stat_effect_applied:
      type: boolean
      role: output
      description: stat effect applied
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: same_stat_potion_active
        right:
          type: literal
          value: false
    - type: set
      target: actions_spent
      value:
        type: literal
        value: 1
    - type: set
      target: default_duration_turns
      value:
        type: literal
        value: 5
    - type: set
      target: keep_bottle
      value:
        type: literal
        value: true
    - type: set
      target: stat_effect_applied
      value:
        type: literal
        value: true
- id: character.alchemy.components
  name: components
  section_id: section.alchemy.components_for_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: Components for Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    There are two different kinds of components for potions. Ingredients come from plants, whereas
    parts come from defeated monsters. These can be harvested by a hero, but components can also
    be purchased at the Alchemists’ Guild and certain stores.
  type: modifier
  scope: global
  fields:
    ingredient_origin:
      type: string
      role: output
      description: ingredient origin
    part_origin:
      type: string
      role: output
      description: part origin
  effects:
    - type: set
      target: ingredient_origin
      value:
        type: literal
        value: plant
    - type: set
      target: part_origin
      value:
        type: literal
        value: defeated monster
  see_also:
    - section.alchemy.gathering_ingredients
    - section.alchemy.harvesting_parts
    - section.alchemists_guild
- id: character.alchemy.throwing
  name: throwing
  section_id: section.alchemy.throwing_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: Throwing Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A (Tr) behind the name of the potion indicates that the potion is used as a thrown weapon.
    This is described in the ‘Combat’ chapter.
  type: modifier
  scope: global
  fields: {}
  effects:
    - type: invoke
      dependency: throw
  dependencies:
    - key: throw
      label: Thrown preparation resolution
      object_id: procedure.thrown_preparation
  see_also:
    - section.combat.throwing_potions
  term_refs:
    - term.throwable_potion
- id: character.alchemy.gathering
  name: gathering
  section_id: section.alchemy.gathering_ingredients
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 73
      printed_page: 71
      heading: Gathering Ingredients
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    During Overland Travel on their way to and from a quest, the party may try to gather
    ingredients once per day, using the hero with the highest Alchemical Skill Value. A success
    will let you roll 2 times on the Ingredients Table.
  type: modifier
  scope: global
  fields:
    attempts_today:
      type: number
      role: input
      description: gathering attempts the party has already made this day of Overland Travel
      integer: true
      minimum: 0
    alchemy_is_party_highest:
      type: boolean
      role: input
      description: the rolling hero has the highest Alchemical Skill Value in the party
    roll:
      type: number
      role: input
      description: roll
    alchemy:
      type: number
      role: input
      description: alchemy
    ingredient_table_rolls:
      type: number
      role: output
      description: ingredient table rolls
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: attempts_today
        right:
          type: literal
          value: 0
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: alchemy_is_party_highest
        right:
          type: literal
          value: true
    - type: set
      target: ingredient_table_rolls
      value:
        type: literal
        value: 2
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: alchemy
  see_also:
    - section.alchemy.table
    - section.travelling_and_skirmishes
- id: character.alchemy.gathering.exquisite
  name: exquisite
  section_id: section.alchemy.gathering_ingredients
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 73
      printed_page: 71
      heading: Gathering Ingredients
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    If you roll 01-10 when gathering, all of the ingredients become *Exquisite.
  type: modifier
  scope: global
  fields:
    roll:
      type: number
      role: input
      description: roll
    all_exquisite:
      type: boolean
      role: output
      description: all exquisite
  effects:
    - type: set
      target: all_exquisite
      value:
        type: literal
        value: true
  when:
    type: all
    conditions:
      - type: compare
        operator: gte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 10
  issues:
    - issue.alchemy.gathering_exquisite_roll
