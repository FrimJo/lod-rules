      target: thrown
      value:
        type: literal
        value: true
    - type: set
      target: damage_type
      value:
        type: literal
        value: acidic
    - type: set
      target: surrounding_fraction
      value:
        type: literal
        value: 0.5
  entity_id: equipment.alchemy.acidic_bomb
  see_also:
    - section.alchemy.throwing_potions
- id: character.alchemy.preparation.alchemical_dust
  name: alchemical dust
  section_id: section.alchemy.preparations.alchemical_dust
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 79
      printed_page: 77
      heading: Alchemical Dust
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Not actually a potion at all, but rather more like a fine sand, this can be used to highlight traces of activity from others. A handful is enough to cover a room. By simply blowing this into the air, it adheres to places of activity and shines faintly. If you use this before rolling to search a room or corridor, you are allowed to reroll and choose the best result. It is enough for one use.
  type: modifier
  scope: global
  fields:
    uses:
      type: number
      role: output
      description: uses
    search_rerolls:
      type: number
      role: output
      description: search rerolls
    selection:
      type: string
      role: output
      description: selection
  effects:
    - type: set
      target: uses
      value:
        type: literal
        value: 1
    - type: set
      target: search_rerolls
      value:
        type: literal
        value: 1
    - type: set
      target: selection
      value:
        type: literal
        value: best
  entity_id: equipment.alchemy.alchemical_dust
