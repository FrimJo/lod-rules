      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Passing Alchemy permits harvesting up to 3 dead enemies in LOS. An unlisted enemy
    provides nothing usable. Quantities measure potions, not body parts.
  type: modifier
  scope: global
  fields:
    alchemy_succeeded:
      type: boolean
      role: input
      description: alchemy succeeded
    dead_enemies:
      type: number
      role: input
      description: dead enemies
    all_in_los:
      type: boolean
      role: input
      description: all in los
    listed_enemy:
      type: boolean
      role: input
      description: listed enemy
    harvest_allowed:
      type: boolean
      role: output
      description: harvest allowed
  effects:
    - type: require
      condition:
        type: compare
        operator: lte
        left:
          type: field
          name: dead_enemies
        right:
          type: literal
          value: 3
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: all_in_los
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: listed_enemy
        right:
          type: literal
          value: true
    - type: set
      target: harvest_allowed
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: alchemy_succeeded
    right:
      type: literal
      value: true
