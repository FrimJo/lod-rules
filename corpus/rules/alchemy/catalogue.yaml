      printed_page: 77
      heading: Acidic Bomb (Tr)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'This highly volatile fluid can be thrown at an enemy or a square. When it lands, it explodes causing acidic damage to the square it hits, and also half that damage to all the surrounding squares at a rate of: Weak: 1d6 DMG; Standard 1d10 DMG; Supreme: 1d12 DMG.'
  type: modifier
