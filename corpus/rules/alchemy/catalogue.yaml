- id: character.alchemy.preparation.vial_of_invisibility
  name: vial of invisibility
  section_id: section.alchemy.preparations.vial_of_invisibility
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
