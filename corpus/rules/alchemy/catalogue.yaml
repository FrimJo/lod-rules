          name: roll
        right:
          type: literal
          value: 1
      - type: compare
        operator: lte
        left:
          type: field
          name: roll
        right:
          type: literal
          value: 10
- id: character.alchemy.ordinary.weak
  name: weak
  section_id: section.alchemy.quality
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 76
      printed_page: 74
      section: Quality
      heading: Weak Potion
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 77
      printed_page: 75
      heading: Making a potion
      locator:
        region: flowchart box "Weak?"
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A Weak Potion requires 1 part, 1 ingredient, and 1 empty bottle to create. ... Recipe requires
    : 1 ingredient 1 part
  type: modifier
  scope: global
  fields:
    simplified:
      type: boolean
      role: input
      description: simplified
    quality:
      type: string
      role: input
      description: quality
    parts:
      type: number
      role: input
      description: parts
    ingredients:
      type: number
      role: input
      description: ingredients
    empty_bottle:
      type: boolean
      role: input
      description: empty bottle
    components_required:
      type: number
      role: output
      description: components required
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: parts
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: ingredients
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: sum
          values:
            - type: field
              name: parts
            - type: field
              name: ingredients
        right:
          type: literal
          value: 2
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: empty_bottle
        right:
          type: literal
          value: true
    - type: set
      target: components_required
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: simplified
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: quality
        right:
          type: literal
          value: weak
