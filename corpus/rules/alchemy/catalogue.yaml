- id: character.alchemy.identify
  name: identify
  section_id: section.alchemy.identifying_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: identify
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Found potions must be identified before use. One Alchemy attempt per hero and potion;
    failure can be remedied in a settlement.
  type: modifier
  scope: global
  fields:
    attempts_this_hero_potion:
      type: number
      role: input
      description: attempts this hero potion
    roll:
      type: number
      role: input
      description: roll
    alchemy:
      type: number
      role: input
      description: alchemy
    identified:
      type: boolean
      role: output
      description: identified
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: attempts_this_hero_potion
        right:
          type: literal
          value: 0
    - type: set
      target: identified
      value:
        type: literal
        value: true
  when:
    type: compare
    operator: lte
    left:
      type: field
      name: roll
    right:
      type: field
      name: alchemy
- id: character.alchemy.drink
  name: drink
  section_id: section.alchemy.drinking_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 72
      printed_page: 70
      heading: drink
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Drinking requires 1 action. Stat increases last 5 turns unless otherwise stated. Keep
    the empty bottle. Identical temporary stat potions do not stack; different stats can coexist.
  type: modifier
  scope: global
  fields:
    same_stat_potion_active:
      type: boolean
      role: input
      description: same stat potion active
    actions_spent:
      type: number
      role: output
      description: actions spent
    default_duration_turns:
      type: number
      role: output
      description: default duration turns
    keep_bottle:
      type: boolean
      role: output
      description: keep bottle
    stat_effect_applied:
      type: boolean
      role: output
      description: stat effect applied
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: same_stat_potion_active
        right:
          type: literal
          value: false
    - type: set
      target: actions_spent
      value:
        type: literal
        value: 1
    - type: set
      target: default_duration_turns
      value:
        type: literal
        value: 5
    - type: set
      target: keep_bottle
      value:
        type: literal
        value: true
    - type: set
      target: stat_effect_applied
      value:
        type: literal
        value: true
