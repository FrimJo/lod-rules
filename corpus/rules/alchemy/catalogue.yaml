      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This potion temporarily increases the Wisdom of your hero. It comes in Weak, Standard, and Supreme forms, granting +10, +15, and +20 Wisdom respectively. The same modifier is applied to all WIS based skills. It will last until the end of the next battle. That means it can be drunk in between battles. It lasts until the end of the current battle. If not in battle, it lasts until the end of the next battle (or the end of the dungeon if there are no more battles).
  type: modifier
  scope: global
  fields:
    stat:
      type: string
      role: output
      description: stat
    affects_based_skills:
      type: boolean
      role: output
      description: affects based skills
    duration:
      type: string
      role: output
      description: duration
  effects:
    - type: set
      target: stat
      value:
        type: literal
        value: WIS
    - type: set
      target: affects_based_skills
      value:
        type: literal
        value: true
    - type: set
      target: duration
      value:
        type: literal
        value: current_or_next_battle_or_dungeon_end
  entity_id: equipment.alchemy.potion_of_wisdom
  issues:
    - issue.alchemy.stat_potion_duration
- id: character.alchemy.preparation.vial_of_corrosion
  name: vial of corrosion
  section_id: section.alchemy.preparations.vial_of_corrosion
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 81
      printed_page: 79
      heading: Vial of Corrosion
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This is a very powerful corrosive fluid used by alchemists to dissolve metal. It is primarily used by questing alchemists to open locks. This fluid only comes in one quality and one vial contains enough to open one lock. The hero must spend one action adjacent to the door to use this potion and the lock will automatically open.
  type: modifier
  scope: global
  fields:
    actions_spent:
      type: number
      role: output
      description: actions spent
    locks_opened:
      type: number
      role: output
      description: locks opened
    adjacent_to_door_required:
      type: boolean
      role: output
      description: adjacent to door required
  effects:
    - type: set
      target: actions_spent
      value:
        type: literal
        value: 1
    - type: set
      target: locks_opened
      value:
        type: literal
        value: 1
    - type: set
      target: adjacent_to_door_required
      value:
        type: literal
        value: true
  entity_id: equipment.alchemy.vial_of_corrosion
- id: character.alchemy.preparation.potion_of_smoke
  name: potion of smoke
  section_id: section.alchemy.preparations.potion_of_smoke
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 81
      printed_page: 79
      heading: Potion of Smoke (Tr)
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This vial creates a thick white smoke, obscuring LOS in the hit square and all 8 surrounding squares. Any fighting within the smoke is at -20 CS and shooting through the smoke is impossible. It lasts for 4 turns.
