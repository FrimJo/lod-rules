      target: weapon_kind
      value:
        type: literal
        value: edged
    - type: set
      target: damage_bonus
      value:
        type: literal
        value: 1
    - type: set
      target: duration
      value:
        type: literal
        value: until_dungeon_exit
  entity_id: equipment.alchemy.weapon_oil
