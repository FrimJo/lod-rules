- id: character.alchemy.mix
  name: mix
  section_id: section.alchemy.mixing_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 76
      printed_page: 74
      heading: mix
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Mix with Alchemical Tools and an empty bottle, in settlement, evening travel or dungeon
    rest. Choose quality before Alchemy roll. Recipe success creates intended potion (+10); without
    recipe success rolls on Potions Table.
  type: modifier
  scope: global
  fields:
    has_tools:
      type: boolean
      role: input
      description: has tools
    has_bottle:
      type: boolean
      role: input
      description: has bottle
    location:
      type: string
      role: input
      description: location
    quality_before_roll:
      type: boolean
      role: output
      description: quality before roll
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: has_tools
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: has_bottle
        right:
          type: literal
          value: true
    - type: require
      condition:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: location
            right:
              type: literal
              value: settlement
          - type: compare
            operator: eq
            left:
              type: field
              name: location
            right:
              type: literal
              value: travel_evening
          - type: compare
            operator: eq
            left:
              type: field
              name: location
            right:
              type: literal
              value: dungeon_rest
    - type: set
      target: quality_before_roll
      value:
        type: literal
        value: true
