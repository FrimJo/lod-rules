      target: stat
      value:
        type: literal
        value: STR
    - type: set
      target: duration
      value:
        type: literal
        value: current_or_next_battle_or_dungeon_end
  entity_id: equipment.alchemy.potion_of_strength
  issues:
    - issue.alchemy.stat_potion_duration
- id: character.alchemy.preparation.potion_of_wisdom
  name: potion of wisdom
  section_id: section.alchemy.preparations.potion_of_wisdom
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
