      heading: Vial of Invisibility
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This potion makes the drinker invisible during one battle. Unfortunately, this makes the hero invisible to themselves as well, making fighting impossible. Remove the hero from the table until the battle is over. When the battle is over, return the hero to any chosen square in the original room or corridor.
