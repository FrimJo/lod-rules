- id: character.alchemy.preparation.potion_of_dragons_breath
  name: potion of dragons breath
  section_id: section.alchemy.preparations.potion_of_dragons_breath
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 80
      printed_page: 78
      heading: Potion of Dragon’s Breath
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 80
      printed_page: 78
      heading: Potion of Dragon’s Breath
      locator:
        region: figure and caption in the right column
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Anyone who drinks these gains the ability to breathe fire once. The fire jet has a range of 2 squares and can either cause 1d8 Fire Damage in the square adjacent to the hero, or 1d4 Fire Damage in the adjacent square and one square adjacent to that square. That means the jet can be either a spot, a straight line away from the hero, or two connected squares adjacent from the hero as they turn their head from side to side while breathing fire. ... The Dragon’s Breath can be used in 4 different ways. 1: Flaming two squares sideways (2x1d4 fire damage). 2: Two squares in a line (2x1d4 fire damage). 3: Two squares diagonally (2dx1d4 fire damage). 4: One square with 1d8 fire damage. Ignore the facing of the North Star Military Figure as it would, of course, turn in the direction the fire was going to go.'
  type: modifier
  scope: global
  fields:
    uses:
      type: number
      role: output
      description: uses
    range:
      type: number
      role: output
      description: range
    single_square:
      type: string
      role: output
      description: single square
    two_squares:
      type: string
      role: output
      description: two squares
    geometry:
      type: string
      role: output
      description: geometry
  effects:
    - type: set
      target: uses
      value:
        type: literal
        value: 1
    - type: set
      target: range
      value:
        type: literal
        value: 2
    - type: set
      target: single_square
      value:
        type: literal
        value: 1d8 Fire
    - type: set
      target: two_squares
      value:
        type: literal
