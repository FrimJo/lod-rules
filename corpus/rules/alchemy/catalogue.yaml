  source_text: This potion will make the drinker's skin as hard as a Dragon’s hide. No weapon can penetrate it. Apart from damage caused by spells or poison, the hero ignores all damage for 3 turns. Please note, the armour of the hero can still be damaged in the normal way, but no HP is deducted from the hero.
