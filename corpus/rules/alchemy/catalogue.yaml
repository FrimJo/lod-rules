- id: character.alchemy.simplified.weak
  name: weak
  section_id: section.alchemy.simplified
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 76
      printed_page: 74
      heading: Simplified Alchemy
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    If you feel the Alchemy rules require too much bookkeeping, you can instead use these
    simplified rules. Ignore the use of exquisite components. - A potion can only contain 1 unit
    of any ingredient or part, i.e., each component must be unique. - Choose if you want to make a
    weak, Standard or Supreme potion and make an Alchemy roll. If successful, chose freely what
    potion you have created. If it fails, the components are lost. - A weak potion requires 4
    components, a standard requires 6 and a supreme requires 8 components.
  type: modifier
  scope: global
  fields:
    simplified:
      type: boolean
      role: input
      description: simplified
    quality:
      type: string
      role: input
      description: quality
    component_count:
      type: number
      role: input
      description: component count
    unique_count:
      type: number
      role: input
      description: unique count
    components_required:
      type: number
      role: output
      description: components required
    exquisite_modifier:
      type: number
      role: output
      description: exquisite modifier
    success_selection:
      type: string
      role: output
      description: success selection
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: component_count
        right:
          type: literal
          value: 4
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: unique_count
        right:
          type: field
          name: component_count
    - type: set
      target: components_required
      value:
        type: literal
        value: 4
    - type: set
      target: exquisite_modifier
      value:
        type: literal
        value: 0
    - type: set
      target: success_selection
      value:
        type: literal
        value: free choice
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: simplified
        right:
          type: literal
          value: true
      - type: compare
        operator: eq
        left:
          type: field
          name: quality
        right:
          type: literal
          value: weak
