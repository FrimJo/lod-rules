  status: extracted
  confidence: high
  source_text: This potion is not meant to be consumed. In fact, it is not a liquid in the usual sense, but rather a manifestation of the void. When the bottle is opened, it absorbs all magic. Any spell cast during the battle will suffer a -20 modifier on top of the CL modifier.
