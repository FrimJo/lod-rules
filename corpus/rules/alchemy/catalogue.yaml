- id: character.alchemy.ordinary.weak
  name: weak
  section_id: section.alchemy.quality
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 76
      printed_page: 74
      heading: weak
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Weak: 1 part + 1 ingredient. Standard: 1 part + 2 ingredients or 2 parts + 1
    ingredient. Supreme: 4 components mixing ingredients and parts. Each needs an empty bottle.'
  type: modifier
  scope: global
  fields:
    simplified:
      type: boolean
      role: input
      description: simplified
    quality:
      type: string
      role: input
      description: quality
    parts:
      type: number
      role: input
      description: parts
    ingredients:
      type: number
      role: input
      description: ingredients
    empty_bottle:
      type: boolean
      role: input
      description: empty bottle
    components_required:
      type: number
      role: output
      description: components required
  effects:
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: parts
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: gte
        left:
          type: field
          name: ingredients
        right:
          type: literal
          value: 1
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: sum
          values:
            - type: field
              name: parts
            - type: field
              name: ingredients
        right:
          type: literal
          value: 2
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: empty_bottle
        right:
          type: literal
          value: true
    - type: set
      target: components_required
      value:
        type: literal
        value: 2
  when:
    type: all
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: simplified
        right:
          type: literal
          value: false
      - type: compare
        operator: eq
        left:
          type: field
          name: quality
        right:
          type: literal
          value: weak
