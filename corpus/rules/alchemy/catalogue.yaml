- id: character.alchemy.preparation.poison
  name: poison
  section_id: section.alchemy.preparations.poison
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 79
      printed_page: 77
      heading: Poison
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This poison can be applied to a weapon at any time. It lasts until the next end of a battle. Even if you do not strike anything, the poison will evaporate after the battle. The poison could also be used to poison 5 projectiles. Since these are dipped before firing, there is no time limitation and it is considered part of reloading (no extra AP needed). Enemies losing HP to such a weapon lose 1HP every turn for the rest of the battle.
  type: modifier
  scope: global
  fields:
    projectiles:
      type: number
      role: output
      description: projectiles
    reloading_extra_ap:
      type: number
      role: output
      description: reloading extra ap
    hp_loss_each_turn:
      type: number
      role: output
      description: hp loss each turn
    trigger:
      type: string
      role: output
      description: trigger
    duration:
      type: string
      role: output
      description: duration
    unused_weapon_expiry:
      type: string
      role: output
      description: unused weapon expiry
    projectile_time_limit:
      type: boolean
      role: output
      description: projectile time limit
  effects:
    - type: set
      target: projectiles
      value:
        type: literal
        value: 5
    - type: set
      target: reloading_extra_ap
      value:
        type: literal
        value: 0
    - type: set
      target: hp_loss_each_turn
      value:
        type: literal
        value: 1
    - type: set
      target: trigger
      value:
        type: literal
        value: enemy loses HP to weapon
    - type: set
      target: duration
      value:
        type: literal
        value: battle
    - type: set
      target: unused_weapon_expiry
      value:
        type: literal
        value: next battle end
    - type: set
      target: projectile_time_limit
      value:
        type: literal
        value: false
  entity_id: equipment.alchemy.poison
