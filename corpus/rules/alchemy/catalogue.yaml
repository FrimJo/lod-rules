- id: character.alchemy.preparation.potion_of_strength
  name: potion of strength
  section_id: section.alchemy.preparations.potion_of_strength
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 81
      printed_page: 79
      heading: Potion of Strength
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A Potion of Strength increases the strength of your hero temporarily. It comes in Weak, Standard, and Supreme types, granting +10, +15, and +20 Strength, respectively. It will last until the end of the next battle. That means it can be drunk in between battles. It lasts until the end of the current battle. If not in battle, it lasts until the end of the next battle (or the end of dungeon if there are no more battles).
  type: modifier
  scope: global
  fields:
    stat:
      type: string
      role: output
      description: stat
    duration:
      type: string
      role: output
      description: duration
  effects:
