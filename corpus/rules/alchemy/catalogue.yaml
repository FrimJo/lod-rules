  scope: global
  fields:
    thrown:
      type: boolean
      role: output
      description: thrown
    surrounding_squares:
      type: number
      role: output
      description: surrounding squares
    cs_modifier:
      type: number
      role: output
      description: cs modifier
    shooting_through_allowed:
      type: boolean
      role: output
      description: shooting through allowed
    duration_turns:
      type: number
      role: output
      description: duration turns
  effects:
    - type: set
      target: thrown
      value:
        type: literal
        value: true
    - type: set
      target: surrounding_squares
      value:
        type: literal
        value: 8
    - type: set
      target: cs_modifier
      value:
        type: literal
        value: -20
    - type: set
      target: shooting_through_allowed
      value:
        type: literal
        value: false
    - type: set
      target: duration_turns
      value:
        type: literal
        value: 4
  entity_id: equipment.alchemy.potion_of_smoke
  see_also:
    - section.alchemy.throwing_potions
