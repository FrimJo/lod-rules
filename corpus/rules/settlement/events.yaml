  status: extracted
  confidence: high
  source_text:
    'Stray dog. The party is followed through the streets by a stray dog. After receiving a
    small treat from one of the heroes. It seems that you now are the proud owners of a dog.
    Randomise what kind of dog, using the Companions’ Compendium. If you do not own this compendium,
    or if you already have a dog, treat this result as: ‘Nothing special happens’.'
  type: modifier
  scope: settlement
  fields:
    selected:
      type: boolean
      role: input
      description: Selected event; supplies catalogue consequences, not a second application of resources.
    requires_companions_book:
      type: boolean
      role: output
      description: requires companions book
    ignored_if_already_own_dog:
      type: boolean
      role: output
      description: ignored if already own dog
    reward:
      type: string
      role: output
      description: reward
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: selected
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: requires_companions_book
      value:
        type: literal
        value: true
    - type: set
      target: ignored_if_already_own_dog
      value:
        type: literal
        value: true
    - type: set
      target: reward
      value:
        type: literal
        value: one random dog; otherwise nothing special happens
  uses_tables:
    - table.settlement.events
