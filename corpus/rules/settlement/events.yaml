  source_text: Settlement Feast. There is a celebration in the settlement and there are people
    everywhere. If you stay the night, the good mood of the citizens boosts Party Morale temporarily
    by +2 (which can go above PM max). It stays at +2 until lowered by natural means and can then
    only be raised back to the standard level. However, the huge amount of people means that most
    beds at the inns are taken. On a result of 9-12 on 1d12, there are no beds, and the party must
    continue their travel without doing any business (you may claim any quest reward before
    leaving).
