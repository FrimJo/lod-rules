      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 135
      printed_page: 133
      heading: Settlement Events
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Trinket Salesman. This old man claims to be selling magic trinkets. Most of the things
    he carries around seem quite plain and ordinary, but some of them do have a special feel to
    them. He charges 100 c for each trinket, but you are only allowed to buy 1 per hero. For each
    trinket bought, roll 1d12. On a result of 1-5, it is magic. A result of 5-11 means the trinket
    is useless and cannot even be sold. A result of 12 means you have bought a cursed item. For any
    magic trinkets, roll on the Magic Items Table. For cursed trinkets, roll on the Curses Table.
    The unaware hero must wear the trinket until he or she exits the next dungeon before it can be
    thrown away. In all cases, decide whether the trinket is a ring or necklace.
  type: modifier
  scope: settlement
  fields:
    selected:
      type: boolean
      role: input
      description: Selected event; supplies catalogue consequences, not a second application of resources.
    trinket_cost:
      type: number
      role: output
      description: trinket cost
    trinkets_per_hero:
      type: number
      role: output
      description: trinkets per hero
    trinket_die:
      type: number
      role: output
      description: trinket die
    magic_range:
      type: string
      role: output
      description: magic range
    useless_unsellable_range:
      type: string
      role: output
      description: useless unsellable range
    cursed_range:
      type: string
      role: output
      description: cursed range
    cursed_wear_until:
      type: string
      role: output
      description: cursed wear until
    choose_form:
      type: string
      role: output
      description: choose form
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: selected
    right:
      type: literal
      value: true
  effects:
    - type: set
      target: trinket_cost
      value:
        type: literal
        value: 100
    - type: set
      target: trinkets_per_hero
      value:
        type: literal
        value: 1
    - type: set
      target: trinket_die
      value:
        type: literal
        value: 12
    - type: set
      target: magic_range
      value:
        type: literal
        value: 1–5
    - type: set
      target: useless_unsellable_range
      value:
        type: literal
        value: 5–11
    - type: set
      target: cursed_range
      value:
        type: literal
        value: '12'
    - type: set
      target: cursed_wear_until
      value:
        type: literal
        value: exit next dungeon
    - type: set
      target: choose_form
      value:
        type: literal
        value: ring or necklace
  uses_tables:
    - table.settlement.events
  issues:
    - issue.settlement.trinket_overlap
