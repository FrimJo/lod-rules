- id: character.settlement.estate.lodging
  name: Staying at the House
  section_id: section.buying_an_estate.staying_at_the_house
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 160
      printed_page: 158
      heading: Staying at the House
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Once the heroes have the key, they are free to stay at the house in between quests. Now
    they do not have to pay the daily cost of at the inns. All the normal rules for resting between
    quests apply. The house has enough room to store any excess equipment the party chooses to not
    bring on their quests.
  type: modifier
  scope: settlement
  fields:
    requires_key:
      type: boolean
      role: output
      description: requires key
    daily_lodging_cost:
      type: number
      role: output
      description: daily lodging cost
    normal_between_quest_rest:
      type: boolean
      role: output
      description: normal between quest rest
    excess_equipment_storage:
      type: boolean
      role: output
      description: excess equipment storage
  effects:
    - type: set
      target: requires_key
      value:
        type: literal
        value: true
    - type: set
      target: daily_lodging_cost
      value:
        type: literal
        value: 0
    - type: set
      target: normal_between_quest_rest
      value:
        type: literal
        value: true
    - type: set
      target: excess_equipment_storage
      value:
        type: literal
        value: true
  dependencies:
    - key: related_0
      label: character.settlement.rest
      object_id: character.settlement.rest
- id: character.settlement.estate.ghost_contact
  name: The Ghosts of Past Generations
  section_id: section.buying_an_estate.staying_at_the_house
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 160
      printed_page: 158
      heading: The Ghosts of Past Generations
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: The Ghosts of Past Generations
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The house is indeed haunted, and not by just a single ghost, but rather by a full host
    of them. ... However, from time to time they decide to meddle with the living, coming with ill
    omens or predictions from beyond the veil of death. Between every quest, the party must roll
    1d10. This is done the night before the planned departure. On a result of 7-10, the ghosts have
    seen fit to make contact. Roll on the Ghostly Events Table.
  type: modifier
  scope: settlement
  fields:
    contact_die:
      type: number
      role: output
      description: contact die
    contact_minimum:
      type: number
      role: output
      description: contact minimum
    timing:
      type: string
      role: output
      description: timing
  effects:
    - type: set
      target: contact_die
      value:
        type: literal
        value: 10
    - type: set
      target: contact_minimum
      value:
        type: literal
        value: 7
    - type: set
      target: timing
      value:
        type: literal
        value: night before planned departure between every quest
  dependencies:
    - key: related_0
      label: table.estate.ghost_events
      object_id: table.estate.ghost_events
  issues:
    - issue.estate.ghost_contact_scope
- id: character.settlement.estate.furnishing
  name: Furnishing the Manor
  section_id: section.buying_an_estate.furnishing_the_manor
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: Furnishing the Manor
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: When staying at the manor, the heroes may decide to furnish rooms, or build new areas
    for use. Only one thing may be bought in between every quest, and it cannot be used until after
    the leaving the next dungeon.
  type: modifier
  scope: settlement
  fields:
    purchases_between_quests:
      type: number
      role: output
      description: purchases between quests
    usable_after:
      type: string
      role: output
      description: usable after
  effects:
    - type: set
      target: purchases_between_quests
      value:
        type: literal
        value: 1
    - type: set
      target: usable_after
      value:
        type: literal
        value: leaving the next dungeon
  dependencies:
    - key: related_0
      label: table.estate.furnishings
      object_id: table.estate.furnishings
- id: character.settlement.estate.departure
  name: Ghostly Events Table
  section_id: section.buying_an_estate.ghostly_events_table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 162
      printed_page: 160
      heading: Ghostly Events Table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Roll 1d10 to see what Ghostly Events have passed during the last evening or night
    before the departure. There is no time to change plans after this, and you must head straight to
    the World Map.
