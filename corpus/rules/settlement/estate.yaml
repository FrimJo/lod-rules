      role: output
      description: event die
    may_change_plans:
      type: boolean
      role: output
      description: may change plans
    must_head_straight_to_world_map:
      type: boolean
      role: output
      description: must head straight to world map
  effects:
    - type: set
      target: event_die
      value:
        type: literal
        value: 10
    - type: set
      target: may_change_plans
      value:
        type: literal
        value: false
    - type: set
      target: must_head_straight_to_world_map
      value:
        type: literal
        value: true
  dependencies:
