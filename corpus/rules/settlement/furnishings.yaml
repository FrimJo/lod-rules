- id: character.settlement.estate.training_grounds
  name: Training Grounds
  section_id: section.buying_an_estate.furnishing_the_manor
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: Training Grounds
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Any hero who spends time at the training grounds may choose to increase either CS or
    Dodge by +1d2. May be done once between each visit to a dungeon.
  type: modifier
  scope: settlement
  fields:
    chosen_cs_or_dodge_increase_die:
      type: number
      role: output
      description: chosen cs or dodge increase die
    uses_between_dungeons:
      type: number
      role: output
      description: uses between dungeons
    excludes_archery_range_training:
      type: boolean
      role: output
      description: excludes archery range training
  effects:
    - type: set
      target: chosen_cs_or_dodge_increase_die
      value:
        type: literal
        value: 2
    - type: set
      target: uses_between_dungeons
      value:
        type: literal
        value: 1
    - type: set
      target: excludes_archery_range_training
      value:
        type: literal
        value: true
  dependencies:
    - key: related_0
      label: character.settlement.estate.furnishing
      object_id: character.settlement.estate.furnishing
