- id: character.settlement.estate.shrine
  name: Shrine
  section_id: section.buying_an_estate.furnishing_the_manor
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 161
      printed_page: 159
      heading: Shrine
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Only one shrine can be built, dedicated to a god of the hero’s choice. Any hero may
    pray at the shrine in between quests and get the standard boon, but for free and with a success
    on 1-4 on 1d6.
  type: modifier
  scope: settlement
  fields:
    maximum_shrines:
      type: number
      role: output
      description: maximum shrines
    chosen_god:
      type: boolean
      role: output
      description: chosen god
    boon_cost:
      type: number
      role: output
      description: boon cost
    boon_success_max:
      type: number
      role: output
      description: boon success max
    boon_die:
      type: number
      role: output
      description: boon die
  effects:
    - type: set
      target: maximum_shrines
      value:
        type: literal
        value: 1
    - type: set
      target: chosen_god
      value:
        type: literal
        value: true
    - type: set
      target: boon_cost
      value:
        type: literal
        value: 0
    - type: set
      target: boon_success_max
      value:
        type: literal
        value: 4
    - type: set
      target: boon_die
      value:
        type: literal
        value: 6
  dependencies:
    - key: related_0
      label: character.settlement.estate.furnishing
      object_id: character.settlement.estate.furnishing
    - key: related_1
      label: character.settlement.temples
      object_id: character.settlement.temples
