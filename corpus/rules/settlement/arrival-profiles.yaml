      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Zero-cost activities are free, with the listed overnight
    restrictions. More than one Activity Point takes more than a day; nothing
    else may be done during those days. Other heroes must also stay while a
    member undertakes a lengthy activity. Create Scroll costs 1 per scroll, max
    2; Enchant Objects costs 1, max once.
  type: modifier
  scope: settlement
