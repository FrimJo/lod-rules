- id: character.settlement.arrival
  name: Settlement Events
  section_id: section.settlements.general
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Settlement Events
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Whenever the party enters a settlement, they must roll for a random Event. Roll 1d12
    and consult the table to see if you have triggered an Event. If that is the case, roll on the
    Events Table and follow the instructions.
  type: modifier
  scope: settlement
  fields:
    arrival_die:
      type: number
      role: output
      description: Sides of the die rolled on every entry (1d12).
    check_every_entry:
      type: boolean
      role: output
      description: The party rolls whenever it enters a settlement.
  effects:
    - type: set
      target: arrival_die
      value:
        type: literal
        value: 12
    - type: set
      target: check_every_entry
      value:
        type: literal
        value: true
  dependencies:
    - key: related_0
      label: table.settlement.event_thresholds
      object_id: table.settlement.event_thresholds
    - key: related_1
      label: table.settlement.events
      object_id: table.settlement.events
- id: character.settlement.quests
  name: Taking on Quests; Rejecting a Quest
  section_id: section.settlements.taking_on_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Taking on Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Rejecting a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Whenever the party is in a settlement, they may either start an available campaign or
    roll to see if there are random quests available. ... The only settlement to offer quests in
    the Ancient Lands is The Outpost. ... The party may reject 2 quests in a village and 3 quests in
    Silver City before they must move to another settlement to find a new quest.
  issues:
    - issue.settlement.quest_offer_scope
  type: modifier
  scope: settlement
  fields:
    village_rejection_limit:
      type: number
      role: output
      description: Quests the party may reject in a village before it must move on.
    silver_city_rejection_limit:
      type: number
      role: output
      description: Quests the party may reject in Silver City before it must move on.
    ancient_lands_quest_source:
      type: string
      role: output
      description: The only settlement that offers quests in the Ancient Lands.
  effects:
    - type: set
      target: village_rejection_limit
      value:
        type: literal
        value: 2
    - type: set
      target: silver_city_rejection_limit
      value:
        type: literal
        value: 3
    - type: set
      target: ancient_lands_quest_source
      value:
        type: literal
        value: The Outpost
  dependencies:
    - key: related_0
      label: table.settlement.quest_availability
      object_id: table.settlement.quest_availability
- id: character.settlement.quest_site_selector
  name: Quest Site die and map colour
  section_id: section.settlements.taking_on_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Taking on Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The Quest Site is determined by rolling a dice and cross-referencing this to the
    numbers written on the map.
  unresolved_references:
    - 'The map distances (for example "a mere two-day trek from the village" in the Taking on Quests
      example) are read from the printed map on PDF 140 and are not modelled.'
  issues:
    - issue.settlement.quest_offer_scope
  type: lookup
  scope: settlement
  fields:
    settlement:
      type: string
      role: input
      description: Settlement name as printed in the Settlement column.
    quest_site_roll:
      type: number
      role: input
      description: Result of the settlement's Quest dice, read as a number on the map.
      integer: true
      minimum: 1
      maximum: 40
    quest_site_die:
      type: string
      role: output
      description: The settlement's printed Quest dice.
    quest_site_colour:
      type: string
      role: output
      description: The printed map colour whose numbers are read.
    quest_site_number:
      type: number
      role: output
      description: The map number in that colour that marks the Quest Site.
  effects:
    - type: lookup
      table_id: table.settlement.quest_sites
      key_column: settlement
      key:
        type: field
        name: settlement
      value_column: quest_die
      target: quest_site_die
      on_missing_issue: issue.settlement.quest_offer_scope
    - type: lookup
      table_id: table.settlement.quest_sites
      key_column: settlement
      key:
        type: field
        name: settlement
      value_column: colour
      target: quest_site_colour
      on_missing_issue: issue.settlement.quest_offer_scope
    - type: set
      target: quest_site_number
      value:
        type: field
        name: quest_site_roll
  uses_tables:
    - table.settlement.quest_sites
- id: character.settlement.quest_availability
  name: Available quests
  section_id: section.settlements.taking_on_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Available quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Roll 1d6 on the table to see what quests are available. If there is a quest
    available, then roll 1d8. On a result of 1-2 on the d8, a side quest is available as well and
    may be taken together with any of the other quests. See page 271. Luck may not be used for any
    of these two rolls. Use the Quest Book tables to generate which quests to choose from. If none
    of the quests are interesting to the party, they must move to another settlement to find new
    ones.
  see_also:
    - section.quest_book_i.side_quests
  type: modifier
  scope: settlement
  fields:
    availability_die:
      type: number
      role: output
      description: Sides of the availability die (1d6).
    side_quest_die:
      type: number
      role: output
      description: Sides of the side-quest die (1d8).
    side_quest_success_max:
      type: number
      role: output
      description: Highest d8 result that offers a side quest.
    side_quest_requires_available_quest:
      type: boolean
      role: output
      description: The d8 is rolled only if there is a quest available.
    luck_allowed:
      type: boolean
      role: output
      description: Luck may not be used for either roll.
    no_interesting_quest_must_move:
      type: boolean
      role: output
      description: If none of the quests interest the party, it must move to another settlement.
  effects:
    - type: set
      target: availability_die
      value:
        type: literal
        value: 6
    - type: set
      target: side_quest_die
      value:
        type: literal
        value: 8
    - type: set
      target: side_quest_success_max
      value:
        type: literal
        value: 2
    - type: set
      target: side_quest_requires_available_quest
      value:
        type: literal
        value: true
    - type: set
      target: luck_allowed
      value:
        type: literal
        value: false
    - type: set
      target: no_interesting_quest_must_move
      value:
        type: literal
        value: true
  dependencies:
    - key: related_0
      label: table.settlement.quest_availability
      object_id: table.settlement.quest_availability
- id: character.settlement.leaving_on_a_quest
  name: Leaving on a Quest
  section_id: section.settlements.leaving_on_a_quest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Leaving on a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Taking on deadly quests requires careful planning and preparation. Therefore,
    leaving on a quest is always done early in the morning. No other settlement activities are
    allowed on that day.
  type: constraint
  scope: settlement
  fields:
    departure_time:
      type: string
      role: output
      description: When the party leaves on a quest.
    settlement_activities_on_departure_day:
      type: boolean
      role: output
      description: Whether other settlement activities are allowed on the departure day.
  effects:
    - type: set
      target: departure_time
      value:
        type: literal
        value: early in the morning
    - type: set
      target: settlement_activities_on_departure_day
      value:
        type: literal
        value: false
  dependencies:
    - key: departure
      label: Quest departure checkpoint
      object_id: procedure.quest_departure
- id: character.settlement.activities
  name: Activities in a Settlement
  section_id: section.settlements.activities_in_a_settlement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Activities in a Settlement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: In a settlement you can perform different activities. Each hero may perform
    activities worth one Activity Point per day, but performing an activity also means that you
    must stay for the night at the inn. Note that the price for staying at the inn is for the
    entire party, regardless of its size. Not all activities are available at all settlements, and
    to know what is available, check the ‘Settlement Descriptions’ on page 134 onwards. It is
    perfectly fine to pool the party’s excess gear to the hero that goes to a certain shop or
    similar. In the same way, a hero may purchase gear for another hero.
  see_also:
    - section.settlements.the_settlements_of_the_southern_part_of_the_kingdom
  term_refs:
    - term.activity_point
  type: modifier
  scope: settlement
  fields:
    activity_points_per_hero_day:
      type: number
      role: output
      description: Activity Points each hero may spend per day.
    lodging_charge_unit:
      type: string
      role: output
      description: The inn price covers the entire party, regardless of its size.
    activity_requires_overnight:
      type: boolean
      role: output
      description: Performing an activity means staying the night at the inn.
    requires_available_service:
      type: boolean
      role: output
      description: Not all activities are available at all settlements.
    party_gear_may_be_pooled:
      type: boolean
      role: output
      description: The party's excess gear may be pooled to the hero who visits a shop.
    hero_may_purchase_for_another:
      type: boolean
      role: output
      description: A hero may purchase gear for another hero.
  effects:
    - type: set
      target: activity_points_per_hero_day
      value:
        type: literal
        value: 1
    - type: set
      target: lodging_charge_unit
      value:
        type: literal
        value: entire party per night
    - type: set
      target: activity_requires_overnight
      value:
        type: literal
        value: true
    - type: set
      target: requires_available_service
      value:
        type: literal
        value: true
    - type: set
      target: party_gear_may_be_pooled
      value:
        type: literal
        value: true
    - type: set
      target: hero_may_purchase_for_another
      value:
        type: literal
        value: true
  dependencies:
    - key: related_0
      label: table.settlement.activities
      object_id: table.settlement.activities
- id: character.settlement.activities_limits
  name: Available Actions
  section_id: section.settlements.activities_in_a_settlement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The heroes may choose from the activities listed in the table below, as long as the
    settlement offers that specific service. Some activities cost 0 Action Points which means they
    can be done for free. Those which cost more than 1 Activity Point take longer than a day to
    perform. During those days nothing else can be done. If one member of the party decides to do
    something that takes a long time, and the other party members are done, they must also stay at
    the inn.
  issues:
    - issue.settlement.action_points_wording
  term_refs:
    - term.activity_point
  type: modifier
  scope: settlement
  fields:
    zero_cost_activities_free:
      type: boolean
      role: output
      description: Activities costing 0 can be done for free.
    multi_day_excludes_other_activities:
      type: boolean
      role: output
      description: During the days of an activity costing more than 1, nothing else can be done.
    party_waits_for_occupied_heroes:
      type: boolean
      role: output
      description: Party members who are done must also stay at the inn.
    scroll_maximum:
      type: number
      role: output
      description: Create a Scroll, printed "1 per Scroll. Max 2."
    enchant_maximum:
      type: number
      role: output
      description: Enchant Objects, printed "1. Max once."
  effects:
    - type: set
      target: zero_cost_activities_free
      value:
        type: literal
        value: true
    - type: set
      target: multi_day_excludes_other_activities
      value:
        type: literal
        value: true
    - type: set
      target: party_waits_for_occupied_heroes
      value:
        type: literal
        value: true
    - type: set
      target: scroll_maximum
      value:
        type: literal
        value: 2
    - type: set
      target: enchant_maximum
      value:
        type: literal
        value: 1
  dependencies:
    - key: related_0
      label: table.settlement.activities
      object_id: table.settlement.activities
- id: character.settlement.long_activity_stay
  name: Activities taking longer than a day
  section_id: section.settlements.activities_in_a_settlement
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Leaving on a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      locator:
        table: Uncaptioned table (What, Where, Activity Point cost)
        row: Learn a Spell; Treat Mental Conditions
      extraction:
        method: table
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Those which cost more than 1 Activity Point take longer than a day to perform. During
    those days nothing else can be done. If one member of the party decides to do something that
    takes a long time, and the other party members are done, they must also stay at the inn. ...
    Therefore, leaving on a quest is always done early in the morning. No other settlement
    activities are allowed on that day.
  unresolved_references:
    - 'Structural reading: one Activity Point is spent per day, so an activity costing N Activity
      Points occupies its hero from the start day through day start + N - 1. The party stays at the
      inn through that night, and the first day it may leave is the next morning.'
  term_refs:
    - term.activity_point
  type: calculation
  scope: settlement
  fields:
    activity:
      type: string
      role: input
      description: learn_a_spell (Learn a Spell, cost 3) or treat_mental_conditions (Treat Mental
        Conditions, cost 5), the two Available Actions rows that cost more than 1.
    start_day:
      type: number
      role: input
      description: Settlement day on which the hero starts the activity.
      integer: true
      minimum: 1
    activity_point_cost:
      type: number
      role: output
      description: Printed Activity Point cost of the activity.
    occupied_until_day:
      type: number
      role: output
      description: Last day on which the hero can do nothing else.
    party_stays_at_inn_until_night:
      type: number
      role: output
      description: Last night the whole party must stay at the inn.
    earliest_departure_day:
      type: number
      role: output
      description: First morning on which the party may leave on a quest.
  effects:
    - type: choice
      selection: activity
      options:
        - id: learn_a_spell
          effects:
            - type: set
              target: activity_point_cost
              value:
                type: literal
                value: 3
        - id: treat_mental_conditions
          effects:
            - type: set
              target: activity_point_cost
              value:
                type: literal
                value: 5
    - type: set
      target: occupied_until_day
      value:
        type: arithmetic
        operator: subtract
        values:
          - type: sum
            values:
              - type: field
                name: start_day
              - type: field
                name: activity_point_cost
          - type: literal
            value: 1
    - type: set
      target: party_stays_at_inn_until_night
      value:
        type: field
        name: occupied_until_day
    - type: set
      target: earliest_departure_day
      value:
        type: sum
        values:
          - type: field
            name: occupied_until_day
          - type: literal
            value: 1
  uses_tables:
    - table.settlement.activities
