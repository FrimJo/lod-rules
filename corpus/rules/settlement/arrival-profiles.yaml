      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Roll 1d6 for available quests, then if a quest is available roll
    1d8: on 1–2 a side quest is available with any other quest. Luck cannot
    modify either roll. Generate choices from Quest Book tables. If none
    interest the party, move to another settlement. Depart early in the morning
    with no settlement activities that day.'
