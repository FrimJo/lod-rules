- id: character.settlement.horse_racing
  name: Horse Racing
  section_id: section.settlements.horse_racing
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 145
      printed_page: 143
      heading: 'Horse Racing'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Horse Racing is very popular in Silver City, and there are races almost every day. Anyone owning a horse may join the race if they pay a fee of 50 c. If you feel lucky, or that the odds for winning are in your favour, you can bet up to 300 c including the 50 c entry fee. Winners and second runner ups will win some money for their performance. The winnings are based on the odds, and a low-level underdog hero will win more than a high-level veteran. If you decide to compete, you will need to make a DEX Test.'
  type: modifier
  scope: settlement
  fields:
    requires_horse:
      type: boolean
      role: output
      description: requires horse
    entry_fee:
      type: number
      role: output
      description: entry fee
    maximum_bet_including_fee:
      type: number
      role: output
      description: maximum bet including fee
  effects:
    - type: set
      target: requires_horse
      value:
        type: literal
        value: true
    - type: set
      target: entry_fee
      value:
        type: literal
        value: 50
    - type: set
      target: maximum_bet_including_fee
      value:
        type: literal
        value: 300
  dependencies:
    - key: related_0
      label: table.settlement.horse_racing
      object_id: table.settlement.horse_racing
    - key: related_1
      label: table.settlement.racing_winnings
      object_id: table.settlement.racing_winnings
    - key: related_2
      label: table.settlement.racing_awards
      object_id: table.settlement.racing_awards
