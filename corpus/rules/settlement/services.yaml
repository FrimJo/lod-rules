        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: "For some coins, the members of the party may regain their health, luck and energy, by sleeping in the relative comfort of the beds at one of the city inns, or in their own home. Mana, Luck and energy are automatically restored, and each hero regains 2d6 HP per night. Once luck has been restored, any use of luck after this will not be restored until the next visit to a settlement. If you cannot afford this, only half (RDD) of each stat is regained and 1d6 HP as you sleep in the inn's stable instead. You will then need to leave the settlement in the morning, either on a quest or to travel to another settlement. Disease and poison need tending to at the Sick Wards."
