- id: character.settlement.buying
  name: Buying and Selling
  section_id: section.settlements.buying_and_selling
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 144
      printed_page: 142
      heading: 'Buying and Selling'
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Equipment can be bought and sold at the various shops in the market. Depending on what you need, you must visit different shops. Once there, locate what you want to buy and roll for its availability (1d6). You may buy one piece for each successful roll, but as soon as you fail a roll, you or any other hero may not buy that specific piece of equipment until you return to the settlement at a later time. Selling equipment is always done using the Sell Table in the Equipment Appendix, or by using the price noted on Treasure Cards. The selling price is not affected by local price variations, except if they are triggered by an event.'
  type: modifier
  scope: settlement
  fields:
    availability_die:
      type: number
      role: output
      description: availability die
    items_per_success:
      type: number
      role: output
      description: items per success
    failed_availability_locks_whole_party:
      type: boolean
      role: output
      description: failed availability locks whole party
    lock_release:
      type: string
      role: output
      description: lock release
    local_price_modifier_applies_to_sales:
      type: boolean
      role: output
      description: local price modifier applies to sales
    event_price_modifier_applies_to_sales:
      type: boolean
      role: output
      description: event price modifier applies to sales
  effects:
    - type: set
      target: availability_die
      value:
        type: literal
        value: 6
    - type: set
      target: items_per_success
      value:
        type: literal
        value: 1
    - type: set
      target: failed_availability_locks_whole_party
      value:
        type: literal
        value: true
    - type: set
      target: lock_release
      value:
        type: literal
        value: return to the settlement at a later time
    - type: set
      target: local_price_modifier_applies_to_sales
      value:
        type: literal
        value: false
    - type: set
      target: event_price_modifier_applies_to_sales
      value:
        type: literal
        value: true
  dependencies: []
  see_also:
    - section.appendix_iii_equipment.general_equipment.sell_and_repair_table
  issues:
    - issue.settlement.grimoire_sale_value
