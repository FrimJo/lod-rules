- id: character.settlement.buying
  name: Buying and Selling
  section_id: section.settlements.buying_and_selling
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 144
      printed_page: 142
      heading: Buying and Selling
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Visit the appropriate shop and roll 1d6 for availability. Each
    successful roll permits one piece. As soon as a roll fails, no hero may buy
    that specific equipment until the party returns to the settlement at a later
    time. Selling uses the Sell Table or the price on Treasure Cards. Local
    price variations do not affect sales unless triggered by an event.
  type: modifier
  scope: settlement
  fields:
    availability_die:
      type: number
      role: output
      description: availability die
    items_per_success:
      type: number
      role: output
      description: items per success
    failed_availability_locks_whole_party:
      type: boolean
      role: output
      description: failed availability locks whole party
    lock_release:
      type: string
      role: output
      description: lock release
    local_price_modifier_applies_to_sales:
      type: boolean
      role: output
      description: local price modifier applies to sales
    event_price_modifier_applies_to_sales:
      type: boolean
      role: output
      description: event price modifier applies to sales
  effects:
    - type: set
      target: availability_die
      value:
        type: literal
        value: 6
    - type: set
      target: items_per_success
      value:
        type: literal
        value: 1
    - type: set
      target: failed_availability_locks_whole_party
      value:
        type: literal
        value: true
    - type: set
      target: lock_release
      value:
        type: literal
        value: return to the settlement at a later time
    - type: set
      target: local_price_modifier_applies_to_sales
      value:
        type: literal
        value: false
    - type: set
      target: event_price_modifier_applies_to_sales
      value:
        type: literal
        value: true
  dependencies: []
