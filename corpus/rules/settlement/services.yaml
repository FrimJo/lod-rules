      description: luck spent
    modifier_per_current_luck:
      type: number
      role: output
      description: modifier per current luck
    natural_ten_unmodifiable:
      type: boolean
      role: output
      description: natural ten unmodifiable
  effects:
    - type: set
      target: attempts_per_stay
      value:
        type: literal
        value: 1
    - type: set
      target: minimum_bet
      value:
        type: literal
        value: 50
    - type: set
      target: maximum_bet
      value:
        type: literal
        value: 500
    - type: set
      target: luck_spent
      value:
