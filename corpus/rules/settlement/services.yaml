  scope: settlement
  fields:
    paid_hp_dice:
      type: number
      role: output
      description: paid hp dice
    paid_hp_die:
      type: number
      role: output
      description: paid hp die
    stable_hp_die:
      type: number
      role: output
      description: stable hp die
    stable_resource_fraction:
      type: number
      role: output
      description: stable resource fraction
    stable_rounding:
      type: string
      role: output
      description: stable rounding
    stable_requires_morning_departure:
      type: boolean
      role: output
      description: stable requires morning departure
    luck_restorations_per_visit:
      type: number
      role: output
      description: luck restorations per visit
  effects:
    - type: set
      target: paid_hp_dice
      value:
        type: literal
        value: 2
    - type: set
      target: paid_hp_die
      value:
        type: literal
        value: 6
    - type: set
      target: stable_hp_die
      value:
        type: literal
        value: 6
    - type: set
      target: stable_resource_fraction
      value:
        type: literal
        value: 0.5
    - type: set
      target: stable_rounding
      value:
        type: literal
        value: RDD
    - type: set
      target: stable_requires_morning_departure
      value:
        type: literal
        value: true
    - type: set
      target: luck_restorations_per_visit
      value:
        type: literal
        value: 1
  dependencies:
