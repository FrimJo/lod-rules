      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Rogues and Thieves may place traps, marked with tokens. Enemies take the most direct
    route and randomise equal paths. Record wounds on Wandering Monster tokens; each revealed
    individual has those wounds unless the trap says otherwise. Placed traps cannot be picked up and
    are removed when triggered. Heroes avoid setting off known traps.
  type: modifier
  scope: settlement
  fields:
    eligible_professions:
      type: string
      role: output
      description: eligible professions
    placed_traps_recoverable:
      type: boolean
      role: output
      description: placed traps recoverable
    remove_on_trigger:
      type: boolean
      role: output
      description: remove on trigger
    heroes_trigger_traps:
      type: boolean
      role: output
      description: heroes trigger traps
    wandering_damage_default:
      type: string
      role: output
      description: wandering damage default
    equal_path_choice:
      type: string
      role: output
      description: equal path choice
  effects:
    - type: set
      target: eligible_professions
      value:
        type: literal
        value: Rogue or Thief
    - type: set
      target: placed_traps_recoverable
      value:
        type: literal
        value: false
    - type: set
      target: remove_on_trigger
      value:
        type: literal
        value: true
    - type: set
      target: heroes_trigger_traps
      value:
        type: literal
        value: false
    - type: set
      target: wandering_damage_default
      value:
        type: literal
        value: each individual when revealed
    - type: set
      target: equal_path_choice
      value:
        type: literal
        value: random
  dependencies: []
