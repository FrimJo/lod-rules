  source_text: At the Alchemists’ Guild, you can purchase both parts and ingredients, when they are available. To purchase a part, check the availability in the table below. If you succeed with the Availability Roll, you may choose any kind of part from that enemy. A part or ingredient costs 15 c. There are some parts that are not sold, as dealing with human body parts is illegal. Potions can be bought here. Normally, with a lot more to choose from than the General Store. The supply is much better as well. All Standard Potions have an availability of 5, whereas Weak Potions are always in stock. Supreme versions have an availability of 4. Prices are listed in the Potions Table on page 195.
