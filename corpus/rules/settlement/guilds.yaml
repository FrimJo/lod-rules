  scope: battle
  fields:
    has_wound_status_marker:
      type: boolean
      role: input
      description: The hero has a wound status marker.
    action_points:
      type: number
      role: output
      description: AP needed to use the powder.
    removes_wound_status_marker:
      type: boolean
      role: output
      description: Any wound status marker may be removed.
    restores_lost_action_points_immediately:
      type: boolean
      role: output
      description: The lost AP is given back immediately, so the hero can move or attack in the same turn.
    heals_wound:
      type: boolean
      role: output
      description: The powder remedies the actual wound.
    duration:
      type: string
      role: output
      description: How long the relief lasts.
    reapply_wound_status_after_battle_if_applicable:
      type: boolean
      role: output
      description: After the battle the wound status takes effect again if still applicable.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: has_wound_status_marker
    right:
      type: literal
      value: true
