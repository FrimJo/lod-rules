- id: character.settlement.guild.dark.traps
  name: Traps
  section_id: section.the_dark_guild.buying_special_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 149
      printed_page: 147
      heading: Traps
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: These traps can be used by a Rogue or Thief and placed in the dungeon to cause trouble for their enemies. Use the trap tokens to indicate where you have placed the traps. When moving enemies, they will always take the most direct route towards their targets, and if there are dual options for the path, randomise the path. If they enter a trapped square, take note of any wounds caused to a Wandering Monster token and when the monsters are revealed, each individual enemy will have suffered the wounds written down (unless noted otherwise below). Two of the traps below are primarily meant for Wandering Monsters, but there are ways to set them so they can hurt encounters as well (place them before opening a door and let the enemy approach). Once placed, traps may not be picked up, and once a monster triggers the trap, it is removed. Heroes can walk through squares with traps since they know they are there and can avoid setting them off.
  type: modifier
  scope: dungeon
  fields:
    profession:
      type: string
      role: input
      description: Profession of the hero using the trap (stable profession id suffix).
    placed_traps_recoverable:
      type: boolean
      role: output
      description: Placed traps may be picked up again.
    remove_on_trigger:
      type: boolean
      role: output
      description: A trap is removed once a monster triggers it.
    heroes_trigger_traps:
      type: boolean
      role: output
      description: Heroes set off traps when walking through their squares.
    wandering_damage_default:
      type: string
      role: output
      description: How wounds noted on a Wandering Monster token apply once the monsters are revealed.
    equal_path_choice:
      type: string
      role: output
      description: How a moving enemy chooses between dual options for the most direct path.
  when:
    type: any
    conditions:
      - type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: rogue
      - type: compare
        operator: eq
        left:
          type: field
          name: profession
        right:
          type: literal
          value: thief
  effects:
    - type: set
      target: placed_traps_recoverable
      value:
        type: literal
        value: false
    - type: set
      target: remove_on_trigger
      value:
        type: literal
        value: true
    - type: set
      target: heroes_trigger_traps
      value:
        type: literal
        value: false
    - type: set
      target: wandering_damage_default
      value:
        type: literal
        value: each individual enemy has suffered the noted wounds when revealed, unless noted otherwise
    - type: set
      target: equal_path_choice
      value:
        type: literal
        value: random
  dependencies: []
- id: character.settlement.guild.dark.caltrops
  name: Caltrops
  section_id: section.the_dark_guild.buying_special_equipment
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 149
      printed_page: 147
      heading: Caltrops
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: These small metal pyramids can be thrown on the floor and the unsuspecting enemy will walk on them. They cause immense pain and will disrupt the movement for anyone walking over them. (Almost like Legos). The Caltrops can be thrown in a square up to 2 squares away from the hero. Throwing them takes 1 AP and this can be done as long as there is no enemy adjacent to the thrower. Any enemy walking over the square with no armour will suffer 1d4 Points of Damage and will stop their turn immediately.
  type: modifier
  scope: dungeon
  fields:
    distance_squares:
      type: number
      role: input
      description: Distance in squares from the hero to the target square.
      integer: true
      minimum: 1
    enemy_adjacent_to_thrower:
      type: boolean
      role: input
      description: An enemy is adjacent to the thrower.
    action_points:
      type: number
      role: output
      description: AP cost of throwing the Caltrops.
    damage_die:
      type: number
      role: output
      description: Sides of the damage die (1d4 Points of Damage) for an enemy walking over the square.
    ends_enemy_turn:
      type: boolean
      role: output
      description: An enemy walking over the square stops its turn immediately.
  when:
    type: all
    conditions:
      - type: compare
        operator: lte
        left:
          type: field
