  source_text: This is a fine powder, made from a mix of herbs. The recipe is a heavily guarded secret, and is only known by the top tier of the Fighters’ Guild. By snorting this power, a wounded fighter will receive considerable pain relief. However, the powder does not remedy the actual wound. A hero snorting this powder may remove any wound status marker and regain his or her lost AP. It will last for the entire battle, and after the battle the wound status will once again take affect if still applicable. Using it requires 1 AP and immediately gives you back the lost AP, meaning you can move or attack in the same turn.
