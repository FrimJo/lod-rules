      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 130
      printed_page: 128
      section: Skirmishes
      heading: Setup
      locator:
        table: Uncaptioned obstacle table that the Setup text calls the Obstacles Table; its Example column prints artwork only
        row: Pyramid
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Can only be climbed along the stairs.
  type: constraint
  scope: skirmish
  fields:
    climbing_pyramid:
      type: boolean
      role: input
      description: A model climbs a Pyramid square during a skirmish.
    along_stairs:
      type: boolean
      role: input
      description: The climb follows the stairs printed on the Pyramid art.
  when:
    type: compare
    operator: eq
    left:
      type: field
      name: climbing_pyramid
    right:
      type: literal
      value: true
  effects:
    - type: require
      condition:
        type: compare
        operator: eq
        left:
          type: field
          name: along_stairs
        right:
          type: literal
          value: true
  uses_tables:
    - table.travel.obstacles
