- id: procedure.travel_daily_movement
  name: Daily world-map movement
  section_id: section.travelling_and_skirmishes.moving_on_the_map
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 124
      pdf_page: 126
      heading: Moving on the Map
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 124
      pdf_page: 126
      heading: Moving on the Map
      locator:
        region: Hex map figure and its caption, right column
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 124
      pdf_page: 126
      heading: Travelling and Skirmishes
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 125
      pdf_page: 127
      heading: Events
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    All hexes below the white dotted line are in the Ancient Land, and are Desert Hexes. ... It is
    up to the party to decide which route to take to their objective. There is, however, a
    difference in travelling speed depending on whether the party chooses to go by road or
    off-road. The Movement Points that you spend are decided by the hex that you enter: - A Road
    Hex costs 1 Movement Point to enter. - An Off-road Hex cost 1,5 Movement Points to enter. - A
    Desert Hex costs 2 Movement Points, unless all heroes have camels. Then it is 1,5 points per
    hex. A walking party, or a party with a wagon or mule has 3 Movement Points. A party where all
    members are riding horses or camels has 6 Movement Points. ... Blue arrows would cost 5 points
    of movement and would require a horse. The green arrows would cost 2,5 points and could be
    done on foot.
  issues:
    - issue.travel.movement_points_per_day
  fields:
    day:
      type: number
      role: input
      description:
        Supplied monotonically increasing travel day; the stored movement_day prevents repeated
        steps from replenishing the allowance.
      integer: true
      minimum: 0
    movement_day:
      type: number
      role: state
      description:
        Travel day whose allowance was last set. Renewing the allowance once per day after the
        daily event roll is the reading applied pending issue.travel.movement_points_per_day; the
        page does not say "per day".
      integer: true
      minimum: -1
    event_day:
      type: number
      role: state
      description: event day
      integer: true
      minimum: -1
    movement_points:
      type: number
      role: state
      description:
        Movement Points left. The walking and riding allowance steps replace any leftover points
        (no carry-over) and a hex is entered only while movement_points is at least its cost;
        both are the reading applied pending issue.travel.movement_points_per_day.
      minimum: 0
      maximum: 6
    hex_index:
      type: number
      role: state
      description: hex index
      minimum: 0
    terrain:
      type: string
      role: input
      description: 'Entering hex: road, off_road or desert. Every hex below the white dotted line is in the Ancient Land and is a Desert Hex.'
    transport_mode:
      type: string
      role: input
      description: 'Sets the Movement Point allowance only: walking or wagon_or_mule (3) or
        all_riding_horses_or_camels ("a party where all members are riding horses or camels", 6);
        eligibility is supplied. The Desert Hex camel cost depends on all_heroes_have_camels, not
        on this value.'
    all_heroes_have_camels:
      type: boolean
      role: input
      description:
        Supplied; true when "all heroes have camels" (Desert Hex cost 1,5 instead of 2). The page
        conditions this on the heroes, separately from the 6-point allowance, which needs all
        members riding, so a party whose heroes all have camels but which has a walking member or a
        mule keeps 3 Movement Points and still pays 1,5 per Desert Hex. Read only when entering a
        Desert Hex.
    route_legal:
      type: boolean
      role: input
      description: Supplied World Map route adjacency and entry legality; no map geometry is invented.
    terrain_cost:
      type: number
      role: output
      description: terrain cost
    entered_hex:
      type: boolean
      role: output
      description: entered hex
  dependencies:
    - key: route_and_terrain
      label: World Map route and terrain lookup
    - key: transport_eligibility
      label: Determine party transport eligibility
  steps:
    - id: determine_allowance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 125
          pdf_page: 127
          heading: Events
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: At the start of each day before moving, the party must roll 1d12.
      effects:
        - type: set
          target: entered_hex
          value:
            type: literal
            value: false
        - type: set
          target: terrain_cost
          value:
            type: literal
            value: 0
        - type: invoke
          dependency: transport_eligibility
        - type: require
          condition: &a1
            type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: transport_mode
                right:
                  type: literal
                  value: walking
              - type: compare
                operator: eq
                left:
                  type: field
                  name: transport_mode
                right:
                  type: literal
                  value: wagon_or_mule
              - type: compare
                operator: eq
                left:
                  type: field
                  name: transport_mode
                right:
                  type: literal
                  value: all_riding_horses_or_camels
        - type: require
          condition: &a2
            type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: road
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: off_road
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: desert
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: event_day
            right:
              type: field
              name: day
    - id: walking_allowance
      source_text: A walking party, or a party with a wagon or mule has 3 Movement Points.
      when:
        type: all
        conditions:
          - type: compare
            operator: gt
            left:
              type: field
              name: day
            right:
              type: field
              name: movement_day
          - type: compare
            operator: eq
            left:
              type: field
              name: event_day
            right:
              type: field
              name: day
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: transport_mode
                right:
                  type: literal
                  value: walking
              - type: compare
                operator: eq
                left:
                  type: field
                  name: transport_mode
                right:
                  type: literal
                  value: wagon_or_mule
      effects:
        - type: set
          target: movement_points
          value:
            type: literal
            value: 3
        - type: set
          target: movement_day
          value:
            type: field
            name: day
    - id: riding_allowance
      source_text: A party where all members are riding horses or camels has 6 Movement Points.
      when:
        type: all
        conditions:
          - type: compare
            operator: gt
            left:
              type: field
              name: day
            right:
              type: field
              name: movement_day
          - type: compare
            operator: eq
            left:
              type: field
              name: event_day
            right:
              type: field
              name: day
          - type: compare
            operator: eq
            left:
              type: field
              name: transport_mode
            right:
              type: literal
              value: all_riding_horses_or_camels
      effects:
        - type: set
          target: movement_points
          value:
            type: literal
            value: 6
        - type: set
          target: movement_day
          value:
            type: field
            name: day
    - id: road_cost
      source_text: A Road Hex costs 1 Movement Point to enter.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: terrain
        right:
          type: literal
          value: road
      effects:
        - type: set
          target: terrain_cost
          value:
            type: literal
            value: 1
    - id: offroad_cost
      source_text: An Off-road Hex cost 1,5 Movement Points to enter.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: terrain
        right:
          type: literal
          value: off_road
      effects:
        - type: set
          target: terrain_cost
          value:
            type: literal
            value: 1.5
    - id: desert_cost
      source_text: A Desert Hex costs 2 Movement Points, unless all heroes have camels.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: terrain
        right:
          type: literal
          value: desert
      effects:
        - type: set
          target: terrain_cost
          value:
            type: literal
            value: 2
    - id: camel_desert_cost
      source_text: A Desert Hex costs 2 Movement Points, unless all heroes have camels. Then it is
        1,5 points per hex.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: terrain
            right:
              type: literal
              value: desert
          - type: compare
            operator: eq
            left:
              type: field
              name: all_heroes_have_camels
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: terrain_cost
          value:
            type: literal
            value: 1.5
    - id: check_entry
      source_text: It is up to the party to decide which route to take to their objective. ... Blue
        arrows would cost 5 points of movement and would require a horse.
      effects:
        - type: invoke
          dependency: route_and_terrain
        - type: require
          condition: &a3
            type: all
            conditions:
              - *a1
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: route_legal
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: movement_day
                right:
                  type: field
                  name: day
              - type: compare
                operator: eq
                left:
                  type: field
                  name: event_day
                right:
                  type: field
                  name: day
              - type: compare
                operator: gte
                left:
                  type: field
                  name: movement_points
                right:
                  type: field
                  name: terrain_cost
    - id: enter_hex
      source_text: 'The Movement Points that you spend are decided by the hex that you enter:'
      when: *a3
      effects:
        - type: set
          target: movement_points
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: movement_points
              - type: field
                name: terrain_cost
        - type: set
          target: hex_index
          value:
            type: sum
            values:
              - type: field
                name: hex_index
              - type: literal
                value: 1
        - type: set
          target: entered_hex
          value:
            type: literal
            value: true
  entry_step: determine_allowance
  exit_step: enter_hex
- id: procedure.travel_food_and_rest
  name: Travel food and daily rest
  section_id: section.travelling_and_skirmishes.rations_and_resting
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 126
      printed_page: 124
      heading: Rations and Resting
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 127
      printed_page: 125
      heading: Rations and Resting
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 184
      printed_page: 182
      heading: 'Miscellaneous: Bed Roll'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 25
      printed_page: null
      heading: '2.21'
      locator:
        row: 166
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 25
      printed_page: null
      heading: '2.21'
      locator:
        row: 167
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 12
      printed_page: null
      heading: '2.21'
      locator:
        row: 76
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The party requires one ration per day to sustain themselves. In lieu of rations, the party may
    try the Foraging Skill once per day. Foraging in a hex with trees gives a +10 modifier to the
    Foraging skill. Foraging on a road hex gives a – 10 modifier to the Foraging Skill. If they
    succeed, each character will have enough food for the day. However, if they fail, they are
    left without food. They go hungry and temporarily lose half their Constitution (RDD). This
    leaves them vulnerable to disease, poison and physical damage. Party Morale is also lowered by
    4. This lasts until they eat again. This is not cumulative, so it does not matter how many days
    you go hungry. When travelling in the Ancient Lands, each hero requires 2 rations per day
    (simulating the need for water), and Foraging is not possible in that barren land. Once per
    day the party rests. During that rest they regain 1D6 Hit Points and possibly some energy.
    Roll 1d6 per Energy Point and a result of 1-3 will replenish that Energy Point. Note that the
    use of a bedroll increases the effect of resting (See Equipment tables for details).
  unresolved_references:
    - Changelog 2.21 entry 166 changes the printed "Party Morale is also lowered by 4" into "Party
      Morale is also lowered by 1 per character (Mercenaries included, not dogs)". The printed
      sentence stays quoted; step hunger_morale applies the ruling, keeping the printed duration
      ("This lasts until they eat again") and the printed non-cumulation across days. This is the
      same hunger penalty as the "A character is hungry" row of the Party Morale table
      (character.morale.event.hungry, changelog 2.21 entry 148), applied once, not a second one;
      step hunger_morale applies it itself, and the rule is listed as the dependency hungry_morale
      for reference only, never invoked as a handoff, so a consumer does not subtract it twice.
    - Changelog 2.21 entries 76 and 167 change "each hero" into "the party" ("When travelling in
      the Ancient Lands, the party requires 2 rations per day"); step ancient_food_requirement
      applies it. A supply of exactly 1 ration in the Ancient Lands stays
      issue.travel.partial_rations.
    - The food phase resolves the party's rations or Foraging once per day; the hero phase applies
      that shared result to one character's Constitution; the rest phase recovers one hero. Rest
      in a settlement is not this rest ("If the party decides to end their movement in a
      settlement or the City Hex, they have to pay to stay at the inn overnight. Go to the chapter
      on 'Settlements' for more information.").
  fields:
    phase:
      type: string
      role: input
      description:
        food resolves party supplies and morale once; hero applies that shared food result to
        one character; rest recovers one hero. Pass each character’s separate state for
        hero/rest, sharing party fields.
    food_choice:
      type: string
      role: input
      description: food choice
    terrain:
      type: string
      role: input
      description: terrain
    day:
      type: number
      role: input
      description: day
      integer: true
      minimum: 0
    food_day:
      type: number
      role: state
      description: food day
      integer: true
      minimum: -1
    hero_food_day:
      type: number
      role: state
      description: hero food day
      integer: true
      minimum: -1
    hero_rest_day:
      type: number
      role: state
      description: hero rest day
      integer: true
      minimum: -1
    forage_day:
      type: number
      role: state
      description: forage day
      integer: true
      minimum: -1
    rations_available:
      type: number
      role: state
      description: rations available
      integer: true
      minimum: 0
    constitution:
      type: number
      role: state
      description: constitution
    hunger_constitution_loss:
      type: number
      role: state
      description: hunger constitution loss
    party_morale:
      type: number
      role: state
      description: party morale
    hit_points:
      type: number
      role: state
      description: hit points
    energy:
      type: number
      role: state
      description: energy
    party_fed:
      type: boolean
      role: state
      description: party fed
    hunger_morale_active:
      type: boolean
      role: state
      description: hunger morale active
    hunger_morale_loss:
      type: number
      role: state
      description: Party Morale removed by the current hunger, restored when the party eats again.
      integer: true
      minimum: 0
    party_member_count:
      type: number
      role: input
      description: Every member travelling with the party, counting heroes, mercenaries and dogs.
      integer: true
      minimum: 1
    dog_count:
      type: number
      role: input
      description:
        Dogs among the party members. Changelog 2.21 entry 166 counts each character for the
        hunger penalty, mercenaries included, not dogs.
      integer: true
      minimum: 0
    hungry:
      type: boolean
      role: state
      description: hungry
    foraging_skill:
      type: number
      role: input
      description: foraging skill
    equipment_foraging_modifier:
      type: number
      role: input
      description: equipment foraging modifier
    maximum_hit_points:
      type: number
      role: input
      description: maximum hit points
    maximum_energy:
      type: number
      role: input
      description: maximum energy
    foraging_roll:
      type: number
      role: input
      description: foraging roll
      integer: true
      minimum: 1
      maximum: 100
    hp_roll:
      type: number
      role: input
      description: hp roll
      integer: true
      minimum: 1
      maximum: 6
    energy_successes:
      type: number
      role: input
      description: Supplied count of Energy recovery d6 rolls showing 1–3; at most maximum_energy.
        Dependency outcomes are supplied, not executed by invoke.
      integer: true
      minimum: 0
    bedroll:
      type: boolean
      role: input
      description: bedroll
    at_settlement:
      type: boolean
      role: input
      description: at settlement
    food_required:
      type: number
      role: output
      description: food required
    foraging_target:
      type: number
      role: output
      description: foraging target
    has_trees:
      type: boolean
      role: input
      description: Whether the current hex has trees, independently of whether a road also crosses it.
  dependencies:
    - key: foraging_check
      label: Foraging Skill check
      object_id: core.check.standard
    - key: bedroll
      label: Bed Roll Energy recovery
      object_id: character.equipment.general.bed_roll.rest
    - key: hungry_morale
      label: Party Morale table row for a hungry character; reference only, applied inline by step
        hunger_morale and not invoked
      object_id: character.morale.event.hungry
  steps:
    - id: determine_food_requirement
      source_text: The party requires one ration per day to sustain themselves.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: phase
        right:
          type: literal
          value: food
      effects:
        - type: set
          target: food_required
          value:
            type: literal
            value: 1
    - id: ancient_food_requirement
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 127
          printed_page: 125
          heading: Rations and Resting
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 25
          printed_page: null
          heading: '2.21'
          extraction:
            method: image
            confidence: high
            visually_verified: true
          locator:
            row: 167
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 12
          printed_page: null
          heading: '2.21'
          extraction:
            method: image
            confidence: high
            visually_verified: true
          locator:
            row: 76
      source_text: When travelling in the Ancient Lands, each hero requires 2 rations per day
        (simulating the need for water)
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: food
          - type: compare
            operator: eq
            left:
              type: field
              name: terrain
            right:
              type: literal
              value: ancient_lands
      effects:
        - type: set
          target: food_required
          value:
            type: literal
            value: 2
    - id: reject_ancient_foraging
      source_text: Foraging is not possible in that barren land.
      when:
        type: all
        conditions:
          - &a4
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: food
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: food_day
          - type: compare
            operator: eq
            left:
              type: field
              name: food_choice
            right:
              type: literal
              value: forage
      effects:
        - type: require
          condition:
            type: compare
            operator: ne
            left:
              type: field
              name: terrain
            right:
              type: literal
              value: ancient_lands
    - id: consume_rations
      source_text: The party requires one ration per day to sustain themselves.
      when:
        type: all
        conditions:
          - &a5
            type: all
            conditions:
              - *a4
              - type: compare
                operator: eq
                left:
                  type: field
                  name: food_choice
                right:
                  type: literal
                  value: rations
          - type: compare
            operator: gte
            left:
              type: field
              name: rations_available
            right:
              type: field
              name: food_required
      effects:
        - type: set
          target: rations_available
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: rations_available
              - type: field
                name: food_required
        - type: set
          target: party_fed
          value:
            type: literal
            value: true
        - type: set
          target: food_day
          value:
            type: field
            name: day
    - id: no_rations
      source_text: They go hungry
      when:
        type: all
        conditions:
          - *a5
          - type: compare
            operator: eq
            left:
              type: field
              name: rations_available
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: party_fed
          value:
            type: literal
            value: false
        - type: set
          target: food_day
          value:
            type: field
            name: day
    - id: partial_ancient_rations
      source_text: When travelling in the Ancient Lands, each hero requires 2 rations per day
        (simulating the need for water)
      when:
        type: all
        conditions:
          - *a5
          - type: compare
            operator: gt
            left:
              type: field
              name: rations_available
            right:
              type: literal
              value: 0
          - type: compare
            operator: lt
            left:
              type: field
              name: rations_available
            right:
              type: field
              name: food_required
      effects:
        - type: unresolved
          issue_id: issue.travel.partial_rations
    - id: foraging_target
      source_text: In lieu of rations, the party may try the Foraging Skill once per day.
      when: &a6
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: food_choice
            right:
              type: literal
              value: forage
          - type: compare
            operator: ne
            left:
              type: field
              name: terrain
            right:
              type: literal
              value: ancient_lands
          - type: compare
            operator: gt
            left:
              type: field
              name: day
            right:
              type: field
              name: forage_day
      effects:
        - type: set
          target: foraging_target
          value:
            type: sum
            values:
              - type: field
                name: foraging_skill
              - type: field
                name: equipment_foraging_modifier
    - id: trees_modifier
      source_text: Foraging in a hex with trees gives a +10 modifier to the Foraging skill.
      when:
        type: all
        conditions:
          - *a6
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: trees
              - type: compare
                operator: eq
                left:
                  type: field
                  name: has_trees
                right:
                  type: literal
                  value: true
      effects:
        - type: set
          target: foraging_target
          value:
            type: sum
            values:
              - type: field
                name: foraging_target
              - type: literal
                value: 10
    - id: road_modifier
      source_text: Foraging on a road hex gives a – 10 modifier to the Foraging Skill.
      when:
        type: all
        conditions:
          - *a6
          - type: compare
            operator: eq
            left:
              type: field
              name: terrain
            right:
              type: literal
              value: road
      effects:
        - type: set
          target: foraging_target
          value:
            type: sum
            values:
              - type: field
                name: foraging_target
              - type: literal
                value: -10
    - id: foraging_attempt
      source_text: In lieu of rations, the party may try the Foraging Skill once per day.
      when: *a6
      effects:
        - type: invoke
          dependency: foraging_check
        - type: set
          target: party_fed
          value:
            type: literal
            value: false
    - id: foraging_success
      source_text: If they succeed, each character will have enough food for the day.
      when:
        type: all
        conditions:
          - *a6
          - type: compare
            operator: lte
            left:
              type: field
              name: foraging_roll
            right:
              type: field
              name: foraging_target
      effects:
        - type: set
          target: party_fed
          value:
            type: literal
            value: true
    - id: finish_foraging
      source_text: However, if they fail, they are left without food.
      when: *a6
      effects:
        - type: set
          target: forage_day
          value:
            type: field
            name: day
        - type: set
          target: food_day
          value:
            type: field
            name: day
    - id: hunger_morale
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 127
          printed_page: 125
          heading: Rations and Resting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 25
          printed_page: null
          heading: '2.21'
          locator:
            row: 166
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: Party Morale is also lowered by 4. This lasts until they eat again. This is not
        cumulative, so it does not matter how many days you go hungry.
      when:
        type: all
        conditions:
          - &a7
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: food
              - type: compare
                operator: eq
                left:
                  type: field
                  name: food_day
                right:
                  type: field
                  name: day
          - type: compare
            operator: eq
            left:
              type: field
              name: party_fed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: hunger_morale_active
            right:
              type: literal
              value: false
      effects:
        - type: require
          condition:
            type: compare
            operator: lte
            left:
              type: field
              name: dog_count
            right:
              type: field
              name: party_member_count
        - type: set
          target: hunger_morale_loss
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: party_member_count
              - type: field
                name: dog_count
        - type: set
          target: party_morale
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: party_morale
              - type: field
                name: hunger_morale_loss
        - type: set
          target: hunger_morale_active
          value:
            type: literal
            value: true
    - id: restore_morale
      source_text: This lasts until they eat again.
      when:
        type: all
        conditions:
          - *a7
          - type: compare
            operator: eq
            left:
              type: field
              name: party_fed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hunger_morale_active
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: party_morale
          value:
            type: sum
            values:
              - type: field
                name: party_morale
              - type: field
                name: hunger_morale_loss
        - type: set
          target: hunger_morale_loss
          value:
            type: literal
            value: 0
        - type: set
          target: hunger_morale_active
          value:
            type: literal
            value: false
    - id: apply_hunger
      source_text: They go hungry and temporarily lose half their Constitution (RDD). This leaves
        them vulnerable to disease, poison and physical damage.
      when:
        type: all
        conditions:
          - &a8
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: hero
              - type: compare
                operator: eq
                left:
                  type: field
                  name: food_day
                right:
                  type: field
                  name: day
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: hero_food_day
          - type: compare
            operator: eq
            left:
              type: field
              name: party_fed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: hungry
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: hunger_constitution_loss
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: field
                    name: constitution
                  - type: literal
                    value: 2
        - type: set
          target: constitution
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: constitution
              - type: field
                name: hunger_constitution_loss
        - type: set
          target: hungry
          value:
            type: literal
            value: true
    - id: restore_constitution
      source_text: This lasts until they eat again.
      when:
        type: all
        conditions:
          - *a8
          - type: compare
            operator: eq
            left:
              type: field
              name: party_fed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hungry
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: constitution
          value:
            type: sum
            values:
              - type: field
                name: constitution
              - type: field
                name: hunger_constitution_loss
        - type: set
          target: hunger_constitution_loss
          value:
            type: literal
            value: 0
        - type: set
          target: hungry
          value:
            type: literal
            value: false
    - id: record_hero_food
      source_text: This is not cumulative, so it does not matter how many days you go hungry.
      when: *a8
      effects:
        - type: set
          target: hero_food_day
          value:
            type: field
            name: day
    - id: hp_recovery_boundary
      source_text: During that rest they regain 1D6 Hit Points
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: rest
              - type: compare
                operator: eq
                left:
                  type: field
                  name: at_settlement
                right:
                  type: literal
                  value: false
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: hero_rest_day
          - type: compare
            operator: lt
            left:
              type: field
              name: maximum_hit_points
            right:
              type: sum
              values:
                - type: field
                  name: hit_points
                - type: field
                  name: hp_roll
      effects:
        - type: unresolved
          issue_id: issue.phase4.recovery_bounds
    - id: check_energy_results
      source_text: Roll 1d6 per Energy Point and a result of 1-3 will replenish that Energy Point.
      when:
        type: all
        conditions:
          - &a9
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: rest
              - type: compare
                operator: eq
                left:
                  type: field
                  name: at_settlement
                right:
                  type: literal
                  value: false
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: hero_rest_day
          - type: compare
            operator: eq
            left:
              type: field
              name: bedroll
            right:
              type: literal
              value: false
      effects:
        - type: require
          condition:
            type: compare
            operator: lte
            left:
              type: field
              name: energy_successes
            right:
              type: field
              name: maximum_energy
    - id: ordinary_energy
      source_text: During that rest they regain 1D6 Hit Points and possibly some energy. Roll 1d6
        per Energy Point and a result of 1-3 will replenish that Energy Point.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - *a9
              - type: compare
                operator: eq
                left:
                  type: field
                  name: bedroll
                right:
                  type: literal
                  value: false
              - type: compare
                operator: lte
                left:
                  type: field
                  name: energy_successes
                right:
                  type: field
                  name: maximum_energy
      effects:
        - type: set
          target: energy
          value:
            type: arithmetic
            operator: min
            values:
              - type: field
                name: maximum_energy
              - type: sum
                values:
                  - type: field
                    name: energy
                  - type: field
                    name: energy_successes
    - id: bedroll_energy
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 127
          printed_page: 125
          heading: Rations and Resting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: 'Miscellaneous: Bed Roll'
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Note that the use of a bedroll increases the effect of resting (See Equipment
        tables for details). ... You automatically regain all Energy Points.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - *a9
              - type: compare
                operator: eq
                left:
                  type: field
                  name: bedroll
                right:
                  type: literal
                  value: true
      effects:
        - type: invoke
          dependency: bedroll
        - type: set
          target: energy
          value:
            type: field
            name: maximum_energy
    - id: rest_hp
      source_text: Once per day the party rests. During that rest they regain 1D6 Hit Points
      when:
        type: all
        conditions:
          - &rest_valid
            type: all
            conditions:
              - *a9
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: bedroll
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: lte
                    left:
                      type: field
                      name: energy_successes
                    right:
                      type: field
                      name: maximum_energy
          - type: compare
            operator: gte
            left:
              type: field
              name: maximum_hit_points
            right:
              type: sum
              values:
                - type: field
                  name: hit_points
                - type: field
                  name: hp_roll
      effects:
        - type: set
          target: hit_points
          value:
            type: sum
            values:
              - type: field
                name: hit_points
              - type: field
                name: hp_roll
    - id: recover_at_rest
      source_text: Once per day the party rests.
      when: *rest_valid
      effects:
        - type: set
          target: hero_rest_day
          value:
            type: field
            name: day
  entry_step: determine_food_requirement
  exit_step: recover_at_rest
  issues:
    - issue.travel.partial_rations
    - issue.phase4.recovery_bounds
    - issue.psychology.hungry_morale_duration_and_travel_penalty
    - issue.character_basics.foraging_travel
- id: procedure.travel_event_check
  name: Daily travel event check
  section_id: section.travelling_and_skirmishes.events
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 125
      pdf_page: 127
      heading: Events
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: At the start of each day before moving, the party must roll 1d12. While being
    off-road, a result of 11-12 will result in an Event. Draw a Wilderness Event Card. While on a
    road or in the desert, a result of 10-12 will result in an Event. Draw a Road Event or Desert
    Event Card.
  unresolved_references:
    - Every hex below the white dotted line is in the Ancient Land and is a Desert Hex (PDF 126,
      chapter introduction), so Ancient Lands travel uses the desert threshold and the Desert
      Event Cards.
  fields:
    terrain:
      type: string
      role: input
      description: Current travel terrain, used to select the printed event threshold and event deck.
    event_roll:
      type: number
      role: input
      integer: true
      minimum: 1
      maximum: 12
      description: Supplied d12 result.
    day:
      type: number
      role: input
      description: day
      integer: true
      minimum: 0
    event_day:
      type: number
      role: state
      description: event day
      integer: true
      minimum: -1
    movement_started:
      type: boolean
      role: input
      description: movement started
    event_deck:
      type: string
      role: output
      description: event deck
    event_triggered:
      type: boolean
      role: output
      description: event triggered
  dependencies:
    - key: draw_travel_event
      label: Draw the applicable Wilderness, Road, or Desert Event Card
  steps:
    - id: check_before_movement
      source_text: At the start of each day before moving, the party must roll 1d12.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: movement_started
            right:
              type: literal
              value: false
        - type: require
          condition: &a11
            type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: road
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: off_road
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: desert
    - id: reset_event_result
      source_text: At the start of each day before moving, the party must roll 1d12.
      when:
        type: all
        conditions:
          - *a11
          - &a12
            type: all
            conditions:
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: event_day
              - type: compare
                operator: eq
                left:
                  type: field
                  name: movement_started
                right:
                  type: literal
                  value: false
      effects:
        - type: set
          target: event_triggered
          value:
            type: literal
            value: false
        - type: set
          target: event_deck
          value:
            type: literal
            value: none
    - id: offroad_event
      source_text:
        While being off-road, a result of 11-12 will result in an Event. Draw a Wilderness
        Event Card.
      when:
        type: all
        conditions:
          - *a11
          - type: all
            conditions:
              - *a12
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: terrain
                    right:
                      type: literal
                      value: off_road
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: event_roll
                    right:
                      type: literal
                      value: 11
      effects:
        - type: set
          target: event_triggered
          value:
            type: literal
            value: true
        - type: set
          target: event_deck
          value:
            type: literal
            value: Wilderness
        - type: invoke
          dependency: draw_travel_event
    - id: road_or_desert_event
      source_text:
        While on a road or in the desert, a result of 10-12 will result in an Event. Draw a
        Road Event or Desert Event Card.
      when:
        type: all
        conditions:
          - *a11
          - type: all
            conditions:
              - *a12
              - type: all
                conditions:
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: terrain
                        right:
                          type: literal
                          value: road
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: terrain
                        right:
                          type: literal
                          value: desert
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: event_roll
                    right:
                      type: literal
                      value: 10
      effects:
        - type: set
          target: event_triggered
          value:
            type: literal
            value: true
        - type: invoke
          dependency: draw_travel_event
    - id: road_deck
      source_text: While on a road or in the desert, a result of 10-12 will result in an Event.
        Draw a Road Event or Desert Event Card.
      when:
        type: all
        conditions:
          - *a11
          - type: all
            conditions:
              - *a12
              - type: compare
                operator: eq
                left:
                  type: field
                  name: event_triggered
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: road
      effects:
        - type: set
          target: event_deck
          value:
            type: literal
            value: Road
    - id: desert_deck
      source_text: While on a road or in the desert, a result of 10-12 will result in an Event.
        Draw a Road Event or Desert Event Card.
      when:
        type: all
        conditions:
          - *a11
          - type: all
            conditions:
              - *a12
              - type: compare
                operator: eq
                left:
                  type: field
                  name: event_triggered
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: terrain
                right:
                  type: literal
                  value: desert
      effects:
        - type: set
          target: event_deck
          value:
            type: literal
            value: Desert
    - id: record_event_day
      source_text: At the start of each day before moving, the party must roll 1d12.
      when:
        type: all
        conditions:
          - *a11
          - *a12
      effects:
        - type: set
          target: event_day
          value:
            type: field
            name: day
  entry_step: check_before_movement
  exit_step: record_event_day
- id: procedure.travel_skirmish_setup
  name: Outdoor skirmish setup
  section_id: section.travelling_and_skirmishes.skirmishes
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 127
      printed_page: 125
      heading: Skirmishes; Roads; Wilderness; Village, Camp, Standing Stones, Quest site entrance, City street
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 128
      printed_page: 126
      section: Skirmishes
      heading: Desert; Setup
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Sometimes the Event Cards or mini-quests initiate a skirmish. In that case, follow the
    instructions for how to set up the party and the adversaries. There are four kinds of outdoor
    tiles. ... Use these when a skirmish is initiated from a road event. ... These are the tiles
    with open ground. They should be used when a skirmish is initiated by a wilderness event. ...
    These should be used when specifically called for. ... These are used when a skirmish is
    triggered by a desert event. ... Normally, the party is placed as close to the centre as
    possible, and the enemies are randomly placed the number of squares from the edges as
    specified by the Event card (1d6, 1d8, 1d10, etc.). Combat is enacted as described in the
    ‘Combat’ chapter. See the Obstacles Table to determine what effect the terrain has on
    movement, shooting and LOS. Threat level and scenario dice are not in effect during
    skirmishes. You could as well use 3d terrain by placing suitable scatter such as walls,
    hedges, bushes, and trees without giving the party any benefits. In that case, treat squares
    as inches.
  unresolved_references:
    - The page says "four kinds of outdoor tiles" and prints four run-in headings (Roads;
      Wilderness; Village, Camp, Standing Stones, Quest site entrance, City street; Desert). The
      tiles, the Event Cards and the mini-quests are physical components; their setup
      instructions, enemy statistics and map geometry are supplied.
  issues:
    - issue.travel.skirmish_3d_terrain_charging
  fields:
    setup_instructions:
      type: string
      role: input
      description: Supplied event/mini-quest setup, enemy edge distances and adversary selection.
    terrain_map:
      type: string
      role: input
      description: Supplied outdoor tile/map geometry and terrain.
    threat_enabled:
      type: boolean
      role: output
      description: threat enabled
    scenario_dice_enabled:
      type: boolean
      role: output
      description: scenario dice enabled
    party_placement:
      type: string
      role: output
      description: party placement
    enemy_placement:
      type: string
      role: output
      description: enemy placement
    distance_unit:
      type: string
      role: output
      description: distance unit
    use_3d_terrain:
      type: boolean
      role: input
      description: use 3d terrain
    skirmish_trigger:
      type: string
      role: input
      description: What initiated the skirmish and so which outdoor tiles to use - road_event,
        wilderness_event, desert_event, or called_for when the Event Card or mini-quest
        specifically calls for Village, Camp, Standing Stones, Quest site entrance or City street
        tiles.
    outdoor_tiles:
      type: string
      role: output
      description: Outdoor tiles used for the skirmish map.
  dependencies:
    - key: combat
      label: Existing combat procedures
      object_id: procedure.combat_preparation
    - key: geometry
      label: Outdoor map geometry and placement
    - key: adversaries
      label: Event or mini-quest adversary instructions and statistics
    - key: obstacles
      label: Outdoor Obstacles Table
      object_id: table.travel.obstacles
  steps:
    - id: require_supplied_setup
      source_text: Sometimes the Event Cards or mini-quests initiate a skirmish. In that case,
        follow the instructions for how to set up the party and the adversaries.
      effects:
        - type: require
          condition: &a13
            type: all
            conditions:
              - type: compare
                operator: ne
                left:
                  type: field
                  name: setup_instructions
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: ne
                left:
                  type: field
                  name: terrain_map
                right:
                  type: literal
                  value: ''
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: skirmish_trigger
                    right:
                      type: literal
                      value: road_event
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: skirmish_trigger
                    right:
                      type: literal
                      value: wilderness_event
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: skirmish_trigger
                    right:
                      type: literal
                      value: desert_event
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: skirmish_trigger
                    right:
                      type: literal
                      value: called_for
    - id: road_tiles
      source_text: Use these when a skirmish is initiated from a road event.
      when:
        type: all
        conditions:
          - *a13
          - type: compare
            operator: eq
            left:
              type: field
              name: skirmish_trigger
            right:
              type: literal
              value: road_event
      effects:
        - type: set
          target: outdoor_tiles
          value:
            type: literal
            value: Roads
    - id: wilderness_tiles
      source_text: These are the tiles with open ground. They should be used when a skirmish is
        initiated by a wilderness event.
      when:
        type: all
        conditions:
          - *a13
          - type: compare
            operator: eq
            left:
              type: field
              name: skirmish_trigger
            right:
              type: literal
              value: wilderness_event
      effects:
        - type: set
          target: outdoor_tiles
          value:
            type: literal
            value: Wilderness
    - id: called_for_tiles
      source_text: These should be used when specifically called for.
      when:
        type: all
        conditions:
          - *a13
          - type: compare
            operator: eq
            left:
              type: field
              name: skirmish_trigger
            right:
              type: literal
              value: called_for
      effects:
        - type: set
          target: outdoor_tiles
          value:
            type: literal
            value: Village, Camp, Standing Stones, Quest site entrance, City street
    - id: desert_tiles
      source_text: These are used when a skirmish is triggered by a desert event.
      when:
        type: all
        conditions:
          - *a13
          - type: compare
            operator: eq
            left:
              type: field
              name: skirmish_trigger
            right:
              type: literal
              value: desert_event
      effects:
        - type: set
          target: outdoor_tiles
          value:
            type: literal
            value: Desert
    - id: apply_setup_instructions
      source_text: Normally, the party is placed as close to the centre as possible, and the
        enemies are randomly placed the number of squares from the edges as specified by the Event
        card (1d6, 1d8, 1d10, etc.).
      effects:
        - type: set
          target: party_placement
          value:
            type: literal
            value: as close to centre as possible, unless setup instructions override
        - type: set
          target: enemy_placement
          value:
            type: literal
            value: randomly from edges at card-specified distance
        - type: invoke
          dependency: geometry
        - type: invoke
          dependency: adversaries
      when: *a13
    - id: apply_obstacles
      source_text: See the Obstacles Table to determine what effect the terrain has on movement,
        shooting and LOS.
      effects:
        - type: invoke
          dependency: obstacles
      when: *a13
    - id: resolve_skirmish
      source_text: Combat is enacted as described in the ‘Combat’ chapter. ... Threat level and
        scenario dice are not in effect during skirmishes.
      effects:
        - type: set
          target: threat_enabled
          value:
            type: literal
            value: false
        - type: set
          target: scenario_dice_enabled
          value:
            type: literal
            value: false
        - type: set
          target: distance_unit
          value:
            type: literal
            value: squares
        - type: invoke
          dependency: combat
      when: *a13
    - id: three_dimensional_terrain
      source_text: You could as well use 3d terrain by placing suitable scatter such as walls,
        hedges, bushes, and trees without giving the party any benefits. In that case, treat
        squares as inches.
      when:
        type: all
        conditions:
          - *a13
          - type: compare
            operator: eq
            left:
              type: field
              name: use_3d_terrain
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: distance_unit
          value:
            type: literal
            value: inches
        - type: unresolved
          issue_id: issue.travel.skirmish_3d_terrain_charging
  entry_step: require_supplied_setup
  exit_step: three_dimensional_terrain
