  status: extracted
  confidence: high
  source_text:
    'Quest Location: No travel necessary. Special rules: - Number of tiles: 7 corridors, 7
    rooms. Reward: 300 c per hero. Encounters: Undead. ... Place the Necromancer at the far end of
    the room. Place 6 Zombies armed with longswords close to him. Heroes enter along a short side.
    ... Ragnalf knows Raise Dead, 3 Ranged Spells and 2 Close-combat spells. Armed with a poisonous
    dagger and Armour 0. XP 200, T4 ... Moving across the corpses and fighting at the same time is
    very difficult. All CS and RS are reduced by 10% for the heroes. Any ‘To Hit’ roll of 90 or more
    means that hero loses his balance and falls. The hero must spend the next action getting up.
    However, the corpses on the ground do their best to pull them down again, and a DEX Test is
    required to succeed. The zombies standing next to Ragnalf will not move toward the heroes, but
    instead form a circle to protect him. If Ragnalf dies, all zombies die as well. ... When the
    Necromancer dies, all zombies topple over and all movement on the floor stops. ... Not staying a
    minute longer than necessary, the heroes head back to town to collect their reward.'
  issues:
    - issue.quest.necromancer_lifecycle_scope
    - issue.quest.ragnalf_unspecified_spells_poison
    - issue.quest.necromancer_cs_rs_reduction
