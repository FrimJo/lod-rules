    dex_result_supplied:
      type: boolean
      role: input
      description: Actual source event or supplied eligibility belonging to this occurrence/hero/pending action.
    dex_result_matches_pending_attempt:
      type: boolean
      role: input
      description: Actual source event or supplied eligibility belonging to this occurrence/hero/pending action.
    reward_hero_eligible:
      type: boolean
      role: input
      description: Actual source event or supplied eligibility belonging to this occurrence/hero/pending action.
    actual_hit_event:
      type: number
