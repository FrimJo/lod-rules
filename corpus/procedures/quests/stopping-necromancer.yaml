    objective_room_entered:
      type: boolean
      role: input
      description: Actual source event or supplied eligibility belonging to this occurrence/hero/pending action.
    hit_result_supplied:
      type: boolean
      role: input
      description: Actual source event or supplied eligibility belonging to this occurrence/hero/pending action.
    next_action_is_actual:
      type: boolean
      role: input
