- id: procedure.stopping_necromancer
  name: Stopping the Necromancer owned occurrence, hero action and return checkpoints
  section_id: section.quest_book_i.the_great_crypt.quest_2_stopping_the_necromancer
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 261
      printed_page: 259
      heading: Stopping the Necromancer; Setup; Special Rules; Aftermath; Ragnalf the Mad
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Initialize the actual owned occurrence once with no travel, seven corridors and rooms,
    Undead and actual d6 Threat (minimum=start, maximum20). Actual objective entry places Ragnalf,
    six longsword Zombies and heroes once; external statistics and unspecified spell/poison outcomes
    remain handoffs. Hero-owned corpse-floor contributions do not accumulate or alter unrelated
    modifiers. Actual To Hit90+ causes a fall and the next action must attempt getting up with an
    owned DEX result. Ragnalf death once kills all zombies and stops floor movement. Battle/XP/T4
    handoffs do not credit300c; each eligible hero actually returned to town has a separate
    once-only payment context. Retry, timing, scope and expiry questions remain explicit.
  issues:
    - issue.quest.necromancer_lifecycle_scope
    - issue.quest.ragnalf_unspecified_spells_poison
  fields:
    objective:
      type: string
      role: state
      description: objective
    location:
