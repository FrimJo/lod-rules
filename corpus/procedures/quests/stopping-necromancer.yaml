      description: Owned Threat/source contribution or actual hero purse; unrelated modifiers are
        separately owned.
      integer: true
    necro_maximum_threat:
      type: number
      role: state
      description: Owned Threat/source contribution or actual hero purse; unrelated modifiers are
        separately owned.
      integer: true
    necro_cs_contribution:
      type: number
      role: state
      description: Owned Threat/source contribution or actual hero purse; unrelated modifiers are
        separately owned.
      integer: true
    necro_rs_contribution:
      type: number
      role: state
      description: Owned Threat/source contribution or actual hero purse; unrelated modifiers are
        separately owned.
      integer: true
    coins:
