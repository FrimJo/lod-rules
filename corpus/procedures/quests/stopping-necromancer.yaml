        attempt owns the spent action after delayed result.
  dependencies:
    - key: quest
      label: Accepted quest catalogue
      object_id: quest.great_crypt.stopping_necromancer
    - key: actor
      label: Printed Ragnalf actor
      object_id: quest_actor.great_crypt.ragnalf
    - key: threat
      label: Actual initial d6
      object_id: table.quest.stopping_necromancer.threat
    - key: external
      label:
        Actual Zombie statistics, Raise Dead, three ranged and two close-combat spell selections,
        poisonous dagger outcome; absent or unspecified values are supplied
    - key: dex
      label: Actual pending hero getting-up DEX Test result; request is not success
    - key: battle
      label:
        Actual owned battle result, XP200 accounting and T4 treasure resolution; request does not
        collect or pay
  steps:
    - id: setup
      source: *a1
      source_text: Actual occurrence source setup once; no travel or payment.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: necro_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.great_crypt.stopping_necromancer
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_setup_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.stopping_necromancer.setup
      effects:
        - type: set
          target: necro_setup_processed
          value:
            type: literal
            value: true
    - id: request_threat
      source: *a1
      source_text: Missing actual initial d6 is requested once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_threat_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_threat_requested
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: threat
        - type: set
          target: necro_threat_requested
          value:
            type: literal
            value: true
    - id: initial_threat
      source: *a1
      source_text: Actual d6 initializes Threat and its source bounds once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_setup_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_threat_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: true
      rule_refs: []
      effects:
        - type: set
          target: threat
          value:
            type: field
            name: threat_die
        - type: set
          target: necro_minimum_threat
          value:
            type: field
            name: threat_die
        - type: set
          target: necro_maximum_threat
          value:
            type: literal
            value: 20
        - type: set
          target: necro_threat_processed
          value:
            type: literal
            value: true
    - id: objective_setup
      source: *a1
      source_text: Actual entry places printed actors once; replay never teleports or resurrects.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: objective_room
          - type: compare
            operator: eq
            left:
              type: field
              name: objective_room_entered
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_setup_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_threat_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_room_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.stopping_necromancer.objective_setup
        - core.quest.stopping_necromancer.ragnalf
      effects:
        - type: set
          target: necro_room_processed
          value:
            type: literal
            value: true
    - id: external_outcomes
      source: *a1
      source_text: Request unavailable/unspecified combat outcomes once; never manufacture them.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_room_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_external_requested
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: actor
        - type: invoke
          dependency: external
        - type: set
          target: necro_external_requested
          value:
            type: literal
            value: true
    - id: protect_ragnalf
      source: *a1
      source_text: Printed adjacent Zombies form a protective circle while Ragnalf lives.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_room_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: ragnalf_dead
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.stopping_necromancer.zombie_protection
      effects: []
    - id: hero_modifiers
      source: *a1
      source_text: Report source-owned -10 CS/RS contribution while hero is in objective room; total
        values and unrelated contributions are not rewritten. Death expiry is not inferred.
      when:
        type: all
        conditions:
          - &a3
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: necro_hero_owner_matches
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: modifiers
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_room_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hero_in_objective_room
            right:
              type: literal
              value: true
      rule_refs:
        - core.quest.stopping_necromancer.corpse_floor
      effects:
        - type: set
          target: necro_cs_contribution
          value:
            type: literal
            value: -10
        - type: set
          target: necro_rs_contribution
          value:
            type: literal
            value: -10
    - id: hero_departed
      source: *a1
      source_text: Contextual room contribution is zero when actual hero is outside this room.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: modifiers
          - type: compare
            operator: eq
            left:
              type: field
              name: hero_in_objective_room
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: set
          target: necro_cs_contribution
          value:
            type: literal
            value: 0
        - type: set
          target: necro_rs_contribution
          value:
            type: literal
            value: 0
    - id: hit
      source: *a1
      source_text:
        Consume actual chronological hero To Hit result once; source90+ sets fall/next action
        requirement.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: hit
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_room_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hero_in_objective_room
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_hit_event
            right:
              type: field
              name: last_hit_event
      rule_refs:
        - core.quest.stopping_necromancer.fall
      effects:
        - type: set
          target: last_hit_event
          value:
            type: field
            name: actual_hit_event
    - id: getting_up_start
      source: *a1
      source_text: Actual required next action begins one pending attempt; no inferred retry schedule.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: getting_up
          - type: compare
            operator: eq
            left:
              type: field
              name: hero_in_objective_room
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: hero_fallen
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: next_action_getting_up_required
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: next_action_is_actual
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_next_action_spent_getting_up
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_getting_up_pending
            right:
              type: literal
              value: false
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_getting_up_attempt
            right:
              type: field
              name: last_getting_up_attempt
      rule_refs: []
      effects:
        - type: set
          target: pending_getting_up_attempt
          value:
            type: field
            name: actual_getting_up_attempt
        - type: set
          target: last_getting_up_attempt
          value:
            type: field
            name: actual_getting_up_attempt
        - type: set
          target: necro_getting_up_pending
          value:
            type: literal
            value: true
        - type: set
          target: necro_dex_requested
          value:
            type: literal
            value: false
        - type: set
          target: getting_up_succeeded
          value:
            type: literal
            value: false
        - type: set
          target: next_action_getting_up_required
          value:
            type: literal
            value: false
    - id: request_dex
      source: *a1
      source_text: Request actual pending hero/attempt DEX outcome once.
      when:
        type: all
        conditions:
          - &a4
            type: all
            conditions:
              - *a3
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: getting_up
              - type: compare
                operator: eq
                left:
                  type: field
                  name: hero_in_objective_room
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: necro_getting_up_pending
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_getting_up_attempt
                right:
                  type: field
                  name: pending_getting_up_attempt
          - type: compare
            operator: eq
            left:
              type: field
              name: dex_result_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: necro_dex_requested
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: dex
        - type: set
          target: necro_dex_requested
          value:
            type: literal
            value: true
    - id: getting_up_result
      source: *a1
      source_text:
        Only actual pending hero/attempt DEX result resolves; failure leaves fallen. Further
        required actions/retries are undefined.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: dex_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dex_result_matches_pending_attempt
            right:
              type: literal
              value: true
      rule_refs: []
      effects:
        - type: set
          target: next_action_spent_getting_up
          value:
            type: literal
            value: true
        - type: set
          target: necro_getting_up_pending
          value:
            type: literal
            value: false
        - type: set
          target: dex_test_required
          value:
            type: literal
            value: false
      substeps:
        - id: apply_getting_up_result
          source: *a1
          source_text:
            Resolve the atomic DEX result against the persisted spent action, preserving supplied
            current-action flags and clearing only the working action report.
          rule_refs:
            - core.quest.stopping_necromancer.getting_up_success
          effects:
            - type: set
