    pending_getting_up_attempt:
      type: number
      role: state
      description:
        Chronological actual hero event identifier; delayed DEX result must match persisted
        pending attempt.
      integer: true
      minimum: 0
    threat_die:
      type: number
      role: input
      description: Actual initial d6 result.
      integer: true
      minimum: 1
      maximum: 6
    threat:
      type: number
      role: state
      description: Owned Threat/source contribution or actual hero purse; unrelated modifiers are
        separately owned.
      integer: true
    necro_minimum_threat:
      type: number
