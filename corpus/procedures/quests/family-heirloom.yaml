  status: extracted
  confidence: high
  source_text: "Quest Location: In the settlement. ... Special Rules: Ignore any special rules for the
    dead members of the Brotherhood. Instead, treat these corpses as dead adventurers and search
    them accordingly. The Scenario die is triggered on 8-10. ... Number of Tiles: 8 corridors, 8
    rooms using the tiles R1B-8B. Reward: 300 c per hero. Encounters: Undead. ... There are no
    enemies in the room. Your heroes are where they were when the door was opened (on the short side
    of the room) ... Take 6 playing cards (3 black, 1 red and 2 dressed cards). Shuffle them and
    place them with their backs up. Opening a tomb will take a complete turn for 2 heroes working
    together (the lids are really heavy). Once the lid is off, draw one of the cards. ... Black:
    There is a mummified corpse in the bottom of the tomb, but nothing else. ... Red: Lying on top
    of a mummified corpse is a shining sword with intricate details. The mummy has been placed with
    its hands on the sword’s hilt, and it is as if it took grip after its demise. With a crunching
    sound, the heroes break the mummy’s fingers, slowly forcing the sword from its grip. ... Dressed
    Card: The heroes stumble backwards as the mummy in the tomb opens his eyes, staring at them with
    malice in its completely black eyes. Before the heroes react, the mummy has climbed out of the
    tomb. Place the mummy next to the tomb and commence combat. ... Once the sword is retrieved, the
    heroes head back up to the surface. The young knight yanks the sword from the hands of the
    adventurer presenting the sword, complaining that it took much longer than expected.
    Nonetheless, he pays them the reward they agreed upon."
