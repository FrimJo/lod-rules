  dependencies:
    - key: quest
      label: Canonical quest
      object_id: quest.great_crypt.family_heirloom
    - key: initial_threat
      label: Actual initial d4+1 Threat
      object_id: table.quest.family_heirloom.threat
    - key: threat_roll
      label: Actual Scenario-triggered Threat roll
      object_id: procedure.threat_roll
    - key: card
      label: Actual unused shuffled pool card and resolved supplied category; no
        rank/colour precedence invented
    - key: mummy
