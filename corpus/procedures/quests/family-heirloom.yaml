        printed locally
    - key: corpse_search
      label: Quest-local dead-adventurer corpse search override; actual findings
        separately owned
      object_id: character.treasure.furniture.dead_adventurer
  steps:
    - id: setup
      source: *a1
      source_text: 'Quest Location: In the settlement. Number of Tiles: 8 corridors, 8
        rooms using the tiles R1B-8B. Reward: 300 c per hero. Encounters:
        Undead. Ignore any special rules for dead members of the Brotherhood.
        Treat these corpses as dead adventurers and search them accordingly.'
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: heirloom_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.great_crypt.family_heirloom
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: heirloom_setup_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.family_heirloom.setup
        - core.quest.family_heirloom.brotherhood_corpses
      effects:
        - type: set
          target: heirloom_setup_processed
          value:
            type: literal
            value: true
    - id: request_threat
      source: *a1
      source_text: Request actual initial d4 once without fabricating Threat.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: heirloom_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.great_crypt.family_heirloom
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: heirloom_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: heirloom_threat_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: heirloom_threat_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: initial_threat
    - id: initial_threat
      source: *a1
      source_text: Printed initial d4+1, minimum same as start, maximum18; replay does
        not reseed current Threat.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: heirloom_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.great_crypt.family_heirloom
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: heirloom_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: heirloom_start_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: heirloom_minimum_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: heirloom_maximum_threat
          value:
            type: literal
            value: 18
        - type: set
          target: heirloom_threat_initialized
          value:
            type: literal
            value: true
    - id: ordinary_scenario
      source: *a1
      source_text: Actual Scenario1–7 does not retain a prior trigger report.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: heirloom_owner_matches
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: instance_quest_id
                    right:
                      type: literal
                      value: quest.great_crypt.family_heirloom
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: scenario
              - type: compare
                operator: eq
                left:
                  type: field
                  name: scenario_event_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gt
                left:
                  type: field
                  name: actual_scenario_event
                right:
                  type: field
                  name: last_scenario_event
          - type: compare
            operator: lt
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 8
      effects:
        - type: set
          target: last_scenario_event
          value:
            type: field
            name: actual_scenario_event
        - type: set
          target: scenario_die_triggered
          value:
            type: literal
            value: false
    - id: scenario_trigger
      source: *a1
      source_text: The Scenario die is triggered on 8-10.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: heirloom_owner_matches
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: instance_quest_id
                    right:
                      type: literal
                      value: quest.great_crypt.family_heirloom
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: scenario
              - type: compare
                operator: eq
                left:
                  type: field
                  name: scenario_event_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gt
                left:
                  type: field
                  name: actual_scenario_event
                right:
                  type: field
                  name: last_scenario_event
          - type: compare
            operator: gte
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 8
          - type: compare
            operator: lte
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 10
      rule_refs:
        - core.quest.family_heirloom.scenario_trigger
      effects:
        - type: set
          target: last_scenario_event
          value:
            type: field
            name: actual_scenario_event
        - type: invoke
          dependency: threat_roll
    - id: objective
      source: *a1
      source_text: There are six tombs. There are no enemies in the room. Heroes
        remain where they were when the door was opened on the short side of the
        room.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: heirloom_owner_matches
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: instance_quest_id
                    right:
                      type: literal
                      value: quest.great_crypt.family_heirloom
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: objective_room
              - type: compare
                operator: eq
                left:
                  type: field
                  name: objective_room_entered
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: heirloom_objective_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.family_heirloom.objective_setup
      effects:
        - type: set
          target: heirloom_objective_processed
          value:
            type: literal
            value: true
    - id: cards
      source: *a1
      source_text: Take 6 playing cards (3 black, 1 red and 2 dressed cards). Shuffle
        them and place them with their backs up.
      when:
