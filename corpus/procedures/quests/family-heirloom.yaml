- id: procedure.family_heirloom
  name: Retrieving the Family Heirloom tomb/card and surface-reward lifecycle
  section_id: section.quest_book_i.the_great_crypt.quest_1_retrieving_the_family_heirloom
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 259
      printed_page: 257
      heading: 'Reward: 300 c per hero'
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 260
      printed_page: 258
      heading: Retrieving the Family Heirloom — aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Initialize settlement/8+8/R1B-8B/Undead and corpse-search exception
    once, actual initial d4+1 Threat once with minimum=start and maximum18, and
    actual Scenario8–10 handoffs. Actual objective entry preserves six tombs, no
    initial enemies and existing hero positions, initializes/shuffles the
    printed six-card pool once. Each actual unopened tomb requires2heroes and a
    complete turn; only then request one actual unused card. Resolve actual
    supplied classification once against remaining3Black/1Red/2Dressed
    categories without choosing deck ranks or colour precedence. Black yields a
    corpse and nothing else; Red retrieves sword; Dressed places mummy next to
    tomb and requests combat. Actual surface return and presentation transfers
    sword and credits300c once per actual owned hero. Requests do not resolve
    combat or searches; no generic quest completion/abandonment, numeric mummy
    statistics, extra loot or XP is invented.
