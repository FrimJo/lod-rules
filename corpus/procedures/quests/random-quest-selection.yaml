- id: procedure.random_quest_selection
  name: Random Quest objective-room and chapter quest selection
  section_id: section.quest_book_i.random_quests
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 243
      printed_page: 241
      heading: Random Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: To embark on a Random Quest, you must first roll on the table below to determine the
    Objective Room. Once that is determined, consult the corresponding chapter and roll which quest
    to embark upon. These quests can be played over and over as the layout of the dungeons shifts
    and the difficulty increases as the heroes gain levels.
  issues:
    - issue.quest.random_quest_second_stage
  fields:
    offer_id:
      type: string
      role: input
      description:
        Actual random quest offer from the settlement visit (procedure.settlement_arrival). A
        new offer, including a later repeat of the same quest, starts a fresh selection.
    selection_offer_id:
      type: string
      role: state
      description: Offer this selection belongs to. Empty for a fresh selection; never rebound.
    owner_matches:
      type: boolean
      role: output
      description: This call's offer matches the saved selection. Reset on every call.
    objective_room_roll:
      type: number
      role: input
      description: Actual 1d6 Objective Room roll for this call.
      integer: true
      minimum: 1
      maximum: 6
    reroll_objective_room:
      type: boolean
      role: output
      description: The latest room roll was 6, so the table must be rolled again.
    selected_objective_room:
      type: string
      role: state
      description: Objective Room chapter selected by the first 1–5 result.
    roll_quest_in_selected_chapter:
      type: boolean
      role: state
      description: The room is known and the chapter quest roll comes next.
    room_selected:
      type: boolean
      role: state
      description: A 1–5 room result is kept; later rolls for this offer cannot replace it.
    chapter_quest_supplied:
      type: boolean
      role: input
      description:
        The actual second-stage chapter quest result is supplied. The book prints no die or
        mapping for it.
    chapter_quest_id:
      type: string
      role: input
      description: Supplied canonical quest id from the selected chapter.
    chapter_quest_room:
      type: string
      role: input
      description: Objective Room chapter that the supplied quest belongs to.
    quest_selected:
      type: boolean
      role: state
      description: The chapter quest for this offer is chosen and kept.
    selected_quest_id:
      type: string
      role: state
      description: Kept chapter quest id for this offer.
    acceptance_handoff_processed:
      type: boolean
      role: state
      description: The selected quest has been handed to quest acceptance once.
  dependencies:
    - key: room_table
      label: Random Quests objective room table
      object_id: table.quest.random_quests.objective_room
    - key: chapter
      label: Quests in the selected Objective Room chapter; the second-stage roll is not printed
      section_id: section.quest_book_i
    - key: acceptance
      label: Party acceptance of the selected quest as a fresh quest instance
      object_id: procedure.quest_acceptance
  steps:
    - id: check_owner
      source: *a1
      source_text:
        To embark on a Random Quest, you must first roll on the table below to determine the
        Objective Room.
      effects:
        - type: set
          target: owner_matches
          value:
            type: literal
            value: false
        - type: set
          target: reroll_objective_room
          value:
            type: literal
            value: false
      substeps:
        - id: bind_offer
          source: *a1
          source_text:
            To embark on a Random Quest, you must first roll on the table below to determine the
            Objective Room.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: selection_offer_id
            right:
              type: literal
              value: ''
          effects:
            - type: set
              target: selection_offer_id
              value:
                type: field
                name: offer_id
        - id: owner
          source: *a1
          source_text:
            To embark on a Random Quest, you must first roll on the table below to determine the
            Objective Room.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: selection_offer_id
            right:
              type: field
              name: offer_id
          effects:
            - type: set
              target: owner_matches
              value:
                type: literal
                value: true
    - id: roll_objective_room
      source: *a1
      source_text:
        To embark on a Random Quest, you must first roll on the table below to determine the
        Objective Room. ... 6 Roll Again
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: room_selected
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest_book.random_quests.result_1
        - core.quest_book.random_quests.result_2
        - core.quest_book.random_quests.result_3
        - core.quest_book.random_quests.result_4
        - core.quest_book.random_quests.result_5
        - core.quest_book.random_quests.result_6
      effects: []
      substeps:
        - id: keep_room
          source: *a1
          source_text:
            Once that is determined, consult the corresponding chapter and roll which quest to
            embark upon.
          when:
            type: compare
            operator: lte
            left:
              type: field
              name: objective_room_roll
            right:
              type: literal
              value: 5
          effects:
            - type: set
              target: room_selected
              value:
                type: literal
                value: true
    - id: second_stage_unresolved
      source: *a1
      source_text: consult the corresponding chapter and roll which quest to embark upon.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: room_selected
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_selected
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: chapter_quest_supplied
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.quest.random_quest_second_stage
    - id: select_chapter_quest
      source: *a1
      source_text: consult the corresponding chapter and roll which quest to embark upon.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: room_selected
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_selected
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: chapter_quest_supplied
            right:
              type: literal
              value: true
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: chapter_quest_room
            right:
              type: field
              name: selected_objective_room
        - type: set
          target: selected_quest_id
          value:
            type: field
            name: chapter_quest_id
        - type: set
          target: quest_selected
          value:
            type: literal
            value: true
        - type: set
          target: roll_quest_in_selected_chapter
          value:
            type: literal
            value: false
    - id: acceptance_handoff
      source: *a1
      source_text: roll which quest to embark upon.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_selected
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: acceptance_handoff_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: acceptance_handoff_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: acceptance
  entry_step: check_owner
  exit_step: acceptance_handoff
  unresolved_references:
    - One selection belongs to one random quest offer; a later offer, including a repeat of the same
      quest, starts a fresh selection.
    - A result of 6 (Roll Again) rolls the table again; the first 1–5 result selects the Objective
      Room and is kept for the offer.
    - The page prints no die or result mapping for the second-stage chapter quest roll, so the
      chapter quest is a supplied outcome (issue.quest.random_quest_second_stage).
    - Acceptance, departure and the quest itself are separate procedures; the handoff does not
      accept or start the quest.
