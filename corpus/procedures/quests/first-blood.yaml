- id: procedure.first_blood
  name: First Blood actual encounter preparation, first-turn bonus and settlement aftermath
  section_id: section.quest_book_i.introduction.first_blood_introductory_quest
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 223
      printed_page: 221
      heading: First Blood; Setup; Special rules; Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The actual introductory encounter has one leader and three bandits on four open-ground
    wilderness tiles. Heroes begin adjacent in the centre. Each of the four owned adversaries has
    actual randomized board-edge/1d10 placement persisted once. Corresponding monster/equipment card
    outcomes remain supplied; no unavailable stats are invented. First actual turn has+2 bandit
    initiative tokens as a once-only initiative handoff; sight/shooting10 and no Scenario die remain
    source constraints. Actual all-bandits-dead unlocks gather-gear/continue-travel and
    no-further-issues settlement arrival handoff once; actual matching arrival/event completion
    remains separate from the request. No cash/XP/treasure is manufactured.
  fields:
    bandit_leaders:
      type: number
      role: state
      description: Number of bandit leaders.
      integer: true
      minimum: 0
    melee_bandits:
      type: number
      role: state
      description: Number of shortsword bandits.
      integer: true
      minimum: 0
    ranged_bandits:
      type: number
      role: state
      description: Number of shortbow bandits.
      integer: true
      minimum: 0
    leader_weapon:
      type: string
      role: state
      description: Printed leader weapon.
    leader_shield:
