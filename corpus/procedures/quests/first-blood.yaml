  status: extracted
  confidence: high
  source_text: The party has been attacked by three bandits and one bandit leader. The bandit leader
    is equipped with a longsword, a shield, and has armour 1. Two bandits are armed with shortswords
    and have armour 0. One bandit is armed with a shortbow, dagger, and has armour 0. Locate the
    corresponding monster cards and monster equipment cards and combine them to represent the
    above-mentioned adversaries. Use four wilderness outdoor tiles (open ground tiles) and place the
    heroes in the centre, adjacent to each other. Then randomise which board edge each bandit
    approaches from, placing them 1d10 squares from the edge. ... The bandits gain +2 initiative
    tokens on the first turn as they surprise the sleeping heroes. Due to the darkness, no one can
    see or shoot further than 10 squares. The Scenario die is not used. ... With the bandits dead,
    the party decides to gather their gear and continue their travel. They arrive at the settlement
    without further issues. Head to the settlement chapter and start by rolling for a settlement
    event. Then decide where this adventure will take your heroes!
