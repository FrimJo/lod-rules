- id: procedure.quest_reading_and_events
  name: Owned quest reading, aftermath finding and upward Threat event checkpoints
  section_id: section.quest_book_i.introduction.reading_the_quests
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Reading the Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 222
      printed_page: 220
      heading: Triggering Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Within each quest there are border lines dividing the information. Do not read further
    than the first border line, or you will encounter spoilers. Once you reach the Quest Room, you
    may read until the second line and, once the quest is complete, you can read the last part. In
    some cases, the aftermath includes some findings, such as treasure chests found by the party.
    These may be in excess of those drawn on the tiles, and everything found in the aftermath can be
    looted ‘off table’, with no traps or locks. Individual quests can generally be played several
    times with the same party. ... Some quests will say that when the Threat Level reaches ‘XX’, a
    Wandering Monster appears. This happens every time the Threat Level is increased to XX and the
    Threat Level is not decreased when the Wandering Monster is placed.
  fields:
    quest_room_reached:
      type: boolean
      role: input
      description: Whether the Quest Room has been reached.
    quest_complete:
      type: boolean
      role: input
      description: Whether the quest is complete.
    quest_room_text_readable:
      type: boolean
      role: state
      description: Permission to read up to the second border.
    aftermath_readable:
      type: boolean
      role: state
      description: Permission to read the last part.
    found_in_aftermath:
      type: boolean
      role: input
      description: Identifies a finding explicitly described in the aftermath.
    off_table_looting:
      type: boolean
      role: state
      description: Finding can be looted off table.
    check_traps:
      type: boolean
      role: state
      description: Whether aftermath loot needs trap checks.
    check_locks:
      type: boolean
      role: state
      description: Whether aftermath loot needs lock checks.
    previous_threat:
      type: number
      role: input
      description: Threat immediately before this supplied change.
      integer: true
      minimum: 0
    current_threat:
      type: number
      role: input
      description: Threat after this supplied change.
      integer: true
      minimum: 0
    quest_threshold:
      type: number
      role: input
      description: XX supplied by the current quest.
      integer: true
      minimum: 0
    wandering_monster_triggered:
      type: boolean
      role: state
      description: Whether this Threat change triggers the quest monster.
    threat_reduction_on_placement:
      type: number
      role: state
      description: No Threat reduction for this special placement.
      integer: true
      minimum: 0
    phase:
      type: string
      role: input
      description: reading, aftermath or threshold.
    quest_event_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/quest occurrence/finding/Threat change event identity confirmed, never
        another pending event.
    aftermath_finding_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/quest occurrence/finding/Threat change event identity confirmed, never
        another pending event.
    actual_threat_change_supplied:
      type: boolean
      role: input
      description:
        Actual party/quest occurrence/finding/Threat change event identity confirmed, never
        another pending event.
    aftermath_finding_processed:
      type: boolean
      role: state
      description: Once-only actual finding context; additional findings have separate contexts.
    actual_threat_event:
      type: number
      role: input
      description: Chronological actual quest Threat event identity.
      integer: true
      minimum: 0
    last_threat_event:
      type: number
      role: state
      description: Chronological actual quest Threat event identity.
      integer: true
      minimum: 0
  dependencies:
    - key: finding
      label: Actual source aftermath finding loot/collection outcome; request is not credited treasure
    - key: monster
      label: Actual source quest-threshold Wandering Monster outcome; no Threat reduction
      object_id: procedure.wandering_monster
    - key: repeat
      label: Source-eligible distinct occurrence acceptance, not reset of old quest
      object_id: procedure.quest_acceptance
  steps:
    - id: reading
      source: *a1
      source_text:
        Once you reach the Quest Room, you may read until the second line and, once the quest
        is complete, you can read the last part.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: reading
      rule_refs:
        - core.quest_book.reading_boundaries
      effects: []
    - id: aftermath
      source: *a1
      source_text:
        In some cases, the aftermath includes some findings, such as treasure chests found by
        the party. These may be in excess of those drawn on the tiles, and everything found in the
        aftermath can be looted ‘off table’, with no traps or locks.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: aftermath
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_complete
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: found_in_aftermath
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: aftermath_finding_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: aftermath_finding_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest_book.aftermath_looting
      effects:
        - type: invoke
          dependency: finding
        - type: set
          target: aftermath_finding_processed
          value:
            type: literal
            value: true
    - id: threshold
      source: *a1
      source_text: This happens every time the Threat Level is increased to XX
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: threshold
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_threat_change_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_threat_event
            right:
              type: field
              name: last_threat_event
      rule_refs:
        - core.quest_book.threat_threshold_monster
        - core.quest_book.threat_threshold_monster_otherwise
      effects:
        - type: set
          target: last_threat_event
          value:
            type: field
            name: actual_threat_event
      substeps:
        - id: monster
          source: *a1
          source_text:
            Some quests will say that when the Threat Level reaches ‘XX’, a Wandering Monster
            appears. ... the Threat Level is not decreased when the Wandering Monster is placed.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: wandering_monster_triggered
            right:
              type: literal
              value: true
          effects:
            - type: invoke
              dependency: monster
  entry_step: reading
  exit_step: threshold
  unresolved_references:
    - 'Reading permission follows the actual quest occurrence: reaching the Quest Room permits text
      to the second border, completing the quest permits the aftermath.'
    - An aftermath finding is handed off once and is distinct from tile-drawn treasure; its
      collection and any resource accounting are supplied by the caller, not credited here.
    - Each actual Threat change is consumed once in chronological order; falling below XX and
      increasing back to XX triggers again, as the printed example shows.
    - General individual repeatability is handed to acceptance eligibility for a distinct quest
      occurrence (procedure.quest_acceptance).
