- id: procedure.quest_dungeon_lifecycle
  name: Owned resumable dungeon quest progression, abandonment and exit
  section_id: section.into_the_dungeons.generating_the_dungeon
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Abandoning your Quest; Finishing your Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Compose existing accepted occurrence and actual initial departure with actual dungeon
    entry. Abandonment records the actual layout, retaining acceptance, quest provenance, tasks and
    rewards. A distinct actual return visit resumes the same occurrence and requests source
    repopulation/fresh door and encounter checks. Confirmed repopulation is a supplied outcome;
    invocation alone changes no actors. Source task achievement permits exit without retracing;
    permission is not actual exit. Repeat eligibility creates a distinct accepted occurrence through
    existing acceptance and never resets this one. Source-specific progress and rewards stay owned
    by their procedures. This unit is dungeon-only, not a universal personal/wilderness quest
    policy.
  issues:
    - issue.quest.shared_lifecycle_boundaries
  fields:
    phase:
      type: string
      role: input
      description:
        Actual checkpoint and immutable party/occurrence/layout/visit identity supplied by the
        current event.
    actual_instance_id:
      type: string
      role: input
      description:
        Actual checkpoint and immutable party/occurrence/layout/visit identity supplied by the
        current event.
    actual_party_id:
      type: string
      role: input
      description:
        Actual checkpoint and immutable party/occurrence/layout/visit identity supplied by the
        current event.
    actual_layout_id:
      type: string
      role: input
      description:
        Actual checkpoint and immutable party/occurrence/layout/visit identity supplied by the
        current event.
    actual_visit_id:
      type: string
      role: input
      description:
        Actual checkpoint and immutable party/occurrence/layout/visit identity supplied by the
        current event.
    instance_id:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    instance_owner:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    instance_layout_id:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    quest_stage:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    current_visit_id:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    pending_return_visit_id:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    saved_layout_id:
      type: string
      role: state
      description:
        Persisted party/occurrence/layout/visit identity or legal progression state; never
        rewritten by replay.
    quest_owner_matches:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    dungeon_quest_scope:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_dungeon_entry:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_abandonment:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_layout_recorded:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_return_arrival:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_return_departure_confirmed:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_repopulation_complete:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    return_result_matches_pending_visit:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_task_result_supplied:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    task_accomplished:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    actual_dungeon_exit:
      type: boolean
      role: input
      description: Actual owned source checkpoint/outcome; invocation is not completion.
    instance_acceptance_processed:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    instance_departure_processed:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    instance_abandoned:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    instance_completed:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    instance_exit_processed:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    return_pending:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    return_requested:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    layout_requested:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    saved_layout_required:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    repopulate_required:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    fresh_locked_door_checks_required:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    fresh_encounter_checks_required:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    leave_without_retracing_allowed:
      type: boolean
      role: state
      description:
        Owned occurrence/return-visit checkpoint; unrelated hero/task/resource state remains
        separately owned.
    actual_visit_sequence:
      type: number
      role: input
      description: Chronological actual visit identity; a return is distinct from replay and from a
        legitimate new accepted quest.
      integer: true
      minimum: 0
    last_visit_sequence:
      type: number
      role: state
      description: Chronological actual visit identity; a return is distinct from replay and from a
        legitimate new accepted quest.
      integer: true
      minimum: 0
    pending_return_visit_sequence:
      type: number
      role: state
      description: Chronological actual visit identity; a return is distinct from replay and from a
        legitimate new accepted quest.
      integer: true
      minimum: 0
  dependencies:
    - key: acceptance
      label: Immutable party/quest occurrence acceptance
      object_id: procedure.quest_acceptance
    - key: departure
      label: Actual initial departure and settlement day accounting
      object_id: procedure.quest_departure
    - key: return_departure
      label: Actual return-visit departure/travel remains supplied through existing accounting
      object_id: procedure.settlement_activities_and_overnight
    - key: layout
      label: Record this actual dungeon layout; no fabricated geometry
    - key: repopulate
      label: Actual return-visit repopulation outcome and fresh locked-door/encounter checks
  steps:
    - id: first_entry
      source: *a1
      source_text:
        Actual initial departure plus first dungeon entry opens this accepted occurrence, not
        another quest.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: dungeon_quest_scope
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_acceptance_processed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_instance_id
                right:
                  type: field
                  name: instance_id
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_party_id
                right:
                  type: field
                  name: instance_owner
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_layout_id
                right:
                  type: field
                  name: instance_layout_id
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: enter
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: accepted
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_departure_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_dungeon_entry
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_completed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_abandoned
            right:
              type: literal
              value: false
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_visit_sequence
            right:
              type: field
              name: last_visit_sequence
      rule_refs: []
      effects:
        - type: set
          target: quest_stage
          value:
            type: literal
            value: active
        - type: set
          target: current_visit_id
          value:
            type: field
            name: actual_visit_id
        - type: set
          target: last_visit_sequence
          value:
            type: field
            name: actual_visit_sequence
    - id: request_layout
      source: *a1
      source_text: Actual active-visit abandonment requests saving its layout once; no abandonment
        completion without the recorded actual layout.
      when:
        type: all
        conditions:
          - &a3
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_visit_id
                right:
                  type: field
                  name: current_visit_id
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_visit_sequence
                right:
                  type: field
                  name: last_visit_sequence
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: abandon
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: active
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_abandonment
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_layout_recorded
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: layout_requested
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest_lifecycle.abandon_layout
      effects:
        - type: invoke
          dependency: layout
        - type: set
          target: layout_requested
          value:
            type: literal
            value: true
    - id: abandon
      source: *a1
      source_text: Actual saved layout and owned abandonment retains the same occurrence and all
        source-specific progress/reward state.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: abandon
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: active
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_abandonment
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_layout_recorded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_completed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest_lifecycle.abandon_layout
      effects:
        - type: set
          target: saved_layout_id
          value:
            type: field
            name: instance_layout_id
        - type: set
          target: quest_stage
          value:
            type: literal
            value: abandoned
        - type: set
          target: instance_abandoned
          value:
            type: literal
            value: true
    - id: return_begin
      source: *a1
      source_text:
        Actual distinct return arrival and source-compliant departure/travel bind a pending
        visit to this saved layout once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: return
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: abandoned
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_abandoned
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_completed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_layout_id
            right:
              type: field
              name: saved_layout_id
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_return_arrival
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_return_departure_confirmed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: return_pending
            right:
              type: literal
              value: false
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_visit_sequence
            right:
              type: field
              name: last_visit_sequence
          - type: compare
            operator: ne
            left:
              type: field
              name: actual_visit_id
            right:
              type: field
              name: current_visit_id
      rule_refs:
        - core.quest_lifecycle.return_checks
      effects:
        - type: set
          target: pending_return_visit_id
          value:
            type: field
            name: actual_visit_id
        - type: set
          target: pending_return_visit_sequence
          value:
            type: field
            name: actual_visit_sequence
        - type: set
          target: return_pending
          value:
            type: literal
            value: true
        - type: set
          target: return_requested
          value:
            type: literal
            value: false
    - id: request_repopulation
      source: *a1
      source_text:
        Request the actual pending return repopulation once; existing actors/door outcomes are
        not silently reset here.
      when:
        type: all
        conditions:
          - &a4
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: return
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_stage
                right:
                  type: literal
                  value: abandoned
              - type: compare
                operator: eq
                left:
                  type: field
                  name: return_pending
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_visit_id
                right:
                  type: field
                  name: pending_return_visit_id
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_visit_sequence
                right:
                  type: field
                  name: pending_return_visit_sequence
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_layout_id
                right:
                  type: field
                  name: saved_layout_id
          - type: compare
            operator: eq
            left:
              type: field
              name: return_requested
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: repopulate
        - type: set
          target: return_requested
          value:
            type: literal
            value: true
    - id: resume
      source: *a1
      source_text:
        Only supplied completed repopulation for the pending actual return resumes this same
        occurrence; per-door and encounter checks remain fresh visit requirements.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_repopulation_complete
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: return_result_matches_pending_visit
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_return_arrival
            right:
              type: literal
              value: true
      rule_refs: []
      effects:
        - type: set
          target: quest_stage
          value:
            type: literal
            value: active
        - type: set
          target: instance_abandoned
          value:
            type: literal
            value: false
        - type: set
          target: current_visit_id
          value:
            type: field
            name: pending_return_visit_id
        - type: set
          target: last_visit_sequence
          value:
            type: field
            name: pending_return_visit_sequence
        - type: set
          target: return_pending
          value:
            type: literal
            value: false
        - type: set
          target: repopulate_required
          value:
            type: literal
            value: false
        - type: set
          target: layout_requested
          value:
            type: literal
            value: false
    - id: accomplished
      source: *a1
      source_text:
        Actual source-specific task result marks achievement once, without crediting loot or
        settlement payment.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: objective
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: active
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_task_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: task_accomplished
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_completed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest_lifecycle.finish_exit
      effects:
        - type: set
          target: quest_stage
          value:
            type: literal
            value: accomplished
        - type: set
          target: instance_completed
          value:
            type: literal
            value: true
    - id: exit
      source: *a1
      source_text:
        Permission plus actual owned dungeon exit records exit once; travel/return/reward are
        separate.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: exit
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_stage
            right:
              type: literal
              value: accomplished
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_completed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: leave_without_retracing_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_dungeon_exit
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: instance_exit_processed
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: set
          target: quest_stage
          value:
            type: literal
            value: exited
        - type: set
          target: instance_exit_processed
          value:
            type: literal
            value: true
  entry_step: first_entry
  exit_step: exit
