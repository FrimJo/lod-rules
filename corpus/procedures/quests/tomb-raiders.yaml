  status: extracted
  confidence: high
  source_text: "With a deal that they may keep anything they find, the heroes begin prying up the
    entrance to the tomb. ... Quest Location: White 38. Special rules: - Number of tiles: 7
    corridors, 5 rooms, using the tiles R1B-8B. Reward: Any loot found. Encounters: Undead. ... The
    heroes remain were they stood when the door was opened. ... Opening a tomb takes a complete turn
    for 2 heroes working together (the lids are really heavy). Follow the standard Treasure Rules
    for sarcophagi. While at least on hero is in the objective room, a Threat roll above the current
    Threat level result in a Wandering Monster as well as an increase of the Threat level. ...
    Coming back out into the sunlight, the heroes enjoy the fresh air and sound of birds chirping.
    This was not so bad after all. Maybe there are more tombs further to the south?"
  issues:
    - issue.quest.tomb_raiders_threat_boundary
