- id: procedure.tomb_raiders
  name: Tomb Raiders occurrence, actual tomb and Threat-event checkpoints
  section_id: section.quest_book_i.the_great_crypt.quest_3_tomb_raiders
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 262
      printed_page: 260
      heading: Tomb Raiders; Setup; Special Rules; Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Initialize White38, seven corridors/five R1B-8B rooms, Undead and source d6
    Threat/minimum=start/maximum20 once. Actual objective entry preserves hero positions once. Each
    actual tomb owns separate opening state and requires two heroes working together for a complete
    turn; invoke standard sarcophagus treasure, without collecting contents or granting a new cash
    reward. Each actual Threat event snapshots current Threat before comparing the supplied roll; if
    above that snapshot while at least one hero is in the objective room, request a Wandering
    Monster and a Threat increase. Source does not specify increase amount or result20 precedence,
    so neither arithmetic nor ordinary Threat execution is invented. Surface aftermath is narrative
    only.
  issues:
    - issue.quest.tomb_raiders_threat_boundary
  fields:
    location:
      type: string
      role: state
      description: location
    special_rules_printed:
      type: string
      role: state
      description: special rules printed
    corridors:
      type: number
      role: state
      description: corridors
      integer: true
    rooms:
      type: number
      role: state
      description: rooms
      integer: true
    room_tiles:
      type: string
      role: state
      description: room tiles
    reward_printed:
      type: string
      role: state
      description: reward printed
    encounters:
      type: string
      role: state
      description: encounters
    keep_any_loot_found:
      type: boolean
      role: state
      description: keep any loot found
    hero_position:
      type: string
      role: state
      description: hero position
    room_contents:
      type: string
      role: state
      description: room contents
    initial_room_movement:
      type: boolean
      role: state
      description: initial room movement
    heroes_working_together:
      type: number
      role: input
      description: heroes working together
      integer: true
    complete_turn_spent:
      type: boolean
      role: input
      description: complete turn spent
    lid_removed:
      type: boolean
      role: state
      description: lid removed
    standard_sarcophagus_findings_required:
      type: boolean
      role: state
      description: standard sarcophagus findings required
    heroes_in_objective_room:
      type: number
      role: input
      description: heroes in objective room
      integer: true
      minimum: 0
    threat_roll:
      type: number
      role: input
      description: threat roll
      integer: true
      minimum: 1
      maximum: 20
      dice:
        count: 1
        sides: 20
    current_threat_level:
      type: number
      role: state
      description: current threat level
      integer: true
      minimum: 1
      maximum: 20
    wandering_monster_required:
      type: boolean
      role: state
      description: wandering monster required
    threat_increase_required:
      type: boolean
      role: state
      description: threat increase required
    phase:
      type: string
      role: input
      description: setup, objective_room, open_tomb or threat.
    instance_quest_id:
      type: string
      role: state
      description: Immutable actual accepted quest.
    raiders_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    raiders_tomb_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    raiders_threat_event_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    threat_die_supplied:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    objective_room_entered:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    actual_threat_roll_supplied:
      type: boolean
      role: input
      description:
        Actual party/quest/visit/tomb/event ownership or actual source occurrence confirmed.
        Each tomb/event context is separate.
    raiders_setup_processed:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_initial_threat_processed:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_initial_threat_requested:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_room_processed:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_tomb_opened:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_threat_processed:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    raiders_threat_handoff_requested:
      type: boolean
      role: state
      description:
        Once-only checkpoint for actual occurrence/visit/tomb/Threat-event context; replay
        cannot replace it.
    threat_die:
      type: number
      role: input
      description: Actual initial source d6.
      integer: true
      minimum: 1
      maximum: 6
    threat:
      type: number
      role: state
      description: Actual owned Threat or persisted source bound/event snapshot.
      integer: true
      minimum: 1
      maximum: 20
    raiders_minimum_threat:
      type: number
      role: state
      description: Actual owned Threat or persisted source bound/event snapshot.
      integer: true
      minimum: 1
      maximum: 20
    raiders_maximum_threat:
      type: number
      role: state
      description: Actual owned Threat or persisted source bound/event snapshot.
      integer: true
      minimum: 1
      maximum: 20
    raiders_event_threat_before:
      type: number
      role: state
      description: Actual owned Threat or persisted source bound/event snapshot.
      integer: true
      minimum: 1
      maximum: 20
    local_handoff_processed:
      type: boolean
      role: state
      description: Once-only actual Threat event handoff consumed.
  dependencies:
    - key: quest
      label: Canonical quest
      object_id: quest.great_crypt.tomb_raiders
    - key: initial_threat
      label: Actual initial d6
      object_id: table.quest.tomb_raiders.threat
    - key: threat_resolution
      label: Actual Wandering Monster and Threat increase amount/precedence, including unresolved20;
        request is not mutation
    - key: ordinary_threat
      label: Ordinary Threat outcomes when local exception does not apply
      object_id: procedure.threat_roll
  steps:
    - id: setup
      source: *a1
      source_text: Actual source occurrence setup once; no numeric cash reward is added.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: raiders_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.great_crypt.tomb_raiders
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_setup_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.tomb_raiders.setup
      effects:
        - type: set
          target: raiders_setup_processed
          value:
            type: literal
            value: true
    - id: request_initial_threat
      source: *a1
      source_text: Request missing initial actual d6 once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_initial_threat_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_die_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_initial_threat_requested
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: initial_threat
        - type: set
          target: raiders_initial_threat_requested
          value:
            type: literal
            value: true
    - id: initial_threat
      source: *a1
      source_text: Persist initial d6/minimum=start/maximum20 once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_initial_threat_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_die_supplied
            right:
              type: literal
              value: true
      rule_refs: []
      effects:
        - type: set
          target: threat
          value:
            type: field
            name: threat_die
        - type: set
          target: raiders_minimum_threat
          value:
            type: field
            name: threat_die
        - type: set
          target: raiders_maximum_threat
          value:
            type: literal
            value: 20
        - type: set
          target: raiders_initial_threat_processed
          value:
            type: literal
            value: true
    - id: objective_setup
      source: *a1
      source_text: Actual objective entry does not reposition heroes on replay.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: objective_room
          - type: compare
            operator: eq
            left:
              type: field
              name: objective_room_entered
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_setup_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_initial_threat_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_room_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.tomb_raiders.objective_setup
      effects:
        - type: set
          target: raiders_room_processed
          value:
            type: literal
            value: true
    - id: open_tomb
      source: *a1
      source_text: Each actual owned unopened tomb requires exactly two heroes and a complete turn;
        standard findings are a separate handoff.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: open_tomb
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_room_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_tomb_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_tomb_opened
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: heroes_working_together
            right:
              type: literal
              value: 2
          - type: compare
            operator: eq
            left:
              type: field
              name: complete_turn_spent
            right:
              type: literal
              value: true
      rule_refs:
        - core.quest.tomb_raiders.open_tomb
      effects:
        - type: set
          target: raiders_tomb_opened
          value:
            type: literal
            value: true
    - id: snapshot_threat
      source: *a1
      source_text:
        Each actual owned supplied Threat event snapshots pre-result Threat once; incomplete
        input consumes nothing.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: threat
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_setup_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_initial_threat_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_threat_roll_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_processed
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: set
          target: raiders_event_threat_before
          value:
            type: field
            name: threat
        - type: set
          target: current_threat_level
          value:
            type: field
            name: threat
        - type: set
          target: wandering_monster_required
          value:
            type: literal
            value: false
        - type: set
          target: threat_increase_required
          value:
            type: literal
            value: false
        - type: set
          target: raiders_threat_processed
          value:
            type: literal
            value: true
    - id: resolve_threat
      source: *a1
      source_text: Evaluate this event only once, preserving result20 local trigger with undefined
        arithmetic/precedence.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: threat
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_threat_roll_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_handoff_requested
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.tomb_raiders.objective_threat
      effects:
        - type: set
          target: raiders_threat_handoff_requested
          value:
            type: literal
            value: true
    - id: local_handoff
      source: *a1
      source_text: Local triggered Wandering Monster and Threat increase remain explicit supplied outcomes.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: threat
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_handoff_requested
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: wandering_monster_required
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: local_handoff_processed
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: threat_resolution
        - type: set
          target: local_handoff_processed
          value:
            type: literal
            value: true
    - id: ordinary_handoff
      source: *a1
      source_text:
        When no objective-room exception applies request ordinary Threat once; do not infer its
        outcome.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: threat
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_event_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: raiders_threat_handoff_requested
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: wandering_monster_required
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: local_handoff_processed
            right:
              type: literal
              value: false
      rule_refs: []
      effects:
        - type: invoke
          dependency: ordinary_threat
        - type: set
          target: local_handoff_processed
          value:
            type: literal
            value: true
  entry_step: setup
  exit_step: ordinary_handoff
