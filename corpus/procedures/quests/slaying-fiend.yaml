- id: procedure.slaying_fiend
  name: Slaying the Fiend occurrence preparation and defeat-gated aftermath
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_2_slaying_the_fiend
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 256
      printed_page: 254
      heading: Slaying the Fiend; Objective Room; Setup; Aftermath
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Preserve Random location, eight corridors/eight rooms, Beast
    encounters, printed Special Rules dash and Reward None. At actual objective
    entry, persist one d6 prior-wound branch and subtract its actual result from
    initial 45 HP before the fight. Resolve hero d3 distance from the short-side
    door and Molgor d6 distance from the idol toward heroes once. Both
    preparations precede battle readiness. Actual fiend-down outcome unlocks a
    gold pile and two unlocked/untrapped objective chests; request their
    Treasure Table outcomes once without inventing gold amount or collecting
    contents. Current battle HP, external abilities, chest content/collection
    and generic quest completion/abandonment remain separately owned. Source
    initial Threat d4+2, same-as-start minimum and maximum20 are initialized
    once from an actual result; battle readiness also requires that source
    setup.
  issues:
    - issue.quest.molgor_gold_quantity
    - issue.quest.fiend_lifecycle_scope
  fields:
    phase:
      type: string
      role: input
      description: setup, objective_room or aftermath for this actual occurrence; no
        generic completion/payment/abandonment transition is invented.
    instance_quest_id:
      type: string
      role: state
      description: Actual immutable accepted catalogue quest ID; another quest cannot
        execute this scenario lifecycle.
    fiend_owner_matches:
      type: boolean
      role: input
      description: Actual party/Slaying the Fiend occurrence/Molgor/objective-room
        ownership is confirmed.
    fiend_setup_processed:
      type: boolean
      role: state
      description: Once-per-actual-quest setup consumed; no replay reseeds layout/reward.
    objective_room_entered:
      type: boolean
      role: input
      description: Actual occurrence objective room entered; not a placement or combat
        request.
    fiend_wound_selection_supplied:
      type: boolean
      role: input
      description: Actual initial d6 wound-table selection supplied.
    fiend_wound_selection_processed:
      type: boolean
      role: state
      description: Actual d6 selection persisted once before secondary dice resolution.
    fiend_prior_wounds_supplied:
      type: boolean
      role: input
      description: Actual result of the selected wound dice supplied; not another
        branch or a reroll. The printed fixed 1 on branch 6 can be derived
        without an extra roll.
    fiend_wounds_processed:
      type: boolean
      role: state
      description: Molgor initial 45 HP minus selected prior wounds initialized once;
        never heals him on objective replay.
    fiend_wound_request_processed:
      type: boolean
      role: state
      description: Once-only actual wound input request for this occurrence.
    fiend_placement_supplied:
      type: boolean
      role: input
      description: Actual hero d3 and Molgor d6 placement results supplied.
    fiend_placement_processed:
      type: boolean
      role: state
      description: Actual objective entry placement consumed once; replay does not
        teleport combatants.
    fiend_placement_request_processed:
      type: boolean
      role: state
      description: Once-only actual placement input request.
    molgor_defeated:
      type: boolean
      role: input
      description: Actual source fiend-down result supplied from battle, not merely HP
        initialization or an attack request.
    fiend_aftermath_processed:
      type: boolean
      role: state
      description: Actual defeat-gated aftermath unlocked once for this occurrence.
    fiend_treasure_request_processed:
      type: boolean
      role: state
      description: Once-only two-objective-chest treasure handoff; request is not
        contents/collection.
    fiend_battle_ready:
      type: boolean
      role: state
      description: Initial wounds and actual placements complete; not a resolved
        battle or victory.
    wound_table_roll:
      type: number
      role: state
      description: Owned working value restored from the persisted initial choice for
        the existing source rule branch.
      integer: true
      minimum: 1
      maximum: 6
    fiend_selected_wound_roll:
      type: number
      role: state
      description: Persisted initial actual d6 selection, not a replay-substituted branch.
      integer: true
      minimum: 1
      maximum: 6
    prior_wounds:
      type: number
      role: state
      description: Owned resolved prior-wound amount for existing source rule
        execution; does not modify supplied input.
      integer: true
      minimum: 1
      maximum: 12
    molgor_starting_hp:
      type: number
      role: state
      description: Once initialized source 45 minus prior wounds; current battle HP is
        separately owned.
      integer: true
    hero_placement_roll:
      type: number
      role: input
      description: Actual supplied source placement die result.
      integer: true
      minimum: 1
      maximum: 3
    molgor_placement_roll:
      type: number
      role: input
      description: Actual supplied source placement die result.
      integer: true
      minimum: 1
      maximum: 6
    location:
      type: string
      role: output
      description: location
    special_rules_printed:
      type: string
      role: output
      description: special rules printed
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    reward_printed:
      type: string
      role: output
      description: reward printed
    encounters:
      type: string
      role: output
      description: encounters
    species:
      type: string
      role: output
      description: species
    weapon:
      type: string
      role: output
      description: weapon
    armour:
      type: number
      role: output
      description: armour
      integer: true
    frenzy:
      type: boolean
      role: output
      description: frenzy
    ferocious_charge:
      type: boolean
      role: output
      description: ferocious charge
    hero_distance_from_door:
      type: number
      role: output
      description: hero distance from door
      integer: true
    molgor_distance_from_idol:
      type: number
      role: output
      description: molgor distance from idol
      integer: true
    hero_entry:
      type: string
      role: output
      description: hero entry
    molgor_direction:
      type: string
      role: output
      description: molgor direction
    idol_position:
      type: string
      role: output
      description: idol position
    gold_pile_found:
      type: boolean
      role: output
      description: gold pile found
    objective_chests:
      type: number
      role: output
      description: objective chests
      integer: true
    chests_locked:
      type: boolean
      role: output
      description: chests locked
    chests_trapped:
      type: boolean
      role: output
      description: chests trapped
    treasure_tables_required:
      type: boolean
      role: output
      description: treasure tables required
    fiend_threat_initialized:
      type: boolean
      role: state
      description: Actual occurrence initial Threat fiend_threat_initialized marker;
        persist so objective replay/another setup request cannot reseed Threat.
    fiend_threat_request_processed:
      type: boolean
      role: state
      description: Actual occurrence initial Threat fiend_threat_request_processed
        marker; persist so objective replay/another setup request cannot reseed
        Threat.
    fiend_threat_roll_supplied:
      type: boolean
      role: input
      description: Actual initial 1d4 result supplied; never infer it from a later
        current Threat.
    fiend_threat_roll:
      type: number
      role: input
      description: Actual source initial d4 result before +2.
      integer: true
      minimum: 1
      maximum: 4
    threat:
      type: number
      role: state
      description: Actual owned quest threat; initial/minimum equal d4+2 and printed
        maximum 20, current Threat separately changes thereafter.
      integer: true
    fiend_start_threat:
      type: number
      role: state
      description: Actual owned quest fiend_start_threat; initial/minimum equal d4+2
        and printed maximum 20, current Threat separately changes thereafter.
      integer: true
    fiend_minimum_threat:
      type: number
      role: state
      description: Actual owned quest fiend_minimum_threat; initial/minimum equal d4+2
        and printed maximum 20, current Threat separately changes thereafter.
      integer: true
    fiend_maximum_threat:
      type: number
      role: state
      description: Actual owned quest fiend_maximum_threat; initial/minimum equal d4+2
        and printed maximum 20, current Threat separately changes thereafter.
      integer: true
    fiend_wound_table_roll:
      type: number
      role: input
      description: Actual supplied initial d6 selection; persist once rather than
        overwrite on replay.
      integer: true
      minimum: 1
      maximum: 6
    fiend_actual_prior_wounds:
      type: number
      role: input
      description: Actual supplied selected secondary-dice result; fixed row6 may
        derive 1 without this input.
      integer: true
      minimum: 1
      maximum: 12
    fiend_wound_result_resolved:
      type: boolean
      role: state
      description: Actual amount is resolved from supplied result or printed fixed1;
        not a new supplied roll flag.
  dependencies:
    - key: quest
      label: Canonical Slaying the Fiend catalogue
      object_id: quest.chamber_of_reverence.slaying_fiend
    - key: actor
      label: Printed Molgor statistics/equipment and named abilities
      object_id: quest_actor.chamber_of_reverence.molgor
    - key: wounds
      label: Actual selected printed prior-wound dice result
      object_id: table.quest.slaying_fiend.prior_wounds
    - key: placement
      label: Actual hero d3 and Molgor d6 placement results
      object_id: core.quest.slaying_fiend.placement
    - key: treasure
      label: Actual two unlocked/untrapped objective-chest Treasure Table outcomes;
        not collected contents
    - key: threat_table
      label: Printed initial d4+2 Threat, same-as-start minimum and maximum20
      object_id: table.quest.slaying_fiend.threat
  steps:
    - id: request_threat
      source: *a1
      source_text: Request actual initial d4 once; source start/minimum cannot be
        inferred from current Threat.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: fiend_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.chamber_of_reverence.slaying_fiend
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: setup
              - type: compare
                operator: eq
                left:
                  type: field
                  name: fiend_threat_initialized
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_threat_roll_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_threat_request_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: fiend_threat_request_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: threat_table
    - id: initial_threat
      source: *a1
      source_text: Initialize source Threat once as actual d4+2, minimum equal to that
        start and maximum 20. Replay cannot lower/replace current Threat.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_threat_roll_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: threat
          value:
            type: sum
            values:
              - type: field
                name: fiend_threat_roll
              - type: literal
                value: 2
        - type: set
          target: fiend_start_threat
          value:
            type: sum
            values:
              - type: field
                name: fiend_threat_roll
              - type: literal
                value: 2
        - type: set
          target: fiend_minimum_threat
          value:
            type: sum
            values:
              - type: field
                name: fiend_threat_roll
              - type: literal
                value: 2
        - type: set
          target: fiend_maximum_threat
          value:
            type: literal
            value: 20
        - type: set
          target: fiend_threat_initialized
          value:
            type: literal
            value: true
    - id: setup
      source: *a1
      source_text: Initialize the printed quest layout/equipment distinctions once;
        unavailable ability mechanics and random site remain separate.
      when:
        type: all
        conditions:
          - &a3
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: fiend_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.chamber_of_reverence.slaying_fiend
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_setup_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: fiend_setup_processed
          value:
            type: literal
            value: true
      rule_refs:
        - core.quest.slaying_fiend.setup
        - core.quest.slaying_fiend.molgor
    - id: snapshot_selection
      source: *a1
      source_text: Persist the actual initial d6 choice before delayed secondary dice
        resolution.
      when:
        type: all
        conditions:
          - &a4
            type: all
            conditions:
              - *a3
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: objective_room
              - type: compare
                operator: eq
                left:
                  type: field
                  name: objective_room_entered
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: fiend_selected_wound_roll
          value:
            type: field
            name: fiend_wound_table_roll
        - type: set
          target: fiend_wound_selection_processed
          value:
            type: literal
            value: true
    - id: request_wounds
      source: *a1
      source_text: Request actual wound selection/result once; do not substitute
        another branch or invent wounds.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: fiend_wound_selection_processed
                right:
                  type: literal
                  value: false
              - type: all
                conditions:
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: fiend_selected_wound_roll
                    right:
                      type: literal
                      value: 6
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: fiend_prior_wounds_supplied
                    right:
                      type: literal
                      value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_request_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: fiend_wound_request_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: wounds
    - id: restore_selection
      source: *a1
      source_text: Use the persisted choice, not a changed replay selection, for the
        once-only HP initialization.
      when:
        type: all
        conditions:
          - *a4
          - &a5
            type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: true
          - &a6
            type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: wound_table_roll
          value:
            type: field
            name: fiend_selected_wound_roll
    - id: resolve_actual_wounds
      source: *a1
      source_text: Copy the actual supplied selected wound result into owned working
        state. Never overwrite the supplied result itself; invalid
        selected-branch context remains uninitialized.
      when:
        type: all
        conditions:
          - *a4
          - *a5
          - *a6
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_prior_wounds_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: prior_wounds
          value:
            type: field
            name: fiend_actual_prior_wounds
        - type: set
          target: fiend_wound_result_resolved
          value:
            type: literal
            value: true
    - id: fixed_wound
      source: *a1
      source_text: Printed selection 6 is fixed 1, not another die roll. Resolve that
        known result when no amount is supplied; a conflicting supplied amount
        remains subject to the invalid-branch disposition.
      when:
        type: all
        conditions:
          - *a4
          - *a5
          - *a6
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_selected_wound_roll
            right:
              type: literal
              value: 6
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_prior_wounds_supplied
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: prior_wounds
          value:
            type: literal
            value: 1
        - type: set
          target: fiend_wound_result_resolved
          value:
            type: literal
            value: true
    - id: wounds_1
      source: *a1
      source_text: Apply only the actual selected wound branch within its printed dice
        bounds once, before battle.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_result_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_selected_wound_roll
            right:
              type: literal
              value: 1
          - type: compare
            operator: gte
            left:
              type: field
              name: prior_wounds
            right:
              type: literal
              value: 2
          - type: compare
            operator: lte
            left:
              type: field
              name: prior_wounds
            right:
              type: literal
              value: 12
      effects:
        - type: set
          target: fiend_wounds_processed
          value:
            type: literal
            value: true
      rule_refs:
        - core.quest.slaying_fiend.prior_wounds_1
    - id: wounds_2
      source: *a1
      source_text: Apply only the actual selected wound branch within its printed dice
        bounds once, before battle.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_result_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_selected_wound_roll
            right:
              type: literal
              value: 2
          - type: compare
            operator: gte
            left:
              type: field
              name: prior_wounds
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
            left:
              type: field
              name: prior_wounds
            right:
              type: literal
              value: 10
      effects:
        - type: set
          target: fiend_wounds_processed
          value:
            type: literal
            value: true
      rule_refs:
        - core.quest.slaying_fiend.prior_wounds_2
    - id: wounds_3
      source: *a1
      source_text: Apply only the actual selected wound branch within its printed dice
        bounds once, before battle.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
