            right:
              type: literal
              value: 2
          - type: compare
            operator: lte
            left:
              type: field
              name: prior_wounds
            right:
              type: literal
              value: 7
      effects:
        - type: set
          target: fiend_wounds_processed
          value:
            type: literal
            value: true
      rule_refs:
        - core.quest.slaying_fiend.prior_wounds_3
    - id: wounds_4
      source: *a1
      source_text: Apply only the actual selected wound branch within its printed dice
