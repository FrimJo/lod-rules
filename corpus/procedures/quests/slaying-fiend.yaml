      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_selection_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wounds_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fiend_wound_result_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
