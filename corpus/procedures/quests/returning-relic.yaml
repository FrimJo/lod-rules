          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: relic_threat_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: initial_threat
    - id: initial_threat
      source: *a1
      source_text: Start Threat Level | Min Threat Level | Max Threat Level ... 1d4+1 | Same as start lvl | 20
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_start_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_minimum_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_maximum_threat
          value:
            type: literal
            value: 20
        - type: set
          target: relic_threat_initialized
          value:
            type: literal
            value: true
    - id: scenario_event
      source: *a1
      source_text: The Scenario die is triggered on a result of 8-10.
      when:
        type: all
        conditions:
