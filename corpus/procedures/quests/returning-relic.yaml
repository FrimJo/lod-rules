          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: scenario
          - type: compare
            operator: eq
            left:
              type: field
              name: scenario_event_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_scenario_event
            right:
              type: field
              name: last_scenario_event
      effects:
        - type: set
          target: last_scenario_event
