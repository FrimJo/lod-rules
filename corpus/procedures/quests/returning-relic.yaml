- id: procedure.returning_relic
  name: Returning the Relic source-local quest lifecycle
  section_id: section.quest_book_i.the_chamber_of_reverence.quest_1_returning_the_relic
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 255
      printed_page: 253
      heading: Returning the Relic — setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Initialize Random location,8+8 tiles and actual d4+1 Threat once
    (minimum=start, maximum20). Preserve quest-owned Luck nullification until
    actual stone return without changing numeric Luck Points. Source Scenario
    trigger8–10 requests Threat resolution for each distinct actual die event.
    Actual objective entry records geometry and requests two independent
    Encounter Table outcomes/random placement. An actual owned once-per-turn
    refit after all enemies are dead and in front of the statue requires a DEX
    test. Persist pending attempt and actual result ownership. Success returns
    stone and ends only this nullification; failure records+1 Threat and applies
    it once below20, with maximum-boundary accounting unresolved. Home arrival
    after return pays each actual owned hero300c once. No generic completion,
    abandoned-quest effect, new Luck amount, XP, objective chest or automatic
    journey is invented.
  issues:
    - issue.quest.relic_lifecycle_scope
  fields:
    phase:
      type: string
      role: input
      description: setup, scenario, objective_room, refit or reward.
    instance_quest_id:
      type: string
      role: state
      description: Actual immutable accepted Returning the Relic catalogue ID.
    relic_owner_matches:
      type: boolean
      role: input
      description: Actual party/quest occurrence and current event ownership confirmed.
    location:
      type: string
      role: output
      description: location
    corridors:
      type: number
      role: output
      description: corridors
      integer: true
    rooms:
      type: number
      role: output
      description: rooms
      integer: true
    reward_per_hero:
      type: number
      role: output
      description: reward per hero
      integer: true
      minimum: 0
    stone_returned:
      type: boolean
      role: state
      description: The stone is in place.
    all_heroes_luck_points_nullified:
      type: boolean
      role: state
      description: all heroes luck points nullified
    scenario_roll:
      type: number
      role: input
      description: Scenario die result.
      integer: true
      minimum: 1
      maximum: 10
    scenario_die_triggered:
      type: boolean
      role: output
      description: The quest Scenario trigger.
    hero_entry:
      type: string
      role: output
      description: hero entry
    statue_position:
      type: string
      role: output
      description: statue position
    encounter_rolls:
      type: number
      role: output
      description: encounter rolls
      integer: true
    enemy_placement:
      type: string
      role: output
      description: enemy placement
    all_enemies_dead:
      type: boolean
      role: input
      description: All enemies are dead.
    hero_in_front_of_statue:
      type: boolean
      role: input
      description: This hero stands in front of the statue.
    refit_attempts_this_turn:
      type: number
      role: state
      description: Refit attempts already made this turn.
      integer: true
      minimum: 0
    refit_attempt_allowed:
      type: boolean
      role: output
      description: refit attempt allowed
    dex_test_required:
      type: boolean
      role: output
      description: dex test required
    valid_refit_attempt:
      type: boolean
      role: state
      description: The source refit prerequisites are satisfied.
    dex_test_succeeded:
      type: boolean
      role: input
      description: The DEX test succeeded.
    threat_increase:
      type: number
      role: output
      description: threat increase
      integer: true
      minimum: 0
    heroes_home:
      type: boolean
      role: input
      description: The heroes have arrived home.
    relic_setup_processed:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_threat_initialized:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_threat_requested:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_objective_processed:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_encounters_requested:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_refit_pending:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_dex_requested:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_failure_threat_pending:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_failure_threat_requested:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    relic_reward_processed:
      type: boolean
      role: state
      description: Persist owned quest/event marker across replay; reward marker
        belongs separately to each actual hero.
    threat_roll_supplied:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    objective_room_entered:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    scenario_event_supplied:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    refit_event_supplied:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    refit_scope_resolved:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    refit_result_supplied:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    refit_result_matches_attempt:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    relic_reward_owner_matches:
      type: boolean
      role: input
      description: Actual supplied event/context/owner confirmation, not a request or
        inferred outcome.
    threat_die:
      type: number
      role: input
      description: Actual initial d4 result.
      integer: true
      minimum: 1
      maximum: 4
    threat:
      type: number
      role: state
      description: Owned quest Threat; current changes separately after once-only
        initialization.
      integer: true
    relic_start_threat:
      type: number
      role: state
      description: Owned quest Threat; current changes separately after once-only
        initialization.
      integer: true
    relic_minimum_threat:
      type: number
      role: state
      description: Owned quest Threat; current changes separately after once-only
        initialization.
      integer: true
    relic_maximum_threat:
      type: number
      role: state
      description: Owned quest Threat; current changes separately after once-only
        initialization.
      integer: true
    actual_scenario_event:
      type: number
      role: input
      description: Actual chronological event/turn identity for its supplied ownership
        unit; persist consumed index, initially0.
      integer: true
      minimum: 1
    last_scenario_event:
      type: number
      role: state
      description: Actual chronological event/turn identity for its supplied ownership
        unit; persist consumed index, initially0.
      integer: true
      minimum: 0
    actual_refit_turn:
      type: number
      role: input
      description: Actual chronological event/turn identity for its supplied ownership
        unit; persist consumed index, initially0.
      integer: true
      minimum: 1
    last_refit_turn:
      type: number
      role: state
      description: Actual chronological event/turn identity for its supplied ownership
        unit; persist consumed index, initially0.
      integer: true
      minimum: 0
    pending_refit_turn:
      type: number
      role: state
      description: Actual chronological event/turn identity for its supplied ownership
        unit; persist consumed index, initially0.
      integer: true
      minimum: 0
    coins:
      type: number
      role: state
      description: Actual owned hero copper, credited300 once home.
      integer: true
      minimum: 0
    relic_scenario_pending:
      type: boolean
      role: state
      description: Actual accepted Scenario event awaiting source trigger classification.
  dependencies:
    - key: quest
      label: Canonical Returning the Relic
      object_id: quest.chamber_of_reverence.returning_relic
    - key: initial_threat
      label: Actual initial d4+1 Threat
      object_id: table.quest.returning_relic.threat
    - key: threat_roll
      label: Actual source Scenario-triggered Threat roll
      object_id: procedure.threat_roll
    - key: encounters
      label: Two actual independently owned Encounter Table outcomes and random
        placement
      object_id: table.quest.returning_relic.encounters
    - key: dex
      label: Actual DEX test for the persisted refit attempt; request is not a
        completed test
    - key: maximum_threat
      label: Actual accounting of failed refit at printed maximum20, unresolved source
        interaction
  steps:
    - id: nullification
      source: *a1
      source_text: Maintain only this quest-owned nullification; numeric Luck and
        other curses are independently owned.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: relic_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.chamber_of_reverence.returning_relic
          - type: compare
            operator: eq
            left:
              type: field
              name: stone_returned
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.returning_relic.luck_nullification
      effects: []
    - id: setup
      source: *a1
      source_text: Return a polished black stone to its statue in a forgotten temple.
        Random location, eight corridors, eight rooms, 300c per hero.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_setup_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.returning_relic.setup
      effects:
        - type: set
          target: relic_setup_processed
          value:
            type: literal
            value: true
    - id: request_threat
      source: *a1
      source_text: Request actual initial d4 once.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: relic_threat_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: initial_threat
    - id: initial_threat
      source: *a1
      source_text: Printed start1d4+1, minimum same as start and maximum20; never
        reseed later Threat.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: setup
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_threat_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: threat_roll_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_start_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_minimum_threat
          value:
            type: sum
            values:
              - type: field
                name: threat_die
              - type: literal
                value: 1
        - type: set
          target: relic_maximum_threat
          value:
            type: literal
            value: 20
        - type: set
          target: relic_threat_initialized
          value:
            type: literal
            value: true
    - id: scenario_event
      source: *a1
      source_text: Consume an actual distinct Scenario roll with the quest8–10
        threshold; reset only this event report.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: scenario
          - type: compare
            operator: eq
            left:
              type: field
              name: scenario_event_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: actual_scenario_event
            right:
              type: field
              name: last_scenario_event
      effects:
        - type: set
          target: last_scenario_event
          value:
            type: field
            name: actual_scenario_event
        - type: set
          target: scenario_die_triggered
          value:
            type: literal
            value: false
        - type: set
          target: relic_scenario_pending
          value:
            type: literal
            value: true
    - id: scenario_trigger
      source: *a1
      source_text: The Scenario die is triggered on a result of 8–10.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: scenario
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_scenario_pending
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 8
          - type: compare
            operator: lte
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 10
      rule_refs:
        - core.quest.returning_relic.scenario_trigger
      effects:
        - type: set
          target: relic_scenario_pending
          value:
            type: literal
            value: false
        - type: invoke
          dependency: threat_roll
    - id: ordinary_scenario
      source: *a1
      source_text: A non-triggering actual die event does not retain a prior triggered
        report.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: scenario
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_scenario_pending
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: scenario_roll
            right:
              type: literal
              value: 8
      effects:
        - type: set
          target: relic_scenario_pending
          value:
            type: literal
            value: false
    - id: objective
      source: *a1
      source_text: Heroes enter on the short side. The statue stands at the far end,
        with enemies between it and the heroes. Roll twice on the Encounter
        Table and place enemies randomly.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: objective_room
          - type: compare
            operator: eq
            left:
              type: field
              name: objective_room_entered
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_objective_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.returning_relic.objective_setup
      effects:
        - type: set
          target: relic_objective_processed
          value:
            type: literal
            value: true
    - id: encounter_handoff
      source: *a1
      source_text: Request the actual two source encounters and random placement once;
        no actor/statistic/coordinate invented.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: objective_room
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_objective_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_encounters_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: relic_encounters_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: encounters
    - id: unresolved_attempt_scope
      source: *a1
      source_text: The source does not say whether once per turn belongs to party or
        hero; unresolved context cannot authorize an attempt.
      when:
        type: all
        conditions:
          - &a3
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: refit
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stone_returned
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: relic_refit_pending
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: relic_failure_threat_pending
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: refit_event_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: all_enemies_dead
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: hero_in_front_of_statue
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gt
                left:
                  type: field
                  name: actual_refit_turn
                right:
                  type: field
                  name: last_refit_turn
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_scope_resolved
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.quest.relic_lifecycle_scope
    - id: new_turn
      source: *a1
      source_text: A distinct actual owned turn makes this source opportunity
        available; never reset merely on phase change.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_scope_resolved
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: refit_attempts_this_turn
          value:
            type: literal
            value: 0
    - id: refit_attempt
      source: *a1
      source_text: Once all enemies are dead, a hero standing in front of the statue
        can try to refit the stone once per turn by making a DEX test.
      when:
        type: all
        conditions:
          - *a3
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_scope_resolved
            right:
              type: literal
              value: true
      rule_refs:
        - core.quest.returning_relic.refit_attempt
      effects:
        - type: set
          target: last_refit_turn
          value:
            type: field
            name: actual_refit_turn
        - type: set
          target: pending_refit_turn
          value:
            type: field
            name: actual_refit_turn
        - type: set
          target: refit_attempts_this_turn
          value:
            type: literal
            value: 1
        - type: set
          target: valid_refit_attempt
          value:
            type: literal
            value: true
        - type: set
          target: relic_refit_pending
          value:
            type: literal
            value: true
        - type: set
          target: relic_dex_requested
          value:
            type: literal
            value: false
    - id: request_dex
      source: *a1
      source_text: Request the actual pending DEX result once; a request cannot refit
        the stone or raise Threat.
      when:
        type: all
        conditions:
          - &a4
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: refit
              - type: compare
                operator: eq
                left:
                  type: field
                  name: relic_refit_pending
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: valid_refit_attempt
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actual_refit_turn
                right:
                  type: field
                  name: pending_refit_turn
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_result_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_dex_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: relic_dex_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: dex
    - id: refit_success
      source: *a1
      source_text: A successful DEX test puts the stone in place.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_result_matches_attempt
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dex_test_succeeded
            right:
              type: literal
              value: true
      rule_refs:
        - core.quest.returning_relic.refit_success
      effects:
        - type: set
          target: relic_refit_pending
          value:
            type: literal
            value: false
        - type: set
          target: valid_refit_attempt
          value:
            type: literal
            value: false
    - id: refit_failure
      source: *a1
      source_text: A failed attempt increases Threat by 1.
      when:
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: refit_result_matches_attempt
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dex_test_succeeded
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.returning_relic.refit_failure
      effects:
        - type: set
          target: relic_refit_pending
          value:
            type: literal
            value: false
        - type: set
          target: valid_refit_attempt
          value:
            type: literal
            value: false
        - type: set
          target: relic_failure_threat_pending
          value:
            type: literal
            value: true
        - type: set
          target: relic_failure_threat_requested
          value:
            type: literal
            value: false
    - id: failure_threat
      source: *a1
      source_text: Apply printed+1 once within uncontested below-maximum scope;
        request at maximum is separately unresolved.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: refit
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_failure_threat_pending
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: threat
            right:
              type: literal
              value: 20
      effects:
        - type: set
          target: threat
          value:
            type: sum
            values:
              - type: field
                name: threat
              - type: field
                name: threat_increase
        - type: set
          target: relic_failure_threat_pending
          value:
            type: literal
            value: false
    - id: maximum_threat
      source: *a1
      source_text: At printed maximum20, preserve raw+1 and request actual boundary
        accounting once; do not guess a cap or exceed maximum.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: refit
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_failure_threat_pending
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: threat
            right:
              type: literal
              value: 20
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_failure_threat_requested
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: relic_failure_threat_requested
          value:
            type: literal
            value: true
        - type: invoke
          dependency: maximum_threat
    - id: curse_ends
      source: *a1
      source_text: Actual stone return ends only this owned nullification; numeric
        Luck Points are preserved.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: stone_returned
            right:
              type: literal
              value: true
      rule_refs:
        - core.quest.returning_relic.curse_ends
      effects: []
    - id: reward
      source: *a1
      source_text: Once the stone is in place the heroes head home. Once home, the
        nobleman pays 300c per hero.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: reward
          - type: compare
            operator: eq
            left:
              type: field
              name: stone_returned
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: heroes_home
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_reward_owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: relic_reward_processed
            right:
              type: literal
              value: false
      rule_refs:
        - core.quest.returning_relic.reward
      effects:
        - type: set
          target: coins
          value:
            type: sum
            values:
              - type: field
                name: coins
              - type: field
                name: reward_per_hero
        - type: set
          target: relic_reward_processed
          value:
            type: literal
            value: true
  entry_step: nullification
  exit_step: reward
