  status: extracted
  confidence: high
  source_text: 'Quest Location: Random. ... Number of Tiles: 8 corridors, 8 rooms. Reward: 300 c per
    hero. ... Special Rules: Due to the curse of the stone, all their Luck Points are nullified
    until they have returned the stone. The Scenario die is triggered on a result of 8-10. ... Start
    Threat Level | Min Threat Level | Max Threat Level ... 1d4+1 | Same as start lvl | 20 ... The
    heroes enter the room along its short side, and at the far end of the chamber is the great
    statue with an obvious place for the stone. The only problem is the horde of enemies between
    them and the statue. ... Roll twice on the Encounter Table and randomise the placement of
    enemies. ... Once all enemies are dead, the heroes may try to refit the stone once per turn by
    standing in front of the statue and taking a DEX Test. A success means the stone is back in its
    place; a failure means the Threat Level goes up 1 level. ... Once home, the nobleman pays the
    heroes their reward'
