  steps:
    - id: nullification
      source: *a1
      source_text:
        'Special Rules: Due to the curse of the stone, all their Luck Points are nullified
        until they have returned the stone.'
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: relic_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_quest_id
                right:
                  type: literal
                  value: quest.chamber_of_reverence.returning_relic
          - type: compare
            operator: eq
            left:
              type: field
              name: stone_returned
            right:
              type: literal
              value: false
      rule_refs:
