              type: field
              name: quest_in_progress
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q1
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q2
              - type: compare
                operator: eq
                left:
                  type: field
