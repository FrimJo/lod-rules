- id: procedure.dead_rising_campaign
  name: The Dead Rising campaign progression
  section_id: section.quest_book_i.the_dead_rising
  source:
    - &a1
      document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 224
      printed_page: 222
      heading: The Dead Rising
