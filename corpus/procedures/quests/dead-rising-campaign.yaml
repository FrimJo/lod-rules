                  name: stage
                right:
                  type: literal
                  value: q4
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q5
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q6a
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q6b
      effects:
        - type: require
          condition:
            type: any
            conditions:
              - type: compare
                operator: ne
                left:
                  type: field
                  name: stage
                right:
                  type: literal
                  value: q2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: current_settlement
                right:
                  type: literal
                  value: silver_city
        - type: set
          target: quest_in_progress
          value:
            type: literal
            value: true
    - id: accept_completion
      source:
        - *a1
        - *a3
      source_text:
        If at any time, there are no living enemies on the table, the heroes win. If at any
        time the heroes feel like running away, they can do so by simply leaving the map, in which
        case the quest is over. ... Continue your travel to the city. ... Continue your travel to
        Silver city.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: complete
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_in_progress
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: completed_quest_id
            right:
              type: field
              name: next_quest_id
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_outcome
                right:
                  type: literal
                  value: completed
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: quest_outcome
                    right:
                      type: literal
                      value: fled
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: stage
                    right:
                      type: literal
                      value: q4
      effects:
        - type: set
          target: completion_accepted
          value:
            type: literal
            value: true
    - id: unhandled_outcome
      source:
        - *a1
      source_text:
        This campaign starts wherever the heroes are, but the second quest must be started in
