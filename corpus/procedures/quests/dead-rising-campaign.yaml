              name: phase
            right:
              type: literal
              value: complete
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_in_progress
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: completed_quest_id
            right:
              type: field
              name: next_quest_id
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_outcome
                right:
                  type: literal
                  value: failed
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_outcome
                right:
                  type: literal
                  value: abandoned
      effects:
        - type: unresolved
          issue_id: issue.quest.campaign_progression_boundaries
