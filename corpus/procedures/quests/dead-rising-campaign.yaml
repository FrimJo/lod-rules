  status: extracted
  confidence: high
  source_text:
    'This campaign starts wherever the heroes are, but the second quest must be started in
    Silver City. ... Head to Silver City to continue the campaign. ... Quest Location: Silver City.
    ... Quest Location: White 34. ... The party travels to Rochdale without event using the rations
    found at the bandit’s hideout. ... Continue your travel to the city. ... Continue your travel to
    Silver city. ... Either way, there is no time to head back to the Silver City. They must press
    on. If they choose to go for the Apostle, play quest 6A. If they choose to go for the Master,
    Play 6B. ... Travel to white 39. ... Travel to Silver City. ... During the dinner, the Jarl
    presents each of them with a small box containing 1000 c.'
  issues:
    - issue.quest.campaign_progression_boundaries
  fields:
    campaign_id:
      type: string
      role: input
      description: Actual The Dead Rising campaign instance of this call.
    campaign_owner_id:
      type: string
      role: state
      description: Campaign instance this progression belongs to. Empty for a fresh campaign; never rebound.
    owner_matches:
      type: boolean
      role: output
      description: This call's campaign instance matches the saved one. Reset on every call.
    phase:
      type: string
      role: input
      description:
        start, start_quest, complete, choose or return (Dead Rising) / start, accept, complete
        or return (Spider Queen).
    stage:
      type: string
      role: state
      description: Campaign position. Empty before the campaign starts.
    next_quest_id:
      type: string
      role: state
      description: Quest the campaign requires next.
    quest_in_progress:
      type: boolean
      role: state
      description: The required next quest has been started and not yet completed.
    completed_quest_id:
      type: string
      role: input
      description: Actual quest whose outcome this call reports.
    quest_outcome:
      type: string
      role: input
      description:
        'Actual outcome of that quest: completed, fled (where the quest allows it), failed or
        abandoned.'
    completion_accepted:
      type: boolean
      role: output
      description:
        This call reports a completion that advances the campaign. Cleared by the transition it
        triggers.
    current_settlement:
      type: string
      role: input
      description:
        Actual settlement where the party is for this call (starting a quest or arriving for
        the aftermath); silver_city for Silver City.
    next_destination:
      type: string
      role: state
      description: Where the campaign text sends the party after the last completed quest.
    settlement_return_allowed:
      type: boolean
      role: state
      description: 'False between The Apprentice and the end of 6B: there is no time to head back to
        Silver City.'
    campaign_choice:
      type: string
      role: input
      description: 'Actual party choice after The Apprentice: apostle or master.'
    chose_to_stop_sacrifice:
      type: boolean
      role: state
      description: The party chose the Apostle (6A). Quest 6B reads this for its harder encounters.
    aftermath_processed:
      type: boolean
      role: state
      description: The campaign aftermath has been applied once.
    league_member:
      type: boolean
      role: state
      description: The party has been enlisted into the League of Dungeoneers by playing this campaign.
    dagger_taken_for_investigation:
      type: boolean
      role: output
      description: From the aftermath rule.
    dagger_symbol_origin:
      type: string
      role: output
      description: From the aftermath rule.
    reward_per_hero:
      type: number
      role: output
      description: Coins each hero receives at the aftermath dinner, from the aftermath rule.
      integer: true
    reward_presentation:
      type: string
      role: output
      description: From the aftermath rule.
    league_enlistment_requested:
      type: boolean
      role: output
      description: From the aftermath rule.
    requesting_king:
      type: string
      role: output
      description: From the aftermath rule.
    next_expeditions:
      type: string
      role: output
      description: From the aftermath rule.
  dependencies:
    - key: quests
      label: Each campaign quest as its own accepted quest and dungeon lifecycle
      object_id: procedure.quest_acceptance
    - key: travel
      label: Travel to the next destination named by the campaign text
      object_id: procedure.travel_daily_movement
    - key: rochdale
      label: Travel to Rochdale without event using the bandit rations
      object_id: core.quest.highwaymen.aftermath_travel
    - key: campaign_start
      label: This campaign starts wherever the heroes are; the second quest must be started in Silver City
      object_id: core.quest.dead_rising_campaign.start
  steps:
    - id: check_owner
      source: &a2
        - *a1
      source_text:
        This campaign starts wherever the heroes are, but the second quest must be started in
        Silver City.
      substeps:
        - id: bind_campaign
          source: *a2
          source_text:
            This campaign starts wherever the heroes are, but the second quest must be started in
            Silver City.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: campaign_owner_id
            right:
              type: literal
              value: ''
          effects:
            - type: set
              target: campaign_owner_id
              value:
                type: field
                name: campaign_id
        - id: owner
          source: *a2
          source_text:
            This campaign starts wherever the heroes are, but the second quest must be started in
            Silver City.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: campaign_owner_id
            right:
              type: field
              name: campaign_id
          effects:
            - type: set
              target: owner_matches
              value:
                type: literal
                value: true
      effects:
        - type: set
          target: owner_matches
          value:
            type: literal
            value: false
        - type: set
          target: completion_accepted
          value:
            type: literal
            value: false
    - id: start_campaign
      source:
        - *a1
      source_text:
        'This campaign starts wherever the heroes are, but the second quest must be started in
        Silver City.'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: start
          - type: compare
            operator: eq
            left:
              type: field
              name: stage
            right:
              type: literal
              value: ''
      effects:
        - type: set
          target: stage
          value:
            type: literal
            value: q1
        - type: set
          target: next_quest_id
          value:
            type: literal
            value: quest.dead_rising.spring_cleaning
        - type: set
          target: quest_in_progress
          value:
            type: literal
            value: false
        - type: set
          target: settlement_return_allowed
          value:
            type: literal
            value: true
        - type: set
          target: aftermath_processed
          value:
            type: literal
            value: false
        - type: set
          target: chose_to_stop_sacrifice
          value:
            type: literal
            value: false
    - id: start_quest
      source:
        - *a1
      source_text:
        This campaign starts wherever the heroes are, but the second quest must be started in
        Silver City.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: owner_matches
            right:
              type: literal
              value: true
          - type: compare
