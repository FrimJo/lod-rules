    - &a4
      document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 226
      printed_page: 224
      heading: 'Quest 1: Spring Cleaning — aftermath'
      extraction:
        method: text
        confidence: high
