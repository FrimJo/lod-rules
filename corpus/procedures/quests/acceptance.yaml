- id: procedure.quest_acceptance
  name: Actual party quest acceptance and immutable instance provenance
  section_id: section.settlements.taking_on_quests
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Taking on Quests; Rejecting a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Available quests; Leaving on a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The party may start an available campaign or choose offered random quests in a
    settlement. Side quests available on d8 1–2 may be taken with another quest; only The Outpost
    offers Ancient Lands quests. Existing arrival/selector procedures own offer rolls, Luck
    prohibition, rejection limits and source site dice/map colour. This checkpoint records an actual
    source-eligible accepted choice once per party/distinct quest instance, with separate main/side
    records and immutable origin/site. Departure, progression, abandonment, completion and rewards
    remain separately owned; fresh records do not reset a previous instance reward or hero
    recovery/attempt state.
  issues:
    - issue.quest.acceptance_scope
  fields:
    phase:
      type: string
      role: input
      description: accept is this checkpoint; departure, completion, payment and abandonment are
        separately owned.
    quest_acceptance_owner_matches:
      type: boolean
      role: input
      description:
        Actual party/settlement visit/selected offer/quest instance record matches; not another
        party or stale offer.
    quest_offer_scope_resolved:
      type: boolean
      role: input
      description:
        Actual source-grounded offer and quest eligibility, including campaign availability,
        repeat eligibility and particular quest exceptions, are resolved. No universal repeatability
        is assumed. Supplied canonical catalogue identity existence is verified in this context.
    quest_choice_supplied:
      type: boolean
      role: input
      description:
        Actual chosen canonical quest identity and fresh instance identity are supplied, not
        selector handoff alone.
    quest_choice_available:
      type: boolean
      role: input
      description: This actual selected quest is offered/available; counts alone do not establish its identity.
    quest_acceptance_confirmed:
      type: boolean
      role: input
      description:
        Actual party choice to accept this offer occurred; legacy settlement quest_accepted may
        supply a main choice but does not select an identity.
    quest_instance_fresh:
      type: boolean
      role: input
      description:
        A distinct actual quest instance record is supplied; a changed string alone is not a
        new repeatable quest.
    side_quest_available:
      type: boolean
      role: input
      description:
        Actual d8 result/source offer makes a side quest available; not inferred from main
        acceptance.
    quest_site_required:
      type: boolean
      role: input
      description:
        This actual quest requires a site resolution at acceptance, including its source-fixed
        or random location scope.
    quest_site_supplied:
      type: boolean
      role: input
      description:
        Actual source-backed quest site is supplied; no map geometry, travel time or fixed site
        invented.
    must_depart:
      type: boolean
      role: input
      description:
        Actual rejection/no-offer settlement boundary from existing arrival procedure prevents
        acceptance here.
    settlement:
      type: string
      role: input
      description: Actual current settlement and starting-settlement ownership.
    selected_quest_id:
      type: string
      role: input
      description:
        Actual canonical selected quest ID. Identity existence is supplied by the catalogue
        consumer; this procedure does not invent a selector result.
    selected_instance_id:
      type: string
      role: input
      description: Actual distinct quest occurrence identity; same catalogue quest can have another
        instance only when source eligibility permits.
    quest_slot:
      type: string
      role: input
      description: main or side. A side instance can accompany a main instance; no global one-quest
        runtime cap is invented.
    quest_family:
      type: string
      role: input
      description: Actual selected source family, ancient_lands or another source-grounded family.
    selected_quest_site:
      type: string
      role: input
      description: Actual resolved fixed/random site of this chosen quest, not a replay substitution.
    instance_acceptance_processed:
      type: boolean
      role: state
      description:
        Party/distinct actual quest-instance acceptance marker; false only for a fresh record.
        Do not reset on route, day, visit or changed selection.
    quest_choice_request_processed:
      type: boolean
      role: state
      description: Once-per-owned selected-offer actual identity/eligibility request.
    quest_site_request_processed:
      type: boolean
      role: state
      description: Once-per-owned actual accepted quest site request; distinct from selection request.
    instance_completed:
      type: boolean
      role: state
      description: This fresh instance completion status, not the previous instance or catalogue-wide state.
    instance_abandoned:
      type: boolean
      role: state
      description: This fresh instance abandonment status, source transitions separately owned.
    instance_reward_collected:
      type: boolean
      role: state
      description: This fresh instance promised-reward status; no existing completed-instance reward is reset.
    instance_quest_id:
      type: string
      role: state
      description:
        Persisted actual accepted quest-instance instance_quest_id; immutable under replay,
        separately owned from other quest records.
    instance_id:
      type: string
      role: state
      description: Persisted actual accepted quest-instance instance_id; immutable under replay,
        separately owned from other quest records.
    instance_start_settlement:
      type: string
      role: state
      description:
        Persisted actual accepted quest-instance instance_start_settlement; immutable under
        replay, separately owned from other quest records.
    instance_slot:
      type: string
      role: state
      description: Persisted actual accepted quest-instance instance_slot; immutable under replay,
        separately owned from other quest records.
    instance_site:
      type: string
      role: state
      description: Persisted actual accepted quest-instance instance_site; immutable under replay,
        separately owned from other quest records. Empty denotes no acceptance-site prescription
        supplied, not a fabricated map location.
    party_id:
      type: string
      role: state
      description: Immutable actual settlement offer party_id context.
    offer_id:
      type: string
      role: state
      description: Immutable actual settlement offer offer_id context.
    visit_id:
      type: number
      role: state
      description: Immutable actual settlement visit of this offer.
    actual_party_id:
      type: string
      role: input
      description: Actual result actual_party_id must match saved offer.
    actual_offer_id:
      type: string
      role: input
      description: Actual result actual_offer_id must match saved offer.
    actual_visit_id:
      type: number
      role: input
      description: Actual result settlement visit.
    instance_owner:
      type: string
      role: state
      description: Persisted actual accepted/pending instance_owner.
    instance_offer_id:
      type: string
      role: state
      description: Persisted actual accepted/pending instance_offer_id.
    pending_site_instance_id:
      type: string
      role: state
      description: Persisted actual accepted/pending pending_site_instance_id.
    pending_site_quest_id:
      type: string
      role: state
      description: Persisted actual accepted/pending pending_site_quest_id.
    instance_visit_id:
      type: number
      role: state
      description: Persisted accepted settlement visit.
  dependencies:
    - key: availability
      label: Existing visit offers, acceptance and rejection limits
      object_id: procedure.settlement_arrival
    - key: catalogue
      label: Actual chosen canonical Quest Book quest; no selector result invented
      section_id: section.quest_book_i
    - key: choice
      label: Actual source-grounded offered quest identity, eligibility and distinct occurrence
    - key: site
      label: Actual chosen quest source-fixed location or required site roll/map result
    - key: side
      label: Source side quest eligibility may accompany another quest
      section_id: section.quest_book_i.side_quests
    - key: departure
      label: Actual early-morning departure and no settlement activities that day
      object_id: procedure.settlement_activities_and_overnight
    - key: site_selector
      label: Source settlement dice/map colour for quests requiring that selector; not an invented
        fixed-site reroll
      object_id: table.settlement.quest_sites
  steps:
    - id: request_choice
      source: *a1
      source_text:
        Request actual chosen identity/eligibility once; handoff is not acceptance or a fresh
        repeatable occurrence.
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: accept
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_acceptance_owner_matches
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: instance_acceptance_processed
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_instance_fresh
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: must_depart
                right:
                  type: literal
                  value: false
              - type: compare
                operator: ne
                left:
                  type: field
                  name: party_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: ne
                left:
                  type: field
                  name: offer_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: eq
                left:
                  type: field
                  name: party_id
                right:
                  type: field
                  name: actual_party_id
              - type: compare
                operator: eq
                left:
                  type: field
                  name: offer_id
                right:
                  type: field
                  name: actual_offer_id
              - type: compare
                operator: eq
                left:
                  type: field
                  name: visit_id
                right:
                  type: field
                  name: actual_visit_id
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_offer_scope_resolved
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_choice_supplied
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_choice_request_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: quest_choice_request_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: choice
    - id: invalid_choice
      source: *a1
      source_text: Empty supplied identities or an unsupported slot have no accepted instance disposition.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_offer_scope_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_choice_supplied
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: selected_quest_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: eq
                left:
                  type: field
                  name: selected_instance_id
                right:
                  type: literal
                  value: ''
              - type: all
                conditions:
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: quest_slot
                    right:
                      type: literal
                      value: main
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: quest_slot
                    right:
                      type: literal
                      value: side
      effects:
        - type: unresolved
          issue_id: issue.quest.acceptance_scope
    - id: request_site
      source: *a1
      source_text:
        An actual accepted source-eligible choice requiring a site requests the source die/map
        or fixed location once; this is not a completed site result.
      when:
        type: all
        conditions:
          - &a3
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_offer_scope_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_choice_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_choice_available
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_acceptance_confirmed
                right:
                  type: literal
                  value: true
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: quest_slot
                    right:
                      type: literal
                      value: main
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: quest_slot
                        right:
                          type: literal
                          value: side
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: side_quest_available
                        right:
                          type: literal
                          value: true
              - type: any
                conditions:
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: quest_family
                    right:
                      type: literal
                      value: ancient_lands
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: outpost
              - type: compare
                operator: ne
                left:
                  type: field
                  name: selected_quest_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: ne
                left:
                  type: field
                  name: selected_instance_id
                right:
                  type: literal
                  value: ''
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_site_required
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_site_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_site_request_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: quest_site_request_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: site
        - type: set
          target: pending_site_instance_id
          value:
            type: field
            name: selected_instance_id
        - type: set
          target: pending_site_quest_id
          value:
            type: field
            name: selected_quest_id
    - id: record
      source: *a1
      source_text:
        Persist actual accepted quest, instance, originating settlement, main/side slot and
        supplied site once. Initialize only this new instance statuses; replay cannot reseed rewards
        or overwrite another instance.
      when:
        type: all
        conditions:
          - *a3
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_site_required
                right:
                  type: literal
                  value: false
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: quest_site_supplied
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: selected_quest_site
                    right:
                      type: literal
                      value: ''
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_site_request_processed
                right:
                  type: literal
                  value: false
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: pending_site_instance_id
                    right:
                      type: field
                      name: selected_instance_id
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: pending_site_quest_id
                    right:
                      type: field
                      name: selected_quest_id
      effects:
        - type: set
          target: instance_quest_id
          value:
            type: field
            name: selected_quest_id
        - type: set
          target: instance_id
          value:
            type: field
            name: selected_instance_id
        - type: set
          target: instance_start_settlement
          value:
            type: field
            name: settlement
        - type: set
          target: instance_slot
          value:
            type: field
            name: quest_slot
        - type: set
          target: instance_site
          value:
            type: literal
            value: ''
        - type: set
          target: instance_completed
          value:
            type: literal
            value: false
        - type: set
          target: instance_abandoned
          value:
            type: literal
            value: false
        - type: set
          target: instance_reward_collected
          value:
            type: literal
            value: false
        - type: set
          target: instance_acceptance_processed
          value:
            type: literal
            value: true
        - type: set
          target: instance_owner
          value:
            type: field
            name: party_id
        - type: set
          target: instance_offer_id
          value:
            type: field
            name: offer_id
        - type: set
          target: instance_visit_id
          value:
            type: field
            name: visit_id
      substeps:
        - id: supplied_site
          source: *a1
          source_text:
            Persist an actual supplied site only when present. Empty instance site otherwise
            records no acceptance-site prescription; never invent a location.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_site_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: ne
                left:
                  type: field
                  name: selected_quest_site
                right:
                  type: literal
                  value: ''
          effects:
            - type: set
              target: instance_site
              value:
                type: field
                name: selected_quest_site
  entry_step: request_choice
  exit_step: record
