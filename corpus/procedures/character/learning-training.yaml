  status: extracted
  confidence: high
  source_text: This can be done in the Guilds. ... You can practice CS, RS, Pick Locks, and
    Perception here. Increasing your skill by +3 will cost 300 c. Only one training session per skill
    may be undertaken between two dungeons. ... You can practice CS, Heal and Dodge here. Increasing
    one skill by +3 costs 300 c. Only one training session per skill can be undertaken between two
    dungeons. ... You can practice your Arcane Arts, Perception, and Heal here. Increasing your
    skill by +3 costs 300 c. Only one training session per skill can be undertaken between two
    dungeons. ... You can practice Alchemy, Heal, and Perception. Increasing your skill by +3 costs
    300 c. Only one training session per skill can be done between two dungeons. ... You can
    practice CS, RS, Dodge, Heal, and Foraging. Increasing your skill by +3 costs 300 c. Only one
    training session per skill can be undertaken between two dungeons. ... You can practice CS,
    Dodge, and Battle Prayers here. Increasing your skill by +3 costs 300 c and takes 1 day. Only
    one training session per skill can be taken between two dungeons.
  unresolved_references:
    - Skill Training costs 1 Activity Point in the Available Actions table; only the Inner Sanctum
      also states "takes 1 day".
    - The natural skill maximum of 80 applies to trained skills. The book prints no partial +1 or +2
      session or prorated fee when a full +3 would exceed 80 (issue.guild.training_near_cap).
  fields:
    settlement: *a2
    profession: *a3
    business_allowed: *a4
    leaving_on_quest: *a5
    activity_authorized: *a6
    reserved_activity_points: *a7
    completed_activity_days: *a8
    coins: *a9
    guild:
      type: string
      role: input
      description: dark, fighters, wizards, alchemists, rangers or inner_sanctum.
    skill:
      type: string
      role: input
      description: Canonical skill name for the selected training.
    natural_skill:
      type: number
      role: state
      description: Skill including unconditioned talent bonuses, excluding conditional/temporary bonuses.
      integer: true
      minimum: 0
      maximum: 80
    trained_since_dungeon:
      type: boolean
      role: state
      description: Per hero and skill across all guilds and visits; reset only after a dungeon.
    training_eligible:
      type: boolean
      role: output
      description: Guild permits this profession and skill.
    trained:
      type: boolean
      role: output
      description: The session completed on this call.
  dependencies:
    - *a10
    - *a11
    - key: training_dark
