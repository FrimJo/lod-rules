- id: procedure.learn_spell
  name: Learn a new spell
  section_id: section.magic.learning_new_spells
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 66
      printed_page: 64
      heading: Learning New Spells
      extraction:
        method: text
        confidence: high
        visually_verified: false
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 146
      printed_page: 144
      heading: Learn a Spell or Prayer
      extraction:
        method: text
        confidence: high
        visually_verified: false
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 153
      printed_page: 151
      heading: Learning New Spells
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    A Wizard may learn spells of their own level or lower in Silver City. The fee is 200 c
    plus 100 c for each level above 1. Learning takes 3 days; only one spell may be learned between
    each quest. A found Grimoire waives the fee for that spell.
  fields:
    settlement: &a2
      type: string
      role: input
      description: silver_city is required for guilds and Inner Sanctum.
    profession: &a3
      type: string
      role: input
      description: Stable profession ID suffix.
    business_allowed: &a4
      type: boolean
      role: input
      description: Supplied settlement visit authorization.
    leaving_on_quest: &a5
      type: boolean
      role: input
      description: No settlement actions on a quest-departure day.
    activity_authorized: &a6
      type: boolean
      role: input
      description: Existing settlement procedure reserved the correct activity for this hero and this operation.
    reserved_activity_points: &a7
      type: number
      role: input
      description: Reserved cost from table.settlement.activities; not charged again here.
      integer: true
      minimum: 0
    completed_activity_days: &a8
      type: number
      role: input
      description: Fully completed days of this same reservation; zero until the first day finishes.
      integer: true
      minimum: 0
    coins: &a9
      type: number
      role: state
      description:
        Hero or explicitly designated payer balance. Lodging charges belong to the settlement
        procedure.
      integer: true
      minimum: 0
    hero_level:
      type: number
      role: input
      description: Current hero level.
      integer: true
      minimum: 1
      maximum: 10
    chosen_level:
      type: number
      role: input
      description: Level of the selected spell from its existing catalogue.
      integer: true
      minimum: 1
      maximum: 10
    chosen_id:
      type: string
      role: input
      description: Selected canonical spell ID; caller resolves the catalogue selection.
    catalogue_selection_valid:
      type: boolean
      role: input
      description: Selected ID exists, has the supplied level, and is learnable by this profession.
    known:
      type: boolean
      role: state
      description: Per chosen spell; whether already learned.
    learned_since_boundary:
      type: boolean
      role: state
      description:
        Per hero across all spells since the preceding quest; a new settlement visit does not
        reset it.
    grimoire_for_this_spell:
      type: boolean
      role: input
      description: A found Grimoire contains this selected spell; only its learning fee is waived.
    learning_cost:
      type: number
      role: output
      description: Learning fee; lodging and activity points are accounted separately.
      integer: true
      minimum: 0
    required_activity_points:
      type: number
      role: output
      description: Duration to reserve in existing settlement accounting.
      integer: true
      minimum: 0
    learned:
      type: boolean
      role: output
      description: Whether this call completed learning.
  dependencies:
    - &a10
      key: activity_accounting
      object_id: procedure.settlement_activities_and_overnight
      label:
        Reserve and complete activity days and settle party lodging separately; invocation never
        deducts Activity Points or lodging again.
    - &a11
      key: activities
      object_id: table.settlement.activities
      label: 'Source duration: spell 3; prayer 1; Skill Training 1.'
    - key: learning_rule
      object_id: character.settlement.guild.wizards.learning
      label: Existing catalogue learning rule.
  steps:
    - id: quote
      source_text: Learning costs 200 c plus 100 c per level above 1.
      effects:
        - type: set
          target: learned
          value:
            type: literal
            value: false
        - type: set
          target: required_activity_points
          value:
            type: literal
            value: 3
        - type: set
          target: learning_cost
          value:
            type: sum
            values:
              - type: literal
                value: 200
              - type: arithmetic
                operator: multiply
                values:
                  - type: literal
                    value: 100
                  - type: arithmetic
                    operator: subtract
                    values:
                      - type: field
                        name: chosen_level
                      - type: literal
                        value: 1
    - id: grimoire_fee
      source_text: If the wizard found a Grimoire, learning that spell is free; it still takes 3 days.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: grimoire_for_this_spell
        right:
          type: literal
          value: true
      effects:
        - type: set
          target: learning_cost
          value:
            type: literal
            value: 0
    - id: check_learning
      source_text:
        One spell between each quest; the hero must afford it, meet its level, and complete the
        reserved duration.
      effects:
        - type: require
          condition: &a1
            type: all
            conditions:
              - &a12
                type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: silver_city
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: business_allowed
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: leaving_on_quest
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: wizard
              - type: compare
                operator: eq
                left:
                  type: field
                  name: catalogue_selection_valid
                right:
                  type: literal
                  value: true
              - type: compare
                operator: ne
                left:
                  type: field
                  name: chosen_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: lte
                left:
                  type: field
                  name: chosen_level
                right:
                  type: field
                  name: hero_level
              - type: compare
                operator: eq
                left:
                  type: field
                  name: known
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: learned_since_boundary
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: reserved_activity_points
                right:
                  type: literal
                  value: 3
              - type: compare
                operator: gte
                left:
                  type: field
                  name: completed_activity_days
                right:
                  type: literal
                  value: 3
              - type: compare
                operator: gte
                left:
                  type: field
                  name: coins
                right:
                  type: field
                  name: learning_cost
    - id: learn
      source_text: Complete the 3-day learning activity once and pay its fee.
      when: *a1
      effects:
        - type: invoke
          dependency: activity_accounting
        - type: invoke
          dependency: activities
        - type: invoke
          dependency: learning_rule
        - type: add
          target: coins
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: literal
                value: -1
              - type: field
                name: learning_cost
          duration: permanent
        - type: set
          target: known
          value:
            type: literal
            value: true
        - type: set
          target: learned_since_boundary
          value:
            type: literal
            value: true
        - type: set
          target: learned
          value:
            type: literal
            value: true
  entry_step: quote
  exit_step: learn
