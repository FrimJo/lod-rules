  status: extracted
  confidence: high
  source_text: The appropriate profession may train only the guild’s listed skills. A session grants
    +3 for 300 c, with one session per skill between two dungeons. Skill Training takes one Activity
    Point; the Inner Sanctum explicitly states one day. The natural skill maximum remains 80; no
    partial +1/+2 purchase is specified.
  fields:
    settlement: *a2
    profession: *a3
    business_allowed: *a4
    leaving_on_quest: *a5
    activity_authorized: *a6
    reserved_activity_points: *a7
    completed_activity_days: *a8
    coins: *a9
    guild:
      type: string
      role: input
      description: dark, fighters, wizards, alchemists, rangers or inner_sanctum.
    skill:
      type: string
      role: input
      description: Canonical skill name for the selected training.
    natural_skill:
      type: number
      role: state
      description: Skill including unconditioned talent bonuses, excluding conditional/temporary bonuses.
      integer: true
      minimum: 0
      maximum: 80
    trained_since_dungeon:
      type: boolean
      role: state
      description: Per hero and skill across all guilds and visits; reset only after a dungeon.
    training_eligible:
      type: boolean
      role: output
      description: Guild permits this profession and skill.
    trained:
      type: boolean
      role: output
      description: The session completed on this call.
  dependencies:
    - *a10
    - *a11
    - key: training_dark
      object_id: character.settlement.guild.dark.training
      label: Existing guild access and training catalogue.
    - key: training_fighters
      object_id: character.settlement.guild.fighters.training
      label: Existing guild access and training catalogue.
    - key: training_wizards
      object_id: character.settlement.guild.wizards.training
      label: Existing guild access and training catalogue.
    - key: training_alchemists
      object_id: character.settlement.guild.alchemists.training
      label: Existing guild access and training catalogue.
    - key: training_rangers
      object_id: character.settlement.guild.rangers.training
      label: Existing guild access and training catalogue.
    - key: training_inner_sanctum
      object_id: character.settlement.guild.inner_sanctum.training
      label: Existing guild access and training catalogue.
    - key: skill_maximum
      object_id: character.skill.natural_maximum
      label: Natural skill maximum includes unconditional talent bonuses.
  steps:
    - id: initialize
      source_text: Guilds protect their services and admit the appropriate professions.
      effects:
        - type: set
          target: training_eligible
          value:
            type: literal
            value: false
        - type: set
          target: trained
          value:
            type: literal
            value: false
    - id: eligibility_dark
      source_text: Training is restricted to the listed professions and skills.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 148
          printed_page: 146
          heading: Skill Training
          extraction:
            method: text
            confidence: high
            visually_verified: false
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: guild
            right:
              type: literal
              value: dark
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: thief
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: rogue
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: skill
                right:
                  type: literal
                  value: cs
              - type: compare
                operator: eq
                left:
                  type: field
                  name: skill
                right:
                  type: literal
                  value: rs
              - type: compare
                operator: eq
                left:
                  type: field
                  name: skill
                right:
                  type: literal
                  value: pick_locks
              - type: compare
                operator: eq
                left:
                  type: field
                  name: skill
                right:
                  type: literal
                  value: perception
      effects:
        - type: set
