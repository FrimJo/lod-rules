  status: extracted
  confidence: high
  source_text: >-
    A priest may learn all prayers that are the same level or lower level than the priest,
    provided they can pay for it. This is done in the Inner Sanctum in Silver City. ... Priests
    may learn a prayer from one of the High Priests. Each hero may learn one prayer in between
    each visit to a dungeon. The price for learning a prayer is 200 c + 100 c per prayer level
    above 1. It takes 1 day.
  see_also:
    - section.the_inner_sanctum.learning_a_new_prayer
    - section.settlements.learn_a_spell_or_prayer
  fields:
    settlement: *a2
    profession: *a3
    business_allowed: *a4
    leaving_on_quest: *a5
    activity_authorized: *a6
    reserved_activity_points: *a7
    completed_activity_days: *a8
    coins: *a9
    hero_level:
      type: number
      role: input
      description: Current hero level.
      integer: true
      minimum: 1
      maximum: 10
    chosen_level:
      type: number
      role: input
      description: Level of the selected prayer from its existing catalogue.
      integer: true
      minimum: 1
      maximum: 10
    chosen_id:
      type: string
      role: input
      description: Selected canonical prayer ID; caller resolves the catalogue selection.
    catalogue_selection_valid:
      type: boolean
      role: input
      description: Selected ID exists, has the supplied level, and is learnable by this profession.
    known:
      type: boolean
      role: state
      description: Per chosen prayer; whether already learned.
    learned_since_boundary:
      type: boolean
      role: state
      description:
        Per hero across all prayers since the preceding dungeon; a new settlement visit does
        not reset it.
    learning_cost:
      type: number
      role: output
      description: Learning fee; lodging and activity points are accounted separately.
      integer: true
      minimum: 0
    required_activity_points:
      type: number
      role: output
      description: Duration to reserve in existing settlement accounting.
      integer: true
      minimum: 0
    learned:
      type: boolean
      role: output
      description: Whether this call completed learning.
  dependencies:
    - *a10
    - *a11
    - key: learning_rule
      object_id: character.settlement.guild.inner_sanctum.learning
      label: Existing catalogue learning rule.
    - key: learning_restriction
      object_id: character.prayer.learning_restriction
      label: Same level or lower than the priest; done in the Inner Sanctum in Silver City.
  steps:
    - id: quote
      source_text: Learning costs 200 c plus 100 c per level above 1.
      effects:
        - type: set
          target: learned
          value:
            type: literal
            value: false
        - type: set
          target: required_activity_points
          value:
            type: literal
            value: 1
        - type: set
          target: learning_cost
          value:
            type: sum
            values:
              - type: literal
                value: 200
              - type: arithmetic
                operator: multiply
                values:
                  - type: literal
                    value: 100
                  - type: arithmetic
                    operator: subtract
                    values:
                      - type: field
                        name: chosen_level
                      - type: literal
                        value: 1
    - id: check_learning
      source_text:
        One prayer between each dungeon; the hero must afford it, meet its level, and complete
        the reserved duration.
      effects:
        - type: invoke
          dependency: learning_restriction
        - type: require
          condition: &a13
            type: all
            conditions:
              - *a12
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: warrior_priest
              - type: compare
                operator: eq
                left:
                  type: field
                  name: catalogue_selection_valid
                right:
                  type: literal
                  value: true
              - type: compare
                operator: ne
                left:
                  type: field
                  name: chosen_id
                right:
                  type: literal
                  value: ''
              - type: compare
                operator: lte
                left:
                  type: field
                  name: chosen_level
                right:
                  type: field
                  name: hero_level
              - type: compare
                operator: eq
                left:
                  type: field
                  name: known
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: learned_since_boundary
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: reserved_activity_points
                right:
                  type: literal
                  value: 1
              - type: compare
                operator: gte
                left:
                  type: field
                  name: completed_activity_days
                right:
                  type: literal
                  value: 1
              - type: compare
                operator: gte
                left:
                  type: field
                  name: coins
                right:
                  type: field
                  name: learning_cost
    - id: learn
      source_text: Complete the 1-day learning activity once and pay its fee.
      when: *a13
