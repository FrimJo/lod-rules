    - id: double_cost
      source_text: Once a stat or skill passes 70, the cost is doubled.
      when:
        type: all
        conditions:
          - type: compare
            operator: ne
            left:
              type: field
              name: kind
            right:
              type: literal
              value: hit_points
          - type: compare
            operator: gt
            left:
              type: field
              name: value
            right:
              type: literal
              value: 70
          - type: compare
            operator: eq
            left:
              type: field
              name: valid_subject
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: cost
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: base_cost
              - type: literal
                value: 2
    - id: boundary_cost
      source_text: Once a stat or skill passes 70, the cost is doubled.
      when:
        type: all
        conditions:
          - type: compare
            operator: ne
            left:
              type: field
              name: kind
            right:
              type: literal
              value: hit_points
          - type: compare
            operator: eq
            left:
              type: field
              name: value
            right:
              type: literal
              value: 70
          - type: compare
            operator: eq
            left:
              type: field
              name: boundary_cost_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: valid_subject
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: cost
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: base_cost
              - type: field
                name: boundary_cost_multiplier
    - id: unresolved_boundary
      source_text: Once a stat or skill passes 70, the cost is doubled.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: session_open
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: valid_subject
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: kind
            right:
              type: literal
              value: hit_points
          - type: compare
            operator: eq
            left:
              type: field
              name: value
            right:
              type: literal
              value: 70
          - type: compare
            operator: eq
            left:
              type: field
              name: boundary_cost_resolved
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.character.improvement_seventy_boundary
    - id: unresolved_hp_limit
      source_text: Hit points may only be increased by +2 per level.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: session_open
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: valid_subject
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: kind
            right:
              type: literal
              value: hit_points
          - type: compare
            operator: eq
            left:
              type: field
              name: hp_limit_resolved
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.character.level_hit_point_limit
    - id: check_purchase
      source_text: No skill or stat may be increased more than +5 per level. Hit points may only be
        increased by +2 per level.
      effects:
        - type: require
          condition: &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: session_open
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: valid_subject
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gt
                left:
                  type: field
                  name: cost
                right:
                  type: literal
                  value: 0
              - type: compare
                operator: gte
                left:
                  type: field
                  name: improvement_points
                right:
                  type: field
                  name: cost
              - type: any
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: ne
                        left:
                          type: field
                          name: kind
                        right:
                          type: literal
                          value: hit_points
                      - type: compare
                        operator: lt
                        left:
                          type: field
                          name: increased_this_level
                        right:
                          type: literal
                          value: 5
                      - type: compare
                        operator: lt
                        left:
                          type: field
                          name: value
                        right:
                          type: field
                          name: maximum
                      - type: any
                        conditions:
                          - type: compare
                            operator: ne
                            left:
                              type: field
                              name: value
                            right:
                              type: literal
                              value: 70
                          - type: compare
                            operator: eq
                            left:
                              type: field
                              name: boundary_cost_resolved
                            right:
                              type: literal
                              value: true
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: kind
                        right:
                          type: literal
                          value: hit_points
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: hp_limit_resolved
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: lt
                        left:
                          type: field
                          name: increased_this_level
                        right:
                          type: field
                          name: hp_purchase_limit
    - id: purchase_point
      source_text: You have 15 Improvement Points to spend on stat and skill increases.
      when: *a2
      effects:
        - type: add
          target: improvement_points
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: literal
                value: -1
              - type: field
                name: cost
          duration: permanent
        - type: add
          target: value
          value:
            type: literal
            value: 1
          duration: permanent
        - type: add
          target: increased_this_level
          value:
            type: literal
            value: 1
          duration: permanent
        - type: set
          target: improved
          value:
            type: literal
            value: true
  entry_step: initialize
  exit_step: purchase_point
  issues:
    - issue.character.improvement_seventy_boundary
    - issue.character.level_hit_point_limit
- id: procedure.character_level_ability
  name: Choose level-up talent or perk
  section_id: section.levelling_up.talents_and_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 62
      printed_page: 60
      heading: Talents and Perks
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Every time your hero levels up, they may choose a Talent from the category shown in the
    table below. Every other level up, the same goes for a Perk.
  fields:
    session_open:
      type: boolean
      role: state
      description: Hero advancement session is open.
    level:
      type: number
      role: input
      description: New hero level.
      integer: true
      minimum: 2
      maximum: 10
    profession:
      type: string
      role: input
      description: Profession ID suffix.
    kind:
      type: string
      role: input
      description: talent or perk.
    selected_id:
      type: string
      role: input
      description: Chosen existing talent/perk catalogue ID.
    selected_category:
      type: string
      role: input
      description: Printed category of the selected ability, without Talents/Perks suffix.
    catalogue_selection_valid:
      type: boolean
      role: input
      description:
        Caller confirms selected ID, kind, category and prerequisites from the existing ability
        catalogue.
    talent_selected:
      type: boolean
      role: state
      description: This session has already granted its talent.
    perk_selected:
      type: boolean
      role: state
      description: This session has already granted its perk.
    expected_category:
      type: string
      role: output
      description: Category permitted by profession and level.
    granted:
      type: boolean
      role: output
      description: Whether a new ability was selected.
    granted_id:
      type: string
      role: output
      description: Selected ID to apply once in the owning hero ability collection.
  dependencies:
    - key: talent_categories
      object_id: table.character.talent_progression
      label: Talent choice categories.
    - key: perk_categories
      object_id: table.character.perk_progression
      label: Perk choice categories.
    - key: talents
      section_id: section.appendix_ii_talents
      label: Selected talent and its prerequisite/effects are resolved once from the existing catalogue.
    - key: perks
      section_id: section.appendix_i_perks
      label: Selected perk and its prerequisite/effects are resolved once from the existing catalogue.
  steps:
    - id: initialize
      source_text:
        Every time your hero levels up, they may choose a Talent from the category shown in the
        table below. Every other level up, the same goes for a Perk.
      effects:
        - type: set
          target: expected_category
          value:
            type: literal
            value: None
        - type: set
          target: granted
          value:
            type: literal
            value: false
        - type: set
          target: granted_id
          value:
            type: literal
            value: ''
    - id: category_barbarian_talent
      source_text:
        Every time your hero levels up, they may choose a Talent from the category shown in the
        table below. Every other level up, the same goes for a Perk.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: profession
            right:
              type: literal
              value: barbarian
          - type: compare
            operator: eq
            left:
              type: field
              name: kind
            right:
              type: literal
              value: talent
      effects:
        - type: lookup
          table_id: table.character.talent_progression
          key_column: level
          key:
            type: field
            name: level
          value_column: barbarian
          target: expected_category
          on_missing_issue: issue.phase4.lookup_domain
