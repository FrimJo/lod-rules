      effects:
        - type: set
          target: kind
          value:
            type: literal
            value: skill
        - type: set
          target: valid_subject
          value:
            type: literal
            value: true
        - type: set
          target: maximum
          value:
            type: literal
            value: 80
    - id: kind_hit_points
      source_text:
        The table below tells you how many Improvement Points it costs to increase a stat or
        skill by +1.
      when:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
