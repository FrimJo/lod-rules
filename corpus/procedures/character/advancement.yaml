- id: procedure.character_level_up
  name: Open one level advancement session
  section_id: section.levelling_up
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 60
      printed_page: 58
      heading: Levelling Up
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 61
      printed_page: 59
      heading: Increasing your Skills and Basic Stats
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 62
      printed_page: 60
      heading: Talents and Perks
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 146
      printed_page: 144
      heading: Level Up
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text:
    Once you obtain enough experience, you may level up when you are back in a settlement.
    ... You have 15 Improvement Points to spend on stat and skill increases. ... Every time your
    hero levels up, they may choose a Talent from the category shown in the table below. Every other
    level up, the same goes for a Perk. ... Level Up | Any Settlement | 0 ... When the heroes get
    some rest, they can reflect upon their recent adventures. One obvious effect of this may be that
    they will level up if they have enough experience.
  fields:
    in_settlement:
      type: boolean
      role: input
      description: Hero is back in a settlement.
    activity_authorized:
      type: boolean
      role: input
      description:
        Existing settlement accounting permits this zero-point action; no concurrent multi-day
        activity.
    leaving_on_quest:
      type: boolean
      role: input
      description: Settlement activities cannot occur on quest departure day.
    level:
      type: number
      role: state
      description: Current hero level.
      integer: true
      minimum: 1
      maximum: 10
    target_level:
      type: number
      role: input
      description: The next level, not an arbitrary higher level.
      integer: true
      minimum: 2
      maximum: 10
    experience:
      type: number
      role: state
      description: Cumulative XP; not spent by level advancement.
      integer: true
      minimum: 0
    required_experience:
      type: number
      role: output
      description: Required cumulative XP from the progression table.
      integer: true
      minimum: 0
    hp_roll:
      type: number
      role: input
      description: Supplied +1d2 Hit Point increase.
      integer: true
      minimum: 1
      maximum: 2
    maximum_hit_points:
      type: number
      role: state
      description: Hero Hit Point statistic; current wounds/recovery are not changed here.
      integer: true
      minimum: 1
    maximum_luck:
      type: number
      role: state
      description: Hero Luck capacity; current Luck recovery belongs to settlement rest.
      integer: true
      minimum: 0
    maximum_energy:
      type: number
      role: state
      description: Hero Energy capacity; current Energy recovery belongs to settlement rest.
      integer: true
      minimum: 0
    improvement_points:
      type: number
      role: state
      description: Hero unspent Improvement Points carried across levels.
      integer: true
      minimum: 0
    session_open:
      type: boolean
      role: state
      description: Current level advancement session remains open until spending/choices are complete.
    session_level:
      type: number
      role: state
      description: Level for this advancement session.
      integer: true
      minimum: 1
      maximum: 10
    talent_selected:
      type: boolean
      role: state
      description: Whether this session has used its talent choice.
    perk_selected:
      type: boolean
      role: state
      description: Whether this session has used its perk choice.
    advanced:
      type: boolean
      role: output
      description: This call actually advanced the hero.
  dependencies:
    - key: progression
      object_id: table.character.level_progression
      label: XP and resource gains.
    - key: activities
      object_id: table.settlement.activities
      label: Level Up is a zero-point settlement activity.
    - key: talents
      object_id: table.character.talent_progression
      label: Talent categories.
    - key: perks
      object_id: table.character.perk_progression
      label: Perk categories.
  steps:
    - id: lookup_level
      source_text: Level | XP requirement | Hit Point increase | Luck increase | Energy
      effects:
        - type: set
          target: advanced
          value:
            type: literal
            value: false
        - type: lookup
          table_id: table.character.level_progression
          key_column: level
          key:
            type: field
            name: target_level
          value_column: xp_requirement
          target: required_experience
          on_missing_issue: issue.phase4.lookup_domain
        - type: require
          condition: &a1
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: in_settlement
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: activity_authorized
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: leaving_on_quest
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: session_open
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: target_level
                right:
                  type: sum
                  values:
                    - type: field
                      name: level
                    - type: literal
                      value: 1
              - type: compare
                operator: gte
                left:
                  type: field
                  name: experience
                right:
                  type: field
                  name: required_experience
    - id: advance
      source_text: Once you obtain enough experience, you may level up when you are back in a settlement.
      when: *a1
      effects:
        - type: invoke
          dependency: progression
        - type: invoke
          dependency: activities
        - type: set
          target: level
          value:
            type: field
            name: target_level
        - type: set
          target: session_level
          value:
            type: field
            name: target_level
        - type: set
          target: session_open
          value:
            type: literal
            value: true
        - type: set
          target: talent_selected
          value:
            type: literal
            value: false
        - type: set
          target: perk_selected
          value:
            type: literal
            value: false
        - type: add
          target: maximum_hit_points
          value:
            type: field
            name: hp_roll
          duration: permanent
        - type: add
          target: improvement_points
          value:
            type: literal
            value: 15
          duration: permanent
        - type: set
          target: advanced
          value:
            type: literal
            value: true
    - id: luck
      source_text: Level | XP requirement | Hit Point increase | Luck increase | Energy
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: advanced
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 5
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 8
      effects:
        - type: add
          target: maximum_luck
          value:
            type: literal
            value: 1
          duration: permanent
    - id: energy
      source_text: Level | XP requirement | Hit Point increase | Luck increase | Energy
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: advanced
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 4
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 7
              - type: compare
                operator: eq
                left:
                  type: field
                  name: level
                right:
                  type: literal
                  value: 9
      effects:
        - type: add
          target: maximum_energy
          value:
            type: literal
            value: 1
          duration: permanent
  entry_step: lookup_level
  exit_step: energy
- id: procedure.character_improve
  name: Spend one Improvement Point purchase
  section_id: section.levelling_up.increasing_your_skills_and_basic_stats
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 61
      printed_page: 59
      heading: Increasing your Skills and Basic Stats
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 60
      printed_page: 58
      heading: Stats and Skills Maximum
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: You have 15 Improvement Points to spend on stat and skill increases. The table below
    tells you how many Improvement Points it costs to increase a stat or skill by +1. No skill or
    stat may be increased more than +5 per level. Hit points may only be increased by +2 per level.
    Once a stat or skill passes 70, the cost is doubled. Your heroes may save any spare Improvement
    points until the next time they level up. ... However, there is a maximum value for each stat
    depending on their race. ... The natural value of a skill can never exceed 80, including talents
    that give an unconditioned bonus of the value.
  fields:
    session_open:
      type: boolean
      role: input
      description: Hero is resolving an open level advancement session.
    profession:
      type: string
      role: input
      description: Profession ID suffix.
    race:
      type: string
      role: input
      description: Dwarf, Human, Elf or Halfling; printed stat-maxima key.
    subject:
      type: string
      role: input
      description: Printed subject from the Improvement Point cost table.
    value:
      type: number
      role: state
      description: Natural value including unconditioned talent bonuses, or maximum Hit Points.
      integer: true
      minimum: 0
    increased_this_level:
      type: number
      role: state
      description: Per hero, session level and subject; never reset within a session.
      integer: true
      minimum: 0
      maximum: 5
    improvement_points:
      type: number
      role: state
      description: Shared hero Improvement Points.
      integer: true
      minimum: 0
    base_cost:
      type: number
      role: output
      description: Profession-specific cost for +1.
      integer: true
      minimum: 0
    cost:
      type: number
      role: output
      description: Cost including applicable doubling.
      integer: true
      minimum: 0
    maximum:
      type: number
      role: output
      description: Racial stat maximum or skill maximum.
      integer: true
      minimum: 0
    kind:
      type: string
      role: output
      description: stat, skill or hit_points.
    valid_subject:
      type: boolean
      role: output
      description: Selection has a numeric cost in the printed matrix.
    boundary_cost_resolved:
      type: boolean
      role: input
      description: At exactly 70, caller supplies a documented interpretation of doubling.
    boundary_cost_multiplier:
      type: number
      role: input
      description: 'Supplied interpretation for 70 to 71: one or two.'
      integer: true
      minimum: 1
      maximum: 2
    hp_limit_resolved:
      type: boolean
      role: input
      description: Caller has explicitly resolved whether +2 HP includes the automatic roll.
    hp_purchase_limit:
      type: number
      role: input
      description: Remaining per-level purchased-HP ceiling under that supplied interpretation.
      integer: true
      minimum: 0
      maximum: 2
    improved:
      type: boolean
      role: output
      description: A point was purchased on this call.
  dependencies:
    - key: costs
      object_id: table.character.improvement_costs
      label: Printed profession costs.
    - key: maxima
      object_id: table.character.stat_maxima
      label: Racial stat maxima.
    - key: independence
      object_id: character.skill.stat_independence
      label: Increasing a basic stat after play begins does not raise a skill.
  steps:
    - id: initialize
      source_text: Whenever your hero levels up, you may choose which basic stats and skills to increase.
      effects:
        - type: set
          target: valid_subject
          value:
            type: literal
            value: false
        - type: set
          target: improved
          value:
            type: literal
            value: false
        - type: set
          target: kind
          value:
            type: literal
            value: ''
        - type: set
          target: base_cost
          value:
            type: literal
            value: 0
        - type: set
          target: cost
          value:
            type: literal
            value: 0
        - type: set
          target: maximum
          value:
            type: literal
            value: 0
    - id: kind_stat
      source_text:
        The table below tells you how many Improvement Points it costs to increase a stat or
        skill by +1.
      when:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: subject
            right:
              type: literal
              value: STR
          - type: compare
            operator: eq
            left:
              type: field
              name: subject
            right:
              type: literal
              value: DEX
          - type: compare
            operator: eq
            left:
              type: field
              name: subject
            right:
              type: literal
              value: CON
          - type: compare
            operator: eq
            left:
              type: field
              name: subject
            right:
              type: literal
              value: WIS
          - type: compare
            operator: eq
            left:
              type: field
              name: subject
            right:
              type: literal
              value: RES
      effects:
        - type: set
          target: kind
          value:
            type: literal
            value: stat
        - type: set
          target: valid_subject
          value:
            type: literal
            value: true
    - id: kind_skill
      source_text:
        The table below tells you how many Improvement Points it costs to increase a stat or
        skill by +1.
      when:
        type: any
        conditions:
