  status: extracted
  confidence: high
  source_text: Guild purchases reuse the structured special-equipment and component catalogues.
    Resolve the printed price, availability and restrictions, then use the ordinary settlement
    purchasing procedure. Alchemists’ components cost 15 c; a successful part-availability roll
    permits a kind of part from the selected enemy, with the printed illegal-body-part boundary
    retained. Weak potions are always in stock, Standard have availability 5 and Supreme 4. Guild
    access is checked separately.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    item_catalogue_resolved:
      type: boolean
      role: input
      description:
        Selected item, guild offering, price, availability, profession restrictions and special
        acquisition conditions were resolved from the existing guild/item tables.
    service_eligible:
      type: boolean
      role: output
      description:
        Pass this result into the existing buy/sell/service procedure for this same item and
        reservation.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: purchase
      object_id: procedure.settlement_buy_sell_and_service
      label:
        Owns the availability attempt, shared per-item lock, price and inventory mutation; invoke is
        a handoff, not another purchase.
    - key: catalogue_dark
      object_id: guild.dark
      label: Resolve this guild’s linked structured offering, effects and tables.
    - key: catalogue_fighters
      object_id: guild.fighters
      label: Resolve this guild’s linked structured offering, effects and tables.
    - key: catalogue_wizards
