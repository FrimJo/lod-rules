  steps:
    - id: initialize
      source_text: Resolve guild access, completed shopping activity, and a real catalogue offering.
      effects:
        - type: set
          target: service_eligible
          value:
            type: literal
            value: false
        - type: require
          condition:
            type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
