- id: procedure.ranger_special_talent
  name: Ranger special-talent tuition
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Special talents; Skinning; Butcher; Taxidermist
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text:
    A ranger may learn the following talents at any time by paying the tutor fee. Once one
    has been learnt, the ranger must level up once before learning another. Skinning costs 250 c,
    Butcher 200 c, and Taxidermist 350 c.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    level:
      type: number
      role: input
      description: Current hero level.
      integer: true
      minimum: 1
      maximum: 10
    last_tuition_level:
      type: number
      role: state
      description: Hero level at the previous special-talent tuition; zero before the first.
      integer: true
      minimum: 0
      maximum: 10
    talent:
      type: string
      role: input
      description: skinning, butcher or taxidermist.
    already_known:
      type: boolean
      role: state
      description: Per selected talent.
    tuition_cost:
      type: number
      role: output
      description: Printed tutor fee.
      integer: true
      minimum: 0
    learned:
      type: boolean
      role: output
      description: Selected special talent was learned.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: skinning
      object_id: character.settlement.guild.rangers.skinning
      label: Existing special-talent effect.
    - key: butcher
      object_id: character.settlement.guild.rangers.butcher
      label: Existing special-talent effect.
    - key: taxidermist
      object_id: character.settlement.guild.rangers.taxidermist
      label: Existing special-talent effect.
  steps:
    - id: quote
      source_text: A ranger may learn these talents at any time for the tutor fee, but must level up
        before another.
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 0
        - type: set
          target: learned
          value:
            type: literal
            value: false
    - id: quote_skinning
      source_text: Printed special-talent tutor fee.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
          value: skinning
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 250
    - id: quote_butcher
      source_text: Printed special-talent tutor fee.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
          value: butcher
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 200
    - id: quote_taxidermist
      source_text: Printed special-talent tutor fee.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
          value: taxidermist
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 350
    - id: check_tuition
      source_text: Level up once between special talent purchases; afford the selected fee.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: leaving_on_quest
                        right:
                          type: literal
                          value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: access_granted
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: duration_completed
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: guild
                right:
                  type: literal
                  value: rangers
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: ranger
              - type: compare
                operator: eq
                left:
                  type: field
                  name: already_known
                right:
                  type: literal
                  value: false
              - type: compare
                operator: gt
                left:
                  type: field
                  name: level
                right:
                  type: field
                  name: last_tuition_level
              - type: compare
                operator: gt
                left:
                  type: field
                  name: tuition_cost
                right:
                  type: literal
                  value: 0
              - type: compare
                operator: gte
                left:
                  type: field
                  name: coins
                right:
                  type: field
                  name: tuition_cost
    - id: learn_skinning
      source_text: Pay the tutor and acquire the chosen talent once; the next purchase requires another level.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: leaving_on_quest
                        right:
                          type: literal
                          value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: access_granted
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: duration_completed
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: guild
                right:
                  type: literal
                  value: rangers
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: ranger
              - type: compare
                operator: eq
                left:
                  type: field
                  name: already_known
                right:
                  type: literal
                  value: false
              - type: compare
                operator: gt
                left:
                  type: field
                  name: level
                right:
                  type: field
                  name: last_tuition_level
              - type: compare
                operator: gt
                left:
                  type: field
                  name: tuition_cost
                right:
                  type: literal
                  value: 0
              - type: compare
                operator: gte
                left:
                  type: field
                  name: coins
                right:
                  type: field
                  name: tuition_cost
          - type: compare
            operator: eq
            left:
              type: field
              name: talent
            right:
              type: literal
              value: skinning
      effects:
        - type: invoke
          dependency: accounting
        - type: invoke
          dependency: skinning
        - type: add
          target: coins
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: literal
                value: -1
              - type: field
                name: tuition_cost
          duration: permanent
        - type: set
          target: last_tuition_level
          value:
            type: field
            name: level
        - type: set
          target: already_known
          value:
            type: literal
            value: true
        - type: set
          target: learned
          value:
            type: literal
            value: true
    - id: learn_butcher
      source_text: Pay the tutor and acquire the chosen talent once; the next purchase requires another level.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
