  status: extracted
  confidence: high
  source_text: There are several Guilds available, and these are all in Silver City. They are
    described at the end of this chapter. The Guilds are very protective of their skills and
    services, and they will only allow heroes of the appropriate professions to enter. ... Apart
    from visitors recharging magic items, only Wizards are allowed here.
  unresolved_references:
    - The book prints no guild membership fee, enrolment sequence or membership rank; access_granted
      is therefore per operation, not persistent membership.
  issues:
    - issue.guild.wizards_identify_visitors
    - issue.guild.alchemists_access
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service (recharge and identify are the Wizards’ Guild visitor operations).
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: output
      description: Access is permitted for this operation; not persistent guild membership.
  dependencies:
