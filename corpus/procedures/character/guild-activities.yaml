  status: extracted
  confidence: high
  source_text: Just like the dedicated temples, the Inner Sanctum has areas dedicated to each God.
    The Warrior Priest can choose to pray at one of these, and receive the same blessing as granted
    to the other heroes in the temples. The difference is that the gods are more likely to listen,
    and a result of 1-5 will grant this boon. While praying to the Trickster God, a result of 6 will
    still give the deduction of luck as described in the ‘Temple’ section.
  unresolved_references:
    - The Inner Sanctum prints no fee or duration for praying. Whether the temple fee of 50 c and
      the one day from Pray at the Local Temples also apply is issue.guild.sanctum_prayer_fee; the
      caller supplies the reading in sanctum_fee_reading, and without it no prayer is made.
    - Each hero may choose only one temple before each quest. Whether a hero who has prayed may pray
      again to the same god before the next quest is not stated (issue.guild.same_god_prayer_retry).
