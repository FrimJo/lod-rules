- id: procedure.guild_item_service
  name: Guild recharging and item blessings
  section_id: section.settlements.guilds
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 153
      printed_page: 151
      heading: Charging Magic Items; Charges and Recharges
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 158
      printed_page: 156
      heading: Blessing Your Armour and Weapons
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Repaired broken magic items recharge for 250 c; a staff recharge costs half its
    purchase price. The Warrior Priest may have each armour piece blessed for 25 c (+1 durability)
    or a weapon for 75 c (+2 DMG against Undead or Demons), lasting until leaving the next dungeon.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    service_completed:
      type: boolean
      role: state
      description: Per authorized operation and item; prevents replay of its payment or grant.
    item_kind:
      type: string
      role: input
      description: magic_item, staff, armour or weapon.
    item_present:
      type: boolean
      role: input
      description: The selected item is actually held by the hero.
    repaired:
      type: boolean
      role: input
      description: A broken magic item has been repaired before recharging.
    needs_recharge:
      type: boolean
      role: state
      description: Selected item/staff has lost magic or spent charges.
    purchase_price:
      type: number
      role: input
      description: Printed staff purchase price from its existing catalogue.
      integer: true
      minimum: 0
    staff_capacity:
      type: number
      role: input
      description: Printed charge capacity, three unless the catalogue says otherwise.
      integer: true
      minimum: 0
    charges:
      type: number
      role: state
      description: Selected staff charges; special non-charge staves use their own catalogue outcomes.
      integer: true
      minimum: 0
    magic_active:
      type: boolean
      role: state
      description: Selected item’s magical power is active.
    blessing_active:
      type: boolean
      role: state
      description: Selected item already has this temporary blessing.
    temporary_durability_bonus:
      type: number
      role: state
      description: Blessed armour contribution, separate from permanent durability.
      integer: true
      minimum: 0
    undead_demon_damage_bonus:
      type: number
      role: state
      description: Blessed weapon conditional contribution, separate from base damage.
      integer: true
      minimum: 0
    expires_at:
      type: string
      role: state
      description: Source endpoint for the item blessing; lifecycle enforcement belongs to Package F.
    cost:
      type: number
      role: output
      description: Service fee only.
      integer: true
      minimum: 0
    service_eligible:
      type: boolean
      role: output
      description: Specific item/action prerequisites permit service.
    performed:
      type: boolean
      role: output
      description: This call completed the service.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: charging
      object_id: character.settlement.guild.wizards.charging
      label: Repaired magic items.
    - key: staff_rules
      object_id: character.settlement.guild.wizards.staves
      label: Staff-specific capacity and magical effects.
    - key: armour_blessing
      object_id: character.settlement.guild.inner_sanctum.blessed_armour
      label: Temporary armour bonus.
    - key: weapon_blessing
      object_id: character.settlement.guild.inner_sanctum.blessed_weapon
      label: Temporary conditional weapon bonus.
  steps:
    - id: initialize
      source_text: Select the correct guild item service and its fee.
      effects:
        - type: set
          target: cost
          value:
            type: literal
            value: 0
        - type: set
          target: service_eligible
          value:
            type: literal
            value: false
        - type: set
          target: performed
          value:
            type: literal
            value: false
    - id: quote_magic_recharge
      source_text: A broken Magic Item that has been repaired can be recharged for 250 coins.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 153
          printed_page: 151
          heading: Charging Magic Items
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: guild
            right:
              type: literal
              value: wizards
          - type: compare
            operator: eq
            left:
              type: field
              name: operation
            right:
              type: literal
              value: recharge
          - type: compare
            operator: eq
            left:
              type: field
              name: item_kind
            right:
              type: literal
              value: magic_item
          - type: compare
            operator: eq
            left:
              type: field
              name: repaired
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: needs_recharge
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: cost
          value:
            type: literal
            value: 250
        - type: set
          target: service_eligible
          value:
            type: literal
            value: true
    - id: quote_staff_recharge
      source_text:
        Recharging a staff costs half its purchase price; normal capacity is three unless noted
        otherwise.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 153
          printed_page: 151
          heading: Charges and Recharges
          extraction:
            method: text
            confidence: high
