- id: procedure.fighters_bounty
  name: Fighters’ Guild bounty assignment and claim
  section_id: section.fighters_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 151
      printed_page: 149
      heading: Bounty Hunt
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'There is always a list of wanted enemies at the Fighters’ Guild. If you find and kill any of these on your next quest, you can return to receive a reward. Roll on the table 5 times and note down which enemies to hunt until the next time you visit the city. Each creature killed will earn you 250 gold. You can only claim one reward for each kind of enemy.'
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    phase:
      type: string
      role: input
      description: assign or claim.
    offer_initialized:
      type: boolean
      role: state
      description: Shared offered list initialized for this city-to-next-city interval.
    five_rolls_resolved:
      type: boolean
      role: input
      description: All five supplied d100 draws have been resolved against the existing Bounty Hunt table.
    offered_enemy:
      type: string
      role: input
      description: One enemy kind from that offered list; persist claims by kind, merging duplicate rolls.
    enemy_was_offered:
      type: boolean
      role: input
      description: This enemy kind is present in that five-roll list.
    killed_on_next_quest:
      type: boolean
      role: input
      description: Supplied quest trace confirms this enemy was found and killed on the next quest.
    claim_window_valid:
      type: boolean
      role: input
      description: Return is the next visit to the city after the offered hunt; no later quest substitution.
    kind_claimed:
      type: boolean
      role: state
      description: Per offered list and enemy kind; shared by duplicate slots and all kills of that kind.
    claimed:
      type: boolean
      role: output
      description: A single 250-gold bounty was paid on this call.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: bounty_table
      object_id: table.guild.fighters_bounty
      label: Five supplied d100 selections; no absent Bestiary statistics invented.
  steps:
    - id: initialize
      source_text: 'You can only claim one reward for each kind of enemy.'
      effects:
        - type: set
          target: claimed
          value:
            type: literal
            value: false
    - id: assign
      source_text: 'Roll on the table 5 times and note down which enemies to hunt until the next time you visit the city.'
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: leaving_on_quest
                        right:
                          type: literal
                          value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: access_granted
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: duration_completed
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: guild
                right:
                  type: literal
                  value: fighters
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: profession
                    right:
                      type: literal
                      value: warrior
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: profession
                    right:
                      type: literal
                      value: barbarian
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: assign
          - type: compare
            operator: eq
            left:
              type: field
              name: offer_initialized
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: five_rolls_resolved
            right:
              type: literal
              value: true
      effects:
        - type: invoke
          dependency: bounty_table
        - type: set
          target: offer_initialized
          value:
            type: literal
            value: true
    - id: claim
      source_text: 'If you find and kill any of these on your next quest, you can return to receive a reward. ... Each creature killed will earn you 250 gold. You can only claim one reward for each kind of enemy.'
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: leaving_on_quest
                        right:
                          type: literal
                          value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: access_granted
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: duration_completed
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: guild
                right:
                  type: literal
                  value: fighters
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: profession
                    right:
                      type: literal
                      value: warrior
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: profession
                    right:
                      type: literal
                      value: barbarian
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: claim
          - type: compare
            operator: eq
            left:
              type: field
              name: offer_initialized
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_was_offered
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: offered_enemy
            right:
              type: literal
              value: ''
          - type: compare
            operator: eq
            left:
              type: field
              name: killed_on_next_quest
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: claim_window_valid
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: kind_claimed
            right:
              type: literal
              value: false
      effects:
        - type: add
          target: coins
          value:
            type: literal
            value: 250
          duration: permanent
        - type: set
          target: kind_claimed
          value:
            type: literal
            value: true
        - type: set
          target: claimed
          value:
            type: literal
            value: true
  entry_step: initialize
  exit_step: claim
- id: procedure.sanctum_crusade
  name: Inner Sanctum crusade and trophy payment
  section_id: section.the_inner_sanctum.crusades
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
