      integer: true
      minimum: 0
    sanctum_fee_reading:
      type: string
      role: input
      description: 'Caller-supplied reading of issue.guild.sanctum_prayer_fee: temple_fee_and_day
        (the temple fee of 50 c and one day, one Activity Point, apply in the Inner Sanctum) or
        no_fee_or_day (the Inner Sanctum prints neither, so neither applies). Any other value,
        including empty, is not supplied and no prayer is made.'
    god:
