      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Roll on the table below to decide what a crusade has been declared against. ... For
    every enemy the Warrior Priest kills and brings a trophy from, the priest will receive 25 c.
    Now, there is no real way for the High Priests to determine who actually killed the enemy, so it
    does not matter who in the party landed the killing blow. The crusade only lasts until the
    heroes leave the next dungeon. The trophies are considered to be collected automatically and
    the money is paid the next time the Warrior Priest visits the Sanctum.
