            method: text
            confidence: high
            visually_verified: false
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: silver_city
              - type: compare
                operator: eq
                left:
                  type: field
                  name: business_allowed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: leaving_on_quest
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: guild
            right:
              type: literal
              value: dark
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: thief
              - type: compare
                operator: eq
                left:
                  type: field
                  name: profession
                right:
                  type: literal
                  value: rogue
      effects:
