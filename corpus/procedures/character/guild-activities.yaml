          value:
            type: literal
            value: 350
    - id: check_tuition
      source_text: 'Once one of the talents have been learnt, the ranger must level up once before learning another of these talents.'
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: settlement
                        right:
                          type: literal
                          value: silver_city
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: business_allowed
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
