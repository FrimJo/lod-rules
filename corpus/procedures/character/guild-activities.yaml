- id: procedure.ranger_trophy_sale
  name: Sell a Taxidermist trophy
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Taxidermist (350 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Once back in a settlement, roll on the following table to see how much it can be sold for. Roll on the table and add the value to the XP of the creature. If the value is 0 or negative, there is no buyer in that settlement. Only one attempt may be done per settlement. Selling the trophy counts as 1 Activity Point as the Ranger must search for a buyer in the settlement.'
  issues:
    - issue.guild.trophy_sale_settlement_column
  fields:
    settlement_type:
      type: string
      role: input
      description: village or silver_city, the two printed table columns; any other settlement returns the unresolved column issue.
    profession:
      type: string
      role: input
      description: Must be ranger.
    taxidermist_known:
      type: boolean
      role: input
      description: Ranger has learned Taxidermist.
    trophy_available:
      type: boolean
      role: state
      description: One prepared trophy carried from the quest; 15 ENC as recorded by the source.
    sale_attempted_here:
      type: boolean
      role: state
      description: Per trophy and settlement, not per visit; even no buyer consumes the attempt.
    activity_authorized:
      type: boolean
      role: input
      description: A one-Activity-Point trophy-sale reservation in this settlement.
    reserved_activity_points:
      type: number
      role: input
      description: The trophy-sale reservation cost.
      integer: true
      minimum: 0
    duration_completed:
      type: boolean
      role: input
      description: The reserved activity has fully completed.
    business_allowed:
      type: boolean
      role: input
      description: Current visit permits business.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    sale_roll:
      type: number
      role: input
      description: Supplied 1d20.
      integer: true
      minimum: 1
      maximum: 20
    creature_xp:
      type: number
      role: input
      description:
        XP of the Large creature, supplied from the encounter/absent Bestiary without inventing
        stats.
      integer: true
      minimum: 0
    coins:
      type: number
      role: state
      description: Hero proceeds.
      integer: true
      minimum: 0
    sale_modifier:
      type: number
      role: output
      description: Printed settlement/roll adjustment.
      integer: true
      minimum: -500
    sale_value:
      type: number
      role: output
      description: Creature XP plus the printed adjustment.
      integer: true
      minimum: -500
    attempted:
      type: boolean
      role: output
      description: A sale attempt was made on this call.
    sold:
      type: boolean
      role: output
      description: A buyer paid and removed the trophy.
  dependencies:
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One-point reservation and party lodging; not charged again.
    - key: sale_table
      object_id: table.guild.taxidermy_sale
      label: Complete printed modifiers.
    - key: trophy_capture
      object_id: character.settlement.guild.rangers.taxidermist
      label: Large-creature Foraging, one trophy per quest and 15 ENC; supplied trophy capture outcome.
    - key: sale_rule
      object_id: character.settlement.guild.rangers.trophy_sale
      label: One attempt per settlement, 1 Activity Point, no buyer at 0 or below.
  steps:
    - id: initialize
      source_text: 'Selling the trophy counts as 1 Activity Point as the Ranger must search for a buyer in the settlement.'
      effects:
        - type: set
          target: sale_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: sale_value
          value:
            type: literal
            value: 0
        - type: set
          target: attempted
          value:
            type: literal
            value: false
        - type: set
          target: sold
          value:
            type: literal
            value: false
    - id: settlement_column_undefined
      source_text: 'Once back in a settlement, roll on the following table to see how much it can be sold for.'
      when:
        type: all
        conditions:
          - type: compare
            operator: ne
            left:
              type: field
              name: settlement_type
            right:
              type: literal
              value: village
          - type: compare
            operator: ne
            left:
              type: field
              name: settlement_type
            right:
              type: literal
              value: silver_city
      effects:
        - type: unresolved
          issue_id: issue.guild.trophy_sale_settlement_column
    - id: quote_village_1
      source_text: 'Roll on the table and add the value to the XP of the creature.'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: settlement_type
            right:
              type: literal
              value: village
          - type: compare
            operator: gte
            left:
              type: field
              name: sale_roll
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
            left:
              type: field
              name: sale_roll
            right:
              type: literal
              value: 1
      effects:
        - type: set
          target: sale_modifier
          value:
            type: literal
            value: -500
    - id: quote_silver_city_1
      source_text: 'Roll on the table and add the value to the XP of the creature.'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: settlement_type
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: gte
            left:
              type: field
              name: sale_roll
            right:
              type: literal
              value: 1
          - type: compare
            operator: lte
