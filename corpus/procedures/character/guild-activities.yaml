  status: extracted
  confidence: high
  source_text: All guilds are in Silver City. Their services are restricted to the appropriate
    professions. The Wizards’ Guild separately admits visitors recharging magic items. The source
    gives no membership fee, enrolment sequence or membership rank.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: output
      description: Access is permitted for this operation; not persistent guild membership.
  dependencies:
