            method: text
            confidence: high
            visually_verified: false
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: silver_city
              - type: compare
                operator: eq
                left:
                  type: field
                  name: business_allowed
                right:
                  type: literal
                  value: true
              - type: compare
