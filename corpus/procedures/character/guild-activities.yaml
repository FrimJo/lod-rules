  source_text: A Warrior Priest prays to one god in the Inner Sanctum. The ordinary temple prayer
    costs 50 c, takes one day, and lasts until leaving the next dungeon. The Sanctum grants the same
    boon on 1–5; the Trickster on 6 has an unspecified Luck deduction.
