  status: extracted
  confidence: high
  source_text: >-
    The Guilds are very protective of their skills and services, and they will only
    allow heroes of the appropriate professions to enter. ... There is certain equipment for sale at
    the Dark Guild that can be of use during a quest: ... Some specialised equipment is only sold at
    the Fighters’ Guild. ... However, magical staffs are comparably common, ... At the Alchemists’
    Guild, you can purchase both parts and ingredients, when they are available. To purchase a part,
    check the availability in the table below. If you succeed with the Availability Roll, you may
    choose any kind of part from that enemy. A part or ingredient costs 15 c. There are some parts
    that are not sold, as dealing with human body parts is illegal. Potions can be bought here. ...
    All Standard Potions have an availability of 5, whereas Weak Potions are always in stock.
    Supreme versions have an availability of 4. ... Some equipment is only sold in the Rangers’
    Guild. ... Here you can buy special things that are usually only available to the Warrior
    Priests.
  unresolved_references:
    - The guild pages print what each guild sells, its price and its availability but no separate
      purchase sequence. This procedure only authorizes the purchase (access, completed activity and
      a resolved catalogue offering) and hands the quote to ordinary settlement purchasing, which
      makes the Availability Roll, charges the price and changes inventory exactly once.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    item_catalogue_resolved:
      type: boolean
      role: input
      description:
        Selected item, guild offering, price, availability, profession restrictions and special
        acquisition conditions were resolved from the existing guild/item tables.
    service_eligible:
      type: boolean
      role: output
      description:
        Pass this result into the existing buy/sell/service procedure for this same item and
        reservation.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: purchase
      object_id: procedure.settlement_buy_sell_and_service
      label:
        Owns the availability attempt, shared per-item lock, price and inventory mutation; invoke is
        a handoff, not another purchase.
