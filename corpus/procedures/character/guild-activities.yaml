                          name: leaving_on_quest
                        right:
                          type: literal
                          value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: access_granted
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: activity_authorized
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: duration_completed
                    right:
