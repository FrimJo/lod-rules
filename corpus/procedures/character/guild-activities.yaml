- id: procedure.ranger_special_talent
  name: Ranger special-talent tuition
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Special talents
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Skinning (250 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Butcher (200 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Taxidermist (350 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'A ranger may learn the following talents at any time by paying the tutor fee. Once one of the talents have been learnt, the ranger must level up once before learning another of these talents. ... Skinning (250 c) ... Butcher (200 c) ... Taxidermist (350 c)'
  unresolved_references:
    - The book does not say where the tutor fee is paid or whether "at any time" needs a settlement
      visit. Requiring Silver City, Rangers’ Guild access and an authorized, completed settlement
      activity is a reading the page does not print (issue.guild.ranger_talent_any_time).
  issues:
    - issue.guild.ranger_talent_any_time
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    level:
      type: number
      role: input
      description: Current hero level.
      integer: true
      minimum: 1
      maximum: 10
    last_tuition_level:
      type: number
      role: state
      description: Hero level at the previous special-talent tuition; zero before the first.
      integer: true
      minimum: 0
      maximum: 10
    talent:
      type: string
      role: input
      description: skinning, butcher or taxidermist.
    already_known:
      type: boolean
      role: state
      description: Per selected talent.
    tuition_cost:
      type: number
      role: output
      description: Printed tutor fee.
      integer: true
      minimum: 0
    learned:
      type: boolean
      role: output
      description: Selected special talent was learned.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: skinning
      object_id: character.settlement.guild.rangers.skinning
      label: Existing special-talent effect.
    - key: butcher
      object_id: character.settlement.guild.rangers.butcher
      label: Existing special-talent effect.
    - key: taxidermist
      object_id: character.settlement.guild.rangers.taxidermist
      label: Existing special-talent effect.
  steps:
    - id: quote
      source_text: 'A ranger may learn the following talents at any time by paying the tutor fee.'
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 0
        - type: set
          target: learned
          value:
            type: literal
            value: false
    - id: quote_skinning
      source_text: 'Skinning (250 c)'
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
          value: skinning
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 250
    - id: quote_butcher
      source_text: 'Butcher (200 c)'
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
          value: butcher
      effects:
        - type: set
          target: tuition_cost
          value:
            type: literal
            value: 200
    - id: quote_taxidermist
      source_text: 'Taxidermist (350 c)'
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: talent
        right:
          type: literal
