- id: procedure.guild_item_service
  name: Guild recharging and item blessings
  section_id: section.wizards_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 153
      printed_page: 151
      heading: Charging Magic Items; Charges and Recharges
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 158
      printed_page: 156
      heading: Blessing Your Armour and Weapons
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A broken Magic Item that has been repaired can be recharged for 250 coins. ...
    Staffs have three charges unless noted otherwise. This means that the spell bound in the staff
    can be cast three times before it needs to be recharged. Recharging a staff costs half of the
    purchase price of the staff. ... The Warrior Priests may seek to have their armour or weapon
    blessed by one of the High Priests. ... Each piece of armour must be individually blessed to
    give the proper protection. As this is tedious work, the High Priests have decided to take a fee
    of 25 c per piece to make this feasible. Blessed Armour will benefit from +1 durability, and it
    will last until the heroes leave the next dungeon. ... Any Undead or Demon struck by such a
    weapon suffers a further 2 points of DMG. Blessing a weapon costs 75 c and lasts until the
    heroes leave the next dungeon.
  unresolved_references:
    - The book prints the service fees but not how payment, Activity Points or lodging are
      accounted. The procedure charges the fee once per authorized operation and item, requires the
      fee to be affordable, and leaves activity time and lodging to settlement accounting.
    - Staves whose catalogue rows print a different recharge outcome (for example the Arcane Staff
      and Staff of the Heart) keep that outcome; the charge reset applies the printed three-charge
      default.
  fields:
    settlement:
      type: string
      role: input
      description: Guilds are in Silver City.
    profession:
      type: string
      role: input
      description: Stable profession ID suffix.
    guild:
      type: string
      role: input
      description: Stable guild ID suffix.
    operation:
      type: string
      role: input
      description: Requested guild service.
    business_allowed:
      type: boolean
      role: input
      description: Supplied visit authorization.
    leaving_on_quest:
      type: boolean
      role: input
      description: No settlement activities on quest departure day.
    access_granted:
      type: boolean
      role: input
      description: Confirmed guild_access result for this same operation.
    activity_authorized:
      type: boolean
      role: input
      description: Correct guild/service reservation supplied by settlement accounting.
    duration_completed:
      type: boolean
      role: input
      description: The authorized activity has completed; no outcome is granted on reservation alone.
    coins:
      type: number
      role: state
      description: Hero or designated payer coins; lodging and activity costs stay in settlement accounting.
      integer: true
      minimum: 0
    service_completed:
      type: boolean
      role: state
      description: Per authorized operation and item; prevents replay of its payment or grant.
    item_kind:
      type: string
      role: input
      description: magic_item, staff, armour or weapon.
    item_present:
      type: boolean
      role: input
      description: The selected item is actually held by the hero.
    repaired:
      type: boolean
      role: input
      description: A broken magic item has been repaired before recharging.
    needs_recharge:
      type: boolean
      role: state
      description: Selected item/staff has lost magic or spent charges.
    purchase_price:
      type: number
      role: input
      description: Printed staff purchase price from its existing catalogue.
      integer: true
      minimum: 0
    staff_capacity:
      type: number
      role: input
      description: Printed charge capacity, three unless the catalogue says otherwise.
      integer: true
      minimum: 0
    charges:
      type: number
      role: state
      description: Selected staff charges; special non-charge staves use their own catalogue outcomes.
      integer: true
      minimum: 0
    magic_active:
      type: boolean
      role: state
      description: Selected item’s magical power is active.
    blessing_active:
      type: boolean
      role: state
      description: Selected item already has this temporary blessing.
    temporary_durability_bonus:
      type: number
      role: state
      description: Blessed armour contribution, separate from permanent durability.
      integer: true
      minimum: 0
    undead_demon_damage_bonus:
      type: number
      role: state
      description: Blessed weapon conditional contribution, separate from base damage.
      integer: true
      minimum: 0
    expires_at:
      type: string
      role: state
      description: Source endpoint for the item blessing; lifecycle enforcement belongs to Package F.
    cost:
      type: number
      role: output
      description: Service fee only.
      integer: true
      minimum: 0
    service_eligible:
      type: boolean
      role: output
      description: Specific item/action prerequisites permit service.
    performed:
      type: boolean
      role: output
      description: This call completed the service.
  dependencies:
    - key: access
      object_id: procedure.guild_access
      label: Check access for this operation.
    - key: accounting
      object_id: procedure.settlement_activities_and_overnight
      label: One reservation owns activity time and party lodging; this procedure never charges them
        again.
    - key: charging
      object_id: character.settlement.guild.wizards.charging
      label: Repaired magic items.
    - key: staff_rules
