- id: procedure.ranger_trophy_sale
  name: Sell a Taxidermist trophy
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Taxidermist (350 c)
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text:
    A Ranger may take one 15-ENC trophy per quest from a Large creature after a successful
    Foraging roll. In a settlement, roll 1d20 and add the printed adjustment to the creature XP.
    Zero or negative means no buyer; only one attempt per settlement. Searching for a buyer costs
    one Activity Point.
  fields:
    settlement_type:
      type: string
      role: input
      description: village or silver_city.
    profession:
      type: string
      role: input
      description: Must be ranger.
    taxidermist_known:
      type: boolean
      role: input
      description: Ranger has learned Taxidermist.
    trophy_available:
      type: boolean
      role: state
      description: One prepared trophy carried from the quest; 15 ENC as recorded by the source.
    sale_attempted_here:
      type: boolean
      role: state
      description: Per trophy and settlement, not per visit; even no buyer consumes the attempt.
    activity_authorized:
