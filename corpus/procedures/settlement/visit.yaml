  status: extracted
  confidence: high
  source_text: Each hero may perform activities worth one Activity Point per day, but performing an
    activity also means that you must stay for the night at the inn. Note that the price for staying
    at the inn is for the entire party, regardless of its size. Not all activities are available at
    all settlements ... Therefore, leaving on a quest is always done early in the morning. No other
    settlement activities are allowed on that day. ... The heroes may choose from the activities
    listed in the table below, as long as the settlement offers that specific service. Some
    activities cost 0 Action Points which means they can be done for free. Those which cost more
    than 1 Activity Point take longer than a day to perform. During those days nothing else can be
    done. If one member of the party decides to do something that takes a long time, and the other
    party members are done, they must also stay at the inn. ... For some coins, the members of the
    party may regain their health, luck and energy, by sleeping in the relative comfort of the beds
    at one of the city inns, or in their own home. ... Once the heroes have the key, they are free
    to stay at the house in between quests. Now they do not have to pay the daily cost of at the
    inns.
