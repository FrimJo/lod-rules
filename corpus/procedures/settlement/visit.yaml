    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 135
      printed_page: 133
      heading: 'Settlement Events: Settlement Feast'
      extraction: *a13
  status: extracted
  confidence: high
  source_text: 'Equipment can be bought and sold at the various shops in the market. ... Once there,
    locate what you want to buy and roll for its availability (1d6). You may buy one piece for each
    successful roll, but as soon as you fail a roll, you or any other hero may not buy that specific
    piece of equipment until you return to the settlement at a later time. Selling equipment is
    always done using the Sell Table in the Equipment Appendix, or by using the price noted on
    Treasure Cards. The selling price is not affected by local price variations, except if they are
    triggered by an event. ... The monks in a Sick Ward or at a Temple of Metheia are able to treat
    most illnesses, but it will cost you 100 c. It will take one day. ... Identifying Magic Items
    can be done by a Scryer or at the Wizards’ Guild in Silver City. The price for this is 150 c.
    Identifying potions can be done at the General Store or the Alchemist Guild for 25 c. ...
    Repairing equipment is done by paying the amount of money listed in the ‘Repair Column’ in the
    Sell Table (See Appendix III: Equipment, page 184). This can be done while shopping or selling
    at the General Store for gear, and at the Blacksmith for weapons and armour. ... At a cost of
    1000 c, they will try to cure one disorder. ... If the party is back after a finished quest the
    party will first receive their reward, if any was promised. This can only be done in the
    settlement where you accepted the quest.'
  fields:
