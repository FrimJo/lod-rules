  dependencies:
    - key: activity_catalogue
      label: Available Actions
      object_id: table.settlement.activities
    - key: lodging
      label: Settlement recovery rule
      object_id: character.settlement.rest
    - key: estate
      label: Owned estate lodging
      object_id: character.settlement.estate.lodging
  steps:
    - id: new_visit
      source_text:
        Once luck has been restored, any use of luck after this will not be restored until the
        next visit to a settlement.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: new_visit
          - type: compare
            operator: gt
            left:
              type: field
              name: visit_id
            right:
              type: field
              name: hero_visit_id
      effects:
        - type: set
          target: hero_visit_id
          value:
            type: field
            name: visit_id
        - type: set
          target: luck_restored_this_visit
          value:
            type: literal
            value: false
        - type: set
          target: activity_reserved
          value:
            type: literal
            value: false
    - id: new_party_visit
      source_text: Note that the price for staying at the inn is for the entire party, regardless of its size.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: new_visit
          - type: compare
            operator: gt
            left:
              type: field
              name: visit_id
            right:
              type: field
              name: party_visit_id
      effects:
        - type: set
          target: party_visit_id
          value:
            type: field
            name: visit_id
        - type: set
          target: lodging_day
          value:
            type: sum
            values:
              - type: field
                name: day
              - type: literal
                value: -1
        - type: set
          target: party_occupied_until
          value:
            type: sum
            values:
              - type: field
                name: day
              - type: literal
                value: -1
        - type: set
          target: last_activity_day
          value:
            type: sum
            values:
              - type: field
                name: day
              - type: literal
                value: -1
        - type: set
          target: inn_nights
          value:
            type: literal
            value: 0
        - type: set
          target: must_leave_next_morning
          value:
            type: literal
            value: false
    - id: start_day
      source_text: Each hero may perform activities worth one Activity Point per day
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: start_day
          - type: compare
            operator: gt
            left:
              type: field
              name: day
            right:
              type: field
              name: hero_day
      effects:
        - type: set
          target: hero_day
          value:
            type: field
            name: day
        - type: set
          target: hero_activity_points
          value:
            type: literal
            value: 1
        - type: set
          target: activity_reserved
          value:
            type: literal
            value: false
    - id: occupied_day
      source_text:
        Those which cost more than 1 Activity Point take longer than a day to perform. During
        those days nothing else can be done.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: start_day
          - type: compare
            operator: lte
            left:
              type: field
              name: day
            right:
              type: field
              name: hero_occupied_until
      effects:
        - type: set
          target: hero_activity_points
          value:
            type: literal
            value: 0
    - id: confirm_service
      source_text:
        The heroes may choose from the activities listed in the table below, as long as the
        settlement offers that specific service. ... Each hero may perform activities worth one
        Activity Point per day, but performing an activity also means that you must stay for the
        night at the inn. ... No other settlement activities are allowed on that day.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: phase
        right:
          type: literal
          value: activity
      effects:
        - type: set
          target: activity_reserved
          value:
            type: literal
            value: false
        - type: require
          condition: &a4
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: activity
              - type: compare
                operator: eq
                left:
                  type: field
                  name: hero_day
                right:
                  type: field
                  name: day
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: leaving_on_quest
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: must_leave_next_morning
                    right:
                      type: literal
                      value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: business_allowed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: activity_available
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: service_eligible
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: hero_occupied_until
              - type: compare
                operator: gte
                left:
                  type: field
                  name: hero_activity_points
                right:
                  type: arithmetic
                  operator: min
                  values:
                    - type: literal
                      value: 1
                    - type: field
                      name: activity_cost
              - type: all
                conditions:
                  - type: any
                    conditions:
                      - type: compare
                        operator: ne
                        left:
                          type: field
                          name: activity
                        right:
                          type: literal
                          value: create_scroll
                      - type: all
                        conditions:
                          - type: compare
                            operator: lt
                            left:
                              type: field
                              name: scroll_activities
                            right:
                              type: literal
                              value: 2
                          - type: compare
                            operator: eq
                            left:
                              type: field
                              name: enchant_activities
                            right:
                              type: literal
                              value: 0
                  - type: any
                    conditions:
                      - type: compare
                        operator: ne
                        left:
                          type: field
                          name: activity
                        right:
                          type: literal
                          value: enchant
                      - type: all
                        conditions:
                          - type: compare
                            operator: lt
                            left:
                              type: field
                              name: enchant_activities
                            right:
                              type: literal
                              value: 1
                          - type: compare
                            operator: eq
                            left:
                              type: field
                              name: scroll_activities
                            right:
                              type: literal
                              value: 0
        - type: require
          condition: &a5
            type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: activity_requires_inn
                right:
                  type: literal
                  value: false
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: inn_available
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: lodging_choice
                    right:
                      type: literal
                      value: inn
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: coins
                    right:
                      type: field
                      name: inn_price_per_party
        - type: require
          condition:
            type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
    - id: reserve_activity_days
      source_text:
        If one member of the party decides to do something that takes a long time, and the
        other party members are done, they must also stay at the inn.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - *a4
              - *a5
          - type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
      effects:
        - type: set
          target: activity_reserved
          value:
            type: literal
            value: true
        - type: set
          target: hero_activity_points
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: hero_activity_points
              - type: arithmetic
                operator: min
                values:
                  - type: literal
                    value: 1
                  - type: field
                    name: activity_cost
        - type: set
          target: last_activity_day
          value:
            type: field
            name: day
        - type: set
          target: party_activity_days
          value:
            type: arithmetic
            operator: max
            values:
              - type: field
                name: party_activity_days
              - type: field
                name: activity_cost
        - type: set
          target: party_occupied_until
          value:
            type: arithmetic
            operator: max
            values:
              - type: field
                name: party_occupied_until
              - type: sum
                values:
                  - type: field
                    name: day
                  - type: arithmetic
                    operator: max
                    values:
                      - type: literal
                        value: 0
                      - type: arithmetic
                        operator: subtract
                        values:
                          - type: field
                            name: activity_cost
                          - type: literal
                            value: 1
        - type: invoke
          dependency: activity_catalogue
    - id: scroll_limit
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
          locator:
            row: Create a Scroll
          extraction:
            method: table
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 71
          printed_page: 69
          heading: Enchantments Take Time
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Create a Scroll ... 1 per Scroll. Max 2. ... Only one object or two attempts
        (successful or not) to create scrolls may be done between quests.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: activity
          - type: compare
            operator: eq
            left:
              type: field
