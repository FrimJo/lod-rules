        charged for each item.
    quote_supplied:
      type: boolean
      role: input
      description: The base price or Sell/Repair value is supplied from the source-backed catalogue.
    item_present:
      type: boolean
      role: input
      description: item present
    treatment_succeeds:
      type: boolean
      role: input
      description:
        Supplied treatment outcome. Mental treatment uses treatment_roll instead. For disease
        or poison only true is source-defined; false surfaces
        issue.settlement.illness_treatment_limits without charging or curing.
    purchase_price:
      type: number
      role: output
      description: Derived catalogue price when there is a single modifier source; an overlapping
        local/event quote must be explicitly resolved.
      minimum: 0
    sale_value:
      type: number
      role: input
      description:
        Sell Table or Treasure Card value before event changes. Local price variations are
        deliberately ignored.
      minimum: 0
    repair_price:
      type: number
      role: input
      description: repair price
      minimum: 0
    event_sale_multiplier:
      type: number
      role: input
      description:
        Supplied event price factor, 1 without a price-changing event. Local modifiers never
        enter sale arithmetic.
      minimum: 0
    local_price_modifier:
      type: number
      role: input
      description: local price modifier
    coins:
      type: number
      role: state
      description: coins
      minimum: 0
    inventory_count:
      type: number
      role: state
      description: inventory count
      integer: true
      minimum: 0
    durability:
      type: number
      role: state
      description: durability
    maximum_durability:
      type: number
      role: input
      description: maximum durability
    identified:
      type: boolean
      role: state
      description: identified
    diseased:
      type: boolean
      role: state
      description: diseased
    poisoned:
      type: boolean
      role: state
      description: poisoned
    mental_attempt_used:
      type: boolean
      role: state
      description: mental attempt used
    mental_conditions:
      type: number
      role: state
      description: mental conditions
      integer: true
      minimum: 0
    treatment_roll:
      type: number
      role: input
      description: treatment roll
      integer: true
      minimum: 1
      maximum: 6
    purchase_attempted:
      type: boolean
      role: output
      description: purchase attempted
    service_completed:
      type: boolean
      role: output
      description: service completed
    transaction_eligible:
      type: boolean
      role: output
      description: transaction eligible
    service_cost:
      type: number
      role: output
      description: service cost
    day:
      type: number
      role: input
      description: day
      integer: true
      minimum: 0
    activity_completion_day:
      type: number
      role: input
      description: activity completion day
      integer: true
      minimum: 0
    last_treatment_day:
      type: number
      role: state
      description: last treatment day
      integer: true
      minimum: -1
    quest_departure_day:
      type: number
      role: input
      description: quest departure day
      integer: true
      minimum: -1
    quest_completed:
      type: boolean
      role: input
      description: quest completed
    reward_promised:
      type: boolean
      role: input
      description: reward promised
    at_quest_start_settlement:
      type: boolean
      role: input
      description: at quest start settlement
    reward_collected:
      type: boolean
      role: state
      description: reward collected
    reward_value:
      type: number
      role: input
      description: reward value
      minimum: 0
    base_purchase_price:
      type: number
      role: input
      description: base purchase price
      minimum: 0
    quoted_purchase_price:
      type: number
      role: input
      description: quoted purchase price
      minimum: 0
    event_price_modifier:
      type: number
      role: input
      description: event price modifier
    event_price_delta:
      type: number
      role: input
      description: event price delta
    combined_price_resolved:
      type: boolean
      role: input
      description: combined price resolved
    purchase_quote_ready:
      type: boolean
      role: output
      description: purchase quote ready
    already_poisoned:
      type: boolean
      role: state
      description:
        Current poison-condition checkpoint shared with procedure.damage_follow_up; a supplied
        successful poison treatment clears it with poisoned.
    remaining_poison_rolls:
      type: number
      role: state
      description:
        Remaining checks owned by the treated hero/poison episode; successful poison treatment
        cancels them.
    poison_rolls_due:
      type: number
      role: state
      description: Pending poison-check handoff count for that episode, cancelled after a successful treatment.
    cured:
      type: boolean
      role: state
      description:
        Confirmed poison removal from this successful poison-treatment operation; unrelated
        diseases and HP are not healed by this flag.
    disease_penalty_active:
      type: boolean
      role: state
      description:
        Current disease-episode stat-loss applicability. Successful supplied disease treatment
        clears this modifier without guessing numeric base-stat restoration.
  dependencies:
    - key: equipment_catalogue
      label: Sell and Repair prices
      object_id: character.durability.repair_price
    - key: service_catalogue
      label: Settlement service catalogue
      object_id: character.settlement.buying
    - key: availability
      label: Availability roll and item purchase
    - key: service_outcome
      label: Explicitly supplied treatment or identification outcome
  steps:
    - id: initialise_transaction
      source_text:
        Equipment can be bought and sold at the various shops in the market. Depending on what
        you need, you must visit different shops.
      effects:
        - type: set
          target: purchase_attempted
          value:
            type: literal
            value: false
        - type: set
          target: service_completed
          value:
            type: literal
            value: false
        - type: set
          target: transaction_eligible
          value:
            type: literal
            value: false
        - type: set
          target: service_cost
          value:
            type: literal
            value: 0
        - type: set
          target: purchase_quote_ready
          value:
            type: literal
            value: false
    - id: release_return_lock
      source_text:
        as soon as you fail a roll, you or any other hero may not buy that specific piece of
        equipment until you return to the settlement at a later time.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: item_locked_until_return
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: visit_id
            right:
              type: field
              name: item_lock_visit
      effects:
        - type: set
          target: item_locked_until_return
          value:
            type: literal
            value: false
    - id: check_service_guard
      source_text:
        Depending on what you need, you must visit different shops. Once there, locate what you
        want to buy and roll for its availability (1d6).
      effects:
        - type: require
          condition: &a17
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: service_available
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: service_eligible
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: business_allowed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: leaving_on_quest
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: activity_authorized
                right:
                  type: literal
                  value: true
        - type: require
          condition: &a19
            type: compare
            operator: gte
            left:
              type: field
              name: day
            right:
              type: field
              name: activity_completion_day
        - type: require
          condition:
            type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
      when:
        type: compare
        operator: ne
        left:
          type: field
          name: operation
        right:
          type: literal
          value: collect_reward
    - id: local_purchase_price
      source_text: Unless noted otherwise, prices and availability are unchanged.
      when:
        type: all
        conditions:
          - &a14
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: operation
                right:
                  type: literal
                  value: purchase
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quote_supplied
                right:
                  type: literal
                  value: true
          - type: not
            condition: &a15
              type: any
              conditions:
                - type: compare
                  operator: ne
                  left:
                    type: field
                    name: event_price_modifier
                  right:
                    type: literal
                    value: 0
                - type: compare
                  operator: ne
                  left:
                    type: field
                    name: event_price_delta
                  right:
                    type: literal
                    value: 0
      effects:
        - type: set
          target: purchase_price
          value:
            type: arithmetic
            operator: divide
            values:
              - type: arithmetic
                operator: multiply
                values:
                  - type: field
                    name: base_purchase_price
                  - type: sum
                    values:
                      - type: literal
                        value: 100
                      - type: field
                        name: local_price_modifier
              - type: literal
                value: 100
        - type: set
          target: purchase_quote_ready
          value:
            type: literal
            value: true
    - id: event_purchase_price
      source_text:
        Sale! There seems to be a settlement-wide sale going on. All stores sell their items at
        a 20% discount. ... As a result, prices have also gone up, resulting in a +10% price
        modifier on all items.
      when:
        type: all
        conditions:
          - *a14
          - type: compare
            operator: eq
            left:
              type: field
              name: local_price_modifier
            right:
              type: literal
              value: 0
          - *a15
      effects:
        - type: set
          target: purchase_price
          value:
            type: sum
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: field
                        name: base_purchase_price
                      - type: sum
                        values:
                          - type: literal
                            value: 100
                          - type: field
                            name: event_price_modifier
                  - type: literal
                    value: 100
              - type: field
                name: event_price_delta
        - type: set
          target: purchase_quote_ready
          value:
            type: literal
            value: true
    - id: combined_price_boundary
      source_text: Unless noted otherwise, prices and availability are unchanged.
      when:
        type: all
        conditions:
          - *a14
          - &a16
            type: all
            conditions:
              - type: compare
                operator: ne
                left:
                  type: field
                  name: local_price_modifier
                right:
                  type: literal
                  value: 0
              - *a15
          - type: compare
            operator: eq
            left:
              type: field
              name: combined_price_resolved
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.settlement.price_modifier_combination
    - id: supplied_combined_quote
      source_text: Unless noted otherwise, prices and availability are unchanged.
      when:
        type: all
        conditions:
          - *a14
          - *a16
          - type: compare
            operator: eq
            left:
              type: field
              name: combined_price_resolved
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: purchase_price
          value:
            type: field
            name: quoted_purchase_price
        - type: set
          target: purchase_quote_ready
          value:
            type: literal
            value: true
    - id: check_purchase_funds
      source_text: Once there, locate what you want to buy and roll for its availability (1d6).
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: operation
        right:
          type: literal
          value: purchase
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: purchase_quote_ready
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gte
                left:
                  type: field
                  name: purchase_price
                right:
                  type: literal
                  value: 0
              - &a18
                type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: operation
                    right:
                      type: literal
                      value: purchase
                  - *a17
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: item_locked_until_return
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: quote_supplied
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: coins
                    right:
                      type: field
                      name: purchase_price
    - id: purchase_availability
      source_text: Once there, locate what you want to buy and roll for its availability (1d6).
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: purchase_quote_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: purchase_price
            right:
              type: literal
              value: 0
          - type: all
            conditions:
              - type: all
                conditions:
                  - *a18
                  - *a19
              - type: compare
                operator: ne
                left:
                  type: field
                  name: quest_departure_day
                right:
                  type: field
                  name: day
      effects:
        - type: set
          target: purchase_attempted
          value:
            type: literal
            value: true
        - type: invoke
          dependency: availability
    - id: failed_roll_lock
      source_text:
        as soon as you fail a roll, you or any other hero may not buy that specific piece of
        equipment until you return to the settlement at a later time.
      when:
        type: all
        conditions:
          - &a20
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: operation
                right:
                  type: literal
                  value: purchase
              - type: compare
                operator: eq
                left:
                  type: field
                  name: purchase_attempted
                right:
                  type: literal
                  value: true
          - type: not
            condition: &a21
              type: any
              conditions:
                - type: compare
                  operator: gte
                  left:
                    type: field
                    name: item_availability
                  right:
                    type: literal
                    value: 6
                - type: all
                  conditions:
                    - type: compare
                      operator: gt
                      left:
                        type: field
                        name: item_availability
                      right:
                        type: literal
                        value: 0
                    - type: compare
                      operator: lte
                      left:
                        type: field
                        name: availability_roll
                      right:
                        type: field
                        name: item_availability
      effects:
        - type: set
          target: item_locked_until_return
          value:
            type: literal
            value: true
        - type: set
          target: item_lock_visit
          value:
            type: field
            name: visit_id
    - id: purchase_one
      source_text: 'You may buy one piece for each successful roll'
      when:
        type: all
        conditions:
          - *a20
          - *a21
      effects:
        - type: set
          target: coins
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: coins
              - type: field
                name: purchase_price
        - type: set
          target: inventory_count
          value:
            type: sum
            values:
              - type: field
                name: inventory_count
              - type: literal
                value: 1
        - type: set
          target: service_completed
          value:
            type: literal
            value: true
    - id: sell
      source_text:
        Selling equipment is always done using the Sell Table in the Equipment Appendix, or by
        using the price noted on Treasure Cards. The selling price is not affected by local price
        variations, except if they are triggered by an event.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: operation
                    right:
                      type: literal
                      value: sale
                  - *a17
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: quote_supplied
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: inventory_count
                    right:
                      type: literal
                      value: 1
              - *a19
          - type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
      effects:
        - type: set
          target: coins
          value:
            type: sum
            values:
              - type: field
                name: coins
              - type: arithmetic
                operator: multiply
                values:
                  - type: field
                    name: sale_value
                  - type: field
                    name: event_sale_multiplier
        - type: set
          target: inventory_count
          value:
            type: sum
            values:
              - type: field
                name: inventory_count
              - type: literal
                value: -1
        - type: set
          target: service_completed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: equipment_catalogue
    - id: repair_price
      source_text: 'Repairing equipment is done by paying the amount of money listed in the ‘Repair
        Column’ in the Sell Table (See Appendix III: Equipment, page 184).'
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: operation
        right:
          type: literal
          value: repair
      effects:
        - type: set
          target: service_cost
          value:
            type: field
            name: repair_price
    - id: magic_identification_price
      source_text:
        Identifying Magic Items can be done by a Scryer or at the Wizards’ Guild in Silver
        City. The price for this is 150 c.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: operation
        right:
          type: literal
          value: identify_magic
      effects:
        - type: set
          target: service_cost
          value:
            type: literal
            value: 150
    - id: potion_identification_price
      source_text: Identifying potions can be done at the General Store or the Alchemist Guild for 25 c.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: operation
        right:
          type: literal
          value: identify_potion
      effects:
        - type: set
          target: service_cost
          value:
            type: literal
            value: 25
    - id: illness_treatment_price
      source_text:
        The monks in a Sick Ward or at a Temple of Metheia are able to treat most illnesses,
        but it will cost you 100 c. It will take one day.
      when:
        type: any
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: operation
            right:
              type: literal
              value: cure_disease
          - type: compare
            operator: eq
            left:
              type: field
              name: operation
            right:
              type: literal
              value: cure_poison
      effects:
        - type: set
          target: service_cost
          value:
            type: literal
            value: 100
    - id: mental_treatment_price
      source_text:
        At a cost of 1000 c, they will try to cure one disorder. However, each hero can only
        attempt to cure one of their disorders in between each quest, ... The treatment takes 5
        days.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: operation
        right:
          type: literal
          value: treat_mental
      effects:
        - type: set
          target: service_cost
          value:
            type: literal
            value: 1000
    - id: repair_eligibility
      source_text:
        This can be done while shopping or selling at the General Store for gear, and at the
        Blacksmith for weapons and armour.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: operation
                        right:
                          type: literal
                          value: repair
                      - *a17
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: item_present
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: quote_supplied
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: gte
                        left:
                          type: field
                          name: coins
                        right:
                          type: field
                          name: service_cost
                  - *a19
              - type: compare
                operator: lt
                left:
                  type: field
                  name: durability
                right:
                  type: field
                  name: maximum_durability
          - type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
      effects:
        - type: set
          target: transaction_eligible
          value:
            type: literal
            value: true
    - id: identify_eligibility
      source_text:
        Identifying Magic Items can be done by a Scryer or at the Wizards’ Guild in Silver
        City. ... Identifying potions can be done at the General Store or the Alchemist Guild for 25
        c.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: operation
                        right:
                          type: literal
                          value: identify_magic
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: operation
                        right:
                          type: literal
                          value: identify_potion
                  - *a17
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: item_present
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: identified
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: coins
                    right:
                      type: field
                      name: service_cost
              - *a19
          - type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
      effects:
        - type: set
          target: transaction_eligible
          value:
            type: literal
            value: true
    - id: illness_eligibility
      source_text: This is where the sick and poisoned come to seek treatment.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: all
                conditions:
                  - type: all
                    conditions:
                      - *a17
                      - type: compare
                        operator: gte
                        left:
                          type: field
                          name: coins
                        right:
                          type: field
                          name: service_cost
                      - type: any
                        conditions:
                          - type: all
                            conditions:
                              - type: compare
                                operator: eq
                                left:
                                  type: field
                                  name: operation
                                right:
                                  type: literal
                                  value: cure_disease
                              - type: compare
                                operator: eq
                                left:
                                  type: field
                                  name: diseased
                                right:
                                  type: literal
                                  value: true
                          - type: all
                            conditions:
                              - type: compare
                                operator: eq
                                left:
                                  type: field
                                  name: operation
                                right:
                                  type: literal
                                  value: cure_poison
                              - type: compare
                                operator: eq
                                left:
                                  type: field
                                  name: poisoned
                                right:
                                  type: literal
                                  value: true
                  - *a19
              - type: compare
                operator: gt
                left:
                  type: field
                  name: day
                right:
                  type: field
                  name: last_treatment_day
          - type: compare
            operator: ne
            left:
              type: field
              name: quest_departure_day
            right:
              type: field
              name: day
          - type: compare
            operator: eq
            left:
              type: field
              name: treatment_succeeds
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: transaction_eligible
          value:
            type: literal
            value: true
    - id: illness_treatment_limit
      source_text:
        The monks in a Sick Ward or at a Temple of Metheia are able to treat most illnesses,
        but it will cost you 100 c. It will take one day.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 144
          printed_page: 142
          heading: Cure Disease and Poison
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: operation
                right:
                  type: literal
                  value: cure_disease
              - type: compare
                operator: eq
                left:
