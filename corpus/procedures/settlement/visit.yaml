- id: procedure.settlement_arrival
  name: Settlement arrival and quest availability
  section_id: section.settlements.taking_on_quests
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Settlement Events
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Taking on Quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 132
      printed_page: 130
      heading: Rejecting a Quest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 133
      printed_page: 131
      heading: Available quests
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Whenever the party enters a settlement, they must roll for a random Event. Roll 1d12
    and consult the table to see if you have triggered an Event. If that is the case, roll on the
    Events Table and follow the instructions. ... Whenever the party is in a settlement, they may
    either start an available campaign or roll to see if there are random quests available. The
    Quest Site is determined by rolling a dice and cross-referencing this to the numbers written on
    the map. ... The party may reject 2 quests in a village and 3 quests in Silver City before they
    must move to another settlement to find a new quest. ... Roll 1d6 on the table to see what
    quests are available. If there is a quest available, then roll 1d8. On a result of 1-2 on the
    d8, a side quest is available as well and may be taken together with any of the other quests.
    See page 271. Luck may not be used for any of these two rolls. Use the Quest Book tables to
    generate which quests to choose from. If none of the quests are interesting to the party, they
    must move to another settlement to find new ones.
  issues:
    - issue.settlement.quest_offer_scope
    - issue.settlement.quest_availability_repeat
  fields:
    phase:
      type: string
      role: input
      description: arrival, quests, accept or reject. Repeat calls preserve visit counters. Random
        availability is established once per visit, the reading applied pending
        issue.settlement.quest_availability_repeat; a second quests call in the same visit does not
        reroll and returns that issue.
    settlement:
      type: string
      role: input
      description: settlement
    quest_mode:
      type: string
      role: input
      description: quest mode
    visit_id:
      type: number
      role: input
      description:
        Monotonic identifier for a genuine later return to this settlement. Shared by arrival,
        hero visit state and per-item locks.
      integer: true
      minimum: 0
    arrival_visit:
      type: number
      role: state
      description: arrival visit
      integer: true
      minimum: -1
    quests_checked_visit:
      type: number
      role: state
      description: quests checked visit
      integer: true
      minimum: -1
    rejected_quests:
      type: number
      role: state
      description: rejected quests
      integer: true
      minimum: 0
    available_quests:
      type: number
      role: state
      description: available quests
      integer: true
      minimum: 0
    arrival_roll:
      type: number
      role: input
      description: arrival roll
      integer: true
      minimum: 1
      maximum: 12
    event_threshold:
      type: number
      role: input
      description: event threshold
      integer: true
      minimum: 1
      maximum: 12
    quest_availability_roll:
      type: number
      role: input
      description: quest availability roll
      integer: true
      minimum: 1
      maximum: 6
    side_quest_roll:
      type: number
      role: input
      description: side quest roll
      integer: true
      minimum: 1
      maximum: 8
    luck_spent:
      type: number
      role: input
      description: luck spent
      minimum: 0
    campaign_available:
      type: boolean
      role: input
      description: campaign available
    event_forces_departure:
      type: boolean
      role: input
      description: Supplied event consequence, e.g. feast without beds. Rewards remain separately
        eligible; ordinary business is blocked.
    quest_accepted:
      type: boolean
      role: state
      description: quest accepted
    side_quest_available:
      type: boolean
      role: state
      description: side quest available
    must_depart:
      type: boolean
      role: state
      description:
        Set by a no-bed event, by reaching the rejection limit, or when every offered quest has been
        rejected ("If none of the quests are interesting to the party, they must move to another
        settlement"). A roll that offers no quest does not set it; that case returns
        issue.settlement.quest_availability_repeat.
    business_allowed:
      type: boolean
      role: state
      description: business allowed
    new_arrival:
      type: boolean
      role: output
      description: new arrival
    arrival_event_triggered:
      type: boolean
      role: output
      description: arrival event triggered
    rejection_limit:
      type: number
      role: output
      description: rejection limit
  dependencies:
    - key: settlement_catalogue
      label: Settlement-specific availability and quest-site selector
      object_id: table.settlement.quest_availability
    - key: settlement_event
      label: Settlement Event Table and nested outcomes
      object_id: table.settlement.events
    - key: map_site
      label: Cross-reference quest-site roll and map colour
    - key: quest_catalogue
      label: Quest Book selector for available quests
      section_id: section.quest_book_i
    - key: quest_site_selector
      label: Settlement Quest dice and map colour
      object_id: character.settlement.quest_site_selector
  steps:
    - id: arrival_event_check
      source_text:
        The party may reject 2 quests in a village and 3 quests in Silver City before they must
        move to another settlement to find a new quest.
      effects:
        - type: set
          target: new_arrival
          value:
            type: literal
            value: false
        - type: set
          target: rejection_limit
          value:
            type: literal
            value: 2
    - id: silver_city_limit
      source_text:
        The party may reject 2 quests in a village and 3 quests in Silver City before they must
        move to another settlement to find a new quest.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: settlement
        right:
          type: literal
          value: silver_city
      effects:
        - type: set
          target: rejection_limit
          value:
            type: literal
            value: 3
    - id: initialise_visit
      source_text: Whenever the party enters a settlement, they must roll for a random Event.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: arrival
          - type: compare
            operator: gt
            left:
              type: field
              name: visit_id
            right:
              type: field
              name: arrival_visit
      effects:
        - type: set
          target: new_arrival
          value:
            type: literal
            value: true
        - type: set
          target: arrival_event_triggered
          value:
            type: literal
            value: false
        - type: set
          target: rejected_quests
          value:
            type: literal
            value: 0
        - type: set
          target: available_quests
          value:
            type: literal
            value: 0
        - type: set
          target: quest_accepted
          value:
            type: literal
            value: false
        - type: set
          target: side_quest_available
          value:
            type: literal
            value: false
        - type: set
          target: must_depart
          value:
            type: literal
            value: false
        - type: set
          target: business_allowed
          value:
            type: literal
            value: true
        - type: set
          target: arrival_visit
          value:
            type: field
            name: visit_id
    - id: resolve_arrival_event
      source_text:
        Roll 1d12 and consult the table to see if you have triggered an Event. If that is the
        case, roll on the Events Table and follow the instructions.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: new_arrival
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: arrival_roll
            right:
              type: field
              name: event_threshold
      effects:
        - type: set
          target: arrival_event_triggered
          value:
            type: literal
            value: true
        - type: invoke
          dependency: settlement_event
    - id: event_departure
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 135
          printed_page: 133
          heading: Settlement Events
          locator:
            row: 7
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: On a result of 9-12 on 1d12, there are no beds, and the party must continue their
        travel without doing any business (you may claim any quest reward before leaving).
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: new_arrival
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: arrival_event_triggered
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: event_forces_departure
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: must_depart
          value:
            type: literal
            value: true
        - type: set
          target: business_allowed
          value:
            type: literal
            value: false
    - id: forbid_luck
      source_text: Luck may not be used for any of these two rolls.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: phase
        right:
          type: literal
          value: quests
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: luck_spent
            right:
              type: literal
              value: 0
    - id: repeat_quest_roll_unresolved
      source_text:
        Whenever the party is in a settlement, they may either start an available campaign or
        roll to see if there are random quests available.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: quests
          - type: compare
            operator: eq
            left:
              type: field
              name: arrival_visit
            right:
              type: field
              name: visit_id
          - type: compare
            operator: eq
            left:
              type: field
              name: quests_checked_visit
            right:
              type: field
              name: visit_id
          - type: compare
            operator: eq
            left:
              type: field
              name: must_depart
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_accepted
            right:
              type: literal
              value: false
          - type: compare
            operator: gt
            left:
              type: field
              name: available_quests
            right:
              type: literal
              value: 0
      effects:
        - type: unresolved
          issue_id: issue.settlement.quest_availability_repeat
    - id: check_available_quests
      source_text: Roll 1d6 on the table to see what quests are available.
      when: &a1
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: quests
          - &a2
            type: compare
            operator: eq
            left:
              type: field
              name: arrival_visit
            right:
              type: field
              name: visit_id
          - type: compare
            operator: gt
            left:
              type: field
              name: visit_id
            right:
              type: field
              name: quests_checked_visit
          - type: compare
            operator: eq
            left:
              type: field
              name: must_depart
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_accepted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: luck_spent
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 0
        - type: set
          target: side_quest_available
          value:
            type: literal
            value: false
        - type: invoke
          dependency: settlement_catalogue
    - id: village_two
      source_text: Roll 1d6 on the table to see what quests are available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: ne
            left:
              type: field
              name: settlement
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 1
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 2
    - id: village_one
      source_text: Roll 1d6 on the table to see what quests are available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: ne
            left:
              type: field
              name: settlement
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: gte
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 2
          - type: compare
            operator: lte
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 4
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 1
    - id: city_three
      source_text: Roll 1d6 on the table to see what quests are available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: eq
            left:
              type: field
              name: settlement
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 1
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 3
    - id: city_two
      source_text: Roll 1d6 on the table to see what quests are available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: eq
            left:
              type: field
              name: settlement
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: gte
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 2
          - type: compare
            operator: lte
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 4
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 2
    - id: city_one
      source_text: Roll 1d6 on the table to see what quests are available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: eq
            left:
              type: field
              name: settlement
            right:
              type: literal
              value: silver_city
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_availability_roll
            right:
              type: literal
              value: 5
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 1
    - id: campaign
      source_text:
        Whenever the party is in a settlement, they may either start an available campaign or
        roll to see if there are random quests available.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: campaign
          - type: compare
            operator: eq
            left:
              type: field
              name: campaign_available
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: available_quests
          value:
            type: literal
            value: 1
    - id: side_quest
      source_text:
        If there is a quest available, then roll 1d8. On a result of 1-2 on the d8, a side
        quest is available as well and may be taken together with any of the other quests.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_mode
            right:
              type: literal
              value: random
          - type: compare
            operator: gt
            left:
              type: field
              name: available_quests
            right:
              type: literal
              value: 0
          - type: compare
            operator: lte
            left:
              type: field
              name: side_quest_roll
            right:
              type: literal
              value: 2
      effects:
        - type: set
          target: side_quest_available
          value:
            type: literal
            value: true
    - id: generate_quests
      source_text: Use the Quest Book tables to generate which quests to choose from.
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gt
            left:
              type: field
              name: available_quests
            right:
              type: literal
              value: 0
      effects:
        - type: invoke
          dependency: quest_catalogue
    - id: record_quest_check
      source_text: Roll 1d6 on the table to see what quests are available.
      when: *a1
      effects:
        - type: set
          target: quests_checked_visit
          value:
            type: field
            name: visit_id
    - id: accept_quest
      source_text: The Quest Site is determined by rolling a dice and cross-referencing this to the
        numbers written on the map.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: accept
          - &a3
            type: all
            conditions:
              - *a2
              - type: compare
                operator: eq
                left:
                  type: field
                  name: must_depart
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_accepted
                right:
                  type: literal
                  value: false
              - type: compare
                operator: gt
                left:
                  type: field
                  name: available_quests
                right:
                  type: literal
                  value: 0
      effects:
        - type: set
          target: quest_accepted
          value:
            type: literal
            value: true
        - type: invoke
          dependency: quest_site_selector
        - type: invoke
          dependency: map_site
    - id: rejection_limit_unresolved
      source_text:
        The party may reject 2 quests in a village and 3 quests in Silver City before they must
        move to another settlement to find a new quest.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: reject
          - *a3
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: durburim
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: birnheim
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: outpost
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: freyfell
              - type: compare
                operator: eq
                left:
                  type: field
                  name: settlement
                right:
                  type: literal
                  value: whiteport
      effects:
        - type: unresolved
          issue_id: issue.settlement.quest_offer_scope
    - id: reject_quest
      source_text:
        The party may reject 2 quests in a village and 3 quests in Silver City before they must
        move to another settlement to find a new quest.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: reject
          - *a3
      effects:
        - type: set
          target: rejected_quests
          value:
            type: sum
            values:
              - type: field
                name: rejected_quests
              - type: literal
                value: 1
        - type: set
          target: available_quests
          value:
            type: sum
            values:
              - type: field
                name: available_quests
              - type: literal
                value: -1
    - id: no_quest_available_unresolved
      source_text:
        Roll 1d6 on the table to see what quests are available. ... If none of the quests are
        interesting to the party, they must move to another settlement to find new ones.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: quests
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: quests_checked_visit
            right:
              type: field
              name: visit_id
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_accepted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: must_depart
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: available_quests
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: rejected_quests
            right:
              type: literal
              value: 0
      effects:
        - type: unresolved
          issue_id: issue.settlement.quest_availability_repeat
    - id: enforce_rejection_limit
      source_text:
        The party may reject 2 quests in a village and 3 quests in Silver City before they must
        move to another settlement to find a new quest. ... If none of the quests are interesting to
        the party, they must move to another settlement to find new ones.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_accepted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: quests_checked_visit
            right:
              type: field
              name: visit_id
          - type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: rejected_quests
                    right:
                      type: field
                      name: rejection_limit
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: durburim
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: birnheim
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: outpost
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: freyfell
                  - type: compare
                    operator: ne
                    left:
                      type: field
                      name: settlement
                    right:
                      type: literal
                      value: whiteport
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: available_quests
                    right:
                      type: literal
                      value: 0
                  - type: compare
                    operator: gt
                    left:
                      type: field
                      name: rejected_quests
                    right:
                      type: literal
                      value: 0
      effects:
        - type: set
          target: must_depart
          value:
            type: literal
            value: true
  entry_step: arrival_event_check
  exit_step: enforce_rejection_limit
  unresolved_references:
    - 'Structural reading, not printed text: the event threshold, the rolls and the Quest Book
      results are supplied. Visit counters belong to one genuine arrival, so a repeated call in the
      same visit neither rerolls the event nor reopens the offer; a second quests call and a roll
      offering no quest return issue.settlement.quest_availability_repeat. Rejecting every offered
      quest forces departure under the printed "If none of the quests are interesting to the party,
      they must move to another settlement". The 2-quest limit applies to every settlement except
      Silver City and the five named in issue.settlement.quest_offer_scope (Durburim, Birnheim, The
      Outpost, Freyfell, Whiteport). Map geometry is supplied.'
