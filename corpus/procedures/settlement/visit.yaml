  unresolved_references:
    - 'Structural reading, not printed text: each call handles one hero for one phase. A hero spends
      at most one Activity Point per day, so an activity costing N occupies days start to start + N
      - 1 and the party stays at the inn through that night. Departure needs a day after the last
      activity and the last occupied day. Create a Scroll and Enchant Objects counters run between
      quests: they reset when the hero leaves on a quest, not on arrival, and one object excludes
      scroll attempts and the reverse.'
    - 'Recovery modelling, not printed text: a 2d6 (inn or own home) or 1d6 (stable) HP roll that
      would take a hero above the recorded maximum is not applied and returns
      issue.phase4.recovery_bounds; it does not block the Mana, Energy and Luck restoration. The
      printed "only half (RDD) of each stat" settles rounding (round down) but not whether half
      means half of the maximum, of the missing amount or of the current value, so the stable steps
      apply only caller-supplied half-stat amounts (stable_outcome_supplied) that stay within each
      maximum, and otherwise return issue.phase4.recovery_bounds; the stable recovery applies at
      most once per hero and night and keeps the mandatory morning departure. Staying at the house
      skips only the inn charge; recovery there follows the inn branch.'
  issues:
    - issue.phase4.recovery_bounds
    - issue.phase4.settlement_recovery
