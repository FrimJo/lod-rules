        - type: set
          target: lodging_completed
          value:
            type: literal
            value: false
        - type: set
          target: pending_stay_id
          value:
            type: field
            name: stay_id
        - type: set
          target: pending_stay_hero
          value:
            type: field
            name: hero_id
        - type: set
          target: pending_stay_sequence
          value:
            type: field
            name: stay_sequence
        - type: set
          target: pending_visit_id
          value:
            type: field
            name: visit_id
        - type: set
          target: pending_day
          value:
