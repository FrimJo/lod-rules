- id: procedure.estate_ownership
  name: Estate purchase, lodging and owned equipment storage
  section_id: section.buying_an_estate.buying_the_house
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 160
      printed_page: 158
      heading: Buying the House
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 160
      printed_page: 158
      heading: Staying at the House
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: To get the key to the house, the heroes must part with 4000 c when they are in Silver
    City. ... Once the heroes have the key, they are free to stay at the house in between quests.
    Now they do not have to pay the daily cost of at the inns. All the normal rules for resting
    between quests apply. The house has enough room to store any excess equipment the party chooses
    to not bring on their quests.
  unresolved_references:
    - Staying at the House prints storage but no retrieval rule; the retrieve step only lets the
      owning party take back the item it stored, so that storage is not one-way.
  fields:
