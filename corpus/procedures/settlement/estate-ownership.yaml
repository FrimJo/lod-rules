  dependencies:
    - key: rest
      label: Normal between-quest rest; execute the actual settlement rest dependency before recovery
      object_id: procedure.settlement_activities_and_overnight
  steps:
    - id: purchase
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 160
          printed_page: 158
          heading: Buying the House
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: To get the key to the house, the heroes must part with 4000 c when they are in
        Silver City.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: purchase
          - type: compare
            operator: eq
            left:
              type: field
              name: actual_purchase
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: estate_key
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: location
            right:
              type: literal
              value: Silver City
          - type: compare
            operator: ne
            left:
              type: field
              name: party_id
            right:
              type: literal
              value: ''
          - type: compare
            operator: gte
            left:
              type: field
              name: coins
            right:
              type: literal
              value: 4000
      rule_refs:
        - character.settlement.estate.purchase
      effects:
        - type: add
          target: coins
          value:
            type: literal
            value: -4000
          duration: permanent
        - type: set
          target: estate_party_id
          value:
            type: field
            name: party_id
        - type: set
          target: estate_key
          value:
            type: literal
            value: true
