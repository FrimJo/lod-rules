- id: procedure.arena_fighting
  name: Arena Fighting
  section_id: section.settlements.arena_fighting
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 141
      printed_page: 139
      heading: Participating
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 141
      printed_page: 139
      heading: Calculating the Chance of Victory
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 142
      printed_page: 140
      heading: Betting, Odds, and Winning
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 142
      printed_page: 140
      heading: Losing
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      locator:
        table: Available Actions
        row: Arena Fighting
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'Any hero can choose to participate in the arena fights and doing so will take a
    complete day. The minimum fee for joining is 50 c, but you can pay up to 200 c if you want to
    gamble more money. You will then first fight in the group fights. If you win, you may go on to
    fight in a semi-final. If you win that, you will fight in the final. You pay once to attend all
    three levels. ... Roll once on your CS for each level. The following modifiers are applied based
    on the participant’s stats: ... After each level, if the hero won, multiply the amount you paid
    to enter the fight with the following modifiers (RDD): ... If you win the final, there is also a
    chance that you receive an extra award: ... You (not the party) will also gain 50, 100, and 150
    XP for each level you win. ... If you lose the fight, you will lose 2 HP (group), 4 HP (semi),
    or 6 HP (final). You will also lose 2 Points of Sanity.'
  issues:
    - issue.settlement.arena_hit_points_basis
    - issue.settlement.arena_winnings_accumulation
  fields:
    coins:
      type: number
      role: state
      description: Coins of the participating hero.
      integer: true
      minimum: 0
    entry_fee:
      type: number
      role: input
      description: Fee paid once for all three levels (50 c to 200 c).
      integer: true
      minimum: 50
      maximum: 200
    combat_skill:
      type: number
      role: input
      description: The hero’s CS before arena modifiers.
      integer: true
      minimum: 0
    hit_points:
      type: number
      role: input
      description:
        Hit Points compared against the Hero Hit Points table; whether current or maximum HP is
        meant is issue.settlement.arena_hit_points_basis.
      integer: true
      minimum: 0
    strength:
      type: number
      role: input
      description: The hero’s STR.
      integer: true
      minimum: 0
    hero_level:
      type: number
      role: input
      description: Hero level, the row of the winnings table.
      integer: true
      minimum: 1
      maximum: 10
    group_roll:
      type: number
      role: input
      description: CS roll for the group fight.
      integer: true
      minimum: 1
      maximum: 100
    semi_roll:
      type: number
      role: input
      description: CS roll for the semi-final, when it is fought.
      integer: true
      minimum: 1
      maximum: 100
    final_roll:
      type: number
      role: input
      description: CS roll for the final, when it is fought.
      integer: true
      minimum: 1
      maximum: 100
    continue_to_semi:
      type: boolean
      role: input
      description: After winning the group fight, whether the hero goes on to the semi-final ("you may go on").
    award_roll:
      type: number
      role: input
      description: 1d10 on the extra award table after winning the final.
      integer: true
      minimum: 1
      maximum: 10
    entered:
      type: boolean
      role: state
      description: Whether the fee was paid and the hero fights.
    activity_points:
      type: number
      role: output
      description: Activity Points the activity costs (Available Actions).
      integer: true
      minimum: 0
    hp_modifier:
      type: number
      role: output
      description: Hero Hit Points modifier.
    str_modifier:
      type: number
      role: output
      description: Hero STR modifier.
    group_modifier:
      type: number
      role: output
      description: Level modifier for the group fight.
    semi_modifier:
      type: number
      role: output
      description: Level modifier for the semi-final.
    final_modifier:
      type: number
      role: output
      description: Level modifier for the final.
    group_target:
      type: number
      role: output
      description: Modified CS for the group fight roll.
    semi_target:
      type: number
      role: output
      description: Modified CS for the semi-final roll.
    final_target:
      type: number
      role: output
      description: Modified CS for the final roll.
    group_won:
      type: boolean
      role: output
      description: Group fight won.
    semi_won:
      type: boolean
      role: output
      description: Semi-final won.
    final_won:
      type: boolean
      role: output
      description: Final won.
    group_multiplier_tenths:
      type: number
      role: output
      description: Winnings modifier for the group level, in tenths (printed 1,1 is 11).
    semi_multiplier_tenths:
      type: number
      role: output
      description: Winnings modifier for the semi-final level, in tenths (printed 1,1 is 11).
    final_multiplier_tenths:
      type: number
      role: output
      description: Winnings modifier for the final level, in tenths (printed 1,1 is 11).
    group_payout:
      type: number
      role: output
      description:
        Fee multiplied by the group modifier (RDD). Paying this for a won group level and keeping
        it whatever happens later is the reading applied pending
        issue.settlement.arena_winnings_accumulation.
    semi_payout:
      type: number
      role: output
      description:
        Fee multiplied by the semi-final modifier (RDD), paid in addition to the group payout; the
        reading applied pending issue.settlement.arena_winnings_accumulation.
    final_payout:
      type: number
      role: output
      description:
        Fee multiplied by the final modifier (RDD), paid in addition to the group and semi-final
        payouts; the reading applied pending issue.settlement.arena_winnings_accumulation.
    winnings:
      type: number
      role: output
      description:
        Sum of the payouts of every won level, kept after a later loss. The book does not say
        whether won levels accumulate, only the last is paid, or the amount compounds, nor whether
        earlier winnings are kept after a loss; summing and keeping them is the reading applied
        pending issue.settlement.arena_winnings_accumulation.
    xp_gained:
      type: number
      role: output
      description: XP gained by the hero (not the party).
    hp_lost:
      type: number
      role: output
      description: HP lost on losing a fight.
    sanity_lost:
      type: number
      role: output
      description: Sanity lost on losing a fight.
    extra_award:
      type: string
      role: output
      description: Extra award after winning the final, or none.
  dependencies:
    - key: hit_points_table
      label: Hero Hit Points modifiers
      object_id: table.settlement.arena_modifiers
    - key: strength_table
      label: Hero STR modifiers
      object_id: table.settlement.arena_strength_modifiers
    - key: level_table
      label: Level modifiers
      object_id: table.settlement.arena_level_modifiers
    - key: odds_table
      label: Winnings modifiers
      object_id: table.settlement.arena_odds
    - key: award_table
      label: Extra award
      object_id: table.settlement.arena_awards
    - key: entry_rule
      label: Arena entry
      object_id: character.settlement.arena_entry
    - key: results_rule
      label: Arena results
      object_id: character.settlement.arena_results
  steps:
    - id: initialise
      source_text: Any hero can choose to participate in the arena fights and doing so will take a complete day.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Participating
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
          locator:
            table: Available Actions
            row: Arena Fighting
          extraction:
            method: text
            confidence: high
            visually_verified: true
      effects:
        - type: set
          target: entered
          value:
            type: literal
            value: false
        - type: set
          target: activity_points
          value:
            type: literal
            value: 1
        - type: set
          target: group_won
          value:
            type: literal
            value: false
        - type: set
          target: semi_won
          value:
            type: literal
            value: false
        - type: set
          target: final_won
          value:
            type: literal
            value: false
        - type: set
          target: winnings
          value:
            type: literal
            value: 0
        - type: set
          target: xp_gained
          value:
            type: literal
            value: 0
        - type: set
          target: hp_lost
          value:
            type: literal
            value: 0
        - type: set
          target: sanity_lost
          value:
            type: literal
            value: 0
        - type: set
          target: extra_award
          value:
            type: literal
            value: none
    - id: pay_entry
      source_text:
        The minimum fee for joining is 50 c, but you can pay up to 200 c if you want to gamble
        more money. ... You pay once to attend all three levels.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Participating
          extraction:
            method: text
            confidence: high
            visually_verified: true
      effects:
        - type: require
          condition:
            type: compare
            operator: gte
            left:
              type: field
              name: coins
            right:
              type: field
              name: entry_fee
        - type: add
          target: coins
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: literal
                value: -1
              - type: field
                name: entry_fee
          duration: immediate
        - type: set
          target: entered
          value:
            type: literal
            value: true
    - id: hit_points_low
      source_text: 'Hero Hit Points <10: -5'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero Hit Points
            row: <10
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - &a1
            type: compare
            operator: eq
            left:
              type: field
              name: entered
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 10
      effects:
        - type: set
          target: hp_modifier
          value:
            type: literal
            value: -5
    - id: hit_points_middle
      source_text: 'Hero Hit Points 10-15: 0'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero Hit Points
            row: 10-15
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gte
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 10
          - type: compare
            operator: lte
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 15
      effects:
        - type: set
          target: hp_modifier
          value:
            type: literal
            value: 0
    - id: hit_points_high
      source_text: 'Hero Hit Points >15: +5'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero Hit Points
            row: '>15'
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gt
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 15
      effects:
        - type: set
          target: hp_modifier
          value:
            type: literal
            value: 5
    - id: strength_low
      source_text: 'Hero STR <40: -5'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero STR
            row: <40
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: lt
            left:
              type: field
              name: strength
            right:
              type: literal
              value: 40
      effects:
        - type: set
          target: str_modifier
          value:
            type: literal
            value: -5
    - id: strength_middle
      source_text: 'Hero STR 40-50: 0'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero STR
            row: 40-50
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gte
            left:
              type: field
              name: strength
            right:
              type: literal
              value: 40
          - type: compare
            operator: lte
            left:
              type: field
              name: strength
            right:
              type: literal
              value: 50
      effects:
        - type: set
          target: str_modifier
          value:
            type: literal
            value: 0
    - id: strength_high
      source_text: 'Hero STR >50: +5'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          locator:
            table: Hero STR
            row: '>50'
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gt
            left:
              type: field
              name: strength
            right:
              type: literal
              value: 50
      effects:
        - type: set
          target: str_modifier
          value:
            type: literal
            value: 5
    - id: group_fight
      source_text: You will then first fight in the group fights. ... Roll once on your CS for each level.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Participating
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when: *a1
      effects:
        - type: lookup
          table_id: table.settlement.arena_level_modifiers
          key_column: level
          key:
            type: literal
            value: Group
          value_column: modifier
          target: group_modifier
          on_missing_issue: issue.phase4.lookup_domain
        - type: set
          target: group_target
          value:
            type: sum
            values:
              - type: field
                name: combat_skill
              - type: field
                name: hp_modifier
              - type: field
                name: str_modifier
              - type: field
                name: group_modifier
    - id: group_win
      source_text:
        'After each level, if the hero won, multiply the amount you paid to enter the fight
        with the following modifiers (RDD): ... You (not the party) will also gain 50, 100, and 150
        XP for each level you win.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Betting, Odds, and Winning
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: lte
            left:
              type: field
              name: group_roll
            right:
              type: field
              name: group_target
      effects:
        - type: set
          target: group_won
          value:
            type: literal
            value: true
        - type: set
          target: group_multiplier_tenths
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: literal
                value: 21
              - type: field
                name: hero_level
        - type: set
          target: group_payout
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: field
                        name: entry_fee
                      - type: field
                        name: group_multiplier_tenths
                  - type: literal
                    value: 10
        - type: add
          target: winnings
          value:
            type: field
            name: group_payout
          duration: immediate
        - type: add
          target: coins
          value:
            type: field
            name: group_payout
          duration: immediate
        - type: add
          target: xp_gained
          value:
            type: literal
            value: 50
          duration: immediate
    - id: group_loss
      source_text:
        If you lose the fight, you will lose 2 HP (group), 4 HP (semi), or 6 HP (final). You
        will also lose 2 Points of Sanity.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Losing
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a1
          - type: compare
            operator: gt
            left:
              type: field
              name: group_roll
            right:
              type: field
              name: group_target
      effects:
        - type: set
          target: hp_lost
          value:
            type: literal
            value: 2
        - type: set
          target: sanity_lost
          value:
            type: literal
            value: 2
    - id: semi_fight
      source_text: If you win, you may go on to fight in a semi-final.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Participating
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when: &a2
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: group_won
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: continue_to_semi
            right:
              type: literal
              value: true
      effects:
        - type: lookup
          table_id: table.settlement.arena_level_modifiers
          key_column: level
          key:
            type: literal
            value: Semi
          value_column: modifier
          target: semi_modifier
          on_missing_issue: issue.phase4.lookup_domain
        - type: set
          target: semi_target
          value:
            type: sum
            values:
              - type: field
                name: combat_skill
              - type: field
                name: hp_modifier
              - type: field
                name: str_modifier
              - type: field
                name: semi_modifier
    - id: semi_win
      source_text:
        'After each level, if the hero won, multiply the amount you paid to enter the fight
        with the following modifiers (RDD): ... You (not the party) will also gain 50, 100, and 150
        XP for each level you win.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Betting, Odds, and Winning
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: lte
