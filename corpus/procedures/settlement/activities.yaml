    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 143
      printed_page: 141
      heading: Determining the Profit…or Loss
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 143
      printed_page: 141
      heading: Robbed!
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 134
      printed_page: 132
      heading: Available Actions
      locator:
        table: Available Actions
        row: Banking
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If your hero already has money in the bank, the first thing to do is to determine how
    the balance has developed. ... The hero must choose which bank to deposit his or her money in,
    based on risk and chance of profit. It is perfectly fine to have money in several banks. ...
    Each time you visit Silver City (and the bank), roll on the table below (1d20) and adjust the
    account balance. Then decide whether you want to deposit more money or withdraw money. ... The
    bank has been robbed and all your deposits are gone! Tough luck.
  issues:
    - issue.settlement.bank_return_rounding
    - issue.settlement.bank_roll_per_account
  fields:
    in_silver_city:
      type: boolean
      role: input
      description: Whether the hero visits Silver City (and the bank).
    bank:
      type: string
      role: input
      description:
        chamberlings_reserve, smartfall_bank or the_vault; run once per bank holding the hero’s
        money. A separate 1d20 per account is the reading applied pending
        issue.settlement.bank_roll_per_account; the book does not say whether one roll is read in
        the column of every bank the hero uses.
    balance:
      type: number
      role: state
      description: Account balance at this bank, unrounded (issue.settlement.bank_return_rounding).
      minimum: 0
    roll:
      type: number
      role: input
      description:
        1d20 on the profit or loss table for this bank. Rolling once per account is the reading
        applied pending issue.settlement.bank_roll_per_account.
      integer: true
      minimum: 1
      maximum: 20
    deposit:
      type: number
      role: input
      description: Coins deposited after the balance is adjusted.
      integer: true
      minimum: 0
    withdrawal:
      type: number
      role: input
      description: Coins withdrawn after the balance is adjusted.
      integer: true
      minimum: 0
    coins:
      type: number
      role: state
      description: Coins the hero carries.
      integer: true
      minimum: 0
    visited:
      type: boolean
      role: state
      description: Whether the hero is at the bank in Silver City.
    activity_points:
      type: number
      role: output
      description: Activity Points the activity costs (Available Actions).
      integer: true
      minimum: 0
    result:
      type: string
      role: output
      description: Printed result applied to the balance, or none.
  dependencies:
    - key: returns_table
      label: Profit or loss table
      object_id: table.settlement.bank_returns
    - key: banking_rule
      label: Banking
      object_id: character.settlement.banking
  steps:
    - id: initialise
      source_text: 'Banking: Banks, 1.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
          locator:
            table: Available Actions
            row: Banking
          extraction:
            method: text
            confidence: high
            visually_verified: true
      effects:
        - type: set
          target: visited
          value:
            type: literal
            value: false
        - type: set
          target: activity_points
          value:
            type: literal
            value: 1
        - type: set
          target: result
          value:
            type: literal
            value: none
    - id: visit_bank
      source_text:
        Each time you visit Silver City (and the bank), roll on the table below (1d20) and
        adjust the account balance.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 143
          printed_page: 141
          heading: Determining the Profit…or Loss
          extraction:
            method: text
            confidence: high
            visually_verified: true
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: in_silver_city
            right:
              type: literal
              value: true
        - type: set
          target: visited
          value:
            type: literal
            value: true
    - id: result_profit_30
      source_text: 'The Vault 1-2: 30% profit'
