    - id: final_fight
      source_text: If you win that, you will fight in the final.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Participating
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          extraction:
            method: text
            confidence: high
            visually_verified: true
      when: &a3
        type: compare
        operator: eq
        left:
          type: field
          name: semi_won
        right:
