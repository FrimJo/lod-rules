              - type: field
                name: str_modifier
              - type: field
                name: final_modifier
    - id: final_win
      source_text:
        'After each level, if the hero won, multiply the amount you paid to enter the fight
        with the following modifiers (RDD): ... If you win the final, there is also a chance that
        you receive an extra award: ... You (not the party) will also gain 50, 100, and 150 XP for
        each level you win.'
      source:
        - document: rulebook.second_printing.eng
