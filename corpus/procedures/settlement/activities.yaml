          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 10
          - type: compare
            operator: eq
            left:
              type: field
              name: fortune_gambling_bonus
            right:
              type: literal
              value: true
      effects:
