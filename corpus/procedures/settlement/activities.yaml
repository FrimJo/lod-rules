            values:
              - type: literal
                value: 26
              - type: field
                name: hero_level
        - type: set
          target: winnings
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: field
                        name: bet
                      - type: field
                        name: multiplier_tenths
                  - type: literal
                    value: 10
        - type: add
          target: coins
          value:
            type: field
            name: winnings
          duration: immediate
        - type: lookup
          table_id: table.settlement.racing_awards
          key_column: second_place_roll
