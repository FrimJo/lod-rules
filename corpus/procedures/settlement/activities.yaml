              type: field
              name: semi_roll
            right:
              type: field
              name: semi_target
      effects:
        - type: set
          target: semi_won
          value:
            type: literal
            value: true
        - type: set
          target: semi_multiplier_tenths
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: literal
                value: 23
              - type: field
                name: hero_level
        - type: set
          target: semi_payout
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: arithmetic
                    operator: multiply
                    values:
                      - type: field
                        name: entry_fee
                      - type: field
                        name: semi_multiplier_tenths
                  - type: literal
                    value: 10
        - type: add
          target: winnings
          value:
            type: field
            name: semi_payout
          duration: immediate
        - type: add
          target: coins
          value:
            type: field
            name: semi_payout
          duration: immediate
        - type: add
          target: xp_gained
          value:
            type: literal
            value: 100
          duration: immediate
    - id: semi_loss
      source_text:
        If you lose the fight, you will lose 2 HP (group), 4 HP (semi), or 6 HP (final). You
        will also lose 2 Points of Sanity.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Losing
          extraction:
