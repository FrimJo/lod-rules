  status: extracted
  confidence: high
  source_text: 'Initiative is decided upon using tokens. These are referred to as Initiative tokens. There are two sets of tokens, one for heroes and one for monsters. If you lack tokens, this could be done using the LoD deck of cards instead. You also need to prepare a bag or cup to store the tokens out of sight. ... As soon as enemies are placed on the board these rules are activated. It could be either by a Standard Encounter on a new tile, or when replacing the Wandering Monster token with actual enemies. ... As soon as enemies are placed on the table, put all the tokens representing the heroes in the bag together with the same number of tokens as there are enemies.'
  fields:
    enemies_placed:
      type: boolean
      role: input
      description: enemies placed
