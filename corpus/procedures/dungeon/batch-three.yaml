- id: procedure.dungeon_generation
  name: dungeon generation
  section_id: section.into_the_dungeons.generating_the_dungeon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Generating the Dungeon
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The layout of the dungeon is determined using the Exploration Cards. The Quest Description shows
    how many rooms and corridors you will need. It will also detail if there are any specific cards
    that should be added or removed. Rooms with a ‘B’ should only be used when specified. 1. Pick
    out the Objective room Card according to the Quest Description. 2. Shuffle the room and corridor
    cards in separate piles and take as many as detailed of each. For example, 4 Room Cards and 4
    Corridor Cards. 3. Shuffle the cards you have taken together in one pile. 4. Divide the cards in
    two equal piles. Add the Objective Card to one of the piles, shuffle it and add it to the bottom
    of the other pile. ... Now the Dungeon Deck is set. This deck should be placed behind the first
    door.
  fields:
    quest_data_supplied:
      type: boolean
      role: input
      description: quest data supplied
    card_eligibility_resolved:
      type: boolean
      role: input
      description: card eligibility resolved
    equal_piles_possible:
      type: boolean
      role: input
      description: equal piles possible
    room_count:
      type: number
      role: input
      description: room count
      integer: true
      minimum: 0
    corridor_count:
      type: number
      role: input
      description: corridor count
      integer: true
      minimum: 0
    objective_card:
      type: string
      role: input
      description: objective card
    prepared_order:
      type: string
      role: input
      description: prepared order
    orders_supplied:
      type: boolean
      role: input
      description: orders supplied
    b_cards_requested:
      type: boolean
      role: input
      description: b cards requested
    quest_specifies_b:
      type: boolean
      role: input
      description: quest specifies b
    room_cards_selected:
      type: number
      role: output
      description: room cards selected
    corridor_cards_selected:
      type: number
      role: output
      description: corridor cards selected
    objective_position:
      type: string
      role: output
      description: objective position
    minimum_tiles_before_objective:
      type: number
      role: output
      description: minimum tiles before objective
    deck_order:
      type: string
      role: output
      description: deck order
    deck_behind:
      type: string
      role: output
      description: deck behind
  dependencies: []
  steps:
    - id: quest
      source_text: >-
        The Quest Description shows how many rooms and corridors you will need. It will also detail
        if there are any specific cards that should be added or removed. ... 1. Pick out the
        Objective room Card according to the Quest Description.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
    - id: b_conflict
      source_text: >-
        Rooms with a ‘B’ should only be used when specified.
      effects:
        - type: unresolved
          issue_id: issue.phase6.b_cards
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: b_cards_requested
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_specifies_b
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: card_eligibility_resolved
            right:
              type: literal
              value: false
    - id: select_separately
      source_text: >-
        2. Shuffle the room and corridor cards in separate piles and take as many as detailed of
        each.
      effects:
        - type: set
          target: room_cards_selected
          value:
            type: field
            name: room_count
        - type: set
          target: corridor_cards_selected
          value:
            type: field
            name: corridor_count
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: card_eligibility_resolved
            right:
              type: literal
              value: true
    - id: odd_pile
      source_text: >-
        4. Divide the cards in two equal piles.
      effects:
        - type: unresolved
          issue_id: issue.phase6.generation_odd_pile
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: equal_piles_possible
                right:
                  type: literal
                  value: false
              - type: not
                condition:
                  type: compare
                  operator: eq
                  left:
                    type: arithmetic
                    operator: divide
                    values:
                      - type: sum
                        values:
                          - type: field
                            name: room_count
                          - type: field
                            name: corridor_count
                      - type: literal
                        value: 2
                  right:
                    type: arithmetic
                    operator: floor
                    values:
                      - type: arithmetic
                        operator: divide
                        values:
                          - type: sum
                            values:
                              - type: field
                                name: room_count
                              - type: field
                                name: corridor_count
                          - type: literal
                            value: 2
    - id: prepare
      source_text: >-
        3. Shuffle the cards you have taken together in one pile. 4. Divide the cards in two equal
        piles. Add the Objective Card to one of the piles, shuffle it and add it to the bottom of
        the other pile. With our example of 8 cards above, this ensures that you will have to pass
        through at least 4 tiles before reaching the Objective Room. Now the Dungeon Deck is set.
        This deck should be placed behind the first door.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: orders_supplied
            right:
              type: literal
              value: true
        - type: set
          target: minimum_tiles_before_objective
          value:
            type: arithmetic
            operator: divide
            values:
              - type: sum
                values:
                  - type: field
                    name: room_count
                  - type: field
                    name: corridor_count
              - type: literal
                value: 2
        - type: set
          target: objective_position
          value:
            type: literal
            value: shuffled into bottom half
        - type: set
          target: deck_order
          value:
            type: field
            name: prepared_order
        - type: set
          target: deck_behind
          value:
            type: literal
            value: first door
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_data_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: card_eligibility_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: equal_piles_possible
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: arithmetic
              operator: divide
              values:
                - type: sum
                  values:
                    - type: field
                      name: room_count
                    - type: field
                      name: corridor_count
                - type: literal
                  value: 2
            right:
              type: arithmetic
              operator: floor
              values:
                - type: arithmetic
                  operator: divide
                  values:
                    - type: sum
                      values:
                        - type: field
                          name: room_count
                        - type: field
                          name: corridor_count
                    - type: literal
                      value: 2
  entry_step: quest
  exit_step: prepare
  issues:
    - issue.phase6.generation_odd_pile
    - issue.phase6.b_cards
  unresolved_references:
    - Exploration Card contents and shuffled orders are supplied outcomes. Abandoning your Quest
      and Finishing your Quest are modelled by state_machine.quest_dungeon and
      procedure.quest_dungeon_lifecycle.
- id: procedure.dungeon_route
  name: dungeon route
  section_id: section.into_the_dungeons.generating_the_dungeon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Generating the Dungeon
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      section: General Dungeon Layout
      heading: Placing Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      section: Generating the Dungeon
      heading: Partial Dead End
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      section: Generating the Dungeon
      heading: Total Dead End
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      section: Generating the Dungeon
      heading: Running out of Cards
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Once you enter a room, flip the top card and place that tile. Move the deck of Exploration Cards
    to the next door. If there are two or more doors, divide the deck to get near equal amounts of
    cards at each door. Make sure you deal from the bottom, so that you do not change the order of
    them. You still want the Objective Room to be amongst the last cards you draw. ... If the route
    you have chosen runs out of cards, ignore all unopened doors (they are impossible to open or
    simply not there) and turn back and chose another route.
  fields:
    mode:
      type: string
      role: input
      description: mode
    cards_remaining:
      type: number
      role: input
      description: cards remaining
      integer: true
      minimum: 0
    outgoing_doors:
      type: number
      role: input
      description: outgoing doors
      integer: true
      minimum: 0
    top_card:
      type: string
      role: input
      description: top card
    tile_geometry_valid:
      type: boolean
      role: input
      description: tile geometry valid
    quest_placement_valid:
      type: boolean
      role: input
      description: quest placement valid
    redistributed_order:
      type: string
      role: input
      description: redistributed order
    distribution_supplied:
      type: boolean
      role: input
      description: distribution supplied
    other_routes_available:
      type: boolean
      role: input
      description: other routes available
    secret_room_appropriate:
      type: boolean
      role: input
      description: secret room appropriate
    revealed_card:
      type: string
      role: output
      description: revealed card
    deal_from:
      type: string
      role: output
      description: deal from
    branch_min_cards:
      type: number
      role: output
      description: branch min cards
    branch_max_cards:
      type: number
      role: output
      description: branch max cards
    stack_order:
      type: string
      role: output
      description: stack order
    placement:
      type: string
      role: output
      description: placement
    ignore_unopened_doors:
      type: boolean
      role: output
      description: ignore unopened doors
    turn_back:
      type: boolean
      role: output
      description: turn back
    secret_door_placed:
      type: boolean
      role: output
      description: secret door placed
  dependencies: []
  steps:
    - id: reveal
      source_text: >-
        Once you enter a room, flip the top card and place that tile. ... All you need to consider
        is that the squares line up and that you can place a door between the tiles without
        interfering with furniture.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: tile_geometry_valid
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_placement_valid
                right:
                  type: literal
                  value: true
        - type: set
          target: revealed_card
          value:
            type: field
            name: top_card
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: reveal
          - type: compare
            operator: gt
            left:
              type: field
              name: cards_remaining
            right:
              type: literal
              value: 0
    - id: branch
      source_text: >-
        If there are two or more doors, divide the deck to get near equal amounts of cards at each
        door. Make sure you deal from the bottom, so that you do not change the order of them. You
        still want the Objective Room to be amongst the last cards you draw.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: distribution_supplied
            right:
              type: literal
              value: true
        - type: set
          target: deal_from
          value:
            type: literal
            value: bottom
        - type: set
          target: branch_min_cards
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: field
                    name: cards_remaining
                  - type: field
                    name: outgoing_doors
        - type: set
          target: branch_max_cards
          value:
            type: arithmetic
            operator: ceil
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: field
                    name: cards_remaining
                  - type: field
                    name: outgoing_doors
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: branch
          - type: compare
            operator: gte
            left:
              type: field
              name: outgoing_doors
            right:
              type: literal
              value: 2
    - id: single_door
      source_text: >-
        Move the deck of Exploration Cards to the next door.
      effects:
        - type: set
          target: placement
          value:
            type: literal
            value: next door
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: branch
          - type: compare
            operator: eq
            left:
              type: field
              name: outgoing_doors
            right:
              type: literal
              value: 1
    - id: partial_dead_end
      source_text: >-
        If the route you have chosen in the dungeon turns out to be a dead end, and not all cards in
        that route have been turned, these cards are moved to (and divided between) other possible
        routes. Place these cards at the very bottom of the existing pile(s).
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: distribution_supplied
            right:
              type: literal
              value: true
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
        - type: set
          target: placement
          value:
            type: literal
            value: bottom of existing route piles
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: partial_dead_end
          - type: compare
            operator: gt
            left:
              type: field
              name: cards_remaining
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: other_routes_available
            right:
              type: literal
              value: true
    - id: total_dead_end
      source_text: >-
        If, for some reason, there is no way for the party to explore further, a secret door may be
        placed in an appropriate room chosen by the party, and all unturned cards remaining in the
        deck are moved to this door.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: secret_room_appropriate
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: distribution_supplied
                right:
                  type: literal
                  value: true
        - type: set
          target: secret_door_placed
          value:
            type: literal
            value: true
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
        - type: set
          target: placement
          value:
            type: literal
            value: secret door
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: total_dead_end
          - type: compare
            operator: eq
            left:
              type: field
              name: other_routes_available
            right:
              type: literal
              value: false
    - id: exhausted
      source_text: >-
        If the route you have chosen runs out of cards, ignore all unopened doors (they are
        impossible to open or simply not there) and turn back and chose another route.
      effects:
        - type: set
          target: ignore_unopened_doors
          value:
            type: literal
            value: true
        - type: set
          target: turn_back
          value:
            type: literal
            value: true
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: cards_remaining
        right:
          type: literal
          value: 0
  entry_step: reveal
  exit_step: exhausted
  unresolved_references:
    - Stack orders are supplied outcomes; no card inventory, shuffle algorithm or geometric layout
      is invented.
- id: procedure.initial_setup
  name: initial setup
  section_id: section.into_the_dungeons.initial_setup
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Initial Setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Place the starting tile as the first tile. This tile has one side with grass and one side with
    flagstones. On the stone side of the tile, you will find a door leading into the dungeon. This
    door is always unlocked and does not increase the Threat Level. The party will not roll the
    Scenario Dice until they have passed this door. If the party decides to move off the tile and
    onto the grass side, the party will leave the dungeon and go to the World Map instead.
  fields:
    entrance_passed:
      type: boolean
      role: input
      description: entrance passed
    leaves_grass_side:
      type: boolean
      role: input
      description: leaves grass side
    starting_tile:
      type: string
      role: output
      description: starting tile
    entrance_locked:
      type: boolean
      role: output
      description: entrance locked
    entrance_threat_increase:
      type: number
      role: output
      description: entrance threat increase
    scenario_die_allowed:
      type: boolean
      role: output
      description: scenario die allowed
    location:
      type: string
      role: output
      description: location
  dependencies:
    - key: binding_procedure_open_door_or_chest
      label: procedure.open_door_or_chest
      object_id: procedure.open_door_or_chest
    - key: binding_procedure_dungeon_turn
      label: procedure.dungeon_turn
      object_id: procedure.dungeon_turn
  steps:
    - id: place
      source_text: >-
        Place the starting tile as the first tile. This tile has one side with grass and one side
        with flagstones. On the stone side of the tile, you will find a door leading into the
        dungeon. This door is always unlocked and does not increase the Threat Level.
      effects:
        - type: set
          target: starting_tile
          value:
            type: literal
            value: grass and flagstones
        - type: set
          target: entrance_locked
          value:
            type: literal
            value: false
        - type: set
          target: entrance_threat_increase
          value:
            type: literal
            value: 0
        - type: set
          target: location
          value:
            type: literal
            value: dungeon
    - id: before_entrance
      source_text: >-
        The party will not roll the Scenario Dice until they have passed this door.
      effects:
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: false
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: entrance_passed
        right:
          type: literal
          value: false
    - id: after_entrance
      source_text: >-
        The party will not roll the Scenario Dice until they have passed this door.
      effects:
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: true
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: entrance_passed
        right:
          type: literal
          value: true
    - id: grass_exit
      source_text: >-
        If the party decides to move off the tile and onto the grass side, the party will leave the
        dungeon and go to the World Map instead.
      effects:
        - type: set
          target: location
          value:
            type: literal
            value: world_map
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: false
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: leaves_grass_side
        right:
          type: literal
          value: true
  entry_step: place
  exit_step: grass_exit
- id: procedure.encounters
  name: encounters
  section_id: section.into_the_dungeons.encounters
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 106
      printed_page: 104
      heading: Encounters
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 106
      printed_page: 104
      heading: Placing Enemies
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'The risk of Encounters differs depending on the type of tile the party is entering. The base chance of an Encounter is: A room has a 50% chance of enemies (01-50). A corridor has a 30% chance of enemies (01-30). If 4 consecutive tiles have been placed without encounters, the above chance is increased with +10 until an encounter is triggered (Max 70%). Before rolling (1d00), be sure to check the room description for any possible modifications to these chances. If enemies are present, the turns end immediately. The quest description will tell you what faction of enemies you are facing, and unless the description tells you otherwise, you roll on the corresponding table at the end of the Bestiary. This roll is always 1d20, with a +10 modifier for each level above 1 of highest-level character in the party. Place the enemies in the room, following this rule:'
  fields:
    tile_kind:
      type: string
      role: input
      description: tile kind
    empty_streak:
      type: number
      role: input
      description: empty streak
      integer: true
      minimum: 0
    streak_bonus_supplied:
      type: number
      role: input
      description: streak bonus supplied
      integer: true
    room_modifier:
      type: number
      role: input
      description: room modifier
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 100
    highest_level:
      type: number
      role: input
      description: highest level
      integer: true
      minimum: 1
    monster_roll:
      type: number
      role: input
      description: monster roll
      integer: true
      minimum: 1
      maximum: 20
    quest_override:
      type: boolean
      role: input
      description: quest override
    quest_result:
      type: string
      role: input
      description: quest result
    monster_data_supplied:
      type: boolean
      role: input
      description: monster data supplied
    monster_result:
      type: string
      role: input
      description: monster result
    placement_supplied:
      type: boolean
      role: input
      description: placement supplied
    melee_distance_valid:
      type: boolean
      role: input
      description: melee distance valid
    melee_randomized:
