        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 107
      printed_page: 105
      heading: Activation
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Enemies are activated in a certain order so they do not block each other. Whenever you
    draw an enemy token, activate enemies in the order described below. Consult their Behaviour Card
    to see where they fit in the list. Randomise if there are two or more enemies that could
    possibly act at the same time.
  fields:
    magic_or_ranged:
      type: boolean
      role: input
      description: magic or ranged
    adjacent_and_makes_room:
      type: boolean
      role: input
      description: an enemy adjacent to a hero that could make room for more enemies
    adjacent:
      type: boolean
      role: input
      description: adjacent
    closest_and_can_charge:
      type: boolean
      role: input
      description: closest and can charge
    full_movement_space:
      type: boolean
      role: input
      description: full movement space
    lowest_remaining_priority:
      type: number
      role: input
      description: lowest remaining priority
      integer: true
      minimum: 1
    tie_count:
      type: number
      role: input
      description: tie count
      integer: true
      minimum: 0
    random_index:
      type: number
      role: input
      description: random index
      integer: true
      minimum: 1
    candidate_index:
      type: number
      role: input
      description: candidate index
      integer: true
      minimum: 1
    candidate_alive:
      type: boolean
      role: input
      description: candidate alive
    candidate_knocked_out:
      type: boolean
      role: input
      description: candidate knocked out
    candidate_acted:
      type: boolean
      role: input
      description: candidate acted
    priority:
      type: number
      role: output
      description: priority
      integer: true
      minimum: 1
    selected:
      type: boolean
      role: output
      description: selected
  dependencies: []
  steps:
    - id: priority_1
      source_text: 1. Magic User or enemy armed with Ranged Weapon.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 1
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: true
    - id: priority_2
      source_text: 2. An enemy adjacent to a hero that could make room for more enemies.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 2
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent_and_makes_room
            right:
              type: literal
              value: true
    - id: priority_3
      source_text: 3. Enemy adjacent to hero.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 3
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent_and_makes_room
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: true
    - id: priority_4
      source_text: 4. Enemy closest to a hero and that could charge.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 4
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent_and_makes_room
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: closest_and_can_charge
            right:
              type: literal
              value: true
    - id: priority_5
      source_text: 5. Enemy that has enough space to move its full movement.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 5
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent_and_makes_room
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: closest_and_can_charge
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: full_movement_space
            right:
              type: literal
              value: true
    - id: priority_6
      source_text: 6. Random enemy.
      effects:
        - type: set
          target: priority
          value:
            type: literal
            value: 6
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: magic_or_ranged
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent_and_makes_room
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: closest_and_can_charge
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: full_movement_space
            right:
              type: literal
              value: false
    - id: select
      source_text:
        Randomise if there are two or more enemies that could possibly act at the same time.
        ... Each model may only receive one token and one activation. Once they have all acted, put
        the tokens for those models alive/not knocked out back in the bag (re-shuffle the pile of
        cards) and repeat.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: gte
                left:
                  type: field
                  name: random_index
                right:
                  type: literal
                  value: 1
              - type: compare
                operator: lte
                left:
                  type: field
                  name: random_index
                right:
                  type: field
                  name: tie_count
        - type: set
          target: selected
          value:
            type: literal
            value: true
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: candidate_alive
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: candidate_knocked_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: candidate_acted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: priority
            right:
              type: field
              name: lowest_remaining_priority
          - type: compare
            operator: eq
            left:
              type: field
              name: candidate_index
            right:
              type: field
              name: random_index
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 118
          printed_page: 116
          heading: Activation of Enemies
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Activation
          extraction:
            method: image
            confidence: high
            visually_verified: true
  entry_step: priority_1
  exit_step: select
  issues:
    - issue.phase6.monster_inputs
