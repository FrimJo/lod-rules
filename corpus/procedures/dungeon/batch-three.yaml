        visually_verified: true
  status: extracted
  confidence: high
  source_text: 'After the first battle turn when all tokens have been drawn, you may place a hero on Overwatch. That requires the hero to be armed with a loaded Ranged Weapon or to have a Hand Weapon ready. A hero on Overwatch will not contribute with a token to the bag. ... Whenever an enemy moves within LOS, a hero on Overwatch may intervene and pause the enemy movement at any time and fire at the cost of 1 Energy Point. Once the effect of the shot has been worked out, the enemy will continue its movement. Perks and Talents may be used during this shot, but not for aiming. Once this shot has been taken, the hero will spend its second action reloading, or be idle. ... A hero armed with a Close-Combat Weapon may strike any enemy entering or moving within the hero’s ZOC. The hero will make a Standard Strike before the enemy may strike. If the enemy is charging, a successful Overwatch strike will cancel the enemy charge and it will automatically miss. However, if the Overwatch strike misses, it will leave the hero in an exposed situation, and the charge will automatically hit. The strike costs 1 Energy Point.'
