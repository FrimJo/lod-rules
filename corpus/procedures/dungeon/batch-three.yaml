      integer: true
      minimum: 0
    extra_activations:
      type: number
      role: output
      description: extra activations
    start_new_turn:
      type: boolean
      role: output
      description: start new turn
  dependencies:
    - key: perfect_hearing
      label: Existing Perfect Hearing talent
      object_id: talent.perfect_hearing
  steps:
    - id: base
      source_text: 'As soon as enemies are placed on the table, put all the tokens representing the heroes in the bag together with the same number of tokens as there are enemies. ... If you are facing a monster that has been given a name in the Quest Description, you must add another token per named monster, as long as that named monster is alive. ... A hero on Overwatch will not contribute with a token to the bag.'
      effects:
        - type: require
          condition:
            type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
        - type: set
          target: hero_tokens
          value:
            type: sum
            values:
              - type: arithmetic
                operator: subtract
                values:
                  - type: field
                    name: eligible_heroes
                  - type: field
                    name: overwatch_heroes
              - type: field
                name: supplied_hero_bonus
        - type: set
          target: enemy_tokens
          value:
            type: sum
            values:
              - type: field
                name: eligible_enemies
              - type: field
                name: named_monsters_alive
              - type: field
                name: supplied_enemy_bonus
        - type: set
          target: extra_activations
          value:
            type: literal
            value: 0
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: enemies_placed
            right:
              type: literal
              value: true
          - type: compare
