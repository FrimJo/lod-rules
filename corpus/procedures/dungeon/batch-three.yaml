      pdf_page: 107
      printed_page: 105
      heading: overwatch
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    After first battle turn and all tokens drawn, a hero with loaded Ranged Weapon or ready
    Hand Weapon may enter Overwatch and withhold token. Responses spend 1 Energy; attack resolution
    is a handoff.
