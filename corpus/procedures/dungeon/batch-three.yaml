- id: procedure.dungeon_generation
  name: dungeon generation
  section_id: section.into_the_dungeons.generating_the_dungeon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: dungeon generation
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Choose quest objective; select separately shuffled room/corridor cards according to
    quest and exclusions. Shuffle chosen cards, divide equally, add objective to one half and
    shuffle it, then place that half under the other. All orders and card contents are supplied, not
    generated by this corpus.
  fields:
    quest_data_supplied:
      type: boolean
      role: input
      description: quest data supplied
    card_eligibility_resolved:
      type: boolean
      role: input
      description: card eligibility resolved
    equal_piles_possible:
      type: boolean
      role: input
      description: equal piles possible
    room_count:
      type: number
      role: input
      description: room count
      integer: true
      minimum: 0
    corridor_count:
      type: number
      role: input
      description: corridor count
      integer: true
      minimum: 0
    objective_card:
      type: string
      role: input
      description: objective card
    prepared_order:
      type: string
      role: input
      description: prepared order
    orders_supplied:
      type: boolean
      role: input
      description: orders supplied
    b_cards_requested:
      type: boolean
      role: input
      description: b cards requested
    quest_specifies_b:
      type: boolean
      role: input
      description: quest specifies b
    room_cards_selected:
      type: number
      role: output
      description: room cards selected
    corridor_cards_selected:
      type: number
      role: output
      description: corridor cards selected
    objective_position:
      type: string
      role: output
      description: objective position
    minimum_tiles_before_objective:
      type: number
      role: output
      description: minimum tiles before objective
    deck_order:
      type: string
      role: output
      description: deck order
    deck_behind:
      type: string
      role: output
      description: deck behind
  dependencies: []
  steps:
    - id: quest
      source_text: Quest supplies objective, number of rooms/corridors and added/removed cards.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
    - id: b_conflict
      source_text: B cards without quest specification have conflicting inclusion guidance.
      effects:
        - type: unresolved
          issue_id: issue.phase6.b_cards
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: b_cards_requested
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_specifies_b
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: card_eligibility_resolved
            right:
              type: literal
              value: false
    - id: select_separately
      source_text: Shuffle rooms and corridors separately; select quest counts.
      effects:
        - type: set
          target: room_cards_selected
          value:
            type: field
            name: room_count
        - type: set
          target: corridor_cards_selected
          value:
            type: field
            name: corridor_count
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: card_eligibility_resolved
            right:
              type: literal
              value: true
    - id: odd_pile
      source_text: Two equal piles are required; no odd-count allocation is provided.
      effects:
        - type: unresolved
          issue_id: issue.phase6.generation_odd_pile
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: quest_data_supplied
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: equal_piles_possible
                right:
                  type: literal
                  value: false
              - type: not
                condition:
                  type: compare
                  operator: eq
                  left:
                    type: arithmetic
                    operator: divide
                    values:
                      - type: sum
                        values:
                          - type: field
                            name: room_count
                          - type: field
                            name: corridor_count
                      - type: literal
                        value: 2
                  right:
                    type: arithmetic
                    operator: floor
                    values:
                      - type: arithmetic
                        operator: divide
                        values:
                          - type: sum
                            values:
                              - type: field
                                name: room_count
                              - type: field
                                name: corridor_count
                          - type: literal
                            value: 2
    - id: prepare
      source_text:
        Shuffle selected cards together; divide equally; shuffle objective into one half and
        put this below the other half.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: orders_supplied
            right:
              type: literal
              value: true
        - type: set
          target: minimum_tiles_before_objective
          value:
            type: arithmetic
            operator: divide
            values:
              - type: sum
                values:
                  - type: field
                    name: room_count
                  - type: field
                    name: corridor_count
              - type: literal
                value: 2
        - type: set
          target: objective_position
          value:
            type: literal
            value: shuffled into bottom half
        - type: set
          target: deck_order
          value:
            type: field
            name: prepared_order
        - type: set
          target: deck_behind
          value:
            type: literal
            value: first door
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_data_supplied
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: card_eligibility_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: equal_piles_possible
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: arithmetic
              operator: divide
              values:
                - type: sum
                  values:
                    - type: field
                      name: room_count
                    - type: field
                      name: corridor_count
                - type: literal
                  value: 2
            right:
              type: arithmetic
              operator: floor
              values:
                - type: arithmetic
                  operator: divide
                  values:
                    - type: sum
                      values:
                        - type: field
                          name: room_count
                        - type: field
                          name: corridor_count
                    - type: literal
                      value: 2
  entry_step: quest
  exit_step: prepare
  issues:
    - issue.phase6.generation_odd_pile
    - issue.phase6.b_cards
  unresolved_references:
    - Exploration Card contents and shuffled orders supplied. Quest lifecycle
      abandonment/return/completion remains deferred.
- id: procedure.dungeon_route
  name: dungeon route
  section_id: section.into_the_dungeons.generating_the_dungeon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Generating the Dungeon
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 86
      printed_page: 84
      heading: Placing Tiles
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: One bounded reveal or route redistribution. Supply top card and stack order, route
    geometry and random results. Deal branches from bottom into near-equal piles. Dead-end leftovers
    go under existing routes. Exhausted routes ignore unopened doors.
  fields:
    mode:
      type: string
      role: input
      description: mode
    cards_remaining:
      type: number
      role: input
      description: cards remaining
      integer: true
      minimum: 0
    outgoing_doors:
      type: number
      role: input
      description: outgoing doors
      integer: true
      minimum: 0
    top_card:
      type: string
      role: input
      description: top card
    tile_geometry_valid:
      type: boolean
      role: input
      description: tile geometry valid
    quest_placement_valid:
      type: boolean
      role: input
      description: quest placement valid
    redistributed_order:
      type: string
      role: input
      description: redistributed order
    distribution_supplied:
      type: boolean
      role: input
      description: distribution supplied
    other_routes_available:
      type: boolean
      role: input
      description: other routes available
    secret_room_appropriate:
      type: boolean
      role: input
      description: secret room appropriate
    revealed_card:
      type: string
      role: output
      description: revealed card
    deal_from:
      type: string
      role: output
      description: deal from
    branch_min_cards:
      type: number
      role: output
      description: branch min cards
    branch_max_cards:
      type: number
      role: output
      description: branch max cards
    stack_order:
      type: string
      role: output
      description: stack order
    placement:
      type: string
      role: output
      description: placement
    ignore_unopened_doors:
      type: boolean
      role: output
      description: ignore unopened doors
    turn_back:
      type: boolean
      role: output
      description: turn back
    secret_door_placed:
      type: boolean
      role: output
      description: secret door placed
  dependencies: []
  steps:
    - id: reveal
      source_text: Flip top card, place matching tile with squares aligned and doors not obscured by
        furniture; quest placement overrides.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: tile_geometry_valid
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: quest_placement_valid
                right:
                  type: literal
                  value: true
        - type: set
          target: revealed_card
          value:
            type: field
            name: top_card
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: reveal
          - type: compare
            operator: gt
            left:
              type: field
              name: cards_remaining
            right:
              type: literal
              value: 0
    - id: branch
      source_text: At two or more doors divide remaining deck nearly equally, dealing from bottom to
        preserve objective depth.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: distribution_supplied
            right:
              type: literal
              value: true
        - type: set
          target: deal_from
          value:
            type: literal
            value: bottom
        - type: set
          target: branch_min_cards
          value:
            type: arithmetic
            operator: floor
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: field
                    name: cards_remaining
                  - type: field
                    name: outgoing_doors
        - type: set
          target: branch_max_cards
          value:
            type: arithmetic
            operator: ceil
            values:
              - type: arithmetic
                operator: divide
                values:
                  - type: field
                    name: cards_remaining
                  - type: field
                    name: outgoing_doors
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: branch
          - type: compare
            operator: gte
            left:
              type: field
              name: outgoing_doors
            right:
              type: literal
              value: 2
    - id: single_door
      source_text: Move deck to next door.
      effects:
        - type: set
          target: placement
          value:
            type: literal
            value: next door
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: branch
          - type: compare
            operator: eq
            left:
              type: field
              name: outgoing_doors
            right:
              type: literal
              value: 1
    - id: partial_dead_end
      source_text:
        Move remaining unturned cards to and divide between other possible routes, at very
        bottom of existing piles.
      effects:
        - type: require
          condition:
            type: compare
            operator: eq
            left:
              type: field
              name: distribution_supplied
            right:
              type: literal
              value: true
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
        - type: set
          target: placement
          value:
            type: literal
            value: bottom of existing route piles
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: partial_dead_end
          - type: compare
            operator: gt
            left:
              type: field
              name: cards_remaining
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: other_routes_available
            right:
              type: literal
              value: true
    - id: total_dead_end
      source_text:
        When no further exploration is possible, party may choose an appropriate room for a
        secret door and move all unturned cards to it.
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: secret_room_appropriate
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: distribution_supplied
                right:
                  type: literal
                  value: true
        - type: set
          target: secret_door_placed
          value:
            type: literal
            value: true
        - type: set
          target: stack_order
          value:
            type: field
            name: redistributed_order
        - type: set
          target: placement
          value:
            type: literal
            value: secret door
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: total_dead_end
          - type: compare
            operator: eq
            left:
              type: field
              name: other_routes_available
            right:
              type: literal
              value: false
    - id: exhausted
      source_text: When route runs out of cards ignore unopened doors and turn back to another route.
      effects:
        - type: set
          target: ignore_unopened_doors
          value:
            type: literal
            value: true
        - type: set
          target: turn_back
          value:
            type: literal
            value: true
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: cards_remaining
        right:
          type: literal
          value: 0
  entry_step: reveal
  exit_step: exhausted
  unresolved_references:
    - Stack orders are supplied outcomes; no card inventory, shuffle algorithm or geometric layout
      is invented.
- id: procedure.initial_setup
  name: initial setup
  section_id: section.into_the_dungeons.initial_setup
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: initial setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Place starting tile first; stone-side door is unlocked and causes no Threat increase.
    No Scenario Dice until party passes it. Moving off grass side exits to World Map.
  fields:
    entrance_passed:
      type: boolean
      role: input
      description: entrance passed
    leaves_grass_side:
      type: boolean
      role: input
      description: leaves grass side
    starting_tile:
      type: string
      role: output
      description: starting tile
    entrance_locked:
      type: boolean
      role: output
      description: entrance locked
    entrance_threat_increase:
      type: number
      role: output
      description: entrance threat increase
    scenario_die_allowed:
      type: boolean
      role: output
      description: scenario die allowed
    location:
      type: string
      role: output
      description: location
  dependencies:
    - key: binding_procedure_open_door_or_chest
      label: procedure.open_door_or_chest
      object_id: procedure.open_door_or_chest
    - key: binding_procedure_dungeon_turn
      label: procedure.dungeon_turn
      object_id: procedure.dungeon_turn
  steps:
    - id: place
      source_text: Starting tile has grass and flagstones; stone-side door leads into dungeon.
      effects:
        - type: set
          target: starting_tile
          value:
            type: literal
            value: grass and flagstones
        - type: set
          target: entrance_locked
          value:
            type: literal
            value: false
        - type: set
          target: entrance_threat_increase
          value:
            type: literal
            value: 0
        - type: set
          target: location
          value:
            type: literal
            value: dungeon
    - id: before_entrance
      source_text: Do not roll Scenario Dice before passing entrance.
      effects:
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: false
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: entrance_passed
        right:
          type: literal
          value: false
    - id: after_entrance
      source_text: Scenario Dice resume after passing entrance.
      effects:
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: true
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: entrance_passed
        right:
          type: literal
          value: true
    - id: grass_exit
      source_text: Moving off tile onto grass side leaves dungeon for World Map.
      effects:
        - type: set
          target: location
          value:
            type: literal
            value: world_map
        - type: set
          target: scenario_die_allowed
          value:
            type: literal
            value: false
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: leaves_grass_side
        right:
          type: literal
          value: true
  entry_step: place
  exit_step: grass_exit
- id: procedure.encounters
  name: encounters
  section_id: section.into_the_dungeons.encounters
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 106
      printed_page: 104
      heading: encounters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Room 01–50, corridor 01–30; four encounter-free tiles grant +10 until encounter, capped
    at 70. Check room modifications before rolling. Enemies immediately end turn; use quest
    faction/table and highest hero level modifier unless quest says otherwise. Missing
    selection/spatial data does not fabricate enemies.
  fields:
    tile_kind:
      type: string
      role: input
      description: tile kind
    empty_streak:
      type: number
      role: input
      description: empty streak
      integer: true
      minimum: 0
    streak_bonus_supplied:
      type: number
      role: input
      description: streak bonus supplied
      integer: true
    room_modifier:
      type: number
      role: input
      description: room modifier
    roll:
      type: number
      role: input
      description: roll
      integer: true
      minimum: 1
      maximum: 100
    highest_level:
      type: number
      role: input
      description: highest level
      integer: true
      minimum: 1
    monster_roll:
      type: number
      role: input
      description: monster roll
      integer: true
      minimum: 1
      maximum: 20
    quest_override:
      type: boolean
      role: input
      description: quest override
    quest_result:
      type: string
      role: input
      description: quest result
    monster_data_supplied:
      type: boolean
      role: input
      description: monster data supplied
    monster_result:
      type: string
      role: input
      description: monster result
    placement_supplied:
      type: boolean
      role: input
      description: placement supplied
    melee_distance_valid:
      type: boolean
      role: input
      description: melee distance valid
    melee_randomized:
      type: boolean
      role: input
      description: melee randomized
    ranged_farthest_in_los:
      type: boolean
      role: input
      description: ranged farthest in los
    facing_valid:
      type: boolean
      role: input
      description: facing valid
    base_chance:
      type: number
      role: output
      description: base chance
    encounter_chance:
      type: number
      role: output
      description: encounter chance
      integer: true
      minimum: 0
    encounter_present:
      type: boolean
      role: output
      description: encounter present
    streak_after:
      type: number
      role: output
      description: streak after
      integer: true
      minimum: 0
    turn_ended:
      type: boolean
      role: output
      description: turn ended
    monster_table_result:
      type: number
      role: output
      description: monster table result
    selected_monsters:
      type: string
      role: output
      description: selected monsters
    enemies_placed:
      type: boolean
      role: output
      description: enemies placed
  dependencies:
    - key: monster_table
      label: Quest faction encounter table in Bestiary
      external_document: bestiary
    - key: initiative
      label: Prepare initiative tokens
      object_id: procedure.initiative
  steps:
    - id: room
      source_text: Room chance is 50%.
      effects:
        - type: set
          target: base_chance
          value:
            type: literal
            value: 50
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: tile_kind
        right:
          type: literal
          value: room
    - id: corridor
      source_text: Corridor chance is 30%.
      effects:
        - type: set
          target: base_chance
          value:
            type: literal
            value: 30
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: tile_kind
        right:
          type: literal
          value: corridor
    - id: chance
      source_text:
        Apply supplied streak interpretation (first increase +10 after four tiles; cap 70),
        then room-specific modifier.
      effects:
        - type: require
          condition:
            type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: lt
                    left:
                      type: field
                      name: empty_streak
                    right:
                      type: literal
                      value: 4
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: streak_bonus_supplied
                    right:
                      type: literal
                      value: 0
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: empty_streak
                    right:
                      type: literal
                      value: 4
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: streak_bonus_supplied
                    right:
                      type: literal
                      value: 10
              - type: all
                conditions:
                  - type: compare
                    operator: gt
                    left:
                      type: field
                      name: empty_streak
                    right:
                      type: literal
                      value: 4
                  - type: compare
                    operator: gte
                    left:
                      type: field
                      name: streak_bonus_supplied
                    right:
                      type: literal
                      value: 10
        - type: set
          target: encounter_chance
          value:
            type: sum
            values:
              - type: arithmetic
                operator: min
                values:
                  - type: literal
                    value: 70
                  - type: sum
                    values:
                      - type: field
                        name: base_chance
                      - type: field
                        name: streak_bonus_supplied
              - type: field
                name: room_modifier
    - id: empty
      source_text: A roll above chance places no enemies and extends encounter-free streak.
      effects:
        - type: set
          target: encounter_present
          value:
            type: literal
            value: false
        - type: set
          target: streak_after
          value:
            type: sum
            values:
              - type: field
