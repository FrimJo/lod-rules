- id: procedure.initiative
  name: initiative
  section_id: section.into_the_dungeons.initiative
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 106
      printed_page: 104
      heading: Initiative
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 107
      printed_page: 105
      heading: Activation and Overwatch
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Prepare hidden tokens or shuffled LoD cards. Base one per eligible hero/enemy.
    Bashed-door +2 enemy and unilateral Perfect Hearing +1 are first-turn only. Named monsters add
    one each while alive. Extra tokens never grant extra actions.
  fields:
    enemies_placed:
      type: boolean
      role: input
      description: enemies placed
    first_turn:
      type: boolean
      role: input
      description: first turn
    eligible_heroes:
      type: number
      role: input
      description: eligible heroes
      integer: true
      minimum: 0
    eligible_enemies:
      type: number
      role: input
      description: eligible enemies
      integer: true
      minimum: 0
    named_monsters_alive:
      type: number
      role: input
      description: named monsters alive
    bashed_room_door:
      type: boolean
      role: input
      description: bashed room door
    door_encounter:
      type: boolean
      role: input
      description: door encounter
    hero_perfect_hearing:
      type: boolean
      role: input
      description: hero perfect hearing
    enemy_perfect_hearing:
      type: boolean
      role: input
      description: enemy perfect hearing
    use_hearing_bonus:
      type: boolean
      role: input
      description: use hearing bonus
    overwatch_heroes:
      type: number
      role: input
      description: overwatch heroes
      integer: true
      minimum: 0
    supplied_hero_bonus:
      type: number
      role: input
      description: supplied hero bonus
    supplied_enemy_bonus:
      type: number
      role: input
      description: supplied enemy bonus
    hero_tokens:
      type: number
      role: output
      description: hero tokens
      integer: true
      minimum: 0
    enemy_tokens:
      type: number
      role: output
      description: enemy tokens
      integer: true
      minimum: 0
    extra_activations:
      type: number
      role: output
      description: extra activations
    start_new_turn:
      type: boolean
      role: output
      description: start new turn
  dependencies:
    - key: perfect_hearing
      label: Existing Perfect Hearing talent
      object_id: talent.perfect_hearing
  steps:
    - id: base
      source_text:
        One token per model alive/not knocked out; withhold Overwatch hero tokens. Add a token
        for each named monster alive.
      effects:
        - type: require
          condition:
            type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
        - type: set
          target: hero_tokens
          value:
            type: sum
            values:
              - type: arithmetic
                operator: subtract
                values:
                  - type: field
                    name: eligible_heroes
                  - type: field
                    name: overwatch_heroes
              - type: field
                name: supplied_hero_bonus
        - type: set
          target: enemy_tokens
          value:
            type: sum
            values:
              - type: field
                name: eligible_enemies
              - type: field
                name: named_monsters_alive
              - type: field
                name: supplied_enemy_bonus
        - type: set
          target: extra_activations
          value:
            type: literal
            value: 0
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: enemies_placed
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: overwatch_heroes
                right:
                  type: literal
                  value: 0
    - id: bashed
      source_text:
        Bashed room door gives enemy two extra tokens in first turn; discard after all enemies
        act and do not return next turn.
      effects:
        - type: set
          target: enemy_tokens
          value:
            type: sum
            values:
              - type: field
                name: enemy_tokens
              - type: literal
                value: 2
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemies_placed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: bashed_room_door
                right:
                  type: literal
                  value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: overwatch_heroes
                right:
                  type: literal
                  value: 0
    - id: hero_hearing
      source_text: Unilateral hero Perfect Hearing may add one token for first turn after door encounter.
      effects:
        - type: set
          target: hero_tokens
          value:
            type: sum
            values:
              - type: field
                name: hero_tokens
              - type: literal
                value: 1
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemies_placed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_encounter
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: hero_perfect_hearing
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemy_perfect_hearing
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: use_hearing_bonus
                right:
                  type: literal
                  value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: overwatch_heroes
                right:
                  type: literal
                  value: 0
    - id: enemy_hearing
      source_text: Unilateral enemy Perfect Hearing may add one token for first turn after door encounter.
      effects:
        - type: set
          target: enemy_tokens
          value:
            type: sum
            values:
              - type: field
                name: enemy_tokens
              - type: literal
                value: 1
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemies_placed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_encounter
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemy_perfect_hearing
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: hero_perfect_hearing
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: use_hearing_bonus
                right:
                  type: literal
                  value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: overwatch_heroes
                right:
                  type: literal
                  value: 0
    - id: new_turn
      source_text:
        Correct prepared bag starts new turn. Supplied bonuses carry their own source-bound
        limits; they grant no actions.
      effects:
        - type: set
          target: start_new_turn
          value:
            type: literal
            value: true
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: enemies_placed
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: overwatch_heroes
            right:
              type: field
              name: eligible_heroes
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: first_turn
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: overwatch_heroes
                right:
                  type: literal
                  value: 0
  entry_step: base
  exit_step: new_turn
  unresolved_references:
    - Counts are caller-supplied eligible models. Spell/rest/quest bonus-token outcomes are explicit
      inputs, not inferred actions.
