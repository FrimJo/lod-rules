- id: procedure.wandering_monster
  name: Wandering monster movement and reveal
  section_id: section.into_the_dungeons.wandering_monsters
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 90
      pdf_page: 92
      heading: Wandering Monsters
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    A threat roll or dungeon event may trigger a Wandering Monster. This will be represented by a
    token as the exact nature of these monsters are still unknown. Place the token on the start
    tile, just outside the door. When the heroes have performed all of their actions, this token
    will move into the first room of the dungeon. The token always moves 4 squares. Once in the new
    room, it will randomise the direction of its new move. ... If it enters a room from where it has
    line of sight to the characters and they are within 10 squares, roll on the quest-specific
    Monster Table and place the corresponding monsters as close to the token as possible. Then set
    up the initiative tokens to determine who acts first.
  fields:
    direction_roll:
      type: number
      role: input
      description: Supplied d6 direction roll.
      integer: true
      minimum: 1
      maximum: 6
    route:
      type: string
      role: input
      description: Caller supplied route chosen for movement.
    distance:
      type: number
      role: input
      description: Distance from token to heroes.
      integer: true
      minimum: 0
    heroes_in_los:
      type: boolean
      role: input
      description: Heroes are in line of sight.
    door_state:
      type: string
      role: state
      description: Door state supplied by caller.
    door_roll:
      type: number
      role: input
      description: 'Supplied next-turn d6 passage roll: ordinary 2–6, sealed/wedged 5–6.'
      integer: true
      minimum: 1
      maximum: 6
    door_held_previous_turn:
      type: boolean
      role: input
      description: The token was stopped at this door on the previous turn and now makes the pass roll.
    chasm:
      type: boolean
      role: input
      description: Token is at a chasm.
    cross_chasm:
      type: boolean
      role: input
      description: Token crosses on this turn.
    movement_squares:
      type: number
      role: output
      description:
        Four-square movement allowance; actual path and distance to an obstacle are supplied
        geometry.
      integer: true
      minimum: 0
      maximum: 4
    movement_stops:
      type: boolean
      role: state
      description: Movement stops this turn.
    reveal_monsters:
      type: boolean
      role: state
      description: Quest monsters should be placed.
    heroes_finished:
      type: boolean
      role: input
      description: All heroes have performed their actions.
    new_token:
      type: boolean
      role: input
      description: New wandering monster token must be placed.
    placement:
      type: string
      role: output
      description: Initial placement on the start tile just outside the door.
    entered_room:
      type: boolean
      role: input
      description: Supplied geometry says token entered a room this turn.
    closed_door_blocks_los:
      type: boolean
      role: input
      description: A closed door lies between token and heroes.
    direction:
      type: string
      role: output
      description: Direction selected by the d6.
    waiting_at_door:
      type: boolean
      role: state
      description: Token remains at the closed door until passage succeeds.
    seal_broken:
      type: boolean
      role: state
      description: Seal broken when passage succeeds.
    chasm_held_previous_turn:
      type: boolean
      role: input
      description: Token reached this chasm during an earlier turn.
    crossed_chasm:
      type: boolean
      role: state
      description: This chasm has been crossed; returning across it is forbidden.
    cross_back_requested:
      type: boolean
      role: input
      description: Supplied route would cross back over the same chasm.
  dependencies:
    - key: quest_monster_table
      label: Quest-specific Monster Table
      section_id: section.quest_book_i
    - key: initiative
      label: Initiative tokens
      section_id: section.into_the_dungeons.initiative
      object_id: procedure.initiative
    - key: iron_wedges
      label: Iron Wedges equipment
      object_id: equipment.general.iron_wedges
  steps:
    - id: placement
      source_text: >-
        A threat roll or dungeon event may trigger a Wandering Monster. This will be represented by
        a token as the exact nature of these monsters are still unknown. Place the token on the
        start tile, just outside the door.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: new_token
        right:
          type: literal
          value: true
      effects:
        - type: set
          target: placement
          value:
            type: literal
            value: start_tile_outside_door
    - id: move_after_heroes
      source_text: >-
        When the heroes have performed all of their actions, this token will move into the first
        room of the dungeon. The token always moves 4 squares.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: heroes_finished
        right:
          type: literal
          value: true
      effects:
        - type: set
          target: movement_squares
          value:
            type: literal
            value: 4
        - type: set
          target: movement_stops
          value:
            type: literal
            value: false
        - type: set
          target: reveal_monsters
          value:
            type: literal
            value: false
    - id: choose_direction
      source_text: >-
        Once in the new room, it will randomise the direction of its new move. To decide this, roll
        1d6. On a result of 1 it will move back to where it came from or towards/through a random
        door leading away from the heroes, on 2-6 it moves towards the heroes. This roll will be
        repeated every turn, meaning that the token could theoretically move back and forth.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: heroes_finished
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: door_held_previous_turn
            right:
              type: literal
              value: false
      effects: []
      substeps:
        - id: away
          source_text: >-
            On a result of 1 it will move back to where it came from or towards/through a random
            door leading away from the heroes, ...
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: direction_roll
            right:
              type: literal
              value: 1
          effects:
            - type: set
              target: direction
              value:
                type: literal
                value: away
        - id: toward
          source_text: >-
            ... on 2-6 it moves towards the heroes.
          when:
            type: compare
            operator: gte
            left:
              type: field
              name: direction_roll
            right:
              type: literal
              value: 2
          effects:
            - type: set
              target: direction
              value:
                type: literal
                value: toward
    - id: obstacles
      source_text: >-
        A closed door will stop the token’s movement for that turn. ... A Wandering Monster that
        reaches a chasm will stop.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: heroes_finished
        right:
          type: literal
          value: true
      effects: []
      substeps:
        - id: closed_door
          source_text: >-
            A closed door will stop the token’s movement for that turn. ... A magically sealed door
            or Iron Wedged door will stop the token for that turn, ... A wandering monster will
            remain at a closed door until it manages to pass through.
          when:
            type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_state
                right:
                  type: literal
                  value: closed
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_state
                right:
                  type: literal
                  value: iron_wedged
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_state
                right:
                  type: literal
                  value: magically_sealed
          effects:
            - type: set
              target: movement_stops
              value:
                type: literal
                value: true
            - type: set
              target: waiting_at_door
              value:
                type: literal
                value: true
        - id: break_seal
          source_text: >-
            A magically sealed door or Iron Wedged door will stop the token for that turn, and it
            must roll 5-6 to continue through the door next turn, instead of the normal 2-6. The
            seal is then broken, and the token may pass through.
          when:
            type: all
            conditions:
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: door_state
                    right:
                      type: literal
                      value: magically_sealed
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: door_state
                    right:
                      type: literal
                      value: iron_wedged
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_held_previous_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: gte
                left:
                  type: field
                  name: door_roll
                right:
                  type: literal
                  value: 5
          effects:
            - type: set
              target: seal_broken
              value:
                type: literal
                value: true
        - id: door_passes
          source_text: >-
            If it rolls 2-6 next turn, the door is opened, and the token may pass through. ... it
            must roll 5-6 to continue through the door next turn, instead of the normal 2-6.
          when:
            type: all
            conditions:
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: door_state
                    right:
                      type: literal
                      value: closed
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: door_state
                    right:
                      type: literal
                      value: iron_wedged
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: door_state
                    right:
                      type: literal
                      value: magically_sealed
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_held_previous_turn
                right:
                  type: literal
                  value: true
              - type: any
                conditions:
                  - type: all
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: door_state
                        right:
                          type: literal
                          value: closed
                      - type: compare
                        operator: gte
                        left:
                          type: field
                          name: door_roll
                        right:
                          type: literal
                          value: 2
                  - type: all
                    conditions:
                      - type: any
                        conditions:
                          - type: compare
                            operator: eq
                            left:
                              type: field
                              name: door_state
                            right:
                              type: literal
                              value: iron_wedged
                          - type: compare
                            operator: eq
                            left:
                              type: field
                              name: door_state
                            right:
                              type: literal
                              value: magically_sealed
                      - type: compare
                        operator: gte
                        left:
                          type: field
                          name: door_roll
                        right:
                          type: literal
                          value: 5
          effects:
            - type: set
              target: door_state
              value:
                type: literal
                value: open
            - type: set
              target: waiting_at_door
              value:
                type: literal
                value: false
            - type: set
              target: movement_stops
              value:
                type: literal
                value: false
        - id: chasm_arrival
          source_text: >-
            A Wandering Monster that reaches a chasm will stop.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm_held_previous_turn
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: movement_stops
              value:
                type: literal
                value: true
        - id: chasm_wait
          source_text: >-
            A Wandering Monster that reaches a chasm will stop. If it rolls to continue across the
            chasm during the following turn, ...
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm_held_previous_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: cross_chasm
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: crossed_chasm
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: movement_stops
              value:
                type: literal
                value: true
        - id: chasm_crossing
          source_text: >-
            If it rolls to continue across the chasm during the following turn, it will end up on
            the other side, but may not continue its move. On the turn after that, it will continue,
            ...
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: chasm_held_previous_turn
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: cross_chasm
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: crossed_chasm
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: movement_stops
              value:
                type: literal
                value: true
            - type: set
              target: crossed_chasm
              value:
                type: literal
                value: true
        - id: no_crossing_back
          source_text: >-
            On the turn after that, it will continue, and it will never go back across the chasm
            again.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: crossed_chasm
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: cross_back_requested
                right:
                  type: literal
                  value: true
          effects:
            - type: set
              target: movement_stops
              value:
                type: literal
                value: true
            - type: require
              condition:
                type: compare
                operator: eq
                left:
                  type: field
                  name: cross_back_requested
                right:
                  type: literal
                  value: false
    - id: reveal
      source_text: >-
        If it enters a room from where it has line of sight to the characters and they are within 10
        squares, roll on the quest-specific Monster Table and place the corresponding monsters as
        close to the token as possible. Then set up the initiative tokens to determine who acts
        first. ... It also blocks LOS and delays the reveal of a token.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: heroes_finished
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: entered_room
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: distance
            right:
              type: literal
              value: 10
          - type: compare
            operator: eq
            left:
              type: field
              name: heroes_in_los
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: closed_door_blocks_los
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: waiting_at_door
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: reveal_monsters
          value:
            type: literal
            value: true
        - type: invoke
          dependency: quest_monster_table
        - type: invoke
          dependency: initiative
  entry_step: placement
  exit_step: reveal
  unresolved_references:
    - 'Iron Wedges (Appendix III) says any enemy needs 6 AP to pass a wedged door; this heading
      says a 5-6 roll lets the token continue. Both are preserved: issue.phase6.iron_wedges_movement.'
    - Movement geometry, the exact route and the distance to the heroes are supplied spatial facts.
    - "The page does not say whether the 2-6 (or 5-6) roll at a closed door is the turn's 1d6
      direction roll or a separate roll; door_roll is supplied: issue.wandering.door_roll."
  see_also:
    - section.into_the_dungeons.wandering_monsters
    - section.into_the_dungeons.obstacles
    - section.into_the_dungeons.the_threat_level
    - section.into_the_dungeons.table
  issues:
    - issue.phase6.iron_wedges_movement
    - issue.wandering.door_roll
- id: procedure.trap_resolution
  name: Detecting, triggering and disarming traps
  section_id: section.into_the_dungeons.triggering_a_trap
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 90
      pdf_page: 92
      heading: Triggering a Trap
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 99
      pdf_page: 101
      heading: Traps in Doors and Chests
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 90
      pdf_page: 92
      heading: Disarming a Trap
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 90
      pdf_page: 92
      heading: Mimics as Traps
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    Whenever a trap has been sprung through a Threat Roll or a Search Roll, draw a trap card and
    randomise who has triggered the trap. The poor adventurer still has a chance to avoid the trap
    by rolling a successful Perception Roll with all applicable modifiers. If unsuccessful, the trap
    is triggered and damage is dealt. ... Disarming a trap takes 2 AP and is done using the Pick
    Lock Skill. No Lock Picks are needed. A success will remove the trap, but a failure will set the
    trap off.
  fields:
    perception_succeeded:
      type: boolean
      role: input
      description: Supplied Perception result.
    disarm_attempted:
      type: boolean
      role: input
      description: Actor attempts to disarm.
    disarm_succeeded:
      type: boolean
      role: input
      description: Supplied Pick Lock result.
    has_disarm_tool:
      type: boolean
      role: input
      description: The disarming hero has a lock pick or a trap disarming kit (changelog 2.21 entry 121).
    deliberate_trigger:
      type: boolean
      role: input
      description: Actor deliberately triggers detected trap.
    trap_detected:
      type: boolean
      role: state
      description: Trap has been detected.
    trap_removed:
      type: boolean
      role: state
      description: Trap removed by disarming.
    trap_triggered:
      type: boolean
      role: state
      description: Trap is triggered.
    is_mimic:
      type: boolean
      role: input
      description: Trap is a Mimic.
    hero_attacked_mimic:
      type: boolean
      role: input
      description: A hero attacked the Mimic first.
    actor_is_lower_undead:
      type: boolean
      role: input
      description: Actor is Lower Undead.
    door_or_chest:
      type: boolean
      role: input
      description: Trap is in a door or chest.
    initial_check:
      type: boolean
      role: input
      description: New trap from Threat/Search or an opening attempt; not an already detected trap.
    actor_is_enemy:
      type: boolean
      role: input
      description: Actor is an enemy.
    forced_entry:
      type: boolean
      role: input
      description: A shove or monster special rule forces entry into a trapped square.
    enters_trapped_square:
      type: boolean
      role: input
      description: Supplied geometry places actor in a marked trapped square.
    card_data_supplied:
      type: boolean
      role: input
      description: Card-specific target and consequence data has been supplied.
    card_allows_save:
      type: boolean
      role: input
      description: Card explicitly permits a saving throw.
    affected_actors:
      type: string
      role: input
      description: Card-supplied affected actors; may include actors besides the opener.
    victim_selection:
      type: string
      role: output
      description: Random hero for Threat/Search; opener for door/chest; entrant for marked square.
    action_points_spent:
      type: number
      role: output
      description: Known disarm or deliberate door/chest triggering cost.
    mimic_can_attack:
      type: boolean
      role: output
      description: Detected Mimic cannot attack until a hero attacks it first.
    enemy_avoids_square:
      type: boolean
      role: output
      description: Enemies avoid traps except Lower Undead or forced entry.
    opening_eligible:
      type: boolean
      role: output
      description: Trap no longer prevents opening; lock is a separate supplied condition.
    saving_throw_allowed:
      type: boolean
      role: output
      description: No saving throw unless the card says otherwise.
    resolved_affected_actors:
      type: string
      role: output
      description: Affected actors supplied by the trap card.
    card_effects_resolved:
      type: boolean
      role: state
      description: Supplied card consequences have already been handled; a triggered trap is no longer active.
  dependencies:
    - key: trap_card
      label: Trap card supplies identity, modifiers, targets, damage and effects
    - key: perception_roll
      label: Perception roll and applicable modifiers
    - key: pick_lock_roll
      label: Pick Lock roll with printed trap modifier
    - key: trap_disarming_kit
      label: Trap Disarming Kit equipment
      object_id: equipment.tool.trap_disarming_kit
  steps:
    - id: draw_card
      source_text: >-
        Whenever a trap has been sprung through a Threat Roll or a Search Roll, draw a trap card and
        randomise who has triggered the trap.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: initial_check
        right:
          type: literal
          value: true
      effects:
        - type: invoke
          dependency: trap_card
    - id: random_victim
      source_text: >-
        ... randomise who has triggered the trap.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: initial_check
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: door_or_chest
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: victim_selection
          value:
            type: literal
            value: random_hero
    - id: opener
      source_text: >-
        If the door or chest is trapped, the hero attempting to open must make a Perception Roll
        (modified by applicable Talents and the modifier mentioned on the card next to the eye).
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: initial_check
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: door_or_chest
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: victim_selection
          value:
            type: literal
            value: opener
    - id: perception
      source_text: >-
        The poor adventurer still has a chance to avoid the trap by rolling a successful Perception
        Roll with all applicable modifiers. If unsuccessful, the trap is triggered and damage is
        dealt.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: initial_check
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_removed
            right:
              type: literal
              value: false
      effects: []
      substeps:
        - id: avoid
          source_text: >-
            If the perception roll is successful, the trap will not be triggered. It will remain
            where it is until triggered or disarmed. ... If you succeed, the trap has been
            discovered without setting it off.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: perception_succeeded
            right:
              type: literal
              value: true
          effects:
            - type: set
              target: trap_detected
              value:
                type: literal
                value: true
        - id: perception_failure
          source_text: >-
            If unsuccessful, the trap is triggered and damage is dealt.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: perception_succeeded
            right:
              type: literal
              value: false
          effects:
            - type: set
              target: trap_triggered
              value:
                type: literal
                value: true
    - id: disarm
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 90
          pdf_page: 92
          heading: Disarming a Trap
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 26
          pdf_page: 28
          heading: Pick Locks (DEX)
          extraction:
            method: text
            confidence: high
            visually_verified: false
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 99
          pdf_page: 101
          heading: Traps in Doors and Chests
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 19
          printed_page: null
          heading: '2.21'
          extraction:
            method: text
            confidence: high
            visually_verified: false
          locator:
            row: 121
      source_text: >-
        Disarming a trap takes 2 AP and is done using the Pick Lock Skill. No Lock Picks are needed.
        ... The modifier next to the cogs is applied to the disarm roll.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_detected
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_removed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_triggered
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: disarm_attempted
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: has_disarm_tool
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: is_mimic
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: invoke
          dependency: pick_lock_roll
      substeps:
        - id: disarmed
          source_text: >-
            A success will remove the trap, ...
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: disarm_succeeded
            right:
              type: literal
              value: true
          effects:
            - type: set
              target: trap_removed
              value:
                type: literal
                value: true
        - id: disarm_failed
          source_text: >-
            ... but a failure will set the trap off.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: disarm_succeeded
            right:
              type: literal
              value: false
          effects:
            - type: set
              target: trap_triggered
              value:
                type: literal
                value: true
    - id: deliberate
      source_text: >-
        It can now be disarmed or deliberately set off (2 AP).
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: door_or_chest
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_detected
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_removed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_triggered
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: is_mimic
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: disarm_attempted
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: deliberate_trigger
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: set
          target: trap_triggered
          value:
            type: literal
            value: true
    - id: special_cases
      source_text: >-
        All enemies will avoid traps except Lower Undead who will behave as though the square is a
        normal square. Enemies and heroes can also be shoved into traps if they are standing next to
        them. There are also other monster special rules that could force a hero to enter a trapped
        square. The enemies suffer damage just as a hero would.
      effects:
        - type: set
          target: enemy_avoids_square
          value:
            type: literal
            value: false
        - type: set
          target: mimic_can_attack
          value:
            type: literal
            value: false
      substeps:
        - id: enemy_avoids
          source_text: >-
            All enemies will avoid traps except Lower Undead who will behave as though the square is
            a normal square. Enemies and heroes can also be shoved into traps if they are standing
            next to them.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actor_is_enemy
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: actor_is_lower_undead
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: forced_entry
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: enemy_avoids_square
              value:
                type: literal
                value: true
        - id: square_entry
          source_text: >-
            If the trap is in a square, the hero may leave the square. Mark it with a trap token.
            Anyone entering that square will trigger the trap.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_or_chest
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enters_trapped_square
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_removed
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: enemy_avoids_square
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_triggered
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: victim_selection
              value:
                type: literal
                value: entrant
            - type: set
              target: trap_triggered
              value:
                type: literal
                value: true
        - id: mimic_attacks
          source:
            - document: rulebook.second_printing.eng
              file: source/Rulebook-2nd-printing-ENGa.pdf
              printed_page: 90
              pdf_page: 92
              heading: Mimics as Traps
              extraction:
                method: text
                confidence: high
                visually_verified: true
          source_text: >-
            Mimics that are detected with Perception are not able to attack unless a hero attacks
            first.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_mimic
                right:
                  type: literal
                  value: true
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: trap_detected
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: hero_attacked_mimic
                    right:
                      type: literal
                      value: true
          effects:
            - type: set
              target: mimic_can_attack
              value:
                type: literal
                value: true
    - id: card_consequences
      source_text: >-
        If you fail to disarm the trap or deliberately set if off, you suffer the consequences. ...
        Some traps might affect others than the individual setting it off. Unless otherwise noted,
        there are no saving throws of any kind for those affected.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_triggered
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_mimic
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: card_effects_resolved
            right:
              type: literal
              value: false
      effects: []
      substeps:
        - id: missing_card
          source_text: >-
            If unsuccessful, the trap is triggered and damage is dealt.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: card_data_supplied
            right:
              type: literal
              value: false
          effects:
            - type: unresolved
              issue_id: issue.phase6.trap_resolution_deferred
        - id: supplied_card
          source_text: >-
            Some traps might affect others than the individual setting it off. Unless otherwise
            noted, there are no saving throws of any kind for those affected.
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: card_data_supplied
            right:
              type: literal
              value: true
          effects:
            - type: set
              target: resolved_affected_actors
              value:
                type: field
                name: affected_actors
            - type: set
              target: saving_throw_allowed
              value:
                type: field
                name: card_allows_save
            - type: invoke
              dependency: trap_card
            - type: set
              target: card_effects_resolved
              value:
                type: literal
                value: true
    - id: mimic_interaction
      source_text: >-
        A detected Mimic left alone will not fight.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: is_mimic
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: trap_detected
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disarm_attempted
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: deliberate_trigger
                right:
                  type: literal
                  value: true
      effects:
        - type: unresolved
          issue_id: issue.phase6.trap_resolution_deferred
    - id: opening_eligibility
      source_text: >-
        That means that a trapped door or chest cannot be opened until the trap has been dealt with.
      effects:
        - type: set
          target: opening_eligible
          value:
            type: literal
            value: false
      substeps:
        - id: trap_dealt_with
          source_text: >-
            The door or chest can then be opened, or the square can be traversed as normal. ... The
            door/chest is opened as part of the action.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: door_or_chest
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_mimic
                right:
                  type: literal
                  value: false
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: trap_removed
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: trap_triggered
                    right:
                      type: literal
                      value: true
          effects:
            - type: set
              target: opening_eligible
              value:
                type: literal
                value: true
  entry_step: draw_card
  exit_step: opening_eligibility
  issues:
    - issue.phase6.trap_resolution_deferred
    - issue.traps.disarm_lockpick
  unresolved_references:
    - The trap card (its modifiers next to the eye and the cogs, affected actors, damage and any
      saving throw) is not in this book; those values are supplied inputs or unresolved.
    - Detected Mimic disarming or deliberate triggering is not defined by these paragraphs; it is
      resolved from its card, without assuming it behaves as an ordinary device.
    - 'Disarming follows the designer ruling (changelog 2.21 entry 121): a lock pick or a trap
      disarming kit is needed. The printed No Lock Picks are needed stays quoted.'
