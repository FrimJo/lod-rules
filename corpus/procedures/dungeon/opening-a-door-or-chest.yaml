- id: procedure.open_door_or_chest
  name: Opening a Door or Chest
  section_id: section.into_the_dungeons.opening_a_door_or_chest
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 99
      pdf_page: 101
      heading: Opening a Door or Chest
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 102
      printed_page: 100
      heading: Opening a door or a chest
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 88
      printed_page: 86
      heading: Initial Setup
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: vonbraus.changelog_2_2x
      file: source/vonbraus-changelog-2.2x.pdf
      pdf_page: 24
      printed_page: null
      heading: '2.21'
      extraction:
        method: text
        confidence: high
        visually_verified: true
      locator:
        row: 155
  status: extracted
  confidence: high
  source_text: |-
    Opening a door or chest costs 1 Action Point and requires the model to be adjacent to the
    door or chest. Perform the following steps: 1. Increase the Threat Level by 1. 2. Roll 1d10
    and 1d6 simultaneously. If the d6 ends up a 6, the door or chest is trapped. Draw a trap
    card. Resolve the trap (if any), then check the Door Table to see if it is locked. See
    'Locked' below. 3. Once a door is unlocked, flip the top card, and place the corresponding
    new section. If it is a chest, roll on the Furniture Treasure Table to learn what it
    contains. 4. In case of a door, roll to see if there are any enemies inside the room. See
    'Encounters' and 'Placing Enemies' on page 104.
  fields:
    threat_level:
      type: number
      role: state
      description: Current Threat Level; increased by 1 as the first step of the attempt.
      integer: true
      minimum: 2
    d6_roll:
      type: number
      role: input
      description: Printed 1d6 from the simultaneous roll; a 6 means the door or chest is trapped.
      integer: true
      minimum: 1
      maximum: 6
    d10_roll:
      type: number
      role: input
      description: Printed 1d10 from the simultaneous roll, keying the Door Table; the 0 face is 10.
      integer: true
      minimum: 1
      maximum: 10
      dice:
        count: 1
        sides: 10
    door_table_result:
      type: string
      role: output
      description: Door/chest column of the Door Table row for d10_roll (Open or Locked).
    locked:
      type: boolean
      role: input
      description: Supplied remaining lock state after Door Table and any locked-door resolution.
    is_chest:
      type: boolean
      role: input
      description: Whether the model being opened is a chest rather than a door.
    trap_prevents_opening:
      type: boolean
      role: input
      description: Whether a detected trap remains unresolved and prevents opening.
    adjacent:
      type: boolean
      role: input
      description: 'Supplied geometry: the model is adjacent to the door/chest.'
    action_points_spent:
      type: number
      role: output
      description: Opening attempt costs 1 AP; separate resolution costs are not included.
    initial_entrance:
      type: boolean
      role: input
      description: True only for the stone-side door on the starting tile (PDF 88).
  dependencies:
    - key: threat
      label: The Threat Level
      section_id: section.into_the_dungeons.the_threat_level
    - key: door_table
      label: Door Table (1d10 to door/chest difficulty)
      section_id: section.into_the_dungeons.opening_a_door_or_chest.table
      object_id: table.dungeon.door_chest_difficulty
    - key: exploration_cards
      label: Reading the Exploration Cards
      section_id: section.into_the_dungeons.reading_the_exploration_cards
      object_id: procedure.dungeon_route
    - key: furniture_treasure_table
      label: Furniture Treasure Table
      object_id: table.treasure.furniture
    - key: encounters
      label: Encounters and Placing Enemies
      section_id: section.into_the_dungeons.encounters
      object_id: procedure.encounters
    - key: trap_resolution
      label: Detect and resolve the trap
      object_id: procedure.trap_resolution
    - key: locked_resolution
      label: Force, crowbar or pick the lock
      object_id: procedure.locked_door_and_close
  steps:
    - id: spend
      source_text: |-
        Opening a door or chest costs 1 Action Point and requires the model to be adjacent to
        the door or chest. Perform the following steps:
      effects:
        - type: require
          condition:
            type: all
            conditions:
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: initial_entrance
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: is_chest
                    right:
                      type: literal
                      value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent
                right:
                  type: literal
                  value: true
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 1
    - id: increase_threat
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 99
          pdf_page: 101
          heading: Opening a Door or Chest
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          extraction:
            method: text
            confidence: high
            visually_verified: true
          locator:
            row: 155
      source_text: Increase the Threat Level by 1.
      effects:
        - type: add
          target: threat_level
          value:
            type: literal
            value: 1
          duration: until_dungeon_exit
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
    - id: roll_open
      source_text: |-
        Roll 1d10 and 1d6 simultaneously. If the d6 ends up a 6, the door or chest is trapped.
        Draw a trap card. Resolve the trap (if any), then check the Door Table to see if it is
        locked. See 'Locked' below.
      effects: []
      substeps:
        - id: trapped
          source_text:
            If the d6 ends up a 6, the door or chest is trapped. Draw a trap card. Resolve the trap
            (if any).
          when:
            type: compare
            operator: eq
            left:
              type: field
              name: d6_roll
            right:
              type: literal
              value: 6
          effects:
            - type: invoke
              dependency: trap_resolution
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: true
    - id: check_locked
      source_text: Then check the Door Table to see if it is locked. See 'Locked' below.
      effects:
        - type: lookup
          table_id: table.dungeon.door_chest_difficulty
          key_column: result
          key:
            type: field
            name: d10_roll
          value_column: door_chest
          target: door_table_result
          on_missing_issue: issue.phase4.lookup_domain
        - type: invoke
          dependency: door_table
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
      substeps:
        - id: locked_handoff
          source_text: 'See ‘Locked’ below. ... If the door or chest is locked, you can try to force it open. ... Another option is to use a crowbar. ... You could also try to pick the lock ...'
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: locked
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_prevents_opening
                right:
                  type: literal
                  value: false
          effects:
            - type: invoke
              dependency: locked_resolution
    - id: reveal
      source_text: |-
        Once a door is unlocked, flip the top card, and place the corresponding new section. If
        it is a chest, roll on the Furniture Treasure Table to learn what it contains.
      effects: []
      substeps:
        - id: door_reveal
          source_text: Once a door is unlocked, flip the top card, and place the corresponding new section.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: locked
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: initial_entrance
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_prevents_opening
                right:
                  type: literal
                  value: false
          effects:
            - type: invoke
              dependency: exploration_cards
        - id: chest_reveal
          source_text: If it is a chest, roll on the Furniture Treasure Table to learn what it contains.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: true
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: locked
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: initial_entrance
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_prevents_opening
                right:
                  type: literal
                  value: false
          effects:
            - type: invoke
              dependency: furniture_treasure_table
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: adjacent
            right:
              type: literal
              value: true
    - id: enemies
      source_text: |-
        In case of a door, roll to see if there are any enemies inside the room. See
        'Encounters' and 'Placing Enemies' on page 104.
      effects:
        - type: invoke
          dependency: encounters
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: initial_entrance
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: is_chest
                right:
                  type: literal
                  value: false
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: locked
                    right:
                      type: literal
                      value: false
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: initial_entrance
                    right:
                      type: literal
                      value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: trap_prevents_opening
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent
                right:
                  type: literal
                  value: true
  entry_step: spend
  exit_step: enemies
  issues:
    - issue.phase6.trap_resolution_deferred
    - issue.phase6.furniture_treasure_table_location
    - issue.phase6.door_open_threat_source
  unresolved_references:
    - "the Furniture Treasure Table (cited as chapter III: 'Treasures' and as in Appendix III; the
      furniture treasure tables are printed in Appendix V)"
  see_also:
    - section.into_the_dungeons.the_threat_level
    - section.into_the_dungeons.opening_a_door_or_chest.table
    - section.into_the_dungeons.encounters
