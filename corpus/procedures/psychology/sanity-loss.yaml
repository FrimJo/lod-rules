            row: Miscasting a spell
        - document: vonbraus.faq_gamefound
          file: source/vonbraus-faq-2026-10-03.html
          heading: There are two different mentions about the effect of miscast. One is -1d3 Sanity and one is to roll on the table. Which one is correct?
          extraction:
            method: text
            confidence: high
            visually_verified: false
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 23
          printed_page: null
          heading: '2.21'
          extraction:
            method: text
            confidence: high
            visually_verified: false
          locator:
            row: 146
      source_text:
        'Miscasting a spell: -1d3. Designer ruling: roll on the Miscast table instead; the table
        owns any Sanity loss.'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_event_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: event_kind
            right:
