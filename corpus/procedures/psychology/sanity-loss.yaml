    - id: request_room_loss
      source: *a4
      source_text:
        Request the actual applicable Exploration Card loss once. The existing room-event rule
        records a handoff, not a numerical Sanity mutation.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_event_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: event_kind
            right:
              type: literal
              value: room_event
          - type: compare
            operator: eq
            left:
              type: field
              name: room_loss_amount_supplied
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_room_handoff_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: sanity_room_handoff_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.sanity.loss.room_event
    - id: apply_room_loss
      source: *a4
      source_text: Apply the actually supplied card loss amount here once. Do not duplicate a
        caller-applied loss or invent a card value.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_event_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: event_kind
            right:
              type: literal
              value: room_event
          - type: compare
            operator: eq
            left:
              type: field
              name: room_loss_amount_supplied
            right:
              type: literal
              value: true
      effects:
        - type: add
          target: sanity
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: room_sanity_loss
              - type: literal
                value: -1
          duration: immediate
        - type: set
          target: sanity_loss_processed
          value:
            type: literal
            value: true
    - id: below_zero_unknown
      source:
        - *a1
        - &a5
          document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Conditions
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        The book says reaches 0 and does not define an overshoot, clamp or cascading diagnoses.
        Retain the numerical loss and explicit unresolved boundary.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_system_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: sanity
            right:
              type: literal
              value: 0
      effects:
        - type: unresolved
          issue_id: issue.phase4.sanity_boundaries
    - id: exact_zero
      source:
        - *a1
        - *a5
      source_text:
        Exactly zero starts a distinct pending acquisition episode only when none is pending.
        Initialize that new episode markers once; repeated checks while awaiting diagnosis preserve
        its draw/history state.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_system_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_condition_pending
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: sanity_condition_pending
          value:
            type: literal
            value: true
        - type: set
          target: condition_episode_processed
          value:
            type: literal
            value: false
        - type: set
          target: condition_draw_processed
          value:
            type: literal
            value: false
        - type: set
          target: condition_selected
          value:
            type: literal
            value: false
        - type: set
          target: condition_diagnosis_processed
          value:
            type: literal
            value: false
        - type: set
          target: condition_draw_rejected
          value:
            type: literal
            value: false
        - type: set
          target: condition_reroll_handoff_processed
          value:
            type: literal
            value: false
        - type: set
          target: condition_effect_handoff_processed
          value:
            type: literal
            value: false
        - type: set
          target: sanity_condition_handoff_processed
          value:
            type: literal
            value: false
    - id: condition_handoff
      source:
        - *a5
      source_text: Request the exact-zero condition resolution once. Selection, duplicate rerolls,
        active-condition count and Sanity reset remain owned by the separate Conditions checkpoint.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_system_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_condition_pending
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity_condition_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: sanity
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: sanity_condition_handoff_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: condition_resolution
  entry_step: check_event
  exit_step: condition_handoff
