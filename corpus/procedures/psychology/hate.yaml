            right:
              type: literal
              value: true
      effects:
        - type: set
          target: hate_dodge_modifier
          value:
            type: literal
            value: -5
  entry_step: report
  exit_step: dodge
  unresolved_references:
    - 'Step report: marks the check unresolved until the owned check context is established.'
    - 'Step clear_inactive: with no owned Talent, no confirmed check or a phase other than attack,
      parry or dodge, only this contribution is cleared.'
    - 'Step request_context: a missing enemy match or unresolved check scope is requested once
      without asserting a zero contribution.'
    - 'Step reset_known: the fixed contribution is recomputed for each resolved check; replays do
      not accumulate.'
