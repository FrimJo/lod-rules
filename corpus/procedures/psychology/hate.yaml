          heading: Mental Talents
          locator:
            table: Mental Talents
            row: Hate
            column: Description
          extraction:
            method: table
            confidence: high
            visually_verified: true
      source_text: This Talent may be taken several times making the hero hate different enemies.
      when: &a5
        type: all
        conditions:
          - *a4
          - type: compare
            operator: eq
            left:
              type: field
