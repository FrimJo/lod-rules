  dependencies: []
  steps:
    - id: requirements
      source:
        - &a1
          document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
