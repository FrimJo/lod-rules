    - id: eligible
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Who Can Fight?
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Fighting in Doorways
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Shooting at Large-Sized Monsters and Flyers
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Shooting in Melee
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Obstacles and LOS When Shooting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Loading/Reloading a Ranged Weapon
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Different Combat Actions
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Charge Attack
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - *a1
      source_text:
        "Models that are adjacent may strike at each other. Models equipped with a weapon with
        the Reach Special Rule, can strike at an enemy 1 square away, even if there is a friendly
        (not enemy) model in between. Models equipped with Missile Weapons have a maximum reach of
        10 squares in a dungeon, and unlimited range outdoors. ... Any character standing next to a
        doorway can attack or shove an enemy standing on any of the opposite two squares on the
        other side of the doorway. ... Large, X-large and flying Monsters can always be targeted if
        they are in LOS, even if there are other models in the way. ... a Ranged Weapon cannot be
        used while adjacent to an enemy, unless specified otherwise by other rules. ... Shooting can
        only be done if you can trace a LOS from the centre of the shooter's square to the centre of
        the target's square. ... You cannot shoot through a model if the shot is done along a
        straight line. ... As long as a model has arrows/bolts in a quiver, a model can reload a bow
        or crossbow. ... 1 AP: ... - Standard Attack. ... 2 AP: ... - Power Attack. - Charge Attack.
        ... In order to charge an enemy, there must be at least 1 empty square between you and the
        enemy. A charge must also be done in a straight or strict diagonal line and may not pass a
        square covered more than 50% by an obstacle. ... Line of Sight? ... Blocked? ... Can't
        shoot. Choose a different action"
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: adjacent
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: doorway_opposite
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: reach_valid
                        right:
                          type: literal
                          value: true
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: ranged
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: in_los
                    right:
                      type: literal
                      value: true
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: outdoors
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: lte
                        left:
                          type: field
                          name: distance
                        right:
                          type: literal
                          value: 10
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: enemy_adjacent
                        right:
                          type: literal
                          value: false
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: ranged_exception
                        right:
                          type: literal
                          value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: loaded
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: ammunition_available
                    right:
                      type: literal
                      value: true
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: straight_model_block
                        right:
                          type: literal
                          value: false
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: large_or_flying
                        right:
                          type: literal
                          value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_power_restriction_resolved
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: action
                right:
                  type: literal
                  value: standard
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: action
                    right:
                      type: literal
                      value: power
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: action
                    right:
                      type: literal
                      value: charge
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: charge_path_valid
                    right:
                      type: literal
                      value: true
      effects:
        - type: set
          target: attack_eligible
          value:
            type: literal
            value: true
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 1
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: position_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: height_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: shield_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: parry_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: to_hit_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: obstacle_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: aim_modifier
          value:
            type: literal
            value: 0
    - id: power
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Different Combat Actions
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Power Attack
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        '2 AP: ... - Power Attack. ... This attack gives the model a +20 bonus to CS and a
        re-roll of DMG (keeping the last roll).'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: action
            right:
              type: literal
              value: power
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 20
    - id: charge
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Different Combat Actions
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Charge Attack
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: '2 AP: ... - Charge Attack. ... Your momentum will give you +10 CS.'
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: action
            right:
              type: literal
              value: charge
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 10
    - id: behind
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Attacking from Behind
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: Striking or shooting a target from behind adds +20 to the CS of the attacker. ...
        Likewise, if the attack is from behind, the ‘To Hit’ modifier is ignored.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: from_behind
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: position_modifier
          value:
            type: literal
            value: 20
    - id: prone
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: Factor in close combat ... Attacking an enemy lying down (also loses its ‘To Hit’
        value) +30 ... All modifiers are cumulative.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: melee
          - type: compare
            operator: eq
            left:
              type: field
              name: target_prone
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: position_modifier
          value:
            type: sum
            values:
              - type: field
                name: position_modifier
              - type: literal
                value: 30
    - id: height
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Height Advantage
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Height Advantage
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        A character attacking from above will does so at +10 CS or RS. This represents their
        improved view of the situation. This bonus is not cumulative with Large-Sized Monsters.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: height_advantage
                right:
                  type: literal
                  value: true
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: ranged
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: target_large
                    right:
                      type: literal
                      value: true
      effects:
        - type: set
          target: height_modifier
          value:
            type: literal
            value: 10
    - id: shield
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: Enemy has a shield and did not make a Power Attack last turn. -5
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_shield
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: shield_suppressed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: shield_modifier
          value:
            type: literal
            value: -5
    - id: stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text: Enemy has taken a Parry Stance -10
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_parry
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: parry_modifier
          value:
            type: literal
            value: -10
    - id: evasion
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        This number should be subtracted from the hero’s CS/RS before attacking. If the enemy
        performed a Power Attack last turn, this subtraction is ignored since that all-out attack
        left the enemy vulnerable. Likewise, if the attack is from behind, the ‘To Hit’ modifier is
        ignored. ... Attacking an enemy lying down (also loses its ‘To Hit’ value) +30
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: from_behind
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_to_hit_suppressed
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: mode
                right:
                  type: literal
                  value: ranged
              - type: compare
                operator: eq
                left:
                  type: field
                  name: target_prone
                right:
                  type: literal
                  value: false
      effects:
        - type: set
          target: to_hit_modifier
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: enemy_to_hit
              - type: literal
                value: -1
    - id: obstacles
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Obstacles and LOS When Shooting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Shooting at Large-Sized Monsters and Flyers
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        If there are any half-height obstacles or models in the LOS when shooting, there is a
        -10 chance of hitting your target. This is cumulative. ... They do have the benefit of cover
        from half-height obstacles though, and models in between do count as such obstacles.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: ranged
      effects:
        - type: set
          target: obstacle_modifier
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: half_height_obstacles
              - type: literal
                value: -10
    - id: aim
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
