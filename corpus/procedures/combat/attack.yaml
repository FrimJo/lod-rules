- id: procedure.combat_preparation
  name: combat preparation
  section_id: section.combat.who_can_fight
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: who can fight
      extraction:
        method: text
        confidence: high
        visually_verified: false
  status: extracted
  confidence: high
  source_text: Prepare one supplied attack. Geometry, equipment and resolved talent/perk exceptions
    are inputs; no enemy behavior or path is generated.
  fields:
    mode:
      type: string
      role: input
      description: mode
    action:
      type: string
      role: input
      description: action
    adjacent:
      type: boolean
      role: input
      description: adjacent
    doorway_opposite:
      type: boolean
      role: input
      description: doorway opposite
    reach_valid:
      type: boolean
      role: input
      description: reach valid
    in_los:
      type: boolean
      role: input
      description: in los
    outdoors:
      type: boolean
      role: input
      description: outdoors
    enemy_adjacent:
      type: boolean
      role: input
      description: enemy adjacent
    ranged_exception:
      type: boolean
      role: input
      description: ranged exception
    loaded:
      type: boolean
      role: input
      description: loaded
    ammunition_available:
      type: boolean
      role: input
      description: ammunition available
    straight_model_block:
      type: boolean
      role: input
      description: straight model block
    large_or_flying:
      type: boolean
      role: input
      description: large or flying
    target_large:
      type: boolean
      role: input
      description: target large
    from_behind:
      type: boolean
      role: input
      description: from behind
    target_prone:
      type: boolean
      role: input
      description: target prone
    height_advantage:
      type: boolean
      role: input
      description: height advantage
    target_shield:
      type: boolean
      role: input
      description: target shield
    target_parry:
      type: boolean
      role: input
      description: target parry
    enemy_power_restriction_resolved:
      type: boolean
      role: input
      description: enemy power restriction resolved
    enemy_to_hit_suppressed:
      type: boolean
      role: input
      description: enemy to hit suppressed
    shield_suppressed:
      type: boolean
      role: input
      description: shield suppressed
    aim_valid:
      type: boolean
      role: input
      description: aim valid
    charge_path_valid:
      type: boolean
      role: input
      description: charge path valid
    target_aiming:
      type: boolean
      role: input
      description: target aiming
    distance:
      type: number
      role: input
      description: distance
    skill:
      type: number
      role: input
      description: skill
    enemy_to_hit:
      type: number
      role: input
      description: enemy to hit
    melee_weapon_modifier:
      type: number
      role: input
      description: melee weapon modifier
    half_height_obstacles:
      type: number
      role: input
      description: half height obstacles
    other_modifier:
      type: number
      role: input
      description: other modifier
    attack_eligible:
      type: boolean
      role: output
      description: attack eligible
    threshold:
      type: number
      role: output
      description: threshold
    action_points_spent:
      type: number
      role: output
      description: action points spent
    action_modifier:
      type: number
      role: output
      description: action modifier
    position_modifier:
      type: number
      role: output
      description: position modifier
    height_modifier:
      type: number
      role: output
      description: height modifier
    shield_modifier:
      type: number
      role: output
      description: shield modifier
    parry_modifier:
      type: number
      role: output
      description: parry modifier
    to_hit_modifier:
      type: number
      role: output
      description: to hit modifier
    obstacle_modifier:
      type: number
      role: output
      description: obstacle modifier
    aim_modifier:
      type: number
      role: output
      description: aim modifier
  dependencies: []
  steps:
    - id: requirements
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: requirements
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Melee requires adjacency, opposite doorway squares or supplied Reach eligibility.
        Ranged requires LOS, range, ready weapon and no adjacent enemy unless an explicit exception
        permits it.
      effects:
        - type: set
          target: attack_eligible
          value:
            type: literal
            value: false
    - id: eligible
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: eligible
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Standard attacks cost 1 AP. Power and Charge cost 2 AP; charge requires supplied
        straight/diagonal clear path, empty intervening square and movement into front adjacency.
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: adjacent
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: doorway_opposite
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: reach_valid
                        right:
                          type: literal
                          value: true
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: ranged
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: in_los
                    right:
                      type: literal
                      value: true
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: outdoors
                        right:
                          type: literal
                          value: true
                      - type: compare
                        operator: lte
                        left:
                          type: field
                          name: distance
                        right:
                          type: literal
                          value: 10
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: enemy_adjacent
                        right:
                          type: literal
                          value: false
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: ranged_exception
                        right:
                          type: literal
                          value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: loaded
                    right:
                      type: literal
                      value: true
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: ammunition_available
                    right:
                      type: literal
                      value: true
                  - type: any
                    conditions:
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: straight_model_block
                        right:
                          type: literal
                          value: false
                      - type: compare
                        operator: eq
                        left:
                          type: field
                          name: large_or_flying
                        right:
                          type: literal
                          value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_power_restriction_resolved
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: action
                right:
                  type: literal
                  value: standard
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: action
                    right:
                      type: literal
                      value: power
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: melee
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: action
                    right:
                      type: literal
                      value: charge
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: charge_path_valid
                    right:
                      type: literal
                      value: true
      effects:
        - type: set
          target: attack_eligible
          value:
            type: literal
            value: true
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 1
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: position_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: height_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: shield_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: parry_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: to_hit_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: obstacle_modifier
          value:
            type: literal
            value: 0
        - type: set
          target: aim_modifier
          value:
            type: literal
            value: 0
    - id: power
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: power
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Power Attack adds +20 CS.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: action
            right:
              type: literal
              value: power
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 20
    - id: charge
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: charge
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Charge adds +10 CS.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: action
            right:
              type: literal
              value: charge
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 2
        - type: set
          target: action_modifier
          value:
            type: literal
            value: 10
    - id: behind
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: behind
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Behind adds +20; enemy To Hit is ignored.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: from_behind
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: position_modifier
          value:
            type: literal
            value: 20
    - id: prone
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: prone
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Close-combat attack against prone enemy adds +30 and ignores To Hit; modifiers are
        cumulative.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: melee
          - type: compare
            operator: eq
            left:
              type: field
              name: target_prone
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: position_modifier
          value:
            type: sum
            values:
              - type: field
                name: position_modifier
              - type: literal
                value: 30
    - id: height
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: height
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Height +10 CS/RS; not cumulative with large-target shooting bonus.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: height_advantage
                right:
                  type: literal
                  value: true
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: mode
                    right:
                      type: literal
                      value: ranged
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: target_large
                    right:
                      type: literal
                      value: true
      effects:
        - type: set
          target: height_modifier
          value:
            type: literal
            value: 10
    - id: shield
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: shield
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Enemy shield imposes -5 unless Power Attack suppresses it.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_shield
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: shield_suppressed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: shield_modifier
          value:
            type: literal
            value: -5
    - id: stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: stance
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Enemy Parry Stance imposes -10.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_parry
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: parry_modifier
          value:
            type: literal
            value: -10
    - id: evasion
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: evasion
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Subtract supplied enemy To Hit except behind, prone in melee or resolved Power Attack
        suppression.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: from_behind
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: enemy_to_hit_suppressed
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: mode
                right:
                  type: literal
                  value: ranged
              - type: compare
                operator: eq
                left:
                  type: field
                  name: target_prone
                right:
                  type: literal
                  value: false
      effects:
        - type: set
          target: to_hit_modifier
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: enemy_to_hit
              - type: literal
                value: -1
    - id: obstacles
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: obstacles
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Ranged half-height obstacles and intersected model squares impose cumulative -10 penalties.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: ranged
      effects:
        - type: set
          target: obstacle_modifier
          value:
            type: arithmetic
            operator: multiply
            values:
              - type: field
                name: half_height_obstacles
              - type: literal
                value: -10
    - id: aim
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: aim
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Only a still-valid aim at the same target in the next action adds +10.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: ranged
          - type: compare
            operator: eq
            left:
              type: field
              name: aim_valid
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: aim_modifier
          value:
            type: literal
            value: 10
    - id: threshold_melee
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: threshold melee
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: All applicable close-combat modifiers are cumulative. Supplied weapon modifier
        preserves Fast/Slow/BFO/Staff distinctions.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: melee
      effects:
        - type: set
          target: threshold
          value:
            type: sum
            values:
              - type: field
                name: skill
              - type: field
                name: action_modifier
              - type: field
                name: position_modifier
              - type: field
                name: height_modifier
              - type: field
                name: shield_modifier
              - type: field
                name: parry_modifier
              - type: field
                name: to_hit_modifier
              - type: field
                name: melee_weapon_modifier
              - type: field
                name: other_modifier
    - id: threshold_ranged
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: threshold ranged
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: All applicable ranged modifiers are cumulative.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: ranged
      effects:
        - type: set
          target: threshold
          value:
            type: sum
            values:
              - type: field
                name: skill
              - type: field
                name: action_modifier
              - type: field
                name: position_modifier
              - type: field
                name: height_modifier
              - type: field
                name: shield_modifier
              - type: field
                name: parry_modifier
              - type: field
                name: to_hit_modifier
              - type: field
                name: obstacle_modifier
              - type: field
                name: aim_modifier
              - type: field
                name: other_modifier
    - id: aiming_target
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: aiming target
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: When attacking an aiming target, ignore all negative modifiers other than cover.
        Positive modifiers remain cumulative.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_aiming
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: melee
      effects:
        - type: set
          target: threshold
          value:
            type: sum
            values:
              - type: field
                name: skill
              - type: field
                name: action_modifier
              - type: field
                name: position_modifier
              - type: field
                name: height_modifier
              - type: field
                name: aim_modifier
              - type: arithmetic
                operator: max
                values:
                  - type: literal
                    value: 0
                  - type: field
                    name: melee_weapon_modifier
              - type: arithmetic
                operator: max
                values:
                  - type: literal
                    value: 0
                  - type: field
                    name: other_modifier
    - id: aiming_target_ranged
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: aiming target ranged
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: When shooting an aiming target retain cover penalties but ignore other negative modifiers.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: attack_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_aiming
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: mode
            right:
              type: literal
              value: ranged
      effects:
        - type: set
          target: threshold
          value:
            type: sum
