- id: procedure.combat_aim
  name: combat aim
  section_id: section.combat.different_combat_actions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Aim
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Aim
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    By spending 1 AP to aim with a Ranged Weapon at a specific target, a model will gain a
    +10 modifier in the next action when shooting at that target. ... An aiming model cannot dodge
    and becomes easier to hit (any negative modifier other than cover is ignored when attacking an
    enemy that is aiming). Only 1 AP can be spent on aiming for each shot.
  fields:
    ranged_weapon:
      type: boolean
      role: input
      description: ranged weapon
    next_action:
      type: boolean
      role: input
      description: next action
    same_target:
      type: boolean
      role: input
      description: same target
    target_left_los:
      type: boolean
      role: input
      description: target left los
    model_crossed_los:
      type: boolean
      role: input
      description: model crossed los
    lost_hp:
      type: boolean
      role: input
      description: lost hp
    action_points_spent:
      type: number
      role: output
      description: action points spent
    aim_bonus:
      type: number
      role: output
      description: aim bonus
    aim_valid:
      type: boolean
      role: output
      description: aim valid
    can_dodge:
      type: boolean
      role: output
      description: can dodge
    ignore_noncover_negative_modifiers:
      type: boolean
      role: output
      description: ignore noncover negative modifiers
  dependencies: []
  steps:
    - id: aim
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Aim
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        By spending 1 AP to aim with a Ranged Weapon at a specific target ... An aiming model
        cannot dodge and becomes easier to hit (any negative modifier other than cover is ignored
        when attacking an enemy that is aiming). Only 1 AP can be spent on aiming for each shot.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: ranged_weapon
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: action_points_spent
          value:
            type: literal
            value: 1
        - type: set
          target: can_dodge
          value:
            type: literal
            value: false
        - type: set
          target: ignore_noncover_negative_modifiers
          value:
            type: literal
            value: true
        - type: set
          target: aim_valid
          value:
            type: literal
            value: false
        - type: set
          target: aim_bonus
          value:
            type: literal
            value: 0
    - id: retained
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        ... a model will gain a +10 modifier in the next action when shooting at that target.
        If the projectile is not fired in the next action, this bonus is lost. If the target moves
        out of sight, the bonus is lost. If another model moves through the LOS between the shooter
        and the target, even if it does not stop to block LOS, the bonus is lost. If an aiming model
        loses HP for some reason, the bonus is lost.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: ranged_weapon
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: next_action
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: same_target
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: target_left_los
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: model_crossed_los
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: lost_hp
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: aim_valid
          value:
            type: literal
            value: true
        - type: set
          target: aim_bonus
          value:
            type: literal
            value: 10
  entry_step: aim
  exit_step: retained
  unresolved_references:
    - Overwatch with Ranged Weapons (PDF 107, printed 105) says "Perks and Talents may be used
      during this shot, but not for aiming." That limits Perks and Talents used for aiming during an
      Overwatch shot; it does not forbid the Aim action, so this procedure has no Overwatch
      condition.
