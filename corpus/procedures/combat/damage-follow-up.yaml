    - id: prepare_poison_rest
      source: &a9
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Poison
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: If the party rests in a dungeon, while traveling or at an inn, roll all remaining
        poison CON checks. Re-evaluate this target/episode/rest handoff, with actual rest occurrence
        supplied; a handoff does not execute checks or spend remaining count.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rest
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: poison
      effects:
        - type: set
          target: poison_rest_allowed
          value:
            type: literal
            value: false
        - type: set
          target: poison_rolls_due
          value:
            type: literal
            value: 0
      substeps:
        - id: accept_poison_rest
          source: *a9
          source_text:
            Accept the remaining-check handoff once for a living poisoned target with positive
            remaining count and an actual rest. Persist the rest marker; distinct individual checks
            use their own fresh markers and carry updated count/HP forward.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: rest_occurs
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: already_poisoned
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: dead
                right:
                  type: literal
                  value: false
