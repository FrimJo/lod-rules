          pdf_page: 122
          printed_page: 120
          heading: Magic Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Damage from spells, prayers, scrolls, magic weapons or items is magic damage. Its
        generic path works as normal in most cases. Re-evaluate one distinct initial event after its
        base damage is already resolved, without applying that damage again.
