- id: procedure.damage_follow_up
  name: damage follow up
  section_id: section.combat.different_kinds_of_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      heading: Different Kinds of Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 122
      printed_page: 120
      heading: Different Kinds of Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Resolve one source-defined damage-type checkpoint. Resist rolls, ongoing damage and
    condition state are supplied. This is not a complete hero-condition state machine.
  fields:
    damage_type:
      type: string
      role: input
      description: damage type
    phase:
      type: string
      role: input
      description:
        'Supplied checkpoint: initial for one distinct source event, next_turn for scheduled
        elemental/AP effects, after_battle for delayed Disease, ongoing for one Poison check, rest
        for a condition-specific rest checkpoint, external_cure for a cure handoff. Invoke alone
        executes no dependency.'
    damage_resolved:
      type: boolean
      role: input
      description: damage resolved
    took_damage:
      type: boolean
      role: input
      description: took damage
    already_poisoned:
      type: boolean
      role: state
      description:
        Current poisoned-condition checkpoint owned by this target. Infection sets true and
        explicit 01–05 cure sets false; carry it forward with poisoned and remaining_poison_rolls.
        Ordinary sequence exhaustion remains a linked source question.
    con_success:
      type: boolean
      role: input
      description: con success
    disease_exposed:
      type: boolean
      role: input
      description: disease exposed
    in_battle:
      type: boolean
      role: input
      description: in battle
    rest_occurs:
      type: boolean
      role: input
      description: rest occurs
    frost_stun_result:
      type: boolean
      role: input
      description: Supplied result of the printed 50% Frost stun chance; no invented die selector.
    damage_before_protection:
      type: number
      role: input
      description:
        Legacy field name for the supplied halving basis for this Fire/Acidic hit. The source
        does not explicitly settle whether Acidic halving precedes or follows armour; retain
        issue.damage_follow_up.continuation_basis rather than deriving this value from protection
        here.
      minimum: 0
    continuation_roll:
      type: number
      role: input
      description: continuation roll
      minimum: 1
      maximum: 6
      integer: true
    constitution:
      type: number
      role: input
      description: constitution
    strength:
      type: number
      role: input
      description: strength
    poison_duration_roll:
      type: number
      role: input
      description: poison duration roll
      integer: true
      minimum: 1
      maximum: 10
    con_roll:
      type: number
      role: input
      description: con roll
      minimum: 1
      maximum: 100
      integer: true
    remaining_poison_rolls:
      type: number
      role: state
      description:
        Remaining future CON checks owned by this target and poison episode. Carry the updated
        count forward; a processed check consumes one, while 01–05 cancels all remaining checks.
      minimum: 0
      integer: true
    hit_points:
      type: number
      role: state
      description: hit points
    ignore_armour:
      type: boolean
      role: output
      description: ignore armour
    ignore_natural_armour:
      type: boolean
      role: output
      description: ignore natural armour
    poisoned:
      type: boolean
      role: output
      description: poisoned
    diseased:
      type: boolean
      role: state
      description: diseased
    cured:
      type: boolean
      role: output
      description: cured
    dead:
      type: boolean
      role: output
      description: dead
    stun:
      type: boolean
      role: state
      description:
        Whether this owned pending-next-turn effect applies; not the aggregate status of other
        stun contexts.
    next_turn_damage:
      type: number
      role: state
      description:
        This target/hit scheduled Fire/Acidic damage before its separately resolved next-turn
        damage handoff; cancelled after the completed continuation.
    next_turn_actions_lost:
      type: number
      role: state
      description: One scheduled AP loss for this target/affected turn; cancelled after actual application.
    poison_rolls_due:
      type: number
      role: output
      description: poison rolls due
    constitution_after:
      type: number
      role: output
      description:
        Computed episode value after subtracting the rounded-down half loss. Apply only while
        disease_penalty_active is true; do not treat this historical calculation output as a
        base-stat restoration.
    strength_after:
      type: number
      role: output
      description:
        Computed episode value after subtracting the rounded-down half loss. Apply only while
        disease_penalty_active is true; do not treat this historical calculation output as a
        base-stat restoration.
    hp_lost:
      type: number
      role: output
      description: hp lost
    expires:
      type: string
      role: output
      description: expires
    poison_check_processed:
      type: boolean
      role: state
      description:
        Target/poison-episode/check marker. Supply false for one distinct remaining CON check
        and persist true on replay; a distinct later check has a fresh marker.
    poison_check_allowed:
      type: boolean
      role: output
      description:
        Current invocation accepted one eligible remaining poison check; reset on each ongoing
        poison invocation.
    poison_starting_hp:
      type: number
      role: output
      description:
        HP snapshot before this accepted poison check, used to distinguish reaching zero during
        rest from already being at or below zero.
    poison_exposure_processed:
      type: boolean
      role: state
      description:
        Target/damaging-hit exposure marker. Fresh distinct exposure starts false; persist true
        after its resist checkpoint, including success. Replays must not reroll or initialize a
        second episode.
    poison_exposure_allowed:
      type: boolean
      role: output
      description:
        Current invocation accepted an eligible unprocessed damaging-hit poison exposure; reset
        on each initial poison invocation.
    poison_rest_handoff_processed:
      type: boolean
      role: state
      description:
        Target/poison-episode/rest-attempt marker for this remaining-check handoff. Start false
        for a distinct rest attempt, persist true after acceptance. Separate from the outer dungeon
        rest condition marker and from each individual poison_check_processed marker.
    poison_rest_allowed:
      type: boolean
      role: output
      description: Current invocation accepted one remaining-check rest handoff; reset each rest invocation.
    disease_exposure_processed:
      type: boolean
      role: state
      description:
        Hero/exposure-event marker. Start false for a distinct actual exposure; persist true
        after its supplied resist outcome, including successful resistance or an unresolved
        additional disease.
    disease_exposure_allowed:
      type: boolean
      role: output
      description: Current invocation accepts a fresh disease exposure; reset each initial disease call.
    disease_episode_started:
      type: boolean
      role: output
      description: Current accepted failed exposure starts a new single disease context; reset each
        initial disease call.
    disease_penalty_processed:
      type: boolean
      role: state
      description:
        Hero/disease-episode marker. Initialize false on a new single episode; persist true
        once its delayed stat-loss output is calculated. Replays must not halve updated values
        again.
    disease_penalty_active:
      type: boolean
      role: state
      description:
        The episode stat-loss output is currently applicable; false before delayed application
        and after cure. constitution_after/strength_after are episode calculation outputs, not
        restored base stats.
    disease_rest_check_chosen:
      type: boolean
      role: input
      description:
        Explicit choice to take the optional CON check at this actual rest. Declining does not
        consume a check opportunity.
    disease_rest_processed:
      type: boolean
      role: state
      description:
        Hero/disease-episode/rest-attempt marker. Start false for a distinct rest, persist true
        after the chosen CON check regardless of result.
    disease_rest_allowed:
      type: boolean
      role: output
      description: Current invocation accepts one optional disease CON check; reset each disease-rest call.
    elemental_hit_processed:
      type: boolean
      role: state
      description:
        Target/distinct elemental hit marker. Start false per new Fire, Acidic or Frost hit,
        persist true after its accepted resolved-hit check; replay cannot reroll continuation or
        stun.
    elemental_hit_allowed:
      type: boolean
      role: output
      description: Current initial elemental hit accepted; reset on every initial elemental call.
    continuation_pending:
      type: boolean
      role: state
      description: This target/hit has its one Fire or Acidic next-turn damage checkpoint pending.
    continuation_handoff_processed:
      type: boolean
      role: state
      description: Target/hit next-turn damage handoff marker, reset for a distinct accepted Fire/Acidic hit.
    continuation_result_processed:
      type: boolean
      role: state
      description: Target/hit next-turn resolved-result marker; persist after the one continuation ends.
    stun_next_turn_pending:
      type: boolean
      role: state
      description:
        Target/affected-next-turn pending Stun or Frost AP-loss context, not an aggregate of
        unspecified overlapping sources.
    stun_turn_processed:
      type: boolean
      role: state
      description:
        Target/affected-turn AP-loss marker. Start false for a distinct affected turn, persist
        after the one AP loss.
    stun_exposure_processed:
      type: boolean
      role: state
      description:
        Target/distinct supplied stun-effect result marker; start false for a new resolution,
        persist after success or failure.
    stun_initial_allowed:
      type: boolean
      role: output
      description: Current initial supplied Stun effect accepted; reset each initial Stun call.
    stun_effect_resolved:
      type: boolean
      role: input
      description:
        Actual weapon/special-rule stun outcome has been resolved; invoke or availability alone
        does not confirm it.
    stun_effect_confirmed:
      type: boolean
      role: input
      description: Source-backed resolved stun effect, e.g. existing weapon rule even damage roll.
    magic_result_processed:
      type: boolean
      role: state
      description:
        Target/distinct magic-damage event completed-result marker. Start false for a fresh
        event and persist true after ordinary or actually completed creature-specific follow-up.
    magic_handoff_processed:
      type: boolean
      role: state
      description:
        Target/distinct magic-damage event creature-complication handoff marker. Start false
        and persist after the request; invoke alone is not completed resolution.
    magic_scope_resolved:
      type: boolean
      role: input
      description:
        Source-backed target-specific determination of whether magic has extra complications is
        supplied. Generic passage gives no numeric creature details; unknown scope remains
        unresolved.
    magic_complication_applies:
      type: boolean
      role: input
      description:
        Supplied source-backed target-specific applicability, not inferred merely from creature
        family or magic source.
    magic_complication_resolved:
      type: boolean
      role: input
      description: Actual target-specific magic complication outcome is already resolved by its
        source-backed owner, including any HP changes. This checkpoint must not apply it again.
    magic_follow_up_allowed:
      type: boolean
      role: output
      description:
        Current fresh initial magic follow-up accepted after base damage resolution; reset each
        initial magic call.
    magic_checkpoint_complete:
      type: boolean
      role: state
      description:
        This target/magic event normal path or creature-specific follow-up is complete; not a
        claim that the absent creature rules were extracted.
  dependencies:
    - key: creature_specials
      label:
        Source-backed target-specific magic complications and their completed outcomes; generic Magic
        Damage gives no numeric definitions
      section_id: section.combat.different_kinds_of_damage.magic_damage
    - key: remaining_poison
      label: Explicit ongoing poison CON checkpoints for the supplied remaining rest sequence
      section_id: section.combat.different_kinds_of_damage
      object_id: procedure.damage_follow_up
    - key: poison_rest_death
      label: Permanent removal checkpoint for the hero dying from poison during rest
      object_id: procedure.hero_death
    - key: explicit_poison_cure
      label: Printed potion or Chapel cure checkpoint with supplied completed resolution
      object_id: procedure.poison_cure
    - key: explicit_disease_cure
      label: Printed disease potion or Sick Ward cure; hero/episode/cure-attempt checkpoint
      object_id: procedure.disease_cure
    - key: elemental_next_turn
      label: The one Fire/Acidic next-turn continuation checkpoint
      object_id: procedure.elemental_continuation
    - key: stun_next_turn
      label: Apply the pending Stun/Frost AP loss once on the actual affected turn
      object_id: procedure.stun_next_turn
  steps:
    - id: acid_protection
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Acidic Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Acid ignores Natural Armour.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: damage_type
        right:
          type: literal
          value: acidic
      effects:
        - type: set
          target: ignore_natural_armour
          value:
            type: literal
            value: true
        - type: set
          target: ignore_armour
          value:
            type: literal
            value: false
    - id: fire_protection
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Fire Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Fire ignores armour and Natural Armour.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: damage_type
        right:
          type: literal
          value: fire
      effects:
        - type: set
          target: ignore_natural_armour
          value:
            type: literal
            value: true
        - type: set
          target: ignore_armour
          value:
            type: literal
            value: true
    - id: prepare_elemental_hit
      source: &a1
        - &a2
          document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Different Kinds of Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
        - &a3
          document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Different Kinds of Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Re-evaluate one distinct resolved Fire, Acidic or Frost hit. A replay cannot substitute
        a continuation die or Frost chance result.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: fire
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: acidic
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: frost
      effects:
        - type: set
          target: elemental_hit_allowed
          value:
            type: literal
            value: false
      substeps:
        - id: accept_elemental_hit
          source: *a1
          source_text:
            Accept a resolved hit once; the target/hit state context is supplied separately for
            every distinct hit.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: elemental_hit_processed
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: elemental_hit_allowed
              value:
                type: literal
                value: true
            - type: set
              target: elemental_hit_processed
              value:
                type: literal
                value: true
    - id: extinguished
      source:
        - *a2
        - *a3
      source_text: After initial fire/acid resolution, 1–3 ends it.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: fire
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: acidic
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: elemental_hit_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: lte
            left:
              type: field
              name: continuation_roll
            right:
              type: literal
              value: 3
      effects:
        - type: set
          target: next_turn_damage
          value:
            type: literal
            value: 0
        - type: set
          target: expires
          value:
            type: literal
            value: now
        - type: set
          target: continuation_pending
          value:
            type: literal
            value: false
        - type: set
          target: continuation_handoff_processed
          value:
            type: literal
            value: false
        - type: set
          target: continuation_result_processed
          value:
            type: literal
            value: false
    - id: continues
      source:
        - *a2
        - *a3
      source_text:
        4–6 causes one further turn at half damage rounded down, minimum 1, then ends. Supply
        the damage amount being halved; protection is not applied here.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: fire
              - type: compare
                operator: eq
                left:
                  type: field
                  name: damage_type
                right:
                  type: literal
                  value: acidic
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: elemental_hit_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: continuation_roll
            right:
              type: literal
              value: 4
      effects:
        - type: set
          target: next_turn_damage
          value:
            type: arithmetic
            operator: max
            values:
              - type: literal
                value: 1
              - type: arithmetic
                operator: floor
                values:
                  - type: arithmetic
                    operator: divide
                    values:
                      - type: field
                        name: damage_before_protection
                      - type: literal
                        value: 2
        - type: set
          target: expires
          value:
            type: literal
            value: after next turn
        - type: set
          target: continuation_pending
          value:
            type: literal
            value: true
        - type: set
          target: continuation_handoff_processed
          value:
            type: literal
            value: false
        - type: set
          target: continuation_result_processed
          value:
            type: literal
            value: false
    - id: frost_no_stun
      source:
        - *a3
      source_text:
        A fresh resolved Frost hit whose supplied 50% chance result is false schedules no stun
        for this hit. This context is not the aggregate status of other hits.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: frost
          - type: compare
            operator: eq
            left:
              type: field
              name: elemental_hit_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: frost_stun_result
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: stun
          value:
            type: literal
            value: false
        - type: set
          target: next_turn_actions_lost
          value:
            type: literal
            value: 0
        - type: set
          target: stun_next_turn_pending
          value:
            type: literal
            value: false
        - type: set
          target: stun_turn_processed
          value:
            type: literal
            value: false
    - id: frost
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Frost Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Frost has 50% chance of stun. Source gives probability, not a die selector; supply result.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: frost
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: elemental_hit_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: frost_stun_result
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: stun
          value:
            type: literal
            value: true
        - type: set
          target: next_turn_actions_lost
          value:
            type: literal
            value: 1
        - type: set
          target: stun_next_turn_pending
          value:
            type: literal
            value: true
        - type: set
          target: stun_turn_processed
          value:
            type: literal
            value: false
    - id: prepare_stun
      source: &a4
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Different Kinds of Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Re-evaluate one supplied resolved weapon/special-rule stun result. A replay cannot
        substitute a new result or recreate an already processed pending turn.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: stun
      effects:
        - type: set
          target: stun_initial_allowed
          value:
            type: literal
            value: false
      substeps:
        - id: accept_stun
          source: *a4
          source_text: Accept this distinct actually resolved stun effect once.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stun_effect_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: stun_exposure_processed
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: stun_initial_allowed
              value:
                type: literal
                value: true
            - type: set
              target: stun_exposure_processed
              value:
                type: literal
                value: true
    - id: stun_no_effect
      source: *a4
      source_text: An accepted supplied false stun outcome schedules no AP loss in this effect context.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: stun
          - type: compare
            operator: eq
            left:
              type: field
              name: stun_initial_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: stun_effect_confirmed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: stun
          value:
            type: literal
            value: false
        - type: set
          target: stun_next_turn_pending
          value:
            type: literal
            value: false
