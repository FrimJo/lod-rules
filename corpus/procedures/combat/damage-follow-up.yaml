          source_text:
            Only a living diseased hero at an actual rest who chooses the optional CON check may
            resolve this unprocessed rest checkpoint.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: rest_occurs
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: diseased
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: dead
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disease_rest_check_chosen
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disease_rest_processed
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: disease_rest_allowed
              value:
                type: literal
                value: true
            - type: set
              target: disease_rest_processed
              value:
                type: literal
                value: true
    - id: disease_recovery
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Disease
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: On the chosen accepted rest CON result 01–05, the hero is cured and the disease
        stat-loss output stops applying. Do not guess a numeric restoration across unrelated stat
        changes. Potion and sick-ward cures remain separately supplied source paths.
      when:
