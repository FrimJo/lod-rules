                operator: gt
                left:
                  type: field
                  name: remaining_poison_rolls
                right:
                  type: literal
                  value: 0
              - type: compare
                operator: eq
                left:
                  type: field
                  name: poison_rest_handoff_processed
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: poison_rest_allowed
              value:
                type: literal
                value: true
            - type: set
              target: poison_rest_handoff_processed
              value:
                type: literal
                value: true
    - id: poison_rest
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Poison
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Record all currently remaining CON checks during an accepted rest. Explicitly resolve
        supplied outcomes with this procedure's ongoing checkpoint, one distinct check at a time,
        carrying count/HP/current condition forward. Stop when the count is exhausted, poison is
        cured or the target dies. Invoke only records the handoff; replay cannot create another one.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rest
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: poison
          - type: compare
            operator: eq
            left:
              type: field
              name: already_poisoned
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: rest_occurs
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: poison_rest_allowed
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: poison_rolls_due
          value:
            type: field
            name: remaining_poison_rolls
        - type: invoke
          dependency: remaining_poison
