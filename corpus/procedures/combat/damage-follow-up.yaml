              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: poison
          - type: compare
            operator: eq
            left:
              type: field
              name: poison_exposure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: took_damage
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: already_poisoned
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: con_success
            right:
              type: literal
              value: false
