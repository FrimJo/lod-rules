              type: literal
              value: disease
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_rest_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: rest_occurs
            right:
              type: literal
