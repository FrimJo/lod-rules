    - id: prepare_disease_exposure
      source: &a6
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Disease
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        For the indicated disease exposure, resolve the supplied modified CON result once.
        Successful resistance avoids new sickness; disease-specific modifiers remain supplied, not
        invented.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: disease
      effects:
        - type: set
          target: disease_exposure_allowed
          value:
            type: literal
            value: false
        - type: set
          target: disease_episode_started
          value:
            type: literal
            value: false
      substeps:
        - id: accept_disease_exposure
          source: *a6
          source_text: Accept this living hero/exposure checkpoint once; mark it processed even when
            resistance succeeds or another active disease leaves an unresolved overlap.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disease_exposed
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: dead
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disease_exposure_processed
                right:
                  type: literal
                  value: false
          effects:
            - type: set
              target: disease_exposure_allowed
              value:
                type: literal
                value: true
            - type: set
              target: disease_exposure_processed
              value:
                type: literal
                value: true
    - id: additional_disease_unknown
      source: *a6
      source_text:
        A further failed disease exposure while an effect is active has no defined stacking or
        episode-identity treatment in this passage. Preserve current disease state and record the
        boundary rather than halve again or reset the episode.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: disease
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_exposure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: diseased
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: con_success
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.disease.concurrent_effects
    - id: disease
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Disease
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Disease exposure requires modified CON; failure causes disease.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: disease
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_exposure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: diseased
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_exposed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: con_success
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: diseased
          value:
            type: literal
            value: true
        - type: set
          target: disease_episode_started
          value:
            type: literal
            value: true
        - type: set
          target: disease_penalty_processed
          value:
            type: literal
            value: false
        - type: set
          target: disease_penalty_active
          value:
            type: literal
            value: false
    - id: disease_penalty
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Disease
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A failed single disease exposure loses half CON and STR (loss rounded down) once after
        any ongoing battle is over; without an ongoing battle the accepted exposure applies
        immediately. The computed outputs remain applicable until cured. Persist the episode marker
        rather than repeatedly halve already-adjusted stats.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: damage_type
            right:
              type: literal
              value: disease
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: after_battle
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: phase
                    right:
                      type: literal
                      value: initial
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: disease_episode_started
                    right:
                      type: literal
                      value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: in_battle
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: diseased
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_penalty_processed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: constitution_after
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: constitution
              - type: arithmetic
                operator: floor
                values:
                  - type: arithmetic
                    operator: divide
                    values:
                      - type: field
                        name: constitution
                      - type: literal
                        value: 2
        - type: set
          target: strength_after
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: strength
              - type: arithmetic
                operator: floor
                values:
                  - type: arithmetic
                    operator: divide
                    values:
                      - type: field
                        name: strength
                      - type: literal
                        value: 2
        - type: set
          target: disease_penalty_processed
          value:
            type: literal
            value: true
        - type: set
          target: disease_penalty_active
          value:
            type: literal
            value: true
    - id: prepare_disease_rest
      source: *a6
      source_text:
        Whenever the party rests in a dungeon, during travel or at an inn, a diseased hero may
        choose one CON test. Reset current permission and guard the chosen hero/episode/rest
        checkpoint against reroll.
