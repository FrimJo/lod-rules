          printed_page: 120
          heading: Poison
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A failed accepted poison check that reduces this target from 1 HP to zero during rest
        causes death. Already-zero HP or an ineligible/successful/replayed check does not
