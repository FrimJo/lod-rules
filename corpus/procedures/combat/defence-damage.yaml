              type: field
              name: is_thrown_preparation
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: in_los
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: nonadjacent_obstacle
            right:
              type: literal
              value: true
