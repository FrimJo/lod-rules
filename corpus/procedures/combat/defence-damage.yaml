    - id: damage_formula
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: damage formula
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Weapon DMG + DB - NA - Armour; negative result remains unresolved.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_resolved
            right:
              type: literal
              value: true
      effects: []
      rule_refs:
