  name: thrown preparation
  section_id: section.combat.throwing_potions
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 117
      printed_page: 115
      heading: Throwing Potions
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - &a1
      document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 18
      printed_page: 16
      heading: Dice Rolling and Skill Checks
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: A (Tr) behind the name of the potion indicates that the potion is used as a thrown
    weapon. These can be aimed at an enemy, or at any other square within LOS. Contrary to ordinary
    missile weapons, you can lob your potion over friends, foes and obstacles, hitting someone
    further away. A successful RS is required to hit, and if you miss, the potion instead hits a
    random square adjacent to the target.
  fields:
    is_thrown_preparation:
      type: boolean
      role: input
      description: is thrown preparation
    in_los:
      type: boolean
      role: input
      description: in los
    nonadjacent_obstacle:
      type: boolean
      role: input
      description: nonadjacent obstacle
    through_door:
      type: boolean
      role: input
      description: through door
    in_front_of_door:
      type: boolean
      role: input
      description: the thrower stands in one of the two squares directly in front of the door
    adjacent_to_door:
      type: boolean
      role: input
      description: the thrower is adjacent to the door (decides where a failed toss lands)
    target_large:
      type: boolean
      role: input
      description: target large
    scatter_supplied:
      type: boolean
      role: input
      description: scatter supplied
    centre_under_large:
      type: boolean
      role: input
      description: centre under large
    rs:
      type: number
      role: input
      description: rs
    roll:
      type: number
      role: input
      description: roll
      minimum: 1
      maximum: 100
      integer: true
    centre_damage:
      type: number
      role: input
      description: centre damage
    other_covered_squares:
      type: number
      role: input
      description: other covered squares
    scatter_square:
      type: string
      role: input
      description: scatter square
    doorway_scatter_square:
      type: string
      role: input
      description: doorway scatter square
    threshold:
      type: number
      role: output
      description: threshold
    damage_for_large:
      type: number
      role: output
      description: damage for large
    hit:
      type: boolean
      role: output
      description: hit
    impact_square:
      type: string
      role: output
      description: impact square
  dependencies:
    - key: damage
      label: Preparation damage/effect at supplied impact square
      object_id: procedure.combat_damage
  steps:
    - id: prepare
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Throwing Potions
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A (Tr) behind the name of the potion indicates that the potion is used as a thrown
        weapon. These can be aimed at an enemy, or at any other square within LOS. Contrary to
        ordinary missile weapons, you can lob your potion over friends, foes and obstacles, hitting
        someone further away.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: is_thrown_preparation
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: in_los
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: threshold
          value:
            type: field
            name: rs
        - type: set
          target: hit
          value:
            type: literal
            value: false
    - id: obstacle
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
