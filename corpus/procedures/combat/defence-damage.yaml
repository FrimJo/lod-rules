          pdf_page: 121
          printed_page: 119
          heading: apply hp
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Subtract only resolved nonnegative damage. No invented zero floor or overkill clamp.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: arithmetic
              operator: subtract
              values:
                - type: sum
