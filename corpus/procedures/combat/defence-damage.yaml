      role: output
      description: torso check
    hit_location:
      type: string
      role: output
      description: hit location
  dependencies:
    - key: armour
      label: Outer-layer armour durability
      object_id: character.durability.armour_damage
    - key: quick_slots
      label: Quick Slot hit and potion consequences
      object_id: character.durability.quick_slot_hit
    - key: bleeding
