- id: procedure.bleeding_out
  name: bleeding out
  section_id: section.combat.bleeding_out
  source: &a1
    - &a2
      document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 122
      printed_page: 120
      heading: bleeding out
      extraction: &a3
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    'Resolve one bleeding-out checkpoint: initial zero, rescue, after-battle bandage, party
    loss or explicitly enabled time limit. Full condition lifecycle remains deferred.'
  fields:
    phase:
      type: string
      role: input
      description: 'Supplied checkpoint: initial, rescue, after_battle, explicit no_help or timer. A
        no_help checkpoint supplies actual absence of means, not merely a pending rescue roll.'
    companion_healing_spell:
      type: boolean
      role: input
      description: companion healing spell
    own_ready_potion:
      type: boolean
      role: input
      description: own ready potion
    adjacent_companion_ready_potion:
      type: boolean
      role: input
      description: adjacent companion ready potion
    battle_over:
      type: boolean
      role: input
      description: battle over
    standing_companion:
      type: boolean
      role: input
      description: standing companion
    healer_knocked_out:
      type: boolean
      role: input
      description: healer knocked out
    all_bleeding_out:
      type: boolean
      role: input
      description: all bleeding out
    means_to_help:
      type: boolean
      role: input
      description: means to help
    advanced_rule_enabled:
      type: boolean
      role: input
      description: advanced rule enabled
    rescue_result_supplied:
      type: boolean
      role: input
      description: rescue result supplied
    hit_points:
      type: number
      role: state
      description: hit points
    loss:
      type: number
      role: input
      description: loss
      minimum: 1
      maximum: 4
      integer: true
    selected_value:
      type: number
      role: input
      description: selected value
    die:
      type: number
      role: input
      description: die
      minimum: 1
      maximum: 6
      integer: true
    healed_hp:
      type: number
      role: input
      description: healed hp
    elapsed_turns:
      type: number
      role: input
      description: elapsed turns
    knocked_down:
      type: boolean
      role: output
      description: knocked down
    bleeding_out:
      type: boolean
      role: output
      description: bleeding out
    can_act:
      type: boolean
      role: output
      description: can act
    quest_lost:
      type: boolean
      role: output
      description: quest lost
    heroes_die:
      type: boolean
      role: output
      description: heroes die
    dead:
      type: boolean
      role: output
      description: dead
    rescue_allowed:
      type: boolean
      role: output
      description: rescue allowed
    bandage_allowed:
      type: boolean
      role: output
      description: bandage allowed
    turns:
      type: number
      role: output
      description: turns
    zero_processed:
      type: boolean
      role: state
      description: Hero/downing-event marker. Fresh event starts false (omitted means unprocessed);
        persist true across replay. Reset only for a distinct later downing event.
    timer_processed:
      type: boolean
      role: state
      description: Hero/downing-event marker for the optional supplied timer. Persist across replay,
        including later elapsed-turn checkpoints; reset only for a distinct later downing event.
    rescue_handoff_processed:
      type: boolean
      role: state
      description:
        Hero/rescue-or-bandage-attempt marker. Supply false for a distinct attempt and persist
        true after its handoff; invoke records supplied resolution work, without charging resources
        or restoring HP.
    bandage_handoff_processed:
      type: boolean
      role: state
      description:
        Hero/rescue-or-bandage-attempt marker. Supply false for a distinct attempt and persist
        true after its handoff; invoke records supplied resolution work, without charging resources
        or restoring HP.
    untreated_rest_check_requested:
      type: boolean
      role: input
      description:
        True when the caller also proposes the PDF100 untreated-bleeding rest check as a means
        of survival. Its overlap with PDF122 no-help death is unresolved; false for the isolated
        no-help checkpoint.
  dependencies:
    - key: healing
      label: Resolved healing spell or potion from ready slot
      section_id: section.combat.bleeding_out
    - key: bandage
      label: Bandage effect from existing healing rules
      section_id: section.combat.different_combat_actions
    - key: death
      label: Permanent removal and optional next-settlement replacement for this dead hero
      object_id: procedure.hero_death
  steps:
    - id: check_permissions
      source: *a1
      source_text:
        Re-evaluate rescue and bandage permissions for this checkpoint; stale permission from
        an earlier attempt does not authorize a later handoff.
      effects:
        - type: set
          target: rescue_allowed
          value:
            type: literal
            value: false
        - type: set
          target: bandage_allowed
          value:
            type: literal
            value: false
    - id: zero
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: zero
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        At exactly zero incapacitate and apply the supplied randomized permanent injury once
        per hero/downing event. Persist zero_processed across replay; a distinct later downing event
        has a fresh marker. Negative-HP entry and injury-target randomization remain unresolved.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 0
          - type: compare
            operator: ne
            left:
              type: field
              name: zero_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: dead
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: zero_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.zero
        - character.hit_points.permanent_injury
    - id: timer
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: timer
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Only the explicitly enabled advanced rule uses the supplied 1d6+1 turn limit, once per
        hero/downing event. Persist timer_processed and turns across elapsed-turn checkpoints;
        replay cannot reroll or extend the limit.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: advanced_rule_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: timer_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: dead
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: timer_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.bleeding_time
    - id: rescue
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: rescue
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A living bleeding hero may receive a companion spell, own ready potion or adjacent
        companion ready potion during battle. Record the healing handoff once for the supplied
        attempt; the handoff neither spends an item nor restores HP.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rescue
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: companion_healing_spell
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: own_ready_potion
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent_companion_ready_potion
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: rescue_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: rescue_allowed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: healing
        - type: set
          target: rescue_handoff_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.rescue
    - id: healed
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: healed
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        For a living bleeding hero with source-listed rescue means during battle, accept a
        supplied positive HP result. A handoff alone or zero/negative result cannot wake the hero.
        Persist the resulting cleared condition; replay cannot reapply healing after rescue.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rescue
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: companion_healing_spell
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: own_ready_potion
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent_companion_ready_potion
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: rescue_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: healed_hp
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: hit_points
          value:
            type: field
            name: healed_hp
        - type: set
          target: bleeding_out
          value:
            type: literal
            value: false
        - type: set
          target: knocked_down
          value:
            type: literal
            value: false
        - type: set
          target: can_act
          value:
            type: literal
            value: true
    - id: bandage
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: bandage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        After battle a standing companion who is not knocked out may bandage a living bleeding
        hero. Record the bandage handoff once per supplied attempt; actual bandage consumption and
        healing belong to the referenced resolution.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: after_battle
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: standing_companion
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: healer_knocked_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: means_to_help
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bandage_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
