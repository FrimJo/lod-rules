      role: input
      description:
        True when the caller also proposes the PDF100 untreated-bleeding rest check as a means
        of survival. Its overlap with PDF122 no-help death is unresolved; false for the isolated
        no-help checkpoint.
  dependencies:
    - key: healing
      label: Resolved healing spell or potion from ready slot
      section_id: section.combat.bleeding_out
    - key: bandage
      label: Bandage effect from existing healing rules
      section_id: section.combat.different_combat_actions
    - key: death
      label: Permanent removal and optional next-settlement replacement for this dead hero
      object_id: procedure.hero_death
  steps:
    - id: check_permissions
      source: *a1
      source_text:
        Re-evaluate rescue and bandage permissions for this checkpoint; stale permission from
        an earlier attempt does not authorize a later handoff.
      effects:
        - type: set
          target: rescue_allowed
          value:
            type: literal
            value: false
        - type: set
          target: bandage_allowed
          value:
            type: literal
            value: false
    - id: zero
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        At exactly zero incapacitate and apply the supplied randomized permanent injury once
        per hero/downing event. Persist zero_processed across replay; a distinct later downing event
        has a fresh marker. Negative-HP entry and injury-target randomization remain unresolved.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 0
          - type: compare
            operator: ne
            left:
              type: field
              name: zero_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: dead
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: zero_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.zero
        - character.hit_points.permanent_injury
    - id: timer
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Advanced Rule
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Only the explicitly enabled advanced rule uses the supplied 1d6+1 turn limit, once per
        hero/downing event. Persist timer_processed and turns across elapsed-turn checkpoints;
        replay cannot reroll or extend the limit.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: initial
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_points
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: advanced_rule_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: timer_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: ne
            left:
              type: field
              name: dead
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: timer_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.bleeding_time
    - id: rescue
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A living bleeding hero may receive a companion spell, own ready potion or adjacent
        companion ready potion during battle. Record the healing handoff once for the supplied
        attempt; the handoff neither spends an item nor restores HP.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rescue
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: companion_healing_spell
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: own_ready_potion
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent_companion_ready_potion
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: rescue_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: rescue_allowed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: healing
        - type: set
          target: rescue_handoff_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.rescue
    - id: healed
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        For a living bleeding hero with source-listed rescue means during battle, accept a
        supplied positive HP result. A handoff alone or zero/negative result cannot wake the hero.
        Persist the resulting cleared condition; replay cannot reapply healing after rescue.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: rescue
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: false
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: companion_healing_spell
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: own_ready_potion
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: adjacent_companion_ready_potion
                right:
                  type: literal
                  value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: rescue_result_supplied
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: healed_hp
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: hit_points
          value:
            type: field
            name: healed_hp
        - type: set
          target: bleeding_out
          value:
            type: literal
            value: false
        - type: set
          target: knocked_down
          value:
            type: literal
            value: false
        - type: set
          target: can_act
          value:
            type: literal
            value: true
    - id: bandage
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        After battle a standing companion who is not knocked out may bandage a living bleeding
        hero. Record the bandage handoff once per supplied attempt; actual bandage consumption and
        healing belong to the referenced resolution.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: after_battle
          - type: compare
            operator: eq
            left:
              type: field
              name: battle_over
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: standing_companion
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: healer_knocked_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: means_to_help
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bandage_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: bandage_allowed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: bandage
        - type: set
          target: bandage_handoff_processed
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.after_battle_bandage
    - id: party_lost
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: All heroes simultaneously bleeding out loses quest and kills party.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: all_bleeding_out
        right:
          type: literal
          value: true
      effects:
        - type: set
          target: dead
          value:
            type: literal
            value: true
      rule_refs:
        - character.hit_points.party_loss
    - id: no_help_rest_boundary
      source:
        - *a2
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Bleeding Out and Poisoned Characters
          extraction: *a3
      source_text:
        Do not choose between PDF122 no-means death and the PDF100 untreated-bleeding rest
        check when the caller proposes both; preserve the source overlap as unresolved.
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: after_battle
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: no_help
          - type: compare
            operator: eq
            left:
              type: field
              name: standing_companion
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: means_to_help
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: untreated_rest_check_requested
            right:
              type: literal
              value: true
      effects:
        - type: unresolved
          issue_id: issue.rest.untreated_bleeding_no_rescue
    - id: no_help
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        At an explicit no-help checkpoint (including the after-battle checkpoint), a living
        bleeding hero with standing companions but no means of help dies. The printed no-help
        sentence does not add a battle-over prerequisite. A proposed untreated-bleeding rest check
        remains a separate unresolved source overlap.
      when:
        type: all
        conditions:
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: after_battle
              - type: compare
                operator: eq
                left:
                  type: field
                  name: phase
                right:
                  type: literal
                  value: no_help
          - type: compare
            operator: eq
            left:
              type: field
              name: standing_companion
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: means_to_help
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: all_bleeding_out
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: untreated_rest_check_requested
            right:
              type: literal
              value: false
      effects: []
      rule_refs:
        - character.hit_points.no_rescue
    - id: expired
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Advanced Rule
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Optional bleeding time limit kills at expiry; elapsed turns are supplied. Only the limit
        initialized for this hero/downing event (timer_processed) can expire; a stale or
        never-initialized limit cannot kill.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: phase
            right:
              type: literal
              value: timer
          - type: compare
            operator: eq
            left:
              type: field
              name: advanced_rule_enabled
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: timer_processed
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: field
              name: elapsed_turns
            right:
              type: field
              name: turns
          - type: compare
            operator: eq
            left:
              type: field
              name: bleeding_out
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: dead
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: dead
          value:
            type: literal
            value: true
    - id: death_handoff
      source: *a1
      source_text:
        A dead hero is permanently removed; hand off that hero-owned checkpoint and any later
        player-chosen replacement at the next settlement. Invoke does not create a new hero.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: dead
        right:
          type: literal
          value: true
      effects:
        - type: invoke
          dependency: death
  entry_step: check_permissions
  exit_step: death_handoff
  issues:
    - issue.rest.untreated_bleeding_no_rescue
    - issue.phase4.zero_and_negative
