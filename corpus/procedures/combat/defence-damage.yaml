- id: procedure.hero_defence
  name: hero defence
  section_id: section.combat.parry_with_a_weapon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 120
      printed_page: 118
      heading: Parry with a Weapon
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 112
      printed_page: 110
      heading: Fumble
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 109
      printed_page: 107
      heading: Aim
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 110
      printed_page: 108
      heading: Aim
      extraction:
        method: image
        confidence: high
        visually_verified: true
    - &a1
      document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 179
      printed_page: 177
      heading: Weapons
      locator:
        table: table.equipment.weapons
        region: printed special-rule definition
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Dodging and parrying can only be done if the attack comes through the hero’s ZOC. ...
    If not in Parry Stance, you can dodge (Dodge) 1 attack and parry 1 attack with a shield (CS-15),
    or If in Parry Stance, you may dodge 1 attack using dodge (Dodge+15), and parry 1 attack with a
    shield (CS+15), or a weapon (CS).
  fields:
    incoming_hit:
      type: boolean
      role: input
      description: incoming hit
    through_zoc:
      type: boolean
      role: input
      description: through zoc
    power_restriction_resolved:
      type: boolean
      role: input
      description: power restriction resolved
    power_restricted:
      type: boolean
      role: input
      description: power restricted
    parry_stance:
      type: boolean
      role: input
      description: parry stance
    shield_ready:
      type: boolean
      role: input
      description: shield ready
    weapon_ready:
      type: boolean
      role: input
      description: weapon ready
    aiming:
      type: boolean
      role: input
      description: aiming
    fast_weapon:
      type: boolean
      role: input
      description: fast weapon
    exact_shield_result_supplied:
      type: boolean
      role: input
      description: exact shield result supplied
    exact_shield_success:
      type: boolean
      role: input
      description: exact shield success
    defence:
      type: string
      role: input
      description: defence
    roll:
      type: number
      role: input
      description: roll
      minimum: 1
      maximum: 100
      integer: true
    cs:
      type: number
      role: input
      description: cs
    dodge_skill:
      type: number
      role: input
      description: dodge skill
    dodges_remaining:
      type: number
      role: input
      description: dodges remaining
    parries_remaining:
      type: number
      role: input
      description: parries remaining
    talent_modifier:
      type: number
      role: input
      description: talent modifier
    incoming_damage:
      type: number
      role: input
      description: incoming damage
    shield_def:
      type: number
      role: input
      description: shield def
    durability:
      type: number
      role: input
      description: durability
    fast_parries_this_turn:
      type: number
      role: input
      description: parries already made this turn using the Fast special rule outside Parry Stance
      minimum: 0
      integer: true
    defence_eligible:
      type: boolean
      role: output
      description: defence eligible
    defence_succeeded:
      type: boolean
      role: output
      description: defence succeeded
    negates_damage:
      type: boolean
      role: output
      description: negates damage
    hero_prone:
      type: boolean
      role: output
      description: hero prone
    defence_threshold:
      type: number
      role: output
      description: defence threshold
    remaining_damage:
      type: number
      role: output
      description: remaining damage
    shield_damage:
      type: number
      role: output
      description: shield damage
    dodges_used:
      type: number
      role: output
      description: dodges used
    parries_used:
      type: number
      role: output
      description: parries used
    hit_location:
      type: string
      role: output
      description: hit location
    attacking_or_parrying:
      type: boolean
      role: output
      description: Parry fumble rule input
    is_hero:
      type: boolean
      role: output
      description: the defending model is a hero
    weapon_parry:
      type: boolean
      role: output
      description: the defence roll is a parry with a weapon
    using_fast_parry:
      type: boolean
      role: output
      description: the weapon parry is made with the Fast special rule outside Parry Stance
    parry_allowed:
      type: boolean
      role: output
      description: the Fast special rule allows the parry
  dependencies:
    - key: damage
      label: Apply arm protection to supplied spillover
      object_id: procedure.combat_damage
  steps:
    - id: start
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parrying or Dodging
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If Not in a Parry Stance
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        Dodging and parrying can only be done if the attack comes through the hero’s ZOC. ...
        If your hero performed a Power Attack in its last action, dodging or parrying is not
        allowed.
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: false
        - type: set
          target: defence_succeeded
          value:
            type: literal
            value: false
        - type: set
          target: negates_damage
          value:
            type: literal
            value: false
        - type: set
          target: is_hero
          value:
            type: literal
            value: true
        - type: set
          target: weapon_parry
          value:
            type: literal
            value: false
        - type: set
          target: using_fast_parry
          value:
            type: literal
            value: false
    - id: dodge
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parrying or Dodging
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If Not in a Parry Stance
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Aim
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        Dodging can only be done ONCE during a battle by each character, unless a Talent or
        Perk specifies otherwise. ... the hero may try to dodge an attack by making a Dodge Skill
        Check. ... An aiming model cannot dodge
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: dodge
          - type: compare
            operator: gt
            left:
              type: field
              name: dodges_remaining
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: aiming
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: dodge_skill
              - type: field
                name: talent_modifier
        - type: set
          target: dodges_used
          value:
            type: literal
            value: 1
    - id: dodge_stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Dodge
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        As long as the hero has an unused dodge, one incoming strike or arrow may be dodged
        with a +15 modifier on the Dodge Skill.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: dodge
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: defence_threshold
              - type: literal
                value: 15
    - id: weapon
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If in Parry Stance
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        'If the hero has taken up a Parry Stance, then one dodge AND one parry is permissible:
        ... To manage this, you must succeed with a CS test.'
      when:
        type: all
        conditions:
          - &a2
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: weapon
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: parries_remaining
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
        - type: set
          target: parries_used
          value:
            type: literal
            value: 1
        - type: set
          target: weapon_parry
          value:
            type: literal
            value: true
    - id: fast_weapon_parry
      source:
        - *a1
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        Weapon may be used to parry once per turn even though the hero did not choose the Parry
        Stance ... To manage this, you must succeed with a CS test.
      when:
        type: all
        conditions:
          - *a2
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: weapon
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: fast_weapon
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: fast_parries_this_turn
            right:
              type: literal
              value: 1
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
        - type: set
          target: parries_used
          value:
            type: literal
            value: 1
        - type: set
          target: weapon_parry
          value:
            type: literal
            value: true
        - type: set
          target: using_fast_parry
          value:
            type: literal
            value: true
      rule_refs:
        - combat.weapon.special.fast
    - id: shield
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If Not in a Parry Stance
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: If the hero is equipped with a shield, he may also parry 1 attack per turn with CS -15.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: eq
            left:
              type: field
              name: shield_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: parries_remaining
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
              - type: literal
                value: -15
        - type: set
          target: parries_used
          value:
            type: literal
            value: 1
    - id: shield_stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Shield
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        A shield is somewhat easier to parry with, especially if you are prepared. To succeed,
        you must roll below CS +15.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
              - type: literal
                value: 15
    - id: success
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If Not in a Parry Stance
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Shield
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        If successful, that attack fails to hit. ... To manage this, you must succeed with a CS
        test. However, if you roll 95-00 you not only fail ... To succeed, you must roll below CS
        +15.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: dodge
                  - type: compare
                    operator: lte
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: weapon
                  - type: compare
                    operator: lt
                    left:
                      type: field
                      name: roll
                    right:
                      type: literal
                      value: 95
                  - type: compare
                    operator: lte
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: shield
                  - type: compare
                    operator: lt
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
      effects:
        - type: set
          target: defence_succeeded
          value:
            type: literal
            value: true
    - id: shield_equality
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Shield
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: To succeed, you must roll below CS +15.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: field
              name: defence_threshold
          - type: compare
            operator: eq
            left:
              type: field
              name: exact_shield_result_supplied
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.combat.shield_threshold
    - id: shield_equality_supplied
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Shield
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: To succeed, you must roll below CS +15.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: field
              name: defence_threshold
          - type: compare
            operator: eq
            left:
              type: field
              name: exact_shield_result_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_succeeded
          value:
            type: field
            name: exact_shield_success
    - id: avoid
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: If Not in a Parry Stance
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
          extraction:
            method: image
            confidence: high
            visually_verified: true
      source_text:
        If successful, that attack fails to hit. ... A successful parry with a weapon negates
        all damage since a well performed parry diverts the force away from the target.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_succeeded
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: defence
                right:
                  type: literal
                  value: dodge
              - type: compare
                operator: eq
