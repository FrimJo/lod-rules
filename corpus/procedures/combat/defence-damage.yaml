- id: procedure.combat_damage
  name: combat damage
  section_id: section.combat.dealing_damage
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      heading: Dealing Damage
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Roll damage according to the weapon or monster damage noted in the Monster Table. Add a
    damage bonus if your hero or the monster is strong enough for that. Subtract the target’s
    Natural Armour and any other armour. This is the number of Hit Points to subtract from the
    target. An enemy dies when it is reduced to 0 Hit Points. A hero that reaches 0 is knocked out
    and starts bleeding out.
  fields:
    hit_resolved:
      type: boolean
      role: input
      description: hit resolved
    target_is_hero:
      type: boolean
      role: input
      description: target is hero
    defence_resolved:
      type: boolean
      role: input
      description: defence resolved
    armour_resolution_supplied:
      type: boolean
      role: input
      description: armour resolution supplied
    quick_slot_resolution_supplied:
      type: boolean
      role: input
      description: quick slot resolution supplied
    weapon_damage:
      type: number
      role: input
      description: weapon damage
    damage_bonus:
      type: number
      role: input
      description: damage bonus
    natural_armour:
      type: number
      role: input
      description: natural armour
    armour:
      type: number
      role: input
      description: armour
    hit_points:
      type: number
      role: state
      description: hit points
    maximum_hp:
      type: number
      role: input
      description: maximum hp
    location_roll:
      type: number
      role: input
      description: location roll
      minimum: 1
      maximum: 6
      integer: true
    armour_durability_loss:
      type: number
      role: input
      description: armour durability loss
    quick_slot_durability_loss:
      type: number
      role: input
      description: quick slot durability loss
    quick_slot_damage:
      type: number
      role: input
      description: quick slot damage
    damage_taken:
      type: number
      role: output
      description: damage taken
    action_points:
      type: number
      role: output
      description: action points
    dead:
      type: boolean
      role: output
      description: dead
    knocked_down:
      type: boolean
      role: output
      description: knocked down
    bleeding_out:
      type: boolean
      role: output
      description: bleeding out
    can_act:
      type: boolean
      role: output
      description: can act
    torso_check:
      type: boolean
      role: output
      description: torso check
    hit_location:
      type: string
      role: output
      description: hit location
  dependencies:
    - key: hit_location
      label: Hit location table rolled by the location steps
      object_id: table.combat.hit_location
    - key: armour
      label: Outer-layer armour durability
      object_id: character.durability.armour_damage
    - key: quick_slots
      label: Quick Slot hit and potion consequences
      object_id: character.durability.quick_slot_hit
    - key: bleeding
      label: Bleeding out
      object_id: procedure.bleeding_out
    - key: wounded_status
      label: Current HP classification and source-reconciled fresh turn cap; handoff does not reset
        active-turn AP
      object_id: procedure.wounded_status
  steps:
    - id: damage_formula
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Dealing Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Weapon DMG + DB - NA - Armour; negative result remains unresolved.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_resolved
            right:
              type: literal
              value: true
      effects: []
      rule_refs:
        - combat.damage.basic
        - combat.damage.negative_uncertain
    - id: apply_hp
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Dealing Damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Subtract only resolved nonnegative damage. No invented zero floor or overkill clamp.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: hit_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_resolved
            right:
              type: literal
              value: true
          - type: compare
            operator: gte
            left:
              type: arithmetic
              operator: subtract
              values:
                - type: sum
                  values:
                    - type: field
                      name: weapon_damage
                    - type: field
                      name: damage_bonus
                - type: sum
                  values:
                    - type: field
                      name: natural_armour
                    - type: field
                      name: armour
            right:
              type: literal
              value: 0
      effects: []
      rule_refs:
        - character.hit_points.loss
