    - id: party_lost
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: party lost
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: All heroes simultaneously bleeding out loses quest and kills party.
      when:
        type: compare
        operator: eq
