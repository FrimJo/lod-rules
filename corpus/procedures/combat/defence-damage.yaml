          pdf_page: 117
          printed_page: 115
          heading: large area
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text:
        Large/X-large covering centre suffers normal centre DMG +1 per other affected square it
        covers, not repeated centre/adjacent rolls.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
