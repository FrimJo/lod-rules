- id: procedure.hero_defence
  name: hero defence
  section_id: section.combat.parry_with_a_weapon
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 120
      printed_page: 118
      heading: parry with a weapon
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: One hero defence attempt. Dodge limit is per battle; parry is once per turn. Supplied
    talent/perk eligibility and modifiers augment, never replace, source restrictions.
  fields:
    incoming_hit:
      type: boolean
      role: input
      description: incoming hit
    through_zoc:
      type: boolean
      role: input
      description: through zoc
    power_restriction_resolved:
      type: boolean
      role: input
      description: power restriction resolved
    power_restricted:
      type: boolean
      role: input
      description: power restricted
    parry_stance:
      type: boolean
      role: input
      description: parry stance
    shield_ready:
      type: boolean
      role: input
      description: shield ready
    weapon_ready:
      type: boolean
      role: input
      description: weapon ready
    aiming:
      type: boolean
      role: input
      description: aiming
    fast_weapon:
      type: boolean
      role: input
      description: fast weapon
    exact_shield_result_supplied:
      type: boolean
      role: input
      description: exact shield result supplied
    exact_shield_success:
      type: boolean
      role: input
      description: exact shield success
    defence:
      type: string
      role: input
      description: defence
    roll:
      type: number
      role: input
      description: roll
      minimum: 1
      maximum: 100
      integer: true
    cs:
      type: number
      role: input
      description: cs
    dodge_skill:
      type: number
      role: input
      description: dodge skill
    dodges_remaining:
      type: number
      role: input
      description: dodges remaining
    parries_remaining:
      type: number
      role: input
      description: parries remaining
    talent_modifier:
      type: number
      role: input
      description: talent modifier
    incoming_damage:
      type: number
      role: input
      description: incoming damage
    shield_def:
      type: number
      role: input
      description: shield def
    durability:
      type: number
      role: input
      description: durability
    defence_eligible:
      type: boolean
      role: output
      description: defence eligible
    defence_succeeded:
      type: boolean
      role: output
      description: defence succeeded
    negates_damage:
      type: boolean
      role: output
      description: negates damage
    hero_prone:
      type: boolean
      role: output
      description: hero prone
    defence_threshold:
      type: number
      role: output
      description: defence threshold
    remaining_damage:
      type: number
      role: output
      description: remaining damage
    shield_damage:
      type: number
      role: output
      description: shield damage
    dodges_used:
      type: number
      role: output
      description: dodges used
    parries_used:
      type: number
      role: output
      description: parries used
    hit_location:
      type: string
      role: output
      description: hit location
    attacking_or_parrying:
      type: boolean
      role: output
      description: Parry fumble rule input
  dependencies:
    - key: damage
      label: Apply arm protection to supplied spillover
      object_id: procedure.combat_damage
  steps:
    - id: start
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: start
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Defence requires incoming attack through ZOC, resolved Power restriction, and eligible
        equipment/use count.
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: false
        - type: set
          target: defence_succeeded
          value:
            type: literal
            value: false
        - type: set
          target: negates_damage
          value:
            type: literal
            value: false
    - id: dodge
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: dodge
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text:
        Unused dodge allowed once per battle unless explicit talent/perk grants more. Aiming
        forbids dodge.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: dodge
          - type: compare
            operator: gt
            left:
              type: field
              name: dodges_remaining
            right:
              type: literal
              value: 0
          - type: compare
            operator: eq
            left:
              type: field
              name: aiming
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: dodge_skill
              - type: field
                name: talent_modifier
        - type: set
          target: dodges_used
          value:
            type: literal
            value: 1
    - id: dodge_stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: dodge stance
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Parry Stance gives +15 Dodge.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: dodge
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: defence_threshold
              - type: literal
                value: 15
    - id: weapon
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: weapon
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Weapon parry requires Parry Stance; roll CS, with supplied talent/weapon modifiers.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: weapon
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: weapon_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: parries_remaining
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
        - type: set
          target: parries_used
          value:
            type: literal
            value: 1
    - id: shield
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: shield
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Shield parry once per turn at CS-15 outside stance.
      when:
        type: all
        conditions:
          - type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: incoming_hit
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: through_zoc
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restriction_resolved
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: power_restricted
                right:
                  type: literal
                  value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: eq
            left:
              type: field
              name: shield_ready
            right:
              type: literal
              value: true
          - type: compare
            operator: gt
            left:
              type: field
              name: parries_remaining
            right:
              type: literal
              value: 0
      effects:
        - type: set
          target: defence_eligible
          value:
            type: literal
            value: true
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
              - type: literal
                value: -15
        - type: set
          target: parries_used
          value:
            type: literal
            value: 1
    - id: shield_stance
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: shield stance
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Shield in Parry Stance instead uses CS+15.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: eq
            left:
              type: field
              name: parry_stance
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_threshold
          value:
            type: sum
            values:
              - type: field
                name: cs
              - type: field
                name: talent_modifier
              - type: literal
                value: 15
    - id: success
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: success
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Dodge uses skill check; weapon parry 95–100 fails even above that skill. Shield
        equality is not silently resolved.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: any
            conditions:
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: dodge
                  - type: compare
                    operator: lte
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: weapon
                  - type: compare
                    operator: lt
                    left:
                      type: field
                      name: roll
                    right:
                      type: literal
                      value: 95
                  - type: compare
                    operator: lte
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
              - type: all
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: defence
                    right:
                      type: literal
                      value: shield
                  - type: compare
                    operator: lt
                    left:
                      type: field
                      name: roll
                    right:
                      type: field
                      name: defence_threshold
      effects:
        - type: set
          target: defence_succeeded
          value:
            type: literal
            value: true
    - id: shield_equality
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: shield equality
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Exact shield threshold conflicts with the general check convention; supply a resolution.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: field
              name: defence_threshold
          - type: compare
            operator: eq
            left:
              type: field
              name: exact_shield_result_supplied
            right:
              type: literal
              value: false
      effects:
        - type: unresolved
          issue_id: issue.combat.shield_threshold
    - id: shield_equality_supplied
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: shield equality supplied
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Accept supplied resolution only at ambiguous equality.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: field
              name: defence_threshold
          - type: compare
            operator: eq
            left:
              type: field
              name: exact_shield_result_supplied
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: defence_succeeded
          value:
            type: field
            name: exact_shield_success
    - id: avoid
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: avoid
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Successful dodge/weapon parry negates damage.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_succeeded
            right:
              type: literal
              value: true
          - type: any
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: defence
                right:
                  type: literal
                  value: dodge
              - type: compare
                operator: eq
                left:
                  type: field
                  name: defence
                right:
                  type: literal
                  value: weapon
      effects:
        - type: set
          target: negates_damage
          value:
            type: literal
            value: true
        - type: set
          target: remaining_damage
          value:
            type: literal
            value: 0
    - id: shield_absorbs
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: shield absorbs
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Shield subtracts DEF; when all damage negated nothing spills.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_succeeded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: lte
            left:
              type: field
              name: incoming_damage
            right:
              type: field
              name: shield_def
      effects:
        - type: set
          target: negates_damage
          value:
            type: literal
            value: true
        - type: set
          target: remaining_damage
          value:
            type: literal
            value: 0
        - type: set
          target: shield_damage
          value:
            type: literal
            value: 0
    - id: spillover
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: spillover
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Damage exceeding shield DEF damages shield once and spills onto arm, where armour applies.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_succeeded
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: gt
            left:
              type: field
              name: incoming_damage
            right:
              type: field
              name: shield_def
      effects:
        - type: set
          target: remaining_damage
          value:
            type: arithmetic
            operator: subtract
            values:
              - type: field
                name: incoming_damage
              - type: field
                name: shield_def
        - type: set
          target: shield_damage
          value:
            type: literal
            value: 1
        - type: set
          target: hit_location
          value:
            type: literal
            value: arms
        - type: invoke
          dependency: damage
    - id: dodge_fumble
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: dodge fumble
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Fumbling dodge causes hero to fall over.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: dodge
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
      effects:
        - type: set
          target: hero_prone
          value:
            type: literal
            value: true
    - id: weapon_damage
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: weapon damage
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: Weapon parry 95–99 inflicts durability damage unless Fast; reuse existing rule.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: weapon
          - type: compare
            operator: eq
            left:
              type: field
              name: fast_weapon
            right:
              type: literal
              value: false
          - type: compare
            operator: gte
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 95
          - type: compare
            operator: lt
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
      effects: []
      rule_refs:
        - character.durability.weapon_parry
    - id: parry_overlap
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: parry overlap
          extraction:
            method: text
            confidence: high
            visually_verified: true
      source_text: At 100 weapon damage overlaps general fumble; keep unresolved instead of double applying.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: weapon
          - type: compare
            operator: eq
            left:
              type: field
              name: fast_weapon
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
      effects:
        - type: unresolved
          issue_id: issue.phase4.durability_overlap
    - id: shield_fumble
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: shield fumble
          extraction:
            method: text
            confidence: high
            visually_verified: false
      source_text: Shield fumble costs one durability.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: defence_eligible
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: defence
            right:
              type: literal
              value: shield
          - type: compare
            operator: eq
            left:
              type: field
              name: roll
            right:
              type: literal
              value: 100
      effects:
        - type: set
          target: attacking_or_parrying
          value:
            type: literal
            value: true
    - id: shield_fumble_damage
      source:
        - document: rulebook.second_printing.eng
