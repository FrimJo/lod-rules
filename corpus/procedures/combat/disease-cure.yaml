- id: procedure.disease_cure
  name: Explicit potion or Sick Ward disease cure
  section_id: section.combat.different_kinds_of_damage.disease
  source: &a1
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 121
      printed_page: 119
      heading: Disease
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 80
      printed_page: 78
      heading: Potion of Cure Disease
      extraction:
        method: text
        confidence: high
        visually_verified: true
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 144
      printed_page: 142
      heading: Cure Disease and Poison
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Disease can be cured by consuming a potion to cure disease or visiting the sick wards.
    Weak disease potions have 75% success; Standard and Supreme 100%, and Supreme also heals 1d3 HP.
    Sick Ward/Temple treatment of most illnesses costs 100 c and takes one day. Actual potion
    resolution and eligible completed treatment are supplied outcomes; the existing item/service
    owns resource accounting.
  see_also:
    - section.appendix_iii_equipment.general_equipment.alchemy.table
    - section.alchemy.preparations.potion_of_cure_disease
    - section.alchemy.drinking_potions
    - section.settlements.buying_and_selling
  issues:
    - issue.disease.concurrent_effects
  fields:
    cure_route:
      type: string
      role: input
      description: Printed cure route supplied as potion or sick_ward.
    dead:
      type: boolean
      role: state
      description: Original hero dead state; this procedure cannot revive a dead hero.
    diseased:
      type: boolean
      role: state
      description: Current disease owned by this hero/episode; cleared only by confirmed cure.
    disease_cure_handoff_processed:
      type: boolean
      role: state
      description: Hero/episode/cure-attempt handoff marker. Start false for a distinct attempt and
        persist true; handoff alone is not consumption or a completed visit.
    disease_cure_result_processed:
      type: boolean
      role: state
      description:
        Hero/episode/cure-attempt resolved-result marker. Start false and persist true even for
        a failed consumed weak potion; replay cannot replace that result with another roll.
    potion_available:
      type: boolean
      role: input
      description: Supplied owned disease potion available for a new request; actual item/action
        accounting stays with potion resolution.
    potion_consumed:
      type: boolean
      role: input
      description: Actual consumption already resolved for this attempt, not inferred from invoke.
    potion_resolution_completed:
      type: boolean
      role: input
      description:
        Actual consumption/resource accounting and disease-removal outcome resolved by existing
        item effects. Separate Supreme 1d3 HP may still require resolution; this checkpoint does not
        repeat it.
    disease_effects_removed:
      type: boolean
      role: input
      description:
        Supplied outcome from the existing source-backed disease potion effects; false for a
        consumed weak potion failure.
    sick_ward_access_confirmed:
      type: boolean
      role: input
      description:
        Supplied access to the printed Sick Ward route; no arbitrary location is treated as a
        Sick Ward.
    disease_cure_allowed:
      type: boolean
      role: output
      description: Current call has an eligible unresolved cure attempt; reset on every invocation.
    disease_cure_confirmed:
      type: boolean
      role: output
      description: Current call has a confirmed cure effect; reset on every invocation.
    cured:
      type: boolean
      role: state
      description: Confirmed removal of this disease; other conditions and prior HP loss are not changed.
    disease_penalty_active:
      type: boolean
      role: state
      description:
        Whether the episode stat-loss modifier applies; confirmed cure deactivates it without
        overwriting unrelated stat changes.
    treatment_resolution_completed:
      type: boolean
      role: input
      description:
        Actual eligible cure_disease treatment and its resource/day accounting completed by
        procedure.settlement_buy_sell_and_service; invoke alone is insufficient.
    treatment_succeeds:
      type: boolean
      role: input
      description:
        Supplied illness-specific successful treatment; the source says most illnesses, not
        every possible illness.
  dependencies:
    - key: potion
      label: Actual disease potion consumption and source-backed quality effects; caller supplies
        completed resource/HP outcomes
      section_id: section.alchemy.preparations.potion_of_cure_disease
    - key: sick_ward
      label:
        Existing settlement treatment; caller resolves eligible cure_disease service, resources, time
        and illness-specific outcome
      object_id: procedure.settlement_buy_sell_and_service
    - key: standard_potion_effect
      label: Existing standard disease potion disease-removal effect
      object_id: character.equipment.alchemy.potion_of_cure_disease.cure
    - key: weak_potion_effect
      label: Existing weak disease potion 75% disease-removal effect
      object_id: character.equipment.alchemy.potion_of_cure_disease_weak.cure
    - key: potion_preparation
      label: Existing disease potion preparation description
      object_id: character.alchemy.preparation.potion_of_cure_disease
    - key: supreme_potion_bonus
      label: Existing separate Supreme 1d3 HP instruction
      object_id: character.alchemy.quality_effect.potion_of_cure_disease.supreme
    - key: drinking_rule
      label: Existing drinking-action source rule; resource accounting resolved separately
      object_id: character.alchemy.drink
  steps:
    - id: check_cure
      source: *a1
      source_text: Re-evaluate this living diseased hero and unresolved cure attempt; reject unknown
        routes, replayed results and dead/unaffected heroes.
      effects:
        - type: set
          target: disease_cure_allowed
          value:
            type: literal
            value: false
        - type: set
          target: disease_cure_confirmed
          value:
            type: literal
            value: false
      substeps:
        - id: accept_cure
          source: *a1
          source_text:
            Accept an unresolved potion or Sick Ward attempt for this living diseased hero; actual
            completed outcomes remain supplied.
          when:
            type: all
            conditions:
              - type: compare
                operator: eq
                left:
                  type: field
                  name: dead
                right:
                  type: literal
                  value: false
              - type: compare
                operator: eq
                left:
                  type: field
                  name: diseased
                right:
                  type: literal
                  value: true
              - type: compare
                operator: eq
                left:
                  type: field
                  name: disease_cure_result_processed
                right:
                  type: literal
                  value: false
              - type: any
                conditions:
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: cure_route
                    right:
                      type: literal
                      value: potion
                  - type: compare
                    operator: eq
                    left:
                      type: field
                      name: cure_route
                    right:
                      type: literal
                      value: sick_ward
          effects:
            - type: set
              target: disease_cure_allowed
              value:
                type: literal
                value: true
    - id: request_potion
      source: *a1
      source_text:
        Request an available disease potion resolution once; invoke does not consume an item or
        create a cure.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: cure_route
            right:
              type: literal
              value: potion
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: potion_available
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: potion_consumed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: disease_cure_handoff_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: potion
    - id: resolve_potion
      source: *a1
      source_text:
        An actually consumed potion with completed source-quality resolution consumes this
        attempt result even if Weak fails. Only supplied removal of disease effects confirms a cure.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: cure_route
            right:
              type: literal
              value: potion
          - type: compare
            operator: eq
            left:
              type: field
              name: potion_consumed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: potion_resolution_completed
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: disease_cure_result_processed
          value:
            type: literal
            value: true
        - type: set
          target: disease_cure_confirmed
          value:
            type: field
            name: disease_effects_removed
    - id: request_sick_ward
      source: *a1
      source_text: Hand off an accessible Sick Ward treatment once. The settlement service owns its
        eligibility, 100 c fee and one-day accounting; invoke alone neither charges nor cures.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: cure_route
            right:
              type: literal
              value: sick_ward
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_handoff_processed
            right:
              type: literal
              value: false
          - type: compare
            operator: eq
            left:
              type: field
              name: sick_ward_access_confirmed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: treatment_resolution_completed
            right:
              type: literal
              value: false
      effects:
        - type: set
          target: disease_cure_handoff_processed
          value:
            type: literal
            value: true
        - type: invoke
          dependency: sick_ward
    - id: resolve_sick_ward
      source: *a1
      source_text:
        A supplied completed eligible treatment consumes this attempt result, including an
        illness-specific failure. Only the supplied successful treatment confirms cure.
      when:
        type: all
        conditions:
          - type: compare
            operator: eq
            left:
              type: field
              name: disease_cure_allowed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: cure_route
            right:
              type: literal
              value: sick_ward
          - type: compare
            operator: eq
            left:
              type: field
              name: sick_ward_access_confirmed
            right:
              type: literal
              value: true
          - type: compare
            operator: eq
            left:
              type: field
              name: treatment_resolution_completed
            right:
              type: literal
              value: true
      effects:
        - type: set
          target: disease_cure_result_processed
          value:
            type: literal
            value: true
        - type: set
          target: disease_cure_confirmed
          value:
            type: field
            name: treatment_succeeds
    - id: clear_disease
      source: *a1
      source_text:
        Confirmed cure removes the current illness and deactivates its stat-loss modifier.
        Preserve unrelated stat changes, HP and already-resolved resource/day accounting. Supreme HP
        remains a separate item effect.
      when:
        type: compare
        operator: eq
        left:
          type: field
          name: disease_cure_confirmed
        right:
          type: literal
          value: true
      effects:
        - type: set
          target: cured
          value:
            type: literal
            value: true
        - type: set
          target: diseased
          value:
            type: literal
            value: false
        - type: set
          target: disease_penalty_active
          value:
            type: literal
            value: false
  entry_step: check_cure
  exit_step: clear_disease
