  confidence: high
  source_text: Thane Copperbane, Dwarf of the High Mountains, was famous for his remarkable
    resilience. He shrugged off wound after wound, seemingly able to defy anything the goblins could
    throw at him. His demise came as a tunnel collapsed on him during a visit to the frontier mining
    shafts deep within the mountains. After his death, the Runesmith of the hold claimed his
    resilience came from a belt he had helped design. This could never be proven, as the belt was
    missing when the great Thane’s body was recovered. Whether the cave-in was natural or a cunning
    scheme by the Cave Goblins remains a debate to this day. No Dwarf would ever admit that a tunnel
    constructed by them could collapse by natural causes, but no proof of goblin interference has
    ever been found. The belt grants the wearer +20 Constitution but all goblins fighting the wearer
    gain the Hate Special Rule.
