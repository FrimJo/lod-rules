  source_text:
    Long before the Kingdom was forged, this crown was once worn by the Dwarf Thanes in the
    keep of Morndihr. Once a sprawling Dwarven city, Morndihr had put its name on the map due to the
    vast riches mined from the bowels of the mountain far beneath the keep. At its peak, the crown
    was crafted as a gift from the Miner’s Guild to the City’s Thane. It was later passed on from
    father to son for three generations. The Crown is an epitome of Dwarven artisan skills, and a
    part of the Dwarven stubbornness seems somehow imbued in the crown. Soon after the Kingdom was
    born, the keep of Morndihr was overrun by Goblins and Trolls, and not a single Dwarf managed to
    escape the tragedy. How much of the city's mythical treasures still remain is unknown, since few
    are those who have managed to enter the keep, and fewer are those who survived to tell the tale.
    The crown grants the wearer +15 RES, but prevents the use of a helmet or cap.
