  status: extracted
  confidence: high
  source_text: Esmeralda Rosepike is probably the most famous vampire in the history of men. While
    most vampires shun the company of humans and treat them like mere cattle, Esmeralda thrived
    amongst the aristocracy of the capitol. As popular as she was beautiful, she was always invited
    to the most lavish dinners and parties. She also arranged outrageously decadent parties that
    were hugely popular amongst the nobles. She was known for her taste in young, handsome men and
    her list of lovers grew constantly longer until finally her true nature was discovered. When the
    nobles carousing with her realised that they were twice as old as they used to be, while she had
    not aged a day, rumours began circling. The young men courting her also tended to disappear at
    an alarming rate. Finally, the High King issued an arrest order. During the attempt to seize
    Esmeralda, she revealed the beast within her, and it is said a hundred royal guards were killed
    before she was slain. This brooch is said to have been her favourite piece of jewellery, and one
    that she wore almost every night. The brooch is treated as a necklace, and every time its owner
    wounds an enemy, it restores 1d6 Hit Points to the owner (up to the amount of damage dealt).
    However, on a roll of 6 the brooch instead drains 1d6 Hit Points from the closest hero. This
    brooch is worn as a necklace.
