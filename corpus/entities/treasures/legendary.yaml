  source_text:
    This dagger once belonged to the infamous assassin Vrunior. Famous for never failing to
    kill his mark, the villain was armed with a vicious looking curved dagger. Few were those who
    ever saw him coming, and fewer were those that managed to put up a fight. Nonetheless, after
    years at the top of the ‘Most Wanted’ list in the kingdom he was finally tracked down and
