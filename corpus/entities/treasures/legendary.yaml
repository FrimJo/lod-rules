  status: extracted
  confidence: high
  source_text: The first High King, Rannulf Moarnoak, used this plate as he forged the Tribes of
    Humans together into the Kingdom. Forged from meteoric iron, found deep within the Dwarven
    mountains, the breastplate is said to withstand even the fiercest of strikes. Rannulf himself is
    said to have been struck by a mighty minotaur’s huge axe straight in the chest which sent him
    flying, but left him unharmed. Whether this is true or not matters little, as the plate is
    clearly a masterpiece, and has a shine to it as if just polished even though it is over 500
    years old. Rannulf wore the armour every day until his death and it was so dear to him that he
    was buried in the armour. How this armour was removed from the ancient king’s tomb remains a
    mystery. This armour has a DEF value of 8 and denies the Double Damage roll made by Large
    Creatures. ENC 7.
