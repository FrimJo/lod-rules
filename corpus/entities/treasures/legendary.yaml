  status: extracted
  confidence: high
  source_text: There is no mistaking the Elven craftsmanship in this cloak. Woven in fabric as light
    and smooth as silk, yet almost as tough and resilient as leather. The cloak is dyed in a forest
    green tone and the edges are decorated with intricate patterns of gold, which seem to shift as
    the cloak moves. These cloaks were woven by the Elven Queen Elsewhyr herself, long before the
    founding of the kingdom, and were worn by the Elven scouts guarding the forest's outskirts. That
    one of these cloaks is still in this remarkable shape, and, not in Elven possession is truly a
    wonder. The fluid motions of the cloak as its wearer moves are almost hypnotising, which makes
    it difficult to get a good aim. The wearer gets +15 Dodge.
