  status: extracted
  confidence: high
  source_text: 'This pair of leather boots looks way fancier than most adventurers’ boots do. They
    would probably better suit a noble attending a party. Nonetheless, the magic imbued in them is
    quite remarkable. They were actually worn by Lord Fouquet who was an infamous drunkard,
    constantly causing scenes at whatever reception he attended. Who made these boots remains
    unknown, but they resolved a mystery that always surrounded the Lord: he always remained
    remarkably stable on his feet, no matter his drunken state. When he passed, the boots
    disappeared, and their current whereabouts are unknown. A hero wearing these boots can never
    fall down, and they can ignore any destabilising effects.'
