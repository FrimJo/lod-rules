  status: extracted
  confidence: high
  source_text: Golgorosh was a human tribal warrior of mighty renown. When in battle, he would lose
    all self-control, charging literally headfirst into his enemies. Towering a head above most men,
    and powerfully built, he rendered his opponents unconscious through the use of vicious head
    butts. This led him to be known as the Ram. However, his practice did come at a cost. The
    constant pounding to his head slowly changed the warrior. Fearing that Golgorosh would turn
    crazy or worse, the chieftain of the tribe ordered his shaman to find a solution. Together with
    the smith, the shaman crafted a large helmet, which sported the horns of a ram. Furthermore, the
    shaman imbued it with a soothing enchantment, mending the mind of the one wearing the helmet.
    Every time the helmet is struck, the sweet voices of a thousand fairies can be heard singing
    inside the helmet. The helmet is quite effective and any hit against the head no longer causes
    the -1 loss of Sanity even if the helmet fails to absorb all damage. However, the voices are so
    calming that they have been known to pacify the user. If hit in the head, the user must pass a
    RES Test or spend the next Action point passively enjoying the mesmerising voices of the fairies
    (stunned). Furthermore, in true ram fashion, shoving while wearing the helmet has a +15. This is
    considered a metal helmet in all other aspects. The helmet has DEF 6, Enc 5.
