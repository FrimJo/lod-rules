  status: extracted
  confidence: high
  source_text: During the Undead War, the Kingdom’s army was stretched all along the border in its
    attempt to stop the walking dead from pushing north. Communication between the detachments were
    often done through tamed birds, but the more important messages were often sent with runners.
    This was a dangerous task indeed, and most of these runners would eventually go missing. One of
    the most well-known runners was Phineas Belmont, who ran from the eastern border all the way to
    the great southern road from the Silver City to inform the King that the frontline was
    collapsing. More impressive was the fact that this run was done almost without pause. Thanks to
    his deed, the troops could respond to the collapse and avoid encirclement. When asked how he
    could make this run he said that it was all down to having a good pair of boots. And so the myth
    about the Boots of Energy was born, and apparently, there was more to the myth than most would
    think. These boots will grant the wearer 2 additional Points of Energy.
