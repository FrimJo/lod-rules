  status: extracted
  confidence: high
  source_text: There are certain potions that are brewed with such precision and craftsmanship that
    the effect will last almost forever. Throughout history, there have only been two alchemists who
    have perfected their craftsmanship to such a level that they could create these marvellous
    brews. Akh-Zum, also famous for his vials, was one of them. The other was Cebarin the Mad, who
    got his name based on the side effects of consuming too many Elixirs of Wisdom. Obsessed with
    increasing the capacity of his mind, he passed from brilliance into madness. Speaking
    incomprehensibly in some unknown language, and spending his days making strange diagrams and
    images, he finally passed away as an elderly hermit. The party may find more than one of these
