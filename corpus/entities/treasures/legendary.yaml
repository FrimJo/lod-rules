  status: extracted
  confidence: high
  source_text:
    These gauntlets were once worn by Hraefnir the Fierce, a Berserker who was the greatest
    champion alive at the time. Originally taught to fight as a gladiator in the heart of the
    kingdom, he was eventually pardoned and released after a record-breaking streak of wins. Living
    for the thrill of battle, he continued his search for tougher opponents in the frontiers of the
    kingdom. It was probably during these travels that he acquired the now famous gauntlets. He
    finally met his match and ended in a battle with the ogre, Gorag Halfhand. With his demise, he
    passed into legend and to many Berserkers he has evolved into a half-god. The gauntlets he wore
    grant the wearer immense Strength (+15). They do not take up any armour slots and should just be
    noted in the inventory.
