  status: extracted
  confidence: high
  source_text: When the Undead marched against Humanity, they were led by their mummified Kings,
    Princes, and Queens of old. One such nameless prince wielded a golden khopesh that seemed to cut
    through armour as though it was mere cloth. Though many tried, none could best him in combat and
    soon no one would dare try. However, in the final days of the war, the prince was finally
    killed. Not by a skilled swordsman or an accomplished archer, but through sheer luck. As the
    prince advanced with his cohort of mummies, he was crushed under a massive rock lobbed from a
    human trebuchet. Maybe Rhidnir had decided to play the old prince a joke, or maybe this was just
    a freak coincidence, but the prince proved to be mortal (or least possible to kill again) in the
    end. The Khopesh was gifted to the Captain of the Artillery who wore it with great pride.
    However, not long after the war he was found dead in his bed, dried up to a mere husk and with a
    wild stare in his eyes. The Khopesh was never found. This weapon ignores all armour and natural
    armour saves, but at the same time, all Higher Undead will always attempt to attack the wielder,
    forgoing the normal targeting priority. DMG 1d12+1, Class 4, Encumbrance 10.
