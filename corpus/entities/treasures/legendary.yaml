  source_text: This hammer is said to have been passed down by the god himself. Marked with strange
    runes, the hammer packs a hefty punch. If there is any merit to the myth it is hard to tell, and
    there is no way of telling which god would have given his hammer. The first mention of the
    weapon in human literature, is related to the Orc Chieftain, Braugh Skullcracker. Apparently, he
    wielded the hammer like a dervish, striking left and right, cracking a skull with each mighty
    blow. Once his reign was finally over, the hammer seems to have disappeared from the history
    books. Scholars entertain the idea that the hammer may actually be a divine artefact, but at the
    same time, they find the idea that he would have gifted a brutish orc with this blessing rather
    preposterous. The hammer stuns the enemy every time it hits, without any tests needed. However,
