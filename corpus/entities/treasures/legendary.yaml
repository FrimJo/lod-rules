  status: extracted
  confidence: high
  source_text:
    Parts of this staff are said to originate from the void itself, and the mere look of it
    makes you wonder. It is a gnarly wooden staff, but its colour is as black as the night. It
    weighs more than any wood known to man and it is noticeably cool to the touch. No one has
    claimed to be the artisan behind the staff, and its first appearance is a subject for debate.
    Some sources claim that it was first wielded by the High Mage, Ibeus Aldor, during the Undead
    Wars. Other sources suggest that it was used by a shaman, back in the days when humans still
    lived in tribes. No matter the truth, the staff is powerful indeed, and it seems to have a
    special bond with the void. Any Conjuring Spell cast while wielding the staff is done at +20
    Arcane Arts. Any elementals or demons summoned with this staff gets 1 extra initiative token.
