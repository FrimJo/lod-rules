  status: extracted
  confidence: high
  source_text: This armour was once used by your father during his years in the Royal Army. Although
    he never rose above the Centurion rank, this armour would make you think otherwise. With
    exquisite details, state of the art buckles, and straps for that perfect fit, it really signals
    the authority you would expect from a higher ranking officer. It does have a few nicks here and
    there which indicate that the armour was worn in battle, and not merely for show. With some
    small adjustments, this fine armour fits you like a glove, and hopefully serves you as well as
    it did your father. The hero may choose whether this is a Padded Vest, Leather Vest, Chainmail
    Shirt, or Breastplate depending on what best suits their profession. It has the same stats, but
    with a +1 DEF modifier. Furthermore, the pride of wearing this armour gives the hero a +15
    modifier to their RES value.
