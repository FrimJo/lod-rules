  source_text:
    A successful dungeoneer has the happy problem of hauling quite a lot of loot home. One
    famous, although unlikely, dungeoneer was Elyas Dustmouse. As he stood no more than 120 cm
    (3ft), you would expect that his stature would limit his carrying capacity. In truth, that was
    initially the case. However, Dustmouse had strong contacts within the Wizards’ Guild, and he had
    a special backpack made. The backpack seems to mock gravity, as anything tucked into it
    instantly becomes as light as a feather. Dustmouse himself disappeared during his last
    expedition, and the backpack was lost along with him. The creator of the bag is still unknown,
    and all attempts to replicate it have failed. All objects carried in the bag have their ENC
    halved (RDD).
