  confidence: high
  source_text: A magical artifact of cunning design, this ring gives a slight squeeze every time a
    trap is nearby. Most artifacts with magical properties tend to be plain and simple; however,
    this ring is quite the opposite. It is designed to look like a series of intertwined snakes, and
    when its magic effect is triggered, the snakes twist and wind which causes the ring itself to
    contract. The artifact was found in the Ancient Lands by Alad Bostan. As with all magical
    trinkets found south of the border, the ring underwent extensive investigation by the High
    Wizards of the Golden College. They deemed the ring safe to use, and handed it back to Alad. On
    his very next expedition, Alad disappeared, and the ring was lost once more. The ring increases
    the PER of any member in the party by +10 when rolling to detect traps. The hero wearing the
    ring feels the squeeze and warns everyone in the party of the impending danger. This is treated
    as a magic item and uses the Ring Slot.
