- id: equipment.legendary.ring_of_awareness
  name: Ring of Awareness
  section_id: section.appendix_v_treasures.legendary_items.ring_of_awareness
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 206
      printed_page: 204
      heading: Ring of Awareness
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This golden ring is quite simple in its appearance, apart from the purple round stone
    set in it. The stone seems dull and a bit out of place as a decoration on a piece of jewellery.
    There are no markings on the ring and nothing that hints as to who made it, but those versed in
    magical artefacts and trinkets would know this is a Ring of Awareness. Popular amongst nobles
    and warlords alike, this ring warns the wearer of imminent threat, and perhaps thwarts the plans
    of a hidden assassin. The normally dull stone starts to pulsate with light, increasing as the
    threat comes closer. How many of these rings were made is unclear but attempts to copy the
    design and magical properties have failed by all who have tried. The ring adds +1 initiative
    token on the first round of battle, and it adds +15 to a hero’s Perception when detecting traps.
    The party may find more than 1 of these rings and the effect on initiative is cumulative up to a
    maximum of +3.
