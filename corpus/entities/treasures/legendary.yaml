- id: equipment.legendary.stone_of_valheir
  name: Stone of Valheir
  section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 204
      printed_page: 202
      heading: Stone of Valheir
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    One of three stones found by the Dwarven King Valheir over a thousand years ago. These
    stones glow in a mesmerising way, constantly changing colours. Legend has it Valheir turned mad
    after spending the remaining years of his life staring into the stones. Long thought lost for
    all eternity, these stones have the power to store the raw essence of magic itself. A wizard may
    store up to 3 Focus bonuses in the stone which can then be drawn upon at any time. That means
    the wizard may cast a spell and get the 10-30 Focus bonus without actually needing to focus.
    This bonus does not increase the risk of miscast. What is more, this can also be combined with a
    normal Focus Action, following the normal rules for focusing. Storing can be done at any time
    and each Focus bonus takes a full turn to store and requires a successful Arcane Arts roll.
    Alternatively, it can be filled in between quests without any need for rolls. However, the
    mesmerising glow of these stones is not without risk, and every time the wizard draws a Focus
    bonus from it, he or she must pass a RES Test, or lose 1 Sanity Point.
  type: equipment
  category: general
  rules:
