  status: extracted
  confidence: high
  source_text: Crafted from the femur of a huge Troll, the look of this ring sends chills down the
    spines of those who lay their eyes upon it. Most would say that this ring is evil, and it was,
    in fact, crafted by the infamous Necromancer, Semias Blackwood, as an attempt to prolong his
    life. All Necromancers are shunned by society and hunted by the Brotherhood. As soon as they are
    identified, they are brought to justice. Semias' existence could never be proven, and the rumour
    of his existence lasted for over a hundred years until he was finally located. Possibly the ring
    had worked, or maybe he had found another way to prolong his unnatural life, but he was finally
    chased into the eastern mountains. He left most of his belongings, including the ring, behind
    him. Whether the loss of the ring caused his demise, or if he still clings to this world by
    other means is unknown. The ring grants its owner the Regeneration Special Rule, but with 1d3 HP
    instead of the normal 1d6 HP.
