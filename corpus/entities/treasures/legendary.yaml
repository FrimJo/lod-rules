  status: extracted
  confidence: high
  source_text: This axe is the heirloom of the Cragward family. Inheriting your profession from your
    father or mother is a quite common practice in the kingdom. This tradition was something the
    King’s Headsman, Ogrus Cragward, held in high regard. While normally a tradition for artisans
    and farmers, he insisted that his son would continue his bloody work and his axe was eventually
    handed over to his eldest son. And so continued the tradition of the Cragward family, handing
    the axe from generation to generation. With so many heads severed with this axe over the
    centuries, it somehow changed. Maybe tainted by the blood of all those who lost their lives to
    its keen edge, it seemed as though the axe itself had developed a lust for blood. The Cragward
    family finally lost possession of the axe as the last headsman was left without any heirs. The
    axe adds +2 Damage for every consecutive hit that succeeds in dealing damage. Any strike missing
    or not causing damage returns the bonus to 0. The bonus is also removed after each battle. The
    axe is in all other respects considered a Greataxe.
