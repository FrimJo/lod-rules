    The Sword of Lightning is the archetype of a magical weapon. With sparks dancing up and
    down the blade there is no doubting its power. This weapon is a result of an unusually
    successful enchantment in combination with curious circumstances. At the precise moment that the
    wizard, Olius Hellbrand, finished the enchantment and lifted the sword aloft, he was struck by
