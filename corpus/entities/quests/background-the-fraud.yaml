  source_text: 'Not applicable for wizards. reroll if you are a wizard. Personal Trait: Deduct -10
    from CS, RS, and Dodge since you have neither formal training nor experience. Your RES is also
    reduced with -10 (temporarily, see below). Personal Quest: It is time to go from fraud to the
    real deal. Once you have improved CS, RS, and Dodge with +10 you can finally believe that you
    are more than empty words. Once this is achieved, you regain your RES and may increase it with
    another +10. You also gain an additional 1500XP.'
