  source_text: A lava river flows beneath the local temple of Rhidnir. ... Lately though, the Priests of the temple have noticed unusual trembles and they fear these seismic activities may cause the river to flood. ... To stop the tremors, a powerful incantation must be cast at the old shrine next to the river. ... The priests have hired the heroes and provided them with 2 scrolls that must be read at the altar. ... Rhidnir himself, however, had a good laugh enjoying the spectacle and decides to grant the heroes +1 luck on their next quest.
