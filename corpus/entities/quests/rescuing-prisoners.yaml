  source_text: One of the caravans to the settlement has been ambushed and ransacked by local bandits. However, none of the passengers were found among the remains of the wagons and the Jarl has come to the conclusion that they must have been kidnapped. As always, he turns to his trusted heroes to ask for their help. The attack was likely executed by a local menace known as Golfrid the Short. ... Once the battle is over, the heroes take a headcount of the prisoners and escort any survivors back to the city.
