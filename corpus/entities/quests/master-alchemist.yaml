  source_text: The heroes have been contacted by the settlement's leading alchemist. He is working on a new formula that he believes will come close to the power of the legendary elixirs of old. However, to finish the formula, he needs liquid lava and the only place he knows where this can be found is unfortunately in a monster-infested dungeon. ... To be able to bring the lava back in liquid form, he has, with the help of a wizard friend, constructed a special vial that will magically prevent the lava from cooling, but at the same time keep the vial cool to the touch. With the vial in their backpacks, the heroes set off.
