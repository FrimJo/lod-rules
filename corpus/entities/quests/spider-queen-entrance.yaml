  source_text: Upon arrival, the adventurers find themselves by the ruins of an old temple. As predicted by the old wizard, the temple seems to be occupied. ... Somewhere in those dark halls, there must be a hidden passageway that leads deeper down underground. ... It matches the spider amulet perfectly, and as the amulet is pressed into the imprint, the statue slowly slides away with a horrendous screeching sound, revealing a dusty stair leading down into the darkness.
