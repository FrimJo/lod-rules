  source_text: "Campaign start: Whiteport ... The party has been contacted by an elderly wizard who tells them the story of the Queen. He has studied everything known about her for several years and has come to the conclusion that the Queen's control over the spiders must have been magical and most likely related to the sceptre that she was always pictured with. That sceptre would logically be buried with her, which would also explain the army’s disintegration after her death. If the party can enter the tomb and locate the sceptre, the wizard will reward them handsomely. According to his calculations, the tomb is located not far north of the Ancient Lands. ... Quest Location: White 40. Reward: 1200 c per hero."
