  source_text:
    Apparently, foul things are going on in the catacombs below the city. Demons have been
    spotted in the sewers, and it will not take long before they will be walking the streets.
    According to the High Wizard, everything points toward an open portal between the dimensions
    somewhere under the city. The Jarl turns to his trusted adventurers as he has so many times
    before, urging them to enter the catacombs and seal shut the dreaded gate.
