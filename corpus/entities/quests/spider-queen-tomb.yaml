  source_text: Reaching the end of the stairs, the party stops to take a look around. They are once again in a corridor, but the end of the corridor is still hidden in darkness. ... it dawns upon them that the opening is covered in a tight weave of cobweb. ... Whatever power the Queen held over the spiders, it is clear that the bond seems to transgress the borders between life and death. ... With Belua and her children slain, the heroes can carefully examine the sarcophagus.
