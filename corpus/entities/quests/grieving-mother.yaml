  source_text: 'The old lady is barely visible and flickers like a flame about to go out. ... Even
    now, some hundred years after her own passing, she still longs for him and begs the heroes to
    bring back her son to be buried in the family grave on the estate, so that they may finally rest
    together. Location: In the same dungeon as the next quest. ... There will automatically be a
    Ghostly Event before the next quest, and that will be #8. ... Once back at the estate, the party
    holds a short ceremony and buries the remains in the old family cemetery. The old lady is never
    seen again, but the next morning an exquisite sword is found on the dining table. The Longsword
    is considered magical and has +2 DMG.'
