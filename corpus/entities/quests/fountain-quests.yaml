  source_text: The Temple of Meredith has always provided visitors with the sacred water that flows there. It is said to have healing properties, and that it can even be used to keep the Undead away. However, the last few days, the water has turned from clear to a muddy green, and the smell is less than pleasant. The High Priest of Meredith has reached out to the adventurers, begging them to investigate the source of the problem. ... Back in the temple, the heroes are greeted by the High Priest who presents them with their reward as well as a Potion of Healing for each hero.
