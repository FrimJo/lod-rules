  source_text: There is an old ritual of baptising weapons to fight evil. It is said that a weapon that has undergone the ritual is superior to any other of its kind. Unfortunately, this ritual cannot be done with just any water, but requires water from one of the sacred fountains of Ramos. The heroes have been tasked with retrieving some of the water for the local garrison. However, the closest fountain to the heroes is overrun by a tribe of Orcs and Goblins. ... Then they fill the bottle for the garrison and head back to Silver City.
