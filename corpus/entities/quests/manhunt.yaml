  source_text:
    Apparently, one of the city guards was killed last night, and the streets are swarming
    with armed soldiers. ... Posters with sketches of the perpetrator have been posted everywhere.
    Apparently, the man is missing both an eye and an ear, so he should be easy to identify. It
    seems anyone who kills the bandit, and can prove it, will be handsomely rewarded. Unbeknownst to
    the heroes, the bandit has taken refuge in the very same dungeon to which they are heading.
