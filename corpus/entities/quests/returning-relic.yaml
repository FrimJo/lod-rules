  source_text: The adventurers have been contracted by a local nobleman who needs their help.
    Apparently, he retrieved a polished black stone from a long-forgotten temple with the help of
    another team of adventurers. The nobleman believed the stone was valuable but has suffered bad
    luck ever since. He is certain the stone is to blame and that perhaps he was cursed when he took
    it. He now wants the heroes to return the stone in the hope of breaking the curse.
