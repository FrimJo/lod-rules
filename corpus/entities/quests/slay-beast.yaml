  source_text:
    'Feeling ready for a change of pace, the heroes decide to go to the Flying Wheel Tavern
    instead of their usual watering hole, The Screaming Hog. ... suddenly the party is facing a
    challenge: “I’d say these fellas are nothing more than loudmouths! Prove me wrong and I’ll give
    you coins. If you fail, you either pay with your lives to the beast, or by coins to me!” The
    beast in question happens to be in the same dungeon the party is heading to in the morning. ...
    The party can always choose to back out, and go on the quest without a side quest. If they
    choose to accept the challenge, they will either win the bet, or have to pay the bet when they
    come back, should they fail.'
