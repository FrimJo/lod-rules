  source_text: The old Bergmeister Estate on the outskirts of Silver City has been empty for many
    years. ... Being notoriously haunted, no one has dared purchase it, even though it has been up
    for sale for many years. ... The main house has more rooms than you could possibly need, and
    there is also quite a sizable bit of land that comes with the house. To get the key to the
