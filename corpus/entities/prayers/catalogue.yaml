- id: prayer.bringer_of_light
  name: Bringer of Light
  section_id: section.prayers.bringer_of_light
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 82
      printed_page: 80
      heading: Bringer of Light
      section: Level 1 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The light of the Gods shines through the priest, causing the Undead to waver. Any Undead
    trying to attack the Warrior Priest suffers -10 CS.
