      printed_page: 80
      heading: The Power of Iphy
      section: Level 1 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    This empowering psalm strengthens your resolve. The party gets +10 RES on any Fear or Terror
