      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 83
      printed_page: 81
      heading: Stay Thy Hand!
      section: Level 3 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The enemies seem to slow down, as if questioning whether to fight or not. All enemies within 4
    squares of the priest must pass a Resolve Test or they will lose 1 Action Point during that
    turn. Test at the start of every turn. This effect is not cumulative with any other effect
    causing an enemy to lose an action. For instance, a wounded enemy will not be affected by this
    prayer.
  type: prayer
  level: 3
  rules:
    - character.prayer.stay_thy_hand
  tables: []
