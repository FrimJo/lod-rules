- id: prayer.gods_champion
  name: God’s Champion
  section_id: section.prayers.gods_champion
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 83
      printed_page: 81
      heading: God’s Champion
      section: Level 4 prayers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: >-
    The priest fights like a dervish, imbued by the power of his or her god. Combat Skill is
    increased by +20 and the priest gets a +2 DMG modifier but after the battle, the priest loses
    an additional Point of Energy. If there are not enough points, the Constitution of the priest
    is halved (RDD) until the next short rest or until the heroes leave the dungeon.
  type: prayer
  level: 4
  rules:
    - character.prayer.gods_champion
    - character.prayer.gods_champion.after_battle.constitution
    - character.prayer.gods_champion.after_battle.energy
  tables: []
