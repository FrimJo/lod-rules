- id: talent.blood_magic
  name: Blood Magic
  section_id: section.appendix_ii_talents.magic_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 176
      printed_page: 174
      heading: Blood Magic
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard can spend his own life blood to create Mana. For every 2 HP spent, the
    wizard gains 5 Mana. This transformation can be done for free during the wizard’s turn.
  type: talent
  activation: passive
  category: Magic Talents
  rules:
    - character.talent.blood_magic.eligibility
    - character.talent.blood_magic.conversion
  tables:
    - table.talent.magic
  table_rows:
    - table_id: table.talent.magic
      row_id: blood_magic
