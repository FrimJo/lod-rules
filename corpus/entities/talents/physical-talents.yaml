- id: talent.observant
  name: Observant
  section_id: section.appendix_ii_talents.physical_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 172
      printed_page: 170
      heading: Observant
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Rangers only. Used to camping in dangerous places, a Ranger with this talent will
    convey a -10 modifier to the risk of an ambush during a rest in a dungeon. Furthermore, all
    members of the party will always start all battles standing up even if the quest or rules states
    otherwise. Any extra enemy initiative tokens due to a surprise or ambush is also negated by this
    talent.
  type: talent
  activation: passive
  category: Physical Talents
  rules:
    - character.talent.observant.eligibility
    - character.talent.observant.rest_ambush
    - character.talent.observant.standing_start
    - character.talent.observant.ambush_tokens
  tables:
    - table.talent.physical_pilot
  table_rows:
    - table_id: table.talent.physical_pilot
      row_id: observant
