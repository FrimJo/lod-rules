- id: talent.assassin
  name: Assassin
  section_id: section.appendix_ii_talents.sneaky_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 177
      printed_page: 175
      heading: Assassin
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    With uncanny precision, the hero automatically hits any target from behind with a class
    1 or 2 weapon.
  type: talent
  activation: passive
  category: Sneaky Talents
  rules:
    - character.talent.assassin.automatic_hit
  tables:
    - table.talent.sneaky
  table_rows:
    - table_id: table.talent.sneaky
      row_id: assassin
