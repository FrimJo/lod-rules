- id: talent.disarm
  name: Disarm
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: Disarm
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This is a special attack, using the target's DEX as a negative modifier to the attack.
    If the attack succeeds it inflicts no damage, but causes the enemy to drop their weapon. The
    enemy must spend their next action trying to pick it up. In order to do so, the enemy has to
    succeed with a DEX Test. The enemy will continue until successful. If the hero’s attack fails,
    nothing happens. This can only be used on enemies that are carrying weapons.
  type: talent
  activation: passive
  category: Combat Talents
  rules:
    - character.talent.disarm.eligibility
    - character.talent.disarm.attack_modifier
    - character.talent.disarm.successful_disarm
  tables:
    - table.talent.combat_pilot
  table_rows:
    - table_id: table.talent.combat_pilot
      row_id: disarm
- id: talent.dual_wield
  name: Dual Wield
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: Dual Wield
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: This talent requires a DEX of 60. Any hero with this talent may use a weapon with the
    Dual Wield Special Rule in their offhand. The attacks are still done as usual with the main
    weapon, but any hit will add +X DMG to the target. The X is defined in the Weapon Table.
    Parrying with two weapons is also easier, and any parry while using two weapons has a +5
    modifier.
  type: talent
  activation: passive
  category: Combat Talents
  rules:
    - character.talent.dual_wield.eligibility
    - character.talent.dual_wield.offhand_weapon
    - character.talent.dual_wield.damage
    - character.talent.dual_wield.parry
  tables:
    - table.talent.combat_pilot
  table_rows:
    - table_id: table.talent.combat_pilot
      row_id: dual_wield
- id: talent.fast_reload
  name: Fast Reload
  section_id: section.appendix_ii_talents.combat_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 173
      printed_page: 171
      heading: Fast Reload
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Years of practice makes your hero faster than most and they can reload in the blink of
    an eye. Bows and sling can be reloaded in the same action as shooting once per turn. Crossbows
    can be reloaded in 1 action and fired in the next. An Arbalest can be reloaded in 2 actions, and
    fired in the next turn.
  type: talent
  activation: passive
  category: Combat Talents
  rules:
    - character.talent.fast_reload.bow_sling
    - character.talent.fast_reload.crossbow
    - character.talent.fast_reload.arbalest
  tables:
    - table.talent.combat_pilot
  table_rows:
    - table_id: table.talent.combat_pilot
      row_id: fast_reload
