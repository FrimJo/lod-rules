- id: talent.cartographer
  name: Cartographer
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: Cartographer
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero is skilled at drawing maps. If the hero passes a WIS test before entering a
    dungeon, the exploration deck is set up using 2 cards less than noted in the quest. Remove one
    corridor and one room. No matter how many heroes uses this talent, no more than 2 cards can be
    removed.
  type: talent
  activation: passive
  category: Common Talents
  rules:
    - character.talent.cartographer.exploration_deck
  tables:
    - table.talent.common
  table_rows:
    - table_id: table.talent.common
      row_id: cartographer
- id: talent.charming
  name: Charming
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: Charming
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    This hero seems to get along with everyone and always draws a smile from those to whom
    he talks. Well aware of this, the party lets this hero negotiate all rewards and gains +5%
    Reward Bonus on all quests.
  type: talent
  activation: passive
  category: Common Talents
  rules:
    - character.talent.charming.reward_bonus
  tables:
    - table.talent.common
  table_rows:
    - table_id: table.talent.common
      row_id: charming
- id: talent.disciplined
  name: Disciplined
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: Disciplined
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Thanks to a military background, this hero has an increased degree of calmness under
    pressure. This also spreads to the rest of the party. The hero gains +10 RES and the other
    members of the party gain +5 RES as long as the hero is not knocked out. The effect on the party
    is not cumulative if other heroes have the same talent. Furthermore, a hero with this talent
    will not benefit from the effect of this talent from another hero.
  type: talent
  activation: passive
  category: Common Talents
  rules:
    - character.talent.disciplined.own_resolve
    - character.talent.disciplined.party_resolve
  tables:
    - table.talent.common
  table_rows:
    - table_id: table.talent.common
      row_id: disciplined
