- id: talent.swift_leader
  name: Swift Leader
  section_id: section.appendix_ii_talents.common_talents
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 175
      printed_page: 173
      heading: Swift Leader
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The party may always add one initiative token to the bag. This is only used to increase
    chance of activation and all heroes may still only act once per turn. This is not a cumulative
    effect so only 1 token will be added even if more than one hero has this talent.
  type: talent
  activation: passive
  category: Common Talents
  rules:
    - character.talent.swift_leader.initiative
  tables:
    - table.talent.common
  table_rows:
    - table_id: table.talent.common
      row_id: swift_leader
