  source_text: 'Randomize one quest location on the map using the white numbers to situate the ruins
    of your Keep. Personal Quest: Clear out the Keep. Whether you go there as a part of another
    quest, or if you decide to go there for this sole purpose, you must clear the entire dungeon.
    Every tile must be placed on the table and all enemies must be killed. If you go there
    specifically for this purpose, use the generic Dungeon Generator to create the dungeon. Once the
    dungeon is cleared, you gain 1500 XP.'
