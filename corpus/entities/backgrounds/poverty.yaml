  source_text: 'Personal trait and quest: You know the value of each coin, and may never make a
    purchase, or lend out money, that would leave you with less than 10 c. Furthermore, you must try
    to accumulate 1000 c for your family. Randomise which village (not Silver City) in which you
    were born and raised. If you are a dwarf, randomise between the two Dwarven settlements. Once
    you feel ready to hand over the money to your family, pay them a visit and hand over the money.
    This can be done by spending one Point of Movement in that village, and it will grant you 2000
    XP.'
