  source_text:
    'Personal Quest: Find your lost brother. For this quest, you need to keep track of how
    many dungeons you have entered. At the start of each quest, roll 1d10. On a roll of 1, the
    dungeon you are heading to is the one in which you will find your brother. Place a secondary
    Quest Card in the pile not containing the Quest Room. The tile you enter next will contain your
    brother. Once you enter the room, roll 1d100, adding the number of dungeons you have entered. If
    the result is 60 or higher, you are too late and you find the remains of your dear brother on
    the floor, dead. It seems that he has been dead for some time. Devastated, you must decide if
    you will leave him where he is, or bring him out of the dungeon and bury him. In both cases you
    lose 3 Points of Sanity, but gain 250 XP. If you choose to bury him, you must carry him through
    the dungeon (of course letting go of him when danger approaches). The downside of this is that
    you cannot carry anything else you find (you may not search for treasures, or carry anything
    your comrades find). Once outside, you have a short ceremony and lay him to rest in a nearby
    meadow. You gain +10 RES permanently. If the result is lower than 60, your brother is alive, but
    badly wounded. Place him on the tile and you may move him just like the other heroes. Use the
    civilian Monster Card to represent him. If your brother makes it out alive, he will accompany
    you to the next settlement where you will part ways. You gain 1500 XP once you reach the
    settlement. If he dies during the dungeon crawl, revert to ‘result higher than 60’. If he dies
    in a skirmish, you do not need to carry him further, but the end result is the same.'
