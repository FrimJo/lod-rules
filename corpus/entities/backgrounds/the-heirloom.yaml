  source_text: 'Personal Quest: Find your Great Aunt’s sword. At the start of each quest, roll 1d10.
    On a roll of 1, the dungeon you are heading to is actually the one that holds the sword. Place a
    secondary Quest Card in the first half of the Exploration Card pile. The room after the
    secondary Quest Card will always have enemies. Roll twice on the encounter table. One of the
    enemies with the highest XP will carry the sword (although will not use it in battle). The fate
    of your ancestor will never be known, but at least you will now have a chance to get that sword
    back. The weapon is a silver shortsword that does +1 DMG and has +2 Durability. You may not sell
    it.'
