  source_text:
    'Effect: You were not kicked out without means, and you have managed to retain some of
    the coins your mother secretly handed you before you parted. You start with 400 c instead of the
    normal 150 c. However, being accustomed to having money makes it extra hard when you have none.
    If you ever drop below 150 c, you start questioning if this is really what you should do for a
    living. Your resolve is reduced with -20 until you have enough money again (150 c).'
