  source_text:
    'Personal Quest: Kill an enemy that gives you 450 XP or more. You do not need to strike
    the final blow, as long as your party makes the kill. Once that is done, return to your father
    to claim the armour. Randomise which village (not Silver City) you were born and raised in. If
    you are a dwarf, randomise between the two Dwarven settlements. Gaining the armour can be done
    by simply spending one Point of Movement in that location. This is the Armour of the Father as
    described in the ‘Legendary Items’ chapter.'
