      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The caster reaches into the Void and summons a Lesser Plague Demon. Place the demon in
    a random free square in the room. The demon may act as part of the hero’s next turn. Add one
    hero initiative token to the bag. It fights for the caster, but also tries to break free on
    every turn. At the start of each turn, the caster must use 4 Mana as upkeep, and then pass a
    Resolve Test. If the caster fails, the demon breaks free and escapes back to its own dimension.
