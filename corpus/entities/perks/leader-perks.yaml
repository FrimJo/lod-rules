      pdf_page: 168
      printed_page: 166
      heading: Encouragement
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Your hero’s encouragement strengthens the hearts of their comrades, giving them +10 on
    an upcoming Fear or Terror Test. May be used outside of ordinary acting order whenever a fear or
    terror test is necessary.
