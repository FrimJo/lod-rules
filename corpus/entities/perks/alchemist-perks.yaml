      printed_page: 169
      heading: Connoisseur
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    The alchemist has a knack for identifying potions brewed by others. Grants a +10 bonus
    to the Alchemy roll on your next attempt to identify a potion (only one per Energy Point).
    Energy Point is spent at the same time as you try to identify the potion.
  type: perk
  activation: active
