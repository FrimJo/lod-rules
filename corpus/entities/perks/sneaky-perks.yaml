  section_id: section.appendix_i_perks.sneaky_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 170
      printed_page: 168
      heading: Living on Nothing
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Accustomed to hardship, your hero can sustain themselves on almost nothing. Spending an
    Energy Point to activate this Perk is considered the same as consuming a ration. The Energy
    Point cannot be regained in the same rest in which it was spent.
