- id: perk.clever_fingers
  name: Clever Fingers
  section_id: section.appendix_i_perks.sneaky_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 170
      printed_page: 168
      heading: Clever Fingers
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Relying on experience, the hero’s fingers dance across the mechanism. Add +25 bonus to
    a single pick lock or disarming trap attempt. Use before rolling.
  type: perk
  activation: active
  category: Sneaky Perks
  activation_cost:
    energy: 1
    action_points: 0
  rules:
    - character.perk.clever_fingers.activation
    - character.perk.clever_fingers.bonus
  tables:
    - table.perk.sneaky
  table_rows:
    - table_id: table.perk.sneaky
      row_id: clever_fingers
- id: perk.hide_in_the_shadows
  name: Hide in the Shadows
  section_id: section.appendix_i_perks.sneaky_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 170
      printed_page: 168
      heading: Hide in the Shadows
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Your hero finds that perfect spot to avoid drawing attention. No enemy targets them if
    they are more than 2 squares away when the enemy starts their turn. If your model is adjacent to
    an enemy, that enemy always attacks another adjacent model if there is one. If not, the Perk
    does not work.
  type: perk
  activation: active
  category: Sneaky Perks
  activation_cost:
    energy: 1
    action_points: 0
  rules:
    - character.perk.hide_in_the_shadows.activation
    - character.perk.hide_in_the_shadows.distant
    - character.perk.hide_in_the_shadows.adjacent
  tables:
    - table.perk.sneaky
  table_rows:
    - table_id: table.perk.sneaky
      row_id: hide_in_the_shadows
- id: perk.living_on_nothing
