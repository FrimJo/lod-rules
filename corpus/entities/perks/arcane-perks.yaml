- id: perk.in_tune_with_the_magic
  name: In Tune with the Magic
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: In Tune with the Magic
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Caster may use Focus before trying to identify a Magic Item. However, when attuning to
    the magic in that way, their mind is open enough to risk their sanity. Works just as if casting
    a spell but introduces miscast to the roll as well. 1 Action of Focus causes a miscast on 95-00.
    Increase the risk by 5 for each additional action.
  type: perk
  activation: active
  category: Arcane Perks
  activation_cost:
    energy: 1
    action_points: 0
  rules:
    - character.perk.in_tune_with_the_magic.activation
    - character.perk.in_tune_with_the_magic.identification_focus
  tables:
    - table.perk.arcane
  table_rows:
    - table_id: table.perk.arcane
      row_id: in_tune_with_the_magic
- id: perk.quick_focus
  name: Quick Focus
  section_id: section.appendix_i_perks.arcane_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 171
      printed_page: 169
      heading: Quick Focus
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The wizard has the ability of extreme Focus, increasing the chance to succeed on a
    spell. Add +10 Arcane Arts Skill without spending an action on focus. Risk for a miscast is
    still increased by 5. Used at the same time as casting a spell. Only lasts for that spell.
  type: perk
  activation: active
  category: Arcane Perks
  activation_cost:
    energy: 1
    action_points: 0
  rules:
    - character.perk.quick_focus.activation
    - character.perk.quick_focus.spell
  tables:
    - table.perk.arcane
  table_rows:
    - table_id: table.perk.arcane
      row_id: quick_focus
