- id: perk.stunning_strike
  name: Stunning Strike
  section_id: section.appendix_i_perks.combat_perks
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: Stunning Strike
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text:
    Your hero may choose to stun the enemy instead of inflicting wounds. Your hero performs
    a Standard Attack with a -10 CS penalty and if the attack is successful, the enemy may perform
    NO actions during its next turn. Only melee weapons. Does not work on X-Large creatures and
    Large creatures only lose 1 AP.
  type: perk
  activation: active
  category: Combat Perks
  activation_cost:
    energy: 1
    action_points: 0
  rules:
