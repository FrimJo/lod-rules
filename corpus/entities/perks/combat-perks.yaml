      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 169
      printed_page: 167
      heading: Shield Bash
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Push one enemy of the same size or smaller one square using CS. Target must make a
    Dexterity Test or fall over, spending its next action to stand again. Hero may occupy target’s
    square afterwards. Flyers are immune. Requires a Heater or Tower shield.
