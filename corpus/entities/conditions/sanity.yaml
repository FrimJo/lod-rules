- id: condition.jumpy
  name: Jumpy
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Every unsuspecting noise makes the hero jump and scream, startling the companions
    and alerting all dungeon dwellers to their presence. A Scenario roll of 10 means something
    has spooked the hero and the scream causes the Threat Level to increase by 2.
  type: condition
  rules:
    - character.condition.jumpy
  tables:
    - table.psychology.mental_conditions
- id: condition.irrational_fear
  name: Irrational Fear
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero becomes irrationally afraid of a specific type of monster. Randomize
    between Orcs and Goblins, Beasts, Undead, Reptiles, or Dark Elves. All monsters from that
    faction will now cause fear to the hero.
  type: condition
  rules:
    - character.condition.irrational_fear
  tables:
    - table.psychology.mental_conditions
- id: condition.claustrophobia
