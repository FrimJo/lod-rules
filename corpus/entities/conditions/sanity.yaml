- id: condition.hate
  name: Hate
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The hero gains the Hate Talent against the type of enemy last fought. This creature
    must appear in the Monster List of the Bestiary.
  type: condition
  rules:
    - character.condition.hate
  tables:
    - table.psychology.mental_conditions
- id: condition.acute_stress
  name: Acute Stress
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: RES reduced by 10 for the rest of the quest. The hero will scream uncontrollably
    during all battles, alerting every single soul in the dungeon. Threat Level is increased by
    an additional +1 for each battle from now until the end of the quest. This only lasts for
    the current quest.
  type: condition
  rules:
    - character.condition.acute_stress
  tables:
    - table.psychology.mental_conditions
- id: condition.lingering_trauma
  name: Lingering Trauma
  section_id: section.psychology.table
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      printed_page: 55
      pdf_page: 57
      heading: Psychology table
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: The effect of this condition will not be evident until your next dungeon and only
    during a specific situation that in some way resembles or reminds the character of the
    situation that triggered the syndrome. See separate table below. Once the trauma kicks in,
    all Resolve Tests are at -10 and CS is at -10. Once triggered, it will last until you leave
    the dungeon.
  type: condition
  rules:
    - character.condition.lingering_trauma
    - character.condition.trauma_expiry
  tables:
    - table.psychology.mental_conditions
