  source_text: >-
    The Thief prefers to work in the shadows, avoiding all attention if possible. The use of arms is
    not alien to them, but it is seen as a last resort. Better to take what you want undetected, and
    thereby minimise the risk of getting injured while doing it. As a consequence, daggers are their
    preferred weapons. Lock picks and crowbars are the tools of the trade.

    Talents

    Evaluate (page 175).

    Perks

    Heroic Force of Will (page 168).

    Starting Equipment

    Small backpack, Dagger, Rope, 10 x Lock Picks.

    Limitations

    A Thief may never use armour heavier than Tier 3 or weapons heavier than Class 2.

    Special

    Whenever it is time to draw a Treasure Card, a thief may always draw two cards and choose which
    one to keep. If the card drawn indicates that you should draw a new Treasure Card from a higher
    tier of treasures, the Thief may only draw one card from that pile.
