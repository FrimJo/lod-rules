  source_text: >-
    The Alchemist has spent years studying the properties of materials and solutions, learning the
    effect they have on each other and on the human body. Through both study and experience, they
    have learned how to mix ingredients to obtain beneficial effects that have become highly sought
    after. Their ability to create powerful concoctions have made them popular amongst adventurers.
    Many alchemists can hold their ground pretty well, spreading fire and destruction all around
    them.

    Talents

    Resistance to Poison (page 170).

    Perks

    Heroic Force of Will (page 168).

    Starting Equipment

    Small backpack, Alchemist tools, Alchemist belt, Shortsword, 3 potions of choice (standard
    level), a bag with 3 random ingredients and 3 freely chosen parts. 1 freely chosen recipe for a
    Weak Potion. See Alchemy chapter for details on how to make a recipe (page 74).

    Limitations

    Alchemists may never use armour heavier than Tier 3.
