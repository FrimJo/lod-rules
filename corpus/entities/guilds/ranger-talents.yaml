- id: talent.taxidermist
  name: Taxidermist
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Taxidermist (350 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Whenever the party kills a ‘Large’ creature, the ranger may make a Foraging roll. If successful, the Ranger has managed to secure a trophy that can be taken back to a settlement and be sold. The Trophy weighs 15 ENC and only one trophy can be taken during each quest as prepping it for sale takes quite some time.
  type: talent
  activation: passive
  category: Ranger special talent
  rules:
    - character.settlement.guild.rangers.taxidermist
    - character.settlement.guild.rangers.trophy_sale
    - character.settlement.guild.rangers.talents
  tables:
    - table.guild.taxidermy_sale
