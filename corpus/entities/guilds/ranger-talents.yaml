- id: talent.skinning
  name: Skinning
  section_id: section.rangers_guild
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 156
      printed_page: 154
      heading: Skinning (250 c)
      extraction:
        method: image
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: If you manage to catch an animal, and have a skinning knife, you may make another Foraging Skill roll. A success on that roll will give you a fur to sell. Each fur weighs 2 ENC. A fur can be sold at the General Store for 40 c (no need to use the sell table).
  type: talent
  activation: passive
  category: Ranger special talent
  rules:
    - character.settlement.guild.rangers.skinning
    - character.settlement.guild.rangers.talents
  tables: []
