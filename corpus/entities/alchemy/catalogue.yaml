- id: equipment.alchemy.alchemical_dust
  name: Alchemical Dust
  section_id: section.alchemy.preparations.alchemical_dust
  source:
    - document: rulebook.second_printing.eng
      file: source/Rulebook-2nd-printing-ENGa.pdf
      pdf_page: 79
      printed_page: 77
      heading: Alchemical Dust
      extraction:
        method: text
        confidence: high
        visually_verified: true
  status: extracted
  confidence: high
  source_text: Not actually a potion at all, but rather more like a fine sand, this can be used to highlight traces of activity from others. A handful is enough to cover a room. By simply blowing this into the air, it adheres to places of activity and shines faintly. If you use this before rolling to search a room or corridor, you are allowed to reroll and choose the best result. It is enough for one use.
  type: equipment
  category: alchemy
  rules:
    - character.alchemy.preparation.alchemical_dust
  tables:
    - table.alchemy.standard
  table_rows:
    - table_id: table.alchemy.standard
      row_id: row_22
