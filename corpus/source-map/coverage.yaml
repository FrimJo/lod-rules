  - id: section.game_basics.gameplay_example
    status: reviewed
    components:
      glossary: not_applicable
      rules: not_applicable
      tables: not_applicable
      examples: extracted
      procedures: not_applicable
      entities: not_applicable
    notes: 'Rendered PDF 22–24 (printed 20–22). One worked example over three turns; it
      adds no rule of its own. Fixtures in tests/examples/core/gameplay-example.yaml.
      Turn 1: test.gameplay_example.turn_1_scenario_die (2 is below the 9–10 trigger),
      .chest_open_roll (d10 3 is Open on the Door Table, d6 6 is trapped), .azira_perception
      (56 against 45 fails), .azira_trap_damage (3 damage, no Natural Armour, 9 to 6 Hit
      Points), .trap_party_morale (12 to 11), .chest_furniture_roll (Chest 1 is 1 Wonderful
      Treasure). Turn 2: .door_opened_locked (Threat 9 to 10, d6 2 not trapped, Door Table 8
      is Locked), .belleck_bashes_door (15 − 9 = 6 HP, Threat 12), .grol_breaks_door (6 − 6
      = 0, door removed, Threat 14), .room_encounter (34 is within the room chance of 50),
      .spider_initiative (3 spider tokens after a bashed door). Turn 3:
      .threat_roll_in_battle (10 against 14, in battle, −3 to 11), .power_attack_threshold
      (46 + 20 − 5 = 61, so 53 hits), .spider_damage (7 − 1 = 6). Not fixtures, with reasons:
      the Door Table Difficulty cell "Pick lock: -10, HP 15" is one printed text column
      (with a "-" marker on Open rows), which the executable lookup cannot return, so the
      door''s 15 HP is supplied to .belleck_bashes_door from that row; the Trap Table roll
      (1, small spike trap, 1d4) has no table in this book (issue.gameplay_example.trap_table);
      the Sanity loss of 1 for the trap (issue.gameplay_example.trap_sanity, resolved by
      changelog 2.21 entry 22: 2); the Legendary Items rolls (1d6 3 "left column", 1d12 4,
      Gauntlets of Hraefnir; issue.gameplay_example.legendary_roll); the Wandering Monster
      token, placed at the quest''s own Threat 12 trigger and moving 4 squares with no
      direction roll printed; the spider''s random 2d6 placement and random choice of target;
      steps that need the not_present Bestiary profile (the spider''s Combat Skill and the
      bite of 72, its charge, its Hit Points left after 6 damage, fear at level 5 or less,
      Frenzy); the Fear Tests, whose Resolve values are not printed and whose torch +5
      follows a Threat Roll that spends the torch (issue.gameplay_example.torch_after_threat_roll).
      Other conflicts with the rules: issue.gameplay_example.chest_threat (no +1 Threat for
      the chest), .threat_table_result (a 5 is Healing, not Frenzy) and .spider_turn (resolved
      by changelog 2.21 entry 27). The example applies no Party Morale or Sanity change for
      the Wonderful Treasure or for Grol''s failed Fear Test and prints no resulting values.'
