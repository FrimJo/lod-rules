      entities: extracted
    notes: 'Phase 4 evidence: character.condition.trauma_expiry,
      character.condition.arachnophobia_other_encounters,
      character.condition.hate, character.condition.acute_stress,
      character.condition.lingering_trauma,
      character.condition.fear_of_the_dark, character.condition.arachnophobia,
      character.condition.jumpy, character.condition.irrational_fear,
      character.condition.claustrophobia, character.condition.depression,
      character.condition.depression_floor, table.psychology.mental_conditions,
      condition.hate, condition.acute_stress, condition.lingering_trauma,
      condition.fear_of_the_dark, condition.arachnophobia, condition.jumpy,
      condition.irrational_fear, condition.claustrophobia, condition.depression.
      Scoped extraction; other material under this heading remains unextracted.
      See docs/phase-4-core-mechanics.md. Phase 6 Batch 7:
      procedure.acute_stress reconciles only the rendered Acute Stress row:
      current-quest initialization, actual distinct-battle Threat and
      source-resolved expiry. The full table procedure component remains mapped
      because the other condition lifecycles are pending. Expiry does not infer
      diagnosis removal or Sanity/count changes; issue.0004 and
      issue.phase4.sanity_boundaries remain unresolved. Acute Stress
      diagnosis/count/history at effect expiry is recorded separately in
      issue.sanity.acute_stress_diagnosis_expiry. Phase 6 Batch 7:
      procedure.lingering_trauma reconciles only row 4 selection handoff, actual
      owned next-dungeon trigger, active modifier persistence and actual
      departure. Full table procedures remain mapped while other condition
      lifecycles are pending; issue.sanity.trauma_scope retains
      reminder/later-recurrence/diagnosis-accounting boundaries. Phase 6 Batch
      7: procedure.jumpy reconciles row 7 actual Scenario results and
      qualitative unsuspecting-noise behavior with per-occurrence replay
      markers. The +2 applies once only to an actual 10 in resolved one-hero
      context; arbitrary noises add no invented numeric Threat.
      issue.sanity.jumpy_threat_order retains
      ordinary-roll/quest-maximum/multiple-hero boundaries. The whole table
      procedure component remains mapped while other conditions are pending.
      Phase 6 Batch 7: procedure.depression reconciles the printed 0 row actual
      accepted onset-capacity snapshot and once-only -2 reduction, preserving
      the below-two onset boundary and current available Energy.
      issue.sanity.depression_capacity_context records changed
      capacity/overflow/treatment accounting questions; no automatic cure or
      blind restoration is inferred. The full table procedure component remains
      mapped while other condition rows are pending. Phase 6 Batch 7:
      procedure.fear_of_the_dark preserves all Resolve Tests -10 without a
      darkness-only restriction, and procedure.claustrophobia recomputes only
      its owned all-skills/stats corridor contribution in actual supplied
      locations. Re-evaluation/condition removal clears only the own
      contribution, not total stats or another condition. Missing location
      remains explicit input; issue.sanity.claustrophobia_stat_scope retains
      concrete individual target/pool/bounds questions. The full table procedure
      component remains mapped with Hate, Arachnophobia and Irrational Fear
      lifecycles pending. Phase 6 Batch 7: procedure.arachnophobia reconciles
      actual known-spider source Terror, unsupplied taxonomy and the retained
      ambiguous non-spider scope. procedure.irrational_fear persists one
      supplied actual five-faction selection and classifies every actual monster
      occurrence from supplied membership, without per-monster rerolls or extra
      reaction tests. Dedicated owned outputs preserve natural/scenario
      Fear/Terror. Reaction handoffs are separate and unresolved combined
      contexts retained. The whole table procedure component remains mapped with
      Hate still pending. Hate diagnosis onset target and external Monster List
      eligibility plus dedicated Talent check contributions now have bounded
      lifecycle evidence. All nine distinct conditions are represented;
      remaining scope and treatment reconciliation and independent review are
      pending. Mental-table procedure component now source-reconciled across all
      nine distinct conditions and the complete trigger table.
      Current-contribution cure cleanup is represented; lasting
      Talent/capacity/duration effects, encounter scope, selection and stat
      boundaries have explicit review dispositions rather than invented
      resolution. This is bounded extraction, not independent review or complete
      Package F.'
