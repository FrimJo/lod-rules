    notes: 'Rendered PDF 141-142 (run-in headings Participating, Calculating the Chance of Victory, Betting, Odds, and Winning, and Losing). Rules: character.settlement.arena_entry (any hero, a complete day, fee 50 c to 200 c paid once for all three levels, group then optional semi-final then final, one CS roll per level with the stat and level modifiers) and character.settlement.arena_results (fee times the level modifier (RDD) after each won level; the procedure sums the payouts of every won level and keeps them after a later loss, the reading applied pending issue.settlement.arena_winnings_accumulation; extra award after winning the final, 50/100/150 XP to the hero, not the party; a loss costs 2/4/6 HP and 2 Sanity). Procedures: procedure.arena_fighting (1 Activity Point from Available Actions; derived cases test.procedure.arena_fighting.wins_all_three, declines_semi_final, loses_group, loses_final and cannot_pay; tests/tables/settlement-activity-multipliers.test.ts checks every printed multiplier). Tables: the five tables are the child nodes section.settlements.arena_fighting.table (table.settlement.arena_modifiers, Hero Hit Points), .table_2 (table.settlement.arena_strength_modifiers, Hero STR), .table_3 (table.settlement.arena_level_modifiers, Level), section.settlements.table_3 (table.settlement.arena_odds) and section.settlements.table_4 (table.settlement.arena_awards); .table_4 and .table_5 are compatibility redirects. The Final/Semi-final/Group 1-4 bracket on PDF 141 is a diagram of the three levels and adds no rule. Glossary: the page defines no headword. No printed example. Entities: none; the arena is a service location. Open: issue.settlement.arena_hit_points_basis and issue.settlement.arena_winnings_accumulation.'
