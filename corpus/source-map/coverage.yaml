    notes: 'Rendered PDF 222 (printed 220). Reading the Quests prints the border-line reading limits, aftermath findings looted ‘off table’ with no traps or locks, and general repeatability; its smaller subheading Triggering Wandering Monsters prints the increase-to-XX rule and an "Ex:" paragraph. Rules: core.quest_book.reading_boundaries, core.quest_book.aftermath_looting, core.quest_book.individual_repeatability, core.quest_book.threat_threshold_monster and core.quest_book.threat_threshold_monster_otherwise. Examples: the "Ex:" paragraph is executable and is covered by test.quest_book.threat_increase, test.quest_book.threat_decrease and test.quest_book.threat_increase_again. Procedures: procedure.quest_reading_and_events orders the reading permissions, aftermath findings and Threat-threshold checks. Glossary: no term is defined (Threat Level and Wandering Monster are defined elsewhere). Tables, entities: none printed. The page does not explain the quest headings (Quest Location, Special Rules, Number of Tiles, Reward, Encounters, Objective Room, Threat table); the book prints no such key.'
