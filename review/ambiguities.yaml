- id: issue.0004
  type: conflicting
  summary: End of the Quest says “This is the moment when you get your reward for a finished quest.”
    Until end of (next) quest says “the modifier will last until the heroes return to the city after
    a quest, but before beginning any activities in the city.” Reward receipt and return before city
    activities are not explicitly equated. Preserve both scopes without choosing an endpoint.
    Collect Your Reward says the party first receives a promised reward after a finished quest, only
    in the settlement where it accepted that quest. This narrows the conflict for ordinary returns
    but leaves the endpoint unclear when no reward was promised or the heroes return elsewhere.
