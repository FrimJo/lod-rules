- id: issue.0001
  type: ambiguity
  summary: 'Battle is explicitly temporal: “Starts when the enemy is spotted until the last enemy in
    that encounter is killed.” Combat is “A general term for fighting, not to be confused with
    battle”. Keep separate ids; these definitions do not specify the battle endpoint if enemies
    escape or an encounter ends without killing them. End of Battle corroborates resuming the turn
    once all enemies are dead. The remaining question is when battle-duration effects end if an
