- id: issue.0010
  type: ambiguity
  summary:
    The +1 skill and basic-stat rewards are each limited to once between settlement visits. The
    passage does not explicitly state whether the allowance is shared across all skills/stats or
    tracked separately per skill/stat, or define their combined allowance. The pilot can test a
    first reward and repeated use of the same allowance; cross-attribute allocation stays
    unresolved. It does not infer resetting at another quest endpoint. This uncertainty applies only
    to advancement rewards. The energy option has no printed between-settlement allowance and
    remains available when one lost energy can be restored. quota_scope_uncertain is supplied review
    context, not a printed game mechanic.
