- id: issue.0004
  type: conflicting
  summary: End of the Quest says “This is the moment when you get your reward for
    a finished quest. If an effect lasts ‘until the end of the quest’, it will
    last until you get your next reward.” Until end of (next) quest says “This
    term indicates that the modifier will last until the heroes return to the
    city after a quest, but before beginning any activities in the city.” The
    two headwords use different phrases (‘until the end of the quest’ and
    ‘Until end of (next) quest’). Reward receipt and return before city activities
    are not explicitly equated. Preserve both scopes without choosing an
    endpoint. Collect Your Reward says the party first receives a promised
