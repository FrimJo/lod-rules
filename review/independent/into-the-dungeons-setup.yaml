      section_id: section.into_the_dungeons.table
      object_id: table.dungeon.threat_not_in_battle
      description: Row 13-15 "Add one extra Exploration Card on top of each pile on the table." does not say where the cards come from, whether they are room or corridor cards, whether B cards or the Objective room Card may be used, or which piles count once routes are exhausted or redistributed. The coverage note calls this row table text, and no issue recorded the gap.
