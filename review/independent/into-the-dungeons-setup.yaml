      section_id: section.into_the_dungeons.table
      object_id: table.dungeon.threat_not_in_battle
      description: 'Cell-by-cell check against rendered PDF 91: header 1d20 / Result / Threat decrease; rows 1-12 A Wandering Monster has appeared. -5; 13-15 Add one extra Exploration Card on top of each pile on the table. -5; 16-17 The risk of encounters goes up by 10 in all rooms and corridors for the rest of the quest. This is cumulative, but max is 70%. -6; 18-19 A hero has sprung a trap! -7; 20 Add +1 on all Scenario die roll for the remainder of the dungeon. This can only happen once. -10. Every range, text cell and decrease matches, including the printed "roll" singular. The roll domain 1-20 is complete, there are no footnotes, and shading is decorative banding only.'
      source:
