      description: 'The procedure-level source_text ("Compose existing accepted occurrence and actual initial departure with actual dungeon entry. Abandonment records the actual layout ...") and every step source_text (first_entry, request_layout, abandon, return_begin, request_repopulation, resume, accomplished, exit, e.g. "Actual active-visit abandonment requests saving its layout once; no abandonment completion without the recorded actual layout.") are curator paraphrase, not printed text, yet each cites PDF 88 heading "Abandoning your Quest; Finishing your Quest". PDF 88 prints only: "If you must abandon your quest, note down the layout so that you can come back and finish what you have started. Just remember that the dungeon will be repopulated when you return, and that you must check for locked doors and encounters once again." and "Once you have accomplished what you were tasked to do, you may leave the dungeon. There is no need to trace your way back to the entrance." Step first_entry (initial departure plus first dungeon entry) is not printed on PDF 88 at all, so its citation is also wrong.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 88
          printed_page: 86
          heading: Abandoning your Quest; Finishing your Quest
      disposition:
        status: open
        proposed_correction: 'Replace the procedure source_text with the two printed paragraphs quoted above. Replace each step source_text with the printed sentence it executes: request_layout and abandon get "If you must abandon your quest, note down the layout so that you can come back and finish what you have started."; return_begin, request_repopulation and resume get "Just remember that the dungeon will be repopulated when you return, and that you must check for locked doors and encounters once again."; accomplished and exit get the Finishing your Quest sentences. Re-cite first_entry to the pages that print departure and entry (Leaving on a Quest, PDF 133, and Initial Setup, PDF 88) with their printed wording, or drop the PDF 88 Abandoning/Finishing citation from it. Move the bookkeeping explanations into notes or field descriptions.'
    - kind: transcription_error
      section_id: section.into_the_dungeons.generating_the_dungeon
      object_id: state_machine.quest_dungeon
      description: The top-level source_text ("Structural source lifecycle of one accepted dungeon quest occurrence. Initial acceptance/departure are existing owned procedures. ...") is a curator summary, not printed text, and it cites PDF 88 among its sources. The transitions out of active, abandoned and accomplished quote PDF 88 verbatim (checked). The offered and accepted transitions ("Actual party accepts this source offer.", "Actual early-morning quest departure followed by actual dungeon entry.") are paraphrases too, but they cite PDF 132 and 133, which are outside this unit and were not inspected.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 88
          printed_page: 86
          heading: Abandoning your Quest; Finishing your Quest
      disposition:
        status: open
        proposed_correction: Set the state machine source_text to the printed Abandoning your Quest and Finishing your Quest paragraphs on PDF 88, and move the structural summary into a notes field. When the Embarking/Quests unit is reviewed, check the offered and accepted transition quotations against PDF 132-133.
    - kind: modelling_error
      section_id: section.into_the_dungeons.wandering_monsters
      object_id: procedure.wandering_monster
      description: PDF 92 prints "A magically sealed door or Iron Wedged door will stop the token for that turn, and it must roll 5-6 to continue through the door next turn, instead of the normal 2-6. The seal is then broken, and the token may pass through." The subject of "The seal is then broken" is both door kinds. Step break_seal fires only when door_state is magically_sealed, so a token that passes an Iron Wedged door on 5-6 never records seal_broken. door_passes does handle both kinds and sets door_state open, so only the seal_broken output is affected.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 92
          printed_page: 90
          heading: Wandering Monsters
      disposition:
        status: open
        proposed_correction: Widen the door_state condition of step break_seal to magically_sealed or iron_wedged, as the door_passes step already does. Alternatively keep it and add a note saying why the Iron Wedged case is read as having no seal. Add a derived fixture for an Iron Wedged door passed on a 5.
    - kind: source_reference_error
      section_id: section.into_the_dungeons.disarming_a_trap
      object_id: test.phase6.trap.disarm_fails
      description: 'procedure.trap_resolution step disarm is gated on has_disarm_tool, following changelog 2.21 entry 121 (rendered changelog page 19: "Lock pick or trap disarm kit needed.", Fixed), and the step cites both PDF 92 and the changelog row. The fixture test.phase6.trap.disarm_fails runs that ruled step with has_disarm_tool true but cites only PDF 92, Disarming a Trap. The extraction guide (Official rulings) requires each changed rule, procedure step or fixture to cite both the rulebook page and the ruling.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 92
          printed_page: 90
          heading: Disarming a Trap
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 19
          printed_page: null
          heading: '2.21'
          locator:
            row: 121
      disposition:
        status: open
        proposed_correction: Add the changelog citation (document vonbraus.changelog_2_2x, pdf_page 19, heading 2.21, locator row 121) to test.phase6.trap.disarm_fails. Optionally add a derived fixture showing that has_disarm_tool false skips the disarm step.
