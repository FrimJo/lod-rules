  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:fddc6a365d6efff764b705e2b0f47453179d2b7f7aa92cb0cc0ad38bba188a40
  findings:
    - kind: transcription_error
      section_id: section.into_the_dungeons.generating_the_dungeon
      object_id: procedure.quest_dungeon_lifecycle
      description: 'Re-review of review.into_the_dungeons_setup.1 finding 1, verified on rendered PDF 88 and PDF 133. The procedure source_text is now the two printed paragraphs of Abandoning your Quest and Finishing your Quest joined by "...", verbatim. Steps request_layout and abandon quote "If you must abandon your quest, note down the layout so that you can come back and finish what you have started."; return_begin, request_repopulation and resume quote "Just remember that the dungeon will be repopulated when you return, and that you must check for locked doors and encounters once again."; accomplished quotes the first Finishing sentence and exit both, all verbatim. first_entry now cites Leaving on a Quest (PDF 133, printed 131) and Initial Setup (PDF 88) and quotes "Therefore, leaving on a quest is always done early in the morning. No other settlement activities are allowed on that day. ... Place the starting tile as the first tile. ...", which matches both pages. The structural reading moved to unresolved_references with the label "Structural reading, not printed text". Note: that field is meant for unbound pointer wording, so a consumer reading unresolved_references will see the curator summary there; it is labelled, so this is acceptable but not ideal.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 88
          printed_page: 86
          heading: 'Abandoning your Quest; Finishing your Quest'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: 'Leaving on a Quest'
      disposition:
        status: corrected
        change: 'Procedure and step source_text replaced with the printed PDF 88 sentences; first_entry re-cited to PDF 133 and PDF 88 with printed wording; structural reading moved to unresolved_references.'

    - kind: transcription_error
      section_id: section.into_the_dungeons.generating_the_dungeon
      object_id: state_machine.quest_dungeon
      description: 'Re-review of finding 2, verified on rendered PDF 88. The top-level source_text is now the printed Abandoning your Quest and Finishing your Quest paragraphs, verbatim; the active, abandoned and accomplished transitions still quote PDF 88 verbatim. The structural summary moved to unresolved_references, and a second entry states that the offered and accepted transition wording (PDF 132, 133) is an unverified curator paraphrase. Checking those two quotations stays with the Embarking/Quests unit, as record .1 proposed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 88
          printed_page: 86
          heading: 'Abandoning your Quest; Finishing your Quest'
      disposition:
        status: corrected
        change: 'Top-level source_text replaced with the printed PDF 88 paragraphs; structural summary and the PDF 132-133 paraphrase caveat moved to unresolved_references.'

    - kind: modelling_error
      section_id: section.into_the_dungeons.wandering_monsters
      object_id: procedure.wandering_monster
      description: 'Re-review of finding 3, verified on rendered PDF 92 ("A magically sealed door or Iron Wedged door will stop the token for that turn, and it must roll 5-6 to continue through the door next turn, instead of the normal 2-6. The seal is then broken, and the token may pass through."). Step break_seal now requires door_state magically_sealed or iron_wedged, door_held_previous_turn true and door_roll 5 or more, and quotes the whole sentence verbatim. New derived fixture test.phase6.wandering.iron_wedged_door_seal_broken (iron_wedged, held, roll 5) expects seal_broken true, door_state open, waiting_at_door false and steps closed_door, break_seal, door_passes; tests/rules/phase-six-batch-two.test.ts passes. The coverage note names the new fixture.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 92
          printed_page: 90
          heading: 'Wandering Monsters'
      disposition:
        status: corrected
        change: 'Step break_seal widened to door_state magically_sealed or iron_wedged and quotes the whole sentence; fixture test.phase6.wandering.iron_wedged_door_seal_broken added.'

    - kind: source_reference_error
      section_id: section.into_the_dungeons.disarming_a_trap
      object_id: test.phase6.trap.disarm_fails
      description: 'Re-review of finding 4, verified on rendered PDF 92 and changelog page 19 (entry 121, answer "Lock pick or trap disarm kit needed.", Fixed). The fixture now cites both the Disarming a Trap page and changelog 2.21 row 121. New derived fixture test.phase6.trap.disarm_needs_tool (has_disarm_tool false, disarm_attempted true, trap detected) cites both as well and expects no disarm step, trap_triggered and trap_removed false and steps special_cases and opening_eligibility only, which is what procedure.trap_resolution does with the step gated on has_disarm_tool. The printed "No Lock Picks are needed." stays quoted in the procedure.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 92
          printed_page: 90
          heading: 'Disarming a Trap'
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 19
          printed_page: null
          heading: '2.21'
          locator:
            row: 121
      disposition:
        status: corrected
        change: 'Changelog 2.21 row 121 citation added to test.phase6.trap.disarm_fails; derived fixture test.phase6.trap.disarm_needs_tool added.'

    - kind: ok_with_note
      section_id: section.into_the_dungeons.the_threat_level
      object_id: core.threat.increase.door_chest_or_cobweb
      description: 'Checked the ruling the corrector applied to issue.phase6.door_open_threat_source against rendered changelog page 24: entry 155 reads "Page 88 Changed wording to: The instant a door or chest is checked, or a cobweb opening is cleared. (As we agreed that a door (or chest for that matter) can be left unlocked but still closed, wording needs changing not to interfere with Threat.)", marked Fixed. It states the corrected text, so it applies under the Official rulings policy. The issue is resolved citing row 155; the rule keeps the printed "opened" source_text, adds the changelog source, and its door_or_chest_opened description reads the trigger as the single +1 of step 1 of Opening a Door or Chest (rendered PDF 101: "1. Increase the Threat Level by 1."). Effects are unchanged, which fits. Minor: the the_threat_level coverage note still lists the issue in parentheses after the rule without saying it is resolved by changelog 155.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: 'Increasing Threat Level'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: 'Opening a Door or Chest'
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 155
      disposition:
        status: no_change_needed

    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.the_turn
      object_id: core.turn.hero_order
      description: 'Changelog 2.21 entries 152-154 (rendered changelog page 24, all Fixed) cite "Page 88 The Turn", the printed folio of PDF 89: 152 changes "all models on the table will move" to "will act", 153 removes "as long as there are no enemies on the table", 154 changes the opening of the enemies-placed sentence to "As soon as". No corpus object cites them and review/designer-published-rulings.md does not list them. core.turn.hero_order, which quotes PDF 89 verbatim, still requires enemies_present false. Entry 153 is a stated change of text, like entry 155 which was applied, but whether it changes the hero-order mechanic once enemies are on the table (Initiative) or is editorial is not clear, so it is recorded as an issue rather than an open correction. The printed wording of term.turn, core.turn.hero_order and core.turn.enemies_placed matches PDF 89.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: 'The Turn'
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 152-154
      disposition:
        status: recorded_as_issue
        issue_id: issue.turn.changelog_turn_wording

    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.table_2
      object_id: table.dungeon.threat_in_battle
      description: 'Row 7 (Disarmed!) on rendered PDF 91 prints "If they fail, they will have no weapon and cannot fight." Changelog 2.21 entry 156 (rendered changelog page 24, Fixed) removes "can not fight" because of Unarmed Combat, and this PDF already prints Unarmed Combat on PDF 113 ("A character without a weapon may attack with fist and kicks. An unarmed attack causes 1d4 DMG."). The table cell is a correct transcription, but neither the internal conflict nor the ruling was recorded.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 91
          printed_page: 89
          heading: 'If the party is in battle:'
          locator:
            row: '7'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: 'Unarmed Combat'
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 156
      disposition:
        status: recorded_as_issue
        issue_id: issue.threat.changelog_disarmed_cannot_fight

