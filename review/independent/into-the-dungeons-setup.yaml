    - kind: ok_with_note
      section_id: section.into_the_dungeons.the_threat_level
      object_id: core.threat.increase.force_open_crowbar
      description: 'core.threat.starting_level, new_level_reset, floor, max_level and all five increase rules quote PDF 89 verbatim, under the printed run-in headings Decreasing, Max and Increasing Threat Level. The amounts (+1 for a won battle, an opened door or chest or cleared cobweb, or a roll above the level; +2 for forcing, or +1 with a crowbar), the floor of 2 or the quest minimum, and the trigger on equality with the max all match. battle_won cites term.battle, not combat. Open readings are recorded in issue.threat.new_level_reset_value, max_level_semantics, battle_won_scope and phase6.door_open_threat_source. Minor note: the increases carry duration until_dungeon_exit, which the page does not state. They are persistent state changes, so this is harmless but not printed.'
