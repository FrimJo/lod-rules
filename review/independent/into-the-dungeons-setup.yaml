      description: The source_text matches PDF 89 verbatim ("... On a roll of 9 or 0, a Threat Level roll must be done. Some quests may change this level ..."). The trigger at threat_trigger or higher, default 9 with the 0 face recorded as 10, matches the chart branch "9-10" on PDF 90. Handling the table result 20 (+1 on all Scenario die rolls) as a trigger one lower gives the same outcomes on a d10 and is stated openly. A repeated 20 is covered by issue.threat.once_only_repeat.
