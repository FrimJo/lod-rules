    - kind: ok_with_note
      section_id: section.into_the_dungeons.the_threat_level
      object_id: procedure.threat_roll
      description: 'Verbatim check of the roll, natural_twenty, triggered, not_in_battle, in_battle, decrease and missed source_text against PDF 89 and 91: all match. The procedure-level quotation elides the Decreasing, Max and Increasing passages with "...", which is acceptable. The branches match the Start of Turn sequence chart on PDF 90: 1d20; at or below the Threat Level, roll on the table for battle or not, then apply the decrease; above it, 20 gives -5 and anything else +1. The text-versus-chart divergence at Threat 20 or more is recorded in issue.threat.natural_twenty_high_level. The fixtures test.phase6.threat_roll.example (9, roll 7, table 16, -6 to 3) and test.phase6.threat_roll.missed (above 9 to 10) quote the printed example on PDF 89-90 verbatim.'
      source:
