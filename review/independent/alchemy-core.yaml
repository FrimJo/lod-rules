  findings:
    - kind: transcription_error
      section_id: section.alchemy.table
      object_id: table.alchemy.habitats
      description:
        'Re-review of the open finding from review.alchemy_core.1. I re-rendered PDF 73, cropped
        and enlarged the Ingredients Table to 2x and sampled the background colour of all 120
        habitat cells (green cells render as approximately RGB 226/239/218, yellow as 255/242/204,
        N/A as 128/128/128), then checked the result by eye. The green cells are: Arching
        Pokeroot—Highland; Ashen Ginger—Woods and Highland; Barbed Wormwood—Site;
        Bitterweed—Roadside and Plains; Blue Coneflower—Roadside; Bright Gallberry—Highland;
        Dragon Stalk—Roadside; Ember bark—Woods; Salty Wyrmwood—Water; Spicy Windroot—Woods and
        Highland; Giant Raspberry—Roadside and Plains; Lunarberry—Plains; Monk’s Laurel—Woods and
        Water; Mountain Barberry—Highland; Nightshade—Site; Snakeberry—Water and Site; Sweet
        Ivy—Roadside and Plains; Toxic Hogweed—Water and Site; Wintercress—Water and Highland;
        Weeping Clover—Roadside and Plains. footnotes[1] of table.alchemy.habitats now lists
        exactly these 26 cells, including the six previously missing (Ashen Ginger/Highland,
        Bitterweed/Roadside, Giant Raspberry/Plains, Monk’s Laurel/Woods, Snakeberry/Site,
        Wintercress/Water). The shading remains a prose footnote rather than a per-cell flag; the
        earlier proposal marked that optional, so no further change is asked.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 73
          printed_page: 71
          heading: Habitats for ingredients
          locator:
            table: Uncaptioned Ingredients Table
      disposition:
        status: corrected
        change: footnotes[1] of table.alchemy.habitats now names all 26 green-shaded cells, verified
          against an enlarged crop of PDF 73 with per-cell colour sampling.
    - kind: modelling_error
      section_id: section.alchemy.gathering_ingredients
      object_id: character.alchemy.gathering
      description:
        'Re-review of the open finding from review.alchemy_core.1. character.alchemy.gathering
        now carries input fields attempts_today (integer, minimum 0) and alchemy_is_party_highest
        (boolean) and two require effects, attempts_today == 0 and alchemy_is_party_highest ==
        true, before setting ingredient_table_rolls = 2 when roll <= alchemy. This types the
        printed "once per day" and "using the hero with the highest Alchemical Skill Value"
        constraints in the same style as character.alchemy.identify. source_text is still the
        verbatim PDF 73 paragraph (first two sentences; the 01-10 sentence stays in
        character.alchemy.gathering.exquisite).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 73
          printed_page: 71
          heading: Gathering Ingredients
      disposition:
        status: corrected
        change:
          character.alchemy.gathering gained attempts_today and alchemy_is_party_highest inputs
          with require conditions attempts_today == 0 and alchemy_is_party_highest == true.
    - kind: ok_with_note
      section_id: section.alchemy.table
      object_id: table.alchemy.habitats
      description:
        'All 20 rows x 6 habitat columns re-read against the enlarged crop of PDF 73: every
        printed 1d00 range and N/A matches, min/max agree with the ranges (00 read as 100), each
        column is continuous from 01 to 00, and the italic note under the table is quoted
        verbatim as source_text and footnotes[0]. Column labels and the 20 ingredient names
        match, including the lower-case "Ember bark".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 73
          printed_page: 71
          heading: Habitats for ingredients
          locator:
            table: Uncaptioned Ingredients Table
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.alchemy.table_2
