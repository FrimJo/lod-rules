        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 73
          printed_page: 71
          heading: Habitats for ingredients
          locator:
            table: Uncaptioned Ingredients Table
      disposition:
        status: open
        proposed_correction:
          'In table.alchemy.habitats footnotes[1], change the shading list to: Ashen
          Ginger—Woods and Highland; Bitterweed—Roadside and Plains; Giant Raspberry—Roadside and
          Plains; Monk’s Laurel—Woods and Water; Snakeberry—Water and Site; Wintercress—Water and
          Highland. Leave the other entries unchanged. Optionally add a cell-level marker (e.g. a
          boolean "shaded"/"most_likely" flag on the range cells) so the shading is structured
          rather than prose.'
    - kind: modelling_error
      section_id: section.alchemy.gathering_ingredients
      object_id: character.alchemy.gathering
      description:
        'source_text is verbatim, but two printed constraints are not typed: "once per day" and
        "using the hero with the highest Alchemical Skill Value". The effects only set
        ingredient_table_rolls = 2 when roll <= alchemy. By contrast character.alchemy.identify
        types its "once per hero and potion" limit as a require on an attempt counter, so the
        chapter is modelled inconsistently and a consumer cannot see the daily limit from the typed
        effects.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 73
          printed_page: 71
          heading: Gathering Ingredients
      disposition:
        status: open
        proposed_correction:
          Add input fields attempts_today (number) and alchemy_is_party_highest (boolean)
          with require conditions attempts_today == 0 and alchemy_is_party_highest == true (or
          document in the field description that `alchemy` must be the highest Alchemical Skill
          Value in the party), mirroring the pattern used by character.alchemy.identify. Wording
          stays verbatim.
