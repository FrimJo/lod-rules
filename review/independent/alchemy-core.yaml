        where it is most likely to be found!") but misses six green cells. Checked on the rendered
        page by eye on an enlarged crop and by sampling cell background colours: Ashen Ginger is
        also green in Highland (11-20); Bitterweed also in Roadside (11-15); Giant Raspberry also in
        Plains (51-60); Monk’s Laurel also in Woods (74-84); Snakeberry also in Site (75-85);
        Wintercress also in Water (86-95). The other fourteen rows match the footnote. All 120 range
        and N/A cells and all 20 ingredient names match the page.'
