      description: 'Several step source_text values in procedure.settlement_activities_and_overnight are paraphrase or modelling commentary, not printed text: estate_lodging ("Owners may stay at their estate without the daily inn charge; normal between-quest rest applies."), stable_lodging ("If the inn cannot be afforded, sleep in its stable and leave in the morning."), recovery_boundary, stable_half_boundary, paid_hp, restore_luck, paid_recovery, stable_readiness, allow_stable_recovery, stable_luck and stable_recovery. PDF 147 prints, for example, "If you cannot afford this, only half (RDD) of each stat is regained and 1d6 HP as you sleep in the inn''s stable instead. You will then need to leave the settlement in the morning, either on a quest or to travel to another settlement." and "Mana, Luck and energy are automatically restored, and each hero regains 2d6 HP per night. Once luck has been restored, any use of luck after this will not be restored until the next visit to a settlement." The printed "(RDD)" after "half" is also absent from the stable steps, which call the half ambiguous.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Rest and Recuperation
      disposition:
        status: open
        proposed_correction: 'Replace each listed step source_text with the verbatim printed sentence it implements (PDF 147 Rest and Recuperation; PDF 160 Staying at the House for estate_lodging) and move the modelling commentary (unresolved HP bound, supplied half-stat amounts, readiness gating) to unresolved_references or the cited issue. Check whether "only half (RDD)" settles the rounding part of the stable-recovery ambiguity and say so on issue.phase4.recovery_bounds.'
    - kind: source_reference_error
