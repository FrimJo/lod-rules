  findings:
    - kind: source_reference_error
      section_id: section.settlements.activities_in_a_settlement
      object_id: issue.settlement.prayer_schedule_duration
      description: 'Re-check of the open finding in review.settlements_core.2 on this frozen object (review.prayers.2 backs it). Verified corrected. Source 1 is now PDF 134 (printed 132) under the run-in heading "Available Actions", and the rendered page shows the table with "Learn a Prayer" at Temple Grounds, cost 1, under that heading. Source 2 is now changelog 2.21 row 77 on changelog PDF 12, rendered and read: it is marked Fixed with no answer text, and it reads "In relation to learning Prayers, the table on page 120 says it takes 1 Activity Point (1 day) to "Learn a Prayer," but the example on page 119. shows the Priest going to the Temple 3 times to learn a Prayer (3 days)." The summary quotes that row word for word and says the Fixed marking states no rule. The printed example on PDF 133 (printed 131) has the Priest on D1 "Visits temple grounds to learn a new prayer." and D2 "Goes to the temple grounds to continue learning the prayer.", so "this printing shows the Priest learning on D1 and D2, not three visits" is accurate.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Activities in a Settlement
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 12
          printed_page: null
          heading: '2.21'
          locator:
            row: 77
      disposition:
        status: corrected
        change: 'issue.settlement.prayer_schedule_duration source now cites PDF 134 (printed 132) under the heading "Available Actions", and changelog 2.21 row 77 (PDF 12, marked Fixed); the summary quotes row 77 and states that its Fixed marking gives no rule, and that this printing shows the Priest learning on D1 and D2.'
    - kind: ok_with_note
      section_id: section.settlements.activities_in_a_settlement
      object_id: issue.settlement.prayer_schedule_duration
      description: 'The correction changes the content digest of a frozen object. review.prayers.1 and review.prayers.2 are now stale in review check, with issue.settlement.prayer_schedule_duration as the changed object. That is a consequence for the extraction side to re-review the prayers chapter, not a defect in this correction. Nothing here edits the frozen object.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
      disposition:
        status: no_change_needed
    - kind: modelling_error
      section_id: section.settlements.taking_on_quests
      object_id: issue.settlement.quest_availability_repeat
      description: 'Re-check of the stale-summary finding in review.settlements_core.2. Verified corrected. The final sentence of the summary now reads "procedure.settlement_arrival rolls once per visit, returns this issue for a roll that offers no quest or a second quests call in the same visit, and sets must_depart only once every offered quest has been rejected." That matches the printed text: quests are offered only "If there is a quest available, then roll 1d8" (PDF 133, printed 131), and departure follows "If none of the quests are interesting to the party, they must move to another settlement to find new ones" (PDF 133, printed 131). The procedure fields phase and must_depart state the same reading, and the issue stays unresolved.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests; Rejecting a Quest
      disposition:
        status: corrected
        change: 'issue.settlement.quest_availability_repeat summary final sentence now states that a roll offering no quest or a second quests call in the same visit returns the issue, and that must_depart is set only once every offered quest has been rejected.'
    - kind: source_reference_error
      section_id: section.settlements.taking_on_quests
      object_id: section.settlements.taking_on_quests
      description: 'Re-check of the coverage-note finding in review.settlements_core.2. Verified corrected. The note now says the "two-day trek" is stated in the example itself on PDF 132 (printed 130), "noting with pleasure that the Quest Site is a mere two-day trek from the village", and is not modelled. I rendered PDF 132: the Irondale example and the Irondale map extract are on that page. PDF 140 (the Silver City map, no folio) carries no such sentence.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 140
          printed_page: null
          heading: Silver City map
      disposition:
        status: corrected
        change: 'coverage row section.settlements.taking_on_quests notes cite the "two-day trek" sentence of the Irondale example on PDF 132 (printed 130), and no longer cite PDF 140.'
    - kind: ok_with_note
      section_id: section.settlements.taking_on_quests
      object_id: issue.quest.side_quest_availability
      description: 'Changed since .2, so re-read. Checked against PDF 133 (printed 131) and PDF 273 (printed 271), both rendered. PDF 133 prints "If there is a quest available, then roll 1d8. On a result of 1-2 on the d8, a side quest is available as well". PDF 273 prints "The heroes may choose to accept a Side Quest at any time during their stay in the city, and it does not add to the Day Count" and "something that they arrange during the nights at the inn, or maybe because they run into someone during the day". The summary quotes and paraphrases match, and the open questions (whether the d8 is needed, and whether "the city" means Silver City) are recorded as unresolved, as they should be.'
