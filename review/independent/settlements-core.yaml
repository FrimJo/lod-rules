      object_id: issue.settlement.prayer_schedule_duration
      description: 'Frozen object. issue.settlement.prayer_schedule_duration is correct on substance (PDF 133 schedules the Priest "Visits temple grounds to learn a new prayer." on D1 and "Goes to the temple grounds to continue learning the prayer." on D2; PDF 134 lists Learn a Prayer at cost 1; D3 "Visits temples for prayers." is the separate Pray activity). Its second source cites PDF 134 with heading "Activities in a Settlement", but the table on PDF 134 is under the run-in heading "Available Actions". It also does not cite changelog 2.21 #77 ("the table on page 120 says it takes 1 Activity Point (1 day) to Learn a Prayer, but the example ... shows the Priest going to the Temple 3 times", marked Fixed with no answer), which bears directly on it; review/designer-published-rulings.md lists it, and issue.settlement.assassination_attempt cites its changelog rows the same way.'
      source:
