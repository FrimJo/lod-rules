      description: 'Read against PDF 134 (printed 132), all 29 rows: What, Where and Activity Point cost, including "1 per Scroll. Max 2.", "1. Max once.", "0 (but requires stay at inn)" for Gamble, Rest and Recuperation and Tend to those Memories, and "Treat Mental Conditions, The Asylum, 5". The quest availability table (table.settlement.quest_availability) matches the 1d6 table on PDF 133 (printed 131) cell by cell. No change.'
