  findings:
    - kind: modelling_error
      section_id: section.settlements.taking_on_quests
      object_id: procedure.settlement_arrival
      description: 'procedure.settlement_arrival establishes the 1d6 Available quests roll once per visit (check_available_quests requires visit_id > quests_checked_visit) and its step enforce_rejection_limit sets must_depart whenever available_quests is 0, including after a "-" result on the 1d6. PDF 132-133 do not say the roll is once per stay, nor that a "-" result forces the party to move on; only "If none of the quests are interesting to the party, they must move to another settlement" and the rejection limits are printed. The reading is stated only in unresolved_references and the steps return no issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests; Rejecting a Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests
      disposition:
        status: open
        proposed_correction: 'In procedure.settlement_arrival, add issue.settlement.quest_availability_repeat to issues and make the available_quests = 0 branch of enforce_rejection_limit (and any attempt to roll the 1d6 again in the same visit) return {type: unresolved, issue_id: issue.settlement.quest_availability_repeat} instead of silently setting must_depart or refusing the roll. Keep the rejection-limit branch as is.'
    - kind: uncertainty_not_recorded
      section_id: section.settlements.taking_on_quests
      object_id: character.settlement.quest_availability
      description: 'The book does not say whether the Available quests 1d6 may be rolled again during the same stay (later day, after a "-" result, after rejecting), or whether a "-" result obliges the party to leave. The rejection limits (2 village, 3 Silver City) equal the most quests one roll can offer, which makes the question material. No existing issue recorded it (issue.quest.acceptance_scope speaks only generally of repeatability).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests; Rejecting a Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests
      disposition:
        status: recorded_as_issue
        issue_id: issue.settlement.quest_availability_repeat
    - kind: uncertainty_not_recorded
      section_id: section.settlements.taking_on_quests
      object_id: issue.settlement.quest_offer_scope
      description: 'issue.settlement.quest_offer_scope treats the rejection limit as unclear for Durburim ("The Dwarven city"), Birnheim ("more of a mine than a city") and The Outpost because the book does not call them villages. By the same test Freyfell ("This is the largest port in the southern part of the kingdom", PDF 136) and Whiteport ("one of two ports in the southern part of the Kingdom", PDF 137) are not called villages either, yet procedure.settlement_arrival silently applies the village limit of 2 to them (only durburim, birnheim and outpost reach rejection_limit_unresolved). Either the criterion is "every settlement other than Silver City", which also settles the three named ones, or Freyfell and Whiteport belong in the issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Rejecting a Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 136
          printed_page: 134
          heading: Freyfell
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 137
          printed_page: 135
          heading: Whiteport
      disposition:
        status: open
        proposed_correction: 'Amend issue.settlement.quest_offer_scope to name Freyfell and Whiteport (quoting "the largest port" and "one of two ports") alongside Durburim, Birnheim and The Outpost, and add freyfell and whiteport to the settlement list of procedure.settlement_arrival step rejection_limit_unresolved and the exclusions in enforce_rejection_limit; or, if the extraction side holds that every non-Silver City settlement is a village, say so in the issue and drop the three-settlement special case consistently.'
    - kind: modelling_error
      section_id: section.settlements.taking_on_quests
      description: 'state_machine.quest_dungeon (frozen; section_id section.into_the_dungeons.generating_the_dungeon, so not among the examined objects; checked against PDF 132 anyway). The offered -> rejected transition (party_rejects_offer) is guarded on settlement = silver_city with rejected_quests < 3, or settlement != silver_city AND settlement_is_village = true with rejected_quests < 2. For Durburim, Birnheim and The Outpost (which the field description itself says are covered by issue.settlement.quest_offer_scope, so a caller sets settlement_is_village false) no rejection transition exists at all, so the machine encodes "the party may not reject a quest there", a rule the book does not print. The open limit is only cited at the top level, not on the transition. The source_text of the transition is verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Rejecting a Quest
      disposition:
        status: open
        proposed_correction: 'Frozen object; proposal only. Give party_rejects_offer a third branch (settlement not silver_city and settlement_is_village false) that does not block rejection silently, e.g. split it into a separate transition that cites issue.settlement.quest_offer_scope (issues on the transition, or an unresolved guard if the state-machine schema allows), so the undefined limit surfaces instead of forbidding rejection.'
    - kind: ok_with_note
      section_id: section.settlements.leaving_on_a_quest
      description: 'state_machine.quest_dungeon (frozen, not an examined object) offered -> accepted and accepted -> departed transitions checked against PDF 132-133. Both source_text values are verbatim (with marked elisions). The acceptance guard requires the party in a settlement, must_move_on false, the quest source available (campaign available, random quest offered, or side quest on d8 1-2) and, for an Ancient Lands quest, settlement = outpost, matching "The only settlement to offer quests in the Ancient Lands is The Outpost." The departure guard requires departure_early_morning true and other_settlement_activities_that_day = 0, matching "leaving on a quest is always done early in the morning. No other settlement activities are allowed on that day." The rejected transition is reported separately.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests; Leaving on a Quest
      disposition:
        status: no_change_needed
    - kind: transcription_error
      section_id: section.settlements.activities_in_a_settlement
      object_id: test.settlement.activities.wizard_learns_spell_example
      description: 'The fixture is located on the Wizard column (locator column: Wizard) but its source_text splices the Thief D3 cell into the quote: "D3 ... Does nothing. ... Goes to Wizards’ Guild to continue learning the spell." On PDF 133 "Does nothing." is the Thief cell for D3; the Wizard D3 cell is "Goes to Wizards’ Guild to continue learning the spell." The expected values (cost 3, occupied through day 3, departure day 4) match the printed example.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Activities in a Settlement
      disposition:
        status: open
        proposed_correction: 'In test.settlement.activities.wizard_learns_spell_example source_text, replace "D3 ... Does nothing. ... Goes to Wizards’ Guild to continue learning the spell." with "D3 ... Goes to Wizards’ Guild to continue learning the spell." (Wizard column only).'
