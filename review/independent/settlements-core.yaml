  outcome: passed_with_corrections
  summary: 'Re-review of review.settlements_core.2 for the 15 settlements-core section ids, PDF 132-147 rendered and read, plus PDF 273 and changelog 2.2x PDF 12 for the quotes that the changed issues cite. The three open findings of .2 are verified corrected: the prayer schedule issue (heading "Available Actions" on PDF 134, changelog row 77 added, summary sentence), the stale summary of issue.settlement.quest_availability_repeat, and the two-day trek coverage note now cites PDF 132. The changed issue.quest.side_quest_availability matches the page. The activities and quest-availability tables, the quest-site and event-threshold tables and the twelve settlement event rows match the rendered pages. Nothing is open. Outside this unit, the settlement description pages (PDF 136-139), Arena, Banking and Buying and Selling (PDF 139-147) were rendered and read for context only, and their objects were not compared object by object. The Freyfell and Whiteport scope points were checked in review.settlements_core.2 and are not repeated here.'
  supporting_evidence:
    - 'Rendered PDF 132-147 from generated/review/tier6 (pre-rendered PNGs), PDF 273 with swift /tmp/render.swift into generated/review/tier6-rr3, changelog 2.2x PDF 12 from generated/review/tier6-changelog/p12.png.'
    - 'Digest run with the fifteen scoped section ids of review.settlements_core.2 (without --descendants). content_digest changed since .2 because of the three changed issues and section.settlements.taking_on_quests.'
