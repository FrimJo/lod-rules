        the rows. Bloodlust 1-10 is a replace_range for axes, the hammer/flail/staff/morning star
        set, ranged weapons and swords. Riposte is 2 damage ignoring Armour and NA with class 3 or
        lower. Assassin applies to class 1 or 2 from behind. Fast Reload gives 1 action/next action
        for crossbows and 2 actions/next turn for arbalests. Sniper sets +15. Quick Fingers sets 1 AP.
        Nimble allows 2 dodges per battle. Evaluate sets 15%. Streetwise's -1 is optional. Sense for
        Gold keeps the printed "may subtract -1" under issue.phase5.sense_for_gold_sign. One note:
        Axeman is typed as an override on field weapon_family, while Bruiser, Marksman and Swordsman
        are modifiers on field weapon_kind. A consumer must read each rule's own fields.
