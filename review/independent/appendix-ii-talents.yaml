  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:8745d41d772526842b878c63a2978150e2e0fc4fb48e34506425f62f99d7f61a

  findings:
    - kind: modelling_error
      section_id: section.appendix_ii_talents.magic_talents
      object_id: character.talent.necromancer.school_spell
      description: >-
        The Necromancer row on PDF 176 reads "+5 Arcane Arts whenever casting a Necromantic Spell.
        Furthermore, the Mana cost for such a spell is reduced by 5." The rule's condition compares
        spell_school with the literal "necromantic". No spell prints that school. The School column of
        the spell tables prints "Necromancy" (on PDF 190, Banish Undead and Summon Souls), and the
        spell entities carry school "Necromancy". As typed, the rule can never match a printed
        Necromancy spell. The sibling rules use the school noun (conjuration, divination, mysticism),
        so only Necromancer takes the adjective from the row text. The source_text is verbatim.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 176
          printed_page: 174
          heading: Magic Talents
          locator:
            table: Magic Talents
            row: Necromancer
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Level 4 Magic
          locator:
            table: Level 4 Magic
            column: School
      disposition:
        status: open
        proposed_correction:
          'character.talent.necromancer.school_spell: compare spell_school with the Necromancy school
          value, written the same way as in conjurer, divinator and mystic (e.g. "necromancy"), and
          keep source_text verbatim. It would also help to state one casing convention for
          spell_school literals against the spell catalogue''s School values ("Conjuration",
          "Necromancy").'
    - kind: source_reference_error
      section_id: section.appendix_ii_talents.physical_talents
      object_id: character.talent.perfect_hearing.eligibility
      description: >-
        Changelog 2.21 entry 182 (changelog PDF page 26) reads "Page 170 Perfect Hearing: Added ‘(or Trait)’ after Talent.", marked Fixed. It concerns the Perfect Hearing row on PDF 172
        (printed 170), "...a newly created character that has this Talent listed in the Species
        Description." No object in the unit cites the entry, and review/designer-published-rulings.md
        does not list it. The executable effect needs no change, because listed_for_species already
        covers the species "Traits" lists (e.g. "Traits: Perfect Hearing; Night Vision"). But the
        ruling clarifies the eligibility wording and should be cited under the extraction guide's
        Official rulings convention.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 172
          printed_page: 170
          heading: Physical Talents
          locator:
            table: Physical Talents
            row: Perfect Hearing
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 182
      disposition:
        status: open
        proposed_correction:
          'character.talent.perfect_hearing.eligibility: add a source entry for vonbraus.changelog_2_2x
          (pdf_page 26, heading 2.21, locator.row 182). Keep the printed source_text and the table
          row verbatim. Add a "Perfect Hearing wording (no issue)" row for #182 to
          review/designer-published-rulings.md, as was done for #86.'
    - kind: source_reference_error
      section_id: section.appendix_ii_talents.table
      description: >-
        The table node that owns table.talent.magic is titled "Appendix II: Talents table". Its note
        says "The book prints no caption for this table; the title names its enclosing section."
        The node's parent is section.appendix_ii_talents.magic_talents, and on PDF 176 the table sits
        under the heading "Magic Talents". The title names the chapter, not the enclosing section.
        Every other talent table node is titled after its subsection ("Physical Talents table",
        "Sneaky Talents table"). The two redirects, section.appendix_ii_talents.table_2 and table_3,
        are parented to the chapter root rather than to Magic Talents.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 176
          printed_page: 174
          heading: Magic Talents
      disposition:
        status: open
        proposed_correction:
          'sections.yaml section.appendix_ii_talents.table: retitle it "Magic Talents table" and keep
          the id. Optionally reparent the redirects section.appendix_ii_talents.table_2 and table_3 to
          section.appendix_ii_talents.magic_talents, and retitle them to match.'
    - kind: uncertainty_not_recorded
      section_id: section.appendix_ii_talents.common_talents
      object_id: character.talent.disciplined.own_resolve
      description: >-
        The Disciplined row on PDF 175 reads "The hero gains +10 RES and the other members of the
        party gain +5 RES as long as the hero is not knocked out." own_resolve adds +10 RES
        permanently with no condition. party_resolve carries the not-knocked-out condition. Whether
        the trailing condition also limits the hero's own +10 is grammatically open, so the split is
        an unrecorded reading. Recorded as a new issue. The two rules could add it to their issues
        lists.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 175
          printed_page: 173
          heading: Common Talents
          locator:
            table: Common Talents
            row: Disciplined
      disposition:
        status: recorded_as_issue
        issue_id: issue.talent.disciplined_knocked_out_scope
    - kind: ok_with_note
      section_id: section.appendix_ii_talents
      description: >-
        I compared all eight talent tables cell by cell on PDF 172-178 (with 4x crops of PDF 173 and
        174): Physical 12 rows, Combat 16, Faith 6, Alchemist 8, Common 14, Magic 13, Sneaky 13,
        Mental 6, 88 rows in total, each with Talent and Description columns. Every Talent name and
        description matches the page, including printed casing ("Lethal shot", "Shadow walker",
        "Sharp-eyed", "Strong-Minded", "God’s Chosen") and printed slips that are kept verbatim
        ("and and you may add", "is also negated", "No matter how many heroes uses", "Your hero’s
        your gear", "Party Moral", "subtract -1", "gets a +1DMG", "2 additional Hit Point per turn",
        "+2DMG", "practiced" without a final period after "+1 HP", the straight apostrophe in
        "target's DEX"). Row order follows the page, including Veteran, Pathfinder, Pious after Swift
        Leader and Restorer before Mystic. All 88 talent entities quote their row exactly, list the
        row's rule_refs as their rules, cite the row and the opening paragraph, and carry the right
        category. Every row-based rule quotes its row in full. The unit has 141 rules and no orphans.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 172
          printed_page: 170
          heading: 'Appendix II: Talents'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 178
          printed_page: 176
          heading: Mental Talents
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_ii_talents
      object_id: character.talent.appendix_definition
      description: >-
        The opening paragraph on PDF 172 is quoted verbatim ("Talents are specific skills that your
        heroes possess. They are always active, and do not need a successful die roll to confer
        benefit. You may choose a Talent from the category listed on the Level Up Table."). It is
        typed as a definition with no effects and links to the Level Up talent table, whose
        categories match the rendered PDF 62. issue.talent.die_roll_benefit quotes Death Lament (PDF
        173), Cutpurse (PDF 177) and Cartographer (PDF 175) correctly, and each of those rules keeps
        its printed roll and cites the issue. The dice are typed on rule fields:
        death_lament.recover roll 1d6 (1-6), and cutpurse attempt_roll 1d6 and coin_roll 1d100.
        Cutpurse's 3-5 band correctly has no effect. The paragraph neither conflicts with Character
        Basics' "Talents are passive boosts ... do not require any energy to activate" nor
        duplicates it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 172
          printed_page: 170
          heading: 'Appendix II: Talents'
          locator:
            paragraph: 1
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 62
          printed_page: 60
          heading: Talents and Perks
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_ii_talents.magic_talents
      object_id: character.talent.summoner.duration
      description: >-
        issue.talent.summoner_focus_example checks out against the page. The rendered PDF 66 Focus
        example says "Luckily, he has the Summoner Talent, giving him a +5 which allows him to summon
        the demon". The Summoner row on PDF 176 gives only "stay 2 turns longer". The Conjurer row
        gives the +5 Arcane Arts. Summon Demon is printed with School Conjuration on PDF 190. The
        Summoner and Conjurer rules follow the table and cite the issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 66
          printed_page: 64
          heading: Focus
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 176
          printed_page: 174
          heading: Magic Talents
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_ii_talents.mental_talents
      object_id: procedure.hate_talent
      description: >-
        The procedure's source_text is the Hate row on PDF 178, verbatim. Its step source_text values
        are verbatim fragments of the row. The attack step adds +5 to CS. The parry and dodge steps
        each add -5. The rules hate.attack, hate.defence and hate.selection quote the full row.
        Selection ("choose one enemy", the Goblin name-word example and repeat acquisition) and
        target-scope gaps are left to issue.sanity.hate_target_scope, which cites PDF 178.
