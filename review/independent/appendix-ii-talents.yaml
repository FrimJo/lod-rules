  findings:
    - kind: modelling_error
      section_id: section.appendix_ii_talents.magic_talents
      object_id: character.talent.necromancer.school_spell
      description:
        Re-check of review.appendix_ii_talents.1 finding 1. The Necromancer row on PDF 176
        reads "+5 Arcane Arts whenever casting a Necromantic Spell. Furthermore, the Mana cost for
        such a spell is reduced by 5." The School column on PDF 190 (Level 4 Magic) prints
        "Necromancy" for Banish Undead and Summon Souls. The rule now compares spell_school with
        "necromancy", matching the school noun as conjurer ("conjuration"), divinator ("divination")
        and mystic ("mysticism") do. All four spell_school fields now state one convention, "the
        spell table's School value in lower case". The source_text stays verbatim ("Necromantic
        Spell"), and the spell catalogue's School values (Conjuration, Divination, Mysticism,
        Necromancy) lower-case to those literals.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 176
          printed_page: 174
          heading: Magic Talents
          locator:
            table: Magic Talents
            row: Necromancer
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Level 4 Magic
          locator:
            table: Level 4 Magic
            column: School
      disposition:
        status: corrected
        change:
          character.talent.necromancer.school_spell compares spell_school with "necromancy". The
          spell_school field descriptions of conjurer, divinator, mystic and necromancer state the
          lower-case School value convention. source_text unchanged.
    - kind: source_reference_error
      section_id: section.appendix_ii_talents.physical_talents
      object_id: character.talent.perfect_hearing.eligibility
      description: 'Re-check of review.appendix_ii_talents.1 finding 2. Changelog 2.21 entry 182
        (changelog PDF page 26, rendered) reads "Page 170 Perfect Hearing: Added ‘(or Trait)’ after
        Talent.", marked Fixed. The rule now cites vonbraus.changelog_2_2x with pdf_page 26, heading
        2.21 and locator.row 182, the same convention as the neighbouring entries #183 and #185. Its
        source_text keeps the printed row from PDF 172 ("...has this Talent listed in the Species
        Description."), and the listed_for_species description now names the Trait reading. The
        effect is unchanged, as it should be. review/designer-published-rulings.md has a "Perfect
        Hearing wording (no issue)" row for #182, and the Physical Talents coverage note mentions
        the citation.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 172
          printed_page: 170
          heading: Physical Talents
          locator:
            table: Physical Talents
            row: Perfect Hearing
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 182
      disposition:
        status: corrected
        change:
          'character.talent.perfect_hearing.eligibility cites changelog 2.21 entry 182 (PDF 26) beside
          the PDF 172 row. The printed source_text and table cell are unchanged, and the rulings
