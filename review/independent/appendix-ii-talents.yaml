      section_id: section.appendix_ii_talents
      description: >-
        Profession and actor qualifiers match the printed lines. "These Talents are only available to
        the Alchemist" (PDF 174) is modelled as profession eq alchemist. "Magic Talents are exclusive
        to Wizards" (PDF 176) is profession eq wizard. "These are the Talents of the Warrior Priests"
        (PDF 174) is profession eq warrior_priest. That last line is less explicit than the other two,
        but it agrees with the Level Up talent table on PDF 62, where only the Warrior Priest column
        lists Faith. Row-level qualifiers are typed as printed: Observant "Rangers only", Streetwise
        "can only be taken by a Rogue", Pious "cannot be chosen by a Warrior Priest" (with
        character.talent.common.eligibility pointing to it as the exception to "anyone ... regardless
        of profession"), Fearless requiring Braveheart, Dual Wield DEX 60, and Restorer/Necromancer
        mutual exclusion. The profession starting-talent references (e.g. Ranger "Observant (page
        170), Marksman (page 171) or Hunter (page 173)") agree with the appendix pages. Note that
        these acquisition rules are typed "modifier" with only require effects, while
        night_vision.eligibility and perfect_hearing.eligibility are typed "constraint". The corpus
        mixes both conventions, so I propose no change.
