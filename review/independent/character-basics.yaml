  findings:
    - kind: source_reference_error
      section_id: section.character_basics.the_character.luck_l
      description:
        'The Luck (L) paragraph starts at the foot of the right column on PDF 26 and ends at the top
        of the left column on PDF 27 ("not be replenished until the hero returns to a settlement
        once more."). The sections.yaml row for section.character_basics.the_character.luck_l gives
        printed_end_page 24 / pdf_end_page 26, so the section range omits the page that completes
        its last sentence. character.luck.settlement_reset correctly cites both PDF 26 and PDF 27,
        and the coverage note says "The paragraph runs onto PDF 27", so the section row disagrees
        with both.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 26
          printed_page: 24
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Luck (L)
      disposition:
        status: open
        proposed_correction:
          'section.character_basics.the_character.luck_l (sections.yaml): set printed_end_page 25
          and pdf_end_page 27.'
    - kind: modelling_error
      section_id: section.character_basics.the_character.luck_l
      object_id: term.settlement_visit
      description:
        'term.settlement_visit has the headword "Settlement visit", but that phrase is not printed on
        PDF 26 or PDF 27 (or anywhere in this chapter). The book says "once the hero is back in a
        settlement" and "while in the settlement" / "until the hero returns to a settlement once
        more". The definition field quotes a rule sentence ("Luck is reset once the hero is back in
        a settlement."), which defines the Luck reset, not a settlement visit. The record reads as
        a printed glossary headword when it is a corpus-coined timing label. Nothing marks it as
        coined.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 26
          printed_page: 24
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Luck (L)
      disposition:
        status: open
        proposed_correction:
          'term.settlement_visit: keep the id (it is referenced), but make clear that "Settlement
          visit" is a corpus label and not printed. Either quote the printed span that bounds the
          period ("Any luck rolls used while in the settlement will not be replenished until the
          hero returns to a settlement once more.") and add an unresolved issue noting that the
          book does not name or define a settlement visit, or move the timing concept out of the
          glossary into a non-glossary timing object. Update the luck_l coverage note to match.'
    - kind: uncertainty_not_recorded
      section_id: section.character_basics.the_character.perks
      object_id: character.perk.acquisition
      description:
        'character.perk.acquisition quotes "Most heroes do not have Perks at Level 1, but will
        acquire them as they grow more experienced." (PDF 27). All eight profession entries on PDF
        34–41 list "Heroic Force of Will (page 168)" under Perks, so every starting hero has a Perk
        at Level 1. The conflict was not recorded. The perks coverage note mentions changelog 2.21
        entry 140, which I rendered (changelog PDF 23: "Page 25 changed and added ''All heroes get
        the "Heroic Force of Will" perk at the start.''"), but it only says that "no record
        changed". The rule links no issue, so a reader of the rule sees the superseded "Most
        heroes" sentence without warning. Recorded as a new unresolved issue. The extraction side
        may resolve it with entry 140 under the official-rulings convention and should add issues:
        [issue.character_basics.perks_at_level_one] to character.perk.acquisition.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 34
          printed_page: 32
          heading: Alchemist
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 41
          printed_page: 39
          heading: Wizard
      disposition:
        status: recorded_as_issue
        issue_id: issue.character_basics.perks_at_level_one
    - kind: ok_with_note
      section_id: section.character_basics.the_character.hit_points_hp
      object_id: character.hit_points.definition
      description:
        'Requested check: term.hit_points (Introduction, PDF 16: "HP: Hit Points. The amount of
        damage a character can sustain before they are knocked out.") compared with PDF 27 ("This
        is how many Hit Points your hero may lose before they start bleeding out."). Both quotes are
        verbatim. Bleeding out on PDF 122 says "When the heroes reach 0 Hit Points, they are knocked
        down and start bleeding out" and later "Bandages can never be applied by a knocked-out
        hero", so the book uses knocked out, knocked down and bleeding out for the same 0-HP state.
        Neither page sets a different threshold or state, so this is a wording variant and not a
        rules conflict. No new issue is needed. The hit_points_hp coverage note records the
        variant accurately. The Introduction record was not edited.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 16
          printed_page: 14
          heading: Abbreviations and Terminology
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Hit Points (HP)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.character_basics.the_character
      description:
        'Glossary dispositions for damage_bonus_db, natural_armour_na, movement_m, hit_points_hp,
        skills, perks and talents are "extracted", yet the headword terms (term.damage_bonus,
        term.natural_armour, term.movement, term.hit_points, term.skill, term.perk, term.talent) are
        owned by Abbreviations and Terminology and cite only PDF 16–17. On PDF 26–27 each of these
        headings adds one descriptive sentence. Each sentence is quoted verbatim in a
        character.* rule that term_refs the headword, and docs/ontology.md states the policy of
        taking these headwords from the glossary without harvesting Character Basics. Each coverage
        note says so plainly. The Character Basics sentences agree with the PDF 16–17 definitions
        (hit points: see the previous finding). I judge the disposition honest. A stricter reading
        would add the Character Basics page as a second source on each term, but that is an
        Introduction-owned change and is not required here.'
      source:
        - document: rulebook.second_printing.eng
