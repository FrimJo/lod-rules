  findings:
    - kind: source_reference_error
      section_id: section.character_basics.the_character.luck_l
      description:
        'Re-check of review.character_basics.1 finding 1 (open). On the rendered pages the Luck (L)
        paragraph starts at the foot of the right column on PDF 26 ("Each Luck Point can be used to
        alter the course of events.") and ends at the top of the left column on PDF 27 ("not be
        replenished until the hero returns to a settlement once more."). pages.yaml maps PDF 26 to
        printed 24 and PDF 27 to printed 25.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 26
          printed_page: 24
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Luck (L)
      disposition:
        status: corrected
        change: The sections.yaml row for section.character_basics.the_character.luck_l now has
          printed_start_page 24, printed_end_page 25, pdf_start_page 26 and pdf_end_page 27, which
          covers the page that completes the paragraph. The coverage note says the paragraph ends at
          the top of PDF 27.
    - kind: modelling_error
      section_id: section.character_basics.the_character.luck_l
      object_id: term.settlement_visit
      description:
        'Re-check of review.character_basics.1 finding 2 (open). The id term.settlement_visit was
        kept, as the proposed correction allowed. Its definition now quotes both printed sentences
        that bound the period, verbatim against PDF 26–27: "Luck is reset once the hero is back in a
        settlement. Any luck rolls used while in the settlement will not be replenished until the
        hero returns to a settlement once more." Both pages are cited with visually_verified: true.
        I checked the claim in the new issue that the phrase is printed elsewhere but never
        defined. Perfect Result on PDF 21 (printed 19) prints "(limited to once between each
        settlement visit)" twice, under the Skill Check and basic stat check options. Rest and
        Recuperation on PDF 147 (printed 145) prints "any use of luck after this will not be
        restored until the next visit to a settlement". Neither page, nor PDF 26–28, says when a
        settlement visit begins or ends. The claim is accurate, and the quotation in the issue is a
        verbatim fragment. The headword is therefore grounded in printed wording (PDF 21), and the
        issue states that it is not a printed glossary headword on the Luck page. The glossary
        schema has no issues field on terms, so the link runs through the issue''s related list
        (term.settlement_visit and character.luck.settlement_reset), which is the available
        mechanism. The luck_l coverage note matches.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 26
          printed_page: 24
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Perfect Result
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Rest and Recuperation
      disposition:
        status: corrected
        change: term.settlement_visit keeps its id and name, and its definition now quotes the two
          printed Luck sentences in full with sources on PDF 26 and PDF 27. The new unresolved
          issue.character_basics.settlement_visit_label (rulebook_undefined) records that the
          name is a corpus label on the Luck page, quotes the PDF 21 and PDF 147 uses accurately and
          says the book never defines a settlement visit. The luck_l coverage note was updated to
          match.
    - kind: uncertainty_not_recorded
      section_id: section.character_basics.the_character.perks
      object_id: character.perk.acquisition
      description: 'Re-check of review.character_basics.1 finding 3 (recorded as
        issue.character_basics.perks_at_level_one). I rendered changelog page 23. Entry 140 reads
        "Page 25 changed and added ''All heroes get the "Heroic Force of Will" perk at the
        start.''" and is marked Fixed. It states a rule, so under the official-rulings convention
        it can settle the issue. Printed page 25 is PDF 27, the Perks paragraph. Alchemist (PDF 34)
        and Wizard (PDF 41) still list "Heroic Force of Will (page 168)" under Perks, consistent
        with the ruling. character.perk.acquisition source_text is still verbatim against PDF 27
        ("These will boost the hero in certain ways ... A Complete list can be found on page
        166.", including the capital C in "Complete"). It has effects: [] and fields: {}, so no
        effect changed, and the rule now carries issues: [issue.character_basics.perks_at_level_one].
        The issue has status resolved with a resolution citing changelog PDF 23, locator row 140,
        heading 2.21. All eight profession entities still reference perk.heroic_force_of_will.
        The issue summary still ends with "character.perk.acquisition still quotes only the
        printed sentence and links no issue", which describes the state at reporting time and is
        now out of date. The resolution text states the current link, so this is cosmetic.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 34
          printed_page: 32
          heading: Alchemist
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 41
          printed_page: 39
          heading: Wizard
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 23
          printed_page: null
          heading: '2.21'
          locator:
            row: 140
      disposition:
        status: corrected
        change:
          issue.character_basics.perks_at_level_one is resolved by changelog 2.21 entry 140 with a
          cited resolution. character.perk.acquisition links the issue, its printed source_text is
          unchanged and verbatim, and no effect changed (the rule has none; the starting Perk stays
          granted by each profession). The perks coverage note records the ruling and the link.
    - kind: ok_with_note
      section_id: section.character_basics.the_character.luck_l
      object_id: character.luck.settlement_reset
      description:
        'Spot check. The source_text of character.luck.settlement_reset is verbatim against PDF
        26–27, and the rule cites both pages. It has timing_refs [term.settlement_visit] but its
        issues list holds only issue.phase4.settlement_recovery, not the new
        issue.character_basics.settlement_visit_label. The new issue names the rule in related,
        and the rule''s "new_settlement_arrival" input is already covered by the phase4 issue, so
        the omission does not hide uncertainty. Adding the new issue to the rule''s issues list is
        optional.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 26
          printed_page: 24
          heading: Luck (L)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
