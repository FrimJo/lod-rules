    - kind: ok_with_note
      section_id: section.prayers.learning_new_prayers
      object_id: procedure.learn_prayer
      description:
        'PDF 158 (printed 156), Learning a New Prayer, reads "Priests may learn a prayer from one
        of the High Priests. Each hero may learn one prayer in between each visit to a dungeon.
        The price for learning a prayer is 200 c +100 c per prayer level above 1. It takes 1 day."
        The procedure''s joined source_text matches apart from a space after the plus ("200 c +
        100 c"), which I do not count as a transcription error. The quote step computes 200 + 100
        x (level - 1), required_activity_points 1 and the one-prayer-per-dungeon boundary
        (learned_since_boundary), all matching the page; character.prayer.learning_restriction
        matches PDF 82 ("same level or lower level than the priest, provided they can pay for it.
        This is done in the Inner Sanctum in Silver City"). PDF 134 and PDF 146, also cited by the
        procedure, were not rendered in this re-review; PDF 146 remains honestly marked
        visually_verified false.'
