  findings:
    - kind: coverage_error
      section_id: section.prayers.will_the_gods_listen
      description: 'Re-review of the open finding from review.prayers.1. The coverage note for
        section.prayers.will_the_gods_listen now reads "The opposed Resolve Test is modelled on each
        prayer whose text calls for one (Smite The Heretics!, Stay Thy Hand!, Be Gone!); Litany of
        Metheia is a RES test made by each hero to regain 1 HP, not an enemy test to avoid the
        effect." Verified on PDF 83: Smite The Heretics! ("the enemies within 4 squares of the
        priest must pass a RES test or lose 1 HP"), Stay Thy Hand! ("All enemies within 4 squares
        of the priest must pass a Resolve Test or they will lose 1 Action Point") and Be Gone!
        ("Any ethereal creature within 4 squares must make a successful RES test ... or lose 1d3
        HP") are the three enemy-side tests, and Litany of Metheia reads "Every hero that passes a
        RES test at the start of their activation regains 1 HP", a hero-side test. The reworded
        note matches the page and the sentence on PDF 82 ("In certain cases, there can be an
        opposed Resolve Test from the enemies to avoid the effect"). This was the only object
        whose digest changed since review.prayers.1.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 83
          printed_page: 81
          section: Level 2 prayers
          heading: Litany of Metheia
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 82
          printed_page: 80
          heading: Will the Gods Listen?
      disposition:
        status: corrected
        change:
          "corpus/source-map/coverage.yaml, row section.prayers.will_the_gods_listen: Litany of
          Metheia was removed from the list of prayers modelling the enemies' opposed Resolve
          Test (now Smite The Heretics!, Stay Thy Hand!, Be Gone!) and a clause was added stating
          that Litany of Metheia is a RES test made by each hero to regain 1 HP, not an enemy test
          to avoid the effect."
    - kind: ok_with_note
      section_id: section.prayers
      description:
        'The other 83 examined objects carry digests identical to those in review.prayers.1, so no
        content changed since that review. I nevertheless re-read PDF 82-83 against every object:
        the source_text of all 27 character.prayer.* rules, the 18 prayer.* entities, term.prayer,
        term.impeccable, term.relic and procedure.offer_prayer is verbatim, including the
        heading-only spellings "Methia''s Balm" (heading) versus "Metheia" (body), "Verse of The
        Sane", "the hero targeted mend", "The hero regain 1d3", "one hero in LOS of the priest get
        +2 Natural Armour" and "Metheia will shield its children". Every number and die
        expression matches the page: 1 Point of Energy, 01-05 impeccable, 4 turns between
        battles, one active prayer, -10 CS, +10 RES, 01-10 versus 01-05, 1 lost HP, +10 Arcane
        Arts, 1d6+1 HP, 1 HP, +2 Natural Armour, 1d3 Sanity Points, +1 DMG, +10 CS, 4 squares, 1
        Action Point, 1d3 HP, +10 CON, +5 HP, +20 Combat Skill, +2 DMG, halved (RDD), one ring and
        one necklace (2 relics). Typed effects agree with the text: Stay Thy Hand! requires no
        other action loss and not wounded; God''s Champion splits into the active +20/+2 rule, the
        after-battle Energy loss when Energy >= 1, and floor(CON / 2) when Energy < 1; Interruption
        fires on stunned, fallen over, HP <= 0 or failed Terror Test. All 29 sections.yaml spans
        and parents match the printed layout (Level 1 prayers spans PDF 82-83 because Methia''s
        Balm opens PDF 83); every rule and entity cites the correct PDF/printed page, level
        heading and run-in heading. Nothing in scope is a frozen object.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 82
          printed_page: 80
