      description:
        'PDF 83: "after the battle, the priest loses an additional Point of Energy. If there are
        not enough points, the Constitution of the priest is halved (RDD) until the next short
        rest or until the heroes leave the dungeon." The split into three rules (+20 CS and +2 DMG
        while active; energy - 1 when energy >= 1 after the battle; floor(constitution / 2) when
        energy < 1) matches the text, and RDD resolves to term.rounded_down. The Energy loss is
        gated on battle_ended; the book gives no rule for a God''s Champion offered between
        battles (Duration: 4 turns), which is out of scope for this chapter''s text.'
