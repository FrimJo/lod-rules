  findings:
    - kind: coverage_error
      section_id: section.prayers.will_the_gods_listen
      description:
        'The coverage note for section.prayers.will_the_gods_listen says the opposed Resolve Test
        "is modelled on each prayer whose text calls for one (Smite The Heretics!, Stay Thy Hand!,
        Be Gone!, Litany of Metheia)". On PDF 83 Litany of Metheia reads "Every hero that passes a
        RES test at the start of their activation regains 1 HP": the test is made by heroes to
        gain the benefit, not by enemies to avoid the effect, so it is not an instance of the
        "opposed Resolve Test from the enemies" that Will the Gods Listen? describes. The other
        three prayers are correctly listed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 83
          printed_page: 81
          section: Level 2 prayers
          heading: Litany of Metheia
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 82
          printed_page: 80
          heading: Will the Gods Listen?
      disposition:
        status: open
        proposed_correction:
          'In corpus/source-map/coverage.yaml, row section.prayers.will_the_gods_listen, remove
          "Litany of Metheia" from the list of prayers that model the opposed Resolve Test (keep
          Smite The Heretics!, Stay Thy Hand!, Be Gone!), or reword the sentence so that Litany
          is described as a hero RES test.'
    - kind: uncertainty_not_recorded
      section_id: section.prayers.duration
      object_id: procedure.offer_prayer
      description:
        'PDF 82 Duration says only "Only one prayer can be active at once." procedure.offer_prayer
        step "offer" requires active_prayers < 1 and describes the count as prayers "of this
        priest", so a new offering while a prayer is active is refused rather than replacing the
        active prayer, and the limit is read per priest. The book defines neither point. The
        source_text of character.prayer.duration and the procedure are verbatim; the
        interpretation was not flagged as an issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 82
          printed_page: 80
          heading: Duration
      disposition:
        status: recorded_as_issue
        issue_id: issue.prayers.second_prayer_while_active
    - kind: uncertainty_not_recorded
      section_id: section.prayers.be_gone
      object_id: character.prayer.be_gone
      description:
        'PDF 83 Be Gone! says "Any ethereal creature within 4 squares must make a successful RES
        test at the start of their turn or lose 1d3 HP" and does not name the origin of the 4
        squares, unlike Smite The Heretics! and Stay Thy Hand! ("within 4 squares of the priest").
        The rule models a bare distance field (description "distance"), which is faithful, but
        the gap was not recorded.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 83
          printed_page: 81
          section: Level 3 prayers
          heading: Be Gone!
      disposition:
        status: recorded_as_issue
        issue_id: issue.prayers.be_gone_range_origin
    - kind: uncertainty_not_recorded
      section_id: section.prayers.smite_the_heretics
      object_id: character.prayer.smite_the_heretics
      description:
        'Smite The Heretics! ("lose 1 HP") and Be Gone! ("lose 1d3 HP") on PDF 83 are phrased as HP
        loss, not DMG. Both rules carry a damage_resolution dependency on combat.damage.basic
        ("Damage taken = Wpn DMG + DB - NA - Armour") labelled "Apply damage using existing damage
        and protection rules with this effect''s printed exceptions". The book does not say
        whether Natural Armour or Armour reduce this loss; the dependency should not be read as
        settling that.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 83
          printed_page: 81
          section: Level 2 prayers
          heading: Smite The Heretics!
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 83
          printed_page: 81
          section: Level 3 prayers
          heading: Be Gone!
      disposition:
        status: recorded_as_issue
        issue_id: issue.prayers.hp_loss_vs_damage
    - kind: uncertainty_not_recorded
