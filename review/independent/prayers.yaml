        'The printed run-in heading on PDF 83 is "Methia''s Balm" while the body says "the power of
        Metheia"; section title, entity name, rule heading and ids follow the printed heading and
        the body text is kept verbatim, which is right. The 1d6+1 healing (and 1d3 for Verse of The
        Sane and Be Gone!) is carried only in source_text and taken as a roll input
        (healing_roll + 1, sanity_roll, damage_roll); the mechanics schema allows a dice
        annotation on fields but no rule in corpus/rules uses it, so this is a corpus-wide
        convention rather than a prayers defect.'
