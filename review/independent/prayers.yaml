        continue learning the prayer", while PDF 134 lists Learn a Prayer at 1 Activity Point and
        PDF 158 says "It takes 1 day". Learning New Prayers on PDF 82 states no duration, so the
        issue bears on procedure.learn_prayer (which sets required_activity_points 1 and lists the
        issue) rather than on the PDF 82 paragraph itself. Its sources cite PDF 133-134 only; PDF
