        prints "200 c +100 c per prayer level above 1" (no space after the plus) where the YAML has
        "200 c + 100 c". Step-level source_text fields ("Learning costs 200 c plus 100 c per level
        above 1.", "One prayer between each dungeon; ...", "Complete the 1-day learning activity
        once and pay its fee.") are paraphrases, not quotations, which matches the procedure
        convention used elsewhere in the corpus. The numbers 200, 100, 1 day and one prayer per
        dungeon visit all match PDF 158. The PDF 146 and PDF 134 citations were not inspected for
        this review beyond PDF 134 as rendered; PDF 146 is marked visually_verified false, which
