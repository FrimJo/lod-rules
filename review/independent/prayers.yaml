        Activity Point with no settlement restriction, and the PDF 133 Silver City example has the
        priest visit the "temple grounds" to learn a prayer. The location conflict was not
        recorded; only the one-day versus two-day schedule conflict
        (issue.settlement.prayer_schedule_duration) was.'
