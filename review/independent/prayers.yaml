        runs PDF 82-83 because Methia''s Balm is on PDF 83; every other run-in prayer is on the
        page given; level headings are printed "Level N prayers" with lowercase "prayers"; the
        printed exclamation marks in Smite The Heretics!, Stay Thy Hand! and Be Gone! are kept.
        Every source_text of the 27 rules, 18 entities, 3 terms and procedure.offer_prayer is
        verbatim against PDF 82-83, including every number (-10 CS, +10 RES, 01-10, 01-05, 1 HP,
        1d6+1, 1d3, +2 Natural Armour, +1 DMG, +10 CS, 4 squares, 1 Action Point, +10 CON, +5 HP,
        +20, +2 DMG, 4 turns, 2 relics) and the 1 Point of Energy cost.'
