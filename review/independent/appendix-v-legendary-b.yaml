  findings:
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.the_vampires_brooch
      object_id: equipment.legendary.the_vampires_brooch
      description: 'Entity source_text matches PDF 209 verbatim (including the printed "capitol"). The rules restore and drain split the mechanic on the 1d6 roll: 1-5 restores min(roll, damage dealt), 6 restores nothing and drains a separately supplied 1d6 from the closest hero; the parent sets slot necklace from "treated as a necklace" / "worn as a necklace" and depends on the jewellery limit. Whether the 6 is the healing die and whether the drain is a new roll, plus ties for closest hero, are carried by issue.treasure.legendary_followup. Dice fields are typed 1d6.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 209
          printed_page: 207
          heading: 'The Vampire’s Brooch'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.the_helmet_of_golgorosh_the_ram
      object_id: character.treasure.legendary.the_helmet_of_golgorosh_the_ram
      description: 'Helmet source_text matches PDF 209 verbatim. Typed values match the page: no -1 Sanity loss on a head hit, RES Test on a head hit with one Action point lost (stunned) on failure, +15 when shoving, DEF 6, Enc 5. "metal helmet" versus the catalogue Helmet is carried by issue.treasure.legendary_base_names. The base_equipment literal "metal helmet (printed)" carries an extractor annotation in the value and the head_hit source_text elides with "...", both cosmetic.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 209
          printed_page: 207
          heading: 'The Helmet of Golgorosh the Ram'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.the_breastplate_of_rannulf
      object_id: character.treasure.legendary.the_breastplate_of_rannulf
      description: 'Breastplate source_text matches PDF 210 verbatim. DEF 8, ENC 7 and denial of the Large Creature Double Damage roll are typed; the large_creature rule sets double_damage_roll_allowed false for a Large Creature attacker.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 210
          printed_page: 208
          heading: 'The Breastplate of Rannulf'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.the_golden_khopesh
      object_id: equipment.legendary.the_golden_khopesh
      description: 'Khopesh source_text matches PDF 210 verbatim. DMG 1d12+1 is typed as dice 1d12 modifier 1 (range 2-13) in the damage rule, Class 4 and Encumbrance 10 are set, armour and natural armour saves are denied, Higher Undead target the wielder. The PDF 202 selector spelling "The Golden Kopesh" is kept as a separate entity (outside this unit) and the difference stays open in issue.treasure.legendary_names, which correctly says no ruling covers it (changelog 2.21 entry 193 only renames Oakenshield to Copperbane). The spelling is carried by legendary_names, not legendary_base_names (which covers metal helmet and Chainmail Shirt).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 210
          printed_page: 208
          heading: 'The Golden Khopesh'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.ring_of_regeneration
      object_id: character.treasure.legendary.ring_of_regeneration
      description: 'Ring source_text matches PDF 211 verbatim. The 1d3 HP override is typed as a 1d3 dice field. A text search of the whole rulebook PDF finds "Regeneration" only on PDF 202 and 211, so the unresolved_references entry ("this book does not define the Regeneration Special Rule") is accurate; timing is supplied input. Slot ring follows from the item being a ring and Carrying Magic Items.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 211
          printed_page: 209
          heading: 'Ring of Regeneration'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.appendix_v_treasures.legendary_items.crown_of_resolve
      object_id: character.treasure.legendary.crown_of_resolve.headgear
      description: 'Crown source_text matches PDF 211 verbatim; +15 RES is typed and the "prevents the use of a helmet or cap" restriction is a typed constraint (require wearing_helmet_or_cap false). The Armour table on PDF 180 lists four Head items (Padded Cap, Leather Cap, Mail Coif, Helmet); the book does not say whether the Mail Coif, head armour that is neither a helmet nor a cap, is also prevented. Recorded as a new issue; the supplied boolean does not settle it, which is the right modelling.'
