          pdf_page: 185
          printed_page: 183
          heading: Tools
      disposition:
        status: recorded_as_issue
        issue_id: issue.settlement.fishing_gear_local_price
    - kind: ok_with_note
      section_id: section.settlements.whiteport
      object_id: character.settlement.profile.whiteport
      description: '"Inn: 15c per party, per night. There are also gambling opportunities." is verbatim in the rule and the table row. Changelog 2.21 entry 80 (rendered changelog page 13) asks whether Whiteport is the only town where you can gamble and is marked Fixed with empty change and comment cells, so it states no rule. issue.settlement.whiteport_gambling_scope records it correctly as unresolved and evidence-only, the printed line is unchanged, and both the Whiteport profile and listed_services return the issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 137
          printed_page: 135
          heading: Whiteport
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 13
          printed_page: null
          heading: '2.21'
          locator:
            row: '80'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.the_outpost
      object_id: character.settlement.profile.outpost
      description: 'The Outpost rule quotes the description sentence "All expeditions into these lands must start from the outpost by law." and then, after an unprinted "..." elision marker, the verbatim services list; both passages are verbatim. The toll (100 c per hero, to the King, Ancient Lands quest sites yellow 1-12, paid first) and the League membership requirement match the page. The Ancient Lands qualifier is carried in the ancient_lands_quest_sites field and the dependency procedure.ancient_lands_expedition rather than in a when clause. That procedure belongs to section.quest_book_i.quests_into_the_ancient_lands and was not examined here; its source_text paraphrases the Outpost line ("start from the Outpost, where a toll of 100 c per hero is paid first") and should be checked against PDF 138 when that unit is reviewed. The Outpost coverage row claims procedures: extracted on the strength of that out-of-unit object.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 138
          printed_page: 136
          heading: The Outpost
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.silver_city
      object_id: settlement.silver_city
      description: "PDF 140 is a full-page Silver City map with no folio; pages.yaml labels it printed 138 with a note, and settlement.silver_city cites it with that label. The labels named in the coverage note (The Temple Grounds, The Rangers Guild, The Fighters Guild, The Market, Jarl's Palace, The Screaming Hog, The Alchemists Guild, The Wizards Guild, The Dark Guild, The Asylum, The Flying Wheel, Bergmeister Estate) match the render, and the map prints no rule, price or service term. The page lies outside section.settlements.silver_city (PDF 138 only) and belongs to the parent section.settlements; acceptable for an image source."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 140
          printed_page: 138
          heading: Silver City
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.the_silver_city
      description: "The boxed sidebar The Silver City is italic setting prose (third largest city, named for its closed silver mines, decay, crime and the Jarl's punishments). It states no rule, term, table, example, procedure or catalogue entry, so its all-not_applicable dispositions are genuine and hide no unfinished work."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 138
          printed_page: 136
          heading: The Silver City
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.the_ancient_lands
      description: 'The boxed sidebar The Ancient Lands is italic setting prose (desert and green lands, tombs and ruins, gods akin to the Dark Gods, hostile tribes). It states no mechanic; the Ancient Lands toll and membership are printed under The Outpost. Its all-not_applicable dispositions are genuine.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 139
          printed_page: 137
          heading: The Ancient Lands
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.freyfell
      object_id: settlement.freyfell
      description: 'The eleven settlement.* entities quote their description paragraphs verbatim, including the printed "are on a very friendly terms" in Durburim. "Kennel: See Companions compendium." in Caelkirk and Freyfell is cited through external_references companions_compendium, which source/manifest.yaml marks not_present, and nothing from that book is invented; the Freyfell bloodhound availability 5 is printed on this page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 136
          printed_page: 134
          heading: Freyfell
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 139
          printed_page: 137
          heading: Durburim
