    - kind: ok_with_note
      section_id: section.settlements.caelkirk
      object_id: character.settlement.profile.caelkirk
      description: 'The eleven character.settlement.profile.* rules quote their lists verbatim and their typed effects match the page: Coalfell weapons and armour +1/-10%, general -2/+20%; Durburim weapons +1/+20%, armour 0/+10%, general -1/+20%; Birnheim weapons -1/+20%, armour +1/+20%, general -2/+20%; Outpost weapon and armour price +20% with availability 0, general -2/+20%; Freyfell and Whiteport general +1/-10%; Windfair general -1/+10%; Caelkirk all -2/+10%; every lodging price; unnoted modifiers 0 per the introductory paragraph. Caelkirk prints "Blacksmith: Equipment availability -2, price +10%"; applying it to weapons and armour follows Blacksmith (PDF 144, "sell and buy weapons and armour"). Only Whiteport and Rochdale set blacksmith_available false; settlements with a Blacksmith do not set it true, and the services list carries the absence anyway. Not an error.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 136
          printed_page: 134
          heading: Caelkirk
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 137
          printed_page: 135
          heading: Rochdale
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.settlements.caelkirk
      object_id: character.settlement.profile.caelkirk
      description: 'Caelkirk, Whiteport and Windfair print "Fishing gear 50 c, availability 6" directly above a store-wide "Equipment availability ..., price ..." line, while the Tools table prices Fishing Gear at 40 c, availability 5. The book does not say whether the fishing-gear figures are final or are further adjusted by the same store-wide line, and the three profiles record both values without saying which governs. Recorded as a new unresolved issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 136
          printed_page: 134
          heading: Caelkirk
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 137
          printed_page: 135
          heading: Windfair
        - document: rulebook.second_printing.eng
