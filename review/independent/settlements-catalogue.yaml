  outcome: passed
  summary: Rendered and read PDF 136-140 (printed 134-138; PDF 140 is the unfolioed Silver City map), PDF 185 (Tools) for the base Fishing Gear price, and changelog 2.21 page 13 for entry 80. All eleven settlement service lists, prices, availability and price modifiers, Dwarven-made durability lines and the Outpost toll match the page verbatim in the profiles table, the profile rules and the entities. The two setting sidebars are genuinely not_applicable, and the Whiteport gambling question from changelog entry 80 stays correctly unresolved. One unrecorded ambiguity (the fishing-gear line against the store-wide modifier in Caelkirk, Whiteport and Windfair) was recorded as issue.settlement.fishing_gear_local_price. No open findings.
