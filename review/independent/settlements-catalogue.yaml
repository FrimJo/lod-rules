    - kind: ok_with_note
      section_id: section.settlements.the_settlements_of_the_southern_part_of_the_kingdom
      object_id: table.settlement.profiles
      description: 'All eleven rows of table.settlement.profiles compared line by line with the Available Services lists on PDF 136-139. Every service name, inn price (35c, 25 c, 35c, 15c, 15c, 20c, 35c, 25 c, 25 c, 65 c, 65 c), availability and price modifier, fishing-gear line, the Freyfell bloodhound availability 5, every temple list, the Durburim and Birnheim Dwarven-made +2 Durability lines (including lower-case "durability" and "Armours" in Birnheim) and the Outpost toll text are verbatim, including the printed spacing variants ("35c" against "25 c"). Row order follows the page reading order. The introductory paragraph is verbatim in the table and in character.settlement.listed_services.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 136
          printed_page: 134
          heading: The Settlements of the Southern Part of the Kingdom
