  findings:
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: character.equipment.consumable.ration.use
      description: >-
        Re-review of the open finding of review.appendix_iii_general_equipment_a.4. Changelog 2.21
        entry 183 (changelog PDF 26, Fixed) reads "Page 180 changed Ration to 1 instead 1/1. Can
        only be used while resting. No need for Quick Slot." and never mentions overland travel; the
        Ration row on PDF 182 prints "Rations are used during overland travel and during short
        rests." The overland_travel field description now reads "the party is on overland travel
        (the printed use; whether changelog 2.21 entry 183 withdraws it is
        issue.equipment.ration_overland_travel_use)", so it no longer takes a side on the open
        question. The coverage note for ...consumables.table now credits only the resting
        restriction and the Quick Slot change to entry 183 and says "the printed overland-travel
        use is kept as printed", listing the companion issue as Open. The rule still lists both
        issues, and the require branch (resting or overland_travel) is an acceptable provisional
        model of the printed use while issue.equipment.ration_overland_travel_use stays unresolved.
        These two objects are the only ones whose digests changed since record .4.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 183
      disposition:
        status: corrected
        change: >-
          character.equipment.consumable.ration.use: overland_travel field description changed to
          "the party is on overland travel (the printed use; whether changelog 2.21 entry 183
          withdraws it is issue.equipment.ration_overland_travel_use)"; coverage note for
          section.appendix_iii_equipment.general_equipment.consumables.table reworded to keep the
          overland-travel use as printed and no longer attribute it to entry 183.
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: character.equipment.consumable.ration.use
      description: >-
        Wording only. The rule's name "consumable ration used while resting" and the coverage
        note's "only while resting and with no Quick Slot, per changelog 2.21 entry 183; the
        printed overland-travel use is kept as printed" both lead with the resting restriction while
        the typed require also admits overland travel. Read in full, each defers to the open issue
        and neither contradicts the page or the ruling, so no change is needed; a later edit could
        name the rule neutrally (for example "consumable ration use").
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.alchemy.table
      object_id: table.equipment.alchemy
      description: >-
        Every cell of the four in-scope tables was compared again with the rendered pages. Alchemy
        (PDF 181), 8 rows: Alchemist Belt - / 6 / 300 c / 3; Alchemist Tool 5/1 / 6 / 200 c / 3;
        Empty Bottle -/1 / 1 / 10 c / 5; Healing Potion 1/1 / 1 / 75/100 c / 4; Potion of Cure
        Disease 1/1 / 1 / 125 c / 3 and (Weak) 90 c / 3; Potion of Cure Poison 125 c / 3 (Special
        without final full stop, kept) and (Weak) 90 c / 3. Animals and transportation (PDF 181), 5
        rows with ENC and DUR "-": Horse 1000 c / 4, Camel 1250 c / 3, Saddlebags 250 c / 4 (missing
        full stop after "camel" kept), Mule 800 c / 4 ("A mule let you" kept), Wagon 1500 c / 3.
        Consumables (PDF 182): Beef Jerky -/3 / 1 / 10 c / 5; Dwarven Ale 2/1 / 1 / 100 c / 2;
        Ration 1/1 / 1 / 5 c / 5; Tobacco -/1 / - / 50 c / 4. Jewellery (PDF 182): Necklace and Ring
        - / - / 150 c / 4; both Religious Relics - / - / 500 c / 2. Special texts are verbatim. The
        row rules type the printed values (6 extra slots and -1 belt durability, Weak/Standard
        healing branches, 75% as percentile <= 75, 1 AP and 1 HP, -10 / +20 RES, 10/100/500
        Encumbrance Points, after_quest for Saddlebags against after_dungeon for Mule and Wagon,
        Wagon requires a horse, Camel outpost-only with Outpost modifiers off, Warrior Priest for
        the relics), and the five Tobacco rules match the note on PDF 182. Entities, fixtures,
        section spans (checked against pages.yaml) and coverage component flags match the pages.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 181
          printed_page: 179
          heading: Alchemy
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
