        Weak or Supreme rows 11 and 12 print 75/200 for Potion of Cure Disease and Potion of Cure
        Poison, and the Standard table prints 100 for both, against 125 c and 90 c (Weak) on PDF
        181. Healing Potion 75/100 c matches Potion of Health (75/200 and 100). The issue is
        accurate and both copies are kept as printed.
