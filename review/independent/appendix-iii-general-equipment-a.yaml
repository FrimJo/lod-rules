        The Tobacco note on PDF 182 is reproduced verbatim across the five tobacco rules (purchase,
        bonus, addiction_test, withdrawal, recover). Withdrawal keys on addicted == true and
        brought_tobacco_kit_on_quest == false, matching "must bring a kit of tobacco on every quest or
        suffer a -10 modifier to RES instead"; the tobacco fixtures cite section ...consumables,
