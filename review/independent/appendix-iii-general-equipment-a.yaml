        the printed condition, instead of tobacco_equipped. source_text is verbatim.
        test.equipment.batch_three.tobacco_withdrawal uses the new input and the added
        test.equipment.batch_three.tobacco_withdrawal_kit_brought checks that bringing a kit avoids
        the -10.
