      section_id: section.appendix_iii_equipment.general_equipment.alchemy.table
      object_id: table.equipment.alchemy
      description: >-
        Every cell of the four tables on PDF 181-182 matches the page: 8 Alchemy rows, 5 Animals and
        transportation rows, 4 Consumables rows and 4 Jewellery rows, with ENC (including -/1, -/3,
        5/1, 2/1), DUR, Special text, Cost and Avail. as printed. Printed slips are kept verbatim
        (Saddlebags "horse or camel This", Mule "A mule let you", no full stop after "Removes all
        effects of poison" and "75% chance to remove all effects of poison"). Every row resolves to
        one equipment.* entity through table_rows, with rule_refs for its Special cell; the dice in
        "(1d4/1d6 healing)" are typed as dice fields on healing_potion.weak and .standard, the 75%
        as a percentile <= 75 condition, and the Warrior Priest restriction as a require. The
        Alchemist Belt "ready slots" wording agrees with Alchemist Belt on PDF 72 (printed 70:
        "These slots expand the standard 3 Quick Slots to 9"). The "-" markers use meaning
        no_increase, the only fitting value the table schema offers, as in the reviewed Equipment
        chapter tables; column ids differ (dur in two tables, durability in two) without effect.
