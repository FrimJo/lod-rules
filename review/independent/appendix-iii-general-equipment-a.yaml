  findings:
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: character.equipment.consumable.ration.use
      description: >-
        Re-review of review.appendix_iii_general_equipment_a.2 finding 3. The Ration row on PDF 182
        prints ENC 1/1 and "Rations are used during overland travel and during short rests. 1 Ration
        can sustain the entire party for one day or one rest." Changelog 2.21 entry 183 (changelog
        PDF 26, Fixed) reads "Page 180 changed Ration to 1 instead 1/1. Can only be used while
        resting. No need for Quick Slot." The rule's issues list now names both
        issue.equipment.ration_quick_slot and the unresolved
        issue.equipment.ration_overland_travel_use, so the overland-travel branch of the require is
        flagged as unsettled, and the coverage row
        section.appendix_iii_equipment.general_equipment.consumables.table names
        issue.equipment.ration_overland_travel_use as Open and ration_quick_slot as Resolved.
        source_text keeps the printed row with its 1/1 cell; both sources are cited.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 183
      disposition:
        status: corrected
        change: >-
          character.equipment.consumable.ration.use: issue.equipment.ration_overland_travel_use added
          to issues; coverage notes for ...consumables.table list it as Open.
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: issue.equipment.ration_overland_travel_use
      description: >-
        Re-review of review.appendix_iii_general_equipment_a.2 finding 4. Rendered PDF 126 (printed
        124) opens Rations and Resting with "The party requires one ration per day to sustain
        themselves."; PDF 127 (printed 125) carries "Once per day the party rests." The issue now
        reads "Rations and Resting (PDF 126-127, printed 124-125)" and cites both pages under heading
        Rations and Resting, alongside PDF 182 (Consumables, Ration row) and changelog PDF 26 entry
        183. The summary quotes both pages accurately and leaves the question unresolved.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 126
          printed_page: 124
          heading: Rations and Resting
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 127
          printed_page: 125
          heading: Rations and Resting
      disposition:
        status: corrected
        change: >-
          issue.equipment.ration_overland_travel_use: PDF 126 (printed 124) source added and summary
          reworded to PDF 126-127, printed 124-125.
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: issue.equipment.ration_quick_slot
      description: >-
        New. The resolved issue.equipment.ration_quick_slot ends its summary with "The entry does not
        withdraw the printed overland travel use." Changelog 2.21 entry 183 (changelog PDF 26) says
        only "Can only be used while resting. No need for Quick Slot." and does not mention overland
        travel; whether "only ... while resting" withdraws the printed "used during overland travel"
        (PDF 182) is exactly the question left open by the unresolved
        issue.equipment.ration_overland_travel_use. The resolved issue therefore states as settled the
        reading that the companion issue records as uncertain, and a reader of the resolved issue
        alone sees the overland use as confirmed by the ruling. The resolution's own wording
        ("allows a Ration only while resting or on the printed overland travel") correctly describes
        the applied model and needs no change.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 183
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
      disposition:
        status: open
        proposed_correction: >-
          issue.equipment.ration_quick_slot: replace the last summary sentence "The entry does not
          withdraw the printed overland travel use." with "The entry does not mention the printed
          overland travel use; whether it withdraws it is recorded in
          issue.equipment.ration_overland_travel_use." No other field needs to change.
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment
      object_id: issue.phase6.iron_wedges_movement
      description: >-
        Edited issue checked against rendered pages. Miscellaneous on PDF 184 (printed 182), row Iron
        Wedges: "Any enemy (wandering monster or monster already on the table) will need 6 AP to pass
        the door." Wandering Monsters on PDF 92 (printed 90): "A magically sealed door or Iron Wedged
        door will stop the token for that turn, and it must roll 5-6 to continue through the door
        next turn, instead of the normal 2-6." Enemies and doors on PDF 118 (printed 116): "A door
        blocked with Iron Wedges will add 3 turns ... to the above-mentioned requirements." Changelog
        2.21 entry 122 (changelog PDF 20) lists the three versions and the designer's options and is
        marked Fixed with only "See above", so it settles nothing. The PDF 184 source now carries
        heading Miscellaneous with table/row locator, all four sources carry correct PDF and printed
        pages, and the related list includes section.appendix_iii_equipment.general_equipment and the
        Iron Wedges rule and entity. The changelog source still has visually_verified false although
        the page matches the summary; harmless.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
