        Official rulings convention: the table cell keeps the printed "1/1" and the printed Special
        text, the rule sets quick_slot_needed false and requires a rest, both sources are cited, and
        the fixtures ration_while_resting and ration_outside_rest do not depend on the uncertain
        overland branch. source_text is the printed Ration row joined with " | " cell separators,
        which reproduces every printed cell.
      source:
