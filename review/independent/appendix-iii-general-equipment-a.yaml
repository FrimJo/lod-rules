  findings:
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: issue.equipment.ration_quick_slot
      description:
        Re-review of review.appendix_iii_general_equipment_a.3 finding 3. Changelog 2.21 entry
        183 (changelog PDF 26, Fixed) reads "Page 180 changed Ration to 1 instead 1/1. Can only be
        used while resting. No need for Quick Slot." and does not mention overland travel; the
        Ration row on PDF 182 prints ENC 1/1 and "Rations are used during overland travel and during
        short rests." The resolved issue now ends its summary with "The entry does not mention the
        printed overland travel use; whether it withdraws it is recorded in
        issue.equipment.ration_overland_travel_use.", which quotes both sources accurately and
        defers to the unresolved companion issue. Its sources (PDF 182 Consumables/Ration and
        changelog PDF 26 row 183) and resolution are unchanged and still match the pages. This was
        the only object whose digest changed since record .3.
      source:
        - &a2
          document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 183
        - &a1
          document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
      disposition:
        status: corrected
        change:
          'issue.equipment.ration_quick_slot: last summary sentence replaced with "The entry does not
          mention the printed overland travel use; whether it withdraws it is recorded in
          issue.equipment.ration_overland_travel_use."'
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: character.equipment.consumable.ration.use
      description:
        'New. The same side-taking that record .3 found in the resolved issue survives in the
        rule itself: the overland_travel field description reads "the party is on overland travel
        (the printed use the ruling does not withdraw)". Entry 183 on changelog PDF 26 says only
        "Can only be used while resting." and never mentions overland travel, and
        issue.equipment.ration_overland_travel_use (unresolved, listed in this rule''s issues)
        records exactly whether that sentence withdraws the printed overland use (PDF 182) or only
        restricts in-dungeon use; Rations and Resting (PDF 126, printed 124: "The party requires
        one ration per day"; PDF 127, printed 125: "Once per day the party rests") fits either
        reading. A consumer reading the field description sees the question as settled. The require
        branch itself is acceptable as a provisional model because the rule lists the open issue.
        The coverage note for ...consumables.table says ".ration.use (only while resting or on
        overland travel, no Quick Slot, per changelog 2.21 entry 183 ...)", which likewise
