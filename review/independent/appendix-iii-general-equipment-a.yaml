  findings:
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables
      object_id: character.equipment.consumable.tobacco.withdrawal
      description: >-
        The Tobacco note on PDF 182 reads "If addicted, the hero must bring a kit of tobacco on every
        quest or suffer a -10 modifier to RES instead." The rule conditions the -10 on
        tobacco_equipped == false, borrowing the qualifier of the bonus sentence ("Whenever equipped
        with tobacco"). The printed condition is bringing a kit on the quest, not having it equipped:
        as typed, an addicted hero who brings a kit but has not equipped it would wrongly take -10.
        source_text is verbatim.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Tobacco
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.consumable.tobacco.withdrawal: replace the tobacco_equipped input with
          one for the printed condition (for example brought_tobacco_kit_on_quest, "the hero brought
          a kit of tobacco on this quest") and compare it with false; update
          test.equipment.batch_three.tobacco_withdrawal inputs to match.
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: test.equipment.batch_three.tobacco_addiction
      description: >-
        The four tobacco fixtures (tobacco_purchase_limit, tobacco_addiction, tobacco_withdrawal,
        tobacco_recovery) cite section ...consumables.table with heading Consumables and locator row
        Tobacco. The rules they exercise (tobacco.purchase, .addiction_test, .withdrawal, .recover)
        are typed from the separate Tobacco note below the table on PDF 182 and carry section_id
        section.appendix_iii_equipment.general_equipment.consumables and heading Tobacco. The table
        row only says "See separate note on tobacco."; it prints none of the purchase limit, RES
        test, -10 or two-quest recovery.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Tobacco
      disposition:
        status: open
        proposed_correction: >-
          test.equipment.batch_three.tobacco_purchase_limit, .tobacco_addiction, .tobacco_withdrawal
          and .tobacco_recovery: set section_id to section.appendix_iii_equipment.general_equipment.consumables
          and cite heading Tobacco (no table/row locator), matching the rules they test.
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.alchemy.table
      object_id: table.equipment.alchemy
      description: >-
        The Alchemy table prints Avail. 4 for Healing Potion (Weak or Standard) and 3 for the four
        cure potions, including the Weak ones. Buying and Selling (PDF 144, printed 142) lets the
        General Store sell anything on the Appendix III general equipment list subject to the
        Availability Roll, while The Magic Brewery says "All weak potions are always available,
        standard potions have availability of 5 and supreme 4." The relation between the two
        availabilities was not recorded. I rendered PDF 144 and recorded it as a new issue; both
        copies stay as printed and the frozen character.settlement.magic_brewery is not listed in
        related so as not to touch its record.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 181
          printed_page: 179
          heading: Alchemy
          locator:
            table: Alchemy
            row: Healing Potion
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 144
          printed_page: 142
          heading: The Magic Brewery
      disposition:
        status: recorded_as_issue
        issue_id: issue.equipment.potion_shop_availability
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.jewellery.table
      object_id: table.equipment.jewellery
      description: >-
        issue.equipment.religious_relic_rows checked against the rendered PDF 158 (printed 156):
        Buying Special Equipment prints both Religious Relic rows with Enc "-", Durability 1, 500 c,
        Availability 4 and the Special "See table under 'Treasures' chapter for variants." (no
        Warrior Priest sentence); the Jewellery table on PDF 182 prints DUR "-", 500 c, Avail. 2 and
        the Warrior Priest sentence. The issue states this exactly and both copies are kept as
        printed. The Inner Sanctum copies are separate entities (equipment.guild.religious_relic_*),
