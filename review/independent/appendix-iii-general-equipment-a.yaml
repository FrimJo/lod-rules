        sources, Miscellaneous, Tools, Sell and Repair Table) are in the General Equipment root's
        page span and were rendered and read, but their tables, entities and rules belong to sibling
        sections outside this unit and were not compared. Changelog 2.21 entry 89 (rendered
        changelog page 15: "Added 3 bandages to all types.", Fixed) concerns the Miscellaneous
        Bandage rows on PDF 184; it is recorded, not applied, in issue.equipment.bandage_uses, which
        matches the page, and is left to the Miscellaneous review. No changelog entry I found
        touches the four tables in this unit.
