        requires one ration per day and 'Once per day the party rests'" and cites only PDF 127. On the
        rendered pages, "The party requires one ration per day to sustain themselves." opens Rations
        and Resting on PDF 126 (printed 124); PDF 127 (printed 125) carries the continuation with
        "Once per day the party rests." The first quotation is cited to the wrong page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 126
          printed_page: 124
          heading: Rations and Resting
        - document: rulebook.second_printing.eng
