    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: character.equipment.consumable.ration.use
      description: >-
        New since record .1. The Ration row on PDF 182 prints ENC 1/1 and "Rations are used during
        overland travel and during short rests." Changelog 2.21 entry 183 (changelog PDF 26, Fixed)
        reads "Page 180 changed Ration to 1 instead 1/1. Can only be used while resting. No need for
        Quick Slot." The rule requires resting OR overland_travel, so it keeps an overland-travel use
        outside a rest that the literal ruling ("Can only be used while resting") may withdraw. That
        uncertainty is recorded in issue.equipment.ration_overland_travel_use (unresolved, related to
        this rule), but the rule's own issues list names only the resolved
        issue.equipment.ration_quick_slot, and the consumables.table coverage note lists only the
        resolved issue as "Open". The extraction guide requires executable unresolved effects to
        reference an unresolved issue; as written, a consumer of the rule sees the overland branch as
        settled.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 182
          printed_page: 180
          heading: Consumables
          locator:
            table: Consumables
            row: Ration
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 183
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.consumable.ration.use: add issue.equipment.ration_overland_travel_use to
          its issues list (keeping issue.equipment.ration_quick_slot). Coverage row
          section.appendix_iii_equipment.general_equipment.consumables.table: name
          issue.equipment.ration_overland_travel_use as open in the notes.
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.consumables.table
      object_id: issue.equipment.ration_overland_travel_use
      description: >-
