    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.alchemy.table
      object_id: table.equipment.alchemy
      description: >-
        Every cell of the four in-scope tables matches the rendered pages. Alchemy (PDF 181) 8 rows:
        Alchemist Belt - / 6 / 300 c / 3; Alchemist Tool 5/1 / 6 / 200 c / 3; Empty Bottle -/1 / 1 /
        10 c / 5; Healing Potion 1/1 / 1 / 75/100 c / 4; Potion of Cure Disease 1/1 / 1 / 125 c / 3;
        its (Weak) 90 c / 3; Potion of Cure Poison 125 c / 3 (no final full stop, kept); its (Weak) 90
        c / 3. Animals and transportation 5 rows with ENC and DUR "-" (1000, 1250, 250, 800, 1500 c;
        Avail. 4, 3, 4, 4, 3), printed slips "horse or camel This" and "A mule let you" kept.
        Consumables 4 rows (Beef Jerky -/3, 1, 10 c, 5; Dwarven Ale 2/1, 1, 100 c, 2; Ration 1/1, 1, 5
        c, 5; Tobacco -/1, -, 50 c, 4). Jewellery 4 rows (Necklace and Ring 150 c / 4; both
        Religious Relics 500 c / 2). Entities, row rule_refs and the 18 fixtures agree with the
        printed cells: 1d4/1d6 dice fields, 75% as percentile <= 75 (75 passes, 76 fails), belt
        durability -1, Saddlebags "after the quest" against Mule/Wagon "after the dungeon".
        table.equipment.alchemy lists only issue.equipment.cure_potion_prices in its issues and the
        alchemy.table coverage notes name only that issue as open, although the unresolved
        issue.equipment.potion_shop_availability also relates to the table; the table carries no
        executable effect and the issue's related list binds it, so no change is required.
      source:
        - document: rulebook.second_printing.eng
