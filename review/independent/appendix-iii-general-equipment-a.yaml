        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment
      object_id: issue.equipment.ration_overland_travel_use
      description: >-
        The two Ration issues quote both sources accurately: issue.equipment.ration_quick_slot
        (resolved by entry 183, keeping the printed 1/1 and dropping the Quick Slot need) and
        issue.equipment.ration_overland_travel_use (unresolved). Rations and Resting on PDF 126
        ("The party requires one ration per day") and PDF 127 ("Once per day the party rests")
        fit either reading, as the issue says, and no other published ruling on changelog page 26
        settles it. PDF 183-186 (Light sources, Miscellaneous, Tools, Sell and Repair Table) were
        rendered and read as part of the parent span; their objects belong to sibling sections
        outside this unit and were not compared.
