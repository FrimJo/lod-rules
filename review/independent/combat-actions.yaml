        (printed 111), where "an unmodified result of >=90 hits the other model" and the example
        "If any of shooter's roll >=90 ..." are printed, and against PDF 116 (Hero Attack chart,
        "Did you roll 00? ... Missed!"). In procedure.combat_attack the intervening step carries
