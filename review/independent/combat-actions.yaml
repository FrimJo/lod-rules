  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:a80f1beb8e4163f9baec98f046b7408521312aa5cc853405e7230bef38e3e6ea
  findings:
    - kind: modelling_error
      section_id: section.combat.hero_attack
      object_id: procedure.combat_attack
      description:
        Re-review of review.combat_actions.1 (91-00 on attack). The hit step now requires roll
        lte 90 as well as roll lte threshold, and it cites and quotes Dice Rolling and Skill Checks
        (PDF 18) verbatim, including "(including hitting its target in combat)" and "A roll of 91-00
        is always a failure, no matter what your skill level or modifiers are." The intervening step
        (unmodified >=90 hits the other model) is a separate rule and was left alone, as proposed.
        Verified on PDF 18 and 116.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
      disposition:
        status: corrected
        change: procedure.combat_attack hit step requires roll lte 90 and cites PDF 18.
    - kind: modelling_error
      section_id: section.combat.throwing_potions
      object_id: procedure.thrown_preparation
      description:
        Re-review (91-00 on a throw). The hit step requires roll lte threshold AND roll lte 90
        and quotes "A successful RS is required to hit" (PDF 117) with the PDF 18 sentences. The
        procedure-level source now lists PDF 18. Verified on PDF 117 and 18.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Throwing Potions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
      disposition:
        status: corrected
        change: procedure.thrown_preparation hit step requires roll lte 90 and cites PDF 18.
    - kind: modelling_error
      section_id: section.combat.throwing_potions
      object_id: procedure.thrown_preparation
      description:
        Re-review (door modifier). The door step now applies the -10 when through_door AND
        in_front_of_door eq false, matching "unless they are standing in one of the two squares
        directly in front of the door". adjacent_to_door now only routes a failed toss (scatter and
        door_scatter steps), matching "If not adjacent to the door, and the toss is a failure". This
        agrees with combat.throwing.door_opening and combat.throwing.door_miss. Verified on PDF 117.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Throwing Through a Door Opening
      disposition:
        status: corrected
        change:
          New input in_front_of_door gates the door -10; adjacent_to_door is used only for where a
          failed toss lands.
    - kind: modelling_error
      section_id: section.combat.different_combat_actions
      object_id: procedure.combat_shove
      description:
        Re-review (displacement order). procedure.combat_shove now takes displacement_case
        (straight_free, push_model_behind, diagonal, blocked) as a supplied input. The
        displacement_case_check step requires that the chosen case's conditions hold, and the
        straight, second, diagonal and blocked steps each fire only for their own case. Diagonal no
        longer takes precedence over pushing the model behind, which matches the open question on
        PDF 111 and the choice in combat.action.shove.displacement. The procedure lists
        issue.combat.shove_displacement_order, and that issue's related list includes
        procedure.combat_shove. The Shoving caption fixtures (PDF 112) still match.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Shove
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Shove
      disposition:
        status: corrected
        change: displacement_case input with branch conditions, a displacement_case_check step and a
          bidirectional link to issue.combat.shove_displacement_order.
    - kind: uncertainty_not_recorded
      section_id: section.combat.different_combat_actions
      object_id: combat.action.shove.success
      description:
        Re-review. issue.combat.shove_automatic_failure is still unresolved. Its summary now
        says that the attack and throw hit steps apply the 91-00 automatic failure and that only the
        roll-over Shove test stays open. combat.action.shove.success and procedure.combat_shove both
        list the issue. As the caller instructed, Shove was left open. The success step still treats
        91-99 as successes, as the issue records, and the example "26 and up" (PDF 112) is
        consistent with that.
      source:
