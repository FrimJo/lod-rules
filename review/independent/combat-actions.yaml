  findings:
    - kind: transcription_error
      section_id: section.combat.fumble
      object_id: procedure.combat_attack
      description:
        Re-review of the open finding in review.combat_actions.2 (enemy fumble quotation). The
        enemy_fumble and enemy_fumble_falls_over steps now both quote the whole printed sentence
        from Enemy Fumbles (PDF 120, printed 118), "An enemy that rolls 100 when attacking drops its
        weapon, if it has one, or falls over.", character for character. The effects are unchanged.
        enemy_fumble sets enemy_dropped_weapon when enemy_has_weapon is true, and
        enemy_fumble_falls_over sets enemy_prone when it is false. Both require is_hero false and
        roll 100. That agrees with the printed sentence and with changelog 2.21 entries 68 and 123,
        which I re-rendered (changelog p. 10 and p. 21, both marked Fixed).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Enemy Fumbles
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 10
          printed_page: null
          heading: '2.21'
          locator:
            row: 68
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
            row: 123
      disposition:
        status: corrected
        change:
          The source_text of both enemy fumble steps is the full printed Enemy Fumbles sentence; the
          effects are unchanged.
    - kind: modelling_error
      section_id: section.combat.general_principles_of_combat
      object_id: procedure.combat_attack
      description:
        Re-review of the open finding in review.combat_actions.2 (the unprinted lt 100 cut-off on a
        shot past a model). The intervening step still applies "an unmodified result of >=90 hits
        the other model" (PDF 113) to rolls of 90-99 only (gte 90, lt 100). A new step,
        intervening_fumble_unresolved, fires when mode is ranged, passed_models is true and the roll
        is 100. It returns an unresolved effect for issue.combat.shooting_past_fumble. It cites
        PDF 113 and the Hero Attack chart (PDF 116), and it quotes the PDF 113 sentence verbatim.
        hero_fumble and fumble_durability still run at 100 because Fumble covers any hero 100. The
        procedure's issues list issue.combat.shooting_past_fumble, and so do
        combat.principles.shooting_past_model's issues. The issue's related list names both objects,
        so the links run both ways. The supporting test in tests/rules/combat-procedures.test.ts
        (100 returns the issue with hit false and no damage_target; 99 hits model D; 100 without a
        passed model does not return the issue) passes. Verified on PDF 113 and 116.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Obstacles and LOS When Shooting
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
      disposition:
        status: corrected
        change: intervening covers 90-99; the new intervening_fumble_unresolved step returns
          issue.combat.shooting_past_fumble for a roll of 100; the issue is listed on the procedure
          and on combat.principles.shooting_past_model and names both in related.
    - kind: uncertainty_not_recorded
      section_id: section.combat.general_principles_of_combat
      object_id: combat.principles.shooting_past_model
      description:
        The book does not say what an unmodified 100 does on a shot past another model. The >=90
        sentence and the shooting example on PDF 113 conflict with the Hero Attack chart's "Did you
        roll “00”? ... Missed!" on PDF 116 and with Fumble on PDF 112. The issue stays unresolved.
        Its summary quotes all three passages accurately and describes the current modelling. The
        rule still fires on any roll of 90 or more and carries the issue. The printed example
        fixtures (test.combat.shooting_example_b_90_hits_d and the derived 89 boundary) still match
        the example on PDF 113.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Obstacles and LOS When Shooting
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
      disposition:
        status: recorded_as_issue
        issue_id: issue.combat.shooting_past_fumble
    - kind: coverage_error
      section_id: section.combat.general_principles_of_combat
      description: >-
        New in this pass. The coverage note for section.combat.general_principles_of_combat was
        not updated for the correction above. It still lists only "the attempt, hit and intervening
        steps of procedure.combat_attack" and ends "Open: issue.combat.long_range_weapons; ...". It
        names neither the intervening_fumble_unresolved step nor issue.combat.shooting_past_fumble,
        which is an open conflict recorded against combat.principles.shooting_past_model in this
        section (PDF 113). A reader of the note alone would think the >=90 rule applies without
        qualification and that only one issue is open.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Obstacles and LOS When Shooting
      disposition:
        status: open
        proposed_correction:
          In the coverage note of section.combat.general_principles_of_combat, change the procedures
          clause to "the attempt, hit, intervening (rolls of 90-99) and intervening_fumble_unresolved
          steps of procedure.combat_attack" and add issue.combat.shooting_past_fumble to the Open
          list (an unmodified 100 on a shot past a model is unresolved). Leave status and components
          unchanged.
    - kind: ok_with_note
      section_id: section.combat.fumble
      object_id: procedure.combat_attack
      description:
        Bookkeeping notes, not rules errors. (1) The changelog sources on the enemy_fumble and
        enemy_fumble_falls_over steps, like the resolution sources of issue.combat.enemy_fumble,
        still say visually_verified false. I rendered changelog p. 10 (entry 68) and p. 21 (entry
        123), and their text matches the citation. (2) The intervening_fumble_unresolved step cites
        PDF 116 but quotes only the PDF 113 sentence. Adding the chart labels "Did you roll “00”?
        ... Missed!" would show both sides of the conflict. (3) issue.combat.power_timing lists
        procedure.combat_attack in related, and issue.phase4.durability_overlap is returned by the
        magic_fumble step, but in each case only one side carries the link. None of these changes a
        rule.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Enemy Fumbles
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.different_combat_actions
      object_id: combat.action.shove.displacement
      description: >-
        Fresh check of the whole unit. Of the 160 examined objects, only procedure.combat_attack,
        combat.principles.shooting_past_model and issue.combat.shooting_past_fumble changed since
        review.combat_actions.2. I still re-read every rule and table against PDF 109-117.
        Every rule source_text on those pages is verbatim, including the printed typos ("will does
        so", "is immediately be removed", "but to can also be reloaded", "does not re-roll"). The
        headings and printed pages are right, and the AP lists are complete (0 AP: 2 items, 1 AP:
        14, 2 AP: 5). Both Hero Attacking tables match PDF 115 cell by cell (10 close-combat rows
        and 8 shooting rows, the modifiers +30 to -X), and the cumulative line is a footnote on each.
        procedure.combat_turn follows the Combat Turn chart (PDF 114), including the footer. The
        Shove example and caption fixtures and the shooting example fixtures quote PDF 112-113
        verbatim. The coverage notes of the other eleven rows match the pages. Rulings 67, 68, 123
        and 160 are applied and 162 is recorded, as in record 2. Pages 118-124 (the rest of the
        chapter root span) were read; their content belongs to other units.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Shove
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
        - document: rulebook.second_printing.eng
