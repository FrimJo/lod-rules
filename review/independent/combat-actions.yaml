  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:95461ce4af3898a9f9a48561e904a7e373defaab7f1ea1db52583e16d3ba94bd
  findings:
    - kind: modelling_error
      section_id: section.combat.hero_attack
      object_id: procedure.combat_attack
      description:
        The hit step requires `roll lt 100 AND roll lte threshold`, and the attempt step says
        "A fumble 100 misses". Dice Rolling and Skill Checks (PDF 18) applies to "hitting its target
        in combat" and says "A roll of 91-00 is always a failure, no matter what your skill level or
        modifiers are." The Hero Attack chart (PDF 116) calls the roll "Make skill check (CS)" /
        "Make skill check (RS)". With modifiers that push the threshold to 91 or more (for example
        +30 against a prone enemy), the procedure lets rolls of 91-99 hit, which the book forbids.
        The 100-only miss is not printed anywhere in this unit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
      disposition:
        status: open
        proposed_correction:
          In the hit step, require roll lte 90 as well as roll lte threshold (or apply
          core.check.automatic_failure, rule_refs and a PDF 18 citation), and change the attempt
          step text to the printed rule. Leave the intervening step (an unmodified result of 90 or
          more hits the intervening model) as it is, because that is a separate printed rule.
    - kind: modelling_error
      section_id: section.combat.throwing_potions
      object_id: procedure.thrown_preparation
      description:
        The hit step uses `roll lte threshold AND roll lt 100`. A throw is an RS check ("A
        successful RS is required to hit", PDF 117), so the 91-00 automatic failure on PDF 18
        applies. With the +10 large-target bonus, a high RS can reach 91 or more and the procedure
        lets rolls of 91-99 hit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Throwing Potions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
      disposition:
        status: open
        proposed_correction:
          Require roll lte 90 in the hit step, or apply core.check.automatic_failure, and
          cite PDF 18.
    - kind: modelling_error
      section_id: section.combat.throwing_potions
      object_id: procedure.thrown_preparation
      description:
        The door step applies the -10 when `through_door AND adjacent_to_door eq false`. The
        printed exemption is "unless they are standing in one of the two squares directly in front
        of the door". The book uses "If not adjacent to the door" only for where a failed toss
        lands. combat.throwing.door_opening models the exemption correctly as in_front_of_door, so
        the procedure contradicts its own rule and merges the two conditions the page keeps apart.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Throwing Through a Door Opening
      disposition:
        status: open
        proposed_correction:
          Add an in_front_of_door input and gate the door -10 step on in_front_of_door eq
          false, as combat.throwing.door_opening does. Keep adjacent_to_door only for the
          door_scatter step.
    - kind: modelling_error
      section_id: section.combat.different_combat_actions
      object_id: procedure.combat_shove
      description:
        'The procedure checks the diagonal before the model behind: the second step fires only
        when "straight_free eq false AND diagonal_free eq false". Shove (PDF 111) prints "one
        space straight back, and if it is blocked, diagonally back. If there is another model behind
        the target, it will also be moved straight back." It does not say which case comes first.
        issue.combat.shove_displacement_order records this and says combat.action.shove.displacement
        "allows either branch when its conditions hold", and the rule does. The procedure silently
        fixes an order (diagonal first) that the rule leaves open. It carries no issues link and is
        not in the issue''s related list.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Shove
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Shove
      disposition:
        status: open
        proposed_correction:
          "Make the displacement case a supplied input to procedure.combat_shove, with
          the same branch conditions as combat.action.shove.displacement (straight_free,
          push_model_behind, diagonal, blocked). Add issues: [issue.combat.shove_displacement_order]
          to the procedure, and add procedure.combat_shove to that issue's related list."
    - kind: uncertainty_not_recorded
      section_id: section.combat.different_combat_actions
      object_id: combat.action.shove.success
      description:
        Shove is a roll-over test ("by rolling higher than the target’s DEX"), and the example
        calls "everything from 26 and up a success". PDF 18 makes 91-00 an automatic failure for any
        skill or stat check. The book does not say whether that applies to Shove. The rule and
        procedure.combat_shove treat 91-99 as successes without recording the choice.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Shove
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
      disposition:
        status: recorded_as_issue
        issue_id: issue.combat.shove_automatic_failure
    - kind: modelling_error
      section_id: section.combat.different_combat_actions
      object_id: combat.action.pick_lock
      description:
        Printed actor and equipment qualifiers are missing from when/require. "A hero may try
        to pick a lock", "A hero may try to break down a door", "A hero may try to do this"
        (Searching) and "A hero may apply a bandage to themselves" are in combat.action.pick_lock,
        .break_down_door, .search and .apply_bandage.self, but none of them requires a hero.
        combat.action.aim leaves out "with a Ranged Weapon" (procedure.combat_aim does gate on
        ranged_weapon). combat.action.prayer leaves out "during a priest's turn".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Break Down a Door
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Pick a Lock
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
      disposition:
        status: open
        proposed_correction: Add is_hero eq true to the require of combat.action.pick_lock,
          .break_down_door, .search and .apply_bandage.self. Add a ranged-weapon condition to
          combat.action.aim, and an acting-model-is-a-priest, during-its-turn condition to
          combat.action.prayer.
    - kind: modelling_error
      section_id: section.combat.who_can_fight
      object_id: combat.who_can_fight.missile_range
      description: combat.who_can_fight.missile_range ("Models equipped with Missile Weapons have a
        maximum reach of 10 squares in a dungeon") has no when, so its 10-square require applies to
        every attack, not only Missile Weapons. combat.who_can_fight.long_range_adjacent ("Long
        Range Weapons may not normally be fired ...") likewise has no weapon-category condition. The
        undefined category in issue.combat.long_range_weapons can stay a supplied boolean.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Who Can Fight?
      disposition:
        status: open
        proposed_correction: Add when weapon_is_missile_weapon eq true to
          combat.who_can_fight.missile_range, and when weapon_is_long_range_weapon eq true (a
          supplied input, the category is undefined) to combat.who_can_fight.long_range_adjacent.
    - kind: modelling_error
      section_id: section.combat.fumble
      object_id: combat.fumble.dodge_or_shove
      description:
        The printed rules are "A hero fumbling when dodging or shoving" and "A hero rolling 100
        when attacking or parrying". combat.fumble.dodge_or_shove and character.durability.fumble
        test only the roll and the action, not that the model is a hero. Enemies do shove (the Basic
        rules on PDF 119 say "Shove if necessary"), so an enemy fumbling a shove would wrongly set
        hero_prone. procedure.combat_attack already gates its fumble steps on is_hero.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Fumble
      disposition:
        status: open
        proposed_correction: Add is_hero eq true to the when of combat.fumble.dodge_or_shove and
          character.durability.fumble.
    - kind: modelling_error
      section_id: section.combat.general_principles_of_combat
      object_id: combat.principles.shooting_large.bonus
      description:
        The printed text is "When shooting at Large-Sized or X-Large Monsters, your heroes gain
        a RS +10 bonus." The when tests only target_large_or_x_large. It does not require that the
        shooter is a hero, or that the attack is a shot.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 113
          printed_page: 111
          heading: Shooting at Large-Sized Monsters and Flyers
      disposition:
        status: open
        proposed_correction: Add shooter_is_hero eq true, and a shooting condition, to the when.
    - kind: modelling_error
      section_id: section.combat.throwing_potions
      object_id: combat.throwing.area_large_enemy
      description:
        The printed condition is "If such a potion hits a square covered by a large or X-large
        enemy", where "such a potion" is one that affects several squares.
        combat.throwing.area_large_enemy has no when, so it computes large_enemy_damage
        unconditionally.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 117
          printed_page: 115
          heading: Area of effect and large enemies
      disposition:
        status: open
        proposed_correction: Add when (area_effect_potion eq true AND hits_square_covered_by_large_or_x_large eq true).
    - kind: modelling_error
      section_id: section.combat.different_combat_actions
      object_id: combat.action.change_facing
      description:
        'Changelog 2.21 entry 160 (rendered changelog p. 25) states a rule: "Page 108 Changed
        wording: Change Facing: This can be done freely at any point in a model''s activation." It
        is marked Fixed. Under "Official rulings" in the extraction guide, effects follow a ruling
        that states its rule; only a Fixed entry without a stated rule settles nothing. The corpus
        cites entry 160 on the rule but keeps the printed start-or-end timing in the require, and
        issue.combat.change_facing_timing calls it "evidence only (recorded, not applied)". That
        is the treatment for entries like 162, which give no text. Entry 160 gives its text.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Change Facing
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 25
          printed_page: null
          heading: '2.21'
          locator:
            row: 160
      disposition:
        status: open
        proposed_correction:
          Keep the printed source_text. Change the require to "at any point during the
          model's activation" (keeping moved_on_to_another_model eq false, which the printed second
          sentence supports), cite PDF 110 and entry 160, and resolve
          issue.combat.change_facing_timing with a resolution citing entry 160. If the extraction
          side reads entry 160 as an edition wording change rather than a ruling, record that
          reasoning in the issue against the guide's test instead.
    - kind: source_reference_error
      section_id: section.combat.different_combat_actions
      object_id: procedure.combat_aim
      description:
        The aim step text "One AP per shot; cannot aim during Overwatch." and the overwatch eq
        false gate on both steps cite only Aim on PDF 109 and 110. Those pages say nothing about
        Overwatch. The Overwatch entry on PDF 111 only points to the Into the Dungeons chapter. The
        restriction has no cited source, and its reading was not verified in this unit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Overwatch
      disposition:
        status: open
        proposed_correction:
          Either cite the Into the Dungeons Overwatch page that forbids aiming and check
          that it forbids aiming itself (not only Perks and Talents used for aiming), or remove the
          overwatch gate and the "cannot aim during Overwatch" text from procedure.combat_aim.
    - kind: source_reference_error
      section_id: section.combat.fumble
      object_id: procedure.combat_attack
      description:
        'The hero_fumble, fumble_durability and magic_fumble steps gate on chosen_fast_immunity
        and magic_weapon, and say "Fast exception is supplied. Magical overlap stays unresolved."
        They cite only Fumble on PDF 112, which mentions neither a Fast exception nor magic weapons.
        fumble_durability has `effects: []`, so the procedure itself never deducts durability; it
        relies on rule_refs alone.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Fumble
      disposition:
        status: open
        proposed_correction: Cite the pages that establish the Fast-weapon fumble exception and the
          magic-weapon overlap (Dissipating Magic, PDF 70, already on
          issue.phase4.durability_overlap) on those steps. Give fumble_durability an effect
          (durability -1, or an invoke of character.durability.fumble) so the chart box "Deduct 1
          point of durability from the weapon" (PDF 116) is executable.
    - kind: transcription_error
      section_id: section.combat.hero_attack
      object_id: procedure.combat_preparation
      description: 'In procedure.combat_preparation, procedure.combat_attack, procedure.combat_aim,
        procedure.combat_shove and procedure.thrown_preparation, the procedure-level and step
        source_text are extractor paraphrases, not printed wording, even though each cites a
        rulebook page. For example: "Power Attack adds +20 CS." (printed: "This attack gives the
        model a +20 bonus to CS"), "Shove costs 1 AP; large targets excluded.", "Prepare one
        supplied attack. Geometry, equipment and resolved talent/perk exceptions are inputs; no
        enemy behavior or path is generated.", "Hero Attack diagram removes one projectile and marks
        ranged weapon unloaded before hit check." procedure.combat_turn shows the expected form: it
        quotes the chart labels verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Power Attack
      disposition:
        status: open
        proposed_correction:
          Replace each step source_text with the printed sentence(s) or Hero Attack chart
          box labels it implements, for example "Mark hero with Power Attack token", "Remove 1
          projectile from inventory. Change weapon status to “Unloaded”", "Roll against target's
          DEX, adding DBx10 to the roll". Move the explanatory text to a notes or description field.
    - kind: ok_with_note
      section_id: section.combat.combat_turn
      object_id: procedure.combat_turn
      description:
        'Compared with the Combat Turn chart (PDF 114) box by box. Pull initiative token; What
        kind of token?; Hero? Is there a Hero/Mercenary that has not acted? yes: Choose a character,
        Remove Stunned/Parry Stance/Power Attack tokens, Perform chosen action(s); Enemy? Is there
        an Enemy that has not acted? yes: Check Quick Reference card, Remove tokens, Perform
        action(s) according to Enemy behaviour card; either no: Last token in the bag? yes: Move
        wandering monster(s), Refill initiative bag removing tokens for each casualty, Roll scenario
        die; no, and every Perform: loop to Pull. The footer is the sequence_ends step. All present
        and correctly gated. Minor: on the hero branch, remove_status_tokens is set before the
        hero_activation invoke, which covers both "Choose" and "Perform", while the chart puts
        Choose before Remove. The flags are order-independent. The unresolved_reference on the last
        token''s model is accurate to the chart. Derived tests turn_* match the branches.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 114
          printed_page: 112
          heading: Combat Turn
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.hero_attack
      object_id: procedure.combat_attack
      description:
        'Hero Attack chart (PDF 116) branch coverage. Ranged: LOS blocked leads to "Can''t
        shoot" (eligibility in_los); clear leads to remove 1 projectile, Unloaded, modifiers to RS,
        skill check (RS). Power: Power Attack token (power_exposure). Standard. Charge: move
        adjacent, then after a hit "Was it a charge? yes: Move enemy back 1 square and follow up"
        (charge_shove invoke). Success: 01-05 rolls damage twice and keeps the best, then armour,
        then HP (bloodlust handoff). Failure: 00 deducts 1 durability, then Missed. Shove: DEX +
        DBx10, success pushes back, failure on 00 makes the hero fall over, otherwise the enemy
        stands fast (procedure.combat_shove). Every chart branch has a step. Defects are reported
        separately (91-00, fumble effects, paraphrased text, shove order).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 116
          printed_page: 114
          heading: Hero Attack
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.hero_attacking.table
      object_id: table.combat.melee_modifiers
      description: 'Checked both Hero Attacking tables cell by cell against PDF 115. Factor in close
