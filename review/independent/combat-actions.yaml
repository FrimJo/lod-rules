        true and roll 100 and returns the unresolved effect for issue.combat.shooting_past_fumble.
        The note matches. Status and components are unchanged. The rest of the note still matches
        PDF 112-113 (the opening paragraph and the run-in headings Fighting in Doorways to
        Shooting Through Doorways, with Fumble in its own row; Attacking from Behind +20 as
        given to RS by the PDF 115 shooting table; the shooting example A, B and C; the Shooting
        Through Doorways caption as a diagram).
      source:
