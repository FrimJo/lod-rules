  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:7b3abf35a94d9e205c649f83d3e0ad7f91f2f8764e2ff519b5a6eafe927ea074

  findings:
    - kind: ok_with_note
      section_id: section.alchemy.preparations
      description: >-
        All twenty-nine run-in descriptions on PDF 79-81 were compared word for word with the
        source_text of their preparation rule, their quality-effect rules and their entity. No
        transcription difference was found: every die expression (1d6/1d10/1d12, 1d4/1d6/1d10,
        1d20/2d20/3d20, 1d3, 1d8, 1d4, 1d10), modifier (+10/+15/+20, +5/+10/+15, +1/+2/+3, -20,
        +20 RES, -20 CS, +1 DMG), count (300 XP, 5 projectiles, 1HP, 2 squares, 3 turns, 4 turns,
        8 squares) and duration matches the page, including the printed typos "DEX bases skills"
        and "2dx1d4". Section titles carry the printed "(Tr)" and "(Antidote)" qualifiers; the
        book sets "( Tr)" with a font-spacing gap that is not meaningful. Potion of Courage is
        correctly cited on PDF 79 and its continuation on PDF 80, and every sections.yaml span and
        page order matches the two columns of each page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 79
          printed_page: 77
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 80
          printed_page: 78
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.alchemy.preparations
      object_id: table.alchemy.strengths
      description: >-
        The book prints no Weak/Standard/Supreme table on these pages; the table is a compiled
        matrix of the values the twelve graded descriptions state in prose. All twelve of its
        source references carry the locator "quality values stated in the description; no table
        is printed", and every one of the 36 cells agrees with the page (Cure Disease and Cure
        Poison rows as 75% / 100% / 100% plus 1d3 HP). The quality-effect rules point at it via
        uses_tables and select on quality weak/standard/supreme. Acceptable as a derived
        artefact because its provenance is explicit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 79
          printed_page: 77
          heading: Acidic Bomb (Tr)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
          heading: Potion of Wisdom
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.alchemy.preparations.potion_of_dragons_breath
      object_id: character.alchemy.preparation.potion_of_dragons_breath
      description: >-
        The figure was read at 5x. It shows: 1 = the square orthogonally right of the hero plus
        the square above it (both touch the hero, one diagonally); 2 = two squares in a straight
        line away from the hero; 3 = two squares along a diagonal running away from the hero;
        4 = one square (drawn with two flame icons) for the 1d8 jet. The paragraph geometry
        ("adjacent square and one square adjacent to that square") and the caption's four ways,
        including the diagonal and the "2dx1d4" typo, are quoted verbatim in source_text and the
        contradiction is already recorded; the rule does not choose.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 80
          printed_page: 78
          heading: Potion of Dragon’s Breath
          locator:
            region: figure and caption in the right column
      disposition:
        status: recorded_as_issue
        issue_id: issue.alchemy.dragons_breath_geometry
    - kind: ok_with_note
      section_id: section.alchemy.preparations.potion_of_strength
      object_id: character.alchemy.preparation.potion_of_strength
      description: >-
        Potion of Strength and Potion of Wisdom each print two durations ("until the end of the
        next battle ... can be drunk in between battles" and "until the end of the current
        battle ... (or the end of dungeon if there are no more battles)"). Both sentences are
        kept verbatim, the duration literal current_or_next_battle_or_dungeon_end does not pick
        one, and the existing issue describes the page accurately. Constitution, Courage,
        Dexterity and Fire Protection print only the second form and use current_or_next_battle.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
          heading: Potion of Strength
      disposition:
        status: recorded_as_issue
        issue_id: issue.alchemy.stat_potion_duration
    - kind: ok_with_note
      section_id: section.alchemy.preparations.potion_of_fire_protection
      object_id: character.alchemy.preparation.potion_of_fire_protection
      description: >-
        "impervious to Fire Damage" followed by "reduced by 1d10. Make a separate roll each time
        the hero is attacked" is quoted verbatim; the rule records the 1d10 reduction per attack
        and the existing issue holds the immunity-versus-reduction tension without inferring.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
          heading: Potion of Fire Protection
      disposition:
        status: recorded_as_issue
        issue_id: issue.alchemy.fire_protection
    - kind: ok_with_note
      section_id: section.alchemy.preparations.potion_of_cure_disease
      object_id: character.alchemy.preparation.potion_of_cure_disease
      description: >-
        The entities equipment.alchemy.potion_of_cure_disease and
        equipment.alchemy.potion_of_cure_poison are owned by the Appendix III Alchemy table
        section, so they are not in this digest; both were read and both cite PDF 80 under the
        correct heading and list the preparation rule. The coverage rows for these two children
        therefore mark entities as extracted on the strength of a cross-section entity, which
        the notes explain. The book does not name the die behind "a 75% chance of success"; the
        quality-effect rules record success_chance 75/100 without inferring a d100 roll, which
        is the right boundary.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 80
          printed_page: 78
          heading: Potion of Cure Disease
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 80
          printed_page: 78
          heading: Potion of Cure Poison (Antidote)
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.alchemy.preparations.weapon_oil
      object_id: equipment.alchemy.weapon_oil
      description: >-
        equipment.alchemy.weapon_oil and equipment.alchemy.potion_of_dragons_breath carry
        "tables: []" although the Appendix V Standard potions table lists "Weapons Oil" and
        "Potion of Dragon Breath"; those catalogue rows are separate entities
        (equipment.alchemy.weapons_oil, equipment.alchemy.potion_of_dragon_breath) whose
        printed names differ, and the non-identification is already an open issue. Nothing on
        PDF 79-81 settles it; no change proposed here.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
          heading: Weapon Oil
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 80
          printed_page: 78
          heading: Potion of Dragon’s Breath
      disposition:
        status: recorded_as_issue
        issue_id: issue.alchemy.preparation_names
    - kind: ok_with_note
      section_id: section.alchemy.preparations
      description: >-
        Coverage: all thirty rows are extracted. The grouping node has rules not_applicable
        (the book prints no collective heading or text at that level, which the sections.yaml
        notes also state) and tables extracted for the compiled matrix; every child has rules
        and entities extracted and glossary, tables, examples and procedures not_applicable,
        which matches the pages: each heading is one paragraph with no term definition, table,
        Example box or ordered procedure. Referenced ids (term.throwable_potion, perk.frenzy,
        character.recovery.hp_overflow, section.alchemy.throwing_potions) resolve. No mechanic,
        caption or special case on the three pages is missing from the corpus.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 79
          printed_page: 77
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 81
          printed_page: 79
      disposition:
        status: no_change_needed
  outcome: passed
  summary: >-
    Rendered PDF 79-81 (printed 77-79) and compared the twenty-nine preparation descriptions,
    the Dragon's Breath figure and caption, the 29 preparation rules, 36 quality-effect rules,
    27 in-scope entities (plus the two Appendix-owned cure entities), the compiled
    table.alchemy.strengths, 30 sections.yaml and coverage rows and three related issues. No
    transcription, modelling, source-reference or coverage error was found; the three book
    ambiguities on these pages are already recorded as issues and described accurately.
