    - kind: modelling_error
      section_id: section.travel_and_settlements
      description: >-
        Table placement on PDF 146. Under the "Win and Second Place" heading in the left column,
        the book prints two tables for Horse Racing: the Hero level / Multiplier for 1st place /
        Multiplier for 2nd place table, and the 1st place 1d10 / 2nd place 1d10 / Extra award table.
        Both sit under the Horse Racing text that starts on PDF 145, not under the right-column
        headings "Learn a Spell or Prayer" or "Level Up". The tsv gives these two tables the ids
        section.settlements.learn_a_spell_or_prayer.table (titled "Horse racing winnings
        multipliers") and section.settlements.level_up.table (titled "Horse racing extra awards").
