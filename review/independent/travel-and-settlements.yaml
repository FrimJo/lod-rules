          extra-award table) to section.settlements.horse_racing. Their section_id and parent must
          not name learn_a_spell_or_prayer or level_up. Keep the existing ids stable unless the
          extraction side decides a breaking rename is warranted. Verify the table titles against
          the printed headings ("Win and Second Place", "There is also a chance to win an extra
          prize.") and check that the 1d10 award table on PDF 146 is not attributed to Level Up.
