        weapon or armour breaks, ... the magic is gone" and "Weapons and armour can be recharged
        again (if not broken) at the Wizard’s Guild". The doubt is genuine: shields get the magic
        durability of 8 and so can break, but both consequences name only weapons and armour, and
        the page says nothing about broken magic shields. Sources (PDF 70 / printed 68, headings
        Dissipating Magic and Durability of Magic Items) match pages.yaml. Related ids resolve;
        character.durability.broken_magic_lost and character.magic_item.recharge already keep the
        printed weapon-or-armour condition and state the gap in unresolved_references, so the issue
        fixes nothing. Note only: the page also says "Other Magic Objects kept in your Quick Slots
        does not take damage at all", so for other objects the break question arises only outside
        Quick Slots; and Charging Magic Items on PDF 153 (printed 151) says generically "A broken
        Magic Item that has been repaired can be recharged for 250 coins", which bears on the
        recharge half but does not name shields; that tension is already carried by
        issue.phase4.magic_breakage. Not disputed.'
