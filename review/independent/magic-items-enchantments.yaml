  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:c24b3244d823c5f260efb61cbf1cc247456ceba03854e7d52b5ca2614805c129

  findings:
    - kind: ok_with_note
      section_id: section.magic_items
      description: >-
        Every source_text in corpus/rules/equipment/magic-items-enchantments.yaml, the five
        magic-durability rules in encumbrance-durability.yaml and the definitions of
        term.magic_item and term.powerstone were compared word for word with rendered PDF 70–71.
        All match the print (the printed "time - consuming" line break is correctly normalised to
        "time-consuming"). All run-in headings (Identifying, Durability of Magic Items, Carrying
        Magic Items, Dissipating Magic, Requirements for Magic Items, Making a Magic Scroll,
        Enchantments Take Time) and the chapter banners are cited exactly as printed, and every
        pdf_page/printed_page pair (70/68, 71/69) agrees with pages.yaml. The enchant and scroll
        rules quote the chapter-root sentence "It cannot be done while travelling." joined with
        "..." and cite it under the heading "Enchantments", which is the correct placement.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Magic Items
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 69
          pdf_page: 71
          heading: Enchantments
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: modelling_error
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.dissipation
      description: >-
        The print triggers dissipation only "when attacking with a magic weapon", but the rule's
        `when` tests only attack_roll == 100; `magical` is a state field that is never checked.
        For a non-magical weapon rolling 00 the rule still fires and sets maximum_durability to 6,
        which collapses the printed distinction and would override any other durability figure
        the weapon might carry. The fixture test.character.durability.dissipation.magic_lost only
        supplies attack_roll, so it does not exercise the guard.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Make `when` an `all` of attack_roll == 100 and magical == true (keep `magical` as a
          state field, or add a separate boolean input `attacking_with_magic_weapon`), and give
          test.character.durability.dissipation.magic_lost the input magical: true plus a
          sibling case with magical: false that expects no effects.
    - kind: modelling_error
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.broken_magic_lost
      description: >-
        The print says "If a magic weapon or armour breaks, ... the magic is gone" and "Weapons
        and armour can be recharged again (if not broken) at the Wizard's Guild". Both
        character.durability.broken_magic_lost and character.magic_item.recharge drop the
        weapon-or-armour restriction: broken_magic_lost fires on any `broken` item (it also lacks
        a magical == true guard, though the effect is idempotent) and recharge has no item-type
        field at all. Magic shields have 8 Durability under Durability of Magic Items and can
        therefore break, yet the print names only weapons and armour for both magic loss and
        recharging; the model generalises past the text instead of preserving the gap.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Add a boolean input `weapon_or_armour` to character.durability.broken_magic_lost and
          character.magic_item.recharge and require it (in `when` or `require`) alongside the
          existing conditions; add an unresolved_references note on both rules that the print
          does not say whether a broken magic shield or other magic object loses its magic or
          can be recharged. Update test.character.durability.broken_magic_lost.break to supply
          weapon_or_armour: true.
    - kind: uncertainty_not_recorded
      section_id: section.enchantments.requirements_for_magic_items
      object_id: character.magic_item.enchant.success
      description: >-
        The print states that on failure "the stone may be used again" but is silent on whether
        a successful enchantment consumes the Powerstone. The extraction notes this only as a
        free-text unresolved_references entry on the two enchant rules, not as a tracked issue in
        review/. Recorded as issue.enchantments.powerstone_consumption; no rule change needed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 69
          pdf_page: 71
          heading: Requirements for Magic Items
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: recorded_as_issue
        issue_id: issue.enchantments.powerstone_consumption
    - kind: ok_with_note
      section_id: section.enchantments.enchantments_take_time
      object_id: character.magic_item.time.object
      description: >-
        "Only one object or two attempts (successful or not) to create scrolls may be done between
        quests" is modelled as mutually exclusive budgets (an object attempt requires zero scroll
        attempts and vice versa), which is the natural reading. The parenthetical "(successful or
        not)" attaches only to scrolls; the rule counts a failed enchantment (object destroyed)
        against the one-object allowance, and time.scroll charges 1 day per attempt although the
        print says "Each Magic Scroll takes 1 day to make". Both are reasonable readings of silent
        text; noted, not disputed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 69
          pdf_page: 71
          heading: Enchantments Take Time
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.magic_items.durability_of_magic_items
      object_id: character.durability.magic_gear
      description: >-
        "Other Magic Objects kept in your Quick Slots does not take damage at all" is modelled as
        quick_slot_damage_allowed = false for magical, non-weapon/armour/shield items; the
        Quick-Slot placement lives in the output field name rather than an input condition.
        character.durability.magic correctly sets maximum 8 and overrides
        character.durability.standard. Acceptable.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Durability of Magic Items
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.magic_items.identifying
      object_id: character.magic_item.identify
      description: >-
        Identify and use are modelled faithfully (one attempt per party and object; unidentified
        items unusable). The ‘Settlements’ pointer is bound in see_also to
        section.settlements.identifying_items_and_potions (PDF 146) and the dungeon-side
        section.into_the_dungeons.identifying_items_and_potions (PDF 100) is linked only; no
        object in this unit cites either page, so nothing from those pages is extracted here. The
        conflict with the Arcane Art skill entry is already issue.character_basics.identify_attempts.
        term.magic_item (kind item_property) and term.powerstone quote the printed paragraphs
        verbatim with correct aliases.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Identifying
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.magic_items
      description: >-
        Coverage dispositions of all nine sections match the pages: both chapter roots hold a
        banner and one introductory paragraph; section.magic_items has glossary extracted and rules
        not_applicable (descriptive paragraph), section.enchantments has rules extracted (the
        travelling sentence) and glossary not_applicable; every subsection is extracted for rules
        with tables, examples, procedures and entities not_applicable, which is true of the print
        (no table, no "Example:", no step list, no catalogue entry; the lower half of PDF 71 is a
        photograph). The "For example, there is no point in adding damage enhancing magic to a
        necklace" sentence is an illustration without values, so examples not_applicable is right.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 69
          pdf_page: 71
          heading: Enchantments
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.magic_repair_uncertain
      description: >-
        The repair-to-1-Durability sentence is correctly left unresolved under
        issue.phase4.magic_breakage. That issue (frozen) lists only character.durability.broken in
        `related`, so it is absent from this unit's digest even though four rules here cite it in
        `issues`, and its PDF 70 source carries visually_verified: false. Bookkeeping only; the
        issue's summary paraphrases the page accurately.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
  outcome: failed
  summary: >-
    Rendered PDF 70–71 (printed 68–69) and compared all 16 rules, 2 terms, 23 fixtures and 9
    coverage rows. Wording, headings, page labels and coverage dispositions are correct and no
    mechanic on the pages is missing. Two open modelling findings: character.durability.dissipation
    does not guard on the weapon being magical, and broken_magic_lost / recharge drop the printed
    "weapon or armour" restriction. One new issue records the undefined Powerstone consumption on a
    successful enchantment. PDF 98 was also rendered but holds an Into the Dungeons furniture
    table unrelated to this unit and is not counted in scope.
  supporting_evidence:
    - tests/examples/equipment/batch-three.yaml (read, not run)
    - tests/examples/equipment/encumbrance-durability.yaml (read, not run)
