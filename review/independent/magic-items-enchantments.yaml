  findings:
    - kind: modelling_error
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.dissipation
      description: >-
        Re-check of the first open finding of review.magic_items_enchantments.1. PDF 70 reads
        "Whenever you roll 00 when attacking with a magic weapon, the power is suddenly gone ...
        This includes the durability, which immediately drops to a maximum of 6." The rule's
        `when` is now an `all` of attack_roll == 100 and magical == true, so a 00 with an
        ordinary weapon no longer fires it. test.character.durability.dissipation.magic_lost now
        supplies magical: true and expects magical false / maximum_durability 6; the new sibling
        test.character.durability.dissipation.ordinary_weapon supplies magical: false and expects
        no state change, no trace. source_text unchanged and still verbatim. Verified on the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: corrected
        change: >-
          character.durability.dissipation `when` changed to all(attack_roll == 100, magical == true);
          test.character.durability.dissipation.magic_lost gained input magical: true;
          test.character.durability.dissipation.ordinary_weapon added (magical: false, no effects).
    - kind: modelling_error
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.broken_magic_lost
      description: >-
        Re-check of the second open finding of review.magic_items_enchantments.1. PDF 70 reads "If
        a magic weapon or armour breaks, ... the magic is gone" and "Weapons and armour can be
        recharged again (if not broken) at the Wizard's Guild". character.durability.broken_magic_lost
        now has a boolean input weapon_or_armour tested in `when` together with broken == true, and
        character.magic_item.recharge has the same input inside its `require` alongside
        at_wizards_guild and durability >= 1. Both rules carry an unresolved_references note that the
        page does not say whether a broken magic shield or other magic object loses its magic or
        can be recharged. test.character.durability.broken_magic_lost.break supplies
        weapon_or_armour: true. The printed restriction is preserved. Verified on the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: corrected
        change: >-
          Boolean input weapon_or_armour added to character.durability.broken_magic_lost (tested in
          `when` with broken == true) and to character.magic_item.recharge (inside its `require`),
          each with an unresolved_references note on magic shields and other magic objects;
          test.character.durability.broken_magic_lost.break supplies weapon_or_armour: true.
    - kind: ok_with_note
      section_id: section.magic_items.dissipating_magic
      object_id: character.durability.broken_magic_lost
      description: >-
        broken_magic_lost still does not test magical == true before setting magical to false; the
        effect is idempotent for a non-magical item, so nothing on PDF 70 is misrepresented.
        character.magic_item.recharge has no derived fixture (no test case lists it in rule_ids);
        tests are supporting evidence only and the page does not require one, so this is noted,
        not disputed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Dissipating Magic
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.magic_items
      description: >-
        Whole unit re-read against rendered PDF 70-71. Every object not touched by the corrections
        (character.durability.magic, .magic_gear, .magic_repair_uncertain, character.magic_item.identify,
        .use, .jewellery_limits, .enchant.success/.failure, .scroll.success/.failure,
        .time.object/.time.scroll, term.magic_item, term.powerstone, the nine section and coverage
        rows and the batch_three fixtures) has the same digest as in record .1, and a fresh
        word-for-word comparison of each source_text, definition, heading and page pair with the
        print found no discrepancy. Magic weapons, armour and shields have 8 Durability, other
        Magic Objects in Quick Slots take no damage, 1 magic ring and 1 magic necklace limit
        including Legendary Items, Enchant Item + Powerstone + full durability + suitability, one
        enchantment per object, failed enchantment destroys the object and keeps the stone, Magic
        Scribbles scrolls with focus allowed and parchment destroyed on failure, one object or two
        scroll attempts between quests and 1 day per Magic Scroll are all encoded as printed. No
        table, printed example, procedure or catalogue entry appears on either page (the lower
        half of PDF 71 is a photograph), so the not_applicable component dispositions hold.
        issue.enchantments.powerstone_consumption (recorded by review .1) still accurately states
        the gap; no new issue is needed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 68
          pdf_page: 70
          heading: Magic Items
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 69
          pdf_page: 71
          heading: Enchantments
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
  outcome: passed_with_corrections
  summary: >-
    Re-review of section.magic_items and section.enchantments after the extraction side applied the
    two open findings of review.magic_items_enchantments.1. Rendered PDF 70-71 (printed 68-69) anew.
    Both corrections verified on the page: character.durability.dissipation now requires a magic
    weapon (magical == true) with a new ordinary-weapon fixture, and character.durability.broken_magic_lost
    and character.magic_item.recharge now require weapon_or_armour with the shield/other-object gap
    recorded as an unresolved reference. All other objects are unchanged and still match the print.
    No open findings; not promoted.
