        it must first be repaired"). All five ids resolve and each one's source_text is the
        passage the issue is about; magic_repair_uncertain also points back via issues and an
        unresolved effect. The summary states the book correctly: "broken beyond repair" (PDF
        51-52) against "must first be repaired to at least 1 Point of Durability" (PDF 70), and
        the drop to a maximum of 6 "can lead to the weapon suddenly breaking" with no stated
        current-durability accounting. It picks no interpretation. Source refs PDF 51/52/70 =
        printed 49/50/68 match pages.yaml. Minor wording: the summary says "a broken magic item"
        where the page says "Weapons and armour ... If the item is broken"; the scope gap is
        already carried by the unresolved_references on recharge and broken_magic_lost, so not
        disputed. The issue's own source entries keep visually_verified: false; that is metadata
        on the issue, not a misstatement.
