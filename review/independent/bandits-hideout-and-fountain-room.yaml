  findings:
    - kind: modelling_error
      section_id: section.quest_book_i.the_bandits_hideout.quest_1_rescuing_the_prisoners
      object_id: core.quest.rescuing_prisoners.golfrid
      description: >-
        The rule sets enemy_kind to "Halfling Thief". PDF 250 prints "Golfrid is a halfling"
        and "He is as nimble as you would expect from a Halfling Thief": a comparison, not a
        statement that he is or uses a Halfling Thief profile. The value implies a Bestiary
        profile the page does not assign. Separately, quest_actor.bandits_hideout.golfrid lists
        only core.quest.rescuing_prisoners.golfrid in rules, not the two printed behaviour rules.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 250
          printed_page: 248
          heading: Golfrid the Short
      disposition:
        status: open
        proposed_correction: >-
          core.quest.rescuing_prisoners.golfrid: set enemy_kind to "halfling" (as printed
          "Golfrid is a halfling") or drop the field, keeping the Halfling Thief sentence only in
          source_text. quest_actor.bandits_hideout.golfrid: add
          core.quest.rescuing_prisoners.golfrid_not_cornered and
          core.quest.rescuing_prisoners.golfrid_movement to rules.
    - kind: modelling_error
      section_id: section.quest_book_i.the_bandits_hideout.quest_1_rescuing_the_prisoners
      object_id: core.quest.rescuing_prisoners.threshold
      description: >-
        PDF 249 prints "When the Threat Level reaches 14, a Wandering Monster appears regardless
        of the Scenario die result." The effects match, but the field descriptions call the
        output "Place special quest monster." and "No reduction for special placement.", a
        "special quest monster" the page does not name. The when-clause requires current Threat
        to equal 14, which silently answers the overshoot question recorded only against the
        shared rule as issue.quest.threat_threshold_overshoot.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 249
          printed_page: 247
          heading: Special Rules
      disposition:
        status: open
        proposed_correction: >-
          core.quest.rescuing_prisoners.threshold: describe wandering_monster_triggered as "A
          Wandering Monster appears." and threat_reduction_on_placement as "The Threat Level is
          not decreased when the Wandering Monster is placed."; list
          issue.quest.threat_threshold_overshoot in issues (and add the rule to that issue's
          related).
    - kind: modelling_error
      section_id: section.quest_book_i.the_fountain_room.quest_1_cleansing_the_water
      object_id: core.quest.cleansing_water.threshold
      description: >-
        PDF 253 prints only "Special Rules: A Wandering Monster appears when the Threat Level
        reaches 14." It has no "regardless of the Scenario die result" clause (that clause is
        printed for Rescuing the Prisoners on PDF 249), yet the rule outputs
        scenario_result_ignored true. It carries the same "Place special quest monster." /
        "special placement" descriptions and the same unlinked overshoot question as the
        Rescuing the Prisoners threshold.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 253
          printed_page: 251
          heading: Special Rules
      disposition:
        status: open
