  findings:
    - kind: coverage_error
      section_id: section.equipment.weapon_class
      description:
        PDF 51 prints an Example under the class table ("A Class 3 weapon requires a minimum
        strength of 30 to use with two hands and a strength of 40 to use with one hand. However, a
        Class 5 weapon can never be used with only one hand."). The coverage row marks examples
        `extracted`, but no object with a section_id in this chapter cites that printing. The only
        source_example fixtures (test.character.creation.weapon_class_example.*) belong to
        section.creating_your_character.choosing_your_species, cite PDF 29 only and quote the PDF 29
        wording, which differs ("would require", "could never", and the extra sentence "Class 6 is
        not heavy but requires 2 hands."). The coverage notes themselves call this "a known citation
        gap"; a component cannot be `extracted` on a gap.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 49
          pdf_page: 51
          section: Different Kind of Equipment
          heading: Class
          locator:
            paragraph: Example
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 27
          pdf_page: 29
          heading: Strength and Weapon Class
          locator:
            paragraph: Example
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction:
          Add source_example fixtures under section.equipment.weapon_class that quote the
          PDF 51 wording verbatim and cite printed 49 / PDF 51, heading Class (class 3 with two
          hands at STR 30 satisfied; class 3 with one hand at STR 40 satisfied; class 5 with one
          hand never satisfied), or alternatively add the PDF 51 printing as a second source on the
          four existing fixtures while keeping their PDF 29 source_text and noting the wording
          difference. Until one of these exists, set the weapon_class examples component to
          `extracting`.
    - kind: modelling_error
      section_id: section.equipment
      description:
        'The printed hierarchy has three levels: the chapter banner, script headings (Coins,
        Different Kind of Equipment, Carrying Equipment, Encumbrance, Buying and Selling equipment,
        Repairing Equipment, Mithril, What Equipment to Bring?) and smaller run-in headings under
        them. In sections.yaml the run-ins Class (section.equipment.weapon_class) and the three
        Durability run-ins are mapped with parent section.equipment instead of
        section.equipment.different_kind_of_equipment, and Hands, Quiver (Optional rule), Stacking
        armour and Backpack are mapped with parent section.equipment instead of
        section.equipment.carrying_equipment. The map is also internally inconsistent: the
        carrying_equipment span (PDF 52–53) only reaches PDF 53 because it includes the Backpack
        run-in, and section.equipment.coins.table is nested under weapon_class, so nested parents
        are already used. Ids, titles and page spans are otherwise correct.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 50
          pdf_page: 52
          heading: Carrying Equipment
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 49
          pdf_page: 51
          heading: Different Kind of Equipment
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
