    - kind: coverage_error
      section_id: section.equipment.weapon_class
      object_id: test.equipment.weapon_class_example.class_3_two_hands
      description: 'Re-review of review.equipment.1 finding 1. PDF 51 prints under the class table:
        "Example: A Class 3 weapon requires a minimum strength of 30 to use with two hands and a
        strength of 40 to use with one hand. However, a Class 5 weapon can never be used with only
        one hand." The corpus now has three source_example fixtures under
        section.equipment.weapon_class (test.equipment.weapon_class_example.class_3_two_hands,
        .class_3_one_hand, .class_5_one_hand) whose source_text quotes exactly this PDF 51 wording
        and whose source cites printed 49 / PDF 51, section Different Kind of Equipment, heading
        Class, locator paragraph Example. Their inputs and expectations agree with the page: class 3
        with two hands at STR 30 reads required_strength 30 from the table and both requires are
        satisfied; class 3 with one hand at STR 40 satisfies the one-hand branch (table 1H STR req
        40); class 5 with one hand at STR 80 is never satisfied (table 1H STR req N/A). The coverage
        row for section.equipment.weapon_class now names these fixtures and distinguishes them from
        the PDF 29 printing (test.character.creation.weapon_class_example.*), so the examples
        component `extracted` is backed by evidence.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 49
          pdf_page: 51
          section: Different Kind of Equipment
          heading: Class
          locator:
            paragraph: Example
          extraction: *a1
