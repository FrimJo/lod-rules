  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:c64055ef0c1fa49f11a66591990f133911b8a986d5073e0c0c0a40069fd6648a

  findings:
    - kind: source_reference_error
      section_id: section.creating_your_character
      object_id: character.profession.barbarian.equipment_limits
      description: >-
        Four profession Limitations rules cite a heading that is not printed. The heading is
        "Barbarian equipment limits", "Ranger equipment limits", "Rogue equipment limits" and
        "Wizard equipment limits" in character.profession.barbarian.equipment_limits,
        character.profession.ranger.equipment_limits, character.profession.rogue.equipment_limits and
        character.profession.wizard.equipment_limits. On PDF 35, 36, 37 and 41 the run-in heading
        above each sentence is "Limitations". The Alchemist and Thief rules already cite
        "Limitations". The source_text, numbers and require effects (Tier 3, Tier 3, Tier 3, Tier 2)
        are correct.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 35
          printed_page: 33
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 36
          printed_page: 34
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 37
          printed_page: 35
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 41
          printed_page: 39
          heading: Limitations
      disposition:
        status: open
        proposed_correction: >-
          Set source[0].heading to "Limitations" on character.profession.barbarian.equipment_limits,
          character.profession.ranger.equipment_limits, character.profession.rogue.equipment_limits
          and character.profession.wizard.equipment_limits.
    - kind: source_reference_error
      section_id: section.creating_your_character
      object_id: table.character.barbarian_skills
      description: >-
        Six profession skill tables cite a heading that is not printed: "Barbarian skills", "Ranger
        skills", "Rogue skills", "Warrior skills", "Warrior Priest skills" and "Wizard skills" in
        table.character.barbarian_skills, ranger_skills, rogue_skills, warrior_skills,
        warrior_priest_skills and wizard_skills. On PDF 35 to 37 and 39 to 41 the heading above each
        table is "Skills". The Alchemist and Thief tables already cite "Skills". All cells are
        correct (see the separate cell-by-cell note).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 35
          printed_page: 33
          heading: Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 36
          printed_page: 34
          heading: Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 37
          printed_page: 35
          heading: Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 39
          printed_page: 37
          heading: Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 40
          printed_page: 38
          heading: Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 41
          printed_page: 39
          heading: Skills
      disposition:
        status: open
        proposed_correction: >-
          Set source[0].heading to "Skills" on the six tables. Optionally add locator.table (for
          example "Barbarian Skills"), as table.character.alchemist_skills already does.
    - kind: source_reference_error
      section_id: section.creating_your_character
      object_id: table.character.dwarf_stats
      description: >-
        The species stat-roll tables and the Damage Bonus and Natural Armour tables cite headings that
        are not printed: "Dwarf initial stats", "Elf initial stats", "Halfling initial stats", "Human
        initial stats" (table.character.dwarf_stats, elf_stats, halfling_stats, human_stats), "Damage
        Bonus table" (table.character.damage_bonus) and "Natural Armour table"
        (table.character.natural_armour). These tables have no caption. They sit under the printed
        headings "Dwarf" and "Elf" (PDF 30), "Halfling" and "Human" (PDF 31), and "Damage Bonus and
        Natural Armour" (PDF 29). The cell values are all correct.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 29
          printed_page: 27
          heading: Damage Bonus and Natural Armour
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 30
          printed_page: 28
          heading: Dwarf; Elf
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 31
          printed_page: 29
          heading: Halfling; Human
      disposition:
        status: open
        proposed_correction: >-
          Set source[0].heading to the printed heading: "Dwarf", "Elf", "Halfling" or "Human" for the
          four stat tables, and "Damage Bonus and Natural Armour" for table.character.damage_bonus and
          table.character.natural_armour. Keep the editorial names in name or in locator.table.
    - kind: source_reference_error
      section_id: section.creating_your_character.thief
      object_id: character.profession.thief.treasure_choice
      description: >-
        unresolved_references holds "The general Treasure Card procedure is outside the pilot." This
        is an extractor note, not printed wording, and the Special paragraph on PDF 38 contains no
        page or chapter pointer. The rule already binds see_also to section.treasure. An
        unresolved_references entry must quote an unbound printed pointer.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 38
          printed_page: 36
          heading: Special
      disposition:
        status: open
        proposed_correction: >-
          Remove the unresolved_references entry from character.profession.thief.treasure_choice. If
          the Treasure Card procedure needs a dependency, bind it to an existing id instead.
    - kind: modelling_error
      section_id: section.creating_your_character.dwarf
      object_id: species.dwarf
      description: >-
        The printed trait "Hate Goblins" (PDF 30) is granted with label, qualifier Goblins and
        section_id section.appendix_ii_talents.mental_talents, but without an object_id, although
        talent.hate exists. Talent Hate covers choosing one enemy, for example goblins. The other
        species trait grants (Night Vision, Perfect Hearing) bind their talent ids, so a consumer
        cannot get to the Hate rules from the Dwarf.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 30
          printed_page: 28
          heading: Dwarf
      disposition:
        status: open
        proposed_correction: >-
          Add object_id: talent.hate to the Hate Goblins grant on species.dwarf and keep qualifier:
          Goblins.
    - kind: modelling_error
      section_id: section.creating_your_character.halfling
      object_id: species.halfling
      description: >-
        The Halfling trait "Lucky (Starts with 1 Point of Luck)." (PDF 31) names the Common Talent
        Lucky (talent.lucky, "You gain +1 Luck Point."). species.halfling has grants: [], so the
        trait is held only as the luck-setting rule character.species.halfling.initial_luck. Every
        other printed species trait that names a talent is a grant. Without the grant, a consumer
        cannot tell that a Halfling already has the Lucky talent, for example when a Human Jack of
        all trades roll or a later talent choice lands on Lucky.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 31
          printed_page: 29
          heading: Halfling
      disposition:
        status: open
        proposed_correction: >-
          Add a grant to species.halfling: kind talent, label Lucky, object_id talent.lucky,
          section_id section.appendix_ii_talents.common_talents, printed_reference "Lucky (Starts
          with 1 Point of Luck)." Keep character.species.halfling.initial_luck as the set-to-1
          effect. If the book's intent is unclear (the talent adds +1 while the trait sets a start
          value), record that as an issue instead of adding both effects.
    - kind: uncertainty_not_recorded
      section_id: section.creating_your_character.thief
      object_id: character.profession.thief.equipment_limits
      description: >-
        The Thief limit "weapons heavier than Class 2" (PDF 38) is modelled as weapon_class <= 2.
        PDF 29 says class 6 ranged weapons "may not be heavy per se" and that "Class 6 is not heavy
        but requires 2 hands". The book does not say whether a Thief may use class 6 ranged weapons.
        No issue recorded this before.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 38
          printed_page: 36
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 29
          printed_page: 27
          heading: Strength and Weapon Class
      disposition:
        status: recorded_as_issue
        issue_id: issue.creating_your_character.thief_class_6_ranged
    - kind: ok_with_note
      section_id: section.creating_your_character.choosing_your_species.table
      description: >-
        The weapon-class table on PDF 29 matches the Equipment table on PDF 51 cell for cell
        (1 20 20; 2 25 30; 3 30 40; 4 40 50; 5 55 N/A; 6 20 N/A), with the same column headings, so
        representing it by table.equipment.weapon_class_strength, which cites both pages, is right.
        Only the example sentences differ: PDF 29 adds "Class 6 is not heavy but requires 2 hands."
        and uses "would require" and "could never be used with one hand", while PDF 51 says
        "requires" and "can never be used with only one hand". The four creation example fixtures
        quote the PDF 29 wording verbatim. For the Equipment reviewer: that table's footnote ("Class
        5 and Class 6 weapons require two hands. The Huge shield has a separately printed
        exception.") is not printed as a footnote on either page. It is outside this unit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 29
          printed_page: 27
          heading: Strength and Weapon Class
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 51
          printed_page: 49
          heading: Class
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.creating_your_character
      description: >-
        Checked cell by cell against the rendered pages. Species stat rolls: Dwarf
