        55 +2, 60 +3, 65 +4, 70 +5. All eight profession skill tables (12 cells each, including N/A,
        ±0 and the Hit Points modifier) match. I checked Ranger and Thief again on a 3.5x crop.
        Profession grants, grant choices, starting abilities, starting equipment quantities and
        choices, and the Limitations and Special numbers all match the pages.
