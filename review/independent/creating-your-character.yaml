        procedure.character_creation_skill, procedure.character_creation_equipment_wear,
        species.dwarf, species.halfling, character.energy.initial) mark every elision with "...",
        and each fragment is verbatim. Effects match the printed rules: 2 shared rerolls including
        HP, never a reroll of a reroll, keep the highest; a 15-point specialisation with at most 10
        per stat, where the procedure requires all 15 to be spent, a reasonable reading of "you must
        divide the points"; skill = stat + profession modifier, floored at 0; Free Skill +10 once on
