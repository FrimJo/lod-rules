      object_id: profession.barbarian
      description: >-
        Run-in headings in profession source_text: Barbarian, Ranger, Rogue, Warrior, Warrior Priest
        and Wizard write each printed sub-heading as "Talents: ..." with a colon. The page prints
        these as stand-alone headings with no colon. Alchemist and Thief instead keep the heading on
        its own line and also quote the description paragraph. In every case the body words, order,
        page pointers and punctuation are verbatim, nothing is dropped inside a quoted paragraph, and
        the added colon only flattens heading plus paragraph. This is acceptable verbatim
        transcription, though a single convention would be cleaner. Small normalisation in
        printed_reference: trailing punctuation is regularised to a full stop, for example "Frenzy
        (page 167)." where the page has a comma, and "Observant (page 170)." where it has a comma.
