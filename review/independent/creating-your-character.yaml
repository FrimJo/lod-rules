      description: >-
        Re-check of review.creating_your_character.1 finding 1. The Barbarian, Ranger, Rogue and
        Wizard equipment-limit rules now cite heading "Limitations", the run-in heading printed
        above each sentence on PDF 35, 36, 37 and 41. source_text and the Tier 3, Tier 3, Tier 3 and
        Tier 2 require effects are unchanged and still match the pages. The eight derived armour
        fixtures in tests/examples/characters/profession-catalogue.yaml also cite "Limitations".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 35
          printed_page: 33
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 36
          printed_page: 34
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 37
          printed_page: 35
          heading: Limitations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 41
          printed_page: 39
          heading: Limitations
      disposition:
        status: corrected
        change: >-
          source[0].heading set to "Limitations" on
          character.profession.{barbarian,ranger,rogue,wizard}.equipment_limits and on the
          test.profession.*.armour_* fixtures; verified on PDF 35, 36, 37 and 41.
    - kind: source_reference_error
      section_id: section.creating_your_character
      object_id: table.character.barbarian_skills
      description: >-
        Re-check of finding 2. The Barbarian, Ranger, Rogue, Warrior, Warrior Priest and Wizard
        skill tables now cite heading "Skills", printed above each table on PDF 35 to 37 and 39 to
        41, with locator.table "<Profession> Skills" as the Alchemist and Thief tables already had.
        Only the source block changed; I spot-checked the Wizard table cells again on PDF 41
        (-5/-10/-10/-20/+5/-5 and -20/-10/+10/-20/N/A/±0), and they match.
      source:
        - document: rulebook.second_printing.eng
