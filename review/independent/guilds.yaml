        and "Between each quest, roll 1d10" on the page exactly. Rows 2-8 (Fire Staff, Major Mana Staff,
        Mana Staff, Minor Mana Staff, Staff of Illumination, Staff of Slow, Staff of the Bolt) print no die
        and carry blank cells. The Effect, Staff, Availability and Cost cells are unchanged and remain
        verbatim against the page (including the thresholds "9-10" and "10", which stay in the Effect text
        and in the linked rules). The row order, entity_refs, source reference (PDF 153, printed 151,
        heading Buying Wizard's Staffs, uncaptioned table locator) and the table source_text quotation are
        unchanged and correct; the column is a derived column and adds no content the page does not print.
