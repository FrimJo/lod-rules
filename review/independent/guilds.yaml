  findings:
    - kind: ok_with_note
      section_id: section.fighters_guild.buying_special_equipment.table
      object_id: character.settlement.equipment.shield_padding
      description: 'Changed since review.guilds.6: the add effect on maximum_durability was removed;
        maximum_durability is now a read-only state input (described as the Durability before
        padding, from character.durability.standard or character.durability.magic), a new output
        durability_total is set to maximum_durability + durability_modifier, and dependencies to
        character.durability.standard and character.durability.magic were added. source_text,
        reference (PDF 152, printed 150, Buying Special Equipment) and the +1 literal are
        unchanged and still match the table row "Shield Padding | 1 | - | Increases the durability
        of a shield by +1 | 4 | 15 c". The run-in Shield Padding prose on the same page ("giving it
        a total Durability of 7. A magic shield would thus have a Durability of 9.") equals
        durability_total for base 6 (PDF 51/52, printed 49/50: "all armour and shields have a
        durability of 6, unless otherwise noted") and base 8 (PDF 70, printed 68: "Weapons, armour,
        and shields have 8 Points of Durability instead of the ordinary 6 points."). Both new
        dependency targets exist and are the two base-Durability rules the sum reads. Double
        counting: within this rule the bonus enters once (set, not add, and maximum_durability is
        no longer mutated, so re-evaluating the rule cannot stack it); the field description says
        the modifier is the only bonus to apply. Residual consumer risks, not errors on the page:
        (a) character.settlement.guild.fighters.shield_padding (unchanged) also outputs
        durability_modifier 1 for the same purchase, so a consumer that sums durability_modifier
        across every fired rule would get +2; both rules set the field to the same value, so
        last-write evaluation is safe. (b) The book gives a padded shield one Durability (7, or 9
        magic); the corpus now carries it as durability_total while maximum_durability keeps the
        unpadded value, so a consumer that feeds maximum_durability unchanged into the settlement
        repair step (procedure.settlement_buy_sell_and_service sets durability to
        maximum_durability; outside this scope) would repair a padded shield to 6 rather than 7.
        Suggest a later review of that procedure confirm its maximum_durability input is the
        padded total. The when clause still tests only selected, not that the item is a shield
        (unchanged; noted in earlier reviews).'
