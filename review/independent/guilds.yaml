  findings:
    - kind: modelling_error
      section_id: section.alchemists_guild.table
      object_id: table.guild.alchemist_availability
      description: 'PDF 154 prints two separate uncaptioned tables side by side: a parts table with headers "Type | Avail" printed as two column pairs (30 parts, Amphibian skin to Zombie skin, footnote 1 on Cyclops eye, Shapeshifter blood and Spores) and an ingredients table with headers "Ingredient | Availability" (20 rows, Lunarberry to Wintercress, no footnote). Every cell matches the page, but table.guild.alchemist_availability merges both into one table whose column labels "Type / Ingredient" and "Avail / Availability" are not printed anywhere, distinguishes parts from ingredients only by row number (1-30 vs 31-50) and the entity_refs prefix, and attaches the False Prophet footnote to a table that also holds the ingredients it does not annotate. This is a table-structure defect: the book draws two tables with their own headers, and the corpus rule is that tables stay structured as printed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 154
          printed_page: 152
          heading: 'Purchasing Ingredients, Parts, and Potions'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'Split into two table objects. Keep table.guild.alchemist_availability (rename it to the parts table) with columns "Type" and "Avail", rows 1-30 and the footnote; add a new table (for example table.guild.alchemist_ingredients) with columns "Ingredient" and "Availability" and the 20 ingredient rows, no footnote, owned by a new section node (for example section.alchemists_guild.table_2, kind table, PDF 154 / printed 152) with its own coverage row. Add the new table to guild.alchemists.tables and to the dependencies of character.settlement.guild.alchemists.purchases, and update the coverage notes of section.alchemists_guild.table.'
    - kind: modelling_error
      section_id: section.fighters_guild.table
      object_id: table.guild.fighters_bounty
      description: 'The Bounty Hunt table on PDF 151 is a rolled table ("Roll on the table 5 times"; header "1d00", results 1-2 to 00). All 99 rows match the page, including the printed spellings "Giant Leach" and "Wraiths" and the out-of-order "34 Bat Swarm". It is modelled as type reference_table with the roll column as free text, so a consumer cannot resolve a d100 result to a row and the 00 = 100 endpoint is not stated. Other rolled tables in the corpus use type random_table with range cells and a roll_domain.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 151
          printed_page: 149
          heading: 'Bounty Hunt'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'Change table.guild.fighters_bounty to type random_table with roll_domain 1-100, make the roll column cell type range (1-2 as 1..2, 3 as 3..3, ..., 00 as 100..100, keeping the printed text "00"), and keep the printed label "1d00".'
    - kind: modelling_error
      section_id: section.rangers_guild.table
      object_id: table.guild.taxidermy_sale
      description: 'The Taxidermist sale table on PDF 156 is a rolled 1d20 table ("roll on the following table"). All eight rows and both columns match the page (Village -500/-400/-300/-150/0/50/100/200; Silver City -300/-200/-100/-50/0/100/200/300). It is modelled as type reference_table with the roll ranges and the numeric values as text cells, so the table itself cannot be resolved from a roll; only procedure.ranger_trophy_sale hard-codes the values. Other rolled tables in the corpus use type random_table with range cells and a roll_domain.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 156
          printed_page: 154
          heading: 'Taxidermist (350 c)'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'Change table.guild.taxidermy_sale to type random_table with roll_domain 1-20, roll column cell type range (1, 2-3, 4-5, 6-8, 9-14, 15-17, 18-19, 20) and the Village and Silver City cells as number cells keeping the printed strings.'
    - kind: uncertainty_not_recorded
      section_id: section.rangers_guild
      object_id: procedure.ranger_special_talent
      description: 'Special talents prints "A ranger may learn the following talents at any time by paying the tutor fee." The book does not say whether learning needs a visit to the Rangers’ Guild, a settlement activity, or can happen outside a settlement. procedure.ranger_special_talent gates every learn step on Silver City, guild access, business allowed, an authorised and completed activity reservation; that reading is not printed and no issue recorded it. Recorded as a new issue.'
      source:
