  findings:
    - kind: modelling_error
      section_id: section.into_the_dungeons.obstacles.rule_of_fifty_percent
      object_id: test.core.obstacle.half_square.torture_rack_white_square
      description: >-
        Re-review of the open finding in review.into_the_dungeons_movement.1. On PDF 94 the torture
        rack example prints only the outcome: the white square is blocked and the other squares allow
        normal movement. Both source_example fixtures
        (test.core.obstacle.half_square.torture_rack_white_square, occupied_fraction 0.75, movement
        affected; test.core.obstacle.half_square.torture_rack_other_squares, 0.25, no effect) now say
        in the locator region that the book prints only that outcome and that the value is an estimate
        read off the diagram, not a printed number. Top-level confidence is medium. The quoted
        source_text is the printed sentence verbatim. The rule_of_fifty_percent coverage note now says
        the same. The estimates are consistent with the diagram (the rack covers most of the white
        square and small parts of its neighbours).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 94
          printed_page: 92
          heading: The rule of 50%
          locator:
            region: Torture rack diagram with the white square outlined
      disposition:
        status: corrected
        change: >-
          Both torture rack fixtures disclose in the locator region that occupied_fraction (0.75 and
          0.25) is an estimate read off the diagram and that the book prints only the outcome;
          confidence lowered to medium; coverage note for rule_of_fifty_percent updated.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.obstacles.climbing_pits
      object_id: issue.movement.pit_climb_up_failure
      description: >-
        Issue linkage verified. issue.movement.pit_climb_up_failure is unresolved, its summary quotes
        the PDF 93 sentence "If the test fails, the hero falls into the pit taking damage as outlined
        on the exploration or trap card." correctly, and its related list names core.movement.pit_failure
        and core.movement.pit.up_without_rope. Both rules now list the issue under issues, so the link
        runs both ways. core.movement.pit_failure keeps the printed sentence verbatim and still gates
        on test_failed and climbing_down = false, as the FAQ ruling ("No Dex test is needed.", checked
        in the FAQ file) requires; issue.movement.pit_down_test stays resolved on that ruling.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.obstacles.climbing_pits
      object_id: core.movement.pit.up_without_rope
      description: >-
        Re-checked the Climbing Pits paragraph against the five rules: climbing up needs a DEX test and
        2 AP (core.movement.pit.up_without_rope); with a rope held by the hero or any friend adjacent
        to the pit there is no DEX Test and it takes 1 Action (core.movement.pit.up_with_rope, with
        issue.movement.rope_climb_action still unresolved); place the hero anywhere adjacent to the pit
        (core.movement.pit_exit); climbing down takes 1 AP with no DEX Test
        (core.movement.pit.down). source_text is verbatim in all five, including the printed capital in
        "DEX Test". Minor note: the climbing_pits coverage note names issue.movement.pit_down_test and
        issue.movement.rope_climb_action but not issue.movement.pit_climb_up_failure. The note stays
        accurate without it, so no change is required, but the extraction side may add it on the next
        edit.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.moving_and_facing
      object_id: core.movement.diagonal_models
      description: >-
        Re-read PDF 93. term.facing and the five Moving and Facing rules (distance, facing, diagonal
        between two models only if both are friendly and never for Large or X-Large, no straight move
        through an occupied square without a special rule, no diagonal past a tile's black border or a
        door post) quote the page verbatim, including "X-Large" and the bold "both". The four
        source_example fixtures for the blue/yellow diagram match it (1 between two blue models; 2 and
        3 each next to a yellow model; 4 open without B; the side and up/down squares occupied), and
        the A to B tile-border example is expected to fail. The example source_text keeps the printed
        "in when trying". The digests of these objects have not changed since record .1.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Moving and Facing
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_4
      object_id: table.dungeon.obstacles
      description: >-
        The table digest has not changed since record .1, which checked every cell. I re-read PDF 94-98
        and checked the row count (4, 9, 8, 8 and 6 rows, 35 in total) and the rows with printed quirks:
        Altar ("must be climbed at 2xM") against Table and Sarcophagi ("has to be climbed"), Chest
        "1x.", Chair, Open and Stairs "No effect" without a full stop, Brazier and Pit "No Entry", Well
        "No entry.", the two-sentence Pillar LOS cell, Statue "larger than 50% of square", and Torture
        tools "No entry" with "This has several different appearances." All match. N/A is typed as a
        marker. The Example column is artwork only and the coverage note says so. Section page ranges
        (PDF 93-98, printed 91-96, per pages.yaml) and the coverage notes of the other sections match
        the pages. core.obstacle.half_square and core.obstacle.square_effects are unchanged and still
        match PDF 93-94.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 94
          printed_page: 92
          heading: List of Obstacles
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 98
          printed_page: 96
          heading: List of Obstacles
      disposition:
        status: no_change_needed
