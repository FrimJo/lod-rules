  findings:
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_4
      object_id: table.dungeon.obstacles
      description: >-
        Checked all 35 rows (Altar to Well) cell by cell on 4x enlarged crops of PDF 94-98: 4 rows on
        PDF 94, 9 on 95, 8 on 96, 8 on 97 and 6 on 98, each row's page citation correct. Every Square,
        Moving, LOS/Shooting, Height advantage and Special cell matches, including the printed quirks:
        "1x." for Chest, "No entry." for Well, "No Entry" capitalised for Brazier and Pit but "No entry"
        elsewhere, "No effect" without a full stop for Chair, Open and Stairs, "must be climbed at 2xM"
        (Altar) against "has to be climbed at 2xM" (Sarcophagi, Table), "larger than 50%" for Statue
        and the two-sentence Pillar LOS cell. N/A and "-" are typed as markers; source_row agrees with
        the cells. The Example column is artwork only and its omission is disclosed in the coverage
        note; the intro source_text keeps the printed "they make look differently".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 94
          printed_page: 92
          heading: List of Obstacles
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 98
          printed_page: 96
          heading: List of Obstacles
      disposition:
        status: no_change_needed
    - kind: modelling_error
      section_id: section.into_the_dungeons.obstacles.rule_of_fifty_percent
      object_id: test.core.obstacle.half_square.torture_rack_white_square
      description: >-
        The torture rack example (PDF 94) prints only the outcome: the white square is blocked and the
        other squares allow normal movement. The two source_example fixtures feed occupied_fraction
        0.75 (white square) and 0.25 (other squares), numbers the book does not print. On the enlarged
        diagram the rack covers most of the white square and small parts of its neighbours, so the
        values are plausible estimates and the outcome holds for any value above or at most 0.5. They
        are not justified as source values, though: nothing in either fixture says they were read off
        the artwork, and confidence is high. test.core.obstacle.half_square.torture_rack_other_squares
        has the same problem. The derived exact_half (0.5, no effect) and over_half (0.51) cases are
        justified by "more than 50%".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 94
          printed_page: 92
          heading: The rule of 50%
          locator:
            region: Torture rack diagram with the white square outlined
      disposition:
        status: open
        proposed_correction: >-
          In test.core.obstacle.half_square.torture_rack_white_square and
          test.core.obstacle.half_square.torture_rack_other_squares, state in the source locator region
          that the occupied_fraction values (0.75 and 0.25) are estimates read off the diagram and that
          the book prints only the outcome (white square blocked, others normal), and lower confidence
          to medium. Alternatively make both derived_case fixtures and keep the quoted sentence.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.obstacles.climbing_pits
      object_id: core.movement.pit.down
      description: >-
        The FAQ pit-down ruling ("No Dex test is needed.") is applied as the extraction guide requires.
        core.movement.pit.down keeps the printed sentences verbatim, sets 1 AP and no DEX test, and
        cites both PDF 93 and the FAQ question as heading with no pages. core.movement.pit_failure
        keeps its printed sentence, adds climbing_down = false to its when, and cites the FAQ;
        test.core.movement.pit_failure.climbing_down cites both and expects no effect.
        issue.movement.pit_down_test is resolved with a resolution citing the FAQ. The other pit rules
        (2 AP plus DEX test without a rope, 1 Action and no test with a rope, place the hero anywhere
        adjacent) match the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.obstacles.climbing_pits
      object_id: core.movement.pit_failure
      description: >-
        After the FAQ ruling, "If the test fails, the hero falls into the pit taking damage as outlined
        on the exploration or trap card" has no clear referent. The rule applies it to a failed climb-up
        DEX test, although "falls into the pit" suits a hero on the ledge and the damage is the card's.
        The book also does not say whether a failed climb-up still spends the 2 AP. This was not
        recorded. I recorded it as a new issue; core.movement.pit_failure and
        core.movement.pit.up_without_rope should list it under issues when the extraction side next
        edits them.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: recorded_as_issue
        issue_id: issue.movement.pit_climb_up_failure
    - kind: ok_with_note
      section_id: section.into_the_dungeons.obstacles.climbing_pits
      object_id: issue.movement.rope_climb_action
      description: >-
        The page does price the unaided climb in AP ("a DEX test and 2 AP") and the rope climb as "1
        Action". The issue is genuine and correctly unresolved; core.movement.pit.up_with_rope cites it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.moving_and_facing
      object_id: core.movement.diagonal_models
      description: >-
        term.facing and the five Moving and Facing rules quote the page verbatim and their constraints
        match it (facing a side, free facing change, movement limit, diagonal only between two friendly
        models, never for Large or X-Large, no moving straight through an occupied square without a
        special rule, no diagonal past a tile border or door post). Checked the example fixtures
        against the diagram: square 2 lies between a blue and a yellow model, square 3 between two
        yellow models, square 4 between B and a yellow model, and the side and up/down squares are
        occupied. The tile-border example (A to B) is correctly expected to fail. The example
        source_text keeps the printed "in when trying".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Moving and Facing
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.obstacles.rule_of_fifty_percent
      object_id: core.obstacle.half_square
      description: >-
        The rule quotes the paragraph verbatim and gates on more than 0.5. The LOS sentence ("the art of
        the entire torture rack will affect LOS") has no effect. The coverage note discloses this and it
        needs supplied geometry. core.movement.furniture (one extra movement point, ends on top) and
        core.obstacle.square_effects (PDF 93 paragraph and PDF 94 introduction, Room Description left
        unresolved) also match. Section page ranges and coverage notes for all six sections agree with
        the pages.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 94
          printed_page: 92
          heading: The rule of 50%
      disposition:
        status: no_change_needed
  outcome: failed
  summary: >-
    Rendered and read PDF 93-98 (printed 91-96), with 4x crops of every table row. The 35-row List of
    Obstacles table is cell-exact, and the FAQ pit-down ruling is applied correctly. One finding is
    open: the torture rack source_example fixtures use coverage fractions (0.75 and 0.25) that the book
    does not print and do not mark them as estimates. One new issue records the unclear referent of the
    pit failure sentence (issue.movement.pit_climb_up_failure).
