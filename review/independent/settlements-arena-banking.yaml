  findings:
    - kind: uncertainty_not_recorded
      section_id: section.settlements.arena_fighting
      object_id: procedure.arena_fighting
      description: 'Betting, Odds, and Winning prints "After each level, if the hero won, multiply the amount you paid to enter the fight with the following modifiers (RDD)". procedure.arena_fighting adds fee x modifier for every won level to winnings and coins and keeps earlier payouts after a later loss (wins_all_three expects 200 + 220 + 240 = 660 c on a 100 c fee; loses_final keeps 680 c after losing the final). The page does not say whether payouts accumulate, only the last won level pays, or the amount compounds, nor whether earlier winnings survive a later loss. No issue recorded this reading. Recorded as a new issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Betting, Odds, and Winning
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: recorded_as_issue
        issue_id: issue.settlement.arena_winnings_accumulation
    - kind: modelling_error
      section_id: section.settlements.arena_fighting
      object_id: procedure.arena_fighting
      description: 'The procedure (and the rule and table that feed it) applies one reading of the winnings sentence as if printed, without citing the uncertainty: no issues entry on procedure.arena_fighting, character.settlement.arena_results or table.settlement.arena_odds points at it, and the winnings / *_payout field descriptions present the summed payout as the rule. The derived fixtures wins_all_three, declines_semi_final and loses_final depend on that reading.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Betting, Odds, and Winning
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'Add issue.settlement.arena_winnings_accumulation to the issues lists of procedure.arena_fighting, character.settlement.arena_results and table.settlement.arena_odds; in procedure.arena_fighting say in the winnings field description (and group/semi/final_payout) that summing every won level and keeping it after a later loss is the reading applied pending that issue; name the reading in the source_text or name of test.procedure.arena_fighting.wins_all_three and loses_final (or list the issue under their unresolved expectations).'
    - kind: uncertainty_not_recorded
      section_id: section.settlements.banking
      object_id: procedure.settlement_banking
      description: 'The page allows money in several banks and says "roll on the table below (1d20) and adjust the account balance", with one roll column per bank in a single table. procedure.settlement_banking is run once per bank with its own roll (field bank: "run once per bank holding the hero’s money"; field roll: "1d20 ... for this bank"), and the section coverage note says "rolls 1d20 per account". The page does not say whether one roll is read across every bank used or each account rolls separately. No issue recorded this reading. Recorded as a new issue.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 143
          printed_page: 141
          heading: Determining the Profit…or Loss
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: recorded_as_issue
        issue_id: issue.settlement.bank_roll_per_account
    - kind: modelling_error
      section_id: section.settlements.banking
      object_id: procedure.settlement_banking
      description: 'The one-roll-per-account reading is stated as rule in the bank and roll field descriptions of procedure.settlement_banking and in the coverage note of section.settlements.banking, without citing the uncertainty.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 143
          printed_page: 141
          heading: Determining the Profit…or Loss
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'Add issue.settlement.bank_roll_per_account to the issues lists of procedure.settlement_banking, character.settlement.banking and table.settlement.bank_returns; reword the bank and roll field descriptions to say a separate roll per account is the reading applied pending that issue, and cite the issue in the section.settlements.banking coverage note next to "rolls 1d20 per account".'
    - kind: ok_with_note
      section_id: section.settlements.table_3
      object_id: table.settlement.arena_odds
      description: 'All 40 cells of the Hero lvl / Group / Semi / Final table match the page, comma decimals kept as printed (10: 1,1 1,3 1,5 down to 1: 2,0 2,2 2,4). The cells are typed text with no numeric value; procedure.arena_fighting does not look them up but derives tenths as 21, 23 and 25 minus Hero lvl. I checked that formula against every printed cell and it reproduces all 30 modifier cells. RDD is modelled as floor(fee x tenths / 10), which matches "(RDD)".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Betting, Odds, and Winning
          locator:
            table: Hero lvl
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.arena_fighting
      object_id: character.settlement.arena_entry
      description: 'Verbatim check of Participating, Calculating the Chance of Victory, Betting, Odds, and Winning and Losing against the source_text of both arena rules and the procedure: wording matches. The Hero Hit Points (<10 -5, 10-15 0, >15 +5), Hero STR (<40 -5, 40-50 0, >50 +5) and Level (Group -10, Semi -15, Final -20) tables and the 1d10 Extra Award table (1 Wonderful Treasure, 2-4 Fine Treasure, 5-10 Nothing extra) match cell by cell. Procedure branches match the page: the semi-final is optional ("you may go on", continue_to_semi), the final follows a semi win without a choice, one CS roll per level with HP, STR and level modifiers, XP 50/100/150 to the hero alone, loss costs 2/4/6 HP and 2 Sanity, and the fee is paid once. The bracket diagram adds no rule. The table name "Arena stage modifiers" uses "stage" where the book prints "Level"; the id says level, so this is only a label.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 141
          printed_page: 139
          heading: Calculating the Chance of Victory
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 142
          printed_page: 140
          heading: Losing
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.banking.table
      object_id: table.settlement.bank_returns
      description: 'All eleven rows by four columns of the uncaptioned profit or loss table match the page, including the dashes and the printed "5 % loss" with a space. The twelve result steps of procedure.settlement_banking reproduce every range per bank (checked step by step), only roll when a balance already exists ("If your hero already has money in the bank"), apply Robbed! by setting that account to 0, and allow deposit or withdrawal afterwards. The procedure keeps fractional balances, as issue.settlement.bank_return_rounding records. Requiring in_silver_city matches "Each time you visit Silver City (and the bank)" and the Silver City-only Banks service.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 143
          printed_page: 141
          heading: Determining the Profit…or Loss
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.settlements.arena_fighting
      object_id: procedure.arena_fighting
      description: 'Available Actions (PDF 134) prints Arena Fighting: Arena, 1 and Banking: Banks, 1; both procedures set activity_points 1. Neither the table row nor pages 139-141 print a once-per-stay or once-per-visit limit for either activity, so none is modelled, which is right. The changelog 2.21 has no entry for printed pages 139-141. Derived fixtures were checked by hand: targets, multipliers, payouts, coins, XP and losses follow the procedure, and the bank fixtures follow the table.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
          locator:
