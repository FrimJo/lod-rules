  outcome: failed
  summary: 'Arena Fighting (PDF 141-142) and Banking (PDF 143) match the page in wording, every modifier, multiplier, award and bank range, and in their procedure branches. The record fails on two unrecorded readings: whether arena winnings for several won levels accumulate (procedure.arena_fighting sums them and keeps them after a later loss) and whether one 1d20 or one per account is rolled when money sits in several banks. Both are now unresolved issues, and two open findings ask the extraction side to cite them on the affected objects.'
