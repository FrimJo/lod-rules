  findings:
    - kind: uncertainty_not_recorded
      section_id: section.quest_book_i.introduction.reading_the_quests
      object_id: core.quest_book.threat_threshold_monster
      description:
        The printed rule says a quest monster appears when the Threat Level "reaches ‘XX’" and
        "every time the Threat Level is increased to XX". Threat can rise by more than 1 at once
        (Jumpy adds 2), and the page does not say whether an increase that passes over XX
        (11 to 13 with XX = 12) counts. The rule's when clause (current_threat eq quest_threshold
        and current_threat gt previous_threat) silently answers no. Recorded as an unresolved
        issue rather than an open correction, since the book does not decide it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 222
          printed_page: 220
          heading: Triggering Wandering Monsters
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.threat_threshold_overshoot
    - kind: ok_with_note
      section_id: section.quest_book_i.introduction.reading_the_quests
      object_id: test.quest_book.threat_increase_again
      description: 'All three fixtures (test.quest_book.threat_increase, .threat_decrease and
        .threat_increase_again) quote the printed "Ex:" paragraph verbatim, including the "Ex:"
        lead and the bold "decreased", and their inputs agree with it: 11 to 12 triggers with no
        Threat reduction, 13 to 12 (increased more and then reduced back to 12) does not, and
        decreasing below 12 then increasing back to 12 triggers again. threat_increase_again has
        the same inputs as threat_increase because the rule compares only the previous and
        current Threat; the history (an earlier placement at 12) is carried by
        procedure.quest_reading_and_events, which consumes each change once. Acceptable.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 222
          printed_page: 220
          heading: Triggering Wandering Monsters
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.introduction.reading_the_quests
      description: 'core.quest_book.reading_boundaries, core.quest_book.aftermath_looting (including
        ‘off table’ and "with no traps or locks"), core.quest_book.individual_repeatability and
        the Triggering Wandering Monsters text are verbatim against PDF 222; the "Threat Level is
        not decreased when the Wandering Monster is placed" clause is typed as
        threat_reduction_on_placement 0. core.quest_book.catalogue_structure quotes the
        Introduction paragraph verbatim; Quest Book II is cited via external_references
        (manifest not_present) and nothing from it is invented. The coverage note correctly says
        the page prints no key to the quest headings.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 222
          printed_page: 220
          heading: Reading the Quests
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.introduction.first_blood_introductory_quest
      object_id: procedure.first_blood
      description:
        'Setup, Special rules and Aftermath on PDF 223 are verbatim in the six scenario_rule
        records (three bandits and one bandit leader; leader longsword, shield, armour 1; two
        shortsword bandits armour 0; one shortbow and dagger bandit armour 0; four wilderness
        open-ground tiles; heroes centre and adjacent; random edge and 1d10 squares; +2 initiative
        tokens on the first turn; 10-square sight and shooting limit; no Scenario die), all
        quest-scoped with quest_id quest.first_blood. Monster and equipment card values are left
        unresolved, not invented. The procedure places all four adversaries ("each bandit"),
        reading the leader as one of the bandits; the Aftermath''s "With the bandits dead"
        supports that reading, so no issue is raised.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 223
          printed_page: 221
          heading: Setup
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.random_quests.table
      object_id: table.quest.random_quests.objective_room
      description:
        'The uncaptioned 1d6 / Objective room table has six rows, all cells match (1 The Lava
        River, 2 The Bandits’ Hideout, 3 The Fountain Room, 4 The Great Crypt, 5 The Chamber of
        Reverence, 6 Roll Again) and it has exactly one section node. The Random Quests paragraph
        is verbatim in core.quest_book.random_quests.selection_order and
        procedure.random_quest_selection. The second-stage "roll which quest to embark upon" has
        no printed die or mapping and is correctly left to issue.quest.random_quest_second_stage.
        The procedure field offer_id ties the selection to a settlement quest offer, which this
        page does not mention; it is wiring to another chapter, not a mechanic of this page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 243
          printed_page: 241
          heading: Random Quests
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
