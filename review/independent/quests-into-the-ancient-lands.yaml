  findings:
    - kind: ok_with_note
      section_id: section.quest_book_i.quests_into_the_ancient_lands
      object_id: edge.summary.ancient_lands_travel.movement
      description: 'New edge. PDF 263 (printed 261), "Travelling in the Ancient lands" (printed
        lower-case "lands"), prints "As described in the main rules, travelling in the Ancient
        Lands is difficult. Not only does each hex require 2 Movement Points, but each day also
        requires 2 Rations ..."; source_text is that text verbatim, cut after "2 Movement
        Points," with a trailing " ..." (a mid-sentence cut rather than a join of two sentences,
        but nothing is reworded). "As described in the main rules" is the book''s own pointer, so
        summary_of holds. Direction from core.quest.ancient_lands.travel_costs (the PDF 263 rule) to
        procedure.travel_daily_movement is right: PDF 126 (printed 124) Travelling and Skirmishes
        says every hex below the white dotted line is in the Ancient Land and is a Desert Hex, and
        Moving on the Map prints "A Desert Hex costs 2 Movement Points, unless all heroes have
        camels. Then it is 1,5 points per hex."; that procedure holds those steps (desert_cost,
        camel_desert_cost). No contradiction: the summary omits the 1,5 camel cost but says a camel
        "reduces the travel time", consistent with the detail. Source ref and name accurate.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 263
          printed_page: 261
          heading: Travelling in the Ancient lands
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 126
          printed_page: 124
          heading: Moving on the Map
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.quests_into_the_ancient_lands
      object_id: edge.summary.ancient_lands_travel.rations
      description:
        'New edge. source_text joins "As described in the main rules, travelling in the Ancient
        Lands is difficult." and "but each day also requires 2 Rations to accommodate the extra
        water supplies needed." with " ... ", verbatim from PDF 263. The pointer is the same "As
        described in the main rules". to procedure.travel_food_and_rest is the right record: PDF 127
        (printed 125), continuing Rations and Resting from PDF 126, prints "When travelling in the
        Ancient Lands, each hero requires 2 rations per day (simulating the need for water), and
        Foraging is not possible in that barren land." The two printed passages differ in substance:
        the summary says 2 Rations per day without "each hero", the detail says each hero. This is
        not an unrecorded uncertainty: the procedure applies changelog 2.21 entries 76 and 167 ("the
        party requires 2 rations per day"), which agree with the PDF 263 wording, and
        issue.travel.partial_rations (unresolved) records the remaining one-ration case. The summary
        also omits the Foraging ban, an omission rather than a contradiction. Source ref PDF 263 /
        printed 261 / heading, and the name, are accurate.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 263
          printed_page: 261
          heading: Travelling in the Ancient lands
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 126
          printed_page: 124
          heading: Rations and Resting
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 127
          printed_page: 125
          heading: Rations and Resting
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.quests_into_the_ancient_lands
      description: 'Scope check: the digest for the same 11 section ids differs from
        review.quests_into_the_ancient_lands.3 only by the two added edges; all 121 other examined
        objects have identical object digests and are carried forward on record .3
        (passed_with_corrections, no open findings; its corrections were verified there and are not
        re-claimed here). Re-rendered spot checks still hold: all five Threat tables print 1d6 /
        Same as start lvl / 20 (PDF 264, 266, 268, 270, 271); the Temple curse lasts "until the
        heroes leave their next dungeon" (PDF 269); the Outpost toll is 100 c per hero for yellow
        1-12 (PDF 138).'
      source:
