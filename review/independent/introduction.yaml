  findings:
    - kind: transcription_error
      section_id: section.introduction.abbreviations_and_terminology
      object_id: core.quest.end_uncertain
      description:
        source_text is presented as a quotation but is stitched and abridged. On PDF 16 the End
        of the Quest entry continues "If an effect lasts ‘until the end of the quest’, it will last
        until you get your next reward." and that sentence (the second endpoint the rule is about)
        is omitted; on PDF 17 the entry reads "This term indicates that the modifier will last until
        the heroes return to the city after a quest, but before beginning any activities in the
        city." and the record drops "This term indicates that". issue.0004 also quotes neither the
        "until you get your next reward" sentence nor the fact that the two headwords use different
        phrases (‘until the end of the quest’ vs ‘Until end of (next) quest’).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 14
          pdf_page: 16
          section: Abbreviations and Terminology
          heading: End of the Quest
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 15
          pdf_page: 17
          section: Abbreviations and Terminology
          heading: Until end of (next) quest
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction:
          'core.quest.end_uncertain: set source_text verbatim to "End of the Quest: This
          is the moment when you get your reward for a finished quest. If an effect lasts ‘until the
          end of the quest’, it will last until you get your next reward. … Until end of (next)
          quest: This term indicates that the modifier will last until the heroes return to the city
          after a quest, but before beginning any activities in the city." (or split into two quoted
          passages), and add section: Abbreviations and Terminology to the second source. Consider
          extending issue.0004 summary with the "until you get your next reward" quotation.'
    - kind: missing_extraction
      section_id: section.introduction.dice_rolling_and_skill_checks
      description:
        'PDF 18 states the success threshold: "A result equal to or less than the skill or stat
        level will result in a success." No record citing this section quotes or sources it.
        core.dice.percentile stops before it, and core.check.success / core.check.standard cite only
        Success and Failure on PDF 20 (worded "equal to or lower than the stat or Skill Level"). The
        coverage note for the section lists only core.dice.percentile, core.check.modifier and
        core.check.automatic_failure, so the rules component is marked extracted while this printed
        statement has no provenance from this page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 16
          pdf_page: 18
          heading: Dice Rolling and Skill Checks
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction:
          Add a PDF 18 / printed 16 source (heading Dice Rolling and Skill Checks) to
          core.check.success and core.check.standard (or extend core.dice.percentile source_text
          with the sentence), and name it in the section coverage note.
    - kind: uncertainty_not_recorded
      section_id: section.introduction.game_components
      description:
        'Small tokens on PDF 15: "Rules for these tokens are not included in this book but hold
        on to them. You will soon be told how to put them to good use!" The coverage note mentions
        this, but no issue recorded that the rulebook leaves these pictured tokens undefined.'
