    - kind: modelling_error
      section_id: section.travelling_and_skirmishes.moving_on_the_map
      object_id: procedure.travel_daily_movement
      description: 'The page draws two different conditions: the Desert Hex reduction applies "unless all heroes have camels. Then it is 1,5 points per hex", while the 6-point allowance needs "a party where all members are riding horses or camels". The procedure folds both into the single transport_mode value all_camels, so camel_desert_cost (1,5) is reachable only together with the 6-point allowance. A party whose heroes all have camels but which also has a walking mercenary or a mule (3 Movement Points, Desert Hex 1,5) cannot be represented and is charged 2 per Desert Hex; the heroes / members distinction is collapsed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 126
          printed_page: 124
          heading: Moving on the Map
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: 'procedure.travel_daily_movement: add a supplied boolean input all_heroes_have_camels; make camel_desert_cost depend on terrain desert and all_heroes_have_camels true, independent of transport_mode; keep transport_mode for the 3/6 allowance only (all_camels can then be dropped or kept as a riding value). Add a derived fixture for a walking party whose heroes all have camels entering a Desert Hex at 1,5.'
    - kind: ok_with_note
      section_id: section.travelling_and_skirmishes.rations_and_resting
      object_id: procedure.travel_food_and_rest
      description: 'source_text matches PDF 126-127 word for word, including "– 10", "(RDD)", "lowered by 4" and "each hero requires 2 rations". Changelog 2.21 entry 166 (rendered changelog p. 25: "Page 125 Changed into ''Party Morale is also lowered by 1 per character (Mercenaries included, not dogs)''") is applied in step hunger_morale as party_member_count minus dog_count, once per hunger (guarded by hunger_morale_active) and restored by restore_morale when the party eats, keeping the printed duration and non-cumulation sentences; the printed sentence stays quoted and the step cites PDF 127 and row 166. This matches the resolution of issue.psychology.hungry_morale_duration_and_travel_penalty (frozen). Entries 76 (changelog p. 12, answer column "the party requires 2 rations per day") and 167 are applied in ancient_food_requirement as a party requirement of 2; the 1-ration case returns issue.travel.partial_rations. Foraging once per day, +10 with trees, -10 on a road hex (both can apply via has_trees), no Foraging in the Ancient Lands, 1D6 Hit Points and 1d6 per Energy Point on 1-3 all match. Half Constitution (RDD) is modelled as a loss of floor(CON/2), which is the natural reading of "lose half their Constitution (RDD)". The four hunger fixtures reproduce the ruling (5 members with 1 dog lose 4; 2 heroes lose 2; no further loss on day 2; full restore on eating).'
