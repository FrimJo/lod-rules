    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:3b57c37b1f24974b302df2327415f726e916a80bb12a791c2e9630e02ddd6ef7

  findings:
    - kind: transcription_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: >-
        Re-review of the .1 finding that three step source_text values were paraphrase. initialize now
        reads "The Warrior Priest can choose to pray at one of these ... Therefore, each hero may choose
        only one temple before each quest.", joining a PDF 158 sentence and a PDF 146 sentence with an
        ellipsis; pray reads "Praying at the temple costs 50 c. ... This takes one day."; and
        same_god_retry_uncertain reads "Therefore, each hero may choose only one temple before each
        quest." I verified each quoted sentence on the rendered page: PDF 146 (printed 144) prints
        "Warrior Priests will not use the temples but instead go to the Inner Sanctum. The gods are proud
        beings ... Therefore, each hero may choose only one temple before each quest. Praying at the
        temple costs 50 c. Roll 1d6 ... This takes one day."; PDF 158 prints "The Warrior Priest can
        choose to pray at one of these".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: corrected
        change: >-
          procedure.sanctum_prayer initialize, pray and same_god_retry_uncertain source_text now quote the
          printed sentences that each step implements, on the pages cited. The paraphrase is gone and the
          explanatory wording sits in unresolved_references.
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: >-
        The .1 finding that the Sanctum prayer silently adopted the temple fee and day. PDF 158 prints no
        fee and no time for praying in the Inner Sanctum, and PDF 146 prints 50 c and one day for a
        temple prayer. The procedure now takes a caller-supplied sanctum_fee_reading. The pray step
        (50 c, one Activity Point) requires temple_fee_and_day. The pray_no_fee step requires
        no_fee_or_day. Any other reading, including none, runs fee_reading_unsupplied, which carries
        unresolved issue.guild.sanctum_prayer_fee and makes no prayer. The reading is not chosen in the
        procedure. The reading logic is consistent with the printed pages, and the issue summary now
        describes the same behaviour.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: corrected
        change: >-
          procedure.sanctum_prayer: fee and day are applied only under the supplied temple_fee_and_day
          reading, the no-fee reading has its own step, and every other case emits
          unresolved issue.guild.sanctum_prayer_fee before any payment. Verified against PDF 158 (no fee,
          no time printed) and PDF 146 (temple 50 c and one day).
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: >-
        The .1 finding that same_god_retry_uncertain did not check guild or profession. PDF 158 prints
        "Only a Warrior Priest may enter the Inner Sanctum". The step's when now requires
        guild eq inner_sanctum and profession eq warrior_priest, so the same-god issue cannot surface for
        other heroes.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: The Inner Sanctum
      disposition:
        status: corrected
        change: >-
          procedure.sanctum_prayer same_god_retry_uncertain when now includes guild eq inner_sanctum and
          profession eq warrior_priest, verified against PDF 158 ("Only a Warrior Priest may enter the
          Inner Sanctum").
    - kind: transcription_error
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description: >-
        The .1 finding that early_return_uncertain quoted commentary. It now quotes "The crusade only
        lasts until the heroes leave the next dungeon. ... the money is paid the next time the Warrior
        Priest visits the Sanctum." Both sentences are printed on PDF 159 (printed 157) under Crusades.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: corrected
        change: >-
          procedure.sanctum_crusade early_return_uncertain source_text is now the printed sentences,
          verified on PDF 159; the explanation stays in issue.guild.crusade_early_payment.
    - kind: modelling_error
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description: >-
        The .1 finding that early_return_uncertain did not check guild or profession. Its when now requires
        guild eq inner_sanctum and profession eq warrior_priest, matching the assign steps and PDF 159
        ("the next time the Warrior Priest visits the Sanctum").
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: corrected
        change: >-
          procedure.sanctum_crusade early_return_uncertain when now includes guild eq inner_sanctum and
          profession eq warrior_priest.
    - kind: transcription_error
      section_id: section.buying_an_estate.furnishing_the_manor
      object_id: procedure.estate_furnishing
      description: >-
        The .1 finding on paraphrased step source_text in procedure.estate_furnishing. Every quoted step
        now matches PDF 161 (printed 159) word for word: reset and owned (the intro sentence); the nine
        price steps (the heading lines "Training Grounds 500 c", "Wizard’s Study 500 c", "Alchemist Lab
        500 c", "Shrine 350 c", "Smithy 350 c", "Archery Range 500 c", "Crops, Hen House, and Pigsty 200
        c", "Garden 200 c", "Kennel 75 c"); purchase and first_dungeon_exit ("Only one thing may be
        bought in between every quest ..."); train and train_other_facility; alchemy and its garden and
        lab sentences; shrine_god; the Study and Kennel rules; and frequency_open (the shrine, smithy and
        crops sentences). The printed "This requires the Companion’s Expansion." is quoted with the
        external_references companions_compendium on the section.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: Furnishing the Manor
      disposition:
        status: corrected
        change: >-
          procedure.estate_furnishing step source_text values now quote the printed sentences and heading
          lines verified on PDF 161; explanatory wording sits in the unresolved references and
          issue.estate.furnishing_usage_boundaries.
    - kind: transcription_error
      section_id: section.buying_an_estate.ghostly_events_table
      object_id: procedure.estate_ghostly_events
      description: >-
        The .1 finding on six paraphrased step source_text values. reset, scope_unsupplied and due now
        quote "Between every quest, the party must roll 1d10. This is done the night before the planned
        departure." (PDF 161, printed 159). forced_event, owed_event_in_addition and owed_reading_unsupplied
        quote "There will automatically be a Ghostly Event before the next quest, and that will be #8."
        (PDF 165, printed 163, Aftermath – If You Fail). owed_event_8 and event_8 quote the printed effect
        of entry 8 (PDF 163, printed 161). The ten event steps and contact match PDF 161 to 163.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: The Ghosts of Past Generations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: Aftermath – If You Fail
      disposition:
        status: corrected
        change: >-
          procedure.estate_ghostly_events reset, scope_unsupplied, due, forced_event,
          owed_event_in_addition and owed_reading_unsupplied now quote the printed sentences verified on
          PDF 161 and PDF 165. The reading explanations sit in the unresolved references and
          issue.estate.ghost_contact_scope.
    - kind: source_reference_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: issue.guild.same_god_prayer_retry
      description: >-
        The .1 finding on the PDF 158 source heading. It now reads "Praying in the Inner Sanctum.", with
        the full stop printed on PDF 158, and the PDF 146 source is visually_verified true. I checked both
        pages.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: corrected
        change: >-
          issue.guild.same_god_prayer_retry PDF 158 source heading set to the printed "Praying in the
          Inner Sanctum.", matching the page and the other references.
    - kind: uncertainty_not_recorded
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description: >-
        The .1 finding that the Crusades roll has no recorded timing, frequency, optionality or stacking
        rule. I confirmed the page: PDF 159 says only "Roll on the table below to decide what a crusade
        has been declared against", and prints nothing on when or how often the roll is made, whether a
        crusade replaces a running one, or how two Warrior Priests share trophy payment. The gap is real.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: recorded_as_issue
        issue_id: issue.guild.crusade_assignment_timing
    - kind: uncertainty_not_recorded
      section_id: section.buying_an_estate.staying_at_the_house
      object_id: character.settlement.estate.lodging
      description: >-
        New finding. Two printed sentences look like misprints and are quoted verbatim in the corpus with
        no record. PDF 160 (printed 158), Staying at the House, prints "Now they do not have to pay the
        daily cost of at the inns." PDF 161 (printed 159), Furnishing the Manor, prints "it cannot be used
        until after the leaving the next dungeon." The meaning is clear, so no rule is changed. The
        corpus keeps the wording, and issue.estate.printed_typos now records the two misprints.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 160
          printed_page: 158
          heading: Staying at the House
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: Furnishing the Manor
      disposition:
        status: recorded_as_issue
        issue_id: issue.estate.printed_typos
    - kind: coverage_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      description: >-
        The coverage note on this section says procedure.sanctum_prayer "applies the temple fee and day
        and returns issue.guild.sanctum_prayer_fee because this section prints neither". That describes the
        pre-correction procedure. The fee and day now apply only under the caller's temple_fee_and_day
        reading, and without a reading the procedure returns the issue and makes no prayer. A reader of
        the note alone would take the 50 c and one-day charge as unconditional. The page is PDF 158
        (printed 156) with the temple wording on PDF 146 (printed 144).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: open
        proposed_correction: >-
          In corpus/source-map/coverage.yaml, the notes of section.the_inner_sanctum.praying_in_the_inner_sanctum,
          replace "procedure.sanctum_prayer, which applies the temple fee and day and returns
          issue.guild.sanctum_prayer_fee because this section prints neither" with "procedure.sanctum_prayer,
          which applies the temple fee and day only when the caller supplies the temple reading in
          sanctum_fee_reading, and otherwise returns issue.guild.sanctum_prayer_fee and makes no prayer,
          because this section prints neither". Keep the rest of the note.
    - kind: ok_with_note
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: >-
        The coverage note's claim that the Trickster deduction is "amount unstated in the Temple section" holds.
        PDF 147 (printed 145), Temple of Rhidnir, prints "he will grant your hero +1 Luck" and no deduction
        amount for a 6, so issue.settlement.trickster_deduction stands. The six boon steps match PDF 146 to
        147: Charus +1 Energy that cannot be regained through resting, Iphy +5 Resolve, Metheia +1 HP,
        Ohlnir +5 CS or RS, Rhidnir +1 Luck, Ramos +5 STR, each lasting until the hero leaves the next dungeon.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Temple of Rhidnir
      disposition:
