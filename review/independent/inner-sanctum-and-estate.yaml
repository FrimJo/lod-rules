  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:050fae298c4caf182b55302c6c33a1950660dc864189e664f1dce55b77d47b0e
  findings:
    - kind: transcription_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description:
        Three step source_text values are paraphrase, not printed wording. initialize reads
        "Choose one god before each quest; the Sanctum improves the success threshold."; pray reads
        "A prayer costs 50 c and takes one day, including a failed attempt.";
        same_god_retry_uncertain reads "Choosing only one temple or god does not explicitly settle
        repeat attempts at the same god." None of these sentences is on PDF 158 or on Pray at the
        Local Temples (PDF 146). The six boon steps and trickster_six quote PDF 158 correctly.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: open
        proposed_correction:
          'Quote the printed sentences each step implements. initialize: "The Warrior
          Priest can choose to pray at one of these" (PDF 158) and "each hero may choose only one
          temple before each quest." (PDF 146). pray: "Praying at the temple costs 50 c. ... This
          takes one day." (PDF 146, cited on the step). same_god_retry_uncertain: "each hero may
          choose only one temple before each quest." Move the explanatory wording to
          unresolved_references or the issue.'
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: PDF 158 prints no fee and no time for praying in the Inner Sanctum.
        issue.guild.sanctum_prayer_fee records that, and says the procedure "applies them and
        returns this issue". The pray step nevertheless deducts 50 c and requires one completed
        Activity Point day, with no unresolved effect. The issue appears only in the procedure-level
        issues list, so an execution silently adopts the temple reading.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: open
        proposed_correction:
          'Do not choose the reading in the procedure. Either take a caller-supplied
          reading (for example sanctum_fee_reading: temple_fee_and_day or none) and emit an
          unresolved issue.guild.sanctum_prayer_fee effect when it is not supplied, as
          procedure.estate_ghostly_events does for ghost_roll_scope; or at least add an unresolved
          issue.guild.sanctum_prayer_fee effect to the pray step whenever the fee and day are
          applied.'
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: same_god_retry_uncertain does not require guild == inner_sanctum or profession ==
        warrior_priest, which initialize and pray require. PDF 158 says the Inner Sanctum is for the
        Warrior Priest ("Only a Warrior Priest may enter the Inner Sanctum"). As written, a call for
        any guild or profession that has prayed this interval surfaces the Sanctum retry issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: The Inner Sanctum
      disposition:
        status: open
        proposed_correction:
          Add guild == inner_sanctum and profession == warrior_priest to the when of
          same_god_retry_uncertain.
    - kind: transcription_error
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description:
        The early_return_uncertain step source_text "The source specifies next-visit payment
        but does not explain payment on a return before leaving the next dungeon." is commentary,
        not printed wording. The other steps quote PDF 159 correctly.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: open
        proposed_correction:
          Quote "The crusade only lasts until the heroes leave the next dungeon. ... the
          money is paid the next time the Warrior Priest visits the Sanctum." and leave the
          explanation to issue.guild.crusade_early_payment.
    - kind: modelling_error
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description: early_return_uncertain does not require guild == inner_sanctum or profession ==
        warrior_priest, which every assign step and collect require. PDF 159 pays "the next time the
        Warrior Priest visits the Sanctum". As written, a collect call for any guild or profession
        with an assigned, unpaid crusade surfaces issue.guild.crusade_early_payment.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: open
        proposed_correction:
          Add guild == inner_sanctum and profession == warrior_priest to the when of
          early_return_uncertain.
    - kind: uncertainty_not_recorded
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
      description:
        PDF 159 says only "Roll on the table below to decide what a crusade has been declared
        against". It does not say when or how often the roll is made, whether a crusade is optional,
        whether receiving one spends an activity day, whether a new crusade may replace a running
        one, or how two Warrior Priests in one party are paid for the same trophies.
        procedure.sanctum_crusade requires a completed guild activity for the roll and allows one
        assignment until payment, and no issue recorded these points. The two existing crusade
        issues cover early payment and target scope only.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
      disposition:
        status: recorded_as_issue
        issue_id: issue.guild.crusade_assignment_timing
    - kind: transcription_error
      section_id: section.buying_an_estate.furnishing_the_manor
      object_id: procedure.estate_furnishing
      description:
        'Several step source_text values are not printed wording. reset "Each call decides
        afresh."; train_other_facility "A hero who trained at the other facility: refused in the
        same interval; whether the choice is permanent is not stated."; alchemy "Alchemist Lab: one
        recipe between each visit to a dungeon. Garden: one gathering of 1d6+2 ingredients between
        each quest. Alchemists only. The limit is counted per facility or per alchemist as the
        caller supplies."; alchemy_limit_unsupplied and frequency_open ("How often the Smithy,
        Shrine and Crops may be used is not stated."). PDF 161 prints none of these. The price_1 to
        price_9 steps reword each heading line as "Name: N c." (for example the page prints
        "Training Grounds 500 c"); the costs themselves are correct.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: Furnishing the Manor
      disposition:
        status: open
        proposed_correction:
          'Quote the sentences each step implements: train_other_facility "You can only
          train either at archery range OR at the training grounds with each hero."; alchemy "An
          alchemist making a recipe in this lab may choose what kind of potion the recipe will
          yield. Only one recipe may be made between each visit to a dungeon. ... An Alchemist may
          gather 1d6+2 random ingredients from the garden once between each quest."; frequency_open
          the Smithy, Shrine and Crops sentences; reset and alchemy_limit_unsupplied the sentence
          they act on. Use the printed heading line ("Training Grounds 500 c") for the price steps.
          Move the explanations to unresolved_references or
          issue.estate.furnishing_usage_boundaries.'
    - kind: transcription_error
      section_id: section.buying_an_estate.ghostly_events_table
      object_id: procedure.estate_ghostly_events
      description:
        'Six step source_text values are paraphrase or reading notes, not printed wording:
        reset ("Each call decides afresh whether a new interval is due."), scope_unsupplied,
        owed_reading_unsupplied, due ("Between every quest, once, the night before the planned
        departure, under the supplied reading ..."), forced_event ("After a failed Grieving Mother
        there is automatically a Ghostly Event before the next quest, and it is #8. Under the
        replaces_rolls reading ...") and owed_event_in_addition. The contact, grieving_mother_done,
        no_wizard, select_event and event_1 to event_10 steps quote PDF 161 to 163 correctly.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: The Ghosts of Past Generations
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: Aftermath – If You Fail
      disposition:
        status: open
        proposed_correction:
          'Quote the printed sentences. due, reset and scope_unsupplied: "Between every
          quest, the party must roll 1d10. This is done the night before the planned departure."
          (PDF 161). forced_event, owed_event_in_addition and owed_reading_unsupplied: "There will
          automatically be a Ghostly Event before the next quest, and that will be #8." (PDF 165).
          Move the reading explanations to unresolved_references or
          issue.estate.ghost_contact_scope.'
    - kind: source_reference_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: issue.guild.same_god_prayer_retry
      description:
        The PDF 158 source of this issue uses the heading "Praying in the Inner Sanctum". The
        page prints "Praying in the Inner Sanctum." with a full stop, and sections.yaml, the rule,
        procedure.sanctum_prayer and the other two related issues all use the printed form. Its PDF
        146 source is marked visually_verified false; the page agrees with the issue's reading (only
        one temple before each quest).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: open
        proposed_correction:
          Set the PDF 158 source heading to "Praying in the Inner Sanctum." to match the
          printed heading and the other references.
    - kind: ok_with_note
      section_id: section.the_inner_sanctum.crusades.table
      object_id: table.guild.crusade
      description: 'All six rows and cells match PDF 159 under the printed header "1d6" and "Crusade
        against…": 1 Undead, 2 Bandits, 3 Orcs and Goblins, 4 Beasts, 5 Dark Elves, 6 Reptiles.
        Changelog 2.21 entries 84 and 85 (changelog PDF page 14, rendered) correct a "1d4" header to
        "1d6", marked Fixed. This PDF already prints 1d6, so nothing is applied, and the table cites
        both entries. The table is a reference_table with text roll cells and no roll_domain, the
        same convention as table.settlement.events. A random_table would carry the die domain, but
        the printed content is complete.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 159
          printed_page: 157
          heading: Crusades
        - document: vonbraus.changelog_2_2x
          pdf_page: 14
          heading: '2.21'
          locator:
            row: 84
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.buying_an_estate.ghostly_events_table
      object_id: table.estate.ghost_events
      description:
        All ten entries match PDF 162 to 163, with names and italic effects verbatim. These
        include the entry 7 effect ("Any rations from the crops, hen house, and pigsty are lost."),
        which carries over to the top of PDF 163, and entries 8 to 10 on PDF 163. The table cites
        both pages. The numbered narrative paragraphs are left out as setting prose. Entry 1's
        "Wonderful Treasure Chart" stays an unresolved reference, which is correct because nothing
        on these pages identifies it. Like the Crusades table, the 1d10 roll is a text column with
        no roll_domain.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 162
          printed_page: 160
          heading: Ghostly Events Table
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 163
          printed_page: 161
          heading: Ghostly Events Table
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.buying_an_estate.furnishing_the_manor
      object_id: table.estate.furnishings
      description:
        "The nine costs match PDF 161: Alchemist Lab 500 c, Archery Range 500 c, Crops, Hen
        House, and Pigsty 200 c, Kennel 75 c, Training Grounds 500 c, Wizard's Study 500 c, Shrine
        350 c, Smithy 350 c, Garden 200 c. The effect cells are verbatim. The page prints run-in
        headings with costs, not a table, so the column labels Furnishing, Cost and Effect are
        editorial. The rows are not in the printed reading order (left column Alchemist Lab to
        Kennel, then right column Training Grounds to Garden), and the printed text itself does not
        depend on that order."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: Furnishing the Manor
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description:
        'The six boons inherited from the temples were checked against PDF 146 to 147 (rendered
        for this purpose): Charus 1 extra Energy Point that cannot be regained through resting, Iphy
        +5 Resolve, Metheia +1 HP, Ohlnir +5 CS or RS, Rhidnir +1 Luck, Ramos +5 STR. All last until
        the hero leaves the next dungeon. They match the procedure. The Inner Sanctum threshold 1-5
        and the Trickster 6 (Rhidnir, "the Great Trickster") match PDF 158. The PDF 146 and 147
        sources are marked visually_verified false, but the pages agree.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Temple of Rhidnir
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.buying_an_estate.the_dark_gods
      object_id: term.dark_gods
      description: 'The definition is the first three sentences of the PDF 166 sidebar, verbatim. It
        leaves out the sentences on secret worship and Kheros, the God of Death, which is acceptable
        for a definition. The section dispositions are correct: the sidebar prints no action, cost,
        roll, table or effect, so rules, tables, procedures and entities are truly not_applicable.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 166
          printed_page: 164
          heading: The Dark Gods
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.the_inner_sanctum
      description: 'The Inner Sanctum rules on PDF 158 match verbatim, with every number checked.
        Practicing Skills: CS, Dodge and Battle Prayers, +3 for 300 c, 1 day, one session per skill
        between two dungeons. Learning a New Prayer: one per hero between dungeon visits, 200 c +100
        c per level above 1, 1 day. Blessed Armours: 25 c per piece, +1 durability, until the heroes
        leave the next dungeon. Blessed Weapons: 75 c, a further 2 DMG to Undead or Demon, until the
        heroes leave the next dungeon. The special equipment table: Religious Relic (Necklace) and
        (Ring) - / 1 / 500 c / 4, and Incense - / 1 / +5 Prayer, one skirmish or one dungeon, quick
        slot / 40 c / 4. Skirmish stays distinct from dungeon. Estate purchase (4000 c in Silver
        City), lodging, ghost contact (1d10, 7-10, the night before the planned departure) and the
        nine furnishing rules on PDF 160 to 161 also match. The side quest on PDF 164 to 165 was
        rendered but not reviewed, as instructed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: The Inner Sanctum
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 161
          printed_page: 159
          heading: Furnishing the Manor
      disposition:
        status: no_change_needed
  outcome: failed
  summary:
    'Reviewed The Inner Sanctum (PDF 158-159) and Buying an Estate without the Grieving Mother
    side quest (PDF 160-163, 166). PDF 164-165 were rendered but the side quest was not reviewed.
    PDF 146-147 were rendered to check the inherited temple boons. All source_text, names, costs,
    dice, thresholds and table cells match the page, including the Crusades 1d6 header (changelog
    2.21 entries 84 and 85 already applied in print) and the Ghostly Events entries across PDF
    162-163. The Dark Gods is correctly glossary-only. The record fails on eight open findings:
    paraphrased step source_text in procedure.sanctum_prayer, procedure.sanctum_crusade,
    procedure.estate_furnishing and procedure.estate_ghostly_events; uncertainty steps in the two
    Sanctum procedures that do not check guild and profession; the Sanctum prayer fee applied with
    no unresolved effect; and an issue heading missing its printed full stop. A new issue,
    issue.guild.crusade_assignment_timing, records the unstated timing and cost of the crusade
    roll.'
  supporting_evidence:
    - 'Changelog 2.21 PDF page 14 rendered (generated/review/tier6-changelog/p14.png): entries 84
      and 85, 1d4 to 1d6 Crusades header, Fixed.'
