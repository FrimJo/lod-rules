  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:050fae298c4caf182b55302c6c33a1950660dc864189e664f1dce55b77d47b0e
  findings:
    - kind: transcription_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description:
        Three step source_text values are paraphrase, not printed wording. initialize reads
        "Choose one god before each quest; the Sanctum improves the success threshold."; pray reads
        "A prayer costs 50 c and takes one day, including a failed attempt.";
        same_god_retry_uncertain reads "Choosing only one temple or god does not explicitly settle
        repeat attempts at the same god." None of these sentences is on PDF 158 or on Pray at the
        Local Temples (PDF 146). The six boon steps and trickster_six quote PDF 158 correctly.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: open
        proposed_correction:
          'Quote the printed sentences each step implements. initialize: "The Warrior
          Priest can choose to pray at one of these" (PDF 158) and "each hero may choose only one
          temple before each quest." (PDF 146). pray: "Praying at the temple costs 50 c. ... This
          takes one day." (PDF 146, cited on the step). same_god_retry_uncertain: "each hero may
          choose only one temple before each quest." Move the explanatory wording to
          unresolved_references or the issue.'
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: PDF 158 prints no fee and no time for praying in the Inner Sanctum.
        issue.guild.sanctum_prayer_fee records that, and says the procedure "applies them and
        returns this issue". The pray step nevertheless deducts 50 c and requires one completed
        Activity Point day, with no unresolved effect. The issue appears only in the procedure-level
        issues list, so an execution silently adopts the temple reading.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: open
        proposed_correction:
          'Do not choose the reading in the procedure. Either take a caller-supplied
          reading (for example sanctum_fee_reading: temple_fee_and_day or none) and emit an
          unresolved issue.guild.sanctum_prayer_fee effect when it is not supplied, as
          procedure.estate_ghostly_events does for ghost_roll_scope; or at least add an unresolved
          issue.guild.sanctum_prayer_fee effect to the pray step whenever the fee and day are
          applied.'
    - kind: modelling_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: same_god_retry_uncertain does not require guild == inner_sanctum or profession ==
        warrior_priest, which initialize and pray require. PDF 158 says the Inner Sanctum is for the
        Warrior Priest ("Only a Warrior Priest may enter the Inner Sanctum"). As written, a call for
        any guild or profession that has prayed this interval surfaces the Sanctum retry issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: The Inner Sanctum
      disposition:
        status: open
        proposed_correction:
          Add guild == inner_sanctum and profession == warrior_priest to the when of
          same_god_retry_uncertain.
    - kind: transcription_error
      section_id: section.the_inner_sanctum.crusades
      object_id: procedure.sanctum_crusade
