    - kind: coverage_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: The corrected coverage note says procedure.sanctum_prayer applies the temple fee and day only when the caller supplies the temple reading in sanctum_fee_reading, and "otherwise returns issue.guild.sanctum_prayer_fee and makes no prayer". The procedure has a third branch that the note omits. Step pray_no_fee requires sanctum_fee_reading eq no_fee_or_day and then makes the prayer (prayed_since_quest and chosen_god set, prayer_attempted true) with no fee or day. Only a reading that is neither temple_fee_and_day nor no_fee_or_day, or no reading, reaches fee_reading_unsupplied, which emits issue.guild.sanctum_prayer_fee and makes no prayer. As written, the "otherwise" clause tells a reader that the no-fee reading also makes no prayer, which the procedure does not do. PDF 158 (printed 156) prints no fee and no time for the Inner Sanctum prayer, so the no-fee branch is the caller reading of that silence and the note should say so.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: open
        proposed_correction: 'In corpus/source-map/coverage.yaml, the notes of section.the_inner_sanctum.praying_in_the_inner_sanctum: replace "procedure.sanctum_prayer, which applies the temple fee and day only when the caller supplies the temple reading in sanctum_fee_reading, and otherwise returns issue.guild.sanctum_prayer_fee and makes no prayer, because this section prints neither" with "procedure.sanctum_prayer, which applies the temple fee and day only when the caller supplies sanctum_fee_reading as temple_fee_and_day; when the caller supplies no_fee_or_day it makes the prayer with neither fee nor day; when the reading is missing or any other value it returns issue.guild.sanctum_prayer_fee and makes no prayer, because this section prints neither". Keep the rest of the note.'
    - kind: coverage_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: 'Verification of the open finding in review.inner_sanctum_and_estate.2 (the coverage note still described the pre-correction fee behaviour). The fee-and-day statement is now right: the temple fee of 50 c and one day attach only to the temple_fee_and_day reading (step pray, which requires that reading and charges 50 c through accounting), and an unsupplied reading returns issue.guild.sanctum_prayer_fee without a prayer. The reason "this section prints neither" holds on PDF 158 (printed 156), where the Inner Sanctum paragraph prints no fee and no time. PDF 146 (printed 144) prints "Praying at the temple costs 50 c." and "This takes one day." The remaining defect, the "otherwise" clause that omits the no-fee branch, is the open finding above.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
