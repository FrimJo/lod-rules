    - kind: ok_with_note
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: issue.guild.sanctum_prayer_fee
      description: >-
        The issue summary states that "Pray at the Local Temples" prices a temple prayer at 50 c and one
