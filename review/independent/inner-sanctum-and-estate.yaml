  findings:
    - kind: coverage_error
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: 'Verification of the open finding in review.inner_sanctum_and_estate.3 (the "otherwise" clause omitted the no-fee branch). The coverage note now reads that procedure.sanctum_prayer applies the temple fee and day only when sanctum_fee_reading is supplied as the temple reading; when the caller supplies no_fee_or_day it makes the prayer with neither fee nor day; and when the reading is missing or any other value it returns issue.guild.sanctum_prayer_fee and makes no prayer. The procedure matches that: step pray requires sanctum_fee_reading eq temple_fee_and_day, charges 50 c through accounting, sets prayed_since_quest, chosen_god and prayer_attempted; step pray_no_fee requires sanctum_fee_reading eq no_fee_or_day and sets prayed_since_quest, chosen_god and prayer_attempted with no fee and no Activity Point; step fee_reading_unsupplied requires the reading to be neither temple_fee_and_day nor no_fee_or_day and emits issue.guild.sanctum_prayer_fee with no prayer. On PDF 158 (printed 156) the Inner Sanctum paragraph prints no fee and no time for praying, so the note reason "this section prints neither" holds. On PDF 146 (printed 144) Pray at the Local Temples prints "Praying at the temple costs 50 c." and "This takes one day." The open defect is fixed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
      disposition:
        status: corrected
        change: 'section.the_inner_sanctum.praying_in_the_inner_sanctum coverage note (corpus/source-map/coverage.yaml) now separates the three readings: temple_fee_and_day applies the temple fee and day; no_fee_or_day makes the prayer with neither fee nor day; a missing or other reading returns issue.guild.sanctum_prayer_fee and makes no prayer. Verified against procedure.sanctum_prayer steps pray, pray_no_fee and fee_reading_unsupplied, and against PDF 158 and PDF 146.'
    - kind: ok_with_note
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: The corrected note says "the temple reading" where the procedure field value is temple_fee_and_day. The next clauses name no_fee_or_day and the missing or other case, so the reading is not ambiguous and no change is required. A reader who searches for the literal value will need the procedure itself, which is consistent with the note.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.the_inner_sanctum.praying_in_the_inner_sanctum
      object_id: procedure.sanctum_prayer
      description: Step pray requires coins gte 50 as well as the temple_fee_and_day reading. A hero with fewer than 50 c who supplies that reading therefore gets no step, no prayer and no issue. The book prints no affordability rule for the Inner Sanctum. The guild purchase procedure records that the fee must be affordable as a procedure-level statement, but sanctum_prayer does not. The outcome is the one the procedure would give (no prayer), so this is noted for the extraction side and no correction is proposed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Pray at the Local Temples
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Praying in the Inner Sanctum.
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.buying_an_estate.the_dark_gods
      object_id: term.dark_gods
      description: Not in this unit's changed set, noted for the extraction side. The term definition stops after "Worshipping these gods is forbidden in the Kingdom." The sidebar (PDF 166, printed 164) continues "Nonetheless, there are people who defy the law and pledge their allegiance to them in secret. The god that attracts the most followers is probably Kheros, the God of Death, to whom all necromancers turn for boons and power." The term is mechanically_significant false and the sidebar prints no mechanics, so there is no rule impact. The excerpt is not marked with an ellipsis.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 166
          printed_page: 164
          heading: The Dark Gods
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.buying_an_estate.staying_at_the_house
      description: 'Spot re-checks, not a line-by-line pass of every object (only the coverage note changed since record .3). Matches the page: PDF 158 Buying the House 4000 c; Staying at the House printed misprint "do not have to pay the daily cost of at the inns" (issue.estate.printed_typos); PDF 158 Ghosts of Past Generations 1d10 with 7-10 contact. PDF 159 Crusades table 1d6 rows Undead, Bandits, Orcs and Goblins, Beasts, Dark Elves, Reptiles, and the 25 c per trophy and payment sentences. PDF 158 equipment rows (Religious Relic necklace 500 c, ring 500 c, Incense 40 c, durability 1, availability 4) and Blessed Armour 25 c +1 durability and Blessed Weapon 75 c 2 DMG to Undead or Demon. PDF 161 furnishing costs (Training Grounds 500, Wizard''s Study 500, Alchemist Lab 500, Shrine 350, Smithy 350, Archery Range 500, Crops/Hen House/Pigsty 200, Garden 200, Kennel 75) and the printed misprint "cannot be used until after the leaving the next dungeon". PDF 160-161 Ghostly Events 1-10 names and effects. Side quest pages PDF 164-165 were read only as the lines the estate procedures cite; they were not reviewed as objects.'
      source:
