    - kind: coverage_error
      section_id: section.appendix_v_treasures.table_10
      object_id: section.appendix_v_treasures.table_10
      description: New in this review. The coverage row for section.appendix_v_treasures.table_10 sets entities to not_applicable, and its note says "the rows link the legendary item entities, which cite their own item sections". That is not true for two of them. equipment.legendary.belt_of_oakenshield and equipment.legendary.the_golden_kopesh have section_id section.appendix_v_treasures.table_10 and cite PDF 202 rows 1-2/5 and 5-6/2 as their source. They are this section's own entities, and they are in this unit's digest for that reason. Sibling nodes handle the same case consistently. table_of_parts (part.* entities) and tables_of_potions.standard (equipment.alchemy.weapons_oil, potion_of_dragon_breath) mark entities as extracted because table-row entities cite them. Marking a component not_applicable when entities exist misstates what was extracted.
