      description: The belt cites changelog 2.2x (official_errata in source/manifest.yaml) page 27, entry 193. I rendered that page. Entry 193 reads "Page 200 Changed 'Oakenshield' to 'Copperbane'." with status Fixed. The entity keeps the printed name and source_text "Belt of Oakenshield" verbatim and links character.treasure.legendary.belt_of_copperbane, which follows the "Official rulings" convention. issue.treasure.legendary_names stays unresolved because the Kopesh/Khopesh spelling has no ruling. No ruling on that page touches printed pages 195-200 apart from entry 193.
