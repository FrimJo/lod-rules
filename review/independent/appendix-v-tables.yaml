      object_id: character.treasure.magic_weapons.7
      description: 'Changed since review.appendix_v_tables.4. PDF 200 Magic Weapons row 7 reads "It is as if the magic in this weapon is unusually strong, binding it together in a way that your hero has never experienced before." / "Item has +2 max Durability (total 10)." source_text matches verbatim. The rule now has a state field maximum_durability, sets max_durability_modifier 2, adds 2 (permanent) to maximum_durability and copies max_durability_total from it, instead of a literal 10. PDF 70 (Durability of Magic Items) gives magic weapons, armour and shields 8 Points of Durability, so 8 + 2 = 10 reproduces the printed total rather than hard-coding it. New case test.treasure.magic_weapons_example.durability_total_10: source PDF 200 / printed 198 (pages.yaml), heading Magic Weapons, locator row 7 column Effect, source_text verbatim; inputs magical, weapon_armour_or_shield and power_roll 7 are pinned, the trace runs character.durability.magic then character.treasure.magic_weapons.7, which are the two rules the parenthetical total relies on, and the expected maximum_durability / max_durability_total 10 and modifier 2 are the printed outcome. tests/rules/pilot.test.ts passes (supporting evidence only).'
