  findings:
    - kind: modelling_error
      section_id: section.appendix_v_treasures.table_10
      object_id: table.treasure.legendary
      description:
        PDF 202 heads the three selector columns "1-2 / 1d10", "3-4 / 1d10" and "5-6 / 1d10"
        and the caption says only "roll on the table below". It names no die for picking the column.
        The table's selection note nevertheless says "Select the column with 1d6 (1-2 / 3-4 / 5-6),
        then roll 1d10 within that column.", so it states as fact a die the page never prints. The
        only 1d6 in the book is the Gameplay Example on PDF 22, and that example contradicts this
        table (issue.gameplay_example.legendary_roll). character.treasure.legendary_selector words
        this correctly ("the page names no die for it"), and so does the coverage note. Every cell
        of the 30 rows, the three column headers and the caption match the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 202
          printed_page: 200
          heading: Legendary Items
          locator:
            table: Legendary Items
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction:
          'In table.treasure.legendary, replace the selection entry with wording that
          names no die, for example: "Select the column headed 1-2, 3-4 or 5-6 (the page names no
          die for this; see issue.gameplay_example.legendary_roll), then roll 1d10 within that
          column."'
    - kind: modelling_error
      section_id: section.appendix_v_treasures.table_of_powerstones
      object_id: character.treasure.powerstone.3
      description:
        Row 3 on PDF 199 reads "Poisonous. This stone gives a weapon a permanent poisonous
        ability. If a monster is wounded by this weapon, it loses 1HP every turn until end of
        battle." The rule correctly requires item_kind weapon. It then sets
        monster_hp_loss_each_turn = 1 unconditionally and stores the printed qualifier only as the
        free-text output trigger = "monster wounded". The condition "If a monster is wounded by this
        weapon" is therefore not typed in when or require, so the HP loss applies even to a monster
        that was never wounded. Sibling rules in this unit gate their effect on a typed input, for
        example curse_effects_apply = wielding and checking_trap_detection in powerstone.15.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 199
          printed_page: 197
          heading: Table of Powerstones
          locator:
            table: Table of Powerstones
            row: '3'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: In character.treasure.powerstone.3, keep the weapon requirement and the
          poisonous = true effect. Move the HP loss into a separate rule, for example
          character.treasure.powerstone.3.wounded, quoting the same row. Its when should require
          powerstone_roll == 3 and a new boolean input monster_wounded_by_weapon == true, and it
          should set monster_hp_loss_each_turn = 1 and duration = "until end of battle". Drop the
          free-text trigger output, and link the new rule from the table row and
          equipment.powerstone.effect_3.
    - kind: uncertainty_not_recorded
      section_id: section.appendix_v_treasures.table_magic_item
      object_id: character.treasure.magic_items.8
      description:
        Magic Item row 8 on PDF 201 prints "+5 on a random skill." The page does not say how
        the skill is chosen. issue.treasure.legendary_followup already records this gap in words
        ("random skill (Magic Item 8, Curses 8) choices have no distribution specified"). However,
        neither character.treasure.magic_items.8 nor table.treasure.magic_items is in that issue's
        related list, and the rule has no issues entry. The uncertainty is therefore not attached to
        the object it concerns, and it does not show up in this unit's digest.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 201
          printed_page: 199
          heading: Magic Item
          locator:
            table: Magic Item
            row: '8'
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction:
          'Add character.treasure.magic_items.8 (and table.treasure.magic_items) to the
          related list of issue.treasure.legendary_followup, and add issues:
          [issue.treasure.legendary_followup] to character.treasure.magic_items.8. Alternatively,
          move the random-skill gap into its own issue related to both rows.'
    - kind: uncertainty_not_recorded
