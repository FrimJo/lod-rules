      description: Re-check of the open finding in review.appendix_v_tables.3. PDF 202 prints the Legendary Items selector whose row 1-2/5 is "Belt of Oakenshield" and row 5-6/2 is "The Golden Kopesh". equipment.legendary.belt_of_oakenshield and equipment.legendary.the_golden_kopesh both have section_id section.appendix_v_treasures.table_10 and cite PDF 202 (Legendary Items, column 1-2 1d10 row 5; column 5-6 1d10 row 2). The coverage row now sets components.entities to extracted, and its note says that most rows link entities citing their own item sections while these two have no item section and use this section as their section_id. That matches the corpus and the page. The other components are unchanged and still correct (rules extracted for character.treasure.legendary_selector, tables extracted for table.treasure.legendary).
