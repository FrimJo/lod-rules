    - kind: uncertainty_not_recorded
      section_id: section.appendix_v_treasures.tables_of_potions.standard
      object_id: issue.treasure.potion_table_divergences
      description:
        'I rendered PDF 181, 80 and 81 to check this issue. Its price claims hold. PDF 181
        prints Potion of Cure Disease and Potion of Cure Poison at 125 c and their (Weak) versions
        at 90 c, against 100 on Standard Potions and 75/200 on Weak or Supreme on PDF 197. Its three
        name claims also hold: "Potion of Fire Protection" (PDF 81), "Potion of Cure Poison
        (Antidote)" and "Potion of Disorientation (Tr)" (PDF 80). However, the issue lists
        Disorientation (Tr) as a divergence but leaves out the matching case on PDF 81: the heading
        prints "Potion of Smoke (Tr)", while Standard Potions row 3/9 on PDF 197 prints "Potion
        of Smoke". The issue''s two PDF 80/81 sources are also marked visually_verified: false,
