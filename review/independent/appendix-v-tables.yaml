        stone gives a weapon a permanent poisonous ability. If a monster is wounded by this weapon,
        it loses 1HP every turn until end of battle." character.treasure.powerstone.3 now keeps only
        the weapon requirement and poisonous = true. The new rule
        character.treasure.powerstone.3.wounded quotes the same row. It fires only when
        powerstone_roll == 3 and monster_wounded_by_weapon == true, requires a weapon, and sets
        monster_hp_loss_each_turn = 1 and duration "until end of battle". The free-text trigger
        output is gone. Row 3 of table.treasure.powerstones and equipment.powerstone.effect_3 link
        both rules.
