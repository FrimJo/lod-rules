      section_id: section.appendix_v_treasures.tables_of_potions.standard
      object_id: table.alchemy.standard
      description: 'Full re-comparison against the renders. PDF 197: Weak or Supreme potions (1d12 / Cost / Potion, 12 rows, 60/180 for Firebomb and Acidic Bomb, 75/200 for the rest) and Standard Potions (headers "1,2 / 1d10", "3 / 1d10", Cost, Potion; 30 rows including Bottle of Experience 350, Acidic Bomb 90, bold rows Disorientation 90 to Weapons Oil 80, "Potion of Fire protection", "10 - Roll again") match cell by cell. The 1d3 row arithmetic in columns_1_2 and column_3 maps 1, 2 and 3 to rows 1-10, 11-20 and 21-30. PDF 198: all 20 ingredient rows and all 30 part rows match, with merged 1d3 cells and superscript 1 on Cyclops eye, Shapeshifter blood and Spores. PDF 199: all 20 powerstone cells match verbatim, including "+ 5 Strength bonus". The 22 rules apply the printed object restrictions (weapon for 1-5, armour or shield for 12, ring or amulet for 6-10 and 13-20, none for 11). PDF 200-201: the introduction, Magic Weapons, Magic Armours and Shields and Magic Item rows and typed effects match ("-5 Enc and -1 Class (Min 1)", "(total 10)", "(Total 9)", "-50% Encumbrance (RDU)", "As If", "cat…almost"). PDF 202: the Curses instruction and its 10 rows, and the 30 Legendary Items rows under the 1-2 / 3-4 / 5-6 1d10 headers, match. The selection note and the column_roll field name no die for the column. The related issues (standard_selector, potion_table_choice, potion_table_divergences, cursed_roll_again, legendary_names, gameplay_example.legendary_roll, father_selector, parts_footnote) state the page accurately and stay unresolved. The only ruling in the 2.2x changelog for printed pages 195-200 is entry 193 (Oakenshield to Copperbane), which is already applied. I did not re-render the changelog page.'
