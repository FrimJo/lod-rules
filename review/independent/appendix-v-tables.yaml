        proposed_correction: In corpus/source-map/coverage.yaml, set section.appendix_v_treasures.table_10 components.entities to extracted. Rewrite the Entities sentence of its note to say that equipment.legendary.belt_of_oakenshield and equipment.legendary.the_golden_kopesh cite this node (the printed selector names, which differ from the described Belt of Copperbane and The Golden Khopesh), and that the other rows link entities that cite their own item sections.
