  findings:
    - kind: modelling_error
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats.table
      object_id: table.character.improvement_costs
      description:
        'The table carries a footnote that the book does not print. PDF 61 has no footnote under
        the cost matrix. The footnote is a paraphrase of the paragraph above the table, with
        wording the book does not use ("Costs are Improvement Points for a +1 increase", "Spare
        Improvement Points may be saved until the next level"; the page reads "Your heroes may save
        any spare Improvement points until the next time they level up."). That paragraph is
        already quoted verbatim by character.advancement.improvement_points, increase_limits,
        cost_doubling and save_points. All 136 cells (17 rows by 8 professions, including the 14
        printed dashes and the Hit points +1 row of 5/5/10/10/10/10/10/10) match the page, and the
        122 cost steps of procedure.character_improve agree with them.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 61
          printed_page: 59
          heading: Increasing your Skills and Basic Stats
      disposition:
        status: open
        proposed_correction:
          'table.character.improvement_costs: set footnotes to [] (the rules carry the paragraph),
          or replace the entry with the verbatim printed sentences if a table-level reminder is
          wanted.'
    - kind: source_reference_error
      section_id: section.levelling_up.stats_and_skills_maximum.table
      object_id: table.character.stat_maxima
      description:
        'The source heading is "Stats and Skills Maximum table", which is the section title in
        sections.yaml, not a printed heading. PDF 60 prints the heading "Stats and Skills
        Maximum" and no caption for the table. The extraction method is "text" although this is a
        table (the other tables in the chapter use method: table). All 20 cells (Dwarf 80/60/80/80/70,
        Human 70/70/80/80/65, Elf 60/80/80/80/65, Halfling 40/80/80/80/60) match the page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Stats and Skills Maximum
      disposition:
        status: open
        proposed_correction:
          'table.character.stat_maxima: source[0].heading "Stats and Skills Maximum"; keep
          locator.table as an uncaptioned-table locator; extraction.method table.'
    - kind: transcription_error
      section_id: section.levelling_up.stats_and_skills_maximum.table
      object_id: table.character.stat_maxima
      description:
        'source_text reads "There is a maximum value for each stat depending on their race." The
        printed sentence on PDF 60 is "However, there is a maximum value for each stat depending on
        their race." The leading word is dropped and the case changed, while the five
        character.stat.maximum_* rules quote the sentence correctly.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Stats and Skills Maximum
      disposition:
        status: open
        proposed_correction:
          'table.character.stat_maxima: source_text "However, there is a maximum value for each
          stat depending on their race." (or the printed header row "Race | Max STR | Max DEX | Max
          WIS | Max RES | Max CON", as table.character.level_progression does).'
    - kind: coverage_error
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats.table
      description: 'The coverage notes of the three Package D table rows
        (section.levelling_up.increasing_your_skills_and_basic_stats.table,
        section.levelling_up.talents_and_perks.table_talents and
        section.levelling_up.talents_and_perks.table_perks) all say "rendered PDF 61–62". Each
        table sits on one page: the cost matrix on PDF 61 only, and the Talents and Perks tables on
        PDF 62 only. The notes also depend on extraction narrative ("Package D source
        reconciliation", "independent printed-cell regression matrix", "Extraction status only"),
        so they do not stand alone. The section.levelling_up.table note starts with "Phase 3:" and
        does not name its table (table.character.level_progression). Component statuses are
        accurate; only the notes are wrong.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 61
          printed_page: 59
          heading: Increasing your Skills and Basic Stats
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 62
          printed_page: 60
          heading: Talents and Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Levelling Up
      disposition:
        status: open
        proposed_correction:
          'coverage.yaml: rewrite the four notes as stand-alone statements with correct pages, for
          example "Rendered PDF 61. Uncaptioned profession cost matrix:
          table.character.improvement_costs, 5 stat rows, 11 skill rows and Hit points +1 by 8
          professions, printed dashes kept as markers." Use PDF 62 for the Talents and Perks rows
          (9 levels by 8 professions each, Perks None on odd levels). Use PDF 60 for
          section.levelling_up.table (table.character.level_progression, 10 levels by 5 columns).
          Drop the Package D and Phase 3 wording.'
    - kind: source_reference_error
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats
      description:
        'issue.character.improvement_seventy_boundary cites PDF 60 (heading Levelling Up) as well
        as PDF 61. The sentence "Once a stat or skill passes 70, the cost is doubled." is printed
        only on PDF 61, and nothing on PDF 60 bears on the cost boundary. The ambiguity itself is
        real and accurately stated: "passes 70" does not say whether the 70-to-71 purchase is
        doubled. The rule character.advancement.cost_doubling encodes only the undisputed part
        (value > 70), and procedure.character_improve raises the issue at exactly 70.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 61
          printed_page: 59
          heading: Increasing your Skills and Basic Stats
      disposition:
        status: open
        proposed_correction:
          'issue.character.improvement_seventy_boundary: remove the PDF 60 source entry, or replace
          its heading with one that names what on PDF 60 is relevant. Optionally add
          character.advancement.cost_doubling to related (the rule already lists the issue).'
    - kind: ok_with_note
      section_id: section.levelling_up
      object_id: table.character.level_progression
      description:
        'All 50 cells match PDF 60, including the "-" markers and the level 1 values 0/0/0/0 and
        Energy 1 (initial). Luck +1 at levels 2, 5 and 8 and Energy +1 at levels 2, 4, 7 and 9 match
        the luck and energy steps of procedure.character_level_up. The +1d2 Hit Point increase
        applies at every level from 2 to 10. character.level.experience and
        character.level.eligibility quote the opening paragraph verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Levelling Up
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.levelling_up.talents_and_perks
      object_id: table.character.talent_progression
      description:
        'All 72 Talents cells and all 72 Perks cells (levels 2 to 10 by Alchemist, Barbarian,
        Ranger, Rogue, Thief, Warrior, Warrior Priest, Wizard, in printed column order) match PDF
        62, including the None rows at Perk levels 3, 5, 7 and 9. The
        character.advancement.talent_and_perk_choice source_text is verbatim.
        procedure.character_level_ability looks up both tables per profession and refuses a None
        category, which matches "Every other level up, the same goes for a Perk".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 62
          printed_page: 60
          heading: Talents and Perks
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.levelling_up.increasing_your_skills_and_basic_stats
      object_id: procedure.character_improve
      description:
        'The paragraph on PDF 61 is quoted verbatim across the four advancement rules (15 points;
        +5 per level for stats and skills; +2 per level for Hit points; doubled cost once past 70;
        spare points saved). procedure.character_improve applies the profession cost, the racial
        stat maximum, the natural skill maximum of 80, the +5 per-level cap and the doubling. It
        defers the 70 boundary and the Hit Point cap to issue.character.improvement_seventy_boundary
        and issue.character.level_hit_point_limit, both of which are genuine ambiguities on the
        page. Treating a printed "-" cost (Arcane Arts for non-Wizards, Battle Prayers for
        non-Warrior Priests) as not purchasable is a direct reading of the matrix. The cost matrix
        flattens the printed second header row ("Skills") into a single "Basic stats / Skills"
        column label. The stat or skill grouping can still be recovered from the procedure
        kind_stat and kind_skill steps.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 61
          printed_page: 59
          heading: Increasing your Skills and Basic Stats
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.levelling_up.stats_and_skills_maximum
      object_id: test.skill.book_effective_value
      description:
        'The Warrior CS 80 example on PDF 60 is quoted verbatim. Its fixture (80 + 10 + 20 = 110)
        and the derived 90/91 roll cases agree with "a roll of 91-00 always is a failure".
        character.skill.natural_maximum and character.skill.conditional_value are verbatim (the
        printed "talents that gives" is preserved). The five test.character.stat.maximum_*.human
        fixtures use the correct Human maxima (70/70/80/80/65), but call value 60 a
        "boundary case" and leave visually_verified false. That is cosmetic. Changelog 2.21 row 18
        (a player report against an older "Stats and Skills Maximum" wording, marked Fixed) is
        consistent with the second-printing text on PDF 60 and changes nothing here.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Stats and Skills Maximum
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 2
          printed_page: null
          heading: '2.21'
          locator:
            row: 18
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.levelling_up
      object_id: procedure.character_level_up
      description:
        'The cross-chapter quotations in procedure.character_level_up match the rendered pages.
