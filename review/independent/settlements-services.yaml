    - kind: ok_with_note
      section_id: section.settlements.gambling
      object_id: procedure.settlement_gambling
      description:
        'procedure.settlement_gambling, procedure.fortune_teller, procedure.horse_racing and
        procedure.temple_prayer were compared with PDF 145-147 and the Available Actions rows on PDF
        134: once per stay (gambled_this_stay), bets 50-500, -1 per current Luck without spending
        it, natural 10 unmodified, Fortune Teller result 2 as -2, inn stay and 0 Activity Points;
        Fortune Teller 50 c and 1 Activity Point with the Curses table on 6; horse owner, 50 c fee,
        bet up to 300 c including the fee, 1 Activity Point, catastrophe 1d6 HP and 1 Sanity and
