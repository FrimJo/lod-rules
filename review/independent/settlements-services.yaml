  findings:
    - kind: transcription_error
      section_id: section.settlements.guilds
      object_id: procedure.guild_access
      description: >-
        Re-review of the open transcription_error in review.settlements_services.1. Verified on PDF 145: source_text now opens with the printed Guilds paragraph verbatim ("There are several Guilds available, and these are all in Silver City. They are described at the end of this chapter. The Guilds are very protective ... enter."), with a "..." gap to the PDF 153 visitor sentence. The initialize step quotes the printed "The Guilds are very protective of their skills and services, and they will only allow heroes of the appropriate professions to enter." The enter_inner_sanctum step quotes PDF 158 "Only a Warrior Priest may enter the Inner Sanctum and consult with the High Priests." The PDF 145 sources are now visually_verified true. The "no membership fee" remark now sits in unresolved_references as a statement that the book prints none, which matches the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 153
          printed_page: 151
          heading: Wizards’ Guild
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: The Inner Sanctum
      disposition:
        status: corrected
        change: >-
          procedure.guild_access source_text, initialize step, enter_inner_sanctum step and PDF 145 visually_verified flags now match PDF 145, 153 and 158 as described above.
    - kind: source_reference_error
      section_id: section.settlements.guilds
      description: >-
        Re-review of the open source_reference_error for procedure.guild_item_service. The procedure now carries section_id section.wizards_guild, so it has left this digest and is not examined in this record; the finding is closed here only for the section assignment and the paraphrase. Its text was checked on PDF 153 and 158: the source_text "A broken Magic Item that has been repaired can be recharged for 250 coins." (with ellipsis), the initialize quote "Apart from visitors recharging magic items, only Wizards are allowed here.", the staff quote "Recharging a staff costs half of the purchase price of the staff.", the armour fee quote ("Each piece of armour must be individually blessed ... 25 c per piece") and the weapon quote ("Blessing a weapon ... lasts until the heroes leave the next dungeon") are all verbatim. The remaining steps of that procedure belong to the section.wizards_guild review, which should re-read them against PDF 153 and 158.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 153
          printed_page: 151
          heading: Charging Magic Items; Charges and Recharges
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Blessing Your Armour and Weapons
      disposition:
        status: corrected
        change: >-
          procedure.guild_item_service moved to section.wizards_guild and its source_text and step quotes replaced with verbatim PDF 153 and 158 sentences; the paraphrase and implementation notes are gone from this object.
    - kind: source_reference_error
      section_id: section.settlements.guilds
      object_id: procedure.guild_purchase_authorization
      description: >-
        Re-review of the open source_reference_error for procedure.guild_purchase_authorization. Verified on PDF 145, 148, 152, 153, 154, 157 and 158: the initialize step quotes the PDF 145 access sentence; the authorize source_text is a chain of verbatim guild-page sentences with "..." gaps ("There is certain equipment for sale at the Dark Guild that can be of use during a quest:", "Some specialised equipment is only sold at the Fighters’ Guild.", "However, magical staffs are comparably common,", "At the Alchemists’ Guild, you can purchase both parts and ingredients, when they are available.", "Potions can be bought here.", "Some equipment is only sold in the Rangers’ Guild.", "Here you can buy special things that are usually only available to the Warrior Priests."). The paraphrase and the "Resolve ..." and "Pass eligibility ..." step texts are removed and the implementation notes moved to unresolved_references and dependency labels. The changelog 2.21 entry 177 ruling on the body-part sentence (issue.guild.human_body_parts) is not contradicted, because the quote omits that sentence with a gap rather than altering it. Keeping section_id at section.settlements.guilds is acceptable for a shared access guard.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 154
          printed_page: 152
          heading: Purchasing Ingredients, Parts, and Potions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Buying Special Equipment
      disposition:
        status: corrected
        change: >-
          procedure.guild_purchase_authorization source_text and the authorize step quotes replaced with verbatim guild-page sentences, the paraphrase steps removed and the implementation notes moved out of source_text.
    - kind: transcription_error
      section_id: section.settlements.skills_training
      object_id: procedure.guild_skill_training
      description: >-
        Re-review of the open transcription_error for procedure.guild_skill_training. Verified on PDF 147: the initialize step quotes "This can be done in the Guilds." Each eligibility step quotes its printed guild paragraph verbatim with the printed profession and skill lists in its when qualifiers: Dark (PDF 148: "You can practice CS, RS, Pick Locks, and Perception here."), Fighters (PDF 151: "This is the guild for Warriors and Barbarians." and "You can practice CS, Heal and Dodge here."), Wizards (PDF 153: "As the name implies, this is the guild for Wizards." and "You can practice your Arcane Arts, Perception, and Heal here."), Alchemists (PDF 154: "You can practice Alchemy, Heal, and Perception."), Rangers (PDF 156: "This is where the Rangers get together, sharing stories and exchanging experience." and "You can practice CS, RS, Dodge, Heal, and Foraging.") and Inner Sanctum (PDF 158: "You can practice CS, Dodge, and Battle Prayers here."). The check_training step quotes the Skill Training row on PDF 134 (Guilds, 1 Activity Point) and PDF 153. The 80 cap is now a verbatim PDF 60 sentence ("The natural value of a skill can never exceed 80, including talents that give an unconditioned bonus of the value.") with its own source. The train step's "takes 1 day" is a verbatim PDF 158 quote, but it gates every guild; that scope question is recorded in the new issue below.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Skills Training
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 60
          printed_page: 58
          heading: Stats and Skills Maximum
      disposition:
        status: corrected
        change: >-
          procedure.guild_skill_training source_text and step quotes replaced with verbatim sentences from PDF 147, 148, 151, 153, 154, 156, 158, PDF 134 and PDF 60; the paraphrase and implementation notes removed from source_text.
    - kind: coverage_error
      section_id: section.settlements.guilds
      description: >-
        Re-review of the open coverage_error for the guilds coverage notes. Verified in corpus/source-map/coverage.yaml: the notes now name procedure.guild_access and procedure.guild_purchase_authorization under Procedures, say that the recharging and blessing services are procedure.guild_item_service under the Wizards’ Guild chapter, and state that the guild entities belong to the guild chapters. The section assignment and the notes now agree with the objects.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
      disposition:
        status: corrected
        change: >-
          section.settlements.guilds coverage notes now list the two guild procedures that keep this section and point procedure.guild_item_service to the Wizards’ Guild chapter.
    - kind: ok_with_note
      section_id: section.settlements.tending_to_those_memories
      object_id: character.sanity.inn_recovery
      description: >-
        Re-review of the open modelling_error (changelog 2.21 entry 83, once per settlement stay). The corrector pushed back: the once-per-stay guard would need per-stay recovery state on procedure.sanity_recovery, which is frozen (generated/review/frozen-ids.txt). I judge the pushback as the brief allows. The defect is recorded: issue.sanity.recovery_scope quotes changelog entry 83 as Fixed and states the once-per-stay limit, and the object's unresolved_references says a caller must not apply the 1d3 twice in the same stay. The changelog source row 83 (changelog page 14, rendered and read) is now cited, and the quote in unresolved_references matches it. The executable when on character.sanity.inn_recovery still has no guard and remains an unenforced limit, so the extraction side should keep the limit visible wherever this rule is invoked.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Tending to those Memories
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 14
          printed_page: null
          heading: '2.21'
          locator:
            row: 83
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.settlements.skills_training
      object_id: procedure.guild_skill_training
      description: >-
        The book does not say whether guild skill training at the Dark, Fighters, Wizards, Alchemists or Rangers guilds takes a day. Only the Inner Sanctum paragraph (PDF 158) prints "takes 1 day". The Available Actions row (PDF 134) gives Skill Training 1 Activity Point at Guilds, and that table's introduction says only activities costing more than 1 Activity Point take longer than a day. The other five guild paragraphs print the price and the one-session limit only. procedure.guild_skill_training requires completed_activity_days of at least 1 for every guild, which is an unprinted qualifier for those five guilds. The procedure's unresolved_references note this, but the question was not recorded as an issue. Recorded as issue.guild.training_day_gate, which the extraction side should also add to the procedure's issues list.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 158
          printed_page: 156
          heading: Practicing Skills
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 148
          printed_page: 146
          heading: Skill training
      disposition:
        status: recorded_as_issue
        issue_id: issue.guild.training_day_gate
    - kind: ok_with_note
      section_id: section.settlements.guilds
      object_id: procedure.guild_access
      description: >-
        Checked on PDF 148, 151, 153, 156 and 158. The entry steps enter_dark ("Located in the shadier parts of the city, this Guild is for Thieves and Rogues.", PDF 148), enter_fighters, enter_wizards, enter_rangers and enter_inner_sanctum quote printed guild-page sentences verbatim and their profession and guild qualifiers match the printed guild. The enter_alchemists step quotes the general PDF 145 access sentence because the Alchemists’ Guild page (PDF 154) prints no entry sentence; that is acceptable as the general access gate. The enter_dark and enter_rangers sources are still visually_verified false although the text matches the page, which the extraction side may set true.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 148
          printed_page: 146
          heading: The Dark Guild
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 156
          printed_page: 154
          heading: Rangers’ Guild
      disposition:
        status: no_change_needed
  outcome: passed_with_corrections
  summary: >-
    Re-review of settlement services (Buying and Selling through Treat Mental Conditions, PDF 144-147, printed 142-145) after the corrections to record .1. I rendered and read PDF 144, 145, 146 and 147, the Available Actions table on PDF 134, the Skills Maximum page PDF 60 for the 80 cap, and the guild pages PDF 148, 150, 151, 152, 153, 154, 155, 156, 157 and 158 for the changed guild steps, plus changelog 2.21 page 14 (entry 83). Five open findings from .1 are verified as corrected: the guild_access transcription, the guild_item_service section and text, the guild_purchase_authorization paraphrase, the guild_skill_training paraphrase and the guilds coverage notes. The inn_recovery once-per-stay pushback is accepted under the brief because it needs frozen procedure.sanity_recovery and the limit is recorded in issue.sanity.recovery_scope and the object's notes. One new issue is recorded, issue.guild.training_day_gate, on the unprinted one-day gate for non-Inner-Sanctum guilds. No finding is open. Unchanged objects were not re-read beyond the scope pages; their findings from .1 stand as recorded there.
