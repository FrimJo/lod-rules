        availability 1d6, Magic Brewery 5/4, potion identification 25 c, magic item identification
        150 c, cure 100 c and one day, spell or prayer 200 c + 100 c per level above 1 (Grimoire
        free, 3 days, prayer 1 day), temples, Rest 2d6 HP or 1d6 HP and half (RDD) in the stable,
        Memories 1d3 and 1d6 for 1d3*100 c, Asylum 1000 c, one attempt between quests, 1-5 on 1d6, 5
        days. Rulings: changelog 81 (rejected, "This is as intended") keeps 1-5; 82 is applied to
        Ohlnir with the Charus misprint kept in source_text; 83 is cited on
        character.settlement.memories (see the open finding on character.sanity.inn_recovery); 171
