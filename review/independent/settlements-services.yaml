    - kind: ok_with_note
      section_id: section.settlements.horse_racing
      description:
        'Tables checked cell by cell against PDF 145-146: table.settlement.fortune_teller (1d6:
        1, 2, 3-5, 6), table.settlement.gambling (1d10: <=1, 2-3, 4-9, 10, "1,5 times the bet
        (RDU)", "an additional 100 c"), table.settlement.horse_racing (<= DEX/2 (RDD), <=DEX-10,
        >DEX-10, >=95), table.settlement.racing_winnings (levels 1-10, 3 / 2,5 down to 2,1 / 1,6,
        header "Multiplier for 2nd place." with its period) and table.settlement.racing_awards
        (1-2/1, 3-4/2-3, 5-10/4-10). The historical nodes
        section.settlements.learn_a_spell_or_prayer.table and section.settlements.level_up.table are
        titled "Horse racing winnings multipliers" and "Horse racing extra awards" and parented to
        section.settlements.horse_racing, which is right; the book prints no captions. Overlap of
        catastrophe (>=95) with the other placements stays with
        issue.settlement.horse_racing_catastrophe.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Win and Second Place
