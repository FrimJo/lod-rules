    - kind: uncertainty_not_recorded
      section_id: section.settlements.repair_equipment
      object_id: character.durability.repair_location
      description:
        Repair Equipment (PDF 147) allows repairs at the General Store for gear and at the
        Blacksmith for weapons and armour; the Available Actions row Repair Equipment (PDF 134)
        lists only the Blacksmith. The rules follow PDF 147 and no issue recorded the difference.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
