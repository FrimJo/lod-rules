  outcome: failed
  summary:
    'Settlement activities (b), Buying and Selling through Treat Mental Conditions, PDF 144-147
    (printed 142-145), plus the Available Actions table on PDF 134 and Reducing Insanity on PDF 55
    for cross-checks, and changelog 2.21 pages 12-14 and 26 (entries 171-172 on page 25 read from the text dump only). All rules quote the page verbatim,
    all five tables match cell by cell, and every cost, die, Activity Point cost and once-per-stay
    or once-per-quest limit in the four activity procedures and their fixtures matches the print.
    Failed on six open findings: leftover paraphrase and section assignment in the guild procedures
    filed under Guilds and Skills Training (procedure.guild_access, procedure.guild_item_service,
    procedure.guild_purchase_authorization, procedure.guild_skill_training), the Guilds coverage
    notes, and character.sanity.inn_recovery not executing the changelog 83 once-per-stay limit.
    Four new issues record the horse-racing payout basis, the Ohlnir "1CS" typo, the Enchant Objects
    spell name and the repair-location conflict with Available Actions. The guild-chapter pages (PDF
    148-158) were not inspected; the printed wording of the guild procedures there is left to the
    guild-chapter review.'

