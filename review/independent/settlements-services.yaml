  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:8f145ccb9902905c0f0af9ac1d5e79afdb53925e03ef32a778de48795ee3f200
  findings:
    - kind: transcription_error
      section_id: section.settlements.guilds
      object_id: procedure.guild_access
      description:
        Leftover paraphrase. The procedure source_text ("All guilds are in Silver City. Their
        services are restricted to the appropriate professions. The Wizards’ Guild separately admits
        visitors recharging magic items. The source gives no membership fee, enrolment sequence or
        membership rank.") is not printed text; PDF 145 prints "There are several Guilds available,
        and these are all in Silver City. They are described at the end of this chapter. The Guilds
        are very protective of their skills and services, and they will only allow heroes of the
        appropriate professions to enter." Step initialize quotes "Guilds only allow heroes of
        appropriate professions to enter." and step enter_inner_sanctum quotes "Appropriate
        professions may enter their guild.", neither of which is printed wording. Step
        enter_alchemists quotes the PDF 145 sentence verbatim. The PDF 145 source entries carry
        visually_verified false.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
      disposition:
        status: open
        proposed_correction:
          'procedure.guild_access: replace the procedure source_text with the verbatim
          PDF 145 Guilds paragraph (optionally plus the verbatim Wizards’ Guild visitor sentence);
          move "The source gives no membership fee, enrolment sequence or membership rank" to a
          field description or issue; set step initialize source_text to "The Guilds are very
          protective of their skills and services, and they will only allow heroes of the
          appropriate professions to enter." with a PDF 145 source; replace step enter_inner_sanctum
          source_text with the printed Inner Sanctum sentence that names who may enter (PDF 158);
          mark the PDF 145 sources visually_verified true.'
    - kind: source_reference_error
      section_id: section.settlements.guilds
      object_id: procedure.guild_item_service
      description:
        procedure.guild_item_service (Wizards’ Guild recharging and Inner Sanctum armour and
        weapon blessing) carries section_id section.settlements.guilds but cites no text from that
        heading; its sources are PDF 153 and PDF 158 only. The Guilds heading on PDF 145 says
        nothing about recharging, blessing or fees. Its procedure source_text is a summary
        ("Repaired broken magic items recharge for 250 c; a staff recharge costs half its purchase
        price. The Warrior Priest may have each armour piece blessed ...") and steps initialize
        ("Select the correct guild item service and its fee."), check_service, perform_service,
        recharge and staff_charges quote implementation notes, not printed text. The printed wording
        on PDF 153/158 was not inspected in this review, so only the paraphrase and the section
        assignment are reported.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
      disposition:
        status: open
        proposed_correction:
          'procedure.guild_item_service: move section_id to the guild chapter that prints
          the services (section.wizards_guild for recharging, section.the_inner_sanctum for
          blessing, splitting the procedure if needed), replace the procedure and step source_text
          values with verbatim sentences from PDF 153 and PDF 158, and move the implementation notes
          to field or dependency descriptions.'
    - kind: source_reference_error
      section_id: section.settlements.guilds
      object_id: procedure.guild_purchase_authorization
      description:
        procedure.guild_purchase_authorization is filed under section.settlements.guilds, but
        apart from a PDF 145 Guilds citation its content is the guild chapters' Buying Special
        Equipment, Wizard's Staffs and Alchemists' ingredients/parts/potions passages (PDF 148-157).
        Its procedure source_text is a summary, not printed text ("Guild purchases reuse the
        structured special-equipment and component catalogues. Resolve the printed price,
        availability and restrictions ... with the printed illegal-body-part boundary retained ...
        Guild access is checked separately."), and the step texts "Resolve guild access, completed
        shopping activity, and a real catalogue offering." and "Pass eligibility and the resolved
        quote to ordinary settlement purchasing; do not charge twice." are implementation notes.
        (Changelog 2.21 entry 177 removes the body-part sentence on printed page 152; that page is
        outside this review.)
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
      disposition:
        status: open
        proposed_correction:
          'procedure.guild_purchase_authorization: quote the PDF 145 Guilds sentence for
          the access guard and verbatim guild-chapter sentences for the purchase steps, move
          implementation notes to descriptions, and consider moving section_id to the guild chapters
          that print the catalogues; have the guild-chapter review confirm the changelog 177
          handling.'
    - kind: transcription_error
      section_id: section.settlements.skills_training
      object_id: procedure.guild_skill_training
      description:
        Skills Training on PDF 147 prints only "This can be done in the Guilds." The procedure
        source_text ("The appropriate profession may train only the guild’s listed skills. A session
        grants +3 for 300 c, with one session per skill between two dungeons. Skill Training takes
        one Activity Point; the Inner Sanctum explicitly states one day. The natural skill maximum
        remains 80; no partial +1/+2 purchase is specified.") and every step source_text ("Guilds
        protect their services and admit the appropriate professions.", six copies of "Training is
        restricted to the listed professions and skills.", "The source does not specify partial
        +1/+2 training ...", "A +3 session costs 300 c, takes one Activity Point ...", "Complete the
        reserved training day, pay once, and increase the chosen skill by +3.") are paraphrase or
        notes. The PDF 147 source entry carries visually_verified false. The Activity Point cost 1
        matches the Skill Training row on PDF 134.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Skills Training
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 134
          printed_page: 132
          heading: Available Actions
      disposition:
        status: open
        proposed_correction:
          'procedure.guild_skill_training: quote "This can be done in the Guilds." (PDF
          147, Skills Training, visually_verified true) and the Skill Training row of Available
          Actions for the settlement side, and verbatim Skill Training sentences from each guild
          page for the profession, price, +3 and once-per-skill steps; keep the 80 cap note in
          issue.guild.training_near_cap and field descriptions rather than in source_text.'
    - kind: coverage_error
      section_id: section.settlements.guilds
      description:
        The coverage notes for section.settlements.guilds name only procedure.guild_access
        under Procedures, but procedure.guild_item_service and
        procedure.guild_purchase_authorization also carry section_id section.settlements.guilds, so
        the notes do not stand alone for the objects the section owns.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 145
          printed_page: 143
          heading: Guilds
      disposition:
        status: open
        proposed_correction:
          'corpus/source-map/coverage.yaml section.settlements.guilds: after resolving
          the two section-assignment findings above, either list every procedure that keeps
          section_id section.settlements.guilds in the notes or, if they move, keep only
          procedure.guild_access.'
    - kind: modelling_error
      section_id: section.settlements.tending_to_those_memories
      object_id: character.sanity.inn_recovery
      description:
        'Changelog 2.21 entry 83 (rendered changelog page 14, marked Fixed with a stated rule):
        "If you stay at the same settlement for consecutive nights you are still only allowed to
        regain 1D3 Sanity ... Once you return from a quest you can once again regain 1D3 Sanity in
        that same settlement." character.settlement.memories records it only as a descriptive output
        (inn_recoveries_per_stay 1). The executable rule character.sanity.inn_recovery still fires
        whenever nights >= 1 and current_conditions = 0, with no once-per-stay guard and no citation
        of the ruling, so a second inn night in the same stay grants another 1d3. The extraction
        guide requires executable effects to follow an applied ruling. The PDF 55 cap of 8 and the
        PDF 147 quotation are correct.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Tending to those Memories
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 14
          printed_page: null
          heading: '2.21'
          locator:
            row: 83
      disposition:
        status: open
        proposed_correction: 'character.sanity.inn_recovery: add a boolean input such as
          inn_sanity_recovered_this_stay (reset after a quest), require it to be false in when, set
          it true in effects, and add the changelog 2.21 page 14 row 83 source; add a derived
          fixture where a second inn night in the same stay leaves Sanity unchanged.'
    - kind: uncertainty_not_recorded
      section_id: section.settlements.horse_racing
      object_id: procedure.horse_racing
      description:
        Win and Second Place (PDF 146) says the hero "wins money" by multiplying "the amount
        bet including the entry fee (RDD)". procedure.horse_racing deducts the bet on entry and adds
        bet x multiplier, the total-returned reading, while the parallel Gambling wording "You win 2
        times your bet" is held unresolved by issue.settlement.gambling_outcome_amounts. No issue
        recorded the horse-racing basis. All multiplier cells (31 - level and 26 - level tenths) and
        the fixtures' arithmetic match the printed table. The issue lists procedure.horse_racing as
        related; the extraction side may also add it to the procedure's issues list.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 146
          printed_page: 144
          heading: Win and Second Place
      disposition:
        status: recorded_as_issue
        issue_id: issue.settlement.horse_racing_winnings_basis
    - kind: uncertainty_not_recorded
      section_id: section.settlements.pray_at_the_local_temples
      object_id: character.settlement.temple.ohlnir
      description:
        Temple of Ohlnir prints "+5 CS/RS (either 1CS or RS – player’s choice)". The stray "1"
        before CS was not recorded; issue.settlement.ohlnir_temple_name and changelog 82 cover only
        the Charus name. The rule and procedure.temple_prayer steps ohlnir_cs/ohlnir_rs give +5 to
        the chosen skill, the natural reading.
      source:
        - document: rulebook.second_printing.eng
