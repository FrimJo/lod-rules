        status: recorded_as_issue
        issue_id: issue.settlement.ohlnir_cs_rs_choice
    - kind: uncertainty_not_recorded
      section_id: section.settlements.enchant_items
      object_id: character.settlement.enchant_items
      description: Enchant Items requires "the Enchant Objects Spell"; the rule binds it to
        spell.enchant_item (named Enchant Item) without recording the name difference. The pointer
        to "the ‘Enchant Items’ chapter in the Academic Skills section" bound to
