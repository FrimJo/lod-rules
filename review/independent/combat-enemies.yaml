    - kind: ok_with_note
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.defence.shield_parry
      description: 'The parry values match PDF 120 and its summary box. Outside Parry Stance: Dodge, and shield CS-15 once per turn. In Parry Stance: one dodge AND one parry, Dodge+15, shield CS+15, weapon CS; weapon parry 95-00 fails. The shield-parry spillover and absorbed rules reproduce the Berthram example (8 damage, DEF 6, 2 to the arm, shield takes 1). issue.combat.shield_threshold ("below CS +15") and issue.combat.power_timing ("last action") describe the printed text accurately. dodge_once keeps the printed word "battle".'
