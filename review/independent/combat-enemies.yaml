      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.activation_of_enemies
      object_id: combat.enemy.activation_order
      description: 'Changelog page 25 entry 164 ("Page 116 Changed ''Behaviour Card'' into ''Monster Card'' to prevent confusion") changes wording only. Our PDF 118 prints "Behaviour Card", and issue.combat.behaviour_card_naming records the entry without applying it, which is correct. Entry 165 concerns Poison (PDF 122) and is outside this unit. Entries 69 (grammar of "requires 1d6 AP") and 70 (placement of the humanoid example) change no mechanic.'
