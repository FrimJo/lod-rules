    - kind: ok_with_note
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.enemy.fumble.drops_weapon
      description: 'Changelog page 10 entry 68 (rendered) says "The part about enemy should just be removed from Fumble page 100 to avoid this inconsistency". That is a stated direction, so Enemy Fumbles (PDF 120) governs. Entry 123 (page 21) only says "Ideally, both sections have the same wording", so it states no rule and only supports the resolution. issue.combat.enemy_fumble resolves on that basis, and the printed source_text stays verbatim. Minor: the issue''s resolution sources say visually_verified false, while the rules cite the same entries as true. I verified both entries on the rendered changelog pages.'
