  outcome: passed_with_corrections
  summary: 'Re-review of review.combat_enemies.1. Rendered PDF 118-120 (printed 116-118) and the
    cross-referenced pages 70, 107, 109, 110, 112 and 179. All nine open findings of record .1 are
    corrected and checked on the page: through_zoc separates the ZOC requirement from the
    Talent/Perk qualifier; iron_wedges excludes ethereal creatures; Choosing Targets is split so the
    stick-with-target rule is unconditional; durability.weapon_parry requires a weapon parry;
    overlap_uncertain cites and quotes PDF 112 and 70; hero_defence steps quote printed text, the
    dodge step cites Aim, and the unsourced Fast qualifier is replaced by a PDF 179 Fast parry
    branch outside Parry Stance with issue.combat.fast_parry_in_stance; enemy_priority cites
    Activation on PDF 107; the option 2 italic paragraph is quoted with a source_example fixture. No
    new issues and no open findings.'
