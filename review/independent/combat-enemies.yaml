    - kind: ok_with_note
      section_id: section.combat.detailed_acting_with_enemies
      object_id: procedure.humanoid_close_combat_behaviour
      description: 'Options 1-4 are mutually exclusive and follow the printed top-down order. Option 1 is gated on can_make_room and room_attempted_this_turn, which matches the italic "next action must be an attack ... whether the shove succeeded or not". Every substep has a fixture: make_room, attack_after_room, power_wounded, use_skill, skill_not_available, approach_parry, move_into_close_combat, charge, charge_unable and advance in enemy-behaviour.yaml, plus power_attack, parry_with_two_ap and parry_stance (1 AP) through the Combat Example fixtures. The make_room and advance fixtures quote the italic text verbatim.'
