  findings:
    - kind: modelling_error
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.defence.through_zoc
      description: 'PDF 120 Parrying or Dodging prints two sentences. "Dodging and parrying can only be done if the attack comes through the hero’s ZOC." has no exception. "They can be done against arrows or strikes, unless a Talent or Perk states otherwise." carries the Talent/Perk exception. The rule''s require effect is through_zoc OR talent_or_perk_exception, so a Talent or Perk would lift the ZOC requirement. The book does not say that.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parrying or Dodging
      disposition:
        status: open
        proposed_correction: 'Make the require condition through_zoc == true on its own. Attach the Talent/Perk qualifier to a separate condition: arrows or strikes may be dodged or parried unless a Talent or Perk states otherwise (for example an attack_type input and a talent_or_perk_forbids input).'
    - kind: modelling_error
      section_id: section.combat.acting_with_enemies
      object_id: combat.enemy.door.iron_wedges
      description: 'PDF 118 Enemies and doors: "Ethereal creatures ignore doors unless they are magically sealed" and "A magically sealed door will slow them down for 1d3 turns." combat.enemy.door.magically_sealed excludes creature_kind ethereal. combat.enemy.door.iron_wedges has no creature_kind condition, so an ethereal creature at a wedged door that is not sealed still gets iron_wedge_turns 3, although the book says it ignores that door.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 118
          printed_page: 116
          heading: Enemies and doors
      disposition:
        status: open
        proposed_correction: Add a creature_kind field and a "creature_kind ne ethereal" condition to combat.enemy.door.iron_wedges, matching combat.enemy.door.magically_sealed.
    - kind: modelling_error
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.enemy.choosing_targets
      description: 'PDF 120 Choosing Targets: "Once the target has been decided, the enemy will stick with that target for that turn. Next turn, it revaluates who to strike." That holds whichever target was chosen. The rule only sets target_fixed_for_turn when untargeted_target_available is true, so an enemy whose adjacent targets are all already targeted gets no stick-with-target constraint. The next-turn re-evaluation is not typed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Choosing Targets
      disposition:
        status: open
        proposed_correction: Split it into two rules. One prefers a target not targeted by another enemy (needs choice_between_adjacent_targets and untargeted_target_available). The other sets target_fixed_for_turn once a target is decided, with no condition on untargeted_target_available, and states that the target is re-evaluated next turn.
    - kind: modelling_error
      section_id: section.combat.parry_with_a_weapon
      object_id: character.durability.weapon_parry
      description: 'PDF 120 Parry with a Weapon: "if you roll 95-00 you not only fail, but the weapon also takes 1 Point of Damage." The penalty applies to a weapon parry roll only. The rule''s when is only roll >= 95 (scope global), so taken alone it takes durability off for any roll of 95+. test.character.durability.weapon_parry.lower_bound runs it with no parry context.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
      disposition:
        status: open
        proposed_correction: Add a weapon_parry boolean input and a "weapon_parry == true" condition to the when. Update the two weapon_parry fixtures to supply weapon_parry true (and add one with false).
    - kind: source_reference_error
      section_id: section.combat.parry_with_a_weapon
      object_id: character.durability.overlap_uncertain
      description: The rule has a magic_weapon_attack branch and overrides character.durability.fumble, but it cites only PDF 120 and quotes only the weapon parry sentence. Neither the general 00 fumble durability loss nor magic dissipation at 00 is printed on PDF 120. Those parts come from PDF 112 (Fumble) and PDF 70 (Dissipating Magic), as issue.phase4.durability_overlap's sources show.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
      disposition:
        status: open
        proposed_correction: Add PDF 112 (Fumble) and PDF 70 (Dissipating Magic) source references, and quote the overlapping sentences in source_text. Alternatively, split the magic weapon branch into an object sectioned where it is printed.
    - kind: transcription_error
      section_id: section.combat.parry_with_a_weapon
      object_id: procedure.hero_defence
      description: 'Most step source_text values are paraphrases presented as source text, not printed wording. Examples: start "Defence requires incoming attack through ZOC, resolved Power restriction, and eligible equipment/use count."; dodge_stance "Parry Stance gives +15 Dodge."; weapon "Weapon parry requires Parry Stance; roll CS, with supplied talent/weapon modifiers."; success, shield_equality, avoid, shield_absorbs, spillover, weapon_damage and parry_overlap. PDF 120 prints none of these sentences.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
      disposition:
        status: open
        proposed_correction: Replace each step source_text with the verbatim printed sentence(s) it implements from PDF 120 (or PDF 112 for the fumble steps), using "..." for elisions. Move explanatory paraphrase to notes or unresolved_references.
    - kind: source_reference_error
      section_id: section.combat.parry_with_a_weapon
      object_id: procedure.hero_defence
      description: 'Two step qualifiers are not on the page they cite. The dodge step requires aiming == false ("Aiming forbids dodge"), and the weapon_damage step excludes fast_weapon ("unless Fast"). Both cite only PDF 120, which mentions neither aiming nor Fast weapons. The Fast special (PDF 179, combat.weapon.special.fast.damage) also allows a parry outside Parry Stance and damages the weapon on 90-00. The weapon step requires parry_stance true and never routes to that rule, so a Fast weapon parry outside the stance, or a 90-94 roll, is not handled.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
      disposition:
        status: open
        proposed_correction: Cite the page that defines the Aiming restriction on the dodge step, and PDF 179 (Weapons, Fast) on weapon_damage. Add a Fast-weapon branch that allows the parry outside Parry Stance once per turn and has rule_refs to combat.weapon.special.fast.damage, or record the gap as an unresolved reference.
    - kind: modelling_error
      section_id: section.combat.activation_of_enemies
      object_id: procedure.enemy_priority
      description: The select step also requires candidate_alive true, candidate_knocked_out false and candidate_acted false. PDF 118 Activation of Enemies prints only the six-item order and "Randomise if there are two or more enemies that could possibly act at the same time." The knocked-out and already-acted exclusions are not printed here, and the step gives no source for them.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 118
          printed_page: 116
          heading: Activation of Enemies
      disposition:
        status: open
        proposed_correction: Cite the rulebook pages that exclude knocked-out or already-activated enemies from activation, or remove those conditions and record the gap in unresolved_references. Separately, consider renaming the field description "adjacent and makes room" to the printed "could make room for more enemies".
    - kind: missing_extraction
      section_id: section.combat.detailed_acting_with_enemies
      description: 'The italic explanation under option 2 on PDF 119 is not quoted by any object: "Roll on the table to see what kind of attack the enemy will perform. First you roll 1d10 if it will make an attack or use a Special Skill or Talent. Check the Bestiary to see if the enemy has any such abilities. If you roll Parry in the first action, treat that as the second action and perform a Standard Attack first." Its final sentence is a rule statement in "first action" terms, alongside the footnote''s "2 AP left" wording. The coverage row points only to a Combat Example fixture on another page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 119
          printed_page: 117
          heading: Humanoid with Close-Combat Weapon
          locator:
            paragraph: option 2, italic explanation
      disposition:
        status: open
        proposed_correction: Add the option 2 italic paragraph as a second source and quotation on combat.enemy_behaviour.humanoid_close_combat.parry_with_two_ap. Also add a source_example fixture quoting it (adjacent, 2 AP, roll 1 or 2, expecting standard_attack then parry_stance).
    - kind: uncertainty_not_recorded
      section_id: section.combat.detailed_acting_with_enemies
      object_id: procedure.humanoid_close_combat_behaviour
      description: Row 6 "Power Attack (if wounded, Parry stance)" yields Parry stance for a wounded enemy, but the asterisk footnote (2 AP left means a standard attack first) is printed only on row 1-2. The italic "If you roll Parry in the first action" may or may not cover it. The procedure's power_attack_wounded substep goes straight to parry_stance without recording the doubt.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 119
          printed_page: 117
          heading: Humanoid with Close-Combat Weapon
          locator:
            table: Uncaptioned table under option 2 (1d10 / Action)
            row: '6'
