  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:7e5c57d4e0cc066abbfe7990ab749fc3c8968f0804d46da75daf99094d42bdd2
  findings:
    - kind: modelling_error
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.defence.through_zoc
      description:
        'Re-check of review.combat_enemies.1 finding 1. PDF 120 Parrying or Dodging: "Dodging
        and parrying can only be done if the attack comes through the hero’s ZOC." has no exception;
        the Talent/Perk exception belongs to "They can be done against arrows or strikes". The rule
        now has two require effects: through_zoc == true on its own, and (attack_type strike or
        arrow) AND talent_or_perk_forbids == false. The fixtures through_zoc_strike, outside_zoc and
        talent_forbids_arrow exercise each require.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parrying or Dodging
      disposition:
        status: corrected
        change:
          The ZOC requirement is a separate require with no Talent/Perk escape; the Talent/Perk
          qualifier is attached only to the arrows-or-strikes require, through attack_type and
          talent_or_perk_forbids inputs. Three derived fixtures added.
    - kind: modelling_error
      section_id: section.combat.acting_with_enemies
      object_id: combat.enemy.door.iron_wedges
      description:
        'Re-check of finding 2. PDF 118 Enemies and doors: "Ethereal creatures ignore doors
        unless they are magically sealed". combat.enemy.door.iron_wedges now has a creature_kind
        input and a "creature_kind ne ethereal" condition, matching magically_sealed, and its
        source_text adds the printed ethereal sentence. test.combat.enemy.door.iron_wedges
        (humanoid, 3 turns) and .iron_wedges_ethereal (no effect) cover both cases.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 118
          printed_page: 116
          heading: Enemies and doors
      disposition:
        status: corrected
        change:
          Added creature_kind and the ethereal exclusion to iron_wedges, quoted the ethereal sentence,
          and added two fixtures.
    - kind: modelling_error
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.enemy.choosing_targets.stick_with_target
      description: Re-check of finding 3. PDF 120 Choosing Targets is now two rules.
        combat.enemy.choosing_targets quotes only the first sentence and keeps its
        untargeted_target_available gate. combat.enemy.choosing_targets.stick_with_target quotes
        "Once the target has been decided, the enemy will stick with that target for that turn. Next
        turn, it revaluates who to strike." verbatim (including the printed "revaluates"), fires on
        target_decided alone and sets target_fixed_for_turn and reevaluate_next_turn. The
        all_targeted fixture shows the stick-with-target constraint holds when every adjacent target
        is already targeted.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Choosing Targets
      disposition:
        status: corrected
        change: Split Choosing Targets into combat.enemy.choosing_targets (preference) and
          combat.enemy.choosing_targets.stick_with_target (unconditional on
          untargeted_target_available, with the next-turn re-evaluation typed). Two fixtures added.
    - kind: modelling_error
      section_id: section.combat.parry_with_a_weapon
      object_id: character.durability.weapon_parry
      description:
        Re-check of finding 4. The rule now has a weapon_parry boolean input and its when is
        weapon_parry == true AND roll >= 95, so the 95-00 durability loss applies to a weapon parry
        only, as printed on PDF 120. The lower_bound (95) and below (94) fixtures supply
        weapon_parry true, and not_a_parry (95, weapon_parry false) expects no change.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
      disposition:
        status: corrected
        change: Added the weapon_parry qualifier to the when and updated and added fixtures.
    - kind: source_reference_error
      section_id: section.combat.parry_with_a_weapon
      object_id: character.durability.overlap_uncertain
      description:
        'Re-check of finding 5. The rule now cites PDF 112 (Fumble) and PDF 70 (Dissipating
        Magic) beside PDF 120. I rendered both pages: "A hero rolling 100 when attacking or parrying
        damages his weapon or shield. Deduct 1 point of durability." (PDF 112) and "Whenever you
        roll 00 when attacking with a magic weapon, the power is suddenly gone, turning the weapon
        into an ordinary weapon. This includes the durability, which immediately drops to a maximum
        of 6." (PDF 70) are quoted verbatim in source_text with elisions marked.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Fumble
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 70
          printed_page: 68
          heading: Dissipating Magic
      disposition:
        status: corrected
        change: Added PDF 112 and PDF 70 sources and verbatim quotations of the overlapping sentences.
    - kind: transcription_error
      section_id: section.combat.parry_with_a_weapon
      object_id: procedure.hero_defence
      description:
        'Re-check of finding 6. Every step source_text now quotes printed wording, with "..."
        for elisions: start (ZOC sentence and Power Attack sentence), dodge (Dodging ONCE, Dodge
        Skill Check, and the Aim sentence "An aiming model cannot dodge" from PDF 109),
        dodge_stance, weapon, shield, shield_stance, success, shield_equality,
        shield_equality_supplied, avoid, shield_absorbs, spillover, dodge_fumble, weapon_damage,
        parry_overlap, shield_fumble and shield_fumble_damage (PDF 112), plus the new
        fast_weapon_parry and fast_weapon_damage (PDF 179). The procedure-level source_text quotes
        the ZOC sentence and the summary box. I compared each against the rendered pages and found
        no paraphrase.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 112
          printed_page: 110
          heading: Fumble
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
      disposition:
        status: corrected
        change: Replaced the paraphrased step source_text values with verbatim printed sentences.
    - kind: source_reference_error
      section_id: section.combat.parry_with_a_weapon
      object_id: procedure.hero_defence
      description:
        Re-check of finding 7. The dodge step now cites Aim on PDF 109 and PDF 110 (printed
        107-108), where "An aiming model cannot dodge and becomes easier to hit" runs across the
        page break. The unsourced "unless Fast" qualifier on weapon_damage is gone; weapon_damage
        (95-99, rule_refs character.durability.weapon_parry) and parry_overlap (100) now exclude
        using_fast_parry. A new fast_weapon_parry step, sourced to PDF 179, allows a weapon parry
        with parry_stance false, fast_weapon true and fast_parries_this_turn < 1 ("once per turn
        even though the hero did not choose the Parry Stance"), and fast_weapon_damage applies
        "damaged on 90-00" with rule_refs combat.weapon.special.fast.damage. The open question of
        whether 90-00 also governs a Fast weapon parrying in Parry Stance is recorded as
        issue.combat.fast_parry_in_stance, which states the procedure's reading.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 179
          printed_page: 177
          heading: Weapons
          locator:
            table: table.equipment.weapons
            region: printed special-rule definition
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: Aim
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 110
          printed_page: 108
          heading: Aim
      disposition:
        status: corrected
        change:
          Cited Aim (PDF 109-110) on the dodge step, removed the unsourced Fast qualifier, added the
          PDF 179 Fast parry branch outside Parry Stance with its 90-00 damage step, and recorded
          the in-stance case as issue.combat.fast_parry_in_stance.
    - kind: modelling_error
      section_id: section.combat.activation_of_enemies
      object_id: procedure.enemy_priority
      description:
        Re-check of finding 8. The select step now cites Activation on PDF 107 (printed 105)
        and quotes "Each model may only receive one token and one activation. Once they have all
        acted, put the tokens for those models alive/not knocked out back in the bag (re-shuffle the
        pile of cards) and repeat." verbatim, which supports the candidate_acted, candidate_alive
        and candidate_knocked_out conditions. The adjacent_and_makes_room description now uses the
        printed "could make room for more enemies". The coverage note states the PDF 107 citation.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 118
          printed_page: 116
          heading: Activation of Enemies
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Activation
      disposition:
        status: corrected
        change:
          Sourced the exclusion conditions to Activation (PDF 107) with a verbatim quotation and
          reworded the field description to the printed text.
    - kind: missing_extraction
      section_id: section.combat.detailed_acting_with_enemies
      object_id: combat.enemy_behaviour.humanoid_close_combat.parry_with_two_ap
      description:
        Re-check of finding 9. parry_with_two_ap now has the option 2 italic paragraph as its
        first source (locator "option 2, italic explanation") and quotes it verbatim before the
        footnote. The new source_example fixture
        test.combat.humanoid_behaviour.parry_first_action_two_ap quotes the same paragraph, runs
        adjacent, no room, 2 AP, roll 1, and expects attack_result "Parry Stance*", action
        standard_attack and next_action parry_stance. Its unresolved_references says the roll is
        chosen from the printed 1-2 range because the paragraph names none. The coverage note names
        the fixture.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 119
          printed_page: 117
          heading: Humanoid with Close-Combat Weapon
      disposition:
        status: corrected
        change: Added the italic paragraph as a source and quotation on parry_with_two_ap and a
          source_example fixture quoting it.
    - kind: ok_with_note
      section_id: section.combat.parry_with_a_weapon
      object_id: procedure.hero_defence
      description:
        The success step applies the PDF 120 "roll 95-00 you not only fail" threshold to every
        weapon parry, including the Fast parry outside Parry Stance. A Fast parry rolling 90-94 at
        or under CS therefore succeeds and damages the weapon. PDF 179 says only "the weapon is
        damaged on 90-00" and is silent on failure, so this is a literal reading of both texts, not
        an added rule. The Fast parry does not use parries_remaining, which fits "may be used to
        parry once per turn" as an allowance outside the stance. The Fast branch is exercised in
        tests/rules/combat-procedures.test.ts and in tests/examples/equipment/batch-three.yaml
        fixtures (supporting evidence only).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Parry with a Weapon
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 179
          printed_page: 177
          heading: Weapons
          locator:
            table: table.equipment.weapons
            region: printed special-rule definition
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.detailed_acting_with_enemies
      object_id: procedure.humanoid_close_combat_behaviour
      description:
        issue.combat.humanoid_wounded_parry_two_ap (raised in review .1) lists the procedure
        and parry_with_two_ap as related, and the power_attack_wounded substep still goes straight
        to parry_stance. The doubt is recorded, so this needs no change. The procedure's own issues
        list names only issue.combat.humanoid_behaviour_text, and the extraction side may add the
        back-link. In parry_with_two_ap, attack_result is declared role output but read in the when.
        It is the output of the option 2 lookup that this exception follows, so the role choice is a
        modelling convention, not an error against the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 119
          printed_page: 117
          heading: Humanoid with Close-Combat Weapon
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.acting_with_enemies
      object_id: combat.enemy.activation_order
      description:
        Independent re-check of the unchanged objects against freshly rendered PDF 118-120.
        Acting with Enemies, the six-item Activation order, all Basic Rules bullets (facing, missile
        facing, pit, Large/X-Large pits, prone, lost weapon), Enemies and doors (1 AP, Lower Undead
