      section_id: section.quest_book_i.lair_of_the_spider_queen.level_2_the_basement
      object_id: issue.quest.kraghul_antidote_strength
      description: 'New unresolved issue related to equipment.quest.kraghul_antidotes.
        Quotes verified: PDF 240 (printed 238) Aftermath prints "two potions, clearly
        marked Antidote" and "the potions may be used without rolling for
        identifications", with no strength; PDF 80 (printed 78) Potion of Cure Poison
        (Antidote) prints "A Weak potion has a 75% chance of success, a Standard and
        Supreme has a 100% chance. The Supreme potion will also heal 1d3 HP."; PDF
        181 (printed 179) Alchemy table lists Potion of Cure Poison (125 c) and
        Potion of Cure Poison (Weak) (90 c, 75% chance) separately. The doubt is
        genuine: the book does not say which strength Kraghul''s Antidotes are. All
        four related ids resolve, page labels match pages.yaml, and the equipment
        record assigns no strength, success chance or healing value.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
