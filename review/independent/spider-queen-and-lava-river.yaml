      section_id: section.quest_book_i.lair_of_the_spider_queen.level_3_the_tomb_of_the_spider_queen
      object_id: issue.quest.spider_queen_cobweb_mapping
      description: 'Changed since review .4: only the glued words in the summary are
        fixed ("page 101", "PDF 103", "placement, clearing"); type, related ids,
        sources, status and resolution are unchanged. PDF 241 (printed 239), Level
        3 Special Rules, second bullet, prints "All doors are considered cobweb
        covered openings. See the rules on page 101.", and PDF 103 (printed 101)
        carries the Cobweb Covered Openings heading (placed and block movement like
        a door; 2 AP attack with weapon or torch, auto success; Threat +1 and 1d10,
        9-10 places 1d2 Giant Spiders). Page labels match pages.yaml; the summary
        does not misstate the book.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 241
          printed_page: 239
          heading: Special Rules
          locator:
