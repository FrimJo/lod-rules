  findings:
    - kind: modelling_error
      section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
      object_id: core.quest.stop_heretics.full_reward
      description: >-
        PDF 245 Aftermath prints the reward condition as "If the heroes manage to kill the
        Spellcaster before he opens the portal, they get the reward as promised." The rule's
        `when` also requires `all_objective_creatures_defeated`, which belongs to the separate
        alternative-exit sentence ("Once all creatures in the Objective Room are defeated, the
        heroes find an alternative exit and may leave the dungeon immediately"). The page never
        makes the reward depend on defeating every creature, so the typed condition adds a
        qualifier the book does not print.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 245
          printed_page: 243
          heading: Aftermath
          locator:
            paragraph: 'Quest 1: Stop the Heretics, Aftermath'
      disposition:
        status: open
        proposed_correction: >-
          Drop the all_objective_creatures_defeated condition (and field) from
          core.quest.stop_heretics.full_reward so the rule fires on caster_killed_before_portal
          = true alone; keep the alternative exit in core.quest.stop_heretics.exit.
    - kind: modelling_error
      section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
      object_id: core.quest.stop_heretics.half_reward
      description: >-
        Same as full_reward: "If they fail, they only get half as the portal is still open and
        more demons can pour through." (PDF 245) depends only on failing to kill the Spellcaster
        before he opens the portal. The rule additionally requires
        all_objective_creatures_defeated, which the page does not attach to the reward.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 245
          printed_page: 243
          heading: Aftermath
          locator:
            paragraph: 'Quest 1: Stop the Heretics, Aftermath'
      disposition:
        status: open
        proposed_correction: >-
          Drop the all_objective_creatures_defeated condition (and field) from
          core.quest.stop_heretics.half_reward so it fires on caster_killed_before_portal =
          false alone; also fix its reward_per_hero description "Half250c,125c per hero." to
          "Half of 250 c: 125 c per hero."
    - kind: transcription_error
      section_id: section.quest_book_i.the_lava_river
      description: >-
        Several corpus-authored names, labels and field descriptions in this unit have lost
        their spaces and garble printed terms and amounts. They are not book text but are what
        consumers read. Rule name "Preventing a Disaster — Scenario1–2 tremor"
        (core.quest.preventing_disaster.tremor_event; the page prints "Scenario die ends up
        1-2"); descriptions "SuppliedScenario result." (tremor_event and
        procedure.preventing_disaster_tremors), "Advertised300c per hero."
        (core.quest.preventing_disaster.incantation_success), "+1luck nextquest, no
        currentquest mutation." (core.quest.preventing_disaster.failure_reward), "HeroDEX." and
        "SuppliedDEXtest result." (core.quest.master_alchemist.filled, .burned, .dropped and
        procedure.master_alchemist_vial_filling), "Two actions, not silently converted intoAP."
        (core.quest.master_alchemist.filling_attempt and procedure.master_alchemist_vial_filling),
        "Half250c,125c per hero." (core.quest.stop_heretics.half_reward), dependency label
        "Level3: The Tomb of the Spider Queen" (core.quest.spider_queen_basement.objective) and
        "Cobweb Covered Openings, page101" (core.quest.spider_queen_tomb.doors).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 246
          printed_page: 244
          heading: Special Rules
          locator:
            paragraph: 'Quest 2: The Master Alchemist, The Objective Room, Special Rules'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 247
          printed_page: 245
          heading: Special Rules
          locator:
            paragraph: 'Quest 3: Preventing a Disaster, The Objective Room, Special Rules'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 241
          printed_page: 239
          heading: Special Rules
          locator:
            paragraph: 'Level 3: The Tomb of the Spider Queen, second bullet'
      disposition:
        status: open
        proposed_correction: >-
          Restore the spaces: "Scenario 1–2 tremor", "Supplied Scenario result.", "Advertised 300 c
          per hero.", "+1 luck on the next quest, no current-quest mutation.", "Hero DEX.",
          "Supplied DEX Test result.", "not silently converted into AP.", "Half of 250 c: 125 c per
          hero.", "Level 3: The Tomb of the Spider Queen", "Cobweb Covered Openings, page 101".
    - kind: uncertainty_not_recorded
      section_id: section.quest_book_i.lair_of_the_spider_queen.level_1_the_entrance
      object_id: core.quest.spider_queen_entrance.amburr
      description: >-
        PDF 238 The Secondary Objective says Amburr "wields a sinister-looking club adorned
        with rusty nails"; the Setup says he "is a standard Ettin armed with a filthy
        Warhammer" whose wounds may cause disease. The rule follows the Setup, but the
        conflict was not recorded.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 238
          printed_page: 236
          heading: The Secondary Objective
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.amburr_weapon_conflict
    - kind: ok_with_note
      section_id: section.quest_book_i.lair_of_the_spider_queen.level_3_the_tomb_of_the_spider_queen
      object_id: core.quest.spider_queen_tomb.belua
      description: >-
        Changelog 2.21 entry 195 (rendered changelog PDF 27) reads "Page 239 Changed Belua to
        Terror 10." and is marked Fixed. PDF 241 prints "Causes Terror 5, Poison, Large (not
        wall-climbing)". The table footnote and every quotation keep "Terror 5", the rule cites
        both the page and row 195 and sets terror 10, and issue.quest.belua_terror records the
        ruling. All nine Belua cells (55, 0, 1d10+3 typed as dice, 3, 45, -10, 55, 6, 85) and
        "XP 1100, Part" match the enlarged page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 241
          printed_page: 239
          heading: Belua
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 27
          printed_page: null
          heading: '2.21'
          locator:
            row: 195
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics.table
      object_id: table.quest.stop_heretics.threat
      description: >-
        The Min Threat Level cell prints "Same as start lvl"; it is kept verbatim as text and the
        Start cell 1d4 is typed as dice. Every Threat table in the unit (4/4/18, 4/4/18, 6/6/20,
        1d4/Same as start lvl/18, 5/3/18, 6/5/20), both Dungeon dwellers tables, the Demon table
        (1-2, 3-5, 6 with quantities, equipment and Armour) and the Kraghul grid (60, 0, 4, 3, 40,
        -5, 55, 6, 50; XP 450, T4) match the rendered pages.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 244
          printed_page: 242
          heading: 'Quest 1: Stop the Heretics'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.lair_of_the_spider_queen
      description: >-
        PDF 243 (printed 241) lies between the two chapters but belongs to Random Quests
        (pages.yaml), so it is outside this unit and was not inspected. The Kraghul grid node is
        section.quest_book_i.lair_of_the_spider_queen.table although its parent is Level 2: The
        Basement; the id is odd but stable and resolves, so no rename is proposed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 240
          printed_page: 238
          heading: Kraghul the Mighty
      disposition:
        status: no_change_needed
