    - kind: uncertainty_not_recorded
      section_id: section.quest_book_i.lair_of_the_spider_queen.level_1_the_entrance
      object_id: core.quest.spider_queen_entrance.amburr
      description: 'Re-check of finding 4. PDF 238 still shows the conflict: The
