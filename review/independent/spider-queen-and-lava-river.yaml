  findings:
    - kind: modelling_error
      section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
      object_id: core.quest.stop_heretics.full_reward
      description: 'Re-check of review.spider_queen_and_lava_river.1 finding 1. PDF
        245 Aftermath prints "If the heroes manage to kill the Spellcaster
        before he opens the portal, they get the reward as promised." The
        rule''s when is now caster_killed_before_portal = true alone; the
        all_objective_creatures_defeated field and condition are gone and the
        alternative exit stays in core.quest.stop_heretics.exit. Reward 250
        matches "Reward: 250 c per hero." on PDF 244.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 245
          printed_page: 243
          heading: Aftermath
          locator:
            paragraph: 'Quest 1: Stop the Heretics, Aftermath'
      disposition:
        status: corrected
        change: Dropped the unprinted all_objective_creatures_defeated condition and
          field from core.quest.stop_heretics.full_reward; the rule fires on
          caster_killed_before_portal = true alone, as PDF 245 prints.
    - kind: modelling_error
      section_id: section.quest_book_i.the_lava_river.quest_1_stop_the_heretics
      object_id: core.quest.stop_heretics.half_reward
      description: 'Re-check of finding 2. PDF 245 prints "If they fail, they only
        get half as the portal is still open and more demons can pour through."
        The rule''s when is now caster_killed_before_portal = false alone, and
        reward_per_hero reads "Half of 250 c: 125 c per hero." with value
        125.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 245
          printed_page: 243
          heading: Aftermath
          locator:
            paragraph: 'Quest 1: Stop the Heretics, Aftermath'
      disposition:
        status: corrected
        change: 'Dropped the all_objective_creatures_defeated condition and field from
          core.quest.stop_heretics.half_reward (fires on
          caster_killed_before_portal = false) and fixed its reward_per_hero
          description to "Half of 250 c: 125 c per hero."'
    - kind: transcription_error
      section_id: section.quest_book_i.the_lava_river
      description: 'Re-check of finding 3. The garbled corpus-authored strings are
