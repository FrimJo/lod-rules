    Secondary Objective, Setup, Aftermath), every table cell and both statistics grids match the
    corpus; quest-local mechanics stay scenario_rule with quest scope; no Bestiary values are
    invented; the Belua Terror 10 ruling is applied as policy requires. The record fails on two
    Stop the Heretics reward rules that add an unprinted all-creatures-defeated condition and on
    garbled corpus-authored names and descriptions. One new issue records the Amburr club versus
    Warhammer conflict.
