      description:
        Re-review of review.appendix_iv_spells.1 finding 1. The Level 3 Magic row Healing (rendered
        PDF 189, printed 187) still reads "The target regains 1d/+2 Hit Points." in the table cell,
        the entity and the rule source_text, as printed. Changelog 2.21 entry 187 (rendered changelog
        PDF 26) reads "Page 187 Healing changed into 1d8+2.", marked Fixed. core.spell.healing now
        cites that entry (heading 2.21, locator.row 187), types healing_roll as 1d8 (1-8), sets
        hp_regained to healing_roll + 2 and healing_dice to 1d8+2, keeps printed_healing as "1d/+2",
        and has the recovery_bounds dependency. issue.spell.healing is resolved with that citation
        and its summary now says the print is legible but gives no die size. The level_3 coverage
        note and review/designer-published-rulings.md (#187, applied) agree.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Level 3 Magic
          locator:
            table: Level 3 Magic
            row: Healing
            column: Description and Effect
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 187
      disposition:
        status: corrected
        change:
          core.spell.healing applies changelog 2.21 entry 187 (1d8 healing_roll, hp_regained = roll
          + 2, healing_dice 1d8+2) with printed text kept verbatim; issue.spell.healing resolved
          citing entry 187 and its summary corrected.
