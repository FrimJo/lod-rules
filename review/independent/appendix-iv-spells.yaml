    - kind: modelling_error
      section_id: section.appendix_iv_spells.level_5
      object_id: core.spell.time_freeze
      description:
        The Time Freeze row (rendered PDF 191, printed 189) prints "This spell may only be cast
        once during a battle." The guard field cast_before_this_battle, described as "cast before
        this battle", reads as a cast in an earlier battle. As written, a cast in a previous battle
        would block it, and a second cast in the same battle has no stated guard.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 191
          printed_page: 189
          heading: Level 5 Magic
          locator:
            table: Level 5 Magic
            row: Time Freeze
            column: Description and Effect
      disposition:
        status: open
        proposed_correction:
          Rename or redescribe the input as "Time Freeze has already been cast during
          this battle" (for example already_cast_this_battle). Keep the require that it is false.
    - kind: modelling_error
      section_id: section.appendix_iv_spells.level_3
      object_id: core.spell.vampiric_touch
      description:
        The Vampiric Touch row (rendered PDF 189, printed 187) reads "the caster may heal by
        the same amount of HP up to their maximum Hit Points". The output healed_hp, described as
        "healed hp", is computed as min(maximum_hp, hp + damage_roll + 2). That is the caster's HP
        total after healing, not the amount healed. A consumer reading the description would add it
        to HP a second time.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Level 3 Magic
          locator:
            table: Level 3 Magic
            row: Vampiric Touch
            column: Description and Effect
      disposition:
        status: open
        proposed_correction:
          Describe healed_hp as "the caster's Hit Points after healing, capped at maximum
          Hit Points". Or rename it caster_hp_after_healing, and optionally add a separate amount
          output equal to damage_roll + 2.
