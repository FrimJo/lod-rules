          Remove the commentary from unresolved_references on spell.summon_lesser_demon,
          spell.summon_water_elemental, spell.summon_wind_elemental, spell.summon_demon,
          spell.summon_earth_elemental, spell.summon_fire_elemental, spell.summon_souls,
