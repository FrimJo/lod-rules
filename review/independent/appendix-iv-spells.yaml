  findings:
    - kind: modelling_error
      section_id: section.appendix_iv_spells.level_3
      object_id: core.spell.healing
      description:
        'Changelog 2.21 entry 187 (rendered changelog PDF page 26) reads "Page 187 Healing
        changed into 1d8+2." and is marked Fixed. It states the new value, so under the Official
        rulings policy it settles the printed "1d/+2" in the Level 3 Magic row Healing (rendered PDF
        189, printed 187, where the cell clearly reads "The target regains 1d/+2 Hit Points"). The
        corpus ignores the ruling. core.spell.healing only sets printed_healing to the literal
        "1d/+2" with no typed roll. issue.spell.healing stays unresolved and says the die size is
        "not legible", which is wrong: the print is legible, the die size is simply missing. The
        ruling is also absent from review/designer-published-rulings.md. The level_3 coverage note
        repeats that the issue is unresolved. The table cell and entity source_text are verbatim and
        must stay as printed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Level 3 Magic
          locator:
            table: Level 3 Magic
            row: Healing
            column: Description and Effect
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 187
      disposition:
        status: open
        proposed_correction:
          'Keep the table cell and source_text verbatim. In core.spell.healing add the
          changelog reference (vonbraus.changelog_2_2x, pdf_page 26, heading 2.21, locator.row 187)
          and type the healing: add a healing_roll input (integer, 1-8, dice count 1 sides 8), set
          hp_regained = sum of healing_roll and 2, and set healing_dice to 1d8+2. Keep
          printed_healing as the printed text. Add a recovery_bounds dependency as on Light Healing.
          Resolve issue.spell.healing with a resolution citing entry 187, and correct its summary
          ("not legible" becomes "prints no die size"). Add the ruling to
          review/designer-published-rulings.md and update the section.appendix_iv_spells.level_3
          coverage note.'
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iv_spells.level_4
      object_id: core.spell.ice_tomb
      description:
        'The Ice Tomb row (rendered PDF 190, printed 188) prints "The caster may roll Caster
        Level d10 to determine how strong the tomb is". In core.spell.ice_tomb, tomb_strength_roll
        is an untyped number: no integer flag, no minimum, no dice, and no linked issue. Only
        strength_dice holds the literal "Caster Level d10". The dice schema needs a fixed count,
        so this die cannot be typed, but nothing records that. The level_4 coverage note also says
        the dice in Description cells are typed on the rule''s roll fields, which is not true here.
        The book also never says how the tomb''s strength and the target''s once-per-turn maximum
        damage interact. That gap is now recorded as issue.spell.ice_tomb_strength. Ice Tomb has no
        issue for its dice. The only Ice Tomb issue is issue.spell.ice_tomb_cv_mana.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Level 4 Magic
          locator:
            table: Level 4 Magic
            row: Ice Tomb
            column: Description and Effect
      disposition:
        status: open
        proposed_correction: 'Add issues [issue.spell.ice_tomb_strength] to core.spell.ice_tomb and
          spell.ice_tomb. Give tomb_strength_roll integer: true and minimum: 1, and describe it as
          the sum of Caster Level d10, with a die count that depends on the caster and so cannot be
          typed. Amend the section.appendix_iv_spells.level_4 coverage note to name Ice Tomb as an
          untyped variable-count die tied to that issue.'
    - kind: ok_with_note
      section_id: section.appendix_iv_spells.level_4
      object_id: issue.spell.ice_tomb_strength
      description:
        New issue. The Ice Tomb text does not define the tomb's strength as a pool. It does not
        say how or when the target's "maximum damage (incl weapon) once per turn" reduces it,
        whether armour or NA applies, or that "Caster Level d10" means summing that many d10.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Level 4 Magic
          locator:
            table: Level 4 Magic
            row: Ice Tomb
            column: Description and Effect
      disposition:
        status: recorded_as_issue
        issue_id: issue.spell.ice_tomb_strength
    - kind: ok_with_note
      section_id: section.appendix_iv_spells.level_4
      object_id: core.spell.ice_tomb.casting_cost
      description: 'Changelog 2.21 entry 188 (rendered changelog PDF page 27): "Page 188 Ice Tomb,
        exchanged Mana and CV to match the card.", marked Fixed. It states the change, so it settles
        the issue. table.spells.level_4 row_5 keeps the printed CV 20 and Mana 25 (verified on PDF
        190). core.spell.ice_tomb.casting_cost quotes the row verbatim ("Ice Tomb | 20 | 25"), cites
        both the rulebook row and changelog row 188 (heading 2.21, which precedes the 2.22 heading
        on changelog page 28), and applies CV 25 and Mana 20. issue.spell.ice_tomb_cv_mana is
        resolved with that citation. This matches the Official rulings policy.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Level 4 Magic
          locator:
