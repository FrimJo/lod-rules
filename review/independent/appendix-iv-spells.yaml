        The book has no chapter or section called Crafting; the section map has none. The nearest
        match is Enchantments. The pointer is neither bound in see_also nor kept in
        unresolved_references on spell.enchant_item or section.appendix_iv_spells.level_3. The
        rule's related_rule dependency on character.magic_item.enchant.success silently binds it.
      source:
        - document: rulebook.second_printing.eng
