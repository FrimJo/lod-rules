          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          issue.psychology.hungry_morale_penalty: stop describing changelog 2.21 entry 148 as
          later-edition evidence; it is a stated 2.21 changelog ruling on the same row. Either
          (a) set status unresolved, keep entry 124 and add 148 as partial rulings in source and
          summary (both settle -4 for a four-hero party; flat -4 versus -1 per character is
          unsettled for other party sizes and for mercenaries), and have
          character.morale.event.hungry return the issue for party sizes other than four while
          keeping -4 for four; or (b) keep it resolved but state in the resolution an explicit,
          source-grounded reason why entry 124 prevails over entry 148, and update the
          "Changelog #124" row of review/designer-published-rulings.md to match. In either case
          keep the printed -2 as source_text and the QRS 2.5 row as evidence only.
    - kind: ok_with_note
