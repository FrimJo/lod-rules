    - kind: uncertainty_not_recorded
      section_id: section.psychology.party_morale
      object_id: issue.psychology.hungry_morale_penalty
      description: >-
        The application of entry 124 is mechanically faithful to that entry, but the issue's
        resolution chooses between two conflicting statements in the same official_errata table
        without recording the conflict. Rendered changelog page 21: entry 124 quotes "Page 112
        (Rations and resting) They go hungry and temporarily lose half their Constitution (RDD).
        [...] Party Morale is also lowered by 4. Page 53 (table) Party is hungry / -2", status
        Fixed, comment "Minus 4 is correct". Rendered changelog page 23: entry 148, in the same
        2.21 table (page 1 carries the only "2.21" heading over entries numbered 1 onward, and
        entries run unbroken to 202 before the 2.22 heading), reads "Changed in table 'A character
        is hungry' 'Lack of food is always bad for motivation and is cumulative' '-1/char.'
        (Having more party members, like more mercenaries, adds more negativity in the party)",
        status Fixed. It directly follows entry 147, "Page 56 Changed in table 'A hero dies' into
        'A character dies'", which locates the table on printed page 56 exactly as in this
        second printing (entry 124 instead uses another edition's page 53). Entry 148 states its
        rule, so under docs/extraction-guide.md "Official rulings" it is a changelog ruling, not
        official_reference material; the guide reserves "later edition, evidence only" for the
        2.5 QRS. The corpus applies other 2.21 "Changed ..." entries that state a rule (144
        Heirloom shortsword, 160 Change Facing). Entries 124 and 148 agree for a party of four
        (-4) but give different effects for any other party size, including parties with
        mercenaries that 148 names, so the flat -4 of character.morale.event.hungry is not
        settled for those parties. The QRS 2.5 Party Morale panel (rendered page 2, "A Party
        member is hungry (per member) -2") is correctly cited as evidence only, and it too is
        per member. Precedent issue.psychology.hero_dies_morale_penalty (entry 36) had no
        competing entry, so it does not decide this case. character.morale.event.hungry is on
        the frozen list; this is reported per the brief.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
