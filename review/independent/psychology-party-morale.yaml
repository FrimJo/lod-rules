    bookkeeping findings (glossary disposition versus term.dungeon_departure, that term's
    heading, and issue.phase4.morale_threshold's empty related list) and records one new
    unresolved issue for changelog 2.21 entry 36 (A hero dies -6 versus "QRS is correct" -5).
    Not inspected: the secondary source on PDF 33 (Final Touches copy of the calculation).
