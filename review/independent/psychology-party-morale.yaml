      description: >-
        The resolved issue's summary ends with an unsettled question in prose: whether entry
        148's "cumulative" overrides PDF 127's "This is not cumulative, so it does not matter
        how many days you go hungry". Under docs/extraction-guide.md "Official rulings" a part
        a ruling does not settle must stay unresolved, and a question parked in a resolved
        issue is easy to miss. The gap is also wider than days: entry 148 changes only the page
        56 table row and states no duration, while PDF 127's -4 ("lasts until they eat again",
        not cumulative) still drives procedure.travel_food_and_rest step hunger_morale; with
        entry 124 superseded, nothing says whether the travel -4 and the -1 per character both
        apply to one hunger, or which replaces which. These differ for any party not of four. I
