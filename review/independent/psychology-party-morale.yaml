        The choice of entry 148 over entry 124 is the user's decision and is not reviewed here;
        I checked only that the application is faithful to entry 148 and to the Official rulings
        convention. Rendered changelog page 23, entry 148 (2.21 table; page 1 carries the only
        2.21 heading), reads "Changed in table 'A character is hungry' 'Lack of food is always
        bad for motivation and is cumulative' '-1/char.' (Having more party members, like more
        mercenaries, adds more negativity in the party)", status Fixed. The rule keeps the
        printed row verbatim as source_text ("Party is hungry / Lack of food is always bad for
        motivation / -2", no full stop after "motivation", as on PDF 58); cites both the
        rulebook row and vonbraus.changelog_2_2x PDF 23, heading '2.21', locator row 148;
        replaces the occurrences input with hungry_characters (integer, minimum 1, described as
        including mercenaries, per the entry's note); and adds -1 times that count to morale.
        That is entry 148's "-1/char." with "cumulative" read across characters, which is the
        reading the entry's own note supports. The rule lists
        issue.psychology.hungry_morale_penalty. Fixtures test.character.morale.event.hungry.once
        (3 characters, 10 -> 7) and .single_character (1 character, 10 -> 9) compute correctly
        and cite the same two sources; the id ".once" now names a three-character case, which
        is harmless because ids stay stable.
