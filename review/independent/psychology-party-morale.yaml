    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:9bc142f80b6090ee261559087621112b8a061d419d06d1874b21c66ba68f2485

  findings:
    - kind: ok_with_note
      section_id: section.psychology.party_morale
      description: >-
        Verbatim check passed. The five prose blocks (Party Morale, Calculating Party Morale,
        Adjusting the Morale, Reaching Half Morale (RDD), Reaching 0 Morale, Resetting the
        Morale) and all fifteen Situation / Description / Effect rows match the rendered page
        word for word, including the ellipsis in "real…we", the full stop after "diseased." and
        the missing full stop after "motivation"; the effect column reads -6, -4, -2, -2, -2, -1,
        -1, -1, -1, -1, +1, +1, +2, +3, +3 in the printed order, and every rule and table cell
        carries the matching value. Headings in source references use the printed run-in
        headings. The fixture test.character.morale.event.poison_or_disease.two_heroes matches
        the printed example sentence; the "between 8 to 12" sentence is descriptive and
        correctly has no fixture. Tables, examples, procedures and entities dispositions are
        consistent with the page; the page prints no multi-step sequence, so procedures
        not_applicable is justified.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Party Morale
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.psychology.party_morale
      object_id: character.morale.event.hero_dies
      description: >-
        The extraction applied changelog 2.21 entry 39 to the short-rest row but did not record
        entry 36 on the same changelog page, which quotes the printed cell "A Hero dies -> Effect
        -6", asks whether the Quick Reference Sheet value -5 is right, and answers "QRS is
        correct" (marked Fixed). The second printing still prints -6 and the corpus encodes -6
        with no issue. A published designer ruling that may change an executable effect must
        be recorded; whether effects should follow it is for the extraction side to decide.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Adjusting the Morale
          locator:
            table: Uncaptioned Party Morale adjustment table
            row: A hero dies
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 4
          printed_page: null
          heading: '2.21'
          locator:
            row: 36
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: recorded_as_issue
        issue_id: issue.psychology.hero_dies_morale_penalty
    - kind: coverage_error
      section_id: section.psychology.party_morale
      object_id: term.dungeon_departure
      description: >-
        The coverage row sets glossary to not_applicable and its note says the only headword is
        term.party_morale (Abbreviations and Terminology), yet term.dungeon_departure (kind
        temporal_scope, definition "PM is reset as soon as the party leaves the dungeon.") has
        section_id section.psychology.party_morale. It is the only term in the corpus bound to a
        section whose glossary component is not_applicable, so the disposition and the extracted
        objects disagree.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Resetting the Morale
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Either set the section's glossary component to extracted and name term.dungeon_departure
          in the coverage note, or re-home the term; the row and the term must agree.
    - kind: source_reference_error
      section_id: section.psychology.party_morale
      object_id: term.dungeon_departure
      description: >-
        The term's source heading is "Party Morale" with visually_verified false, but the quoted
        sentence is printed under the run-in heading "Resetting the Morale" (right column, below
        the table). Every rule from the same passage cites that run-in heading.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Resetting the Morale
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Set heading to "Resetting the Morale" on term.dungeon_departure's source reference
          (and visually_verified true once the extraction side has rendered the page).
    - kind: modelling_error
      section_id: section.psychology.party_morale
      object_id: character.morale.threshold_uncertain
      description: >-
        issue.phase4.morale_threshold has related [] although character.morale.wavering,
        .recovered, .threshold_uncertain and .outside_bounds list it under issues and the latter
        two return it as an unresolved effect. Because the review digest only follows issue ->
        related links, this issue is absent from the examined objects and a later change to it
        would not make this record stale, which defeats the staleness check for the four rules
        whose behaviour depends on it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Reaching Half Morale (RDD); Reaching 0 Morale
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Add character.morale.wavering, character.morale.recovered,
          character.morale.threshold_uncertain and character.morale.outside_bounds (and
          test.character.morale.threshold_uncertain.equal, test.character.morale.outside_bounds.negative)
          to issue.phase4.morale_threshold.related so the issue enters the digest.
    - kind: ok_with_note
      section_id: section.psychology.party_morale
      object_id: character.morale.event.short_rest
      description: >-
        The printed cell is +1 and stays verbatim in source_text and in the table; the effect
        min(starting_morale, morale + 2) follows changelog 2.21 entry 39 ("+2 is correct") and the
        Rest page, where the prose says "Party Morale is increased by +2." and checklist item 6
        says "Increase Party Morale by +2 (up to start value)." Both were verified on the rendered
        pages; the modelling matches the cited ruling.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 98
          pdf_page: 100
          heading: Rest; Checklist when Resting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 4
          printed_page: null
          heading: '2.21'
          locator:
            row: 39
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.party_morale
      object_id: character.morale.flee
      description: >-
        The book sends the party "straight to 'Travel Events' for the travel home", but no heading
        of that name exists; the phrase occurs only on this page (text dump of the whole book) and
        the Travelling and Skirmishes chapter prints the heading "Events" (PDF 127, the daily 1d12
        event roll). Binding see_also and the travel_home dependency to
        section.travelling_and_skirmishes.events is the closest printed target and the label keeps
        the book's wording. Also noted: flee fires only at morale exactly 0 and routes negative
        values to character.morale.outside_bounds, which returns issue.phase4.morale_threshold
        (below-zero morale) as unresolved, so a single large drop past 0 is reported rather than
        silently settled.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Reaching 0 Morale
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 125
          pdf_page: 127
          heading: Events
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.party_morale
      object_id: character.morale.wavering
      description: >-
        "Below half" is modelled as morale < floor(starting_morale / 2); the page does not say
        half of what, but the heading "Reaching Half Morale (RDD)" and "the morale is raised above
        this threshold" imply a fixed threshold derived from the computed starting value, and the
        exactly-half case is routed to issue.phase4.morale_threshold. character.morale.adjustment
        is the one rule with scope dungeon (the page says "what happens in the dungeon"); the
        travelling chapter lowers PM by 4 for hunger on the road (PDF 127), a different rule in
        a different context, not a conflict with the -2 "Party is hungry" dungeon row.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Reaching Half Morale (RDD)
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
  outcome: failed
  summary: >-
    Party Morale (PDF 58, printed 56) is transcribed verbatim and every table value, fixture
    expectation and heading matches the rendered page; the short-rest ruling and the Travel
