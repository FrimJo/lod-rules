  outcome: failed
  summary: 'Re-review of the Magic chapter (PDF 64-69, printed 62-67; PDF 69 no folio) after the
    corrections to review.magic.1. Both prior open findings are verified on the page and marked
    corrected: core.magic.perfect.decline charges the listed Mana when a perfect caster declines
    the gain (PDF 66 "may instead", PDF 68 "Subtract mana cost for spell from mana pool"), and
    step enemy_dispel is gated on a successful, non-miscast casting roll as the chart routes it.
    The whole unit was re-compared: all rule source_text, both tables, eight terms, the chart
    boxes and footnotes, the examples, source references and coverage match. One residual
    modelling gap stays open: enemy_dispel is not gated on spell_type, so a Touch spell (which
    the book says cannot be dispelled and which the chart never routes to the dispel box) with an
    enemy caster present would still invoke a dispel. Outcome failed on that single open finding;
    no new issue was needed.'
