    - kind: uncertainty_not_recorded
      section_id: section.magic.hero_spell_casting
      object_id: procedure.hero_spell_casting
      description: The flowchart's decision box reads "Roll above miscast threshold?" with "*Miscast
        Threshold • Base 95", under which a roll of exactly 95 is not a miscast, while Miscast on
        PDF 65 prints "95 or more" / "90 or higher" and the Focus example says "any roll above 85".
        The procedure step `miscast` and core.magic.miscast fire on roll >= miscast_threshold (the
        prose reading) and test.procedure.hero_spell_casting.miscast_ends_turn asserts roll 95
        against threshold 95 is a miscast, but the "above" wording was not tracked by
        issue.magic.flowchart_prose_conflicts. Recorded as a new unresolved issue; no corpus change
        is proposed because the prose reading is defensible and the choice belongs to a ruling.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
