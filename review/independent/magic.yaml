      description: Re-review of the residual open finding of review.magic.2 (step enemy_dispel was not gated on spell type). On PDF 68 the box "Enemy spell caster present and able to dispel?**" hangs only off the "Success? yes!" exit of the Ranged? branch's "Make skill check (AA)"; the Touch? branch runs "Make skill check (AA) applying any modifiers" → "Success? yes!" → "Make skill check (CS+20)" → "Success? yes!" → "Execute effect of spell", and the Incantation? branch runs "Success? yes!" → "Execute effect of spell", so neither reaches the dispel box. Dispelling Magic on PDF 66 prints "Touch spells or Close Combat Spells cannot be dispelled." Step enemy_dispel's `when` is now `all [spell_type == ranged, enemy_caster_present == true, roll <= casting_threshold, roll < miscast_threshold]`, which keeps the two gates verified in review.magic.2 and adds the branch gate. The procedure's unresolved_references records the chart routing and quotes the printed sentence verbatim. The new derived fixture test.procedure.hero_spell_casting.touch_spell_no_dispel (touch, enemy target, CS 45, AA 50, CV 10, roll 30, unwounded, no focus, enemy caster present, not busy, not adjacent) expects miscast threshold 95, touch threshold 65 (CS+20), casting threshold 40, mana_spent 7 and steps without enemy_dispel; I re-derived every value from PDF 64, 65 and 68. The fix is right on the page.
