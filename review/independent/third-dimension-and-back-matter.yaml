      object_id: section.adding_a_third_dimension
      description: >-
        The coverage note ends "The one printed rule for 3D terrain is under Skirmishes (PDF 128:
        "treat squares as inches") ... not in this chapter." That is not true of the book. Game Basics,
        The Tiles (PDF 19, printed 17) also prints a rule about 3D terrain: "However, the game works
        perfectly fine with other tiles or even 3D-terrain. ... The only criteria that must be
        fulfilled is a way to define movement, and to establish the models' relative placement to one
        another." The corpus already holds it as core.tiles.alternative_terrain. The rest of the note
        is correct: PDF 216 prints the heading and three hobby-advice paragraphs, and PDF 216–220 is
        otherwise captioned terrain photographs, with no subheading, term, rule, table, example or
        procedure, so every not_applicable disposition stands. Only the cross-reference sentence
        overstates.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 19
          printed_page: 17
          heading: The Tiles
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 128
          printed_page: 126
          heading: Setup
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 216
          printed_page: 214
          heading: Adding a third dimension
      disposition:
        status: open
        proposed_correction: >-
          In the section.adding_a_third_dimension coverage note, replace "The one printed rule for 3D
          terrain is under Skirmishes (PDF 128: "treat squares as inches"), step
          three_dimensional_terrain of procedure.travel_skirmish_setup, not in this chapter." with
          "Printed rules about 3D terrain are elsewhere: Game Basics, The Tiles (PDF 19, printed 17;
          core.tiles.alternative_terrain) and Skirmishes, Setup (PDF 128, printed 126: "treat squares
          as inches"; step three_dimensional_terrain of procedure.travel_skirmish_setup); none is in
          this chapter." Keep every component not_applicable.
    - kind: ok_with_note
      section_id: section.adding_a_third_dimension
      object_id: section.adding_a_third_dimension
      description: >-
        Read every page, PDF 216–220 (printed 214–218). PDF 216: heading "Adding a third dimension"
        and three paragraphs (standees are light and need no painting; your own tiles and miniatures
        add immersion; YouTube terrain makers such as the RP Archive, 3D printing with Printable
        Scenery files, or premade tiles from Dungeons and Lasers), then a photograph captioned with a
        line of fiction ("Poison?! ... said Otto") and maker credits. PDF 217–220: captioned
        photographs only (pit with planks, 3D elements on tiles, cobwebbed door, room, outdoor
        tiles, bandits on a road, fighting outdoors, village). No height, line-of-sight, movement,
        measurement or placement rule, no table, example, procedure or term. The printed typos
        "straight of the box", "On upside of this" and "cab help" sit in hobby advice and change no
        mechanic; the note paraphrases them, which is acceptable for a not_applicable reason. The
        section row (printed 214–218, PDF 216–220, kind chapter) agrees with pages.yaml.
      source:
        - document: rulebook.second_printing.eng
