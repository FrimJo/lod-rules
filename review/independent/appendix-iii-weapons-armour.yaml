  findings:
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.armour_and_shields.table
      object_id: table.equipment.armour
      description: 'Re-review of the embedded-restriction correction. The Cloak row on PDF 180 reads "Cloak / 1 / 1 / Torso (only back) / Stackable / 50 c / 4", and table.equipment.armour row cloak keeps every cell verbatim, including Covers "Torso (only back)". No rule gives "(only back)" effects. The new unresolved issue issue.equipment.cloak_only_back is now listed in the table''s issues and relates table.equipment.armour and equipment.armour.cloak. Its quotations are accurate. The Stackable note on PDF 180 does say "Cloaks can be worn even if the hero is already using stacked armour". The Hit Area (Only When Hitting Heroes) table on PDF 121 (printed 119) lists only 1 Head, 2 Arms, 3-5 "Torso (check gear)" and 6 Legs. Neither page defines a back or front zone. The issue''s page references (PDF 180/printed 178, PDF 121/printed 119) agree with pages.yaml.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 180
          printed_page: 178
          heading: Armour and Shields
          locator:
            table: Armour
            row: Cloak
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Hit Area (Only When Hitting Heroes)
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: corrected
        change: Added unresolved issue.equipment.cloak_only_back (related table.equipment.armour, equipment.armour.cloak) and listed it under table.equipment.armour issues. The printed Covers cell is unchanged and "(only back)" is given no invented effect.
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.armour_and_shields.table
      object_id: issue.equipment.cloak_only_back
      description: 'The book does have a positional "from behind" concept, but only as an attack modifier: Hero Attacking on PDF 115 (printed 113) lists "Attacking from Behind (also loses its ''To Hit'' value) +20" and "Attacking from the back ... +20". It is not a hit zone, and Hit Area governs only enemies striking heroes. So the issue is right to say the book defines no back hit zone, and one of the readings it lists ("only to strikes from behind") matches that concept. Citing PDF 115 would be useful context, but its absence is not an error.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 115
          printed_page: 113
          heading: Hero Attacking
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.weapons.table
      object_id: table.equipment.weapons
      description: Spot check against a fresh render of PDF 179. All 24 weapon rows match the page in every printed cell (damage, Enc, Class, Special, Cost, Avail., Reload). Typed dice match the printed die, for example Rapier 1d6+1, Arbalest 3d6, Crossbow 1d10+3 and Elven bow 1d10+2. Arrow/Bolt (5) and Net keep their printed dashes. The 23 armour rows with 4 tier bands and the 3 shield rows on PDF 180 also match cell for cell, and so do the Stackable, Clunky and Huge footnotes.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 179
          printed_page: 177
          heading: Weapons
          extraction:
