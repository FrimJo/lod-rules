      description: 'Typed effects agree with the printed key. AP (X) clamps armour at 0; BFO and Slow each add -5 while parrying, so they stack as "cumulative" says; Defensive adds +10 and sets maximum durability to 4; Dual wield +X requires the ability and sets the offhand bonus to X; Ensnare allows one use per battle and traps on a hit, the escape costs 1 action with a DEX Test, and the net is retrieved after battle; Fast allows one out-of-stance parry per turn with damage on 90-00 (scope in issue.combat.fast_parry_in_stance); Reach sets range 2 through a friendly square; Secondary Weapon requires a primary hand weapon, allows adjacent targets, forbids reloading and gives -10 when firing while moving; Stun sets (not adds) one lost action on an even damage roll; Unwieldy zeroes the bonus after the first hit; Stackable requires different tiers and at most two non-cloak layers with a set -10 DEX; Clunky sets -10 DEX; Huge hands sets one hand. The 31 derived fixtures for these sections match. Changelog 2.21 entry 88 (Ensnare: "DEX is the correct answer") agrees with the printed DEX Test.'
