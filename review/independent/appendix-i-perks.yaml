  findings:
    - kind: ok_with_note
      section_id: section.appendix_i_perks.combat_perks
      object_id: character.perk.frenzy.limits
      description:
        'Only object changed since review.appendix_i_perks.3. It gained two source references and a
        dependencies list; source_text, fields, effects and the PDF 169 reference are unchanged. The
        PDF 89 reference (printed 88 per pages.yaml, misprinted folio; heading The Turn; locator
        "Each hero has two Action Points (AP) to spend on actions.") matches the rendered page, second
        paragraph under The Turn, verbatim. The PDF 109 reference (printed 107; heading Different
        Combat Actions; locator "1 AP: - Move. - Open a door. - Standard Attack.") matches the first
        three entries of the 1 AP list on the rendered page. These two pages back the
        hero_action_points (2) and standard_attack_action_point_cost (1) inputs, whose descriptions
        now name core.action_points.spend and combat.action.cost.one instead of page numbers. Both
        targets exist and their text quotes those same passages on PDF 89 and PDF 109; the third
        dependency, character.perk.frenzy.bonus_attack, is the Frenzy row rule that supplies the one
        free Standard Attack per damaging attack ("For each standard attack that damages the enemy,
        the hero may make one more standard attack for free.", PDF 169). The formula still yields the
        printed "maximum of 8 attacks" (2 turns x floor(2/1) x (1+1)). The PDF 89 reference keeps
        extraction.visually_verified false; the rendered page confirms the text, so it could be set
        true, but that is not an error.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 169
          printed_page: 167
          heading: Combat Perks
          locator:
