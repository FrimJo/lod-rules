  findings:
    - kind: ok_with_note
      section_id: section.appendix_i_perks.combat_perks
      object_id: character.perk.frenzy.limits
      description:
        'Changed since review.appendix_i_perks.2. PDF 169 prints the Frenzy comment "Barbarians only.
        Lasts for two turns. That means a maximum of 8 attacks can be done over the two Frenzied
        turns." with the effect "For each standard attack that damages the enemy, the hero may make
        one more standard attack for free." maximum_attacks is now duration_turns x
        floor(hero_action_points / standard_attack_action_point_cost) x (1 + free_standard_attacks).
        The two new inputs match the pages: PDF 89 (printed 88) "Each hero has two Action Points (AP)
        to spend on actions. They may be used in any combination, such as two Standard Attacks", and
        PDF 109 (printed 107) lists "Standard Attack." under 1 AP. With 2 turns, 2 AP, 1 AP per
        attack and 1 free attack the formula gives the printed 8. It counts one free attack per paid
        attack (free attacks do not chain), which is what the printed maximum of 8 requires.
        source_text, duration_turns 2, AP (1) and only_move_or_attack are unchanged and still match
        the row. The field descriptions cite PDF 89 and PDF 109 by physical page, which is correct.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 169
          printed_page: 167
          heading: Combat Perks
          locator:
            table: Combat Perks
            row: Frenzy
        - document: rulebook.second_printing.eng
