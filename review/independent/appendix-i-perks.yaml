          pdf_page: 171
          printed_page: 169
          heading: Arcane Perks
          locator:
            table: Arcane Perks
            row: Inner Power
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_i_perks
      object_id: character.perk.appendix_use
      description:
        'The opening paragraph on PDF 168 is quoted verbatim: "Using these Perks always costs
        1 Point of Energy, but no AP unless noted otherwise. Perks can only be used one at a time
        (one Perk per Action)." It is typed as require energy >= 1, require perks_used_this_action
        = 0, Energy -1 and action_point_cost 0. The 40 standard per-perk activation rules repeat the
        same text and effects and cite both the paragraph and their row. Energy to Mana, the only
        Perk whose row notes another Energy cost, overrides the default (see the open finding about
        its duplicate guard). Each entity''s activation_cost (energy 1, action_points 0) matches, and
        Energy to Mana has energy_selection: variable.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: 'Appendix I: Perks'
          locator:
            paragraph: 1
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_i_perks.arcane_perks
      object_id: character.perk.dispel_master.dispel
      description: 'The profession qualifiers in the typed conditions follow the printed wording. A
        require profession is added only where the row names the profession: "the wizard" (Dispel
        Master, Energy to Mana, Inner Power, Quick Focus → wizard), "the alchemist" / "your
        alchemist" (Connoisseur, Pitcher, Precise Mixing, Surgeon → alchemist), "the priest" (Fate
        Forger, My Will Be Done → warrior_priest) and "Barbarians only" (Frenzy → barbarian). There
        is none where the row says "Caster" (In Tune with the Magic), "your hero" (Perfect Healer)
        or names no one (Careful Touch, God’s Favourite, Healer). This agrees with
        table.character.perk_progression, which offers Faith Perks only to the Warrior Priest,
        Arcane only to the Wizard and Alchemist only to the Alchemist. The when/require qualifiers
        for timing ("Use before rolling", "Must be declared before attacking", "Declare before
        harvesting or gathering", fear/terror test kinds, X-Large/Large sizes for Stunning Strike,
        Heater/Tower shield and flyers for Shield Bash) and the In Tune miscast range 95 - 5 x
        (actions - 1) to 100 match the cells.'
