        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_i_perks.combat_perks
      object_id: test.perk.frenzy_example.eight_attacks
      description:
        'New source_example case. Its source_text quotes the Frenzy row verbatim ("For each standard
        attack that damages the enemy, the hero may make one more standard attack for free. ...
        Barbarians only. Lasts for two turns. That means a maximum of 8 attacks can be done over the
        two Frenzied turns."), heading Combat Perks, PDF 169 / printed 167 as in pages.yaml. Inputs
        pin hero_action_points 2 (PDF 89), standard_attack_action_point_cost 1 (PDF 109) and a
        damaging standard attack. Expected maximum_attacks 8 is the printed number, duration_turns 2
        is "Lasts for two turns", armour_penetration 0 to 1 is "all attacks have AP (1)", and
        same_target_required false is "This attack does not have to be at the same target." The
        trace (bonus_attack then limits) is the reasoning the comment applies. The locator names the
        Comment column while the quote also takes its first sentence from the Effect column; the row
        locator still finds the text, so no change is needed.'
      source:
        - document: rulebook.second_printing.eng
