    - kind: ok_with_note
      section_id: section.appendices
      description:
        'PDF 167 is the part divider: the title "Appendices" over full-page art of a stone
        archway with candle-topped pillars and skulls, with no folio and no other text. The coverage
        note describes it accurately. I read the rest of the span (PDF 168-220) on the 2x2 contact
        sheets, where every page heading was legible. Each page belongs to a child: Appendix I
        (168-171), II (172-178), III (179-186), IV (187-192), V (193-213, with full-page art on PDF
        214-215 that pages.yaml assigns to Legendary Items), and Adding a third dimension (216-220).
        The part node therefore has no content of its own. Setting all six components to
        not_applicable matches section.travel_and_settlements and section.dungeoneering_and_combat.
        The children named in the note match the appendix rows.'
