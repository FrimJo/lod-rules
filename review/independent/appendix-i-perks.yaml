  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:68ad5deef6e6dbcbc3faf8c59c51149c97178fa1f5dc6a04f7b752b333f490bc
  findings:
    - kind: modelling_error
      section_id: section.appendix_i_perks.arcane_perks
      object_id: character.perk.energy_to_mana.activation
      description:
        The effects list carries the same require (perks_used_this_action eq 0) twice in a row.
        The rule also cites the Appendix I opening paragraph (PDF 168, paragraph 1) and types its
        "no AP" and "one Perk per Action" parts (action_point_cost 0, the perks_used_this_action
        guard), but its source_text quotes only the Energy to Mana row. Every other activation rule
        quotes the paragraph. The row itself is transcribed correctly ("The wizard has the ability
        to turn energy into Mana. For each Energy Point spent, the wizard gains 20 Mana." / "The
        wizard may spend any number of Energy Points."), and so is the variable Energy cost that
        replaces the default 1 Point ("unless noted otherwise").
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 171
          printed_page: 169
          heading: Arcane Perks
          locator:
            table: Arcane Perks
            row: Energy to Mana
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: 'Appendix I: Perks'
          locator:
            paragraph: 1
      disposition:
        status: open
        proposed_correction:
          'character.perk.energy_to_mana.activation: delete the duplicated require on
          perks_used_this_action, and make source_text quote the opening paragraph ("Using these
          Perks always costs 1 Point of Energy, but no AP unless noted otherwise. Perks can only be
          used one at a time (one Perk per Action).") as well as the row text, joined with " ... ".'
    - kind: modelling_error
      section_id: section.appendix_i_perks.leader_perks
      object_id: character.perk.keep_calm_and_carry_on.morale
      description:
        'Printed: "You may increase Party Morale by +2." / "This may not increase morale above
        starting morale." The effect sets party_morale to min(party_morale + 2, starting_morale). If
        Party Morale is already above starting morale, this lowers it, and the book does not say the
        Perk can lower morale. The cap should only stop the increase.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: Leader Perks
          locator:
            table: Leader Perks
            row: Keep Calm and Carry On!
      disposition:
        status: open
        proposed_correction: 'character.perk.keep_calm_and_carry_on.morale: set party_morale to
          max(party_morale, min(party_morale + 2, starting_morale)), or add a when guard
          party_morale lt starting_morale, so the Perk never lowers morale.'
    - kind: uncertainty_not_recorded
      section_id: section.appendix_i_perks
      object_id: character.perk.appendix_use
      description:
        'Character Basics (PDF 27, printed 25) says "Perks can be used at the cost of energy
        during a hero’s activation." Several Appendix I Perks are used outside the hero''s
        activation: Encouragement and Rally ("May be used outside of ordinary acting order whenever
        a fear or terror test is necessary.", PDF 168), Shield Wall and Quick Dodge ("May be used
        when attacked.", PDF 169-170), Sixth Sense ("when attacked", PDF 170) and Fate Forger
        ("Used as soon as the Scenario die has been rolled.", PDF 168). No issue recorded this
        divergence. character.energy.perk charges Energy only when during_own_activation is true,
        while the appendix activation rules charge it unconditionally. Recorded as a new unresolved
        issue. To avoid disturbing frozen Character Basics evidence, its related list names only
        appendix objects.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 27
          printed_page: 25
          heading: Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: Leader Perks
          locator:
            table: Leader Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 170
          printed_page: 168
          heading: Sneaky Perks
          locator:
            table: Sneaky Perks
            row: Quick Dodge
      disposition:
        status: recorded_as_issue
        issue_id: issue.appendix_i_perks.use_outside_activation
    - kind: ok_with_note
      section_id: section.appendix_i_perks.combat_perks
      object_id: perk.hunters_eye
      description:
        The Hunter’s Eye effect says "two arrows when performing a Ranged Attack with a bow",
        but its comment allows activation "when using a bow or a sling". The existing unresolved
        issue covers this. The bow_attack rule applies only to bows, and the eligibility rule
        accepts either weapon, so the corpus does not invent an effect for slings.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 169
          printed_page: 167
          heading: Combat Perks
          locator:
            table: Combat Perks
            row: Hunter’s Eye
      disposition:
        status: recorded_as_issue
        issue_id: issue.phase5.hunters_eye_sling
    - kind: ok_with_note
      section_id: section.appendix_i_perks
      object_id: table.perk.leader
      description:
        'Checked every cell of the seven perk tables against PDF 168-171, rendered at 2x and 3x
        with crops: Leader 4 rows, Faith 4, Combat 9, Sneaky 7, Common 6, Arcane 5, Alchemist 6. The
        column headers are Perk / Effect / Comment, and there is no cost column. Names, effect and
        comment text, row order and blank comment cells (Call to Action, God’s Favourite, Battle
        Fury, Deadly Strike, Perfect Aim, Hide in the Shadows, Lucky Git, Heroic Force of Will,
        Sixth Sense, Sprint) all match. Printed quirks are kept: "Chose which enemy to taunt", no
        final period on "Lasts until end of next battle" and "Hero gains Natural Armour 2", the
        straight apostrophe in "Your hero''s perfect mixing", "01-10 instead of 01-05" and
        "95-00". Each table node has exactly one table. The .table_2 nodes under Combat and Common
        are compatibility redirects, which is correct: PDF 169 and 170 each print one continuous
        table under that heading.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: Leader Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 169
          printed_page: 167
          heading: Combat Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 170
          printed_page: 168
          heading: Sneaky Perks
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 171
          printed_page: 169
          heading: Arcane Perks
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_i_perks.faith_perks
      object_id: character.perk.gods_favourite.threat
      description:
        The dice printed inside text cells are typed through linked rules. God’s Favourite
        ("Decrease the Threat Level by 1d6."), Powerful Blow ("causing 1d6 extra damage") and Inner
        Power ("causing an extra 1d6 Damage") each use a d6_result input with dice {count 1, sides
        6}, integer 1-6, in character.perk.gods_favourite.threat,
        character.perk.powerful_blow.damage and character.perk.inner_power.missile_damage. The table
        cells keep the printed text verbatim.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 168
          printed_page: 166
          heading: Faith Perks
          locator:
