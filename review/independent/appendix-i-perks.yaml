        list can be found on page 166", and printed 166 is PDF 168, the start of this appendix. The
        profession entries cite "Heroic Force of Will (page 168)", and printed 168 is PDF 170, the
        Common Perks table. The level-one conflict is already handled by the resolved
        issue.character_basics.perks_at_level_one (changelog 2.21 entry 140). The appendix row for
        Heroic Force of Will is verbatim. Apart from the activation-timing divergence recorded
        above, the appendix does not diverge from the Character Basics perk text.
