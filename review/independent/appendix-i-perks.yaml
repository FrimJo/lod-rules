        PDF 169 has a framed italic sidebar, "Metheia, the God of Life", which really does
        print no Perk, cost, roll or effect. It covers her devoted followers, the morning prayer,
        chapels in major cities and priests tending the sick and wounded. Setting all six components
        to not_applicable is correct, and the coverage note justifies it on its own.
      source:
