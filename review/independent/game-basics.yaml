  findings:
    - kind: transcription_error
      section_id: section.game_basics.complexity
      object_id: core.optional.scenario_and_threat
      description:
        'Re-check of review.game_basics.1 finding 1. On PDF 21 the Complexity section has the bullet
        list and a second paragraph. core.optional.scenario_and_threat now quotes that paragraph
        verbatim ("These rules all require an amount of bookkeeping ... wandering monsters and light
        sources will have to be house ruled."), the paraphrase in unresolved_references is gone, and
        the rule now has issues: [issue.game_basics.threat_removal_house_rules]. The coverage row for
        section.game_basics.complexity now says that source_text joins the bullets with semicolons.
        The other four core.optional.* records changed only visually_verified, and their text matches
        the page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Complexity
      disposition:
        status: corrected
        change:
          core.optional.scenario_and_threat source_text now includes the second Complexity paragraph
          verbatim, the paraphrased unresolved_references entry was removed, and issues links
          issue.game_basics.threat_removal_house_rules. The coverage note records the bullet-to-semicolon
          normalisation.
    - kind: transcription_error
      section_id: section.game_basics.line_of_sight_los
      object_id: test.core.los.blocked.diagram_a_to_b
      description:
        'Re-check of review.game_basics.1 finding 2. The three LOS diagram fixtures now quote the
        printed Example caption under the diagram on PDF 21. diagram_a_to_b quotes "Example: A
        character in square A would not have LOS to a character in square B because the LOS passes
        through the black tile border." diagram_a_to_c and diagram_a_to_d quote "A character in D
        could be seen without problem from A, but a character in C would get potential cover as the
        LOS passes through the fountain." The locator names the caption. The expected outcomes
        (blocked, obstructed, clear) agree with the caption and the diagram.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Line of Sight (LOS)
          locator:
            region: LOS diagram caption
      disposition:
        status: corrected
        change: test.core.los.blocked.diagram_a_to_b, test.core.los.obstructed.diagram_a_to_c and
          test.core.los.clear.diagram_a_to_d now quote the printed Example caption verbatim, and the
          locator names the caption.
    - kind: missing_extraction
      section_id: section.game_basics.gameplay_example
      description:
        'Re-check of review.game_basics.1 finding 3. tests/examples/core/gameplay-example.yaml now has
        test.gameplay_example.chest_open_roll (d10 3, d6 6: door_table_result Open, trap_resolution
        invoked, chest reveal reaches the Furniture table), azira_trap_damage (3 damage, NA 0, 9 to 6
        Hit Points via combat.damage.basic and character.hit_points.loss), and chest_furniture_roll
        (Chest roll 1 gives "1 Wonderful Treasure." via character.treasure.furniture.chest).
        door_opened_locked now supplies d10_roll 8 and expects door_table_result Locked. Each
        source_text matches PDF 22 verbatim. On PDF 101 the Door/chest table has 1-6 Open, 7-9 and 0
        Locked, with Difficulty cells "Pick lock: -10, HP 15" for 8. table.dungeon.door_chest_difficulty
        matches that, including 0 typed as 10. On PDF 194 the Chest row reads 1: 1 Wonderful Treasure,
        2-4: 2 Fine Treasures, 5-8: 1 Fine Treasure, 9-10: Nothing, and table.treasure.furniture.chest
        matches. All 14 gameplay_example fixtures pass in tests/rules/pilot.test.ts (supporting
        evidence only). The Door Table HP 15 is still not looked up. The coverage row now states that
        step and its reason, which the prior proposed correction allowed as an alternative. See the
        separate ok_with_note.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Chest
      disposition:
        status: corrected
        change:
          Added test.gameplay_example.chest_open_roll, azira_trap_damage and chest_furniture_roll.
          door_opened_locked now keys the Door Table with d10_roll 8 (Locked). The one step not made a
          fixture (the Difficulty cell HP 15) is named in the coverage row with its reason.
    - kind: coverage_error
      section_id: section.game_basics.gameplay_example
      description: 'Re-check of review.game_basics.1 finding 4. The coverage note for
        section.game_basics.gameplay_example no longer points to an extraction ledger. It now lists
        the fixtures by turn and the steps that are not fixtures, each with a reason: the Door Table
        Difficulty cell, the Trap Table, the trap Sanity loss, the Legendary Items rolls, the
        Wandering Monster movement, random spider placement and target, the not_present Bestiary data,
        and the Fear Tests with the torch. It names the related issue ids, including
        issue.gameplay_example.torch_after_threat_roll and legendary_roll. I checked each listed step
        against PDF 22-24, and the note matches the page.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 24
          printed_page: 22
          heading: Gameplay Example
      disposition:
        status: corrected
        change:
          The coverage note now stands alone. It has no ledger pointer and no blanket claim, and it
          lists the fixtures, the non-fixture steps with their reasons, and the related issue ids.
    - kind: modelling_error
      section_id: section.game_basics.gameplay_example
      object_id: issue.gameplay_example.legendary_roll
      description:
        'Re-check of review.game_basics.1 finding 5. issue.gameplay_example.legendary_roll now lists
        section.game_basics.gameplay_example in related, so it is in this chapter''s digest. Its status
        is still unresolved and its summary matches the pages. On PDF 22 the example says 1d6 3 gives
        the "left column" and 1d12 4 gives the Gauntlets of Hraefnir. On PDF 202 the columns are 1-2,
        3-4 and 5-6, each with 1d10, and row 4 of the 3-4 column is Dagger of Vrunior.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 202
          printed_page: 200
          heading: Legendary Items
      disposition:
        status: corrected
        change: issue.gameplay_example.legendary_roll related now includes
          section.game_basics.gameplay_example. Summary and status are unchanged.
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      object_id: test.gameplay_example.belleck_bashes_door
      description:
        'Door Table HP 15 limitation. On PDF 101 the Difficulty column is one printed text cell per
        row ("Pick lock: -10, HP 15"), with a "-" marker on the Open row. The pick-lock modifier and
        the HP are not separate printed columns. The executable lookup rejects an output column whose
        cell types include marker (scripts/validate/pilot.ts). Even a text lookup would return the
        whole string, not the number 15. So belleck_bashes_door supplies door_hp 15, and the
        section.game_basics.gameplay_example coverage row says so and gives the reason. I judge this
        an acceptable and honestly documented limitation, not an open defect: the value supplied
        matches row 8 on the page, and the Door Table lookup that the example actually relies on
        (d10 8 -> Locked) is exercised. If Into the Dungeon later types the Difficulty cell (for
        example pick-lock modifier and HP as typed sub-values next to the printed text), the fixture
        could look HP up. That belongs to the review of section.into_the_dungeons.opening_a_door_or_chest.table.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      object_id: test.gameplay_example.chest_open_roll
      description:
        'Shared model changes, checked against PDF 101 and PDF 193-194. procedure.open_door_or_chest
        gained d10_roll (integer 1-10, 1d10, with the 0 face read as 10) and an output
        door_table_result. check_locked looks up table.dungeon.door_chest_difficulty with the result
        column as key and returns the Door/chest column. That matches step 2 ("Roll 1d10 and 1d6
        simultaneously ... then check the Door Table to see if it is locked"). `locked` stays a
        supplied input that is not derived from door_table_result. Its description says it holds the
        state after any locked-door resolution, which is reasonable. The fixtures supply values
        consistent with the lookup (3/Open/false, 8/Locked/true). character.treasure.furniture.chest
        gained a 1d10 roll input and looks up table.treasure.furniture.chest into chest_contents. That
        matches PDF 193 ("roll 1d10 to see if there is anything of any value") and the Chest row on
        PDF 194. chest_open_roll expects Threat 9 to 10, following the PDF 101 procedure, whereas the
        example''s later values imply no chest increment. issue.gameplay_example.chest_threat records
        this and says the fixture shows the procedure''s +1. azira_trap_damage routes trap damage
        through combat.damage.basic with armour 0 supplied. The book prints no trap-card damage rule
        (issue.gameplay_example.trap_table is linked), but the example''s own reasoning (NA reduces
        damage, 9 - 3 = 6) is reproduced. chest_furniture_roll supplies search_allowed: true to pass
        the furniture-search gate on a chest that was opened, not searched. That is a harmless input
        assumption.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 193
          printed_page: 191
          heading: Treasure found in Furniture
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.skill_and_stat_checks.success_and_failure
      object_id: core.check.success
      description:
        'Other changed digests. core.check.success gained a second source, PDF 18 (printed 16), "Dice
        Rolling and Skill Checks", with "A result equal to or less than the skill or stat level will
        result in a success." That text is verbatim on the rendered page. core.action_points.allocation
        (PDF 21), core.movement.wall (PDF 20, the continuation of Objects on the Tiles) and
        core.turn.psychology (PDF 20, step 5) changed only visually_verified, and their source_text
        matches the page. issue.gameplay_example.chest_threat and trap_table now relate the new
        fixtures, and their summaries match PDF 22 and PDF 101.
        issue.gameplay_example.torch_after_threat_roll, recorded by the prior review, is still
        unresolved and related to the section. Spot-checked the unchanged terms, rules, procedure.dungeon_turn
        and section rows against PDF 19-21: wording, the 01-05 Perfect Result, 2 AP, 4 characters,
        the Large 4-squares footprint, the 8 adjacent squares and the five turn steps all match.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 18
          printed_page: 16
          heading: Dice Rolling and Skill Checks
