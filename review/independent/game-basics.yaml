  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:dd5ff5a8992a11016666949044f6000e02b3090a7a2823bf909e5c479252c5fb
  findings:
    - kind: transcription_error
      section_id: section.game_basics.complexity
      object_id: core.optional.scenario_and_threat
      description:
        'The Complexity section on PDF 21 has a second paragraph that no record quotes: "These
        rules all require an amount of bookkeeping that some may initially find daunting. Removing
        them will reduce the difficulty of the game slightly, while still creating a heroic
        experience. Removing the Threat level will probably have the biggest impact on game balance
        but it will not break the game, although wandering monsters and light sources will have to
        be house ruled." Instead, core.optional.scenario_and_threat carries a paraphrase in
        unresolved_references ("Wandering monsters and light sources will have to be house ruled if
        Threat level is removed."). That field is for the original wording of an unbound internal
        pointer, and this sentence is not a pointer. The rule also has no `issues` link to
        issue.game_basics.threat_removal_house_rules, although that issue lists the rule as related.
        The five core.optional.* records also flatten the printed bullet list into "Encumbrance;
        Party Morale; ...". That is acceptable, but it should be noted as a normalisation.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Complexity
      disposition:
        status: open
        proposed_correction:
          'core.optional.scenario_and_threat: quote the second Complexity paragraph
          verbatim (in source_text, or as a second quoted passage), remove the paraphrased
          unresolved_references entry, and add issues:
          [issue.game_basics.threat_removal_house_rules].'
    - kind: transcription_error
      section_id: section.game_basics.line_of_sight_los
      object_id: test.core.los.blocked.diagram_a_to_b
      description: 'The three source_example fixtures for the LOS diagram
        (test.core.los.blocked.diagram_a_to_b, test.core.los.obstructed.diagram_a_to_c,
        test.core.los.clear.diagram_a_to_d) quote the rule paragraph as their source_text, not the
        printed example. The example is the caption under the diagram on PDF 21: "Example: A
        character in square A would not have LOS to a character in square B because the LOS passes
        through the black tile border. A character in D could be seen without problem from A, but a
        character in C would get potential cover as the LOS passes through the fountain." The
        expected outcomes (blocked, obstructed by object art, clear) agree with the caption. The
        adjacency diagram fixtures, by contrast, correctly quote their caption.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Line of Sight (LOS)
          locator:
            region: LOS diagram caption
      disposition:
        status: open
        proposed_correction:
          'test.core.los.blocked.diagram_a_to_b, test.core.los.obstructed.diagram_a_to_c,
          test.core.los.clear.diagram_a_to_d: set source_text to the relevant sentence(s) of the
          printed "Example:" caption (A/B black tile border; A/D without problem; A/C potential
          cover through the fountain).'
    - kind: missing_extraction
      section_id: section.game_basics.gameplay_example
      description:
        'Several steps of the Gameplay Example can be checked against extracted rules but have
        no fixture. On PDF 22, Azira''s chest roll ("The d10 ends up a 3, telling her that the chest
        is unlocked, but the d6 shows a 6, meaning that it is trapped") can be checked against
        procedure.open_door_or_chest and table.dungeon.door_chest_difficulty (1-6 Open; d6 6
        trapped, PDF 101). Her trap damage ("3 Points of Damage. She has no Natural Armour ...
        leaving her at 6 Hit Points" of 9) can be checked against combat.damage.basic. Her chest
        roll of 1 giving "a Wonderful Treasure" can be checked against the Chest row of
        table.treasure.furniture. Belleck''s door roll of d10 8 giving "locked, with 15 Hit Points"
        (Door table row 8: Locked, Pick lock -10, HP 15, PDF 101) is not exercised:
        test.gameplay_example.door_opened_locked supplies locked: true, and belleck_bashes_door
        supplies door_hp: 15. The coverage row says "Executable steps are fixtures", but these
        steps have none, and no canonical record says why they were left out.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
      disposition:
        status: open
        proposed_correction:
          "Add source_example fixtures in tests/examples/core/gameplay-example.yaml for:
          the chest open roll (d10 3, d6 6 -> not locked, trapped); Azira's trap damage (3 damage,
          NA 0, 9 -> 6 HP); the chest Furniture roll of 1 (1 Wonderful Treasure); and the Door table
          lookup of d10 8 (Locked, Pick lock -10, HP 15). If a step is deliberately not a fixture,
          state it and the reason in the coverage row itself."
    - kind: coverage_error
      section_id: section.game_basics.gameplay_example
      description: The coverage note for section.game_basics.gameplay_example sends readers to
        docs/ledgers/core-chapter-reconciliation.md for the step-by-step classification. As a
        reviewer I may not read that ledger, so the canonical row cannot be checked on its own. The
        note also says "Executable steps are fixtures", which is not true (see the
        missing_extraction finding). It names issue.gameplay_example.legendary_roll, but that issue
        is not linked to this section or to any object in it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
      disposition:
        status: open
        proposed_correction:
          'Rewrite the section.game_basics.gameplay_example coverage note so it stands
          alone: list the steps that are fixtures, the steps that need not_present Bestiary data
          (spider CS, HP, fear, Frenzy, charge), and the steps that conflict with the rules and
          their issue ids (including issue.gameplay_example.torch_after_threat_roll). Drop the
          ledger pointer and the claim that every executable step is a fixture.'
    - kind: modelling_error
      section_id: section.game_basics.gameplay_example
      description:
        issue.gameplay_example.legendary_roll is accurate. On PDF 202 the Legendary Items table
        has columns 1-2, 3-4 and 5-6, each rolled with 1d10. A 3 selects the middle column, whose
        row 4 is Dagger of Vrunior. The Gauntlets of Hraefnir are row 4 of the 1-2 column, and the
        table has no 1d12. However, the issue's related list holds only table.treasure.legendary. So
        the issue is not in this chapter's review digest and does not appear with the Gameplay
        Example's issues, although the conflict is printed on PDF 22.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 202
          printed_page: 200
          heading: Legendary Items
      disposition:
        status: open
        proposed_correction: 'issue.gameplay_example.legendary_roll: add
          section.game_basics.gameplay_example to related. Keep the summary and status unchanged.'
    - kind: uncertainty_not_recorded
      section_id: section.game_basics.gameplay_example
      description:
        In Turn 3 (PDF 23) the Threat Roll of 10 is below the Threat Level, and later in the
        same turn Azira's torch still gives +5 on the Fear Tests. The Torch entry (PDF 183) says a
        Threat Roll below the Threat Level spends the torch and ends that bonus. Turn Sequence step
        1b (PDF 20) removes torches that go out right after the Threat Roll. No issue recorded this
        conflict.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Torch
      disposition:
        status: recorded_as_issue
        issue_id: issue.gameplay_example.torch_after_threat_roll
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      description:
        'Checked each gameplay-example issue against the page. chest_threat matches: PDF 101
        step 1 and PDF 89 "The instant a door or chest is opened" add +1, and the example adds none
        for the chest. trap_table matches: the only "Trap Table" text in the book is on PDF 22, and
        PDF 101 says to draw a trap card. trap_sanity matches: the Sanity table on PDF 55 gives
        "Springing a trap" -2, and changelog 2.21 row 22 (Fixed) changes the example to 2.
        spider_turn matches: PDF 106 gives 2 more tokens than there are enemies after a bashed door,
        PDF 89 says a new turn starts when enemies are placed, and changelog row 27 (Fixed) agrees.
        threat_table_result matches: the in-battle table on PDF 91 (folio 89) gives 4-5 Healing and
        6 Frenzy, both -3. legendary_roll matches PDF 202. Its page pairs are correct for the
        misprinted folios (PDF 89 = 88, PDF 91 = 89).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 22
          printed_page: 20
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 91
          printed_page: 89
          heading: Threat Level tables
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      description:
        'Checked the fixture outcomes. Turn 1: a Scenario die of 2 is below the 9-10 trigger,
        so there is no Threat Roll. Perception 56 against 45 fails. A trap costs 1 Party Morale (12
        -> 11; PDF 58 "A hero springs a trap -1"). Turn 2: Threat 9 -> 10 on opening, door d6 2 is
        not trapped, and the door is locked. Forcing it hits automatically and adds +2 Threat per
        attempt (PDF 101 and PDF 89): 15 - 9 = 6 HP and Threat 12, then 6 - 6 = 0 (door removed) and
        Threat 14. Room roll 34 is within the 01-50 room chance on PDF 106, and the turn ends on
        placement as the changelog ruling says. A bashed door gives the spider 1 + 2 = 3 tokens.
        Turn 3: Threat Roll 10 against 14 is triggered, in battle, -3 -> 11. Power Attack: 46 + 20 -
        5 = 61, so 53 hits and both AP are spent. Damage 7 - 1 NA = 6. Steps that need the spider''s
        Bestiary profile (its CS, its 25 starting HP implied by 19 left after 6, fear at level 5 or
        less, Frenzy) are correctly not fixtures.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 24
          printed_page: 22
          heading: Gameplay Example
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      description:
        Two silences in the example, which no fixture contradicts. First, Azira carries the
        torch, and PDF 183 gives the carrier +5 Perception, but the example does not say whether
        "her perception (45)" includes it; 56 fails either way. Second, the example does not apply
        Party Morale +3 for "Finding a Wonderful Treasure" (PDF 58) or the -1 Party Morale and -1
        Sanity for Grol's failed Fear Test (PDF 58, PDF 55). No final values are printed, so there
        is no contradiction to record.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 58
          printed_page: 56
          heading: Party Morale
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Torch
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.gameplay_example
      object_id: test.gameplay_example.spider_initiative
      description:
        source_text joins the printed sentence with a paraphrase of changelog 2.21 row 27. The
        row reads "Giant Spider should have 3 Initiative tokens as the door was bashed. A new turn
        should start after placing enemies like stated in the FAQ." The paraphrase is faithful, and
        the expected enemy_tokens of 3 follows the ruling. A verbatim quote would be better.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 23
          printed_page: 21
          heading: Gameplay Example
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.basic_concept
      object_id: core.overview.threat_level
      description:
        The source_text matches the second paragraph of Basic Concept on PDF 19 word for word.
        Scope dungeon, type definition and the links to procedure.scenario_die and
        procedure.threat_roll are right. issue.game_basics.threat_roll_equality correctly records
        "below" (PDF 19) against "equal to or below" (PDF 89). The overview's "Every turn you are
        forced to roll the Scenario die" leaves out the PDF 89 qualifier "after the party have
        passed the first door". I read this as an overview simplification that
        procedure.dungeon_turn already handles (entrance_passed), not a conflict.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 19
          printed_page: 17
          heading: Basic Concept
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: The Threat Level
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.the_tiles
      description:
        The new rules core.house_rule.uncovered_situation, core.tiles.alternative_terrain,
        core.tiles.square_movement, core.tiles.interactable_objects, core.difficulty.party_size and
        core.difficulty.encounter_frequency match PDF 19-20 word for word, including the book's
        "criteria that must be fulfilled". The global or dungeon scopes are right and none is
        quest-local. core.tiles.interactable_objects cites both PDF 19 and PDF 20 for the passage
        that crosses the page. Its `require` effect has no action context (when). It reads as
        "anything searched or interacted with is noted on the Exploration Card", which is a faithful
        but loose model.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 19
          printed_page: 17
          heading: The Tiles
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 20
          printed_page: 18
          heading: Objects on the Tiles
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.skill_and_stat_checks
      description:
        The check rules and fixtures agree with PDF 20-21. "Equal to or lower" is a success and
        "anything above" a failure. The 'RES or…' instruction is followed on failure only. 01-05 is
        a perfect roll, with the three reward options, the once-between-settlement-visits limits,
        and "This will NOT raise the skills related to that basic stat". The open points are kept in
        issue.0009 and issue.0010. Perfect Result sits on PDF 21, as the section map says.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 20
          printed_page: 18
          heading: Skill and Stat Checks
        - document: rulebook.second_printing.eng
