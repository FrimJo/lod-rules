    - kind: ok_with_note
      section_id: section.game_basics.turn_sequence
      object_id: procedure.dungeon_turn
      description:
        Steps 1 (with 1a and 1b) to 5 and the closing sentence match PDF 20 word for word. The
        psychology dependency gives section_id section.psychology, while its object
        core.turn.psychology belongs to section.game_basics.turn_sequence. The mismatch is harmless,
        because the label points at the Psychology chapter.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 20
          printed_page: 18
          heading: Turn Sequence
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.game_basics.models
      description: 'core.model.footprint (Large: 4 squares; others: 1) matches PDF 20. The glossary
        component is `extracted` only because term.model also cites PDF 20, but its definition ("A
        living creature regardless of who controls them") comes from PDF 16. On PDF 20 "model" means
        the physical standee or token ("replace these with any model or token you see fit"). The
        citation is defensible as usage, but it does not support the definition. Several in-scope
        rules (core.model.footprint, core.los.trace, core.movement.wall,
        core.action_points.allocation, core.optional.*, core.turn.psychology) still have
        visually_verified: false. I checked their wording on the rendered pages, and it is
        verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 20
          printed_page: 18
