  summary:
    'Re-review after corrections to review.game_basics.1. Rendered and read PDF 18-24 (printed 16-22),
    101 (99), 193-194 (191-192) and 202 (200). All five findings left open by review.game_basics.1 are
    verified corrected on the page. core.optional.scenario_and_threat quotes the second Complexity
    paragraph and links its issue. The LOS diagram fixtures quote the printed caption. The new
    Gameplay Example fixtures (chest_open_roll, azira_trap_damage, chest_furniture_roll) and the
    updated door_opened_locked agree with PDF 22, 101 and 194. The coverage note stands alone.
    issue.gameplay_example.legendary_roll is related to the section. The new Door Table lookup in
    procedure.open_door_or_chest and the Chest lookup in character.treasure.furniture.chest match the
    printed tables. The Door Table HP 15 is still supplied rather than looked up, because the printed
    Difficulty cell is a single text/marker column. The coverage row documents this, and I accept it
    as an honest limitation. No new issues and no open findings.'
