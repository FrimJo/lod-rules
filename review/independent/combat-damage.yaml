  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:3447d8b5913e93602efc50deeb1bf29f694da58c3e155813f59e2f20c135fc6a

  findings:
    - kind: modelling_error
      section_id: section.combat.different_kinds_of_damage.poison
      object_id: combat.poison.rest_death
      description:
        'PDF 122, Poison: "If the party takes a rest (in a dungeon, while traveling, or at an inn),
        roll all the remaining rolls. If the hero reaches 0 Hit Points during a rest, the hero
        dies." The death sentence belongs to the poison paragraph and is about a poisoned hero
        losing HP to the remaining rolls. combat.poison.rest_death has no poison qualifier. Its
        when is only resting == true and hit_points <= 0, so as typed any hero at 0 HP during a
        rest dies, including a hero who is bleeding out without poison. That collides with the
        untreated-bleeding rest check on PDF 100. procedure.damage_follow_up.poison_rest_death
        already narrows the step to a failed poison check that takes the hero from 1 HP to 0, so
        the rule and its procedure disagree.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          section: Different Kinds of Damage
          heading: Poison
      disposition:
        status: open
        proposed_correction:
          'combat.poison.rest_death: add an input field poisoned (boolean) and the condition
          poisoned == true to when. Better still, make the condition that the HP was lost to a
          poison roll during the rest, which matches procedure.damage_follow_up.poison_rest_death.
          Add a derived case in which a resting hero at 0 HP who is not poisoned does not trigger
          the rule.'
    - kind: modelling_error
      section_id: section.combat.dealing_damage
      object_id: combat.enemy.zero_hp
      description:
        'PDF 121: "An enemy dies when it is reduced to 0 Hit Points." combat.enemy.zero_hp fires
        only when hit_points == 0. character.hit_points.loss subtracts damage without a floor, so
        any overkill blow (the usual case) leaves the enemy at negative HP. Neither the rule nor
        procedure.combat_damage then kills it: the enemy_zero step defers to the eq-0 rule, and the
        negative_hp step returns issue.phase4.zero_and_negative for heroes and enemies alike. The
        printed Combat Example (PDF 124) settles the enemy case: "Variya hits and proceeds to roll
        7+2 on her damage. Since the Gnoll only has 6 Hit Points left, it dies from the first
        strike." For that reason test.combat.variya_frenzy_damage declines to assert the death,
        and issue.combat.example_conflicts lists "taking it below 0 rather than to 0" as a
        conflict. That conflict comes from the model, not from the book. Hero overkill is a
        separate question. The poison sentence implies HP otherwise does not go negative, so it
        stays under issue.phase4.zero_and_negative.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Dealing Damage
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
          locator:
            paragraph: Round 2
      disposition:
        status: open
        proposed_correction:
          'combat.enemy.zero_hp: change the condition to hit_points <= 0 ("reduced to 0", as the
          Combat Example applies it). procedure.combat_damage: limit the negative_hp step to
          target_is_hero == true and let enemy_zero cover overkill. test.combat.variya_frenzy_damage:
          also assert the printed death (dead: true from 6 HP minus 7), or add a source_example on
          combat.enemy.zero_hp with hit_points -1. issue.combat.example_conflicts: drop the "taking
          it below 0 rather than to 0" clause. Update the combat_example coverage note to match.
          Add a derived case for an enemy at -1 HP.'
    - kind: modelling_error
      section_id: section.combat.bleeding_out
      object_id: character.hit_points.no_rescue
      description:
        'PDF 122: "If there are still heroes standing, but they have no means to help the one
        bleeding out, that hero will die." The rule''s when is only standing_companion == true and
        means_to_help == false, and it sets dead. Nothing says the subject is bleeding out, so as
        typed a healthy hero whose companions merely have no healing would die.
        procedure.bleeding_out.no_help does add bleeding_out == true, so the qualifier is missing
        only from the rule.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: open
        proposed_correction:
          'character.hit_points.no_rescue: add an input field bleeding_out (boolean) and the
          condition bleeding_out == true to when. Update test.character.hit_points.no_rescue.no_means
          to supply bleeding_out: true, and add a case in which a hero who is not bleeding out is
          unaffected.'
    - kind: modelling_error
      section_id: section.combat.bleeding_out
      object_id: character.death.replacement
      description:
        'PDF 122: "The players may choose to add a new level 1 hero to the party the next time the
        enter a settlement." The rule sets replacement_level 1 whenever dead and
        next_settlement_visit are true. It leaves out the players'' choice, so as typed every
        death yields a replacement. procedure.hero_death models replacement_chosen; the rule does
        not.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: open
        proposed_correction:
          'character.death.replacement: add an input field replacement_chosen (boolean) and the
          condition replacement_chosen == true to when. Update
          test.character.death.replacement.next_visit to match, and add a case in which the players
          decline.'
    - kind: uncertainty_not_recorded
      section_id: section.combat.different_kinds_of_damage.disease
      object_id: combat.disease.exposure
      description:
        'PDF 121, Disease: "If wounded by a creature that causes disease, ..." The same page
        defines Wounded as losing "50% of their HP (RDU)". The book does not say whether the
        Disease trigger uses that status or the plain sense of being hurt. combat.disease.exposure
        treats the trigger as a supplied boolean described as "Wounded by a creature that causes
        disease", which neither chooses nor records the question. The rule should also list the
        new issue under issues.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Different Kinds of Damage
          heading: Disease
      disposition:
        status: recorded_as_issue
        issue_id: issue.disease.wounded_trigger_wording
    - kind: uncertainty_not_recorded
      section_id: section.combat.combat_example
      object_id: issue.combat.example_conflicts
      description:
        'The issue says the example "calls the Gnoll wounded after losing four HP without printing
        its HP total". The total can be worked out from the page. Round 1 deals 4 damage, and
        Round 2 says "the Gnoll only has 6 Hit Points left", so the Gnoll had 10 HP. It has lost
        4 of 10 (40%). Under Wounded (PDF 121, 50% RDU, which is 5 of 10) it is not wounded, yet
        Round 2 strikes "the wounded Gnoll". This also bears on the Power Attack behaviour
        fixture, which supplies wounded: false. The issue understates the conflict, and the
        plain-sense reading of "wounded" (see issue.disease.wounded_trigger_wording) is the
        likely explanation.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Dealing Damage
          heading: Wounded
      disposition:
        status: open
        proposed_correction:
          'issue.combat.example_conflicts: replace "without printing its HP total" with the
          derived total. 4 damage plus "6 Hit Points left" gives 10 HP and a 40% loss, below the
          50% (RDU) Wounded threshold, yet the example calls it "the wounded Gnoll". Leave the
          status unresolved.'
    - kind: ok_with_note
      section_id: section.combat.different_kinds_of_damage.table
      object_id: table.combat.hit_location
      description:
        'The uncaptioned table under Hit Area (Only When Hitting Heroes), PDF 121, matches cell by
        cell. Header 1d6 / Hit location; rows 1 Head, 2 Arms, 3-5 Torso (check gear), 6 Legs;
        complete over 1-6. Row shading alternates and carries no meaning. The section title "Hit
        Area table" is not printed, and the section notes say so. combat.damage.hit_area
        restricts the lookup to target == hero, as the heading requires.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Dealing Damage
          heading: Hit Area (Only When Hitting Heroes)
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.different_kinds_of_damage
      description:
        'Every damage-kind rule and term quotes the page verbatim and keeps its qualifiers.
        Acidic ignores NA only and Fire ignores NA and armour. Both roll 1d6 once damage is
        resolved: 1-3 ends the effect, and 4-6 continues next turn at half damage (rounded down,
        minimum 1) and then ends. The halving is computed in procedure.damage_follow_up, and its
        basis is issue.damage_follow_up.continuation_basis. Frost causes stun on a supplied 50%
        result. Stun costs 1 AP during the next turn. Magic damage covers spells, prayers,
        scrolls, magic weapons or items, with the creature complications unresolved. Poison
        needs a hit that deals damage and a failed modified CON test, then 1 + 1d10 checks at
        1 HP each, ends early on 01-05, continues below 0 HP, rolls all remaining checks on a
        rest, and cannot recur until cured. Disease: a modified CON roll, failure halves CON and
        STR (RDD) after any ongoing battle until cured, cured by potion or sick wards, or by
        01-05 on a CON test during a rest. "magic weapons or items" is read as magic items
        (damage_source magic_item), a fair reading. combat.poison.exposure and .checks keep the
        printed switch from "target" to "the hero", and issue.combat.enemy_poison_damage records
        it. Changelog 2.21 entries 71, 164 and 165 are recorded and not applied, which is right
        because this PDF does not print them.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Different Kinds of Damage
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Different Kinds of Damage
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.enemy_attack
      object_id: procedure.enemy_attack
      description:
        'I traced every box and arrow of the Enemy Attack chart (PDF 123). Standard tests against
        CS and Power against CS+20. On failure, "00" with a weapon drops the weapon, "00" without
        one falls over, and anything else misses. On success, the Parry Stance options are handed
        to procedure.hero_defence. A successful weapon parry is Parried!; a failed one on 95-00
        costs weapon durability -1 and goes on to the hit area. A successful shield parry rolls
        damage: DMG <= DEF is Parried!, and DMG > DEF costs shield durability -1 and moves the
        rest to the arm. A failed shield parry on 95-00 costs shield durability -1 and goes on to
        the hit area. A successful dodge is Dodged attack!. A failed dodge, or no defence, rolls
        1d6 for the hit area and takes DMG from the monster card. DMG <= DEF is Blocked by armour.
        DMG > DEF subtracts wounds (DMG - DEF) and 1 durability from the armour in the area. A
        torso hit then rolls 1d10 and costs the slotted item 1 durability; otherwise a head hit
        costs 1 Sanity, and anything else is That''s all!. The procedure matches. Torso and Head
        are reached only after DMG > DEF, as drawn. Two chart/prose differences are recorded in
        issue.combat.enemy_attack_flowchart: the shield spillover line runs into the hit-area
        roll, and the chart leaves out NA. Card naming is recorded in
        issue.combat.behaviour_card_naming. Minor: the terminal "That''s all!" is not set as an
        outcome, so a non-head, non-torso hit ends with outcome wounds_subtracted.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 123
          printed_page: 121
          heading: Enemy Attack
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.combat_example
      description:
        'Every step of the Combat Example (PDF 124) is classified. The charge (CS 45 +10 -10 +5 =
        50, 2 AP), the 22 hit, 6 damage against Armour 2 for 4, behaviour roll 6 as a Power Attack,
        the 37 hit against CS 40 +20 with a dodge, behaviour roll 2 as a Standard Attack, the
        second roll 1 into Parry Stance, the 7+2 damage, and "20 or less" (45 -10 -10 -5) are all
        fixtures. Each fixture quotes the printed sentences verbatim, including the unclosed "(+10
        for charging ..." parenthesis. Every supplied number is printed in the example. No
        Bestiary value is invented, and no table value is supplied that the example looks up: the
        Gnoll''s NA 0, Variya''s dodge success and adjacency are each flagged in
        unresolved_references. The coverage note lists the steps that are not executable: the
        stagger, the skipped Special Talents roll, the 54 miss, the dodge roll 27, Frenzy and the
        caption. Minor: Round 1 splits "1d12+2 ... 6" as weapon 6 + DB 0, while Round 2 uses 7 +
        DB 2. Both are faithful to the printed totals. The fixture name "roll below 50" and the
        check semantics (<=) differ only at 50, which is not exercised. The Gnoll death at 6 HP
        is the open finding on combat.enemy.zero_hp.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 119
          printed_page: 117
          heading: Detailed acting with enemies
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.bleeding_out
      description:
        'The Bleeding out rules (PDF 122) match the page: 0 HP knocks the hero down and starts
        bleeding out; the three rescue means during the fight; bandaging after battle and never
        by a knocked-out hero; all heroes bleeding out loses the quest; no means kills the hero;
        a dead hero is permanently removed with an optional level 1 replacement; and 1d4
        permanent reduction of a randomised basic stat or HP. The Advanced Rule is the optional
        1d6+1 turn limit, gated by advanced_rule_enabled. Notes: the book''s typo "the next time
        the enter a settlement" is kept verbatim in character.death.replacement and
        procedure.hero_death; the meaning is clear. Dealing Damage (PDF 121) says "knocked out"
        and Bleeding out (PDF 122) says "knocked down". character.hit_points.zero cites both
        pages but quotes only the PDF 122 wording. character.hit_points.bleeding_time.die has no
        dice spec (1d6), unlike other rolled fields.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.dealing_damage
      object_id: procedure.combat_damage
      description:
        'In procedure.combat_damage, procedure.bleeding_out, procedure.elemental_continuation and
        procedure.damage_follow_up, most step-level source_text fields are the extractor''s
        paraphrase or modelling commentary, not printed text. Examples: "Subtract only resolved
        nonnegative damage. No invented zero floor or overkill clamp." and "Non-poison overkill
        below zero has no printed clamp". The rule-level source_text in this unit is verbatim,
        which matches the practice accepted in earlier chapters. The verbatim wording lives on
        the referenced rules.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Dealing Damage
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.quick_slots_and_damage
      description:
        'Quick Slots and Damage (PDF 121) matches. A torso hit rolls 1d10; a roll above the
        available slots has no effect; the item in the struck slot loses 1 Point of Durability;
        a struck damaging potion inflicts its damage on the hero. The source_text elides the
        "For example ..." sentence with "...", and the coverage note justifies leaving it out. The
        section rows, page ranges and coverage notes for all 16 sections match the rendered
        headings. Bloodlust and Hit Area are run-in headings with no section node of their own,
        while Acidic, Disease, Fire, Frost, Magic, Poison and Stun have nodes. That is
        inconsistent but not wrong. procedure.disease_cure and procedure.poison_cure also cite
        PDF 80 and PDF 144, which are outside this unit and which I did not inspect.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Dealing Damage
          heading: Quick Slots and Damage
      disposition:
        status: no_change_needed
  outcome: failed
  summary:
    "Independent review of Combat (b2): Dealing Damage, Bloodlust, Hit Area and its table, Quick
    Slots and Damage, Wounded, Different Kinds of Damage (Acidic, Disease, Fire, Frost, Magic,
    Poison, Stun), Bleeding out and its Advanced Rule, the Enemy Attack flowchart, and the Combat
    Example. I read PDF 121-124 (printed 119-122) rendered, plus PDF 119-120 for the behaviour
    table and the parry rules the example and chart rely on. Source text, terms, the hit location
    table, the flowchart procedure and the example fixtures match the page. Five findings are
    open. combat.poison.rest_death has no poison qualifier. combat.enemy.zero_hp uses == 0, so
    overkill does not kill an enemy, against the printed example. character.hit_points.no_rescue
    has no bleeding-out qualifier. character.death.replacement leaves out the players' choice.
    issue.combat.example_conflicts misstates that the Gnoll's HP total is not derivable. One new
    issue, issue.disease.wounded_trigger_wording."
- id: review.combat_damage.2
  reviewer:
