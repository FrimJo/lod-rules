  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:070460458e6ced4a461a057528425371d2a02c3d8347bd4c04cc42fc9018edff
  findings:
    - kind: modelling_error
      section_id: section.combat.different_kinds_of_damage.poison
      object_id: combat.poison.rest_death
      description:
        'Re-review of review.combat_damage.1. PDF 122, Poison: "If the party takes a rest (in a
        dungeon, while traveling, or at an inn), roll all the remaining rolls. If the hero reaches 0
        Hit Points during a rest, the hero dies." combat.poison.rest_death now has an input
        hp_lost_to_poison_roll and its when is resting == true, hp_lost_to_poison_roll == true and
        hit_points <= 0. A resting hero at 0 HP who did not lose the HP to a poison roll no longer
        dies by this rule. New fixtures test.combat.poison.rest_death (dead) and
        test.combat.poison.rest_zero_not_poison (no effect) cover both sides and quote the printed
        sentences. The coverage note for the Poison section says the same. Note: the rule uses
        hit_points <= 0, while procedure.damage_follow_up.poison_rest_death fires only for a loss
        from 1 HP to 0. They differ only for a hero who is already below 0 HP during the rest, which
        the book does not cover. That case stays under issue.phase4.zero_and_negative.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          section: Different Kinds of Damage
          heading: Poison
      disposition:
        status: corrected
        change: combat.poison.rest_death requires hp_lost_to_poison_roll == true. Derived cases now
          cover the positive case and the resting, non-poison 0 HP case.
    - kind: modelling_error
      section_id: section.combat.dealing_damage
      object_id: combat.enemy.zero_hp
      description:
        'Re-review of review.combat_damage.1. PDF 121: "An enemy dies when it is reduced to 0
        Hit Points." PDF 124, Round 2: "Variya hits and proceeds to roll 7+2 on her damage. Since
        the Gnoll only has 6 Hit Points left, it dies from the first strike." combat.enemy.zero_hp
        now tests hit_points <= 0. In procedure.combat_damage the negative_hp step requires
        target_is_hero == true, so an enemy taken below 0 reaches the enemy_zero step and dies.
        test.combat.variya_frenzy_damage now asserts damage_taken 7, hit_points -1 and dead true,
        which matches the printed outcome. Its inputs are printed or derivable: Armour 2 and NA 0
        come from Round 1, where 6 damage against Armour 2 gives 4. New derived cases
        test.combat.enemy.zero_hp.overkill (-1, dies) and .positive (1, lives) sit alongside .zero.
        The "below 0" clause is gone from issue.combat.example_conflicts. The Dealing Damage and
        Combat Example coverage notes now state the death. Minor: the enemy_zero step text still
        reads "An enemy at zero dies." It is the extractor''s label, and the rule it references
        carries the <= 0 condition.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Dealing Damage
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
          locator:
            paragraph: Round 2
      disposition:
        status: corrected
        change:
          combat.enemy.zero_hp tests hit_points lte 0. procedure.combat_damage limits negative_hp
          to heroes. test.combat.variya_frenzy_damage asserts the printed death. Overkill and
          positive derived cases were added, and issue.combat.example_conflicts and the coverage
          notes were updated.
    - kind: modelling_error
      section_id: section.combat.bleeding_out
      object_id: character.hit_points.no_rescue
      description:
        'Re-review of review.combat_damage.1. PDF 122: "If there are still heroes standing, but
        they have no means to help the one bleeding out, that hero will die."
        character.hit_points.no_rescue now has an input bleeding_out, and its when is all of
        bleeding_out == true, standing_companion == true and means_to_help == false. That matches
        the procedure.bleeding_out no_help step. test.character.hit_points.no_rescue.no_means
        supplies bleeding_out: true. The new test.character.hit_points.no_rescue.not_bleeding shows
        that a hero who is not bleeding out is unaffected, and it quotes the printed sentence.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: corrected
        change:
          character.hit_points.no_rescue requires bleeding_out == true. The positive fixture was
          updated and a negative fixture added.
    - kind: modelling_error
      section_id: section.combat.bleeding_out
      object_id: character.death.replacement
      description:
        'Re-review of review.combat_damage.1. PDF 122: "A dead hero is permanently removed
        from the game. The players may choose to add a new level 1 hero to the party the next time
        the enter a settlement." character.death.replacement now has an input replacement_chosen
        and requires dead, next_settlement_visit and replacement_chosen all true. That matches the
        chosen_replacement step of procedure.hero_death. test.character.death.replacement.next_visit
        supplies replacement_chosen: true. The new test.character.death.replacement.declined shows
        no replacement when the players decline, and it quotes the printed sentences. The book''s
        typo "the enter" is kept verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: corrected
        change:
          character.death.replacement requires replacement_chosen == true. The positive fixture
          was updated and a "players decline" fixture added.
    - kind: uncertainty_not_recorded
      section_id: section.combat.combat_example
      object_id: issue.combat.example_conflicts
      description:
        'Re-review of review.combat_damage.1. Checked on PDF 124: Round 1 gives "a total damage
        of 4", and Round 2 says "the Gnoll only has 6 Hit Points left" and strikes "the wounded
        Gnoll". Under Wounded on PDF 121 (50% of HP, RDU), losing 4 of 10 is not enough. The issue
        now derives the 10 HP total and the 40% loss, says this is below the 50% (RDU) Wounded
        threshold, and cites PDF 121 Wounded. Status stays unresolved. The "taking it below 0 rather
        than to 0" clause has been removed. The Combat Example coverage note repeats the
        derivation.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Dealing Damage
          heading: Wounded
      disposition:
        status: corrected
        change:
          issue.combat.example_conflicts states the derived 10 HP total and the 40% loss against
          the 50% (RDU) Wounded threshold, cites PDF 121 Wounded, stays unresolved, and no longer
          lists the overkill clause.
    - kind: ok_with_note
      section_id: section.combat.different_kinds_of_damage
      description:
        "Independent re-check of the damage-kind rules against PDF 121-122. Acidic ignores NA,
        and Fire ignores NA and armour. For both, 1d6 1-3 ends the effect, and 4-6 continues next
        turn halved (rounded down, minimum 1) and then ends. Fire's continuation is cited on both
        pages, as printed across the page break. Frost stuns on a supplied 50% result and costs one
        AP next turn. Stun costs 1 AP during the model's next turn. Magic damage covers spells,
        prayers, scrolls, magic weapons and magic items, with complications unresolved. Poison: a
        damaging poison hit and a failed modified CON test, then 1 + 1d10 checks of 1 HP each, 01-05
        cures and cancels the remaining rolls, losses continue below 0 HP, a rest rolls all
        remaining checks, and the hero cannot be poisoned again until cured. Disease: a modified CON
        roll; failure halves CON and STR (RDD) after any ongoing battle until cured; cured by potion
        or sick wards, or by 01-05 on a CON test during a rest. Terms quote the printed definitions.
        None of these objects changed since review.combat_damage.1. Minor: combat.disease.exposure
        does not list issue.disease.wounded_trigger_wording under issues, although the issue's
        related list names the rule, so the link exists one way."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          heading: Different Kinds of Damage
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Different Kinds of Damage
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.different_kinds_of_damage.table
      object_id: table.combat.hit_location
      description:
        'PDF 121: header 1d6 / Hit location, then rows 1 Head, 2 Arms, 3-5 Torso (check gear)
        and 6 Legs. The table matches cell by cell and covers 1-6. combat.damage.hit_area is gated
        on target == hero, as "(Only When Hitting Heroes)" requires. The location steps in
        procedure.combat_damage use the same ranges.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 121
          printed_page: 119
          section: Dealing Damage
          heading: Hit Area (Only When Hitting Heroes)
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.bleeding_out
      description:
        'Independent re-check of Bleeding out and its Advanced Rule (PDF 122). 0 HP knocks the
        hero down and starts bleeding out, and the hero cannot act. The three rescue means apply
        during the fight. A standing companion may bandage after the battle, and a knocked-out hero
        never can. All heroes bleeding out loses the quest and kills the heroes. A dead hero is
        permanently removed. The 1d4 permanent reduction falls on a randomised basic stat or HP. The
        optional 1d6+1 turn limit is gated by advanced_rule_enabled. Notes carried over: Dealing
        Damage (PDF 121) says "knocked out" and Bleeding out says "knocked down".
        character.hit_points.zero tests hit_points == 0, so hero overkill below 0 is left to
        issue.phase4.zero_and_negative, which the negative_hp step of procedure.combat_damage
        returns. character.hit_points.bleeding_time.die has no dice spec, unlike other rolled
        fields.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 122
          printed_page: 120
          heading: Bleeding out
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.enemy_attack
      object_id: procedure.enemy_attack
      description: PDF 123, Enemy Attack chart, re-read. Standard tests against CS and Power against
        CS+20. A failed roll of "00" drops the weapon or makes the attacker fall over; any other
        failure misses. Parry Stance options are Dodge +15, shield CS+15 and weapon CS; outside
        Parry Stance, Dodge and shield CS-15. Then come the weapon, shield and dodge branches, the
        hit area, DMG > DEF, the armour durability loss, Torso 1d10 slot durability, and Head -1
        Sanity. The parry prose on PDF 120 agrees. procedure.enemy_attack, its fixtures and
        issue.combat.enemy_attack_flowchart are unchanged since review.combat_damage.1, which traced
        every branch. I spot-checked the opening branches and found no discrepancy.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 123
          printed_page: 121
          heading: Enemy Attack
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 120
          printed_page: 118
          heading: Detailed acting with enemies
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.combat.combat_example
      description:
        'Every Combat Example fixture (PDF 124) still quotes the printed sentences, and its
        numbers are printed: charge 50 with 2 AP, hit 22, 6 against Armour 2 for 4, Power Attack on
        6, 37 against CS 40+20 dodged, Standard Attack on 2 and Parry Stance on the second roll of
        1, 7+2 against Armour 2 killing the 6 HP Gnoll, and "20 or less". The coverage note lists
        the non-executable steps and stands alone. No Bestiary value is invented.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 124
          printed_page: 122
          heading: Combat Example
      disposition:
        status: no_change_needed
  outcome: passed_with_corrections
  summary: "Re-review of Combat (b2): Dealing Damage, Wounded, Quick Slots and Damage, the hit
    location table, Different Kinds of Damage, Bleeding out and its Advanced Rule, the Enemy Attack
    chart and the Combat Example. I read PDF 120-124 (printed 118-122) rendered. All five open
    findings of review.combat_damage.1 were corrected, and I verified each on the page:
    combat.poison.rest_death needs HP lost to a poison roll; combat.enemy.zero_hp kills at 0 HP or
    below, and the Variya fixture asserts the printed death; character.hit_points.no_rescue needs
    bleeding_out; character.death.replacement needs the players' choice;
    issue.combat.example_conflicts derives the Gnoll's 10 HP. New derived cases in
    tests/examples/combat/damage-guards.yaml and tests/examples/characters/hit-points.yaml cover
    both sides of each guard. Nothing else in the unit changed, and my independent re-check found no
    new error. No new issues."
