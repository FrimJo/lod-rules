  findings:
    - kind: ok_with_note
      section_id: section.psychology.party_morale.table
      object_id: issue.psychology.hungry_morale_penalty
      description: >-
        The only change since review.psychology_tables.2 is this new resolved issue, which lists
        table.psychology.morale_adjustments in related. I verified every source it cites on the
        rendered page. PDF 58 (printed 56) prints the row "Party is hungry | Lack of food is always
        bad for motivation | -2" under Adjusting the Morale, exactly as quoted. PDF 126 (printed
        124), Rations and Resting, prints "They go hungry and temporarily lose half their
        Constitution (RDD). This leaves them vulnerable to disease, poison" and PDF 127 (printed
        125) continues "and physical damage. Party Morale is also lowered by 4. This lasts until
        they eat again. This is not cumulative, so it does not matter how many days you go
        hungry.", so the elided quotation and both page labels are right (pages.yaml: 126/124,
        127/125). Changelog 2.2x PDF 21, entry 124 "Going Hungry", quotes "Page 112 (Rations and
        resting) ... Party Morale is also lowered by 4." and "Page 53 (table) Party is hungry /
        -2", is marked Fixed and carries the designer answer "Minus 4 is correct" in the answer
        column; that is a stated rule, so under the official-rulings convention it settles the
        conflict and status resolved with that citation is correct (the changelog page numbers
        112 and 53 are a later edition's, as the convention expects). Changelog PDF 23, entry 148,
        reads "Changed in table 'A character is hungry' 'Lack of food is always bad for motivation
        and is cumulative' '-1/char.'" with no answer, and the 2.5 Quick Reference Sheet page 2
        Party Morale panel prints "A Party member is hungry (per member) -2"; the issue records
        both as later-edition evidence and does not apply them, as the convention requires for
        official_reference material and an unanswered Fixed entry. Type conflicting, the
        summary and the resolution are accurate.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 56
          pdf_page: 58
          heading: Adjusting the Morale
          locator:
            table: Uncaptioned Party Morale adjustment table
            row: Party is hungry
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 125
          pdf_page: 127
          heading: Rations and Resting
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
