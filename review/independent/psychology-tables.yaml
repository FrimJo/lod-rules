    - kind: ok_with_note
      section_id: section.psychology.party_morale.table
      object_id: table.psychology.morale_adjustments
      description: >-
        Changelog 2.21 entry 36 (rendered changelog page 4: Party Morale - table "A Hero dies ->
        Effect: -6" / On the Quest Sheet, effect is -5, which is right ? / Fixed / QRS is
        correct.) is applied on character.morale.event.hero_dies and recorded in
        issue.psychology.hero_dies_morale_penalty, which lists this table as related. The table
        row keeps printed '-6' / value -6, exactly as the short_rest row keeps printed '+1' /
        value 1 under entry 39 ("+2 is correct"). I agree with that convention: the table is the
        transcription of the page and the ruling lives on the executable rule and the issue, so no
        row annotation is needed. Optional only: the coverage note for this node names the
        short-rest issue but not the hero-dies issue; adding it would make the note complete but
        nothing is wrong.
      source:
