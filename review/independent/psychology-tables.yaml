  findings:
    - kind: ok_with_note
      section_id: section.psychology.sanity.table
      object_id: table.psychology.sanity_losses
      description: >-
        Verbatim check passed. The uncaptioned Situation / Effect table under the Sanity heading
        has ten rows on the page and ten in the YAML, in printed order: Failing a Terror Test -2,
        Springing a trap -2, Character suffers a wound to the head -1, Failing a Fear Test -1,
        Each battle with a demon -1, Being reduced to 0 Hit Points -1, Contracting a disease -1,
        Getting poisoned -1, Miscasting a spell -1d3, Certain room events / See Exploration Card.
        Every cell matches; the quoted source_text sentence matches the left column word for
        word; the source cites PDF 55 / printed 53 with heading Sanity, which is the printed
        heading above the table. The -1d3 cell stays as printed although issue.sanity.miscast_loss
        (resolved by designer ruling) redirects the executable loss to the Miscast table; that
        follows the official-rulings convention (printed text verbatim, effects on the rule).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 53
          pdf_page: 55
          heading: Sanity
          locator:
            table: Uncaptioned Sanity loss table
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.table
      object_id: table.psychology.mental_conditions
      description: >-
        Verbatim check passed. The uncaptioned 1d10 / Condition / Effect table on PDF 57 has nine
        rows (1 Hate, 2-3 Acute Stress, 4 Lingering Trauma, 5 Fear of the Dark, 6 Arachnophobia,
        7 Jumpy, 8 Irrational Fear, 9 Claustrophobia, 0 Depression) and every Effect cell matches
        the page word for word, including "reoccurring", "Randomise between Orcs and Goblins,
        Beasts, Undead, Reptiles, or Dark Elves", "A Scenario roll of 10 ... increase by 2",
        "All skills and stats are at -10 in corridors", "energy pool ... reduced by 2", and the
        Hate row's "Monster List of the Bestiary" sentence. The "0" row is stored as printed '0'
        with min/max 10, which is the only consistent reading of a 1d10 table whose other rows run
        1-9, and roll_domain 1-10 is complete. The apparent double space after "quest." (Acute
        Stress) and "terrifying." (Arachnophobia) sits on fully justified lines; the PDF text
        layer has no extra space there, so the single space in the YAML is correct normalisation,
        not a dropped character. No heading is printed above the table on this page; citing the
        chapter heading Psychology with locator "Uncaptioned mental conditions table" is
        accurate.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 55
          pdf_page: 57
          heading: Psychology
          locator:
            table: Uncaptioned mental conditions table
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.table_lingering_trauma_table
      object_id: table.psychology.lingering_trauma
      description: >-
        Verbatim check passed. The captioned "Lingering Trauma Table" (1d6 / Trigger) has six rows
        and all six match the page exactly, full stops included: A trap is sprung by the party. /
        A portcullis falls down. / A companion is reduced to 0 Hit Points. / A miscast in the
        party. / Party takes a short break. / The party opens a chest. The heading, locator and
        page labels are correct, and character.sanity.trauma_trigger looks the 1d6 up in this
        table with the six roll fixtures returning the printed trigger text. The phrase "short
        break" is not otherwise used by the book; see the separate recorded issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          printed_page: 55
          pdf_page: 57
