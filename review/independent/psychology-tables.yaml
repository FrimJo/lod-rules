      description: >-
        Outside this unit, for the Party Morale and Travelling reviewers; no change proposed here.
        character.morale.event.hungry (section.psychology.party_morale) applies -4 multiplied by an
        occurrences input of at least 1, as an immediate add, whereas PDF 127 says the loss "lasts
        until they eat again" and "is not cumulative, so it does not matter how many days you go
        hungry". The non-cumulative, temporary behaviour is modelled in
        procedure.travel_food_and_rest (steps hunger_morale and restore_morale, guarded by
        hunger_morale_active), but that procedure does not list
        issue.psychology.hungry_morale_penalty, which it implicitly follows (-4), and the issue's
        related does not include it. Its step source_text "Hunger temporarily lowers Party Morale
        by 4, noncumulatively." is a paraphrase rather than the printed sentence. Those reviewers may
        want to check whether occurrences > 1 should be reachable and whether the travel procedure
        should cite the issue and ruling.
