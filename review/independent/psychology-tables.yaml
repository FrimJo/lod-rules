        4 prints entry 37 as a reader suggestion ("Description of 'Arachnophobia' should probably
        mention spiders in 2nd sentence. i.e., 'Sll encounters against Spiders cause Terror.'")
        with the status cell "Fixed" and an empty answer cell, whereas the neighbouring entries 36
        ("QRS is correct.") and 39 ("+2 is correct") carry a designer answer. Under the
        official-rulings convention a "Fixed" mark without a stated rule settles nothing, so I
        agree the entry is evidence, not a ruling. The issue now cites the changelog (document
        vonbraus.changelog_2_2x, pdf_page 4, heading '2.21', locator row 37, image-verified), its
        summary describes the entry, the empty answer column and the fact that the second
        printing still prints "Treat all encounters as causing Terror.", and it stays unresolved.
        The printed sentence is still verbatim on the table row, condition.arachnophobia,
        character.condition.arachnophobia and character.condition.arachnophobia_other_encounters;
        the latter still returns the unresolved issue for spider_encounter false, procedure.arachnophobia
        still returns it at its other-encounters step, and
        test.character.condition.arachnophobia_other_encounters.not_spider still expects it. No
        effect changed, which is right. review/designer-published-rulings.md lists entry 37 under
        "Acknowledged, but the fix isn't stated" as recorded, not applied. Note for consistency
        only, outside this unit: the same file treats entry 83 (a player proposal on Sanity recovery
        marked Fixed) as a partial ruling for issue.sanity.recovery_scope; the Sanity prose
        reviewer may want to check that both readings follow the same policy.
