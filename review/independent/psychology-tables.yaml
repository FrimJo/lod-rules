    - kind: ok_with_note
      section_id: section.psychology.table
      object_id: condition.hate
      description: >-
        The Hate row's second sentence ("This creature must appear in the Monster List of the
        Bestiary") is quoted verbatim and nothing from the Bestiary (manifest status
        not_present) is invented: character.condition.hate takes last_enemy_in_bestiary as an
        input behind a require effect and declares the Monster List as an external_document
