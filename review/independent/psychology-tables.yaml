    - kind: ok_with_note
      section_id: section.psychology.party_morale.table
      object_id: table.psychology.morale_adjustments
      description: >-
        The table transcription is unaffected by the ruling, as it should be. The hungry row keeps
        situation "Party is hungry", description "Lack of food is always bad for motivation"
        (printed without a full stop, as on the page) and effect printed '-2' / value -2, with
        rule_refs character.morale.event.hungry; the ruled -4 lives only in that rule's effect,
        which cites both PDF 58 and changelog entry 124. This matches the treatment already
        accepted for the hero_dies row (-6 kept, ruling on the rule). The table's digest is
        identical to review.psychology_tables.2 (npm run review -- check reported only the issue as
        added). I re-read all fifteen rows on PDF 58 and they still match, signs included (-6, -4,
        -2, -2, -2, -1, -1, -1, -1, -1, +1, +1, +2, +3, +3), as do heading Adjusting the Morale and
        locator "Uncaptioned Party Morale adjustment table".
