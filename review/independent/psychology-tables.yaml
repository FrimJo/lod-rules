  findings:
    - kind: ok_with_note
      section_id: section.psychology.party_morale.table
      object_id: issue.psychology.hungry_morale_penalty
      description: >-
        Since review.psychology_tables.3 only this issue changed (digest comparison, and npm run
        review -- check lists .3 as stale for it alone). It is still status resolved but the
        resolution now applies changelog 2.21 entry 148 by user decision instead of entry 124; the
        choice between 124 and 148 is the user's and is not a finding. I verified every quotation on
        the rendered pages. PDF 58 (printed 56) prints "Party is hungry | Lack of food is always
        bad for motivation | -2". PDF 126 (printed 124) ends "They go hungry and temporarily lose
        half their Constitution (RDD). This leaves them vulnerable to disease, poison" and PDF 127
        (printed 125) continues "and physical damage. Party Morale is also lowered by 4. This lasts
        until they eat again. This is not cumulative, so it does not matter how many days you go
        hungry." Changelog PDF 21 entry 124 "Going Hungry" quotes both passages and the table row,
        marked Fixed, answer "Minus 4 is correct". Changelog PDF 23 entry 148 reads "Changed in
        table 'A character is hungry' 'Lack of food is always bad for motivation and is
        cumulative' '-1/char.' (Having more party members, like more mercenaries, adds more
        negativity in the party)", marked Fixed. QRS 2.5 PDF 2 Party Morale panel prints "A Party
        member is hungry (per member) -2". The summary reports all of this accurately, including
        that entry 148 does not say whether "cumulative" overrides PDF 127's "not cumulative", and
        the page labels 56/58, 124/126 and 125/127 are right. The resolution source cites changelog
        PDF 23 row 148 correctly. The ruling is applied in character.morale.event.hungry as
        hungry_characters (minimum 1, integer) times -1 with a source citation to PDF 58 and
        changelog PDF 23 row 148; the printed -2 stays as source_text. The fixtures
        test.character.morale.event.hungry.once and .single_character cite PDF 58 and changelog
        PDF 23 and are in the issue's related list.
