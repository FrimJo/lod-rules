  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:6395537225423486eef968acb2927244fcb4d5d57cf89e94a7ef8cd42277389c
  findings:
    - kind: modelling_error
      section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
      object_id: character.treasure.legendary.stone_of_valheir.draw
      description: PDF 204 says "every time the wizard draws a Focus bonus from it, he or she must pass a RES Test, or lose 1 Sanity Point." The draw rule declares res_test_passed but never uses it. Its when clause tests only identified and user_is_wizard, and it always sets sanity_lost to 0. On a failed RES Test the sibling rule character.treasure.legendary.stone_of_valheir.draw_failed_res also fires and sets sanity_lost to 1. Both rules then write different values to the same output for one draw, so the typed model contradicts the printed rule. The source_text, the store rule and the parent rule (3 bonuses, the 10-30 range read as +10 each up to +30, no extra miscast risk, combines with a normal Focus Action, a full turn and an Arcane Arts roll per stored bonus, refills between quests without rolls, user is a wizard) match the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 204
          printed_page: 202
          heading: Stone of Valheir
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: In character.treasure.legendary.stone_of_valheir.draw, delete the sanity_lost output and its set effect, and delete the unused res_test_passed input, so that only draw_failed_res decides the Sanity loss. If the extraction side wants the draw rule to keep sanity_lost, it must add res_test_passed == true to its when clause.
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items
      object_id: term.legendary_item
      description: 'The term.legendary_item definition and the source_text of character.treasure.legendary.general, identify_before_use and never_sold match the second paragraph on PDF 203 (printed 201) word for word. found_once also quotes the selector line on PDF 202 (printed 200), "Remember that each object may only be found once, unless noted otherwise.", which I read on the page. It cites both pages correctly. The typed restrictions match the print: unique and found once unless noted (repeat finds are noted for the Vial, the Ring of Awareness and the Legendary Elixir, each of which depends on found_once), never sold, never runs out of magic or damaged, and identified before use. The lore paragraph has no mechanics.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 203
          printed_page: 201
          heading: Legendary Items
          extraction:
            method: image
