      description: 'I compared the source_text of all 18 item entities (Horn of Alfheim to Ohlnir’s Hammer, PDF 203–208, including the Headsman’s Axe text that runs over PDF 207–208) and every rule quotation with the rendered pages. All match, with the printed slips kept: "foul hoard", "if it is hit during battle is be destroyed", "and, not in Elven possession is", "gets 1 extra initiative token", "that was with an odd number", "half that roll, RDD passes on". Every typed number matches: Horn +3 Damage, 2 Energy, full turn; Bow +5 bloodlust chance and +5 Damage on that shot; Gauntlets STR +15 and no armour slots; Belt CON +20; Hierophant -15 CS for Undead attackers; Amulet +15 Wisdom; Ring of Awareness +1 token on the first round, cumulative to +3, +15 Perception for traps; Cloak +15 Dodge; Priestly Dice +2 luck; Elixir +10; Staff +20 Arcane Arts and 1 extra token for summoned elementals or demons; Axe +2 per consecutive damaging hit, reset on a miss or no damage and after battle; Sword 1d6 with no armour save and floor(roll/2) to the closest character other than the wielder, randomised on ties; Hammer stuns on every hit with no test and at most 1 Action lost per turn. Base-equipment bindings (shortbow, dagger, greataxe, longsword, battle_hammer) follow the printed nouns. Section titles and page ranges in sections.yaml, the pages.yaml labels for PDF 202–215, and the selector rows row_1 to row_18 match the pages.'
