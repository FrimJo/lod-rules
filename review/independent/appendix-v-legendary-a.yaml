      description: 'New source_example case checked against PDF 204 (printed 202, per pages.yaml), heading Stone of Valheir. Its source_text matches the end of the first column and start of the second word for word ("A wizard may store up to 3 Focus bonuses in the stone which can then be drawn upon at any time. That means the wizard may cast a spell and get the 10-30 Focus bonus without actually needing to focus. This bonus does not increase the risk of miscast."). It runs character.treasure.legendary.stone_of_valheir.draw (unchanged since record .3) with identified, a wizard user and 3 stored bonuses, and asserts needs_to_focus false and increases_miscast_risk false, which are the printed consequences, plus the require satisfied by a stored bonus. stored_focus_bonuses_after 2 follows the draw rule, which takes one bonus per draw; the page supports that reading ("every time the wizard draws a Focus bonus from it"), and the 10-30 range is 1 to 3 bonuses at 10 each, which the parent rule character.treasure.legendary.stone_of_valheir carries (bonus_per_focus 10, maximum 30). The case does not assert the 10-30 magnitude, since the draw rule outputs no bonus value; this is a limit of the case, not an error. The RES Test on each draw is left to draw_failed_res and lies outside the quoted sentences.'
