  findings:
    - kind: modelling_error
      section_id: section.appendix_v_treasures.legendary_items.the_summoners_staff
      object_id: character.treasure.legendary.the_summoners_staff.conjuring
      description: 'Re-check of the open finding in review.appendix_v_legendary_a.2. PDF 207 prints "Any Conjuring Spell cast while wielding the staff is done at +20 Arcane Arts." The spell tables print the School value "Conjuration" (PDF 189: Summon Water Elemental, Summon Wind Elemental). The rule now compares spell_school with "conjuration", the same convention character.talent.conjurer uses, and describes spell_school as the spell table School value in lower case. The source_text stays verbatim with "Conjuring Spell", the +20 Arcane Arts value and the identified and wielding_staff conditions match the page, and the rule, the parent rule character.treasure.legendary.the_summoners_staff and the entity equipment.legendary.the_summoners_staff all link issue.treasure.summoners_staff_conjuring_spell, which stays unresolved and keeps the "Conjuring"/"Conjuration" wording gap visible.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 207
          printed_page: 205
          heading: The Summoner’s Staff
          extraction:
            method: image
            confidence: high
            visually_verified: true
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Level 3 Magic
          locator:
            table: Level 3 Magic
            column: School
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: corrected
        change: character.treasure.legendary.the_summoners_staff.conjuring now compares spell_school with "conjuration" (the spell table School value in lower case, as character.talent.conjurer does), keeps the printed source_text, and links issue.treasure.summoners_staff_conjuring_spell from the rule, the parent rule and the entity.
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
      object_id: character.treasure.legendary.stone_of_valheir.draw
      description: 'PDF 204 still matches the Stone of Valheir rules: up to 3 Focus bonuses at 10 each (10-30), drawn without needing to focus and without increasing miscast risk, combinable with a normal Focus Action, a full turn and a successful Arcane Arts roll per stored bonus or refilled between quests without rolls, and a RES Test on every draw or lose 1 Sanity Point. The draw rule sets no Sanity value; only draw_failed_res sets sanity_lost 1 on a failed RES Test.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 204
          printed_page: 202
          heading: Stone of Valheir
          extraction:
            method: image
            confidence: high
            visually_verified: true
