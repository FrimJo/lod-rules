      section_id: section.appendix_v_treasures.legendary_items
      object_id: term.legendary_item
      description: 'The term.legendary_item definition and the source_text of character.treasure.legendary.general, identify_before_use and never_sold match the second paragraph on PDF 203 word for word; found_once also quotes the PDF 202 selector sentence "Remember that each object may only be found once, unless noted otherwise." The Vial, Ring of Awareness and Legendary Elixir repeat-find notes depend on found_once. The Ring of Awareness initiative count is the number of rings worn in the party, capped at 3, which matches "The party may find more than 1 of these rings and the effect on initiative is cumulative up to a maximum of +3."'
