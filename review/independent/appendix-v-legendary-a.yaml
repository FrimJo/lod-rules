      section_id: section.appendix_v_treasures.legendary_items.stone_of_valheir
      object_id: character.treasure.legendary.stone_of_valheir.draw
      description: Re-check of the open finding in review.appendix_v_legendary_a.1. PDF 204 prints "every time the wizard draws a Focus bonus from it, he or she must pass a RES Test, or lose 1 Sanity Point." The draw rule no longer declares res_test_passed or sanity_lost and sets no Sanity value. It now requires at least 1 stored bonus, decrements the store by 1, and sets needs_to_focus false and increases_miscast_risk false, which matches "without actually needing to focus" and "does not increase the risk of miscast". Only character.treasure.legendary.stone_of_valheir.draw_failed_res decides the Sanity loss (1 on a failed RES Test), so the two rules no longer write conflicting values. The parent and store rules still match the page (3 bonuses, 10 each up to 30, full turn and successful Arcane Arts roll per stored bonus, refilled between quests without rolls).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 204
          printed_page: 202
          heading: Stone of Valheir
          extraction:
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: corrected
        change: Removed the res_test_passed input and the sanity_lost output and its set effect from character.treasure.legendary.stone_of_valheir.draw, leaving draw_failed_res as the only rule that sets Sanity loss on a draw.
    - kind: modelling_error
      section_id: section.appendix_v_treasures.legendary_items.the_summoners_staff
      object_id: character.treasure.legendary.the_summoners_staff.conjuring
      description: 'PDF 207 prints "Any Conjuring Spell cast while wielding the staff is done at +20 Arcane Arts." The rule fires only when spell_school equals the literal "Conjuring". No spell school has that name. The spell tables print the School column as "Conjuration" (PDF 189: Summon Water Elemental, Summon Wind Elemental), the spell catalogue entities use school: Conjuration, and character.talent.conjurer compares spell_school with "conjuration" (the School value in lower case). As written, the staff bonus never applies to any catalogued spell. The source_text and the +20 value match the page. The "Conjuring"/"Conjuration" wording difference is recorded as issue.treasure.summoners_staff_conjuring_spell.'
