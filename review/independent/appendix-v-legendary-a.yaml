      description: 'I compared the source_text of all 18 item entities (PDF 203–208, the Headsman’s Axe running over PDF 207–208) and every rule quotation with the rendered pages; all match, printed slips kept ("foul hoard", "if it is hit during battle is be destroyed", "and, not in Elven possession is", "gets 1 extra initiative token", "that was with an odd number", "half that roll, RDD passes on"). Typed values match the print: Horn +3 Damage for all heroes until end of battle, 2 Energy, full turn; Bow +5 bloodlust chance cumulative with talents and perks, +5 Damage on that shot; Gauntlets STR +15, no armour slots; Belt CON +20 and goblins gain Hate; Hierophant -15 CS for Undead attackers; Amulet +15 Wisdom; Boots never fall, ignore destabilising effects; Ring of Awareness +1 first-round token, +15 Perception for traps; Cloak +15 Dodge; Priestly Dice +2 luck; Elixir +10 to a random basic stat; Dagger all attacks from behind; Staff +20 Arcane Arts and 1 extra token for summoned elementals or demons; Axe +2 per consecutive damaging hit, reset on a miss or no damage and after each battle; Sword 1d6 extra wounds on an odd hit with no armour save and half the roll rounded down to the closest character other than the wielder, randomised on ties; Hammer stuns on every hit without tests, at most 1 Action lost per turn. Base equipment follows the printed nouns (shortbow, dagger, Greataxe, Longsword, Battlehammer). Selector rows row_1 to row_18 follow the PDF 202 order, section ranges in sections.yaml and the pages.yaml labels for PDF 202–215 match the folios I read, and the item rows (rules and entities extracted, other components not_applicable) fit pages that hold only item descriptions.'
