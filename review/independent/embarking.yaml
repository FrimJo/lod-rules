      object_id: core.quest.first_quests
      description: >-
        source_text is verbatim, but the page calls Spring Cleaning "the first quest of the Rising
        Dead Campaign" while the Quest Book I heading on PDF 224 is "The Dead Rising" (Campaign).
        The dependency binds the pointer to section.quest_book_i.the_dead_rising without recording
