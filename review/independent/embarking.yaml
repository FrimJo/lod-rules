        entry, so a result of 8 yields the literal "Re-roll." rather than a repeated roll; the
        field description says so and test.core.quest.start_settlement.reroll pins it. Acceptable
        while the die is undefined.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
