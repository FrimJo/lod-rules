        3 Windfair, 4 Whiteport, 5 Rochdale, 6 Coalfell, 7 Freyfell, 8 Re-roll. (with the printed
        full stop). Spellings, numbering, order, roll_domain 1-8 and source_text all match. The
        table name "Start settlement" is editorial (the list has no caption), which is acceptable.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
