        57 (matches pages.yaml), heading "Embarking on your First Quest". source_text "When you
        start the game, you should randomise what settlement the party is in. The eligible ones
        are:" is word for word the opening of the left column, and condition.source_text "When you
        start the game" is a verbatim prefix of that sentence. The binding direction (consumer
        procedure.quest_acceptance, field settlement, supplied by core.quest.start_settlement
        output settlement) is a fair reading for the moment the game starts: PDF 59 puts the party
        "in" the randomised settlement, and Taking on Quests (PDF 132, printed 130) lets the party
        take quests "Whenever the party is in a settlement", so at game start the current
        settlement is the start settlement. The right column of PDF 59 ("If you choose a quest that
        takes place in your start settlement...") gives further support that the first quest is
        chosen there; the extraction side may optionally add it to source_text, but this is not
        required.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Taking on Quests
      disposition:
        status: no_change_needed
    - kind: modelling_error
      section_id: section.embarking_on_your_first_quest
      object_id: edge.quest.start_settlement.first_acceptance
      description: >-
        The edge's id and name ("the start settlement is the first quest acceptance's settlement")
        claim more than the printed condition and the book support. The book itself prints cases
        in which the first acceptance happens elsewhere: "If none of the quests are interesting to
        the party, they must move to another settlement to find new ones." (Available quests, PDF
        133, printed 131) and "The party may reject 2 quests in a village and 3 quests in Silver
        City before they must move to another settlement to find a new quest." (Rejecting a Quest,
        PDF 132, printed 130). A party that rejects its start offers makes its first acceptance in
        another settlement, where the binding would be wrong. The edge carries only the printed
        condition "When you start the game"; the limit that issue.embarking.first_quest_settlement_travel
        says the corpus applies ("only while the party has not left the start settlement") appears
        nowhere on the edge record. Separately, the bound output can be the literal entry "Re-roll."
        (row 8), which is not a settlement; the edge does not say that only a final, non-re-roll
        result supplies the acceptance's settlement. Nothing here invents a rule, but the
        name overstates the scope.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Rejecting a Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests
      disposition:
        status: open
        proposed_correction: >-
          Keep the id stable, but reword name to state the printed scope, e.g. "the start
          settlement is the quest acceptance's settlement when the game starts", and record the
          structural limit on the edge itself (for example an unresolved_references note marked
          as a structural reading, not printed text): the binding holds only while the party is
          still in the start settlement it was given at game start, and only for a final result
          (an 8, "Re-roll.", is rolled again and supplies no settlement). Rejecting a Quest (PDF
          132) and Available quests (PDF 133) can move the party before its first acceptance; a
          later acceptance takes its settlement from the party's current settlement, not from
          this edge.
    - kind: modelling_error
      section_id: section.embarking_on_your_first_quest
      object_id: issue.embarking.first_quest_settlement_travel
      description: >-
        The issue's quotation and source (PDF 59, printed 57) are correct, and its question is
        genuine: the book does not say whether the party may leave the start settlement of its own
        accord before taking a first quest, nor whether the arrival steps for entering a settlement
        (Settlement Events "Whenever the party enters a settlement", PDF 132; the 1d6 available
        quests roll, PDF 133) apply to the start settlement at game start. But the wording is
        not accurate as written. (1) "The book does not say whether the party may travel ...
        before it accepts its first quest" is too broad: PDF 132 and 133 print that the party must
        move to another settlement after 2 rejections in a village (3 in Silver City) or when
        none of the quests interest it, so travel before the first acceptance is printed in
        those cases. The issue cites only PDF 59 and omits these pages. (2) The last sentence
        says the corpus binds the start settlement "only while the party has not left the start
        settlement", but the related edge states only the printed condition "When you start
        the game" and a name scoped to the "first quest acceptance"; the issue describes a
        limit that the corpus does not hold. Otherwise the issue is neutral and resolves
        nothing.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 132
          printed_page: 130
          heading: Settlement Events
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: Available quests
      disposition:
        status: open
        proposed_correction: >-
          Narrow the summary to what the book leaves open: whether the party may voluntarily travel
          before its first quest when quests are on offer, and whether the start settlement counts as
          entered (Settlement Events roll, available-quests roll) at game start. Acknowledge that
          Rejecting a Quest (PDF 132) and Available quests (PDF 133) require a move after the
          printed rejections or when no quest interests the party, and add PDF 132 (printed 130)
          and PDF 133 (printed 131) to source. Make the final sentence match whatever the edge
          finally records (see the edge finding), so that the issue and the edge describe the
          same limit. Keep status unresolved.
