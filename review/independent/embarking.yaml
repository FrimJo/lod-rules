        in. The eligible ones are:" followed by the eight numbered entries; no die is named anywhere
        on PDF 59. The issue correctly records this rather than assuming a d8.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 59
          printed_page: 57
          heading: Embarking on your First Quest
