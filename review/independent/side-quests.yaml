  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:9deedf12d19ffb3a4896801451963a2367fa131915d20bc473ed66711aaaf3e2
  findings:
    - kind: modelling_error
      section_id: section.buying_an_estate.side_quest_the_grieving_mother
      object_id: core.quest.grieving_mother.reading
      description: 'Re-check of review.side_quests.1 finding 1. PDF 165 prints "Read the next paragraph only after the first turn of combat!". core.quest.grieving_mother.reading no longer has a door_slam_text_readable effect: it only sets initial_text_readable from quest_triggered and read_one_section_at_a_time true. The door-slam permission is set only by core.quest.grieving_mother.reading_door_slam (quest triggered and first turn finished), so the two rules no longer set the field to opposite values.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: 'Entering the Side Objective Room'
      disposition:
        status: corrected
        change: Removed the door_slam_text_readable false effect from core.quest.grieving_mother.reading; only core.quest.grieving_mother.reading_door_slam sets that permission.
    - kind: modelling_error
      section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
      object_id: core.quest.manhunt.bandit_xp_loot
      description: 'Re-check of review.side_quests.1 finding 2. PDF 278 prints The Bandit (battle-axe, shield, Armour 3) and the ten-cell profile with no XP or Loot; changelog PDF 17 entry 111 answers "XP 250, Loot T4", marked Fixed. The implementation follows "Official rulings": table.quest.manhunt.bandit_statistics keeps exactly the printed cells (60, -, 45, 35, -; -10, 0, 4, 15, 0) with nothing added; the new rule core.quest.manhunt.bandit_xp_loot cites both PDF 278 and changelog PDF 17 row 111, quotes only printed text verbatim ("The Bandit is equipped with a battle-axe and a shield. He has Armour 3."), and sets xp 250 and treasure_table T4 (dependency table.treasure.t4); it is linked from quest_actor.side.manhunt_bandit. issue.quest.manhunt_bandit_xp_loot is resolved with a resolution citing entry 111, consistent with how entry 143 is applied in character.background.revenge_minotaur.reward. Entry 112 (no values) correctly stays open as issue.quest.manhunt_bandit_profile_card, and both Manhunt coverage notes say so.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 278
          printed_page: 276
          heading: 'The Bandit'
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 17
          printed_page: null
          heading: '2.21'
          locator:
            row: 111
      disposition:
        status: corrected
        change: Added core.quest.manhunt.bandit_xp_loot (XP 250, T4, citing PDF 278 and changelog 2.21 entry 111), kept table.quest.manhunt.bandit_statistics as printed, resolved issue.quest.manhunt_bandit_xp_loot citing entry 111.
    - kind: uncertainty_not_recorded
      section_id: section.buying_an_estate.side_quest_the_grieving_mother
      object_id: core.quest.grieving_mother.door_access
      description: 'Re-check of review.side_quests.1 finding 3. PDF 165 says the door "cannot be opened from the inside until the spiders are dead" and names opening the lock or beating down the door only for the outside. issue.quest.grieving_mother_slammed_door_inside is unresolved and is linked from core.quest.grieving_mother.door_slam, .door_access and .door_access_blocked, so a reader of the inside-after-spiders branch of door_access sees the open question.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: 'Entering the Side Objective Room'
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.grieving_mother_slammed_door_inside
    - kind: modelling_error
      section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch
