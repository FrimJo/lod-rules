  findings:
    - kind: ok_with_note
      section_id: section.quest_book_i.side_quests
      object_id: issue.quest.side_quest_availability
      description: 'Re-check of the only object changed since review.side_quests.2. PDF 133 (printed 131) Available quests prints "If there is a quest available, then roll 1d8. On a result of 1-2 on the d8, a side quest is available as well and may be taken together with any of the other quests. See page 271."; PDF 273 (printed 271) Side Quests prints "The heroes may choose to accept a Side Quest at any time during their stay in the city ... Either you roll on the table, or you work your way through them one by one." The revised summary quotes both faithfully, and its three doubts (d8 needed for a stay-time choice, whether "the city" is Silver City only, whether a started but unfinished side quest counts as worked through) plus the new one (no order stated for "one by one") are genuine silences of the page. The summary''s description of procedure.side_quest_selection is accurate: offer_basis accepts arrival_d8 or stay_choice, step stay_choice_unresolved returns this issue for stay_choice or no arrival result, and next_in_order looks up table.quest.side_quests.selector at side_quests_worked + 1 (printed table order 1-6). The added related link state_machine.quest_dungeon resolves and that machine''s side_quest_available field cites this issue. Both sources carry correct page labels per pages.yaml (133/131, 273/271).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 133
          printed_page: 131
          heading: 'Available quests'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 273
          printed_page: 271
          heading: 'Side Quests'
      disposition:
        status: no_change_needed
    - kind: transcription_error
      section_id: section.quest_book_i.side_quests
      object_id: issue.quest.side_quest_availability
      description: 'Re-check of the carry-over noted in review.side_quests.2 (remaining part of review.side_quests.1 finding 6). The summary now reads "Available quests (PDF 133)" and "(PDF 273, printed 271)" with the spaces restored; the glued "PDF133"/"PDF273" text is gone.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 273
          printed_page: 271
          heading: 'Side Quests'
      disposition:
        status: corrected
        change: Restored the spaces in the PDF page references of the issue.quest.side_quest_availability summary.
    - kind: ok_with_note
      section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
      description: 'Spot re-read of every page in scope (PDF 164-165, 273-279). Objects other than issue.quest.side_quest_availability are unchanged since review.side_quests.2; sampled values still match the page (Slay the Beast d10 bets 300-800 c, Mapmaker DEX 25 RES 35 To hit -5 M 4 HP 10 Dodge 45, Go Fetch! d6 1-3/4-5/6 and Heater Shield DEF 6 ENC 4, Manhunt Bandit 60/-/45/35/- and -10/0/4/15/0 with reward 250 c, Mushrooms potion 2d6 HP, Grieving Mother door locked as Door Table 10). No new error found.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 278
          printed_page: 276
          heading: 'Side Quest 5: Manhunt'
      disposition:
        status: no_change_needed
  outcome: passed_with_corrections
  summary: Re-review after the Phase 9 uncertainty audit changed issue.quest.side_quest_availability. The revised summary matches PDF 133 and PDF 273, states genuine silences (stay-time d8, "the city", unfinished side quests, unstated order for one by one), describes procedure.side_quest_selection accurately, and the glued page references flagged earlier are fixed. All pages in scope re-read; no open finding.
