  findings:
    - kind: modelling_error
      section_id: section.buying_an_estate.side_quest_the_grieving_mother
      object_id: core.quest.grieving_mother.reading
      description: core.quest.grieving_mother.reading has no `when` and always sets door_slam_text_readable to false, while core.quest.grieving_mother.reading_door_slam sets the same field to true once the quest is triggered and the first turn of combat is finished. After the first turn both rules fire and give conflicting values; the page only forbids reading the door-slam paragraph before the first turn of combat ("Read the next paragraph only after the first turn of combat!").
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: 'Entering the Side Objective Room'
      disposition:
        status: open
        proposed_correction: In core.quest.grieving_mother.reading, guard the door_slam_text_readable false effect with first_turn_finished == false (or remove that effect and leave the permission to reading_door_slam), so the two rules never set the field to opposite values in the same state.
    - kind: modelling_error
      section_id: section.quest_book_i.side_quests.side_quest_5_manhunt
      object_id: issue.quest.manhunt_bandit_xp_loot
      description: 'PDF 278 prints The Bandit with no XP or Loot. Changelog 2.21 entry 111 (changelog PDF 17) reports exactly that gap and its answer column states a value, "XP 250, Loot T4", marked Fixed. The "Official rulings" policy treats only a ruling "marked Fixed without a stated rule" as settling nothing; #111 states its rule, and its issue is rulebook_undefined, so recording it as "not applied" because it "adds data this printing does not print" is not a policy exception. #112 (no values) is correctly not applied, and #110 (Mapmaker, no values) is correctly not applied.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 278
          printed_page: 276
          heading: The Bandit
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 17
          printed_page: null
          heading: '2.21'
          locator:
            row: 111
      disposition:
        status: open
        proposed_correction: Apply #111 as a published ruling. Keep table.quest.manhunt.bandit_statistics and all source_text verbatim. Give The Bandit XP 250 and Loot T4 as ruling-sourced effects (for example on core.quest.manhunt.profile or a new core.quest.manhunt rule tied to quest_actor.side.manhunt_bandit) citing both PDF 278 and changelog PDF 17 row 111. Mark the XP/Loot part of issue.quest.manhunt_bandit_xp_loot settled (resolved with a resolution citing #111, or kept unresolved with #111 as partial if the #112 card-profile part is left open), and update review/designer-published-rulings.md and the Manhunt coverage notes to match.
    - kind: uncertainty_not_recorded
      section_id: section.buying_an_estate.side_quest_the_grieving_mother
      object_id: core.quest.grieving_mother.door_access
      description: 'core.quest.grieving_mother.door_access lets the heroes inside open the slammed door as soon as the spiders are dead, with no lock step. The page says the door "is now locked as though you had rolled 10 on the Door Table and cannot be opened from the inside until the spiders are dead", and names opening the lock or beating down the door only for the outside. Whether the door is still locked (Pick lock -20, HP 25) for the heroes inside after the spiders die is not stated, and the corpus picked one reading without recording it.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 165
          printed_page: 163
          heading: 'Entering the Side Objective Room'
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.grieving_mother_slammed_door_inside
    - kind: modelling_error
      section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch
      object_id: equipment.quest.go_fetch_shield
      description: 'PDF 277 says "The shield is a standard Heater Shield (DEF 6, ENC 4)". equipment.quest.go_fetch_shield has category general, although the corpus has a shield category used by the Heater Shield catalogue entry. Likewise equipment.quest.mushrooms_healing_potion (PDF 279, "heals 2d6 HP once consumed") is general, although quest potions such as the Kraghul antidotes use consumable.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 277
          printed_page: 275
          heading: 'The Objective Room'
      disposition:
        status: open
        proposed_correction: Set equipment.quest.go_fetch_shield category to shield and equipment.quest.mushrooms_healing_potion category to consumable.
    - kind: source_reference_error
      section_id: section.quest_book_i.side_quests.side_quest_4_go_fetch.table_shield_condition
      description: 'The 1d6 / Result table on PDF 277 has no caption. The sections.yaml node is titled "Go Fetch shield condition" with no note, while the sibling uncaptioned-table nodes (Side Quests table, Slay the beast! table, Manhunt table) say that the book prints no caption and the title is supplied.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 277
          printed_page: 275
          heading: 'The Objective Room'
      disposition:
        status: open
        proposed_correction: 'Add a sections.yaml note to section.quest_book_i.side_quests.side_quest_4_go_fetch.table_shield_condition: "The book prints no caption for this table; it sits under The Objective Room and the title is supplied."'
    - kind: transcription_error
      section_id: section.quest_book_i.side_quests
      object_id: issue.quest.mushrooms_boundaries
      description: 'Several related issue summaries have missing spaces between words and numbers: issue.quest.mushrooms_boundaries ("Reward250c", "its2d6HP"), issue.quest.manhunt_proof_boundary ("Reward250c"), issue.quest.slay_beast_boundaries ("PDF276") and issue.quest.side_quest_availability ("PDF133", "PDF273"; that issue is frozen). The pages print "Reward: 250 c." and "heals 2d6 HP".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 279
          printed_page: 277
          heading: 'Reward:'
      disposition:
        status: open
        proposed_correction: 'Restore the spaces: "Reward 250 c", "its 2d6 HP", "PDF 276", "PDF 133", "PDF 273" in those four issue summaries (issue.quest.side_quest_availability is frozen; the change makes its earlier record stale).'
    - kind: ok_with_note
      section_id: section.quest_book_i.side_quests.side_quest_2_slay_the_beast
      object_id: core.quest.slay_beast.deck
      description: 'Side Quest 2 prints "Add Side Quest 1 card to the pile." on PDF 275. The corpus keeps the printed number and records the mismatch rather than changing it to 2.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 275
          printed_page: 273
          heading: 'Special rules:'
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.slay_beast_boundaries
    - kind: ok_with_note
      section_id: section.quest_book_i.side_quests.side_quest_3_the_mapmaker.table_the_mapmaker
      object_id: table.quest.mapmaker.statistics
      description: 'Every cell of The Mapmaker profile matches PDF 276 (CS -, RS -, DEX 25, RES 35, DMG/NA -; To hit -5, Luck 0, M 4, HP 10, Energy 0; Skills Dodge (45)). Changelog 2.21 #110 states no values, so it is correctly recorded and not applied.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 276
          printed_page: 274
          heading: 'The Mapmaker'
      disposition:
        status: recorded_as_issue
        issue_id: issue.quest.mapmaker_profile_card
    - kind: ok_with_note
      section_id: section.quest_book_i.side_quests
      description: 'Checked line by line on PDF 273-279 and 164-165: every Quest Location, Special Rules, Reward (100 c per hero; See the table; 500 c; 350 c; 250 c; 250 c; As told in the aftermath), Encounters, Objective room and Aftermath heading; the 1d6 Side Quests table, the 1d10 Monster/Bet table (six rows, eighteen cells), the Go Fetch 1d6 table (1d4 wear typed by core.quest.go_fetch.wear), the Bandit profile (60, -, 45, 35, -; -10, 0, 4, 15, 0, verified on an enlarged crop), the 1d2 Giant spiders, ENC 8, Door Table 10, Ghostly Event #8 and the +2 DMG Longsword. All quest mechanics are scenario_rule with quest scope; no monster statistics are invented for the Slay the Beast beasts, the giant spiders, the lone fighter or the Encounter Table rolls. The PDF 133 quotation in procedure.side_quest_selection is verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 273
          printed_page: 271
          heading: 'Side Quests'
      disposition:
        status: no_change_needed
  outcome: failed
  summary: Side Quests chapter (PDF 273-279) and the Grieving Mother estate side quest (PDF 164-165), plus the PDF 133 arrival d8 cited by procedure.side_quest_selection, compared object by object with the rendered pages. Transcription of headings, numbers and tables is accurate and quest scoping is correct. Open findings - a conflicting reading-permission effect in the Grieving Mother, changelog #111 (XP 250, Loot T4) not applied despite stating its values, two equipment categories, a missing no-caption note and glued text in four issue summaries. One new issue records the unstated inside-unlock rule for the slammed door.
  supporting_evidence:
