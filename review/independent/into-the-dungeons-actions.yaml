  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:cecf680f2a7c8eb6ed0cbb7276e7f8e7c0a3a83a8315e05fa43ac4f5cb976862

  findings:
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: table.dungeon.red_levers
      description:
        'Dice-typing check. The new column damage ("Printed Damage within Event cell", cell_types
        dice and blank) has a cell in every one of the ten rows. Row floor_gives_way (19) holds a
        dice cell printed "1d10" with count 1, sides 10, meaning value; PDF 104 prints "the hero
        takes 1d10 Points of Damage without armour but with NA", so the die, its count and sides
        match exactly. The other nine rows print no damage die and carry blank cells. The event
        text of every row, including row 19, is unchanged and still word for word as printed, and
        the roll ranges 1-11, 12-20 still match the 1d20 column. The column is labelled as derived,
        not as a printed column, which is accurate: PDF 104 prints only "1d20" and "Event".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '19'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: table.dungeon.red_levers
      description:
        'Row defence_system (18) prints "every door is now trapped on a 1d6 of 5-6 instead of the
        normal 6" and keeps a blank damage cell. I judge this correct. The 1d6 is not a new roll the
        row asks for: it is the d6 already rolled together with the 1d10 in step 2 of Opening a Door
        or Chest ("If the d6 ends up a 6, the door or chest is trapped", PDF 101) and in the PDF 102
        flowchart (d6 result 1-5 not trapped, 6 resolve trap). The row widens that threshold from 6
        to 5-6 for the rest of the dungeon. Typing it as a dice cell would wrongly suggest an extra
        roll on activating the lever. The threshold change itself is held only in the text cell; no
        rule or procedure input of procedure.open_door_or_chest models a lowered trap threshold. That
        is the same treatment as the other non-dice effects of the lever rows, and it was accepted
        by record .3, so I propose no change in this unit; if a text-cell dice guard is added, this
        row belongs in its exemption list with the reason "existing door-trap d6, threshold changed
        to 5-6".'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '18'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 102
          printed_page: 100
          heading: Opening a door or a chest
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_5
      object_id: table.dungeon.black_levers
      description:
        'Dice-typing check. The new column potions ("Printed potions within Event cell", dice and
        blank) has a cell in all eight rows. Row dusty_bottles (7) holds a dice cell printed "1d3",
        count 1, sides 3, meaning value, matching "There are 1d3 potions in the compartment" on PDF
        105. The other seven rows print no die and are blank. Every event cell, with its printed line
        breaks, is still verbatim, and the 1d8 roll column 1-8 is unchanged.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 105
          printed_page: 103
          heading: Black Levers
          locator:
            row: '7'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: issue.rest.without_ration
      description:
        'The summary now says the going-hungry penalty is Party Morale lowered by 1 per character,
        mercenaries included, not dogs, under changelog 2.21 entries 148 and 166, superseding entry
        124. I rendered the changelog: entry 124 (page 21) quotes "Party Morale is also lowered by 4"
        with the reply "Minus 4 is correct"; entry 148 (page 23) changes the table row "A character
        is hungry" to "-1/char."; entry 166 (page 25) reads "Page 125 Changed into ''Party Morale is
        also lowered by 1 per character (Mercenaries included, not dogs)''". All three fall under the
        2.21 heading (2.22 starts on page 28), so the citation is accurate. The two quotations from
