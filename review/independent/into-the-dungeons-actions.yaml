      disposition:
        status: recorded_as_issue
        issue_id: issue.door.initial_entrance_trap
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: table.dungeon.red_levers
      description:
        'Checked all ten rows of the captioned Red Levers table (1d20 / Event) on PDF 104 word
        by word: 1-11 rumble, 12 door closed and locked "(as if rolling a 10)" with the trap roll
        still made and no traps on a randomised door, 13 Threat +2, 14 two Exploration Cards on
        every pile, 15 Party Morale -4 and Sanity -1 each, 16 portcullis on all doors "See page
        101", 17 Wandering Monster released (Encounter Table +20, highest XP), 18 doors trapped on
        5-6, 19 pit trap (DEX Test, 1d10 without armour but with NA, rope or DEX Test for 1 AP, PM
        -1, Sanity -2 if fallen), 20 iron cage. Ranges, roll_domain 1-20 and source_row and cells
        agree. The row shading is decorative alternation.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
      disposition: &a1
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_5
      object_id: table.dungeon.black_levers
      description:
        Checked all eight rows of Black Levers (1d8 / Event) on PDF 105. Each keeps its flavour
        line and its effect line, separated as printed, and every word matches, including "you have
        strong feeling" (rows 5 and 8), "don’t place a monster" and "have been changed" (row 1), and
        "doors in the tile opens" / "doors in the room" (row 6). The section id table_5 keeps its
        generated name and its note gives the printed caption.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 105
          printed_page: 103
          heading: Black Levers
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.levers
      object_id: core.lever.deck
      description: Levers, Preparing the Lever Deck and Activating a Lever (PDF 103) are verbatim.
        Optional unless the quest says otherwise; 1 black + 1d4+1 red (red_card_roll bounded 1-4);
        quest event on the black card; 1 AP, not with known enemies on the table; another lever once
        the event is dealt with; the colour selects the table. The open points (lever count against
        deck size, whether drawn cards return) are issue.levers.count_and_deck.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 103
          printed_page: 101
          heading: Levers
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.opening_a_door_or_chest.flowchart
      object_id: procedure.open_door_or_chest
      description: 'Compared the PDF 102 flowchart branch by branch with the procedure. d6 1-5 not
        trapped, 6 resolve trap; d10 1-6 not locked, 7-10 locked (the table''s 0 is typed 10); locked
        leads to pick lock, or to the bash loop (Increase threat +2, Bash, Success? no, repeat),
        handed to procedure.locked_door_and_close. Chest leads to Roll for treasure. Door leads to
        Place tile, Roll for encounter, then yes to Prepare initiative tokens (1 per enemy, 1 per
        hero, talents and perks) and Proceed to combat, or no to Continue turn. The procedure''s
        door_reveal, chest_reveal and enemies steps follow these branches. Differences are the
        chart''s, not the corpus''s: it draws "Roll 1d6 and 1d10" before "Raise threat +1" where
        the prose numbers the Threat increase first (no mechanical effect); its pick-lock arrow has
        no failure branch; and it omits the crowbar, fumble and Closing a door. The coverage note
        says so. procedure.locked_door_and_close matches the Locked and Closing a door prose (1 AP
        and +2 Threat per force attempt, crowbar +1 Threat and 8+DB with the AP cost left to
        issue.phase6.crowbar_action_cost, pick 2 AP with no further Threat, failed pick breaks,
        fumble jams).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 102
          printed_page: 100
          heading: Opening a door or a chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.healing
      object_id: core.healing.bandage_adjacent_hero
      description:
        'Healing (PDF 100) is verbatim across three rules: 1 AP with a bandage in a Quick Slot
        on an adjacent hero, not with enemies adjacent, wounded hero loses 1 AP; self-bandage 2 AP
        only with no visible enemies; single use whatever the outcome. Whose adjacency counts is
        issue.healing.enemies_adjacent_scope. The self-bandage rule adds no Quick Slot requirement,
        and the page prints none for it.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Healing
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.identifying_items_and_potions
      object_id: core.identify.when_found
      description:
        'Identifying Items and Potions (PDF 100) is verbatim: identify before use; as soon as
        found, by the person with the highest skill, no passing around, no action. "page 68" and
        "page 70" point to section.magic_items.identifying and section.alchemy.identifying_potions
        as dependencies.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Identifying Items and Potions
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.dungeon_events_optional_rule
      object_id: issue.dungeon_events.table_not_printed
      description:
        Confirmed on PDF 107 that the d12 table with a 1d6 column is not printed after the rule
        (the page ends with the rule; PDF 108 is the Treasure chapter). core.dungeon_event.resolve
        returns unresolved and no table is invented. Trigger wording (rooms with no encounters,
        never an Objective Room, first activation starting in a new room not a corridor, 9-10 on
        1d10, one event per room) matches.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Dungeon events (optional rule)
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.initiative
      object_id: issue.initiative.named_large_token_stacking
      description: Verified the rulings myself. The official FAQ answers "Large creatures get +1
        Initiative tokens and so do named monsters. Do they stack?" with "Yes!". Changelog 2.21
        entry 159 (changelog PDF page 24, Fixed) reads "Page 104, Changed layout of page to add in
        'Named Monsters', If the Named Monster is also Large than a total of 3 tokens are added."
        PDF 106 prints no Large token and the Bestiary is not present. The issue therefore takes the
        FAQ as a partial settlement, stays unresolved, and procedure.initiative adds
        named_monsters_alive on top of supplied_enemy_bonus without inventing a Large token, as
        "Official rulings" requires. procedure.initiative otherwise matches Setup, Bashing Down
        Doors (+2 on the first turn), Perfect Hearing (one optional token, first turn after a door
        encounter, none if both sides have it), Named Monsters (one per living named monster, no
        extra actions) and Overwatch withholding.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 106
          printed_page: 104
          heading: Named Monsters
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 159
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: issue.phase4.short_rest_morale
      description:
        Changelog 2.21 entry 39 (changelog PDF page 4) quotes the +1 table entry and the +2
        Rest text and answers "+2 is correct". The resolution and procedure.rest increase_morale
        (min(start value, morale + 2)) apply it. Changelog entry 124 (changelog PDF page 21, "Minus
        4 is correct" for going hungry) concerns Rations and resting in the travelling rules; the
        dungeon Rest prints no hunger penalty and the corpus applies none here. The resolution-less
        part is issue.rest.without_ration. The frozen issue's summary still describes the pre-ruling
        handling ("return an unresolved outcome"); the resolution supersedes it, so no change is
        proposed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 4
          printed_page: null
          heading: '2.21'
          locator:
            row: 39
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
            row: 124
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description:
        "Rest paragraph and the eleven-point checklist (PDF 100) match the steps: eligibility
        (no enemies on the tile or adjacent tiles, all on one tile), arrange, optional bar door,
        ration, gear, three Wandering Monster moves, interruption leading to battle with the bold
        points still done, then +2 morale, HP 1d6, energy 1-3 on 1d6 per lost point (the checklist's
        50%), mana, brewing and the ambush roll min(70, 5 + Threat + 10 x (rests_taken - 1)). On an
        ambush, 3 extra enemy tokens, or normal tokens behind a barred door. The recovery rules and
        the per-hero procedures are verbatim. The bleeding/poison checks and their timing
        (issue.rest.condition_check_timing) match the Bleeding Out and Poisoned Characters run-in."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Checklist when Resting
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Bleeding Out and Poisoned Characters
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.encounters
      object_id: procedure.encounters
      description:
        Encounters and Placing Enemies (PDF 106) are verbatim. Room 01-50, corridor 01-30, +10
        after 4 consecutive empty tiles until an encounter (max 70%; the streak increment is
        issue.phase6.encounter_streak), room-description modifiers, "the turns end immediately",
        Bestiary faction table on 1d20 +10 per level above 1 of the highest-level character
        (external, supplied), and the placement constraints. The margin marks "92" on PDF 106 are
        printer artefacts with no content.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 106
          printed_page: 104
          heading: Encounters
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 106
          printed_page: 104
          heading: Placing Enemies
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.overwatch
      object_id: procedure.overwatch
      description:
        'Overwatch and its two run-ins (PDF 107) are verbatim and typed: after the first battle
        turn when all tokens are drawn; loaded Ranged Weapon or Hand Weapon ready; no token; ranged
        pause-and-fire for 1 Energy Point, Perks and Talents but no aiming, then reload or idle;
        close-combat Standard Strike for 1 Energy Point on entering or moving within ZOC, a hit
        cancels a charge, a miss means the charge automatically hits. "battle" and "Standard Strike"
        are kept as printed. term.overwatch quotes the definition paragraph.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Overwatch
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.activation
      object_id: procedure.activation
      description:
        "Activation and Activation of Enemies (PDF 107) are verbatim: blind draw (or turn a
        card), a hero token activates a chosen hero, an enemy token goes through
        procedure.enemy_priority, one token and one activation per model, and tokens of models alive
        and not knocked out return. The spell exceptions cite PDF 189-191. I did not render those
        pages; they belong to the Magic chapter's review."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Activation
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.opening_a_portcullis
      object_id: procedure.open_portcullis
      description:
        'Opening a Portcullis (PDF 103) is matched: STR Test while adjacent, +10 for a hero in
        the other adjacent slot (bounded 0-1), +10 for each of up to two heroes on the other side
        (bounded 0-2), 1 AP per try, unlimited retries, Threat +1 on a failure.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 103
          printed_page: 101
          heading: Opening a Portcullis
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.cobweb_covered_openings
      object_id: core.cobweb_opening.clearing
      description:
        'Cobweb Covered Openings (PDF 103) is verbatim across three rules: placed and block
        movement like a door; passed only by attacking with a weapon or a torch, 2 AP, automatic
        success, Threat +1 and 1d10; 9-10 places 1d2 Giant Spiders on the tile being left or
        entered, each placed by its own roll. Giant Spider statistics are left to the Bestiary (not
        present).'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 103
          printed_page: 101
          heading: Cobweb Covered Openings
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.picking_things_up
      object_id: test.core.searching.arranging_found_items.belleck_leather_cap
      description: The source fixture quotes the printed Belleck example word for word, and its
        expectation (no extra AP for arranging) matches. core.searching.arranging_found_items and
        core.searching.pick_up_dropped_weapon ("outside of combat", 1 AP, no DEX roll) are verbatim.
        The word combat is kept, not replaced by battle.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Picking Things Up
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons.searching_furniture
      object_id: procedure.search_furniture
      description: 'Searching Furniture, Searching through a Room or Corridor and Searching Corpses
        (Hardcore and Streamlined Mode) on PDF 99 are verbatim and typed: one action next to the
        furniture, no roll, Furniture Table, once only, not with enemies in LOS; the room search
        takes the entire turn, uses a Perception Roll on the highest PER, adds +10 for one more
        searcher and +5 for each further one, once per room; corpses only after the battle, in the
        agreed mode, hardcore adjacent at 1 AP, streamlined free. The chapter III / Appendix V table
        pointer is issue.phase6.furniture_treasure_table_location.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Searching Furniture
      disposition: *a1
    - kind: ok_with_note
      section_id: section.into_the_dungeons
      description:
        'Chapter root: rendered and read every page of its span, PDF 86-107, plus PDF 109 and
        111 (End of Battle and the in-battle search and exchange rules, cited by
        state_machine.battle and needed for the findings above). PDF 86 carries the banner title and
        goes straight into General Dungeon Layout, so the root prints no text of its own, and
        all-not_applicable coverage is correct. The PDF 86-98 content belongs to child sections
        reviewed elsewhere (setup, movement); I checked only that the root claims none of it. The
        Traps in Doors and Chests coverage points to procedure.trap_resolution, which has another
        section_id and is outside this digest; its wording on PDF 101 was read but that procedure
        was not examined.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 86
          printed_page: 84
          heading: Into the Dungeons
      disposition: *a1
  outcome: failed
  summary: 'Reviewed the Into the Dungeons root and its action sections on PDF 99-107: searching,
    gear, identifying, healing, rest, doors and the flowchart, portcullis, cobwebs, levers and both
    lever tables, encounters, initiative, activation, overwatch and dungeon events. All 152 examined
    objects were checked against rendered pages. The tables, the flowchart branches and the
    Initiative FAQ/changelog 159 handling are correct. Seven open findings: dungeon events not gated
    as optional, gear rules missing the "In between battles" scope, the ambush starting posture
    untyped, changelog 155 not cited on issue.phase6.door_open_threat_source, a missing PDF 89
    source and a paraphrase in state_machine.battle, an en-dash source_row in the door table, and a
    misnamed search fixture. Three unrecorded uncertainties are now issues.'
