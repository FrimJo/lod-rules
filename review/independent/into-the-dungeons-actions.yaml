  findings:
    - kind: modelling_error
      section_id: section.into_the_dungeons.table_red_levers
      object_id: core.lever.red.floor_gives_way.climb_out_without_rope
      description: 'Verified the correction of the open finding of record .5. Both getting-up rules
        core.lever.red.floor_gives_way.climb_out_with_rope and .climb_out_without_rope are now
        "type: calculation", the same type as the general Climbing Pits rules
        core.movement.pit.up_without_rope / up_with_rope, and neither carries an overrides edge, so
        the corpus no longer takes a side on issue.lever.floor_gives_way_pit_exit. Nothing else in
        the two rules changed: source_text "To get up, the hero must use a rope or succeed with a
        DEX Test. Both alternatives take 1 AP." is verbatim from row 19 on PDF 104; with a rope
        ap_cost 1 and no DEX Test, without a rope ap_cost 1 and a DEX Test; both still link the
        issue. The digest diff against record .5 shows only these two rules and the coverage row of
        section.into_the_dungeons.table_red_levers changed.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '19'
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 93
          printed_page: 91
          heading: Climbing Pits
      disposition:
        status: corrected
        change: 'core.lever.red.floor_gives_way.climb_out_with_rope and .climb_out_without_rope
          changed from type override to type calculation, with no overrides edge and the issue
          link kept, as proposed in record .5.'
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      description: 'Coverage row now records rules: extracted, which is correct: four rules with
        section_id section.into_the_dungeons.table_red_levers exist and are linked from row 19 by
