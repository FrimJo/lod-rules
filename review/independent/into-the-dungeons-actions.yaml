      object_id: issue.lever.floor_gives_way_pit_exit
      description: 'Compared the issue with both pages myself. Row 19 (PDF 104) quote is verbatim.
        Climbing Pits (PDF 93, printed 91) prints "This requires a DEX test and 2 AP. However, if
        your hero or any friend adjacent to the pit has a rope, this is done without the need of a
        DEX Test. Climbing with a rope takes 1 Action."; the issue quotes "a DEX test and 2 AP"
        and "Climbing with a rope takes 1 Action" exactly and paraphrases the adjacent-friend rope
        condition faithfully. The conflict (2 AP vs 1 AP without a rope) is real, and the issue
        lists the open questions (exception or not, adjacent friend''s rope, failed climb test, later
        status of the pit token) without choosing an answer; status unresolved, type conflicting,
        sources at PDF 104/102 and 93/91 correct. Note only: the rope branch differs merely in
        wording ("1 Action" vs "1 AP"), the same Action/AP question raised in
        issue.threat.disarmed_retry; the issue quotes it without calling it a conflict, which is
        fair.'
