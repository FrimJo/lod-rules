  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:1842db146f93161c3a98e206898827f6228a63fc6b491f409ca409c14b33accf
  findings:
    - kind: modelling_error
      section_id: section.into_the_dungeons.dungeon_events_optional_rule
      object_id: core.dungeon_event.trigger_roll
      description: 'The heading prints "Dungeon events (optional rule)", but none of the four
        core.dungeon_event.* rules carries any optional-rule guard: trigger_roll fires whenever
        first_activation_in_new_room is true and the d10 is 9-10, so a consumer applies the rule
        unconditionally. Elsewhere the corpus gates optional rules on an explicit flag
        (advanced_rule_enabled for the bleeding-out advanced rule), and optional_system has no
        dungeon-events value. The optionality is only in the section kind.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Dungeon events (optional rule)
      disposition:
        status: open
        proposed_correction: Add a boolean input such as dungeon_events_rule_in_use to
          core.dungeon_event.trigger_roll, .eligible_room, .once_per_room and .resolve, and make
          each rule's when require it to be true. Add a derived case with the flag false and a 9
          rolled that expects no event.
    - kind: modelling_error
      section_id: section.into_the_dungeons.rearranging_your_gear
      object_id: core.gear.trading
      description:
        'Rearranging your Gear opens with "In between battles, the professional will make sure
        to prepare for the next battle." The two rules have no battle condition. core.gear.trading
        also leaves that framing sentence out of its source_text. Typed as they stand, they would
        let heroes trade in battle with only LOS, at any distance. The Combat chapter''s Exchanging
        Gear (PDF 111) sets different in-battle terms: models not adjacent to an enemy, Quick Slot
        items only, within 4 squares, and no models on the line between them.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Rearranging your Gear
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Exchanging Gear
      disposition:
        status: open
        proposed_correction:
          Add a not-in-battle condition (for example in_battle eq false, citing "In
          between battles") to core.gear.trading and core.gear.backpack_to_quick_slot_or_hands.
          Quote the framing sentence in core.gear.trading's source_text and add see_also to the
          Combat chapter's Exchanging Gear section.
    - kind: modelling_error
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description: The ambushed branch quotes "Randomize one hero that is awake and ready. The other
        heroes start the fight prone." The barred-door branch quotes "all heroes start the fight
        standing up", but both type only enemy_bonus_tokens (3 or 0) and the encounter/initiative
        hand-offs. The prone and standing starting state is printed mechanics that consumers cannot
        read from the effects.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
      disposition:
        status: open
        proposed_correction: In ambushed, type the starting posture with fields such as
          awake_hero_randomised and other_heroes_start_prone = true. In barred_door_defence, set
          other_heroes_start_prone = false. If the posture must stay caller-supplied, say so in
          unresolved_references.
    - kind: source_reference_error
      section_id: section.into_the_dungeons.opening_a_door_or_chest
      object_id: issue.phase6.door_open_threat_source
      description:
        'The issue asks whether "The instant a door or chest is opened" in the Threat list (PDF
        89) and step 1 of Opening a Door or Chest (PDF 101) describe one +1 or two. The issue does
        not cite the published ruling: changelog 2.21 entry 155 (changelog PDF page 24, marked
        Fixed). It reads "Page 88 Changed wording to: The instant a door or chest is checked, or a
        cobweb opening is cleared. (As we agreed that a door (or chest for that matter) can be left
        unlocked but still closed, wording needs changing not to interfere with Threat.)" That ties
        the single +1 to the check, which is step 1. procedure.open_door_or_chest already applies
        exactly one +1 at step 1, so only the issue record is incomplete.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: Increasing Threat Level
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 155
      disposition:
        status: open
        proposed_correction:
          'Add changelog 2.21 entry 155 to the issue sources and, per "Official rulings",
          set status resolved with a resolution that cites it: one +1 when the door or chest is
          checked (step 1); printed source_text unchanged. Cite the ruling on
          procedure.open_door_or_chest step increase_threat.'
    - kind: source_reference_error
      section_id: section.into_the_dungeons.initiative
      object_id: state_machine.battle
      description: The not_in_battle state quotes "If enemies are placed on the table, all remaining
        actions for the heroes are lost and a new turn starts." That sentence is from The Turn (PDF
        89, printed 88), which is not among the record's sources; they cite only PDF 106, 107 and
        109. The battle_active enter action's source_text "Draw tokens until all have been taken and
        all models have been activated." is not verbatim. PDF 107 prints "Continue to draw tokens
        until all have been taken and all models have been activated."
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: The Turn
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Activation
      disposition:
        status: open
        proposed_correction:
          Add a source for PDF 89 / printed 88, heading The Turn, to the state machine
          (and to the not_in_battle state if per-state sources are used). Correct the battle_active
          enter source_text to "Continue to draw tokens until all have been taken and all models
          have been activated."
    - kind: transcription_error
      section_id: section.into_the_dungeons.opening_a_door_or_chest.table
      object_id: table.dungeon.door_chest_difficulty
      description: 'Row open has source_row "1–6 Open –" with en dashes. The page prints "1-6" and a
        plain hyphen "-", as the row''s own cells record (printed 1-6 and -). Every other cell
        matches PDF 101: 7 Locked Pick lock: 0, HP 10; 8 Locked Pick lock: -10, HP 15; 9 Locked Pick
        lock: -15, HP 20; 0 Locked Pick lock: -20, HP 25.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
      disposition:
        status: open
        proposed_correction: Change row open source_row to "1-6 Open -".
    - kind: modelling_error
      section_id: section.into_the_dungeons.searching_through_a_room_or_corridor
      object_id: test.phase6.search_room.with_helpers
      description:
        'The fixture is named "two searching heroes stack +15 on the highest PER", but its
        input helpers: 2 means two heroes besides the first, so three heroes search. The expected
        +15 (+10 for one more hero, +5 for the next) is right for three searchers. Two searchers get
        +10.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Searching through a Room or Corridor
      disposition:
        status: open
        proposed_correction:
          Rename the fixture to "three searching heroes stack +15 on the highest PER"
          (expected values unchanged).
    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.searching_corpses
      object_id: core.searching.corpses
      description:
        Searching Corpses requires that "the battle is over", and Searching Furniture forbids
        searching with enemies in LOS. The Combat chapter (PDF 109 and 111) permits searching
        furniture or a corpse in battle for 2 AP if the object is not adjacent to an enemy. The
        contradiction was not recorded, and the rules follow only the PDF 99 text.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Searching Corpses
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Searching Furniture or a Corpse
      disposition:
        status: recorded_as_issue
        issue_id: issue.searching.in_battle_search_conflict
    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description:
        accept_attempt requires party_rations >= 1, so a party without food cannot rest. The
        book says only that a rest "costs one ration of food". It does not say whether resting
        without one is barred or means going hungry (changelog 2.21 entry 124 confirms the
        going-hungry -4 Party Morale for travelling, not for the dungeon rest).
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
            row: 124
      disposition:
        status: recorded_as_issue
        issue_id: issue.rest.without_ration
    - kind: uncertainty_not_recorded
      section_id: section.into_the_dungeons.opening_a_door_or_chest
      object_id: procedure.open_door_or_chest
      description:
        'For initial_entrance the procedure skips the Threat increase and the Door Table (PDF
        88: "always unlocked and does not increase the Threat Level") but still runs roll_open and
        its trapped substep. The book is silent on traps for the entrance door, and the procedure''s
        reading is not recorded.'
      source:
        - document: rulebook.second_printing.eng
