  findings:
    - kind: ok_with_note
      section_id: section.into_the_dungeons.opening_a_door_or_chest
      object_id: procedure.open_door_or_chest
      description:
        'Fix verified. The unresolved_references entry for the Furniture Treasure Table is
        gone. PDF 101 (printed 99), step 3, prints only "If it is a chest, roll on the Furniture
        Treasure Table to learn what it contains." with no chapter or appendix pointer, and the PDF
        102 (printed 100) flowchart prints "Chest? -> Roll for treasure". The book prints one
        furniture treasure table: Appendix V, "Treasure found in Furniture" (PDF 193, printed 191,
        continuing on the following pages). The name therefore identifies a single target, and the
        dependency furniture_treasure_table (object_id table.treasure.furniture, sourced from PDF
        193-195 under that heading) binds it. issue.phase6.furniture_treasure_table_location stays
        on the record''s issues and relates this procedure. source_text is unchanged and verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 102
          printed_page: 100
          heading: Opening a door or a chest
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 193
          printed_page: 191
          heading: Treasure found in Furniture
      disposition:
        status: corrected
        change:
          Removed the Furniture Treasure Table entry from unresolved_references. The pointer is bound
          through the table.treasure.furniture dependency, and the misdirected appendix stays
          recorded in issue.phase6.furniture_treasure_table_location.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.searching_furniture
      object_id: procedure.search_furniture
      description:
        'Fix verified. The unresolved_references entry is gone. PDF 99 (printed 97), Searching
        Furniture, prints "just go to chapter III: ''Treasures'' and roll on the Furniture Table."
        PDF 108 (printed 106), Treasure, Searching Furniture, prints "roll on the Furniture
        Treasure Table in Appendix III". The only furniture table is Appendix V "Treasure found in
        Furniture" (PDF 193, printed 191: "Check the tables on the following pages for the
        specific furniture you are searching, and then roll 1d10 ..."). Both names resolve to that
        one target. The dependency furniture_table binds table.treasure.furniture and
        section.treasure.searching_furniture. The misdirected chapter/appendix number is a book
        defect, and issue.phase6.furniture_treasure_table_location records it with the quotes as
        printed. source_text keeps the printed "chapter III: ''Treasures''" wording.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Searching Furniture
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 108
          printed_page: 106
          heading: Searching Furniture
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 193
          printed_page: 191
          heading: Treasure found in Furniture
      disposition:
        status: corrected
        change:
          Removed the Furniture Treasure Table entry from unresolved_references. The pointer is bound
          through the furniture_table dependency to table.treasure.furniture, and the misdirection
          stays in issue.phase6.furniture_treasure_table_location.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: issue.phase4.recovery_bounds
      description:
        'Fix verified. PDF 147 (printed 145), Rest and Recuperation, prints "If you cannot
        afford this, only half (RDD) of each stat is regained and 1d6 HP as you sleep in the inn''s
        stable instead." The summary quotes "only half (RDD) of each stat is regained" exactly.
        PDF 16 (printed 14), Abbreviations and Terminology, defines "RDD: Rounded Down." So RDD
        fixes rounding only. Nothing on PDF 147 says whether the half is taken of the maximum or of
        the missing amount, and the summary''s reading is correct. The new related link
        procedure.settlement_activities_and_overnight is the right record: its sources include PDF
        147 Rest and Recuperation, and its steps quote that sentence. PDF 100 (printed 98) Rest
        still prints "the heroes regain all Mana, 1D6 Hit Points" and checklist item 7 "Increase
        HP by 1d6 for each character" with no maximum-HP clamp, so the HP-clamp half of the summary
        still holds. Minor: the issue''s PDF 147 source still has extraction.visually_verified: false
        although the summary now quotes the page. That is provenance bookkeeping only, and no
        reading changes.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Rest and Recuperation
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 16
          printed_page: 14
          heading: Abbreviations and Terminology
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
      disposition:
        status: corrected
        change:
          issue.phase4.recovery_bounds summary now quotes PDF 147 "only half (RDD) of each stat is
          regained" and says RDD settles the rounding but not the base. related adds
          procedure.settlement_activities_and_overnight.
    - kind: ok_with_note
      section_id: section.into_the_dungeons
      description: 'Scope check. For the same 24 section ids, the fresh digest differs from
        review.into_the_dungeons_actions.8 only in issue.phase4.recovery_bounds,
        procedure.open_door_or_chest and procedure.search_furniture, all checked above. The other
        161 examined objects have identical digests and are carried forward on records .8/.7. All
        pages in scope (PDF 86-107, 118) were re-rendered and read, plus PDF 16, 108, 147 and 193
        for the fixes. Spot checks still hold: Door Table rows 1-6 Open, 7/8/9/0 Pick lock
        0/-10/-15/-20 and HP 10/15/20/25 (PDF 101); Red Levers row 19 1d10 damage (PDF 104);
        Activation of Enemies order 1-6 (PDF 118).'
      source:
