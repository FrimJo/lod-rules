  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:6e0dc22fa837086a7b2cb83e21a2540905c21b798f8191ee2d149666678177a5

  findings:
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: issue.rest.without_ration
      description: 'The two added source references are accurate. Changelog 2.2x PDF 23 prints entry
        148 "Changed in table ''A character is hungry'' ''Lack of food is always bad for motivation and
        is cumulative'' ''-1/char.'' (Having more party members, like more mercenaries, adds more
        negativity in the party)", status Fixed; PDF 25 prints entry 166 "Page 125 Changed into
        ''Party Morale is also lowered by 1 per character (Mercenaries included, not dogs)''", status
        Fixed. Both rows sit in the table headed "2.21" that starts on PDF 1; the next heading,
        "2.22", only appears on PDF 28, so heading ''2.21'' and locator rows 148 and 166 are right,
        and the changelog has no printed folio (printed_page null). Entry 124 on PDF 21 is the
        "Party Morale is also lowered by 4" report with comment "Minus 4 is correct", so the summary
        reading that the later entries supersede it is a fair account and stays an unresolved
        issue. The summary and rulebook source (Rest and Checklist when Resting, PDF 100, printed
        98: "This costs one ration of food", "Deduct 1 ration of food from the party.") are
        unchanged and verbatim.'
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 23
          printed_page: null
          heading: '2.21'
          locator:
            row: 148
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 25
          printed_page: null
          heading: '2.21'
          locator:
            row: 166
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.picking_things_up
      object_id: issue.threat.disarmed_retry
      description: 'The added source reference is accurate: PDF 99 is printed 97 (pages.yaml and the
        folio), the heading is "Picking Things Up", and that paragraph prints "Dropped weapons can
        be picked up outside of combat without a DEX roll by spending 1 AP.", which the summary
        paraphrases faithfully. The first source (Threat table in battle, row 7 Disarmed!, PDF 91,
        printed 89) still matches the page: "spending 1 Action doing so" and "spending one AP per
        try", decrease -3. The new reference carries extraction method text with
        visually_verified false; I rendered and read PDF 99, so the extraction side may set method
        image and visually_verified true on it. This is not an error in the reference, so it is
        left as a note rather than an open finding.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Picking Things Up
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 91
          printed_page: 89
          heading: 'If the party is in battle:'
          locator:
            row: '7'
      disposition:
        status: no_change_needed
