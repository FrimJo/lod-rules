  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:fe4ab72c4039982e9008f6cc0cdfb6fb7179c160b7122ac9e0a8960e14bd1d7d
  findings:
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: table.dungeon.red_levers
      description: 'Row floor_gives_way (19) gained rule_refs to the four new row-scoped rules
        core.lever.red.floor_gives_way.{test_passed, test_failed, climb_out_with_rope,
        climb_out_without_rope}; all four exist, all have section_id
        section.into_the_dungeons.table_red_levers and uses_tables table.dungeon.red_levers. Nothing
        else in the table changed: the event cell of row 19 is still word for word as printed on PDF
        104 ("Suddenly, the floor gives way ... lower his Sanity by 2."), and the damage cell stays
        the typed 1d10 accepted by record .4.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '19'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: core.lever.red.floor_gives_way.test_failed
      description: 'Checked test_passed and test_failed against row 19 on PDF 104. test_passed (when
        dex_test_passed true): no fall, pit token placed and hero moved to an adjacent square, PM
        -1, matching "If the test is successful, place a pit token on that square and move the hero
        to an adjacent square ... Lower PM by 1". test_failed (when dex_test_passed false): falls
        into the pit, damage = damage_roll typed as dice count 1 sides 10 (range 1-10),
        armour_applies false, natural_armour_applies true, PM -1, Sanity -2, matching "If it fails,
        the hero takes 1d10 Points of Damage without armour but with NA. ... Lower PM by 1, and if
        the hero falls into the pit, lower his Sanity by 2." The unconditional PM -1 appears in both
        mutually exclusive branches, so it is applied exactly once. Both source_text quotations are
        verbatim with marked ellipses; source points to PDF 104 / printed 102 (confirmed in
        pages.yaml and on the folio), heading "Red Levers", row 19. The phrase "Randomise which
        hero, except for the one pulling the lever" is kept in the field descriptions only, which is
        acceptable.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '19'
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.into_the_dungeons.table_red_levers
      object_id: core.lever.red.floor_gives_way.climb_out_with_rope
      description:
        'Values of the two getting-up rules match the page: source_text "To get up, the hero
        must use a rope or succeed with a DEX Test. Both alternatives take 1 AP." is verbatim; with
        a rope ap_cost 1 and dex_test_required false; without a rope ap_cost 1 and dex_test_required
        true. Both link issue.lever.floor_gives_way_pit_exit. Note only: neither rule conditions on
        the hero having fallen into the pit; that is implicit in "To get up" and harmless while the
        rules are reached only through row 19.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 104
          printed_page: 102
          heading: Red Levers
          locator:
            row: '19'
      disposition:
        status: no_change_needed
    - kind: modelling_error
      section_id: section.into_the_dungeons.table_red_levers
      object_id: core.lever.red.floor_gives_way.climb_out_without_rope
      description: 'Both getting-up rules (climb_out_with_rope and climb_out_without_rope) are typed
        "type: override". That rule type asserts that the row supersedes another rule, which is
        exactly the open question of issue.lever.floor_gives_way_pit_exit (deliberate exception for
        this pit, or should Climbing Pits'' DEX test and 2 AP apply?). The general pit rules they
        would override (core.movement.pit.up_without_rope / up_with_rope, PDF 93) are typed
        "calculation", and no "overrides" edge is given, so the type label is the only place the
        corpus takes a side. The page supports only that row 19 prints its own cost, not that it
        displaces Climbing Pits.'
      source:
