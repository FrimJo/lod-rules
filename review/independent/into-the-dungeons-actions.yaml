  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:bee45d9ddf77eb044ae8280a4447fa8accf6c1df067788d8468aab1da9bfef42
  findings:
    - kind: transcription_error
      section_id: section.into_the_dungeons.initiative
      object_id: state_machine.battle
      description:
        'Re-check of record .2''s open finding. The top-level source_text now reads "If enemies
        are placed on the table, all remaining actions for the heroes are lost and a new turn
        starts. ... As soon as enemies are placed on the board these rules are activated. ... Once
        all enemies are dead, you continue the turn with the actions your heroes have remaining."
        Each of the three sentences is word for word as printed: The Turn on PDF 89 (printed 88),
        Initiation on PDF 106 (printed 104) and End of Battle on PDF 109 (printed 107). All four
        pages are among the state machine''s sources. The editorial summary ("Structural reading,
        not printed text: ...") now sits in unresolved_references, where it is clearly marked as not
        printed. States, transitions and their quotations are unchanged from record .2, and I
        re-read them against PDF 89, 106, 107 and 109. They are verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: The Turn
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 106
          printed_page: 104
          heading: Initiation
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: End of Battle
      disposition:
        status: corrected
        change: Top-level source_text replaced with three printed sentences joined by "..."; the
          structural summary moved to unresolved_references.
    - kind: transcription_error
      section_id: section.into_the_dungeons.activation
      object_id: procedure.activation
      description: 'Re-check of record .2''s open finding. I rendered PDF 189-191 again myself. Step
        time_freeze now quotes "All heroes that have acted may immediately put activation tokens
        back in the bag. They may act again as if it is a new turn. This spell may only be cast once
        during a battle." It matches the Time Freeze row on PDF 191 (printed 189); the page''s double
        space after "bag." is typography. Step controlled quotes "It still retains its monster
        activation token and when activated, the wizard may decide its actions.", the fourth
        sentence of the Control Undead row on PDF 189 (printed 187). Step held quotes the whole
        Hold Creature row on PDF 190 (printed 188) word for word. Each step now has its own
        step-level source with the right PDF page, printed page and spell-name heading. The when
        conditions and effects (time_freeze_used, controller wizard, can_move_or_fight false on a
        failed hold RES) are unchanged and still agree with the printed spells.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Control Undead
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Hold Creature
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 191
          printed_page: 189
          heading: Time Freeze
      disposition:
        status: corrected
        change: Steps time_freeze, controlled and held now quote the printed spell text and carry
          step-level sources for PDF 191, 189 and 190.
    - kind: transcription_error
      section_id: section.into_the_dungeons.searching_through_a_room_or_corridor
      object_id: procedure.search_room_or_corridor
      description:
        'Re-check of record .2''s open finding. Step treasure_handoff now quotes "Roll on this
        table to see if the party has discovered anything of interest when searching a tile." This
        is the first sentence under Treasure found in Rooms and Corridors on PDF 193 (printed 191),
        which the step cites. The successful-search framing is only in the step''s when
        (search_succeeded true), and the effect (invoke treasure) is unchanged. The page''s next
        sentence (+10 when searching corridors) belongs to the Treasure chapter''s table and is not
        part of this step.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 193
          printed_page: 191
          heading: Treasure found in Rooms and Corridors
      disposition:
        status: corrected
        change: treasure_handoff source_text replaced with the printed first sentence of PDF 193.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description:
        'Fresh check of every procedure and state-machine source_text for paraphrase. I found
        none, but three step quotations cut a printed sentence without marking the cut with "...".
        procedure.rest step check_eligibility ends "This costs one ration of food." where PDF 100
        continues "... and you may freely arrange the heroes ...". In procedure.open_door_or_chest,
