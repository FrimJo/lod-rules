  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:1f6b8de4752638b8a8b8830f0fa63030f6069df756218bb1aba0d8f574c5cf6c
  findings:
    - kind: modelling_error
      section_id: section.into_the_dungeons.dungeon_events_optional_rule
      object_id: core.dungeon_event.trigger_roll
      description:
        'Re-check of record .1''s open finding. PDF 107 prints the heading "Dungeon events
        (optional rule)". All four core.dungeon_event.* rules now carry the boolean input
        dungeon_events_rule_in_use. trigger_roll and resolve require it in an all-condition when;
        eligible_room and once_per_room are gated by a when on it. So with the rule not in use, no
        event fires and no constraint applies. The existing fixtures supply it as true. The new
        derived cases test.core.dungeon_event.trigger_roll.nine_rule_not_in_use (9 rolled, flag
        false: no state, no unresolved) and
        test.core.dungeon_event.eligible_room.objective_room_rule_not_in_use (flag false: no require
        events) expect exactly that. The coverage note names both.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Dungeon events (optional rule)
      disposition:
        status: corrected
        change:
          dungeon_events_rule_in_use input added to the four dungeon-event rules and required by each
          rule's when; two negative derived cases added.
    - kind: modelling_error
      section_id: section.into_the_dungeons.rearranging_your_gear
      object_id: core.gear.trading
      description: Re-check of record .1's open finding. PDF 99 opens Rearranging your Gear with "In
        between battles, the professional will make sure to prepare for the next battle. That may
        include rearranging your gear." Both core.gear.trading and
        core.gear.backpack_to_quick_slot_or_hands now take an in_battle input and apply only when it
        is false. Both source_texts quote the framing sentences verbatim; trading joins them to its
        sentence with "...". Both have see_also to section.combat.different_combat_actions. Its
        pages, PDF 109-112, include Exchanging Gear on PDF 111 (not adjacent to an enemy, Quick Slot
        only, 1 AP for both, within 4 squares, clear line), and the coverage note names
        combat.action.exchange_gear, which resolves. The new derived cases
        test.core.gear.trading.in_battle and
        test.core.gear.backpack_to_quick_slot_or_hands.in_battle expect no effect. The existing
        cases supply in_battle false.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 99
          printed_page: 97
          heading: Rearranging your Gear
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 111
          printed_page: 109
          heading: Exchanging Gear
      disposition:
        status: corrected
        change:
          in_battle false gate, framing sentences in source_text and see_also to the Combat chapter's
          action list added to both gear rules; two in-battle derived cases added.
    - kind: modelling_error
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description:
        'Re-check of record .1''s open finding. PDF 100: "Randomize one hero that is awake and
        ready. The other heroes start the fight prone." and "all heroes start the fight standing
        up". procedure.rest now has the outputs awake_hero_randomised and other_heroes_start_prone.
        Step ambushed sets both true. Step barred_door_defence sets other_heroes_start_prone false
        and enemy_bonus_tokens 0. Fixture test.phase6.rest.ambushed expects true/true with 3 bonus
        tokens. The new test.phase6.rest.ambushed_barred_door expects prone false and 0 tokens, with
        the barred_door_defence step in its trace. ambush_initiative''s source_text, formerly a
        paraphrase, now joins the two printed sentences with "...". The procedure also cites the
        Checklist when Resting run-in heading as a second source.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
      disposition:
        status: corrected
        change: awake_hero_randomised and other_heroes_start_prone outputs typed on the ambushed and
          barred-door branches; barred-door fixture added; ambush_initiative source_text made
          verbatim.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.rest
      object_id: procedure.rest
      description: In the barred-door ambush, awake_hero_randomised stays true (fixture
        test.phase6.rest.ambushed_barred_door), because barred_door_defence does not reset it. The
        barred-door paragraph on PDF 100 says only that "all heroes start the fight standing up" and
        that the monsters have their normal tokens. It does not withdraw "Randomize one hero that is
        awake and ready", and the book gives "awake and ready" no meaning beyond the contrast with
        prone. With other_heroes_start_prone false, a consumer gets the printed outcome (everyone
        standing) either way. This is a reading of the text, not an invention, so no change is
        proposed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 100
          printed_page: 98
          heading: Rest
      disposition:
        status: no_change_needed
    - kind: source_reference_error
      section_id: section.into_the_dungeons.opening_a_door_or_chest
      object_id: issue.phase6.door_open_threat_source
      description:
        'Re-check of record .1''s open finding, with the changelog page rendered again (von
        Braus changelog PDF page 24). Entry 155, marked Fixed, reads: "Page 88 Changed wording to:
        The instant a door or chest is checked, or a cobweb opening is cleared. (As we agreed that a
        door (or chest for that matter) can be left unlocked but still closed, wording needs
        changing not to interfere with Threat.)" It states the rule, so under "Official rulings"
        it settles the issue. The issue now cites it (document vonbraus.changelog_2_2x, pdf_page 24,
        heading 2.21, locator row 155). Its status is resolved, with a resolution that cites the
        entry: a single +1 when the door or chest is checked, which is step 1, with the printed
        "opened" kept verbatim. procedure.open_door_or_chest cites the entry at procedure level
        and on step increase_threat (alongside PDF 101), and the step''s source_text stays "Increase
        the Threat Level by 1.". The step still adds exactly one +1, so no effect changed, as the
        ruling requires. The procedure also gained the PDF 102 flowchart as a source.
        review/designer-published-rulings.md lists the row as applied. "Page 88" in the entry
        matches printed page 88 (PDF 89), where the Threat list is.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: Increasing Threat Level
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 101
          printed_page: 99
          heading: Opening a Door or Chest
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 155
      disposition:
        status: corrected
        change:
          Changelog 2.21 entry 155 added to the issue's sources and resolution (status resolved) and
          cited on procedure.open_door_or_chest and its increase_threat step; printed wording and
          effects unchanged.
    - kind: ok_with_note
      section_id: section.into_the_dungeons.initiative
      object_id: state_machine.battle
      description:
        The other entries on changelog page 24 that touch this unit change wording or layout
        only, so they leave the corpus unchanged. Entry 152 rewords The Turn to "all models on the
        table will act". Entry 153 removes "as long as there are no enemies on the table". Entry 154
        rewords to "As soon as enemies are placed on the table", the sentence the not_in_battle
        state quotes as printed ("If enemies are placed on the table, ..."). Entry 158 rearranges
        printed page 98 with an "Ambush" sub-head. Entry 159 (Named Monsters, Large) stays handled
        as record .1 described. Entries 160-165 (changelog page 25) concern Combat pages 108-120,
        outside this unit.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 24
          printed_page: null
          heading: '2.21'
          locator:
            row: 154
      disposition:
        status: no_change_needed
    - kind: source_reference_error
      section_id: section.into_the_dungeons.initiative
      object_id: state_machine.battle
      description:
        Re-check of record .1's open finding. The state machine now cites PDF 89 (printed 88,
        heading The Turn), the page that prints the not_in_battle state's sentence "If enemies are
        placed on the table, all remaining actions for the heroes are lost and a new turn starts."
        The battle_active enter source_text now reads "Continue to draw tokens until all have been
        taken and all models have been activated.", word for word as on PDF 107.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 89
          printed_page: 88
          heading: The Turn
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 107
          printed_page: 105
          heading: Activation
      disposition:
        status: corrected
        change: PDF 89 The Turn source added; battle_active enter source_text made verbatim.
    - kind: transcription_error
      section_id: section.into_the_dungeons.initiative
      object_id: state_machine.battle
      description:
        'New in this re-review. The top-level source_text is editorial, not printed text: "The
        battle lifecycle spans three chapters. Initiative rules say when the lifecycle starts and
        how activation order is drawn; the turn rules say what happens to the interrupted turn; the
        combat chapter says when the battle ends. State assignments follow the source; no transition
        is invented." None of it appears on PDF 89, 106, 107 or 109. Every state and transition
        quotes the book, so only the summary is affected. The same defect on
        state_machine.quest_dungeon was corrected in the parallel setup unit.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 106
          printed_page: 104
          heading: Initiation
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 109
          printed_page: 107
          heading: End of Battle
      disposition:
        status: open
        proposed_correction:
          Replace the top-level source_text with printed sentences joined by "...", for
          example "If enemies are placed on the table, all remaining actions for the heroes are lost
          and a new turn starts. ... As soon as enemies are placed on the board these rules are
          activated. ... Once all enemies are dead, you continue the turn with the actions your
          heroes have remaining." Move the structural summary to unresolved_references, as was done
          for state_machine.quest_dungeon.
    - kind: transcription_error
      section_id: section.into_the_dungeons.activation
      object_id: procedure.activation
      description:
        'New in this re-review (record .1 did not render the spell pages). The procedure cites
        Control Undead (PDF 189, printed 187), Hold Creature (PDF 190, printed 188) and Time Freeze
        (PDF 191, printed 189). Its spell steps quote editorial paraphrases as source_text, not the
        printed spell text. Step time_freeze: "Time Freeze permits an already-acted hero one new
        activation, then consumes that grant." Step controlled: "Control Undead retains enemy token;
        successful control lets wizard choose actions." Step held: "Hold Creature keeps ordinary
        token and priority. Failed start-of-turn RES prevents moving/fighting." The typed effects
        agree with the printed spells (Time Freeze: heroes that have acted put tokens back and act
        again, once per battle; Control Undead: the undead keeps its monster activation token and
        the wizard decides its actions; Hold Creature: the token goes in the bag as usual and the
        enemy acts in normal order unless held), so only the quotations are wrong.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 189
          printed_page: 187
          heading: Control Undead
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 190
          printed_page: 188
          heading: Hold Creature
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 191
          printed_page: 189
          heading: Time Freeze
      disposition:
        status: open
        proposed_correction:
          'Quote the printed spell text and add a step-level source for each step.
          time_freeze: "All heroes that have acted may immediately put activation tokens back in the
          bag. They may act again as if it is a new turn. This spell may only be cast once during a
          battle." (PDF 191, printed 189, Time Freeze). controlled: "It still retains its monster
          activation token and when activated, the wizard may decide its actions." (PDF 189, printed
          187, Control Undead). held: "The wizard holds an enemy in LOS in its place, making it
          impossible to move or fight. The enemy makes a RES Test at the start of their turn, and if
          successful, it breaks free and acts as normal. The activation token should be added to the
          bag as usual, and the enemy tries to act in the normal order of activation." (PDF 190,
          printed 188, Hold Creature).'
