  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:5c74133084ad3e7e514db9caba13c1be33adc0dac2692a77777913975246ee1c
  findings:
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.treasure_found_in_rooms_and_corridors
      object_id: table.treasure.rooms_corridors
      description:
        'Checked the intro and all seven rows (01-15 to 91-00) of the 1d100 / Finding table on
        an enlarged render: ranges, cell text and punctuation match the page ("4d20 c.", "A mundane
        treasure.", "You’ve sprung a trap! Draw a trap card."). The corridor +10 is typed by
        character.treasure.room_roll.branch_1, the 4d20 by room_roll.row_5 (dice 4d20), the R10
        re-roll by room_secret_door; totals above 100 stay unresolved under
        issue.treasure.corridor_overflow, which is accurate. Row 4 (levers) has no link to the lever
        rules (core.lever.*); not required, as the row prints no mechanic of its own.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 193
          printed_page: 191
          heading: Treasure found in Rooms and Corridors
          locator:
            table: Uncaptioned room and corridor table (1d100, Finding)
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.table
      object_id: table.treasure.furniture
      description:
        'Compared all 35 rows of the Furniture / Findings table (PDF 194 Alchemist Table to
        Fountain, PDF 195 Grate (over a hole) to Well) cell by cell on 4x crops, and the 34 derived
        per-furniture 1d10 tables plus fountain_drink, water_basin_drink and statue_treasure. Every
        range, die expression and printed oddity is kept verbatim: "1d6x10 c" with no full stop,
        "Gemstones worth 2d100 c" with no full stop, "1 Mundane Treasure" (Pottery) with no full
        stop, lower-case "1 Fine treasure." (Coffin), "1 wonderful treasure." / "2 fine treasures."
        (Sarcophagus), "2 Fine treasure, 1 Wonderful Treasure." (Objective Chest), "1d4*100 c" style
        multipliers. Range domains cover 1-10 with no gaps. Water Basin correctly gets no search
        table because the row prints only drinking results. The table and row source_text join the
        intro or column header to the row with "...", and every fragment is verbatim.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 195
          printed_page: 193
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.treasure_found_in_furniture
      description:
        'Every die printed inside a findings cell reaches a typed dice field. Checked 30 rules
        against the printed words: alchemist_table.row_1 (1d3) and row_2 (1d10), altar.row_1 (1d3)
        and row_2 (1d6 x 10 via a multiply), archery_target.row_1 (1d10, with the arrows-or-bolts
        choice), armour_rack.row_1 (1d3 and 1d4), backpack.row_2, bed.row_2, bedroll_with_pack.row_2
        and crate.row_1 (1d100), campfire.row_1 (1d3), drawer.row_2 and rubble.row_1 (2d20),
        fountain.row_2, pottery.row_2 and statue.row_2 (1d20), grate_over_a_hole.row_1 (1d6),
        hearth.row_1 (1d4), mine_cart.row_1 (2d100) and row_2 (1d4, same kind), statue.row_1 (1d6
        nested table 1-2 / 3-6), torture_tools.row_1 (1d3), treasure_pile.row_1-3 (1d4/1d3/1d2 x 100
        plus 1 Wonderful / 2 Fine / 1 Fine), weapons_rack.row_1 (1d4), drink.fountain.heal (1d4+1
        HP, 1 Energy Point), drink.water_basin.heal (1d6+1 HP, all Energy Points), and the two
        disease rules (1d10 9-10 with a failed Alchemical roll). Each when matches its printed
        range. Minor point: energy_restored is a string ("1" / "all") rather than a number; this is
        acceptable because "all" cannot be a number.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 195
          printed_page: 193
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.appendix_v_treasures.treasure_found_in_furniture
      object_id: character.treasure.drink.fountain.disease
      description:
        Fountain 9-10 prints "Make an Alchemical roll. If you fail, you have become diseased.
        If you pass an alchemical roll before drinking, treat this as nothing happens. Only one roll
        is necessary for the entire party." Water Basin 9-10 prints the same with "Only one roll is
        necessary for the entire party. If you pass, nothing happens." The corpus reads "one roll"
        as a single party Alchemical roll checked after a 9-10 result. The book leaves open what
        "one roll" refers to (the Alchemical roll or the 1d10 drinking roll), when the Fountain roll
        is made ("before drinking"), and who becomes diseased. Recorded as a new issue that lists
        the two disease rules and the two drink tables. The extraction side may also list it in
        those objects' issues fields.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
            row: Fountain
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 195
          printed_page: 193
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
            row: Water Basin
      disposition:
        status: recorded_as_issue
        issue_id: issue.treasure.drink_alchemical_roll_scope
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.treasure_found_in_furniture
      object_id: table.treasure.furniture.water_basin_drink
      description:
        'issue.treasure.water_basin_fountain_wording is accurate: the Water Basin row opens
        with "If you choose to drink from the fountain:" and prints no search findings. The text is
        kept as printed and the drinking stays optional (choose_to_drink).
        issue.treasure.armour_rack_durability_scope is accurate too: the page does not say whether
        the 1d4 applies once or to each part, and the corpus types one 1d4 and leaves the question
        open.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 195
          printed_page: 193
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
            row: Water Basin
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
            row: Armour Rack
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.treasure_found_in_furniture
      object_id: table.treasure.furniture.dead_adventurer
      description: 'The Dead Adventurer table cites changelog 2.21 entry 126 ("What armour?", marked
        Fixed, no stated rule). PDF 194 already prints "10: It’s a Zombie, armed with a longsword
        and armour 1.", so there is nothing to apply. The table keeps the printed text, which is
        correct. I rendered the changelog page (changelog PDF 21) to check the entry.'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 194
          printed_page: 192
          heading: Treasure found in Furniture
          locator:
            table: Uncaptioned furniture table (Furniture, Findings)
            row: Dead Adventurer
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_v_treasures.treasure_found_on_defeated_enemies
      object_id: character.treasure.defeated_enemy_tables.t1
      description:
        Tables T1-T5 match the page row by row (T1 five rows, T2 six, T3 six, T4 six, T5 four;
        "Weapon used by the enemy (1d4 DUR loss)", "1d2 potions", "500 c" and so on). The rules
        defeated_enemy_tables.t1-t5 type the printed sentence "Based on what kind of enemy you have
        defeated, consult the tables below see what you have found." (the missing "to" is kept) as a
        table choice keyed by the T1-T5 indicator. Their field note correctly says this page does
        not map enemies to tables, and they link the Treasure chapter rule enemy_loot.branch_N,
        which reads the indicator from the Monster Card. The only dice, 1d4 DUR loss (t1.row_1) and
        1d2 potions (t4.row_3), are typed. The random-spell results on T4 and T5 cite
        issue.treasure.random_spell_selection. This is consistent with the reviewed Treasure
        chapter. Its "The tables can be found on the Quick Reference Sheet" stays an unresolved
        reference there, and that is not a contradiction with this appendix copy.
      source:
