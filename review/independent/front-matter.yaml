      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 2
          printed_page: null
          heading: Ace Backers
      disposition:
        status: open
        proposed_correction: >-
          In the coverage.yaml notes for section.front_matter.ace_backers, replace "one sentence thanking the backers" with "two sentences thanking the backers" (or quote them).
    - kind: ok_with_note
      section_id: section.front_matter.index_of_art.table
      object_id: table.front_matter.index_of_art
      description: >-
        I checked all 64 rows against four-times-enlarged crops of PDF 11 (printed 9), one Page and one Art cell at a time. Left block: Cover through Quest Book Cover, 32 rows. Right block: 191 through Charts compendium cover, 32 rows. Every page cell and art cell matches verbatim, and the rows run in printed order (left block top to bottom, then right block). That includes the printed oddities "Skelton Knight by Foto Costic", "Alchemist`s stove and other objects by Obsidian fantasy" with its backtick and split name, "77-79" printed before "72", "235,240" with no space, "Kirill 13", lowercase "cover" in "Quest Book II cover" and "Charts compendium cover", and "Academical Skills Cover". In "OlgaIngs" the font does not separate capital I from lowercase l; the transcription is a reasonable reading. The source_text "Page Art Page Art" is the printed header row verbatim. The two-column model with a linear row order matches the page, and the coverage note states it. These are art credits, so none of the typos needs a review issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 11
          printed_page: 9
          heading: Index of Art
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.front_matter.index_of_art
      object_id: section.front_matter.index_of_art
      description: >-
        PDF 11 names other books in its Page column: "Bestiary Cover", "Dark Pyramid Cover", "Quest Book II cover" and "Charts compendium cover". The section lists bestiary, charts_compendium, quest_book_ii and dark_pyramid in external_references, and source/manifest.yaml has dark_pyramid with status not_present. Apart from the art credits printed in the table, the corpus holds no content for Dark Pyramid or any other absent book. The rows after a cover name give pages in that book (Bestiary 1 and 12; Dark Pyramid 1, 3, 5, 6, 7 and 10; Quest Book II 13 through 89). The section and coverage notes say so, and the table rows keep the printed order that carries this grouping. Nothing is invented.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 11
          printed_page: 9
          heading: Index of Art
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.front_matter
      object_id: section.front_matter
      description: >-
        I rendered every page in scope and found the not_applicable dispositions true. PDF 1 is credits, copyright and the edition mark GF 2.0 over art. PDF 2 and 3 are the backer list. PDF 4 is the Thank you! page with five italic paragraphs, counting the introductory line. PDF 6 to 10 are the Contents headings with page numbers. PDF 11 is the art index, whose only table is extracted. No page prints a rule, term, example, procedure or catalogue entry. The page labels match pages.yaml: PDF 1 and 2 have no folio, PDF 3 is printed page 1 with the folio omitted (I saw none on the page), and PDF 4 to 11 show folios 2 to 9. The credits note and the Contents note stand on their own and are true of the pages.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 1
          printed_page: null
          heading: Designed and Written by
      disposition:
        status: no_change_needed
