  findings:
    - kind: transcription_error
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: character.equipment.sell_initial_value
      description: >-
        Re-review of review.appendix_iii_general_equipment_b.1. source_text now quotes PDF 186
        verbatim ("The initial value of an item is either the purchase value or the value indicated
        on the treasure card. ... All items sold should be sold via this table unless noted
        otherwise.") and the heading is "Sell and Repair Table", as printed.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: corrected
        change: >-
          character.equipment.sell_initial_value source_text and source heading match PDF 186.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: character.equipment.sell_price_0
      description: >-
        Re-review. character.equipment.sell_price_0 to _4 now take a lost_durability input and fire
        only when it equals 0 to 4; sell_price_5 fires when it is 5 or more, matching the printed
        "Lost points of durability" columns 0-4 and 5+/Repair. The fixtures supply
        lost_durability, with new negative (other_column) and 5+ (seven_lost) cases.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: corrected
        change: >-
          sell_price_0..5 select their column by lost_durability (eq 0..4, gte 5).
    - kind: missing_extraction
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: table.equipment.sell_and_repair
      description: >-
        Re-review. The table source_text now opens "Lost points of durability 0 1 2 3 4
        5+/Repair ... Purchase price", recording both printed axis headers. All 50 rows (10-500 c)
        and 300 value cells were checked again: the rendered page follows 7/10 .. 2/10 of the
        purchase price in every row, and every YAML cell matches that and its printed string. The
        four printed sentences beside the table are the footnotes or rule source_text.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: corrected
        change: >-
          table.equipment.sell_and_repair source_text records "Lost points of durability" and
          "Purchase price".
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      object_id: character.equipment.light_source.torch.spent
      description: >-
        Re-review. torch.spent now fires only on threat_roll lt threat_level and sets lit false
        and the bonuses to 0, without discarding. The >=90 sentence is a new rule,
        character.equipment.light_source.torch.swing_out, gated on swinging_torch eq true and
        unmodified_attack_roll gte 90, which sets lit false and discarded true. Fixtures cover
        the torch swing, another weapon rolling 95 (no effect) and the Threat Roll branch.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Torch
      disposition:
        status: corrected
        change: >-
          torch.spent limited to the Threat Roll; torch.swing_out models the >=90 torch swing.
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      object_id: character.equipment.light_source.lantern_filled_with_oil.troll_failure
      description: >-
        Re-review. The lantern and headlamp troll_failure and troll_success rules no longer add a
        lit condition (PDF 183 prints only "a hero carrying a lantern") and all four cite
        issue.equipment.lantern_troll_unlit, whose related list names them. The bat swarm rules
        keep lit eq true, as printed ("a lit lantern").
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Lantern
      disposition:
        status: corrected
        change: >-
          Troll rules drop the unprinted lit qualifier and cite issue.equipment.lantern_troll_unlit.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.parchment.scroll
      description: >-
        Re-review. parchment.scroll now applies only when making_magic_scroll is true;
        holy_water.projectile requires dipped_projectile and target_is_undead;
        holy_water.thrown requires thrown, target_is_undead and target_in_hit_square. New
        negative fixtures (parchment_other_use, holy_water_undipped, holy_water_not_thrown)
        cover each qualifier.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            table: Miscellaneous
            row: Holy Water
      disposition:
        status: corrected
        change: >-
          Printed qualifiers added to parchment.scroll, holy_water.projectile and
          holy_water.thrown.
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: table.equipment.miscellaneous
      description: >-
        Re-review. The tables are now named "Miscellaneous table" and "Light sources table" with
        locator.table "Miscellaneous" and "Light sources" on the tables, all 12 + 4 entities and
        their row rules; no "Miscellaneous Equipment" or "Light Sources" caption remains in
        corpus/ or review/ambiguities.yaml. All three uncaptioned table nodes carry the "The book
        prints no caption" note, matching PDF 183-185.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Light sources
      disposition:
        status: corrected
        change: >-
          Invented captions replaced by the printed headings on tables, sections, entities and rules.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.tools.table
      object_id: table.equipment.tools
      description: >-
        Re-review of the DUR "-" marker. schemas/table.schema.json now allows marker meaning
        not_applicable, and every DUR "-" cell in scope uses it: Backpack - Medium, Backpack -
        Large, Bed Roll, Parchment, Partial Map (Miscellaneous) and Armour Repair Kit, Cooking
        Gear, Fishing Gear, Pickaxe, Whetstone (Tools); the Light sources table prints no DUR "-".
        This is faithful to PDF 52 (printed 50), Durability: "Some items simply have: '– 'noted in
        the table. This indicates that durability is not applicable to that kind of gear." ENC "-"
        cells (backpacks, Combat Harness, Extended Battle Belt) keep no_increase, which fits an
        item with no encumbrance, and "-/X" ENC cells stay printed text. The marker is used
        only on DUR cells and only where the page prints "-".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 185
          printed_page: 183
          heading: Tools
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
      disposition:
        status: corrected
        change: >-
          DUR "-" cells typed as marker meaning not_applicable, per PDF 52.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.iron_wedges.bar
      description: >-
        Re-review, partly corrected. character.equipment.general.iron_wedges.bar now has see_also
        section.into_the_dungeons.rest for "See page 98 for rules on this." (printed 98 is the
        Rest page). But issue.phase6.iron_wedges_movement still lists only
        section.into_the_dungeons.wandering_monsters, section.appendix_iii_equipment.general_equipment,
        procedure.wandering_monster and combat.enemy.door.iron_wedges in related, so the
        conflict is still not related to any object of this unit and is absent from this unit's
        digest: an edit to the issue would not stale this review. Its PDF 184 source also gives
        heading "Iron Wedges", which is a table row; the printed heading is "Miscellaneous".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            table: Miscellaneous
            row: Iron Wedges
      disposition:
        status: open
        proposed_correction: >-
          issue.phase6.iron_wedges_movement: add character.equipment.general.iron_wedges.bar and
          equipment.general.iron_wedges to related, and change its PDF 184 source to heading
          "Miscellaneous" with locator table "Miscellaneous", row "Iron Wedges".
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.tools.table
      object_id: character.equipment.tool.fishing_gear.foraging
      description: >-
        Re-review. Changelog 2.21 entry 128 (rendered, PDF 21: "Not cumulative") is now applied:
        fishing_gear.foraging fires only when wild_game_traps_modifier_applied is false, cites the
        entry and keeps the printed source_text; issue.equipment.fishing_gear_trap_stacking is
        resolved citing it. The corrector also applied entry 114 (rendered, PDF 18: Fishing Pole,
        Loot card +10 vs tables +5, "Changed according to card"), so the rule adds +10 while the
        table cell keeps the printed "+5"; issue.equipment.fishing_gear_forage_value is resolved
        citing it. Both follow the Official rulings policy. Fixtures fishing_gear_forage and
        fishing_gear_with_traps cite both entries.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 185
          printed_page: 183
          heading: Tools
          locator:
            table: Tools
            row: Fishing Gear
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
            row: 128
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 18
          printed_page: null
          heading: '2.21'
          locator:
            row: 114
      disposition:
        status: corrected
        change: >-
          Entries 128 and 114 applied to fishing_gear.foraging with printed text kept; both
          issues resolved citing the entries.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.bandage_linen.healing
      description: >-
