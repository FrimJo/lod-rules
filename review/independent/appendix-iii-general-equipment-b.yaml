    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:d432db36e3a5eaad11b5a9c2404424e593a30e5f63a72f44da0ec15527a9a401
  findings:
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: issue.phase6.iron_wedges_movement
      description:
        Re-review of the open finding in review.appendix_iii_general_equipment_b.2. The issue's
        related list now names character.equipment.general.iron_wedges.bar and
        equipment.general.iron_wedges, so it is part of this unit's digest. Its PDF 184 source now
        gives heading "Miscellaneous" with locator table "Miscellaneous", row "Iron Wedges",
        matching the rendered page, where "Miscellaneous" is the heading and Iron Wedges is a table
        row. The summary still sets the Special cell ("will need 6 AP to pass the door") against the
        Wandering Monsters and Enemies and doors versions and does not choose one. Changelog 2.21
        entry 122 (rendered, PDF 20) quotes all three, is marked "Fixed" and answers only "See
        above", with no mechanic. The issue therefore correctly stays unresolved.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            table: Miscellaneous
            row: Iron Wedges
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 20
          printed_page: null
          heading: '2.21'
          locator:
            row: 122
      disposition:
        status: corrected
        change:
          issue.phase6.iron_wedges_movement relates the Iron Wedges rule and entity, and cites PDF 184
          under heading "Miscellaneous" with locator table "Miscellaneous", row "Iron Wedges".
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: test.equipment.batch_three.large_backpack
      description:
        Re-review of the open finding in review.appendix_iii_general_equipment_b.2. The fixture
        now cites both PDF 184 (Miscellaneous, row "Backpack - Large", printed "decreases DEX by
        -10") and vonbraus.changelog_2_2x PDF 26, heading "2.21", row 185. On the rendered PDF 26
        that entry reads "Page 182 Changed Large Backpack to -15 DEX to match Treasure Card.",
        marked "Fixed". The expected dex_modifier -15 and carrying_capacity +25 match
        character.equipment.general.backpack_large.capacity, which cites the same entry. The table
        cell and the rule's source_text keep the printed "-10".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            table: Miscellaneous
            row: Backpack - Large
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 26
          printed_page: null
          heading: '2.21'
          locator:
            row: 185
      disposition:
        status: corrected
        change: test.equipment.batch_three.large_backpack cites changelog 2.21 entry 185 alongside PDF 184.
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: issue.phase6.iron_wedges_movement
      description:
        Changelog 2.21 entry 119 (rendered, PDF 18) also concerns Iron Wedges. It says the Fine
        Treasure card ("wandering monster needs 3 turns to pass the door") differs from the book
        ("monster passes through on 4-6"), and it is marked "Fixed" with no stated mechanic. No
        object or issue cites it. It decides nothing and adds no version printed in this PDF, so the
        issue stays correctly unresolved. Citing it would only add corroborating evidence, which is
        optional.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 18
          printed_page: null
          heading: '2.21'
          locator:
            row: 119
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      description:
        'Full independent comparison against the rendered PDF 183-186. Every cell matches the
        page: the Light sources table (4 rows), Miscellaneous (12) and Tools (11), including names,
        ENC ("-/1", "1/3", "4/1", "-/10", "2/1", "5/1", "1/1"), DUR (with "-" typed not_applicable
        per PDF 52 Durability), Special, Cost and Avail. All 50 Sell and Repair rows (10-500 c) and
        their 300 cells follow the printed 7/10 down to 2/10 progression, and the axis headers "Lost
        points of durability" and "Purchase price" are recorded. The four printed sentences beside
        that table are footnotes or rule source_text. Lantern, Headlamp and Torch notes are quoted
        verbatim: +10 vs +5 Perception, one hand vs both hands, the troll RES test without a lit
        qualifier (issue.equipment.lantern_troll_unlit), bats only vs a lit lantern, >=90 torch
        swing-out separate from the Threat Roll spending, and a new torch not adjacent to an enemy.
        The 66 rules, 27 entities, 44 fixtures and 7 section and coverage rows (titles, pages,
        uncaptioned-table notes, component dispositions) agree with the pages. The applied rulings
        were checked on rendered changelog pages: entries 89 (PDF 15), 114 (PDF 18), 121 (PDF 19),
        128 (PDF 21) and 184-186 (PDF 26). Each keeps the printed text and cites page and entry. The
        FAQ snapshot rules on nothing in this unit. One inference is acceptable: the Combat Harness
        and Extended Battle Belt damage rules subtract 1 durability, which the cell does not
        quantify ("also damage the harness").'
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Light sources
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 185
          printed_page: 183
          heading: Tools
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: no_change_needed
  outcome: passed_with_corrections
  summary:
    Re-review of review.appendix_iii_general_equipment_b.2 after corrections. Rendered and read
    PDF 183-186 (printed 181-184) and PDF 52 (Durability), plus changelog 2.2x pages 15, 18, 19, 20,
