  findings:
    - kind: transcription_error
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: character.equipment.sell_initial_value
      description: >-
        source_text is an extractor paraphrase, not the printed wording: "Initial value is the
        purchase value or value on the treasure card; all sales use the Sell and Repair Table unless
        otherwise noted." PDF 186 prints "The initial value of an item is either the purchase value
        or the value indicated on the treasure card." and, in bold, "All items sold should be sold
        via this table unless noted otherwise." The source heading is also given in lower case
        ("sell and repair table"); the printed heading is "Sell and Repair Table".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.sell_initial_value: set source_text to "The initial value of an item
          is either the purchase value or the value indicated on the treasure card. ... All items
          sold should be sold via this table unless noted otherwise." and source heading to "Sell
          and Repair Table".
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: character.equipment.sell_price_0
      description: >-
        PDF 186 says to locate the initial value on the left "and then the Points of Damage it has
        received on the top row"; the column read depends on lost durability (0, 1, 2, 3, 4,
        5+/Repair). character.equipment.sell_price_0 to sell_price_5 each perform an unconditional
        lookup of one column, with no input for points of durability lost and no when, so nothing
        selects which of the six rules applies to an item; each fires for any item. The same gap
        applies to sell_price_1, _2, _3, _4 and _5.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.sell_price_0 .. sell_price_4: add a lost_durability input and when
          lost_durability eq 0 .. 4 respectively; character.equipment.sell_price_5: when
          lost_durability gte 5. Add lost_durability to the five sell_price_N.price_100 fixtures.
    - kind: missing_extraction
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: table.equipment.sell_and_repair
      description: >-
        The printed column-group header "Lost points of durability" spanning columns 0 to
        5+/Repair is not recorded anywhere in the table (column labels are only "0" .. "4" and
        "5+/Repair"). All 50 rows (10 to 500 c) and 300 value cells were checked on enlarged crops
        and are correct.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: open
        proposed_correction: >-
          table.equipment.sell_and_repair: record the spanning header, e.g. column labels "Lost
          points of durability 0" .. "Lost points of durability 5+/Repair", or include "Lost points
          of durability" in the table source_text.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      object_id: character.equipment.light_source.torch.spent
      description: >-
        "In the case of an unmodified result of >=90, the torch goes out and must be discarded."
        sits in the paragraph about swinging the torch at an enemy (CS +15), so it applies to the
        torch attack roll. The rule's when fires on unmodified_attack_roll gte 90 with no qualifier
        that the attack was made with the torch, so any attack roll of 90+ by the carrier (e.g.
        with a sword in the other hand) would extinguish and discard the torch. The rule also sets
        discarded true on the Threat Roll branch, where the book says only that the Torch "is
        spent".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Torch
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.light_source.torch.spent: make the >=90 branch an all of
          swinging_torch eq true and unmodified_attack_roll gte 90 (or split it into
          torch.swing_out with that when, keeping discarded true there); keep the Threat Roll
          branch setting lit false and the bonuses to 0. Update test.equipment.batch_three.torch_ninety
          to supply swinging_torch true.
    - kind: uncertainty_not_recorded
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      object_id: character.equipment.light_source.lantern_filled_with_oil.troll_failure
      description: >-
        "Trolls must pass a RES test to attack a hero carrying a lantern." The troll rules add
        lit eq true to their when, while the book draws a distinction two sentences later ("a hero
        carrying a lit lantern" for bat swarms). Whether an unlit lantern still forces the test is
        not stated. Recorded as issue.equipment.lantern_troll_unlit; the rules neither cite it nor
        mark the lit qualifier as an interpretation. Applies to lantern troll_failure and
        troll_success and to headlamp troll_failure and troll_success.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Lantern
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.light_source.lantern_filled_with_oil.troll_failure, .troll_success,
          character.equipment.light_source.headlamp.troll_failure, .troll_success: add
          issues [issue.equipment.lantern_troll_unlit] and drop the lit eq true condition (the
          printed condition is only "carrying a lantern"), leaving the unlit case to the issue.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.parchment.scroll
      description: >-
        Typed conditions drop printed qualifiers. Parchment "Necessary to make magic scrolls." is
        an unconditional require has_parchment, with no when for making a scroll, so it demands
        parchment in every context. Holy Water "Projectiles dipped add +1 DMG to all Undead":
        character.equipment.general.holy_water.projectile fires on target_is_undead alone, with no
        dipped-projectile condition. "If thrown, it causes 1d3 Hit Points to any undead":
        character.equipment.general.holy_water.thrown has no thrown condition.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.general.parchment.scroll: add when making_magic_scroll eq true.
          character.equipment.general.holy_water.projectile: add dipped_projectile eq true to when.
          character.equipment.general.holy_water.thrown: add thrown eq true to when. Update the
          holy_water fixture inputs accordingly.
    - kind: source_reference_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: table.equipment.miscellaneous
      description: >-
        The book prints no caption for this table; the heading on PDF 184 is "Miscellaneous". The
        table name "Miscellaneous Equipment table", the section title "Miscellaneous Equipment
        table" and every locator.table "Miscellaneous Equipment" (table, 12 entities, row rules)
        invent a caption. issue.equipment.bandage_uses already cites locator.table
        "Miscellaneous". Similarly the Light sources table is named "Light Sources table" with
        locator.table "Light Sources", while PDF 183 prints "Light sources".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 183
          printed_page: 181
          heading: Light sources
      disposition:
        status: open
        proposed_correction: >-
          table.equipment.miscellaneous: name "Miscellaneous table", locator.table "Miscellaneous"
          (also on the equipment.general.* entities and character.equipment.general.* row rules);
          section.appendix_iii_equipment.general_equipment.miscellaneous.table: title
          "Miscellaneous table" with the "The book prints no caption" note used by the sibling
          table nodes; table.equipment.light_sources: name "Light sources table" and locator.table
          "Light sources" on the table, its entities and rules; add the same caption note to
          section.appendix_iii_equipment.general_equipment.light_sources.table.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.tools.table
      object_id: table.equipment.tools
      description: >-
        Every "-" in the DUR column of the Light sources, Miscellaneous and Tools tables is typed
        as a marker with meaning no_increase. The reviewed Equipment chapter (PDF 52, Durability)
        defines it: "Some items simply have: '–' noted in the table. This indicates that durability
        is not applicable to that kind of gear." (character.durability.gear_marker). no_increase
        misstates that; the schema's marker meanings (no_increase, unavailable, not_specified)
        have no value for "not applicable". Affects DUR cells of Backpack - Medium, Backpack -
        Large, Bed Roll, Parchment, Partial Map, Armour Repair Kit, Cooking Gear, Fishing Gear,
        Pickaxe and Whetstone. ENC "-" (no encumbrance) as no_increase is acceptable.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 185
          printed_page: 183
          heading: Tools
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 52
          printed_page: 50
          heading: Durability
      disposition:
        status: open
        proposed_correction: >-
          Add a marker meaning not_applicable to schemas/table.schema.json and use it for the DUR
          "-" cells of table.equipment.miscellaneous and table.equipment.tools (and the other
          appendix III tables), or failing that bind the DUR column to
          character.durability.gear_marker in a table footnote/rule_refs so the printed meaning is
          reachable from the cells.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.iron_wedges.bar
      description: >-
        The Iron Wedges cell ends "They can also be used to bar a door during rest. See page 98 for
        rules on this." Printed page 98 is PDF 100 (Rest), where procedure.rest models the barred
        door. The rule has no see_also or unresolved_references for the pointer and does not
        represent the rest use. The rule cites issue.phase6.iron_wedges_movement, but that
        issue's related list does not include the rule or the entity (it lists only the parent
        section.appendix_iii_equipment.general_equipment), so the conflict is not linked from this
        unit's objects. Changelog 2.21 entry 122 (rendered) lists the three versions and answers
        only "See above", marked Fixed: correctly not applied.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            row: Iron Wedges
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 20
          printed_page: null
          heading: '2.21'
          locator:
            row: 122
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.general.iron_wedges.bar: add see_also [section.into_the_dungeons.rest]
          (or procedure.rest). issue.phase6.iron_wedges_movement: add
          character.equipment.general.iron_wedges.bar and equipment.general.iron_wedges to related.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.tools.table
      object_id: character.equipment.tool.fishing_gear.foraging
      description: >-
        Changelog 2.21 entry 128 (rendered, PDF 21) asks "Are Wild Game Traps FOR 10+ cumulative
        with Fishing Gear FOR 5+ making FOR 15+." and answers "Not cumulative", marked Fixed. That
        is a stated ruling on a question this PDF leaves undefined, and the extraction guide's
        Official rulings policy says executable effects follow it and a ruling that settles the
        whole issue resolves it. issue.equipment.fishing_gear_trap_stacking instead keeps it
        "recorded, not applied" because the PDF prints no limit, which is the reason it was
        undefined in the first place.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 185
          printed_page: 183
          heading: Tools
          locator:
            row: Fishing Gear
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 21
          printed_page: null
          heading: '2.21'
          locator:
            row: 128
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.tool.fishing_gear.foraging: cite changelog 2.21 entry 128 and type the
          non-stacking with the Wild game traps +10 (e.g. apply the +5 only when the Wild game traps
          modifier is not applied to the same Foraging roll); resolve
          issue.equipment.fishing_gear_trap_stacking with a resolution citing entry 128; keep the
          printed source_text.
    - kind: modelling_error
      section_id: section.appendix_iii_equipment.general_equipment.miscellaneous.table
      object_id: character.equipment.general.bandage_linen.healing
      description: >-
        Changelog 2.21 entry 89 (rendered, PDF 15) asks whether linen and herbal-wrap bandages are
        also 3 uses and answers "Added 3 bandages to all types.", marked Fixed. Like the applied
        entry 140 (added wording), this states the rule, so under the Official rulings policy it
        settles issue.equipment.bandage_uses, which instead keeps it "recorded, not applied".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 184
          printed_page: 182
          heading: Miscellaneous
          locator:
            row: Bandage (linen)
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 15
          printed_page: null
          heading: '2.21'
          locator:
            row: 89
      disposition:
        status: open
        proposed_correction: >-
          character.equipment.general.bandage_linen.healing and
          character.equipment.general.bandage_herbal_wrap.healing: add bundle_uses 3 citing
          changelog 2.21 entry 89, keeping printed source_text; resolve issue.equipment.bandage_uses
          with a resolution citing entry 89.
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.tools.table
      object_id: character.equipment.tool.pickaxe.rubble
      description: >-
        Changelog 2.21 entry 129 (rendered, PDF 22): "Added DUR to Pickaxe. Every time it is used,
        it loses 1 point of DUR." It gives no DUR value, so the per-use loss cannot be applied to a
        row that prints "-"; keeping issue.equipment.pickaxe_durability unresolved with the printed
        "-" is acceptable. Entry 121 (rendered, PDF 19) "Lock pick or trap disarm kit needed." is
        correctly applied: issue.traps.disarm_lockpick is resolved, procedure.trap_resolution
        gates disarming, and lockpicks_5.pick and trap_disarming_kit.disarm cite the entry with
        printed source_text kept.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 22
          printed_page: null
          heading: '2.21'
          locator:
            row: 129
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 19
          printed_page: null
          heading: '2.21'
          locator:
            row: 121
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.sell_and_repair_table
      object_id: table.equipment.sell_and_repair
      description: >-
        PDF 186 prints exactly one table. section.appendix_iii_equipment.general_equipment.sell_and_repair_table
        owns it; section.appendix_iii_equipment.general_equipment.table is a compatibility redirect
        (redirect_to, coverage mapped with all components not_applicable, as for the other 37
        redirects) and no canonical object cites it (only a test comment and acceptance fixture
        narrative). All 300 cells, row keys 10-500 and the four printed sentences (as footnotes)
        match the page.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 186
          printed_page: 184
          heading: Sell and Repair Table
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.appendix_iii_equipment.general_equipment.light_sources
      description: >-
        Every cell of the Light sources (4 rows), Miscellaneous (12 rows) and Tools (11 rows)
        tables was checked on enlarged crops: names, ENC, DUR, Special text verbatim, Cost and
        Avail. all match, and each row resolves to an entity linked by table_rows. Dice in Special
        cells (1d4, 1d8, 1d10, 1d3, 1d6) are typed with dice fields in the linked rules. The
        Headlamp, Lantern and Torch notes are quoted verbatim with their run-in headings. Not
        modelled and acceptable: "Some creatures like for instance Bears, Wolves and certain Trolls
        are afraid of fire ..." (no effect stated, Bestiary not present) and the opening sentence
