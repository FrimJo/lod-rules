  findings:
    - kind: modelling_error
      section_id: section.quest_book_i.the_dead_rising
      object_id: procedure.dead_rising_campaign
      description: >-
        PDF 224 prints "This campaign starts wherever the heroes are, but the second quest must be
        started in Silver City." The procedure's start_quest require and campaign_aftermath when
        compare current_settlement to the literal silver_city, while
        core.quest.dead_rising_campaign.start and .start_elsewhere (which the procedure lists as its
        campaign_start dependency) compare a field of the same name to the literal "Silver City". A
        caller passing one settlement value to both gets opposite answers: with "Silver City" the
        rule allows Quest 2 but the procedure's require fails; with silver_city the rule's
        start_elsewhere fires and forbids it.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 224
          printed_page: 222
          heading: The Dead Rising
          extraction: &img
            method: image
            confidence: high
            visually_verified: true
      disposition:
        status: open
        proposed_correction: >-
          Use one encoding of Silver City for current_settlement across the campaign: either change
          the compare literals in core.quest.dead_rising_campaign.start and .start_elsewhere to
          silver_city (and say so in their field descriptions), or change the procedure's
          start_quest require and campaign_aftermath when to "Silver City".
    - kind: source_reference_error
      section_id: section.quest_book_i.the_dead_rising
      object_id: procedure.dead_rising_campaign
      description: >-
        Steps choose_apostle and choose_master set next_destination to White 36 and White 39 but
        cite only PDF 233 (Quest 5 Aftermath), which prints neither location. White 36 is printed
        as "Quest Location: White 36." on PDF 234 (printed 232) and White 39 as "Quest Location:
        White 39." on PDF 235 (printed 233). The after_dead_rising step already cites the Quest 3
        Quest Location in the same way.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 234
          printed_page: 232
          heading: 'Quest 6A: Sacrifice'
          locator:
            paragraph: Quest Location
          extraction: *img
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 235
          printed_page: 233
          heading: 'Quest 6B: The Master'
          locator:
            paragraph: Quest Location
          extraction: *img
      disposition:
        status: open
        proposed_correction: >-
          Add to choose_apostle a source for PDF 234 (printed 232), heading 'Quest 6A: Sacrifice',
          locator paragraph Quest Location, and append "Quest Location: White 36." to its
          source_text; add to choose_master a source for PDF 235 (printed 233), heading 'Quest 6B:
          The Master', locator paragraph Quest Location, and append "Quest Location: White 39."
