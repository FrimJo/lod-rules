  findings:
    - kind: ok_with_note
      section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
      object_id: core.quest.dead_rising.ulfric
      description: >-
        Re-check of the Ulfric change. PDF 228 (printed 226) prints the grid 45 / - / 1 / 1 / 30 /
        -10 / 35 / 4 / 12 and "Ulfric is armed with a Warhammer and has Armour 2, meaning that his
        'To Hit' in practice is -5. He has the Frenzy and Cause Fear 3 special rules." and "XP: 140,
        T2 Treasure Table". Changelog 2.2x PDF 16, entry 102 (Fixed) reads "Ulfric has a base 'To
        Hit' value of -10, he is equipped with a Warhammer which is both BFO and Slow (+5 on the 'To
        Hit' value for each), the adjusted 'To Hit' value should be 0 and not -5." The rule keeps
        the printed sentence verbatim in source_text, keeps to_hit_printed -10, sets
        to_hit_in_practice 0, cites both the rulebook page and changelog PDF 16 row 102, and cites
        issue.quest.ulfric_to_hit_in_practice, whose resolution quotes entry 102 verbatim. This
        follows the Official rulings policy; the ruling states the value, so it settles the issue.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 228
          printed_page: 226
          heading: Ulfric the Warrior Priest
          extraction: &img
            method: image
            confidence: high
            visually_verified: true
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 16
          printed_page: null
          heading: '2.21'
          locator:
            row: 102
          extraction: *img
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.the_dead_rising.quest_2_the_dead_rising
      description: >-
        Coverage row now sets examples extracted. The only worked figure on PDF 227-228 is the
        inline "his 'To Hit' in practice is -5"; tests/fixtures/example-inventory.json holds it as
        example.quest_book_i.ulfric_to_hit_in_practice (section quest_2_the_dead_rising, PDF 228,
        printed 226, anchor verbatim, inline_prose, source_conflicted, issue
        issue.quest.ulfric_to_hit_in_practice, no case asserts -5). The row notes match. No
        Example-labelled text, caption or other worked arithmetic appears anywhere on PDF 224-236
        (Emil's "counts as a Greataxe in all aspects" and the Vanquisher's +2 against Undead are
        rules, not worked results), and no dead_rising section remains in unswept_sections, so the
        other rows' examples not_applicable stand.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 228
          printed_page: 226
          heading: Ulfric the Warrior Priest
          extraction: *img
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.quest_book_i.the_dead_rising.table
      object_id: table.quest.spring_cleaning.brood_mother
      description: >-
        Changelog 2.2x PDF 16 (the page cited for Ulfric), entry 100, reads "Brood Mother Page 203)
        RES=25, no Loot (Card: RES=40, Loot=Part)", marked Fixed with the comment "Changed according
        to card". This printing (PDF 225, printed 223) still prints RES 25 and only "XP: 115", no
        Treasure Table. No corpus object or issue cites entry 100: the table keeps RES 25 with no
        reference to the ruling, and the Brood Mother issues cover only disease and
        living-or-Undead. The entry states card values, so under the Official rulings policy it may
        change RES to 40 and add loot, but "Loot=Part" names no table this printing defines, and the
        card is not present. The conflict is unrecorded.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 225
          printed_page: 223
          heading: The Brood Mother
          extraction: *img
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 16
          printed_page: null
          heading: '2.21'
          locator:
            row: 100
          extraction: *img
      disposition:
        status: open
        proposed_correction: >-
          Add an issue (proposed id issue.quest.brood_mother_card_res_loot, type conflicting)
          quoting PDF 225 RES 25 / "XP: 115" and changelog 2.21 entry 100 (PDF 16, row 100) "RES=25,
          no Loot (Card: RES=40, Loot=Part)" / "Changed according to card"; relate it to
          table.quest.spring_cleaning.brood_mother, quest_actor.dead_rising.brood_mother and
          core.quest.spring_cleaning.brood_mother, and cite it from those objects. Decide per the
          Official rulings policy whether entry 100 settles RES (apply 40 to a value field with the
          printed 25 kept, citing row 100) and leave the loot unresolved, since "Part" is not
          defined in this printing.
    - kind: ok_with_note
      section_id: section.quest_book_i.the_dead_rising.quest_3_highwaymen
      object_id: core.quest.highwaymen.setup
      description: >-
        Changelog PDF 16 entry 101 ("Quest 3 of the Dead Rising Campaign lists an objective room
        tile that does not exist. Perhaps this should be the Throne Room tile?", Fixed) is the same
        report as entries 103 and 194, which issue.quest.highwaymen_objective_room_name already
        cites. PDF 229 still prints "Objective room: The Dwarven hall."; the rule keeps it and
        applies The Throne room. Citing row 101 as well would be complete but changes nothing.
      source:
        - document: vonbraus.changelog_2_2x
          file: source/vonbraus-changelog-2.2x.pdf
          pdf_page: 16
          printed_page: null
          heading: '2.21'
          locator:
            row: 101
          extraction: *img
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 229
          printed_page: 227
          heading: 'Quest 3: Highwaymen'
          locator:
            paragraph: Objective room
          extraction: *img
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.quest_book_i.the_dead_rising
      description: >-
        All other examined objects are digest-identical to review.the_dead_rising.2. Re-read on the
        rendered pages: quest headers (locations, Threat triggers, tiles, rewards, encounters,
        objective rooms), the Threat tables 2/2/18, 4/4/18, 3/3/18, N/A, 4/4/18, 6/6/18, 6/6/18, the
        1d100 encounter table and Johann note, the plunder ledger, and the Brood Mother, Emil,
        Imgrahil and Master grids, all still as the carried-forward records state. Quest-local
        mechanics stay scenario_rule; nothing is invented from not-present books.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 224
          printed_page: 222
          heading: The Dead Rising
          extraction: *img
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 236
          printed_page: 234
          heading: Campaign aftermath
          extraction: *img
      disposition:
        status: no_change_needed
  outcome: failed
  summary: >-
    Re-review of The Dead Rising after the Ulfric change. Rendered and read PDF 224-236 (printed
    222-234) and changelog PDF 16. The Ulfric rule correctly follows changelog 2.21 entry 102
    (to_hit_in_practice 0, printed -5 and -10 kept, resolved issue cites the entry), and the Quest 2
    coverage row's examples extracted matches the inventory entry; no other example in scope is
    missing from the inventory. One open finding: changelog entry 100 on the same page reports the
    Brood Mother's card values (RES 40, Loot Part) against the printed RES 25 and no loot, and
    nothing in the corpus records it.
