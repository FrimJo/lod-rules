  digest:
    algorithm: lod-review-digest/v1
    source_sha256: sha256:c7a9ff414443d002ad59164f237b5a214feacea7928f22e8d1b1f1abde8b8776
    content_digest: sha256:14b710245424fab957fe95bc4b1afb989a2e14fd873368cb623c8762475630e6
  findings:
    - kind: source_reference_error
      section_id: section.psychology.sanity.conditions
      object_id: character.sanity.boundary_uncertain
      description: >-
        source_text joins two printed sentences: "Once you have 0 points, you will develop a mental
        health problem." and "Once a hero has a condition, the Sanity Level will go back up to 8
        minus the number of current conditions." Both are verbatim on PDF 55, but the first is
        printed in the left column under the heading Sanity (end of the second paragraph), not under
        Conditions. The single source entry gives heading Conditions, so the provenance of half the
        quotation is wrong. procedure.sanity_loss step below_zero_unknown cites both headings for
        the same pair of sentences and shows the intended form.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Conditions
      disposition:
        status: open
        proposed_correction: >-
          character.sanity.boundary_uncertain: add a second source entry for PDF 55 / printed 53
          with heading "Sanity" (method text, visually_verified true) so each quoted sentence has
          its printed heading, or trim source_text to the Conditions sentence.
    - kind: ok_with_note
      section_id: section.psychology.sanity
      object_id: character.sanity.loss.miscast
      description: >-
        The printed row "Miscasting a spell | -1d3" is quoted verbatim while the effect invokes
        core.magic.miscast. I rendered changelog 2.2x page 23: entry 146 reads "Page 53 Changed -1d3
        Sanity into See Miscast table." and is marked Fixed. The FAQ snapshot answers the cited
        question with "The table." PDF 65 (printed 63) heading Miscast says the caster "must roll on
        the table below", whose rows 4 and 8 carry their own Sanity losses. The ruling, the extra
        source entries and issue.sanity.miscast_loss (resolved) all agree with what the pages show.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 65
          printed_page: 63
          heading: Miscast
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.sanity
      object_id: character.sanity.initial
      description: >-
        character.sanity.initial quotes "This is referred to as Sanity, and all heroes start with 8
        Points of Sanity." verbatim. The ten loss rules quote the ten Situation cells verbatim and
        carry the printed Effects: Terror -2, trap -2, head wound -1, Fear -1, each battle with a
        demon -1, 0 Hit Points -1, disease -1, poisoned -1, miscast -1d3 (ruling above), room events
        "See Exploration Card" as an invoke with the wording kept in unresolved_references. All
        rules are optional_system sanity, which PDF 21 (Complexity) supports. The rules cite heading
        Sanity without a table-row locator; the procedure steps carry the row locators, so the table
        geometry is traceable.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 21
          printed_page: 19
          heading: Complexity
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.sanity.conditions
      object_id: character.sanity.acquire_condition
      description: >-
        draw_condition, duplicate_condition and acquire_condition quote the three Conditions
        sentences verbatim and encode them as printed: draw at exactly 0 on the PDF 57 table
        (printed page 55, which is what "Roll on the table on page 55" names), reroll an already
        diagnosed condition, then Sanity and its maximum become 8 minus the number of current
        conditions. The fixture test.character.sanity.acquire_condition.second_condition reproduces
        the printed example (two conditions, maximum 6). draw_condition.roll_1 to roll_10 match the
        ten PDF 57 rows, with the printed "0" row (Depression) keyed as 10. boundary_uncertain and
        the procedures route below-zero, seven-plus conditions and exhausted draws to
        issue.phase4.sanity_boundaries rather than inventing a clamp, which matches the book
        defining only "reach 0".
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Conditions
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 57
          printed_page: 55
          heading: Psychology
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.sanity.reducing_insanity
      object_id: character.sanity.recovery
      description: >-
        recovery, recovery_uncertain, indulgence and indulgence_cap_uncertain quote the two printed
        sentences verbatim ("Resting between quests increases the Sanity Level by 1d3, up to a
        maximum of 8." and "This will cost the hero 1d3*100 coins but will improve Sanity by 1d6.").
        recovery is min(8, sanity + 1d3) with no active conditions; the active-condition cap goes to
        issue.phase4.sanity_maximum; indulgence charges cost_die x 100 and adds the 1d6 only while
        the result stays within 8, with overflow routed to the same issue. The fixtures (7 + 3 caps
        at 8; 500 coins and Sanity 2 become 300 and 6) are correct arithmetic.
        indulgence_cap_uncertain alone is marked visually_verified false; the sentence is verified
        on the page by its siblings, so this is honest metadata rather than an error.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Reducing Insanity, or Increasing Sanity
      disposition:
        status: no_change_needed
    - kind: ok_with_note
      section_id: section.psychology.sanity.reducing_insanity
      object_id: character.sanity.recovery_routes
      description: >-
        The quotation is verbatim, including the misprint "the priests the at the asylum", with an
        ellipsis marking the skipped indulgence sentences. The dependency tavern_rest binds "Resting
        in the relative safety of a tavern" to character.sanity.recovery (between quests), although
        PDF 147 Tending to those Memories gives a separate inn-night 1d3
        (character.sanity.inn_recovery). Either binding is defensible and the overlap is already
        issue.sanity.recovery_scope. asylum_pointer quotes The Asylum verbatim and binds "See the
        Settlements chapter" to section.settlements.treat_mental_conditions and
        character.settlement.asylum, which is the Treat Mental Conditions heading on PDF 147. Herbs,
        potions, prayers, spells and Talents stay as unresolved references, which is right because
        the page names no chapter for them.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Reducing Insanity, or Increasing Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: The Asylum
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Tending to those Memories
      disposition:
        status: no_change_needed
    - kind: uncertainty_not_recorded
      section_id: section.psychology.sanity.reducing_insanity
      object_id: character.sanity.recovery_routes
      description: >-
        The book prints "the priests the at the asylum" (doubled article) and then calls the same
        people "the monks at the asylum" in the run-in heading The Asylum and again on PDF 147. The
        corpus preserved the misprint verbatim but no issue recorded the typo or the priests/monks
        wording.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Reducing Insanity, or Increasing Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: The Asylum
      disposition:
        status: recorded_as_issue
        issue_id: issue.psychology.asylum_priests_or_monks
    - kind: uncertainty_not_recorded
      section_id: section.psychology.sanity.reducing_insanity
      object_id: character.sanity.indulgence
      description: >-
        PDF 55 grants the paid 1d6 Sanity ("consume copious amounts of alcohol") with no
        precondition, while PDF 147 presents the same purchase as "a further 1d6" after an inn
        night, "If that is not enough". Whether the indulgence requires the inn stay first is not
        settled by either page. character.sanity.indulgence and procedure.sanity_recovery treat it
        as a free-standing route; issue.sanity.recovery_scope covers repetition and the cap but not
        this ordering.
      source:
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 55
          printed_page: 53
          heading: Reducing Insanity, or Increasing Sanity
        - document: rulebook.second_printing.eng
          file: source/Rulebook-2nd-printing-ENGa.pdf
          pdf_page: 147
          printed_page: 145
          heading: Tending to those Memories
      disposition:
        status: recorded_as_issue
        issue_id: issue.psychology.indulgence_inn_precondition
    - kind: ok_with_note
